<span id="S5.SS1.p5.pic1.1" class="ltx_inline-block ltx_minipage ltx_align_bottom" style="width:35.25em;">
<span id="S5.SS1.p5.pic1.1.1" class="ltx_p"><span id="S5.SS1.p5.pic1.1.1.1" class="ltx_text ltx_font_bold" style="font-size:90%;--ltx-fg-color:#000000;">RQ1:<span id="S5.SS1.p5.pic1.1.1.1.1" class="ltx_text ltx_font_medium"> The <span id="S5.SS1.p5.pic1.1.1.1.1.1" class="ltx_text ltx_font_typewriter">RQGM</span> enriches search utilities: even with ground truth, a co-evolved evaluator provides a complementary objective. On <span id="S5.SS1.p5.pic1.1.1.1.1.2" class="ltx_text ltx_font_typewriter">DeepSWE</span> it finds a stronger coder than fixed-evaluator search or base models, while on reward design it improves generalization from walking to jumping.</span></span></span>
</span></span></span></foreignobject></g></g></svg>