<span id="A1.F7.pic1.1.1" class="ltx_p"><span id="A1.F7.pic1.1.1.1" class="ltx_text" style="--ltx-fg-color:#FFFFFF;">Prompt Template for Selecting Instructions</span></span>
</span></span></span></foreignobject></g><g fill-opacity="1.0" transform="matrix(1.0 0.0 0.0 1.0 17.72 13.3)"><foreignobject style="--ltx-fo-width:44.64em;--ltx-fo-height:35.49em;--ltx-fo-depth:0.25em;font-size:10pt;" height="494.6" overflow="visible" transform="matrix(1 0 0 -1 0 491.14)" width="617.69"><span class="ltx_foreignobject_container"><span class="ltx_foreignobject_content">
<span id="A1.F7.pic1.2" class="ltx_inline-block ltx_minipage ltx_align_bottom" style="width:44.64em;">
<span id="A1.F7.pic1.2.1" class="ltx_p"><span id="A1.F7.pic1.2.1.1" class="ltx_text" style="--ltx-fg-color:#000000;">I have an instruction below that I would like you to perform three steps of analysis about the instruction:

<br class="ltx_break">
<br class="ltx_break">&lt;instruction&gt;
<span id="A1.F7.pic1.2.1.1.1" class="ltx_text" style="--ltx-fg-color:#0000FF;">{instruction}</span>
&lt;/instruction&gt;

<br class="ltx_break">
<br class="ltx_break">Firstly, categorize the instruction above into one of the following categories:

<br class="ltx_break">
<br class="ltx_break">Coding
<br class="ltx_break">Mathematical reasoning
<br class="ltx_break">Asking for Advice
<br class="ltx_break">Brainstorming
<br class="ltx_break">Classification
<br class="ltx_break">Closed Question Answering
<br class="ltx_break">Creative Writing
<br class="ltx_break">Extraction
<br class="ltx_break">Inhabiting a Character/Persona
<br class="ltx_break">Open Question Answering
<br class="ltx_break">Rewriting
<br class="ltx_break">Summarization
<br class="ltx_break">Knowledge and Reasoning
<br class="ltx_break">Humanity, History or Social Studies
<br class="ltx_break">Other
<br class="ltx_break">
<br class="ltx_break">
<br class="ltx_break">Secondly, score the instruction in terms of complexity: how complex you think it is to answer from 1-10 (where 10 is a complex question whereby first reasoning or breaking down the question into multiple subquestions for example might help improve the answer).

<br class="ltx_break">
<br class="ltx_break">Thirdly, indicate how long you think the response to the instruction should be, either (a) 1 sentence, (b) 1-3 sentences, (c) 1 paragraph, (d) 2 paragraphs, or (e) 3 or more paragraphs.

<br class="ltx_break">
<br class="ltx_break">Provide your final response in the following format:
<br class="ltx_break">Category: &lt;one of the categories above&gt;
<br class="ltx_break">Complexity: &lt;score out of 10&gt;
<br class="ltx_break">Length: &lt;choose from (a) to (e)&gt;. DO NOT provide the actual response.</span></span>
</span></span></span></foreignobject></g></g></svg>