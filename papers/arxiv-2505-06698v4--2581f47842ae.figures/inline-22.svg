<span id="A3.I2.i1.I1.i1.p1.1" class="ltx_p"><span id="A3.I2.i1.I1.i1.p1.1.1" class="ltx_text" style="--ltx-fg-color:#000000;">1 = Question 1 superior</span></span>
</span></span>
<span id="A3.I2.i1.I1.i2" class="ltx_item" style="list-style-type:none;"><span class="ltx_tag ltx_tag_item"><span id="A3.I2.i1.I1.i2.1" class="ltx_text ltx_font_bold">–</span></span> 
<span id="A3.I2.i1.I1.i2.p1" class="ltx_para">
<span id="A3.I2.i1.I1.i2.p1.1" class="ltx_p"><span id="A3.I2.i1.I1.i2.p1.1.1" class="ltx_text" style="--ltx-fg-color:#000000;">2 = Question 2 superior</span></span>
</span></span>
<span id="A3.I2.i1.I1.i3" class="ltx_item" style="list-style-type:none;"><span class="ltx_tag ltx_tag_item"><span id="A3.I2.i1.I1.i3.1" class="ltx_text ltx_font_bold">–</span></span> 
