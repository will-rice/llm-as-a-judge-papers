<svg id="A1.p2.pic1" class="ltx_picture" height="524.23" overflow="visible" version="1.1" viewbox="0 0 477.38 524.23" width="477.38"><g style="--ltx-stroke-color:#000000;--ltx-fill-color:#000000;" fill="#000000" stroke="#000000" stroke-width="0.4pt" transform="translate(0,524.23) matrix(1 0 0 -1 0 0)"><g style="--ltx-fill-color:#2E2E2E;" fill="#2E2E2E" fill-opacity="1.0"><path style="stroke:none" d="M 0 11.81 L 0 512.42 C 0 518.95 5.29 524.23 11.81 524.23 L 465.57 524.23 C 472.09 524.23 477.38 518.95 477.38 512.42 L 477.38 11.81 C 477.38 5.29 472.09 0 465.57 0 L 11.81 0 C 5.29 0 0 5.29 0 11.81 Z" /></g><g style="--ltx-fill-color:#F2F2F2;" fill="#F2F2F2" fill-opacity="1.0"><path style="stroke:none" d="M 1.97 11.81 L 1.97 500.12 L 475.41 500.12 L 475.41 11.81 C 475.41 6.38 471 1.97 465.57 1.97 L 11.81 1.97 C 6.38 1.97 1.97 6.38 1.97 11.81 Z" /></g><g fill-opacity="1.0" transform="matrix(1.0 0.0 0.0 1.0 21.65 508.72)"><foreignobject style="--ltx-fo-width:31.37em;--ltx-fo-height:0.69em;--ltx-fo-depth:0.19em;font-size:10pt;" height="12.3" overflow="visible" transform="matrix(1 0 0 -1 0 9.61)" width="434.07"><span class="ltx_foreignobject_container"><span class="ltx_foreignobject_content">
<span id="A1.p2.pic1.1" class="ltx_inline-block ltx_minipage ltx_align_bottom" style="width:31.37em;">
<span id="A1.p2.pic1.1.1" class="ltx_p"><span id="A1.p2.pic1.1.1.1" class="ltx_text" style="--ltx-fg-color:#FFFFFF;">Prompts Used for Summeval for Coherence Evaluation</span></span>
</span></span></span></foreignobject></g><g fill-opacity="1.0" transform="matrix(1.0 0.0 0.0 1.0 21.65 13.78)"><foreignobject style="--ltx-fo-width:31.37em;--ltx-fo-height:34.29em;--ltx-fo-depth:0em;font-size:10pt;" height="474.54" overflow="visible" transform="matrix(1 0 0 -1 0 474.54)" width="434.07"><span class="ltx_foreignobject_container"><span class="ltx_foreignobject_content">
<span id="A1.p2.pic1.2" class="ltx_inline-block ltx_minipage ltx_align_bottom" style="width:31.37em;">
<span id="A1.p2.pic1.2.1" class="ltx_p"><span id="A1.p2.pic1.2.1.1" class="ltx_text" style="--ltx-fg-color:#000000;">You will be given one summary written for a news article.
<br class="ltx_break"></span></span>
<span id="A1.p2.pic1.2.2" class="ltx_p"><span id="A1.p2.pic1.2.2.1" class="ltx_text" style="--ltx-fg-color:#000000;">Your task is to rate the summary on one metric.
<br class="ltx_break"></span></span>
<span id="A1.p2.pic1.2.3" class="ltx_p"><span id="A1.p2.pic1.2.3.1" class="ltx_text" style="--ltx-fg-color:#000000;">Please make sure you read and understand these instructions carefully. Please keep this document open while reviewing, and refer to it as needed.
<br class="ltx_break"></span></span>
<span id="A1.p2.pic1.2.4" class="ltx_p"><span id="A1.p2.pic1.2.4.1" class="ltx_text" style="--ltx-fg-color:#000000;">Evaluation Criteria:
<br class="ltx_break"></span></span>
<span id="A1.p2.pic1.2.5" class="ltx_p"><span id="A1.p2.pic1.2.5.1" class="ltx_text" style="--ltx-fg-color:#000000;">Coherence (1-5) - the collective quality of all sentences. We align this dimension with the DUC quality question of structure and coherence whereby &quot;the summary should be well-structured and well-organized. The summary should not just be a heap of related information, but should build from sentence to a coherent body of information about a topic.&quot;
<br class="ltx_break"></span></span>
<span id="A1.p2.pic1.2.6" class="ltx_p"><span id="A1.p2.pic1.2.6.1" class="ltx_text" style="--ltx-fg-color:#000000;">Evaluation Steps:
<br class="ltx_break"></span></span>
<span id="A1.p2.pic1.2.7" class="ltx_p"><span id="A1.p2.pic1.2.7.1" class="ltx_text" style="--ltx-fg-color:#000000;">1. Read the news article carefully and identify the main topic and key points.
<br class="ltx_break">2. Read the summary and compare it to the news article. Check if the summary covers the main topic and key points of the news article, and if it presents them in a clear and logical order.
<br class="ltx_break">3. Assign a score for coherence on a scale of 1 to 5, where 1 is the lowest and 5 is the highest based on the Evaluation Criteria.
<br class="ltx_break"></span></span>
<span id="A1.p2.pic1.2.8" class="ltx_p"><span id="A1.p2.pic1.2.8.1" class="ltx_text" style="--ltx-fg-color:#000000;">Example:
<br class="ltx_break"></span></span>
<span id="A1.p2.pic1.2.9" class="ltx_p"><span id="A1.p2.pic1.2.9.1" class="ltx_text" style="--ltx-fg-color:#000000;">Source Text:
<br class="ltx_break"></span></span>
<span id="A1.p2.pic1.2.10" class="ltx_p"><span id="A1.p2.pic1.2.10.1" class="ltx_text" style="--ltx-fg-color:#000000;">{Document}
<br class="ltx_break"></span></span>
<span id="A1.p2.pic1.2.11" class="ltx_p"><span id="A1.p2.pic1.2.11.1" class="ltx_text" style="--ltx-fg-color:#000000;">Summary:
<br class="ltx_break"></span></span>
<span id="A1.p2.pic1.2.12" class="ltx_p"><span id="A1.p2.pic1.2.12.1" class="ltx_text" style="--ltx-fg-color:#000000;">{Summary}
<br class="ltx_break"></span></span>
<span id="A1.p2.pic1.2.13" class="ltx_p"><span id="A1.p2.pic1.2.13.1" class="ltx_text" style="--ltx-fg-color:#000000;">Evaluation Form(scores ONLY): Make a selection from &quot;1&quot;, &quot;2&quot;, &quot;3&quot;, &quot;4&quot;, &quot;5&quot;. Only write the answer with a single score, do not write reasons.
<br class="ltx_break"></span></span>
<span id="A1.p2.pic1.2.14" class="ltx_p"><span id="A1.p2.pic1.2.14.1" class="ltx_text" style="--ltx-fg-color:#000000;">- Coherence:</span></span>
</span></span></span></foreignobject></g></g></svg>