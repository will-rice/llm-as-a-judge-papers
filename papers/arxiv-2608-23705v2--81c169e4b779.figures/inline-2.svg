<span id="S4.p2.pic1.1" class="ltx_inline-block ltx_minipage ltx_align_bottom" style="width:31.37em;">
<span id="S4.p2.pic1.1.1" class="ltx_p"><span id="S4.p2.pic1.1.1.1" class="ltx_text" style="--ltx-fg-color:#FFFFFF;">Full Interaction Template for LLM-as-a-Judge Evaluation</span></span>
</span></span></span></foreignobject></g><g fill-opacity="1.0" transform="matrix(1.0 0.0 0.0 1.0 21.65 13.78)"><foreignobject style="--ltx-fo-width:31.37em;--ltx-fo-height:73.75em;--ltx-fo-depth:0em;font-size:10pt;" height="1020.54" overflow="visible" transform="matrix(1 0 0 -1 0 1020.54)" width="434.07"><span class="ltx_foreignobject_container"><span class="ltx_foreignobject_content">
<span id="S4.p2.pic1.2" class="ltx_inline-block ltx_minipage ltx_align_bottom" style="width:31.37em;">
<span id="S4.p2.pic1.2.1" class="ltx_p"><span id="S4.p2.pic1.2.1.1" class="ltx_text ltx_font_typewriter" style="--ltx-fg-color:#000000;">system
<br class="ltx_break"><span id="S4.p2.pic1.2.1.1.1" class="ltx_text ltx_font_serif">You are an objective text evaluator. Your task is to assess a given text objectively according to a specific metric.
<br class="ltx_break">Your only output must be a single, syntactically correct JSON object.
<br class="ltx_break">Never include explanations, reasoning, or extra text outside the JSON.
<br class="ltx_break"></span>user
<br class="ltx_break"><span id="S4.p2.pic1.2.1.1.2" class="ltx_text ltx_font_serif">Given the following text, you need to evaluate it for the specified metric: {metric}.
<br class="ltx_break">
<br class="ltx_break"><code id="S4.p2.pic1.2.1.1.2.1" class="ltx_verbatim ltx_font_typewriter">#</code><code id="S4.p2.pic1.2.1.1.2.2" class="ltx_verbatim ltx_font_typewriter">#</code><code id="S4.p2.pic1.2.1.1.2.3" class="ltx_verbatim ltx_font_typewriter">#</code> Metric Definition
<br class="ltx_break">**{metric_name}**: {definition}
<br class="ltx_break">
<br class="ltx_break"><code id="S4.p2.pic1.2.1.1.2.4" class="ltx_verbatim ltx_font_typewriter">#</code><code id="S4.p2.pic1.2.1.1.2.5" class="ltx_verbatim ltx_font_typewriter">#</code><code id="S4.p2.pic1.2.1.1.2.6" class="ltx_verbatim ltx_font_typewriter">#</code> Task
<br class="ltx_break">Taking into account the definition above, produce:
<br class="ltx_break">- score: integer <math id="S4.p2.pic1.m1" class="ltx_Math" alttext="1-5" display="inline" intent=":literal"><semantics><mrow><mn style="--ltx-fg-color:#000000;" mathcolor="#000000">1</mn><mo style="--ltx-fg-color:#000000;" mathcolor="#000000">−</mo><mn style="--ltx-fg-color:#000000;" mathcolor="#000000">5</mn></mrow><annotation encoding="application/x-tex">1-5</annotation></semantics></math> (<math id="S4.p2.pic1.m2" class="ltx_Math" alttext="1" display="inline" intent=":literal"><semantics><mn style="--ltx-fg-color:#000000;" mathcolor="#000000">1</mn><annotation encoding="application/x-tex">1</annotation></semantics></math> = lowest, <math id="S4.p2.pic1.m3" class="ltx_Math" alttext="5" display="inline" intent=":literal"><semantics><mn style="--ltx-fg-color:#000000;" mathcolor="#000000">5</mn><annotation encoding="application/x-tex">5</annotation></semantics></math> = highest)
<br class="ltx_break">- justification: <math id="S4.p2.pic1.m4" class="ltx_Math" alttext="\leq 30" display="inline" intent=":literal"><semantics><mrow><mphantom></mphantom><mo style="--ltx-fg-color:#000000;" mathcolor="#000000">≤</mo><mn style="--ltx-fg-color:#000000;" mathcolor="#000000">30</mn></mrow><annotation encoding="application/x-tex">\leq 30</annotation></semantics></math> words explaining the rating
<br class="ltx_break">- excerpt: <math id="S4.p2.pic1.m5" class="ltx_Math" alttext="\leq 20" display="inline" intent=":literal"><semantics><mrow><mphantom></mphantom><mo style="--ltx-fg-color:#000000;" mathcolor="#000000">≤</mo><mn style="--ltx-fg-color:#000000;" mathcolor="#000000">20</mn></mrow><annotation encoding="application/x-tex">\leq 20</annotation></semantics></math> words from the text supporting the evaluation
<br class="ltx_break">
<br class="ltx_break"><code id="S4.p2.pic1.2.1.1.2.7" class="ltx_verbatim ltx_font_typewriter">#</code><code id="S4.p2.pic1.2.1.1.2.8" class="ltx_verbatim ltx_font_typewriter">#</code><code id="S4.p2.pic1.2.1.1.2.9" class="ltx_verbatim ltx_font_typewriter">#</code> Rules
<br class="ltx_break">Strict rules:
<br class="ltx_break">• Evaluate the aspect objectively based ONLY on the provided definition.
<br class="ltx_break">• Do NOT reveal chain-of-thought.
<br class="ltx_break">• If the text is ambiguous or too short to be judged, score 3 and note ”insufficient evidence”.
<br class="ltx_break">• Return **only valid JSON** with field: ”name of the metric”. The field must be an object with keys: score (int), justification (string), excerpt (string or null).
<br class="ltx_break">• Do NOT answer anything else other than the JSON.
<br class="ltx_break">• Do NOT include backticks, markdown, explanations, or anything outside the JSON.
<br class="ltx_break">• If unsure about JSON syntax, default to minimal valid JSON with null excerpt.
<br class="ltx_break">• Before answering, double check the brackets and the correctness of the JSON
<br class="ltx_break">• CRITICAL JSON RULE: All JSON keys and string values MUST be enclosed in double quotes (e.g., ”justification”: ”your text here”).
<br class="ltx_break">• CRITICAL TEXT RULE: Inside your justification or excerpt, do NOT use double quotes. If you need to quote a character, use single quotes (e.g., ”excerpt”: ”He said ’hello’”).
<br class="ltx_break">
<br class="ltx_break">Output structure:
<br class="ltx_break">{{
<br class="ltx_break">    ”{metric}”: {{
<br class="ltx_break">     ”score”: &lt;int&gt;,
<br class="ltx_break">     ”justification”: ”&lt;string&gt;”,
<br class="ltx_break">     ”excerpt”: ”&lt;string or null&gt;”
<br class="ltx_break">    }}
<br class="ltx_break">}}
<br class="ltx_break">
<br class="ltx_break">SCALE ANCHORS (use these as guidance):
<br class="ltx_break">• <math id="S4.p2.pic1.m6" class="ltx_Math" alttext="5" display="inline" intent=":literal"><semantics><mn style="--ltx-fg-color:#000000;" mathcolor="#000000">5</mn><annotation encoding="application/x-tex">5</annotation></semantics></math> = clear, strong, unambiguous evidence for the aspect.
<br class="ltx_break">• <math id="S4.p2.pic1.m7" class="ltx_Math" alttext="4" display="inline" intent=":literal"><semantics><mn style="--ltx-fg-color:#000000;" mathcolor="#000000">4</mn><annotation encoding="application/x-tex">4</annotation></semantics></math> = good evidence, minor weaknesses.
<br class="ltx_break">• <math id="S4.p2.pic1.m8" class="ltx_Math" alttext="3" display="inline" intent=":literal"><semantics><mn style="--ltx-fg-color:#000000;" mathcolor="#000000">3</mn><annotation encoding="application/x-tex">3</annotation></semantics></math> = ambiguous or mixed evidence; could go either way.
<br class="ltx_break">• <math id="S4.p2.pic1.m9" class="ltx_Math" alttext="2" display="inline" intent=":literal"><semantics><mn style="--ltx-fg-color:#000000;" mathcolor="#000000">2</mn><annotation encoding="application/x-tex">2</annotation></semantics></math> = weak evidence or some counter-evidence.
<br class="ltx_break">• <math id="S4.p2.pic1.m10" class="ltx_Math" alttext="1" display="inline" intent=":literal"><semantics><mn style="--ltx-fg-color:#000000;" mathcolor="#000000">1</mn><annotation encoding="application/x-tex">1</annotation></semantics></math> = no evidence or direct counter-evidence.
<br class="ltx_break">
<br class="ltx_break">INPUT:
<br class="ltx_break">Text to evaluate:
<br class="ltx_break">”{text}”
<br class="ltx_break">
<br class="ltx_break">OUTPUT:
<br class="ltx_break">- JSON object (as described).
<br class="ltx_break">- The JSON must start with ’_curly bracket_’ and end with exactly one ’_curly bracket_’.
<br class="ltx_break">- Ensure the correctness of the JSON. Double check that the brackets are correct.
<br class="ltx_break">
<br class="ltx_break">End.
<br class="ltx_break"></span>assistant<span id="S4.p2.pic1.2.1.1.3" class="ltx_text ltx_font_serif">
</span></span></span>
</span></span></span></foreignobject></g></g></g></svg>