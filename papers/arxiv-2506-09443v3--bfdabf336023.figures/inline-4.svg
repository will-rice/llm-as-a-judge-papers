cost. Re-tokenization achieves the lowest eASR (<math id="S5.SS1.SSS5.p2.pic1.m2" class="ltx_Math" alttext="16.79\%" display="inline" intent=":literal"><semantics><mrow><mn>16.79</mn><mo style="--ltx-fg-color:#000000;" mathcolor="#000000" mathsize="1.110em">%</mo></mrow><annotation encoding="application/x-tex">16.79\%</annotation></semantics></math>) but retains only
<math id="S5.SS1.SSS5.p2.pic1.m3" class="ltx_Math" alttext="29.67\%" display="inline" intent=":literal"><semantics><mrow><mn>29.67</mn><mo style="--ltx-fg-color:#000000;" mathcolor="#000000" mathsize="1.110em">%</mo></mrow><annotation encoding="application/x-tex">29.67\%</annotation></semantics></math> benign utility, whereas the naive LLM detector yields the lowest
observed BDR (<math id="S5.SS1.SSS5.p2.pic1.m4" class="ltx_Math" alttext="30.33\%" display="inline" intent=":literal"><semantics><mrow><mn>30.33</mn><mo style="--ltx-fg-color:#000000;" mathcolor="#000000" mathsize="1.110em">%</mo></mrow><annotation encoding="application/x-tex">30.33\%</annotation></semantics></math>) at the cost of one additional LLM call.</span></span>
