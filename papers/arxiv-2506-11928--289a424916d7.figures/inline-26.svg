<svg id="S15.SS0.SSS0.Px10.p3.pic1" class="ltx_picture" height="256.57" overflow="visible" version="1.1" viewbox="0 0 477.38 256.57" width="477.38"><g style="--ltx-stroke-color:#000000;--ltx-fill-color:#000000;" fill="#000000" stroke="#000000" stroke-width="0.4pt" transform="translate(0,256.57) matrix(1 0 0 -1 0 0)"><g style="--ltx-fill-color:#4285F4;" fill="#4285F4" fill-opacity="1.0"><path style="stroke:none" d="M 0 7.5 L 0 249.07 C 0 253.22 3.36 256.57 7.5 256.57 L 469.87 256.57 C 474.02 256.57 477.38 253.22 477.38 249.07 L 477.38 7.5 C 477.38 3.36 474.02 0 469.87 0 L 7.5 0 C 3.36 0 0 3.36 0 7.5 Z" /></g><g style="--ltx-fill-color:#F5F5F5;" fill="#F5F5F5" fill-opacity="1.0"><path style="stroke:none" d="M 1.97 7.5 L 1.97 218.2 L 475.41 218.2 L 475.41 7.5 C 475.41 4.45 472.93 1.97 469.87 1.97 L 7.5 1.97 C 4.45 1.97 1.97 4.45 1.97 7.5 Z" /></g><g fill-opacity="1.0" transform="matrix(1.0 0.0 0.0 1.0 20.48 225.63)"><foreignobject style="--ltx-fo-width:27.43em;--ltx-fo-height:1.89em;--ltx-fo-depth:0.19em;font-size:10pt;" height="28.9" overflow="visible" transform="matrix(1 0 0 -1 0 26.21)" width="379.55"><span class="ltx_foreignobject_container"><span class="ltx_foreignobject_content">
<span id="S15.SS0.SSS0.Px10.p3.pic1.1" class="ltx_inline-block ltx_minipage ltx_align_bottom" style="width:27.43em;">
<span id="S15.SS0.SSS0.Px10.p3.pic1.1.1" class="ltx_p"><span id="S15.SS0.SSS0.Px10.p3.pic1.1.1.1" class="ltx_text" style="position:relative; bottom:0.9pt;"></span><a href="https://codeforces.com/blog/entry/138342" title class="ltx_ref ltx_href ltx_font_bold" style="--ltx-fg-color:#FFFFFF;">Tutorial</a><span id="S15.SS0.SSS0.Px10.p3.pic1.1.1.2" class="ltx_text ltx_font_bold" style="--ltx-fg-color:#FFFFFF;"> — <a href="https://codeforces.com/problemset/submission/2060/301765080" title class="ltx_ref ltx_href">Human’s accepted submission</a> — <a href="https://gist.github.com/anonymous-llm-code/df7e92218bcc661a400a01888ad6d2ea" title class="ltx_ref ltx_href"><span class="ltx_text ltx_font_typewriter">Gemini 2.5 Pro</span>’s rejected submission</a></span></span>
</span></span></span></foreignobject></g><g fill-opacity="1.0" transform="matrix(1.0 0.0 0.0 1.0 20.48 15.3)"><foreignobject style="--ltx-fo-width:31.54em;--ltx-fo-height:13.89em;--ltx-fo-depth:0.19em;font-size:10pt;" height="194.95" overflow="visible" transform="matrix(1 0 0 -1 0 192.26)" width="436.42"><span class="ltx_foreignobject_container"><span class="ltx_foreignobject_content">
<span id="S15.SS0.SSS0.Px10.p3.pic1.2" class="ltx_inline-block ltx_minipage ltx_align_bottom" style="width:31.54em;">
<span id="S15.SS0.SSS0.Px10.p3.pic1.2.1" class="ltx_p"><span id="S15.SS0.SSS0.Px10.p3.pic1.2.1.1" class="ltx_text" style="--ltx-fg-color:#000000;">Let’s solve the problem for each operation. 
<br class="ltx_break">
<br class="ltx_break">First, consider the operation that removes an edge from <math id="S15.SS0.SSS0.Px10.p3.pic1.m1" class="ltx_Math" alttext="F" display="inline" intent=":literal"><semantics><mi style="--ltx-fg-color:#000000;" mathcolor="#000000">F</mi><annotation encoding="application/x-tex">F</annotation></semantics></math>. Divide <math id="S15.SS0.SSS0.Px10.p3.pic1.m2" class="ltx_Math" alttext="G" display="inline" intent=":literal"><semantics><mi style="--ltx-fg-color:#000000;" mathcolor="#000000">G</mi><annotation encoding="application/x-tex">G</annotation></semantics></math> into its connected components and assign each vertex a component index. Then, for each edge in <math id="S15.SS0.SSS0.Px10.p3.pic1.m3" class="ltx_Math" alttext="F" display="inline" intent=":literal"><semantics><mi style="--ltx-fg-color:#000000;" mathcolor="#000000">F</mi><annotation encoding="application/x-tex">F</annotation></semantics></math>, if it connects vertices with different component indices, remove it and increment the operation count. 
<br class="ltx_break">
<br class="ltx_break">This guarantees no path between <math id="S15.SS0.SSS0.Px10.p3.pic1.m4" class="ltx_Math" alttext="x" display="inline" intent=":literal"><semantics><mi style="--ltx-fg-color:#000000;" mathcolor="#000000">x</mi><annotation encoding="application/x-tex">x</annotation></semantics></math> and <math id="S15.SS0.SSS0.Px10.p3.pic1.m5" class="ltx_Math" alttext="y" display="inline" intent=":literal"><semantics><mi style="--ltx-fg-color:#000000;" mathcolor="#000000">y</mi><annotation encoding="application/x-tex">y</annotation></semantics></math> in <math id="S15.SS0.SSS0.Px10.p3.pic1.m6" class="ltx_Math" alttext="F" display="inline" intent=":literal"><semantics><mi style="--ltx-fg-color:#000000;" mathcolor="#000000">F</mi><annotation encoding="application/x-tex">F</annotation></semantics></math> if there is none in <math id="S15.SS0.SSS0.Px10.p3.pic1.m7" class="ltx_Math" alttext="G." display="inline" intent=":literal"><semantics><mrow><mi style="--ltx-fg-color:#000000;" mathcolor="#000000">G</mi><mo style="--ltx-fg-color:#000000;" lspace="0em" mathcolor="#000000">.</mo></mrow><annotation encoding="application/x-tex">G.</annotation></semantics></math> Next, to ensure a path exists between <math id="S15.SS0.SSS0.Px10.p3.pic1.m8" class="ltx_Math" alttext="x" display="inline" intent=":literal"><semantics><mi style="--ltx-fg-color:#000000;" mathcolor="#000000">x</mi><annotation encoding="application/x-tex">x</annotation></semantics></math> and <math id="S15.SS0.SSS0.Px10.p3.pic1.m9" class="ltx_Math" alttext="y" display="inline" intent=":literal"><semantics><mi style="--ltx-fg-color:#000000;" mathcolor="#000000">y</mi><annotation encoding="application/x-tex">y</annotation></semantics></math> in <math id="S15.SS0.SSS0.Px10.p3.pic1.m10" class="ltx_Math" alttext="F" display="inline" intent=":literal"><semantics><mi style="--ltx-fg-color:#000000;" mathcolor="#000000">F</mi><annotation encoding="application/x-tex">F</annotation></semantics></math> if there is one in <math id="S15.SS0.SSS0.Px10.p3.pic1.m11" class="ltx_Math" alttext="G" display="inline" intent=":literal"><semantics><mi style="--ltx-fg-color:#000000;" mathcolor="#000000">G</mi><annotation encoding="application/x-tex">G</annotation></semantics></math>, we divide <math id="S15.SS0.SSS0.Px10.p3.pic1.m12" class="ltx_Math" alttext="F" display="inline" intent=":literal"><semantics><mi style="--ltx-fg-color:#000000;" mathcolor="#000000">F</mi><annotation encoding="application/x-tex">F</annotation></semantics></math> into connected components. After removing excess edges, each component of <math id="S15.SS0.SSS0.Px10.p3.pic1.m13" class="ltx_Math" alttext="F" display="inline" intent=":literal"><semantics><mi style="--ltx-fg-color:#000000;" mathcolor="#000000">F</mi><annotation encoding="application/x-tex">F</annotation></semantics></math> only contains vertices of the same component index. The number of operations needed now is the difference between the number of connected components in <math id="S15.SS0.SSS0.Px10.p3.pic1.m14" class="ltx_Math" alttext="F" display="inline" intent=":literal"><semantics><mi style="--ltx-fg-color:#000000;" mathcolor="#000000">F</mi><annotation encoding="application/x-tex">F</annotation></semantics></math> and <math id="S15.SS0.SSS0.Px10.p3.pic1.m15" class="ltx_Math" alttext="G" display="inline" intent=":literal"><semantics><mi style="--ltx-fg-color:#000000;" mathcolor="#000000">G</mi><annotation encoding="application/x-tex">G</annotation></semantics></math>. 
<br class="ltx_break">
<br class="ltx_break">All operations can be efficiently performed using DFS or DSU.</span></span>
</span></span></span></foreignobject></g></g></svg>