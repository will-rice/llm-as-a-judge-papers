<svg id="A1.F9.pic1" class="ltx_picture ltx_centering" height="463.26" overflow="visible" version="1.1" viewbox="0 0 301.54 463.26" width="301.54"><g style="--ltx-stroke-color:#000000;--ltx-fill-color:#000000;" fill="#000000" stroke="#000000" stroke-width="0.4pt" transform="translate(0,463.26) matrix(1 0 0 -1 0 0) translate(150.77,0) translate(0,231.63)"><g style="--ltx-stroke-color:#BFBFBF;--ltx-fill-color:#F9F9F9;" fill="#F9F9F9" stroke="#BFBFBF"><path d="M 142.19 231.35 L -142.19 231.35 C -146.78 231.35 -150.49 227.64 -150.49 223.05 L -150.49 -223.05 C -150.49 -227.64 -146.78 -231.35 -142.19 -231.35 L 142.19 -231.35 C 146.78 -231.35 150.49 -227.64 150.49 -223.05 L 150.49 223.05 C 150.49 227.64 146.78 231.35 142.19 231.35 Z M -150.49 -231.35" /></g><g style="--ltx-stroke-color:#000000;--ltx-fill-color:#000000;" fill="#000000" stroke="#000000" transform="matrix(1.0 0.0 0.0 1.0 -143.58 -2.77)"><foreignobject style="--ltx-fo-width:24.11em;--ltx-fo-height:20.53em;--ltx-fo-depth:20.03em;font-size:8pt;" height="448.88" overflow="visible" transform="matrix(1 0 0 -1 0 227.21)" width="266.89"><span class="ltx_foreignobject_container"><span class="ltx_foreignobject_content">
<span id="A1.F9.pic1.1" class="ltx_inline-block ltx_minipage ltx_align_middle" style="width:24.11em;">
<span id="A1.F9.pic1.1.1" class="ltx_p ltx_align_center"><span id="A1.F9.pic1.1.1.1" class="ltx_text ltx_font_bold" style="font-size:80%;">Semantic Similarity
<br class="ltx_break" style="--ltx-break-space:-2.0pt;"></span><span id="A1.F9.pic1.1.1.2" class="ltx_text" style="font-size:80%;">
</span><span id="A1.F9.pic1.1.1.3" class="ltx_text ltx_font_bold" style="font-size:80%;">(Scale: 0–100)
<br class="ltx_break" style="--ltx-break-space:-2.0pt;"></span><span id="A1.F9.pic1.1.1.4" class="ltx_text" style="font-size:80%;">
</span><span class="ltx_rule" style="width:143.4pt;height:0.4pt;--ltx-bg-color:black;display:inline-block;"> </span></span>
<span id="A1.F9.pic1.1.2" class="ltx_p ltx_parbox ltx_align_center ltx_align_middle" style="width:194.6pt;"><span id="A1.F9.pic1.1.2.1" class="ltx_text ltx_font_italic" style="font-size:80%;">Please score the degree to which two text documents are semantically similar. Semantic similarity is based on the similarity of underlying semantic concepts and ideas, rather than surface-level lexical features, word choice, or syntax.</span></span>
<span id="A1.F9.pic1.1.3" class="ltx_p ltx_align_center">
<span id="A1.F9.pic1.1.3.1" class="ltx_inline-block ltx_parbox ltx_align_middle" style="width:194.6pt;--ltx-bg-color:#FFCCCC;">
<span id="A1.F9.pic1.1.3.1.1" class="ltx_p"><span id="A1.F9.pic1.1.3.1.1.1" class="ltx_text ltx_font_bold" style="font-size:80%;">0–25:</span><span id="A1.F9.pic1.1.3.1.1.2" class="ltx_text" style="font-size:80%;"> The documents have significantly different semantic meaning. The documents convey fundamentally different subject matter, topics, ideas, or context.</span></span>
</span></span>
<span id="A1.F9.pic1.1.4" class="ltx_p ltx_align_center">
<span id="A1.F9.pic1.1.4.1" class="ltx_inline-block ltx_parbox ltx_align_middle" style="width:194.6pt;--ltx-bg-color:#FFE6CC;">
<span id="A1.F9.pic1.1.4.1.1" class="ltx_p"><span id="A1.F9.pic1.1.4.1.1.1" class="ltx_text ltx_font_bold" style="font-size:80%;">26–50:</span><span id="A1.F9.pic1.1.4.1.1.2" class="ltx_text" style="font-size:80%;"> The documents share some overlap in semantic meaning, but semantic differences outweigh similarities. There are significant differences in the subject matter, topic, ideas, or context.</span></span>
</span></span>
<span id="A1.F9.pic1.1.5" class="ltx_p ltx_align_center">
<span id="A1.F9.pic1.1.5.1" class="ltx_inline-block ltx_parbox ltx_align_middle" style="width:194.6pt;--ltx-bg-color:#FFFFCC;">
<span id="A1.F9.pic1.1.5.1.1" class="ltx_p"><span id="A1.F9.pic1.1.5.1.1.1" class="ltx_text ltx_font_bold" style="font-size:80%;">51–75:</span><span id="A1.F9.pic1.1.5.1.1.2" class="ltx_text" style="font-size:80%;"> The documents share a substantial amount of semantic similarity. Semantic similarities outweigh differences, but there are still nontrivial ways in which the subject matter, topics, ideas or context differ.</span></span>
</span></span>
<span id="A1.F9.pic1.1.6" class="ltx_p ltx_align_center">
<span id="A1.F9.pic1.1.6.1" class="ltx_inline-block ltx_parbox ltx_align_middle" style="width:194.6pt;--ltx-bg-color:#CCFFCC;">
<span id="A1.F9.pic1.1.6.1.1" class="ltx_p"><span id="A1.F9.pic1.1.6.1.1.1" class="ltx_text ltx_font_bold" style="font-size:80%;">76–100:</span><span id="A1.F9.pic1.1.6.1.1.2" class="ltx_text" style="font-size:80%;"> The documents have nearly identical or identical semantic meaning. Both documents convey the same core idea and information and the same subject matter, topics, idea, and context.</span></span>
</span></span>
