<span id="A6.SSx3.SSS0.Px1.p2.pic1.2.4" class="ltx_p ltx_align_left"><span id="A6.SSx3.SSS0.Px1.p2.pic1.2.4.1" class="ltx_text ltx_font_typewriter" style="--ltx-fg-color:#000000;">assistant: assistant message.</span></span>
<span id="A6.SSx3.SSS0.Px1.p2.pic1.2.5" class="ltx_p ltx_align_left"><span id="A6.SSx3.SSS0.Px1.p2.pic1.2.5.1" class="ltx_text ltx_font_typewriter" style="--ltx-fg-color:#000000;">The conversation can go for many turns. Finally you are provided with a prediction</span></span>
<span id="A6.SSx3.SSS0.Px1.p2.pic1.2.6" class="ltx_p ltx_align_left"><span id="A6.SSx3.SSS0.Px1.p2.pic1.2.6.1" class="ltx_text ltx_font_typewriter" style="--ltx-fg-color:#000000;">of continuation of the conversation and a reference.</span></span>
