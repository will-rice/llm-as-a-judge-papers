<span id="A6.F6.pic1.1" class="ltx_inline-block ltx_minipage ltx_align_bottom" style="width:38.17em;">
<span id="A6.F6.pic1.1.1" class="ltx_p"><span id="A6.F6.pic1.1.1.1" class="ltx_text ltx_font_bold" style="--ltx-fg-color:#000000;">Evaluation Prompt for Topical-Chat</span></span>
</span></span></span></foreignobject></g><g fill-opacity="1.0" transform="matrix(1.0 0.0 0.0 1.0 22.83 18.04)"><foreignobject style="--ltx-fo-width:43.9em;--ltx-fo-height:36.62em;--ltx-fo-depth:0.22em;font-size:10pt;" height="509.78" overflow="visible" transform="matrix(1 0 0 -1 0 506.71)" width="607.45"><span class="ltx_foreignobject_container"><span class="ltx_foreignobject_content">
<span id="A6.F6.pic1.2" class="ltx_inline-block ltx_minipage ltx_align_bottom" style="width:43.9em;">
<span id="A6.F6.pic1.2.1" class="ltx_p"><span id="A6.F6.pic1.2.1.1" class="ltx_text ltx_font_bold" style="--ltx-fg-color:#000000;">&lt;Task Overview&gt;
<br class="ltx_break"><span id="A6.F6.pic1.2.1.1.1" class="ltx_text ltx_font_typewriter ltx_font_medium">You will be given a conversation between two individuals. You will then be given one potential response for the next turn in the conversation. The response concerns an interesting fact, which will be provided as well.
<br class="ltx_break">Your task is to read a provided conversation history, corresponding fact, and response, then answer ‘yes’ or ‘no’ to specific questions. These questions will relate to a particular dimension of the response.<span id="A6.F6.pic1.2.1.1.1.1" class="ltx_text ltx_font_serif">
</span></span></span></span>
<span id="A6.F6.pic1.2.2" class="ltx_p"><span id="A6.F6.pic1.2.2.1" class="ltx_text ltx_font_bold" style="--ltx-fg-color:#000000;">&lt;dimension Definition&gt;
<br class="ltx_break"><span id="A6.F6.pic1.2.2.1.1" class="ltx_text ltx_font_typewriter ltx_font_medium">&lt;dimension&gt;- &lt;definition&gt;<span id="A6.F6.pic1.2.2.1.1.1" class="ltx_text ltx_font_serif">
</span></span></span></span>
<span id="A6.F6.pic1.2.3" class="ltx_p"><span id="A6.F6.pic1.2.3.1" class="ltx_text ltx_font_bold" style="--ltx-fg-color:#000000;">&lt;Instructions&gt;<span id="A6.F6.pic1.2.3.1.1" class="ltx_text"></span></span></span>
<span id="A6.I2" class="ltx_enumerate">
<span id="A6.I2.i1" class="ltx_item" style="list-style-type:none;"><span class="ltx_tag ltx_tag_item">1.</span> 
<span id="A6.I2.i1.p1" class="ltx_para">
<span id="A6.I2.i1.p1.1" class="ltx_p"><span id="A6.I2.i1.p1.1.1" class="ltx_text ltx_font_typewriter" style="--ltx-fg-color:#000000;">Read these instructions thoroughly.</span></span>
</span></span>
<span id="A6.I2.i2" class="ltx_item" style="list-style-type:none;"><span class="ltx_tag ltx_tag_item">2.</span> 
<span id="A6.I2.i2.p1" class="ltx_para">
<span id="A6.I2.i2.p1.1" class="ltx_p"><span id="A6.I2.i2.p1.1.1" class="ltx_text ltx_font_typewriter" style="--ltx-fg-color:#000000;">Carefully read the Conversation History, the Corresponding Fact, and the Response.</span></span>
</span></span>
<span id="A6.I2.i3" class="ltx_item" style="list-style-type:none;"><span class="ltx_tag ltx_tag_item">3.</span> 
<span id="A6.I2.i3.p1" class="ltx_para">
<span id="A6.I2.i3.p1.1" class="ltx_p"><span id="A6.I2.i3.p1.1.1" class="ltx_text ltx_font_typewriter" style="--ltx-fg-color:#000000;">Understand the given questions and the definition of the &lt;dimension&gt;.</span></span>
</span></span>
<span id="A6.I2.i4" class="ltx_item" style="list-style-type:none;"><span class="ltx_tag ltx_tag_item">4.</span> 
<span id="A6.I2.i4.p1" class="ltx_para">
<span id="A6.I2.i4.p1.1" class="ltx_p"><span id="A6.I2.i4.p1.1.1" class="ltx_text ltx_font_typewriter" style="--ltx-fg-color:#000000;">Respond to each question with ‘yes’ or ‘no’. Base your answers on a clear rationale.</span></span>
</span></span>
<span id="A6.I2.i5" class="ltx_item" style="list-style-type:none;"><span class="ltx_tag ltx_tag_item">5.</span> 
<span id="A6.I2.i5.p1" class="ltx_para">
<span id="A6.I2.i5.p1.1" class="ltx_p"><span id="A6.I2.i5.p1.1.1" class="ltx_text ltx_font_typewriter" style="--ltx-fg-color:#000000;">Follow the specified format for your answers.</span></span>
</span></span>
</span>
<span id="A6.F6.pic1.2.4" class="ltx_p"><span id="A6.F6.pic1.2.4.1" class="ltx_text ltx_font_bold" style="--ltx-fg-color:#000000;">&lt;Answer Format&gt;
<br class="ltx_break"><span id="A6.F6.pic1.2.4.1.1" class="ltx_text ltx_font_typewriter ltx_font_medium">Q1: [Your Answer]
<br class="ltx_break">Q2: [Your Answer]
<br class="ltx_break">...<span id="A6.F6.pic1.2.4.1.1.1" class="ltx_text ltx_font_serif">
</span></span></span></span>
<span id="A6.F6.pic1.2.5" class="ltx_p"><span id="A6.F6.pic1.2.5.1" class="ltx_text ltx_font_bold" style="--ltx-fg-color:#000000;"># Conversation History #
<br class="ltx_break"><span id="A6.F6.pic1.2.5.1.1" class="ltx_text ltx_font_typewriter ltx_font_medium">&lt;document&gt;<span id="A6.F6.pic1.2.5.1.1.1" class="ltx_text ltx_font_serif">
</span></span></span></span>
<span id="A6.F6.pic1.2.6" class="ltx_p"><span id="A6.F6.pic1.2.6.1" class="ltx_text ltx_font_bold" style="--ltx-fg-color:#000000;"># Corresponding Fact #
<br class="ltx_break"><span id="A6.F6.pic1.2.6.1.1" class="ltx_text ltx_font_typewriter ltx_font_medium">&lt;fact&gt;<span id="A6.F6.pic1.2.6.1.1.1" class="ltx_text ltx_font_serif">
</span></span></span></span>
<span id="A6.F6.pic1.2.7" class="ltx_p"><span id="A6.F6.pic1.2.7.1" class="ltx_text ltx_font_bold" style="--ltx-fg-color:#000000;"># Response #
<br class="ltx_break"><span id="A6.F6.pic1.2.7.1.1" class="ltx_text ltx_font_typewriter ltx_font_medium">&lt;response&gt;<span id="A6.F6.pic1.2.7.1.1.1" class="ltx_text ltx_font_serif">
</span></span></span></span>
<span id="A6.F6.pic1.2.8" class="ltx_p"><span id="A6.F6.pic1.2.8.1" class="ltx_text ltx_font_bold" style="--ltx-fg-color:#000000;"># Questions #
<br class="ltx_break"><span id="A6.F6.pic1.2.8.1.1" class="ltx_text ltx_font_typewriter ltx_font_medium">&lt;questions&gt;<span id="A6.F6.pic1.2.8.1.1.1" class="ltx_text ltx_font_serif">
</span></span></span></span>
<span id="A6.F6.pic1.2.9" class="ltx_p"><span id="A6.F6.pic1.2.9.1" class="ltx_text ltx_font_bold" style="--ltx-fg-color:#000000;"># Your Answer #
<br class="ltx_break"><span id="A6.F6.pic1.2.9.1.1" class="ltx_text ltx_font_typewriter ltx_font_medium">Provide your answers to the given questions, following the specified Answer Format.<span id="A6.F6.pic1.2.9.1.1.1" class="ltx_text ltx_font_serif">
</span></span></span></span>
</span></span></span></foreignobject></g></g></svg>