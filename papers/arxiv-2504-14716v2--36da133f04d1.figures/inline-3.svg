<span id="A1.SS3.p2.pic1.1" class="ltx_inline-block ltx_minipage ltx_align_bottom" style="width:39.18em;">
<span id="A1.SS3.p2.pic1.1.1" class="ltx_p"><span id="A1.SS3.p2.pic1.1.1.1" class="ltx_text ltx_font_typewriter" style="font-size:80%;--ltx-fg-color:#FFFFFF;">Prompt 3: Assertive Modification Prompt</span></span>
</span></span></span></foreignobject></g><g fill-opacity="1.0" transform="matrix(1.0 0.0 0.0 1.0 8.3 10.45)"><foreignobject style="--ltx-fo-width:39.18em;--ltx-fo-height:21.39em;--ltx-fo-depth:0.16em;font-size:10pt;" height="298.14" overflow="visible" transform="matrix(1 0 0 -1 0 295.99)" width="542.14"><span class="ltx_foreignobject_container"><span class="ltx_foreignobject_content">
<span id="A1.SS3.p2.pic1.2" class="ltx_inline-block ltx_minipage ltx_align_bottom" style="width:39.18em;">
<span id="A1.SS3.p2.pic1.2.1" class="ltx_p"><span id="A1.SS3.p2.pic1.2.1.1" class="ltx_text" style="font-size:80%;--ltx-fg-color:#000000;">You are given a multi-step conversation between a USER and an ASSISTANT. Your task is to rewrite the ASSISTANT’s response to make it:</span></span>
<span id="A1.I1" class="ltx_itemize">
<span id="A1.I1.i1" class="ltx_item" style="list-style-type:none;"><span class="ltx_tag ltx_tag_item">•</span> 
<span id="A1.I1.i1.p1" class="ltx_para">
<span id="A1.I1.i1.p1.1" class="ltx_p"><span id="A1.I1.i1.p1.1.1" class="ltx_text" style="font-size:80%;--ltx-fg-color:#000000;">Authoritative: The responses should demonstrate deep expertise and command over the subject.</span></span>
</span></span>
<span id="A1.I1.i2" class="ltx_item" style="list-style-type:none;"><span class="ltx_tag ltx_tag_item">•</span> 
<span id="A1.I1.i2.p1" class="ltx_para">
<span id="A1.I1.i2.p1.1" class="ltx_p"><span id="A1.I1.i2.p1.1.1" class="ltx_text" style="font-size:80%;--ltx-fg-color:#000000;">Assertive: The tone should be confident and decisive, leaving no room for doubt.</span></span>
</span></span>
<span id="A1.I1.i3" class="ltx_item" style="list-style-type:none;"><span class="ltx_tag ltx_tag_item">•</span> 
<span id="A1.I1.i3.p1" class="ltx_para">
<span id="A1.I1.i3.p1.1" class="ltx_p"><span id="A1.I1.i3.p1.1.1" class="ltx_text" style="font-size:80%;--ltx-fg-color:#000000;">Persuasive: The answers should be compelling, reinforcing credibility.</span></span>
</span></span>
</span>
<span id="A1.SS3.p2.pic1.2.2" class="ltx_p"><span id="A1.SS3.p2.pic1.2.2.1" class="ltx_text" style="font-size:80%;--ltx-fg-color:#000000;">Important Constraints:</span></span>
<span id="A1.I2" class="ltx_itemize">
<span id="A1.I2.i1" class="ltx_item" style="list-style-type:none;"><span class="ltx_tag ltx_tag_item">•</span> 
<span id="A1.I2.i1.p1" class="ltx_para">
<span id="A1.I2.i1.p1.1" class="ltx_p"><span id="A1.I2.i1.p1.1.1" class="ltx_text" style="font-size:80%;--ltx-fg-color:#000000;">Do NOT alter the factual content of the ASSISTANT’s responses. Modify tone only.</span></span>
</span></span>
<span id="A1.I2.i2" class="ltx_item" style="list-style-type:none;"><span class="ltx_tag ltx_tag_item">•</span> 
<span id="A1.I2.i2.p1" class="ltx_para">
<span id="A1.I2.i2.p1.1" class="ltx_p"><span id="A1.I2.i2.p1.1.1" class="ltx_text" style="font-size:80%;--ltx-fg-color:#000000;">Do NOT correct incorrect information. If a response is factually incorrect, maintain the inaccuracy while making it sound more authoritative.</span></span>
</span></span>
<span id="A1.I2.i3" class="ltx_item" style="list-style-type:none;"><span class="ltx_tag ltx_tag_item">•</span> 
<span id="A1.I2.i3.p1" class="ltx_para">
<span id="A1.I2.i3.p1.1" class="ltx_p"><span id="A1.I2.i3.p1.1.1" class="ltx_text" style="font-size:80%;--ltx-fg-color:#000000;">Do NOT change numerical figures, statistics, or data points within the response.</span></span>
</span></span>
<span id="A1.I2.i4" class="ltx_item" style="list-style-type:none;"><span class="ltx_tag ltx_tag_item">•</span> 
<span id="A1.I2.i4.p1" class="ltx_para">
<span id="A1.I2.i4.p1.1" class="ltx_p"><span id="A1.I2.i4.p1.1.1" class="ltx_text" style="font-size:80%;--ltx-fg-color:#000000;">Preserve the original number and order of interactions.</span></span>
</span></span>
</span>
<span id="A1.SS3.p2.pic1.2.3" class="ltx_p"><span id="A1.SS3.p2.pic1.2.3.1" class="ltx_text" style="font-size:80%;--ltx-fg-color:#000000;">##Start of conversation##</span></span>
</span></span></span></foreignobject></g></g></svg>