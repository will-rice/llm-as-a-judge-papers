<svg id="S4.SS1.p4.pic1" class="ltx_picture" height="127.89" overflow="visible" version="1.1" viewbox="0 0 675 127.89" width="675"><g style="--ltx-stroke-color:#000000;--ltx-fill-color:#000000;" fill="#000000" stroke="#000000" stroke-width="0.4pt" transform="translate(0,127.89) matrix(1 0 0 -1 0 0)"><g style="--ltx-fill-color:#404040;" fill="#404040" fill-opacity="1.0"><path style="stroke:none" d="M 0 5.91 L 0 121.98 C 0 125.24 2.64 127.89 5.91 127.89 L 669.09 127.89 C 672.36 127.89 675 125.24 675 121.98 L 675 5.91 C 675 2.64 672.36 0 669.09 0 L 5.91 0 C 2.64 0 0 2.64 0 5.91 Z" /></g><g style="--ltx-fill-color:#F2F2F2;" fill="#F2F2F2" fill-opacity="1.0"><path style="stroke:none" d="M 1.97 5.91 L 1.97 121.98 C 1.97 124.16 3.73 125.92 5.91 125.92 L 669.09 125.92 C 671.27 125.92 673.03 124.16 673.03 121.98 L 673.03 5.91 C 673.03 3.73 671.27 1.97 669.09 1.97 L 5.91 1.97 C 3.73 1.97 1.97 3.73 1.97 5.91 Z" /></g><g fill-opacity="1.0" transform="matrix(1.0 0.0 0.0 1.0 6.12 113.54)"><foreignobject style="--ltx-fo-width:47.9em;--ltx-fo-height:0.69em;--ltx-fo-depth:7.49em;font-size:10pt;" height="113.31" overflow="visible" transform="matrix(1 0 0 -1 0 9.61)" width="662.8"><span class="ltx_foreignobject_container"><span class="ltx_foreignobject_content"><span id="S4.SS1.p4.pic1.1" class="ltx_inline-logical-block ltx_minipage ltx_align_bottom" style="width:47.9em;">
<span id="Thmtheorem1" class="ltx_theorem ltx_theorem_theorem">
<h6 class="ltx_title ltx_runin ltx_title_theorem" style="--ltx-fg-color:#000000;"><span class="ltx_tag ltx_tag_theorem"><span id="Thmtheorem1.2" class="ltx_text ltx_font_bold">Theorem 1</span></span><span id="Thmtheorem1.3" class="ltx_text ltx_font_bold">.</span></h6>
<span id="Thmtheorem1.p1" class="ltx_para ltx_noindent">
<span id="Thmtheorem1.p1.1" class="ltx_p"><span id="Thmtheorem1.p1.1.1" class="ltx_text ltx_font_italic" style="--ltx-fg-color:#000000;">For 2-level scoring, any of the following conditions are sufficient for candidate rankings to be identifiable from the distribution of judge-assigned scores:</span></span>
<span id="S4.I1" class="ltx_itemize">
<span id="S4.I1.ix1" class="ltx_item" style="list-style-type:none;"><span class="ltx_tag ltx_tag_item">(i)</span> 
<span id="S4.I1.ix1.p1" class="ltx_para ltx_noindent">
<span id="S4.I1.ix1.p1.1" class="ltx_p"><span id="S4.I1.ix1.p1.1.1" class="ltx_text ltx_font_italic" style="--ltx-fg-color:#000000;">There is </span><math id="S4.I1.ix1.p1.m1" class="ltx_Math" alttext="J=1" display="inline" intent=":literal"><semantics><mrow><mi style="--ltx-fg-color:#000000;" mathcolor="#000000">J</mi><mo style="--ltx-fg-color:#000000;" mathcolor="#000000">=</mo><mn style="--ltx-fg-color:#000000;" mathcolor="#000000">1</mn></mrow><annotation encoding="application/x-tex">J=1</annotation></semantics></math><span id="S4.I1.ix1.p1.1.2" class="ltx_text ltx_font_italic" style="--ltx-fg-color:#000000;"> judge and it satisfies Assumptions </span><a href="#Thmassumption1" title="Assumption 1 (Strong Constancy). ‣ 4 THEORETICAL LIMITS OF RANKING IDENTIFIABILITY ‣ LLMs Judging LLMs: A Simplex Perspective" class="ltx_ref ltx_font_italic" style="--ltx-fg-color:#000000;"><span class="ltx_text ltx_ref_tag">1</span></a><span id="S4.I1.ix1.p1.1.3" class="ltx_text ltx_font_italic" style="--ltx-fg-color:#000000;"> and </span><a href="#Thmassumption3" title="Assumption 3. ‣ 4.1 2-level scoring systems ‣ 4 THEORETICAL LIMITS OF RANKING IDENTIFIABILITY ‣ LLMs Judging LLMs: A Simplex Perspective" class="ltx_ref ltx_font_italic" style="--ltx-fg-color:#000000;"><span class="ltx_text ltx_ref_tag">3</span></a><span id="S4.I1.ix1.p1.1.4" class="ltx_text ltx_font_italic" style="--ltx-fg-color:#000000;">.</span></span>
</span></span>
<span id="S4.I1.ix2" class="ltx_item" style="list-style-type:none;"><span class="ltx_tag ltx_tag_item">(ii)</span> 
<span id="S4.I1.ix2.p1" class="ltx_para">
<span id="S4.I1.ix2.p1.1" class="ltx_p"><span id="S4.I1.ix2.p1.1.1" class="ltx_text ltx_font_italic" style="--ltx-fg-color:#000000;">There are </span><math id="S4.I1.ix2.p1.m1" class="ltx_Math" alttext="K\geq 4" display="inline" intent=":literal"><semantics><mrow><mi style="--ltx-fg-color:#000000;" mathcolor="#000000">K</mi><mo style="--ltx-fg-color:#000000;" mathcolor="#000000">≥</mo><mn style="--ltx-fg-color:#000000;" mathcolor="#000000">4</mn></mrow><annotation encoding="application/x-tex">K\geq 4</annotation></semantics></math><span id="S4.I1.ix2.p1.1.2" class="ltx_text ltx_font_italic" style="--ltx-fg-color:#000000;"> candidates, </span><math id="S4.I1.ix2.p1.m2" class="ltx_Math" alttext="J\geq 2" display="inline" intent=":literal"><semantics><mrow><mi style="--ltx-fg-color:#000000;" mathcolor="#000000">J</mi><mo style="--ltx-fg-color:#000000;" mathcolor="#000000">≥</mo><mn style="--ltx-fg-color:#000000;" mathcolor="#000000">2</mn></mrow><annotation encoding="application/x-tex">J\geq 2</annotation></semantics></math><span id="S4.I1.ix2.p1.1.3" class="ltx_text ltx_font_italic" style="--ltx-fg-color:#000000;"> judges, and the judges satisfy Assumptions </span><a href="#footnote1" title="footnote 1 ‣ Assumption 2 (Moderate Constancy). ‣ 4 THEORETICAL LIMITS OF RANKING IDENTIFIABILITY ‣ LLMs Judging LLMs: A Simplex Perspective" class="ltx_ref ltx_font_italic" style="--ltx-fg-color:#000000;"><span class="ltx_text ltx_ref_tag">1</span></a><span id="S4.I1.ix2.p1.1.4" class="ltx_text ltx_font_italic" style="--ltx-fg-color:#000000;"> and </span><a href="#Thmassumption3" title="Assumption 3. ‣ 4.1 2-level scoring systems ‣ 4 THEORETICAL LIMITS OF RANKING IDENTIFIABILITY ‣ LLMs Judging LLMs: A Simplex Perspective" class="ltx_ref ltx_font_italic" style="--ltx-fg-color:#000000;"><span class="ltx_text ltx_ref_tag">3</span></a><span id="S4.I1.ix2.p1.1.5" class="ltx_text ltx_font_italic" style="--ltx-fg-color:#000000;">.</span></span>
</span></span>
</span>
</span>
</span></span></span></span></foreignobject></g></g></svg>