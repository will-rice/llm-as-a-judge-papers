<span id="A9.p3.pic1.1.1" class="ltx_p"><span id="A9.p3.pic1.1.1.1" class="ltx_text ltx_font_bold" style="--ltx-fg-color:#FFFFFF;">Bias Detection Prompt Template(Without Deeper Explanation)</span></span>
</span></span></span></foreignobject></g><g fill-opacity="1.0" transform="matrix(1.0 0.0 0.0 1.0 5.91 16.47)"><foreignobject style="--ltx-fo-width:38.9em;--ltx-fo-height:58.3em;--ltx-fo-depth:0.19em;font-size:10pt;" height="809.32" overflow="visible" transform="matrix(1 0 0 -1 0 806.63)" width="538.27"><span class="ltx_foreignobject_container"><span class="ltx_foreignobject_content">
<span id="A9.p3.pic1.2" class="ltx_inline-block ltx_minipage ltx_align_bottom" style="width:38.9em;">
<span id="A9.p3.pic1.2.1" class="ltx_p"><span id="A9.p3.pic1.2.1.1" class="ltx_text" style="--ltx-fg-color:#000000;">Your task is to analyze the chosen answer and the LLM’s reasoning process to determine whether the flawed judgment is caused by a cognitive bias. After your analysis, provide a strict JSON output indicating:</span></span>
<span id="A9.p3.pic1.2.2" class="ltx_p"><span id="A9.p3.pic1.2.2.1" class="ltx_text" style="--ltx-fg-color:#000000;">1. Whether a cognitive bias is present,</span></span>
<span id="A9.p3.pic1.2.3" class="ltx_p"><span id="A9.p3.pic1.2.3.1" class="ltx_text" style="--ltx-fg-color:#000000;">2. The name of the bias (if any),</span></span>
<span id="A9.p3.pic1.2.4" class="ltx_p"><span id="A9.p3.pic1.2.4.1" class="ltx_text" style="--ltx-fg-color:#000000;">3. A detailed definition of the bias (if any).</span></span>
<span id="A9.p3.pic1.2.5" class="ltx_p"><span id="A9.p3.pic1.2.5.1" class="ltx_text" style="--ltx-fg-color:#000000;">Given are:</span></span>
<span id="A9.p3.pic1.2.6" class="ltx_p"><span id="A9.p3.pic1.2.6.1" class="ltx_text" style="--ltx-fg-color:#000000;">- Question &amp; two candidate answers</span></span>
<span id="A9.p3.pic1.2.7" class="ltx_p"><span id="A9.p3.pic1.2.7.1" class="ltx_text" style="--ltx-fg-color:#000000;">- Which answer the LLM chose (and explanation)</span></span>
<span id="A9.p3.pic1.2.8" class="ltx_p"><span id="A9.p3.pic1.2.8.1" class="ltx_text" style="--ltx-fg-color:#000000;">You must respond **strictly in JSON** and wrap the JSON with “‘json … “‘.
<span id="A9.p3.pic1.2.8.1.1" class="ltx_text ltx_font_bold">Return format</span>:</span></span>
<span id="A9.p3.pic1.2.9" class="ltx_p"><span id="A9.p3.pic1.2.9.1" class="ltx_text" style="--ltx-fg-color:#000000;">{{</span></span>
<span id="A9.p3.pic1.2.10" class="ltx_p"><span id="A9.p3.pic1.2.10.1" class="ltx_text" style="--ltx-fg-color:#000000;">”whether”: ”yes” <math id="A9.p3.pic1.m1" class="ltx_Math" alttext="|" display="inline" intent=":literal"><semantics><mo style="--ltx-fg-color:#000000;" fence="false" mathcolor="#000000" stretchy="false">|</mo><annotation encoding="application/x-tex">|</annotation></semantics></math> ”no”,</span></span>
<span id="A9.p3.pic1.2.11" class="ltx_p"><span id="A9.p3.pic1.2.11.1" class="ltx_text" style="--ltx-fg-color:#000000;">”name”: ”<math id="A9.p3.pic1.m2" class="ltx_Math" alttext="&lt;" display="inline" intent=":literal"><semantics><mo style="--ltx-fg-color:#000000;" mathcolor="#000000">&lt;</mo><annotation encoding="application/x-tex">&lt;</annotation></semantics></math>bias-name<math id="A9.p3.pic1.m3" class="ltx_Math" alttext="&gt;" display="inline" intent=":literal"><semantics><mo style="--ltx-fg-color:#000000;" mathcolor="#000000">&gt;</mo><annotation encoding="application/x-tex">&gt;</annotation></semantics></math>” <math id="A9.p3.pic1.m4" class="ltx_Math" alttext="|" display="inline" intent=":literal"><semantics><mo style="--ltx-fg-color:#000000;" fence="false" mathcolor="#000000" stretchy="false">|</mo><annotation encoding="application/x-tex">|</annotation></semantics></math> null,</span></span>
<span id="A9.p3.pic1.2.12" class="ltx_p"><span id="A9.p3.pic1.2.12.1" class="ltx_text" style="--ltx-fg-color:#000000;">”Definition”: ”<math id="A9.p3.pic1.m5" class="ltx_Math" alttext="&lt;" display="inline" intent=":literal"><semantics><mo style="--ltx-fg-color:#000000;" mathcolor="#000000">&lt;</mo><annotation encoding="application/x-tex">&lt;</annotation></semantics></math>…<math id="A9.p3.pic1.m6" class="ltx_Math" alttext="&gt;" display="inline" intent=":literal"><semantics><mo style="--ltx-fg-color:#000000;" mathcolor="#000000">&gt;</mo><annotation encoding="application/x-tex">&gt;</annotation></semantics></math>” <math id="A9.p3.pic1.m7" class="ltx_Math" alttext="|" display="inline" intent=":literal"><semantics><mo style="--ltx-fg-color:#000000;" fence="false" mathcolor="#000000" stretchy="false">|</mo><annotation encoding="application/x-tex">|</annotation></semantics></math> null</span></span>
<span id="A9.p3.pic1.2.13" class="ltx_p"><span id="A9.p3.pic1.2.13.1" class="ltx_text" style="--ltx-fg-color:#000000;">}}</span></span>
<span id="A9.p3.pic1.2.14" class="ltx_p"><span id="A9.p3.pic1.2.14.1" class="ltx_text ltx_font_bold" style="--ltx-fg-color:#000000;">Rules<span id="A9.p3.pic1.2.14.1.1" class="ltx_text ltx_font_medium">:</span></span></span>
<span id="A9.p3.pic1.2.15" class="ltx_p"><span id="A9.p3.pic1.2.15.1" class="ltx_text" style="--ltx-fg-color:#000000;">- if caused by a **bias**, fill both new fields</span></span>
<span id="A9.p3.pic1.2.16" class="ltx_p"><span id="A9.p3.pic1.2.16.1" class="ltx_text" style="--ltx-fg-color:#000000;">- if NOT caused by bias, set ”name”/”Definition” to null</span></span>
<span id="A9.p3.pic1.2.17" class="ltx_p"><span id="A9.p3.pic1.2.17.1" class="ltx_text ltx_font_bold" style="--ltx-fg-color:#000000;">Question<span id="A9.p3.pic1.2.17.1.1" class="ltx_text ltx_font_medium">:</span></span></span>
<span id="A9.p3.pic1.2.18" class="ltx_p"><math id="A9.p3.pic1.m8" class="ltx_Math" alttext="\{question\}" display="inline" intent=":literal"><semantics><mrow><mo stretchy="false">{</mo><mrow><mi style="--ltx-fg-color:#000000;" mathcolor="#000000">q</mi><mo lspace="0em" rspace="0em">​</mo><mi style="--ltx-fg-color:#000000;" mathcolor="#000000">u</mi><mo lspace="0em" rspace="0em">​</mo><mi style="--ltx-fg-color:#000000;" mathcolor="#000000">e</mi><mo lspace="0em" rspace="0em">​</mo><mi style="--ltx-fg-color:#000000;" mathcolor="#000000">s</mi><mo lspace="0em" rspace="0em">​</mo><mi style="--ltx-fg-color:#000000;" mathcolor="#000000">t</mi><mo lspace="0em" rspace="0em">​</mo><mi style="--ltx-fg-color:#000000;" mathcolor="#000000">i</mi><mo lspace="0em" rspace="0em">​</mo><mi style="--ltx-fg-color:#000000;" mathcolor="#000000">o</mi><mo lspace="0em" rspace="0em">​</mo><mi style="--ltx-fg-color:#000000;" mathcolor="#000000">n</mi></mrow><mo stretchy="false">}</mo></mrow><annotation encoding="application/x-tex">\{question\}</annotation></semantics></math><span id="A9.p3.pic1.2.18.1" class="ltx_text"></span></span>
<span id="A9.p3.pic1.2.19" class="ltx_p"><span id="A9.p3.pic1.2.19.1" class="ltx_text ltx_font_bold" style="--ltx-fg-color:#000000;">Answer 1<span id="A9.p3.pic1.2.19.1.1" class="ltx_text ltx_font_medium">:</span></span></span>
<span id="A9.p3.pic1.2.20" class="ltx_p"><math id="A9.p3.pic1.m9" class="ltx_Math" alttext="\{resp\_a\}" display="inline" intent=":literal"><semantics><mrow><mo stretchy="false">{</mo><mrow><mi style="--ltx-fg-color:#000000;" mathcolor="#000000">r</mi><mo lspace="0em" rspace="0em">​</mo><mi style="--ltx-fg-color:#000000;" mathcolor="#000000">e</mi><mo lspace="0em" rspace="0em">​</mo><mi style="--ltx-fg-color:#000000;" mathcolor="#000000">s</mi><mo lspace="0em" rspace="0em">​</mo><mi style="--ltx-fg-color:#000000;" mathcolor="#000000">p</mi><mo lspace="0em" rspace="0em">​</mo><mi style="--ltx-fg-color:#000000;" mathcolor="#000000">_</mi><mo lspace="0em" rspace="0em">​</mo><mi style="--ltx-fg-color:#000000;" mathcolor="#000000">a</mi></mrow><mo stretchy="false">}</mo></mrow><annotation encoding="application/x-tex">\{resp\_a\}</annotation></semantics></math><span id="A9.p3.pic1.2.20.1" class="ltx_text"></span></span>
<span id="A9.p3.pic1.2.21" class="ltx_p"><span id="A9.p3.pic1.2.21.1" class="ltx_text ltx_font_bold" style="--ltx-fg-color:#000000;">Answer 2<span id="A9.p3.pic1.2.21.1.1" class="ltx_text ltx_font_medium">:</span></span></span>
<span id="A9.p3.pic1.2.22" class="ltx_p"><math id="A9.p3.pic1.m10" class="ltx_Math" alttext="\{resp\_b\}" display="inline" intent=":literal"><semantics><mrow><mo stretchy="false">{</mo><mrow><mi style="--ltx-fg-color:#000000;" mathcolor="#000000">r</mi><mo lspace="0em" rspace="0em">​</mo><mi style="--ltx-fg-color:#000000;" mathcolor="#000000">e</mi><mo lspace="0em" rspace="0em">​</mo><mi style="--ltx-fg-color:#000000;" mathcolor="#000000">s</mi><mo lspace="0em" rspace="0em">​</mo><mi style="--ltx-fg-color:#000000;" mathcolor="#000000">p</mi><mo lspace="0em" rspace="0em">​</mo><mi style="--ltx-fg-color:#000000;" mathcolor="#000000">_</mi><mo lspace="0em" rspace="0em">​</mo><mi style="--ltx-fg-color:#000000;" mathcolor="#000000">b</mi></mrow><mo stretchy="false">}</mo></mrow><annotation encoding="application/x-tex">\{resp\_b\}</annotation></semantics></math><span id="A9.p3.pic1.2.22.1" class="ltx_text"></span></span>
<span id="A9.p3.pic1.2.23" class="ltx_p"><span id="A9.p3.pic1.2.23.1" class="ltx_text ltx_font_bold" style="--ltx-fg-color:#000000;">Chosen answer<span id="A9.p3.pic1.2.23.1.1" class="ltx_text ltx_font_medium">:</span></span></span>
<span id="A9.p3.pic1.2.24" class="ltx_p"><span id="A9.p3.pic1.2.24.1" class="ltx_text" style="--ltx-fg-color:#000000;">answer<math id="A9.p3.pic1.m11" class="ltx_Math" alttext="\{chosen\}" display="inline" intent=":literal"><semantics><mrow><mo style="--ltx-fg-color:#000000;" mathcolor="#000000" stretchy="false">{</mo><mrow><mi style="--ltx-fg-color:#000000;" mathcolor="#000000">c</mi><mo lspace="0em" rspace="0em">​</mo><mi style="--ltx-fg-color:#000000;" mathcolor="#000000">h</mi><mo lspace="0em" rspace="0em">​</mo><mi style="--ltx-fg-color:#000000;" mathcolor="#000000">o</mi><mo lspace="0em" rspace="0em">​</mo><mi style="--ltx-fg-color:#000000;" mathcolor="#000000">s</mi><mo lspace="0em" rspace="0em">​</mo><mi style="--ltx-fg-color:#000000;" mathcolor="#000000">e</mi><mo lspace="0em" rspace="0em">​</mo><mi style="--ltx-fg-color:#000000;" mathcolor="#000000">n</mi></mrow><mo style="--ltx-fg-color:#000000;" mathcolor="#000000" stretchy="false">}</mo></mrow><annotation encoding="application/x-tex">\{chosen\}</annotation></semantics></math> (1-based)</span></span>
<span id="A9.p3.pic1.2.25" class="ltx_p"><span id="A9.p3.pic1.2.25.1" class="ltx_text ltx_font_bold" style="--ltx-fg-color:#000000;">LLM reasoning process<span id="A9.p3.pic1.2.25.1.1" class="ltx_text ltx_font_medium">:</span></span></span>
<span id="A9.p3.pic1.2.26" class="ltx_p"><math id="A9.p3.pic1.m12" class="ltx_Math" alttext="\{reason\}" display="inline" intent=":literal"><semantics><mrow><mo stretchy="false">{</mo><mrow><mi style="--ltx-fg-color:#000000;" mathcolor="#000000">r</mi><mo lspace="0em" rspace="0em">​</mo><mi style="--ltx-fg-color:#000000;" mathcolor="#000000">e</mi><mo lspace="0em" rspace="0em">​</mo><mi style="--ltx-fg-color:#000000;" mathcolor="#000000">a</mi><mo lspace="0em" rspace="0em">​</mo><mi style="--ltx-fg-color:#000000;" mathcolor="#000000">s</mi><mo lspace="0em" rspace="0em">​</mo><mi style="--ltx-fg-color:#000000;" mathcolor="#000000">o</mi><mo lspace="0em" rspace="0em">​</mo><mi style="--ltx-fg-color:#000000;" mathcolor="#000000">n</mi></mrow><mo stretchy="false">}</mo></mrow><annotation encoding="application/x-tex">\{reason\}</annotation></semantics></math><span id="A9.p3.pic1.2.26.1" class="ltx_text"></span></span>
<span id="A9.p3.pic1.2.27" class="ltx_p"><span id="A9.p3.pic1.2.27.1" class="ltx_text ltx_font_bold" style="--ltx-fg-color:#000000;">Some examples<span id="A9.p3.pic1.2.27.1.1" class="ltx_text ltx_font_medium">:</span></span></span>
<span id="A9.p3.pic1.2.28" class="ltx_p"><span id="A9.p3.pic1.2.28.1" class="ltx_text" style="--ltx-fg-color:#000000;">json{{</span></span>
<span id="A9.p3.pic1.2.29" class="ltx_p"><span id="A9.p3.pic1.2.29.1" class="ltx_text" style="--ltx-fg-color:#000000;">”whether”:”yes”,</span></span>
<span id="A9.p3.pic1.2.30" class="ltx_p"><span id="A9.p3.pic1.2.30.1" class="ltx_text" style="--ltx-fg-color:#000000;">”name”:”length bias”,</span></span>
<span id="A9.p3.pic1.2.31" class="ltx_p"><span id="A9.p3.pic1.2.31.1" class="ltx_text" style="--ltx-fg-color:#000000;">”Definition”: ”Refers to the tendency of large language models (LLMs) to prefer longer (or shorter) generated outputs when evaluating text quality,</span></span>
<span id="A9.p3.pic1.2.32" class="ltx_p"><span id="A9.p3.pic1.2.32.1" class="ltx_text" style="--ltx-fg-color:#000000;">while disregarding the actual content quality or relevance.”</span></span>
<span id="A9.p3.pic1.2.33" class="ltx_p"><span id="A9.p3.pic1.2.33.1" class="ltx_text" style="--ltx-fg-color:#000000;">}}</span></span>
<span id="A9.p3.pic1.2.34" class="ltx_p"><span id="A9.p3.pic1.2.34.1" class="ltx_text" style="--ltx-fg-color:#000000;">json{{</span></span>
<span id="A9.p3.pic1.2.35" class="ltx_p"><span id="A9.p3.pic1.2.35.1" class="ltx_text" style="--ltx-fg-color:#000000;">”whether”:”no”,</span></span>
<span id="A9.p3.pic1.2.36" class="ltx_p"><span id="A9.p3.pic1.2.36.1" class="ltx_text" style="--ltx-fg-color:#000000;">”name”:”null”,</span></span>
<span id="A9.p3.pic1.2.37" class="ltx_p"><span id="A9.p3.pic1.2.37.1" class="ltx_text" style="--ltx-fg-color:#000000;">”Definition”: ”null”</span></span>
<span id="A9.p3.pic1.2.38" class="ltx_p"><span id="A9.p3.pic1.2.38.1" class="ltx_text" style="--ltx-fg-color:#000000;">}}</span></span>
<span id="A9.p3.pic1.2.39" class="ltx_p"><span id="A9.p3.pic1.2.39.1" class="ltx_text" style="--ltx-fg-color:#000000;">Notice! The ”json” is needed, you should not ignore it. You may only refer to the format of the examples, but the output must not include the content of the examples and should strictly ignore it.</span></span>
</span></span></span></foreignobject></g></g></svg>