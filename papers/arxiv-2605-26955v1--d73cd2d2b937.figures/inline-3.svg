<svg id="A3.SS3.p1.pic1" class="ltx_picture" height="1046.78" overflow="visible" version="1.1" viewbox="0 0 477.38 1046.78" width="477.38"><g style="--ltx-stroke-color:#000000;--ltx-fill-color:#000000;" fill="#000000" stroke="#000000" stroke-width="0.4pt" transform="translate(0,1046.78) matrix(1 0 0 -1 0 0)"><g style="--ltx-fill-color:#404040;" fill="#404040" fill-opacity="1.0"><path style="stroke:none" d="M 0 5.91 L 0 1040.87 C 0 1044.13 2.64 1046.78 5.91 1046.78 L 471.47 1046.78 C 474.73 1046.78 477.38 1044.13 477.38 1040.87 L 477.38 5.91 C 477.38 2.64 474.73 0 471.47 0 L 5.91 0 C 2.64 0 0 2.64 0 5.91 Z" /></g><g style="--ltx-fill-color:#FFFFFF;" fill="#FFFFFF" fill-opacity="1.0"><path style="stroke:none" d="M 1.97 5.91 L 1.97 1022.78 L 475.41 1022.78 L 475.41 5.91 C 475.41 3.73 473.65 1.97 471.47 1.97 L 5.91 1.97 C 3.73 1.97 1.97 3.73 1.97 5.91 Z" /></g><g fill-opacity="1.0" transform="matrix(1.0 0.0 0.0 1.0 7.29 1031.38)"><foreignobject style="--ltx-fo-width:29.09em;--ltx-fo-height:0.69em;--ltx-fo-depth:0.19em;font-size:10pt;" height="12.18" overflow="visible" transform="matrix(1 0 0 -1 0 9.49)" width="402.52"><span class="ltx_foreignobject_container"><span class="ltx_foreignobject_content">
<span id="A3.SS3.p1.pic1.1" class="ltx_inline-block ltx_minipage ltx_align_bottom" style="width:29.09em;">
<span id="A3.SS3.p1.pic1.1.1" class="ltx_p"><span id="A3.SS3.p1.pic1.1.1.1" class="ltx_text ltx_font_bold" style="--ltx-fg-color:#FFFFFF;">Prompt</span></span>
</span></span></span></foreignobject></g><g fill-opacity="1.0" transform="matrix(1.0 0.0 0.0 1.0 7.29 10.4)"><foreignobject style="--ltx-fo-width:35.4em;--ltx-fo-height:72.78em;--ltx-fo-depth:0.23em;font-size:10pt;" height="1010.18" overflow="visible" transform="matrix(1 0 0 -1 0 1007.07)" width="489.84"><span class="ltx_foreignobject_container"><span class="ltx_foreignobject_content">
<span id="A3.SS3.p1.pic1.2" class="ltx_inline-block ltx_minipage ltx_align_bottom" style="width:35.4em;">
<span id="A3.SS3.p1.pic1.2.1" class="ltx_p"><span id="A3.SS3.p1.pic1.2.1.1" class="ltx_text ltx_font_typewriter" style="font-size:90%;--ltx-fg-color:#000000;">Your task is to refine raw human annotations into high-quality, standardized data points for an error-detection dataset.

<br class="ltx_break">Human annotators evaluated LLMs’ responses to a specific query to detect errors.

<br class="ltx_break">They provided a raw error span, an explanation of the error, and occasionally a suggested correction.

<br class="ltx_break">A secondary validator reviewed these annotations and optionally provided comments.

<br class="ltx_break">
<br class="ltx_break">### Objective

<br class="ltx_break">
<br class="ltx_break">Synthesize the provided inputs and generate a final, polished ‘refined_error_span’ and ‘refined_explanation’.

<br class="ltx_break">
<br class="ltx_break">### Input Data

<br class="ltx_break"></span></span>
<span id="A3.I2" class="ltx_itemize" style="--ltx-enum-leftmargin:2em;">
<span id="A3.I2.i1" class="ltx_item" style="list-style-type:none;"><span class="ltx_tag ltx_tag_item">-</span> 
<span id="A3.I2.i1.p1" class="ltx_para">
<span id="A3.I2.i1.p1.1" class="ltx_p"><span id="A3.I2.i1.p1.1.1" class="ltx_text ltx_font_typewriter" style="font-size:90%;--ltx-fg-color:#000000;">**Query:** {query}
</span></span>
</span></span>
<span id="A3.I2.i2" class="ltx_item" style="list-style-type:none;"><span class="ltx_tag ltx_tag_item">-</span> 
<span id="A3.I2.i2.p1" class="ltx_para">
<span id="A3.I2.i2.p1.1" class="ltx_p"><span id="A3.I2.i2.p1.1.1" class="ltx_text ltx_font_typewriter" style="font-size:90%;--ltx-fg-color:#000000;">**LLM Response:** {response}
</span></span>
</span></span>
<span id="A3.I2.i3" class="ltx_item" style="list-style-type:none;"><span class="ltx_tag ltx_tag_item">-</span> 
<span id="A3.I2.i3.p1" class="ltx_para">
<span id="A3.I2.i3.p1.1" class="ltx_p"><span id="A3.I2.i3.p1.1.1" class="ltx_text ltx_font_typewriter" style="font-size:90%;--ltx-fg-color:#000000;">**Raw Error Span:** {span}
</span></span>
</span></span>
<span id="A3.I2.i4" class="ltx_item" style="list-style-type:none;"><span class="ltx_tag ltx_tag_item">-</span> 
<span id="A3.I2.i4.p1" class="ltx_para">
<span id="A3.I2.i4.p1.1" class="ltx_p"><span id="A3.I2.i4.p1.1.1" class="ltx_text ltx_font_typewriter" style="font-size:90%;--ltx-fg-color:#000000;">**Raw Explanation:** {explanation}
</span></span>
</span></span>
<span id="A3.I2.i5" class="ltx_item" style="list-style-type:none;"><span class="ltx_tag ltx_tag_item">-</span> 
<span id="A3.I2.i5.p1" class="ltx_para">
<span id="A3.I2.i5.p1.1" class="ltx_p"><span id="A3.I2.i5.p1.1.1" class="ltx_text ltx_font_typewriter" style="font-size:90%;--ltx-fg-color:#000000;">**Suggested Correction (Optional):** {correction}
</span></span>
</span></span>
<span id="A3.I2.i6" class="ltx_item" style="list-style-type:none;"><span class="ltx_tag ltx_tag_item">-</span> 
<span id="A3.I2.i6.p1" class="ltx_para">
<span id="A3.I2.i6.p1.1" class="ltx_p"><span id="A3.I2.i6.p1.1.1" class="ltx_text ltx_font_typewriter" style="font-size:90%;--ltx-fg-color:#000000;">**Validator Comment (Optional):** {validation_comment}
</span></span>
</span></span>
</span>
<span id="A3.SS3.p1.pic1.2.2" class="ltx_p"><span id="A3.SS3.p1.pic1.2.2.1" class="ltx_text ltx_font_typewriter" style="font-size:90%;--ltx-fg-color:#000000;">### Refinement Guidelines

<br class="ltx_break"></span></span>
<span id="A3.I3" class="ltx_enumerate" style="--ltx-enum-leftmargin:2em;">
<span id="A3.I3.i1" class="ltx_item" style="list-style-type:none;"><span class="ltx_tag ltx_tag_item">1.</span> 
<span id="A3.I3.i1.p1" class="ltx_para">
<span id="A3.I3.i1.p1.1" class="ltx_p"><span id="A3.I3.i1.p1.1.1" class="ltx_text ltx_font_typewriter" style="font-size:90%;--ltx-fg-color:#000000;">**Exact Span Extraction:** The ‘refined_error_span’ MUST be an exact, continuous substring extracted directly from the ‘‘LLM Response’’. Refine the boundaries of the ‘‘Raw Error Span’’ to include necessary context or remove trailing/irrelevant words, but do not modify the text itself. Ensure the span is concise; avoid including excessive surrounding text that is not directly part of the error.
</span></span>
</span></span>
<span id="A3.I3.i2" class="ltx_item" style="list-style-type:none;"><span class="ltx_tag ltx_tag_item">2.</span> 
<span id="A3.I3.i2.p1" class="ltx_para">
<span id="A3.I3.i2.p1.1" class="ltx_p"><span id="A3.I3.i2.p1.1.1" class="ltx_text ltx_font_typewriter" style="font-size:90%;--ltx-fg-color:#000000;">**Explanation Clarity &amp; Comprehensibility:** Analyze the raw inputs to understand the underlying reason why the annotators considered this an error. Rewrite the explanation to clearly convey their rationale. Focus on the core reasoning and avoid adding extraneous information or overly detailed context that was not present in the original annotation.
</span></span>
</span></span>
<span id="A3.I3.i3" class="ltx_item" style="list-style-type:none;"><span class="ltx_tag ltx_tag_item">3.</span> 
<span id="A3.I3.i3.p1" class="ltx_para">
<span id="A3.I3.i3.p1.1" class="ltx_p"><span id="A3.I3.i3.p1.1.1" class="ltx_text ltx_font_typewriter" style="font-size:90%;--ltx-fg-color:#000000;">**Language Profile (English as Matrix Language):** Write the ‘refined_explanation’ in English. You may also use code-switched text where English acts as the matrix (base) language, embedding specific expressions, words, or idioms from the original language of the text. Use this code-switching if retaining the original terms helps explain the error more accurately or naturally.
</span></span>
</span></span>
<span id="A3.I3.i4" class="ltx_item" style="list-style-type:none;"><span class="ltx_tag ltx_tag_item">4.</span> 
<span id="A3.I3.i4.p1" class="ltx_para">
<span id="A3.I3.i4.p1.1" class="ltx_p"><span id="A3.I3.i4.p1.1.1" class="ltx_text ltx_font_typewriter" style="font-size:90%;--ltx-fg-color:#000000;">**Incorporate Validator Feedback:** If a ‘‘Validator Comment’’ exists, use it to resolve disagreements, correct the raw annotator’s mistakes, or add nuanced context to your refined explanation. In cases where the Validator Comment indicates that the detected span is not actually an error, set the value of ‘refined_error_span’ to ‘null’ and provide a brief justification in the ‘refined_explanation’.
</span></span>
</span></span>
<span id="A3.I3.i5" class="ltx_item" style="list-style-type:none;"><span class="ltx_tag ltx_tag_item">5.</span> 
<span id="A3.I3.i5.p1" class="ltx_para">
<span id="A3.I3.i5.p1.1" class="ltx_p"><span id="A3.I3.i5.p1.1.1" class="ltx_text ltx_font_typewriter" style="font-size:90%;--ltx-fg-color:#000000;">**Leverage Corrections:** If a ‘‘Suggested Correction’’ is present, use it to strengthen the refined explanation.
</span></span>
</span></span>
</span>
<span id="A3.SS3.p1.pic1.2.3" class="ltx_p"><span id="A3.SS3.p1.pic1.2.3.1" class="ltx_text ltx_font_typewriter" style="font-size:90%;--ltx-fg-color:#000000;">### Output Format

<br class="ltx_break">
<br class="ltx_break">Provide your output strictly in the following JSON format without any markdown blocks or additional text:

<br class="ltx_break">{

<br class="ltx_break">‘‘refined_error_span’’: ‘‘The exact erroneous substring from the LLM Response’’ or null,

<br class="ltx_break">‘‘refined_explanation’’: ‘‘A clear and polished explanation of why the span is erroneous’’

<br class="ltx_break">}
</span></span>
</span></span></span></foreignobject></g></g></svg>