<span id="S3.F2.pic1.2.1" class="ltx_p"><span id="S3.F2.pic1.2.1.1" class="ltx_text" style="--ltx-fg-color:#000000;">You are a judger to grade multiple answers given an instruction and the ground truth answer. Please grade each candidate from 0 to 100.</span></span>
<span id="S3.F2.pic1.2.2" class="ltx_p"><span id="S3.F2.pic1.2.2.1" class="ltx_text ltx_font_bold" style="--ltx-fg-color:#000000;">Instruction:<span id="S3.F2.pic1.2.2.1.1" class="ltx_text ltx_font_medium"> <span id="S3.F2.pic1.2.2.1.1.1" class="ltx_text ltx_font_typewriter">{instruction}</span></span></span></span>
