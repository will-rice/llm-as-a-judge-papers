<span id="A4.pic7.2" class="ltx_inline-block ltx_minipage ltx_align_bottom" style="width:46.2em;">
<span id="A4.pic7.2.1" class="ltx_p"><span id="A4.pic7.2.1.1" class="ltx_text" style="--ltx-fg-color:#000000;">&lt;task&gt;
As a Category Validator, your task is to verify whether a given inference can be classified under the specified category.
Specifically, your response should clearly indicate the relationship between the inference and category: Match or Mismatch.
A mismatch occurs when you can infer that the inference does not relate at all to the category and its definition. A match occurs when you can infer they do relate to each other
&lt;/task&gt; 
<br class="ltx_break"></span></span>
<span id="A4.pic7.2.2" class="ltx_p"><span id="A4.pic7.2.2.1" class="ltx_text" style="--ltx-fg-color:#000000;">&lt;category&gt;
[insert category]
&lt;/category&gt;
<br class="ltx_break"></span></span>
<span id="A4.pic7.2.3" class="ltx_p"><span id="A4.pic7.2.3.1" class="ltx_text" style="--ltx-fg-color:#000000;">&lt;category definition&gt;
[insert definition]
&lt;/category definition&gt;
<br class="ltx_break"></span></span>
<span id="A4.pic7.2.4" class="ltx_p"><span id="A4.pic7.2.4.1" class="ltx_text" style="--ltx-fg-color:#000000;">&lt;inference&gt;
<math id="A4.pic7.m1" class="ltx_Math" alttext="\mathcal{I}" display="inline" intent=":literal"><semantics><mi style="--ltx-fg-color:#000000;" class="ltx_font_mathcaligraphic" mathcolor="#000000">ℐ</mi><annotation encoding="application/x-tex">\mathcal{I}</annotation></semantics></math>
&lt;/inference&gt;
<br class="ltx_break"></span></span>
<span id="A4.pic7.2.5" class="ltx_p"><span id="A4.pic7.2.5.1" class="ltx_text" style="--ltx-fg-color:#000000;">&lt;format&gt;
Output your response as a json with only a single key &quot;output&quot; and a value of one among - (&quot;Match&quot;, &quot;Mismatch&quot;).
&lt;/format&gt;</span></span>
</span></span></span></foreignobject></g></g></svg>