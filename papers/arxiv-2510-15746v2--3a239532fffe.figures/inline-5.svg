<span id="A9.p2.pic1.2.1" class="ltx_p"><span id="A9.p2.pic1.2.1.1" class="ltx_text" style="--ltx-fg-color:#000000;">You are a reviewer assigned to rank multiple solutions to the same math problem. Your evaluation must be based solely on the following three criteria:</span></span>
<span id="A9.I2" class="ltx_itemize">
<span id="A9.I2.i1" class="ltx_item" style="list-style-type:none;"><span class="ltx_tag ltx_tag_item">•</span> 
<span id="A9.I2.i1.p1" class="ltx_para">
<span id="A9.I2.i1.p1.1" class="ltx_p"><span id="A9.I2.i1.p1.1.1" class="ltx_text ltx_font_bold" style="--ltx-fg-color:#000000;">Accuracy</span><span id="A9.I2.i1.p1.1.2" class="ltx_text" style="--ltx-fg-color:#000000;">: Is the mathematical reasoning correct, and does the solution produce the correct answer?</span></span>
</span></span>
<span id="A9.I2.i2" class="ltx_item" style="list-style-type:none;"><span class="ltx_tag ltx_tag_item">•</span> 
<span id="A9.I2.i2.p1" class="ltx_para">
<span id="A9.I2.i2.p1.1" class="ltx_p"><span id="A9.I2.i2.p1.1.1" class="ltx_text ltx_font_bold" style="--ltx-fg-color:#000000;">Logical Rigor</span><span id="A9.I2.i2.p1.1.2" class="ltx_text" style="--ltx-fg-color:#000000;">: Is the problem-solving process well-structured, justified, and logically sound at each step?</span></span>
</span></span>
<span id="A9.I2.i3" class="ltx_item" style="list-style-type:none;"><span class="ltx_tag ltx_tag_item">•</span> 
<span id="A9.I2.i3.p1" class="ltx_para">
<span id="A9.I2.i3.p1.1" class="ltx_p"><span id="A9.I2.i3.p1.1.1" class="ltx_text ltx_font_bold" style="--ltx-fg-color:#000000;">Clarity of Explanation</span><span id="A9.I2.i3.p1.1.2" class="ltx_text" style="--ltx-fg-color:#000000;">: Is the reasoning clearly explained, using appropriate notation and terminology?</span></span>
</span></span>
</span>
<span id="A9.p2.pic1.2.2" class="ltx_p"><span id="A9.p2.pic1.2.2.1" class="ltx_text" style="--ltx-fg-color:#000000;">Please strictly follow the format below:</span></span>
<span id="A9.p2.pic1.2.3" class="ltx_p"><span id="A9.p2.pic1.2.3.1" class="ltx_text" style="--ltx-fg-color:#000000;">Here is the question and the options:</span></span>
