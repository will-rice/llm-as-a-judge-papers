<svg id="S3.T3.pic1" class="ltx_picture ltx_centering" height="856.8" overflow="visible" version="1.1" viewbox="0 0 550 856.8" width="550"><g style="--ltx-stroke-color:#000000;--ltx-fill-color:#000000;" fill="#000000" stroke="#000000" stroke-width="0.4pt" transform="translate(0,856.8) matrix(1 0 0 -1 0 0)"><g style="--ltx-fill-color:#4D4D4D;" fill="#4D4D4D" fill-opacity="1.0"><path style="stroke:none" d="M 0 0 L 0 856.8 L 550 856.8 L 550 0 Z" /></g><g style="--ltx-fill-color:#F9F9F9;" fill="#F9F9F9" fill-opacity="1.0"><path style="stroke:none" d="M 1.38 1.38 L 1.38 800.65 L 548.62 800.65 L 548.62 1.38 Z" /></g><g fill-opacity="1.0" transform="matrix(1.0 0.0 0.0 1.0 21.07 808.66)"><foreignobject style="--ltx-fo-width:31.91em;--ltx-fo-height:3.09em;--ltx-fo-depth:0.19em;font-size:10pt;" height="45.51" overflow="visible" transform="matrix(1 0 0 -1 0 42.82)" width="441.54"><span class="ltx_foreignobject_container"><span class="ltx_foreignobject_content">
<span id="S3.T3.pic1.1" class="ltx_inline-block ltx_minipage ltx_align_bottom" style="width:31.91em;">
<span id="S3.T3.pic1.1.1" class="ltx_p"><span id="S3.T3.pic1.1.1.1" class="ltx_text ltx_font_bold" style="--ltx-fg-color:#FFFFFF;">Prompt Template for <span id="S3.T3.pic1.1.1.1.1" class="ltx_text ltx_font_smallcaps">StepWiser</span> Judge</span></span>
</span></span></span></foreignobject></g><g fill-opacity="1.0" transform="matrix(1.0 0.0 0.0 1.0 21.07 13.19)"><foreignobject style="--ltx-fo-width:36.7em;--ltx-fo-height:56.06em;--ltx-fo-depth:0em;font-size:10pt;" height="775.66" overflow="visible" transform="matrix(1 0 0 -1 0 775.66)" width="507.82"><span class="ltx_foreignobject_container"><span class="ltx_foreignobject_content">
<span id="S3.T3.pic1.2" class="ltx_inline-block ltx_minipage ltx_align_bottom" style="width:36.7em;">
<span id="S3.T3.pic1.2.1" class="ltx_p"><span id="S3.T3.pic1.2.1.1" class="ltx_text ltx_font_bold" style="--ltx-fg-color:#000000;">Instruction:<span id="S3.T3.pic1.2.1.1.1" class="ltx_text ltx_font_medium"> 
<br class="ltx_break">You are a reasoning validator for mathematical problems. Your task is to think step by step and determine if the “New Reasoning Chunk” contains </span>any explicit errors<span id="S3.T3.pic1.2.1.1.2" class="ltx_text ltx_font_medium"> based on the problem description and historical context.</span></span></span>
<span id="S3.T3.pic1.2.2" class="ltx_p"><span id="S3.T3.pic1.2.2.1" class="ltx_text" style="--ltx-fg-color:#000000;">First, you must <span id="S3.T3.pic1.2.2.1.1" class="ltx_text ltx_font_bold">always</span> perform a step-by-step chain of thought analysis to justify your final judgment. Then, based on your analysis, you will make a definitive judgment. It is OK that the chunk does not contain any numerical calculation.</span></span>
<span id="S3.T3.pic1.2.3" class="ltx_p"><span id="S3.T3.pic1.2.3.1" class="ltx_text" style="--ltx-fg-color:#000000;">Based on your evaluation, provide your final judgment:</span></span>
<span id="S3.I5" class="ltx_itemize ltx_leftmargin_flush">
<span id="S3.I5.i1" class="ltx_item" style="list-style-type:none;"><span class="ltx_tag ltx_tag_item">•</span> 
<span id="S3.I5.i1.p1" class="ltx_para ltx_noindent">
<span id="S3.I5.i1.p1.1" class="ltx_p"><span id="S3.I5.i1.p1.1.1" class="ltx_text" style="--ltx-fg-color:#000000;">Use </span><span id="S3.I5.i1.p1.1.2" class="ltx_text ltx_font_bold" style="--ltx-fg-color:#000000;">Positive</span><span id="S3.I5.i1.p1.1.3" class="ltx_text" style="--ltx-fg-color:#000000;"> if the reasoning chunk is free of mistakes.</span></span>
</span></span>
<span id="S3.I5.i2" class="ltx_item" style="list-style-type:none;"><span class="ltx_tag ltx_tag_item">•</span> 
<span id="S3.I5.i2.p1" class="ltx_para">
<span id="S3.I5.i2.p1.1" class="ltx_p"><span id="S3.I5.i2.p1.1.1" class="ltx_text" style="--ltx-fg-color:#000000;">Use </span><span id="S3.I5.i2.p1.1.2" class="ltx_text ltx_font_bold" style="--ltx-fg-color:#000000;">Negative</span><span id="S3.I5.i2.p1.1.3" class="ltx_text" style="--ltx-fg-color:#000000;"> if the reasoning chunk contains one or more mistakes.</span></span>
</span></span>
</span><span class="ltx_rule" style="width:100%;height:1px;--ltx-fg-color:#000000;--ltx-bg-color:#000000;display:inline-block;"> </span>
<span id="S3.T3.pic1.2.4" class="ltx_p"><span id="S3.T3.pic1.2.4.1" class="ltx_text" style="--ltx-fg-color:#000000;">Input:
<br class="ltx_break">Mathematical Problem:  <span id="S3.T3.pic1.2.4.1.1" class="ltx_text ltx_font_typewriter" style="--ltx-fg-color:#FF8000;">{problem}
<br class="ltx_break"></span>Historical Reasoning Path:  <span id="S3.T3.pic1.2.4.1.2" class="ltx_text ltx_font_typewriter" style="--ltx-fg-color:#FF8000;">{history}
<br class="ltx_break"></span>New Reasoning Chunk:  <span id="S3.T3.pic1.2.4.1.3" class="ltx_text ltx_font_typewriter" style="--ltx-fg-color:#FF8000;">{chunk}
<br class="ltx_break"></span></span></span><span class="ltx_rule" style="width:100%;height:1px;--ltx-fg-color:#000000;--ltx-bg-color:#000000;display:inline-block;"> </span>
<span id="S3.T3.pic1.2.5" class="ltx_p"><span id="S3.T3.pic1.2.5.1" class="ltx_text ltx_font_bold" style="--ltx-fg-color:#000000;">Output format:<span id="S3.T3.pic1.2.5.1.1" class="ltx_text"></span></span></span>
<span id="S3.I6" class="ltx_enumerate ltx_leftmargin_flush">
<span id="S3.I6.i1" class="ltx_item" style="list-style-type:none;"><span class="ltx_tag ltx_tag_item">1.</span> 
<span id="S3.I6.i1.p1" class="ltx_para ltx_noindent">
<span id="S3.I6.i1.p1.1" class="ltx_p"><span id="S3.I6.i1.p1.1.1" class="ltx_text ltx_font_bold" style="--ltx-fg-color:#000000;">Analysis</span><span id="S3.I6.i1.p1.1.2" class="ltx_text" style="--ltx-fg-color:#000000;">: [Always provide a step-by-step analysis here. First, briefly state the goal of the current reasoning chunk. Second, verify the logic, method, and any calculations against the problem’s requirements and the historical path. If an error is found, clearly explain the error and why it’s wrong. If the reasoning is correct, explain why it is a valid and logical step forward.]</span></span>
</span></span>
<span id="S3.I6.i2" class="ltx_item" style="list-style-type:none;"><span class="ltx_tag ltx_tag_item">2.</span> 
<span id="S3.I6.i2.p1" class="ltx_para">
<span id="S3.I6.i2.p1.1" class="ltx_p"><span id="S3.I6.i2.p1.1.1" class="ltx_text ltx_font_bold" style="--ltx-fg-color:#000000;">Final Judgment</span><span id="S3.I6.i2.p1.1.2" class="ltx_text" style="--ltx-fg-color:#000000;">: [Provide the final judgment within </span><span id="S3.I6.i2.p1.1.3" class="ltx_text ltx_font_typewriter" style="--ltx-fg-color:#000000;">\boxed{}</span><span id="S3.I6.i2.p1.1.4" class="ltx_text" style="--ltx-fg-color:#000000;">. Examples: </span><span id="S3.I6.i2.p1.1.5" class="ltx_text ltx_font_typewriter" style="--ltx-fg-color:#000000;">\boxed{Positive}</span><span id="S3.I6.i2.p1.1.6" class="ltx_text" style="--ltx-fg-color:#000000;"> or </span><span id="S3.I6.i2.p1.1.7" class="ltx_text ltx_font_typewriter" style="--ltx-fg-color:#000000;">\boxed{Negative}</span><span id="S3.I6.i2.p1.1.8" class="ltx_text" style="--ltx-fg-color:#000000;">.]</span></span>
</span></span>
</span>
</span></span></span></foreignobject></g></g></svg>