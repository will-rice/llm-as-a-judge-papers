</span></span></span></foreignobject></g><g fill-opacity="1.0" transform="matrix(1.0 0.0 0.0 1.0 10.58 12.65)"><foreignobject style="--ltx-fo-width:45.67em;--ltx-fo-height:7.81em;--ltx-fo-depth:0.25em;font-size:10pt;" class="ltx_minipage" height="111.54" overflow="visible" transform="matrix(1 0 0 -1 0 108.08)" width="43.5em"><span class="ltx_foreignobject_container"><span class="ltx_foreignobject_content"><pre id="A12.SS4.pic1.2" class="ltx_verbatim ltx_font_typewriter" style="--ltx-fg-color:#000000;">Evaluate the following summary of a news article
on four dimensions.
Rate EACH dimension from 1 (very poor) to 5
(excellent).

Source Article:
{source_text}

Summary to Evaluate:
{summary}

Dimensions:
- Coherence: Is the summary well-organized and
  easy to follow?
- Consistency: Does the summary accurately
  reflect the source article without
  contradictions?
- Fluency: Is the summary grammatically correct
  and well-written?
- Relevance: Does the summary capture the
  important information from the source?

Provide your ratings as:
\boxed{coherence=X, consistency=X, fluency=X,
relevance=X}
</pre></span></span></foreignobject></g></g></svg>