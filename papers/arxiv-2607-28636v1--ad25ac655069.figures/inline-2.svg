<svg id="A11.SS2.p5.pic1" class="ltx_picture" height="127.95" overflow="visible" version="1.1" viewbox="0 0 653.15 127.95" width="653.15"><g style="--ltx-stroke-color:#000000;--ltx-fill-color:#000000;" fill="#000000" stroke="#000000" stroke-width="0.4pt" transform="translate(0,127.95) matrix(1 0 0 -1 0 0)"><g style="--ltx-stroke-color:#808080;--ltx-fill-color:#808080;--ltx-fg-color:#808080;" color="#808080" fill="#808080" fill-opacity="0.5" stroke="#808080" stroke-opacity="0.5"><path style="stroke:none" d="M 3.54 2.86 L 3.54 118 C 3.54 121.54 6.41 124.41 9.94 124.41 L 650.29 124.41 C 653.83 124.41 656.69 121.54 656.69 118 L 656.69 2.86 C 656.69 -0.68 653.83 -3.54 650.29 -3.54 L 9.94 -3.54 C 6.41 -3.54 3.54 -0.68 3.54 2.86 Z" /></g><g style="--ltx-fill-color:#590000;" fill="#590000" fill-opacity="1.0"><path style="stroke:none" d="M 0 4.63 L 0 123.32 C 0 125.88 2.07 127.95 4.63 127.95 L 648.52 127.95 C 651.08 127.95 653.15 125.88 653.15 123.32 L 653.15 4.63 C 653.15 2.07 651.08 0 648.52 0 L 4.63 0 C 2.07 0 0 2.07 0 4.63 Z" /></g><g style="--ltx-fill-color:#FBFBFB;" fill="#FBFBFB" fill-opacity="1.0"><path style="stroke:none" d="M 0.69 4.63 L 0.69 123.32 C 0.69 125.49 2.45 127.26 4.63 127.26 L 648.52 127.26 C 650.7 127.26 652.46 125.49 652.46 123.32 L 652.46 4.63 C 652.46 2.45 650.7 0.69 648.52 0.69 L 4.63 0.69 C 2.45 0.69 0.69 2.45 0.69 4.63 Z" /></g><g fill-opacity="1.0" transform="matrix(1.0 0.0 0.0 1.0 11.55 13.62)"><foreignobject style="--ltx-fo-width:45.53em;--ltx-fo-height:7.53em;--ltx-fo-depth:0.25em;font-size:10pt;" height="107.62" overflow="visible" transform="matrix(1 0 0 -1 0 104.16)" width="630.01"><span class="ltx_foreignobject_container"><span class="ltx_foreignobject_content">
<span id="A11.SS2.p5.pic1.1" class="ltx_inline-block ltx_minipage ltx_align_bottom" style="width:45.53em;">
<span id="A11.SS2.p5.pic1.1.1" class="ltx_p"><span id="A11.SS2.p5.pic1.1.1.1" class="ltx_text ltx_font_italic" style="--ltx-fg-color:#000000;">“The song talks about oppression by monopolies and railroads. The term ‘hayseed’ refers to a farmer. The movement is likely the Populist Movement…<span id="A11.SS2.p5.pic1.1.1.1.1" class="ltx_text"></span></span></span>
<span id="A11.SS2.p5.pic1.1.2" class="ltx_p"><span id="A11.SS2.p5.pic1.1.2.1" class="ltx_text ltx_font_italic" style="--ltx-fg-color:#000000;">Looking at the options, the Populists did push for railroad regulation, so <span id="A11.SS2.p5.pic1.1.2.1.1" class="ltx_text" style="--ltx-bg-color:#DFEFE4;">A is a possible answer</span>… <span id="A11.SS2.p5.pic1.1.2.1.2" class="ltx_text" style="--ltx-bg-color:#F1E0DC;">The professor says F</span>, but Populists were more focused on economic issues like railroads, currency, and political reforms. Child labor was addressed later by Progressives, with laws like the Keating-Owen Act in 1916. So maybe the professor is incorrect. Alternatively, <span id="A11.SS2.p5.pic1.1.2.1.3" class="ltx_text" style="--ltx-bg-color:#F8EFCC;">maybe I’m missing something</span>…<span id="A11.SS2.p5.pic1.1.2.1.4" class="ltx_text"></span></span></span>
<span id="A11.SS2.p5.pic1.1.3" class="ltx_p"><span id="A11.SS2.p5.pic1.1.3.1" class="ltx_text ltx_font_italic" style="--ltx-fg-color:#000000;">the direct election of senators (H) was a key Populist achievement…”<span id="A11.SS2.p5.pic1.1.3.1.1" class="ltx_text"></span></span></span>
</span></span></span></foreignobject></g></g></svg>