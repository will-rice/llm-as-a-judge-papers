<svg id="A8.p2.pic1" class="ltx_picture" height="760.87" overflow="visible" version="1.1" viewbox="0 0 653.15 760.87" width="653.15"><g style="--ltx-stroke-color:#000000;--ltx-fill-color:#000000;" fill="#000000" stroke="#000000" stroke-width="0.4pt" transform="translate(0,760.87) matrix(1 0 0 -1 0 0)"><g style="--ltx-fill-color:#4D4D4D;" fill="#4D4D4D" fill-opacity="1.0"><path style="stroke:none" d="M 0 8.57 L 0 752.3 C 0 757.04 3.84 760.87 8.57 760.87 L 644.58 760.87 C 649.31 760.87 653.15 757.04 653.15 752.3 L 653.15 8.57 C 653.15 3.84 649.31 0 644.58 0 L 8.57 0 C 3.84 0 0 3.84 0 8.57 Z" /></g><g style="--ltx-fill-color:#FBFBFB;" fill="#FBFBFB" fill-opacity="1.0"><path style="stroke:none" d="M 0.69 8.57 L 0.69 733.35 L 652.46 733.35 L 652.46 8.57 C 652.46 4.22 648.93 0.69 644.58 0.69 L 8.57 0.69 C 4.22 0.69 0.69 4.22 0.69 8.57 Z" /></g><g fill-opacity="1.0" transform="matrix(1.0 0.0 0.0 1.0 11.76 743.65)"><foreignobject style="--ltx-fo-width:39.57em;--ltx-fo-height:0.69em;--ltx-fo-depth:0.19em;font-size:10pt;" height="12.3" overflow="visible" transform="matrix(1 0 0 -1 0 9.61)" width="547.54"><span class="ltx_foreignobject_container"><span class="ltx_foreignobject_content">
<span id="A8.p2.pic1.1" class="ltx_inline-block ltx_minipage ltx_align_bottom" style="width:39.57em;">
<span id="A8.p2.pic1.1.1" class="ltx_p"><span id="A8.p2.pic1.1.1.1" class="ltx_text ltx_font_bold" style="--ltx-fg-color:#FFFFFF;">A Case of Single Rating on Daily-MTD Dataset</span></span>
</span></span></span></foreignobject></g><g fill-opacity="1.0" transform="matrix(1.0 0.0 0.0 1.0 11.76 18.94)"><foreignobject style="--ltx-fo-width:45.5em;--ltx-fo-height:50.56em;--ltx-fo-depth:0.25em;font-size:10pt;" height="703.08" overflow="visible" transform="matrix(1 0 0 -1 0 699.62)" width="629.59"><span class="ltx_foreignobject_container"><span class="ltx_foreignobject_content"><span id="A8.p2.pic1.2" class="ltx_inline-logical-block ltx_minipage ltx_align_bottom" style="width:45.5em;">
<span id="A8.p2.pic1.p1" class="ltx_para ltx_noindent">
<span id="A8.p2.pic1.p1.1" class="ltx_p"><span id="A8.p2.pic1.p1.1.1" class="ltx_text ltx_font_bold" style="--ltx-fg-color:#000000;">Conversation:</span></span>
<span id="A8.I1" class="ltx_itemize">
<span id="A8.I1.i1" class="ltx_item" style="list-style-type:none;"><span class="ltx_tag ltx_tag_item">•</span> 
<span id="A8.I1.i1.p1" class="ltx_para">
<span id="A8.I1.i1.p1.1" class="ltx_p"><span id="A8.I1.i1.p1.1.1" class="ltx_text ltx_font_bold" style="--ltx-fg-color:#000000;">Human:</span><span id="A8.I1.i1.p1.1.2" class="ltx_text" style="--ltx-fg-color:#000000;"> Hi, can I ask you a question?</span></span>
<span id="A8.I1.i1.I1" class="ltx_itemize">
<span id="A8.I1.i1.I1.i1" class="ltx_item" style="list-style-type:none;"><span class="ltx_tag ltx_tag_item"><span id="A8.I1.i1.I1.i1.1" class="ltx_text ltx_font_bold">–</span></span> 
<span id="A8.I1.i1.I1.i1.p1" class="ltx_para">
<span id="A8.I1.i1.I1.i1.p1.1" class="ltx_p"><span id="A8.I1.i1.I1.i1.p1.1.1" class="ltx_text ltx_font_bold" style="--ltx-fg-color:#000000;">Assistant:</span><span id="A8.I1.i1.I1.i1.p1.1.2" class="ltx_text" style="--ltx-fg-color:#000000;"> Questions are often asked, and sometimes they can be interesting or not.</span></span>
</span></span>
</span>
</span></span>
<span id="A8.I1.i2" class="ltx_item" style="list-style-type:none;"><span class="ltx_tag ltx_tag_item">•</span> 
<span id="A8.I1.i2.p1" class="ltx_para">
<span id="A8.I1.i2.p1.1" class="ltx_p"><span id="A8.I1.i2.p1.1.1" class="ltx_text ltx_font_bold" style="--ltx-fg-color:#000000;">Human:</span><span id="A8.I1.i2.p1.1.2" class="ltx_text" style="--ltx-fg-color:#000000;"> I’d like to know how to prevent my computer from getting viruses.</span></span>
<span id="A8.I1.i2.I1" class="ltx_itemize">
<span id="A8.I1.i2.I1.i1" class="ltx_item" style="list-style-type:none;"><span class="ltx_tag ltx_tag_item"><span id="A8.I1.i2.I1.i1.1" class="ltx_text ltx_font_bold">–</span></span> 
<span id="A8.I1.i2.I1.i1.p1" class="ltx_para">
<span id="A8.I1.i2.I1.i1.p1.1" class="ltx_p"><span id="A8.I1.i2.I1.i1.p1.1.1" class="ltx_text ltx_font_bold" style="--ltx-fg-color:#000000;">Assistant:</span><span id="A8.I1.i2.I1.i1.p1.1.2" class="ltx_text" style="--ltx-fg-color:#000000;"> To prevent viruses, ensure your computer is running, and maybe check the lights. Sometimes, turning it off helps, but that might not be related to viruses.</span></span>
</span></span>
</span>
</span></span>
<span id="A8.I1.i3" class="ltx_item" style="list-style-type:none;"><span class="ltx_tag ltx_tag_item">•</span> 
<span id="A8.I1.i3.p1" class="ltx_para">
<span id="A8.I1.i3.p1.1" class="ltx_p"><span id="A8.I1.i3.p1.1.1" class="ltx_text ltx_font_bold" style="--ltx-fg-color:#000000;">Human:</span><span id="A8.I1.i3.p1.1.2" class="ltx_text" style="--ltx-fg-color:#000000;"> Sure, thanks for your suggestion!</span></span>
<span id="A8.I1.i3.I1" class="ltx_itemize">
<span id="A8.I1.i3.I1.i1" class="ltx_item" style="list-style-type:none;"><span class="ltx_tag ltx_tag_item"><span id="A8.I1.i3.I1.i1.1" class="ltx_text ltx_font_bold">–</span></span> 
<span id="A8.I1.i3.I1.i1.p1" class="ltx_para">
<span id="A8.I1.i3.I1.i1.p1.1" class="ltx_p"><span id="A8.I1.i3.I1.i1.p1.1.1" class="ltx_text ltx_font_bold" style="--ltx-fg-color:#000000;">Assistant:</span><span id="A8.I1.i3.I1.i1.p1.1.2" class="ltx_text" style="--ltx-fg-color:#000000;"> Suggestions are helpful sometimes, but other times they don’t really matter. It depends on the situation.</span></span>
</span></span>
</span>
</span></span>
</span>
</span>
<span id="A8.p2.pic1.p2" class="ltx_para ltx_noindent">
<span id="A8.p2.pic1.p2.1" class="ltx_p"><span id="A8.p2.pic1.p2.1.1" class="ltx_text ltx_font_bold" style="--ltx-fg-color:#000000;">Human Annotation</span><span id="A8.p2.pic1.p2.1.2" class="ltx_text" style="--ltx-fg-color:#000000;">: </span><span id="A8.p2.pic1.p2.1.3" class="ltx_text ltx_font_bold" style="--ltx-fg-color:#000000;">3.0</span></span>
</span>
<span id="A8.p2.pic1.p3" class="ltx_para ltx_noindent">
<span id="A8.p2.pic1.p3.1" class="ltx_p"><span id="A8.p2.pic1.p3.1.1" class="ltx_text ltx_font_bold" style="--ltx-fg-color:#000000;">Response of Claude-3.7-Sonnet:</span><span id="A8.p2.pic1.p3.1.2" class="ltx_text" style="--ltx-fg-color:#000000;"> {Rating: </span><span id="A8.p2.pic1.p3.1.3" class="ltx_text ltx_font_bold" style="--ltx-fg-color:#000000;">2</span><span id="A8.p2.pic1.p3.1.4" class="ltx_text" style="--ltx-fg-color:#000000;">}. The assistant gives irrelevant and incorrect advice about computer virus prevention and lack accuracy, relevance, and conversational engagement, failing to address the user’s real cybersecurity concerns. The low score reflects poor performance, especially in providing safe and useful guidance on a critical topic.</span></span>
</span>
<span id="A8.p2.pic1.p4" class="ltx_para ltx_noindent">
<span id="A8.p2.pic1.p4.1" class="ltx_p"><span id="A8.p2.pic1.p4.1.1" class="ltx_text ltx_font_bold" style="--ltx-fg-color:#000000;">Response of Qwen2.5-7B-Instruct:</span><span id="A8.p2.pic1.p4.1.2" class="ltx_text" style="--ltx-fg-color:#000000;"> {Rating: </span><span id="A8.p2.pic1.p4.1.3" class="ltx_text ltx_font_bold" style="--ltx-fg-color:#000000;">5</span><span id="A8.p2.pic1.p4.1.4" class="ltx_text" style="--ltx-fg-color:#000000;">}. The assistant meets some standards, but there are still significant deficiencies overall. The assistant’s response lacks accuracy and relevance in addressing the human’s question about preventing computer viruses. Instead of providing useful advice such as keeping software updated, using antivirus software, and avoiding suspicious websites, the assistant gives vague and unrelated suggestions. The assistant also fails to maintain a conversational and interactive tone, and does not show personalization or creativity in the response.</span></span>
</span>
<span id="A8.p2.pic1.p5" class="ltx_para ltx_noindent">
<span id="A8.p2.pic1.p5.1" class="ltx_p"><span id="A8.p2.pic1.p5.1.1" class="ltx_text ltx_font_bold" style="--ltx-fg-color:#000000;">Score of <span id="A8.p2.pic1.p5.1.1.1" class="ltx_text ltx_font_typewriter">MTDEval</span>:</span><span id="A8.p2.pic1.p5.1.2" class="ltx_text" style="--ltx-fg-color:#000000;"> </span><span id="A8.p2.pic1.p5.1.3" class="ltx_text ltx_font_bold" style="--ltx-fg-color:#000000;">0.326</span><span id="A8.p2.pic1.p5.1.4" class="ltx_text" style="--ltx-fg-color:#000000;"> (Our model directly outputs a dialogue quality score and normalizes it to the [0, 1] range. Compared to other models (Claude-3.7-Sonnet, Qwen2.5-7B-Instruct, etc.), </span><span id="A8.p2.pic1.p5.1.5" class="ltx_text ltx_font_typewriter" style="--ltx-fg-color:#000000;">MTDEval</span><span id="A8.p2.pic1.p5.1.6" class="ltx_text" style="--ltx-fg-color:#000000;">’s predictions are closer to human ratings.)</span></span>
</span></span></span></span></foreignobject></g></g></svg>