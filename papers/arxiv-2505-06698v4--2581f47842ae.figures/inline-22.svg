<span id="A3.I2.i1.I1.i3.p1.1" class="ltx_p"><span id="A3.I2.i1.I1.i3.p1.1.1" class="ltx_text" style="--ltx-fg-color:#000000;">3 = Both inadequate</span></span>
</span></span>
