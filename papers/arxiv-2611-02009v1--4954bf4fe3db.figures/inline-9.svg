<span id="A3.SS3.p2.pic1.1.1" class="ltx_p"><span id="A3.SS3.p2.pic1.1.1.1" class="ltx_text ltx_font_bold" style="--ltx-fg-color:#FFFFFF;">Prompt for Reasoning Trace Generation</span></span>
</span></span></span></foreignobject></g><g fill-opacity="1.0" transform="matrix(1.0 0.0 0.0 1.0 10.16 10.16)"><foreignobject style="--ltx-fo-width:43.55em;--ltx-fo-height:42.61em;--ltx-fo-depth:0em;font-size:10pt;" height="589.62" overflow="visible" transform="matrix(1 0 0 -1 0 589.62)" width="602.61"><span class="ltx_foreignobject_container"><span class="ltx_foreignobject_content">
<span id="A3.SS3.p2.pic1.2" class="ltx_inline-block ltx_minipage ltx_align_bottom" style="width:43.55em;">
<span id="A3.SS3.p2.pic1.2.1" class="ltx_p"><span id="A3.SS3.p2.pic1.2.1.1" class="ltx_text ltx_font_typewriter" style="--ltx-fg-color:#000000;">You are a multilingual translation expert for Xiaohongshu-style social
media content.
</span></span>
<span id="A3.SS3.p2.pic1.2.2" class="ltx_p"><span id="A3.SS3.p2.pic1.2.2.1" class="ltx_text ltx_font_typewriter" style="--ltx-fg-color:#000000;">Given the context, source text, and reference translation, identify the
key translation points that are necessary to produce a translation
like the reference.
</span></span>
<span id="A3.SS3.p2.pic1.2.3" class="ltx_p"><span id="A3.SS3.p2.pic1.2.3.1" class="ltx_text ltx_font_typewriter" style="--ltx-fg-color:#000000;">First, identify important words or phrases directly from the
<span id="A3.SS3.p2.pic1.2.3.1.1" class="ltx_text ltx_font_bold">source text</span>, and then briefly explain their meanings or the
main considerations for translating them.
</span></span>
<span id="A3.SS3.p2.pic1.2.4" class="ltx_p"><span id="A3.SS3.p2.pic1.2.4.1" class="ltx_text ltx_font_typewriter" style="--ltx-fg-color:#000000;">Keep the analysis concise and direct.
</span></span>
<span id="A3.SS3.p2.pic1.2.5" class="ltx_p"><span id="A3.SS3.p2.pic1.2.5.1" class="ltx_text ltx_font_typewriter" style="--ltx-fg-color:#000000;">Example:
</span></span>
<span id="A3.SS3.p2.pic1.2.6" class="ltx_p"><span id="A3.SS3.p2.pic1.2.6.1" class="ltx_text ltx_font_typewriter" style="--ltx-fg-color:#000000;">Context:
None
</span></span>
<span id="A3.SS3.p2.pic1.2.7" class="ltx_p"><span id="A3.SS3.p2.pic1.2.7.1" class="ltx_text ltx_font_typewriter" style="--ltx-fg-color:#000000;">Source:
</span></span>
<span id="A3.SS3.p2.pic1.2.8" class="ltx_p"><span id="A3.SS3.p2.pic1.2.8.1" class="ltx_text ltx_font_typewriter" style="--ltx-fg-color:#000000;">真的是自嗨的剧情，不好看。 这不是高智商，这是走到哪里都有神助的玛丽苏
</span></span>
<span id="A3.SS3.p2.pic1.2.9" class="ltx_p"><span id="A3.SS3.p2.pic1.2.9.1" class="ltx_text ltx_font_typewriter" style="--ltx-fg-color:#000000;">Translation:
The plot is truly self-indulgent and unengaging; this isn’t a display
of high intelligence but a Mary Sue story where the protagonist is
divinely favored and effortlessly succeeds wherever she goes.
</span></span>
<span id="A3.SS3.p2.pic1.2.10" class="ltx_p"><span id="A3.SS3.p2.pic1.2.10.1" class="ltx_text ltx_font_typewriter" style="--ltx-fg-color:#000000;">Translation Points:
</span></span>
<span id="A3.SS3.p2.pic1.2.11" class="ltx_p"><span id="A3.SS3.p2.pic1.2.11.1" class="ltx_text ltx_font_typewriter" style="--ltx-fg-color:#000000;">Pay attention to the following points when translating:
</span></span>
<span id="A3.SS3.p2.pic1.2.12" class="ltx_p"><span id="A3.SS3.p2.pic1.2.12.1" class="ltx_text ltx_font_typewriter" style="--ltx-fg-color:#000000;">1. ‘‘</span></span>
<span id="A3.SS3.p2.pic1.2.13" class="ltx_p"><span id="A3.SS3.p2.pic1.2.13.1" class="ltx_text ltx_font_typewriter" style="--ltx-fg-color:#000000;">自嗨’’ refers to a plot that is immersed in the creator’s own
self-satisfaction while ignoring the audience’s perspective; it can be
rendered as ‘‘self-indulgent plot.’’
</span></span>
<span id="A3.SS3.p2.pic1.2.14" class="ltx_p"><span id="A3.SS3.p2.pic1.2.14.1" class="ltx_text ltx_font_typewriter" style="--ltx-fg-color:#000000;">2. ‘‘</span></span>
<span id="A3.SS3.p2.pic1.2.15" class="ltx_p"><span id="A3.SS3.p2.pic1.2.15.1" class="ltx_text ltx_font_typewriter" style="--ltx-fg-color:#000000;">高智商’’ here refers to either a plot that requires logical
reasoning from the audience or characters whose actions demonstrate
intelligence.
</span></span>
<span id="A3.SS3.p2.pic1.2.16" class="ltx_p"><span id="A3.SS3.p2.pic1.2.16.1" class="ltx_text ltx_font_typewriter" style="--ltx-fg-color:#000000;">3. ‘‘</span></span>
<span id="A3.SS3.p2.pic1.2.17" class="ltx_p"><span id="A3.SS3.p2.pic1.2.17.1" class="ltx_text ltx_font_typewriter" style="--ltx-fg-color:#000000;">神助’’ refers to the protagonist repeatedly receiving convenient
external help whenever difficulties arise.
</span></span>
<span id="A3.SS3.p2.pic1.2.18" class="ltx_p"><span id="A3.SS3.p2.pic1.2.18.1" class="ltx_text ltx_font_typewriter" style="--ltx-fg-color:#000000;">4. ‘‘</span></span>
<span id="A3.SS3.p2.pic1.2.19" class="ltx_p"><span id="A3.SS3.p2.pic1.2.19.1" class="ltx_text ltx_font_typewriter" style="--ltx-fg-color:#000000;">玛丽苏’’ comes from the literary term ‘‘Mary Sue’’ and refers to
an unrealistically favored protagonist who seems to have a built-in
advantage or halo.
</span></span>
<span id="A3.SS3.p2.pic1.2.20" class="ltx_p"><span id="A3.SS3.p2.pic1.2.20.1" class="ltx_text ltx_font_typewriter" style="--ltx-fg-color:#000000;">Context:
{context}
</span></span>
<span id="A3.SS3.p2.pic1.2.21" class="ltx_p"><span id="A3.SS3.p2.pic1.2.21.1" class="ltx_text ltx_font_typewriter" style="--ltx-fg-color:#000000;">Source:
{content_zh}
</span></span>
<span id="A3.SS3.p2.pic1.2.22" class="ltx_p"><span id="A3.SS3.p2.pic1.2.22.1" class="ltx_text ltx_font_typewriter" style="--ltx-fg-color:#000000;">Translation:
{trans_en}
</span></span>
