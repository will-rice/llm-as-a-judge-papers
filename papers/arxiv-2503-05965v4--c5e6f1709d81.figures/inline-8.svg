<svg id="A4.F26.p1.pic1" class="ltx_picture" height="625.51" overflow="visible" version="1.1" viewbox="0 0 477.38 625.51" width="477.38"><g style="--ltx-stroke-color:#000000;--ltx-fill-color:#000000;" fill="#000000" stroke="#000000" stroke-width="0.4pt" transform="translate(0,625.51) matrix(1 0 0 -1 0 0)"><g style="--ltx-fill-color:#404040;" fill="#404040" fill-opacity="1.0"><path style="stroke:none" d="M 0 5.91 L 0 619.61 C 0 622.87 2.64 625.51 5.91 625.51 L 471.47 625.51 C 474.73 625.51 477.38 622.87 477.38 619.61 L 477.38 5.91 C 477.38 2.64 474.73 0 471.47 0 L 5.91 0 C 2.64 0 0 2.64 0 5.91 Z" /></g><g style="--ltx-fill-color:#F2F2F2;" fill="#F2F2F2" fill-opacity="1.0"><path style="stroke:none" d="M 1.97 5.91 L 1.97 599.86 L 475.41 599.86 L 475.41 5.91 C 475.41 3.73 473.65 1.97 471.47 1.97 L 5.91 1.97 C 3.73 1.97 1.97 3.73 1.97 5.91 Z" /></g><g fill-opacity="1.0" transform="matrix(1.0 0.0 0.0 1.0 21.65 609.23)"><foreignobject style="--ltx-fo-width:31.37em;--ltx-fo-height:0.75em;--ltx-fo-depth:0.25em;font-size:10pt;" height="13.84" overflow="visible" transform="matrix(1 0 0 -1 0 10.38)" width="434.07"><span class="ltx_foreignobject_container"><span class="ltx_foreignobject_content">
<span id="A4.F26.p1.pic1.1" class="ltx_inline-block ltx_minipage ltx_align_bottom" style="width:31.37em;">
<span id="A4.F26.p1.pic1.1.1" class="ltx_p"><span id="A4.F26.p1.pic1.1.1.1" class="ltx_text" style="--ltx-fg-color:#FFFFFF;">Response Set (RS) Rating Instructions - AlphaNLI</span></span>
</span></span></span></foreignobject></g><g fill-opacity="1.0" transform="matrix(1.0 0.0 0.0 1.0 21.65 174.21)"><foreignobject style="--ltx-fo-width:31.37em;--ltx-fo-height:29.91em;--ltx-fo-depth:11.59em;font-size:10pt;" height="574.28" overflow="visible" transform="matrix(1 0 0 -1 0 413.85)" width="434.07"><span class="ltx_foreignobject_container"><span class="ltx_foreignobject_content">
<span id="A4.F26.p1.pic1.2" class="ltx_inline-block ltx_minipage ltx_align_bottom" style="width:31.37em;">
<span id="A4.F26.p1.pic1.2.1" class="ltx_p"><span id="A4.F26.p1.pic1.2.1.1" class="ltx_text" style="--ltx-fg-color:#000000;">Given two observations (O-Beginning and O-Ending), and two hypotheses
(H1 and H2), your goal is to choose the hypotheses that are likely
to cause O-Beginning to turn into O-Ending.
An automatic detector will estimate your annotation accuracy on this task. If
your estimated accuracy is too low, you might be disqualified.</span></span>
<span id="A4.F26.p1.pic1.2.2" class="ltx_p"><span id="A4.F26.p1.pic1.2.2.1" class="ltx_text ltx_font_bold" style="--ltx-fg-color:#000000;">EXAMPLES:
<br class="ltx_break"><span id="A4.F26.p1.pic1.2.2.1.1" class="ltx_text ltx_font_medium">O-Beginning: Jenny cleaned her house and went to work, leaving the window just a crack open.
<br class="ltx_break">H1: A thief broke into the house by pulling open the window.
<br class="ltx_break">H2: Her husband went home and close the window.
<br class="ltx_break">O-Ending: When Jenny returned home she saw that her house was a mess.
<br class="ltx_break">Answer: H1.</span></span></span>
<span id="A4.F26.p1.pic1.2.3" class="ltx_p"><span id="A4.F26.p1.pic1.2.3.1" class="ltx_text" style="--ltx-fg-color:#000000;">Now provide a response to the following example:
<br class="ltx_break">O-Beginning: “{o_beginning}”
<br class="ltx_break">H1: “{H1}”
<br class="ltx_break">H2: “{H2}”
<br class="ltx_break">O-Ending: “{o_ending}”</span></span>
<span id="A4.F26.p1.pic1.2.4" class="ltx_p"><span id="A4.F26.p1.pic1.2.4.1" class="ltx_text" style="--ltx-fg-color:#000000;">Select ALL options that could reasonably apply:</span></span>
<span id="A4.I18" class="ltx_itemize">
<span id="A4.I18.ix1" class="ltx_item" style="list-style-type:none;"><span class="ltx_tag ltx_tag_item">A.</span> 
<span id="A4.I18.ix1.p1" class="ltx_para">
<span id="A4.I18.ix1.p1.1" class="ltx_p"><span id="A4.I18.ix1.p1.1.1" class="ltx_text" style="--ltx-fg-color:#000000;">H1</span></span>
</span></span>
<span id="A4.I18.ix2" class="ltx_item" style="list-style-type:none;"><span class="ltx_tag ltx_tag_item">B.</span> 
<span id="A4.I18.ix2.p1" class="ltx_para">
<span id="A4.I18.ix2.p1.1" class="ltx_p"><span id="A4.I18.ix2.p1.1.1" class="ltx_text" style="--ltx-fg-color:#000000;">H2</span></span>
</span></span>
</span>
<span id="A4.F26.p1.pic1.2.5" class="ltx_p"><span id="A4.F26.p1.pic1.2.5.1" class="ltx_text ltx_font_bold" style="--ltx-fg-color:#000000;">RESPONSE FORMAT:<span id="A4.F26.p1.pic1.2.5.1.1" class="ltx_text"></span></span></span>
<span id="A4.I19" class="ltx_itemize">
<span id="A4.I19.i1" class="ltx_item" style="list-style-type:none;"><span class="ltx_tag ltx_tag_item">•</span> 
<span id="A4.I19.i1.p1" class="ltx_para">
<span id="A4.I19.i1.p1.1" class="ltx_p"><span id="A4.I19.i1.p1.1.1" class="ltx_text" style="--ltx-fg-color:#000000;">Provide only the sequence of letters corresponding to response options (e.g., “AB” or “A”)</span></span>
</span></span>
<span id="A4.I19.i2" class="ltx_item" style="list-style-type:none;"><span class="ltx_tag ltx_tag_item">•</span> 
<span id="A4.I19.i2.p1" class="ltx_para">
<span id="A4.I19.i2.p1.1" class="ltx_p"><span id="A4.I19.i2.p1.1.1" class="ltx_text" style="--ltx-fg-color:#000000;">Use only letters A or B</span></span>
</span></span>
<span id="A4.I19.i3" class="ltx_item" style="list-style-type:none;"><span class="ltx_tag ltx_tag_item">•</span> 
<span id="A4.I19.i3.p1" class="ltx_para">
<span id="A4.I19.i3.p1.1" class="ltx_p"><span id="A4.I19.i3.p1.1.1" class="ltx_text" style="--ltx-fg-color:#000000;">No spaces, punctuation, or other characters</span></span>
</span></span>
<span id="A4.I19.i4" class="ltx_item" style="list-style-type:none;"><span class="ltx_tag ltx_tag_item">•</span> 
<span id="A4.I19.i4.p1" class="ltx_para">
<span id="A4.I19.i4.p1.1" class="ltx_p"><span id="A4.I19.i4.p1.1.1" class="ltx_text" style="--ltx-fg-color:#000000;">Do not provide the same letter more than once (e.g., “AA” or “BB”, or “B_” are invalid responses)</span></span>
</span></span>
<span id="A4.I19.i5" class="ltx_item" style="list-style-type:none;"><span class="ltx_tag ltx_tag_item">•</span> 
<span id="A4.I19.i5.p1" class="ltx_para">
<span id="A4.I19.i5.p1.1" class="ltx_p"><span id="A4.I19.i5.p1.1.1" class="ltx_text" style="--ltx-fg-color:#000000;">No explanations</span></span>
</span></span>
</span>
</span></span></span></foreignobject></g></g></svg>