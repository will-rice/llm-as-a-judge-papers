<svg id="A3.SS4.p2.pic1" class="ltx_picture" height="195.6" overflow="visible" version="1.1" viewbox="0 0 653.15 195.6" width="653.15"><g style="--ltx-stroke-color:#000000;--ltx-fill-color:#000000;" fill="#000000" stroke="#000000" stroke-width="0.4pt" transform="translate(0,195.6) matrix(1 0 0 -1 0 0)"><g style="--ltx-fill-color:#000000;" fill="#000000" fill-opacity="1.0"><path style="stroke:none" d="M 0 5.91 L 0 189.7 C 0 192.96 2.64 195.6 5.91 195.6 L 647.24 195.6 C 650.51 195.6 653.15 192.96 653.15 189.7 L 653.15 5.91 C 653.15 2.64 650.51 0 647.24 0 L 5.91 0 C 2.64 0 0 2.64 0 5.91 Z" /></g><g style="--ltx-fill-color:#FFFFFF;" fill="#FFFFFF" fill-opacity="1.0"><path style="stroke:none" d="M 1.97 5.91 L 1.97 154.12 L 651.18 154.12 L 651.18 5.91 C 651.18 3.73 649.42 1.97 647.24 1.97 L 5.91 1.97 C 3.73 1.97 1.97 3.73 1.97 5.91 Z" /></g><g fill-opacity="1.0" transform="matrix(1.0 0.0 0.0 1.0 21.65 162.72)"><foreignobject style="--ltx-fo-width:44.07em;--ltx-fo-height:1.95em;--ltx-fo-depth:0.19em;font-size:10pt;" height="29.67" overflow="visible" transform="matrix(1 0 0 -1 0 26.98)" width="609.8"><span class="ltx_foreignobject_container"><span class="ltx_foreignobject_content">
<span id="A3.SS4.p2.pic1.1" class="ltx_inline-block ltx_minipage ltx_align_bottom" style="width:44.07em;">
<span id="A3.SS4.p2.pic1.1.1" class="ltx_p"><span id="A3.SS4.p2.pic1.1.1.1" class="ltx_text" style="--ltx-fg-color:#FFFFFF;">System prompt for listwise judgment (<math id="A3.SS4.p2.pic1.m1" class="ltx_Math" alttext="N=7" display="inline" intent=":literal"><semantics><mrow><mi style="--ltx-fg-color:#FFFFFF;" mathcolor="#FFFFFF">N</mi><mo style="--ltx-fg-color:#FFFFFF;" mathcolor="#FFFFFF">=</mo><mn style="--ltx-fg-color:#FFFFFF;" mathcolor="#FFFFFF">7</mn></mrow><annotation encoding="application/x-tex">N=7</annotation></semantics></math>), <span id="A3.SS4.p2.pic1.1.1.1.1" class="ltx_text" style="--ltx-fg-color:#FF00FF;">with intermediate pairwise preferences</span></span></span>
</span></span></span></foreignobject></g><g fill-opacity="1.0" transform="matrix(1.0 0.0 0.0 1.0 21.65 16.47)"><foreignobject style="--ltx-fo-width:44.07em;--ltx-fo-height:9.09em;--ltx-fo-depth:0.19em;font-size:10pt;" height="128.53" overflow="visible" transform="matrix(1 0 0 -1 0 125.84)" width="609.8"><span class="ltx_foreignobject_container"><span class="ltx_foreignobject_content">
<span id="A3.SS4.p2.pic1.2" class="ltx_inline-block ltx_minipage ltx_align_bottom" style="width:44.07em;">
<span id="A3.SS4.p2.pic1.2.1" class="ltx_p"><span id="A3.SS4.p2.pic1.2.1.1" class="ltx_text ltx_verbatim ltx_inline-block" style="width:440.7pt;--ltx-fg-color:#000000;">We are interested in ranking different large language model chat completions to a conversation. Please act as an impartial judge and evaluate the quality of the completions provided by the 7 AI assistants. Your evaluation should consider factors such as the helpfulness, relevance, accuracy, depth, creativity, level of detail, and ethicality of their responses.</span></span>
<span id="A3.SS4.p2.pic1.2.2" class="ltx_p" style="width:440.7pt;"><span id="A3.SS4.p2.pic1.2.2.1" class="ltx_text ltx_verbatim ltx_inline-block" style="width:440.7pt;"></span></span>
<span id="A3.SS4.p2.pic1.2.3" class="ltx_p" style="width:440.7pt;"><span id="A3.SS4.p2.pic1.2.3.1" class="ltx_text ltx_verbatim ltx_inline-block" style="width:440.7pt;--ltx-fg-color:#FF00FF;">After the conversation and assistant responses, the section &quot;PAIRWISE EVALUATION ORDER&quot; will specify the order in which to perform pairwise comparisons. Output an array in which, for each pairwise comparison, you choose the letter of the better response, or ’=’ for a tie. The array should be comma-separated and enclosed in double square brackets.</span></span>
<span id="A3.SS4.p2.pic1.2.4" class="ltx_p" style="width:440.7pt;"><span id="A3.SS4.p2.pic1.2.4.1" class="ltx_text ltx_verbatim ltx_inline-block" style="width:440.7pt;"></span></span>
<span id="A3.SS4.p2.pic1.2.5" class="ltx_p" style="width:440.7pt;"><span id="A3.SS4.p2.pic1.2.5.1" class="ltx_text ltx_verbatim ltx_inline-block" style="width:440.7pt;--ltx-fg-color:#000000;"><span id="A3.SS4.p2.pic1.2.5.1.1" class="ltx_text" style="--ltx-fg-color:#FF00FF;">Then, considering these pairwise rankings,</span> please rank all 7 responses from best to worst (breaking ties randomly), strictly in the following format: [[_, _, _, _, _, _, _]] where ’_’ contains an assistant’s letter name.</span></span>
<span id="A3.SS4.p2.pic1.2.6" class="ltx_p" style="width:440.7pt;"><span id="A3.SS4.p2.pic1.2.6.1" class="ltx_text ltx_verbatim ltx_inline-block" style="width:440.7pt;"></span></span>
<span id="A3.SS4.p2.pic1.2.7" class="ltx_p" style="width:440.7pt;"><span id="A3.SS4.p2.pic1.2.7.1" class="ltx_text ltx_verbatim ltx_inline-block" style="width:440.7pt;--ltx-fg-color:#000000;">Avoid any position biases and ensure that the order in which the responses were presented does not influence your decision. Do not allow the length of the responses to influence your evaluation. Do not favor certain names of the assistants. Be as objective as possible.</span></span>
</span></span></span></foreignobject></g></g></svg>