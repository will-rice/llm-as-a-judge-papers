<svg id="A1.F6.p2.pic1" class="ltx_picture" height="802.26" overflow="visible" version="1.1" viewbox="0 0 201.58 802.26" width="201.58"><g style="--ltx-stroke-color:#000000;--ltx-fill-color:#000000;" fill="#000000" stroke="#000000" stroke-width="0.4pt" transform="translate(0,802.26) matrix(1 0 0 -1 0 0)"><g style="--ltx-fill-color:#404040;" fill="#404040" fill-opacity="1.0"><path style="stroke:none" d="M 0 5.91 L 0 796.36 C 0 799.62 2.64 802.26 5.91 802.26 L 195.67 802.26 C 198.94 802.26 201.58 799.62 201.58 796.36 L 201.58 5.91 C 201.58 2.64 198.94 0 195.67 0 L 5.91 0 C 2.64 0 0 2.64 0 5.91 Z" /></g><g style="--ltx-fill-color:#F9F9F9;" fill="#F9F9F9" fill-opacity="1.0"><path style="stroke:none" d="M 1.97 5.91 L 1.97 796.36 C 1.97 798.53 3.73 800.29 5.91 800.29 L 195.67 800.29 C 197.85 800.29 199.61 798.53 199.61 796.36 L 199.61 5.91 C 199.61 3.73 197.85 1.97 195.67 1.97 L 5.91 1.97 C 3.73 1.97 1.97 3.73 1.97 5.91 Z" /></g><g fill-opacity="1.0" transform="matrix(1.0 0.0 0.0 1.0 7.29 -108.67)"><foreignobject style="--ltx-fo-width:16.95em;--ltx-fo-height:73.69em;--ltx-fo-depth:0em;font-size:10pt;" height="1019.61" overflow="visible" transform="matrix(1 0 0 -1 0 1019.61)" width="234.54"><span class="ltx_foreignobject_container"><span class="ltx_foreignobject_content">
<span id="A1.F6.p2.pic1.1" class="ltx_inline-block ltx_minipage ltx_align_bottom" style="width:16.95em;">
<span id="A1.F6.p2.pic1.1.1" class="ltx_p"><span id="A1.F6.p2.pic1.1.1.1" class="ltx_text" style="font-size:70%;--ltx-fg-color:#000000;">You will be given one summary written for a news article.</span></span>
<span id="A1.F6.p2.pic1.1.2" class="ltx_p"><span id="A1.F6.p2.pic1.1.2.1" class="ltx_text" style="font-size:70%;--ltx-fg-color:#000000;">Your task is to rate the summary on one metric.</span></span>
<span id="A1.F6.p2.pic1.1.3" class="ltx_p"><span id="A1.F6.p2.pic1.1.3.1" class="ltx_text" style="font-size:70%;--ltx-fg-color:#000000;">Please make sure you read and understand these instructions carefully. Please keep this document open while reviewing, and refer to it as needed.</span></span>
<span id="A1.F6.p2.pic1.1.4" class="ltx_p"><span id="A1.F6.p2.pic1.1.4.1" class="ltx_text" style="font-size:70%;--ltx-fg-color:#000000;">Evaluation Criteria:</span></span>
<span id="A1.F6.p2.pic1.1.5" class="ltx_p"><span id="A1.F6.p2.pic1.1.5.1" class="ltx_text" style="font-size:70%;--ltx-fg-color:#000000;">Coherence (1-5) - the collective quality of all sentences. We align this dimension with the DUC quality question of structure and coherence whereby &quot;the summary should be well-structured and well-organised. The summary should not just be a heap of related information, but should build from sentence to a coherent body of information about a topic.&quot;</span></span>
<span id="A1.F6.p2.pic1.1.6" class="ltx_p"><span id="A1.F6.p2.pic1.1.6.1" class="ltx_text" style="font-size:70%;--ltx-fg-color:#000000;">Consistency (1-5) - the factual alignment between the summary and the summarised source. A factually consistent summary contains only statements that are entailed by the source document. Annotators were also asked to penalise summaries that contained hallucinated facts.</span></span>
<span id="A1.F6.p2.pic1.1.7" class="ltx_p"><span id="A1.F6.p2.pic1.1.7.1" class="ltx_text" style="font-size:70%;--ltx-fg-color:#000000;">Fluency (1-5): the quality of the summary in terms of grammar, spelling, punctuation, word choice, and sentence structure.</span></span>
<span id="A1.F6.p2.pic1.1.8" class="ltx_p"><span id="A1.F6.p2.pic1.1.8.1" class="ltx_text" style="font-size:70%;--ltx-fg-color:#000000;">Relevance (1-5) - selection of important content from the source. The summary should include only important information from the source document. Annotators were instructed to penalise summaries which contained redundancies and excess information.</span></span>
<span id="A1.F6.p2.pic1.1.9" class="ltx_p"><span id="A1.F6.p2.pic1.1.9.1" class="ltx_text" style="font-size:70%;--ltx-fg-color:#000000;">Evaluation Steps:</span></span>
<span id="A1.F6.p2.pic1.1.10" class="ltx_p"><span id="A1.F6.p2.pic1.1.10.1" class="ltx_text" style="font-size:70%;--ltx-fg-color:#000000;">1. Read the news article carefully and identify the main topic and key points.
<br class="ltx_break">2. Read the summary and compare it to the news article. Check if the summary covers the main topic and key points of the news article, and if it presents them in a clear and logical order.
<br class="ltx_break">3. Assign scores on a scale of 1 to 5, where 1 is the lowest and 5 is the highest based on the Evaluation Criteria.</span></span>
<span id="A1.F6.p2.pic1.1.11" class="ltx_p"><span id="A1.F6.p2.pic1.1.11.1" class="ltx_text" style="font-size:70%;--ltx-fg-color:#000000;">Please evaluate the following summary:
Source Text:</span></span>
<span id="A1.F6.p2.pic1.1.12" class="ltx_p"><span id="A1.F6.p2.pic1.1.12.1" class="ltx_text" style="font-size:70%;--ltx-fg-color:#000000;">{article}</span></span>
<span id="A1.F6.p2.pic1.1.13" class="ltx_p"><span id="A1.F6.p2.pic1.1.13.1" class="ltx_text" style="font-size:70%;--ltx-fg-color:#000000;">Summary:</span></span>
<span id="A1.F6.p2.pic1.1.14" class="ltx_p"><span id="A1.F6.p2.pic1.1.14.1" class="ltx_text" style="font-size:70%;--ltx-fg-color:#000000;">{summary}</span></span>
<span id="A1.F6.p2.pic1.1.15" class="ltx_p"><span id="A1.F6.p2.pic1.1.15.1" class="ltx_text" style="font-size:70%;--ltx-fg-color:#000000;">Evaluation Form (scores ONLY):</span></span>
<span id="A1.F6.p2.pic1.1.16" class="ltx_p"><span id="A1.F6.p2.pic1.1.16.1" class="ltx_text" style="font-size:70%;--ltx-fg-color:#000000;">- Coherence:
<br class="ltx_break">- Consistency:
<br class="ltx_break">- Fluency:
<br class="ltx_break">- Relevance:
<br class="ltx_break"></span></span>
</span></span></span></foreignobject></g></g></svg>