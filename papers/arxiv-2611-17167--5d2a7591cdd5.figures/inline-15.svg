<span id="A2.SS2.SSS1.Px2.p4.pic1.2.1" class="ltx_p"><span id="A2.SS2.SSS1.Px2.p4.pic1.2.1.1" class="ltx_text" style="font-size:90%;--ltx-fg-color:#000000;">Steps remaining before max_steps: {remaining_steps} (including the current action).</span></span>
<span id="A2.SS2.SSS1.Px2.p4.pic1.2.2" class="ltx_p"><span id="A2.SS2.SSS1.Px2.p4.pic1.2.2.1" class="ltx_text" style="font-size:90%;--ltx-fg-color:#000000;">Question: What is the probability that the task will be completed within the remaining step budget if this action is executed first and the same agent policy then continues? Estimate the success probability conditioned on this action, not the probability of choosing the action. The remaining step budget includes the current action.</span></span>
