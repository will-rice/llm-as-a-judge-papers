<svg id="A4.F29.p2.pic1" class="ltx_picture" height="591.23" overflow="visible" version="1.1" viewbox="0 0 477.38 591.23" width="477.38"><g style="--ltx-stroke-color:#000000;--ltx-fill-color:#000000;" fill="#000000" stroke="#000000" stroke-width="0.4pt" transform="translate(0,591.23) matrix(1 0 0 -1 0 0)"><g style="--ltx-fill-color:#404040;" fill="#404040" fill-opacity="1.0"><path style="stroke:none" d="M 0 5.91 L 0 585.32 C 0 588.58 2.64 591.23 5.91 591.23 L 471.47 591.23 C 474.73 591.23 477.38 588.58 477.38 585.32 L 477.38 5.91 C 477.38 2.64 474.73 0 471.47 0 L 5.91 0 C 2.64 0 0 2.64 0 5.91 Z" /></g><g style="--ltx-fill-color:#F2F2F2;" fill="#F2F2F2" fill-opacity="1.0"><path style="stroke:none" d="M 1.97 5.91 L 1.97 565.58 L 475.41 565.58 L 475.41 5.91 C 475.41 3.73 473.65 1.97 471.47 1.97 L 5.91 1.97 C 3.73 1.97 1.97 3.73 1.97 5.91 Z" /></g><g fill-opacity="1.0" transform="matrix(1.0 0.0 0.0 1.0 21.65 574.94)"><foreignobject style="--ltx-fo-width:31.37em;--ltx-fo-height:0.75em;--ltx-fo-depth:0.25em;font-size:10pt;" height="13.84" overflow="visible" transform="matrix(1 0 0 -1 0 10.38)" width="434.07"><span class="ltx_foreignobject_container"><span class="ltx_foreignobject_content">
<span id="A4.F29.p2.pic1.1" class="ltx_inline-block ltx_minipage ltx_align_bottom" style="width:31.37em;">
<span id="A4.F29.p2.pic1.1.1" class="ltx_p"><span id="A4.F29.p2.pic1.1.1.1" class="ltx_text" style="--ltx-fg-color:#FFFFFF;">Forced Choice (FC) Rating Instructions - SummEval Consistency</span></span>
</span></span></span></foreignobject></g><g fill-opacity="1.0" transform="matrix(1.0 0.0 0.0 1.0 21.65 113.33)"><foreignobject style="--ltx-fo-width:31.37em;--ltx-fo-height:31.83em;--ltx-fo-depth:7.19em;font-size:10pt;" height="540" overflow="visible" transform="matrix(1 0 0 -1 0 440.44)" width="434.07"><span class="ltx_foreignobject_container"><span class="ltx_foreignobject_content">
<span id="A4.F29.p2.pic1.2" class="ltx_inline-block ltx_minipage ltx_align_bottom" style="width:31.37em;">
<span id="A4.F29.p2.pic1.2.1" class="ltx_p"><span id="A4.F29.p2.pic1.2.1.1" class="ltx_text" style="--ltx-fg-color:#000000;">You will be given one summary written for a news article.
Your task is to rate the summary on one metric.
Please make sure you read and understand these instructions carefully.</span></span>
<span id="A4.F29.p2.pic1.2.2" class="ltx_p"><span id="A4.F29.p2.pic1.2.2.1" class="ltx_text ltx_font_bold" style="--ltx-fg-color:#000000;">Evaluation Criteria:
<br class="ltx_break"><span id="A4.F29.p2.pic1.2.2.1.1" class="ltx_text ltx_font_medium">Consistency - the factual alignment between the summary and the summarized source.
A factually consistent summary contains only statements that are entailed by the source document.
Penalize summaries that contain hallucinated facts.</span></span></span>
<span id="A4.F29.p2.pic1.2.3" class="ltx_p"><span id="A4.F29.p2.pic1.2.3.1" class="ltx_text ltx_font_bold" style="--ltx-fg-color:#000000;">Evaluation Steps:<span id="A4.F29.p2.pic1.2.3.1.1" class="ltx_text"></span></span></span>
<span id="A4.I33" class="ltx_enumerate">
<span id="A4.I33.i1" class="ltx_item" style="list-style-type:none;"><span class="ltx_tag ltx_tag_item">1.</span> 
<span id="A4.I33.i1.p1" class="ltx_para">
<span id="A4.I33.i1.p1.1" class="ltx_p"><span id="A4.I33.i1.p1.1.1" class="ltx_text" style="--ltx-fg-color:#000000;">Read the news article carefully and identify the main facts and details it presents.</span></span>
</span></span>
<span id="A4.I33.i2" class="ltx_item" style="list-style-type:none;"><span class="ltx_tag ltx_tag_item">2.</span> 
<span id="A4.I33.i2.p1" class="ltx_para">
<span id="A4.I33.i2.p1.1" class="ltx_p"><span id="A4.I33.i2.p1.1.1" class="ltx_text" style="--ltx-fg-color:#000000;">Read the summary and compare it to the article. Check if the summary contains any factual errors that are not supported by the article.</span></span>
</span></span>
<span id="A4.I33.i3" class="ltx_item" style="list-style-type:none;"><span class="ltx_tag ltx_tag_item">3.</span> 
<span id="A4.I33.i3.p1" class="ltx_para">
<span id="A4.I33.i3.p1.1" class="ltx_p"><span id="A4.I33.i3.p1.1.1" class="ltx_text" style="--ltx-fg-color:#000000;">Select ONE option that best applies.</span></span>
</span></span>
</span>
<span id="A4.F29.p2.pic1.2.4" class="ltx_p"><span id="A4.F29.p2.pic1.2.4.1" class="ltx_text" style="--ltx-fg-color:#000000;">Now provide a response to the following example:
<br class="ltx_break">Article: “{article}”
<br class="ltx_break">Summary: “{summary}”</span></span>
<span id="A4.F29.p2.pic1.2.5" class="ltx_p"><span id="A4.F29.p2.pic1.2.5.1" class="ltx_text" style="--ltx-fg-color:#000000;">Select ONE option that best applies:</span></span>
<span id="A4.I34" class="ltx_itemize">
<span id="A4.I34.ix1" class="ltx_item" style="list-style-type:none;"><span class="ltx_tag ltx_tag_item">A.</span> 
<span id="A4.I34.ix1.p1" class="ltx_para">
<span id="A4.I34.ix1.p1.1" class="ltx_p"><span id="A4.I34.ix1.p1.1.1" class="ltx_text" style="--ltx-fg-color:#000000;">Consistent</span></span>
</span></span>
<span id="A4.I34.ix2" class="ltx_item" style="list-style-type:none;"><span class="ltx_tag ltx_tag_item">B.</span> 
<span id="A4.I34.ix2.p1" class="ltx_para">
<span id="A4.I34.ix2.p1.1" class="ltx_p"><span id="A4.I34.ix2.p1.1.1" class="ltx_text" style="--ltx-fg-color:#000000;">Inconsistent</span></span>
</span></span>
</span>
<span id="A4.F29.p2.pic1.2.6" class="ltx_p"><span id="A4.F29.p2.pic1.2.6.1" class="ltx_text ltx_font_bold" style="--ltx-fg-color:#000000;">RESPONSE FORMAT:<span id="A4.F29.p2.pic1.2.6.1.1" class="ltx_text"></span></span></span>
<span id="A4.I35" class="ltx_itemize">
<span id="A4.I35.i1" class="ltx_item" style="list-style-type:none;"><span class="ltx_tag ltx_tag_item">•</span> 
<span id="A4.I35.i1.p1" class="ltx_para">
<span id="A4.I35.i1.p1.1" class="ltx_p"><span id="A4.I35.i1.p1.1.1" class="ltx_text" style="--ltx-fg-color:#000000;">Provide only a single letter: A or B</span></span>
</span></span>
<span id="A4.I35.i2" class="ltx_item" style="list-style-type:none;"><span class="ltx_tag ltx_tag_item">•</span> 
<span id="A4.I35.i2.p1" class="ltx_para">
<span id="A4.I35.i2.p1.1" class="ltx_p"><span id="A4.I35.i2.p1.1.1" class="ltx_text" style="--ltx-fg-color:#000000;">The letter must be the first character in your response</span></span>
</span></span>
<span id="A4.I35.i3" class="ltx_item" style="list-style-type:none;"><span class="ltx_tag ltx_tag_item">•</span> 
<span id="A4.I35.i3.p1" class="ltx_para">
<span id="A4.I35.i3.p1.1" class="ltx_p"><span id="A4.I35.i3.p1.1.1" class="ltx_text" style="--ltx-fg-color:#000000;">No spaces, punctuation, or other characters</span></span>
</span></span>
<span id="A4.I35.i4" class="ltx_item" style="list-style-type:none;"><span class="ltx_tag ltx_tag_item">•</span> 
<span id="A4.I35.i4.p1" class="ltx_para">
<span id="A4.I35.i4.p1.1" class="ltx_p"><span id="A4.I35.i4.p1.1.1" class="ltx_text" style="--ltx-fg-color:#000000;">No explanation</span></span>
</span></span>
</span>
</span></span></span></foreignobject></g></g></svg>