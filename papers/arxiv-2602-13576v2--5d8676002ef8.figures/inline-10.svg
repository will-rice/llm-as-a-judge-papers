</span></span></span></foreignobject></g><g fill-opacity="1.0" transform="matrix(1.0 0.0 0.0 1.0 10.16 12.85)"><foreignobject style="--ltx-fo-width:38.28em;--ltx-fo-height:45.09em;--ltx-fo-depth:0.19em;font-size:10pt;" height="626.67" overflow="visible" transform="matrix(1 0 0 -1 0 623.98)" width="529.69"><span class="ltx_foreignobject_container"><span class="ltx_foreignobject_content">
<span id="A4.SS4.p4.pic1.2" class="ltx_inline-block ltx_minipage ltx_align_bottom" style="width:38.28em;">
<span id="A4.SS4.p4.pic1.2.1" class="ltx_p"><span id="A4.SS4.p4.pic1.2.1.1" class="ltx_text" style="--ltx-fg-color:#000000;">Task: Revise and improve the FULL judge prompt template so that it is less likely to repeat the mistakes shown in the error examples.</span></span>
<span id="A4.SS4.p4.pic1.2.2" class="ltx_p"><span id="A4.SS4.p4.pic1.2.2.1" class="ltx_text" style="--ltx-fg-color:#000000;">CURRENT JUDGE PROMPT TEMPLATE:</span></span>
<span id="A4.SS4.p4.pic1.2.3" class="ltx_p"><span id="A4.SS4.p4.pic1.2.3.1" class="ltx_text" style="--ltx-fg-color:#000000;">[TEMPLATE START]</span></span>
<span id="A4.SS4.p4.pic1.2.4" class="ltx_p"><span id="A4.SS4.p4.pic1.2.4.1" class="ltx_text" style="--ltx-fg-color:#000000;">{current_rubric}</span></span>
<span id="A4.SS4.p4.pic1.2.5" class="ltx_p"><span id="A4.SS4.p4.pic1.2.5.1" class="ltx_text" style="--ltx-fg-color:#000000;">[TEMPLATE END]</span></span>
<span id="A4.SS4.p4.pic1.2.6" class="ltx_p"><span id="A4.SS4.p4.pic1.2.6.1" class="ltx_text" style="--ltx-fg-color:#000000;">ERROR EXAMPLES (cases where the judge chose the wrong winner):</span></span>
<span id="A4.SS4.p4.pic1.2.7" class="ltx_p"><span id="A4.SS4.p4.pic1.2.7.1" class="ltx_text" style="--ltx-fg-color:#000000;">[ERROR EXAMPLES START]</span></span>
<span id="A4.SS4.p4.pic1.2.8" class="ltx_p"><span id="A4.SS4.p4.pic1.2.8.1" class="ltx_text" style="--ltx-fg-color:#000000;">{examples_block}</span></span>
<span id="A4.SS4.p4.pic1.2.9" class="ltx_p"><span id="A4.SS4.p4.pic1.2.9.1" class="ltx_text" style="--ltx-fg-color:#000000;">[ERROR EXAMPLES END]</span></span>
<span id="A4.SS4.p4.pic1.2.10" class="ltx_p"><span id="A4.SS4.p4.pic1.2.10.1" class="ltx_text" style="--ltx-fg-color:#000000;">Hard constraints (must follow):</span></span>
<span id="A4.SS4.p4.pic1.2.11" class="ltx_p"><span id="A4.SS4.p4.pic1.2.11.1" class="ltx_text" style="--ltx-fg-color:#000000;">1) Keep the placeholder names EXACTLY:</span></span>
<span id="A4.SS4.p4.pic1.2.12" class="ltx_p"><span id="A4.SS4.p4.pic1.2.12.1" class="ltx_text" style="--ltx-fg-color:#000000;">- {instruction}</span></span>
<span id="A4.SS4.p4.pic1.2.13" class="ltx_p"><span id="A4.SS4.p4.pic1.2.13.1" class="ltx_text" style="--ltx-fg-color:#000000;">- {answer_a}</span></span>
<span id="A4.SS4.p4.pic1.2.14" class="ltx_p"><span id="A4.SS4.p4.pic1.2.14.1" class="ltx_text" style="--ltx-fg-color:#000000;">- {answer_b}</span></span>
<span id="A4.SS4.p4.pic1.2.15" class="ltx_p"><span id="A4.SS4.p4.pic1.2.15.1" class="ltx_text" style="--ltx-fg-color:#000000;">Do NOT rename them. Do NOT add new required placeholders.</span></span>
<span id="A4.SS4.p4.pic1.2.16" class="ltx_p"><span id="A4.SS4.p4.pic1.2.16.1" class="ltx_text" style="--ltx-fg-color:#000000;">2) The judge must output a final verdict as either [[A]] or [[B]] (case-insensitive).</span></span>
<span id="A4.SS4.p4.pic1.2.17" class="ltx_p"><span id="A4.SS4.p4.pic1.2.17.1" class="ltx_text" style="--ltx-fg-color:#000000;">- The verdict must be present in the judge output.</span></span>
<span id="A4.SS4.p4.pic1.2.18" class="ltx_p"><span id="A4.SS4.p4.pic1.2.18.1" class="ltx_text" style="--ltx-fg-color:#000000;">- Do NOT allow any other verdict formats (no JSON, no “A&quot;/“B&quot; alone, no “tie&quot;).</span></span>
<span id="A4.SS4.p4.pic1.2.19" class="ltx_p"><span id="A4.SS4.p4.pic1.2.19.1" class="ltx_text" style="--ltx-fg-color:#000000;">3) You are optimizing the ENTIRE prompt template, not a small rubric section. You may rewrite structure freely.</span></span>
<span id="A4.SS4.p4.pic1.2.20" class="ltx_p"><span id="A4.SS4.p4.pic1.2.20.1" class="ltx_text" style="--ltx-fg-color:#000000;">Freedom knobs (you may change):</span></span>
<span id="A4.SS4.p4.pic1.2.21" class="ltx_p"><span id="A4.SS4.p4.pic1.2.21.1" class="ltx_text" style="--ltx-fg-color:#000000;">- You may add a short decision procedure (e.g., steps or checklist).</span></span>
<span id="A4.SS4.p4.pic1.2.22" class="ltx_p"><span id="A4.SS4.p4.pic1.2.22.1" class="ltx_text" style="--ltx-fg-color:#000000;">- You may adjust the explanation requirements.</span></span>
<span id="A4.SS4.p4.pic1.2.23" class="ltx_p"><span id="A4.SS4.p4.pic1.2.23.1" class="ltx_text" style="--ltx-fg-color:#000000;">- You may add anti-bias reminders and tie-breaking rules, BUT the final output must still end with [[A]] or [[B]].</span></span>
<span id="A4.SS4.p4.pic1.2.24" class="ltx_p"><span id="A4.SS4.p4.pic1.2.24.1" class="ltx_text" style="--ltx-fg-color:#000000;">- Prefer to keep the same high-level decision dimensions as the current prompt template, but you may modify, add, merge, or remove dimensions if it meaningfully improves judging quality and helps fix the errors.</span></span>
<span id="A4.SS4.p4.pic1.2.25" class="ltx_p"><span id="A4.SS4.p4.pic1.2.25.1" class="ltx_text" style="--ltx-fg-color:#000000;">OUTPUT FORMAT (IMPORTANT):</span></span>
<span id="A4.SS4.p4.pic1.2.26" class="ltx_p"><span id="A4.SS4.p4.pic1.2.26.1" class="ltx_text" style="--ltx-fg-color:#000000;">- Output ONLY the revised full prompt template text.</span></span>
<span id="A4.SS4.p4.pic1.2.27" class="ltx_p"><span id="A4.SS4.p4.pic1.2.27.1" class="ltx_text" style="--ltx-fg-color:#000000;">- Do NOT include markers like [TEMPLATE START] or [TEMPLATE END] in your output.</span></span>
</span></span></span></foreignobject></g></g></svg>