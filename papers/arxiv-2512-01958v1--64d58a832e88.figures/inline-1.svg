<span id="A2.F7.pic1.1.1" class="ltx_p"><span id="A2.F7.pic1.1.1.1" class="ltx_text" style="--ltx-fg-color:#FFFFFF;">ASAP</span></span>
</span></span></span></foreignobject></g><g fill-opacity="1.0" transform="matrix(1.0 0.0 0.0 1.0 20.79 15.61)"><foreignobject style="--ltx-fo-width:48.21em;--ltx-fo-height:17.49em;--ltx-fo-depth:0.19em;font-size:10pt;" height="244.76" overflow="visible" transform="matrix(1 0 0 -1 0 242.07)" width="667.09"><span class="ltx_foreignobject_container"><span class="ltx_foreignobject_content">
<span id="A2.F7.pic1.2" class="ltx_inline-block ltx_minipage ltx_align_bottom" style="width:48.21em;">
<span id="A2.F7.pic1.2.1" class="ltx_p"><span id="A2.F7.pic1.2.1.1" class="ltx_text ltx_font_italic" style="--ltx-fg-color:#000000;">’Ideas &amp; Content’<span id="A2.F7.pic1.2.1.1.1" class="ltx_text ltx_font_upright">: ’1-2’: &quot;The writing is unclear to incoherent, lacking focus and main ideas. Supporting details are few or absent. Writer’s voice is inconsistent or missing.&quot;; ’3-4’: &quot;Writing is somewhat clear but may lack focus. Main ideas are present but not fully developed. Writer’s voice is discernible but inconsistent.&quot;;’5-6’: &quot;Writing is clear to engaging, with a good to strong focus. Includes relevant details enhancing understanding. Writer’s voice is present to distinct.&quot;</span></span></span>
<span id="A2.F7.pic1.2.2" class="ltx_p"><span id="A2.F7.pic1.2.2.1" class="ltx_text ltx_font_italic" style="--ltx-fg-color:#000000;">’Evidence &amp; Support’<span id="A2.F7.pic1.2.2.1.1" class="ltx_text ltx_font_upright">: ’1-2’: ’Minimal to some evidence, loosely related. Shows basic understanding with weak support.’; ’3-4’: ’Limited to some relevant evidence. Supports main ideas to a degree with basic grasp of topic.’; ’5-6’: ’Sufficient and relevant evidence. Demonstrates good understanding with integrated support.’;</span></span></span>
<span id="A2.F7.pic1.2.3" class="ltx_p"><span id="A2.F7.pic1.2.3.1" class="ltx_text ltx_font_italic" style="--ltx-fg-color:#000000;">’Organization’<span id="A2.F7.pic1.2.3.1.1" class="ltx_text ltx_font_upright">: ’5-6’: ’Logical structure, smooth transitions.’;’3-4’: ’Basic structure, uneven transitions.’;’1-2’: ’Lacks structure, confusing progression.’,</span></span></span>
<span id="A2.F7.pic1.2.4" class="ltx_p"><span id="A2.F7.pic1.2.4.1" class="ltx_text ltx_font_italic" style="--ltx-fg-color:#000000;">’Word Choice’<span id="A2.F7.pic1.2.4.1.1" class="ltx_text ltx_font_upright">: ’5-6’: ’Precise, vivid language.’;’3-4’: ’Adequate, generic language.’;’1-2’: ’Inappropriate, confusing language.’</span></span></span>
</span></span></span></foreignobject></g></g></svg>