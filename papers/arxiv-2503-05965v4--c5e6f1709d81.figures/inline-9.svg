<span id="A4.F26.p2.pic1.2" class="ltx_inline-block ltx_minipage ltx_align_bottom" style="width:31.37em;">
<span id="A4.F26.p2.pic1.2.1" class="ltx_p"><span id="A4.F26.p2.pic1.2.1.1" class="ltx_text" style="--ltx-fg-color:#000000;">Given two observations (O-Beginning and O-Ending), and two hypotheses
(H1 and H2), your goal is to choose one of the hypotheses that is more likely
to cause O-Beginning to turn into O-Ending.
An automatic detector will estimate your annotation accuracy on this task. If
your estimated accuracy is too low, you might be disqualified.
If you feel uncertain about some examples, just choose the best category
you believe the statement should be in.</span></span>
<span id="A4.F26.p2.pic1.2.2" class="ltx_p"><span id="A4.F26.p2.pic1.2.2.1" class="ltx_text ltx_font_bold" style="--ltx-fg-color:#000000;">EXAMPLES:
<br class="ltx_break"><span id="A4.F26.p2.pic1.2.2.1.1" class="ltx_text ltx_font_medium">O-Beginning: Jenny cleaned her house and went to work, leaving the window just a crack open.
<br class="ltx_break">H1: A thief broke into the house by pulling open the window.
<br class="ltx_break">H2: Her husband went home and close the window.
<br class="ltx_break">O-Ending: When Jenny returned home she saw that her house was a mess.
<br class="ltx_break">Answer: H1.</span></span></span>
<span id="A4.F26.p2.pic1.2.3" class="ltx_p"><span id="A4.F26.p2.pic1.2.3.1" class="ltx_text" style="--ltx-fg-color:#000000;">Now provide a response to the following example:
<br class="ltx_break">O-Beginning: “{o_beginning}”
<br class="ltx_break">H1: “{H1}”
<br class="ltx_break">H2: “{H2}”
<br class="ltx_break">O-Ending: “{o_ending}”</span></span>
<span id="A4.F26.p2.pic1.2.4" class="ltx_p"><span id="A4.F26.p2.pic1.2.4.1" class="ltx_text" style="--ltx-fg-color:#000000;">Select ONE option that best applies:</span></span>
<span id="A4.I20" class="ltx_itemize">
<span id="A4.I20.ix1" class="ltx_item" style="list-style-type:none;"><span class="ltx_tag ltx_tag_item">A.</span> 
<span id="A4.I20.ix1.p1" class="ltx_para">
<span id="A4.I20.ix1.p1.1" class="ltx_p"><span id="A4.I20.ix1.p1.1.1" class="ltx_text" style="--ltx-fg-color:#000000;">H1</span></span>
</span></span>
<span id="A4.I20.ix2" class="ltx_item" style="list-style-type:none;"><span class="ltx_tag ltx_tag_item">B.</span> 
<span id="A4.I20.ix2.p1" class="ltx_para">
<span id="A4.I20.ix2.p1.1" class="ltx_p"><span id="A4.I20.ix2.p1.1.1" class="ltx_text" style="--ltx-fg-color:#000000;">H2</span></span>
</span></span>
</span>
<span id="A4.F26.p2.pic1.2.5" class="ltx_p"><span id="A4.F26.p2.pic1.2.5.1" class="ltx_text ltx_font_bold" style="--ltx-fg-color:#000000;">RESPONSE FORMAT:<span id="A4.F26.p2.pic1.2.5.1.1" class="ltx_text"></span></span></span>
<span id="A4.I21" class="ltx_itemize">
<span id="A4.I21.i1" class="ltx_item" style="list-style-type:none;"><span class="ltx_tag ltx_tag_item">•</span> 
<span id="A4.I21.i1.p1" class="ltx_para">
<span id="A4.I21.i1.p1.1" class="ltx_p"><span id="A4.I21.i1.p1.1.1" class="ltx_text" style="--ltx-fg-color:#000000;">Provide only a single letter: A or B</span></span>
</span></span>
<span id="A4.I21.i2" class="ltx_item" style="list-style-type:none;"><span class="ltx_tag ltx_tag_item">•</span> 
<span id="A4.I21.i2.p1" class="ltx_para">
<span id="A4.I21.i2.p1.1" class="ltx_p"><span id="A4.I21.i2.p1.1.1" class="ltx_text" style="--ltx-fg-color:#000000;">The letter must be the first character in your response</span></span>
</span></span>
<span id="A4.I21.i3" class="ltx_item" style="list-style-type:none;"><span class="ltx_tag ltx_tag_item">•</span> 
<span id="A4.I21.i3.p1" class="ltx_para">
<span id="A4.I21.i3.p1.1" class="ltx_p"><span id="A4.I21.i3.p1.1.1" class="ltx_text" style="--ltx-fg-color:#000000;">No spaces, punctuation, or other characters</span></span>
</span></span>
<span id="A4.I21.i4" class="ltx_item" style="list-style-type:none;"><span class="ltx_tag ltx_tag_item">•</span> 
