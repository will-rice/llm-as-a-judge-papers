<svg id="S15.SS0.SSS0.Px4.p2.pic1" class="ltx_picture" height="395.63" overflow="visible" version="1.1" viewbox="0 0 477.38 395.63" width="477.38"><g style="--ltx-stroke-color:#000000;--ltx-fill-color:#000000;" fill="#000000" stroke="#000000" stroke-width="0.4pt" transform="translate(0,395.63) matrix(1 0 0 -1 0 0)"><g style="--ltx-fill-color:#BF0000;" fill="#BF0000" fill-opacity="1.0"><path style="stroke:none" d="M 0 5.91 L 0 389.72 C 0 392.98 2.64 395.63 5.91 395.63 L 471.47 395.63 C 474.73 395.63 477.38 392.98 477.38 389.72 L 477.38 5.91 C 477.38 2.64 474.73 0 471.47 0 L 5.91 0 C 2.64 0 0 2.64 0 5.91 Z" /></g><g style="--ltx-fill-color:#FFF2F2;" fill="#FFF2F2" fill-opacity="1.0"><path style="stroke:none" d="M 1.97 5.91 L 1.97 369.98 L 475.41 369.98 L 475.41 5.91 C 475.41 3.73 473.65 1.97 471.47 1.97 L 5.91 1.97 C 3.73 1.97 1.97 3.73 1.97 5.91 Z" /></g><g fill-opacity="1.0" transform="matrix(1.0 0.0 0.0 1.0 21.65 379.34)"><foreignobject style="--ltx-fo-width:31.37em;--ltx-fo-height:0.75em;--ltx-fo-depth:0.25em;font-size:10pt;" height="13.84" overflow="visible" transform="matrix(1 0 0 -1 0 10.38)" width="434.07"><span class="ltx_foreignobject_container"><span class="ltx_foreignobject_content">
<span id="S15.SS0.SSS0.Px4.p2.pic1.1" class="ltx_inline-block ltx_minipage ltx_align_bottom" style="width:31.37em;">
<span id="S15.SS0.SSS0.Px4.p2.pic1.1.1" class="ltx_p"><a href="https://codeforces.com/problemset/problem/1999/F" title class="ltx_ref ltx_href" style="--ltx-fg-color:#FFFFFF;">Example Combinatorics Problem (Rated 1500)</a></span>
</span></span></span></foreignobject></g><g fill-opacity="1.0" transform="matrix(1.0 0.0 0.0 1.0 21.65 16.47)"><foreignobject style="--ltx-fo-width:31.37em;--ltx-fo-height:24.69em;--ltx-fo-depth:0.19em;font-size:10pt;" height="344.39" overflow="visible" transform="matrix(1 0 0 -1 0 341.7)" width="434.07"><span class="ltx_foreignobject_container"><span class="ltx_foreignobject_content">
<span id="S15.SS0.SSS0.Px4.p2.pic1.2" class="ltx_inline-block ltx_minipage ltx_align_bottom" style="width:31.37em;">
<span id="S15.SS0.SSS0.Px4.p2.pic1.2.1" class="ltx_p"><span id="S15.SS0.SSS0.Px4.p2.pic1.2.1.1" class="ltx_text" style="--ltx-fg-color:#000000;">Arul has a <span id="S15.SS0.SSS0.Px4.p2.pic1.2.1.1.1" class="ltx_text ltx_font_bold">binary</span> array (consisting only of zeros and ones) of length <math id="S15.SS0.SSS0.Px4.p2.pic1.m1" class="ltx_Math" alttext="n" display="inline" intent=":literal"><semantics><mi style="--ltx-fg-color:#000000;" mathcolor="#000000">n</mi><annotation encoding="application/x-tex">n</annotation></semantics></math>.

<br class="ltx_break">
<br class="ltx_break">He will take all subsequences of length <math id="S15.SS0.SSS0.Px4.p2.pic1.m2" class="ltx_Math" alttext="k" display="inline" intent=":literal"><semantics><mi style="--ltx-fg-color:#000000;" mathcolor="#000000">k</mi><annotation encoding="application/x-tex">k</annotation></semantics></math> (<math id="S15.SS0.SSS0.Px4.p2.pic1.m3" class="ltx_Math" alttext="k" display="inline" intent=":literal"><semantics><mi style="--ltx-fg-color:#000000;" mathcolor="#000000">k</mi><annotation encoding="application/x-tex">k</annotation></semantics></math> is odd) of this array and find their median.

<br class="ltx_break">
<br class="ltx_break">What is the sum of all these values?

<br class="ltx_break">
<br class="ltx_break">As this sum can be very large, output it modulo <math id="S15.SS0.SSS0.Px4.p2.pic1.m4" class="ltx_Math" alttext="10^{9}+7" display="inline" intent=":literal"><semantics><mrow><msup><mn style="--ltx-fg-color:#000000;" mathcolor="#000000">10</mn><mn style="--ltx-fg-color:#000000;" mathcolor="#000000">9</mn></msup><mo style="--ltx-fg-color:#000000;" mathcolor="#000000">+</mo><mn style="--ltx-fg-color:#000000;" mathcolor="#000000">7</mn></mrow><annotation encoding="application/x-tex">10^{9}+7</annotation></semantics></math>. In other words, print the remainder of this sum when divided <math id="S15.SS0.SSS0.Px4.p2.pic1.m5" class="ltx_Math" alttext="10^{9}+7" display="inline" intent=":literal"><semantics><mrow><msup><mn style="--ltx-fg-color:#000000;" mathcolor="#000000">10</mn><mn style="--ltx-fg-color:#000000;" mathcolor="#000000">9</mn></msup><mo style="--ltx-fg-color:#000000;" mathcolor="#000000">+</mo><mn style="--ltx-fg-color:#000000;" mathcolor="#000000">7</mn></mrow><annotation encoding="application/x-tex">10^{9}+7</annotation></semantics></math>.

<br class="ltx_break">
<br class="ltx_break"><span id="S15.SS0.SSS0.Px4.p2.pic1.2.1.1.2" class="ltx_text ltx_font_bold">Input</span> 
<br class="ltx_break">The first line contains a single integer <math id="S15.SS0.SSS0.Px4.p2.pic1.m6" class="ltx_Math" alttext="t\ (1\leq t\leq 10^{4})" display="inline" intent=":literal"><semantics><mrow><mi style="--ltx-fg-color:#000000;" mathcolor="#000000">t</mi><mo lspace="0.500em">⁡</mo><mrow><mo style="--ltx-fg-color:#000000;" mathcolor="#000000" stretchy="false">(</mo><mrow><mn style="--ltx-fg-color:#000000;" mathcolor="#000000">1</mn><mo style="--ltx-fg-color:#000000;" mathcolor="#000000">≤</mo><mi style="--ltx-fg-color:#000000;" mathcolor="#000000">t</mi><mo style="--ltx-fg-color:#000000;" mathcolor="#000000">≤</mo><msup><mn style="--ltx-fg-color:#000000;" mathcolor="#000000">10</mn><mn style="--ltx-fg-color:#000000;" mathcolor="#000000">4</mn></msup></mrow><mo style="--ltx-fg-color:#000000;" mathcolor="#000000" stretchy="false">)</mo></mrow></mrow><annotation encoding="application/x-tex">t\ (1\leq t\leq 10^{4})</annotation></semantics></math>—the number of test cases.

<br class="ltx_break">
<br class="ltx_break">The first line of each test case contains two integers <math id="S15.SS0.SSS0.Px4.p2.pic1.m7" class="ltx_Math" alttext="n" display="inline" intent=":literal"><semantics><mi style="--ltx-fg-color:#000000;" mathcolor="#000000">n</mi><annotation encoding="application/x-tex">n</annotation></semantics></math> and <math id="S15.SS0.SSS0.Px4.p2.pic1.m8" class="ltx_Math" alttext="k" display="inline" intent=":literal"><semantics><mi style="--ltx-fg-color:#000000;" mathcolor="#000000">k</mi><annotation encoding="application/x-tex">k</annotation></semantics></math> (<math id="S15.SS0.SSS0.Px4.p2.pic1.m9" class="ltx_Math" alttext="1\leq k\leq n\leq 2\cdot 10^{5}" display="inline" intent=":literal"><semantics><mrow><mn style="--ltx-fg-color:#000000;" mathcolor="#000000">1</mn><mo style="--ltx-fg-color:#000000;" mathcolor="#000000">≤</mo><mi style="--ltx-fg-color:#000000;" mathcolor="#000000">k</mi><mo style="--ltx-fg-color:#000000;" mathcolor="#000000">≤</mo><mi style="--ltx-fg-color:#000000;" mathcolor="#000000">n</mi><mo style="--ltx-fg-color:#000000;" mathcolor="#000000">≤</mo><mrow><mn style="--ltx-fg-color:#000000;" mathcolor="#000000">2</mn><mo style="--ltx-fg-color:#000000;" lspace="0.222em" mathcolor="#000000" rspace="0.222em">⋅</mo><msup><mn style="--ltx-fg-color:#000000;" mathcolor="#000000">10</mn><mn style="--ltx-fg-color:#000000;" mathcolor="#000000">5</mn></msup></mrow></mrow><annotation encoding="application/x-tex">1\leq k\leq n\leq 2\cdot 10^{5}</annotation></semantics></math>, <math id="S15.SS0.SSS0.Px4.p2.pic1.m10" class="ltx_Math" alttext="k" display="inline" intent=":literal"><semantics><mi style="--ltx-fg-color:#000000;" mathcolor="#000000">k</mi><annotation encoding="application/x-tex">k</annotation></semantics></math> <span id="S15.SS0.SSS0.Px4.p2.pic1.2.1.1.3" class="ltx_text ltx_font_bold">is odd</span>)—the length of the array and the length of the subsequence, respectively.

<br class="ltx_break">
<br class="ltx_break">The second line of each test case contains <math id="S15.SS0.SSS0.Px4.p2.pic1.m11" class="ltx_Math" alttext="n" display="inline" intent=":literal"><semantics><mi style="--ltx-fg-color:#000000;" mathcolor="#000000">n</mi><annotation encoding="application/x-tex">n</annotation></semantics></math> integers <math id="S15.SS0.SSS0.Px4.p2.pic1.m12" class="ltx_Math" alttext="a_{i}\ (0\leq a_{i}\leq 1)" display="inline" intent=":literal"><semantics><mrow><msub><mi style="--ltx-fg-color:#000000;" mathcolor="#000000">a</mi><mi style="--ltx-fg-color:#000000;" mathcolor="#000000">i</mi></msub><mo lspace="0.500em" rspace="0em">​</mo><mrow><mo style="--ltx-fg-color:#000000;" mathcolor="#000000" stretchy="false">(</mo><mrow><mn style="--ltx-fg-color:#000000;" mathcolor="#000000">0</mn><mo style="--ltx-fg-color:#000000;" mathcolor="#000000">≤</mo><msub><mi style="--ltx-fg-color:#000000;" mathcolor="#000000">a</mi><mi style="--ltx-fg-color:#000000;" mathcolor="#000000">i</mi></msub><mo style="--ltx-fg-color:#000000;" mathcolor="#000000">≤</mo><mn style="--ltx-fg-color:#000000;" mathcolor="#000000">1</mn></mrow><mo style="--ltx-fg-color:#000000;" mathcolor="#000000" stretchy="false">)</mo></mrow></mrow><annotation encoding="application/x-tex">a_{i}\ (0\leq a_{i}\leq 1)</annotation></semantics></math>—the elements of the array.

<br class="ltx_break">
<br class="ltx_break">It is guaranteed that sum of <math id="S15.SS0.SSS0.Px4.p2.pic1.m13" class="ltx_Math" alttext="n" display="inline" intent=":literal"><semantics><mi style="--ltx-fg-color:#000000;" mathcolor="#000000">n</mi><annotation encoding="application/x-tex">n</annotation></semantics></math> over all test cases does not exceed <math id="S15.SS0.SSS0.Px4.p2.pic1.m14" class="ltx_Math" alttext="2\cdot 10^{5}" display="inline" intent=":literal"><semantics><mrow><mn style="--ltx-fg-color:#000000;" mathcolor="#000000">2</mn><mo style="--ltx-fg-color:#000000;" lspace="0.222em" mathcolor="#000000" rspace="0.222em">⋅</mo><msup><mn style="--ltx-fg-color:#000000;" mathcolor="#000000">10</mn><mn style="--ltx-fg-color:#000000;" mathcolor="#000000">5</mn></msup></mrow><annotation encoding="application/x-tex">2\cdot 10^{5}</annotation></semantics></math>.

<br class="ltx_break">
<br class="ltx_break"><span id="S15.SS0.SSS0.Px4.p2.pic1.2.1.1.4" class="ltx_text ltx_font_bold">Output</span> 
<br class="ltx_break">For each test case, print the sum modulo <math id="S15.SS0.SSS0.Px4.p2.pic1.m15" class="ltx_Math" alttext="10^{9}+7" display="inline" intent=":literal"><semantics><mrow><msup><mn style="--ltx-fg-color:#000000;" mathcolor="#000000">10</mn><mn style="--ltx-fg-color:#000000;" mathcolor="#000000">9</mn></msup><mo style="--ltx-fg-color:#000000;" mathcolor="#000000">+</mo><mn style="--ltx-fg-color:#000000;" mathcolor="#000000">7</mn></mrow><annotation encoding="application/x-tex">10^{9}+7</annotation></semantics></math>.</span></span>
</span></span></span></foreignobject></g></g></svg>