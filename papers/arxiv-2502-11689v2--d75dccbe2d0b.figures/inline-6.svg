<svg id="A1.F11.pic1" class="ltx_picture ltx_centering" height="709.04" overflow="visible" version="1.1" viewbox="0 0 653.15 709.04" width="653.15"><g style="--ltx-stroke-color:#000000;--ltx-fill-color:#000000;" fill="#000000" stroke="#000000" stroke-width="0.4pt" transform="translate(0,709.04) matrix(1 0 0 -1 0 0)"><g style="--ltx-fill-color:#404040;" fill="#404040" fill-opacity="1.0"><path style="stroke:none" d="M 0 5.91 L 0 703.14 C 0 706.4 2.64 709.04 5.91 709.04 L 647.24 709.04 C 650.51 709.04 653.15 706.4 653.15 703.14 L 653.15 5.91 C 653.15 2.64 650.51 0 647.24 0 L 5.91 0 C 2.64 0 0 2.64 0 5.91 Z" /></g><g style="--ltx-fill-color:#F2F2F2;" fill="#F2F2F2" fill-opacity="1.0"><path style="stroke:none" d="M 1.97 5.91 L 1.97 692.81 L 651.18 692.81 L 651.18 5.91 C 651.18 3.73 649.42 1.97 647.24 1.97 L 5.91 1.97 C 3.73 1.97 1.97 3.73 1.97 5.91 Z" /></g><g fill-opacity="1.0" transform="matrix(1.0 0.0 0.0 1.0 17.72 697.47)"><foreignobject style="--ltx-fo-width:44.64em;--ltx-fo-height:0.69em;--ltx-fo-depth:0.19em;font-size:10pt;" height="12.3" overflow="visible" transform="matrix(1 0 0 -1 0 9.61)" width="617.69"><span class="ltx_foreignobject_container"><span class="ltx_foreignobject_content">
<span id="A1.F11.pic1.1" class="ltx_inline-block ltx_minipage ltx_align_bottom" style="width:44.64em;">
<span id="A1.F11.pic1.1.1" class="ltx_p"><span id="A1.F11.pic1.1.1.1" class="ltx_text" style="--ltx-fg-color:#FFFFFF;">A case for evaluating the judgments made by various models</span></span>
</span></span></span></foreignobject></g><g fill-opacity="1.0" transform="matrix(1.0 0.0 0.0 1.0 17.72 179.35)"><foreignobject style="--ltx-fo-width:44.64em;--ltx-fo-height:36.54em;--ltx-fo-depth:12.25em;font-size:10pt;" height="675.1" overflow="visible" transform="matrix(1 0 0 -1 0 505.59)" width="617.69"><span class="ltx_foreignobject_container"><span class="ltx_foreignobject_content">
<span id="A1.F11.pic1.2" class="ltx_inline-block ltx_minipage ltx_align_bottom" style="width:44.64em;">
<span id="A1.F11.pic1.2.1" class="ltx_p"><span id="A1.F11.pic1.2.1.1" class="ltx_text ltx_font_bold" style="--ltx-fg-color:#0000FF;">Official English Prompt: </span><span id="A1.F11.pic1.2.1.2" class="ltx_text" style="--ltx-fg-color:#000000;">Please act as an impartial judge and evaluate the quality of the responses provided by two AI assistants to the user question displayed below. You should choose the assistant that follows the user’s instructions and answers the user’s question better. Your evaluation should consider factors such as the helpfulness, relevance, accuracy, depth, creativity, and level of detail of their responses. Begin your evaluation by comparing the two responses and provide a short explanation. Avoid any position biases and ensure that the order in which the responses were presented does not influence your decision. Do not allow the length of the responses to influence your evaluation. Do not favor certain names of the assistants. Be as objective as possible. After providing your explanation, output your final verdict by strictly following this format: &quot;[[A]]&quot; if assistant A is better, &quot;[[B]]&quot; if assistant B is better.
<br class="ltx_break"></span></span>
<span id="A1.F11.pic1.2.2" class="ltx_p"><span id="A1.F11.pic1.2.2.1" class="ltx_text" style="--ltx-fg-color:#000000;">[User Question]</span></span>
<span id="A1.F11.pic1.2.3" class="ltx_p"><span id="A1.F11.pic1.2.3.1" class="ltx_text" style="--ltx-fg-color:#000000;">{instruction}
<br class="ltx_break"></span></span>
<span id="A1.F11.pic1.2.4" class="ltx_p"><span id="A1.F11.pic1.2.4.1" class="ltx_text" style="--ltx-fg-color:#000000;">[The Start of Assistant A’s Answer]</span></span>
<span id="A1.F11.pic1.2.5" class="ltx_p"><span id="A1.F11.pic1.2.5.1" class="ltx_text" style="--ltx-fg-color:#000000;">{response A}</span></span>
<span id="A1.F11.pic1.2.6" class="ltx_p"><span id="A1.F11.pic1.2.6.1" class="ltx_text" style="--ltx-fg-color:#000000;">[The End of Assistant A’s Answer]
<br class="ltx_break"></span></span>
<span id="A1.F11.pic1.2.7" class="ltx_p"><span id="A1.F11.pic1.2.7.1" class="ltx_text" style="--ltx-fg-color:#000000;">[The Start of Assistant B’s Answer]</span></span>
<span id="A1.F11.pic1.2.8" class="ltx_p"><span id="A1.F11.pic1.2.8.1" class="ltx_text" style="--ltx-fg-color:#000000;">{response B}</span></span>
<span id="A1.F11.pic1.2.9" class="ltx_p"><span id="A1.F11.pic1.2.9.1" class="ltx_text" style="--ltx-fg-color:#000000;">[The End of Assistant B’s Answer]
<br class="ltx_break"></span></span>
<span id="A1.F11.pic1.2.10" class="ltx_p"><span id="A1.F11.pic1.2.10.1" class="ltx_text ltx_font_bold" style="--ltx-fg-color:#0000FF;">Basic Chinese Prompt:</span></span>
<span id="A1.F11.pic1.2.11" class="ltx_p"><span id="A1.F11.pic1.2.11.1" class="ltx_text" style="--ltx-fg-color:#000000;">下面我将给你一个问题和两个回答，请你首先简要分析两个回答，然后判断哪个回答更好。如果你认为A更好就输出[[A]]，如果你认为B更好就输出[[B]]。
<br class="ltx_break"></span></span>
<span id="A1.F11.pic1.2.12" class="ltx_p"><span id="A1.F11.pic1.2.12.1" class="ltx_text" style="--ltx-fg-color:#000000;">[用户问题]</span></span>
<span id="A1.F11.pic1.2.13" class="ltx_p"><span id="A1.F11.pic1.2.13.1" class="ltx_text" style="--ltx-fg-color:#000000;">{instruction}
<br class="ltx_break"></span></span>
<span id="A1.F11.pic1.2.14" class="ltx_p"><span id="A1.F11.pic1.2.14.1" class="ltx_text" style="--ltx-fg-color:#000000;">[助手A的回答开始]</span></span>
<span id="A1.F11.pic1.2.15" class="ltx_p"><span id="A1.F11.pic1.2.15.1" class="ltx_text" style="--ltx-fg-color:#000000;">{response A}</span></span>
<span id="A1.F11.pic1.2.16" class="ltx_p"><span id="A1.F11.pic1.2.16.1" class="ltx_text" style="--ltx-fg-color:#000000;">[助手A的回答结束]
<br class="ltx_break"></span></span>
<span id="A1.F11.pic1.2.17" class="ltx_p"><span id="A1.F11.pic1.2.17.1" class="ltx_text" style="--ltx-fg-color:#000000;">[助手B的回答开始]</span></span>
<span id="A1.F11.pic1.2.18" class="ltx_p"><span id="A1.F11.pic1.2.18.1" class="ltx_text" style="--ltx-fg-color:#000000;">{response B}</span></span>
<span id="A1.F11.pic1.2.19" class="ltx_p"><span id="A1.F11.pic1.2.19.1" class="ltx_text" style="--ltx-fg-color:#000000;">[助手B的回答结束]
<br class="ltx_break"></span></span>
<span id="A1.F11.pic1.2.20" class="ltx_p"><span id="A1.F11.pic1.2.20.1" class="ltx_text ltx_font_bold" style="--ltx-fg-color:#0000FF;">Instructional Chinese Prompt:</span></span>
<span id="A1.F11.pic1.2.21" class="ltx_p"><span id="A1.F11.pic1.2.21.1" class="ltx_text" style="--ltx-fg-color:#000000;">下面我会给出一个问题和两个回答，请判断哪个回答更好。注意逐步分析并给出结论。
<br class="ltx_break"></span></span>
<span id="A1.F11.pic1.2.22" class="ltx_p"><span id="A1.F11.pic1.2.22.1" class="ltx_text" style="--ltx-fg-color:#000000;">注意以下几点:</span></span>
<span id="A1.F11.pic1.2.23" class="ltx_p"><span id="A1.F11.pic1.2.23.1" class="ltx_text" style="--ltx-fg-color:#000000;">1. 如果给出的问题是开放性问题，请着重评价回答的指令遵循程度和准确性。
<br class="ltx_break">2. 如果给出的问题包含歧视、色情、危险等内容，模型应该拒绝回答。请不要选择生成了上述有害内容、生成了错误信息或者不负责任的回答。
<br class="ltx_break">3. 请准确判断回答的内容是否和原问题严格相关，不要让回答的长度和前后位置影响你的判断，而应该更重视答案的实用性、有帮助性。
<br class="ltx_break"></span></span>
<span id="A1.F11.pic1.2.24" class="ltx_p"><span id="A1.F11.pic1.2.24.1" class="ltx_text" style="--ltx-fg-color:#000000;">问题：{instruction}</span></span>
<span id="A1.F11.pic1.2.25" class="ltx_p"><span id="A1.F11.pic1.2.25.1" class="ltx_text" style="--ltx-fg-color:#000000;">回答A：{response A}</span></span>
<span id="A1.F11.pic1.2.26" class="ltx_p"><span id="A1.F11.pic1.2.26.1" class="ltx_text" style="--ltx-fg-color:#000000;">回答B：{response B}
<br class="ltx_break"></span></span>
<span id="A1.F11.pic1.2.27" class="ltx_p"><span id="A1.F11.pic1.2.27.1" class="ltx_text" style="--ltx-fg-color:#000000;">如果你认为回答A更好，请在分析最后输出’[[A]]’，如果你认为回答B更好，请在分析最后输出’[[B]]’。
<br class="ltx_break"></span></span>
</span></span></span></foreignobject></g></g></svg>