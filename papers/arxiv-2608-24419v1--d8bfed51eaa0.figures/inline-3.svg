<span id="S1.SS1.p4.pic1.p1" class="ltx_para ltx_noindent">
<span id="S1.SS1.p4.pic1.p1.1" class="ltx_p"><span id="S1.SS1.p4.pic1.p1.1.1" class="ltx_text ltx_font_bold" style="--ltx-fg-color:#000000;">Anti-circularity.</span><span id="S1.SS1.p4.pic1.p1.1.2" class="ltx_text" style="--ltx-fg-color:#000000;">
An intervention belongs to the sensitivity arm only if it changes the correct verdict, and if a
model decides that, then the experiment tests a model against itself. Direction is therefore set
by human annotators, at agreement </span><math id="S1.SS1.p4.pic1.p1.m1" class="ltx_Math" alttext="\geq 0.75" display="inline" intent=":literal"><semantics><mrow><mphantom></mphantom><mo style="--ltx-fg-color:#000000;" mathcolor="#000000">≥</mo><mn style="--ltx-fg-color:#000000;" mathcolor="#000000">0.75</mn></mrow><annotation encoding="application/x-tex">\geq 0.75</annotation></semantics></math><span id="S1.SS1.p4.pic1.p1.1.3" class="ltx_text" style="--ltx-fg-color:#000000;">, and generation, verification,
and judging are three
disjoint model families. §</span><a href="#S4.SS2" title="4.2 Who decides that the verdict should change ‣ 4 Method: the interventions, the direction protocol, and the diagnostic ‣ A Judge Should Know What Changed: Construct Validity for LLM-as-a-Judge Evaluation" class="ltx_ref" style="--ltx-fg-color:#000000;"><span class="ltx_text ltx_ref_tag">4.2</span></a><span id="S1.SS1.p4.pic1.p1.1.4" class="ltx_text" style="--ltx-fg-color:#000000;"> gives the protocol and reports what it discarded.</span></span>
</span></span></span></span></foreignobject></g></g></svg>