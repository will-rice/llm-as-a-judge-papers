</span></span></span></foreignobject></g><g fill-opacity="1.0" transform="matrix(1.0 0.0 0.0 1.0 21.65 115.56)"><foreignobject style="--ltx-fo-width:31.37em;--ltx-fo-height:0.56em;--ltx-fo-depth:7.36em;font-size:10pt;" height="109.47" overflow="visible" transform="matrix(1 0 0 -1 0 7.69)" width="434.07"><span class="ltx_foreignobject_container"><span class="ltx_foreignobject_content">
<span id="A7.SS3.pic1.2" class="ltx_inline-block ltx_minipage ltx_align_bottom" style="width:31.37em;">
<span id="A7.SS3.pic1.2.1" class="ltx_p"><span id="A7.SS3.pic1.2.1.1" class="ltx_text" style="font-size:80%;--ltx-fg-color:#000000;">The ‘v’ in ‘v1’ stands for ”version”. It’s a standard way to label different releases of a product.

<br class="ltx_break">
<br class="ltx_break">So, when you see ‘v1’, ‘v2’, ‘v3’, etc., it usually means that you’re looking at the first, second, or third version of something.

<br class="ltx_break">
<br class="ltx_break">In the context of software development, it’s common to use this ”v-notation” to communicate the different stages of development and the releases of software products.
