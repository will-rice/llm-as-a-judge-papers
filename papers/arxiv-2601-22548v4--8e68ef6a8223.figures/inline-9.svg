<span id="A5.SS9.p1.pic1.1.1" class="ltx_p"><span id="A5.SS9.p1.pic1.1.1.1" class="ltx_text ltx_font_bold" style="--ltx-fg-color:#FFFFFF;">Evaluator Prompt</span></span>
</span></span></span></foreignobject></g><g fill-opacity="1.0" transform="matrix(1.0 0.0 0.0 1.0 12.92 11.75)"><foreignobject style="--ltx-fo-width:34.53em;--ltx-fo-height:22.15em;--ltx-fo-depth:0.2em;font-size:10pt;" height="309.26" overflow="visible" transform="matrix(1 0 0 -1 0 306.49)" width="477.8"><span class="ltx_foreignobject_container"><span class="ltx_foreignobject_content">
<span id="A5.SS9.p1.pic1.2" class="ltx_inline-block ltx_minipage ltx_align_bottom" style="width:34.53em;">
<span id="A5.SS9.p1.pic1.2.1" class="ltx_p"><span id="A5.SS9.p1.pic1.2.1.1" class="ltx_text ltx_font_typewriter" style="font-size:90%;--ltx-fg-color:#000000;">You are a helpful assistant tasked with evaluating the quality of two different English translations of the same German text. For each German text, you will receive two independent English translations. Please judge which English translation is better.
</span></span>
<span id="A5.SS9.p1.pic1.2.2" class="ltx_p"><span id="A5.SS9.p1.pic1.2.2.1" class="ltx_text ltx_font_typewriter" style="font-size:90%;--ltx-fg-color:#000000;">Here is the German text.
</span></span>
<span id="A5.SS9.p1.pic1.2.3" class="ltx_p"><span id="A5.SS9.p1.pic1.2.3.1" class="ltx_text ltx_font_typewriter" style="font-size:90%;--ltx-fg-color:#000000;"># German

<br class="ltx_break">german
</span></span>
<span id="A5.SS9.p1.pic1.2.4" class="ltx_p"><span id="A5.SS9.p1.pic1.2.4.1" class="ltx_text ltx_font_typewriter" style="font-size:90%;--ltx-fg-color:#000000;">Here are two independent English translations (English A and English B) for the German text.
</span></span>
<span id="A5.SS9.p1.pic1.2.5" class="ltx_p"><span id="A5.SS9.p1.pic1.2.5.1" class="ltx_text ltx_font_typewriter" style="font-size:90%;--ltx-fg-color:#000000;"># English

<br class="ltx_break">&lt;English A&gt;english a&lt;/English A&gt;

<br class="ltx_break">&lt;English B&gt;english b&lt;/English B&gt;
</span></span>
<span id="A5.SS9.p1.pic1.2.6" class="ltx_p"><span id="A5.SS9.p1.pic1.2.6.1" class="ltx_text ltx_font_typewriter" style="font-size:90%;--ltx-fg-color:#000000;">Now, please judge which English translation is better. You only need to output A or B, with no other text. Please remember that your response should start with either A or B.
</span></span>
</span></span></span></foreignobject></g></g></svg>