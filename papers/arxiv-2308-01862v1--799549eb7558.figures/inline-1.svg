<span id="S3.SS1.p3.pic1.2.1" class="ltx_p"><span id="S3.SS1.p3.pic1.2.1.1" class="ltx_text" style="--ltx-fg-color:#000000;">Please help me summarize that for a user question “{{<span id="S3.SS1.p3.pic1.2.1.1.1" class="ltx_text ltx_font_bold">question</span>}}”, if I want to determine which of two answers is better, from what angles do we need to evaluate? The two answers are respectively “{{<span id="S3.SS1.p3.pic1.2.1.1.2" class="ltx_text ltx_font_bold">answer_1</span>}}” and “{{<span id="S3.SS1.p3.pic1.2.1.1.3" class="ltx_text ltx_font_bold">answer_2</span>}}”.</span></span>
<span id="S3.SS1.p3.pic1.2.2" class="ltx_p"><span id="S3.SS1.p3.pic1.2.2.1" class="ltx_text" style="--ltx-fg-color:#000000;">Output the name and evaluation content of each angle. Each line is an evaluation angle. Use a newline to separate different evaluation angles. Each evaluation angle Name starts with $ and ends with &amp;.</span></span>
