<span id="A1.F6.pic1.2.5" class="ltx_p"><span id="A1.F6.pic1.2.5.1" class="ltx_text ltx_font_bold" style="--ltx-fg-color:#000000;">Steps for Evaluation:<span id="A1.F6.pic1.2.5.1.1" class="ltx_text ltx_font_medium"> 
