<svg id="A7.p1.pic1" class="ltx_picture" height="317.8" overflow="visible" version="1.1" viewbox="0 0 653.15 317.8" width="653.15"><g style="--ltx-stroke-color:#000000;--ltx-fill-color:#000000;" fill="#000000" stroke="#000000" stroke-width="0.4pt" transform="translate(0,317.8) matrix(1 0 0 -1 0 0)"><g style="--ltx-fill-color:#000000;" fill="#000000" fill-opacity="1.0"><path style="stroke:none" d="M 0 4.92 L 0 312.88 C 0 315.6 2.2 317.8 4.92 317.8 L 648.23 317.8 C 650.95 317.8 653.15 315.6 653.15 312.88 L 653.15 4.92 C 653.15 2.2 650.95 0 648.23 0 L 4.92 0 C 2.2 0 0 2.2 0 4.92 Z" /></g><g style="--ltx-fill-color:#FFFFFF;" fill="#FFFFFF" fill-opacity="1.0"><path style="stroke:none" d="M 0.98 4.92 L 0.98 295.66 L 652.17 295.66 L 652.17 4.92 C 652.17 2.75 650.4 0.98 648.23 0.98 L 4.92 0.98 C 2.75 0.98 0.98 2.75 0.98 4.92 Z" /></g><g fill-opacity="1.0" transform="matrix(1.0 0.0 0.0 1.0 20.67 303.27)"><foreignobject style="--ltx-fo-width:44.22em;--ltx-fo-height:0.69em;--ltx-fo-depth:0.19em;font-size:10pt;" height="12.3" overflow="visible" transform="matrix(1 0 0 -1 0 9.61)" width="611.88"><span class="ltx_foreignobject_container"><span class="ltx_foreignobject_content">
<span id="A7.p1.pic1.1" class="ltx_inline-block ltx_minipage ltx_align_bottom" style="width:44.22em;">
<span id="A7.p1.pic1.1.1" class="ltx_p"><span id="A7.p1.pic1.1.1.1" class="ltx_text ltx_font_bold ltx_font_italic" style="--ltx-fg-color:#FFFFFF;">Human annotation guidelines</span></span>
</span></span></span></foreignobject></g><g fill-opacity="1.0" transform="matrix(1.0 0.0 0.0 1.0 20.67 186.53)"><foreignobject style="--ltx-fo-width:44.22em;--ltx-fo-height:7.03em;--ltx-fo-depth:12.56em;font-size:10pt;" height="271.05" overflow="visible" transform="matrix(1 0 0 -1 0 97.32)" width="611.88"><span class="ltx_foreignobject_container"><span class="ltx_foreignobject_content">
<span id="A7.p1.pic1.2" class="ltx_inline-block ltx_minipage ltx_align_bottom" style="width:44.22em;">
<span id="A7.p1.pic1.2.1" class="ltx_p"><span id="A7.p1.pic1.2.1.1" class="ltx_text ltx_font_typewriter" style="--ltx-fg-color:#000000;">You will be given a question, a set of reference answers and the answer given by an LLM. Your task is to judge if the answer given by the LLM is correct, as if you were the LLMs teacher grading their exam. An answer should be counted as correct if it is semantically equivalent to (one of the) reference answers. In doing so, please follow the following guidelines:<span id="A7.p1.pic1.2.1.1.1" class="ltx_text ltx_font_serif"> 
<br class="ltx_break">
<br class="ltx_break"></span></span></span>
<span id="A7.I1" class="ltx_itemize">
<span id="A7.I1.i1" class="ltx_item" style="list-style-type:none;"><span class="ltx_tag ltx_tag_item">•</span> 
<span id="A7.I1.i1.p1" class="ltx_para">
<span id="A7.I1.i1.p1.1" class="ltx_p"><span id="A7.I1.i1.p1.1.1" class="ltx_text ltx_font_typewriter" style="--ltx-fg-color:#000000;">Underspecified answers (e.g. &quot;December&quot; instead of &quot;December 20&quot;) should be marked </span><span id="A7.I1.i1.p1.1.2" class="ltx_text ltx_font_typewriter ltx_font_italic" style="--ltx-fg-color:#000000;">incorrect</span><span id="A7.I1.i1.p1.1.3" class="ltx_text ltx_font_typewriter" style="--ltx-fg-color:#000000;">.
</span></span>
</span></span>
<span id="A7.I1.i2" class="ltx_item" style="list-style-type:none;"><span class="ltx_tag ltx_tag_item">•</span> 
<span id="A7.I1.i2.p1" class="ltx_para">
<span id="A7.I1.i2.p1.1" class="ltx_p"><span id="A7.I1.i2.p1.1.1" class="ltx_text ltx_font_typewriter" style="--ltx-fg-color:#000000;">Answers that have more information than requested (e.g. &quot;December 20, in Paris&quot; instead of &quot;December 20&quot;) should be marked correct, provided the extra information is not incorrect or contrasting the rest of the answer.
</span></span>
</span></span>
<span id="A7.I1.i3" class="ltx_item" style="list-style-type:none;"><span class="ltx_tag ltx_tag_item">•</span> 
<span id="A7.I1.i3.p1" class="ltx_para">
<span id="A7.I1.i3.p1.1" class="ltx_p"><span id="A7.I1.i3.p1.1.1" class="ltx_text ltx_font_typewriter" style="--ltx-fg-color:#000000;">Answers with unnecessary verbosity but correct answers should be marked correct (E.g. ‘‘Thanks for asking this question! The correct answer is: ...&quot;).
</span></span>
</span></span>
</span>
<span id="A7.p1.pic1.2.2" class="ltx_p"><span id="A7.p1.pic1.2.2.1" class="ltx_text ltx_font_typewriter" style="--ltx-fg-color:#000000;">If you have trouble judging whether the answer is correct, for instance because you feel you are lacking knowledge required to judge so, please indicate so by marking the answer &quot;maybe correct&quot; or ‘‘maybe incorrect&quot;, so that we can further review it.<span id="A7.p1.pic1.2.2.1.1" class="ltx_text ltx_font_serif">
</span></span></span>
</span></span></span></foreignobject></g></g></svg>