<span id="A1.I4.i1.p1" class="ltx_para">
<span id="A1.I4.i1.p1.1" class="ltx_p"><span id="A1.I4.i1.p1.1.1" class="ltx_text" style="--ltx-fg-color:#000000;">Carefully read the Situation (Premise) and the Claim (Hypothesis) to understand their key elements.</span></span>
