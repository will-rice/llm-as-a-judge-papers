<span id="A6.p4.pic1.1" class="ltx_inline-block ltx_minipage ltx_align_bottom" style="width:28.36em;">
<span id="A6.p4.pic1.1.1" class="ltx_p"><span id="A6.p4.pic1.1.1.1" class="ltx_text ltx_font_bold" style="--ltx-fg-color:#000000;">Inverse-Variance Weighted Estimator (IVWE)</span></span>
</span></span></span></foreignobject></g><g fill-opacity="1.0" transform="matrix(1.0 0.0 0.0 1.0 13.07 16.61)"><foreignobject style="--ltx-fo-width:32.61em;--ltx-fo-height:14.94em;--ltx-fo-depth:0.36em;font-size:10pt;" height="211.65" overflow="visible" transform="matrix(1 0 0 -1 0 206.73)" width="451.23"><span class="ltx_foreignobject_container"><span class="ltx_foreignobject_content">
<span id="A6.p4.pic1.2" class="ltx_inline-block ltx_minipage ltx_align_bottom" style="width:32.61em;">
<span id="A6.p4.pic1.2.1" class="ltx_p"><span id="A6.p4.pic1.2.1.1" class="ltx_text ltx_font_bold" style="--ltx-fg-color:#000000;">Input:<span id="A6.p4.pic1.2.1.1.1" class="ltx_text ltx_font_medium"> An <em id="A6.p4.pic1.2.1.1.1.1" class="ltx_emph ltx_font_bold ltx_font_italic">allocation</em> <math id="A6.p4.pic1.m1" class="ltx_Math" alttext="(N_{k,j})_{k,j}\in{\mathbb{N}}_{0}^{K\times J}" display="inline" intent=":literal"><semantics><mrow><msub><mrow><mo style="--ltx-fg-color:#000000;" mathcolor="#000000" stretchy="false">(</mo><msub><mi style="--ltx-fg-color:#000000;" mathcolor="#000000">N</mi><mrow><mi style="--ltx-fg-color:#000000;" mathcolor="#000000">k</mi><mo style="--ltx-fg-color:#000000;" mathcolor="#000000">,</mo><mi style="--ltx-fg-color:#000000;" mathcolor="#000000">j</mi></mrow></msub><mo style="--ltx-fg-color:#000000;" mathcolor="#000000" stretchy="false">)</mo></mrow><mrow><mi style="--ltx-fg-color:#000000;" mathcolor="#000000">k</mi><mo style="--ltx-fg-color:#000000;" mathcolor="#000000">,</mo><mi style="--ltx-fg-color:#000000;" mathcolor="#000000">j</mi></mrow></msub><mo style="--ltx-fg-color:#000000;" mathcolor="#000000">∈</mo><msubsup><mi style="--ltx-fg-color:#000000;" mathcolor="#000000">ℕ</mi><mn style="--ltx-fg-color:#000000;" mathcolor="#000000">0</mn><mrow><mi style="--ltx-fg-color:#000000;" mathcolor="#000000">K</mi><mo style="--ltx-fg-color:#000000;" lspace="0.222em" mathcolor="#000000" rspace="0.222em">×</mo><mi style="--ltx-fg-color:#000000;" mathcolor="#000000">J</mi></mrow></msubsup></mrow><annotation encoding="application/x-tex">(N_{k,j})_{k,j}\in{\mathbb{N}}_{0}^{K\times J}</annotation></semantics></math>, variance profile <math id="A6.p4.pic1.m2" class="ltx_Math" alttext="\bm{\sigma}=(\sigma_{k,j})_{k,j}\in{\mathbb{R}}_{&gt;0}^{K\times J}" display="inline" intent=":literal"><semantics><mrow><mi style="--ltx-fg-color:#000000;" mathcolor="#000000">𝝈</mi><mo style="--ltx-fg-color:#000000;" mathcolor="#000000">=</mo><msub><mrow><mo style="--ltx-fg-color:#000000;" mathcolor="#000000" stretchy="false">(</mo><msub><mi style="--ltx-fg-color:#000000;" mathcolor="#000000">σ</mi><mrow><mi style="--ltx-fg-color:#000000;" mathcolor="#000000">k</mi><mo style="--ltx-fg-color:#000000;" mathcolor="#000000">,</mo><mi style="--ltx-fg-color:#000000;" mathcolor="#000000">j</mi></mrow></msub><mo style="--ltx-fg-color:#000000;" mathcolor="#000000" stretchy="false">)</mo></mrow><mrow><mi style="--ltx-fg-color:#000000;" mathcolor="#000000">k</mi><mo style="--ltx-fg-color:#000000;" mathcolor="#000000">,</mo><mi style="--ltx-fg-color:#000000;" mathcolor="#000000">j</mi></mrow></msub><mo style="--ltx-fg-color:#000000;" mathcolor="#000000">∈</mo><msubsup><mi style="--ltx-fg-color:#000000;" mathcolor="#000000">ℝ</mi><mrow><mphantom></mphantom><mo style="--ltx-fg-color:#000000;" mathcolor="#000000">&gt;</mo><mn style="--ltx-fg-color:#000000;" mathcolor="#000000">0</mn></mrow><mrow><mi style="--ltx-fg-color:#000000;" mathcolor="#000000">K</mi><mo style="--ltx-fg-color:#000000;" lspace="0.222em" mathcolor="#000000" rspace="0.222em">×</mo><mi style="--ltx-fg-color:#000000;" mathcolor="#000000">J</mi></mrow></msubsup></mrow><annotation encoding="application/x-tex">\bm{\sigma}=(\sigma_{k,j})_{k,j}\in{\mathbb{R}}_{&gt;0}^{K\times J}</annotation></semantics></math></span></span></span>
<span id="A6.I1" class="ltx_enumerate ltx_leftmargin_flush">
<span id="A6.I1.i1" class="ltx_item" style="list-style-type:none;"><span class="ltx_tag ltx_tag_item">1.</span> 
<span id="A6.I1.i1.p1" class="ltx_para">
<span id="A6.I1.i1.p1.1" class="ltx_p"><span id="A6.I1.i1.p1.1.1" class="ltx_text" style="--ltx-fg-color:#000000;">For each </span><math id="A6.I1.i1.p1.m1" class="ltx_Math" alttext="(k,j)" display="inline" intent=":literal"><semantics><mrow><mo style="--ltx-fg-color:#000000;" mathcolor="#000000" stretchy="false">(</mo><mi style="--ltx-fg-color:#000000;" mathcolor="#000000">k</mi><mo style="--ltx-fg-color:#000000;" mathcolor="#000000">,</mo><mi style="--ltx-fg-color:#000000;" mathcolor="#000000">j</mi><mo style="--ltx-fg-color:#000000;" mathcolor="#000000" stretchy="false">)</mo></mrow><annotation encoding="application/x-tex">(k,j)</annotation></semantics></math><span id="A6.I1.i1.p1.1.2" class="ltx_text" style="--ltx-fg-color:#000000;">, compute </span><math id="A6.I1.i1.p1.m2" class="ltx_Math" alttext="\hat{s}_{k,j}\coloneq\frac{1}{N_{k,j}}\sum_{i=1}^{N_{k,j}}{s}_{k,j}^{(i)}" display="inline" intent=":literal"><semantics><mrow><msub><mover accent="true"><mi style="--ltx-fg-color:#000000;" mathcolor="#000000">s</mi><mo style="--ltx-fg-color:#000000;" mathcolor="#000000">^</mo></mover><mrow><mi style="--ltx-fg-color:#000000;" mathcolor="#000000">k</mi><mo style="--ltx-fg-color:#000000;" mathcolor="#000000">,</mo><mi style="--ltx-fg-color:#000000;" mathcolor="#000000">j</mi></mrow></msub><mo style="--ltx-fg-color:#000000;" mathcolor="#000000">≔</mo><mrow><mfrac style="--ltx-fg-color:#000000;" mathcolor="#000000"><mn style="--ltx-fg-color:#000000;" mathcolor="#000000">1</mn><msub><mi style="--ltx-fg-color:#000000;" mathcolor="#000000">N</mi><mrow><mi style="--ltx-fg-color:#000000;" mathcolor="#000000">k</mi><mo style="--ltx-fg-color:#000000;" mathcolor="#000000">,</mo><mi style="--ltx-fg-color:#000000;" mathcolor="#000000">j</mi></mrow></msub></mfrac><mo lspace="0em" rspace="0em">​</mo><mrow><msubsup><mo style="--ltx-fg-color:#000000;" mathcolor="#000000">∑</mo><mrow><mi style="--ltx-fg-color:#000000;" mathcolor="#000000">i</mi><mo style="--ltx-fg-color:#000000;" mathcolor="#000000">=</mo><mn style="--ltx-fg-color:#000000;" mathcolor="#000000">1</mn></mrow><msub><mi style="--ltx-fg-color:#000000;" mathcolor="#000000">N</mi><mrow><mi style="--ltx-fg-color:#000000;" mathcolor="#000000">k</mi><mo style="--ltx-fg-color:#000000;" mathcolor="#000000">,</mo><mi style="--ltx-fg-color:#000000;" mathcolor="#000000">j</mi></mrow></msub></msubsup><msubsup><mi style="--ltx-fg-color:#000000;" mathcolor="#000000">s</mi><mrow><mi style="--ltx-fg-color:#000000;" mathcolor="#000000">k</mi><mo style="--ltx-fg-color:#000000;" mathcolor="#000000">,</mo><mi style="--ltx-fg-color:#000000;" mathcolor="#000000">j</mi></mrow><mrow><mo style="--ltx-fg-color:#000000;" mathcolor="#000000" stretchy="false">(</mo><mi style="--ltx-fg-color:#000000;" mathcolor="#000000">i</mi><mo style="--ltx-fg-color:#000000;" mathcolor="#000000" stretchy="false">)</mo></mrow></msubsup></mrow></mrow></mrow><annotation encoding="application/x-tex">\hat{s}_{k,j}\coloneq\frac{1}{N_{k,j}}\sum_{i=1}^{N_{k,j}}{s}_{k,j}^{(i)}</annotation></semantics></math><span id="A6.I1.i1.p1.1.3" class="ltx_text" style="--ltx-fg-color:#000000;">, if </span><math id="A6.I1.i1.p1.m3" class="ltx_Math" alttext="N_{k,j}\geq 1" display="inline" intent=":literal"><semantics><mrow><msub><mi style="--ltx-fg-color:#000000;" mathcolor="#000000">N</mi><mrow><mi style="--ltx-fg-color:#000000;" mathcolor="#000000">k</mi><mo style="--ltx-fg-color:#000000;" mathcolor="#000000">,</mo><mi style="--ltx-fg-color:#000000;" mathcolor="#000000">j</mi></mrow></msub><mo style="--ltx-fg-color:#000000;" mathcolor="#000000">≥</mo><mn style="--ltx-fg-color:#000000;" mathcolor="#000000">1</mn></mrow><annotation encoding="application/x-tex">N_{k,j}\geq 1</annotation></semantics></math><span id="A6.I1.i1.p1.1.4" class="ltx_text" style="--ltx-fg-color:#000000;">; else, set </span><math id="A6.I1.i1.p1.m4" class="ltx_Math" alttext="\hat{s}_{k,j}=0" display="inline" intent=":literal"><semantics><mrow><msub><mover accent="true"><mi style="--ltx-fg-color:#000000;" mathcolor="#000000">s</mi><mo style="--ltx-fg-color:#000000;" mathcolor="#000000">^</mo></mover><mrow><mi style="--ltx-fg-color:#000000;" mathcolor="#000000">k</mi><mo style="--ltx-fg-color:#000000;" mathcolor="#000000">,</mo><mi style="--ltx-fg-color:#000000;" mathcolor="#000000">j</mi></mrow></msub><mo style="--ltx-fg-color:#000000;" mathcolor="#000000">=</mo><mn style="--ltx-fg-color:#000000;" mathcolor="#000000">0</mn></mrow><annotation encoding="application/x-tex">\hat{s}_{k,j}=0</annotation></semantics></math><span id="A6.I1.i1.p1.1.5" class="ltx_text" style="--ltx-fg-color:#000000;">;</span></span>
</span></span>
<span id="A6.I1.i2" class="ltx_item" style="list-style-type:none;"><span class="ltx_tag ltx_tag_item">2.</span> 
<span id="A6.I1.i2.p1" class="ltx_para">
<span id="A6.I1.i2.p1.1" class="ltx_p"><span id="A6.I1.i2.p1.1.1" class="ltx_text" style="--ltx-fg-color:#000000;">Aggregate the estimators per </span><math id="A6.I1.i2.p1.m1" class="ltx_Math" alttext="k" display="inline" intent=":literal"><semantics><mi style="--ltx-fg-color:#000000;" mathcolor="#000000">k</mi><annotation encoding="application/x-tex">k</annotation></semantics></math><span id="A6.I1.i2.p1.1.2" class="ltx_text" style="--ltx-fg-color:#000000;"> as follows:</span></span>
<span id="A6.E166" class="ltx_equation ltx_eqn_table">

<span><span class="ltx_equation ltx_eqn_row ltx_align_baseline">
<span class="ltx_eqn_cell ltx_eqn_center_padleft"></span>
<span class="ltx_eqn_cell ltx_align_center"><math id="A6.E166.m1" class="ltx_Math" alttext="\hat{s}_{k}\coloneq\left(\sum_{j=1}^{J}\frac{N_{k,j}}{\sigma_{k,j}^{2}}\right)^{-1}\sum_{j=1}^{J}\frac{N_{k,j}\hat{s}_{k,j}}{\sigma_{k,j}^{2}}." display="block" intent=":literal"><semantics><mrow><mrow><msub><mover accent="true"><mi style="--ltx-fg-color:#000000;" mathcolor="#000000">s</mi><mo style="--ltx-fg-color:#000000;" mathcolor="#000000">^</mo></mover><mi style="--ltx-fg-color:#000000;" mathcolor="#000000">k</mi></msub><mo style="--ltx-fg-color:#000000;" mathcolor="#000000">≔</mo><mrow><msup><mrow><mo style="--ltx-fg-color:#000000;" mathcolor="#000000">(</mo><mrow><munderover><mo style="--ltx-fg-color:#000000;" lspace="0em" mathcolor="#000000" movablelimits="false">∑</mo><mrow><mi style="--ltx-fg-color:#000000;" mathcolor="#000000">j</mi><mo style="--ltx-fg-color:#000000;" mathcolor="#000000">=</mo><mn style="--ltx-fg-color:#000000;" mathcolor="#000000">1</mn></mrow><mi style="--ltx-fg-color:#000000;" mathcolor="#000000">J</mi></munderover><mfrac style="--ltx-fg-color:#000000;" mathcolor="#000000"><msub><mi style="--ltx-fg-color:#000000;" mathcolor="#000000">N</mi><mrow><mi style="--ltx-fg-color:#000000;" mathcolor="#000000">k</mi><mo style="--ltx-fg-color:#000000;" mathcolor="#000000">,</mo><mi style="--ltx-fg-color:#000000;" mathcolor="#000000">j</mi></mrow></msub><msubsup><mi style="--ltx-fg-color:#000000;" mathcolor="#000000">σ</mi><mrow><mi style="--ltx-fg-color:#000000;" mathcolor="#000000">k</mi><mo style="--ltx-fg-color:#000000;" mathcolor="#000000">,</mo><mi style="--ltx-fg-color:#000000;" mathcolor="#000000">j</mi></mrow><mn style="--ltx-fg-color:#000000;" mathcolor="#000000">2</mn></msubsup></mfrac></mrow><mo style="--ltx-fg-color:#000000;" mathcolor="#000000">)</mo></mrow><mrow><mo style="--ltx-fg-color:#000000;" mathcolor="#000000">−</mo><mn style="--ltx-fg-color:#000000;" mathcolor="#000000">1</mn></mrow></msup><mo lspace="0em" rspace="0em">​</mo><mrow><munderover><mo style="--ltx-fg-color:#000000;" mathcolor="#000000" movablelimits="false">∑</mo><mrow><mi style="--ltx-fg-color:#000000;" mathcolor="#000000">j</mi><mo style="--ltx-fg-color:#000000;" mathcolor="#000000">=</mo><mn style="--ltx-fg-color:#000000;" mathcolor="#000000">1</mn></mrow><mi style="--ltx-fg-color:#000000;" mathcolor="#000000">J</mi></munderover><mfrac style="--ltx-fg-color:#000000;" mathcolor="#000000"><mrow><msub><mi style="--ltx-fg-color:#000000;" mathcolor="#000000">N</mi><mrow><mi style="--ltx-fg-color:#000000;" mathcolor="#000000">k</mi><mo style="--ltx-fg-color:#000000;" mathcolor="#000000">,</mo><mi style="--ltx-fg-color:#000000;" mathcolor="#000000">j</mi></mrow></msub><mo lspace="0em" rspace="0em">​</mo><msub><mover accent="true"><mi style="--ltx-fg-color:#000000;" mathcolor="#000000">s</mi><mo style="--ltx-fg-color:#000000;" mathcolor="#000000">^</mo></mover><mrow><mi style="--ltx-fg-color:#000000;" mathcolor="#000000">k</mi><mo style="--ltx-fg-color:#000000;" mathcolor="#000000">,</mo><mi style="--ltx-fg-color:#000000;" mathcolor="#000000">j</mi></mrow></msub></mrow><msubsup><mi style="--ltx-fg-color:#000000;" mathcolor="#000000">σ</mi><mrow><mi style="--ltx-fg-color:#000000;" mathcolor="#000000">k</mi><mo style="--ltx-fg-color:#000000;" mathcolor="#000000">,</mo><mi style="--ltx-fg-color:#000000;" mathcolor="#000000">j</mi></mrow><mn style="--ltx-fg-color:#000000;" mathcolor="#000000">2</mn></msubsup></mfrac></mrow></mrow></mrow><mo style="--ltx-fg-color:#000000;" lspace="0em" mathcolor="#000000">.</mo></mrow><annotation encoding="application/x-tex">\hat{s}_{k}\coloneq\left(\sum_{j=1}^{J}\frac{N_{k,j}}{\sigma_{k,j}^{2}}\right)^{-1}\sum_{j=1}^{J}\frac{N_{k,j}\hat{s}_{k,j}}{\sigma_{k,j}^{2}}.</annotation></semantics></math></span>
<span class="ltx_eqn_cell ltx_eqn_center_padright"></span>
<span rowspan="1" class="ltx_eqn_cell ltx_eqn_eqno ltx_align_middle ltx_align_right"><span class="ltx_tag ltx_tag_equation ltx_align_right">(166)</span></span></span></span>
</span>
</span></span>
</span>
<span id="A6.p4.pic1.2.2" class="ltx_p"><span id="A6.p4.pic1.2.2.1" class="ltx_text ltx_font_bold" style="--ltx-fg-color:#000000;">Output:<span id="A6.p4.pic1.2.2.1.1" class="ltx_text ltx_font_medium"> <math id="A6.p4.pic1.m3" class="ltx_Math" alttext="\hat{{\bm{s}}}\coloneq(\hat{s}_{k})_{k\in[K]}" display="inline" intent=":literal"><semantics><mrow><mover accent="true"><mi style="--ltx-fg-color:#000000;" mathcolor="#000000">𝒔</mi><mo style="--ltx-fg-color:#000000;" mathcolor="#000000">^</mo></mover><mo style="--ltx-fg-color:#000000;" mathcolor="#000000">≔</mo><msub><mrow><mo style="--ltx-fg-color:#000000;" mathcolor="#000000" stretchy="false">(</mo><msub><mover accent="true"><mi style="--ltx-fg-color:#000000;" mathcolor="#000000">s</mi><mo style="--ltx-fg-color:#000000;" mathcolor="#000000">^</mo></mover><mi style="--ltx-fg-color:#000000;" mathcolor="#000000">k</mi></msub><mo style="--ltx-fg-color:#000000;" mathcolor="#000000" stretchy="false">)</mo></mrow><mrow><mi style="--ltx-fg-color:#000000;" mathcolor="#000000">k</mi><mo style="--ltx-fg-color:#000000;" mathcolor="#000000">∈</mo><mrow><mo style="--ltx-fg-color:#000000;" mathcolor="#000000" stretchy="false">[</mo><mi style="--ltx-fg-color:#000000;" mathcolor="#000000">K</mi><mo style="--ltx-fg-color:#000000;" mathcolor="#000000" stretchy="false">]</mo></mrow></mrow></msub></mrow><annotation encoding="application/x-tex">\hat{{\bm{s}}}\coloneq(\hat{s}_{k})_{k\in[K]}</annotation></semantics></math></span></span></span>
</span></span></span></foreignobject></g></g></svg>