<span id="A1.SS2.p1.pic1.2.1" class="ltx_p"><span id="A1.SS2.p1.pic1.2.1.1" class="ltx_text" style="--ltx-fg-color:#000000;">&lt;|im_start|&gt;system
<br class="ltx_break">You are a highly efficient assistant, who evaluates and selects the best large language model (LLMs) based on the quality of their responses to a given instruction. This process will be used to create a leaderboard reflecting the most accurate and human-preferred answers.
<br class="ltx_break">&lt;|im_end|&gt;
<br class="ltx_break">&lt;|im_start|&gt;user
<br class="ltx_break">I require a leaderboard for various large language models. I’ll provide you with prompts given to these models and their corresponding outputs. Your task is to assess these responses, and select the model that produces the best output from a human perspective.
<br class="ltx_break">
<br class="ltx_break">## Instruction
<br class="ltx_break">
<br class="ltx_break">{
<br class="ltx_break"><code id="A1.SS2.p1.pic1.2.1.1.1" class="ltx_verbatim ltx_font_typewriter">    </code>“instruction”: ““<span id="A1.SS2.p1.pic1.2.1.1.2" class="ltx_text" style="--ltx-fg-color:#0000FF;">{instruction}</span>””,
<br class="ltx_break">}
<br class="ltx_break">
<br class="ltx_break">## Model Outputs
<br class="ltx_break">
<br class="ltx_break">Here are the unordered outputs from the models. Each output is associated with a specific model, identified by a unique model identifier.
<br class="ltx_break">
<br class="ltx_break">{
<br class="ltx_break"><code id="A1.SS2.p1.pic1.2.1.1.3" class="ltx_verbatim ltx_font_typewriter">    </code>{
<br class="ltx_break"><code id="A1.SS2.p1.pic1.2.1.1.4" class="ltx_verbatim ltx_font_typewriter">    </code><code id="A1.SS2.p1.pic1.2.1.1.5" class="ltx_verbatim ltx_font_typewriter">    </code> “model_identifier”: “m”,
<br class="ltx_break"><code id="A1.SS2.p1.pic1.2.1.1.6" class="ltx_verbatim ltx_font_typewriter">    </code><code id="A1.SS2.p1.pic1.2.1.1.7" class="ltx_verbatim ltx_font_typewriter">    </code> “output”: ““<span id="A1.SS2.p1.pic1.2.1.1.8" class="ltx_text" style="--ltx-fg-color:#0000FF;">{output_1}</span>””
<br class="ltx_break"><code id="A1.SS2.p1.pic1.2.1.1.9" class="ltx_verbatim ltx_font_typewriter">    </code>},
<br class="ltx_break"><code id="A1.SS2.p1.pic1.2.1.1.10" class="ltx_verbatim ltx_font_typewriter">    </code>{
<br class="ltx_break"><code id="A1.SS2.p1.pic1.2.1.1.11" class="ltx_verbatim ltx_font_typewriter">    </code><code id="A1.SS2.p1.pic1.2.1.1.12" class="ltx_verbatim ltx_font_typewriter">    </code> “model_identifier”: “M”,
<br class="ltx_break"><code id="A1.SS2.p1.pic1.2.1.1.13" class="ltx_verbatim ltx_font_typewriter">    </code><code id="A1.SS2.p1.pic1.2.1.1.14" class="ltx_verbatim ltx_font_typewriter">    </code> “output”: ““<span id="A1.SS2.p1.pic1.2.1.1.15" class="ltx_text" style="--ltx-fg-color:#0000FF;">{output_2}</span>””
<br class="ltx_break"><code id="A1.SS2.p1.pic1.2.1.1.16" class="ltx_verbatim ltx_font_typewriter">    </code>}
<br class="ltx_break">}
<br class="ltx_break">
<br class="ltx_break">## Task
<br class="ltx_break">
<br class="ltx_break">Evaluate the models based on the quality and relevance of their outputs, and select the model that generated the best output. Answer by providing the model identifier of the best model. We will use your output as the name of the best model, so make sure your output only contains one of the following model identifiers and nothing else (no quotes, no spaces, no new lines, …): m or M.
<br class="ltx_break">
<br class="ltx_break">## Best Model Identifier
<br class="ltx_break">&lt;|im_end|&gt;
