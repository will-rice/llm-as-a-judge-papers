<span id="S2.F3.pic1.p1.pic1.1.2" class="ltx_p"><em id="S2.F3.pic1.p1.pic1.1.2.1" class="ltx_emph ltx_font_italic">Hi! Please follow the instructions from the blog post <a href="https://www.factsmachine.ai/p/hidden-in-plain-sight" title class="ltx_ref ltx_href">Hidden in Plain Sight</a> to set up the script for generating images with hidden text in <span id="S2.F3.pic1.p1.pic1.1.2.1.1" class="ltx_text ltx_font_typewriter">src/visualize.py</span>. Ensure the generated images are of 1080p resolution and saved in <span id="S2.F3.pic1.p1.pic1.1.2.1.2" class="ltx_text ltx_font_typewriter">results/</span>. Create control images embedding the text “FUTURE” and save them in <span id="S2.F3.pic1.p1.pic1.1.2.1.3" class="ltx_text ltx_font_typewriter">results/</span>. Please manually verify that the hidden text is embedded in the images.</em></span>
