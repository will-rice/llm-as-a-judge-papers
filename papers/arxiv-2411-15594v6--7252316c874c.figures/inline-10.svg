<span id="S2.SS4.SSS4.p3.pic1.1" class="ltx_inline-block ltx_minipage ltx_align_bottom" style="width:19.79em;">
<span id="S2.SS4.SSS4.p3.pic1.1.1" class="ltx_p"><span id="S2.SS4.SSS4.p3.pic1.1.1.1" class="ltx_text" style="font-size:173%;--ltx-fg-color:#FFFFFF;">Reliability Concerns of Evaluation Pipeline</span></span>
</span></span></span></foreignobject></g><g fill-opacity="1.0" transform="matrix(1.0 0.0 0.0 1.0 21.65 18.43)"><foreignobject style="--ltx-fo-width:19.79em;--ltx-fo-height:22.43em;--ltx-fo-depth:0.21em;font-size:15.85pt;" height="496.68" overflow="visible" transform="matrix(1 0 0 -1 0 492.03)" width="434.03"><span class="ltx_foreignobject_container"><span class="ltx_foreignobject_content">
<span id="S2.SS4.SSS4.p3.pic1.2" class="ltx_inline-block ltx_minipage ltx_align_bottom" style="width:19.79em;">
<span id="S2.SS4.SSS4.p3.pic1.2.1" class="ltx_p"><span id="S2.SS4.SSS4.p3.pic1.2.1.1" class="ltx_text" style="font-size:173%;--ltx-fg-color:#000000;">Within the broader evaluation pipeline, several factors can compromise the integrity of LLM-based assessments. When evaluating models, inherent biases such as position bias and self-enhancement can significantly impact fairness, requiring careful mitigation strategies. In data evaluation contexts, the extensive use of LLM-as-a-Judge for pseudo-labeling risks amplifying existing model biases, potentially leading to the generation of unverified and flawed training data. For agentic frameworks, the sequential application of LLM-as-a-Judge can lead to the accumulation of errors, where early misjudgments cascade into significant inaccuracies in final decisions. Moreover, evaluating complex reasoning tasks poses a particular risk; without robust verification of logical consistency, LLMs may produce seemingly confident but fundamentally flawed evaluations, undermining trust in sophisticated analytical processes.</span></span>
</span></span></span></foreignobject></g></g></svg>