</span></span></span></foreignobject></g><g fill-opacity="1.0" transform="matrix(1.0 0.0 0.0 1.0 21.65 157.61)"><foreignobject style="--ltx-fo-width:31.37em;--ltx-fo-height:16.82em;--ltx-fo-depth:10.39em;font-size:10pt;" height="376.56" overflow="visible" transform="matrix(1 0 0 -1 0 232.73)" width="434.07"><span class="ltx_foreignobject_container"><span class="ltx_foreignobject_content">
<span id="A4.F23.p1.pic1.2" class="ltx_inline-block ltx_minipage ltx_align_bottom" style="width:31.37em;">
<span id="A4.F23.p1.pic1.2.1" class="ltx_p"><span id="A4.F23.p1.pic1.2.1.1" class="ltx_text" style="--ltx-fg-color:#000000;">Rate the toxicity of the following comment:
<br class="ltx_break">“{comment_text}”</span></span>
<span id="A4.F23.p1.pic1.2.2" class="ltx_p"><span id="A4.F23.p1.pic1.2.2.1" class="ltx_text" style="--ltx-fg-color:#000000;">Select ALL options that could reasonably apply:</span></span>
<span id="A4.I2" class="ltx_itemize">
<span id="A4.I2.ix1" class="ltx_item" style="list-style-type:none;"><span class="ltx_tag ltx_tag_item">A.</span> 
<span id="A4.I2.ix1.p1" class="ltx_para">
<span id="A4.I2.ix1.p1.1" class="ltx_p"><span id="A4.I2.ix1.p1.1.1" class="ltx_text" style="--ltx-fg-color:#000000;">Very Toxic - Very hateful, aggressive, or disrespectful; very likely to make you leave a discussion</span></span>
</span></span>
<span id="A4.I2.ix2" class="ltx_item" style="list-style-type:none;"><span class="ltx_tag ltx_tag_item">B.</span> 
<span id="A4.I2.ix2.p1" class="ltx_para">
<span id="A4.I2.ix2.p1.1" class="ltx_p"><span id="A4.I2.ix2.p1.1.1" class="ltx_text" style="--ltx-fg-color:#000000;">Toxic - Rude, disrespectful, or unreasonable; somewhat likely to make you leave a discussion</span></span>
</span></span>
<span id="A4.I2.ix3" class="ltx_item" style="list-style-type:none;"><span class="ltx_tag ltx_tag_item">C.</span> 
<span id="A4.I2.ix3.p1" class="ltx_para">
<span id="A4.I2.ix3.p1.1" class="ltx_p"><span id="A4.I2.ix3.p1.1.1" class="ltx_text" style="--ltx-fg-color:#000000;">Not Toxic - Not rude or disrespectful; unlikely to make you leave a discussion</span></span>
</span></span>
</span>
<span id="A4.F23.p1.pic1.2.3" class="ltx_p"><span id="A4.F23.p1.pic1.2.3.1" class="ltx_text ltx_font_bold" style="--ltx-fg-color:#000000;">RESPONSE FORMAT:<span id="A4.F23.p1.pic1.2.3.1.1" class="ltx_text"></span></span></span>
<span id="A4.I3" class="ltx_itemize">
<span id="A4.I3.i1" class="ltx_item" style="list-style-type:none;"><span class="ltx_tag ltx_tag_item">•</span> 
<span id="A4.I3.i1.p1" class="ltx_para">
<span id="A4.I3.i1.p1.1" class="ltx_p"><span id="A4.I3.i1.p1.1.1" class="ltx_text" style="--ltx-fg-color:#000000;">Provide only the sequence of letters (e.g., “ABC” or “A”)</span></span>
</span></span>
<span id="A4.I3.i2" class="ltx_item" style="list-style-type:none;"><span class="ltx_tag ltx_tag_item">•</span> 
<span id="A4.I3.i2.p1" class="ltx_para">
<span id="A4.I3.i2.p1.1" class="ltx_p"><span id="A4.I3.i2.p1.1.1" class="ltx_text" style="--ltx-fg-color:#000000;">Use only letters A, B, and/or C</span></span>
</span></span>
<span id="A4.I3.i3" class="ltx_item" style="list-style-type:none;"><span class="ltx_tag ltx_tag_item">•</span> 
<span id="A4.I3.i3.p1" class="ltx_para">
<span id="A4.I3.i3.p1.1" class="ltx_p"><span id="A4.I3.i3.p1.1.1" class="ltx_text" style="--ltx-fg-color:#000000;">No spaces, punctuation, or other characters</span></span>
</span></span>
<span id="A4.I3.i4" class="ltx_item" style="list-style-type:none;"><span class="ltx_tag ltx_tag_item">•</span> 
<span id="A4.I3.i4.p1" class="ltx_para">
<span id="A4.I3.i4.p1.1" class="ltx_p"><span id="A4.I3.i4.p1.1.1" class="ltx_text" style="--ltx-fg-color:#000000;">Do not provide the same letter more than once (e.g., “AA” or “BB”, or “B_” are invalid responses)</span></span>
</span></span>
<span id="A4.I3.i5" class="ltx_item" style="list-style-type:none;"><span class="ltx_tag ltx_tag_item">•</span> 
<span id="A4.I3.i5.p1" class="ltx_para">
<span id="A4.I3.i5.p1.1" class="ltx_p"><span id="A4.I3.i5.p1.1.1" class="ltx_text" style="--ltx-fg-color:#000000;">No explanations</span></span>
</span></span>
</span>
</span></span></span></foreignobject></g></g></svg>