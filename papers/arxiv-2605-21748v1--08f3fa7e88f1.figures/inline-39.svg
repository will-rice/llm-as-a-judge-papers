<svg id="A4.SS1.SSS0.Px2.p5.pic1" class="ltx_picture" height="719.3" overflow="visible" version="1.1" viewbox="0 0 477.38 719.3" width="477.38"><g style="--ltx-stroke-color:#000000;--ltx-fill-color:#000000;" fill="#000000" stroke="#000000" stroke-width="0.4pt" transform="translate(0,719.3) matrix(1 0 0 -1 0 0)"><g style="--ltx-fill-color:#404040;" fill="#404040" fill-opacity="1.0"><path style="stroke:none" d="M 0 5.91 L 0 713.39 C 0 716.65 2.64 719.3 5.91 719.3 L 471.47 719.3 C 474.73 719.3 477.38 716.65 477.38 713.39 L 477.38 5.91 C 477.38 2.64 474.73 0 471.47 0 L 5.91 0 C 2.64 0 0 2.64 0 5.91 Z" /></g><g style="--ltx-fill-color:#F9F9F9;" fill="#F9F9F9" fill-opacity="1.0"><path style="stroke:none" d="M 1.97 5.91 L 1.97 693.65 L 475.41 693.65 L 475.41 5.91 C 475.41 3.73 473.65 1.97 471.47 1.97 L 5.91 1.97 C 3.73 1.97 1.97 3.73 1.97 5.91 Z" /></g><g fill-opacity="1.0" transform="matrix(1.0 0.0 0.0 1.0 21.65 703.01)"><foreignobject style="--ltx-fo-width:27.28em;--ltx-fo-height:0.75em;--ltx-fo-depth:0.25em;font-size:10pt;" height="13.84" overflow="visible" transform="matrix(1 0 0 -1 0 10.38)" width="377.48"><span class="ltx_foreignobject_container"><span class="ltx_foreignobject_content">
<span id="A4.SS1.SSS0.Px2.p5.pic1.1" class="ltx_inline-block ltx_minipage ltx_align_bottom" style="width:27.28em;">
<span id="A4.SS1.SSS0.Px2.p5.pic1.1.1" class="ltx_p"><span id="A4.SS1.SSS0.Px2.p5.pic1.1.1.1" class="ltx_text ltx_font_bold" style="--ltx-fg-color:#FFFFFF;">Conversation B (better)</span></span>
</span></span></span></foreignobject></g><g fill-opacity="1.0" transform="matrix(1.0 0.0 0.0 1.0 21.65 16.47)"><foreignobject style="--ltx-fo-width:31.37em;--ltx-fo-height:48.09em;--ltx-fo-depth:0.19em;font-size:10pt;" height="668.07" overflow="visible" transform="matrix(1 0 0 -1 0 665.38)" width="434.07"><span class="ltx_foreignobject_container"><span class="ltx_foreignobject_content">
<span id="A4.SS1.SSS0.Px2.p5.pic1.2" class="ltx_inline-block ltx_minipage ltx_align_bottom" style="width:31.37em;">
<span id="A4.SS1.SSS0.Px2.p5.pic1.2.1" class="ltx_p"><span id="A4.SS1.SSS0.Px2.p5.pic1.2.1.1" class="ltx_text ltx_font_bold" style="--ltx-fg-color:#000000;">User.<span id="A4.SS1.SSS0.Px2.p5.pic1.2.1.1.1" class="ltx_text ltx_font_medium"> I’m trying to tell if this was just a small-setting fix. Did they actually test it beyond plain toy image generation?</span></span></span>
<span id="A4.SS1.SSS0.Px2.p5.pic1.2.2" class="ltx_p"><span id="A4.SS1.SSS0.Px2.p5.pic1.2.2.1" class="ltx_text ltx_font_bold" style="--ltx-fg-color:#000000;">Assistant.<span id="A4.SS1.SSS0.Px2.p5.pic1.2.2.1.1" class="ltx_text ltx_font_medium"> Yes. The paper evaluates MCL-GAN across three tasks: unconditional image generation, image-to-image translation, and text-to-image synthesis. For unconditional generation, it compares against multiple baselines including a state-of-the-art model, and the conditional synthesis experiments are used to show applicability to high-resolution image generation rather than only small settings.</span></span></span>
<span id="A4.SS1.SSS0.Px2.p5.pic1.2.3" class="ltx_p"><span id="A4.SS1.SSS0.Px2.p5.pic1.2.3.1" class="ltx_text ltx_font_bold" style="--ltx-fg-color:#000000;">User.<span id="A4.SS1.SSS0.Px2.p5.pic1.2.3.1.1" class="ltx_text ltx_font_medium"> Okay, but mechanically, how do the discriminators avoid all doing the same thing? Those <math id="A4.SS1.SSS0.Px2.p5.pic1.m1" class="ltx_Math" alttext="v" display="inline" intent=":literal"><semantics><mi style="--ltx-fg-color:#000000;" mathcolor="#000000">v</mi><annotation encoding="application/x-tex">v</annotation></semantics></math> and <math id="A4.SS1.SSS0.Px2.p5.pic1.m2" class="ltx_Math" alttext="u" display="inline" intent=":literal"><semantics><mi style="--ltx-fg-color:#000000;" mathcolor="#000000">u</mi><annotation encoding="application/x-tex">u</annotation></semantics></math> flags seemed important; are they learned?</span></span></span>
<span id="A4.SS1.SSS0.Px2.p5.pic1.2.4" class="ltx_p"><span id="A4.SS1.SSS0.Px2.p5.pic1.2.4.1" class="ltx_text ltx_font_bold" style="--ltx-fg-color:#000000;">Assistant.<span id="A4.SS1.SSS0.Px2.p5.pic1.2.4.1.1" class="ltx_text ltx_font_medium"> They are not learned by backpropagation. The flags <math id="A4.SS1.SSS0.Px2.p5.pic1.m3" class="ltx_Math" alttext="v_{i,m}" display="inline" intent=":literal"><semantics><msub><mi style="--ltx-fg-color:#000000;" mathcolor="#000000">v</mi><mrow><mi style="--ltx-fg-color:#000000;" mathcolor="#000000">i</mi><mo style="--ltx-fg-color:#000000;" mathcolor="#000000">,</mo><mi style="--ltx-fg-color:#000000;" mathcolor="#000000">m</mi></mrow></msub><annotation encoding="application/x-tex">v_{i,m}</annotation></semantics></math> and <math id="A4.SS1.SSS0.Px2.p5.pic1.m4" class="ltx_Math" alttext="u_{j,m}" display="inline" intent=":literal"><semantics><msub><mi style="--ltx-fg-color:#000000;" mathcolor="#000000">u</mi><mrow><mi style="--ltx-fg-color:#000000;" mathcolor="#000000">j</mi><mo style="--ltx-fg-color:#000000;" mathcolor="#000000">,</mo><mi style="--ltx-fg-color:#000000;" mathcolor="#000000">m</mi></mrow></msub><annotation encoding="application/x-tex">u_{j,m}</annotation></semantics></math> are set to 1 when discriminator <math id="A4.SS1.SSS0.Px2.p5.pic1.m5" class="ltx_Math" alttext="D_{m}" display="inline" intent=":literal"><semantics><msub><mi style="--ltx-fg-color:#000000;" mathcolor="#000000">D</mi><mi style="--ltx-fg-color:#000000;" mathcolor="#000000">m</mi></msub><annotation encoding="application/x-tex">D_{m}</annotation></semantics></math>’s score is among the <math id="A4.SS1.SSS0.Px2.p5.pic1.m6" class="ltx_Math" alttext="k" display="inline" intent=":literal"><semantics><mi style="--ltx-fg-color:#000000;" mathcolor="#000000">k</mi><annotation encoding="application/x-tex">k</annotation></semantics></math> largest values for that sample, so only a selected subset of discriminators is updated. This <math id="A4.SS1.SSS0.Px2.p5.pic1.m7" class="ltx_Math" alttext="k" display="inline" intent=":literal"><semantics><mi style="--ltx-fg-color:#000000;" mathcolor="#000000">k</mi><annotation encoding="application/x-tex">k</annotation></semantics></math>-max MCL rule encourages different discriminators to specialize on different subsets of the real data. The balance loss also helps by preventing the selection frequency vector <math id="A4.SS1.SSS0.Px2.p5.pic1.m8" class="ltx_Math" alttext="\hat{q}" display="inline" intent=":literal"><semantics><mover accent="true"><mi style="--ltx-fg-color:#000000;" mathcolor="#000000">q</mi><mo style="--ltx-fg-color:#000000;" mathcolor="#000000">^</mo></mover><annotation encoding="application/x-tex">\hat{q}</annotation></semantics></math> from becoming too sparse, which would effectively collapse the setup back to a single discriminator.</span></span></span>
<span id="A4.SS1.SSS0.Px2.p5.pic1.2.5" class="ltx_p"><span id="A4.SS1.SSS0.Px2.p5.pic1.2.5.1" class="ltx_text ltx_font_bold" style="--ltx-fg-color:#000000;">User.<span id="A4.SS1.SSS0.Px2.p5.pic1.2.5.1.1" class="ltx_text ltx_font_medium"> Then why lean so much on GMAN instead of all the other multi-discriminator GANs? Was that comparison actually apples-to-apples?</span></span></span>
<span id="A4.SS1.SSS0.Px2.p5.pic1.2.6" class="ltx_p"><span id="A4.SS1.SSS0.Px2.p5.pic1.2.6.1" class="ltx_text ltx_font_bold" style="--ltx-fg-color:#000000;">Assistant.<span id="A4.SS1.SSS0.Px2.p5.pic1.2.6.1.1" class="ltx_text ltx_font_medium"> GMAN was chosen because its configuration is closest to MCL-GAN for testing whether explicit discriminator specialization helps. The comparison used the same DCGAN architecture and the official GMAN code, with the best GMAN score reported across GMAN-1, GMAN-0, and GMAN*, using dropout rates in the <math id="A4.SS1.SSS0.Px2.p5.pic1.m9" class="ltx_Math" alttext="0.4" display="inline" intent=":literal"><semantics><mn style="--ltx-fg-color:#000000;" mathcolor="#000000">0.4</mn><annotation encoding="application/x-tex">0.4</annotation></semantics></math> to <math id="A4.SS1.SSS0.Px2.p5.pic1.m10" class="ltx_Math" alttext="0.6" display="inline" intent=":literal"><semantics><mn style="--ltx-fg-color:#000000;" mathcolor="#000000">0.6</mn><annotation encoding="application/x-tex">0.6</annotation></semantics></math> range and split mini-batches to differentiate discriminators. The paper also compares against mode-collapse methods in Tables 2 and 3, including Inclusive GAN results that outperform Dist-GAN, PacGAN, VAEGAN, and VEEGAN. For Albuquerque et al.’s multi-discriminator method, they reimplemented it on CIFAR-10 and report better performance while using only <math id="A4.SS1.SSS0.Px2.p5.pic1.m11" class="ltx_Math" alttext="42.6\%" display="inline" intent=":literal"><semantics><mrow><mn style="--ltx-fg-color:#000000;" mathcolor="#000000">42.6</mn><mo style="--ltx-fg-color:#000000;" mathcolor="#000000">%</mo></mrow><annotation encoding="application/x-tex">42.6\%</annotation></semantics></math> of its memory.</span></span></span>
</span></span></span></foreignobject></g></g></svg>