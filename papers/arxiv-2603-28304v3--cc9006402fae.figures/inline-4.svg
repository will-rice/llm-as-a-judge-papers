</span></span></span></foreignobject></g><g fill-opacity="1.0" transform="matrix(1.0 0.0 0.0 1.0 23.56 18.76)"><foreignobject style="--ltx-fo-width:41.72em;--ltx-fo-height:5.41em;--ltx-fo-depth:0.22em;font-size:10pt;" height="77.95" overflow="visible" transform="matrix(1 0 0 -1 0 74.87)" width="577.29"><span class="ltx_foreignobject_container"><span class="ltx_foreignobject_content">
<span id="A2.p1.pic1.2" class="ltx_inline-block ltx_minipage ltx_align_bottom" style="width:41.72em;">
<span id="A2.p1.pic1.2.1" class="ltx_p"><span id="A2.p1.pic1.2.1.1" class="ltx_text ltx_font_typewriter" style="--ltx-fg-color:#000000;">You are a fair and impartial judge. Your task is to evaluate two AI assistant responses to a user question and decide which one is better.
</span></span>
<span id="A2.p1.pic1.2.2" class="ltx_p"><span id="A2.p1.pic1.2.2.1" class="ltx_text ltx_font_typewriter" style="--ltx-fg-color:#000000;">Respond ONLY with valid JSON using exactly one key:
</span></span><pre id="A2.p1.pic1.2.3" class="ltx_verbatim ltx_font_typewriter" style="--ltx-fg-color:#000000;">
{&quot;judge result&quot;:&quot;A&quot;}
</pre>
<span id="A2.p1.pic1.2.4" class="ltx_p"><span id="A2.p1.pic1.2.4.1" class="ltx_text ltx_font_typewriter" style="--ltx-fg-color:#000000;">Use ‘‘A’’ if assistant A is better, ‘‘B’’ if assistant B is better, and ‘‘C’’ for a tie.
Do not output any additional keys, explanation, markdown, or text.
</span></span>
</span></span></span></foreignobject></g></g></svg>