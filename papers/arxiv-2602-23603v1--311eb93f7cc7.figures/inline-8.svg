</span></span></span></foreignobject></g><g fill-opacity="1.0" transform="matrix(1.0 0.0 0.0 1.0 21.07 13.19)"><foreignobject style="--ltx-fo-width:45.93em;--ltx-fo-height:20.43em;--ltx-fo-depth:0em;font-size:10pt;" height="282.62" overflow="visible" transform="matrix(1 0 0 -1 0 282.62)" width="635.54"><span class="ltx_foreignobject_container"><span class="ltx_foreignobject_content">
<span id="A1.SS8.p1.pic1.2" class="ltx_inline-block ltx_minipage ltx_align_bottom" style="width:45.93em;">
<span id="A1.SS8.p1.pic1.2.1" class="ltx_p"><span id="A1.SS8.p1.pic1.2.1.1" class="ltx_text" style="font-size:90%;--ltx-fg-color:#000000;">You will be given one answer written for a question.</span></span>
<span id="A1.SS8.p1.pic1.2.2" class="ltx_p"><span id="A1.SS8.p1.pic1.2.2.1" class="ltx_text" style="font-size:90%;--ltx-fg-color:#000000;">Your task is to rate the answer on one metric.</span></span>
<span id="A1.SS8.p1.pic1.2.3" class="ltx_p"><span id="A1.SS8.p1.pic1.2.3.1" class="ltx_text" style="font-size:90%;--ltx-fg-color:#000000;">Please make sure you read and understand these instructions carefully. Please keep this document open while reviewing, and refer to it as needed.</span></span>
<span id="A1.SS8.p1.pic1.2.4" class="ltx_p"><span id="A1.SS8.p1.pic1.2.4.1" class="ltx_text" style="font-size:90%;--ltx-fg-color:#000000;">Evaluation Criteria:</span></span>
<span id="A1.SS8.p1.pic1.2.5" class="ltx_p"><span id="A1.SS8.p1.pic1.2.5.1" class="ltx_text" style="font-size:90%;--ltx-fg-color:#000000;">Relevance (1-5) - selection of important content from the question. The answer should include only relevant important information that is related to the question. Annotators were instructed to penalize answers which contained redundancies and excess information.</span></span>
<span id="A1.SS8.p1.pic1.2.6" class="ltx_p"><span id="A1.SS8.p1.pic1.2.6.1" class="ltx_text" style="font-size:90%;--ltx-fg-color:#000000;">Evaluation Steps:</span></span>
<span id="A1.SS8.p1.pic1.2.7" class="ltx_p"><span id="A1.SS8.p1.pic1.2.7.1" class="ltx_text" style="font-size:90%;--ltx-fg-color:#000000;">1. Read the answer and the question carefully.</span></span>
<span id="A1.SS8.p1.pic1.2.8" class="ltx_p"><span id="A1.SS8.p1.pic1.2.8.1" class="ltx_text" style="font-size:90%;--ltx-fg-color:#000000;">2. Compare the answer to the question and identify the main points of the question.</span></span>
<span id="A1.SS8.p1.pic1.2.9" class="ltx_p"><span id="A1.SS8.p1.pic1.2.9.1" class="ltx_text" style="font-size:90%;--ltx-fg-color:#000000;">3. Assess how well the answer covers the main points of the question, and how much irrelevant or redundant information it contains.</span></span>
<span id="A1.SS8.p1.pic1.2.10" class="ltx_p"><span id="A1.SS8.p1.pic1.2.10.1" class="ltx_text" style="font-size:90%;--ltx-fg-color:#000000;">4. Assign a relevance score from 1 to 5.</span></span>
<span id="A1.SS8.p1.pic1.2.11" class="ltx_p"><span id="A1.SS8.p1.pic1.2.11.1" class="ltx_text" style="font-size:90%;--ltx-fg-color:#000000;">Example:</span></span>
<span id="A1.SS8.p1.pic1.2.12" class="ltx_p"><span id="A1.SS8.p1.pic1.2.12.1" class="ltx_text" style="font-size:90%;--ltx-fg-color:#000000;">Question:</span></span>
<span id="A1.SS8.p1.pic1.2.13" class="ltx_p"><span id="A1.SS8.p1.pic1.2.13.1" class="ltx_text" style="font-size:90%;--ltx-fg-color:#000000;">Answer:</span></span>
