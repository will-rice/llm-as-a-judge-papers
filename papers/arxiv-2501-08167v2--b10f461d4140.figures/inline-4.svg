<span id="A1.SSx2.p3.pic1.2" class="ltx_inline-block ltx_minipage ltx_align_bottom" style="width:31.37em;">
<span id="A1.SSx2.p3.pic1.2.1" class="ltx_p"><span id="A1.SSx2.p3.pic1.2.1.1" class="ltx_text ltx_font_italic" style="--ltx-fg-color:#000000;">Theme 3: Global Connections<span id="A1.SSx2.p3.pic1.2.1.1.1" class="ltx_text"></span></span></span>
<span id="A1.I5" class="ltx_itemize">
<span id="A1.I5.i1" class="ltx_item" style="list-style-type:none;"><span class="ltx_tag ltx_tag_item">•</span> 
<span id="A1.I5.i1.p1" class="ltx_para">
<span id="A1.I5.i1.p1.1" class="ltx_p"><span id="A1.I5.i1.p1.1.1" class="ltx_text ltx_font_bold" style="--ltx-fg-color:#000000;">Description:</span><span id="A1.I5.i1.p1.1.2" class="ltx_text" style="--ltx-fg-color:#000000;"> There is a perception that the culture is valued as innovative and there are many opportunities to connect with individuals globally. Having the ability to partner, interact, and work with different individuals from around the globe was valued and meaningful. Some individuals feel opportunities to continue cross-cultural exchange opportunities.</span></span>
</span></span>
<span id="A1.I5.i2" class="ltx_item" style="list-style-type:none;"><span class="ltx_tag ltx_tag_item">•</span> 
<span id="A1.I5.i2.p1" class="ltx_para">
<span id="A1.I5.i2.p1.1" class="ltx_p"><span id="A1.I5.i2.p1.1.1" class="ltx_text ltx_font_bold" style="--ltx-fg-color:#000000;">Quote:</span><span id="A1.I5.i2.p1.1.2" class="ltx_text" style="--ltx-fg-color:#000000;"> I feel it is amazing to be able to collaborate with peers around the world. Would be great to be able to continue to partner in a variety of ways.</span></span>
</span></span>
</span>
</span></span></span></foreignobject></g></g></svg>