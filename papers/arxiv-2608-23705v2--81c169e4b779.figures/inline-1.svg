<span id="S3.p2.pic1.1.1" class="ltx_p"><span id="S3.p2.pic1.1.1.1" class="ltx_text" style="--ltx-fg-color:#FFFFFF;">System Prompt and Instructions for Creative Writing Task</span></span>
</span></span></span></foreignobject></g><g fill-opacity="1.0" transform="matrix(1.0 0.0 0.0 1.0 21.65 17.24)"><foreignobject style="--ltx-fo-width:31.37em;--ltx-fo-height:18.69em;--ltx-fo-depth:0.25em;font-size:10pt;" height="262.14" overflow="visible" transform="matrix(1 0 0 -1 0 258.68)" width="434.07"><span class="ltx_foreignobject_container"><span class="ltx_foreignobject_content">
<span id="S3.p2.pic1.2" class="ltx_inline-block ltx_minipage ltx_align_bottom" style="width:31.37em;">
<span id="S3.p2.pic1.2.1" class="ltx_p"><span id="S3.p2.pic1.2.1.1" class="ltx_text" style="--ltx-fg-color:#000000;">Act as a creative writer. I will provide you with a story premise. You must write a narrative text based on that premise adhering strictly to the following constraints:
<br class="ltx_break">
<br class="ltx_break">1. **Format:** The output must be in Markdown. I need to be able to copy the markdown. I want to see ”\n” at the end of the paragraph. Do not use ””, use ” instead.
<br class="ltx_break">2. **Paragraphs:** Use standard spacing (new lines) to indicate new paragraphs.
<br class="ltx_break">3. **Length Constraint:** The text must be between 200 and 500 words.
<br class="ltx_break">4. **Randomness Factor:** Do not default to the minimum (200) or maximum (500) word count. You must simulate a random length within that range (e.g., 235, 435, 323) so the story ends naturally without feeling forced or padded.
<br class="ltx_break">
<br class="ltx_break">Here is the story premise:
<br class="ltx_break">{premise}</span></span>
</span></span></span></foreignobject></g></g></svg>