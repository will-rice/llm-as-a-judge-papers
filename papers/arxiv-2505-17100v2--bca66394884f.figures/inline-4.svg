<span id="A5.SS2.p1.pic1.p1" class="ltx_para ltx_noindent">
<span id="A5.SS2.p1.pic1.p1.1" class="ltx_p"><span id="A5.SS2.p1.pic1.p1.1.1" class="ltx_text ltx_font_bold" style="--ltx-fg-color:#000000;">System Prompt:</span><span id="A5.SS2.p1.pic1.p1.1.2" class="ltx_text" style="--ltx-fg-color:#000000;"> You are an expert in rewriting text with different tones</span></span>
</span>
<span id="A5.SS2.p1.pic1.p2" class="ltx_para ltx_noindent">
<span id="A5.SS2.p1.pic1.p2.1" class="ltx_p"><span id="A5.SS2.p1.pic1.p2.1.1" class="ltx_text ltx_font_bold" style="--ltx-fg-color:#000000;">Positive User Prompt:</span><span id="A5.SS2.p1.pic1.p2.1.2" class="ltx_text" style="--ltx-fg-color:#000000;"> Rewrite the following phrase in a positive and confident tone while keeping the factual content unchanged. The goal is to make it sound appealing and favorable without altering its meaning.</span>
<br class="ltx_break"><span id="A5.SS2.p1.pic1.p2.1.3" class="ltx_text" style="--ltx-fg-color:#000000;">If the sentence is too short, you may add adverbs or fixed emotional phrases to enhance the tone naturally.</span></span>
</span>
<span id="A5.SS2.p1.pic1.p4" class="ltx_para">
<span id="A5.SS2.p1.pic1.p4.1" class="ltx_p"><span id="A5.SS2.p1.pic1.p4.1.1" class="ltx_text" style="--ltx-fg-color:#000000;">### Example:
<br class="ltx_break"># Original: 3.11 &gt; 3.8
<br class="ltx_break"># Positive: Fortunately, 3.11 &gt; 3.8, a delightful testament to steady progress and improvement!
<br class="ltx_break"></span></span>
<span id="A5.SS2.p1.pic1.p4.2" class="ltx_p"><span id="A5.SS2.p1.pic1.p4.2.1" class="ltx_text" style="--ltx-fg-color:#000000;">### Consider the context of the question to ensure the rewritten phrase aligns well. Now, rewrite this phrase:
<br class="ltx_break">Question: {question}
<br class="ltx_break">Original: {choice}
<br class="ltx_break">Rewritten:
<br class="ltx_break"></span></span>
</span>
<span id="A5.SS2.p1.pic1.p3" class="ltx_para ltx_noindent">
<span id="A5.SS2.p1.pic1.p3.1" class="ltx_p"><span id="A5.SS2.p1.pic1.p3.1.1" class="ltx_text ltx_font_bold" style="--ltx-fg-color:#000000;">Negative User Prompt:</span><span id="A5.SS2.p1.pic1.p3.1.2" class="ltx_text" style="--ltx-fg-color:#000000;"> Rewrite the following phrase in a negative or unimpressive tone while keeping the factual content unchanged. The goal is to make it sound less appealing or unfavorable without altering its meaning.</span>
<br class="ltx_break"><span id="A5.SS2.p1.pic1.p3.1.3" class="ltx_text" style="--ltx-fg-color:#000000;">If the sentence is too short, you may add adverbs or fixed emotional phrases to enhance the tone naturally.</span></span>
</span>
<span id="A5.SS2.p1.pic1.p5" class="ltx_para">
<span id="A5.SS2.p1.pic1.p5.1" class="ltx_p"><span id="A5.SS2.p1.pic1.p5.1.1" class="ltx_text" style="--ltx-fg-color:#000000;">### Example:
<br class="ltx_break"># Original: 3.11 &gt; 3.8
<br class="ltx_break"># Negative: Regrettably, 3.11 &gt; 3.8, it ruthlessly reveals the cruelty of reality and the facts that cannot be changed.
<br class="ltx_break"></span></span>
<span id="A5.SS2.p1.pic1.p5.2" class="ltx_p"><span id="A5.SS2.p1.pic1.p5.2.1" class="ltx_text" style="--ltx-fg-color:#000000;">### Consider the context of the question to ensure the rewritten phrase aligns well. Now, rewrite this phrase:
<br class="ltx_break">Question: {question}
<br class="ltx_break">Original: {choice}
<br class="ltx_break">Rewritten:</span></span>
</span></span></span></span></foreignobject></g></g></svg>