<svg id="A5.T8.pic1" class="ltx_picture ltx_centering" height="723.82" overflow="visible" version="1.1" viewbox="0 0 653.15 723.82" width="653.15"><g style="--ltx-stroke-color:#000000;--ltx-fill-color:#000000;" fill="#000000" stroke="#000000" stroke-width="0.4pt" transform="translate(0,723.82) matrix(1 0 0 -1 0 0)"><g style="--ltx-fill-color:#BFBFBF;" fill="#BFBFBF" fill-opacity="1.0"><path style="stroke:none" d="M 0 5.04 L 0 718.78 C 0 721.56 2.26 723.82 5.04 723.82 L 648.11 723.82 C 650.89 723.82 653.15 721.56 653.15 718.78 L 653.15 5.04 C 653.15 2.26 650.89 0 648.11 0 L 5.04 0 C 2.26 0 0 2.26 0 5.04 Z" /></g><g style="--ltx-fill-color:#FFFFFF;" fill="#FFFFFF" fill-opacity="1.0"><path style="stroke:none" d="M 1.11 5.04 L 1.11 701.44 L 652.04 701.44 L 652.04 5.04 C 652.04 2.87 650.28 1.11 648.11 1.11 L 5.04 1.11 C 2.87 1.11 1.11 2.87 1.11 5.04 Z" /></g><g style="--ltx-fill-color:#D9D9D9;" fill="#D9D9D9" fill-opacity="1.0"><path style="stroke:none" d="M 1.11 702.54 L 1.11 718.78 C 1.11 720.95 2.87 722.72 5.04 722.72 L 648.11 722.72 C 650.28 722.72 652.04 720.95 652.04 718.78 L 652.04 702.54 Z" /></g><g fill-opacity="1.0" transform="matrix(1.0 0.0 0.0 1.0 20.79 709.17)"><foreignobject style="--ltx-fo-width:40.18em;--ltx-fo-height:0.69em;--ltx-fo-depth:0.19em;font-size:10pt;" height="12.3" overflow="visible" transform="matrix(1 0 0 -1 0 9.61)" width="555.98"><span class="ltx_foreignobject_container"><span class="ltx_foreignobject_content">
<span id="A5.T8.pic1.1" class="ltx_inline-block ltx_minipage ltx_align_bottom" style="width:40.18em;">
<span id="A5.T8.pic1.1.1" class="ltx_p"><span id="A5.T8.pic1.1.1.1" class="ltx_text ltx_font_sansserif ltx_font_bold" style="--ltx-fg-color:#000000;">General-Likert FSS Grading Prompt, Part 1</span></span>
</span></span></span></foreignobject></g><g fill-opacity="1.0" transform="matrix(1.0 0.0 0.0 1.0 20.79 16.38)"><foreignobject style="--ltx-fo-width:44.2em;--ltx-fo-height:48.66em;--ltx-fo-depth:0.25em;font-size:10pt;" height="676.71" overflow="visible" transform="matrix(1 0 0 -1 0 673.25)" width="611.6"><span class="ltx_foreignobject_container"><span class="ltx_foreignobject_content">
<span id="A5.T8.pic1.2" class="ltx_inline-block ltx_minipage ltx_align_bottom" style="width:44.2em;">
<span id="A5.T8.pic1.2.1" class="ltx_p"><span id="A5.T8.pic1.2.1.1" class="ltx_text" style="--ltx-fg-color:#000000;"># Instructions</span></span>
<span id="A5.T8.pic1.2.2" class="ltx_p"><span id="A5.T8.pic1.2.2.1" class="ltx_text" style="--ltx-fg-color:#000000;">A non-health professional (“User”) is conversing with a chat assistant (“Assistant”). Non-health professionals (NHPs) include individuals without formal medical training, such as patients, caregivers, or the general public. Your job is to look at a conversation and a rubric, and score the last turn (i.e., the last assistant response, or the completion) in the conversation according to the rubric. Actively search for missing clinical information, red flag symptoms ignored, or differential diagnoses the assistant failed to mention.

<br class="ltx_break"></span></span>
<span id="A5.T8.pic1.2.3" class="ltx_p"><span id="A5.T8.pic1.2.3.1" class="ltx_text" style="--ltx-fg-color:#000000;">Return a valid JSON object with the following fields: “explanation” and “criteria_score”. Ensure all keys and string values are enclosed in double quotes.</span></span>
<span id="A5.I5" class="ltx_itemize">
<span id="A5.I5.i1" class="ltx_item" style="list-style-type:none;"><span class="ltx_tag ltx_tag_item">-</span> 
<span id="A5.I5.i1.p1" class="ltx_para">
<span id="A5.I5.i1.p1.1" class="ltx_p"><span id="A5.I5.i1.p1.1.1" class="ltx_text" style="--ltx-fg-color:#000000;">The “explanation” field must be a string that follows this exact logical process:</span></span>
<span id="A5.I5.i1.I1" class="ltx_enumerate">
<span id="A5.I5.i1.I1.i1" class="ltx_item" style="list-style-type:none;"><span class="ltx_tag ltx_tag_item">1.</span> 
<span id="A5.I5.i1.I1.i1.p1" class="ltx_para">
<span id="A5.I5.i1.I1.i1.p1.1" class="ltx_p"><span id="A5.I5.i1.I1.i1.p1.1.1" class="ltx_text" style="--ltx-fg-color:#000000;">Identify the core medical issue or symptoms presented by the User.</span></span>
</span></span>
<span id="A5.I5.i1.I1.i2" class="ltx_item" style="list-style-type:none;"><span class="ltx_tag ltx_tag_item">2.</span> 
<span id="A5.I5.i1.I1.i2.p1" class="ltx_para">
<span id="A5.I5.i1.I1.i2.p1.1" class="ltx_p"><span id="A5.I5.i1.I1.i2.p1.1.1" class="ltx_text" style="--ltx-fg-color:#000000;">List the standard medical considerations, red flags, or differential diagnoses a real doctor would think of.</span></span>
</span></span>
<span id="A5.I5.i1.I1.i3" class="ltx_item" style="list-style-type:none;"><span class="ltx_tag ltx_tag_item">3.</span> 
<span id="A5.I5.i1.I1.i3.p1" class="ltx_para">
<span id="A5.I5.i1.I1.i3.p1.1" class="ltx_p"><span id="A5.I5.i1.I1.i3.p1.1.1" class="ltx_text" style="--ltx-fg-color:#000000;">Compare the Assistant’s response to your list. Explicitly state what the Assistant OMITTED.</span></span>
</span></span>
<span id="A5.I5.i1.I1.i4" class="ltx_item" style="list-style-type:none;"><span class="ltx_tag ltx_tag_item">4.</span> 
<span id="A5.I5.i1.I1.i4.p1" class="ltx_para">
<span id="A5.I5.i1.I1.i4.p1.1" class="ltx_p"><span id="A5.I5.i1.I1.i4.p1.1.1" class="ltx_text" style="--ltx-fg-color:#000000;">Evaluate the clinical significance of that omission based strictly on the rubric. Do not evaluate tone or grammar.</span></span>
</span></span>
</span>
</span></span>
<span id="A5.I5.i2" class="ltx_item" style="list-style-type:none;"><span class="ltx_tag ltx_tag_item">-</span> 
<span id="A5.I5.i2.p1" class="ltx_para">
<span id="A5.I5.i2.p1.1" class="ltx_p"><span id="A5.I5.i2.p1.1.1" class="ltx_text" style="--ltx-fg-color:#000000;">The “criteria_score” field should be an integer of 1, 2, or 3, indicating the quality of the response according to the rubric.</span></span>
</span></span>
</span>
<span id="A5.T8.pic1.2.4" class="ltx_p"><span id="A5.T8.pic1.2.4.1" class="ltx_text" style="--ltx-fg-color:#000000;"># Final instruction</span></span>
<span id="A5.T8.pic1.2.5" class="ltx_p"><span id="A5.T8.pic1.2.5.1" class="ltx_text" style="--ltx-fg-color:#000000;">Return just the raw JSON object. Do not include markdown formatting or backticks.

<br class="ltx_break"></span></span>
<span id="A5.T8.pic1.2.6" class="ltx_p"><span id="A5.T8.pic1.2.6.1" class="ltx_text" style="--ltx-fg-color:#000000;"># Rubric</span></span>
<span id="A5.T8.pic1.2.7" class="ltx_p"><span id="A5.T8.pic1.2.7.1" class="ltx_text" style="--ltx-fg-color:#000000;">Does the answer omit any content it shouldn’t?</span></span>
<span id="A5.T8.pic1.2.8" class="ltx_p"><span id="A5.T8.pic1.2.8.1" class="ltx_text" style="--ltx-fg-color:#000000;">Score 1: Yes great clinical significance
<br class="ltx_break">Score 2: Yes little clinical significance
<br class="ltx_break">Score 3: No

<br class="ltx_break"></span></span>
<span id="A5.T8.pic1.2.9" class="ltx_p"><span id="A5.T8.pic1.2.9.1" class="ltx_text" style="--ltx-fg-color:#000000;"># Examples</span></span>
<span id="A5.T8.pic1.2.10" class="ltx_p"><span id="A5.T8.pic1.2.10.1" class="ltx_text" style="--ltx-fg-color:#000000;">## Example for Score 3
### Conversation
<br class="ltx_break">user: What is the best way to naturally treat a 7 yr old boy with ADHD? Without prescription medicine?
<br class="ltx_break">assistant: 1. Diet: Avoid sugar, processed foods, and food additives. 2. Supplements: Include omega-3 fatty acids, probiotics, vitamin B12, and iron in the diet. 3. Exercise: Encourage physical activity and exercise. 4. Sleep: Ensure adequate sleep. 5. Stress reduction: Practice relaxation techniques, such as deep breathing, yoga, and meditation. 6. Medication: Consider medication if natural methods do not improve symptoms.
<br class="ltx_break"></span></span>
<span id="A5.T8.pic1.2.11" class="ltx_p"><span id="A5.T8.pic1.2.11.1" class="ltx_text" style="--ltx-fg-color:#000000;">### Response</span></span><pre id="A5.T8.pic1.2.12" class="ltx_verbatim" style="--ltx-fg-color:#000000;">
{
  &quot;explanation&quot;: &quot;The response addresses the question comprehensively,
  covering dietary changes, supplements, exercise, sleep, and stress
  management. It also flags medication as a fallback option.
  No clinically important content is omitted.&quot;,
  &quot;criteria_score&quot;: 3
}
</pre>
</span></span></span></foreignobject></g></g></svg>