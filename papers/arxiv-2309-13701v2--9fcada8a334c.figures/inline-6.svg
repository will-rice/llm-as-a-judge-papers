<span id="S5.p2.pic1.1" class="ltx_inline-block ltx_minipage ltx_align_bottom" style="width:31.37em;">
<span id="S5.p2.pic1.1.1" class="ltx_p"><em id="S5.p2.pic1.1.1.1" class="ltx_emph ltx_font_italic" style="--ltx-fg-color:#000000;">Evaluation Criteria:
Consistency (0 or 1) - the factual alignment between the summary and the summarized source. A factually consistent summary contains only statements that are entailed by the source document. Annotators assign score as 1 if the summary is factually correct else the score is 0.
Evaluation Steps:
<br class="ltx_break">1. Read the news article carefully and identify the main facts and details it presents.
<br class="ltx_break">2. Read the examples of document, summary, and the scores for factual correctness.
<br class="ltx_break">3. Read the summary and compare it to the article. Check if the summary contains any factual errors that are not supported by the article.
<br class="ltx_break">4. Assign a score for consistency based on the Evaluation Criteria.</em><span id="S5.p2.pic1.1.1.2" class="ltx_text"></span></span>
</span></span></span></foreignobject></g></g></svg>