<span id="S5.SS3.p8.pic1.1" class="ltx_inline-block ltx_minipage ltx_align_bottom" style="width:31.5em;">
<span id="S5.SS3.p8.pic1.1.1" class="ltx_p"><span id="S5.SS3.p8.pic1.1.1.1" class="ltx_text ltx_font_bold" style="--ltx-fg-color:#000000;">Answer to RQ3<span id="S5.SS3.p8.pic1.1.1.1.1" class="ltx_text ltx_font_medium">:
The key components of <span id="S5.SS3.p8.pic1.1.1.1.1.1" class="ltx_text">SE-Jury</span> are crucial to its effectiveness. The dynamic team selection mechanism helps identify effective strategy combinations while also reducing LLM usage by around 50%. It maintains performance and even improves it in some cases. In addition, our strategy design yields an average performance gain of 27.9%, underscoring its substantial contribution to <span id="S5.SS3.p8.pic1.1.1.1.1.2" class="ltx_text">SE-Jury</span>’s effectiveness.</span></span></span>
</span></span></span></foreignobject></g></g></svg>