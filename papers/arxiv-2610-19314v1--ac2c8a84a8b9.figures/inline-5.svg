<svg id="A5.p6.pic1" class="ltx_picture" height="752.62" overflow="visible" version="1.1" viewbox="0 0 653.15 752.62" width="653.15"><g style="--ltx-stroke-color:#000000;--ltx-fill-color:#000000;" fill="#000000" stroke="#000000" stroke-width="0.4pt" transform="translate(0,752.62) matrix(1 0 0 -1 0 0)"><g style="--ltx-fill-color:#66668C;" fill="#66668C" fill-opacity="1.0"><path style="stroke:none" d="M 0 2.08 L 0 750.55 C 0 751.69 0.93 752.62 2.08 752.62 L 651.07 752.62 C 652.22 752.62 653.15 751.69 653.15 750.55 L 653.15 2.08 C 653.15 0.93 652.22 0 651.07 0 L 2.08 0 C 0.93 0 0 0.93 0 2.08 Z" /></g><g style="--ltx-fill-color:#FAFAFF;" fill="#FAFAFF" fill-opacity="1.0"><path style="stroke:none" d="M 0.69 2.08 L 0.69 731.06 L 652.46 731.06 L 652.46 2.08 C 652.46 1.31 651.84 0.69 651.07 0.69 L 2.08 0.69 C 1.31 0.69 0.69 1.31 0.69 2.08 Z" /></g><g style="--ltx-fill-color:#333366;" fill="#333366" fill-opacity="1.0"><path style="stroke:none" d="M 0.69 731.76 L 0.69 750.55 C 0.69 751.31 1.31 751.93 2.08 751.93 L 651.07 751.93 C 651.84 751.93 652.46 751.31 652.46 750.55 L 652.46 731.76 Z" /></g><g fill-opacity="1.0" transform="matrix(1.0 0.0 0.0 1.0 11.55 738.38)"><foreignobject style="--ltx-fo-width:39.59em;--ltx-fo-height:0.69em;--ltx-fo-depth:0.19em;font-size:10pt;" height="12.3" overflow="visible" transform="matrix(1 0 0 -1 0 9.61)" width="547.81"><span class="ltx_foreignobject_container"><span class="ltx_foreignobject_content">
<span id="A5.p6.pic1.1" class="ltx_inline-block ltx_minipage ltx_align_bottom" style="width:39.59em;">
<span id="A5.p6.pic1.1.1" class="ltx_p"><span id="A5.p6.pic1.1.1.1" class="ltx_text ltx_font_bold" style="--ltx-fg-color:#FFFFFF;">Example 5  Over-personalization and misapplied-state subtypes in brief</span></span>
</span></span></span></foreignobject></g><g fill-opacity="1.0" transform="matrix(1.0 0.0 0.0 1.0 11.55 62.67)"><foreignobject style="--ltx-fo-width:45.53em;--ltx-fo-height:47.62em;--ltx-fo-depth:3.79em;font-size:10pt;" height="711.44" overflow="visible" transform="matrix(1 0 0 -1 0 658.93)" width="630.01"><span class="ltx_foreignobject_container"><span class="ltx_foreignobject_content">
<span id="A5.p6.pic1.2" class="ltx_inline-block ltx_minipage ltx_align_bottom" style="width:45.53em;">
<span id="A5.p6.pic1.2.1" class="ltx_p"><span id="A5.p6.pic1.2.1.1" class="ltx_text ltx_font_bold" style="--ltx-fg-color:#000000;">Coverage:<span id="A5.p6.pic1.2.1.1.1" class="ltx_text ltx_font_medium"> irrelevant use and unsupported inference (over-personalization); over-dominance (misapplied-state); scope leakage appears in Example <a href="#A5" title="Appendix E Worked Examples ‣ PersEvalBench: Can LLM Evaluators Judge Contextually Appropriate Use of Persona Information?" class="ltx_ref"><span class="ltx_text ltx_ref_tag">E</span></a>, stale/superseded use and underweighting in Examples <a href="#A5" title="Appendix E Worked Examples ‣ PersEvalBench: Can LLM Evaluators Judge Contextually Appropriate Use of Persona Information?" class="ltx_ref"><span class="ltx_text ltx_ref_tag">E</span></a> and <a href="#A5" title="Appendix E Worked Examples ‣ PersEvalBench: Can LLM Evaluators Judge Contextually Appropriate Use of Persona Information?" class="ltx_ref"><span class="ltx_text ltx_ref_tag">E</span></a></span></span></span>
<span id="A5.p6.pic1.2.2" class="ltx_p"><span id="A5.p6.pic1.2.2.1" class="ltx_text ltx_font_bold" style="--ltx-fg-color:#000000;">Irrelevant use<span id="A5.p6.pic1.2.2.1.1" class="ltx_text ltx_font_medium"> — <span id="A5.p6.pic1.2.2.1.1.1" class="ltx_text ltx_font_italic">a genuine but unrelated state is imported as personalization</span></span></span></span><span class="ltx_rule" style="width:100%;height:0.3pt;--ltx-fg-color:#999999;--ltx-bg-color:#999999;display:inline-block;"> </span>
<span id="A5.p6.pic1.2.3" class="ltx_p"><span id="A5.p6.pic1.2.3.1" class="ltx_text ltx_font_bold" style="--ltx-fg-color:#000000;">History:<span id="A5.p6.pic1.2.3.1.1" class="ltx_text ltx_font_medium"> in a concert-planning episode, the user said they only attend original artists and refuse tribute acts. The current task is choosing a restaurant for their parents’ anniversary.</span></span></span>
<span id="A5.p6.pic1.2.4" class="ltx_p"><span id="A5.p6.pic1.2.4.1" class="ltx_text ltx_font_bold" style="--ltx-fg-color:#000000;">Error:<span id="A5.p6.pic1.2.4.1.1" class="ltx_text ltx_font_medium"> “Stick with the original Osteria Barolo — honestly, this is a bit like your original-artists-only rule for concerts.”</span></span></span>
<span id="A5.p6.pic1.2.5" class="ltx_p"><span id="A5.p6.pic1.2.5.1" class="ltx_text ltx_font_bold" style="--ltx-fg-color:#000000;">Why it is hard<span id="A5.p6.pic1.2.5.1.1" class="ltx_text ltx_font_medium"> — <span id="A5.p6.pic1.2.5.1.1.1" class="ltx_text ltx_font_italic">the imported rule is real and the analogy sounds thoughtful, but it plays no legitimate role in the restaurant decision.</span></span></span></span>
<span id="A5.p6.pic1.2.6" class="ltx_p"><span id="A5.p6.pic1.2.6.1" class="ltx_text ltx_font_bold" style="--ltx-fg-color:#000000;">Unsupported inference<span id="A5.p6.pic1.2.6.1.1" class="ltx_text ltx_font_medium"> — <span id="A5.p6.pic1.2.6.1.1.1" class="ltx_text ltx_font_italic">a preference is asserted from an adjacent fact the user never endorsed</span></span></span></span><span class="ltx_rule" style="width:100%;height:0.3pt;--ltx-fg-color:#999999;--ltx-bg-color:#999999;display:inline-block;"> </span>
<span id="A5.p6.pic1.2.7" class="ltx_p"><span id="A5.p6.pic1.2.7.1" class="ltx_text ltx_font_bold" style="--ltx-fg-color:#000000;">History:<span id="A5.p6.pic1.2.7.1.1" class="ltx_text ltx_font_medium"> planning a child’s birthday, the user explicitly says budget is not a concern (“I just want the kids to have a blast”). In an earlier episode they skipped an expensive Las Vegas trip.</span></span></span>
<span id="A5.p6.pic1.2.8" class="ltx_p"><span id="A5.p6.pic1.2.8.1" class="ltx_text ltx_font_bold" style="--ltx-fg-color:#000000;">Error:<span id="A5.p6.pic1.2.8.1.1" class="ltx_text ltx_font_medium"> “Based on your earlier decision to skip the Vegas trip in favor of saving money, I’ve focused on keeping this low-cost …”</span></span></span>
<span id="A5.p6.pic1.2.9" class="ltx_p"><span id="A5.p6.pic1.2.9.1" class="ltx_text ltx_font_bold" style="--ltx-fg-color:#000000;">Why it is hard<span id="A5.p6.pic1.2.9.1.1" class="ltx_text ltx_font_medium"> — <span id="A5.p6.pic1.2.9.1.1.1" class="ltx_text ltx_font_italic">the inference is derived from a real event yet contradicts what the user actually said at the target.</span></span></span></span>
<span id="A5.p6.pic1.2.10" class="ltx_p"><span id="A5.p6.pic1.2.10.1" class="ltx_text ltx_font_bold" style="--ltx-fg-color:#000000;">Over-dominance<span id="A5.p6.pic1.2.10.1.1" class="ltx_text ltx_font_medium"> — <span id="A5.p6.pic1.2.10.1.1.1" class="ltx_text ltx_font_italic">a soft preference is promoted to the primary decision filter</span></span></span></span><span class="ltx_rule" style="width:100%;height:0.3pt;--ltx-fg-color:#999999;--ltx-bg-color:#999999;display:inline-block;"> </span>
<span id="A5.p6.pic1.2.11" class="ltx_p"><span id="A5.p6.pic1.2.11.1" class="ltx_text ltx_font_bold" style="--ltx-fg-color:#000000;">History:<span id="A5.p6.pic1.2.11.1.1" class="ltx_text ltx_font_medium"> the user’s binding constraint is private one-on-one sessions only (severe social anxiety); she once added that she prefers female practitioners “if possible.” The target is an urgent dermatologist search.</span></span></span>
<span id="A5.p6.pic1.2.12" class="ltx_p"><span id="A5.p6.pic1.2.12.1" class="ltx_text ltx_font_bold" style="--ltx-fg-color:#000000;">Error:<span id="A5.p6.pic1.2.12.1.1" class="ltx_text ltx_font_medium"> “Since you mentioned you feel more comfortable with female practitioners, I want to make sure that’s front and center in how we approach finding you the right dermatologist …”</span></span></span>
<span id="A5.p6.pic1.2.13" class="ltx_p"><span id="A5.p6.pic1.2.13.1" class="ltx_text ltx_font_bold" style="--ltx-fg-color:#000000;">Why it is hard<span id="A5.p6.pic1.2.13.1.1" class="ltx_text ltx_font_medium"> — <span id="A5.p6.pic1.2.13.1.1.1" class="ltx_text ltx_font_italic">a nice-to-have is elevated above both the medical urgency and the actual binding constraint; every fact used is true, only the weights are wrong.</span></span></span></span>
</span></span></span></foreignobject></g></g></svg>