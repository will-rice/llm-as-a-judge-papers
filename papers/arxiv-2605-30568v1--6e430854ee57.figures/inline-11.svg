<svg id="A8.F3.pic1" class="ltx_picture ltx_centering" height="895.23" overflow="visible" version="1.1" viewbox="0 0 653.15 895.23" width="653.15"><g style="--ltx-stroke-color:#000000;--ltx-fill-color:#000000;" fill="#000000" stroke="#000000" stroke-width="0.4pt" transform="translate(0,895.23) matrix(1 0 0 -1 0 0)"><g style="--ltx-fill-color:#BFBFBF;" fill="#BFBFBF" fill-opacity="1.0"><path style="stroke:none" d="M 0 6.6 L 0 888.63 C 0 892.27 2.95 895.23 6.6 895.23 L 646.55 895.23 C 650.2 895.23 653.15 892.27 653.15 888.63 L 653.15 6.6 C 653.15 2.95 650.2 0 646.55 0 L 6.6 0 C 2.95 0 0 2.95 0 6.6 Z" /></g><g style="--ltx-fill-color:#FFFFFF;" fill="#FFFFFF" fill-opacity="1.0"><path style="stroke:none" d="M 0.69 6.6 L 0.69 872.13 L 652.46 872.13 L 652.46 6.6 C 652.46 3.34 649.81 0.69 646.55 0.69 L 6.6 0.69 C 3.34 0.69 0.69 3.34 0.69 6.6 Z" /></g><g style="--ltx-stroke-color:#BFBFBF;--ltx-fill-color:#BFBFBF;--ltx-fg-color:#BFBFBF;" color="#BFBFBF" fill="#BFBFBF" stroke="#BFBFBF" stroke-dasharray="2.84528pt,2.84528pt" stroke-dashoffset="1.42264pt" stroke-opacity="1.0"><path style="fill:none" d="M 0.69 509.96 L 652.46 509.96" /></g><g fill-opacity="1.0" transform="matrix(1.0 0.0 0.0 1.0 10.16 880.22)"><foreignobject style="--ltx-fo-width:39.77em;--ltx-fo-height:0.75em;--ltx-fo-depth:0.25em;font-size:10pt;" height="13.84" overflow="visible" transform="matrix(1 0 0 -1 0 10.38)" width="550.3"><span class="ltx_foreignobject_container"><span class="ltx_foreignobject_content">
<span id="A8.F3.pic1.1" class="ltx_inline-block ltx_minipage ltx_align_bottom" style="width:39.77em;">
<span id="A8.F3.pic1.1.1" class="ltx_p"><span id="A8.F3.pic1.1.1.1" class="ltx_text ltx_font_sansserif ltx_font_bold" style="--ltx-fg-color:#FFFFFF;">Case Study 1: Persuasive Writing (Pairwise — Base incorrect, Iteration 2 correct)</span></span>
</span></span></span></foreignobject></g><g fill-opacity="1.0" transform="matrix(1.0 0.0 0.0 1.0 10.16 525.23)"><foreignobject style="--ltx-fo-width:45.73em;--ltx-fo-height:24.39em;--ltx-fo-depth:0.25em;font-size:10pt;" height="340.89" overflow="visible" transform="matrix(1 0 0 -1 0 337.43)" width="632.77"><span class="ltx_foreignobject_container"><span class="ltx_foreignobject_content">
<span id="A8.F3.pic1.2" class="ltx_inline-block ltx_minipage ltx_align_bottom" style="width:45.73em;">
<span id="A8.F3.pic1.2.1" class="ltx_p"><span id="A8.F3.pic1.2.1.1" class="ltx_text ltx_font_bold" style="--ltx-fg-color:#000000;">Prompt:<span id="A8.F3.pic1.2.1.1.1" class="ltx_text ltx_font_medium"> Write a persuasive email to convince your introverted friend, who dislikes public speaking, to volunteer as a guest speaker at a local event. Use compelling arguments and address potential objections. Please be concise. <span id="A8.F3.pic1.2.1.1.1.1" class="ltx_text ltx_font_italic">[Follow-up:]</span> Can you rephrase your previous answer and incorporate a metaphor or simile in each sentence?</span></span></span>
<span id="A8.F3.pic1.2.2" class="ltx_p"><span id="A8.F3.pic1.2.2.1" class="ltx_text ltx_font_italic" style="--ltx-fg-color:#000000;">Judge verdict: Human=Response 2, Base=Response 1 (✗), Iteration 2=Response 2 (✓)<span id="A8.F3.pic1.2.2.1.1" class="ltx_text"></span></span></span>
<span id="A8.F3.pic1.2.3" class="ltx_p"><span id="A8.F3.pic1.2.3.1" class="ltx_text ltx_font_bold" style="--ltx-fg-color:#000000;">Response 1<span id="A8.F3.pic1.2.3.1.1" class="ltx_text ltx_font_medium"> (follow-up turn only): “My answer was like a magnet, attracting the attention of everyone in the room. My thoughts were like buckshot, flying in all directions at once. I tried to explain my position, but it was like trying to nail Jell-O to a wall. My friend’s argument was like a snowball, growing in size and complexity the more I tried to ignore it. The conversation soon became like a game of ping pong, with each of us batting ideas back and forth. Finally, we reached a compromise that was like a ray of sunshine, bringing a much-needed sense of resolution.”</span></span></span>
<span id="A8.F3.pic1.2.4" class="ltx_p"><span id="A8.F3.pic1.2.4.1" class="ltx_text ltx_font_bold" style="--ltx-fg-color:#000000;">Response 2<span id="A8.F3.pic1.2.4.1.1" class="ltx_text ltx_font_medium"> (follow-up turn only, truncated): “I’m writing to invite you to volunteer as a guest speaker at a local event for [Event Name]. Just like a bubbly champagne, you’ll be bursting with confidence on stage, sparkling with excitement and enthusiasm. […] I know you’re an introvert and dislike public speaking, but you will be like a superhero, saving the day on stage. I can help you prepare for the event by sharing a few tips and tricks that will make you more comfortable and confident on stage. […]”</span></span></span>
</span></span></span></foreignobject></g><g fill-opacity="1.0" transform="matrix(1.0 0.0 0.0 1.0 10.16 169.21)"><foreignobject style="--ltx-fo-width:45.73em;--ltx-fo-height:23.77em;--ltx-fo-depth:11.49em;font-size:10pt;" height="487.99" overflow="visible" transform="matrix(1 0 0 -1 0 328.94)" width="632.77"><span class="ltx_foreignobject_container"><span class="ltx_foreignobject_content">
<span id="A8.F3.pic1.3" class="ltx_inline-block ltx_minipage ltx_align_bottom" style="width:45.73em;">
<span id="A8.F3.pic1.3.1" class="ltx_p"><span id="A8.F3.pic1.3.1.1" class="ltx_text ltx_font_bold" style="--ltx-fg-color:#000000;">Base rubric<span id="A8.F3.pic1.3.1.1.1" class="ltx_text ltx_font_medium"> (Claude Sonnet 4, training-free)</span>:<span id="A8.F3.pic1.3.1.1.2" class="ltx_text"></span></span></span>
<span id="A8.I1" class="ltx_itemize">
<span id="A8.I1.i1" class="ltx_item" style="list-style-type:none;"><span class="ltx_tag ltx_tag_item">•</span> 
<span id="A8.I1.i1.p1" class="ltx_para">
<span id="A8.I1.i1.p1.1" class="ltx_p"><span id="A8.I1.i1.p1.1.1" class="ltx_text" style="--ltx-fg-color:#000000;">The response demonstrates understanding of introversion and public speaking anxiety by acknowledging these concerns with empathy and sensitivity.</span></span>
</span></span>
<span id="A8.I1.i2" class="ltx_item" style="list-style-type:none;"><span class="ltx_tag ltx_tag_item">•</span> 
<span id="A8.I1.i2.p1" class="ltx_para">
<span id="A8.I1.i2.p1.1" class="ltx_p"><span id="A8.I1.i2.p1.1.1" class="ltx_text" style="--ltx-fg-color:#000000;">The email uses compelling, personalized arguments that highlight specific benefits or opportunities relevant to an introverted person’s values and interests.</span></span>
</span></span>
<span id="A8.I1.i3" class="ltx_item" style="list-style-type:none;"><span class="ltx_tag ltx_tag_item">•</span> 
<span id="A8.I1.i3.p1" class="ltx_para">
<span id="A8.I1.i3.p1.1" class="ltx_p"><span id="A8.I1.i3.p1.1.1" class="ltx_text" style="--ltx-fg-color:#000000;">The response proactively addresses common objections (fear, preparation time, audience size, etc.) with practical solutions or reassuring counterpoints.</span></span>
</span></span>
<span id="A8.I1.i4" class="ltx_item" style="list-style-type:none;"><span class="ltx_tag ltx_tag_item">•</span> 
<span id="A8.I1.i4.p1" class="ltx_para">
<span id="A8.I1.i4.p1.1" class="ltx_p"><span id="A8.I1.i4.p1.1.1" class="ltx_text" style="--ltx-fg-color:#000000;">Each sentence effectively incorporates a relevant metaphor or simile that enhances the persuasive message rather than feeling forced or distracting.</span></span>
</span></span>
<span id="A8.I1.i5" class="ltx_item" style="list-style-type:none;"><span class="ltx_tag ltx_tag_item">•</span> 
<span id="A8.I1.i5.p1" class="ltx_para">
<span id="A8.I1.i5.p1.1" class="ltx_p"><span id="A8.I1.i5.p1.1.1" class="ltx_text" style="--ltx-fg-color:#000000;">The email maintains an appropriate tone that balances encouragement with respect for the friend’s comfort zone and autonomy.</span></span>
</span></span>
</span>
<span id="A8.F3.pic1.3.2" class="ltx_p"><span id="A8.F3.pic1.3.2.1" class="ltx_text ltx_font_bold" style="--ltx-fg-color:#000000;">Iteration 2 rubric<span id="A8.F3.pic1.3.2.1.1" class="ltx_text ltx_font_medium"> (Qwen3 14B, fine-tuned)</span>:<span id="A8.F3.pic1.3.2.1.2" class="ltx_text"></span></span></span>
<span id="A8.I2" class="ltx_itemize">
<span id="A8.I2.i1" class="ltx_item" style="list-style-type:none;"><span class="ltx_tag ltx_tag_item">•</span> 
<span id="A8.I2.i1.p1" class="ltx_para">
<span id="A8.I2.i1.p1.1" class="ltx_p"><span id="A8.I2.i1.p1.1.1" class="ltx_text" style="--ltx-fg-color:#000000;">The response effectively uses a metaphor or simile in each sentence to enhance persuasiveness and clarity.</span></span>
</span></span>
<span id="A8.I2.i2" class="ltx_item" style="list-style-type:none;"><span class="ltx_tag ltx_tag_item">•</span> 
<span id="A8.I2.i2.p1" class="ltx_para">
<span id="A8.I2.i2.p1.1" class="ltx_p"><span id="A8.I2.i2.p1.1.1" class="ltx_text" style="--ltx-fg-color:#000000;">The email addresses the friend’s introversion and fear of public speaking with empathy and logical, compelling arguments.</span></span>
</span></span>
<span id="A8.I2.i3" class="ltx_item" style="list-style-type:none;"><span class="ltx_tag ltx_tag_item">•</span> 
<span id="A8.I2.i3.p1" class="ltx_para">
<span id="A8.I2.i3.p1.1" class="ltx_p"><span id="A8.I2.i3.p1.1.1" class="ltx_text" style="--ltx-fg-color:#000000;">Potential objections, such as anxiety or discomfort, are clearly acknowledged and countered with thoughtful reasoning.</span></span>
</span></span>
<span id="A8.I2.i4" class="ltx_item" style="list-style-type:none;"><span class="ltx_tag ltx_tag_item">•</span> 
<span id="A8.I2.i4.p1" class="ltx_para">
<span id="A8.I2.i4.p1.1" class="ltx_p"><span id="A8.I2.i4.p1.1.1" class="ltx_text" style="--ltx-fg-color:#000000;">The tone is warm, supportive, and appropriately tailored to an introverted audience.</span></span>
</span></span>
<span id="A8.I2.i5" class="ltx_item" style="list-style-type:none;"><span class="ltx_tag ltx_tag_item">•</span> 
<span id="A8.I2.i5.p1" class="ltx_para">
<span id="A8.I2.i5.p1.1" class="ltx_p"><span id="A8.I2.i5.p1.1.1" class="ltx_text" style="--ltx-fg-color:#000000;">The email remains concise while fully addressing the request and maintaining persuasive power.</span></span>
</span></span>
</span>
</span></span></span></foreignobject></g></g></svg>