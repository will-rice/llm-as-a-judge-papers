<span id="A7.p4.pic1.p2.pic1.2" class="ltx_inline-block ltx_minipage ltx_align_bottom" style="width:35.53em;">
<span id="A7.p4.pic1.p2.pic1.2.1" class="ltx_p">The INFORM Reward Model 70B (INF-ORM-Llama3.1-70B) is a large-scale outcome reward model designed to evaluate the quality of generated conversational responses. It predicts scalar reward scores for response texts, supporting preference-based fine-grained evaluations without requiring a reference response. The model is finetuned from the Llama-3.1-70B-Instruct backbone using preference-labeled datasets, employing scaled Bradley-Terry loss to incorporate preference magnitudes.</span>
</span></span></span></foreignobject></g></g></svg>