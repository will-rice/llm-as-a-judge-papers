<svg id="A4.F7.pic2" class="ltx_picture ltx_centering ltx_figure_panel" height="273.6" overflow="visible" version="1.1" viewbox="0 0 550 273.6" width="550"><g style="--ltx-stroke-color:#000000;--ltx-fill-color:#000000;" fill="#000000" stroke="#000000" stroke-width="0.4pt" transform="translate(0,273.6) matrix(1 0 0 -1 0 0)"><g style="--ltx-fill-color:#004000;" fill="#004000" fill-opacity="1.0"><path style="stroke:none" d="M 0 0 L 0 273.6 L 550 273.6 L 550 0 Z" /></g><g style="--ltx-fill-color:#FAFFFA;" fill="#FAFFFA" fill-opacity="1.0"><path style="stroke:none" d="M 1.97 1.97 L 1.97 271.64 L 548.03 271.64 L 548.03 1.97 Z" /></g><g fill-opacity="1.0" transform="matrix(1.0 0.0 0.0 1.0 6.12 8.81)"><foreignobject style="--ltx-fo-width:38.86em;--ltx-fo-height:18.69em;--ltx-fo-depth:0.19em;font-size:10pt;" height="261.37" overflow="visible" transform="matrix(1 0 0 -1 0 258.68)" width="537.71"><span class="ltx_foreignobject_container"><span class="ltx_foreignobject_content">
<span id="A4.F7.pic2.1" class="ltx_inline-block ltx_minipage ltx_align_bottom" style="width:38.86em;">
<span id="A4.F7.pic2.1.1" class="ltx_p"><span id="A4.F7.pic2.1.1.1" class="ltx_text ltx_font_bold" style="--ltx-fg-color:#000000;">Gold Response:<span id="A4.F7.pic2.1.1.1.1" class="ltx_text ltx_font_medium">
IFRS 16 Leases permit a simplified treatment for assets with a lease period of 12 months or less, or of low value. Although the standard does not give a numerical definition of ’low value’ it does give examples of the types of assets that may be included, and this includes telephones. The simplified treatment allows the lease payments to be charged as an expense over the lease period, applying the accruals concept.</span></span></span>
<span id="A4.F7.pic2.1.2" class="ltx_p"><span id="A4.F7.pic2.1.2.1" class="ltx_text" style="--ltx-fg-color:#000000;">IFRS 16 Leases does not specify a particular monetary amount below which an asset would be considered ’low value’, although the basis for conclusion indicates a value of $5,000 as a guide. The standard also gives the following examples of low-value assets:</span></span>
<span id="A4.F7.pic2.1.3" class="ltx_p"><span id="A4.F7.pic2.1.3.1" class="ltx_text" style="--ltx-fg-color:#000000;">- tablets</span></span>
<span id="A4.F7.pic2.1.4" class="ltx_p"><span id="A4.F7.pic2.1.4.1" class="ltx_text" style="--ltx-fg-color:#000000;">- small personal computers</span></span>
<span id="A4.F7.pic2.1.5" class="ltx_p"><span id="A4.F7.pic2.1.5.1" class="ltx_text" style="--ltx-fg-color:#000000;">- telephones</span></span>
<span id="A4.F7.pic2.1.6" class="ltx_p"><span id="A4.F7.pic2.1.6.1" class="ltx_text" style="--ltx-fg-color:#000000;">- small items of furniture.</span></span>
<span id="A4.F7.pic2.1.7" class="ltx_p"><span id="A4.F7.pic2.1.7.1" class="ltx_text" style="--ltx-fg-color:#000000;">The assessment of whether an asset qualifies as having a ’low value’ must be made based on its value when new. Therefore, a car would not qualify as a low-value asset, even if it was very old at the commencement of the lease.</span></span>
</span></span></span></foreignobject></g></g></svg>