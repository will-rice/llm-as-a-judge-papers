<span id="A4.SS1.SSS1.p20.pic1.2.1" class="ltx_p"><span id="A4.SS1.SSS1.p20.pic1.2.1.1" class="ltx_text ltx_font_italic" style="font-size:90%;--ltx-fg-color:#000000;">[Excerpt — Feedback Loops via MicroRNAs]<span id="A4.SS1.SSS1.p20.pic1.2.1.1.1" class="ltx_text"></span></span></span>
<span id="A4.SS1.SSS1.p20.pic1.2.2" class="ltx_p"><span id="A4.SS1.SSS1.p20.pic1.2.2.1" class="ltx_text" style="font-size:90%;--ltx-fg-color:#000000;">Evidence exists that dMyc regulates miRNAs (such as miR-308 and miR-305
families), forming negative feedback loops involving dp53.
MiR-308 targets dp53 directly, allowing cells with high dMyc and low
dp53 to promote competitive advantage. However, this again emphasizes how Myc
controls dp53 instead of vice versa.</span></span>
