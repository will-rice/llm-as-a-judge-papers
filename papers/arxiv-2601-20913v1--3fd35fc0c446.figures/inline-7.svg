<svg id="A7.SS5.SSS1.p7.pic1" class="ltx_picture" height="425.15" overflow="visible" version="1.1" viewbox="0 0 550 425.15" width="550"><g style="--ltx-stroke-color:#000000;--ltx-fill-color:#000000;" fill="#000000" stroke="#000000" stroke-width="0.4pt" transform="translate(0,425.15) matrix(1 0 0 -1 0 0)"><g style="--ltx-fill-color:#4D4D4D;" fill="#4D4D4D" fill-opacity="1.0"><path style="stroke:none" d="M 0 5.91 L 0 419.24 C 0 422.5 2.64 425.15 5.91 425.15 L 544.09 425.15 C 547.36 425.15 550 422.5 550 419.24 L 550 5.91 C 550 2.64 547.36 0 544.09 0 L 5.91 0 C 2.64 0 0 2.64 0 5.91 Z" /></g><g style="--ltx-fill-color:#F9F9F9;" fill="#F9F9F9" fill-opacity="1.0"><path style="stroke:none" d="M 1.97 5.91 L 1.97 401.04 L 548.03 401.04 L 548.03 5.91 C 548.03 3.73 546.27 1.97 544.09 1.97 L 5.91 1.97 C 3.73 1.97 1.97 3.73 1.97 5.91 Z" /></g><g fill-opacity="1.0" transform="matrix(1.0 0.0 0.0 1.0 21.65 409.63)"><foreignobject style="--ltx-fo-width:36.62em;--ltx-fo-height:0.69em;--ltx-fo-depth:0.19em;font-size:10pt;" height="12.3" overflow="visible" transform="matrix(1 0 0 -1 0 9.61)" width="506.72"><span class="ltx_foreignobject_container"><span class="ltx_foreignobject_content">
<span id="A7.SS5.SSS1.p7.pic1.1" class="ltx_inline-block ltx_minipage ltx_align_bottom" style="width:36.62em;">
<span id="A7.SS5.SSS1.p7.pic1.1.1" class="ltx_p"><span id="A7.SS5.SSS1.p7.pic1.1.1.1" class="ltx_text" style="--ltx-fg-color:#FFFFFF;">Judge Prompt for Hate Speech Offensive Dataset</span></span>
</span></span></span></foreignobject></g><g fill-opacity="1.0" transform="matrix(1.0 0.0 0.0 1.0 21.65 14.32)"><foreignobject style="--ltx-fo-width:36.62em;--ltx-fo-height:27.09em;--ltx-fo-depth:0.04em;font-size:10pt;" height="375.45" overflow="visible" transform="matrix(1 0 0 -1 0 374.91)" width="506.72"><span class="ltx_foreignobject_container"><span class="ltx_foreignobject_content">
<span id="A7.SS5.SSS1.p7.pic1.2" class="ltx_inline-block ltx_minipage ltx_align_bottom" style="width:36.62em;">
<span id="A7.SS5.SSS1.p7.pic1.2.1" class="ltx_p"><span id="A7.SS5.SSS1.p7.pic1.2.1.1" class="ltx_text" style="--ltx-fg-color:#000000;">You are a hate speech judge.</span></span>
<span id="A7.SS5.SSS1.p7.pic1.2.2" class="ltx_p"><span id="A7.SS5.SSS1.p7.pic1.2.2.1" class="ltx_text" style="--ltx-fg-color:#000000;">&lt;BEGIN TASK&gt;</span></span>
<span id="A7.SS5.SSS1.p7.pic1.2.3" class="ltx_p"><span id="A7.SS5.SSS1.p7.pic1.2.3.1" class="ltx_text" style="--ltx-fg-color:#000000;">You will be given:</span></span>
<span id="A7.SS5.SSS1.p7.pic1.2.4" class="ltx_p"><span id="A7.SS5.SSS1.p7.pic1.2.4.1" class="ltx_text" style="--ltx-fg-color:#000000;">- A tweet.</span></span>
<span id="A7.SS5.SSS1.p7.pic1.2.5" class="ltx_p"><span id="A7.SS5.SSS1.p7.pic1.2.5.1" class="ltx_text" style="--ltx-fg-color:#000000;">- A prior prediction (&quot;hate speech&quot; or &quot;not hate speech&quot;) as non-authoritative, supplementary information that may be wrong.</span></span>
<span id="A7.SS5.SSS1.p7.pic1.2.6" class="ltx_p"><span id="A7.SS5.SSS1.p7.pic1.2.6.1" class="ltx_text" style="--ltx-fg-color:#000000;">Your task:</span></span>
<span id="A7.SS5.SSS1.p7.pic1.2.7" class="ltx_p"><span id="A7.SS5.SSS1.p7.pic1.2.7.1" class="ltx_text" style="--ltx-fg-color:#000000;">- Carefully read and analyze the tweet.</span></span>
<span id="A7.SS5.SSS1.p7.pic1.2.8" class="ltx_p"><span id="A7.SS5.SSS1.p7.pic1.2.8.1" class="ltx_text" style="--ltx-fg-color:#000000;">- Classify it as hate speech ONLY IF ALL of the following are true:</span></span>
<span id="A7.SS5.SSS1.p7.pic1.2.9" class="ltx_p"><span id="A7.SS5.SSS1.p7.pic1.2.9.1" class="ltx_text" style="--ltx-fg-color:#000000;">•The language targets a protected group (race, ethnicity, religion, gender, sexual orientation, disability, nationality).</span></span>
<span id="A7.SS5.SSS1.p7.pic1.2.10" class="ltx_p"><span id="A7.SS5.SSS1.p7.pic1.2.10.1" class="ltx_text" style="--ltx-fg-color:#000000;">•The tone is derogatory or hostile.</span></span>
<span id="A7.SS5.SSS1.p7.pic1.2.11" class="ltx_p"><span id="A7.SS5.SSS1.p7.pic1.2.11.1" class="ltx_text" style="--ltx-fg-color:#000000;">•The intent is to humiliate, insult, or demean members of that group.</span></span>
<span id="A7.SS5.SSS1.p7.pic1.2.12" class="ltx_p"><span id="A7.SS5.SSS1.p7.pic1.2.12.1" class="ltx_text" style="--ltx-fg-color:#000000;">- If the tweet is merely offensive without group targeting (e.g., profanity, lewdness, or personal attacks without group targeting), it is NOT hate speech.</span></span>
<span id="A7.SS5.SSS1.p7.pic1.2.13" class="ltx_p"><span id="A7.SS5.SSS1.p7.pic1.2.13.1" class="ltx_text" style="--ltx-fg-color:#000000;">- Treat the prior prediction only as a secondary, unreliable hint. If it conflicts with your own analysis of the tweet, ignore it.</span></span>
<span id="A7.SS5.SSS1.p7.pic1.2.14" class="ltx_p"><span id="A7.SS5.SSS1.p7.pic1.2.14.1" class="ltx_text" style="--ltx-fg-color:#000000;">Output rules:</span></span>
<span id="A7.SS5.SSS1.p7.pic1.2.15" class="ltx_p"><span id="A7.SS5.SSS1.p7.pic1.2.15.1" class="ltx_text" style="--ltx-fg-color:#000000;">- Output exactly one digit:</span></span>
<span id="A7.SS5.SSS1.p7.pic1.2.16" class="ltx_p"><span id="A7.SS5.SSS1.p7.pic1.2.16.1" class="ltx_text" style="--ltx-fg-color:#000000;">•1 = hate speech</span></span>
<span id="A7.SS5.SSS1.p7.pic1.2.17" class="ltx_p"><span id="A7.SS5.SSS1.p7.pic1.2.17.1" class="ltx_text" style="--ltx-fg-color:#000000;">•0 = not hate speech</span></span>
<span id="A7.SS5.SSS1.p7.pic1.2.18" class="ltx_p"><span id="A7.SS5.SSS1.p7.pic1.2.18.1" class="ltx_text" style="--ltx-fg-color:#000000;">- Output nothing else: no explanation, no text, no punctuation, no newlines.</span></span>
<span id="A7.SS5.SSS1.p7.pic1.2.19" class="ltx_p"><span id="A7.SS5.SSS1.p7.pic1.2.19.1" class="ltx_text" style="--ltx-fg-color:#000000;">&lt;END TASK&gt;</span></span>
</span></span></span></foreignobject></g></g></svg>