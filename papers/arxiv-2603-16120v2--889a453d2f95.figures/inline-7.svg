<span id="A4.pic6.1" class="ltx_inline-block ltx_minipage ltx_align_bottom" style="width:46.2em;">
<span id="A4.pic6.1.1" class="ltx_p"><span id="A4.pic6.1.1.1" class="ltx_text" style="--ltx-fg-color:#FFFFFF;">Prompt D.6: Profile Inference Accuracy Prompt (<a href="#S2.SS1" title="2.1 Inferring Researcher Profiles ‣ 2 MySQA: Personalized Deep Research ‣ Language Models Don’t Know What You Want:Evaluating Personalization in Deep Research Needs Real Users" class="ltx_ref"><span class="ltx_text ltx_ref_tag">section</span> <span class="ltx_text ltx_ref_tag">2.1</span></a>)</span></span>
</span></span></span></foreignobject></g><g fill-opacity="1.0" transform="matrix(1.0 0.0 0.0 1.0 6.92 10.38)"><foreignobject style="--ltx-fo-width:46.2em;--ltx-fo-height:11.49em;--ltx-fo-depth:0.25em;font-size:10pt;" height="162.51" overflow="visible" transform="matrix(1 0 0 -1 0 159.05)" width="639.28"><span class="ltx_foreignobject_container"><span class="ltx_foreignobject_content">
<span id="A4.pic6.2" class="ltx_inline-block ltx_minipage ltx_align_bottom" style="width:46.2em;">
<span id="A4.pic6.2.1" class="ltx_p"><span id="A4.pic6.2.1.1" class="ltx_text" style="--ltx-fg-color:#000000;">&lt;task&gt;
As an Attribution Validator, your task is to verify whether a given inference can be accurately derived from a list of references.
A reference is a collection of snippets from a research paper.
Specifically, your response should clearly indicate the relationship: Attributable or Contradictory.
A contradictory error occurs when you can infer that the inference contradicts the information presented in the reference. If the inference appears true based on the papers, even if some of the papers are irrelevant (i.e. the model &quot;over-cited&quot; the papers), then the inference is Attributable.
&lt;/task&gt;
<br class="ltx_break"></span></span>
<span id="A4.pic6.2.2" class="ltx_p"><span id="A4.pic6.2.2.1" class="ltx_text" style="--ltx-fg-color:#000000;">&lt;inference&gt;
<math id="A4.pic6.m1" class="ltx_Math" alttext="\mathcal{I}" display="inline" intent=":literal"><semantics><mi style="--ltx-fg-color:#000000;" class="ltx_font_mathcaligraphic" mathcolor="#000000">ℐ</mi><annotation encoding="application/x-tex">\mathcal{I}</annotation></semantics></math>
&lt;/inference&gt;
<br class="ltx_break"></span></span>
<span id="A4.pic6.2.3" class="ltx_p"><span id="A4.pic6.2.3.1" class="ltx_text" style="--ltx-fg-color:#000000;">&lt;references&gt;
<math id="A4.pic6.m2" class="ltx_Math" alttext="\mathcal{D_{\text{cite}}}" display="inline" intent=":literal"><semantics><msub><mi style="--ltx-fg-color:#000000;" class="ltx_font_mathcaligraphic" mathcolor="#000000">𝒟</mi><mtext style="--ltx-fg-color:#000000;" mathcolor="#000000">cite</mtext></msub><annotation encoding="application/x-tex">\mathcal{D_{\text{cite}}}</annotation></semantics></math>
&lt;/references&gt;
<br class="ltx_break"></span></span>
<span id="A4.pic6.2.4" class="ltx_p"><span id="A4.pic6.2.4.1" class="ltx_text" style="--ltx-fg-color:#000000;">&lt;format&gt;
Output your response as a json with only a single key &quot;output&quot; and a value of one among - (&quot;Attributable&quot;, &quot;Contradictory&quot;).
&lt;/format&gt;</span></span>
</span></span></span></foreignobject></g></g></svg>