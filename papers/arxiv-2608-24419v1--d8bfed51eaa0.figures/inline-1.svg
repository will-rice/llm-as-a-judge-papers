<span id="S1.p3.pic1.p1" class="ltx_para ltx_noindent">
<span id="S1.p3.pic1.p1.1" class="ltx_p"><span id="S1.p3.pic1.p1.1.1" class="ltx_text ltx_font_bold" style="--ltx-fg-color:#000000;">The untested half.</span><span id="S1.p3.pic1.p1.1.2" class="ltx_text" style="--ltx-fg-color:#000000;"> A valid judge must satisfy two conditions. Under an edit that
</span><em id="S1.p3.pic1.p1.1.3" class="ltx_emph ltx_font_italic" style="--ltx-fg-color:#000000;">preserves</em><span id="S1.p3.pic1.p1.1.4" class="ltx_text" style="--ltx-fg-color:#000000;"> the construct, the verdict must not change. Under a minimal edit that
</span><em id="S1.p3.pic1.p1.1.5" class="ltx_emph ltx_font_italic" style="--ltx-fg-color:#000000;">changes</em><span id="S1.p3.pic1.p1.1.6" class="ltx_text" style="--ltx-fg-color:#000000;"> the construct, it must. Prior judge evaluation measures the first and, to our
knowledge, never the second. We measure both, as a profile </span><math id="S1.p3.pic1.p1.m1" class="ltx_Math" alttext="\mathbf{V}(J)=(S,R)" display="inline" intent=":literal"><semantics><mrow><mrow><mi style="--ltx-fg-color:#000000;" mathcolor="#000000">𝐕</mi><mo>⁡</mo><mrow><mo style="--ltx-fg-color:#000000;" mathcolor="#000000" stretchy="false">(</mo><mi style="--ltx-fg-color:#000000;" mathcolor="#000000">J</mi><mo style="--ltx-fg-color:#000000;" mathcolor="#000000" stretchy="false">)</mo></mrow></mrow><mo style="--ltx-fg-color:#000000;" mathcolor="#000000">=</mo><mrow><mo style="--ltx-fg-color:#000000;" mathcolor="#000000" stretchy="false">(</mo><mi style="--ltx-fg-color:#000000;" mathcolor="#000000">S</mi><mo style="--ltx-fg-color:#000000;" mathcolor="#000000">,</mo><mi style="--ltx-fg-color:#000000;" mathcolor="#000000">R</mi><mo style="--ltx-fg-color:#000000;" mathcolor="#000000" stretchy="false">)</mo></mrow></mrow><annotation encoding="application/x-tex">\mathbf{V}(J)=(S,R)</annotation></semantics></math><span id="S1.p3.pic1.p1.1.7" class="ltx_text" style="--ltx-fg-color:#000000;">, and
report that judges are far more invariant than they are sensitive.</span></span>
</span></span></span></span></foreignobject></g></g></svg>