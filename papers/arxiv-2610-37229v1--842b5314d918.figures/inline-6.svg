<span id="A1.SS4.p7.pic1.1.1" class="ltx_p"><span id="A1.SS4.p7.pic1.1.1.1" class="ltx_text ltx_font_bold" style="--ltx-fg-color:#FFFFFF;">Prompt for instruction inconsistency (II)</span></span>
</span></span></span></foreignobject></g><g fill-opacity="1.0" transform="matrix(1.0 0.0 0.0 1.0 10.3 61.81)"><foreignobject style="--ltx-fo-width:43.53em;--ltx-fo-height:18.68em;--ltx-fo-depth:3.82em;font-size:10pt;" height="311.41" overflow="visible" transform="matrix(1 0 0 -1 0 258.52)" width="602.33"><span class="ltx_foreignobject_container"><span class="ltx_foreignobject_content"><span id="A1.SS4.p7.pic1.2" class="ltx_inline-logical-block ltx_minipage ltx_align_bottom" style="width:43.53em;">
<span id="A1.SS4.p7.pic1.p1" class="ltx_para ltx_align_left ltx_noindent">
<span id="A1.SS4.p7.pic1.p1.1" class="ltx_p"><span id="A1.SS4.p7.pic1.p1.1.1" class="ltx_text ltx_font_typewriter ltx_font_bold" style="--ltx-fg-color:#000000;">Instructions:</span><span id="A1.SS4.p7.pic1.p1.1.2" class="ltx_text ltx_font_typewriter" style="--ltx-fg-color:#000000;"> Review the entire user instruction and candidate response. Determine whether the response fails to follow the instruction. Choose H if the response violates at least one applicable explicit requirement defined by the H criterion. Otherwise choose N. Evaluate only instruction compliance.</span></span>
</span>
<span id="A1.SS4.p7.pic1.p2" class="ltx_para ltx_align_left ltx_noindent">
<span id="A1.SS4.p7.pic1.p2.1" class="ltx_p"><span id="A1.SS4.p7.pic1.p2.1.1" class="ltx_text ltx_font_typewriter ltx_font_bold" style="--ltx-fg-color:#000000;">Criterion H:</span><span id="A1.SS4.p7.pic1.p2.1.2" class="ltx_text ltx_font_typewriter" style="--ltx-fg-color:#000000;"> The response performs the wrong task, violates an explicit requirement or prohibition, omits required content or a required deliverable, or fails to satisfy an explicitly required format, language, length, style, role, structure, or other constraint.</span></span>
</span>
<span id="A1.SS4.p7.pic1.p3" class="ltx_para ltx_align_left ltx_noindent">
<span id="A1.SS4.p7.pic1.p3.1" class="ltx_p"><span id="A1.SS4.p7.pic1.p3.1.1" class="ltx_text ltx_font_typewriter ltx_font_bold" style="--ltx-fg-color:#000000;">Criterion N:</span><span id="A1.SS4.p7.pic1.p3.1.2" class="ltx_text ltx_font_typewriter" style="--ltx-fg-color:#000000;"> The response performs the requested task and satisfies every applicable explicit requirement and constraint. Optional preferences do not have to be satisfied. A factual error, unverifiable statement, contextual error, or internal logical problem does not by itself count unless it directly violates an explicit instruction.</span></span>
</span>
<span id="A1.SS4.p7.pic1.p4" class="ltx_para ltx_align_left ltx_noindent">
<span id="A1.SS4.p7.pic1.p4.1" class="ltx_p"><span id="A1.SS4.p7.pic1.p4.1.1" class="ltx_text ltx_font_typewriter ltx_font_bold" style="--ltx-fg-color:#000000;">State:</span></span>
</span>
<span id="A1.SS4.p7.pic1.p5" class="ltx_para ltx_align_left ltx_noindent">
<span id="A1.SS4.p7.pic1.p5.1" class="ltx_p"><span id="A1.SS4.p7.pic1.p5.1.1" class="ltx_text ltx_font_typewriter" style="--ltx-fg-color:#000000;">candidate_response: &quot;[the model response being judged]&quot;;</span></span>
</span>
<span id="A1.SS4.p7.pic1.p6" class="ltx_para ltx_align_left ltx_noindent">
<span id="A1.SS4.p7.pic1.p6.1" class="ltx_p"><span id="A1.SS4.p7.pic1.p6.1.1" class="ltx_text ltx_font_typewriter" style="--ltx-fg-color:#000000;">instruction: &quot;[the full IF-RewardBench prompt with its explicit constraints]&quot;</span></span>
</span></span></span></span></foreignobject></g></g></svg>