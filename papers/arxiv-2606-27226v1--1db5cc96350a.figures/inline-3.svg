<span id="A1.F5.pic2.p3" class="ltx_para">
<span id="A1.F5.pic2.p3.1" class="ltx_p"><span id="A1.F5.pic2.p3.1.1" class="ltx_text ltx_font_bold" style="font-size:90%;--ltx-fg-color:#000000;">Decomposed reasoning:<span id="A1.F5.pic2.p3.1.1.1" class="ltx_text ltx_font_medium"> 
</span><span id="A1.F5.pic2.p3.1.1.2" class="ltx_text" style="--ltx-fg-color:#C62828;">N</span><span id="A1.F5.pic2.p3.1.1.3" class="ltx_text ltx_font_medium"> Q1 (misattributes Russia’s purpose to Pentagon)  
</span><span id="A1.F5.pic2.p3.1.1.4" class="ltx_text" style="--ltx-fg-color:#C62828;">N</span><span id="A1.F5.pic2.p3.1.1.5" class="ltx_text ltx_font_medium"> Q2 (fabricated URL)  
</span><span id="A1.F5.pic2.p3.1.1.6" class="ltx_text" style="--ltx-fg-color:#C62828;">N</span><span id="A1.F5.pic2.p3.1.1.7" class="ltx_text ltx_font_medium"> Q3 (wrong entity role)  
</span><span id="A1.F5.pic2.p3.1.1.8" class="ltx_text" style="--ltx-fg-color:#2E7D32;">Y</span><span id="A1.F5.pic2.p3.1.1.9" class="ltx_text ltx_font_medium"> Q4 (aircraft types correct)  
</span><span id="A1.F5.pic2.p3.1.1.10" class="ltx_text" style="--ltx-fg-color:#C62828;">N</span><span id="A1.F5.pic2.p3.1.1.11" class="ltx_text ltx_font_medium"> Q5 (conflates Pentagon/Russian accounts)  
</span><span id="A1.F5.pic2.p3.1.1.12" class="ltx_text" style="--ltx-fg-color:#2E7D32;">Y</span><span id="A1.F5.pic2.p3.1.1.13" class="ltx_text ltx_font_medium"> Q6–7 (core event described)</span></span></span>
<span id="A1.F5.pic2.p3.2" class="ltx_p"><span id="A1.F5.pic2.p3.2.1" class="ltx_text ltx_font_bold" style="font-size:90%;--ltx-fg-color:#000000;">Insight:<span id="A1.F5.pic2.p3.2.1.1" class="ltx_text ltx_font_medium">
The summary mentions correct entities (RC-135U, SU-27) and describes the real event, so holistic methods see it as consistent.
BinEval’s decomposed questions probe <em id="A1.F5.pic2.p3.2.1.1.1" class="ltx_emph ltx_font_italic">each claim independently</em>, catching the misattribution (</span><span id="A1.F5.pic2.p3.2.1.2" class="ltx_text" style="--ltx-fg-color:#C62828;">N</span><span id="A1.F5.pic2.p3.2.1.3" class="ltx_text ltx_font_medium"> Q1, Q3), fabricated URL (</span><span id="A1.F5.pic2.p3.2.1.4" class="ltx_text" style="--ltx-fg-color:#C62828;">N</span><span id="A1.F5.pic2.p3.2.1.5" class="ltx_text ltx_font_medium"> Q2), and conflated accounts (</span><span id="A1.F5.pic2.p3.2.1.6" class="ltx_text" style="--ltx-fg-color:#C62828;">N</span><span id="A1.F5.pic2.p3.2.1.7" class="ltx_text ltx_font_medium"> Q5). Score: <math id="A1.F5.pic2.m1" class="ltx_Math" alttext="3/7\to 1.57" display="inline" intent=":literal"><semantics><mrow><mrow><mn style="--ltx-fg-color:#000000;" mathcolor="#000000">3</mn><mo style="--ltx-fg-color:#000000;" mathcolor="#000000">/</mo><mn style="--ltx-fg-color:#000000;" mathcolor="#000000">7</mn></mrow><mo style="--ltx-fg-color:#000000;" mathcolor="#000000" stretchy="false">→</mo><mn style="--ltx-fg-color:#000000;" mathcolor="#000000">1.57</mn></mrow><annotation encoding="application/x-tex">3/7\to 1.57</annotation></semantics></math>, close to human 2.0.</span></span></span>
