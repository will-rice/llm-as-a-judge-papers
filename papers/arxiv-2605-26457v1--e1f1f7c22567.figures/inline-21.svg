<span id="A7.SS3.p2.pic1.1" class="ltx_inline-block ltx_minipage ltx_align_bottom" style="width:27.28em;">
<span id="A7.SS3.p2.pic1.1.1" class="ltx_p"><span id="A7.SS3.p2.pic1.1.1.1" class="ltx_text ltx_font_bold" style="--ltx-fg-color:#FFFFFF;">Informal specification (natural language) <math id="A7.SS3.p2.pic1.m1" class="ltx_Math" alttext="s_{I}" display="inline" intent=":literal"><semantics><msub><mi style="--ltx-fg-color:#FFFFFF;" mathcolor="#FFFFFF">s</mi><mi style="--ltx-fg-color:#FFFFFF;" mathcolor="#FFFFFF">I</mi></msub><annotation encoding="application/x-tex">s_{I}</annotation></semantics></math> for Codeforces 1028-C</span></span>
</span></span></span></foreignobject></g><g fill-opacity="1.0" transform="matrix(1.0 0.0 0.0 1.0 21.65 113.41)"><foreignobject style="--ltx-fo-width:39.35em;--ltx-fo-height:23.29em;--ltx-fo-depth:7.2em;font-size:10pt;" height="421.84" overflow="visible" transform="matrix(1 0 0 -1 0 322.21)" width="544.49"><span class="ltx_foreignobject_container"><span class="ltx_foreignobject_content">
<span id="A7.SS3.p2.pic1.2" class="ltx_inline-block ltx_minipage ltx_align_bottom" style="width:39.35em;">
<span id="A7.SS3.p2.pic1.2.1" class="ltx_p"><span id="A7.SS3.p2.pic1.2.1.1" class="ltx_text ltx_font_bold" style="font-size:70%;--ltx-fg-color:#000000;">Problem link.<span id="A7.SS3.p2.pic1.2.1.1.1" class="ltx_text ltx_font_medium">  <a href="https://codeforces.com/problemset/problem/1028/C" title class="ltx_ref ltx_url ltx_font_typewriter">https://codeforces.com/problemset/problem/1028/C</a></span></span></span>
<span id="A7.SS3.p2.pic1.2.2" class="ltx_p"><span id="A7.SS3.p2.pic1.2.2.1" class="ltx_text" style="font-size:70%;--ltx-fg-color:#000000;">You are given <math id="A7.SS3.p2.pic1.m2" class="ltx_Math" alttext="n" display="inline" intent=":literal"><semantics><mi style="--ltx-fg-color:#000000;" mathcolor="#000000">n</mi><annotation encoding="application/x-tex">n</annotation></semantics></math> rectangles on a plane with coordinates of their bottom left
and upper right points. Some <math id="A7.SS3.p2.pic1.m3" class="ltx_Math" alttext="(n-1)" display="inline" intent=":literal"><semantics><mrow><mo style="--ltx-fg-color:#000000;" mathcolor="#000000" stretchy="false">(</mo><mrow><mi style="--ltx-fg-color:#000000;" mathcolor="#000000">n</mi><mo style="--ltx-fg-color:#000000;" mathcolor="#000000">−</mo><mn style="--ltx-fg-color:#000000;" mathcolor="#000000">1</mn></mrow><mo style="--ltx-fg-color:#000000;" mathcolor="#000000" stretchy="false">)</mo></mrow><annotation encoding="application/x-tex">(n-1)</annotation></semantics></math> of the given <math id="A7.SS3.p2.pic1.m4" class="ltx_Math" alttext="n" display="inline" intent=":literal"><semantics><mi style="--ltx-fg-color:#000000;" mathcolor="#000000">n</mi><annotation encoding="application/x-tex">n</annotation></semantics></math> rectangles have some
common point. A point belongs to a rectangle if this point is strictly inside
the rectangle or belongs to its boundary.</span></span>
<span id="A7.SS3.p2.pic1.2.3" class="ltx_p"><span id="A7.SS3.p2.pic1.2.3.1" class="ltx_text" style="font-size:70%;--ltx-fg-color:#000000;">Find any point with integer coordinates that belongs to at least <math id="A7.SS3.p2.pic1.m5" class="ltx_Math" alttext="(n-1)" display="inline" intent=":literal"><semantics><mrow><mo style="--ltx-fg-color:#000000;" mathcolor="#000000" stretchy="false">(</mo><mrow><mi style="--ltx-fg-color:#000000;" mathcolor="#000000">n</mi><mo style="--ltx-fg-color:#000000;" mathcolor="#000000">−</mo><mn style="--ltx-fg-color:#000000;" mathcolor="#000000">1</mn></mrow><mo style="--ltx-fg-color:#000000;" mathcolor="#000000" stretchy="false">)</mo></mrow><annotation encoding="application/x-tex">(n-1)</annotation></semantics></math> given rectangles.</span></span>
<span id="A7.SS3.p2.pic1.2.4" class="ltx_p"><span id="A7.SS3.p2.pic1.2.4.1" class="ltx_text ltx_font_bold" style="font-size:70%;--ltx-fg-color:#000000;">Input.<span id="A7.SS3.p2.pic1.2.4.1.1" class="ltx_text"></span></span></span>
<span id="A7.SS3.p2.pic1.2.5" class="ltx_p"><span id="A7.SS3.p2.pic1.2.5.1" class="ltx_text" style="font-size:70%;--ltx-fg-color:#000000;">The first line contains a single integer <math id="A7.SS3.p2.pic1.m6" class="ltx_Math" alttext="n" display="inline" intent=":literal"><semantics><mi style="--ltx-fg-color:#000000;" mathcolor="#000000">n</mi><annotation encoding="application/x-tex">n</annotation></semantics></math> (<math id="A7.SS3.p2.pic1.m7" class="ltx_Math" alttext="2\leq n\leq 132\,674" display="inline" intent=":literal"><semantics><mrow><mn style="--ltx-fg-color:#000000;" mathcolor="#000000">2</mn><mo style="--ltx-fg-color:#000000;" mathcolor="#000000">≤</mo><mi style="--ltx-fg-color:#000000;" mathcolor="#000000">n</mi><mo style="--ltx-fg-color:#000000;" mathcolor="#000000">≤</mo><mn style="--ltx-fg-color:#000000;" mathcolor="#000000">132 674</mn></mrow><annotation encoding="application/x-tex">2\leq n\leq 132\,674</annotation></semantics></math>) — the number of given rectangles.</span></span>
<span id="A7.SS3.p2.pic1.2.6" class="ltx_p"><span id="A7.SS3.p2.pic1.2.6.1" class="ltx_text" style="font-size:70%;--ltx-fg-color:#000000;">Each the next <math id="A7.SS3.p2.pic1.m8" class="ltx_Math" alttext="n" display="inline" intent=":literal"><semantics><mi style="--ltx-fg-color:#000000;" mathcolor="#000000">n</mi><annotation encoding="application/x-tex">n</annotation></semantics></math> lines contains four integers <math id="A7.SS3.p2.pic1.m9" class="ltx_Math" alttext="x_{1}" display="inline" intent=":literal"><semantics><msub><mi style="--ltx-fg-color:#000000;" mathcolor="#000000">x</mi><mn style="--ltx-fg-color:#000000;" mathcolor="#000000">1</mn></msub><annotation encoding="application/x-tex">x_{1}</annotation></semantics></math>, <math id="A7.SS3.p2.pic1.m10" class="ltx_Math" alttext="y_{1}" display="inline" intent=":literal"><semantics><msub><mi style="--ltx-fg-color:#000000;" mathcolor="#000000">y</mi><mn style="--ltx-fg-color:#000000;" mathcolor="#000000">1</mn></msub><annotation encoding="application/x-tex">y_{1}</annotation></semantics></math>, <math id="A7.SS3.p2.pic1.m11" class="ltx_Math" alttext="x_{2}" display="inline" intent=":literal"><semantics><msub><mi style="--ltx-fg-color:#000000;" mathcolor="#000000">x</mi><mn style="--ltx-fg-color:#000000;" mathcolor="#000000">2</mn></msub><annotation encoding="application/x-tex">x_{2}</annotation></semantics></math> and <math id="A7.SS3.p2.pic1.m12" class="ltx_Math" alttext="y_{2}" display="inline" intent=":literal"><semantics><msub><mi style="--ltx-fg-color:#000000;" mathcolor="#000000">y</mi><mn style="--ltx-fg-color:#000000;" mathcolor="#000000">2</mn></msub><annotation encoding="application/x-tex">y_{2}</annotation></semantics></math> (<math id="A7.SS3.p2.pic1.m13" class="ltx_Math" alttext="-10^{9}\leq x_{1}&lt;x_{2}\leq 10^{9}" display="inline" intent=":literal"><semantics><mrow><mrow><mo style="--ltx-fg-color:#000000;" mathcolor="#000000">−</mo><msup><mn style="--ltx-fg-color:#000000;" mathcolor="#000000">10</mn><mn style="--ltx-fg-color:#000000;" mathcolor="#000000">9</mn></msup></mrow><mo style="--ltx-fg-color:#000000;" mathcolor="#000000">≤</mo><msub><mi style="--ltx-fg-color:#000000;" mathcolor="#000000">x</mi><mn style="--ltx-fg-color:#000000;" mathcolor="#000000">1</mn></msub><mo style="--ltx-fg-color:#000000;" mathcolor="#000000">&lt;</mo><msub><mi style="--ltx-fg-color:#000000;" mathcolor="#000000">x</mi><mn style="--ltx-fg-color:#000000;" mathcolor="#000000">2</mn></msub><mo style="--ltx-fg-color:#000000;" mathcolor="#000000">≤</mo><msup><mn style="--ltx-fg-color:#000000;" mathcolor="#000000">10</mn><mn style="--ltx-fg-color:#000000;" mathcolor="#000000">9</mn></msup></mrow><annotation encoding="application/x-tex">-10^{9}\leq x_{1}&lt;x_{2}\leq 10^{9}</annotation></semantics></math>, <math id="A7.SS3.p2.pic1.m14" class="ltx_Math" alttext="-10^{9}\leq y_{1}&lt;y_{2}\leq 10^{9}" display="inline" intent=":literal"><semantics><mrow><mrow><mo style="--ltx-fg-color:#000000;" mathcolor="#000000">−</mo><msup><mn style="--ltx-fg-color:#000000;" mathcolor="#000000">10</mn><mn style="--ltx-fg-color:#000000;" mathcolor="#000000">9</mn></msup></mrow><mo style="--ltx-fg-color:#000000;" mathcolor="#000000">≤</mo><msub><mi style="--ltx-fg-color:#000000;" mathcolor="#000000">y</mi><mn style="--ltx-fg-color:#000000;" mathcolor="#000000">1</mn></msub><mo style="--ltx-fg-color:#000000;" mathcolor="#000000">&lt;</mo><msub><mi style="--ltx-fg-color:#000000;" mathcolor="#000000">y</mi><mn style="--ltx-fg-color:#000000;" mathcolor="#000000">2</mn></msub><mo style="--ltx-fg-color:#000000;" mathcolor="#000000">≤</mo><msup><mn style="--ltx-fg-color:#000000;" mathcolor="#000000">10</mn><mn style="--ltx-fg-color:#000000;" mathcolor="#000000">9</mn></msup></mrow><annotation encoding="application/x-tex">-10^{9}\leq y_{1}&lt;y_{2}\leq 10^{9}</annotation></semantics></math>) — the coordinates of the bottom left and upper right corners of a rectangle.</span></span>
<span id="A7.SS3.p2.pic1.2.7" class="ltx_p"><span id="A7.SS3.p2.pic1.2.7.1" class="ltx_text ltx_font_bold" style="font-size:70%;--ltx-fg-color:#000000;">Output.<span id="A7.SS3.p2.pic1.2.7.1.1" class="ltx_text"></span></span></span>
<span id="A7.SS3.p2.pic1.2.8" class="ltx_p"><span id="A7.SS3.p2.pic1.2.8.1" class="ltx_text" style="font-size:70%;--ltx-fg-color:#000000;">Print two integers <math id="A7.SS3.p2.pic1.m15" class="ltx_Math" alttext="x" display="inline" intent=":literal"><semantics><mi style="--ltx-fg-color:#000000;" mathcolor="#000000">x</mi><annotation encoding="application/x-tex">x</annotation></semantics></math> and <math id="A7.SS3.p2.pic1.m16" class="ltx_Math" alttext="y" display="inline" intent=":literal"><semantics><mi style="--ltx-fg-color:#000000;" mathcolor="#000000">y</mi><annotation encoding="application/x-tex">y</annotation></semantics></math> — the coordinates of any point that belongs to at least <math id="A7.SS3.p2.pic1.m17" class="ltx_Math" alttext="(n-1)" display="inline" intent=":literal"><semantics><mrow><mo style="--ltx-fg-color:#000000;" mathcolor="#000000" stretchy="false">(</mo><mrow><mi style="--ltx-fg-color:#000000;" mathcolor="#000000">n</mi><mo style="--ltx-fg-color:#000000;" mathcolor="#000000">−</mo><mn style="--ltx-fg-color:#000000;" mathcolor="#000000">1</mn></mrow><mo style="--ltx-fg-color:#000000;" mathcolor="#000000" stretchy="false">)</mo></mrow><annotation encoding="application/x-tex">(n-1)</annotation></semantics></math> given rectangles.</span></span>
<span id="A7.SS3.p2.pic1.2.9" class="ltx_p"><span id="A7.SS3.p2.pic1.2.9.1" class="ltx_text ltx_font_bold" style="font-size:70%;--ltx-fg-color:#000000;">Example.<span id="A7.SS3.p2.pic1.2.9.1.1" class="ltx_text"></span></span></span>
<span id="A7.SS3.p2.pic1.2.10" class="ltx_p ltx_align_left"><span id="A7.SS3.p2.pic1.2.10.1" class="ltx_text ltx_font_typewriter" style="font-size:70%;--ltx-fg-color:#000000;">Input:
<br class="ltx_break">3
<br class="ltx_break">0 0 1 1
<br class="ltx_break">1 1 2 2
<br class="ltx_break">3 0 4 1
<br class="ltx_break">Output:
<br class="ltx_break">1 1
</span></span>
</span></span></span></foreignobject></g></g></svg>