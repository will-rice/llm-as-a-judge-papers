<span id="A1.F5.pic1.1" class="ltx_inline-block ltx_minipage ltx_align_bottom" style="width:39.06em;">
<span id="A1.F5.pic1.1.1" class="ltx_p"><span id="A1.F5.pic1.1.1.1" class="ltx_text ltx_font_bold" style="--ltx-fg-color:#FFFFFF;">Prompt on Relevance of SummEval</span></span>
</span></span></span></foreignobject></g><g fill-opacity="1.0" transform="matrix(1.0 0.0 0.0 1.0 15.81 15.81)"><foreignobject style="--ltx-fo-width:44.92em;--ltx-fo-height:33.98em;--ltx-fo-depth:0em;font-size:10pt;" height="470.23" overflow="visible" transform="matrix(1 0 0 -1 0 470.23)" width="621.57"><span class="ltx_foreignobject_container"><span class="ltx_foreignobject_content">
<span id="A1.F5.pic1.2" class="ltx_inline-block ltx_minipage ltx_align_bottom" style="width:44.92em;">
<span id="A1.F5.pic1.2.1" class="ltx_p"><span id="A1.F5.pic1.2.1.1" class="ltx_text" style="--ltx-fg-color:#000000;">You’ll be handed a summary of a news article. 
<br class="ltx_break" style="--ltx-break-space:5.0pt;"></span></span>
<span id="A1.F5.pic1.2.2" class="ltx_p"><span id="A1.F5.pic1.2.2.1" class="ltx_text" style="--ltx-fg-color:#000000;">Your challenge is to rate how well the summary captures the essence of the article. 
<br class="ltx_break" style="--ltx-break-space:5.0pt;"></span></span>
<span id="A1.F5.pic1.2.3" class="ltx_p"><span id="A1.F5.pic1.2.3.1" class="ltx_text" style="--ltx-fg-color:#000000;">Make sure to thoroughly read and understand these instructions before diving in. Keep this guide handy as you work through the task, so you can refer back to it if needed. 
<br class="ltx_break" style="--ltx-break-space:10.0pt;"></span></span>
<span id="A1.F5.pic1.2.4" class="ltx_p"><span id="A1.F5.pic1.2.4.1" class="ltx_text ltx_font_bold" style="--ltx-fg-color:#000000;">Evaluation Criteria:<span id="A1.F5.pic1.2.4.1.1" class="ltx_text ltx_font_medium"> 
<br class="ltx_break" style="--ltx-break-space:2.5pt;">
</span>Relevance (1–5):<span id="A1.F5.pic1.2.4.1.2" class="ltx_text ltx_font_medium"> Does the summary hit the mark by including the most important content from the original article? It should focus on the key details without wandering into irrelevant or repetitive information. If the summary strays or over-explains, it should be rated lower. 
<br class="ltx_break" style="--ltx-break-space:10.0pt;"></span></span></span>
<span id="A1.F5.pic1.2.5" class="ltx_p"><span id="A1.F5.pic1.2.5.1" class="ltx_text ltx_font_bold" style="--ltx-fg-color:#000000;">How to Evaluate:<span id="A1.F5.pic1.2.5.1.1" class="ltx_text ltx_font_medium"> 
<br class="ltx_break" style="--ltx-break-space:2.5pt;"></span></span></span>
<span id="A1.I3" class="ltx_enumerate">
<span id="A1.I3.i1" class="ltx_item" style="list-style-type:none;"><span class="ltx_tag ltx_tag_item">1.</span> 
<span id="A1.I3.i1.p1" class="ltx_para">
<span id="A1.I3.i1.p1.1" class="ltx_p"><span id="A1.I3.i1.p1.1.1" class="ltx_text" style="--ltx-fg-color:#000000;">Read both the source article and the summary attentively.</span></span>
</span></span>
<span id="A1.I3.i2" class="ltx_item" style="list-style-type:none;"><span class="ltx_tag ltx_tag_item">2.</span> 
<span id="A1.I3.i2.p1" class="ltx_para">
<span id="A1.I3.i2.p1.1" class="ltx_p"><span id="A1.I3.i2.p1.1.1" class="ltx_text" style="--ltx-fg-color:#000000;">Compare the two, identifying the critical points of the article.</span></span>
</span></span>
<span id="A1.I3.i3" class="ltx_item" style="list-style-type:none;"><span class="ltx_tag ltx_tag_item">3.</span> 
<span id="A1.I3.i3.p1" class="ltx_para">
<span id="A1.I3.i3.p1.1" class="ltx_p"><span id="A1.I3.i3.p1.1.1" class="ltx_text" style="--ltx-fg-color:#000000;">Judge how well the summary captures these important points and avoids unnecessary details.</span></span>
</span></span>
<span id="A1.I3.i4" class="ltx_item" style="list-style-type:none;"><span class="ltx_tag ltx_tag_item">4.</span> 
<span id="A1.I3.i4.p1" class="ltx_para">
<span id="A1.I3.i4.p1.1" class="ltx_p"><span id="A1.I3.i4.p1.1.1" class="ltx_text" style="--ltx-fg-color:#000000;">Give the summary a relevance score between 1 and 5. </span>
<br class="ltx_break"></span>
</span></span>
</span>
<span id="A1.F5.pic1.2.6" class="ltx_p"><span id="A1.F5.pic1.2.6.1" class="ltx_text ltx_font_bold" style="--ltx-fg-color:#000000;">Source Article:<span id="A1.F5.pic1.2.6.1.1" class="ltx_text ltx_font_medium"> 
<br class="ltx_break"><code id="A1.F5.pic1.2.6.1.1.1" class="ltx_verbatim ltx_font_typewriter">{{Document}}</code> 
<br class="ltx_break" style="--ltx-break-space:10.0pt;"></span></span></span>
<span id="A1.F5.pic1.2.7" class="ltx_p"><span id="A1.F5.pic1.2.7.1" class="ltx_text ltx_font_bold" style="--ltx-fg-color:#000000;">Summary:<span id="A1.F5.pic1.2.7.1.1" class="ltx_text ltx_font_medium"> 
<br class="ltx_break"><code id="A1.F5.pic1.2.7.1.1.1" class="ltx_verbatim ltx_font_typewriter">{{Summary}}</code> 
<br class="ltx_break" style="--ltx-break-space:10.0pt;"></span></span></span>
<span id="A1.F5.pic1.2.8" class="ltx_p"><span id="A1.F5.pic1.2.8.1" class="ltx_text ltx_font_bold" style="--ltx-fg-color:#000000;">Evaluation Form (ENTER A SCORE BETWEEN 1–5):
<br class="ltx_break" style="--ltx-break-space:5.0pt;"><span id="A1.F5.pic1.2.8.1.1" class="ltx_text ltx_font_medium">
