<span id="A1.SS4.p5.pic1.1" class="ltx_inline-block ltx_minipage ltx_align_bottom" style="width:39.75em;">
<span id="A1.SS4.p5.pic1.1.1" class="ltx_p"><span id="A1.SS4.p5.pic1.1.1.1" class="ltx_text ltx_font_bold" style="--ltx-fg-color:#FFFFFF;">Prompt for context inconsistency (CI)</span></span>
</span></span></span></foreignobject></g><g fill-opacity="1.0" transform="matrix(1.0 0.0 0.0 1.0 10.3 95.02)"><foreignobject style="--ltx-fo-width:43.53em;--ltx-fo-height:24.68em;--ltx-fo-depth:6.22em;font-size:10pt;" height="427.65" overflow="visible" transform="matrix(1 0 0 -1 0 341.55)" width="602.33"><span class="ltx_foreignobject_container"><span class="ltx_foreignobject_content"><span id="A1.SS4.p5.pic1.2" class="ltx_inline-logical-block ltx_minipage ltx_align_bottom" style="width:43.53em;">
<span id="A1.SS4.p5.pic1.p1" class="ltx_para ltx_align_left ltx_noindent">
<span id="A1.SS4.p5.pic1.p1.1" class="ltx_p"><span id="A1.SS4.p5.pic1.p1.1.1" class="ltx_text ltx_font_typewriter ltx_font_bold" style="--ltx-fg-color:#000000;">Instructions:</span><span id="A1.SS4.p5.pic1.p1.1.2" class="ltx_text ltx_font_typewriter" style="--ltx-fg-color:#000000;"> Review the entire candidate response against the supplied context. Determine whether the response asserts at least one substantive factual claim that is inconsistent with or unsupported by that context. Choose H only if such a claim satisfies the H criterion. Otherwise choose N. Use the supplied context as the evidence source, and evaluate only contextual faithfulness rather than formatting or general instruction compliance.</span></span>
</span>
<span id="A1.SS4.p5.pic1.p2" class="ltx_para ltx_align_left ltx_noindent">
<span id="A1.SS4.p5.pic1.p2.1" class="ltx_p"><span id="A1.SS4.p5.pic1.p2.1.1" class="ltx_text ltx_font_typewriter ltx_font_bold" style="--ltx-fg-color:#000000;">Criterion H:</span><span id="A1.SS4.p5.pic1.p2.1.2" class="ltx_text ltx_font_typewriter" style="--ltx-fg-color:#000000;"> At least one substantive factual claim in the candidate response contradicts the supplied context or introduces information that cannot reasonably be supported or inferred from the supplied context. Judge faithfulness to the context even if the introduced information might be true in the real world.</span></span>
</span>
<span id="A1.SS4.p5.pic1.p3" class="ltx_para ltx_align_left ltx_noindent">
<span id="A1.SS4.p5.pic1.p3.1" class="ltx_p"><span id="A1.SS4.p5.pic1.p3.1.1" class="ltx_text ltx_font_typewriter ltx_font_bold" style="--ltx-fg-color:#000000;">Criterion N:</span><span id="A1.SS4.p5.pic1.p3.1.2" class="ltx_text ltx_font_typewriter" style="--ltx-fg-color:#000000;"> Every substantive factual claim in the candidate response is supported by, entailed by, or reasonably inferable from the supplied context. Also choose N when the response merely omits contextual details, declines or is unable to answer, uses harmless introductory or meta wording, or expresses a reasonable paraphrase, summary, abstraction, or inference. Formatting, length, style, and other instruction-following violations do not by themselves count as context inconsistency.</span></span>
</span>
<span id="A1.SS4.p5.pic1.p4" class="ltx_para ltx_align_left ltx_noindent">
<span id="A1.SS4.p5.pic1.p4.1" class="ltx_p"><span id="A1.SS4.p5.pic1.p4.1.1" class="ltx_text ltx_font_typewriter ltx_font_bold" style="--ltx-fg-color:#000000;">State:</span></span>
</span>
<span id="A1.SS4.p5.pic1.p5" class="ltx_para ltx_align_left ltx_noindent">
<span id="A1.SS4.p5.pic1.p5.1" class="ltx_p"><span id="A1.SS4.p5.pic1.p5.1.1" class="ltx_text ltx_font_typewriter" style="--ltx-fg-color:#000000;">candidate_response: &quot;[the model output being judged]&quot;;</span></span>
</span>
<span id="A1.SS4.p5.pic1.p6" class="ltx_para ltx_align_left ltx_noindent">
<span id="A1.SS4.p5.pic1.p6.1" class="ltx_p"><span id="A1.SS4.p5.pic1.p6.1.1" class="ltx_text ltx_font_typewriter" style="--ltx-fg-color:#000000;">context: &quot;[the RAGTruth source material]&quot;;</span></span>
</span>
<span id="A1.SS4.p5.pic1.p7" class="ltx_para ltx_align_left ltx_noindent">
<span id="A1.SS4.p5.pic1.p7.1" class="ltx_p"><span id="A1.SS4.p5.pic1.p7.1.1" class="ltx_text ltx_font_typewriter" style="--ltx-fg-color:#000000;">instruction: &quot;[the RAGTruth task prompt]&quot;</span></span>
</span></span></span></span></foreignobject></g></g></svg>