<svg id="S15.SS0.SSS0.Px14.p3.pic1" class="ltx_picture" height="356.97" overflow="visible" version="1.1" viewbox="0 0 477.38 356.97" width="477.38"><g style="--ltx-stroke-color:#000000;--ltx-fill-color:#000000;" fill="#000000" stroke="#000000" stroke-width="0.4pt" transform="translate(0,356.97) matrix(1 0 0 -1 0 0)"><g style="--ltx-fill-color:#4285F4;" fill="#4285F4" fill-opacity="1.0"><path style="stroke:none" d="M 0 7.5 L 0 349.47 C 0 353.61 3.36 356.97 7.5 356.97 L 469.87 356.97 C 474.02 356.97 477.38 353.61 477.38 349.47 L 477.38 7.5 C 477.38 3.36 474.02 0 469.87 0 L 7.5 0 C 3.36 0 0 3.36 0 7.5 Z" /></g><g style="--ltx-fill-color:#F5F5F5;" fill="#F5F5F5" fill-opacity="1.0"><path style="stroke:none" d="M 1.97 7.5 L 1.97 318.59 L 475.41 318.59 L 475.41 7.5 C 475.41 4.45 472.93 1.97 469.87 1.97 L 7.5 1.97 C 4.45 1.97 1.97 4.45 1.97 7.5 Z" /></g><g fill-opacity="1.0" transform="matrix(1.0 0.0 0.0 1.0 20.48 326.02)"><foreignobject style="--ltx-fo-width:27.43em;--ltx-fo-height:1.89em;--ltx-fo-depth:0.19em;font-size:10pt;" height="28.9" overflow="visible" transform="matrix(1 0 0 -1 0 26.21)" width="379.55"><span class="ltx_foreignobject_container"><span class="ltx_foreignobject_content">
<span id="S15.SS0.SSS0.Px14.p3.pic1.1" class="ltx_inline-block ltx_minipage ltx_align_bottom" style="width:27.43em;">
<span id="S15.SS0.SSS0.Px14.p3.pic1.1.1" class="ltx_p"><span id="S15.SS0.SSS0.Px14.p3.pic1.1.1.1" class="ltx_text" style="position:relative; bottom:0.9pt;"></span><a href="https://codeforces.com/blog/entry/136523" title class="ltx_ref ltx_href ltx_font_bold" style="--ltx-fg-color:#FFFFFF;">Tutorial</a><span id="S15.SS0.SSS0.Px14.p3.pic1.1.1.2" class="ltx_text ltx_font_bold" style="--ltx-fg-color:#FFFFFF;"> — <a href="https://codeforces.com/problemset/submission/2039/292919751" title class="ltx_ref ltx_href">Human’s accepted submission</a> — <a href="https://gist.github.com/anonymous-llm-code/e26fbf19c244ec7ebd25a1875976771d" title class="ltx_ref ltx_href"><span class="ltx_text ltx_font_typewriter">Gemini 2.5 Pro</span>’s rejected submission</a></span></span>
</span></span></span></foreignobject></g><g fill-opacity="1.0" transform="matrix(1.0 0.0 0.0 1.0 20.48 16.07)"><foreignobject style="--ltx-fo-width:31.54em;--ltx-fo-height:21.09em;--ltx-fo-depth:0.25em;font-size:10pt;" height="295.35" overflow="visible" transform="matrix(1 0 0 -1 0 291.89)" width="436.42"><span class="ltx_foreignobject_container"><span class="ltx_foreignobject_content">
<span id="S15.SS0.SSS0.Px14.p3.pic1.2" class="ltx_inline-block ltx_minipage ltx_align_bottom" style="width:31.54em;">
<span id="S15.SS0.SSS0.Px14.p3.pic1.2.1" class="ltx_p"><span id="S15.SS0.SSS0.Px14.p3.pic1.2.1.1" class="ltx_text" style="--ltx-fg-color:#000000;">No one length strings are valid. Two length strings are valid if the adjacent characters are the same. So, if <math id="S15.SS0.SSS0.Px14.p3.pic1.m1" class="ltx_Math" alttext="s" display="inline" intent=":literal"><semantics><mi style="--ltx-fg-color:#000000;" mathcolor="#000000">s</mi><annotation encoding="application/x-tex">s</annotation></semantics></math> contains two consecutive same characters, we can print it right away. All that remains is the consider strings without two consecutive same characters. 
<br class="ltx_break">
<br class="ltx_break">Three length strings are valid if all characters are different. So if <math id="S15.SS0.SSS0.Px14.p3.pic1.m2" class="ltx_Math" alttext="s" display="inline" intent=":literal"><semantics><mi style="--ltx-fg-color:#000000;" mathcolor="#000000">s</mi><annotation encoding="application/x-tex">s</annotation></semantics></math> contains three consecutive different characters, we can print it right away. All the remains is to consider strings without two adjacent same characters but no three consecutive different characters. So all the remaining strings are of the form <math id="S15.SS0.SSS0.Px14.p3.pic1.m3" class="ltx_Math" alttext="s=\texttt{abababababa}\dots" display="inline" intent=":literal"><semantics><mrow><mi style="--ltx-fg-color:#000000;" mathcolor="#000000">s</mi><mo style="--ltx-fg-color:#000000;" mathcolor="#000000">=</mo><mrow><mtext style="--ltx-fg-color:#000000;" class="ltx_mathvariant_monospace" mathcolor="#000000">abababababa</mtext><mo lspace="0em" rspace="0em">​</mo><mi style="--ltx-fg-color:#000000;" mathcolor="#000000" mathvariant="normal">…</mi></mrow></mrow><annotation encoding="application/x-tex">s=\texttt{abababababa}\dots</annotation></semantics></math>. 
<br class="ltx_break">
<br class="ltx_break">The total number of unique substrings of any length is <math id="S15.SS0.SSS0.Px14.p3.pic1.m4" class="ltx_Math" alttext="2" display="inline" intent=":literal"><semantics><mn style="--ltx-fg-color:#000000;" mathcolor="#000000">2</mn><annotation encoding="application/x-tex">2</annotation></semantics></math>. But only the length <math id="S15.SS0.SSS0.Px14.p3.pic1.m5" class="ltx_Math" alttext="n" display="inline" intent=":literal"><semantics><mi style="--ltx-fg-color:#000000;" mathcolor="#000000">n</mi><annotation encoding="application/x-tex">n</annotation></semantics></math> substring occurs exactly once. So total number of unique substrings if <math id="S15.SS0.SSS0.Px14.p3.pic1.m6" class="ltx_Math" alttext="2n-1" display="inline" intent=":literal"><semantics><mrow><mrow><mn style="--ltx-fg-color:#000000;" mathcolor="#000000">2</mn><mo lspace="0em" rspace="0em">​</mo><mi style="--ltx-fg-color:#000000;" mathcolor="#000000">n</mi></mrow><mo style="--ltx-fg-color:#000000;" mathcolor="#000000">−</mo><mn style="--ltx-fg-color:#000000;" mathcolor="#000000">1</mn></mrow><annotation encoding="application/x-tex">2n-1</annotation></semantics></math>. And this is always odd! So there is no solution for these strings. We have covered all the cases. 
<br class="ltx_break">
<br class="ltx_break">If there are adjacent same characters, we can print it right away. If there are three consecutive different characters, we can print it right away. Otherwise there is no solution. 
<br class="ltx_break">
<br class="ltx_break"><span id="S15.SS0.SSS0.Px14.p3.pic1.2.1.1.1" class="ltx_text ltx_font_bold">Time Complexity: </span> <math id="S15.SS0.SSS0.Px14.p3.pic1.m7" class="ltx_Math" alttext="\mathcal{O}(n)" display="inline" intent=":literal"><semantics><mrow><mi style="--ltx-fg-color:#000000;" class="ltx_font_mathcaligraphic" mathcolor="#000000">𝒪</mi><mo>⁡</mo><mrow><mo style="--ltx-fg-color:#000000;" mathcolor="#000000" stretchy="false">(</mo><mi style="--ltx-fg-color:#000000;" mathcolor="#000000">n</mi><mo style="--ltx-fg-color:#000000;" mathcolor="#000000" stretchy="false">)</mo></mrow></mrow><annotation encoding="application/x-tex">\mathcal{O}(n)</annotation></semantics></math>.</span></span>
</span></span></span></foreignobject></g></g></svg>