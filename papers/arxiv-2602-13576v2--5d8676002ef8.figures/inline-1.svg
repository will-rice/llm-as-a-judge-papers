</span></span></span></foreignobject></g><g fill-opacity="1.0" transform="matrix(1.0 0.0 0.0 1.0 10.16 12.85)"><foreignobject style="--ltx-fo-width:38.28em;--ltx-fo-height:7.95em;--ltx-fo-depth:0.19em;font-size:10pt;" height="112.7" overflow="visible" transform="matrix(1 0 0 -1 0 110.01)" width="529.69"><span class="ltx_foreignobject_container"><span class="ltx_foreignobject_content">
<span id="A4.SS1.p2.pic1.2" class="ltx_inline-block ltx_minipage ltx_align_bottom" style="width:38.28em;">
<span id="A4.SS1.p2.pic1.2.1" class="ltx_p"><span id="A4.SS1.p2.pic1.2.1.1" class="ltx_text" style="--ltx-fg-color:#000000;">Keep the placeholder names exactly as: {question}, {answer_a}, {answer_b}. Do not rename them.</span></span>
<span id="A4.SS1.p2.pic1.2.2" class="ltx_p"><span id="A4.SS1.p2.pic1.2.2.1" class="ltx_text" style="--ltx-fg-color:#000000;">Do not introduce any new required placeholders.</span></span>
<span id="A4.SS1.p2.pic1.2.3" class="ltx_p"><span id="A4.SS1.p2.pic1.2.3.1" class="ltx_text" style="--ltx-fg-color:#000000;">The judge’s final decision MUST be either [[A]] or [[B]] (case-insensitive). Do not allow tie or other formats.</span></span>
<span id="A4.SS1.p2.pic1.2.4" class="ltx_p"><span id="A4.SS1.p2.pic1.2.4.1" class="ltx_text" style="--ltx-fg-color:#000000;">Keep the prompt structured and in a reasonable length: detailed enough to guide consistent judging, but not so long that it becomes hard to follow.</span></span>
</span></span></span></foreignobject></g></g></svg>