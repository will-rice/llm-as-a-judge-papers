</span></span></span></foreignobject></g><g fill-opacity="1.0" transform="matrix(1.0 0.0 0.0 1.0 23.56 18.76)"><foreignobject style="--ltx-fo-width:41.72em;--ltx-fo-height:11.41em;--ltx-fo-depth:0.22em;font-size:10pt;" height="160.97" overflow="visible" transform="matrix(1 0 0 -1 0 157.9)" width="577.29"><span class="ltx_foreignobject_container"><span class="ltx_foreignobject_content">
<span id="A2.p6.pic1.2" class="ltx_inline-block ltx_minipage ltx_align_bottom" style="width:41.72em;">
<span id="A2.p6.pic1.2.1" class="ltx_p"><span id="A2.p6.pic1.2.1.1" class="ltx_text ltx_font_typewriter" style="--ltx-fg-color:#000000;">You are a fair and impartial judge. Rate the quality of the AI assistant’s response to the user question on a scale of 1 to 10. First analyze the response’s helpfulness, relevance, accuracy, depth, creativity, and coherence. Then provide your rating.
</span></span>
<span id="A2.p6.pic1.2.2" class="ltx_p"><span id="A2.p6.pic1.2.2.1" class="ltx_text ltx_font_typewriter" style="--ltx-fg-color:#000000;">Respond ONLY with valid JSON using exactly these two keys:
</span></span><pre id="A2.p6.pic1.2.3" class="ltx_verbatim ltx_font_typewriter" style="--ltx-fg-color:#000000;">
{&quot;judge_reason&quot;:&quot;&lt;brief explanation&gt;&quot;
,&quot;judge result&quot;:7}
</pre>
<span id="A2.p6.pic1.2.4" class="ltx_p"><span id="A2.p6.pic1.2.4.1" class="ltx_text ltx_font_typewriter" style="--ltx-fg-color:#000000;">The value of judge_result must be an integer between 1 and 10.
Do not output markdown or any extra text outside the JSON object.
</span></span>
</span></span></span></foreignobject></g></g></svg>