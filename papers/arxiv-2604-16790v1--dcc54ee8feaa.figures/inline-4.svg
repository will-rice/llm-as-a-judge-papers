</span></span></span></foreignobject></g><g fill-opacity="1.0" transform="matrix(1.0 0.0 0.0 1.0 15.7 99.07)"><foreignobject style="--ltx-fo-width:34.84em;--ltx-fo-height:23.55em;--ltx-fo-depth:6.23em;font-size:10pt;" height="412" overflow="visible" transform="matrix(1 0 0 -1 0 325.87)" width="482.09"><span class="ltx_foreignobject_container"><span class="ltx_foreignobject_content">
<span id="S3.F2.pic1.2" class="ltx_inline-block ltx_minipage ltx_align_bottom" style="width:34.84em;">
<span id="S3.F2.pic1.2.1" class="ltx_p"><span id="S3.F2.pic1.2.1.1" class="ltx_text ltx_font_bold" style="font-size:90%;--ltx-fg-color:#000000;">Role.<span id="S3.F2.pic1.2.1.1.1" class="ltx_text ltx_font_medium"> Please act as an impartial judge and evaluate the quality of the
responses provided by two AI assistants to the user prompt shown below.</span></span></span>
<span id="S3.F2.pic1.2.2" class="ltx_p"><span id="S3.F2.pic1.2.2.1" class="ltx_text ltx_font_bold" style="font-size:90%;--ltx-fg-color:#000000;">Procedure.<span id="S3.F2.pic1.2.2.1.1" class="ltx_text"></span></span></span>
<span id="S3.I1" class="ltx_enumerate ltx_leftmargin_flush">
<span id="S3.I1.i1" class="ltx_item" style="list-style-type:none;"><span class="ltx_tag ltx_tag_item">(1)</span> 
<span id="S3.I1.i1.p1" class="ltx_para">
<span id="S3.I1.i1.p1.1" class="ltx_p"><span id="S3.I1.i1.p1.1.1" class="ltx_text" style="font-size:90%;--ltx-fg-color:#000000;">Begin by generating </span><em id="S3.I1.i1.p1.1.2" class="ltx_emph ltx_font_italic" style="font-size:90%;--ltx-fg-color:#000000;">your own</em><span id="S3.I1.i1.p1.1.3" class="ltx_text" style="font-size:90%;--ltx-fg-color:#000000;"> answer to the prompt before viewing any verdict.</span></span>
</span></span>
<span id="S3.I1.i2" class="ltx_item" style="list-style-type:none;"><span class="ltx_tag ltx_tag_item">(2)</span> 
<span id="S3.I1.i2.p1" class="ltx_para">
<span id="S3.I1.i2.p1.1" class="ltx_p"><span id="S3.I1.i2.p1.1.1" class="ltx_text" style="font-size:90%;--ltx-fg-color:#000000;">Compare each assistant’s answer with your answer.</span></span>
</span></span>
<span id="S3.I1.i3" class="ltx_item" style="list-style-type:none;"><span class="ltx_tag ltx_tag_item">(3)</span> 
<span id="S3.I1.i3.p1" class="ltx_para">
<span id="S3.I1.i3.p1.1" class="ltx_p"><span id="S3.I1.i3.p1.1.1" class="ltx_text" style="font-size:90%;--ltx-fg-color:#000000;">Identify and correct any mistakes or inaccuracies you find.</span></span>
</span></span>
</span>
<span id="S3.F2.pic1.2.3" class="ltx_p"><span id="S3.F2.pic1.2.3.1" class="ltx_text ltx_font_bold" style="font-size:90%;--ltx-fg-color:#000000;">Final verdict.<span id="S3.F2.pic1.2.3.1.1" class="ltx_text ltx_font_medium"> After your explanation, output <em id="S3.F2.pic1.2.3.1.1.1" class="ltx_emph ltx_font_italic">only one</em> of:</span></span></span>
<span id="S3.I2" class="ltx_enumerate ltx_leftmargin_flush">
<span id="S3.I2.i1" class="ltx_item" style="list-style-type:none;"><span class="ltx_tag ltx_tag_item">(1)</span> 
<span id="S3.I2.i1.p1" class="ltx_para">
<span id="S3.I2.i1.p1.1" class="ltx_p"><span id="S3.I2.i1.p1.1.1" class="ltx_text" style="font-size:90%;--ltx-fg-color:#000000;">Assistant A is better: </span><code id="S3.I2.i1.p1.1.2" class="ltx_verbatim ltx_font_typewriter" style="font-size:90%;--ltx-fg-color:#000000;">[[A&gt;B]]</code></span>
</span></span>
<span id="S3.I2.i2" class="ltx_item" style="list-style-type:none;"><span class="ltx_tag ltx_tag_item">(2)</span> 
<span id="S3.I2.i2.p1" class="ltx_para">
<span id="S3.I2.i2.p1.1" class="ltx_p"><span id="S3.I2.i2.p1.1.1" class="ltx_text" style="font-size:90%;--ltx-fg-color:#000000;">Assistant B is better: </span><code id="S3.I2.i2.p1.1.2" class="ltx_verbatim ltx_font_typewriter" style="font-size:90%;--ltx-fg-color:#000000;">[[B&gt;A]]</code></span>
</span></span>
</span>
<span id="S3.F2.pic1.2.4" class="ltx_p"><span id="S3.F2.pic1.2.4.1" class="ltx_text ltx_font_italic" style="font-size:90%;--ltx-fg-color:#000000;">Example:<span id="S3.F2.pic1.2.4.1.1" class="ltx_text ltx_font_upright"> <em id="S3.F2.pic1.2.4.1.1.1" class="ltx_emph ltx_font_italic">My final verdict is Assistant A is better:</em> <code id="S3.F2.pic1.2.4.1.1.2" class="ltx_verbatim ltx_font_typewriter">[[A&gt;B]]</code>.</span></span></span>
<span id="S3.F2.pic1.2.5" class="ltx_p"><span id="S3.F2.pic1.2.5.1" class="ltx_text ltx_font_bold" style="font-size:90%;--ltx-fg-color:#000000;">Inputs.<span id="S3.F2.pic1.2.5.1.1" class="ltx_text"></span></span></span>
<span id="S3.F2.pic1.2.6" class="ltx_p"><span id="S3.F2.pic1.2.6.1" class="ltx_text ltx_font_typewriter" style="font-size:90%;--ltx-fg-color:#000000;">&lt;|The Start of Assistant A’s Answer|&gt;
<br class="ltx_break">{Bias_a}+{answer_a}
<br class="ltx_break">&lt;|The End of Assistant A’s Answer|&gt;
<br class="ltx_break" style="--ltx-break-space:2.8pt;">
&lt;|The Start of Assistant B’s Answer|&gt;
<br class="ltx_break">{Bias_b}+{answer_b}
<br class="ltx_break">&lt;|The End of Assistant B’s Answer|&gt;<span id="S3.F2.pic1.2.6.1.1" class="ltx_text ltx_font_serif">
</span></span></span>
