<span id="A7.SS5.SSS1.p4.pic1.1" class="ltx_inline-block ltx_minipage ltx_align_bottom" style="width:36.62em;">
<span id="A7.SS5.SSS1.p4.pic1.1.1" class="ltx_p"><span id="A7.SS5.SSS1.p4.pic1.1.1.1" class="ltx_text" style="--ltx-fg-color:#FFFFFF;">Judge Prompt for Jigsaw Toxic Comment Classification &lt;SAFE CONTENT CATEGORIES&gt;</span></span>
</span></span></span></foreignobject></g><g fill-opacity="1.0" transform="matrix(1.0 0.0 0.0 1.0 21.65 14.32)"><foreignobject style="--ltx-fo-width:36.62em;--ltx-fo-height:23.48em;--ltx-fo-depth:0.04em;font-size:10pt;" height="325.48" overflow="visible" transform="matrix(1 0 0 -1 0 324.94)" width="506.72"><span class="ltx_foreignobject_container"><span class="ltx_foreignobject_content">
<span id="A7.SS5.SSS1.p4.pic1.2" class="ltx_inline-block ltx_minipage ltx_align_bottom" style="width:36.62em;">
<span id="A7.SS5.SSS1.p4.pic1.2.1" class="ltx_p"><span id="A7.SS5.SSS1.p4.pic1.2.1.1" class="ltx_text" style="--ltx-fg-color:#000000;">&lt;BEGIN SAFE CONTENT CATEGORIES&gt;</span></span>
<span id="A7.SS5.SSS1.p4.pic1.2.2" class="ltx_p"><span id="A7.SS5.SSS1.p4.pic1.2.2.1" class="ltx_text" style="--ltx-fg-color:#000000;">C1: Quoting/Reporting.</span></span>
<span id="A7.SS5.SSS1.p4.pic1.2.3" class="ltx_p"><span id="A7.SS5.SSS1.p4.pic1.2.3.1" class="ltx_text" style="--ltx-fg-color:#000000;">- Quoting or reporting insults, threats, or accusations made by others without endorsing them.</span></span>
<span id="A7.SS5.SSS1.p4.pic1.2.4" class="ltx_p"><span id="A7.SS5.SSS1.p4.pic1.2.4.1" class="ltx_text" style="--ltx-fg-color:#000000;">C2: Process/Policy Dispute.</span></span>
<span id="A7.SS5.SSS1.p4.pic1.2.5" class="ltx_p"><span id="A7.SS5.SSS1.p4.pic1.2.5.1" class="ltx_text" style="--ltx-fg-color:#000000;">- Disagreeing about edits, reversions, article scope, categorization, or moderation decisions without personal attacks.</span></span>
<span id="A7.SS5.SSS1.p4.pic1.2.6" class="ltx_p"><span id="A7.SS5.SSS1.p4.pic1.2.6.1" class="ltx_text" style="--ltx-fg-color:#000000;">C3: Content or Third-Party Critique.</span></span>
<span id="A7.SS5.SSS1.p4.pic1.2.7" class="ltx_p"><span id="A7.SS5.SSS1.p4.pic1.2.7.1" class="ltx_text" style="--ltx-fg-color:#000000;">- Criticism aimed at the quality of content, organizations, or systems, rather than an individual or protected group.</span></span>
<span id="A7.SS5.SSS1.p4.pic1.2.8" class="ltx_p"><span id="A7.SS5.SSS1.p4.pic1.2.8.1" class="ltx_text" style="--ltx-fg-color:#000000;">C4: Mild or Isolated Admonitions.</span></span>
<span id="A7.SS5.SSS1.p4.pic1.2.9" class="ltx_p"><span id="A7.SS5.SSS1.p4.pic1.2.9.1" class="ltx_text" style="--ltx-fg-color:#000000;">- Brief, non-profane put-downs or sarcastic labels not tied to protected classes, and not part of sustained abuse.</span></span>
<span id="A7.SS5.SSS1.p4.pic1.2.10" class="ltx_p"><span id="A7.SS5.SSS1.p4.pic1.2.10.1" class="ltx_text" style="--ltx-fg-color:#000000;">C5: Administrative Warnings without threats.</span></span>
<span id="A7.SS5.SSS1.p4.pic1.2.11" class="ltx_p"><span id="A7.SS5.SSS1.p4.pic1.2.11.1" class="ltx_text" style="--ltx-fg-color:#000000;">- Procedural or rule-enforcement notices that do not express intent to harm, intimidate, or demean.</span></span>
<span id="A7.SS5.SSS1.p4.pic1.2.12" class="ltx_p"><span id="A7.SS5.SSS1.p4.pic1.2.12.1" class="ltx_text" style="--ltx-fg-color:#000000;">C6: Emotional or Explanatory Statements.</span></span>
<span id="A7.SS5.SSS1.p4.pic1.2.13" class="ltx_p"><span id="A7.SS5.SSS1.p4.pic1.2.13.1" class="ltx_text" style="--ltx-fg-color:#000000;">- Expressions of frustration, disbelief, or explanations of one’s own actions, without personal attacks or protected-class targeting.</span></span>
<span id="A7.SS5.SSS1.p4.pic1.2.14" class="ltx_p"><span id="A7.SS5.SSS1.p4.pic1.2.14.1" class="ltx_text" style="--ltx-fg-color:#000000;">&lt;END SAFE CONTENT CATEGORIES&gt;</span></span>
</span></span></span></foreignobject></g></g></svg>