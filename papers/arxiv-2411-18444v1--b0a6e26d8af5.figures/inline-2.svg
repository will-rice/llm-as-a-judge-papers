<svg id="A1.F3.pic1" class="ltx_picture" height="420.57" overflow="visible" version="1.1" viewbox="0 0 653.15 420.57" width="653.15"><g style="--ltx-stroke-color:#000000;--ltx-fill-color:#000000;" fill="#000000" stroke="#000000" stroke-width="0.4pt" transform="translate(0,420.57) matrix(1 0 0 -1 0 0) translate(-1.49,0)"><g style="--ltx-fill-color:#000000;" fill="#000000" fill-opacity="1.0"><path style="stroke:none" d="M 0 5.91 L 0 402.52 C 0 405.78 2.64 408.43 5.91 408.43 L 650.23 408.43 C 653.49 408.43 656.13 405.78 656.13 402.52 L 656.13 5.91 C 656.13 2.64 653.49 0 650.23 0 L 5.91 0 C 2.64 0 0 2.64 0 5.91 Z" /></g><g style="--ltx-fill-color:#FFFFFF;" fill="#FFFFFF" fill-opacity="1.0"><path style="stroke:none" d="M 1.97 5.91 L 1.97 402.52 C 1.97 404.7 3.73 406.46 5.91 406.46 L 650.23 406.46 C 652.4 406.46 654.16 404.7 654.16 402.52 L 654.16 5.91 C 654.16 3.73 652.4 1.97 650.23 1.97 L 5.91 1.97 C 3.73 1.97 1.97 3.73 1.97 5.91 Z" /></g><g transform="matrix(1.0 0.0 0.0 1.0 15 398.43)"><g style="--ltx-stroke-color:#000000;--ltx-fill-color:#000000;" class="ltx_nestedsvg" fill="#000000" stroke="#000000" stroke-width="0.4pt" transform="matrix(1 0 0 1 0 0)"><g style="--ltx-fill-color:#FFFFFF;" fill="#FFFFFF" fill-opacity="1.0"><path style="stroke:none" d="M 0 2.95 L 0 19.19 C 0 20.82 1.32 22.14 2.95 22.14 L 352.22 22.14 C 353.85 22.14 355.17 20.82 355.17 19.19 L 355.17 2.95 C 355.17 1.32 353.85 0 352.22 0 L 2.95 0 C 1.32 0 0 1.32 0 2.95 Z" /></g><g style="--ltx-fill-color:#000000;" fill="#000000" fill-opacity="1.0"><path style="stroke:none" d="M 0 2.95 L 0 19.19 C 0 20.82 1.32 22.14 2.95 22.14 L 352.22 22.14 C 353.85 22.14 355.17 20.82 355.17 19.19 L 355.17 2.95 C 355.17 1.32 353.85 0 352.22 0 L 2.95 0 C 1.32 0 0 1.32 0 2.95 Z" /></g><g fill-opacity="1.0" transform="matrix(1.0 0.0 0.0 1.0 11.81 7.61)"><foreignobject style="--ltx-fo-width:24.07em;--ltx-fo-height:0.69em;--ltx-fo-depth:0.19em;font-size:10pt;" height="12.3" overflow="visible" transform="matrix(1 0 0 -1 0 9.61)" width="333.09"><span class="ltx_foreignobject_container"><span class="ltx_foreignobject_content"><span id="A1.F3.pic1.1" class="ltx_text" style="--ltx-fg-color:#FFFFFF;">Step 1: Error Instance Identification Prompt Template</span></span></span></foreignobject></g></g></g><g fill-opacity="1.0" transform="matrix(1.0 0.0 0.0 1.0 21.65 379.08)"><foreignobject style="--ltx-fo-width:44.29em;--ltx-fo-height:0.69em;--ltx-fo-depth:26.4em;font-size:10pt;" height="374.91" overflow="visible" transform="matrix(1 0 0 -1 0 9.61)" width="612.85"><span class="ltx_foreignobject_container"><span class="ltx_foreignobject_content">
<span id="A1.F3.pic1.2" class="ltx_inline-block ltx_minipage" style="width:44.29em;">
<span id="A1.F3.pic1.2.1" class="ltx_p ltx_parbox ltx_align_top" style="width:442.9pt;"><span id="A1.F3.pic1.2.1.1" class="ltx_text" style="--ltx-fg-color:#000000;">Step 1 is to collect possible error instances.
</span>
<br class="ltx_break"><span id="A1.F3.pic1.2.1.2" class="ltx_text" style="--ltx-fg-color:#000000;">Read the following criteria carefully: *** criteria: self.criteria[criteria] ***.
</span>
<br class="ltx_break"><span id="A1.F3.pic1.2.1.3" class="ltx_text" style="--ltx-fg-color:#000000;">Next, read the summary: ** data[’summary’] **.
</span>
<br class="ltx_break"><span id="A1.F3.pic1.2.1.4" class="ltx_text" style="--ltx-fg-color:#000000;">Also, consider the original meeting transcript: * data[’transcript’] *. </span>
<br class="ltx_break">
<br class="ltx_break"><span id="A1.F3.pic1.2.1.5" class="ltx_text" style="--ltx-fg-color:#000000;">Now, read the summary again and write down a list of instances where this error type could occur. This can contain instances that already show the error or instances that could potentially show the error.
For every instance, write down a short reasoning thinking step-by-step why this instance could be an error.
Also, for every instance, provide a score from 0 (totally unsure) to 100 (totally sure) to show how certain you are that this instance could be an error.
Ensure that each instance is provided in strict JSON format, using double quotes for keys and values, and no additional text outside the JSON structure.
Return your answer only in the following format:</span>
<br class="ltx_break">
<br class="ltx_break"><span id="A1.F3.pic1.2.1.6" class="ltx_text" style="--ltx-fg-color:#000000;">[ {’instance’: ’&lt;text passage or sentence or words from summary&gt;’, ’reasoning’ : ’&lt;chain-of-thought reasoning&gt;’, ’certainty’: ’&lt;score from 0 meaning totally unsure to 100 meaning totally sure&gt;’}, {&lt;same for instance 2&gt;}, … {&lt;same for instance n&gt;}]</span>
<br class="ltx_break">
<br class="ltx_break"><span id="A1.F3.pic1.2.1.7" class="ltx_text" style="--ltx-fg-color:#000000;">Ensure that the format strictly follows valid JSON, with no extra preambles or additional information.</span></span>
</span></span></span></foreignobject></g></g></svg>