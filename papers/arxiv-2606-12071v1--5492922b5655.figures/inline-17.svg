<svg id="S6.SS2.SSS0.Px4.p4.pic1" class="ltx_picture" height="324.9" overflow="visible" version="1.1" viewbox="0 0 650 324.9" width="650"><g style="--ltx-stroke-color:#000000;--ltx-fill-color:#000000;" fill="#000000" stroke="#000000" stroke-width="0.4pt" transform="translate(0,324.9) matrix(1 0 0 -1 0 0)"><g style="--ltx-fill-color:#999900;" fill="#999900" fill-opacity="1.0"><path style="stroke:none" d="M 0 5.91 L 0 319 C 0 322.26 2.64 324.9 5.91 324.9 L 644.09 324.9 C 647.36 324.9 650 322.26 650 319 L 650 5.91 C 650 2.64 647.36 0 644.09 0 L 5.91 0 C 2.64 0 0 2.64 0 5.91 Z" /></g><g style="--ltx-fill-color:#FCFCF7;" fill="#FCFCF7" fill-opacity="1.0"><path style="stroke:none" d="M 1.97 5.91 L 1.97 300.79 L 648.03 300.79 L 648.03 5.91 C 648.03 3.73 646.27 1.97 644.09 1.97 L 5.91 1.97 C 3.73 1.97 1.97 3.73 1.97 5.91 Z" /></g><g fill-opacity="1.0" transform="matrix(1.0 0.0 0.0 1.0 21.65 309.39)"><foreignobject style="--ltx-fo-width:38.13em;--ltx-fo-height:0.69em;--ltx-fo-depth:0.19em;font-size:10pt;" height="12.3" overflow="visible" transform="matrix(1 0 0 -1 0 9.61)" width="527.61"><span class="ltx_foreignobject_container"><span class="ltx_foreignobject_content">
<span id="S6.SS2.SSS0.Px4.p4.pic1.1" class="ltx_inline-block ltx_minipage ltx_align_bottom" style="width:38.13em;">
<span id="S6.SS2.SSS0.Px4.p4.pic1.1.1" class="ltx_p"><span id="S6.SS2.SSS0.Px4.p4.pic1.1.1.1" class="ltx_text ltx_font_bold" style="--ltx-fg-color:#FFFFFF;">Key Finding: Evaluation Reliability</span></span>
</span></span></span></foreignobject></g><g fill-opacity="1.0" transform="matrix(1.0 0.0 0.0 1.0 21.65 66.28)"><foreignobject style="--ltx-fo-width:43.85em;--ltx-fo-height:16.09em;--ltx-fo-depth:3.79em;font-size:10pt;" height="275.21" overflow="visible" transform="matrix(1 0 0 -1 0 222.7)" width="606.76"><span class="ltx_foreignobject_container"><span class="ltx_foreignobject_content">
<span id="S6.SS2.SSS0.Px4.p4.pic1.2" class="ltx_inline-block ltx_minipage ltx_align_bottom" style="width:43.85em;">
<span id="S6.SS2.SSS0.Px4.p4.pic1.2.1" class="ltx_p"><span id="S6.SS2.SSS0.Px4.p4.pic1.2.1.1" class="ltx_text ltx_font_bold" style="--ltx-fg-color:#000000;">Question:<span id="S6.SS2.SSS0.Px4.p4.pic1.2.1.1.1" class="ltx_text ltx_font_medium"> How reliable is the LLM-as-a-judge paradigm for RQ generation as compared to human judgments?</span></span></span><span class="ltx_rule" style="width:100%;height:1px;--ltx-fg-color:#000000;--ltx-bg-color:#000000;display:inline-block;"> </span>
<span id="S6.SS2.SSS0.Px4.p4.pic1.2.2" class="ltx_p"><span id="S6.SS2.SSS0.Px4.p4.pic1.2.2.1" class="ltx_text ltx_font_bold" style="--ltx-fg-color:#000000;">Answer:<span id="S6.SS2.SSS0.Px4.p4.pic1.2.2.1.1" class="ltx_text ltx_font_medium"> To verify whether the high novelty scores assigned by LLM judges to model-generated RQs were reliable, we conducted a human expert evaluation. We then ran an expert study on 50 samples, specifically assessing the critical </span>non-obviousness<span id="S6.SS2.SSS0.Px4.p4.pic1.2.2.1.2" class="ltx_text ltx_font_medium"> dimension. Table <a href="#S6.T5.st1" title="Table 5(a) ‣ Table 5 ‣ Comparative Scoring. ‣ 6.2 Results and Discussions ‣ 6 Experiments ‣ On the Limits of LLM-as-Judge for Scientific Novelty Assessment" class="ltx_ref"><span class="ltx_text ltx_ref_tag">5(a)</span></a> and Table <a href="#S6.T5.st2" title="Table 5(b) ‣ Table 5 ‣ Comparative Scoring. ‣ 6.2 Results and Discussions ‣ 6 Experiments ‣ On the Limits of LLM-as-Judge for Scientific Novelty Assessment" class="ltx_ref"><span class="ltx_text ltx_ref_tag">5(b)</span></a> show a strong gap between human experts and LLM judges. Human experts preferred the author-anchored GT RQs. LLM judges preferred the best-of-five <span id="S6.SS2.SSS0.Px4.p4.pic1.2.2.1.2.1" class="ltx_text ltx_font_typewriter">gpt-5.5</span> RQs. </span>Experts noted that many <span id="S6.SS2.SSS0.Px4.p4.pic1.2.2.1.3" class="ltx_text ltx_font_typewriter">gpt-5.5</span> RQs identify gaps, but still lack originality, non-obviousness, and broader scientific scope. This raises concerns about using current LLMs as judges for RQ novelty.<span id="S6.SS2.SSS0.Px4.p4.pic1.2.2.1.4" class="ltx_text"></span></span></span>
</span></span></span></foreignobject></g></g></svg>