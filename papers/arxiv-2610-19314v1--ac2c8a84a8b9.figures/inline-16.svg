<svg id="A6.SS2.p3.pic1" class="ltx_picture" height="524.05" overflow="visible" version="1.1" viewbox="0 0 653.15 524.05" width="653.15"><g style="--ltx-stroke-color:#000000;--ltx-fill-color:#000000;" fill="#000000" stroke="#000000" stroke-width="0.4pt" transform="translate(0,524.05) matrix(1 0 0 -1 0 0)"><g style="--ltx-fill-color:#737373;" fill="#737373" fill-opacity="1.0"><path style="stroke:none" d="M 0 2.08 L 0 521.97 C 0 523.12 0.93 524.05 2.08 524.05 L 651.07 524.05 C 652.22 524.05 653.15 523.12 653.15 521.97 L 653.15 2.08 C 653.15 0.93 652.22 0 651.07 0 L 2.08 0 C 0.93 0 0 0.93 0 2.08 Z" /></g><g style="--ltx-fill-color:#FAFAFA;" fill="#FAFAFA" fill-opacity="1.0"><path style="stroke:none" d="M 0.69 2.08 L 0.69 502.49 L 652.46 502.49 L 652.46 2.08 C 652.46 1.31 651.84 0.69 651.07 0.69 L 2.08 0.69 C 1.31 0.69 0.69 1.31 0.69 2.08 Z" /></g><g style="--ltx-fill-color:#595959;" fill="#595959" fill-opacity="1.0"><path style="stroke:none" d="M 0.69 503.18 L 0.69 521.97 C 0.69 522.74 1.31 523.36 2.08 523.36 L 651.07 523.36 C 651.84 523.36 652.46 522.74 652.46 521.97 L 652.46 503.18 Z" /></g><g fill-opacity="1.0" transform="matrix(1.0 0.0 0.0 1.0 11.55 509.81)"><foreignobject style="--ltx-fo-width:39.59em;--ltx-fo-height:0.69em;--ltx-fo-depth:0.19em;font-size:10pt;" height="12.3" overflow="visible" transform="matrix(1 0 0 -1 0 9.61)" width="547.81"><span class="ltx_foreignobject_container"><span class="ltx_foreignobject_content">
<span id="A6.SS2.p3.pic1.1" class="ltx_inline-block ltx_minipage ltx_align_bottom" style="width:39.59em;">
<span id="A6.SS2.p3.pic1.1.1" class="ltx_p"><span id="A6.SS2.p3.pic1.1.1.1" class="ltx_text ltx_font_bold" style="--ltx-fg-color:#FFFFFF;">Prompt 11  Evidence-first evaluation</span></span>
</span></span></span></foreignobject></g><g fill-opacity="1.0" transform="matrix(1.0 0.0 0.0 1.0 11.55 13.62)"><foreignobject style="--ltx-fo-width:45.53em;--ltx-fo-height:34.65em;--ltx-fo-depth:0.25em;font-size:10pt;" height="482.86" overflow="visible" transform="matrix(1 0 0 -1 0 479.4)" width="630.01"><span class="ltx_foreignobject_container"><span class="ltx_foreignobject_content">
<span id="A6.SS2.p3.pic1.2" class="ltx_inline-block ltx_minipage ltx_align_bottom" style="width:45.53em;">
<span id="A6.SS2.p3.pic1.2.1" class="ltx_p"><span id="A6.SS2.p3.pic1.2.1.1" class="ltx_text ltx_font_bold" style="--ltx-fg-color:#000000;">Purpose:<span id="A6.SS2.p3.pic1.2.1.1.1" class="ltx_text ltx_font_medium"> two-stage elicitation: extract candidate states first, then judge against the extraction</span></span></span>
<span id="A6.SS2.p3.pic1.2.2" class="ltx_p"><span id="A6.SS2.p3.pic1.2.2.1" class="ltx_text ltx_font_bold" style="--ltx-fg-color:#000000;">Input:<span id="A6.SS2.p3.pic1.2.2.1.1" class="ltx_text ltx_font_medium"> stage 1: context and request; stage 2: extracted evidence, request, and response</span></span></span>
<span id="A6.SS2.p3.pic1.2.3" class="ltx_p"><span id="A6.SS2.p3.pic1.2.3.1" class="ltx_text ltx_font_bold" style="--ltx-fg-color:#000000;">Output:<span id="A6.SS2.p3.pic1.2.3.1.1" class="ltx_text ltx_font_medium"> stage 2 emits the same JSON contract as Prompt <a href="#A6.SS2" title="F.2 Evaluation Formulations ‣ Appendix F Prompt System ‣ PersEvalBench: Can LLM Evaluators Judge Contextually Appropriate Use of Persona Information?" class="ltx_ref"><span class="ltx_text ltx_ref_tag">F.2</span></a></span></span></span>
<span id="A6.SS2.p3.pic1.2.4" class="ltx_p"><span id="A6.SS2.p3.pic1.2.4.1" class="ltx_text ltx_font_bold" style="--ltx-fg-color:#000000;">Stage 1: evidence extraction<span id="A6.SS2.p3.pic1.2.4.1.1" class="ltx_text ltx_font_medium"> — <span id="A6.SS2.p3.pic1.2.4.1.1.1" class="ltx_text ltx_font_italic">surfaces candidate states with provenance and currency</span></span></span></span><span class="ltx_rule" style="width:100%;height:0.3pt;--ltx-fg-color:#999999;--ltx-bg-color:#999999;display:inline-block;"> </span>
<span id="A6.SS2.p3.pic1.2.5" class="ltx_p ltx_align_left"><span id="A6.SS2.p3.pic1.2.5.1" class="ltx_text ltx_font_typewriter" style="--ltx-fg-color:#000000;">Extract all user preferences, constraints, and states from this conversation context that are relevant to the user’s current request.</span></span>
<span id="A6.SS2.p3.pic1.2.6" class="ltx_p ltx_align_left"><span id="A6.SS2.p3.pic1.2.6.1" class="ltx_text ltx_font_typewriter" style="--ltx-fg-color:#000000;">Conversation context: {context}</span></span>
<span id="A6.SS2.p3.pic1.2.7" class="ltx_p ltx_align_left"><span id="A6.SS2.p3.pic1.2.7.1" class="ltx_text ltx_font_typewriter" style="--ltx-fg-color:#000000;">User’s current request: {user_request}</span></span>
<span id="A6.SS2.p3.pic1.2.8" class="ltx_p ltx_align_left"><span id="A6.SS2.p3.pic1.2.8.1" class="ltx_text ltx_font_typewriter" style="--ltx-fg-color:#000000;">List each preference, constraint, or state that could be relevant to answering the user’s request. For each, note: what the preference/state is; which turn it was expressed in; whether it is still current or potentially stale/superseded.</span></span>
<span id="A6.SS2.p3.pic1.2.9" class="ltx_p ltx_align_left"><span id="A6.SS2.p3.pic1.2.9.1" class="ltx_text ltx_font_typewriter" style="--ltx-fg-color:#000000;">Respond with a structured list of extracted evidence.</span></span>
<span id="A6.SS2.p3.pic1.2.10" class="ltx_p"><span id="A6.SS2.p3.pic1.2.10.1" class="ltx_text ltx_font_bold" style="--ltx-fg-color:#000000;">Stage 2: judgment<span id="A6.SS2.p3.pic1.2.10.1.1" class="ltx_text ltx_font_medium"> — <span id="A6.SS2.p3.pic1.2.10.1.1.1" class="ltx_text ltx_font_italic">same taxonomy, disambiguation rule, and output contract as Prompt <a href="#A6.SS2" title="F.2 Evaluation Formulations ‣ Appendix F Prompt System ‣ PersEvalBench: Can LLM Evaluators Judge Contextually Appropriate Use of Persona Information?" class="ltx_ref"><span class="ltx_text ltx_ref_tag">F.2</span></a>, applied to the extracted evidence</span></span></span></span><span class="ltx_rule" style="width:100%;height:0.3pt;--ltx-fg-color:#999999;--ltx-bg-color:#999999;display:inline-block;"> </span>
<span id="A6.SS2.p3.pic1.2.11" class="ltx_p ltx_align_left"><span id="A6.SS2.p3.pic1.2.11.1" class="ltx_text ltx_font_typewriter" style="--ltx-fg-color:#000000;">Given the extracted evidence below, evaluate whether the assistant response correctly uses these preferences, constraints, and states.</span></span>
<span id="A6.SS2.p3.pic1.2.12" class="ltx_p ltx_align_left"><span id="A6.SS2.p3.pic1.2.12.1" class="ltx_text ltx_font_typewriter" style="--ltx-fg-color:#000000;">Extracted evidence: {evidence}</span></span>
<span id="A6.SS2.p3.pic1.2.13" class="ltx_p ltx_align_left"><span id="A6.SS2.p3.pic1.2.13.1" class="ltx_text ltx_font_typewriter" style="--ltx-fg-color:#000000;">User request: {user_request}</span></span>
<span id="A6.SS2.p3.pic1.2.14" class="ltx_p ltx_align_left"><span id="A6.SS2.p3.pic1.2.14.1" class="ltx_text ltx_font_typewriter" style="--ltx-fg-color:#000000;">Assistant response: {response}</span></span>
<span id="A6.SS2.p3.pic1.2.15" class="ltx_p ltx_align_left"><span id="A6.SS2.p3.pic1.2.15.1" class="ltx_text ltx_font_typewriter" style="--ltx-fg-color:#000000;">[Verdict taxonomy, disambiguation rule, and JSON output contract identical to Prompt <a href="#A6.SS2" title="F.2 Evaluation Formulations ‣ Appendix F Prompt System ‣ PersEvalBench: Can LLM Evaluators Judge Contextually Appropriate Use of Persona Information?" class="ltx_ref"><span class="ltx_text ltx_ref_tag">F.2</span></a>.]</span></span>
</span></span></span></foreignobject></g></g></svg>