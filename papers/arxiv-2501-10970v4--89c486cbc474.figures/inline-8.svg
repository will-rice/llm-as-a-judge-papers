<span id="A8.p8.pic1.2.1" class="ltx_p"><span id="A8.p8.pic1.2.1.1" class="ltx_text" style="--ltx-fg-color:#000000;">You will be provided with a restaurant review.
<br class="ltx_break">Your task is to analyze the review and determine the sentiment for the following four aspects: food, service, ambiance, and noise, as well as the number of stars (1-5).
<br class="ltx_break">The sentiment for each aspect can only be: ’Positive’, ’Negative’, or ’unknown’.
<br class="ltx_break">The number of stars must be 1, 2, 3, 4, or 5.
<br class="ltx_break">
<br class="ltx_break">Please follow the JSON format below:
<br class="ltx_break">```json 
<br class="ltx_break">{
<br class="ltx_break"><span id="A8.p8.pic1.2.1.1.1" class="ltx_text"></span> &quot;food&quot;: &quot;Positive/Negative/unknown&quot;,
<br class="ltx_break"><span id="A8.p8.pic1.2.1.1.2" class="ltx_text"></span> &quot;service&quot;: &quot;Positive/Negative/unknown&quot;,
<br class="ltx_break"><span id="A8.p8.pic1.2.1.1.3" class="ltx_text"></span> &quot;ambiance&quot;: &quot;Positive/Negative/unknown&quot;,
<br class="ltx_break"><span id="A8.p8.pic1.2.1.1.4" class="ltx_text"></span> &quot;noise&quot;: &quot;Positive/Negative/unknown&quot;,
<br class="ltx_break"><span id="A8.p8.pic1.2.1.1.5" class="ltx_text"></span> &quot;stars&quot;: int
<br class="ltx_break">}
<br class="ltx_break">```
<br class="ltx_break">
<br class="ltx_break">** Review **
<br class="ltx_break">[REVIEW]</span></span>
