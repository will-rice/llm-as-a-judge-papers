<span id="A1.SS5.SSS1.p13.pic1.1" class="ltx_inline-block ltx_minipage ltx_align_bottom" style="width:32.57em;">
<span id="A1.SS5.SSS1.p13.pic1.1.1" class="ltx_p"><span id="A1.SS5.SSS1.p13.pic1.1.1.1" class="ltx_text ltx_font_bold" style="--ltx-fg-color:#FFFFFF;">Evaluator constraint definitions for generated complex policies</span></span>
</span></span></span></foreignobject></g><g fill-opacity="1.0" transform="matrix(1.0 0.0 0.0 1.0 15.84 15.76)"><foreignobject style="--ltx-fo-width:37.46em;--ltx-fo-height:19.89em;--ltx-fo-depth:0.19em;font-size:10pt;" height="277.97" overflow="visible" transform="matrix(1 0 0 -1 0 275.28)" width="518.34"><span class="ltx_foreignobject_container"><span class="ltx_foreignobject_content">
<span id="A1.SS5.SSS1.p13.pic1.2" class="ltx_inline-block ltx_minipage ltx_align_bottom" style="width:37.46em;">
<span id="A1.SS5.SSS1.p13.pic1.2.1" class="ltx_p"><span id="A1.SS5.SSS1.p13.pic1.2.1.1" class="ltx_text ltx_font_bold" style="--ltx-fg-color:#000000;">Scope Relevance:<span id="A1.SS5.SSS1.p13.pic1.2.1.1.1" class="ltx_text ltx_font_medium"> Carefully consider Input Label, Identified Scopes, and Generated Description, and ascertain if Generated Description adequately reflects and covers the list of scopes in Identified Scopes.
<br class="ltx_break" style="--ltx-break-space:4.0pt;">
</span>Description Tone:<span id="A1.SS5.SSS1.p13.pic1.2.1.1.2" class="ltx_text ltx_font_medium"> Determine if the tone of Generated Description is imperative, and it can be used as a guideline to determine whether a text input is in compliance or violation of Input Label according to Generated Description.
<br class="ltx_break" style="--ltx-break-space:4.0pt;">
</span>Complexity:<span id="A1.SS5.SSS1.p13.pic1.2.1.1.3" class="ltx_text ltx_font_medium"> Determine if Generated Description is genuinely complex and nuanced. A complex description must satisfy at least two of the following: (1) it includes conditional logic, exceptions, or explicit carve-outs that distinguish permitted from disallowed content; (2) it addresses non-obvious, indirect, or context-dependent manifestations of the label rather than only the most obvious violations; (3) it uses precise qualifying language that would require non-trivial reasoning to apply, rather than simple keyword matching. A description that lists only obvious violations or uses generic blanket prohibitions without any nuance must receive a low score.</span></span></span>
</span></span></span></foreignobject></g></g></svg>