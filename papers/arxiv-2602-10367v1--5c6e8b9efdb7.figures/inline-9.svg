<span id="A2.I16.i5.p1.1" class="ltx_p"><span id="A2.I16.i5.p1.1.1" class="ltx_text ltx_font_typewriter ltx_font_bold" style="font-size:90%;--ltx-fg-color:#000000;">Evidence:</span><span id="A2.I16.i5.p1.1.2" class="ltx_text ltx_font_typewriter" style="font-size:90%;--ltx-fg-color:#000000;"> Quote the specific sentence from the model output that supports your decision.
</span></span>
</span></span>
