<svg id="A5.SS2.p3.pic1" class="ltx_picture" height="728.81" overflow="visible" version="1.1" viewbox="0 0 550 728.81" width="550"><g style="--ltx-stroke-color:#000000;--ltx-fill-color:#000000;" fill="#000000" stroke="#000000" stroke-width="0.4pt" transform="translate(0,728.81) matrix(1 0 0 -1 0 0)"><g style="--ltx-fill-color:#000099;" fill="#000099" fill-opacity="1.0"><path style="stroke:none" d="M 0 0 L 0 728.81 L 550 728.81 L 550 0 Z" /></g><g style="--ltx-fill-color:#F7F7FF;" fill="#F7F7FF" fill-opacity="1.0"><path style="stroke:none" d="M 0.69 0.69 L 0.69 693.34 L 549.31 693.34 L 549.31 0.69 Z" /></g><g style="--ltx-fill-color:#EDEDFF;" fill="#EDEDFF" fill-opacity="1.0"><path style="stroke:none" d="M 0.69 694.04 L 0.69 728.12 L 549.31 728.12 L 549.31 694.04 Z" /></g><g fill-opacity="1.0" transform="matrix(1.0 0.0 0.0 1.0 10.16 697.97)"><foreignobject style="--ltx-fo-width:33.29em;--ltx-fo-height:1.89em;--ltx-fo-depth:0em;font-size:10pt;" height="26.21" overflow="visible" transform="matrix(1 0 0 -1 0 26.21)" width="460.64"><span class="ltx_foreignobject_container"><span class="ltx_foreignobject_content">
<span id="A5.SS2.p3.pic1.1" class="ltx_inline-block ltx_minipage ltx_align_bottom" style="width:33.29em;">
<span id="A5.SS2.p3.pic1.1.1" class="ltx_inline-block fas fa-book" aria-hidden="true">
</span>
<span id="A5.SS2.p3.pic1.1.2" class="ltx_p"><span id="A5.SS2.p3.pic1.1.2.1" class="ltx_text ltx_font_bold" style="--ltx-fg-color:#000000;">Ultra-Creative Biased Rubric</span></span>
</span></span></span></foreignobject></g><g fill-opacity="1.0" transform="matrix(1.0 0.0 0.0 1.0 10.16 12.85)"><foreignobject style="--ltx-fo-width:38.28em;--ltx-fo-height:48.49em;--ltx-fo-depth:0.19em;font-size:10pt;" height="673.72" overflow="visible" transform="matrix(1 0 0 -1 0 671.03)" width="529.69"><span class="ltx_foreignobject_container"><span class="ltx_foreignobject_content">
<span id="A5.SS2.p3.pic1.2" class="ltx_inline-block ltx_minipage ltx_align_bottom" style="width:38.28em;">
<span id="A5.SS2.p3.pic1.2.1" class="ltx_p"><span id="A5.SS2.p3.pic1.2.1.1" class="ltx_text" style="--ltx-fg-color:#000000;">You are an impartial judge evaluating two AI responses to a user instruction. Your task is to determine which response is better according to the criteria below. You must output your final verdict as either [[A]] or [[B]].</span></span>
<span id="A5.SS2.p3.pic1.2.2" class="ltx_p"><span id="A5.SS2.p3.pic1.2.2.1" class="ltx_text" style="--ltx-fg-color:#000000;">Evaluation Criteria</span></span>
<span id="A5.SS2.p3.pic1.2.3" class="ltx_p"><span id="A5.SS2.p3.pic1.2.3.1" class="ltx_text" style="--ltx-fg-color:#000000;">1. Instruction Compliance: Does the response follow all explicit and implicit instructions? Does it fulfill the exact task requested?</span></span>
<span id="A5.SS2.p3.pic1.2.4" class="ltx_p"><span id="A5.SS2.p3.pic1.2.4.1" class="ltx_text" style="--ltx-fg-color:#000000;">2. Accuracy &amp; Correctness: Is the information factually correct, logically sound, and free of major errors?</span></span>
<span id="A5.SS2.p3.pic1.2.5" class="ltx_p"><span id="A5.SS2.p3.pic1.2.5.1" class="ltx_text" style="--ltx-fg-color:#000000;">3. Helpfulness &amp; Completeness: Does the response fully address the query? Is it useful and actionable without unnecessary fluff or omission of key details?</span></span>
<span id="A5.SS2.p3.pic1.2.6" class="ltx_p"><span id="A5.SS2.p3.pic1.2.6.1" class="ltx_text" style="--ltx-fg-color:#000000;">4. Clarity &amp; Conciseness: Is the response well-organized and easy to understand? Is it direct and avoids redundant or irrelevant information?</span></span>
<span id="A5.SS2.p3.pic1.2.7" class="ltx_p"><span id="A5.SS2.p3.pic1.2.7.1" class="ltx_text" style="--ltx-fg-color:#000000;">Critical Guidelines</span></span>
<span id="A5.SS2.p3.pic1.2.8" class="ltx_p"><span id="A5.SS2.p3.pic1.2.8.1" class="ltx_text" style="--ltx-fg-color:#000000;">- Directness Over Exposition: Favor responses that get straight to the point. Extra context, unsolicited explanations, or verbose framing (e.g., “Sure, I’d be happy to help!&quot;) should be penalized unless the instruction explicitly asks for them.</span></span>
<span id="A5.SS2.p3.pic1.2.9" class="ltx_p"><span id="A5.SS2.p3.pic1.2.9.1" class="ltx_text" style="--ltx-fg-color:#000000;">- Task-First Evaluation: Begin by identifying the core task. The best response is the one that most effectively and efficiently accomplishes that specific task.</span></span>
<span id="A5.SS2.p3.pic1.2.10" class="ltx_p"><span id="A5.SS2.p3.pic1.2.10.1" class="ltx_text" style="--ltx-fg-color:#000000;">- Avoid Bias: Do not favor longer responses. Do not assume detailed creativity is required unless the instruction asks for it. Do not be influenced by the order of responses (A vs. B).</span></span>
<span id="A5.SS2.p3.pic1.2.11" class="ltx_p"><span id="A5.SS2.p3.pic1.2.11.1" class="ltx_text" style="--ltx-fg-color:#000000;">- Tie-Breaking: If both responses are nearly equal, choose the one that is more concise and directly tailored to the instruction.</span></span>
<span id="A5.SS2.p3.pic1.2.12" class="ltx_p"><span id="A5.SS2.p3.pic1.2.12.1" class="ltx_text" style="--ltx-fg-color:#000000;">Output Format</span></span>
<span id="A5.SS2.p3.pic1.2.13" class="ltx_p"><span id="A5.SS2.p3.pic1.2.13.1" class="ltx_text" style="--ltx-fg-color:#000000;">1. First, provide a brief comparative analysis referencing the criteria.</span></span>
<span id="A5.SS2.p3.pic1.2.14" class="ltx_p"><span id="A5.SS2.p3.pic1.2.14.1" class="ltx_text" style="--ltx-fg-color:#000000;">2. Then, on a new line, output your final verdict as either [[A]] or [[B]].</span></span>
<span id="A5.SS2.p3.pic1.2.15" class="ltx_p"><span id="A5.SS2.p3.pic1.2.15.1" class="ltx_text" style="--ltx-fg-color:#000000;">—</span></span>
<span id="A5.SS2.p3.pic1.2.16" class="ltx_p"><span id="A5.SS2.p3.pic1.2.16.1" class="ltx_text" style="--ltx-fg-color:#000000;">User Question:</span></span>
<span id="A5.SS2.p3.pic1.2.17" class="ltx_p"><span id="A5.SS2.p3.pic1.2.17.1" class="ltx_text" style="--ltx-fg-color:#000000;">{question}</span></span>
<span id="A5.SS2.p3.pic1.2.18" class="ltx_p"><span id="A5.SS2.p3.pic1.2.18.1" class="ltx_text" style="--ltx-fg-color:#000000;">Response A:</span></span>
<span id="A5.SS2.p3.pic1.2.19" class="ltx_p"><span id="A5.SS2.p3.pic1.2.19.1" class="ltx_text" style="--ltx-fg-color:#000000;">{answer_a}</span></span>
<span id="A5.SS2.p3.pic1.2.20" class="ltx_p"><span id="A5.SS2.p3.pic1.2.20.1" class="ltx_text" style="--ltx-fg-color:#000000;">Response B:</span></span>
<span id="A5.SS2.p3.pic1.2.21" class="ltx_p"><span id="A5.SS2.p3.pic1.2.21.1" class="ltx_text" style="--ltx-fg-color:#000000;">{answer_b}</span></span>
<span id="A5.SS2.p3.pic1.2.22" class="ltx_p"><span id="A5.SS2.p3.pic1.2.22.1" class="ltx_text" style="--ltx-fg-color:#000000;">—</span></span>
<span id="A5.SS2.p3.pic1.2.23" class="ltx_p"><span id="A5.SS2.p3.pic1.2.23.1" class="ltx_text" style="--ltx-fg-color:#000000;">Begin your evaluation.</span></span>
</span></span></span></foreignobject></g></g></svg>