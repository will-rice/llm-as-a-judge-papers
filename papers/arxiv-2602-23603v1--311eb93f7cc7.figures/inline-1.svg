<svg id="S3.SS2.p3.pic1" class="ltx_picture" height="255.1" overflow="visible" version="1.1" viewbox="0 0 629.92 255.1" width="629.92"><g style="--ltx-stroke-color:#000000;--ltx-fill-color:#000000;" fill="#000000" stroke="#000000" stroke-width="0.4pt" transform="translate(0,255.1) matrix(1 0 0 -1 0 0)"><g style="--ltx-fill-color:#404040;" fill="#404040" fill-opacity="1.0"><path style="stroke:none" d="M 0 5.91 L 0 249.2 C 0 252.46 2.64 255.1 5.91 255.1 L 624.02 255.1 C 627.28 255.1 629.92 252.46 629.92 249.2 L 629.92 5.91 C 629.92 2.64 627.28 0 624.02 0 L 5.91 0 C 2.64 0 0 2.64 0 5.91 Z" /></g><g style="--ltx-fill-color:#F9F9F9;" fill="#F9F9F9" fill-opacity="1.0"><path style="stroke:none" d="M 1.97 5.91 L 1.97 230.99 L 627.95 230.99 L 627.95 5.91 C 627.95 3.73 626.19 1.97 624.02 1.97 L 5.91 1.97 C 3.73 1.97 1.97 3.73 1.97 5.91 Z" /></g><g fill-opacity="1.0" transform="matrix(1.0 0.0 0.0 1.0 21.65 239.59)"><foreignobject style="--ltx-fo-width:36.87em;--ltx-fo-height:0.69em;--ltx-fo-depth:0.19em;font-size:10pt;" height="12.3" overflow="visible" transform="matrix(1 0 0 -1 0 9.61)" width="510.18"><span class="ltx_foreignobject_container"><span class="ltx_foreignobject_content">
<span id="S3.SS2.p3.pic1.1" class="ltx_inline-block ltx_minipage ltx_align_bottom" style="width:36.87em;">
<span id="S3.SS2.p3.pic1.1.1" class="ltx_p"><span id="S3.SS2.p3.pic1.1.1.1" class="ltx_text ltx_font_bold" style="--ltx-fg-color:#FFFFFF;">LFQA Definition</span></span>
</span></span></span></foreignobject></g><g fill-opacity="1.0" transform="matrix(1.0 0.0 0.0 1.0 21.65 101.64)"><foreignobject style="--ltx-fo-width:42.4em;--ltx-fo-height:8.49em;--ltx-fo-depth:6.35em;font-size:10pt;" height="205.41" overflow="visible" transform="matrix(1 0 0 -1 0 117.54)" width="586.7"><span class="ltx_foreignobject_container"><span class="ltx_foreignobject_content">
<span id="S3.SS2.p3.pic1.2" class="ltx_inline-block ltx_minipage ltx_align_bottom" style="width:42.4em;">
<span id="S3.SS2.p3.pic1.2.1" class="ltx_p"><span id="S3.SS2.p3.pic1.2.1.1" class="ltx_text" style="--ltx-fg-color:#000000;">A LFQA must express a single, well-defined information need that requires a detailed, multi-sentence answer involving exposition, explanation, reasoning, exploration, or description of the process. These questions are usually complex or open-ended, often asking “why” or “how” about a process, reason, or concept in an objective manner, which means answers should be grounded in facts, reasoning, or conceptual explanation.</span></span>
<span id="S3.SS2.p3.pic1.2.2" class="ltx_p"><span id="S3.SS2.p3.pic1.2.2.1" class="ltx_text" style="--ltx-fg-color:#000000;">It must not:</span></span>
<span id="S3.I2" class="ltx_itemize">
<span id="S3.I2.i1" class="ltx_item" style="list-style-type:none;"><span class="ltx_tag ltx_tag_item">•</span> 
<span id="S3.I2.i1.p1" class="ltx_para">
<span id="S3.I2.i1.p1.1" class="ltx_p"><span id="S3.I2.i1.p1.1.1" class="ltx_text" style="--ltx-fg-color:#000000;">Combine multiple distinct or loosely related sub-questions</span></span>
</span></span>
<span id="S3.I2.i2" class="ltx_item" style="list-style-type:none;"><span class="ltx_tag ltx_tag_item">•</span> 
<span id="S3.I2.i2.p1" class="ltx_para">
<span id="S3.I2.i2.p1.1" class="ltx_p"><span id="S3.I2.i2.p1.1.1" class="ltx_text" style="--ltx-fg-color:#000000;">Request personal advice, express individual preferences, seek personal opinions, and recommendations (e.g., product, place, city, food, restaurant, flight, school, course)</span></span>
</span></span>
<span id="S3.I2.i3" class="ltx_item" style="list-style-type:none;"><span class="ltx_tag ltx_tag_item">•</span> 
<span id="S3.I2.i3.p1" class="ltx_para">
<span id="S3.I2.i3.p1.1" class="ltx_p"><span id="S3.I2.i3.p1.1.1" class="ltx_text" style="--ltx-fg-color:#000000;">Be answerable with a single fact, a yes/no response, only code generation, direct formula calculation, or creative content (e.g., poem, joke, story, music, song lyrics, image, or audio)</span></span>
</span></span>
</span>
</span></span></span></foreignobject></g></g></svg>