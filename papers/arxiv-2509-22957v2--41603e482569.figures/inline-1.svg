<span id="A5.F8.p1.pic1.2" class="ltx_inline-block ltx_minipage ltx_align_bottom" style="width:36.62em;">
<span id="A5.F8.p1.pic1.2.1" class="ltx_p"><span id="A5.F8.p1.pic1.2.1.1" class="ltx_text" style="--ltx-fg-color:#000000;">You are going to role-play as a user with the following demographic characteristics:</span></span>
<span id="A5.I3" class="ltx_itemize ltx_leftmargin_flush">
