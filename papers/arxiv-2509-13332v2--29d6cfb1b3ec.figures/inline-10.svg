<span id="A5.F12.pic1.1.1" class="ltx_p"><span id="A5.F12.pic1.1.1.1" class="ltx_text ltx_font_bold" style="--ltx-fg-color:#FFFFFF;">Rubric for MRewardBench subset: mt-bench-hard</span></span>
</span></span></span></foreignobject></g><g fill-opacity="1.0" transform="matrix(1.0 0.0 0.0 1.0 20.79 15.99)"><foreignobject style="--ltx-fo-width:31.5em;--ltx-fo-height:16.29em;--ltx-fo-depth:0.22em;font-size:10pt;" class="ltx_minipage" height="228.54" overflow="visible" transform="matrix(1 0 0 -1 0 225.47)" width="30em"><span class="ltx_foreignobject_container"><span class="ltx_foreignobject_content"><pre id="A5.F12.pic1.2" class="ltx_verbatim ltx_font_typewriter" style="--ltx-fg-color:#000000;">Pairwise judge for multi-turn dialogue (hard).
Steps:
1) Read the conversation context in the User Question and the answers
   from Assistant A and Assistant B.
2) Checks:
   - Complex constraints: satisfies layered/implicit constraints and
   formats.
   - Factual depth &amp; precision: accurate and specific; no speculation.
   - Planning/reasoning: if steps are shown, they form a coherent plan
   leading to the result.
   - State fidelity: no contradictions across turns.
   - Clarity: structured and direct.
3) Penalize: hallucinations, planning errors, constraint misses.
4) Decision: prefer Assistant A if it meets complex constraints with
   accurate content and coherent reasoning (if present); otherwise
   choose Assistant B.
5) Neutrality: ignore presentation order, assistant names, and length.

</pre></span></span></foreignobject></g></g></svg>