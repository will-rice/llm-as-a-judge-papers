</span></span></span></foreignobject></g><g fill-opacity="1.0" transform="matrix(1.0 0.0 0.0 1.0 21.65 16.85)"><foreignobject style="--ltx-fo-width:41.97em;--ltx-fo-height:37.44em;--ltx-fo-depth:0.22em;font-size:10pt;" height="521.2" overflow="visible" transform="matrix(1 0 0 -1 0 518.12)" width="580.75"><span class="ltx_foreignobject_container"><span class="ltx_foreignobject_content">
<span id="A4.SS4.p2.pic1.2" class="ltx_inline-block ltx_minipage ltx_align_bottom" style="width:41.97em;">
<span id="A4.SS4.p2.pic1.2.1" class="ltx_p"><span id="A4.SS4.p2.pic1.2.1.1" class="ltx_text ltx_font_typewriter" style="--ltx-fg-color:#000000;">### Your Task
Please evaluate a response text from CGPST (covering all six steps) based on the provided structured result (SoT output). Score the response according to the given dimensions and score ranges, and provide the results in the required format.
</span></span>
<span id="A4.SS4.p2.pic1.2.2" class="ltx_p"><span id="A4.SS4.p2.pic1.2.2.1" class="ltx_text ltx_font_typewriter" style="--ltx-fg-color:#000000;">### Future Scenario
The CGPST future scenario corresponding to the response text is as follows:
</span></span>
<span id="A4.SS4.p2.pic1.2.3" class="ltx_p"><span id="A4.SS4.p2.pic1.2.3.1" class="ltx_text ltx_font_typewriter" style="--ltx-fg-color:#000000;">{future_scenario}
</span></span>
<span id="A4.SS4.p2.pic1.2.4" class="ltx_p"><span id="A4.SS4.p2.pic1.2.4.1" class="ltx_text ltx_font_typewriter" style="--ltx-fg-color:#000000;">### SoT Structured Result
</span></span>
<span id="A4.SS4.p2.pic1.2.5" class="ltx_p"><span id="A4.SS4.p2.pic1.2.5.1" class="ltx_text ltx_font_typewriter" style="--ltx-fg-color:#000000;">{sot_output}
</span></span>
<span id="A4.SS4.p2.pic1.2.6" class="ltx_p"><span id="A4.SS4.p2.pic1.2.6.1" class="ltx_text ltx_font_typewriter" style="--ltx-fg-color:#000000;">### Introduction to the Scoring Dimensions for Each Step
</span></span>
<span id="A4.SS4.p2.pic1.2.7" class="ltx_p"><span id="A4.SS4.p2.pic1.2.7.1" class="ltx_text ltx_font_typewriter" style="--ltx-fg-color:#000000;">{score_dimensions}
</span></span>
<span id="A4.SS4.p2.pic1.2.8" class="ltx_p"><span id="A4.SS4.p2.pic1.2.8.1" class="ltx_text ltx_font_typewriter" style="--ltx-fg-color:#000000;">### Scoring Output Format
</span></span>
<span id="A4.SS4.p2.pic1.2.9" class="ltx_p"><span id="A4.SS4.p2.pic1.2.9.1" class="ltx_text ltx_font_typewriter" style="--ltx-fg-color:#000000;">{output_template}
</span></span>
<span id="A4.SS4.p2.pic1.2.10" class="ltx_p"><span id="A4.SS4.p2.pic1.2.10.1" class="ltx_text ltx_font_typewriter" style="--ltx-fg-color:#000000;">### Task Requirements
</span></span>
<span id="A4.SS4.p2.pic1.2.11" class="ltx_p"><span id="A4.SS4.p2.pic1.2.11.1" class="ltx_text ltx_font_typewriter" style="--ltx-fg-color:#000000;">1. Each dimension must be evaluated independently and strictly according to the provided scoring dimension descriptions. Do not use relative or vague standards; scores must follow the specified scoring ranges exactly.
</span></span>
<span id="A4.SS4.p2.pic1.2.12" class="ltx_p"><span id="A4.SS4.p2.pic1.2.12.1" class="ltx_text ltx_font_typewriter" style="--ltx-fg-color:#000000;">2. All scoring must be based on the provided SoT structured result.
</span></span>
<span id="A4.SS4.p2.pic1.2.13" class="ltx_p"><span id="A4.SS4.p2.pic1.2.13.1" class="ltx_text ltx_font_typewriter" style="--ltx-fg-color:#000000;">3. The output must be in strict JSON format. Field names must not be modified, and no fields may be added, removed, or omitted. Do not include any additional explanations.
</span></span>
<span id="A4.SS4.p2.pic1.2.14" class="ltx_p"><span id="A4.SS4.p2.pic1.2.14.1" class="ltx_text ltx_font_typewriter" style="--ltx-fg-color:#000000;">4. Only output numeric scores. Do not include words such as “points” or “score”.
</span></span>
</span></span></span></foreignobject></g></g></svg>