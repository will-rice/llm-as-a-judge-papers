<span id="S3.SS2.p5.pic1.1" class="ltx_inline-block ltx_minipage ltx_align_bottom" style="width:35.25em;">
<span id="S3.SS2.p5.pic1.1.1" class="ltx_p"><span id="S3.SS2.p5.pic1.1.1.1" class="ltx_text ltx_font_bold" style="font-size:90%;--ltx-fg-color:#000000;">Epoch-Local Validity.<span id="S3.SS2.p5.pic1.1.1.1.1" class="ltx_text ltx_font_medium"> Stationary generation and scoring give each node–role–task tuple a fixed success probability. With selective erasure, each epoch is a fixed binary-outcome search problem (<a href="#Thmproposition3" title="Proposition 3 (Epoch-local fixed-criterion validity). ‣ F.4 Epoch-Local Fixed-Utility Validity ‣ Appendix F Theory" class="ltx_ref"><span class="ltx_text ltx_ref_tag">Props.</span> <span class="ltx_text ltx_ref_tag">3</span></a> and <a href="#Thmproposition5" title="Proposition 5 (Piecewise fixed-criterion validity). ‣ F.5 Supporting Results for Controlled Utility Evolution ‣ Appendix F Theory" class="ltx_ref"><span class="ltx_text ltx_ref_tag">5</span></a>), to which <span id="S3.SS2.p5.pic1.1.1.1.1.1" class="ltx_text ltx_font_typewriter">HGM</span>’s analysis applies within the epoch under its remaining assumptions (<a href="#Thmassumption1" title="Assumption 1 (Fixed-criterion search). ‣ F.1.1 Operating Conditions ‣ F.1 Setting: the HGM Search Algorithm ‣ Appendix F Theory" class="ltx_ref"><span class="ltx_text ltx_ref_tag">Asm.</span> <span class="ltx_text ltx_ref_tag">1</span></a>).</span></span></span>
</span></span></span></foreignobject></g></g></svg>