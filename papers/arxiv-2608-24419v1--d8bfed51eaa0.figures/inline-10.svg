<span id="A2.SS0.SSS0.Px2.p4.pic1.2" class="ltx_inline-block ltx_minipage ltx_align_bottom" style="width:48.51em;">
<span id="A2.SS0.SSS0.Px2.p4.pic1.2.1" class="ltx_p"><span id="A2.SS0.SSS0.Px2.p4.pic1.2.1.1" class="ltx_text" style="font-size:90%;--ltx-fg-color:#000000;">Two sentences are given. Judge ONLY the following, independently of style or fluency.</span></span>
<span id="A2.SS0.SSS0.Px2.p4.pic1.2.2" class="ltx_p"><span id="A2.SS0.SSS0.Px2.p4.pic1.2.2.1" class="ltx_text" style="font-size:90%;--ltx-fg-color:#000000;">A: <code id="A2.SS0.SSS0.Px2.p4.pic1.2.2.1.1" class="ltx_verbatim ltx_font_typewriter">{original}</code>  B: <code id="A2.SS0.SSS0.Px2.p4.pic1.2.2.1.2" class="ltx_verbatim ltx_font_typewriter">{edited}</code>  Evidence context: <code id="A2.SS0.SSS0.Px2.p4.pic1.2.2.1.3" class="ltx_verbatim ltx_font_typewriter">{evidence}</code></span></span>
<span id="A2.SS0.SSS0.Px2.p4.pic1.2.3" class="ltx_p"><span id="A2.SS0.SSS0.Px2.p4.pic1.2.3.1" class="ltx_text" style="font-size:90%;--ltx-fg-color:#000000;">Answer each question separately:</span></span>
<span id="A2.I3" class="ltx_enumerate">
<span id="A2.I3.i1" class="ltx_item" style="list-style-type:none;"><span class="ltx_tag ltx_tag_item">1.</span> 
<span id="A2.I3.i1.p1" class="ltx_para">
<span id="A2.I3.i1.p1.1" class="ltx_p"><span id="A2.I3.i1.p1.1.1" class="ltx_text ltx_font_typewriter" style="font-size:90%;--ltx-fg-color:#000000;">facts_identical</span><span id="A2.I3.i1.p1.1.2" class="ltx_text" style="font-size:90%;--ltx-fg-color:#000000;">: do A and B assert the same factual content (same numbers,
same entities, same findings) with nothing added or removed?</span></span>
</span></span>
<span id="A2.I3.i2" class="ltx_item" style="list-style-type:none;padding-top:0.0pt;"><span class="ltx_tag ltx_tag_item">2.</span> 
<span id="A2.I3.i2.p1" class="ltx_para">
<span id="A2.I3.i2.p1.1" class="ltx_p"><span id="A2.I3.i2.p1.1.1" class="ltx_text ltx_font_typewriter" style="font-size:90%;--ltx-fg-color:#000000;">scope_relation</span><span id="A2.I3.i2.p1.1.2" class="ltx_text" style="font-size:90%;--ltx-fg-color:#000000;">: is B’s scope </span><span id="A2.I3.i2.p1.1.3" class="ltx_text ltx_font_typewriter" style="font-size:90%;--ltx-fg-color:#000000;">broader</span><span id="A2.I3.i2.p1.1.4" class="ltx_text" style="font-size:90%;--ltx-fg-color:#000000;">, </span><span id="A2.I3.i2.p1.1.5" class="ltx_text ltx_font_typewriter" style="font-size:90%;--ltx-fg-color:#000000;">narrower</span><span id="A2.I3.i2.p1.1.6" class="ltx_text" style="font-size:90%;--ltx-fg-color:#000000;">, or
</span><span id="A2.I3.i2.p1.1.7" class="ltx_text ltx_font_typewriter" style="font-size:90%;--ltx-fg-color:#000000;">same</span><span id="A2.I3.i2.p1.1.8" class="ltx_text" style="font-size:90%;--ltx-fg-color:#000000;"> relative to A?</span></span>
</span></span>
<span id="A2.I3.i3" class="ltx_item" style="list-style-type:none;padding-top:0.0pt;"><span class="ltx_tag ltx_tag_item">3.</span> 
<span id="A2.I3.i3.p1" class="ltx_para">
<span id="A2.I3.i3.p1.1" class="ltx_p"><span id="A2.I3.i3.p1.1.1" class="ltx_text ltx_font_typewriter" style="font-size:90%;--ltx-fg-color:#000000;">slot_changed</span><span id="A2.I3.i3.p1.1.2" class="ltx_text" style="font-size:90%;--ltx-fg-color:#000000;">: which scope slot differs, if any? One of
</span><span id="A2.I3.i3.p1.1.3" class="ltx_text ltx_font_typewriter" style="font-size:90%;--ltx-fg-color:#000000;">population_widening</span><span id="A2.I3.i3.p1.1.4" class="ltx_text" style="font-size:90%;--ltx-fg-color:#000000;">, </span><span id="A2.I3.i3.p1.1.5" class="ltx_text ltx_font_typewriter" style="font-size:90%;--ltx-fg-color:#000000;">condition_removal</span><span id="A2.I3.i3.p1.1.6" class="ltx_text" style="font-size:90%;--ltx-fg-color:#000000;">,
</span><span id="A2.I3.i3.p1.1.7" class="ltx_text ltx_font_typewriter" style="font-size:90%;--ltx-fg-color:#000000;">tense_modality_shift</span><span id="A2.I3.i3.p1.1.8" class="ltx_text" style="font-size:90%;--ltx-fg-color:#000000;">, </span><span id="A2.I3.i3.p1.1.9" class="ltx_text ltx_font_typewriter" style="font-size:90%;--ltx-fg-color:#000000;">quantifier_strengthening</span><span id="A2.I3.i3.p1.1.10" class="ltx_text" style="font-size:90%;--ltx-fg-color:#000000;">,
</span><span id="A2.I3.i3.p1.1.11" class="ltx_text ltx_font_typewriter" style="font-size:90%;--ltx-fg-color:#000000;">hedging_removal</span><span id="A2.I3.i3.p1.1.12" class="ltx_text" style="font-size:90%;--ltx-fg-color:#000000;">, </span><span id="A2.I3.i3.p1.1.13" class="ltx_text ltx_font_typewriter" style="font-size:90%;--ltx-fg-color:#000000;">domain_extension</span><span id="A2.I3.i3.p1.1.14" class="ltx_text" style="font-size:90%;--ltx-fg-color:#000000;">, or </span><span id="A2.I3.i3.p1.1.15" class="ltx_text ltx_font_typewriter" style="font-size:90%;--ltx-fg-color:#000000;">none</span><span id="A2.I3.i3.p1.1.16" class="ltx_text" style="font-size:90%;--ltx-fg-color:#000000;">.</span></span>
</span></span>
<span id="A2.I3.i4" class="ltx_item" style="list-style-type:none;padding-top:0.0pt;"><span class="ltx_tag ltx_tag_item">4.</span> 
<span id="A2.I3.i4.p1" class="ltx_para">
<span id="A2.I3.i4.p1.1" class="ltx_p"><span id="A2.I3.i4.p1.1.1" class="ltx_text ltx_font_typewriter" style="font-size:90%;--ltx-fg-color:#000000;">anchor_free_both</span><span id="A2.I3.i4.p1.1.2" class="ltx_text" style="font-size:90%;--ltx-fg-color:#000000;">: is neither sentence pointing at a source (no “this study”,
no “Figure N”, no “the authors”)?</span></span>
</span></span>
<span id="A2.I3.i5" class="ltx_item" style="list-style-type:none;padding-top:0.0pt;"><span class="ltx_tag ltx_tag_item">5.</span> 
<span id="A2.I3.i5.p1" class="ltx_para">
<span id="A2.I3.i5.p1.1" class="ltx_p"><span id="A2.I3.i5.p1.1.1" class="ltx_text ltx_font_typewriter" style="font-size:90%;--ltx-fg-color:#000000;">register_comparable</span><span id="A2.I3.i5.p1.1.2" class="ltx_text" style="font-size:90%;--ltx-fg-color:#000000;">: are they in the same register, so that neither reads as
more formal or more hedged than the other beyond the slot change?</span></span>
</span></span>
</span>
<span id="A2.SS0.SSS0.Px2.p4.pic1.2.4" class="ltx_p"><span id="A2.SS0.SSS0.Px2.p4.pic1.2.4.1" class="ltx_text" style="font-size:90%;--ltx-fg-color:#000000;">Return JSON only: <code id="A2.SS0.SSS0.Px2.p4.pic1.2.4.1.1" class="ltx_verbatim ltx_font_typewriter">{&quot;facts_identical&quot;: &lt;bool&gt;, &quot;scope_relation&quot;: ...,</code>
<code id="A2.SS0.SSS0.Px2.p4.pic1.2.4.1.2" class="ltx_verbatim ltx_font_typewriter">&quot;slot_changed&quot;: ..., &quot;anchor_free_both&quot;: &lt;bool&gt;, &quot;register_comparable&quot;: &lt;bool&gt;,</code>
<code id="A2.SS0.SSS0.Px2.p4.pic1.2.4.1.3" class="ltx_verbatim ltx_font_typewriter">&quot;notes&quot;: ...}</code></span></span>
</span></span></span></foreignobject></g></g></svg>