</span></span></span></foreignobject></g><g fill-opacity="1.0" transform="matrix(1.0 0.0 0.0 1.0 21.65 16.55)"><foreignobject style="--ltx-fo-width:48.45em;--ltx-fo-height:23.67em;--ltx-fo-depth:0.2em;font-size:10pt;" height="330.26" overflow="visible" transform="matrix(1 0 0 -1 0 327.5)" width="670.41"><span class="ltx_foreignobject_container"><span class="ltx_foreignobject_content">
<span id="A2.SS2.SSS0.Px3.p1.pic1.2" class="ltx_inline-block ltx_minipage ltx_align_bottom" style="width:48.45em;">
<span id="A2.SS2.SSS0.Px3.p1.pic1.2.1" class="ltx_p"><span id="A2.SS2.SSS0.Px3.p1.pic1.2.1.1" class="ltx_text ltx_font_typewriter" style="font-size:90%;--ltx-fg-color:#000000;">Given a prompt and a response, follow the rubric to make a judgment.
</span></span>
<span id="A2.SS2.SSS0.Px3.p1.pic1.2.2" class="ltx_p"><span id="A2.SS2.SSS0.Px3.p1.pic1.2.2.1" class="ltx_text ltx_font_typewriter" style="font-size:90%;--ltx-fg-color:#000000;">## Rubric:
</span></span>
<span id="A2.SS2.SSS0.Px3.p1.pic1.2.3" class="ltx_p"><span id="A2.SS2.SSS0.Px3.p1.pic1.2.3.1" class="ltx_text ltx_font_typewriter" style="font-size:90%;--ltx-fg-color:#000000;">Judge the response on five aspects: <span id="A2.SS2.SSS0.Px3.p1.pic1.2.3.1.1" class="ltx_text ltx_font_bold">helpfulness</span>, <span id="A2.SS2.SSS0.Px3.p1.pic1.2.3.1.2" class="ltx_text ltx_font_bold">correctness</span>, <span id="A2.SS2.SSS0.Px3.p1.pic1.2.3.1.3" class="ltx_text ltx_font_bold">coherence</span>, <span id="A2.SS2.SSS0.Px3.p1.pic1.2.3.1.4" class="ltx_text ltx_font_bold">complexity</span>, and <span id="A2.SS2.SSS0.Px3.p1.pic1.2.3.1.5" class="ltx_text ltx_font_bold">verbosity</span>. </span></span>
<span id="A2.SS2.SSS0.Px3.p1.pic1.2.4" class="ltx_p"><span id="A2.SS2.SSS0.Px3.p1.pic1.2.4.1" class="ltx_text ltx_font_typewriter" style="font-size:90%;--ltx-fg-color:#000000;">Assign each aspect a scalar score in <span id="A2.SS2.SSS0.Px3.p1.pic1.2.4.1.1" class="ltx_text ltx_font_bold">[0, 4]</span>.
</span></span>
<span id="A2.SS2.SSS0.Px3.p1.pic1.2.5" class="ltx_p"><span id="A2.SS2.SSS0.Px3.p1.pic1.2.5.1" class="ltx_text ltx_font_typewriter" style="font-size:90%;--ltx-fg-color:#000000;">## Prompt: [PROMPT]
</span></span>
<span id="A2.SS2.SSS0.Px3.p1.pic1.2.6" class="ltx_p"><span id="A2.SS2.SSS0.Px3.p1.pic1.2.6.1" class="ltx_text ltx_font_typewriter" style="font-size:90%;--ltx-fg-color:#000000;">## Response: [RESPONSE]
</span></span>
<span id="A2.SS2.SSS0.Px3.p1.pic1.2.7" class="ltx_p"><span id="A2.SS2.SSS0.Px3.p1.pic1.2.7.1" class="ltx_text ltx_font_typewriter" style="font-size:90%;--ltx-fg-color:#000000;">Please output a valid JSON object using the following schema:

   &quot;Rationale&quot;: &lt;explanation for the given scores&gt;,    &quot;Helpfulness&quot;: &lt;0--4&gt;,    &quot;Correctness&quot;: &lt;0--4&gt;,    &quot;Coherence&quot;: &lt;0--4&gt;,    &quot;Complexity&quot;: &lt;0--4&gt;,    &quot;Verbosity&quot;: &lt;0--4&gt;
</span></span>
<span id="A2.SS2.SSS0.Px3.p1.pic1.2.8" class="ltx_p"><span id="A2.SS2.SSS0.Px3.p1.pic1.2.8.1" class="ltx_text ltx_font_typewriter" style="font-size:90%;--ltx-fg-color:#000000;">Formatted the abovementioned schema and produce the judgment JSON now.
</span></span>
</span></span></span></foreignobject></g></g></svg>