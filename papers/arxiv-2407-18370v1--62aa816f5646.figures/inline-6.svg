<span id="A6.p2.pic1.1" class="ltx_inline-block ltx_minipage ltx_align_bottom" style="width:36.62em;">
<span id="A6.p2.pic1.1.1" class="ltx_p"><span id="A6.p2.pic1.1.1.1" class="ltx_text" style="--ltx-fg-color:#FFFFFF;">Summarization Example 2</span></span>
</span></span></span></foreignobject></g><g fill-opacity="1.0" transform="matrix(1.0 0.0 0.0 1.0 21.65 13.78)"><foreignobject style="--ltx-fo-width:36.62em;--ltx-fo-height:41.3em;--ltx-fo-depth:0em;font-size:10pt;" height="571.43" overflow="visible" transform="matrix(1 0 0 -1 0 571.43)" width="506.72"><span class="ltx_foreignobject_container"><span class="ltx_foreignobject_content"><span id="A6.p2.pic1.2" class="ltx_inline-logical-block ltx_minipage ltx_align_bottom" style="width:36.62em;">
<span id="A6.p2.pic1.p4" class="ltx_para">
<span id="A6.p2.pic1.p4.1" class="ltx_p"><span id="A6.p2.pic1.p4.1.1" class="ltx_text ltx_font_bold" style="--ltx-fg-color:#000000;">Document<span id="A6.p2.pic1.p4.1.1.1" class="ltx_text ltx_font_medium"> 
<br class="ltx_break">I have been working since 16 and make around $12,000 annually with a small amount of expenses (gas, car insurance). I literally just turned 18 and felt that it would be a good idea to get a credit card. I honestly don’t need it to “make purchases I can’t afford” but I really just want one to start building my credit.</span></span></span>
<span id="A6.p2.pic1.p4.2" class="ltx_p"><span id="A6.p2.pic1.p4.2.1" class="ltx_text" style="--ltx-fg-color:#000000;">I talked with my Dad about it and he said that applying for a store card like Best Buy (where I work actually) would be a good idea or that getting a secured credit card would also be a good idea. I prefer the secured credit card route due to being able to use it anywhere and I can’t see myself actually using a store card consistently as I do not shop at one place consistently.</span></span>
<span id="A6.p2.pic1.p4.3" class="ltx_p"><span id="A6.p2.pic1.p4.3.1" class="ltx_text" style="--ltx-fg-color:#000000;">What are some of the best secured Credit Cards to get? I’m not worried about a high credit limit, I just want my credit to go up and be good, for a lack of better words. My current debit card is with a Credit Union and I read that those and Capital One are usually the best route to go with.</span></span>
<span id="A6.p2.pic1.p4.4" class="ltx_p"><span id="A6.p2.pic1.p4.4.1" class="ltx_text" style="--ltx-fg-color:#000000;">I also wanted to know if it is better to with Visa, Mastercard, Discover, AMEX ETC.</span></span>
</span>
<span id="A6.p2.pic1.p1" class="ltx_para ltx_noindent"><span class="ltx_inline-block"><svg id="A6.p2.pic1.p1.pic1" class="ltx_picture" color="#000000" height="23.62" overflow="visible" version="1.1" viewbox="0 0 506.69 23.62" width="506.69"><g style="--ltx-stroke-color:#404040;--ltx-fill-color:#000000;" fill="#000000" fill-opacity="1.0" stroke="#404040" stroke-dasharray="2.84528pt,2.84528pt" stroke-dashoffset="0.0pt" stroke-width="0.4pt" transform="translate(0,23.62) matrix(1 0 0 -1 0 0) translate(0,11.81)"><path style="fill:none" d="M -19.68 0 L 526.38 0" /></g></svg>