<svg id="S15.SS0.SSS0.Px6.p3.pic1" class="ltx_picture" height="372.81" overflow="visible" version="1.1" viewbox="0 0 477.38 372.81" width="477.38"><g style="--ltx-stroke-color:#000000;--ltx-fill-color:#000000;" fill="#000000" stroke="#000000" stroke-width="0.4pt" transform="translate(0,372.81) matrix(1 0 0 -1 0 0)"><g style="--ltx-fill-color:#4285F4;" fill="#4285F4" fill-opacity="1.0"><path style="stroke:none" d="M 0 7.5 L 0 365.3 C 0 369.45 3.36 372.81 7.5 372.81 L 469.87 372.81 C 474.02 372.81 477.38 369.45 477.38 365.3 L 477.38 7.5 C 477.38 3.36 474.02 0 469.87 0 L 7.5 0 C 3.36 0 0 3.36 0 7.5 Z" /></g><g style="--ltx-fill-color:#F5F5F5;" fill="#F5F5F5" fill-opacity="1.0"><path style="stroke:none" d="M 1.97 7.5 L 1.97 334.43 L 475.41 334.43 L 475.41 7.5 C 475.41 4.45 472.93 1.97 469.87 1.97 L 7.5 1.97 C 4.45 1.97 1.97 4.45 1.97 7.5 Z" /></g><g fill-opacity="1.0" transform="matrix(1.0 0.0 0.0 1.0 20.48 341.86)"><foreignobject style="--ltx-fo-width:27.43em;--ltx-fo-height:1.89em;--ltx-fo-depth:0.19em;font-size:10pt;" height="28.9" overflow="visible" transform="matrix(1 0 0 -1 0 26.21)" width="379.55"><span class="ltx_foreignobject_container"><span class="ltx_foreignobject_content">
<span id="S15.SS0.SSS0.Px6.p3.pic1.1" class="ltx_inline-block ltx_minipage ltx_align_bottom" style="width:27.43em;">
<span id="S15.SS0.SSS0.Px6.p3.pic1.1.1" class="ltx_p"><span id="S15.SS0.SSS0.Px6.p3.pic1.1.1.1" class="ltx_text" style="position:relative; bottom:0.9pt;"></span><a href="https://codeforces.com/blog/entry/136886" title class="ltx_ref ltx_href ltx_font_bold" style="--ltx-fg-color:#FFFFFF;">Tutorial</a><span id="S15.SS0.SSS0.Px6.p3.pic1.1.1.2" class="ltx_text ltx_font_bold" style="--ltx-fg-color:#FFFFFF;"> — <a href="https://codeforces.com/problemset/submission/2042/294601113" title class="ltx_ref ltx_href">Human’s accepted submission</a> — <a href="https://gist.github.com/anonymous-llm-code/8662b4ad85427891432c694bc52e3d04" title class="ltx_ref ltx_href"><span class="ltx_text ltx_font_typewriter">o3-mini</span>’s rejected submission</a></span></span>
</span></span></span></foreignobject></g><g fill-opacity="1.0" transform="matrix(1.0 0.0 0.0 1.0 20.48 15.3)"><foreignobject style="--ltx-fo-width:31.54em;--ltx-fo-height:22.29em;--ltx-fo-depth:0.19em;font-size:10pt;" height="311.18" overflow="visible" transform="matrix(1 0 0 -1 0 308.49)" width="436.42"><span class="ltx_foreignobject_container"><span class="ltx_foreignobject_content">
<span id="S15.SS0.SSS0.Px6.p3.pic1.2" class="ltx_inline-block ltx_minipage ltx_align_bottom" style="width:31.54em;">
<span id="S15.SS0.SSS0.Px6.p3.pic1.2.1" class="ltx_p"><span id="S15.SS0.SSS0.Px6.p3.pic1.2.1.1" class="ltx_text" style="--ltx-fg-color:#000000;">Consider several first chests that Monocarp will take before exceeding the limit if we don’t add any coins; so, this will be the set of several largest chests such that the sum of this set is <math id="S15.SS0.SSS0.Px6.p3.pic1.m1" class="ltx_Math" alttext="s\leq k" display="inline" intent=":literal"><semantics><mrow><mi style="--ltx-fg-color:#000000;" mathcolor="#000000">s</mi><mo style="--ltx-fg-color:#000000;" mathcolor="#000000">≤</mo><mi style="--ltx-fg-color:#000000;" mathcolor="#000000">k</mi></mrow><annotation encoding="application/x-tex">s\leq k</annotation></semantics></math>, but if the next chest is taken, the sum would exceed <math id="S15.SS0.SSS0.Px6.p3.pic1.m2" class="ltx_Math" alttext="k" display="inline" intent=":literal"><semantics><mi style="--ltx-fg-color:#000000;" mathcolor="#000000">k</mi><annotation encoding="application/x-tex">k</annotation></semantics></math>.

<br class="ltx_break">
<br class="ltx_break">For this set, the minimum number of coins that should be added is <math id="S15.SS0.SSS0.Px6.p3.pic1.m3" class="ltx_Math" alttext="k-s" display="inline" intent=":literal"><semantics><mrow><mi style="--ltx-fg-color:#000000;" mathcolor="#000000">k</mi><mo style="--ltx-fg-color:#000000;" mathcolor="#000000">−</mo><mi style="--ltx-fg-color:#000000;" mathcolor="#000000">s</mi></mrow><annotation encoding="application/x-tex">k-s</annotation></semantics></math>. We can add exactly that amount if we increase the maximum element, the set of chests will include exactly the same elements, but now their sum is equal to <math id="S15.SS0.SSS0.Px6.p3.pic1.m4" class="ltx_Math" alttext="k" display="inline" intent=":literal"><semantics><mi style="--ltx-fg-color:#000000;" mathcolor="#000000">k</mi><annotation encoding="application/x-tex">k</annotation></semantics></math>.

<br class="ltx_break">
<br class="ltx_break">Now we have to consider the case where we add coins to some chest that is not the part of this set. Suppose Monocarp took some chest <math id="S15.SS0.SSS0.Px6.p3.pic1.m5" class="ltx_Math" alttext="i" display="inline" intent=":literal"><semantics><mi style="--ltx-fg-color:#000000;" mathcolor="#000000">i</mi><annotation encoding="application/x-tex">i</annotation></semantics></math>, which initially had <math id="S15.SS0.SSS0.Px6.p3.pic1.m6" class="ltx_Math" alttext="a_{i}" display="inline" intent=":literal"><semantics><msub><mi style="--ltx-fg-color:#000000;" mathcolor="#000000">a</mi><mi style="--ltx-fg-color:#000000;" mathcolor="#000000">i</mi></msub><annotation encoding="application/x-tex">a_{i}</annotation></semantics></math> coins, but did not take chest <math id="S15.SS0.SSS0.Px6.p3.pic1.m7" class="ltx_Math" alttext="j" display="inline" intent=":literal"><semantics><mi style="--ltx-fg-color:#000000;" mathcolor="#000000">j</mi><annotation encoding="application/x-tex">j</annotation></semantics></math>, such that <math id="S15.SS0.SSS0.Px6.p3.pic1.m8" class="ltx_Math" alttext="a_{j}&gt;a_{i}" display="inline" intent=":literal"><semantics><mrow><msub><mi style="--ltx-fg-color:#000000;" mathcolor="#000000">a</mi><mi style="--ltx-fg-color:#000000;" mathcolor="#000000">j</mi></msub><mo style="--ltx-fg-color:#000000;" mathcolor="#000000">&gt;</mo><msub><mi style="--ltx-fg-color:#000000;" mathcolor="#000000">a</mi><mi style="--ltx-fg-color:#000000;" mathcolor="#000000">i</mi></msub></mrow><annotation encoding="application/x-tex">a_{j}&gt;a_{i}</annotation></semantics></math>. In order for chest <math id="S15.SS0.SSS0.Px6.p3.pic1.m9" class="ltx_Math" alttext="i" display="inline" intent=":literal"><semantics><mi style="--ltx-fg-color:#000000;" mathcolor="#000000">i</mi><annotation encoding="application/x-tex">i</annotation></semantics></math> to be taken, its final value must be at least <math id="S15.SS0.SSS0.Px6.p3.pic1.m10" class="ltx_Math" alttext="a_{j}" display="inline" intent=":literal"><semantics><msub><mi style="--ltx-fg-color:#000000;" mathcolor="#000000">a</mi><mi style="--ltx-fg-color:#000000;" mathcolor="#000000">j</mi></msub><annotation encoding="application/x-tex">a_{j}</annotation></semantics></math> as Monocarp selects the maximum chest from the available ones. Let’s suppose that <math id="S15.SS0.SSS0.Px6.p3.pic1.m11" class="ltx_Math" alttext="x" display="inline" intent=":literal"><semantics><mi style="--ltx-fg-color:#000000;" mathcolor="#000000">x</mi><annotation encoding="application/x-tex">x</annotation></semantics></math> coins were added to chest <math id="S15.SS0.SSS0.Px6.p3.pic1.m12" class="ltx_Math" alttext="i" display="inline" intent=":literal"><semantics><mi style="--ltx-fg-color:#000000;" mathcolor="#000000">i</mi><annotation encoding="application/x-tex">i</annotation></semantics></math>, so that <math id="S15.SS0.SSS0.Px6.p3.pic1.m13" class="ltx_Math" alttext="a_{i}+x\geq a_{j}" display="inline" intent=":literal"><semantics><mrow><mrow><msub><mi style="--ltx-fg-color:#000000;" mathcolor="#000000">a</mi><mi style="--ltx-fg-color:#000000;" mathcolor="#000000">i</mi></msub><mo style="--ltx-fg-color:#000000;" mathcolor="#000000">+</mo><mi style="--ltx-fg-color:#000000;" mathcolor="#000000">x</mi></mrow><mo style="--ltx-fg-color:#000000;" mathcolor="#000000">≥</mo><msub><mi style="--ltx-fg-color:#000000;" mathcolor="#000000">a</mi><mi style="--ltx-fg-color:#000000;" mathcolor="#000000">j</mi></msub></mrow><annotation encoding="application/x-tex">a_{i}+x\geq a_{j}</annotation></semantics></math>. However, instead, we could have increased chest <math id="S15.SS0.SSS0.Px6.p3.pic1.m14" class="ltx_Math" alttext="j" display="inline" intent=":literal"><semantics><mi style="--ltx-fg-color:#000000;" mathcolor="#000000">j</mi><annotation encoding="application/x-tex">j</annotation></semantics></math> to the value <math id="S15.SS0.SSS0.Px6.p3.pic1.m15" class="ltx_Math" alttext="a_{i}+x" display="inline" intent=":literal"><semantics><mrow><msub><mi style="--ltx-fg-color:#000000;" mathcolor="#000000">a</mi><mi style="--ltx-fg-color:#000000;" mathcolor="#000000">i</mi></msub><mo style="--ltx-fg-color:#000000;" mathcolor="#000000">+</mo><mi style="--ltx-fg-color:#000000;" mathcolor="#000000">x</mi></mrow><annotation encoding="application/x-tex">a_{i}+x</annotation></semantics></math>, and this would require fewer coins, since <math id="S15.SS0.SSS0.Px6.p3.pic1.m16" class="ltx_Math" alttext="a_{j}&gt;a_{i}" display="inline" intent=":literal"><semantics><mrow><msub><mi style="--ltx-fg-color:#000000;" mathcolor="#000000">a</mi><mi style="--ltx-fg-color:#000000;" mathcolor="#000000">j</mi></msub><mo style="--ltx-fg-color:#000000;" mathcolor="#000000">&gt;</mo><msub><mi style="--ltx-fg-color:#000000;" mathcolor="#000000">a</mi><mi style="--ltx-fg-color:#000000;" mathcolor="#000000">i</mi></msub></mrow><annotation encoding="application/x-tex">a_{j}&gt;a_{i}</annotation></semantics></math>. Thus, we have shown that it is not optimal to ”change” the order of the chests, so we can always assume that Monocarp takes several chests that were the largest in the original order.</span></span>
</span></span></span></foreignobject></g></g></svg>