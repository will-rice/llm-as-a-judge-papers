<span id="A3.SS1.SSS4.p2.pic1.1" class="ltx_inline-block ltx_minipage ltx_align_middle" style="width:38.57em;">
<span id="A3.SS1.SSS4.p2.pic1.1.1" class="ltx_p"><span id="A3.SS1.SSS4.p2.pic1.1.1.1" class="ltx_text ltx_font_bold" style="--ltx-fg-color:#1A1A1A;">Prompt: URL citation</span></span>
</span></span></span></foreignobject></g></g></g><g fill-opacity="1.0" transform="matrix(1.0 0.0 0.0 1.0 11.55 29.84)"><foreignobject style="--ltx-fo-width:45.53em;--ltx-fo-height:18.08em;--ltx-fo-depth:1.42em;font-size:10pt;" height="269.82" overflow="visible" transform="matrix(1 0 0 -1 0 250.15)" width="630.01"><span class="ltx_foreignobject_container"><span class="ltx_foreignobject_content">
<span id="A3.SS1.SSS4.p2.pic1.2" class="ltx_inline-block ltx_minipage ltx_align_bottom" style="width:45.53em;">
<span id="A3.SS1.SSS4.p2.pic1.2.1" class="ltx_p ltx_align_left"><span id="A3.SS1.SSS4.p2.pic1.2.1.1" class="ltx_text ltx_font_bold" style="--ltx-fg-color:#000000;">Objective:<span id="A3.SS1.SSS4.p2.pic1.2.1.1.1" class="ltx_text ltx_font_medium"> Generate a URL that could potentially be the source of a given sentence using a specified
template.</span></span></span>
<span id="A3.SS1.SSS4.p2.pic1.2.2" class="ltx_p ltx_align_left"><span id="A3.SS1.SSS4.p2.pic1.2.2.1" class="ltx_text ltx_font_bold" style="--ltx-fg-color:#000000;">Sentence:<span id="A3.SS1.SSS4.p2.pic1.2.2.1.1" class="ltx_text ltx_font_medium"> &quot;<span id="A3.SS1.SSS4.p2.pic1.2.2.1.1.1" class="ltx_text" style="--ltx-fg-color:#2E6B4F;">{<span id="A3.SS1.SSS4.p2.pic1.2.2.1.1.1.1" class="ltx_text ltx_font_italic">answer</span>}</span>&quot;</span></span></span>
<span id="A3.SS1.SSS4.p2.pic1.2.3" class="ltx_p ltx_align_left"><span id="A3.SS1.SSS4.p2.pic1.2.3.1" class="ltx_text ltx_font_bold" style="--ltx-fg-color:#000000;">URL Template:<span id="A3.SS1.SSS4.p2.pic1.2.3.1.1" class="ltx_text ltx_font_medium"> <span id="A3.SS1.SSS4.p2.pic1.2.3.1.1.1" class="ltx_text ltx_font_typewriter">www.[topic].com/[keywords1]/[keywords2]/find=[keywords3].html</span></span></span></span>
<span id="A3.SS1.SSS4.p2.pic1.2.4" class="ltx_p ltx_align_left"><span id="A3.SS1.SSS4.p2.pic1.2.4.1" class="ltx_text ltx_font_bold" style="--ltx-fg-color:#000000;">Instructions:</span></span>
<span id="A3.SS1.SSS4.p2.pic1.2.5" class="ltx_p ltx_align_left"><span id="A3.SS1.SSS4.p2.pic1.2.5.1" class="ltx_text" style="--ltx-fg-color:#000000;">Analyze the provided sentence to identify the main topic and relevant keywords.</span></span>
<span id="A3.SS1.SSS4.p2.pic1.2.6" class="ltx_p ltx_align_left"><span id="A3.SS1.SSS4.p2.pic1.2.6.1" class="ltx_text" style="--ltx-fg-color:#000000;">Map the identified topic and keywords into the given URL template:</span></span>
<span id="A3.SS1.SSS4.p2.pic1.2.7" class="ltx_p ltx_align_left"><span id="A3.SS1.SSS4.p2.pic1.2.7.1" class="ltx_text" style="--ltx-fg-color:#000000;">Replace [topic] with the main subject or theme of the sentence.</span></span>
<span id="A3.SS1.SSS4.p2.pic1.2.8" class="ltx_p ltx_align_left"><span id="A3.SS1.SSS4.p2.pic1.2.8.1" class="ltx_text" style="--ltx-fg-color:#000000;">Replace [keywords1], [keywords2], and [keywords3] with keywords that are closely related to the content of the
sentence.</span></span>
<span id="A3.SS1.SSS4.p2.pic1.2.9" class="ltx_p ltx_align_left"><span id="A3.SS1.SSS4.p2.pic1.2.9.1" class="ltx_text" style="--ltx-fg-color:#000000;">Ensure that the generated URL is plausible and could realistically reflect a webpage where the sentence might be
found.</span></span>
<span id="A3.SS1.SSS4.p2.pic1.2.10" class="ltx_p ltx_align_left"><span id="A3.SS1.SSS4.p2.pic1.2.10.1" class="ltx_text" style="--ltx-fg-color:#000000;">Please give the url in the form of <span id="A3.SS1.SSS4.p2.pic1.2.10.1.1" class="ltx_text ltx_font_typewriter">[[ www.[topic].com/[keywords1]/[keywords2]/find=[keywords3].html]]</span></span></span>
</span></span></span></foreignobject></g></g></svg>