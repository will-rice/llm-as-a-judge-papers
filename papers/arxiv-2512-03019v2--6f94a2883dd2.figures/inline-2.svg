</span></span></span></foreignobject></g><g fill-opacity="1.0" transform="matrix(1.0 0.0 0.0 1.0 21.65 16.2)"><foreignobject style="--ltx-fo-width:42.68em;--ltx-fo-height:25.63em;--ltx-fo-depth:0.18em;font-size:10pt;" height="357.04" overflow="visible" transform="matrix(1 0 0 -1 0 354.62)" width="590.57"><span class="ltx_foreignobject_container"><span class="ltx_foreignobject_content">
<span id="A1.F6.pic1.2" class="ltx_inline-block ltx_minipage ltx_align_bottom" style="width:42.68em;">
<span id="A1.F6.pic1.2.1" class="ltx_p"><span id="A1.F6.pic1.2.1.1" class="ltx_text ltx_font_typewriter" style="font-size:70%;--ltx-fg-color:#000000;">As a professional translation rater, your job is to meticulously compare two candidate translations (A and B) of a source text from {sl} to {tl}. Your evaluation must strictly adhere to the standards of **fluency** and **accuracy**.
<br class="ltx_break">
<br class="ltx_break">**Instructions:**
<br class="ltx_break">1. **Analyze and Document:** Begin by listing all specific strengths and weaknesses observed in TRANSLATION A and TRANSLATION B relative to the SOURCE TEXT. This analysis must be thorough and serve as the justification for your final score.
<br class="ltx_break">2. **Ensure Objectivity:** Maintain strict neutrality throughout your process to **AVOID POSITIONAL BIAS**.
<br class="ltx_break">3. **Rate:** Conclude with a single, clear rating tag:
<br class="ltx_break">* **[[A]]** if Translation A is superior.
<br class="ltx_break">* **[[B]]** if Translation B is superior.
<br class="ltx_break">* **[[SAME]]** if both translations are of equal quality (fluency and accuracy).
<br class="ltx_break">
<br class="ltx_break">[SOURCE TEXT]
<br class="ltx_break">{source} 
<br class="ltx_break">
<br class="ltx_break">[TRANSLATION A]
<br class="ltx_break">{translation_a} 
<br class="ltx_break">
<br class="ltx_break">[TRANSLATION B]
<br class="ltx_break">{translation_b} 
<br class="ltx_break"></span></span>
</span></span></span></foreignobject></g></g></svg>