<span id="A1.F5.pic2.p2.2" class="ltx_p"><span id="A1.F5.pic2.p2.2.1" class="ltx_text ltx_font_bold" style="font-size:90%;--ltx-fg-color:#000000;">Summary:<span id="A1.F5.pic2.p2.2.1.1" class="ltx_text ltx_font_medium"> <span id="A1.F5.pic2.p2.2.1.1.1" class="ltx_text ltx_font_italic">“The U.S. RC-135U was flying over the Baltic Sea when it was intercepted by a Russian SU-27 Flanker. <span id="A1.F5.pic2.p2.2.1.1.1.1" class="ltx_text ltx_underline">The Pentagon said</span> the Russian jet flew around the plane <span id="A1.F5.pic2.p2.2.1.1.1.2" class="ltx_text ltx_underline">to identify it</span>. Read more: <span id="A1.F5.pic2.p2.2.1.1.1.3" class="ltx_text ltx_underline">http://dailycaller.com/…</span>”</span></span></span></span>
</span>
