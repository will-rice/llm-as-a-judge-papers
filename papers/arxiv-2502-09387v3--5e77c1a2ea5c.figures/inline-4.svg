<svg id="A6.F6.p2.pic1" class="ltx_picture" height="255.2" overflow="visible" version="1.1" viewbox="0 0 653.15 255.2" width="653.15"><g style="--ltx-stroke-color:#000000;--ltx-fill-color:#000000;" fill="#000000" stroke="#000000" stroke-width="0.4pt" transform="translate(0,255.2) matrix(1 0 0 -1 0 0)"><g style="--ltx-fill-color:#1F77B4;" fill="#1F77B4" fill-opacity="1.0"><path style="stroke:none" d="M 0 5.32 L 0 249.88 C 0 252.82 2.38 255.2 5.32 255.2 L 647.83 255.2 C 650.77 255.2 653.15 252.82 653.15 249.88 L 653.15 5.32 C 653.15 2.38 650.77 0 647.83 0 L 5.32 0 C 2.38 0 0 2.38 0 5.32 Z" /></g><g style="--ltx-fill-color:#FFFFFF;" fill="#FFFFFF" fill-opacity="1.0"><path style="stroke:none" d="M 1.38 5.32 L 1.38 249.88 C 1.38 252.05 3.15 253.82 5.32 253.82 L 647.83 253.82 C 650 253.82 651.77 252.05 651.77 249.88 L 651.77 5.32 C 651.77 3.15 650 1.38 647.83 1.38 L 5.32 1.38 C 3.15 1.38 1.38 3.15 1.38 5.32 Z" /></g><g fill-opacity="1.0" transform="matrix(1.0 0.0 0.0 1.0 21.07 16.65)"><foreignobject style="--ltx-fo-width:44.16em;--ltx-fo-height:16.29em;--ltx-fo-depth:0.25em;font-size:10pt;" height="228.81" overflow="visible" transform="matrix(1 0 0 -1 0 225.35)" width="611.05"><span class="ltx_foreignobject_container"><span class="ltx_foreignobject_content">
<span id="A6.F6.p2.pic1.1" class="ltx_inline-block ltx_minipage ltx_align_bottom" style="width:44.16em;">
<span id="A6.F6.p2.pic1.1.1" class="ltx_p"><span id="A6.F6.p2.pic1.1.1.1" class="ltx_text ltx_font_bold" style="--ltx-fg-color:#000000;">Q<span id="A6.F6.p2.pic1.1.1.1.1" class="ltx_text ltx_font_medium">: Who is faster in real life, a tortoise or a hare? 
<br class="ltx_break">
<br class="ltx_break"></span>A (en)<span id="A6.F6.p2.pic1.1.1.1.2" class="ltx_text ltx_font_medium">: In real life, a hare is much faster than a tortoise. The story of the tortoise and the hare is a fable that teaches a lesson about perseverance, not about actual animal speeds. 
<br class="ltx_break">
<br class="ltx_break"></span>A (es)<span id="A6.F6.p2.pic1.1.1.1.3" class="ltx_text ltx_font_medium">: La liebre es mucho más rápida que la tortuga en la vida real. 
<br class="ltx_break">
<br class="ltx_break"></span>A (ca)<span id="A6.F6.p2.pic1.1.1.1.4" class="ltx_text ltx_font_medium">: La llebre és més ràpida que la tortuga al món real. 
<br class="ltx_break">
<br class="ltx_break"></span>A (gl)<span id="A6.F6.p2.pic1.1.1.1.5" class="ltx_text ltx_font_medium">: Na vida real, unha lebre é moito máis rápida que unha tartaruga. 
<br class="ltx_break">
<br class="ltx_break"></span>A (eu)<span id="A6.F6.p2.pic1.1.1.1.6" class="ltx_text ltx_font_medium">: Erbia da azkarragoa. Dortokek batez beste 10-15 km/h-ko abiadura hartzen dute, bitartean erbiek 30-40 km/h-ko abiadura har dezakete.</span></span></span>
</span></span></span></foreignobject></g></g></svg>