</span></span></span></foreignobject></g><g fill-opacity="1.0" transform="matrix(1.0 0.0 0.0 1.0 11.55 13.24)"><foreignobject style="--ltx-fo-width:45.53em;--ltx-fo-height:16.81em;--ltx-fo-depth:0.22em;font-size:10pt;" height="235.69" overflow="visible" transform="matrix(1 0 0 -1 0 232.61)" width="630.01"><span class="ltx_foreignobject_container"><span class="ltx_foreignobject_content">
<span id="A6.SS1.p4.pic1.2" class="ltx_inline-block ltx_minipage ltx_align_bottom" style="width:45.53em;">
<span id="A6.SS1.p4.pic1.2.1" class="ltx_p"><span id="A6.SS1.p4.pic1.2.1.1" class="ltx_text ltx_font_bold" style="--ltx-fg-color:#000000;">Purpose:<span id="A6.SS1.p4.pic1.2.1.1.1" class="ltx_text ltx_font_medium"> single repair attempt for a failed specification; specifications failing again are discarded</span></span></span>
<span id="A6.SS1.p4.pic1.2.2" class="ltx_p"><span id="A6.SS1.p4.pic1.2.2.1" class="ltx_text ltx_font_bold" style="--ltx-fg-color:#000000;">Input:<span id="A6.SS1.p4.pic1.2.2.1.1" class="ltx_text ltx_font_medium"> the original specification and the verifier’s failure list</span></span></span>
<span id="A6.SS1.p4.pic1.2.3" class="ltx_p"><span id="A6.SS1.p4.pic1.2.3.1" class="ltx_text ltx_font_bold" style="--ltx-fg-color:#000000;">Output:<span id="A6.SS1.p4.pic1.2.3.1.1" class="ltx_text ltx_font_medium"> a complete, revised specification JSON</span></span></span>
<span id="A6.SS1.p4.pic1.2.4" class="ltx_p"><span id="A6.SS1.p4.pic1.2.4.1" class="ltx_text ltx_font_bold" style="--ltx-fg-color:#000000;">Instruction<span id="A6.SS1.p4.pic1.2.4.1.1" class="ltx_text ltx_font_medium"> — <span id="A6.SS1.p4.pic1.2.4.1.1.1" class="ltx_text ltx_font_italic">repairs must preserve the sampled design cell</span></span></span></span><span class="ltx_rule" style="width:100%;height:0.3pt;--ltx-fg-color:#999999;--ltx-bg-color:#999999;display:inline-block;"> </span>
<span id="A6.SS1.p4.pic1.2.5" class="ltx_p ltx_align_left"><span id="A6.SS1.p4.pic1.2.5.1" class="ltx_text ltx_font_typewriter" style="--ltx-fg-color:#000000;">You are refining a PersEvalBench scenario specification that failed verification. You will receive the original scenario and a list of rule failures with suggestions.</span></span>
<span id="A6.SS1.p4.pic1.2.6" class="ltx_p ltx_align_left"><span id="A6.SS1.p4.pic1.2.6.1" class="ltx_text ltx_font_typewriter" style="--ltx-fg-color:#000000;">Fix the scenario to address all failures while preserving the core intent (same scene type, error pattern, and preference relation).</span></span>
<span id="A6.SS1.p4.pic1.2.7" class="ltx_p ltx_align_left"><span id="A6.SS1.p4.pic1.2.7.1" class="ltx_text ltx_font_typewriter" style="--ltx-fg-color:#000000;">Return a complete JSON object with all scenario fields, parseable directly.</span></span>
</span></span></span></foreignobject></g></g></svg>