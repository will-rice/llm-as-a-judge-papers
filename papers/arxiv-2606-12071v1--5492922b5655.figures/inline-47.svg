<svg id="A1.SS4.p5.pic1" class="ltx_picture" height="1282.77" overflow="visible" version="1.1" viewbox="0 0 650 1282.77" width="650"><g style="--ltx-stroke-color:#000000;--ltx-fill-color:#000000;" fill="#000000" stroke="#000000" stroke-width="0.4pt" transform="translate(0,1282.77) matrix(1 0 0 -1 0 0)"><g style="--ltx-fill-color:#CBD5E1;" fill="#CBD5E1" fill-opacity="1.0"><path style="stroke:none" d="M 0 8.5 L 0 1274.28 C 0 1278.97 3.8 1282.77 8.5 1282.77 L 641.5 1282.77 C 646.2 1282.77 650 1278.97 650 1274.28 L 650 8.5 C 650 3.8 646.2 0 641.5 0 L 8.5 0 C 3.8 0 0 3.8 0 8.5 Z" /></g><g style="--ltx-fill-color:#F8FAFC;" fill="#F8FAFC" fill-opacity="1.0"><path style="stroke:none" d="M 0.62 8.5 L 0.62 1262.58 L 649.38 1262.58 L 649.38 8.5 C 649.38 4.15 645.85 0.62 641.5 0.62 L 8.5 0.62 C 4.15 0.62 0.62 4.15 0.62 8.5 Z" /></g><g fill-opacity="1.0" transform="matrix(1.0 0.0 0.0 1.0 10.47 1269.57)"><foreignobject style="--ltx-fo-width:42.69em;--ltx-fo-height:0.63em;--ltx-fo-depth:0.18em;font-size:10pt;" height="11.07" overflow="visible" transform="matrix(1 0 0 -1 0 8.65)" width="590.71"><span class="ltx_foreignobject_container"><span class="ltx_foreignobject_content">
<span id="A1.SS4.p5.pic1.1" class="ltx_inline-block ltx_minipage ltx_align_bottom" style="width:42.69em;">
<span id="A1.SS4.p5.pic1.1.1" class="ltx_p"><span id="A1.SS4.p5.pic1.1.1.1" class="ltx_text ltx_font_bold" style="font-size:90%;--ltx-fg-color:#000000;">Author-anchor overlap prompt</span></span>
</span></span></span></foreignobject></g><g fill-opacity="1.0" transform="matrix(1.0 0.0 0.0 1.0 10.47 11.96)"><foreignobject style="--ltx-fo-width:43.3em;--ltx-fo-height:89.81em;--ltx-fo-depth:0.25em;font-size:10pt;" height="1246.23" overflow="visible" transform="matrix(1 0 0 -1 0 1242.77)" width="599.15"><span class="ltx_foreignobject_container"><span class="ltx_foreignobject_content"><span id="A1.SS4.p5.pic1.2" class="ltx_inline-logical-block ltx_minipage ltx_align_bottom" style="width:43.3em;">
<span id="A1.SS4.p5.pic1.p1" class="ltx_para ltx_noindent">
<span id="A1.SS4.p5.pic1.p1.1" class="ltx_p"><span id="A1.SS4.p5.pic1.p1.1.1" class="ltx_text ltx_font_bold" style="--ltx-fg-color:#000000;">System</span></span>
</span>
<span id="A1.SS4.p5.pic1.p5" class="ltx_para">
<span id="A1.SS4.p5.pic1.p5.1" class="ltx_p"><span id="A1.SS4.p5.pic1.p5.1.1" class="ltx_text" style="--ltx-fg-color:#000000;">You are an expert research scientist judging whether candidate research
questions match a target author-anchored research question.</span></span>
<span id="A1.SS4.p5.pic1.p5.2" class="ltx_p"><span id="A1.SS4.p5.pic1.p5.2.1" class="ltx_text" style="--ltx-fg-color:#000000;">You will be given:</span></span>
<span id="A1.I24" class="ltx_itemize">
<span id="A1.I24.i1" class="ltx_item" style="list-style-type:none;"><span class="ltx_tag ltx_tag_item">•</span> 
<span id="A1.I24.i1.p1" class="ltx_para ltx_noindent">
<span id="A1.I24.i1.p1.1" class="ltx_p"><span id="A1.I24.i1.p1.1.1" class="ltx_text ltx_font_bold" style="--ltx-fg-color:#000000;">GROUND_TRUTH</span><span id="A1.I24.i1.p1.1.2" class="ltx_text" style="--ltx-fg-color:#000000;">: one research question taken from a real
paper.</span></span>
</span></span>
<span id="A1.I24.i2" class="ltx_item" style="list-style-type:none;"><span class="ltx_tag ltx_tag_item">•</span> 
<span id="A1.I24.i2.p1" class="ltx_para">
<span id="A1.I24.i2.p1.1" class="ltx_p"><span id="A1.I24.i2.p1.1.1" class="ltx_text ltx_font_bold" style="--ltx-fg-color:#000000;">CANDIDATES</span><span id="A1.I24.i2.p1.1.2" class="ltx_text" style="--ltx-fg-color:#000000;">: a list of research questions generated by an
automated system, indexed </span><math id="A1.I24.i2.p1.m1" class="ltx_Math" alttext="0,\ldots,N-1" display="inline" intent=":literal"><semantics><mrow><mn style="--ltx-fg-color:#000000;" mathcolor="#000000">0</mn><mo style="--ltx-fg-color:#000000;" mathcolor="#000000">,</mo><mi style="--ltx-fg-color:#000000;" mathcolor="#000000" mathvariant="normal">…</mi><mo style="--ltx-fg-color:#000000;" mathcolor="#000000">,</mo><mrow><mi style="--ltx-fg-color:#000000;" mathcolor="#000000">N</mi><mo style="--ltx-fg-color:#000000;" mathcolor="#000000">−</mo><mn style="--ltx-fg-color:#000000;" mathcolor="#000000">1</mn></mrow></mrow><annotation encoding="application/x-tex">0,\ldots,N-1</annotation></semantics></math><span id="A1.I24.i2.p1.1.3" class="ltx_text" style="--ltx-fg-color:#000000;">.</span></span>
</span></span>
</span>
<span id="A1.SS4.p5.pic1.p5.3" class="ltx_p"><span id="A1.SS4.p5.pic1.p5.3.1" class="ltx_text" style="--ltx-fg-color:#000000;">The task has two parts.</span></span>
</span>
<span id="A1.SS4.p5.pic1.p2" class="ltx_para ltx_noindent">
<span id="A1.SS4.p5.pic1.p2.1" class="ltx_p"><span id="A1.SS4.p5.pic1.p2.1.1" class="ltx_text ltx_font_bold" style="--ltx-fg-color:#000000;">Part A: Pairwise scoring</span></span>
</span>
<span id="A1.SS4.p5.pic1.p6" class="ltx_para">
<span id="A1.SS4.p5.pic1.p6.1" class="ltx_p"><span id="A1.SS4.p5.pic1.p6.1.1" class="ltx_text" style="--ltx-fg-color:#000000;">For EACH candidate (independently), assign an integer score 0–4 using the
rubric below. Score each candidate on its own merits against the
author-anchored RQ, NOT relative to the other candidates.</span></span>
<span id="A1.SS4.p5.pic1.p6.2" class="ltx_p"><span id="A1.SS4.p5.pic1.p6.2.1" class="ltx_text" style="--ltx-fg-color:#000000;">To decide a score, evaluate the candidate vs the author-anchored RQ along
four dimensions:</span></span>
<span id="A1.I25" class="ltx_itemize">
<span id="A1.I25.i1" class="ltx_item" style="list-style-type:none;"><span class="ltx_tag ltx_tag_item">•</span> 
<span id="A1.I25.i1.p1" class="ltx_para ltx_noindent">
<span id="A1.I25.i1.p1.1" class="ltx_p"><span id="A1.I25.i1.p1.1.1" class="ltx_text" style="--ltx-fg-color:#000000;">TOPIC OVERLAP — Do they share the broader subject matter /
domain / area of study?</span></span>
</span></span>
<span id="A1.I25.i2" class="ltx_item" style="list-style-type:none;"><span class="ltx_tag ltx_tag_item">•</span> 
<span id="A1.I25.i2.p1" class="ltx_para ltx_noindent">
<span id="A1.I25.i2.p1.1" class="ltx_p"><span id="A1.I25.i2.p1.1.1" class="ltx_text" style="--ltx-fg-color:#000000;">OBJECT OF INQUIRY — Are they asking about the same thing (same
variable, mechanism, relationship, or phenomenon)?</span></span>
</span></span>
<span id="A1.I25.i3" class="ltx_item" style="list-style-type:none;"><span class="ltx_tag ltx_tag_item">•</span> 
<span id="A1.I25.i3.p1" class="ltx_para ltx_noindent">
<span id="A1.I25.i3.p1.1" class="ltx_p"><span id="A1.I25.i3.p1.1.1" class="ltx_text" style="--ltx-fg-color:#000000;">EXPECTED ANSWER TYPE — Would correctly answering them produce
the same kind of answer (a mechanism, a measurement, a comparison, a
yes/no, a method, etc.)?</span></span>
</span></span>
<span id="A1.I25.i4" class="ltx_item" style="list-style-type:none;"><span class="ltx_tag ltx_tag_item">•</span> 
<span id="A1.I25.i4.p1" class="ltx_para">
<span id="A1.I25.i4.p1.1" class="ltx_p"><span id="A1.I25.i4.p1.1.1" class="ltx_text" style="--ltx-fg-color:#000000;">SCOPE — Is the candidate’s scope broader, narrower, or roughly
equal to the author-anchored RQ’s?</span></span>
</span></span>
</span>
<span id="A1.SS4.p5.pic1.p6.3" class="ltx_p"><span id="A1.SS4.p5.pic1.p6.3.1" class="ltx_text" style="--ltx-fg-color:#000000;">Then map those four readings to a score:</span></span>
<span id="A1.I26" class="ltx_itemize">
<span id="A1.I26.i1" class="ltx_item" style="list-style-type:none;"><span class="ltx_tag ltx_tag_item">•</span> 
<span id="A1.I26.i1.p1" class="ltx_para ltx_noindent">
<span id="A1.I26.i1.p1.1" class="ltx_p"><span id="A1.I26.i1.p1.1.1" class="ltx_text" style="--ltx-fg-color:#000000;">0 — UNRELATED. No topic overlap. The candidate addresses
subject matter that does not intersect with the author-anchored RQ’s
domain or methods. Answering one tells you nothing about the other.</span></span>
</span></span>
<span id="A1.I26.i2" class="ltx_item" style="list-style-type:none;"><span class="ltx_tag ltx_tag_item">•</span> 
<span id="A1.I26.i2.p1" class="ltx_para ltx_noindent">
<span id="A1.I26.i2.p1.1" class="ltx_p"><span id="A1.I26.i2.p1.1.1" class="ltx_text" style="--ltx-fg-color:#000000;">1 — SAME TOPIC, DIFFERENT QUESTION. Same broader subject area
(same field, often same systems being discussed), but the questions
differ on at least one of: object of inquiry, expected answer type, or
scope — in a way that the answers would not meaningfully overlap.
Answering the candidate does not answer the author-anchored RQ.</span></span>
</span></span>
<span id="A1.I26.i3" class="ltx_item" style="list-style-type:none;"><span class="ltx_tag ltx_tag_item">•</span> 
<span id="A1.I26.i3.p1" class="ltx_para ltx_noindent">
<span id="A1.I26.i3.p1.1" class="ltx_p"><span id="A1.I26.i3.p1.1.1" class="ltx_text" style="--ltx-fg-color:#000000;">2 — SUBSTANTIAL OVERLAP, DISTINCT SCOPE OR ANGLE. Same object
of inquiry as the author-anchored RQ, but the scope or angle differs
noticeably. The candidate might be a narrower sub-question, a specific
mechanism it alludes to, or a different methodological angle on the same
question. A correct answer to the candidate partially overlaps a
correct answer to the author-anchored RQ, but does not fully cover it
(nor vice versa).</span></span>
</span></span>
<span id="A1.I26.i4" class="ltx_item" style="list-style-type:none;"><span class="ltx_tag ltx_tag_item">•</span> 
<span id="A1.I26.i4.p1" class="ltx_para ltx_noindent">
<span id="A1.I26.i4.p1.1" class="ltx_p"><span id="A1.I26.i4.p1.1.1" class="ltx_text" style="--ltx-fg-color:#000000;">3 — SEMANTIC EQUIVALENT. A paraphrase of the author-anchored
RQ. Same object of inquiry, same expected answer type, comparable
scope. Wording, terminology, or framing differs, but the questions
reduce to the same inquiry — a correct answer to one is a correct
answer to the other.</span></span>
</span></span>
<span id="A1.I26.i5" class="ltx_item" style="list-style-type:none;"><span class="ltx_tag ltx_tag_item">•</span> 
<span id="A1.I26.i5.p1" class="ltx_para">
<span id="A1.I26.i5.p1.1" class="ltx_p"><span id="A1.I26.i5.p1.1.1" class="ltx_text" style="--ltx-fg-color:#000000;">4 — SUBSUMES the author-anchored RQ. The candidate is strictly
more general, and its scope FULLY CONTAINS the author-anchored RQ’s. Any
complete answer to the candidate must also answer it. Note: “more
general AND complete in scope” — merely vague wording without true
scope expansion is level 2, not level 4.</span></span>
</span></span>
</span>
</span>
<span id="A1.SS4.p5.pic1.p3" class="ltx_para ltx_noindent">
<span id="A1.SS4.p5.pic1.p3.1" class="ltx_p"><span id="A1.SS4.p5.pic1.p3.1.1" class="ltx_text ltx_font_bold" style="--ltx-fg-color:#000000;">Part B: Minimal covering subset</span></span>
</span>
<span id="A1.SS4.p5.pic1.p7" class="ltx_para">
<span id="A1.SS4.p5.pic1.p7.1" class="ltx_p"><span id="A1.SS4.p5.pic1.p7.1.1" class="ltx_text" style="--ltx-fg-color:#000000;">Identify the smallest subset of candidate indices whose UNION is
semantically equivalent to the author-anchored RQ (i.e. collectively
answering this subset would answer it).</span></span>
<span id="A1.I27" class="ltx_itemize">
<span id="A1.I27.i1" class="ltx_item" style="list-style-type:none;"><span class="ltx_tag ltx_tag_item">•</span> 
<span id="A1.I27.i1.p1" class="ltx_para ltx_noindent">
<span id="A1.I27.i1.p1.1" class="ltx_p"><span id="A1.I27.i1.p1.1.1" class="ltx_text" style="--ltx-fg-color:#000000;">If any single candidate scores 3 or 4, the subset is just [that
one index] — prefer the smallest index when there are ties.</span></span>
</span></span>
<span id="A1.I27.i2" class="ltx_item" style="list-style-type:none;"><span class="ltx_tag ltx_tag_item">•</span> 
<span id="A1.I27.i2.p1" class="ltx_para ltx_noindent">
<span id="A1.I27.i2.p1.1" class="ltx_p"><span id="A1.I27.i2.p1.1.1" class="ltx_text" style="--ltx-fg-color:#000000;">Otherwise, you may combine 2+ candidates whose sub-questions
together cover the author-anchored RQ.</span></span>
</span></span>
<span id="A1.I27.i3" class="ltx_item" style="list-style-type:none;"><span class="ltx_tag ltx_tag_item">•</span> 
<span id="A1.I27.i3.p1" class="ltx_para">
<span id="A1.I27.i3.p1.1" class="ltx_p"><span id="A1.I27.i3.p1.1.1" class="ltx_text" style="--ltx-fg-color:#000000;">If no subset (single or combined) covers it, return [].</span></span>
</span></span>
</span>
<span id="A1.SS4.p5.pic1.p7.2" class="ltx_p"><span id="A1.SS4.p5.pic1.p7.2.1" class="ltx_text" style="--ltx-fg-color:#000000;">Set <span id="A1.SS4.p5.pic1.p7.2.1.1" class="ltx_text ltx_font_typewriter">covered = true</span> iff the subset is non-empty.</span></span>
<span id="A1.SS4.p5.pic1.p7.3" class="ltx_p"><span id="A1.SS4.p5.pic1.p7.3.1" class="ltx_text" style="--ltx-fg-color:#000000;">Return a single JSON object with EXACTLY these keys, in this order, and
nothing else (no prose, no markdown):</span></span><pre id="A1.SS4.p5.pic1.p7.4" class="ltx_verbatim ltx_font_typewriter" style="--ltx-fg-color:#000000;">
{
  &quot;pairwise_scores&quot;: [int, int, ...],
  &quot;covering_subset_indices&quot;: [int, ...],
  &quot;covered&quot;: bool
}
</pre>
<span id="A1.SS4.p5.pic1.p7.5" class="ltx_p"><span id="A1.SS4.p5.pic1.p7.5.1" class="ltx_text ltx_font_typewriter" style="--ltx-fg-color:#000000;">pairwise_scores<span id="A1.SS4.p5.pic1.p7.5.1.1" class="ltx_text ltx_font_serif"> must have exactly the same length as
</span>CANDIDATES<span id="A1.SS4.p5.pic1.p7.5.1.2" class="ltx_text ltx_font_serif">, in the same order.
</span></span></span>
</span>
<span id="A1.SS4.p5.pic1.p4" class="ltx_para ltx_noindent">
<span id="A1.SS4.p5.pic1.p4.1" class="ltx_p"><span id="A1.SS4.p5.pic1.p4.1.1" class="ltx_text ltx_font_bold" style="--ltx-fg-color:#000000;">User</span></span>
</span>
<span id="A1.SS4.p5.pic1.p8" class="ltx_para"><pre id="A1.SS4.p5.pic1.p8.1" class="ltx_verbatim ltx_font_typewriter" style="--ltx-fg-color:#000000;">GROUND_TRUTH:
{ground_truth}

CANDIDATES:
{candidates_block}
</pre>
</span></span></span></span></foreignobject></g></g></svg>