<span id="A3.p1.pic1.2.1" class="ltx_p"><span id="A3.p1.pic1.2.1.1" class="ltx_text" style="--ltx-fg-color:#000000;">### TASK
<br class="ltx_break">Given the title and abstract of a paper, determine whether the paper introduces a new dataset. Respond with &quot;true&quot; if the paper introduces a new dataset; otherwise, respond with &quot;false&quot;. 
<br class="ltx_break"></span></span>
<span id="A3.p1.pic1.2.2" class="ltx_p"><span id="A3.p1.pic1.2.2.1" class="ltx_text" style="--ltx-fg-color:#000000;">### INPUT 
<br class="ltx_break">Title: 
<br class="ltx_break">{{ title }} 
<br class="ltx_break"></span></span>
<span id="A3.p1.pic1.2.3" class="ltx_p"><span id="A3.p1.pic1.2.3.1" class="ltx_text" style="--ltx-fg-color:#000000;">Abstract: 
<br class="ltx_break">{{ abstract }} 
<br class="ltx_break"></span></span>
<span id="A3.p1.pic1.2.4" class="ltx_p"><span id="A3.p1.pic1.2.4.1" class="ltx_text" style="--ltx-fg-color:#000000;">### OUTPUT FORMAT 
<br class="ltx_break">Return a JSON response in the following format:
<br class="ltx_break">{{
<br class="ltx_break">&quot;explanation&quot;: &quot;Very short explanation why the answer is true or false&quot;,
<br class="ltx_break">&quot;answer&quot;: &quot;Final boolean answer between true or false&quot;
<br class="ltx_break">}}
<br class="ltx_break"></span></span>
<span id="A3.p1.pic1.2.5" class="ltx_p"><span id="A3.p1.pic1.2.5.1" class="ltx_text" style="--ltx-fg-color:#000000;">### RESPONSE</span></span>
