<svg id="A6.SS1.p3.pic1" class="ltx_picture" height="1123.05" overflow="visible" version="1.1" viewbox="0 0 653.15 1123.05" width="653.15"><g style="--ltx-stroke-color:#000000;--ltx-fill-color:#000000;" fill="#000000" stroke="#000000" stroke-width="0.4pt" transform="translate(0,1123.05) matrix(1 0 0 -1 0 0)"><g style="--ltx-fill-color:#737373;" fill="#737373" fill-opacity="1.0"><path style="stroke:none" d="M 0 2.08 L 0 1120.98 C 0 1122.12 0.93 1123.05 2.08 1123.05 L 651.07 1123.05 C 652.22 1123.05 653.15 1122.12 653.15 1120.98 L 653.15 2.08 C 653.15 0.93 652.22 0 651.07 0 L 2.08 0 C 0.93 0 0 0.93 0 2.08 Z" /></g><g style="--ltx-fill-color:#FAFAFA;" fill="#FAFAFA" fill-opacity="1.0"><path style="stroke:none" d="M 0.69 2.08 L 0.69 1101.5 L 652.46 1101.5 L 652.46 2.08 C 652.46 1.31 651.84 0.69 651.07 0.69 L 2.08 0.69 C 1.31 0.69 0.69 1.31 0.69 2.08 Z" /></g><g style="--ltx-fill-color:#595959;" fill="#595959" fill-opacity="1.0"><path style="stroke:none" d="M 0.69 1102.19 L 0.69 1120.98 C 0.69 1121.74 1.31 1122.36 2.08 1122.36 L 651.07 1122.36 C 651.84 1122.36 652.46 1121.74 652.46 1120.98 L 652.46 1102.19 Z" /></g><g fill-opacity="1.0" transform="matrix(1.0 0.0 0.0 1.0 11.55 1108.82)"><foreignobject style="--ltx-fo-width:39.59em;--ltx-fo-height:0.69em;--ltx-fo-depth:0.19em;font-size:10pt;" height="12.3" overflow="visible" transform="matrix(1 0 0 -1 0 9.61)" width="547.81"><span class="ltx_foreignobject_container"><span class="ltx_foreignobject_content">
<span id="A6.SS1.p3.pic1.1" class="ltx_inline-block ltx_minipage ltx_align_bottom" style="width:39.59em;">
<span id="A6.SS1.p3.pic1.1.1" class="ltx_p"><span id="A6.SS1.p3.pic1.1.1.1" class="ltx_text ltx_font_bold" style="--ltx-fg-color:#FFFFFF;">Prompt 3  Specification verifier</span></span>
</span></span></span></foreignobject></g><g fill-opacity="1.0" transform="matrix(1.0 0.0 0.0 1.0 11.55 13.24)"><foreignobject style="--ltx-fo-width:45.53em;--ltx-fo-height:77.96em;--ltx-fo-depth:0.22em;font-size:10pt;" height="1081.87" overflow="visible" transform="matrix(1 0 0 -1 0 1078.8)" width="630.01"><span class="ltx_foreignobject_container"><span class="ltx_foreignobject_content">
<span id="A6.SS1.p3.pic1.2" class="ltx_inline-block ltx_minipage ltx_align_bottom" style="width:45.53em;">
<span id="A6.SS1.p3.pic1.2.1" class="ltx_p"><span id="A6.SS1.p3.pic1.2.1.1" class="ltx_text ltx_font_bold" style="--ltx-fg-color:#000000;">Purpose:<span id="A6.SS1.p3.pic1.2.1.1.1" class="ltx_text ltx_font_medium"> reject or repair specifications whose label logic is unsound, before any dialogue is generated</span></span></span>
<span id="A6.SS1.p3.pic1.2.2" class="ltx_p"><span id="A6.SS1.p3.pic1.2.2.1" class="ltx_text ltx_font_bold" style="--ltx-fg-color:#000000;">Input:<span id="A6.SS1.p3.pic1.2.2.1.1" class="ltx_text ltx_font_medium"> one scenario specification</span></span></span>
<span id="A6.SS1.p3.pic1.2.3" class="ltx_p"><span id="A6.SS1.p3.pic1.2.3.1" class="ltx_text ltx_font_bold" style="--ltx-fg-color:#000000;">Output:<span id="A6.SS1.p3.pic1.2.3.1.1" class="ltx_text ltx_font_medium"> <span id="A6.SS1.p3.pic1.2.3.1.1.1" class="ltx_text ltx_font_typewriter">{passes, failures[ ]}</span></span></span></span>
<span id="A6.SS1.p3.pic1.2.4" class="ltx_p"><span id="A6.SS1.p3.pic1.2.4.1" class="ltx_text ltx_font_bold" style="--ltx-fg-color:#000000;">Role and stakes<span id="A6.SS1.p3.pic1.2.4.1.1" class="ltx_text ltx_font_medium"> — <span id="A6.SS1.p3.pic1.2.4.1.1.1" class="ltx_text ltx_font_italic">sets the acceptance bar</span></span></span></span><span class="ltx_rule" style="width:100%;height:0.3pt;--ltx-fg-color:#999999;--ltx-bg-color:#999999;display:inline-block;"> </span>
<span id="A6.SS1.p3.pic1.2.5" class="ltx_p ltx_align_left"><span id="A6.SS1.p3.pic1.2.5.1" class="ltx_text ltx_font_typewriter" style="--ltx-fg-color:#000000;">You are a strict quality verifier for PersEvalBench benchmark scenarios. Check whether a specification passes all of the following rules. Be rigorous -- a pass means the scenario will become part of the final benchmark.</span></span>
<span id="A6.SS1.p3.pic1.2.6" class="ltx_p"><span id="A6.SS1.p3.pic1.2.6.1" class="ltx_text ltx_font_bold" style="--ltx-fg-color:#000000;">Label-soundness rules (1–3)<span id="A6.SS1.p3.pic1.2.6.1.1" class="ltx_text ltx_font_medium"> — <span id="A6.SS1.p3.pic1.2.6.1.1.1" class="ltx_text ltx_font_italic">apply to every scenario</span></span></span></span><span class="ltx_rule" style="width:100%;height:0.3pt;--ltx-fg-color:#999999;--ltx-bg-color:#999999;display:inline-block;"> </span>
<span id="A6.SS1.p3.pic1.2.7" class="ltx_p ltx_align_left"><span id="A6.SS1.p3.pic1.2.7.1" class="ltx_text ltx_font_typewriter" style="--ltx-fg-color:#000000;">Rule 1 (RIGHT satisfies State A and the main task): the RIGHT option must correctly apply the currently applicable State A and fulfill the user’s main task requirement.</span></span>
<span id="A6.SS1.p3.pic1.2.8" class="ltx_p ltx_align_left"><span id="A6.SS1.p3.pic1.2.8.1" class="ltx_text ltx_font_typewriter" style="--ltx-fg-color:#000000;">Rule 2 (trap is not obviously worse): the TRAP option must match RIGHT in quality, price level, completeness, and length -- a plausible good response that simply applies the wrong state.</span></span>
<span id="A6.SS1.p3.pic1.2.9" class="ltx_p ltx_align_left"><span id="A6.SS1.p3.pic1.2.9.1" class="ltx_text ltx_font_typewriter" style="--ltx-fg-color:#000000;">Rule 3 (single error): the scenario must have exactly one primary error mechanism; if the trap could be explained by multiple distinct error types, it fails.</span></span>
<span id="A6.SS1.p3.pic1.2.10" class="ltx_p"><span id="A6.SS1.p3.pic1.2.10.1" class="ltx_text ltx_font_bold" style="--ltx-fg-color:#000000;">Family rules (4–7)<span id="A6.SS1.p3.pic1.2.10.1.1" class="ltx_text ltx_font_medium"> — <span id="A6.SS1.p3.pic1.2.10.1.1.1" class="ltx_text ltx_font_italic">checks specific to error families</span></span></span></span><span class="ltx_rule" style="width:100%;height:0.3pt;--ltx-fg-color:#999999;--ltx-bg-color:#999999;display:inline-block;"> </span>
<span id="A6.SS1.p3.pic1.2.11" class="ltx_p ltx_align_left"><span id="A6.SS1.p3.pic1.2.11.1" class="ltx_text ltx_font_typewriter" style="--ltx-fg-color:#000000;">Rule 4 (omission errors depend on A): for complete_omission, partial_omission, underweighting, and explicit_violation, the RIGHT option must genuinely depend on State A; if a generic response would also satisfy the task, the scenario fails.</span></span>
<span id="A6.SS1.p3.pic1.2.12" class="ltx_p ltx_align_left"><span id="A6.SS1.p3.pic1.2.12.1" class="ltx_text ltx_font_typewriter" style="--ltx-fg-color:#000000;">Rule 5 (over-use errors depend on B): for irrelevant_use and over_dominance, the trap must be favored only if the wrong state is applied, not because it is generically bad.</span></span>
<span id="A6.SS1.p3.pic1.2.13" class="ltx_p ltx_align_left"><span id="A6.SS1.p3.pic1.2.13.1" class="ltx_text ltx_font_typewriter" style="--ltx-fg-color:#000000;">Rule 6 (stale errors change the choice): for stale_superseded, the old and new preference values must produce genuinely different choices.</span></span>
<span id="A6.SS1.p3.pic1.2.14" class="ltx_p ltx_align_left"><span id="A6.SS1.p3.pic1.2.14.1" class="ltx_text ltx_font_typewriter" style="--ltx-fg-color:#000000;">Rule 7 (scope leakage is scope-only): for scope_leakage, the only differentiator between RIGHT and TRAP must be scope applicability, not factual errors or quality issues.</span></span>
<span id="A6.SS1.p3.pic1.2.15" class="ltx_p"><span id="A6.SS1.p3.pic1.2.15.1" class="ltx_text ltx_font_bold" style="--ltx-fg-color:#000000;">Structural rules (8–11)<span id="A6.SS1.p3.pic1.2.15.1.1" class="ltx_text ltx_font_medium"> — <span id="A6.SS1.p3.pic1.2.15.1.1.1" class="ltx_text ltx_font_italic">relation typing and subtype separability</span></span></span></span><span class="ltx_rule" style="width:100%;height:0.3pt;--ltx-fg-color:#999999;--ltx-bg-color:#999999;display:inline-block;"> </span>
<span id="A6.SS1.p3.pic1.2.16" class="ltx_p ltx_align_left"><span id="A6.SS1.p3.pic1.2.16.1" class="ltx_text ltx_font_typewriter" style="--ltx-fg-color:#000000;">Rule 8 (A--B relation structure): the A--B relation must match the declared state-relation type (same attribute for a different holder; same attribute in a different scope; same attribute at a different time; an old value superseded by a new one; a hard constraint versus a soft preference; two simultaneously applicable states; a cross-domain-transferable state versus a domain-specific one; an adjacent fact that is not an actual preference).</span></span>
<span id="A6.SS1.p3.pic1.2.17" class="ltx_p ltx_align_left"><span id="A6.SS1.p3.pic1.2.17.1" class="ltx_text ltx_font_typewriter" style="--ltx-fg-color:#000000;">Rule 9 (why_tricky is substantive): the explanation must give a specific, non-trivial reason a model would choose the trap.</span></span>
<span id="A6.SS1.p3.pic1.2.18" class="ltx_p ltx_align_left"><span id="A6.SS1.p3.pic1.2.18.1" class="ltx_text ltx_font_typewriter" style="--ltx-fg-color:#000000;">Rule 10 (complete-omission request independence): for complete_omission only, the target request must not mention or implicitly lock to State A’s content; an assistant that has never seen State A must be able to give a complete, high-quality answer.</span></span>
<span id="A6.SS1.p3.pic1.2.19" class="ltx_p ltx_align_left"><span id="A6.SS1.p3.pic1.2.19.1" class="ltx_text ltx_font_typewriter" style="--ltx-fg-color:#000000;">Rule 11 (partial-omission separability): for partial_omission only, State A must contain at least two clearly separable requirements, and the error logic must name which requirement is satisfied and which is omitted; the requirements must be independently verifiable.</span></span>
<span id="A6.SS1.p3.pic1.2.20" class="ltx_p"><span id="A6.SS1.p3.pic1.2.20.1" class="ltx_text ltx_font_bold" style="--ltx-fg-color:#000000;">Output contract and calibration<span id="A6.SS1.p3.pic1.2.20.1.1" class="ltx_text ltx_font_medium"> — <span id="A6.SS1.p3.pic1.2.20.1.1.1" class="ltx_text ltx_font_italic">machine-readable verdict with per-rule feedback</span></span></span></span><span class="ltx_rule" style="width:100%;height:0.3pt;--ltx-fg-color:#999999;--ltx-bg-color:#999999;display:inline-block;"> </span>
<span id="A6.SS1.p3.pic1.2.21" class="ltx_p ltx_align_left"><span id="A6.SS1.p3.pic1.2.21.1" class="ltx_text ltx_font_typewriter" style="--ltx-fg-color:#000000;">Return a JSON object:</span></span>
<span id="A6.SS1.p3.pic1.2.22" class="ltx_p ltx_align_left"><span id="A6.SS1.p3.pic1.2.22.1" class="ltx_text ltx_font_typewriter" style="--ltx-fg-color:#000000;">{&quot;passes&quot;: true/false, &quot;failures&quot;: [{&quot;rule_number&quot;: &lt;int&gt;, &quot;rule_name&quot;: &quot;...&quot;, &quot;explanation&quot;: &quot;why it fails this rule&quot;, &quot;suggestion&quot;: &quot;how to fix it&quot;}]}</span></span>
<span id="A6.SS1.p3.pic1.2.23" class="ltx_p ltx_align_left"><span id="A6.SS1.p3.pic1.2.23.1" class="ltx_text ltx_font_typewriter" style="--ltx-fg-color:#000000;">If passes is true, failures must be an empty array. Be strict but fair: fail only rules that are genuinely violated.</span></span>
</span></span></span></foreignobject></g></g></svg>