<svg id="A5.SS3.p1.pic1" class="ltx_picture" height="355.23" overflow="visible" version="1.1" viewbox="0 0 477.38 355.23" width="477.38"><g style="--ltx-stroke-color:#000000;--ltx-fill-color:#000000;" fill="#000000" stroke="#000000" stroke-width="0.4pt" transform="translate(0,355.23) matrix(1 0 0 -1 0 0)"><g style="--ltx-fill-color:#333333;" fill="#333333" fill-opacity="1.0"><path style="stroke:none" d="M 0 5.91 L 0 349.32 C 0 352.58 2.64 355.23 5.91 355.23 L 471.47 355.23 C 474.73 355.23 477.38 352.58 477.38 349.32 L 477.38 5.91 C 477.38 2.64 474.73 0 471.47 0 L 5.91 0 C 2.64 0 0 2.64 0 5.91 Z" /></g><g style="--ltx-fill-color:#F9F9F9;" fill="#F9F9F9" fill-opacity="1.0"><path style="stroke:none" d="M 1.97 5.91 L 1.97 349.32 C 1.97 351.5 3.73 353.26 5.91 353.26 L 471.47 353.26 C 473.65 353.26 475.41 351.5 475.41 349.32 L 475.41 5.91 C 475.41 3.73 473.65 1.97 471.47 1.97 L 5.91 1.97 C 3.73 1.97 1.97 3.73 1.97 5.91 Z" /></g><g fill-opacity="1.0" transform="matrix(1.0 0.0 0.0 1.0 21.65 16.47)"><foreignobject style="--ltx-fo-width:31.37em;--ltx-fo-height:23.49em;--ltx-fo-depth:0.19em;font-size:10pt;" height="327.67" overflow="visible" transform="matrix(1 0 0 -1 0 324.98)" width="434.07"><span class="ltx_foreignobject_container"><span class="ltx_foreignobject_content"><span id="A5.SS3.p1.pic1.1" class="ltx_inline-logical-block ltx_minipage ltx_align_bottom" style="width:31.37em;">
<span id="A5.SS3.p1.pic1.p1" class="ltx_para ltx_noindent">
<span id="A5.SS3.p1.pic1.p1.1" class="ltx_p"><span id="A5.SS3.p1.pic1.p1.1.1" class="ltx_text ltx_font_bold" style="--ltx-fg-color:#000000;">System Prompt:</span><span id="A5.SS3.p1.pic1.p1.1.2" class="ltx_text" style="--ltx-fg-color:#000000;"> You are an expert in analyzing whether the evaluation process of LLM-as-a-Judge exhibits {bias type}. {The definition of the bias} </span>
<br class="ltx_break"></span>
</span>
<span id="A5.SS3.p1.pic1.p2" class="ltx_para ltx_noindent">
<span id="A5.SS3.p1.pic1.p2.1" class="ltx_p"><span id="A5.SS3.p1.pic1.p2.1.1" class="ltx_text ltx_font_bold" style="--ltx-fg-color:#000000;">User Prompt:</span><span id="A5.SS3.p1.pic1.p2.1.2" class="ltx_text" style="--ltx-fg-color:#000000;"> You are given an instruction, two candidate outputs, an LLM-as-a-Judge decision. The evaluation was conducted using {evaluator model}.</span></span>
</span>
<span id="A5.SS3.p1.pic1.p3" class="ltx_para">
<span id="A5.SS3.p1.pic1.p3.1" class="ltx_p"><span id="A5.SS3.p1.pic1.p3.1.1" class="ltx_text" style="--ltx-fg-color:#000000;">Your task is to determine whether there is potential {bias type} in how the LLM evaluated the responses. Notably, the capabilities of evaluator model (e.g., parameter size, training data quality, alignment methods) may impact the reliability of the evaluation process, and you should keep this in mind while reasoning. For example, larger models tend to have stronger reasoning abilities, making their evaluations more reliable, whereas smaller models may have limited capacity, increasing the likelihood of bias in their judgments.
<br class="ltx_break"></span></span>
<span id="A5.SS3.p1.pic1.p3.2" class="ltx_p"><span id="A5.SS3.p1.pic1.p3.2.1" class="ltx_text" style="--ltx-fg-color:#000000;">### Instruction: {input}</span></span>
<span id="A5.SS3.p1.pic1.p3.3" class="ltx_p"><span id="A5.SS3.p1.pic1.p3.3.1" class="ltx_text" style="--ltx-fg-color:#000000;">### Options: {options}</span></span>
<span id="A5.SS3.p1.pic1.p3.4" class="ltx_p"><span id="A5.SS3.p1.pic1.p3.4.1" class="ltx_text" style="--ltx-fg-color:#000000;">### LLM-as-a-Judge Decision: {LLM judgment} 
<br class="ltx_break"></span></span>
<span id="A5.SS3.p1.pic1.p3.5" class="ltx_p"><span id="A5.SS3.p1.pic1.p3.5.1" class="ltx_text" style="--ltx-fg-color:#000000;">- If no verbosity bias is detected, reply only with: “No”.</span></span>
<span id="A5.SS3.p1.pic1.p3.6" class="ltx_p"><span id="A5.SS3.p1.pic1.p3.6.1" class="ltx_text" style="--ltx-fg-color:#000000;">- If verbosity bias is detected, reply only with: “Yes”.</span></span>
</span></span></span></span></foreignobject></g></g></svg>