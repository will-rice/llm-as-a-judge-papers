<span id="S2.F2.pic3.1.1" class="ltx_p"><span id="S2.F2.pic3.1.1.1" class="ltx_text ltx_font_bold" style="--ltx-fg-color:#000000;">Question Two:<span id="S2.F2.pic3.1.1.1.1" class="ltx_text ltx_font_medium"> On April 1st 2023, Abigail acquired telephones under a two-year lease agreement. The terms of the lease require an initial payment of $3,000, followed by a payment of $9,000 on March 31st 2024 and an additional $9,000 on March 31st 2025. Show the impact of this lease arrangement on Abigail’s financial statements for the year ended 31 December 2023 under IFRS 16?</span></span></span>
