<svg id="A5.F11.pic1" class="ltx_picture ltx_centering" height="906.9" overflow="visible" version="1.1" viewbox="0 0 653.15 906.9" width="653.15"><g style="--ltx-stroke-color:#000000;--ltx-fill-color:#000000;" fill="#000000" stroke="#000000" stroke-width="0.4pt" transform="translate(0,906.9) matrix(1 0 0 -1 0 0)"><g style="--ltx-fill-color:#E5A8E2;" fill="#E5A8E2" fill-opacity="1.0"><path style="stroke:none" d="M 0 5.91 L 0 901 C 0 904.26 2.64 906.9 5.91 906.9 L 647.24 906.9 C 650.51 906.9 653.15 904.26 653.15 901 L 653.15 5.91 C 653.15 2.64 650.51 0 647.24 0 L 5.91 0 C 2.64 0 0 2.64 0 5.91 Z" /></g><g style="--ltx-fill-color:#FFF1FE;" fill="#FFF1FE" fill-opacity="1.0"><path style="stroke:none" d="M 1.97 5.91 L 1.97 885.48 L 651.18 885.48 L 651.18 5.91 C 651.18 3.73 649.42 1.97 647.24 1.97 L 5.91 1.97 C 3.73 1.97 1.97 3.73 1.97 5.91 Z" /></g><g fill-opacity="1.0" transform="matrix(1.0 0.0 0.0 1.0 21.65 891.39)"><foreignobject style="--ltx-fo-width:44.07em;--ltx-fo-height:0.69em;--ltx-fo-depth:0em;font-size:10pt;" height="9.61" overflow="visible" transform="matrix(1 0 0 -1 0 9.61)" width="609.8"><span class="ltx_foreignobject_container"><span class="ltx_foreignobject_content">
<span id="A5.F11.pic1.1" class="ltx_inline-block ltx_minipage ltx_align_bottom" style="width:44.07em;">
<span id="A5.F11.pic1.1.1" class="ltx_p"><span id="A5.F11.pic1.1.1.1" class="ltx_text" style="--ltx-fg-color:#FFFFFF;">Annotation Guideline</span></span>
</span></span></span></foreignobject></g><g fill-opacity="1.0" transform="matrix(1.0 0.0 0.0 1.0 21.65 17.24)"><foreignobject style="--ltx-fo-width:44.07em;--ltx-fo-height:61.9em;--ltx-fo-depth:0.25em;font-size:10pt;" height="859.9" overflow="visible" transform="matrix(1 0 0 -1 0 856.44)" width="609.8"><span class="ltx_foreignobject_container"><span class="ltx_foreignobject_content">
<span id="A5.F11.pic1.2" class="ltx_inline-block ltx_minipage ltx_align_bottom" style="width:44.07em;">
<span id="A5.F11.pic1.2.1" class="ltx_p"><span id="A5.F11.pic1.2.1.1" class="ltx_text ltx_font_bold" style="--ltx-fg-color:#000000;">### User Study Description<span id="A5.F11.pic1.2.1.1.1" class="ltx_text ltx_font_medium">:</span></span></span>
<span id="A5.F11.pic1.2.2" class="ltx_p"><span id="A5.F11.pic1.2.2.1" class="ltx_text" style="--ltx-fg-color:#000000;">Dear participants,</span></span>
<span id="A5.F11.pic1.2.3" class="ltx_p"><span id="A5.F11.pic1.2.3.1" class="ltx_text" style="--ltx-fg-color:#000000;">Thanks for attending our user study. Our user study investigates how participants simulate model behavior based on provided explanations—an approach known as the simulatability test. You will be presented with explanations and predefined label options (depending on the dataset) and are asked to select the most appropriate label based solely on the explanations. We employ three datasets for this study: <span id="A5.F11.pic1.2.3.1.1" class="ltx_text ltx_font_bold">AG News</span> (news topic classification), <span id="A5.F11.pic1.2.3.1.2" class="ltx_text ltx_font_bold">SST-2</span> (sentiment analysis), and <span id="A5.F11.pic1.2.3.1.3" class="ltx_text ltx_font_bold">SNLI</span> (natural language inference). The explanations are generated by models of varying sizes; however, model identities and sizes are not disclosed to participants.</span></span>
<span id="A5.F11.pic1.2.4" class="ltx_p"><span id="A5.F11.pic1.2.4.1" class="ltx_text ltx_font_bold" style="--ltx-fg-color:#000000;">### Dataset Structure:<span id="A5.F11.pic1.2.4.1.1" class="ltx_text"></span></span></span>
<span id="A5.F11.pic1.2.5" class="ltx_p"><span id="A5.F11.pic1.2.5.1" class="ltx_text ltx_font_bold" style="--ltx-fg-color:#000000;">AG News:<span id="A5.F11.pic1.2.5.1.1" class="ltx_text ltx_font_medium"> This dataset consists of news articles. The task is to determine whether the topic of each article pertains to one of the following categories: Sports, World, Business, or Science/Technology.</span></span></span>
<span id="A5.F11.pic1.2.6" class="ltx_p"><span id="A5.F11.pic1.2.6.1" class="ltx_text ltx_font_bold" style="--ltx-fg-color:#000000;">AG News Example<span id="A5.F11.pic1.2.6.1.1" class="ltx_text ltx_font_medium">: {example}</span></span></span>
<span id="A5.F11.pic1.2.7" class="ltx_p"><span id="A5.F11.pic1.2.7.1" class="ltx_text ltx_font_bold" style="--ltx-fg-color:#000000;">SST-2<span id="A5.F11.pic1.2.7.1.1" class="ltx_text ltx_font_medium"> (Stanford Sentiment Treebank): This dataset comprises movie reviews. The task is to assess the sentiment expressed in each review and classify it as either Positive or Negative.</span></span></span>
<span id="A5.F11.pic1.2.8" class="ltx_p"><span id="A5.F11.pic1.2.8.1" class="ltx_text ltx_font_bold" style="--ltx-fg-color:#000000;">SST2 Example<span id="A5.F11.pic1.2.8.1.1" class="ltx_text ltx_font_medium">: {example}</span></span></span>
<span id="A5.F11.pic1.2.9" class="ltx_p"><span id="A5.F11.pic1.2.9.1" class="ltx_text ltx_font_bold" style="--ltx-fg-color:#000000;">SNLI<span id="A5.F11.pic1.2.9.1.1" class="ltx_text ltx_font_medium"> (Stanford Natural Language Inference): Each example consists of a premise and a hypothesis. The task is to determine the relationship between the two, categorizing it as either Entailment, Contradiction, or Neutral based on the information in the premise.</span></span></span>
<span id="A5.F11.pic1.2.10" class="ltx_p"><span id="A5.F11.pic1.2.10.1" class="ltx_text ltx_font_bold" style="--ltx-fg-color:#000000;">SNLI Example<span id="A5.F11.pic1.2.10.1.1" class="ltx_text ltx_font_medium">: {example}</span></span></span>
<span id="A5.F11.pic1.2.11" class="ltx_p"><span id="A5.F11.pic1.2.11.1" class="ltx_text ltx_font_italic" style="--ltx-fg-color:#000000;">Entailment<span id="A5.F11.pic1.2.11.1.1" class="ltx_text ltx_font_upright"> means the hypothesis must be true if the premise is true. </span>Contradiction<span id="A5.F11.pic1.2.11.1.2" class="ltx_text ltx_font_upright"> means the hypothesis must be false if the premise is true. </span>Neutral<span id="A5.F11.pic1.2.11.1.3" class="ltx_text ltx_font_upright"> means the hypothesis might be true, or might not — we can’t tell just from the premise.</span></span></span>
<span id="A5.F11.pic1.2.12" class="ltx_p"><span id="A5.F11.pic1.2.12.1" class="ltx_text ltx_font_bold" style="--ltx-fg-color:#000000;">### User Study Instruction:<span id="A5.F11.pic1.2.12.1.1" class="ltx_text"></span></span></span>
<span id="A5.F11.pic1.2.13" class="ltx_p"><span id="A5.F11.pic1.2.13.1" class="ltx_text" style="--ltx-fg-color:#000000;">You will be provided with 15 instances to evaluate. Each instance includes a single input field, depending on the dataset: a news article (AG News), a movie review (SST-2), or a premise–hypothesis pair (SNLI). If the text is applicable to multiple labels, please select the most appropriate one and report them in the follow-up question. If the text is applicable to multiple labels, please select the most appropriate one and report them in the follow-up question (“<span id="A5.F11.pic1.2.13.1.1" class="ltx_text ltx_font_italic">Do you think the text is applicable to multiple labels? (optional)</span>”).</span></span>
</span></span></span></foreignobject></g></g></svg>