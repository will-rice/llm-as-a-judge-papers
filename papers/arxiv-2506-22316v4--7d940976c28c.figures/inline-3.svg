<span id="S3.F3.pic1.2.14" class="ltx_p"><span id="S3.F3.pic1.2.14.1" class="ltx_text" style="--ltx-fg-color:#FF0000;">Score 4: <span id="S3.F3.pic1.2.14.1.1" class="ltx_text ltx_font_typewriter">{score4_description}</span><span id="S3.F3.pic1.2.14.1.2" class="ltx_text"></span></span></span>
