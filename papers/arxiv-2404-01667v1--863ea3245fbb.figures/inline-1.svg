<svg id="A1.F6.pic1" class="ltx_picture ltx_centering" height="517.6" overflow="visible" version="1.1" viewbox="0 0 632.62 517.6" width="632.62"><g style="--ltx-stroke-color:#000000;--ltx-fill-color:#000000;" fill="#000000" stroke="#000000" stroke-width="0.4pt" transform="translate(0,517.6) matrix(1 0 0 -1 0 0) translate(316.31,0) translate(0,258.8)"><g style="--ltx-stroke-color:#BF0000;--ltx-fill-color:#FFBFBF;" fill="#FFBFBF" stroke="#BF0000"><path d="M 309.11 258.52 L -309.11 258.52 C -312.93 258.52 -316.03 255.42 -316.03 251.6 L -316.03 -251.6 C -316.03 -255.42 -312.93 -258.52 -309.11 -258.52 L 309.11 -258.52 C 312.93 -258.52 316.03 -255.42 316.03 -251.6 L 316.03 251.6 C 316.03 255.42 312.93 258.52 309.11 258.52 Z M -316.03 -258.52" /></g><g style="--ltx-stroke-color:#000000;--ltx-fill-color:#000000;" fill="#000000" stroke="#000000" transform="matrix(1.0 0.0 0.0 1.0 -295.28 -3.46)"><foreignobject style="--ltx-fo-width:42.68em;--ltx-fo-height:17.43em;--ltx-fo-depth:16.93em;font-size:10pt;" height="475.54" overflow="visible" transform="matrix(1 0 0 -1 0 241.23)" width="590.57"><span class="ltx_foreignobject_container"><span class="ltx_foreignobject_content">
<span id="A1.F6.pic1.1" class="ltx_inline-block ltx_minipage ltx_align_middle" style="width:42.68em;">
<span id="A1.F6.pic1.1.1" class="ltx_p"><span id="A1.F6.pic1.1.1.1" class="ltx_text ltx_font_bold">Introduction</span></span>
<span id="A1.F6.pic1.1.2" class="ltx_p">In this task, you will assess summaries of a passage using five metrics. Your assessment will be used to investigate the performance of automated models.</span>
<span id="A1.F6.pic1.1.3" class="ltx_p"><span id="A1.F6.pic1.1.3.1" class="ltx_text ltx_font_bold">Task steps</span></span>
<span id="A1.I1" class="ltx_enumerate">
<span id="A1.I1.i1" class="ltx_item" style="list-style-type:none;"><span class="ltx_tag ltx_tag_item">1.</span> 
<span id="A1.I1.i1.p1" class="ltx_para">
<span id="A1.I1.i1.p1.1" class="ltx_p"><span id="A1.I1.i1.p1.1.1" class="ltx_text ltx_font_bold">Read the main passage:</span> Begin by thoroughly reading the main passage. Understand the key points, main ideas, and any critical details in the text.</span>
</span></span>
<span id="A1.I1.i2" class="ltx_item" style="list-style-type:none;"><span class="ltx_tag ltx_tag_item">2.</span> 
<span id="A1.I1.i2.p1" class="ltx_para">
<span id="A1.I1.i2.p1.1" class="ltx_p"><span id="A1.I1.i2.p1.1.1" class="ltx_text ltx_font_bold">Read the corresponding summary:</span> After reading the main passage, carefully examine the summary. Pay attention to how well it represents the essential information in the main passage.</span>
</span></span>
<span id="A1.I1.i3" class="ltx_item" style="list-style-type:none;"><span class="ltx_tag ltx_tag_item">3.</span> 
<span id="A1.I1.i3.p1" class="ltx_para">
<span id="A1.I1.i3.p1.1" class="ltx_p"><span id="A1.I1.i3.p1.1.1" class="ltx_text ltx_font_bold">Rate the summary:</span> Assign a rating on all the metrics defined above. Score all the metrics that apply (i.e., consider each metric independently)</span>
</span></span>
<span id="A1.I1.i4" class="ltx_item" style="list-style-type:none;"><span class="ltx_tag ltx_tag_item">4.</span> 
<span id="A1.I1.i4.p1" class="ltx_para">
<span id="A1.I1.i4.p1.1" class="ltx_p"><span id="A1.I1.i4.p1.1.1" class="ltx_text ltx_font_bold">Comment (optional):</span> You may provide a brief comment explaining why you assigned a certain score. When leaving a comment, mention specific strengths or weaknesses you observed in the summary.</span>
</span></span>
</span>
<span id="A1.F6.pic1.1.4" class="ltx_p"><span id="A1.F6.pic1.1.4.1" class="ltx_text ltx_font_bold">Additional notes</span></span>
<span id="A1.I2" class="ltx_itemize">
<span id="A1.I2.i1" class="ltx_item" style="list-style-type:none;"><span class="ltx_tag ltx_tag_item">•</span> 
<span id="A1.I2.i1.p1" class="ltx_para">
<span id="A1.I2.i1.p1.1" class="ltx_p">Strive for <span id="A1.I2.i1.p1.1.1" class="ltx_text ltx_font_italic">consistency</span> in your ratings throughout the task. Use the same criteria and judgment for similar summaries.</span>
</span></span>
<span id="A1.I2.i2" class="ltx_item" style="list-style-type:none;"><span class="ltx_tag ltx_tag_item">•</span> 
<span id="A1.I2.i2.p1" class="ltx_para">
<span id="A1.I2.i2.p1.1" class="ltx_p">If you encounter any summaries that are offensive, irrelevant, or clearly off topic, please flag them for review by leaving a comment specifying the problem.</span>
</span></span>
<span id="A1.I2.i3" class="ltx_item" style="list-style-type:none;"><span class="ltx_tag ltx_tag_item">•</span> 
<span id="A1.I2.i3.p1" class="ltx_para">
<span id="A1.I2.i3.p1.1" class="ltx_p">Take your time and evaluate each summary carefully. Your thoughtful assessments are invaluable for our study.</span>
</span></span>
<span id="A1.I2.i4" class="ltx_item" style="list-style-type:none;"><span class="ltx_tag ltx_tag_item">•</span> 
<span id="A1.I2.i4.p1" class="ltx_para">
<span id="A1.I2.i4.p1.1" class="ltx_p">Try not to overthink the answer: Let your instinct guide you.</span>
</span></span>
</span>
</span></span></span></foreignobject></g></g></svg>