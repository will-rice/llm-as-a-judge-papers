<svg id="A1.F5.pic1" class="ltx_picture" height="486.99" overflow="visible" version="1.1" viewbox="0 0 653.15 486.99" width="653.15"><g style="--ltx-stroke-color:#000000;--ltx-fill-color:#000000;" fill="#000000" stroke="#000000" stroke-width="0.4pt" transform="translate(0,486.99) matrix(1 0 0 -1 0 0) translate(-1.49,0)"><g style="--ltx-fill-color:#000000;" fill="#000000" fill-opacity="1.0"><path style="stroke:none" d="M 0 5.91 L 0 468.94 C 0 472.2 2.64 474.85 5.91 474.85 L 650.23 474.85 C 653.49 474.85 656.13 472.2 656.13 468.94 L 656.13 5.91 C 656.13 2.64 653.49 0 650.23 0 L 5.91 0 C 2.64 0 0 2.64 0 5.91 Z" /></g><g style="--ltx-fill-color:#FFFFFF;" fill="#FFFFFF" fill-opacity="1.0"><path style="stroke:none" d="M 1.97 5.91 L 1.97 468.94 C 1.97 471.11 3.73 472.88 5.91 472.88 L 650.23 472.88 C 652.4 472.88 654.16 471.11 654.16 468.94 L 654.16 5.91 C 654.16 3.73 652.4 1.97 650.23 1.97 L 5.91 1.97 C 3.73 1.97 1.97 3.73 1.97 5.91 Z" /></g><g transform="matrix(1.0 0.0 0.0 1.0 15 464.84)"><g style="--ltx-stroke-color:#000000;--ltx-fill-color:#000000;" class="ltx_nestedsvg" fill="#000000" stroke="#000000" stroke-width="0.4pt" transform="matrix(1 0 0 1 0 0)"><g style="--ltx-fill-color:#FFFFFF;" fill="#FFFFFF" fill-opacity="1.0"><path style="stroke:none" d="M 0 2.95 L 0 19.19 C 0 20.82 1.32 22.14 2.95 22.14 L 224.27 22.14 C 225.9 22.14 227.22 20.82 227.22 19.19 L 227.22 2.95 C 227.22 1.32 225.9 0 224.27 0 L 2.95 0 C 1.32 0 0 1.32 0 2.95 Z" /></g><g style="--ltx-fill-color:#000000;" fill="#000000" fill-opacity="1.0"><path style="stroke:none" d="M 0 2.95 L 0 19.19 C 0 20.82 1.32 22.14 2.95 22.14 L 224.27 22.14 C 225.9 22.14 227.22 20.82 227.22 19.19 L 227.22 2.95 C 227.22 1.32 225.9 0 224.27 0 L 2.95 0 C 1.32 0 0 1.32 0 2.95 Z" /></g><g fill-opacity="1.0" transform="matrix(1.0 0.0 0.0 1.0 11.81 7.61)"><foreignobject style="--ltx-fo-width:14.8em;--ltx-fo-height:0.69em;--ltx-fo-depth:0.19em;font-size:10pt;" height="12.3" overflow="visible" transform="matrix(1 0 0 -1 0 9.61)" width="204.75"><span class="ltx_foreignobject_container"><span class="ltx_foreignobject_content"><span id="A1.F5.pic1.1" class="ltx_text" style="--ltx-fg-color:#FFFFFF;">Step 3: Scoring Prompt Template</span></span></span></foreignobject></g></g></g><g fill-opacity="1.0" transform="matrix(1.0 0.0 0.0 1.0 21.65 445.49)"><foreignobject style="--ltx-fo-width:44.29em;--ltx-fo-height:0.69em;--ltx-fo-depth:31.2em;font-size:10pt;" height="441.33" overflow="visible" transform="matrix(1 0 0 -1 0 9.61)" width="612.85"><span class="ltx_foreignobject_container"><span class="ltx_foreignobject_content">
<span id="A1.F5.pic1.2" class="ltx_inline-block ltx_minipage" style="width:44.29em;">
<span id="A1.F5.pic1.2.1" class="ltx_p ltx_parbox ltx_align_top" style="width:442.9pt;"><span id="A1.F5.pic1.2.1.1" class="ltx_text" style="--ltx-fg-color:#000000;">Step 3 is to rate the summary considering the actual error instances and their severity. </span>
<br class="ltx_break"><span id="A1.F5.pic1.2.1.2" class="ltx_text" style="--ltx-fg-color:#000000;">Read the following criteria carefully: *** criteria: self.criteria[criteria] ***. </span>
<br class="ltx_break"><span id="A1.F5.pic1.2.1.3" class="ltx_text" style="--ltx-fg-color:#000000;">Consider the observed error instances and their severity scores (0 for no error to 10 meaning severe error): *** list_of_instances ***. </span>
<br class="ltx_break"><span id="A1.F5.pic1.2.1.4" class="ltx_text" style="--ltx-fg-color:#000000;">You do not have to agree with these severity scores, so please critically evaluate them when rating the summary.
Next, read the summary: ** data[’summary’] **. </span>
<br class="ltx_break"><span id="A1.F5.pic1.2.1.5" class="ltx_text" style="--ltx-fg-color:#000000;">Consider the original meeting transcript: * data[’transcript’] *. </span>
<br class="ltx_break">
<br class="ltx_break"><span id="A1.F5.pic1.2.1.6" class="ltx_text" style="--ltx-fg-color:#000000;">Now, rate the summary with a single score from 0 to 5, where 0 means no impact at all (a really good summary) and 5 means a very high impact (a poor summary) regarding this error type.
Also, provide a short reasoning explaining why you rated the summary as you did.
Additionally, provide a certainty score indicating how confident you are in your rating, from 0 (not confident at all) to 10 (very confident).
Return your answer strictly in **valid JSON format**, using **double quotes** around all keys and string values. </span>
<br class="ltx_break"><span id="A1.F5.pic1.2.1.7" class="ltx_text" style="--ltx-fg-color:#000000;">The structure of your response should be exactly like this: </span>
<br class="ltx_break"><span id="A1.F5.pic1.2.1.8" class="ltx_text" style="--ltx-fg-color:#000000;">’{ &quot;reasoning&quot;: &quot;&lt;your reasoning&gt;&quot;, &quot;confidence&quot;: &lt;your certainty score&gt;, &quot;rating&quot;: &lt;score from 0 to 5&gt; } </span>
<br class="ltx_break"><span id="A1.F5.pic1.2.1.9" class="ltx_text" style="--ltx-fg-color:#000000;">Make sure to return only the JSON response, without any preambles, explanations, or extra text outside the JSON format.</span></span>
</span></span></span></foreignobject></g></g></svg>