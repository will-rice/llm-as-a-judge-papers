<span id="A7.p1.pic1.p5.pic1.2" class="ltx_inline-block ltx_minipage ltx_align_bottom" style="width:35.53em;">
<span id="A7.p1.pic1.p5.pic1.2.1" class="ltx_p">ParaScoreFree is a reference-free evaluation metric designed for paraphrase generation. It evaluates candidate paraphrases based on semantic similarity to the input source while encouraging lexical diversity. ParaScoreFree outputs a scalar quality score that combines BERT-based semantic similarity and normalized edit distance, offering a balance between meaning preservation and surface-level rewriting. It enables paraphrase evaluation without the need for gold reference texts, making it suitable for low-resource or open-domain settings.</span>
</span></span></span></foreignobject></g></g></svg>