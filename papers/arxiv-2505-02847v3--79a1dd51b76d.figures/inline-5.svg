<svg id="A7.SS0.SSS0.Px2.p7.pic1" class="ltx_picture" height="417.91" overflow="visible" version="1.1" viewbox="0 0 600 417.91" width="600"><g style="--ltx-stroke-color:#000000;--ltx-fill-color:#000000;" fill="#000000" stroke="#000000" stroke-width="0.4pt" transform="translate(0,417.91) matrix(1 0 0 -1 0 0)"><g style="--ltx-fill-color:#F5F5F5;" fill="#F5F5F5" fill-opacity="1.0"><path style="stroke:none" d="M 0 4.15 L 0 413.76 C 0 416.05 1.86 417.91 4.15 417.91 L 595.85 417.91 C 598.14 417.91 600 416.05 600 413.76 L 600 4.15 C 600 1.86 598.14 0 595.85 0 L 4.15 0 C 1.86 0 0 1.86 0 4.15 Z" /></g><g style="--ltx-stroke-color:#C8C8C8;--ltx-fill-color:#C8C8C8;--ltx-fg-color:#C8C8C8;" color="#C8C8C8" fill="#C8C8C8" stroke="#C8C8C8" stroke-width="1.0pt"><path style="fill:none" d="M 0 0 L 0 417.91" /></g><g style="--ltx-stroke-color:#C8C8C8;--ltx-fill-color:#C8C8C8;--ltx-fg-color:#C8C8C8;" color="#C8C8C8" fill="#C8C8C8" stroke="#C8C8C8" stroke-width="1.0pt"><path style="fill:none" d="M 597.23 417.91 L 600 0" /></g><g fill-opacity="1.0" transform="matrix(1.0 0.0 0.0 1.0 15.01 15.31)"><foreignobject style="--ltx-fo-width:39.23em;--ltx-fo-height:28.21em;--ltx-fo-depth:0.22em;font-size:10pt;" height="393.44" overflow="visible" transform="matrix(1 0 0 -1 0 390.36)" width="542.83"><span class="ltx_foreignobject_container"><span class="ltx_foreignobject_content">
<span id="A7.SS0.SSS0.Px2.p7.pic1.1" class="ltx_inline-block ltx_minipage ltx_align_bottom" style="width:39.23em;">
<span id="A7.SS0.SSS0.Px2.p7.pic1.1.1" class="ltx_p"><span id="A7.SS0.SSS0.Px2.p7.pic1.1.1.1" class="ltx_text ltx_font_typewriter" style="--ltx-fg-color:#000000;">*You will receive your current emotion. You have a total of 5 emotions. The higher the emotion, the higher your dialogue emotion at this time. The dialogue emotion is composed of dialogue participation and emotion, which represents whether the actor enjoys and invests in the current dialogue.
<br class="ltx_break"></span></span>
<span id="A7.SS0.SSS0.Px2.p7.pic1.1.2" class="ltx_p"><span id="A7.SS0.SSS0.Px2.p7.pic1.1.2.1" class="ltx_text ltx_font_typewriter" style="--ltx-fg-color:#000000;">*Emotion affects your different speaking styles, tones and responses. According to different emotions, you can respond according to the reactions of different emotions of the characters defined in the dialogue background:
<br class="ltx_break"></span></span>
<span id="A7.SS0.SSS0.Px2.p7.pic1.1.3" class="ltx_p"><span id="A7.SS0.SSS0.Px2.p7.pic1.1.3.1" class="ltx_text ltx_font_bold" style="--ltx-fg-color:#000000;">Emotion-S<span id="A7.SS0.SSS0.Px2.p7.pic1.1.3.1.1" class="ltx_text ltx_font_typewriter ltx_font_medium">: <math id="A7.SS0.SSS0.Px2.p7.pic1.m1" class="ltx_Math" alttext="\text{emotion-value}&gt;=100" display="inline" intent=":literal"><semantics><mrow><mtext style="--ltx-fg-color:#000000;" class="ltx_mathvariant_monospace" mathcolor="#000000">emotion-value</mtext><mo style="--ltx-fg-color:#000000;" mathcolor="#000000">&gt;=</mo><mn style="--ltx-fg-color:#000000;" mathcolor="#000000">100</mn></mrow><annotation encoding="application/x-tex">\text{emotion-value}&gt;=100</annotation></semantics></math>. Your emotion has reached the highest level. You can thank the NPC and say goodbye with &quot;goodbye&quot; or &quot;bye-bye&quot; to end the conversation directly.
<br class="ltx_break"></span></span></span>
<span id="A7.SS0.SSS0.Px2.p7.pic1.1.4" class="ltx_p"><span id="A7.SS0.SSS0.Px2.p7.pic1.1.4.1" class="ltx_text ltx_font_bold" style="--ltx-fg-color:#000000;">Emotion-A<span id="A7.SS0.SSS0.Px2.p7.pic1.1.4.1.1" class="ltx_text ltx_font_typewriter ltx_font_medium">: <math id="A7.SS0.SSS0.Px2.p7.pic1.m2" class="ltx_Math" alttext="100&gt;\text{emotion-value}&gt;=70" display="inline" intent=":literal"><semantics><mrow><mn style="--ltx-fg-color:#000000;" mathcolor="#000000">100</mn><mo style="--ltx-fg-color:#000000;" mathcolor="#000000">&gt;</mo><mtext style="--ltx-fg-color:#000000;" class="ltx_mathvariant_monospace" mathcolor="#000000">emotion-value</mtext><mo style="--ltx-fg-color:#000000;" mathcolor="#000000">&gt;=</mo><mn style="--ltx-fg-color:#000000;" mathcolor="#000000">70</mn></mrow><annotation encoding="application/x-tex">100&gt;\text{emotion-value}&gt;=70</annotation></semantics></math>. High emotion. At this time, your dialogue experience is relatively positive and your feedback is also relatively positive.
<br class="ltx_break"></span></span></span>
<span id="A7.SS0.SSS0.Px2.p7.pic1.1.5" class="ltx_p"><span id="A7.SS0.SSS0.Px2.p7.pic1.1.5.1" class="ltx_text ltx_font_bold" style="--ltx-fg-color:#000000;">Emotion-B<span id="A7.SS0.SSS0.Px2.p7.pic1.1.5.1.1" class="ltx_text ltx_font_typewriter ltx_font_medium">: <math id="A7.SS0.SSS0.Px2.p7.pic1.m3" class="ltx_Math" alttext="70&gt;\text{emotion-value}&gt;=40" display="inline" intent=":literal"><semantics><mrow><mn style="--ltx-fg-color:#000000;" mathcolor="#000000">70</mn><mo style="--ltx-fg-color:#000000;" mathcolor="#000000">&gt;</mo><mtext style="--ltx-fg-color:#000000;" class="ltx_mathvariant_monospace" mathcolor="#000000">emotion-value</mtext><mo style="--ltx-fg-color:#000000;" mathcolor="#000000">&gt;=</mo><mn style="--ltx-fg-color:#000000;" mathcolor="#000000">40</mn></mrow><annotation encoding="application/x-tex">70&gt;\text{emotion-value}&gt;=40</annotation></semantics></math>. Emotion-B: Medium emotion, you have no positive or negative feelings at this time.
<br class="ltx_break"></span></span></span>
<span id="A7.SS0.SSS0.Px2.p7.pic1.1.6" class="ltx_p"><span id="A7.SS0.SSS0.Px2.p7.pic1.1.6.1" class="ltx_text ltx_font_bold" style="--ltx-fg-color:#000000;">Emotion-C<span id="A7.SS0.SSS0.Px2.p7.pic1.1.6.1.1" class="ltx_text ltx_font_typewriter ltx_font_medium">: <math id="A7.SS0.SSS0.Px2.p7.pic1.m4" class="ltx_Math" alttext="40&gt;\text{emotion-value}&gt;=10" display="inline" intent=":literal"><semantics><mrow><mn style="--ltx-fg-color:#000000;" mathcolor="#000000">40</mn><mo style="--ltx-fg-color:#000000;" mathcolor="#000000">&gt;</mo><mtext style="--ltx-fg-color:#000000;" class="ltx_mathvariant_monospace" mathcolor="#000000">emotion-value</mtext><mo style="--ltx-fg-color:#000000;" mathcolor="#000000">&gt;=</mo><mn style="--ltx-fg-color:#000000;" mathcolor="#000000">10</mn></mrow><annotation encoding="application/x-tex">40&gt;\text{emotion-value}&gt;=10</annotation></semantics></math>. Low emotion, your conversation feeling is relatively negative at this time, and your feedback is also relatively negative.
<br class="ltx_break"></span></span></span>
<span id="A7.SS0.SSS0.Px2.p7.pic1.1.7" class="ltx_p"><span id="A7.SS0.SSS0.Px2.p7.pic1.1.7.1" class="ltx_text ltx_font_bold" style="--ltx-fg-color:#000000;">Emotion-F<span id="A7.SS0.SSS0.Px2.p7.pic1.1.7.1.1" class="ltx_text ltx_font_typewriter ltx_font_medium">: <math id="A7.SS0.SSS0.Px2.p7.pic1.m5" class="ltx_Math" alttext="10&gt;\text{emotion-value}" display="inline" intent=":literal"><semantics><mrow><mn style="--ltx-fg-color:#000000;" mathcolor="#000000">10</mn><mo style="--ltx-fg-color:#000000;" mathcolor="#000000">&gt;</mo><mtext style="--ltx-fg-color:#000000;" class="ltx_mathvariant_monospace" mathcolor="#000000">emotion-value</mtext></mrow><annotation encoding="application/x-tex">10&gt;\text{emotion-value}</annotation></semantics></math>. Your emotion has reached the most negative level, and you don’t want to continue the conversation. At this time, you should say goodbye with &quot;goodbye&quot; or &quot;bye-bye&quot; and end the conversation directly.
</span></span></span>
</span></span></span></foreignobject></g></g></svg>