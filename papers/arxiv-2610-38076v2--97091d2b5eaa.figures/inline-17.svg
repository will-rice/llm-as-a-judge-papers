<span id="A6.SSx4.SSS0.Px1.p4.pic1.2" class="ltx_inline-block ltx_minipage ltx_align_bottom" style="width:42.56em;">
<span id="A6.SSx4.SSS0.Px1.p4.pic1.2.1" class="ltx_p ltx_align_left"><span id="A6.SSx4.SSS0.Px1.p4.pic1.2.1.1" class="ltx_text ltx_font_typewriter" style="--ltx-fg-color:#000000;">You are given a question, the corresponding ground-truth answer and a prediction</span></span>
<span id="A6.SSx4.SSS0.Px1.p4.pic1.2.2" class="ltx_p ltx_align_left"><span id="A6.SSx4.SSS0.Px1.p4.pic1.2.2.1" class="ltx_text ltx_font_typewriter" style="--ltx-fg-color:#000000;">from a model. Compare the &quot;Ground-truth answer&quot; and the &quot;Prediction&quot; to determine</span></span>
<span id="A6.SSx4.SSS0.Px1.p4.pic1.2.3" class="ltx_p ltx_align_left"><span id="A6.SSx4.SSS0.Px1.p4.pic1.2.3.1" class="ltx_text ltx_font_typewriter" style="--ltx-fg-color:#000000;">how correctly the prediction answers the question. All information in the</span></span>
<span id="A6.SSx4.SSS0.Px1.p4.pic1.2.4" class="ltx_p ltx_align_left"><span id="A6.SSx4.SSS0.Px1.p4.pic1.2.4.1" class="ltx_text ltx_font_typewriter" style="--ltx-fg-color:#000000;">ground-truth answer should be present in the prediction, including numbers and</span></span>
<span id="A6.SSx4.SSS0.Px1.p4.pic1.2.5" class="ltx_p ltx_align_left"><span id="A6.SSx4.SSS0.Px1.p4.pic1.2.5.1" class="ltx_text ltx_font_typewriter" style="--ltx-fg-color:#000000;">dates. There should be no contradicting statements in the prediction. The prediction</span></span>
<span id="A6.SSx4.SSS0.Px1.p4.pic1.2.6" class="ltx_p ltx_align_left"><span id="A6.SSx4.SSS0.Px1.p4.pic1.2.6.1" class="ltx_text ltx_font_typewriter" style="--ltx-fg-color:#000000;">may contain extra information. If the prediction states something as a possibility,</span></span>
<span id="A6.SSx4.SSS0.Px1.p4.pic1.2.7" class="ltx_p ltx_align_left"><span id="A6.SSx4.SSS0.Px1.p4.pic1.2.7.1" class="ltx_text ltx_font_typewriter" style="--ltx-fg-color:#000000;">treat it as a definitive answer.</span></span>
<span id="A6.SSx4.SSS0.Px1.p4.pic1.2.8" class="ltx_p ltx_align_left"><span id="A6.SSx4.SSS0.Px1.p4.pic1.2.8.1" class="ltx_text ltx_font_typewriter" style="--ltx-fg-color:#000000;">Question: conversation</span></span>
<span id="A6.SSx4.SSS0.Px1.p4.pic1.2.9" class="ltx_p ltx_align_left"><span id="A6.SSx4.SSS0.Px1.p4.pic1.2.9.1" class="ltx_text ltx_font_typewriter" style="--ltx-fg-color:#000000;">Ground-truth answer: reference</span></span>
<span id="A6.SSx4.SSS0.Px1.p4.pic1.2.10" class="ltx_p ltx_align_left"><span id="A6.SSx4.SSS0.Px1.p4.pic1.2.10.1" class="ltx_text ltx_font_typewriter" style="--ltx-fg-color:#000000;">Prediction: prediction</span></span>
<span id="A6.SSx4.SSS0.Px1.p4.pic1.2.11" class="ltx_p ltx_align_left"><span id="A6.SSx4.SSS0.Px1.p4.pic1.2.11.1" class="ltx_text ltx_font_typewriter" style="--ltx-fg-color:#000000;">Correctness scale:</span></span>
<span id="A6.SSx4.SSS0.Px1.p4.pic1.2.12" class="ltx_p ltx_align_left"><span id="A6.SSx4.SSS0.Px1.p4.pic1.2.12.1" class="ltx_text ltx_font_typewriter" style="--ltx-fg-color:#000000;">5 = Fully correct: all key information present, no contradictions</span></span>
<span id="A6.SSx4.SSS0.Px1.p4.pic1.2.13" class="ltx_p ltx_align_left"><span id="A6.SSx4.SSS0.Px1.p4.pic1.2.13.1" class="ltx_text ltx_font_typewriter" style="--ltx-fg-color:#000000;">4 = Mostly correct: minor omissions or imprecision</span></span>
<span id="A6.SSx4.SSS0.Px1.p4.pic1.2.14" class="ltx_p ltx_align_left"><span id="A6.SSx4.SSS0.Px1.p4.pic1.2.14.1" class="ltx_text ltx_font_typewriter" style="--ltx-fg-color:#000000;">3 = Partially correct: some key details missing or ambiguous</span></span>
<span id="A6.SSx4.SSS0.Px1.p4.pic1.2.15" class="ltx_p ltx_align_left"><span id="A6.SSx4.SSS0.Px1.p4.pic1.2.15.1" class="ltx_text ltx_font_typewriter" style="--ltx-fg-color:#000000;">2 = Mostly incorrect: major omissions or contradictions</span></span>
<span id="A6.SSx4.SSS0.Px1.p4.pic1.2.16" class="ltx_p ltx_align_left"><span id="A6.SSx4.SSS0.Px1.p4.pic1.2.16.1" class="ltx_text ltx_font_typewriter" style="--ltx-fg-color:#000000;">1 = Incorrect: does not answer the question or contradicts ground truth</span></span>
<span id="A6.SSx4.SSS0.Px1.p4.pic1.2.17" class="ltx_p ltx_align_left"><span id="A6.SSx4.SSS0.Px1.p4.pic1.2.17.1" class="ltx_text ltx_font_typewriter" style="--ltx-fg-color:#000000;">Score (1-5):</span></span>
</span></span></span></foreignobject></g></g></svg>