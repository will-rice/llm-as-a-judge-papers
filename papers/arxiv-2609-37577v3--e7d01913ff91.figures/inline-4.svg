<span id="A2.SS2.p3.pic1.1" class="ltx_inline-block ltx_minipage ltx_align_bottom" style="width:39.97em;">
<span id="A2.SS2.p3.pic1.1.1" class="ltx_p"><span id="A2.SS2.p3.pic1.1.1.1" class="ltx_text ltx_font_bold" style="--ltx-fg-color:#FFFFFF;">Pairwise judging prompt (<span id="A2.SS2.p3.pic1.1.1.1.1" class="ltx_text ltx_font_smallcaps">ASAP 2.0</span>)</span></span>
</span></span></span></foreignobject></g><g fill-opacity="1.0" transform="matrix(1.0 0.0 0.0 1.0 8.57 15.58)"><foreignobject style="--ltx-fo-width:43.78em;--ltx-fo-height:51.69em;--ltx-fo-depth:0.22em;font-size:10pt;" height="718.38" overflow="visible" transform="matrix(1 0 0 -1 0 715.3)" width="605.79"><span class="ltx_foreignobject_container"><span class="ltx_foreignobject_content">
<span id="A2.SS2.p3.pic1.2" class="ltx_inline-block ltx_minipage ltx_align_bottom" style="width:43.78em;">
<span id="A2.SS2.p3.pic1.2.1" class="ltx_p ltx_align_left"><span id="A2.SS2.p3.pic1.2.1.1" class="ltx_text ltx_font_typewriter" style="--ltx-fg-color:#000000;">You are judging the overall (holistic) quality of a source-based, argumentative essay written by a school student in response to the writing prompt shown below. Quality is holistic: weigh everything that goes into a strong essay together, not any single feature in isolation.
</span></span>
<span id="A2.SS2.p3.pic1.2.2" class="ltx_p ltx_align_left"><span id="A2.SS2.p3.pic1.2.2.1" class="ltx_text ltx_font_typewriter" style="--ltx-fg-color:#000000;">What contributes to holistic quality: 
<br class="ltx_break">- whether the essay develops a clear, well-supported point of view on the issue, with genuine critical thinking (vs. a vague, simplistic, or missing position) 
<br class="ltx_break">- whether it uses appropriate, accurate examples, reasons, and evidence drawn from the source text(s) (vs. sparse, misused, or merely personal-opinion support) 
<br class="ltx_break">- whether it is well organized and focused, with coherence and smooth progression of ideas (vs. disjointed or unfocused) 
<br class="ltx_break">- command of language: varied, accurate, apt vocabulary and meaningful sentence variety (vs. weak word choice or monotonous/broken structure) 
<br class="ltx_break">- control of grammar, usage, and mechanics (vs. errors frequent or serious enough to obscure meaning)
</span></span>
<span id="A2.SS2.p3.pic1.2.3" class="ltx_p ltx_align_left"><span id="A2.SS2.p3.pic1.2.3.1" class="ltx_text ltx_font_typewriter" style="--ltx-fg-color:#000000;">---
</span></span>
<span id="A2.SS2.p3.pic1.2.4" class="ltx_p ltx_align_left"><span id="A2.SS2.p3.pic1.2.4.1" class="ltx_text ltx_font_typewriter" style="--ltx-fg-color:#000000;">The students first read the source article below, then wrote their essay in response to the writing prompt that follows. Use it to judge whether the essay’s evidence is accurate and genuinely drawn from the source (vs. vague, misremembered, or fabricated).
</span></span>
<span id="A2.SS2.p3.pic1.2.5" class="ltx_p ltx_align_left"><span id="A2.SS2.p3.pic1.2.5.1" class="ltx_text ltx_font_typewriter" style="--ltx-fg-color:#000000;">Source article — &quot;Making Mona Lisa Smile&quot; by Nick D’Alto:
</span></span>
<span id="A2.SS2.p3.pic1.2.6" class="ltx_p ltx_align_left"><span id="A2.SS2.p3.pic1.2.6.1" class="ltx_text ltx_font_typewriter" style="--ltx-fg-color:#000000;">[full article text omitted here, see <cite class="ltx_cite ltx_citemacro_cite"><a href="#bib.bib4" title class="ltx_ref">Crossley et al. (2025)</a></cite>]
</span></span>
<span id="A2.SS2.p3.pic1.2.7" class="ltx_p ltx_align_left"><span id="A2.SS2.p3.pic1.2.7.1" class="ltx_text ltx_font_typewriter" style="--ltx-fg-color:#000000;">---
</span></span>
