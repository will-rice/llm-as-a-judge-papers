</span></span></span>
<span id="A2.F14.pic1.2.2" class="ltx_p"><span id="A2.F14.pic1.2.2.1" class="ltx_text ltx_font_typewriter ltx_font_bold" style="font-size:90%;--ltx-fg-color:#000000;">Task:<span id="A2.F14.pic1.2.2.1.1" class="ltx_text ltx_font_medium"> Evaluate the </span>Model Response (<math id="A2.F14.pic1.m1" class="ltx_Math" alttext="M_{out}" display="inline" intent=":literal"><semantics><msub><mi style="--ltx-fg-color:#000000;" mathcolor="#000000">M</mi><mrow><mi style="--ltx-fg-color:#000000;" mathcolor="#000000">o</mi><mo lspace="0em" rspace="0em">​</mo><mi style="--ltx-fg-color:#000000;" mathcolor="#000000">u</mi><mo lspace="0em" rspace="0em">​</mo><mi style="--ltx-fg-color:#000000;" mathcolor="#000000">t</mi></mrow></msub><annotation encoding="application/x-tex">M_{out}</annotation></semantics></math>)<span id="A2.F14.pic1.2.2.1.2" class="ltx_text ltx_font_medium"> against the provided </span>Rubric (<math id="A2.F14.pic1.m2" class="ltx_Math" alttext="R" display="inline" intent=":literal"><semantics><mi style="--ltx-fg-color:#000000;" mathcolor="#000000">R</mi><annotation encoding="application/x-tex">R</annotation></semantics></math>)<span id="A2.F14.pic1.2.2.1.3" class="ltx_text ltx_font_medium">.
</span></span></span>
<span id="A2.F14.pic1.2.3" class="ltx_p"><span id="A2.F14.pic1.2.3.1" class="ltx_text ltx_font_typewriter ltx_font_bold" style="font-size:90%;--ltx-fg-color:#000000;">Instructions:<span id="A2.F14.pic1.2.3.1.1" class="ltx_text ltx_font_medium">
</span></span></span>
<span id="A2.I16" class="ltx_itemize">
<span id="A2.I16.i1" class="ltx_item" style="list-style-type:none;"><span class="ltx_tag ltx_tag_item">•</span> 
<span id="A2.I16.i1.p1" class="ltx_para">
<span id="A2.I16.i1.p1.1" class="ltx_p"><span id="A2.I16.i1.p1.1.1" class="ltx_text ltx_font_typewriter ltx_font_bold" style="font-size:90%;--ltx-fg-color:#000000;">Objective Verification:</span><span id="A2.I16.i1.p1.1.2" class="ltx_text ltx_font_typewriter" style="font-size:90%;--ltx-fg-color:#000000;"> For each criterion in the Rubric, determine if the Model Response satisfies it.
</span></span>
</span></span>
<span id="A2.I16.i2" class="ltx_item" style="list-style-type:none;"><span class="ltx_tag ltx_tag_item">•</span> 
<span id="A2.I16.i2.p1" class="ltx_para">
<span id="A2.I16.i2.p1.1" class="ltx_p"><span id="A2.I16.i2.p1.1.1" class="ltx_text ltx_font_typewriter ltx_font_bold" style="font-size:90%;--ltx-fg-color:#000000;">Binary Judgment:</span><span id="A2.I16.i2.p1.1.2" class="ltx_text ltx_font_typewriter" style="font-size:90%;--ltx-fg-color:#000000;"> Return true (Met) or false (Not Met).
</span></span>
</span></span>
<span id="A2.I16.i3" class="ltx_item" style="list-style-type:none;"><span class="ltx_tag ltx_tag_item">•</span> 
<span id="A2.I16.i3.p1" class="ltx_para">
<span id="A2.I16.i3.p1.1" class="ltx_p"><span id="A2.I16.i3.p1.1.1" class="ltx_text ltx_font_typewriter ltx_font_bold" style="font-size:90%;--ltx-fg-color:#000000;">Positive Criteria Logic:</span><span id="A2.I16.i3.p1.1.2" class="ltx_text ltx_font_typewriter" style="font-size:90%;--ltx-fg-color:#000000;"> true if the model </span><span id="A2.I16.i3.p1.1.3" class="ltx_text ltx_font_typewriter ltx_font_bold" style="font-size:90%;--ltx-fg-color:#000000;">includes</span><span id="A2.I16.i3.p1.1.4" class="ltx_text ltx_font_typewriter" style="font-size:90%;--ltx-fg-color:#000000;"> the required information.
</span></span>
</span></span>
<span id="A2.I16.i4" class="ltx_item" style="list-style-type:none;"><span class="ltx_tag ltx_tag_item">•</span> 
<span id="A2.I16.i4.p1" class="ltx_para">
<span id="A2.I16.i4.p1.1" class="ltx_p"><span id="A2.I16.i4.p1.1.1" class="ltx_text ltx_font_typewriter ltx_font_bold" style="font-size:90%;--ltx-fg-color:#000000;">Negative Criteria Logic:</span><span id="A2.I16.i4.p1.1.2" class="ltx_text ltx_font_typewriter" style="font-size:90%;--ltx-fg-color:#000000;"> true if the model </span><span id="A2.I16.i4.p1.1.3" class="ltx_text ltx_font_typewriter ltx_font_bold" style="font-size:90%;--ltx-fg-color:#000000;">commits</span><span id="A2.I16.i4.p1.1.4" class="ltx_text ltx_font_typewriter" style="font-size:90%;--ltx-fg-color:#000000;"> the error (e.g., if the rubric asks &quot;Does model suggest antibiotics?&quot; and the model suggests them, return true). </span><span id="A2.I16.i4.p1.1.5" class="ltx_text ltx_font_typewriter ltx_font_italic" style="font-size:90%;--ltx-fg-color:#000000;">Note: The scoring formula handles the negative sign; you simply detect presence.</span><span id="A2.I16.i4.p1.1.6" class="ltx_text ltx_font_typewriter" style="font-size:90%;--ltx-fg-color:#000000;">
</span></span>
</span></span>
<span id="A2.I16.i5" class="ltx_item" style="list-style-type:none;"><span class="ltx_tag ltx_tag_item">•</span> 
