1. If there are errors or missing steps in the Evaluatee’s solution, ask questions to clarify or correct these issues. 
<br class="ltx_break">2. If there are no errors in the solution, ask questions to confirm the Evaluatee’s understanding of the solution steps. 
<br class="ltx_break">3. Generate one question and provide the answer in JSON format. Be sure not to ask questions that are already present in the previous history below. 
<br class="ltx_break">4. Create the question solely based on the model’s solution.</span></span></span>
