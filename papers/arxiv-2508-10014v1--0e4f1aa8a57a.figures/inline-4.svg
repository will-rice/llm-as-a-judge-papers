<br class="ltx_break">[Thinking: I’m getting a bit frustrated having to repeat this information.] 
<br class="ltx_break">You can’t Apparate inside the Hogwarts grounds, how often do I have to tell you?</span></span></span>
<span id="A5.SS1.SSS0.Px1.p2.pic1.2.2" class="ltx_p"><span id="A5.SS1.SSS0.Px1.p2.pic1.2.2.1" class="ltx_text ltx_font_bold" style="--ltx-fg-color:#000000;">Character2: Unknown<span id="A5.SS1.SSS0.Px1.p2.pic1.2.2.1.1" class="ltx_text ltx_font_medium"> 
<br class="ltx_break">[Thinking: I remember what Mr. Weasley said about wizards showing off. Maybe that’s what they’ll do.] 
<br class="ltx_break">Maybe the foreign students are preparing a dramatic entrance… Remember what Mr. Weasley said at the World Cup? ’Always the same — we can’t resist showing off when we get together…’</span></span></span>
