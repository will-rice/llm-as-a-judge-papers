</span></span>
<span id="A8.I2.i3.I1.i2" class="ltx_item" style="list-style-type:none;"><span class="ltx_tag ltx_tag_item"><span id="A8.I2.i3.I1.i2.1" class="ltx_text ltx_font_bold">–</span></span> 
