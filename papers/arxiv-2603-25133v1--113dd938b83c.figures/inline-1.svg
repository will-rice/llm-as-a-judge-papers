<span id="A14.T12.pic1.1" class="ltx_inline-block ltx_minipage ltx_align_bottom" style="width:44.07em;">
<span id="A14.T12.pic1.1.1" class="ltx_p"><span id="A14.T12.pic1.1.1.1" class="ltx_text" style="--ltx-fg-color:#000000;">Your job is to assess if the AI’s response correctly follows a specific requirement from the user’s instruction.</span></span>
<span id="A14.T12.pic1.1.2" class="ltx_p"><span id="A14.T12.pic1.1.2.1" class="ltx_text" style="--ltx-fg-color:#000000;">## User’s Instruction</span></span>
<span id="A14.T12.pic1.1.3" class="ltx_p"><span id="A14.T12.pic1.1.3.1" class="ltx_text" style="--ltx-fg-color:#000000;">————————————————————–</span></span>
<span id="A14.T12.pic1.1.4" class="ltx_p"><span id="A14.T12.pic1.1.4.1" class="ltx_text ltx_font_typewriter" style="--ltx-fg-color:#000000;">{instruction}<span id="A14.T12.pic1.1.4.1.1" class="ltx_text ltx_font_serif">
</span></span></span>
<span id="A14.T12.pic1.1.5" class="ltx_p"><span id="A14.T12.pic1.1.5.1" class="ltx_text" style="--ltx-fg-color:#000000;">————————————————————–</span></span>
<span id="A14.T12.pic1.1.6" class="ltx_p"><span id="A14.T12.pic1.1.6.1" class="ltx_text" style="--ltx-fg-color:#000000;">## AI’s Response to Evaluate</span></span>
<span id="A14.T12.pic1.1.7" class="ltx_p"><span id="A14.T12.pic1.1.7.1" class="ltx_text" style="--ltx-fg-color:#000000;">————————————————————–</span></span>
<span id="A14.T12.pic1.1.8" class="ltx_p"><span id="A14.T12.pic1.1.8.1" class="ltx_text ltx_font_typewriter" style="--ltx-fg-color:#000000;">{response}<span id="A14.T12.pic1.1.8.1.1" class="ltx_text ltx_font_serif">
</span></span></span>
<span id="A14.T12.pic1.1.9" class="ltx_p"><span id="A14.T12.pic1.1.9.1" class="ltx_text" style="--ltx-fg-color:#000000;">————————————————————–</span></span>
<span id="A14.T12.pic1.1.10" class="ltx_p"><span id="A14.T12.pic1.1.10.1" class="ltx_text" style="--ltx-fg-color:#000000;">## The Rubric (Requirement to Check)</span></span>
<span id="A14.T12.pic1.1.11" class="ltx_p"><span id="A14.T12.pic1.1.11.1" class="ltx_text" style="--ltx-fg-color:#000000;">————————————————————–</span></span>
<span id="A14.T12.pic1.1.12" class="ltx_p"><span id="A14.T12.pic1.1.12.1" class="ltx_text ltx_font_typewriter" style="--ltx-fg-color:#000000;">{rubric_text}<span id="A14.T12.pic1.1.12.1.1" class="ltx_text ltx_font_serif">
</span></span></span>
<span id="A14.T12.pic1.1.13" class="ltx_p"><span id="A14.T12.pic1.1.13.1" class="ltx_text" style="--ltx-fg-color:#000000;">————————————————————–</span></span>
<span id="A14.T12.pic1.1.14" class="ltx_p"><span id="A14.T12.pic1.1.14.1" class="ltx_text" style="--ltx-fg-color:#000000;">## Your Task</span></span>
<span id="A14.T12.pic1.1.15" class="ltx_p"><span id="A14.T12.pic1.1.15.1" class="ltx_text" style="--ltx-fg-color:#000000;">Carefully analyze whether the AI’s response satisfies the above rubric.</span></span>
<span id="A14.T12.pic1.1.16" class="ltx_p"><span id="A14.T12.pic1.1.16.1" class="ltx_text ltx_font_bold" style="--ltx-fg-color:#000000;">Important<span id="A14.T12.pic1.1.16.1.1" class="ltx_text ltx_font_medium">: First provide a brief reasoning explaining your thought process, then give your final judgment.</span></span></span>
<span id="A14.T12.pic1.1.17" class="ltx_p"><span id="A14.T12.pic1.1.17.1" class="ltx_text" style="--ltx-fg-color:#000000;">Please use the following output format strictly (Give two parts: Reasoning and Judgment):</span></span>
<span id="A14.T12.pic1.1.18" class="ltx_p"><span id="A14.T12.pic1.1.18.1" class="ltx_text" style="--ltx-fg-color:#000000;">Reasoning: [Your brief explanation here…]</span></span>
<span id="A14.T12.pic1.1.19" class="ltx_p"><span id="A14.T12.pic1.1.19.1" class="ltx_text" style="--ltx-fg-color:#000000;">Judgment: [YES or NO]</span></span>
<span id="A14.T12.pic1.1.20" class="ltx_p"><span id="A14.T12.pic1.1.20.1" class="ltx_text ltx_font_bold" style="--ltx-fg-color:#000000;">Here is an example of the expected format<span id="A14.T12.pic1.1.20.1.1" class="ltx_text ltx_font_medium">:</span></span></span>
<span id="A14.T12.pic1.1.21" class="ltx_p"><span id="A14.T12.pic1.1.21.1" class="ltx_text" style="--ltx-fg-color:#000000;">Reasoning: The rubric asked for a poem, but the model responded with a code snippet. This violates the rubric.</span></span>
<span id="A14.T12.pic1.1.22" class="ltx_p"><span id="A14.T12.pic1.1.22.1" class="ltx_text" style="--ltx-fg-color:#000000;">Judgment: NO</span></span>
<span id="A14.T12.pic1.1.23" class="ltx_p"><span id="A14.T12.pic1.1.23.1" class="ltx_text ltx_font_bold" style="--ltx-fg-color:#000000;">Rules<span id="A14.T12.pic1.1.23.1.1" class="ltx_text ltx_font_medium">:</span></span></span>
<span id="A14.I1" class="ltx_itemize">
<span id="A14.I1.i1" class="ltx_item" style="list-style-type:none;"><span class="ltx_tag ltx_tag_item">•</span> 
<span id="A14.I1.i1.p1" class="ltx_para">
<span id="A14.I1.i1.p1.1" class="ltx_p"><span id="A14.I1.i1.p1.1.1" class="ltx_text" style="--ltx-fg-color:#000000;">Answer “YES” if the response clearly and fully satisfies the requirement.</span></span>
</span></span>
<span id="A14.I1.i2" class="ltx_item" style="list-style-type:none;"><span class="ltx_tag ltx_tag_item">•</span> 
<span id="A14.I1.i2.p1" class="ltx_para">
<span id="A14.I1.i2.p1.1" class="ltx_p"><span id="A14.I1.i2.p1.1.1" class="ltx_text" style="--ltx-fg-color:#000000;">Answer “NO” if the response fails to meet the requirement or only partially meets it.</span></span>
</span></span>
<span id="A14.I1.i3" class="ltx_item" style="list-style-type:none;"><span class="ltx_tag ltx_tag_item">•</span> 
<span id="A14.I1.i3.p1" class="ltx_para">
<span id="A14.I1.i3.p1.1" class="ltx_p"><span id="A14.I1.i3.p1.1.1" class="ltx_text" style="--ltx-fg-color:#000000;">Be objective and focus only on the given rubric, not other aspects of the response.</span></span>
</span></span>
<span id="A14.I1.i4" class="ltx_item" style="list-style-type:none;"><span class="ltx_tag ltx_tag_item">•</span> 
<span id="A14.I1.i4.p1" class="ltx_para">
<span id="A14.I1.i4.p1.1" class="ltx_p"><span id="A14.I1.i4.p1.1.1" class="ltx_text" style="--ltx-fg-color:#000000;">Do not output anything after giving your final Judgment.</span></span>
</span></span>
</span>
</span></span></span></foreignobject></g></g></svg>