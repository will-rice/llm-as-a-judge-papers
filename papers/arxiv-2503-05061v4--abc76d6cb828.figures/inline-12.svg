</span>
<span id="A4.F8.pic2.1.6" class="ltx_p"><span id="A4.F8.pic2.1.6.1" class="ltx_text" style="--ltx-fg-color:#000000;">The LTV of Class A is approximately 34.53%, or 35% when rounded to the nearest percent.</span></span>
