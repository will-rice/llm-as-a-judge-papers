<br class="ltx_break">
<br class="ltx_break">The goal of this task is to carefully examine the [Target Sentence] within the context of the [Query] and [Full Response] to determine if it contains any **cultural or linguistic errors**.

<br class="ltx_break">
<br class="ltx_break">Infer the target culture from the [Query], and evaluate the [Target Sentence] from the perspective of **that specific culture**.

<br class="ltx_break">
<br class="ltx_break">Return ‘‘True’’ if any cultural or linguistic error exists in the [Target Sentence], otherwise ‘‘False’’. Do not generate any other text.

