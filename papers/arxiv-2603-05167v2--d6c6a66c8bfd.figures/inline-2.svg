</span></span></span></foreignobject></g><g fill-opacity="1.0" transform="matrix(1.0 0.0 0.0 1.0 11.44 14.52)"><foreignobject style="--ltx-fo-width:43.38em;--ltx-fo-height:15.01em;--ltx-fo-depth:0.22em;font-size:10pt;" height="210.79" overflow="visible" transform="matrix(1 0 0 -1 0 207.71)" width="600.26"><span class="ltx_foreignobject_container"><span class="ltx_foreignobject_content">
<span id="A6.SS2.p2.pic1.2" class="ltx_inline-block ltx_minipage ltx_align_bottom" style="width:43.38em;">
<span id="A6.SS2.p2.pic1.2.1" class="ltx_p"><span id="A6.SS2.p2.pic1.2.1.1" class="ltx_text ltx_font_typewriter" style="--ltx-fg-color:#000000;">You are evaluating the logical consistency and causal flow in mathematical reasoning.
<br class="ltx_break" style="--ltx-break-space:4.0pt;">
Task: Given the previous steps of a mathematical solution, determine if the next step causally follows logically from them.
<br class="ltx_break" style="--ltx-break-space:4.0pt;">
A step ‘‘causally follows’’ if:
<br class="ltx_break" style="--ltx-break-space:2.0pt;">
1. It is a direct logical consequence of the previous steps
<br class="ltx_break" style="--ltx-break-space:1.0pt;">
2. All necessary information to derive it is present in the context
<br class="ltx_break" style="--ltx-break-space:1.0pt;">
3. The reasoning is sound and mathematically valid
<br class="ltx_break" style="--ltx-break-space:4.0pt;">
Context (Previous steps):
<br class="ltx_break" style="--ltx-break-space:1.0pt;">
{context}
<br class="ltx_break" style="--ltx-break-space:4.0pt;">
Step to evaluate: &quot;{step}&quot;
<br class="ltx_break" style="--ltx-break-space:4.0pt;">
Respond with:
<br class="ltx_break" style="--ltx-break-space:2.0pt;">
1. reasoning: Brief explanation of whether this step follows from the prior context
<br class="ltx_break" style="--ltx-break-space:1.0pt;">
2. final_score: 1 if the step causally follows, 0 if it does not follow
</span></span>
</span></span></span></foreignobject></g></g></svg>