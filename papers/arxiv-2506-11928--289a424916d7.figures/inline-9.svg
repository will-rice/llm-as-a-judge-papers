<svg id="S15.SS0.SSS0.Px2.p2.pic1" class="ltx_picture" height="518.62" overflow="visible" version="1.1" viewbox="0 0 477.38 518.62" width="477.38"><g style="--ltx-stroke-color:#000000;--ltx-fill-color:#000000;" fill="#000000" stroke="#000000" stroke-width="0.4pt" transform="translate(0,518.62) matrix(1 0 0 -1 0 0)"><g style="--ltx-fill-color:#BF0000;" fill="#BF0000" fill-opacity="1.0"><path style="stroke:none" d="M 0 5.91 L 0 512.72 C 0 515.98 2.64 518.62 5.91 518.62 L 471.47 518.62 C 474.73 518.62 477.38 515.98 477.38 512.72 L 477.38 5.91 C 477.38 2.64 474.73 0 471.47 0 L 5.91 0 C 2.64 0 0 2.64 0 5.91 Z" /></g><g style="--ltx-fill-color:#FFF2F2;" fill="#FFF2F2" fill-opacity="1.0"><path style="stroke:none" d="M 1.97 5.91 L 1.97 492.97 L 475.41 492.97 L 475.41 5.91 C 475.41 3.73 473.65 1.97 471.47 1.97 L 5.91 1.97 C 3.73 1.97 1.97 3.73 1.97 5.91 Z" /></g><g fill-opacity="1.0" transform="matrix(1.0 0.0 0.0 1.0 21.65 502.34)"><foreignobject style="--ltx-fo-width:31.37em;--ltx-fo-height:0.75em;--ltx-fo-depth:0.25em;font-size:10pt;" height="13.84" overflow="visible" transform="matrix(1 0 0 -1 0 10.38)" width="434.07"><span class="ltx_foreignobject_container"><span class="ltx_foreignobject_content">
<span id="S15.SS0.SSS0.Px2.p2.pic1.1" class="ltx_inline-block ltx_minipage ltx_align_bottom" style="width:31.37em;">
<span id="S15.SS0.SSS0.Px2.p2.pic1.1.1" class="ltx_p"><a href="https://codeforces.com/problemset/problem/2084/D" title class="ltx_ref ltx_href" style="--ltx-fg-color:#FFFFFF;">Example Mathematics Problem (Rated 1600)</a></span>
</span></span></span></foreignobject></g><g fill-opacity="1.0" transform="matrix(1.0 0.0 0.0 1.0 21.65 17.24)"><foreignobject style="--ltx-fo-width:31.37em;--ltx-fo-height:33.53em;--ltx-fo-depth:0.25em;font-size:10pt;" height="467.39" overflow="visible" transform="matrix(1 0 0 -1 0 463.93)" width="434.07"><span class="ltx_foreignobject_container"><span class="ltx_foreignobject_content">
<span id="S15.SS0.SSS0.Px2.p2.pic1.2" class="ltx_inline-block ltx_minipage ltx_align_bottom" style="width:31.37em;">
<span id="S15.SS0.SSS0.Px2.p2.pic1.2.1" class="ltx_p"><span id="S15.SS0.SSS0.Px2.p2.pic1.2.1.1" class="ltx_text" style="--ltx-fg-color:#000000;">You are given three integers <math id="S15.SS0.SSS0.Px2.p2.pic1.m1" class="ltx_Math" alttext="n,m," display="inline" intent=":literal"><semantics><mrow><mrow><mi style="--ltx-fg-color:#000000;" mathcolor="#000000">n</mi><mo style="--ltx-fg-color:#000000;" mathcolor="#000000">,</mo><mi style="--ltx-fg-color:#000000;" mathcolor="#000000">m</mi></mrow><mo style="--ltx-fg-color:#000000;" mathcolor="#000000">,</mo></mrow><annotation encoding="application/x-tex">n,m,</annotation></semantics></math> and <math id="S15.SS0.SSS0.Px2.p2.pic1.m2" class="ltx_Math" alttext="k" display="inline" intent=":literal"><semantics><mi style="--ltx-fg-color:#000000;" mathcolor="#000000">k</mi><annotation encoding="application/x-tex">k</annotation></semantics></math> where <math id="S15.SS0.SSS0.Px2.p2.pic1.m3" class="ltx_Math" alttext="m\cdot k&lt;n" display="inline" intent=":literal"><semantics><mrow><mrow><mi style="--ltx-fg-color:#000000;" mathcolor="#000000">m</mi><mo style="--ltx-fg-color:#000000;" lspace="0.222em" mathcolor="#000000" rspace="0.222em">⋅</mo><mi style="--ltx-fg-color:#000000;" mathcolor="#000000">k</mi></mrow><mo style="--ltx-fg-color:#000000;" mathcolor="#000000">&lt;</mo><mi style="--ltx-fg-color:#000000;" mathcolor="#000000">n</mi></mrow><annotation encoding="application/x-tex">m\cdot k&lt;n</annotation></semantics></math>. For a sequence <math id="S15.SS0.SSS0.Px2.p2.pic1.m4" class="ltx_Math" alttext="b" display="inline" intent=":literal"><semantics><mi style="--ltx-fg-color:#000000;" mathcolor="#000000">b</mi><annotation encoding="application/x-tex">b</annotation></semantics></math> consisting of non-negative integers, you may perform the following operation on <math id="S15.SS0.SSS0.Px2.p2.pic1.m5" class="ltx_Math" alttext="b" display="inline" intent=":literal"><semantics><mi style="--ltx-fg-color:#000000;" mathcolor="#000000">b</mi><annotation encoding="application/x-tex">b</annotation></semantics></math>:</span></span>
<span id="S15.I1" class="ltx_itemize">
<span id="S15.I1.i1" class="ltx_item" style="list-style-type:none;"><span class="ltx_tag ltx_tag_item">•</span> 
<span id="S15.I1.i1.p1" class="ltx_para">
<span id="S15.I1.i1.p1.1" class="ltx_p"><span id="S15.I1.i1.p1.1.1" class="ltx_text" style="--ltx-fg-color:#000000;">Let </span><math id="S15.I1.i1.p1.m1" class="ltx_Math" alttext="l" display="inline" intent=":literal"><semantics><mi style="--ltx-fg-color:#000000;" mathcolor="#000000">l</mi><annotation encoding="application/x-tex">l</annotation></semantics></math><span id="S15.I1.i1.p1.1.2" class="ltx_text" style="--ltx-fg-color:#000000;"> denote the current length of </span><math id="S15.I1.i1.p1.m2" class="ltx_Math" alttext="b" display="inline" intent=":literal"><semantics><mi style="--ltx-fg-color:#000000;" mathcolor="#000000">b</mi><annotation encoding="application/x-tex">b</annotation></semantics></math><span id="S15.I1.i1.p1.1.3" class="ltx_text" style="--ltx-fg-color:#000000;">. Choose a positive integer </span><math id="S15.I1.i1.p1.m3" class="ltx_Math" alttext="1\leq i\leq l-k+1" display="inline" intent=":literal"><semantics><mrow><mn style="--ltx-fg-color:#000000;" mathcolor="#000000">1</mn><mo style="--ltx-fg-color:#000000;" mathcolor="#000000">≤</mo><mi style="--ltx-fg-color:#000000;" mathcolor="#000000">i</mi><mo style="--ltx-fg-color:#000000;" mathcolor="#000000">≤</mo><mrow><mrow><mi style="--ltx-fg-color:#000000;" mathcolor="#000000">l</mi><mo style="--ltx-fg-color:#000000;" mathcolor="#000000">−</mo><mi style="--ltx-fg-color:#000000;" mathcolor="#000000">k</mi></mrow><mo style="--ltx-fg-color:#000000;" mathcolor="#000000">+</mo><mn style="--ltx-fg-color:#000000;" mathcolor="#000000">1</mn></mrow></mrow><annotation encoding="application/x-tex">1\leq i\leq l-k+1</annotation></semantics></math><span id="S15.I1.i1.p1.1.4" class="ltx_text" style="--ltx-fg-color:#000000;">, remove the subarray from index </span><math id="S15.I1.i1.p1.m4" class="ltx_Math" alttext="i" display="inline" intent=":literal"><semantics><mi style="--ltx-fg-color:#000000;" mathcolor="#000000">i</mi><annotation encoding="application/x-tex">i</annotation></semantics></math><span id="S15.I1.i1.p1.1.5" class="ltx_text" style="--ltx-fg-color:#000000;"> to </span><math id="S15.I1.i1.p1.m5" class="ltx_Math" alttext="i+k-1" display="inline" intent=":literal"><semantics><mrow><mrow><mi style="--ltx-fg-color:#000000;" mathcolor="#000000">i</mi><mo style="--ltx-fg-color:#000000;" mathcolor="#000000">+</mo><mi style="--ltx-fg-color:#000000;" mathcolor="#000000">k</mi></mrow><mo style="--ltx-fg-color:#000000;" mathcolor="#000000">−</mo><mn style="--ltx-fg-color:#000000;" mathcolor="#000000">1</mn></mrow><annotation encoding="application/x-tex">i+k-1</annotation></semantics></math><span id="S15.I1.i1.p1.1.6" class="ltx_text" style="--ltx-fg-color:#000000;"> and concatenate the remaining parts.</span></span>
</span></span>
</span>
<span id="S15.SS0.SSS0.Px2.p2.pic1.2.2" class="ltx_p"><span id="S15.SS0.SSS0.Px2.p2.pic1.2.2.1" class="ltx_text" style="--ltx-fg-color:#000000;">We also define <math id="S15.SS0.SSS0.Px2.p2.pic1.m6" class="ltx_Math" alttext="f(b)" display="inline" intent=":literal"><semantics><mrow><mi style="--ltx-fg-color:#000000;" mathcolor="#000000">f</mi><mo>⁡</mo><mrow><mo style="--ltx-fg-color:#000000;" mathcolor="#000000" stretchy="false">(</mo><mi style="--ltx-fg-color:#000000;" mathcolor="#000000">b</mi><mo style="--ltx-fg-color:#000000;" mathcolor="#000000" stretchy="false">)</mo></mrow></mrow><annotation encoding="application/x-tex">f(b)</annotation></semantics></math> as the <span id="S15.SS0.SSS0.Px2.p2.pic1.2.2.1.1" class="ltx_text ltx_font_bold">minimum</span> possible value of <math id="S15.SS0.SSS0.Px2.p2.pic1.m7" class="ltx_Math" alttext="\operatorname{mex}(b)" display="inline" intent=":literal"><semantics><mrow><mi style="--ltx-fg-color:#000000;" mathcolor="#000000">mex</mi><mo>⁡</mo><mrow><mo style="--ltx-fg-color:#000000;" mathcolor="#000000" stretchy="false">(</mo><mi style="--ltx-fg-color:#000000;" mathcolor="#000000">b</mi><mo style="--ltx-fg-color:#000000;" mathcolor="#000000" stretchy="false">)</mo></mrow></mrow><annotation encoding="application/x-tex">\operatorname{mex}(b)</annotation></semantics></math> after performing the above operation <span id="S15.SS0.SSS0.Px2.p2.pic1.2.2.1.2" class="ltx_text ltx_font_bold">at most</span> <math id="S15.SS0.SSS0.Px2.p2.pic1.m8" class="ltx_Math" alttext="m" display="inline" intent=":literal"><semantics><mi style="--ltx-fg-color:#000000;" mathcolor="#000000">m</mi><annotation encoding="application/x-tex">m</annotation></semantics></math> <span id="S15.SS0.SSS0.Px2.p2.pic1.2.2.1.3" class="ltx_text ltx_font_bold">times</span> (possibly zero).

<br class="ltx_break">
<br class="ltx_break">You need to construct a sequence <math id="S15.SS0.SSS0.Px2.p2.pic1.m9" class="ltx_Math" alttext="a" display="inline" intent=":literal"><semantics><mi style="--ltx-fg-color:#000000;" mathcolor="#000000">a</mi><annotation encoding="application/x-tex">a</annotation></semantics></math> of length <math id="S15.SS0.SSS0.Px2.p2.pic1.m10" class="ltx_Math" alttext="n\ (1\leq t\leq 10^{4})" display="inline" intent=":literal"><semantics><mrow><mi style="--ltx-fg-color:#000000;" mathcolor="#000000">n</mi><mo lspace="0.500em">⁡</mo><mrow><mo style="--ltx-fg-color:#000000;" mathcolor="#000000" stretchy="false">(</mo><mrow><mn style="--ltx-fg-color:#000000;" mathcolor="#000000">1</mn><mo style="--ltx-fg-color:#000000;" mathcolor="#000000">≤</mo><mi style="--ltx-fg-color:#000000;" mathcolor="#000000">t</mi><mo style="--ltx-fg-color:#000000;" mathcolor="#000000">≤</mo><msup><mn style="--ltx-fg-color:#000000;" mathcolor="#000000">10</mn><mn style="--ltx-fg-color:#000000;" mathcolor="#000000">4</mn></msup></mrow><mo style="--ltx-fg-color:#000000;" mathcolor="#000000" stretchy="false">)</mo></mrow></mrow><annotation encoding="application/x-tex">n\ (1\leq t\leq 10^{4})</annotation></semantics></math> consisting of non-negative integers <math id="S15.SS0.SSS0.Px2.p2.pic1.m11" class="ltx_Math" alttext="(0\leq a_{i}\leq 10^{9})" display="inline" intent=":literal"><semantics><mrow><mo style="--ltx-fg-color:#000000;" mathcolor="#000000" stretchy="false">(</mo><mrow><mn style="--ltx-fg-color:#000000;" mathcolor="#000000">0</mn><mo style="--ltx-fg-color:#000000;" mathcolor="#000000">≤</mo><msub><mi style="--ltx-fg-color:#000000;" mathcolor="#000000">a</mi><mi style="--ltx-fg-color:#000000;" mathcolor="#000000">i</mi></msub><mo style="--ltx-fg-color:#000000;" mathcolor="#000000">≤</mo><msup><mn style="--ltx-fg-color:#000000;" mathcolor="#000000">10</mn><mn style="--ltx-fg-color:#000000;" mathcolor="#000000">9</mn></msup></mrow><mo style="--ltx-fg-color:#000000;" mathcolor="#000000" stretchy="false">)</mo></mrow><annotation encoding="application/x-tex">(0\leq a_{i}\leq 10^{9})</annotation></semantics></math>, such that over all such sequences <math id="S15.SS0.SSS0.Px2.p2.pic1.m12" class="ltx_Math" alttext="a" display="inline" intent=":literal"><semantics><mi style="--ltx-fg-color:#000000;" mathcolor="#000000">a</mi><annotation encoding="application/x-tex">a</annotation></semantics></math>, <math id="S15.SS0.SSS0.Px2.p2.pic1.m13" class="ltx_Math" alttext="f(a)" display="inline" intent=":literal"><semantics><mrow><mi style="--ltx-fg-color:#000000;" mathcolor="#000000">f</mi><mo>⁡</mo><mrow><mo style="--ltx-fg-color:#000000;" mathcolor="#000000" stretchy="false">(</mo><mi style="--ltx-fg-color:#000000;" mathcolor="#000000">a</mi><mo style="--ltx-fg-color:#000000;" mathcolor="#000000" stretchy="false">)</mo></mrow></mrow><annotation encoding="application/x-tex">f(a)</annotation></semantics></math> is <span id="S15.SS0.SSS0.Px2.p2.pic1.2.2.1.4" class="ltx_text ltx_font_bold">maximized</span>. 
<br class="ltx_break">
<br class="ltx_break"><span id="S15.SS0.SSS0.Px2.p2.pic1.2.2.1.5" class="ltx_text ltx_font_bold">Input</span> 
<br class="ltx_break">Each test case contains multiple test cases. The first line contains the number of test cases <math id="S15.SS0.SSS0.Px2.p2.pic1.m14" class="ltx_Math" alttext="t\ (1\leq t\leq 10^{4})" display="inline" intent=":literal"><semantics><mrow><mi style="--ltx-fg-color:#000000;" mathcolor="#000000">t</mi><mo lspace="0.500em">⁡</mo><mrow><mo style="--ltx-fg-color:#000000;" mathcolor="#000000" stretchy="false">(</mo><mrow><mn style="--ltx-fg-color:#000000;" mathcolor="#000000">1</mn><mo style="--ltx-fg-color:#000000;" mathcolor="#000000">≤</mo><mi style="--ltx-fg-color:#000000;" mathcolor="#000000">t</mi><mo style="--ltx-fg-color:#000000;" mathcolor="#000000">≤</mo><msup><mn style="--ltx-fg-color:#000000;" mathcolor="#000000">10</mn><mn style="--ltx-fg-color:#000000;" mathcolor="#000000">4</mn></msup></mrow><mo style="--ltx-fg-color:#000000;" mathcolor="#000000" stretchy="false">)</mo></mrow></mrow><annotation encoding="application/x-tex">t\ (1\leq t\leq 10^{4})</annotation></semantics></math>. The description of the test cases follows.

<br class="ltx_break">
<br class="ltx_break">The first line of each test case contains three integers <math id="S15.SS0.SSS0.Px2.p2.pic1.m15" class="ltx_Math" alttext="n,m," display="inline" intent=":literal"><semantics><mrow><mrow><mi style="--ltx-fg-color:#000000;" mathcolor="#000000">n</mi><mo style="--ltx-fg-color:#000000;" mathcolor="#000000">,</mo><mi style="--ltx-fg-color:#000000;" mathcolor="#000000">m</mi></mrow><mo style="--ltx-fg-color:#000000;" mathcolor="#000000">,</mo></mrow><annotation encoding="application/x-tex">n,m,</annotation></semantics></math> and <math id="S15.SS0.SSS0.Px2.p2.pic1.m16" class="ltx_math_unparsed" alttext="k\ (2\leq n\leq 2\cdot 10^{5},1\leq m&lt;n,1\leq k&lt;n,1\leq m\cdot k&lt;n)" display="inline" intent=":literal"><semantics><mrow><mi style="--ltx-fg-color:#000000;" mathcolor="#000000">k</mi><mrow><mo style="--ltx-fg-color:#000000;" lspace="0.500em" mathcolor="#000000" stretchy="false">(</mo><mn style="--ltx-fg-color:#000000;" mathcolor="#000000">2</mn><mo style="--ltx-fg-color:#000000;" mathcolor="#000000">≤</mo><mi style="--ltx-fg-color:#000000;" mathcolor="#000000">n</mi><mo style="--ltx-fg-color:#000000;" mathcolor="#000000">≤</mo><mn style="--ltx-fg-color:#000000;" mathcolor="#000000">2</mn><mo style="--ltx-fg-color:#000000;" lspace="0.222em" mathcolor="#000000" rspace="0.222em">⋅</mo><msup><mn style="--ltx-fg-color:#000000;" mathcolor="#000000">10</mn><mn style="--ltx-fg-color:#000000;" mathcolor="#000000">5</mn></msup><mo style="--ltx-fg-color:#000000;" mathcolor="#000000">,</mo><mn style="--ltx-fg-color:#000000;" mathcolor="#000000">1</mn><mo style="--ltx-fg-color:#000000;" mathcolor="#000000">≤</mo><mi style="--ltx-fg-color:#000000;" mathcolor="#000000">m</mi><mo style="--ltx-fg-color:#000000;" mathcolor="#000000">&lt;</mo><mi style="--ltx-fg-color:#000000;" mathcolor="#000000">n</mi><mo style="--ltx-fg-color:#000000;" mathcolor="#000000">,</mo><mn style="--ltx-fg-color:#000000;" mathcolor="#000000">1</mn><mo style="--ltx-fg-color:#000000;" mathcolor="#000000">≤</mo><mi style="--ltx-fg-color:#000000;" mathcolor="#000000">k</mi><mo style="--ltx-fg-color:#000000;" mathcolor="#000000">&lt;</mo><mi style="--ltx-fg-color:#000000;" mathcolor="#000000">n</mi><mo style="--ltx-fg-color:#000000;" mathcolor="#000000">,</mo><mn style="--ltx-fg-color:#000000;" mathcolor="#000000">1</mn><mo style="--ltx-fg-color:#000000;" mathcolor="#000000">≤</mo><mi style="--ltx-fg-color:#000000;" mathcolor="#000000">m</mi><mo style="--ltx-fg-color:#000000;" lspace="0.222em" mathcolor="#000000" rspace="0.222em">⋅</mo><mi style="--ltx-fg-color:#000000;" mathcolor="#000000">k</mi><mo style="--ltx-fg-color:#000000;" mathcolor="#000000">&lt;</mo><mi style="--ltx-fg-color:#000000;" mathcolor="#000000">n</mi><mo style="--ltx-fg-color:#000000;" mathcolor="#000000" stretchy="false">)</mo></mrow></mrow><annotation encoding="application/x-tex">k\ (2\leq n\leq 2\cdot 10^{5},1\leq m&lt;n,1\leq k&lt;n,1\leq m\cdot k&lt;n)</annotation></semantics></math>.

<br class="ltx_break">
<br class="ltx_break">It is guaranteed that the sum of <math id="S15.SS0.SSS0.Px2.p2.pic1.m17" class="ltx_Math" alttext="n" display="inline" intent=":literal"><semantics><mi style="--ltx-fg-color:#000000;" mathcolor="#000000">n</mi><annotation encoding="application/x-tex">n</annotation></semantics></math> over all test cases does not exceed <math id="S15.SS0.SSS0.Px2.p2.pic1.m18" class="ltx_Math" alttext="2\cdot 10^{5}" display="inline" intent=":literal"><semantics><mrow><mn style="--ltx-fg-color:#000000;" mathcolor="#000000">2</mn><mo style="--ltx-fg-color:#000000;" lspace="0.222em" mathcolor="#000000" rspace="0.222em">⋅</mo><msup><mn style="--ltx-fg-color:#000000;" mathcolor="#000000">10</mn><mn style="--ltx-fg-color:#000000;" mathcolor="#000000">5</mn></msup></mrow><annotation encoding="application/x-tex">2\cdot 10^{5}</annotation></semantics></math>.

<br class="ltx_break">
<br class="ltx_break"><span id="S15.SS0.SSS0.Px2.p2.pic1.2.2.1.6" class="ltx_text ltx_font_bold">Output</span> 
<br class="ltx_break">For each test case, output <math id="S15.SS0.SSS0.Px2.p2.pic1.m19" class="ltx_Math" alttext="n" display="inline" intent=":literal"><semantics><mi style="--ltx-fg-color:#000000;" mathcolor="#000000">n</mi><annotation encoding="application/x-tex">n</annotation></semantics></math> integers <math id="S15.SS0.SSS0.Px2.p2.pic1.m20" class="ltx_Math" alttext="a_{1},a_{2},\dots,a_{n}\ (0\leq a_{i}\leq 10^{9})" display="inline" intent=":literal"><semantics><mrow><msub><mi style="--ltx-fg-color:#000000;" mathcolor="#000000">a</mi><mn style="--ltx-fg-color:#000000;" mathcolor="#000000">1</mn></msub><mo style="--ltx-fg-color:#000000;" mathcolor="#000000">,</mo><msub><mi style="--ltx-fg-color:#000000;" mathcolor="#000000">a</mi><mn style="--ltx-fg-color:#000000;" mathcolor="#000000">2</mn></msub><mo style="--ltx-fg-color:#000000;" mathcolor="#000000">,</mo><mi style="--ltx-fg-color:#000000;" mathcolor="#000000" mathvariant="normal">…</mi><mo style="--ltx-fg-color:#000000;" mathcolor="#000000">,</mo><mrow><msub><mi style="--ltx-fg-color:#000000;" mathcolor="#000000">a</mi><mi style="--ltx-fg-color:#000000;" mathcolor="#000000">n</mi></msub><mo lspace="0em" rspace="0em">​</mo><mrow><mo style="--ltx-fg-color:#000000;" mathcolor="#000000" stretchy="false">(</mo><mrow><mn style="--ltx-fg-color:#000000;" mathcolor="#000000">0</mn><mo style="--ltx-fg-color:#000000;" mathcolor="#000000">≤</mo><msub><mi style="--ltx-fg-color:#000000;" mathcolor="#000000">a</mi><mi style="--ltx-fg-color:#000000;" mathcolor="#000000">i</mi></msub><mo style="--ltx-fg-color:#000000;" mathcolor="#000000">≤</mo><msup><mn style="--ltx-fg-color:#000000;" mathcolor="#000000">10</mn><mn style="--ltx-fg-color:#000000;" mathcolor="#000000">9</mn></msup></mrow><mo style="--ltx-fg-color:#000000;" mathcolor="#000000" stretchy="false">)</mo></mrow></mrow></mrow><annotation encoding="application/x-tex">a_{1},a_{2},\dots,a_{n}\ (0\leq a_{i}\leq 10^{9})</annotation></semantics></math>.</span></span>
</span></span></span></foreignobject></g></g></svg>