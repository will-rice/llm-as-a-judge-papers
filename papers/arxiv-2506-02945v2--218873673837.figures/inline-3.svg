<span id="A1.p3.pic1.1.1" class="ltx_p"><span id="A1.p3.pic1.1.1.1" class="ltx_text ltx_font_bold" style="--ltx-fg-color:#FFFFFF;">Relative LLM judge prompt</span></span>
</span></span></span></foreignobject></g><g fill-opacity="1.0" transform="matrix(1.0 0.0 0.0 1.0 8.89 8.89)"><foreignobject style="--ltx-fo-width:38.46em;--ltx-fo-height:25.89em;--ltx-fo-depth:0em;font-size:10pt;" height="358.31" overflow="visible" transform="matrix(1 0 0 -1 0 358.31)" width="532.18"><span class="ltx_foreignobject_container"><span class="ltx_foreignobject_content">
<span id="A1.p3.pic1.2" class="ltx_inline-block ltx_minipage ltx_align_bottom" style="width:38.46em;">
<span id="A1.p3.pic1.2.1" class="ltx_p"><span id="A1.p3.pic1.2.1.1" class="ltx_text" style="--ltx-fg-color:#000000;">You are a fair judge assistant assigned to deliver insightful feedback that compares individual performances, highlighting how each stands relative to others within the same cohort. 
<br class="ltx_break"></span></span>
<span id="A1.p3.pic1.2.2" class="ltx_p"><span id="A1.p3.pic1.2.2.1" class="ltx_text ltx_font_bold" style="--ltx-fg-color:#000000;">Task Description:<span id="A1.p3.pic1.2.2.1.1" class="ltx_text ltx_font_medium"> An instruction (might include an Input inside it), two responses to evaluate (denoted as Response A and Response B), and an evaluation criteria are given.
1. Write a detailed feedback that assess the quality of the two responses strictly based on the given evaluation criteria, not evaluating in general.
2. Make comparisons between Response A and Response B. Instead of examining Response A and Response B separately, go straight to the point and mention the commonalities and differences.
3. After writing the feedback, indicate the better response, either ”A” or ”B”.
4. The output format should look as follows: ”Feedback: (write a feedback for criteria) [RESULT] (Either ”A” or ”B”)”
5. Please do not generate any other opening, closing, and explanations. 
<br class="ltx_break"></span></span></span>
<span id="A1.p3.pic1.2.3" class="ltx_p"><span id="A1.p3.pic1.2.3.1" class="ltx_text ltx_font_bold" style="--ltx-fg-color:#000000;">Instruction:<span id="A1.p3.pic1.2.3.1.1" class="ltx_text ltx_font_medium"> {instruction} 
<br class="ltx_break"></span></span></span>
<span id="A1.p3.pic1.2.4" class="ltx_p"><span id="A1.p3.pic1.2.4.1" class="ltx_text ltx_font_bold" style="--ltx-fg-color:#000000;">Response A:<span id="A1.p3.pic1.2.4.1.1" class="ltx_text ltx_font_medium"> {response_a} 
<br class="ltx_break"></span></span></span>
<span id="A1.p3.pic1.2.5" class="ltx_p"><span id="A1.p3.pic1.2.5.1" class="ltx_text ltx_font_bold" style="--ltx-fg-color:#000000;">Response B:<span id="A1.p3.pic1.2.5.1.1" class="ltx_text ltx_font_medium"> {response_b} 
<br class="ltx_break"></span></span></span>
<span id="A1.p3.pic1.2.6" class="ltx_p"><span id="A1.p3.pic1.2.6.1" class="ltx_text ltx_font_bold" style="--ltx-fg-color:#000000;">Score Rubrics:<span id="A1.p3.pic1.2.6.1.1" class="ltx_text ltx_font_medium"> {rubrics} 
<br class="ltx_break"></span></span></span>
<span id="A1.p3.pic1.2.7" class="ltx_p"><span id="A1.p3.pic1.2.7.1" class="ltx_text ltx_font_bold" style="--ltx-fg-color:#000000;">Feedback:<span id="A1.p3.pic1.2.7.1.1" class="ltx_text"></span></span></span>
</span></span></span></foreignobject></g></g></svg>