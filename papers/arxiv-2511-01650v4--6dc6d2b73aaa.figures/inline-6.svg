<span id="A10.SS2.SSS0.Px2.p2.pic1.1.4" class="ltx_p"><span id="A10.SS2.SSS0.Px2.p2.pic1.1.4.1" class="ltx_text ltx_font_typewriter" style="--ltx-fg-color:#000000;">A correct solution to this problem obtains the intermediate quantities listed below.
