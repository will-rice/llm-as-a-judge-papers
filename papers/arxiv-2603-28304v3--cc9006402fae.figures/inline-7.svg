<span id="A2.p4.pic1.1" class="ltx_inline-block ltx_minipage ltx_align_bottom" style="width:43.8em;">
<span id="A2.p4.pic1.1.1" class="ltx_p"><span id="A2.p4.pic1.1.1.1" class="ltx_text ltx_font_typewriter ltx_font_bold" style="--ltx-fg-color:#FFFFFF;">Reference Guided Grading COT Judge Prompt</span></span>
</span></span></span></foreignobject></g><g fill-opacity="1.0" transform="matrix(1.0 0.0 0.0 1.0 23.56 18.76)"><foreignobject style="--ltx-fo-width:41.72em;--ltx-fo-height:16.21em;--ltx-fo-depth:0.22em;font-size:10pt;" height="227.39" overflow="visible" transform="matrix(1 0 0 -1 0 224.32)" width="577.29"><span class="ltx_foreignobject_container"><span class="ltx_foreignobject_content">
<span id="A2.p4.pic1.2" class="ltx_inline-block ltx_minipage ltx_align_bottom" style="width:41.72em;">
<span id="A2.p4.pic1.2.1" class="ltx_p"><span id="A2.p4.pic1.2.1.1" class="ltx_text ltx_font_typewriter" style="--ltx-fg-color:#000000;">Please act as an impartial judge and evaluate the quality of the responses provided by two AI assistants to the user question displayed below. Your evaluation should consider correctness and helpfulness. You will be given a reference answer, assistant A’s answer, and assistant B’s answer. Your job is to evaluate which assistant’s answer is better.
</span></span>
<span id="A2.p4.pic1.2.2" class="ltx_p"><span id="A2.p4.pic1.2.2.1" class="ltx_text ltx_font_typewriter" style="--ltx-fg-color:#000000;">First, compare assistant A’s answer and assistant B’s answer against the reference answer for correctness, completeness, and helpfulness. Then identify any mistakes, omissions, or misleading claims in each answer. Finally, compare the two assistants directly and explain which answer is better overall, while avoiding position bias, length bias, and any bias toward model names.
</span></span>
<span id="A2.p4.pic1.2.3" class="ltx_p"><span id="A2.p4.pic1.2.3.1" class="ltx_text ltx_font_typewriter" style="--ltx-fg-color:#000000;">Respond ONLY with valid JSON using exactly these two keys:
</span></span><pre id="A2.p4.pic1.2.4" class="ltx_verbatim ltx_font_typewriter" style="--ltx-fg-color:#000000;">
{&quot;judge_reason&quot;:&quot;&lt;brief explanation&gt;&quot;
,&quot;judge result&quot;:&quot;A&quot;}
</pre>
<span id="A2.p4.pic1.2.5" class="ltx_p"><span id="A2.p4.pic1.2.5.1" class="ltx_text ltx_font_typewriter" style="--ltx-fg-color:#000000;">Use ‘‘A’’ if assistant A is better, ‘‘B’’ if assistant B is better, and ‘‘C’’ for a tie.
Do not output markdown or any extra text outside the JSON object.
</span></span>
</span></span></span></foreignobject></g></g></svg>