<svg id="A7.p5.pic1" class="ltx_picture" height="524.46" overflow="visible" version="1.1" viewbox="0 0 653.15 524.46" width="653.15"><g style="--ltx-stroke-color:#000000;--ltx-fill-color:#000000;" fill="#000000" stroke="#000000" stroke-width="0.4pt" transform="translate(0,524.46) matrix(1 0 0 -1 0 0)"><g style="--ltx-fill-color:#663300;" fill="#663300" fill-opacity="1.0"><path style="stroke:none" d="M 0 5.91 L 0 518.56 C 0 521.82 2.64 524.46 5.91 524.46 L 647.24 524.46 C 650.51 524.46 653.15 521.82 653.15 518.56 L 653.15 5.91 C 653.15 2.64 650.51 0 647.24 0 L 5.91 0 C 2.64 0 0 2.64 0 5.91 Z" /></g><g style="--ltx-fill-color:#FFF9F2;" fill="#FFF9F2" fill-opacity="1.0"><path style="stroke:none" d="M 1.97 5.91 L 1.97 500.35 L 651.18 500.35 L 651.18 5.91 C 651.18 3.73 649.42 1.97 647.24 1.97 L 5.91 1.97 C 3.73 1.97 1.97 3.73 1.97 5.91 Z" /></g><g fill-opacity="1.0" transform="matrix(1.0 0.0 0.0 1.0 21.65 508.95)"><foreignobject style="--ltx-fo-width:38.32em;--ltx-fo-height:0.69em;--ltx-fo-depth:0.19em;font-size:10pt;" height="12.3" overflow="visible" transform="matrix(1 0 0 -1 0 9.61)" width="530.24"><span class="ltx_foreignobject_container"><span class="ltx_foreignobject_content">
<span id="A7.p5.pic1.1" class="ltx_inline-block ltx_minipage ltx_align_bottom" style="width:38.32em;">
<span id="A7.p5.pic1.1.1" class="ltx_p"><span id="A7.p5.pic1.1.1.1" class="ltx_text ltx_font_bold" style="--ltx-fg-color:#FFFFFF;">Example of a simple task from PPE Preference Dataset</span></span>
</span></span></span></foreignobject></g><g fill-opacity="1.0" transform="matrix(1.0 0.0 0.0 1.0 21.65 118.86)"><foreignobject style="--ltx-fo-width:44.07em;--ltx-fo-height:26.72em;--ltx-fo-depth:7.59em;font-size:10pt;" height="474.77" overflow="visible" transform="matrix(1 0 0 -1 0 369.68)" width="609.8"><span class="ltx_foreignobject_container"><span class="ltx_foreignobject_content">
<span id="A7.p5.pic1.2" class="ltx_inline-block ltx_minipage ltx_align_bottom" style="width:44.07em;">
<span id="A7.p5.pic1.2.1" class="ltx_p"><span id="A7.p5.pic1.2.1.1" class="ltx_text" style="--ltx-fg-color:#000000;">Prompt:</span></span>
<span id="A7.p5.pic1.2.2" class="ltx_p"><span id="A7.p5.pic1.2.2.1" class="ltx_text" style="--ltx-fg-color:#000000;">There are 10 apples today. 1 was eaten yesterday. How many are left now? <span id="A7.p5.pic1.2.2.1.1" class="ltx_text ltx_font_italic">(Original prompt in Chinese – translated to English for illustration)</span></span></span>
<span id="A7.p5.pic1.2.3" class="ltx_p"><span id="A7.p5.pic1.2.3.1" class="ltx_text" style="--ltx-fg-color:#000000;">Initial rubrics:</span></span>
<span id="A7.I6" class="ltx_enumerate" style="--ltx-enum-leftmargin:1.2em;">
<span id="A7.I6.i1" class="ltx_item" style="list-style-type:none;"><span class="ltx_tag ltx_tag_item">1.</span> 
<span id="A7.I6.i1.p1" class="ltx_para">
<span id="A7.I6.i1.p1.1" class="ltx_p"><span id="A7.I6.i1.p1.1.1" class="ltx_text" style="--ltx-fg-color:#000000;">States that there are 10 apples remaining today, regardless of yesterday’s consumption.</span></span>
</span></span>
<span id="A7.I6.i2" class="ltx_item" style="list-style-type:none;"><span class="ltx_tag ltx_tag_item">2.</span> 
<span id="A7.I6.i2.p1" class="ltx_para">
<span id="A7.I6.i2.p1.1" class="ltx_p"><span id="A7.I6.i2.p1.1.1" class="ltx_text" style="--ltx-fg-color:#000000;">Explains that the apples consumed yesterday do not affect today’s apple count of 10.</span></span>
</span></span>
<span id="A7.I6.i3" class="ltx_item" style="list-style-type:none;"><span class="ltx_tag ltx_tag_item">3.</span> 
<span id="A7.I6.i3.p1" class="ltx_para">
<span id="A7.I6.i3.p1.1" class="ltx_p"><span id="A7.I6.i3.p1.1.1" class="ltx_text" style="--ltx-fg-color:#000000;">Acknowledges that the count of apples as of today is based on the statement “There are 10 apples today” without reference to past events.</span></span>
</span></span>
<span id="A7.I6.i4" class="ltx_item" style="list-style-type:none;"><span class="ltx_tag ltx_tag_item">4.</span> 
<span id="A7.I6.i4.p1" class="ltx_para">
<span id="A7.I6.i4.p1.1" class="ltx_p"><span id="A7.I6.i4.p1.1.1" class="ltx_text" style="--ltx-fg-color:#000000;">Provides a rationale or explanation for considering the past apple consumption as irrelevant to the current count.</span></span>
</span></span>
<span id="A7.I6.i5" class="ltx_item" style="list-style-type:none;"><span class="ltx_tag ltx_tag_item">5.</span> 
<span id="A7.I6.i5.p1" class="ltx_para">
<span id="A7.I6.i5.p1.1" class="ltx_p"><span id="A7.I6.i5.p1.1.1" class="ltx_text" style="--ltx-fg-color:#000000;">Avoids making quantitative calculations that incorrectly deduct apples from today’s count based on past consumption.</span></span>
</span></span>
<span id="A7.I6.i6" class="ltx_item" style="list-style-type:none;"><span class="ltx_tag ltx_tag_item">6.</span> 
<span id="A7.I6.i6.p1" class="ltx_para">
<span id="A7.I6.i6.p1.1" class="ltx_p"><span id="A7.I6.i6.p1.1.1" class="ltx_text" style="--ltx-fg-color:#000000;">Does not ambiguously imply there could be fewer or more than 10 apples today without any additional information provided in the prompt.</span></span>
</span></span>
</span>
<span id="A7.p5.pic1.2.4" class="ltx_p"><span id="A7.p5.pic1.2.4.1" class="ltx_text" style="--ltx-fg-color:#000000;">Final rubrics:</span></span>
<span id="A7.I7" class="ltx_enumerate" style="--ltx-enum-leftmargin:1.2em;">
<span id="A7.I7.i1" class="ltx_item" style="list-style-type:none;"><span class="ltx_tag ltx_tag_item">1.</span> 
<span id="A7.I7.i1.p1" class="ltx_para">
<span id="A7.I7.i1.p1.1" class="ltx_p"><span id="A7.I7.i1.p1.1.1" class="ltx_text" style="--ltx-fg-color:#000000;">(Same as the initial rubrics – omit for brevity.)</span></span>
</span></span>
<span id="A7.I7.i2" class="ltx_item" style="list-style-type:none;"><span class="ltx_tag ltx_tag_item">2.</span> 
<span id="A7.I7.i2.p1" class="ltx_para">
<span id="A7.I7.i2.p1.1" class="ltx_p"><span id="A7.I7.i2.p1.1.1" class="ltx_text" style="--ltx-fg-color:#000000;">Provides a creative interpretation of the scenario, incorporating narrative or imaginative elements that explain the unchanged apple count.</span></span>
</span></span>
<span id="A7.I7.i3" class="ltx_item" style="list-style-type:none;"><span class="ltx_tag ltx_tag_item">3.</span> 
<span id="A7.I7.i3.p1" class="ltx_para">
<span id="A7.I7.i3.p1.1" class="ltx_p"><span id="A7.I7.i3.p1.1.1" class="ltx_text" style="--ltx-fg-color:#000000;">Uses narrative or imaginative storytelling elements without deviating from the stated fact that today’s count is 10 apples, enhancing engagement while maintaining accuracy.</span></span>
</span></span>
</span>
</span></span></span></foreignobject></g></g></svg>