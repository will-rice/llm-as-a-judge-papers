<br class="ltx_break" style="--ltx-break-space:9.3pt;"><span id="S1.F1.pic1.2.2.1.1" class="ltx_text ltx_font_medium">
<span id="S1.F1.pic1.2.2.1.1.1" class="ltx_text ltx_font_italic">How can an open-source reinforcement learning system achieve state-of-the-art mathematical reasoning on benchmarks such as AIME 2024 without relying on proprietary training recipes?
<br class="ltx_break" style="--ltx-break-space:18.5pt;"></span></span></span></span>
<span id="S1.F1.pic1.2.3" class="ltx_p ltx_align_left"><span id="S1.F1.pic1.2.3.1" class="ltx_text ltx_font_bold" style="font-size:90%;">Gap-grounded target:<span id="S1.F1.pic1.2.3.1.1" class="ltx_text ltx_font_medium"> open, reproducible RL for strong mathematical reasoning.</span></span></span>
</span></span></span></foreignobject></g><g style="--ltx-stroke-color:#99FF99;--ltx-fill-color:#F2FFF2;" fill="#F2FFF2" stroke="#99FF99" stroke-width="0.8pt"><path d="M 731.86 137.8 L 476.27 137.8 C 472.45 137.8 469.35 134.7 469.35 130.88 L 469.35 -130.88 C 469.35 -134.7 472.45 -137.8 476.27 -137.8 L 731.86 -137.8 C 735.68 -137.8 738.78 -134.7 738.78 -130.88 L 738.78 130.88 C 738.78 134.7 735.68 137.8 731.86 137.8 Z M 469.35 -137.8" /></g><g style="--ltx-stroke-color:#000000;--ltx-fill-color:#000000;" fill="#000000" stroke="#000000" stroke-width="0.8pt" transform="matrix(1.0 0.0 0.0 1.0 485.95 86.48)"><foreignobject style="--ltx-fo-width:18.45em;--ltx-fo-height:0.63em;--ltx-fo-depth:13.13em;font-size:10pt;" height="190.26" overflow="visible" transform="matrix(1 0 0 -1 0 8.65)" width="255.3"><span class="ltx_foreignobject_container"><span class="ltx_foreignobject_content">
