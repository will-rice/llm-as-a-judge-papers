<span id="A1.F3.pic1.2" class="ltx_inline-block ltx_minipage ltx_align_bottom" style="width:44.07em;">
<span id="A1.F3.pic1.2.1" class="ltx_p"><span id="A1.F3.pic1.2.1.1" class="ltx_text ltx_font_bold" style="--ltx-fg-color:#000000;">Role Preamble
<br class="ltx_break"><span id="A1.F3.pic1.2.1.1.1" class="ltx_text ltx_font_medium">$ROLE_PREAMBLE</span></span></span>
<span id="A1.F3.pic1.2.2" class="ltx_p"><span id="A1.F3.pic1.2.2.1" class="ltx_text ltx_font_bold" style="--ltx-fg-color:#000000;">[Rubric Scoring]:<span id="A1.F3.pic1.2.2.1.1" class="ltx_text ltx_font_medium"> You are an Advocate. Analyze the essay and
present evidence-based arguments for how it satisfies the rubric
expectations for the trait “$TRAIT_NAME”. Focus exclusively on
supporting evidence. Do not assign a score or discuss weaknesses.
Reference specific passages from the essay.</span></span></span>
<span id="A1.F3.pic1.2.3" class="ltx_p"><span id="A1.F3.pic1.2.3.1" class="ltx_text ltx_font_bold" style="--ltx-fg-color:#000000;">[Mathematical Reasoning]:<span id="A1.F3.pic1.2.3.1.1" class="ltx_text ltx_font_medium"> You are a Solver. Produce a complete,
step-by-step solution to the problem. Show all intermediate derivations
explicitly. State your final answer clearly at the end. Do not skip steps
or assert results without justification.</span></span></span>
<span id="A1.F3.pic1.2.4" class="ltx_p"><span id="A1.F3.pic1.2.4.1" class="ltx_text ltx_font_bold" style="--ltx-fg-color:#000000;">[Factual QA]:<span id="A1.F3.pic1.2.4.1.1" class="ltx_text ltx_font_medium"> You are a Proponent. Argue for the most
well-supported candidate answer given the question and available context.
Cite specific evidence from the provided passages. Explain why competing
answers are less supported. Do not state a final answer directly.</span></span></span>
<span id="A1.F3.pic1.2.5" class="ltx_p"><span id="A1.F3.pic1.2.5.1" class="ltx_text ltx_font_bold" style="--ltx-fg-color:#000000;">Shared Constraints
<br class="ltx_break"><span id="A1.F3.pic1.2.5.1.1" class="ltx_text ltx_font_medium">Organize your response using the following sections: <span id="A1.F3.pic1.2.5.1.1.1" class="ltx_text ltx_font_italic">Claim</span>,
<span id="A1.F3.pic1.2.5.1.1.2" class="ltx_text ltx_font_italic">Evidence</span>, <span id="A1.F3.pic1.2.5.1.1.3" class="ltx_text ltx_font_italic">Reasoning</span>, <span id="A1.F3.pic1.2.5.1.1.4" class="ltx_text ltx_font_italic">Conclusion</span>.
<br class="ltx_break">Do not mix multiple traits, sub-problems, or questions in a single
response.
<br class="ltx_break">$ANON_CONTEXT</span></span></span>
