<span id="A8.p5.pic1.2.1" class="ltx_p"><span id="A8.p5.pic1.2.1.1" class="ltx_text" style="--ltx-fg-color:#000000;">You will be provided with news articles related to climate change.
<br class="ltx_break">Your task is to annotate each article by answering a series of yes/no questions based on the main themes or frames present in the text.
<br class="ltx_break">Focus on the title and lead paragraph(s) to reflect the primary focus of the article.
<br class="ltx_break">If the theme or frame is not explicitly mentioned, answer ’no’.
<br class="ltx_break">You can only answer with ’yes’ or ’no’.
<br class="ltx_break">
<br class="ltx_break">Answer the following questions:
<br class="ltx_break">[QUESTION_GROUP] 
<br class="ltx_break">
<br class="ltx_break">Please follow the JSON format below when answering the questions:
<br class="ltx_break">```json 
<br class="ltx_break">{
<br class="ltx_break"><span id="A8.p5.pic1.2.1.1.1" class="ltx_text"></span> [JSON_GROUP_GUIDELINES]
<br class="ltx_break">}
<br class="ltx_break">```
<br class="ltx_break">
<br class="ltx_break">** Article **
<br class="ltx_break">[ARTICLE]</span></span>
</span></span></span></foreignobject></g></g></svg>