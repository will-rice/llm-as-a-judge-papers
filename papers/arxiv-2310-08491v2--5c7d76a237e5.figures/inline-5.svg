<br class="ltx_break">An instruction (might include an Input inside it), a response to evaluate, a reference answer that gets a score of 5, and a score rubric representing an evaluation criterion is given.
<br class="ltx_break">1. Write a detailed feedback that assesses the quality of the response strictly based on the given score rubric, not evaluating in general.
<br class="ltx_break">2. After writing a feedback, write a score that is an integer between 1 and 5. You should refer to the score rubric.
<br class="ltx_break">3. The output format should look as follows: F̈eedback: (write a feedback for criteria) [RESULT] (an integer number between 1 and 5)\̈\ 
