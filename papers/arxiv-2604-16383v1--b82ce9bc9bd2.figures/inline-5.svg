<svg id="A5.T7.pic1" class="ltx_picture ltx_centering" height="497.2" overflow="visible" version="1.1" viewbox="0 0 653.15 497.2" width="653.15"><g style="--ltx-stroke-color:#000000;--ltx-fill-color:#000000;" fill="#000000" stroke="#000000" stroke-width="0.4pt" transform="translate(0,497.2) matrix(1 0 0 -1 0 0)"><g style="--ltx-fill-color:#BFBFBF;" fill="#BFBFBF" fill-opacity="1.0"><path style="stroke:none" d="M 0 5.04 L 0 492.16 C 0 494.95 2.26 497.2 5.04 497.2 L 648.11 497.2 C 650.89 497.2 653.15 494.95 653.15 492.16 L 653.15 5.04 C 653.15 2.26 650.89 0 648.11 0 L 5.04 0 C 2.26 0 0 2.26 0 5.04 Z" /></g><g style="--ltx-fill-color:#FFFFFF;" fill="#FFFFFF" fill-opacity="1.0"><path style="stroke:none" d="M 1.11 5.04 L 1.11 474.82 L 652.04 474.82 L 652.04 5.04 C 652.04 2.87 650.28 1.11 648.11 1.11 L 5.04 1.11 C 2.87 1.11 1.11 2.87 1.11 5.04 Z" /></g><g style="--ltx-fill-color:#D9D9D9;" fill="#D9D9D9" fill-opacity="1.0"><path style="stroke:none" d="M 1.11 475.92 L 1.11 492.16 C 1.11 494.33 2.87 496.1 5.04 496.1 L 648.11 496.1 C 650.28 496.1 652.04 494.33 652.04 492.16 L 652.04 475.92 Z" /></g><g fill-opacity="1.0" transform="matrix(1.0 0.0 0.0 1.0 20.79 482.55)"><foreignobject style="--ltx-fo-width:40.18em;--ltx-fo-height:0.69em;--ltx-fo-depth:0.19em;font-size:10pt;" height="12.3" overflow="visible" transform="matrix(1 0 0 -1 0 9.61)" width="555.98"><span class="ltx_foreignobject_container"><span class="ltx_foreignobject_content">
<span id="A5.T7.pic1.1" class="ltx_inline-block ltx_minipage ltx_align_bottom" style="width:40.18em;">
<span id="A5.T7.pic1.1.1" class="ltx_p"><span id="A5.T7.pic1.1.1.1" class="ltx_text ltx_font_sansserif ltx_font_bold" style="--ltx-fg-color:#000000;">General-Likert Grading Prompt</span></span>
</span></span></span></foreignobject></g><g fill-opacity="1.0" transform="matrix(1.0 0.0 0.0 1.0 20.79 12.92)"><foreignobject style="--ltx-fo-width:44.2em;--ltx-fo-height:32.53em;--ltx-fo-depth:0em;font-size:10pt;" height="450.09" overflow="visible" transform="matrix(1 0 0 -1 0 450.09)" width="611.6"><span class="ltx_foreignobject_container"><span class="ltx_foreignobject_content">
<span id="A5.T7.pic1.2" class="ltx_inline-block ltx_minipage ltx_align_bottom" style="width:44.2em;">
<span id="A5.T7.pic1.2.1" class="ltx_p"><span id="A5.T7.pic1.2.1.1" class="ltx_text" style="--ltx-fg-color:#000000;">A non-health professional (“User”) is conversing with a chat assistant (“Assistant”). Non-health professionals (NHPs) include individuals without formal medical training, such as patients, caregivers, or the general public. Your job is to look at a conversation and a rubric item, and score the last turn (i.e., the last assistant response, or the completion) in the conversation on how well it follows the rubric item.

<br class="ltx_break"></span></span>
<span id="A5.T7.pic1.2.2" class="ltx_p"><span id="A5.T7.pic1.2.2.1" class="ltx_text" style="--ltx-fg-color:#000000;"># Instructions</span></span>
<span id="A5.T7.pic1.2.3" class="ltx_p"><span id="A5.T7.pic1.2.3.1" class="ltx_text" style="--ltx-fg-color:#000000;">Return a valid JSON object with the following fields: “explanation” and “criteria_score”. Ensure all keys and string values are enclosed in double quotes.</span></span>
<span id="A5.I4" class="ltx_itemize">
<span id="A5.I4.i1" class="ltx_item" style="list-style-type:none;"><span class="ltx_tag ltx_tag_item">-</span> 
<span id="A5.I4.i1.p1" class="ltx_para">
<span id="A5.I4.i1.p1.1" class="ltx_p"><span id="A5.I4.i1.p1.1.1" class="ltx_text" style="--ltx-fg-color:#000000;">The “explanation” field should be a string explaining why the response does or does not meet the criteria of the rubric item. The evaluation should be based strictly on the content of the response and how well it aligns with the rubric item, not evaluating in general.</span></span>
</span></span>
<span id="A5.I4.i2" class="ltx_item" style="list-style-type:none;"><span class="ltx_tag ltx_tag_item">-</span> 
<span id="A5.I4.i2.p1" class="ltx_para">
<span id="A5.I4.i2.p1.1" class="ltx_p"><span id="A5.I4.i2.p1.1.1" class="ltx_text" style="--ltx-fg-color:#000000;">The “criteria_score” field should be an integer indicating the quality of the response according to the rubric.</span></span>
</span></span>
<span id="A5.I4.i3" class="ltx_item" style="list-style-type:none;"><span class="ltx_tag ltx_tag_item">-</span> 
<span id="A5.I4.i3.p1" class="ltx_para">
<span id="A5.I4.i3.p1.1" class="ltx_p"><span id="A5.I4.i3.p1.1.1" class="ltx_text" style="--ltx-fg-color:#000000;">One important exception: if a criterion says “such as”, “for example”, or “including”, the response need not include all listed examples to meet the criterion.</span></span>
</span></span>
</span>
<span id="A5.T7.pic1.2.4" class="ltx_p"><span id="A5.T7.pic1.2.4.1" class="ltx_text" style="--ltx-fg-color:#000000;"># Example Format</span></span><pre id="A5.T7.pic1.2.5" class="ltx_verbatim" style="--ltx-fg-color:#000000;">“‘json
{
  &quot;explanation&quot;: &quot;…&quot;,
  &quot;criteria_score&quot;: 2
}
“‘
</pre>
<span id="A5.T7.pic1.2.6" class="ltx_p"><span id="A5.T7.pic1.2.6.1" class="ltx_text" style="--ltx-fg-color:#000000;"># Final instruction</span></span>
<span id="A5.T7.pic1.2.7" class="ltx_p"><span id="A5.T7.pic1.2.7.1" class="ltx_text" style="--ltx-fg-color:#000000;">Return just the json object in markdown format. Do not include any other text in the response.

<br class="ltx_break"></span></span>
<span id="A5.T7.pic1.2.8" class="ltx_p"><span id="A5.T7.pic1.2.8.1" class="ltx_text" style="--ltx-fg-color:#000000;"># Conversation</span></span>
<span id="A5.T7.pic1.2.9" class="ltx_p"><span id="A5.T7.pic1.2.9.1" class="ltx_text" style="--ltx-fg-color:#000000;">{conversation}

<br class="ltx_break"></span></span>
<span id="A5.T7.pic1.2.10" class="ltx_p"><span id="A5.T7.pic1.2.10.1" class="ltx_text" style="--ltx-fg-color:#000000;"># Rubric</span></span>
<span id="A5.T7.pic1.2.11" class="ltx_p"><span id="A5.T7.pic1.2.11.1" class="ltx_text" style="--ltx-fg-color:#000000;">Does the answer omit any content it shouldn’t?</span></span>
<span id="A5.T7.pic1.2.12" class="ltx_p"><span id="A5.T7.pic1.2.12.1" class="ltx_text" style="--ltx-fg-color:#000000;">Score 1: Yes great clinical significance
<br class="ltx_break">Score 2: Yes little clinical significance
<br class="ltx_break">Score 3: No</span></span>
</span></span></span></foreignobject></g></g></svg>