<span id="A5.p2.pic1.1.1" class="ltx_p"><span id="A5.p2.pic1.1.1.1" class="ltx_text" style="--ltx-fg-color:#FFFFFF;">Pairwise Feedback Prompt</span></span>
</span></span></span></foreignobject></g><g fill-opacity="1.0" transform="matrix(1.0 0.0 0.0 1.0 21.65 16.85)"><foreignobject style="--ltx-fo-width:34.88em;--ltx-fo-height:38.7em;--ltx-fo-depth:0.22em;font-size:10pt;" height="538.6" overflow="visible" transform="matrix(1 0 0 -1 0 535.52)" width="482.64"><span class="ltx_foreignobject_container"><span class="ltx_foreignobject_content">
<span id="A5.p2.pic1.2" class="ltx_inline-block ltx_minipage ltx_align_bottom" style="width:34.88em;">
<span id="A5.p2.pic1.2.1" class="ltx_p"><span id="A5.p2.pic1.2.1.1" class="ltx_text ltx_font_typewriter" style="--ltx-fg-color:#000000;">Please act as an impartial judge and evaluate the quality of the responses provided by two AI assistants to the user question displayed below. Your evaluation should consider correctness and helpfulness. You will be given assistant A’s answer, and assistant B’s answer. Your job is to evaluate which assistant’s answer is better. You should independently solve the user question step-by-step first. Then compare both assistants’ answers with your answer. Identify and correct any mistakes. Avoid any position biases and ensure that the order in which the responses were presented does not influence your decision. Do not allow the length of the responses to influence your evaluation. Do not favor certain names of the assistants. Be as objective as possible. After providing your explanation, output your final verdict by strictly following this format: &quot;[[A]]&quot; if
assistant A is better, &quot;[[B]]&quot; if assistant B is better.
</span></span>
<span id="A5.p2.pic1.2.2" class="ltx_p"><span id="A5.p2.pic1.2.2.1" class="ltx_text ltx_font_typewriter" style="--ltx-fg-color:#000000;">## Instruction: 
</span></span>
<span id="A5.p2.pic1.2.3" class="ltx_p"><span id="A5.p2.pic1.2.3.1" class="ltx_text ltx_font_typewriter" style="--ltx-fg-color:#000000;">[The Start of Assistant A’s Answer]
</span></span>
<span id="A5.p2.pic1.2.4" class="ltx_p"><span id="A5.p2.pic1.2.4.1" class="ltx_text ltx_font_typewriter" style="--ltx-fg-color:#000000;">[RESPONSE A]
</span></span>
<span id="A5.p2.pic1.2.5" class="ltx_p"><span id="A5.p2.pic1.2.5.1" class="ltx_text ltx_font_typewriter" style="--ltx-fg-color:#000000;">[The End of Assistant A’s Answer]
</span></span>
<span id="A5.p2.pic1.2.6" class="ltx_p"><span id="A5.p2.pic1.2.6.1" class="ltx_text ltx_font_typewriter" style="--ltx-fg-color:#000000;">[The Start of Assistant B’s Answer]
</span></span>
<span id="A5.p2.pic1.2.7" class="ltx_p"><span id="A5.p2.pic1.2.7.1" class="ltx_text ltx_font_typewriter" style="--ltx-fg-color:#000000;">[RESPONSE B]
</span></span>
<span id="A5.p2.pic1.2.8" class="ltx_p"><span id="A5.p2.pic1.2.8.1" class="ltx_text ltx_font_typewriter" style="--ltx-fg-color:#000000;">[The End of Assistant B’s Answer]
</span></span>
<span id="A5.p2.pic1.2.9" class="ltx_p"><span id="A5.p2.pic1.2.9.1" class="ltx_text ltx_font_typewriter" style="--ltx-fg-color:#000000;">Please output the generated content in a json format, for example:
{
&quot;reason&quot;: // string, reasons behind the chosen preferred answer
&quot;prefered answer&quot;: // string, the prefered answer you selected, [[A]] or [[B]]
}
</span></span>
