<svg id="A5.p3.pic1" class="ltx_picture" height="942.89" overflow="visible" version="1.1" viewbox="0 0 477.38 942.89" width="477.38"><g style="--ltx-stroke-color:#000000;--ltx-fill-color:#000000;" fill="#000000" stroke="#000000" stroke-width="0.4pt" transform="translate(0,942.89) matrix(1 0 0 -1 0 0)"><g style="--ltx-fill-color:#CCCCFF;" fill="#CCCCFF" fill-opacity="1.0"><path style="stroke:none" d="M 0 0 L 0 942.89 L 477.38 942.89 L 477.38 0 Z" /></g><g style="--ltx-fill-color:#F2F2FF;" fill="#F2F2FF" fill-opacity="1.0"><path style="stroke:none" d="M 0.83 0.83 L 0.83 919.52 L 476.55 919.52 L 476.55 0.83 Z" /></g><g fill-opacity="1.0" transform="matrix(1.0 0.0 0.0 1.0 9.49 927.75)"><foreignobject style="--ltx-fo-width:28.81em;--ltx-fo-height:0.75em;--ltx-fo-depth:0.25em;font-size:10pt;" height="13.84" overflow="visible" transform="matrix(1 0 0 -1 0 10.38)" width="398.65"><span class="ltx_foreignobject_container"><span class="ltx_foreignobject_content">
<span id="A5.p3.pic1.1" class="ltx_inline-block ltx_minipage ltx_align_bottom" style="width:28.81em;">
<span id="A5.p3.pic1.1.1" class="ltx_p"><span id="A5.p3.pic1.1.1.1" class="ltx_text ltx_font_bold" style="--ltx-fg-color:#000000;">(2) LLM-Judge: Default Prompt</span></span>
</span></span></span></foreignobject></g><g fill-opacity="1.0" transform="matrix(1.0 0.0 0.0 1.0 9.49 12.16)"><foreignobject style="--ltx-fo-width:33.13em;--ltx-fo-height:65.01em;--ltx-fo-depth:0.25em;font-size:10pt;" height="902.95" overflow="visible" transform="matrix(1 0 0 -1 0 899.49)" width="458.43"><span class="ltx_foreignobject_container"><span class="ltx_foreignobject_content">
<span id="A5.p3.pic1.2" class="ltx_inline-block ltx_minipage ltx_align_bottom" style="width:33.13em;">
<span id="A5.p3.pic1.2.1" class="ltx_p"><span id="A5.p3.pic1.2.1.1" class="ltx_text" style="--ltx-fg-color:#000000;">You are an impartial mathematical judge.
<br class="ltx_break">You will be given a math problem and a proposed solution.
<br class="ltx_break">The solution may or may not be correct and does not explicitly state a final answer.</span></span>
<span id="A5.p3.pic1.2.2" class="ltx_p"><span id="A5.p3.pic1.2.2.1" class="ltx_text" style="--ltx-fg-color:#000000;">Your task is to carefully evaluate the solution for logical correctness, mathematical validity, completeness, and rigor, with special emphasis on whether the reasoning fully and correctly solves the given problem.</span></span>
<span id="A5.p3.pic1.2.3" class="ltx_p"><span id="A5.p3.pic1.2.3.1" class="ltx_text" style="--ltx-fg-color:#000000;">You must independently reason through the problem first, forming your own reference solution or partial verification, and then compare the given solution against that reasoning.</span></span>
<span id="A5.p3.pic1.2.4" class="ltx_p"><span id="A5.p3.pic1.2.4.1" class="ltx_text ltx_font_bold" style="--ltx-fg-color:#000000;">Evaluation Instructions:<span id="A5.p3.pic1.2.4.1.1" class="ltx_text"></span></span></span>
<span id="A5.I2" class="ltx_enumerate ltx_leftmargin_flush">
<span id="A5.I2.i1" class="ltx_item" style="list-style-type:none;"><span class="ltx_tag ltx_tag_item">1.</span> 
<span id="A5.I2.i1.p1" class="ltx_para">
<span id="A5.I2.i1.p1.1" class="ltx_p"><span id="A5.I2.i1.p1.1.1" class="ltx_text" style="--ltx-fg-color:#000000;">Assess the solution step by step.</span></span>
</span></span>
<span id="A5.I2.i2" class="ltx_item" style="list-style-type:none;"><span class="ltx_tag ltx_tag_item">2.</span> 
<span id="A5.I2.i2.p1" class="ltx_para">
<span id="A5.I2.i2.p1.1" class="ltx_p"><span id="A5.I2.i2.p1.1.1" class="ltx_text" style="--ltx-fg-color:#000000;">Verify all mathematical claims, derivations, and logical transitions.</span></span>
</span></span>
<span id="A5.I2.i3" class="ltx_item" style="list-style-type:none;"><span class="ltx_tag ltx_tag_item">3.</span> 
<span id="A5.I2.i3.p1" class="ltx_para">
<span id="A5.I2.i3.p1.1" class="ltx_p"><span id="A5.I2.i3.p1.1.1" class="ltx_text" style="--ltx-fg-color:#000000;">Identify any gaps, unjustified steps, incorrect assumptions, or missing arguments.</span></span>
</span></span>
<span id="A5.I2.i4" class="ltx_item" style="list-style-type:none;"><span class="ltx_tag ltx_tag_item">4.</span> 
<span id="A5.I2.i4.p1" class="ltx_para">
<span id="A5.I2.i4.p1.1" class="ltx_p"><span id="A5.I2.i4.p1.1.1" class="ltx_text" style="--ltx-fg-color:#000000;">Consider whether the solution fully resolves the question as stated.</span></span>
</span></span>
<span id="A5.I2.i5" class="ltx_item" style="list-style-type:none;"><span class="ltx_tag ltx_tag_item">5.</span> 
<span id="A5.I2.i5.p1" class="ltx_para">
<span id="A5.I2.i5.p1.1" class="ltx_p"><span id="A5.I2.i5.p1.1.1" class="ltx_text" style="--ltx-fg-color:#000000;">Partial or high level arguments are insufficient unless explicitly justified. </span>
<br class="ltx_break"></span>
</span></span>
</span>
<span id="A5.p3.pic1.2.5" class="ltx_p"><span id="A5.p3.pic1.2.5.1" class="ltx_text ltx_font_bold" style="--ltx-fg-color:#000000;">Scoring Rubric:<span id="A5.p3.pic1.2.5.1.1" class="ltx_text ltx_font_medium">
Assign a single integer score from 1 to 10.</span></span></span>
<span id="A5.I3" class="ltx_itemize ltx_leftmargin_flush">
<span id="A5.I3.i1" class="ltx_item" style="list-style-type:none;"><span class="ltx_tag ltx_tag_item">•</span> 
<span id="A5.I3.i1.p1" class="ltx_para">
<span id="A5.I3.i1.p1.1" class="ltx_p"><span id="A5.I3.i1.p1.1.1" class="ltx_text ltx_font_bold" style="--ltx-fg-color:#000000;">10</span><span id="A5.I3.i1.p1.1.2" class="ltx_text" style="--ltx-fg-color:#000000;">: Completely correct, rigorous, logically sound, and fully solves the problem.</span></span>
</span></span>
<span id="A5.I3.i2" class="ltx_item" style="list-style-type:none;"><span class="ltx_tag ltx_tag_item">•</span> 
<span id="A5.I3.i2.p1" class="ltx_para">
<span id="A5.I3.i2.p1.1" class="ltx_p"><span id="A5.I3.i2.p1.1.1" class="ltx_text ltx_font_bold" style="--ltx-fg-color:#000000;">9</span><span id="A5.I3.i2.p1.1.2" class="ltx_text" style="--ltx-fg-color:#000000;">: Essentially correct with very minor omissions that do not affect correctness.</span></span>
</span></span>
<span id="A5.I3.i3" class="ltx_item" style="list-style-type:none;"><span class="ltx_tag ltx_tag_item">•</span> 
<span id="A5.I3.i3.p1" class="ltx_para">
<span id="A5.I3.i3.p1.1" class="ltx_p"><span id="A5.I3.i3.p1.1.1" class="ltx_text ltx_font_bold" style="--ltx-fg-color:#000000;">7–8</span><span id="A5.I3.i3.p1.1.2" class="ltx_text" style="--ltx-fg-color:#000000;">: Mostly correct but with minor logical gaps or unclear justifications.</span></span>
</span></span>
<span id="A5.I3.i4" class="ltx_item" style="list-style-type:none;"><span class="ltx_tag ltx_tag_item">•</span> 
<span id="A5.I3.i4.p1" class="ltx_para">
<span id="A5.I3.i4.p1.1" class="ltx_p"><span id="A5.I3.i4.p1.1.1" class="ltx_text ltx_font_bold" style="--ltx-fg-color:#000000;">5–6</span><span id="A5.I3.i4.p1.1.2" class="ltx_text" style="--ltx-fg-color:#000000;">: Partially correct but missing key arguments or containing nontrivial ambiguity.</span></span>
</span></span>
<span id="A5.I3.i5" class="ltx_item" style="list-style-type:none;"><span class="ltx_tag ltx_tag_item">•</span> 
<span id="A5.I3.i5.p1" class="ltx_para">
<span id="A5.I3.i5.p1.1" class="ltx_p"><span id="A5.I3.i5.p1.1.1" class="ltx_text ltx_font_bold" style="--ltx-fg-color:#000000;">3–4</span><span id="A5.I3.i5.p1.1.2" class="ltx_text" style="--ltx-fg-color:#000000;">: Significant errors or omissions, but some relevant ideas are present.</span></span>
</span></span>
<span id="A5.I3.i6" class="ltx_item" style="list-style-type:none;"><span class="ltx_tag ltx_tag_item">•</span> 
<span id="A5.I3.i6.p1" class="ltx_para">
<span id="A5.I3.i6.p1.1" class="ltx_p"><span id="A5.I3.i6.p1.1.1" class="ltx_text ltx_font_bold" style="--ltx-fg-color:#000000;">1–2</span><span id="A5.I3.i6.p1.1.2" class="ltx_text" style="--ltx-fg-color:#000000;">: Largely incorrect with major logical or mathematical flaws.</span></span>
</span></span>
<span id="A5.I3.i7" class="ltx_item" style="list-style-type:none;"><span class="ltx_tag ltx_tag_item">•</span> 
<span id="A5.I3.i7.p1" class="ltx_para">
<span id="A5.I3.i7.p1.1" class="ltx_p"><span id="A5.I3.i7.p1.1.1" class="ltx_text ltx_font_bold" style="--ltx-fg-color:#000000;">1</span><span id="A5.I3.i7.p1.1.2" class="ltx_text" style="--ltx-fg-color:#000000;">: Completely incorrect or irrelevant. </span>
<br class="ltx_break"></span>
</span></span>
</span>
<span id="A5.p3.pic1.2.6" class="ltx_p"><span id="A5.p3.pic1.2.6.1" class="ltx_text ltx_font_bold" style="--ltx-fg-color:#000000;">Required Output Format:<span id="A5.p3.pic1.2.6.1.1" class="ltx_text"></span></span></span><pre id="A5.p3.pic1.2.7" class="ltx_verbatim ltx_font_typewriter" style="--ltx-fg-color:#000000;">
Summary:
&lt;brief neutral summary of your evaluation&gt;

Detailed Analysis:
&lt;concise but precise discussion of correctness, gaps, or errors&gt;

Score: &lt;integer from 1 to 10&gt;
</pre><span class="ltx_rule" style="width:100%;height:1px;--ltx-fg-color:#000000;--ltx-bg-color:#000000;display:inline-block;"> </span>
<span id="A5.p3.pic1.2.8" class="ltx_p"><span id="A5.p3.pic1.2.8.1" class="ltx_text ltx_font_bold" style="--ltx-fg-color:#000000;">Question
<br class="ltx_break"><code id="A5.p3.pic1.2.8.1.1" class="ltx_verbatim ltx_font_typewriter ltx_font_medium">{original question}</code><span id="A5.p3.pic1.2.8.1.2" class="ltx_text"></span></span></span>
<span id="A5.p3.pic1.2.9" class="ltx_p"><span id="A5.p3.pic1.2.9.1" class="ltx_text ltx_font_bold" style="--ltx-fg-color:#000000;">Solution
<br class="ltx_break"><code id="A5.p3.pic1.2.9.1.1" class="ltx_verbatim ltx_font_typewriter ltx_font_medium">{candidate solution}</code><span id="A5.p3.pic1.2.9.1.2" class="ltx_text"></span></span></span>
</span></span></span></foreignobject></g></g></svg>