<svg id="A2.SS2.p7.pic1" class="ltx_picture" height="858.63" overflow="visible" version="1.1" viewbox="0 0 550 858.63" width="550"><g style="--ltx-stroke-color:#000000;--ltx-fill-color:#000000;" fill="#000000" stroke="#000000" stroke-width="0.4pt" transform="translate(0,858.63) matrix(1 0 0 -1 0 0)"><g style="--ltx-fill-color:#1E3C78;" fill="#1E3C78" fill-opacity="1.0"><path style="stroke:none" d="M 0 5.91 L 0 852.72 C 0 855.98 2.64 858.63 5.91 858.63 L 544.09 858.63 C 547.36 858.63 550 855.98 550 852.72 L 550 5.91 C 550 2.64 547.36 0 544.09 0 L 5.91 0 C 2.64 0 0 2.64 0 5.91 Z" /></g><g style="--ltx-fill-color:#F5F7FA;" fill="#F5F7FA" fill-opacity="1.0"><path style="stroke:none" d="M 1.97 5.91 L 1.97 834.52 L 548.03 834.52 L 548.03 5.91 C 548.03 3.73 546.27 1.97 544.09 1.97 L 5.91 1.97 C 3.73 1.97 1.97 3.73 1.97 5.91 Z" /></g><g fill-opacity="1.0" transform="matrix(1.0 0.0 0.0 1.0 21.65 843.11)"><foreignobject style="--ltx-fo-width:36.62em;--ltx-fo-height:0.69em;--ltx-fo-depth:0.19em;font-size:10pt;" height="12.3" overflow="visible" transform="matrix(1 0 0 -1 0 9.61)" width="506.72"><span class="ltx_foreignobject_container"><span class="ltx_foreignobject_content">
<span id="A2.SS2.p7.pic1.1" class="ltx_inline-block ltx_minipage ltx_align_bottom" style="width:36.62em;">
<span id="A2.SS2.p7.pic1.1.1" class="ltx_p ltx_align_center"><span id="A2.SS2.p7.pic1.1.1.1" class="ltx_text ltx_font_bold ltx_font_smallcaps" style="--ltx-fg-color:#FFFFFF;">Prompt for Rubric Tree Building</span></span>
</span></span></span></foreignobject></g><g fill-opacity="1.0" transform="matrix(1.0 0.0 0.0 1.0 21.65 17.24)"><foreignobject style="--ltx-fo-width:36.62em;--ltx-fo-height:58.21em;--ltx-fo-depth:0.25em;font-size:10pt;" height="808.94" overflow="visible" transform="matrix(1 0 0 -1 0 805.48)" width="506.72"><span class="ltx_foreignobject_container"><span class="ltx_foreignobject_content">
<span id="A2.SS2.p7.pic1.2" class="ltx_inline-block ltx_minipage ltx_align_bottom" style="width:36.62em;">
<span id="A2.SS2.p7.pic1.2.1" class="ltx_p"><code id="A2.SS2.p7.pic1.2.1.1" class="ltx_verbatim ltx_font_typewriter" style="--ltx-fg-color:#000000;">##</code><span id="A2.SS2.p7.pic1.2.1.2" class="ltx_text" style="--ltx-fg-color:#000000;"> TASK DESCRIPTION
<br class="ltx_break">You are an expert software quality assurance (QA) analyst. Your task is to take a user query for a web development project and generate a structured, hierarchical rubric. This rubric will be used to evaluate a generated webpage in a verifiable, binary (implemented/not implemented) manner.</span></span>
<span id="A2.SS2.p7.pic1.2.2" class="ltx_p"><span id="A2.SS2.p7.pic1.2.2.1" class="ltx_text" style="--ltx-fg-color:#000000;">The output must be a single JSON object with <code id="A2.SS2.p7.pic1.2.2.1.1" class="ltx_verbatim ltx_font_typewriter">```</code>json and <code id="A2.SS2.p7.pic1.2.2.1.2" class="ltx_verbatim ltx_font_typewriter">```</code> wrapped around it.</span></span>
<span id="A2.SS2.p7.pic1.2.3" class="ltx_p"><span id="A2.SS2.p7.pic1.2.3.1" class="ltx_text" style="--ltx-fg-color:#000000;">The JSON object must have three top-level keys: ‘intention’, ‘static’, and ‘dynamic’.</span></span>
<span id="A2.SS2.p7.pic1.2.4" class="ltx_p"><code id="A2.SS2.p7.pic1.2.4.1" class="ltx_verbatim ltx_font_typewriter" style="--ltx-fg-color:#000000;">###</code><span id="A2.SS2.p7.pic1.2.4.2" class="ltx_text" style="--ltx-fg-color:#000000;"> JSON Structure Rules:</span></span>
<span id="A2.SS2.p7.pic1.2.5" class="ltx_p"><span id="A2.SS2.p7.pic1.2.5.1" class="ltx_text" style="--ltx-fg-color:#000000;">1. Each node in the tree must be a dictionary with two keys:</span></span>
<span id="A2.SS2.p7.pic1.2.6" class="ltx_p"><span id="A2.SS2.p7.pic1.2.6.1" class="ltx_text" style="--ltx-fg-color:#000000;">- ‘description’: A string describing the feature or goal.</span></span>
<span id="A2.SS2.p7.pic1.2.7" class="ltx_p"><span id="A2.SS2.p7.pic1.2.7.1" class="ltx_text" style="--ltx-fg-color:#000000;">- ‘children’: A list of child nodes, or None if it is a leaf node.</span></span>
<span id="A2.SS2.p7.pic1.2.8" class="ltx_p"><span id="A2.SS2.p7.pic1.2.8.1" class="ltx_text" style="--ltx-fg-color:#000000;">2. The ‘intention’ section should capture the high-level purpose and core goals of the webpage. Descriptions should be concise and conceptual overviews of what the user wants to achieve.</span></span>
<span id="A2.SS2.p7.pic1.2.9" class="ltx_p"><span id="A2.SS2.p7.pic1.2.9.1" class="ltx_text" style="--ltx-fg-color:#000000;">3. The ‘static’ section must detail all the non-interactive, visible elements of the webpage. Break down components into their smallest logical parts. For example, a “user profile card” should be broken down into “user image”, “username”, and “user bio.”</span></span>
<span id="A2.SS2.p7.pic1.2.10" class="ltx_p"><span id="A2.SS2.p7.pic1.2.10.1" class="ltx_text" style="--ltx-fg-color:#000000;">4. The ‘dynamic’ section describes all the interactive functionalities of the page.</span></span>
<span id="A2.SS2.p7.pic1.2.11" class="ltx_p"><span id="A2.SS2.p7.pic1.2.11.1" class="ltx_text" style="--ltx-fg-color:#000000;">- It must have exactly two children: one for “basic” interactions and one for “complex” interactions.</span></span>
<span id="A2.SS2.p7.pic1.2.12" class="ltx_p"><span id="A2.SS2.p7.pic1.2.12.1" class="ltx_text" style="--ltx-fg-color:#000000;">- ‘basic’: These are simple, single-step user actions. Examples include typing into a text field, clicking a non-submitting button, or selecting a dropdown option.</span></span>
<span id="A2.SS2.p7.pic1.2.13" class="ltx_p"><span id="A2.SS2.p7.pic1.2.13.1" class="ltx_text" style="--ltx-fg-color:#000000;">- ‘complex’: These are multi-step processes or actions that result in a significant change to the application’s state. Examples include submitting a form, fetching data, filtering a list of items, or navigating to a new view after an action.</span></span>
<span id="A2.SS2.p7.pic1.2.14" class="ltx_p"><span id="A2.SS2.p7.pic1.2.14.1" class="ltx_text" style="--ltx-fg-color:#000000;">5. Verifiable Leaf Nodes: Every leaf node in the entire tree (where “children” is None) must describe a specific, atomic, and verifiable requirement. The description should be a clear statement that can be evaluated as “implemented” or “not implemented”.</span></span>
<span id="A2.SS2.p7.pic1.2.15" class="ltx_p"><code id="A2.SS2.p7.pic1.2.15.1" class="ltx_verbatim ltx_font_typewriter" style="--ltx-fg-color:#000000;">##</code><span id="A2.SS2.p7.pic1.2.15.2" class="ltx_text" style="--ltx-fg-color:#000000;"> Example:</span></span>
<span id="A2.SS2.p7.pic1.2.16" class="ltx_p"><code id="A2.SS2.p7.pic1.2.16.1" class="ltx_verbatim ltx_font_typewriter" style="--ltx-fg-color:#000000;">###</code><span id="A2.SS2.p7.pic1.2.16.2" class="ltx_text" style="--ltx-fg-color:#000000;"> User Query:
<br class="ltx_break">{example_query}</span></span>
<span id="A2.SS2.p7.pic1.2.17" class="ltx_p"><code id="A2.SS2.p7.pic1.2.17.1" class="ltx_verbatim ltx_font_typewriter" style="--ltx-fg-color:#000000;">###</code><span id="A2.SS2.p7.pic1.2.17.2" class="ltx_text" style="--ltx-fg-color:#000000;"> Generated Rubric Tree (Your Output):
<br class="ltx_break"><code id="A2.SS2.p7.pic1.2.17.2.1" class="ltx_verbatim ltx_font_typewriter">```</code>json
<br class="ltx_break">{example_rubric_tree}
<br class="ltx_break"><code id="A2.SS2.p7.pic1.2.17.2.2" class="ltx_verbatim ltx_font_typewriter">```</code>
<br class="ltx_break"></span></span>
<span id="A2.SS2.p7.pic1.2.18" class="ltx_p"><span id="A2.SS2.p7.pic1.2.18.1" class="ltx_text" style="--ltx-fg-color:#000000;">Now, analyze the following user query and generate the rubric tree in the specified JSON format.</span></span>
<span id="A2.SS2.p7.pic1.2.19" class="ltx_p"><code id="A2.SS2.p7.pic1.2.19.1" class="ltx_verbatim ltx_font_typewriter" style="--ltx-fg-color:#000000;">###</code><span id="A2.SS2.p7.pic1.2.19.2" class="ltx_text" style="--ltx-fg-color:#000000;"> User Query:
<br class="ltx_break">{user_query}</span></span>
</span></span></span></foreignobject></g></g></svg>