<span id="A1.SS5.p2.pic1.1.1" class="ltx_p"><span id="A1.SS5.p2.pic1.1.1.1" class="ltx_text ltx_font_bold" style="--ltx-fg-color:#FFFFFF;">Sym. MAD Neutral, Initial — Essay (English Translation)</span></span>
</span></span></span></foreignobject></g><g fill-opacity="1.0" transform="matrix(1.0 0.0 0.0 1.0 8.57 11.33)"><foreignobject style="--ltx-fo-width:43.78em;--ltx-fo-height:21.09em;--ltx-fo-depth:0.2em;font-size:10pt;" height="294.65" overflow="visible" transform="matrix(1 0 0 -1 0 291.89)" width="605.79"><span class="ltx_foreignobject_container"><span class="ltx_foreignobject_content">
<span id="A1.SS5.p2.pic1.2" class="ltx_inline-block ltx_minipage ltx_align_bottom" style="width:43.78em;">
<span id="A1.SS5.p2.pic1.2.1" class="ltx_p"><span id="A1.SS5.p2.pic1.2.1.1" class="ltx_text ltx_verbatim ltx_font_typewriter ltx_inline-block" style="width:459.7pt;--ltx-fg-color:#000000;"><span id="A1.SS5.p2.pic1.2.1.1.1" class="ltx_inline-logical-block ltx_parbox ltx_align_top" style="width:459.7pt;">
<span id="A1.SS5.p2.pic1.p1" class="ltx_para ltx_noindent">
<span id="A1.SS5.p2.pic1.p1.1" class="ltx_p">[Role]</span>
</span></span></span></span>
<span id="A1.SS5.p2.pic1.2.2" class="ltx_p" style="width:459.7pt;"><span id="A1.SS5.p2.pic1.2.2.1" class="ltx_text ltx_verbatim ltx_font_typewriter ltx_inline-block" style="width:459.7pt;--ltx-fg-color:#000000;"><span id="A1.SS5.p2.pic1.2.2.1.1" class="ltx_inline-logical-block ltx_parbox ltx_align_top" style="width:459.7pt;">
<span id="A1.SS5.p2.pic1.p2" class="ltx_para ltx_noindent">
<span id="A1.SS5.p2.pic1.p2.1" class="ltx_p">You are an evaluator who directly scores Korean essays fairly and impartially.</span>
</span></span></span></span>
<span id="A1.SS5.p2.pic1.2.3" class="ltx_p" style="width:459.7pt;"><span id="A1.SS5.p2.pic1.2.3.1" class="ltx_text ltx_verbatim ltx_font_typewriter ltx_inline-block" style="width:459.7pt;--ltx-fg-color:#000000;"><span id="A1.SS5.p2.pic1.2.3.1.1" class="ltx_inline-logical-block ltx_parbox ltx_align_top" style="width:459.7pt;">
<span id="A1.SS5.p2.pic1.p3" class="ltx_para ltx_noindent">
<span id="A1.SS5.p2.pic1.p3.1" class="ltx_p">Read essay_text without a prior strict or lenient directional bias and</span>
</span></span></span></span>
<span id="A1.SS5.p2.pic1.2.4" class="ltx_p" style="width:459.7pt;"><span id="A1.SS5.p2.pic1.2.4.1" class="ltx_text ltx_verbatim ltx_font_typewriter ltx_inline-block" style="width:459.7pt;--ltx-fg-color:#000000;"><span id="A1.SS5.p2.pic1.2.4.1.1" class="ltx_inline-logical-block ltx_parbox ltx_align_top" style="width:459.7pt;">
<span id="A1.SS5.p2.pic1.p4" class="ltx_para ltx_noindent">
<span id="A1.SS5.p2.pic1.p4.1" class="ltx_p">evaluate all three criteria: content, organization, and expression.</span>
</span></span></span></span>
<span id="A1.SS5.p2.pic1.2.5" class="ltx_p" style="width:459.7pt;"><span id="A1.SS5.p2.pic1.2.5.1" class="ltx_text ltx_verbatim ltx_font_typewriter ltx_inline-block" style="width:459.7pt;--ltx-fg-color:#000000;"><span id="A1.SS5.p2.pic1.2.5.1.1" class="ltx_inline-logical-block ltx_parbox ltx_pruned_first ltx_align_top" style="width:459.7pt;"></span></span></span>
<span id="A1.SS5.p2.pic1.2.6" class="ltx_p" style="width:459.7pt;"><span id="A1.SS5.p2.pic1.2.6.1" class="ltx_text ltx_verbatim ltx_font_typewriter ltx_inline-block" style="width:459.7pt;--ltx-fg-color:#000000;"><span id="A1.SS5.p2.pic1.2.6.1.1" class="ltx_inline-logical-block ltx_parbox ltx_align_top" style="width:459.7pt;">
<span id="A1.SS5.p2.pic1.p6" class="ltx_para ltx_noindent">
<span id="A1.SS5.p2.pic1.p6.1" class="ltx_p">[ESSAY_CRITERIA]</span>
</span></span></span></span>
<span id="A1.SS5.p2.pic1.2.7" class="ltx_p" style="width:459.7pt;"><span id="A1.SS5.p2.pic1.2.7.1" class="ltx_text ltx_verbatim ltx_font_typewriter ltx_inline-block" style="width:459.7pt;--ltx-fg-color:#000000;"><span id="A1.SS5.p2.pic1.2.7.1.1" class="ltx_inline-logical-block ltx_parbox ltx_pruned_first ltx_align_top" style="width:459.7pt;"></span></span></span>
<span id="A1.SS5.p2.pic1.2.8" class="ltx_p" style="width:459.7pt;"><span id="A1.SS5.p2.pic1.2.8.1" class="ltx_text ltx_verbatim ltx_font_typewriter ltx_inline-block" style="width:459.7pt;--ltx-fg-color:#000000;"><span id="A1.SS5.p2.pic1.2.8.1.1" class="ltx_inline-logical-block ltx_parbox ltx_align_top" style="width:459.7pt;">
<span id="A1.SS5.p2.pic1.p8" class="ltx_para ltx_noindent">
<span id="A1.SS5.p2.pic1.p8.1" class="ltx_p">[ESSAY_RUBRIC]</span>
</span></span></span></span>
<span id="A1.SS5.p2.pic1.2.9" class="ltx_p" style="width:459.7pt;"><span id="A1.SS5.p2.pic1.2.9.1" class="ltx_text ltx_verbatim ltx_font_typewriter ltx_inline-block" style="width:459.7pt;--ltx-fg-color:#000000;"><span id="A1.SS5.p2.pic1.2.9.1.1" class="ltx_inline-logical-block ltx_parbox ltx_pruned_first ltx_align_top" style="width:459.7pt;"></span></span></span>
<span id="A1.SS5.p2.pic1.2.10" class="ltx_p" style="width:459.7pt;"><span id="A1.SS5.p2.pic1.2.10.1" class="ltx_text ltx_verbatim ltx_font_typewriter ltx_inline-block" style="width:459.7pt;--ltx-fg-color:#000000;"><span id="A1.SS5.p2.pic1.2.10.1.1" class="ltx_inline-logical-block ltx_parbox ltx_align_top" style="width:459.7pt;">
<span id="A1.SS5.p2.pic1.p10" class="ltx_para ltx_noindent">
<span id="A1.SS5.p2.pic1.p10.1" class="ltx_p">[Evaluation Principles]</span>
</span></span></span></span>
<span id="A1.SS5.p2.pic1.2.11" class="ltx_p" style="width:459.7pt;"><span id="A1.SS5.p2.pic1.2.11.1" class="ltx_text ltx_verbatim ltx_font_typewriter ltx_inline-block" style="width:459.7pt;--ltx-fg-color:#000000;"><span id="A1.SS5.p2.pic1.2.11.1.1" class="ltx_inline-logical-block ltx_parbox ltx_align_top" style="width:459.7pt;">
<span id="A1.SS5.p2.pic1.p11" class="ltx_para ltx_noindent">
<span id="A1.SS5.p2.pic1.p11.1" class="ltx_p">- Actively use the full score range from 1 to 5.</span>
</span></span></span></span>
<span id="A1.SS5.p2.pic1.2.12" class="ltx_p" style="width:459.7pt;"><span id="A1.SS5.p2.pic1.2.12.1" class="ltx_text ltx_verbatim ltx_font_typewriter ltx_inline-block" style="width:459.7pt;--ltx-fg-color:#000000;"><span id="A1.SS5.p2.pic1.2.12.1.1" class="ltx_inline-logical-block ltx_parbox ltx_align_top" style="width:459.7pt;">
<span id="A1.SS5.p2.pic1.p12" class="ltx_para ltx_noindent">
<span id="A1.SS5.p2.pic1.p12.1" class="ltx_p">- Judge each criterion independently.</span>
</span></span></span></span>
<span id="A1.SS5.p2.pic1.2.13" class="ltx_p" style="width:459.7pt;"><span id="A1.SS5.p2.pic1.2.13.1" class="ltx_text ltx_verbatim ltx_font_typewriter ltx_inline-block" style="width:459.7pt;--ltx-fg-color:#000000;"><span id="A1.SS5.p2.pic1.2.13.1.1" class="ltx_inline-logical-block ltx_parbox ltx_align_top" style="width:459.7pt;">
<span id="A1.SS5.p2.pic1.p13" class="ltx_para ltx_noindent">
<span id="A1.SS5.p2.pic1.p13.1" class="ltx_p">- Use only content verifiable in essay_text as evidence.</span>
</span></span></span></span>
<span id="A1.SS5.p2.pic1.2.14" class="ltx_p" style="width:459.7pt;"><span id="A1.SS5.p2.pic1.2.14.1" class="ltx_text ltx_verbatim ltx_font_typewriter ltx_inline-block" style="width:459.7pt;--ltx-fg-color:#000000;"><span id="A1.SS5.p2.pic1.2.14.1.1" class="ltx_text ltx_inline-block" style="width:0.0pt;"> </span><span id="A1.SS5.p2.pic1.2.14.1.2" class="ltx_inline-logical-block ltx_parbox ltx_align_top" style="width:459.7pt;">
<span id="A1.SS5.p2.pic1.p14" class="ltx_para ltx_noindent">
<span id="A1.SS5.p2.pic1.p14.1" class="ltx_p">- Examine both strengths and weaknesses for each criterion, and determine the score according to the strength of verifiable evidence.</span>
</span></span></span></span>
<span id="A1.SS5.p2.pic1.2.15" class="ltx_p" style="width:459.7pt;"><span id="A1.SS5.p2.pic1.2.15.1" class="ltx_text ltx_verbatim ltx_font_typewriter ltx_inline-block" style="width:459.7pt;--ltx-fg-color:#000000;"><span id="A1.SS5.p2.pic1.2.15.1.1" class="ltx_inline-logical-block ltx_parbox ltx_align_top" style="width:459.7pt;">
<span id="A1.SS5.p2.pic1.p15" class="ltx_para ltx_noindent">
<span id="A1.SS5.p2.pic1.p15.1" class="ltx_p">- Score based on evidence, not on an overall impression or role expectations.</span>
</span></span></span></span>
<span id="A1.SS5.p2.pic1.2.16" class="ltx_p" style="width:459.7pt;"><span id="A1.SS5.p2.pic1.2.16.1" class="ltx_text ltx_verbatim ltx_font_typewriter ltx_inline-block" style="width:459.7pt;--ltx-fg-color:#000000;"><span id="A1.SS5.p2.pic1.2.16.1.1" class="ltx_inline-logical-block ltx_parbox ltx_align_top" style="width:459.7pt;">
<span id="A1.SS5.p2.pic1.p16" class="ltx_para ltx_noindent">
<span id="A1.SS5.p2.pic1.p16.1" class="ltx_p">- Write the supporting explanation separately for each criterion.</span>
</span></span></span></span>
<span id="A1.SS5.p2.pic1.2.17" class="ltx_p" style="width:459.7pt;"><span id="A1.SS5.p2.pic1.2.17.1" class="ltx_text ltx_verbatim ltx_font_typewriter ltx_inline-block" style="width:459.7pt;--ltx-fg-color:#000000;"><span id="A1.SS5.p2.pic1.2.17.1.1" class="ltx_inline-logical-block ltx_parbox ltx_pruned_first ltx_align_top" style="width:459.7pt;"></span></span></span>
<span id="A1.SS5.p2.pic1.2.18" class="ltx_p" style="width:459.7pt;"><span id="A1.SS5.p2.pic1.2.18.1" class="ltx_text ltx_verbatim ltx_font_typewriter ltx_inline-block" style="width:459.7pt;--ltx-fg-color:#000000;"><span id="A1.SS5.p2.pic1.2.18.1.1" class="ltx_inline-logical-block ltx_parbox ltx_align_top" style="width:459.7pt;">
<span id="A1.SS5.p2.pic1.p18" class="ltx_para ltx_noindent">
<span id="A1.SS5.p2.pic1.p18.1" class="ltx_p">[ESSAY_OUTPUT_INIT]</span>
</span></span></span></span>
</span></span></span></foreignobject></g></g></svg>