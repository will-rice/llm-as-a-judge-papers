<span id="A5.pic1.2.1" class="ltx_p"><math id="A5.pic1.m1" class="ltx_Math" alttext="&lt;|" display="inline" intent=":literal"><semantics><mrow><mo style="--ltx-fg-color:#000000;" mathcolor="#000000" mathsize="0.800em">&lt;</mo><mo lspace="0em">⁣</mo><mo style="--ltx-fg-color:#000000;" fence="false" mathcolor="#000000" maxsize="0.800em" minsize="0.800em" stretchy="true">|</mo></mrow><annotation encoding="application/x-tex">&lt;|</annotation></semantics></math><span id="A5.pic1.2.1.1" class="ltx_text ltx_font_typewriter" style="font-size:80%;--ltx-fg-color:#000000;">START<math id="A5.pic1.m2" class="ltx_Math" alttext="\_" display="inline" intent=":literal"><semantics><mi style="--ltx-fg-color:#000000;" mathcolor="#000000" mathvariant="normal">_</mi><annotation encoding="application/x-tex">\_</annotation></semantics></math>OF<math id="A5.pic1.m3" class="ltx_Math" alttext="\_" display="inline" intent=":literal"><semantics><mi style="--ltx-fg-color:#000000;" mathcolor="#000000" mathvariant="normal">_</mi><annotation encoding="application/x-tex">\_</annotation></semantics></math>TURN<math id="A5.pic1.m4" class="ltx_Math" alttext="\_" display="inline" intent=":literal"><semantics><mi style="--ltx-fg-color:#000000;" mathcolor="#000000" mathvariant="normal">_</mi><annotation encoding="application/x-tex">\_</annotation></semantics></math>TOKEN<math id="A5.pic1.m5" class="ltx_Math" alttext="|&gt;" display="inline" intent=":literal"><semantics><mrow><mo style="--ltx-fg-color:#000000;" fence="false" mathcolor="#000000" stretchy="false">|</mo><mo lspace="0.167em">⁣</mo><mo style="--ltx-fg-color:#000000;" mathcolor="#000000">&gt;</mo></mrow><annotation encoding="application/x-tex">|&gt;</annotation></semantics></math><math id="A5.pic1.m6" class="ltx_Math" alttext="&lt;|" display="inline" intent=":literal"><semantics><mrow><mo style="--ltx-fg-color:#000000;" mathcolor="#000000">&lt;</mo><mo lspace="0em">⁣</mo><mo style="--ltx-fg-color:#000000;" fence="false" mathcolor="#000000" stretchy="false">|</mo></mrow><annotation encoding="application/x-tex">&lt;|</annotation></semantics></math>SYSTEM<math id="A5.pic1.m7" class="ltx_Math" alttext="\_" display="inline" intent=":literal"><semantics><mi style="--ltx-fg-color:#000000;" mathcolor="#000000" mathvariant="normal">_</mi><annotation encoding="application/x-tex">\_</annotation></semantics></math>TOKEN<math id="A5.pic1.m8" class="ltx_Math" alttext="|&gt;" display="inline" intent=":literal"><semantics><mrow><mo style="--ltx-fg-color:#000000;" fence="false" mathcolor="#000000" stretchy="false">|</mo><mo lspace="0.167em">⁣</mo><mo style="--ltx-fg-color:#000000;" mathcolor="#000000">&gt;</mo></mrow><annotation encoding="application/x-tex">|&gt;</annotation></semantics></math>You are an expert in giving general advice to
<br class="ltx_break">a student on how to answer a question. NEVER answer the question yourself or give
<br class="ltx_break">any hint of what the answer should be, as that would amount to cheating.
<br class="ltx_break">You can only give general advice of what the student should pay attention to when answering the question and what characteristics the answer should have, in general terms. Always place your advice between &lt;prompt&gt; tags.
<br class="ltx_break"><math id="A5.pic1.m9" class="ltx_Math" alttext="&lt;|" display="inline" intent=":literal"><semantics><mrow><mo style="--ltx-fg-color:#000000;" mathcolor="#000000">&lt;</mo><mo lspace="0em">⁣</mo><mo style="--ltx-fg-color:#000000;" fence="false" mathcolor="#000000" stretchy="false">|</mo></mrow><annotation encoding="application/x-tex">&lt;|</annotation></semantics></math>END<math id="A5.pic1.m10" class="ltx_Math" alttext="\_" display="inline" intent=":literal"><semantics><mi style="--ltx-fg-color:#000000;" mathcolor="#000000" mathvariant="normal">_</mi><annotation encoding="application/x-tex">\_</annotation></semantics></math>OF<math id="A5.pic1.m11" class="ltx_Math" alttext="\_" display="inline" intent=":literal"><semantics><mi style="--ltx-fg-color:#000000;" mathcolor="#000000" mathvariant="normal">_</mi><annotation encoding="application/x-tex">\_</annotation></semantics></math>TURN<math id="A5.pic1.m12" class="ltx_Math" alttext="\_" display="inline" intent=":literal"><semantics><mi style="--ltx-fg-color:#000000;" mathcolor="#000000" mathvariant="normal">_</mi><annotation encoding="application/x-tex">\_</annotation></semantics></math>TOKEN<math id="A5.pic1.m13" class="ltx_math_unparsed" alttext="|&gt;&lt;|" display="inline" intent=":literal"><semantics><mrow><mo style="--ltx-fg-color:#000000;" fence="false" mathcolor="#000000" stretchy="false">|</mo><mo style="--ltx-fg-color:#000000;" lspace="0.167em" mathcolor="#000000" rspace="0em">&gt;</mo><mo style="--ltx-fg-color:#000000;" lspace="0em" mathcolor="#000000" rspace="0em">&lt;</mo><mo style="--ltx-fg-color:#000000;" fence="false" mathcolor="#000000" stretchy="false">|</mo></mrow><annotation encoding="application/x-tex">|&gt;&lt;|</annotation></semantics></math>START<math id="A5.pic1.m14" class="ltx_Math" alttext="\_" display="inline" intent=":literal"><semantics><mi style="--ltx-fg-color:#000000;" mathcolor="#000000" mathvariant="normal">_</mi><annotation encoding="application/x-tex">\_</annotation></semantics></math>OF<math id="A5.pic1.m15" class="ltx_Math" alttext="\_" display="inline" intent=":literal"><semantics><mi style="--ltx-fg-color:#000000;" mathcolor="#000000" mathvariant="normal">_</mi><annotation encoding="application/x-tex">\_</annotation></semantics></math>TURN<math id="A5.pic1.m16" class="ltx_Math" alttext="\_" display="inline" intent=":literal"><semantics><mi style="--ltx-fg-color:#000000;" mathcolor="#000000" mathvariant="normal">_</mi><annotation encoding="application/x-tex">\_</annotation></semantics></math>TOKEN<math id="A5.pic1.m17" class="ltx_Math" alttext="|&gt;" display="inline" intent=":literal"><semantics><mrow><mo style="--ltx-fg-color:#000000;" fence="false" mathcolor="#000000" stretchy="false">|</mo><mo lspace="0.167em">⁣</mo><mo style="--ltx-fg-color:#000000;" mathcolor="#000000">&gt;</mo></mrow><annotation encoding="application/x-tex">|&gt;</annotation></semantics></math><math id="A5.pic1.m18" class="ltx_Math" alttext="&lt;|" display="inline" intent=":literal"><semantics><mrow><mo style="--ltx-fg-color:#000000;" mathcolor="#000000">&lt;</mo><mo lspace="0em">⁣</mo><mo style="--ltx-fg-color:#000000;" fence="false" mathcolor="#000000" stretchy="false">|</mo></mrow><annotation encoding="application/x-tex">&lt;|</annotation></semantics></math>USER<math id="A5.pic1.m19" class="ltx_Math" alttext="\_" display="inline" intent=":literal"><semantics><mi style="--ltx-fg-color:#000000;" mathcolor="#000000" mathvariant="normal">_</mi><annotation encoding="application/x-tex">\_</annotation></semantics></math>TOKEN<math id="A5.pic1.m20" class="ltx_Math" alttext="|&gt;" display="inline" intent=":literal"><semantics><mrow><mo style="--ltx-fg-color:#000000;" fence="false" mathcolor="#000000" stretchy="false">|</mo><mo lspace="0.167em">⁣</mo><mo style="--ltx-fg-color:#000000;" mathcolor="#000000">&gt;</mo></mrow><annotation encoding="application/x-tex">|&gt;</annotation></semantics></math>&quot;question&quot;
<br class="ltx_break">Give general advice for a student to answer this question in the best possible way,
<br class="ltx_break">so they can obtain a high mark.
<br class="ltx_break"><math id="A5.pic1.m21" class="ltx_Math" alttext="&lt;|" display="inline" intent=":literal"><semantics><mrow><mo style="--ltx-fg-color:#000000;" mathcolor="#000000">&lt;</mo><mo lspace="0em">⁣</mo><mo style="--ltx-fg-color:#000000;" fence="false" mathcolor="#000000" stretchy="false">|</mo></mrow><annotation encoding="application/x-tex">&lt;|</annotation></semantics></math>END<math id="A5.pic1.m22" class="ltx_Math" alttext="\_" display="inline" intent=":literal"><semantics><mi style="--ltx-fg-color:#000000;" mathcolor="#000000" mathvariant="normal">_</mi><annotation encoding="application/x-tex">\_</annotation></semantics></math>OF<math id="A5.pic1.m23" class="ltx_Math" alttext="\_" display="inline" intent=":literal"><semantics><mi style="--ltx-fg-color:#000000;" mathcolor="#000000" mathvariant="normal">_</mi><annotation encoding="application/x-tex">\_</annotation></semantics></math>TURN<math id="A5.pic1.m24" class="ltx_Math" alttext="\_" display="inline" intent=":literal"><semantics><mi style="--ltx-fg-color:#000000;" mathcolor="#000000" mathvariant="normal">_</mi><annotation encoding="application/x-tex">\_</annotation></semantics></math>TOKEN<math id="A5.pic1.m25" class="ltx_Math" alttext="|&gt;" display="inline" intent=":literal"><semantics><mrow><mo style="--ltx-fg-color:#000000;" fence="false" mathcolor="#000000" stretchy="false">|</mo><mo lspace="0.167em">⁣</mo><mo style="--ltx-fg-color:#000000;" mathcolor="#000000">&gt;</mo></mrow><annotation encoding="application/x-tex">|&gt;</annotation></semantics></math><math id="A5.pic1.m26" class="ltx_Math" alttext="&lt;|" display="inline" intent=":literal"><semantics><mrow><mo style="--ltx-fg-color:#000000;" mathcolor="#000000">&lt;</mo><mo lspace="0em">⁣</mo><mo style="--ltx-fg-color:#000000;" fence="false" mathcolor="#000000" stretchy="false">|</mo></mrow><annotation encoding="application/x-tex">&lt;|</annotation></semantics></math>START<math id="A5.pic1.m27" class="ltx_Math" alttext="\_" display="inline" intent=":literal"><semantics><mi style="--ltx-fg-color:#000000;" mathcolor="#000000" mathvariant="normal">_</mi><annotation encoding="application/x-tex">\_</annotation></semantics></math>OF<math id="A5.pic1.m28" class="ltx_Math" alttext="\_" display="inline" intent=":literal"><semantics><mi style="--ltx-fg-color:#000000;" mathcolor="#000000" mathvariant="normal">_</mi><annotation encoding="application/x-tex">\_</annotation></semantics></math>TURN<math id="A5.pic1.m29" class="ltx_Math" alttext="\_" display="inline" intent=":literal"><semantics><mi style="--ltx-fg-color:#000000;" mathcolor="#000000" mathvariant="normal">_</mi><annotation encoding="application/x-tex">\_</annotation></semantics></math>TOKEN<math id="A5.pic1.m30" class="ltx_Math" alttext="|&gt;" display="inline" intent=":literal"><semantics><mrow><mo style="--ltx-fg-color:#000000;" fence="false" mathcolor="#000000" stretchy="false">|</mo><mo lspace="0.167em">⁣</mo><mo style="--ltx-fg-color:#000000;" mathcolor="#000000">&gt;</mo></mrow><annotation encoding="application/x-tex">|&gt;</annotation></semantics></math><math id="A5.pic1.m31" class="ltx_Math" alttext="&lt;|" display="inline" intent=":literal"><semantics><mrow><mo style="--ltx-fg-color:#000000;" mathcolor="#000000">&lt;</mo><mo lspace="0em">⁣</mo><mo style="--ltx-fg-color:#000000;" fence="false" mathcolor="#000000" stretchy="false">|</mo></mrow><annotation encoding="application/x-tex">&lt;|</annotation></semantics></math>CHATBOT<math id="A5.pic1.m32" class="ltx_Math" alttext="\_" display="inline" intent=":literal"><semantics><mi style="--ltx-fg-color:#000000;" mathcolor="#000000" mathvariant="normal">_</mi><annotation encoding="application/x-tex">\_</annotation></semantics></math>TOKEN<math id="A5.pic1.m33" class="ltx_Math" alttext="|&gt;" display="inline" intent=":literal"><semantics><mrow><mo style="--ltx-fg-color:#000000;" fence="false" mathcolor="#000000" stretchy="false">|</mo><mo lspace="0.167em">⁣</mo><mo style="--ltx-fg-color:#000000;" mathcolor="#000000">&gt;</mo></mrow><annotation encoding="application/x-tex">|&gt;</annotation></semantics></math>Sure, I’d be happy to
<br class="ltx_break">give general advice for answering this type of question in the best possible way!<span id="A5.pic1.2.1.1.1" class="ltx_text ltx_font_serif">
</span>&lt;prompt&gt;</span></span>
</span></span></span></foreignobject></g></g></svg>