<span id="A1.SS4.SSS0.Px1.p3.pic1.2" class="ltx_inline-block ltx_minipage ltx_align_bottom" style="width:16.34em;">
<span id="A1.SS4.SSS0.Px1.p3.pic1.2.1" class="ltx_p"><span id="A1.SS4.SSS0.Px1.p3.pic1.2.1.1" class="ltx_text" style="font-size:90%;--ltx-fg-color:#000000;">DP-Adam was not claimed as a new algorithm; it was already common in DP libraries, and it uses the same gradient privatization mechanism as DP-SGD before the Adam update. The paper’s contribution was showing that full fine-tuning of large pretrained language models can work well under DP when done with suitable hyperparameters, aligned objectives, and the memory trick. Also, the referenced prior work did not privately fine-tune GPT-2: it fine-tuned GPT-2 non-privately and used a privately trained feedforward network for private experiments.</span></span>
</span></span></span></foreignobject></g></g></svg>