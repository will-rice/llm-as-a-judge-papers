<svg id="A4.p7.pic1" class="ltx_picture" height="180.86" overflow="visible" version="1.1" viewbox="0 0 477.38 180.86" width="477.38"><g style="--ltx-stroke-color:#000000;--ltx-fill-color:#000000;" fill="#000000" stroke="#000000" stroke-width="0.4pt" transform="translate(0,180.86) matrix(1 0 0 -1 0 0)"><g style="--ltx-fill-color:#BFDFDF;" fill="#BFDFDF" fill-opacity="1.0"><path style="stroke:none" d="M 0 0 L 0 180.86 L 477.38 180.86 L 477.38 0 Z" /></g><g style="--ltx-fill-color:#F5FAFA;" fill="#F5FAFA" fill-opacity="1.0"><path style="stroke:none" d="M 0.83 0.83 L 0.83 159.02 L 476.55 159.02 L 476.55 0.83 Z" /></g><g fill-opacity="1.0" transform="matrix(1.0 0.0 0.0 1.0 9.49 166.48)"><foreignobject style="--ltx-fo-width:28.81em;--ltx-fo-height:0.69em;--ltx-fo-depth:0.19em;font-size:10pt;" height="12.3" overflow="visible" transform="matrix(1 0 0 -1 0 9.61)" width="398.65"><span class="ltx_foreignobject_container"><span class="ltx_foreignobject_content">
<span id="A4.p7.pic1.1" class="ltx_inline-block ltx_minipage ltx_align_bottom" style="width:28.81em;">
<span id="A4.p7.pic1.1.1" class="ltx_p"><span id="A4.p7.pic1.1.1.1" class="ltx_text ltx_font_bold" style="--ltx-fg-color:#000000;">RealMath: Simplex Shape Ratio</span></span>
</span></span></span></foreignobject></g><g fill-opacity="1.0" transform="matrix(1.0 0.0 0.0 1.0 9.49 8.7)"><foreignobject style="--ltx-fo-width:33.13em;--ltx-fo-height:10.29em;--ltx-fo-depth:0em;font-size:10pt;" height="142.45" overflow="visible" transform="matrix(1 0 0 -1 0 142.45)" width="458.43"><span class="ltx_foreignobject_container"><span class="ltx_foreignobject_content">
<span id="A4.p7.pic1.2" class="ltx_inline-block ltx_minipage ltx_align_bottom" style="width:33.13em;">
<span id="A4.p7.pic1.2.1" class="ltx_p"><span id="A4.p7.pic1.2.1.1" class="ltx_text ltx_font_bold" style="--ltx-fg-color:#000000;">Question.<span id="A4.p7.pic1.2.1.1.1" class="ltx_text ltx_font_medium"> 
<br class="ltx_break">Let <math id="A4.p7.pic1.m1" class="ltx_Math" alttext="n=6" display="inline" intent=":literal"><semantics><mrow><mi style="--ltx-fg-color:#000000;" mathcolor="#000000">n</mi><mo style="--ltx-fg-color:#000000;" mathcolor="#000000">=</mo><mn style="--ltx-fg-color:#000000;" mathcolor="#000000">6</mn></mrow><annotation encoding="application/x-tex">n=6</annotation></semantics></math>. The dimensionless shape ratio for a regular simplex is</span></span></span>
<span id="A4.Ex21" class="ltx_equation ltx_eqn_table">

<span><span class="ltx_equation ltx_eqn_row ltx_align_baseline">
<span class="ltx_eqn_cell ltx_eqn_center_padleft"></span>
<span class="ltx_eqn_cell ltx_align_center"><math id="A4.Ex21.m1" class="ltx_Math" alttext="\mathcal{I}_{n}\;=\;\frac{S^{n}}{V^{\,n-1}}," display="block" intent=":literal"><semantics><mrow><mrow><msub><mi style="--ltx-fg-color:#000000;" class="ltx_font_mathcaligraphic" mathcolor="#000000">ℐ</mi><mi style="--ltx-fg-color:#000000;" mathcolor="#000000">n</mi></msub><mo style="--ltx-fg-color:#000000;" lspace="0.558em" mathcolor="#000000" rspace="0.558em">=</mo><mfrac style="--ltx-fg-color:#000000;" mathcolor="#000000"><msup><mi style="--ltx-fg-color:#000000;" mathcolor="#000000">S</mi><mi style="--ltx-fg-color:#000000;" mathcolor="#000000">n</mi></msup><msup><mi style="--ltx-fg-color:#000000;" mathcolor="#000000">V</mi><mrow><mi style="--ltx-fg-color:#000000;" mathcolor="#000000">n</mi><mo style="--ltx-fg-color:#000000;" mathcolor="#000000">−</mo><mn style="--ltx-fg-color:#000000;" mathcolor="#000000">1</mn></mrow></msup></mfrac></mrow><mo style="--ltx-fg-color:#000000;" mathcolor="#000000">,</mo></mrow><annotation encoding="application/x-tex">\mathcal{I}_{n}\;=\;\frac{S^{n}}{V^{\,n-1}},</annotation></semantics></math></span>
<span class="ltx_eqn_cell ltx_eqn_center_padright"></span></span></span>
</span>
<span id="A4.p7.pic1.2.2" class="ltx_p"><span id="A4.p7.pic1.2.2.1" class="ltx_text" style="--ltx-fg-color:#000000;">where <math id="A4.p7.pic1.m2" class="ltx_Math" alttext="S" display="inline" intent=":literal"><semantics><mi style="--ltx-fg-color:#000000;" mathcolor="#000000">S</mi><annotation encoding="application/x-tex">S</annotation></semantics></math> is the total surface area and <math id="A4.p7.pic1.m3" class="ltx_Math" alttext="V" display="inline" intent=":literal"><semantics><mi style="--ltx-fg-color:#000000;" mathcolor="#000000">V</mi><annotation encoding="application/x-tex">V</annotation></semantics></math> is the volume.</span></span>
<span id="A4.p7.pic1.2.3" class="ltx_p"><span id="A4.p7.pic1.2.3.1" class="ltx_text" style="--ltx-fg-color:#000000;">For a regular simplex, one (incorrect) simplification is sometimes written as</span></span>
<span id="A4.Ex22" class="ltx_equation ltx_eqn_table">

<span><span class="ltx_equation ltx_eqn_row ltx_align_baseline">
<span class="ltx_eqn_cell ltx_eqn_center_padleft"></span>
<span class="ltx_eqn_cell ltx_align_center"><math id="A4.Ex22.m1" class="ltx_Math" alttext="\mathcal{I}_{n}\;=\;\frac{n^{n}(n+1)^{(n+1)/2}}{\sqrt{n!}}\quad\text{(distractor; derive the correct one).}" display="block" intent=":literal"><semantics><mrow><mrow><msub><mi style="--ltx-fg-color:#000000;" class="ltx_font_mathcaligraphic" mathcolor="#000000">ℐ</mi><mi style="--ltx-fg-color:#000000;" mathcolor="#000000">n</mi></msub><mo style="--ltx-fg-color:#000000;" lspace="0.558em" mathcolor="#000000" rspace="0.558em">=</mo><mfrac style="--ltx-fg-color:#000000;" mathcolor="#000000"><mrow><msup><mi style="--ltx-fg-color:#000000;" mathcolor="#000000">n</mi><mi style="--ltx-fg-color:#000000;" mathcolor="#000000">n</mi></msup><mo lspace="0em" rspace="0em">​</mo><msup><mrow><mo style="--ltx-fg-color:#000000;" mathcolor="#000000" stretchy="false">(</mo><mrow><mi style="--ltx-fg-color:#000000;" mathcolor="#000000">n</mi><mo style="--ltx-fg-color:#000000;" mathcolor="#000000">+</mo><mn style="--ltx-fg-color:#000000;" mathcolor="#000000">1</mn></mrow><mo style="--ltx-fg-color:#000000;" mathcolor="#000000" stretchy="false">)</mo></mrow><mrow><mrow><mo style="--ltx-fg-color:#000000;" mathcolor="#000000" stretchy="false">(</mo><mrow><mi style="--ltx-fg-color:#000000;" mathcolor="#000000">n</mi><mo style="--ltx-fg-color:#000000;" mathcolor="#000000">+</mo><mn style="--ltx-fg-color:#000000;" mathcolor="#000000">1</mn></mrow><mo style="--ltx-fg-color:#000000;" mathcolor="#000000" stretchy="false">)</mo></mrow><mo style="--ltx-fg-color:#000000;" mathcolor="#000000">/</mo><mn style="--ltx-fg-color:#000000;" mathcolor="#000000">2</mn></mrow></msup></mrow><msqrt style="--ltx-fg-color:#000000;" mathcolor="#000000"><mrow><mi style="--ltx-fg-color:#000000;" mathcolor="#000000">n</mi><mo style="--ltx-fg-color:#000000;" mathcolor="#000000">!</mo></mrow></msqrt></mfrac></mrow><mspace style="width:1em;" width="1em"></mspace><mtext style="--ltx-fg-color:#000000;" mathcolor="#000000">(distractor; derive the correct one).</mtext></mrow><annotation encoding="application/x-tex">\mathcal{I}_{n}\;=\;\frac{n^{n}(n+1)^{(n+1)/2}}{\sqrt{n!}}\quad\text{(distractor; derive the correct one).}</annotation></semantics></math></span>
<span class="ltx_eqn_cell ltx_eqn_center_padright"></span></span></span>
</span>
<span id="A4.p7.pic1.2.4" class="ltx_p"><span id="A4.p7.pic1.2.4.1" class="ltx_text" style="--ltx-fg-color:#000000;">Instead, use the known relation for a regular simplex:</span></span>
<span id="A4.Ex23" class="ltx_equation ltx_eqn_table">

<span><span class="ltx_equation ltx_eqn_row ltx_align_baseline">
<span class="ltx_eqn_cell ltx_eqn_center_padleft"></span>
<span class="ltx_eqn_cell ltx_align_center"><math id="A4.Ex23.m1" class="ltx_Math" alttext="\frac{S^{n}}{V^{\,n-1}}\;=\;n^{n}(n+1)^{(n-1)/2}\,(n!)." display="block" intent=":literal"><semantics><mrow><mrow><mfrac style="--ltx-fg-color:#000000;" mathcolor="#000000"><msup><mi style="--ltx-fg-color:#000000;" mathcolor="#000000">S</mi><mi style="--ltx-fg-color:#000000;" mathcolor="#000000">n</mi></msup><msup><mi style="--ltx-fg-color:#000000;" mathcolor="#000000">V</mi><mrow><mi style="--ltx-fg-color:#000000;" mathcolor="#000000">n</mi><mo style="--ltx-fg-color:#000000;" mathcolor="#000000">−</mo><mn style="--ltx-fg-color:#000000;" mathcolor="#000000">1</mn></mrow></msup></mfrac><mo style="--ltx-fg-color:#000000;" lspace="0.558em" mathcolor="#000000" rspace="0.558em">=</mo><mrow><msup><mi style="--ltx-fg-color:#000000;" mathcolor="#000000">n</mi><mi style="--ltx-fg-color:#000000;" mathcolor="#000000">n</mi></msup><mo lspace="0em" rspace="0em">​</mo><msup><mrow><mo style="--ltx-fg-color:#000000;" mathcolor="#000000" stretchy="false">(</mo><mrow><mi style="--ltx-fg-color:#000000;" mathcolor="#000000">n</mi><mo style="--ltx-fg-color:#000000;" mathcolor="#000000">+</mo><mn style="--ltx-fg-color:#000000;" mathcolor="#000000">1</mn></mrow><mo style="--ltx-fg-color:#000000;" mathcolor="#000000" stretchy="false">)</mo></mrow><mrow><mrow><mo style="--ltx-fg-color:#000000;" mathcolor="#000000" stretchy="false">(</mo><mrow><mi style="--ltx-fg-color:#000000;" mathcolor="#000000">n</mi><mo style="--ltx-fg-color:#000000;" mathcolor="#000000">−</mo><mn style="--ltx-fg-color:#000000;" mathcolor="#000000">1</mn></mrow><mo style="--ltx-fg-color:#000000;" mathcolor="#000000" stretchy="false">)</mo></mrow><mo style="--ltx-fg-color:#000000;" mathcolor="#000000">/</mo><mn style="--ltx-fg-color:#000000;" mathcolor="#000000">2</mn></mrow></msup><mo lspace="0em" rspace="0em">​</mo><mrow><mo style="--ltx-fg-color:#000000;" mathcolor="#000000" stretchy="false">(</mo><mrow><mi style="--ltx-fg-color:#000000;" mathcolor="#000000">n</mi><mo style="--ltx-fg-color:#000000;" mathcolor="#000000">!</mo></mrow><mo style="--ltx-fg-color:#000000;" mathcolor="#000000" stretchy="false">)</mo></mrow></mrow></mrow><mo style="--ltx-fg-color:#000000;" lspace="0em" mathcolor="#000000">.</mo></mrow><annotation encoding="application/x-tex">\frac{S^{n}}{V^{\,n-1}}\;=\;n^{n}(n+1)^{(n-1)/2}\,(n!).</annotation></semantics></math></span>
<span class="ltx_eqn_cell ltx_eqn_center_padright"></span></span></span>
</span>
<span id="A4.p7.pic1.2.5" class="ltx_p"><span id="A4.p7.pic1.2.5.1" class="ltx_text" style="--ltx-fg-color:#000000;">Calculate this value for <math id="A4.p7.pic1.m4" class="ltx_Math" alttext="n=6" display="inline" intent=":literal"><semantics><mrow><mi style="--ltx-fg-color:#000000;" mathcolor="#000000">n</mi><mo style="--ltx-fg-color:#000000;" mathcolor="#000000">=</mo><mn style="--ltx-fg-color:#000000;" mathcolor="#000000">6</mn></mrow><annotation encoding="application/x-tex">n=6</annotation></semantics></math>.</span></span>
</span></span></span></foreignobject></g></g></svg>