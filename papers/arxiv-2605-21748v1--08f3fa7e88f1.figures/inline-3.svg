<span id="A2.SS3.p2.pic1.1" class="ltx_inline-block ltx_minipage ltx_align_bottom" style="width:31.37em;">
<span id="A2.SS3.p2.pic1.1.1" class="ltx_p"><span id="A2.SS3.p2.pic1.1.1.1" class="ltx_text ltx_font_typewriter ltx_font_bold" style="--ltx-fg-color:#FFFFFF;">Assistant Failure Type Discovery Prompt</span></span>
</span></span></span></foreignobject></g><g fill-opacity="1.0" transform="matrix(1.0 0.0 0.0 1.0 21.65 16.47)"><foreignobject style="--ltx-fo-width:31.37em;--ltx-fo-height:41.16em;--ltx-fo-depth:0.19em;font-size:10pt;" height="572.17" overflow="visible" transform="matrix(1 0 0 -1 0 569.48)" width="434.07"><span class="ltx_foreignobject_container"><span class="ltx_foreignobject_content">
<span id="A2.SS3.p2.pic1.2" class="ltx_inline-block ltx_minipage ltx_align_bottom" style="width:31.37em;">
<span id="A2.SS3.p2.pic1.2.1" class="ltx_p"><span id="A2.SS3.p2.pic1.2.1.1" class="ltx_text" style="--ltx-fg-color:#000000;">You are an expert in multi-turn conversation evaluation, specializing in identifying the challenging scenarios, conducting failure mode and taxonomy analysis. 
<br class="ltx_break">
<br class="ltx_break">Your task is fourfold: 
<br class="ltx_break">(1) Task 1: per-sample annotation. Apply an existing taxonomy to label assistant and user behaviors in multi-turn conversations 
<br class="ltx_break">(2) Task 2: identify taxonomy gaps. Identify cases that do NOT fit the taxonomy 
<br class="ltx_break">(3) Task 3: taxonomy refinement. Categorize the missed cases and propose refined or new categories grounded in evidence 
<br class="ltx_break">(4) Task 4: insights generation. Produce outputs for downstream analysis, explanations for the proposal. 
<br class="ltx_break"></span></span>
<span id="A2.SS3.p2.pic1.2.2" class="ltx_p"><span id="A2.SS3.p2.pic1.2.2.1" class="ltx_text" style="--ltx-fg-color:#000000;">## TAXONOMY DEFINITIONS 
<br class="ltx_break"><span id="A2.SS3.p2.pic1.2.2.1.1" class="ltx_text ltx_font_typewriter">ASSISTANT_BEHAVIORS = {
<br class="ltx_break"> &quot;disorganized&quot;: {...},
<br class="ltx_break"> &quot;fabricated_answer&quot;: {...},
<br class="ltx_break"> &quot;unnecessary_refusal&quot;: {...},
<br class="ltx_break"> ...
<br class="ltx_break">}
<br class="ltx_break"></span></span></span>
<span id="A2.SS3.p2.pic1.2.3" class="ltx_p"><span id="A2.SS3.p2.pic1.2.3.1" class="ltx_text ltx_font_typewriter" style="--ltx-fg-color:#000000;">USER_BEHAVIORS = {
<br class="ltx_break"> &quot;focused&quot;: &quot;...&quot;,
<br class="ltx_break"> &quot;skeptical&quot;: &quot;...&quot;,
<br class="ltx_break"> &quot;misinformed&quot;: &quot;...&quot;,
<br class="ltx_break"> &quot;exploratory&quot;: &quot;...&quot;,
<br class="ltx_break"> ...
<br class="ltx_break">}
<span id="A2.SS3.p2.pic1.2.3.1.1" class="ltx_text ltx_font_serif"> 
<br class="ltx_break"></span></span></span>
<span id="A2.SS3.p2.pic1.2.4" class="ltx_p"><span id="A2.SS3.p2.pic1.2.4.1" class="ltx_text" style="--ltx-fg-color:#000000;">## GENERAL GUIDELINES 
<br class="ltx_break"><span id="A2.SS3.p2.pic1.2.4.1.1" class="ltx_text ltx_font_typewriter">- Be precise, not verbose; avoid generic explanations.
<br class="ltx_break">- Ground reasoning in observed data; do NOT hallucinate missing context.
<br class="ltx_break">- Prefer concrete behavioral descriptions over abstract wording. Identify ambiguities in definitions.
<br class="ltx_break">- Be critical of the taxonomy when necessary, but only propose changes supported by repeated evidence.
</span> 
<br class="ltx_break"></span></span>
<span id="A2.SS3.p2.pic1.2.5" class="ltx_p"><span id="A2.SS3.p2.pic1.2.5.1" class="ltx_text" style="--ltx-fg-color:#000000;">## DATA EXAMPLES</span></span>
</span></span></span></foreignobject></g></g></svg>