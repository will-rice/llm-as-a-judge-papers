<svg id="A2.F6.p1.pic1" class="ltx_picture" height="598.2" overflow="visible" version="1.1" viewbox="0 0 665 598.2" width="665"><g style="--ltx-stroke-color:#000000;--ltx-fill-color:#000000;" fill="#000000" stroke="#000000" stroke-width="0.4pt" transform="translate(0,598.2) matrix(1 0 0 -1 0 0)"><g style="--ltx-fill-color:#666666;" fill="#666666" fill-opacity="1.0"><path style="stroke:none" d="M 0 2.91 L 0 595.3 C 0 596.9 1.3 598.2 2.91 598.2 L 662.09 598.2 C 663.7 598.2 665 596.9 665 595.3 L 665 2.91 C 665 1.3 663.7 0 662.09 0 L 2.91 0 C 1.3 0 0 1.3 0 2.91 Z" /></g><g style="--ltx-fill-color:#FAFAFA;" fill="#FAFAFA" fill-opacity="1.0"><path style="stroke:none" d="M 0.83 2.91 L 0.83 578.83 L 664.17 578.83 L 664.17 2.91 C 664.17 1.76 663.24 0.83 662.09 0.83 L 2.91 0.83 C 1.76 0.83 0.83 1.76 0.83 2.91 Z" /></g><g fill-opacity="1.0" transform="matrix(1.0 0.0 0.0 1.0 13.07 585.75)"><foreignobject style="--ltx-fo-width:47.11em;--ltx-fo-height:0.56em;--ltx-fo-depth:0.16em;font-size:10pt;" height="9.84" overflow="visible" transform="matrix(1 0 0 -1 0 7.69)" width="651.87"><span class="ltx_foreignobject_container"><span class="ltx_foreignobject_content">
<span id="A2.F6.p1.pic1.1" class="ltx_inline-block ltx_minipage ltx_align_bottom" style="width:47.11em;">
<span id="A2.F6.p1.pic1.1.1" class="ltx_p"><span id="A2.F6.p1.pic1.1.1.1" class="ltx_text ltx_font_bold" style="font-size:80%;--ltx-fg-color:#FFFFFF;">Pairwise Evaluation Prompt Template</span></span>
</span></span></span></foreignobject></g><g fill-opacity="1.0" transform="matrix(1.0 0.0 0.0 1.0 13.07 14.11)"><foreignobject style="--ltx-fo-width:62.82em;--ltx-fo-height:40.03em;--ltx-fo-depth:0.18em;font-size:10pt;" height="556.29" overflow="visible" transform="matrix(1 0 0 -1 0 553.87)" width="869.25"><span class="ltx_foreignobject_container"><span class="ltx_foreignobject_content">
<span id="A2.F6.p1.pic1.2" class="ltx_inline-block ltx_minipage ltx_align_bottom" style="width:62.82em;">
<span id="A2.F6.p1.pic1.2.1" class="ltx_p"><span id="A2.F6.p1.pic1.2.1.1" class="ltx_text ltx_font_typewriter" style="font-size:70%;--ltx-fg-color:#000000;">You are an impartial judge evaluating the quality of the responses provided by two AI assistants to the user question. Your task is to determine which assistant performs better overall, or whether they perform equally well. 
<br class="ltx_break"></span></span>
<span id="A2.F6.p1.pic1.2.2" class="ltx_p"><span id="A2.F6.p1.pic1.2.2.1" class="ltx_text ltx_font_typewriter" style="font-size:70%;--ltx-fg-color:#000000;">You may choose: 
<br class="ltx_break">- Assistant 1 
<br class="ltx_break">- Assistant 2 
<br class="ltx_break">- Or a Tie, if both responses are of similar quality 
<br class="ltx_break"></span></span>
<span id="A2.F6.p1.pic1.2.3" class="ltx_p"><span id="A2.F6.p1.pic1.2.3.1" class="ltx_text ltx_font_typewriter" style="font-size:70%;--ltx-fg-color:#000000;">Your evaluation must consider: 
<br class="ltx_break">- Helpfulness 
<br class="ltx_break">- Relevance 
<br class="ltx_break">- Accuracy 
<br class="ltx_break">- Depth 
<br class="ltx_break">- Creativity 
<br class="ltx_break">- Level of detail 
<br class="ltx_break"></span></span>
<span id="A2.F6.p1.pic1.2.4" class="ltx_p"><span id="A2.F6.p1.pic1.2.4.1" class="ltx_text ltx_font_typewriter" style="font-size:70%;--ltx-fg-color:#000000;">Avoid any position bias. Do not let the order of responses influence your judgment. 
<br class="ltx_break">Do not favor longer responses. Be as objective and fair as possible. 
<br class="ltx_break"></span></span>
<span id="A2.F6.p1.pic1.2.5" class="ltx_p"><span id="A2.F6.p1.pic1.2.5.1" class="ltx_text ltx_font_typewriter" style="font-size:70%;--ltx-fg-color:#000000;">If both assistants perform similarly across the key criteria, you should select a Tie rather than forcing a preference. 
<br class="ltx_break"></span></span>
<span id="A2.F6.p1.pic1.2.6" class="ltx_p"><span id="A2.F6.p1.pic1.2.6.1" class="ltx_text ltx_font_typewriter" style="font-size:70%;--ltx-fg-color:#000000;">Your final line MUST be exactly one of: 
<br class="ltx_break">[1] 
<br class="ltx_break">[2] 
<br class="ltx_break">[3] 
<br class="ltx_break">Where: 
<br class="ltx_break">[1] = Assistant 1 is better 
<br class="ltx_break">[2] = Assistant 2 is better 
<br class="ltx_break">[3] = Tie 
<br class="ltx_break"></span></span>
<span id="A2.F6.p1.pic1.2.7" class="ltx_p"><span id="A2.F6.p1.pic1.2.7.1" class="ltx_text ltx_font_typewriter" style="font-size:70%;--ltx-fg-color:#000000;">Do NOT output anything after the final line. 
<br class="ltx_break"></span></span>
<span id="A2.F6.p1.pic1.2.8" class="ltx_p"><span id="A2.F6.p1.pic1.2.8.1" class="ltx_text ltx_font_typewriter" style="font-size:70%;--ltx-fg-color:#000000;">Example: 
<br class="ltx_break">[3] 
<br class="ltx_break"></span></span>
<span id="A2.F6.p1.pic1.2.9" class="ltx_p"><span id="A2.F6.p1.pic1.2.9.1" class="ltx_text ltx_font_typewriter" style="font-size:70%;--ltx-fg-color:#000000;">Instruction: {instruction} 
<br class="ltx_break">Input: {input} 
<br class="ltx_break">Assistant 1: {answer1} 
<br class="ltx_break">Assistant 2: {answer2}
</span></span>
</span></span></span></foreignobject></g></g></svg>