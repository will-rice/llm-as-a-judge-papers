<span id="A3.pic3.1.1" class="ltx_p"><span id="A3.pic3.1.1.1" class="ltx_text ltx_font_bold" style="--ltx-fg-color:#FFFFFF;">Factuality</span></span>
</span></span></span></foreignobject></g><g fill-opacity="1.0" transform="matrix(1.0 0.0 0.0 1.0 21.65 185.23)"><foreignobject style="--ltx-fo-width:44.07em;--ltx-fo-height:1.89em;--ltx-fo-depth:0.19em;font-size:10pt;" height="28.9" overflow="visible" transform="matrix(1 0 0 -1 0 26.21)" width="609.8"><span class="ltx_foreignobject_container"><span class="ltx_foreignobject_content">
<span id="A3.pic3.2" class="ltx_inline-block ltx_minipage ltx_align_bottom" style="width:44.07em;">
<span id="A3.pic3.2.1" class="ltx_p"><span id="A3.pic3.2.1.1" class="ltx_text ltx_font_bold" style="--ltx-fg-color:#000000;">Short Definition<span id="A3.pic3.2.1.1.1" class="ltx_text ltx_font_medium"> 
<br class="ltx_break">the quality or state of being based on factual information or truth.</span></span></span>
</span></span></span></foreignobject></g><g fill-opacity="1.0" transform="matrix(1.0 0.0 0.0 1.0 21.65 16.47)"><foreignobject style="--ltx-fo-width:44.07em;--ltx-fo-height:10.29em;--ltx-fo-depth:0.19em;font-size:10pt;" height="145.14" overflow="visible" transform="matrix(1 0 0 -1 0 142.45)" width="609.8"><span class="ltx_foreignobject_container"><span class="ltx_foreignobject_content">
<span id="A3.pic3.3" class="ltx_inline-block ltx_minipage ltx_align_bottom" style="width:44.07em;">
<span id="A3.pic3.3.1" class="ltx_p"><span id="A3.pic3.3.1.1" class="ltx_text ltx_font_bold" style="--ltx-fg-color:#000000;">Long Definition<span id="A3.pic3.3.1.1.1" class="ltx_text ltx_font_medium"> 
<br class="ltx_break">term that denotes the degree to which something is grounded in facts or reality. It relates to the accuracy and truthfulness of a statement, assertion, or information. When information or claims are described as having a high level of factuality, it signifies that they are supported by objective evidence, data, or verifiable sources, making them reliable and trustworthy. Conversely, low factuality implies a lack of factual basis, often indicating a reliance on speculation, opinion, or falsehoods. Factuality is essential in critical thinking, journalism, and decision-making processes, as it helps distinguish between information that can be relied upon and that which should be viewed skeptically.</span></span></span>
</span></span></span></foreignobject></g></g></svg>