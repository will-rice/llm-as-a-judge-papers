<span id="A4.F5.pic1.1" class="ltx_inline-block ltx_minipage ltx_align_bottom" style="width:36.72em;">
<span id="A4.F5.pic1.1.1" class="ltx_p"><span id="A4.F5.pic1.1.1.1" class="ltx_text" style="--ltx-fg-color:#000000;">## Instructions</span></span>
<span id="A4.F5.pic1.1.2" class="ltx_p"><span id="A4.F5.pic1.1.2.1" class="ltx_text" style="--ltx-fg-color:#000000;">Please infer the scoring criteria for the following task:</span></span>
<span id="A4.F5.pic1.1.3" class="ltx_p"><span id="A4.F5.pic1.1.3.1" class="ltx_text" style="--ltx-fg-color:#000000;">[Score the following summary of a news article on its <span id="A4.F5.pic1.1.3.1.1" class="ltx_text" style="--ltx-fg-color:#BF0040;">[Aspect]</span>. Please return your score on how the summary is consistent with the article in the scale of 1 to 5, with 1 being the lowest.] 
<br class="ltx_break"></span></span>
<span id="A4.F5.pic1.1.4" class="ltx_p"><span id="A4.F5.pic1.1.4.1" class="ltx_text" style="--ltx-fg-color:#000000;">- The following is some examples on evaluation scores of <span id="A4.F5.pic1.1.4.1.1" class="ltx_text" style="--ltx-fg-color:#BF0040;">[Aspect]</span> of summary (in the range of 1 to 5, where 1 being the lowest).</span></span>
<span id="A4.F5.pic1.1.5" class="ltx_p"><span id="A4.F5.pic1.1.5.1" class="ltx_text" style="--ltx-fg-color:#000000;">- Please carefully read all the article, summary and their assigned score, and induce the most possible scoring rule and criteria used.</span></span>
<span id="A4.F5.pic1.1.6" class="ltx_p"><span id="A4.F5.pic1.1.6.1" class="ltx_text" style="--ltx-fg-color:#000000;">- It is optimal that, by using the induced criteria, you are very likely to assign a same score on <span id="A4.F5.pic1.1.6.1.1" class="ltx_text" style="--ltx-fg-color:#BF0040;">[Aspect]</span> to the provided reference scores. 
<br class="ltx_break"></span></span>
<span id="A4.F5.pic1.1.7" class="ltx_p"><span id="A4.F5.pic1.1.7.1" class="ltx_text" style="--ltx-fg-color:#000000;">## Criteria for <span id="A4.F5.pic1.1.7.1.1" class="ltx_text" style="--ltx-fg-color:#BF0040;">[Aspect]</span></span></span>
<span id="A4.F5.pic1.1.8" class="ltx_p"><span id="A4.F5.pic1.1.8.1" class="ltx_text" style="--ltx-fg-color:#000000;">- The scoring criteria been used. Now it is not explicitly provided, and you should induce it from the following samples.</span></span>
<span id="A4.F5.pic1.1.9" class="ltx_p"><span id="A4.F5.pic1.1.9.1" class="ltx_text" style="--ltx-fg-color:#000000;">- The induced criteria should be able to explain the scores of all the samples provided, being generic and concise. 
<br class="ltx_break"></span></span>
<span id="A4.F5.pic1.1.10" class="ltx_p"><span id="A4.F5.pic1.1.10.1" class="ltx_text" style="--ltx-fg-color:#000000;">## Examples</span></span>
<span id="A4.F5.pic1.1.11" class="ltx_p"><span id="A4.F5.pic1.1.11.1" class="ltx_text" style="--ltx-fg-color:#0000FF;">[In-Context Few-Shot Samples]<span id="A4.F5.pic1.1.11.1.1" class="ltx_text" style="--ltx-fg-color:#000000;"> 
<br class="ltx_break"></span></span></span>
<span id="A4.F5.pic1.1.12" class="ltx_p"><span id="A4.F5.pic1.1.12.1" class="ltx_text" style="--ltx-fg-color:#000000;">## Induced Criteria</span></span>
<span id="A4.F5.pic1.1.13" class="ltx_p"><span id="A4.F5.pic1.1.13.1" class="ltx_text" style="--ltx-fg-color:#000000;">Criteria for <span id="A4.F5.pic1.1.13.1.1" class="ltx_text" style="--ltx-fg-color:#BF0040;">[Aspect]</span>:</span></span>
</span></span></span></foreignobject></g></g></svg>