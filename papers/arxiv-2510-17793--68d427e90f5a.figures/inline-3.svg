<span id="A5.SS1.p4.pic1.1" class="ltx_inline-block ltx_minipage ltx_align_bottom" style="width:34.02em;">
<span id="A5.SS1.p4.pic1.1.1" class="ltx_p"><span id="A5.SS1.p4.pic1.1.1.1" class="ltx_text ltx_font_sansserif ltx_font_bold" style="--ltx-fg-color:#FFFFFF;">Step-level evaluation prompt for FARE</span></span>
</span></span></span></foreignobject></g><g fill-opacity="1.0" transform="matrix(1.0 0.0 0.0 1.0 16.11 17.27)"><foreignobject style="--ltx-fo-width:35.64em;--ltx-fo-height:42.55em;--ltx-fo-depth:0.08em;font-size:10pt;" height="589.97" overflow="visible" transform="matrix(1 0 0 -1 0 588.82)" width="493.16"><span class="ltx_foreignobject_container"><span class="ltx_foreignobject_content">
<span id="A5.SS1.p4.pic1.2" class="ltx_inline-block ltx_minipage ltx_align_bottom" style="width:35.64em;">
<span id="A5.SS1.p4.pic1.2.1" class="ltx_p"><span id="A5.SS1.p4.pic1.2.1.1" class="ltx_text ltx_font_typewriter" style="--ltx-fg-color:#000000;">### System Prompt
</span></span>
<span id="A5.SS1.p4.pic1.2.2" class="ltx_p"><span id="A5.SS1.p4.pic1.2.2.1" class="ltx_text ltx_font_typewriter" style="--ltx-fg-color:#000000;">Please act as an impartial judge and evaluate the quality of the response provided by an AI assistant to the user prompt displayed below. You will be given the assistant’s solution to a math problem, which is split into steps, starting with a &lt;step [step number]&gt; tag, where [step number] is indexed from 0. Your job is to identify which step an error occurs, if an error is present.
When evaluating the solution, consider each step separately. Evaluate the content of each step for correctness. If you encounter a mistake at &lt;step [step number]&gt;, output [step number] as your Verdict. If the full response is error free, then select step number -1. Avoid any biases, such as length of step, or stylistic elements like formatting.
</span></span>
<span id="A5.SS1.p4.pic1.2.3" class="ltx_p"><span id="A5.SS1.p4.pic1.2.3.1" class="ltx_text ltx_font_typewriter" style="--ltx-fg-color:#000000;">Here are some rules for evaluation.
</span></span>
<span id="A5.SS1.p4.pic1.2.4" class="ltx_p"><span id="A5.SS1.p4.pic1.2.4.1" class="ltx_text ltx_font_typewriter" style="--ltx-fg-color:#000000;">(1) The assistant’s answer does not need to be complete or arrive at a final solution. You may receive a partially complete response. Your job is to assess the quality of each step.
</span></span>
<span id="A5.SS1.p4.pic1.2.5" class="ltx_p"><span id="A5.SS1.p4.pic1.2.5.1" class="ltx_text ltx_font_typewriter" style="--ltx-fg-color:#000000;">(2) When evaluating the assistant’s answer, identify any mistakes or inaccurate information. Focus on the content each step and determine if the step is logically valid.
</span></span>
<span id="A5.SS1.p4.pic1.2.6" class="ltx_p"><span id="A5.SS1.p4.pic1.2.6.1" class="ltx_text ltx_font_typewriter" style="--ltx-fg-color:#000000;">(3) For each step, you should provide an explanation of your assessment. If you find an error, describe the nature and cause of the error.
</span></span>
<span id="A5.SS1.p4.pic1.2.7" class="ltx_p"><span id="A5.SS1.p4.pic1.2.7.1" class="ltx_text ltx_font_typewriter" style="--ltx-fg-color:#000000;">(4) Avoid any biases, such as answer length, or stylistic elements like formatting.
</span></span>
<span id="A5.SS1.p4.pic1.2.8" class="ltx_p"><span id="A5.SS1.p4.pic1.2.8.1" class="ltx_text ltx_font_typewriter" style="--ltx-fg-color:#000000;">Before providing an your final verdict, think through the judging process and output your thoughts as an explanation
After providing your explanation, you must output the corresponding step number with an error. Use the following format:
</span></span>
<span id="A5.SS1.p4.pic1.2.9" class="ltx_p"><span id="A5.SS1.p4.pic1.2.9.1" class="ltx_text ltx_font_typewriter" style="--ltx-fg-color:#000000;">Explanation: Your explanation here
</span></span>
<span id="A5.SS1.p4.pic1.2.10" class="ltx_p"><span id="A5.SS1.p4.pic1.2.10.1" class="ltx_text ltx_font_typewriter" style="--ltx-fg-color:#000000;">Verdict: The step number with the error or -1 if no error occurs
</span></span>
<span id="A5.SS1.p4.pic1.2.11" class="ltx_p"><span id="A5.SS1.p4.pic1.2.11.1" class="ltx_text ltx_font_typewriter" style="--ltx-fg-color:#000000;">### User Prompt
</span></span>
<span id="A5.SS1.p4.pic1.2.12" class="ltx_p"><span id="A5.SS1.p4.pic1.2.12.1" class="ltx_text ltx_font_typewriter" style="--ltx-fg-color:#000000;">[User Question]
</span></span>
<span id="A5.SS1.p4.pic1.2.13" class="ltx_p"><span id="A5.SS1.p4.pic1.2.13.1" class="ltx_text ltx_font_typewriter" style="--ltx-fg-color:#000000;">{question}
</span></span>
<span id="A5.SS1.p4.pic1.2.14" class="ltx_p"><span id="A5.SS1.p4.pic1.2.14.1" class="ltx_text ltx_font_typewriter" style="--ltx-fg-color:#000000;">[The Start of Assistant’s Answer]
</span></span>
<span id="A5.SS1.p4.pic1.2.15" class="ltx_p"><span id="A5.SS1.p4.pic1.2.15.1" class="ltx_text ltx_font_typewriter" style="--ltx-fg-color:#000000;">{response}
</span></span>
<span id="A5.SS1.p4.pic1.2.16" class="ltx_p"><span id="A5.SS1.p4.pic1.2.16.1" class="ltx_text ltx_font_typewriter" style="--ltx-fg-color:#000000;">[The End of Assistant’s Answer]
</span></span>
</span></span></span></foreignobject></g></g></svg>