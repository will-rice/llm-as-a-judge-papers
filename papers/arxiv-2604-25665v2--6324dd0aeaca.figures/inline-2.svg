<span id="S3.SS4.SSS1.p3.pic1.2" class="ltx_inline-block ltx_minipage ltx_align_bottom" style="width:34.01em;">
<span id="S3.SS4.SSS1.p3.pic1.2.1" class="ltx_p"><span id="S3.SS4.SSS1.p3.pic1.2.1.1" class="ltx_text ltx_font_bold" style="font-size:90%;--ltx-fg-color:#000000;">System Instruction
<br class="ltx_break"><span id="S3.SS4.SSS1.p3.pic1.2.1.1.1" class="ltx_text ltx_font_medium">You are an expert evaluator specializing in assessing summarization quality.</span></span></span>
<span id="S3.SS4.SSS1.p3.pic1.2.2" class="ltx_p"><span id="S3.SS4.SSS1.p3.pic1.2.2.1" class="ltx_text ltx_font_bold" style="font-size:90%;--ltx-fg-color:#000000;">Task Description<span id="S3.SS4.SSS1.p3.pic1.2.2.1.1" class="ltx_text ltx_font_medium"> 
<br class="ltx_break">Evaluate the quality of the summary below against the original document across multiple quality dimensions.</span></span></span>
<span id="S3.SS4.SSS1.p3.pic1.2.3" class="ltx_p"><span id="S3.SS4.SSS1.p3.pic1.2.3.1" class="ltx_text ltx_font_bold" style="font-size:90%;--ltx-fg-color:#000000;">Quality Dimensions<span id="S3.SS4.SSS1.p3.pic1.2.3.1.1" class="ltx_text"></span></span></span>
<span id="S3.I2" class="ltx_itemize" style="--ltx-enum-leftmargin:1.5em;">
<span id="S3.I2.i1" class="ltx_item" style="list-style-type:none;"><span class="ltx_tag ltx_tag_item">•</span> 
<span id="S3.I2.i1.p1" class="ltx_para">
<span id="S3.I2.i1.p1.1" class="ltx_p"><span id="S3.I2.i1.p1.1.1" class="ltx_text ltx_font_bold" style="font-size:90%;--ltx-fg-color:#000000;">Clarity</span><span id="S3.I2.i1.p1.1.2" class="ltx_text" style="font-size:90%;--ltx-fg-color:#000000;">: Is the summary reader-friendly? Does it express ideas clearly?</span></span>
</span></span>
<span id="S3.I2.i2" class="ltx_item" style="list-style-type:none;"><span class="ltx_tag ltx_tag_item">•</span> 
<span id="S3.I2.i2.p1" class="ltx_para">
<span id="S3.I2.i2.p1.1" class="ltx_p"><span id="S3.I2.i2.p1.1.1" class="ltx_text ltx_font_bold" style="font-size:90%;--ltx-fg-color:#000000;">Accuracy</span><span id="S3.I2.i2.p1.1.2" class="ltx_text" style="font-size:90%;--ltx-fg-color:#000000;">: Does the summary contain the same information as the original document?</span></span>
</span></span>
<span id="S3.I2.i3" class="ltx_item" style="list-style-type:none;"><span class="ltx_tag ltx_tag_item">•</span> 
<span id="S3.I2.i3.p1" class="ltx_para">
<span id="S3.I2.i3.p1.1" class="ltx_p"><span id="S3.I2.i3.p1.1.1" class="ltx_text ltx_font_bold" style="font-size:90%;--ltx-fg-color:#000000;">Coverage</span><span id="S3.I2.i3.p1.1.2" class="ltx_text" style="font-size:90%;--ltx-fg-color:#000000;">: How well does the summary cover the important information in the original document?</span></span>
</span></span>
<span id="S3.I2.i4" class="ltx_item" style="list-style-type:none;"><span class="ltx_tag ltx_tag_item">•</span> 
<span id="S3.I2.i4.p1" class="ltx_para">
<span id="S3.I2.i4.p1.1" class="ltx_p"><span id="S3.I2.i4.p1.1.1" class="ltx_text ltx_font_bold" style="font-size:90%;--ltx-fg-color:#000000;">Overall quality</span><span id="S3.I2.i4.p1.1.2" class="ltx_text" style="font-size:90%;--ltx-fg-color:#000000;">: How good is the summary overall at representing the original document?</span></span>
</span></span>
</span>
<span id="S3.SS4.SSS1.p3.pic1.2.4" class="ltx_p"><span id="S3.SS4.SSS1.p3.pic1.2.4.1" class="ltx_text ltx_font_bold" style="font-size:90%;--ltx-fg-color:#000000;">Evaluation Instructions<span id="S3.SS4.SSS1.p3.pic1.2.4.1.1" class="ltx_text"></span></span></span>
<span id="S3.SS4.SSS1.p3.pic1.2.5" class="ltx_p"><span id="S3.SS4.SSS1.p3.pic1.2.5.1" class="ltx_text" style="font-size:90%;--ltx-fg-color:#000000;">On a scale of 1-5, rate the summary on each dimension above. <span id="S3.SS4.SSS1.p3.pic1.2.5.1.1" class="ltx_text ltx_font_bold">Provide one to two short sentences to explain your rating for each dimension</span>, citing specific evidence from the summary.</span></span>
<span id="S3.SS4.SSS1.p3.pic1.2.6" class="ltx_p"><span id="S3.SS4.SSS1.p3.pic1.2.6.1" class="ltx_text ltx_font_bold" style="font-size:90%;--ltx-fg-color:#000000;">Source Document<span id="S3.SS4.SSS1.p3.pic1.2.6.1.1" class="ltx_text ltx_font_medium"> 
<br class="ltx_break">{<span id="S3.SS4.SSS1.p3.pic1.2.6.1.1.1" class="ltx_text ltx_font_italic">original_document</span>}</span></span></span>
<span id="S3.SS4.SSS1.p3.pic1.2.7" class="ltx_p"><span id="S3.SS4.SSS1.p3.pic1.2.7.1" class="ltx_text ltx_font_bold" style="font-size:90%;--ltx-fg-color:#000000;">Summary to Evaluate<span id="S3.SS4.SSS1.p3.pic1.2.7.1.1" class="ltx_text ltx_font_medium"> 
<br class="ltx_break">{<span id="S3.SS4.SSS1.p3.pic1.2.7.1.1.1" class="ltx_text ltx_font_italic">summary_to_evaluate</span>}</span></span></span>
<span id="S3.SS4.SSS1.p3.pic1.2.8" class="ltx_p"><span id="S3.SS4.SSS1.p3.pic1.2.8.1" class="ltx_text ltx_font_bold" style="font-size:90%;--ltx-fg-color:#000000;">Output Format<span id="S3.SS4.SSS1.p3.pic1.2.8.1.1" class="ltx_text ltx_font_medium"> 
<br class="ltx_break">The output must follow the following Python dictionary format:
<br class="ltx_break"><span id="S3.SS4.SSS1.p3.pic1.2.8.1.1.1" class="ltx_text ltx_font_typewriter">{’clarity’: clarity_score, ’accuracy’: accuracy_score, ’coverage’: coverage_score, ’overall’: overall_score, ’explanation’: {’clarity’: explanation, ’accuracy’: explanation, ’coverage’: explanation, ’overall’: explanation}}</span></span></span></span>
</span></span></span></foreignobject></g></g></svg>