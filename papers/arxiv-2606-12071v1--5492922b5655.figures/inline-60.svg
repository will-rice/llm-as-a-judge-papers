<span id="A1.SS6.p7.pic1.1.1" class="ltx_p"><span id="A1.SS6.p7.pic1.1.1.1" class="ltx_text ltx_font_bold" style="--ltx-fg-color:#FFFFFF;">Sample 7: Comparative Evaluation by Experts vs. LLM Judges</span></span>
</span></span></span></foreignobject></g><g fill-opacity="1.0" transform="matrix(1.0 0.0 0.0 1.0 11.81 374.17)"><foreignobject style="--ltx-fo-width:45.27em;--ltx-fo-height:4.29em;--ltx-fo-depth:6.18em;font-size:10pt;" height="144.87" overflow="visible" transform="matrix(1 0 0 -1 0 59.42)" width="626.41"><span class="ltx_foreignobject_container"><span class="ltx_foreignobject_content">
<span id="A1.SS6.p7.pic1.2" class="ltx_inline-block ltx_minipage ltx_align_bottom" style="width:45.27em;">
<span id="A1.SS6.p7.pic1.2.1" class="ltx_p"><span id="A1.SS6.p7.pic1.2.1.1" class="ltx_text ltx_font_sansserif ltx_font_bold" style="--ltx-fg-color:#000000;">BACKGROUND PAPER</span><span id="A1.SS6.p7.pic1.2.1.2" class="ltx_text" style="--ltx-fg-color:#000000;"> 
<br class="ltx_break"><span id="A1.SS6.p7.pic1.2.1.2.1" class="ltx_text ltx_font_bold">Title:</span> Accelerating Large Language Model Decoding with Speculative Sampling 
<br class="ltx_break"><span id="A1.SS6.p7.pic1.2.1.2.2" class="ltx_text ltx_font_bold" style="font-size:90%;">Abstract (Summarized):<span id="A1.SS6.p7.pic1.2.1.2.2.1" class="ltx_text ltx_font_medium"> We present speculative sampling, a novel algorithm designed to accelerate transformer decoding by enabling the generation of multiple tokens from each transformer call. The algorithm leverages the observation that parallel scoring of short continuations, generated by a faster but less powerful draft model, has latency comparable to sampling a single token from the larger target model. Combined with a modified rejection sampling scheme, this approach preserves the target model’s exact distribution while achieving a 2–2.5x decoding speedup.</span></span></span></span>
</span></span></span></foreignobject></g><g fill-opacity="1.0" transform="matrix(1.0 0.0 0.0 1.0 11.81 50.59)"><foreignobject style="--ltx-fo-width:45.27em;--ltx-fo-height:15.79em;--ltx-fo-depth:3.09em;font-size:10pt;" height="261.17" overflow="visible" transform="matrix(1 0 0 -1 0 218.46)" width="626.41"><span class="ltx_foreignobject_container"><span class="ltx_foreignobject_content"><span id="A1.SS6.p7.pic1.3" class="ltx_inline-logical-block ltx_minipage ltx_align_bottom" style="width:45.27em;">
<span id="A1.SS6.p7.pic1.p2" class="ltx_para">
<span id="A1.SS6.p7.pic1.p2.1" class="ltx_p"><span id="A1.SS6.p7.pic1.p2.1.1" class="ltx_text ltx_font_sansserif ltx_font_bold" style="--ltx-fg-color:#000000;">GROUND TRUTH RQ</span><span id="A1.SS6.p7.pic1.p2.1.2" class="ltx_text" style="--ltx-fg-color:#000000;"> 
<br class="ltx_break"><span id="A1.SS6.p7.pic1.p2.1.2.1" class="ltx_text ltx_font_italic">“How can introducing a controlled bias via a stepwise process reward model improve the reasoning accuracy of speculative decoding by retaining high-quality draft tokens that strictly unbiased methods would reject?”</span></span></span>
<span id="A1.SS6.p7.pic1.p2.2" class="ltx_p"><span id="A1.SS6.p7.pic1.p2.2.1" class="ltx_text ltx_font_sansserif ltx_font_bold" style="--ltx-fg-color:#000000;">BEST GPT-5.5 RQ</span><span id="A1.SS6.p7.pic1.p2.2.2" class="ltx_text" style="--ltx-fg-color:#000000;"> 
<br class="ltx_break"><span id="A1.SS6.p7.pic1.p2.2.2.1" class="ltx_text ltx_font_italic">“Can prompt-level estimates of draft-target agreement be used before generation to route requests among speculative sampling configurations with different draft models and K values?”</span></span></span>
</span>
