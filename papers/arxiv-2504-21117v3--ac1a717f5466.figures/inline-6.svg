<svg id="A1.F4.p1.pic1" class="ltx_picture" height="680.71" overflow="visible" version="1.1" viewbox="0 0 201.58 680.71" width="201.58"><g style="--ltx-stroke-color:#000000;--ltx-fill-color:#000000;" fill="#000000" stroke="#000000" stroke-width="0.4pt" transform="translate(0,680.71) matrix(1 0 0 -1 0 0)"><g style="--ltx-fill-color:#404040;" fill="#404040" fill-opacity="1.0"><path style="stroke:none" d="M 0 5.91 L 0 674.8 C 0 678.06 2.64 680.71 5.91 680.71 L 195.67 680.71 C 198.94 680.71 201.58 678.06 201.58 674.8 L 201.58 5.91 C 201.58 2.64 198.94 0 195.67 0 L 5.91 0 C 2.64 0 0 2.64 0 5.91 Z" /></g><g style="--ltx-fill-color:#F9F9F9;" fill="#F9F9F9" fill-opacity="1.0"><path style="stroke:none" d="M 1.97 5.91 L 1.97 674.8 C 1.97 676.97 3.73 678.74 5.91 678.74 L 195.67 678.74 C 197.85 678.74 199.61 676.97 199.61 674.8 L 199.61 5.91 C 199.61 3.73 197.85 1.97 195.67 1.97 L 5.91 1.97 C 3.73 1.97 1.97 3.73 1.97 5.91 Z" /></g><g fill-opacity="1.0" transform="matrix(1.0 0.0 0.0 1.0 7.29 -5.09)"><foreignobject style="--ltx-fo-width:16.95em;--ltx-fo-height:49.93em;--ltx-fo-depth:0em;font-size:10pt;" height="690.9" overflow="visible" transform="matrix(1 0 0 -1 0 690.9)" width="234.54"><span class="ltx_foreignobject_container"><span class="ltx_foreignobject_content">
<span id="A1.F4.p1.pic1.1" class="ltx_inline-block ltx_minipage ltx_align_bottom" style="width:16.95em;">
<span id="A1.F4.p1.pic1.1.1" class="ltx_p"><span id="A1.F4.p1.pic1.1.1.1" class="ltx_text" style="font-size:70%;--ltx-fg-color:#BF0000;">To evaluate the consistency of a summary with the article, follow these criteria:</span></span>
<span id="A1.F4.p1.pic1.1.2" class="ltx_p"><span id="A1.F4.p1.pic1.1.2.1" class="ltx_text" style="font-size:70%;--ltx-fg-color:#BF0000;">1. **Comprehensive Coverage**: Ensure the summary captures the main points and key details from the article without omitting crucial information. 
<br class="ltx_break">2. **Accuracy**: Verify that the summary accurately reflects the content of the article, maintaining the correct facts and figures. 
<br class="ltx_break">3. **Relevance**: Confirm that the summary is relevant to the article’s topic and does not include irrelevant information. 
<br class="ltx_break">4. **Precision**: Check that the summary uses precise language that aligns with the article’s tone and style. 
<br class="ltx_break">5. **Brevity**: Ensure the summary is concise and does not include unnecessary details or elongated phrases that detract from its clarity.<span id="A1.F4.p1.pic1.1.2.1.1" class="ltx_text"></span></span></span>
<span id="A1.F4.p1.pic1.1.3" class="ltx_p"><span id="A1.F4.p1.pic1.1.3.1" class="ltx_text" style="font-size:70%;--ltx-fg-color:#0000FF;">By adhering to these criteria, summaries will be evaluated for their consistency with the original article. 
<br class="ltx_break"><span id="A1.F4.p1.pic1.1.3.1.1" class="ltx_text" style="--ltx-fg-color:#000000;">
Now please evaluate the following summary to the article based on the above guideline criteria:</span></span></span>
<span id="A1.F4.p1.pic1.1.4" class="ltx_p"><span id="A1.F4.p1.pic1.1.4.1" class="ltx_text" style="font-size:70%;--ltx-fg-color:#000000;">Article: 
<br class="ltx_break">{article}</span></span>
<span id="A1.F4.p1.pic1.1.5" class="ltx_p"><span id="A1.F4.p1.pic1.1.5.1" class="ltx_text" style="font-size:70%;--ltx-fg-color:#000000;">Summary: 
<br class="ltx_break">{summary}</span></span>
<span id="A1.F4.p1.pic1.1.6" class="ltx_p"><span id="A1.F4.p1.pic1.1.6.1" class="ltx_text" style="font-size:70%;--ltx-fg-color:#000000;">Please just directly output the final consistency score in a json format.
For example: 
<br class="ltx_break">“‘json 
<br class="ltx_break">{ 
<br class="ltx_break">&quot;article&quot;: {article}, 
<br class="ltx_break">&quot;summary&quot;: {summary}, 
<br class="ltx_break">&quot;consistency_score&quot;: &lt;a score between 0 and 1&gt; 
<br class="ltx_break">} 
<br class="ltx_break">“‘</span></span>
</span></span></span></foreignobject></g></g></svg>