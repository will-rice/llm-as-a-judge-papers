<span id="S15.SS0.SSS0.Px13.p3.pic1.1" class="ltx_inline-block ltx_minipage ltx_align_bottom" style="width:27.43em;">
<span id="S15.SS0.SSS0.Px13.p3.pic1.1.1" class="ltx_p"><span id="S15.SS0.SSS0.Px13.p3.pic1.1.1.1" class="ltx_text" style="position:relative; bottom:0.9pt;"></span><a href="https://codeforces.com/blog/entry/136579" title class="ltx_ref ltx_href ltx_font_bold" style="--ltx-fg-color:#FFFFFF;">Tutorial</a><span id="S15.SS0.SSS0.Px13.p3.pic1.1.1.2" class="ltx_text ltx_font_bold" style="--ltx-fg-color:#FFFFFF;"> — <a href="https://codeforces.com/problemset/submission/2034/294047634" title class="ltx_ref ltx_href">Human’s accepted submission</a> — <a href="https://gist.github.com/anonymous-llm-code/d4521b069d648f1d86570465258badd0" title class="ltx_ref ltx_href"><span class="ltx_text ltx_font_typewriter">Gemini 2.5 Pro</span>’s rejected submission</a></span></span>
</span></span></span></foreignobject></g><g fill-opacity="1.0" transform="matrix(1.0 0.0 0.0 1.0 20.48 15.3)"><foreignobject style="--ltx-fo-width:31.54em;--ltx-fo-height:15.09em;--ltx-fo-depth:0.19em;font-size:10pt;" height="211.55" overflow="visible" transform="matrix(1 0 0 -1 0 208.86)" width="436.42"><span class="ltx_foreignobject_container"><span class="ltx_foreignobject_content">
<span id="S15.SS0.SSS0.Px13.p3.pic1.2" class="ltx_inline-block ltx_minipage ltx_align_bottom" style="width:31.54em;">
<span id="S15.SS0.SSS0.Px13.p3.pic1.2.1" class="ltx_p"><span id="S15.SS0.SSS0.Px13.p3.pic1.2.1.1" class="ltx_text" style="--ltx-fg-color:#000000;">Since we are allowed to perform <math id="S15.SS0.SSS0.Px13.p3.pic1.m1" class="ltx_Math" alttext="n" display="inline" intent=":literal"><semantics><mi style="--ltx-fg-color:#000000;" mathcolor="#000000">n</mi><annotation encoding="application/x-tex">n</annotation></semantics></math> moves, assign each index one <span id="S15.SS0.SSS0.Px13.p3.pic1.2.1.1.1" class="ltx_text ltx_font_italic">“move”</span> as its <span id="S15.SS0.SSS0.Px13.p3.pic1.2.1.1.2" class="ltx_text ltx_font_italic">“specified cost”</span>. 
<br class="ltx_break">
<br class="ltx_break">While there exists an index with a value of <math id="S15.SS0.SSS0.Px13.p3.pic1.m2" class="ltx_Math" alttext="0" display="inline" intent=":literal"><semantics><mn style="--ltx-fg-color:#000000;" mathcolor="#000000">0</mn><annotation encoding="application/x-tex">0</annotation></semantics></math> or <math id="S15.SS0.SSS0.Px13.p3.pic1.m3" class="ltx_Math" alttext="2" display="inline" intent=":literal"><semantics><mn style="--ltx-fg-color:#000000;" mathcolor="#000000">2</mn><annotation encoding="application/x-tex">2</annotation></semantics></math> that can be fixed with just one move, fix it using its assigned cost. 
<br class="ltx_break">
<br class="ltx_break">After fixing all <math id="S15.SS0.SSS0.Px13.p3.pic1.m4" class="ltx_Math" alttext="0" display="inline" intent=":literal"><semantics><mn style="--ltx-fg-color:#000000;" mathcolor="#000000">0</mn><annotation encoding="application/x-tex">0</annotation></semantics></math>’s, <math id="S15.SS0.SSS0.Px13.p3.pic1.m5" class="ltx_Math" alttext="2" display="inline" intent=":literal"><semantics><mn style="--ltx-fg-color:#000000;" mathcolor="#000000">2</mn><annotation encoding="application/x-tex">2</annotation></semantics></math>’s, and all <math id="S15.SS0.SSS0.Px13.p3.pic1.m6" class="ltx_Math" alttext="1" display="inline" intent=":literal"><semantics><mn style="--ltx-fg-color:#000000;" mathcolor="#000000">1</mn><annotation encoding="application/x-tex">1</annotation></semantics></math>’s except one, the remaining array will have the following structure and we are now allowed to use <math id="S15.SS0.SSS0.Px13.p3.pic1.m7" class="ltx_Math" alttext="2x+1" display="inline" intent=":literal"><semantics><mrow><mrow><mn style="--ltx-fg-color:#000000;" mathcolor="#000000">2</mn><mo lspace="0em" rspace="0em">​</mo><mi style="--ltx-fg-color:#000000;" mathcolor="#000000">x</mi></mrow><mo style="--ltx-fg-color:#000000;" mathcolor="#000000">+</mo><mn style="--ltx-fg-color:#000000;" mathcolor="#000000">1</mn></mrow><annotation encoding="application/x-tex">2x+1</annotation></semantics></math> moves:</span></span>
<span id="S15.Ex10" class="ltx_equation ltx_eqn_table">

<span><span class="ltx_equation ltx_eqn_row ltx_align_baseline">
<span class="ltx_eqn_cell ltx_eqn_center_padleft"></span>
<span class="ltx_eqn_cell ltx_align_center"><math id="S15.Ex10.m1" class="ltx_Math" alttext="2\ 2\ \dots\ 2\ (x\ \text{times})\ 1\ 0\ 0\ \dots\ 0\ (x\ \text{times})," display="block" intent=":literal"><semantics><mrow><mrow><mn style="--ltx-fg-color:#000000;" mathcolor="#000000">2 2</mn><mo lspace="0.500em" rspace="0em">​</mo><mi style="--ltx-fg-color:#000000;" mathcolor="#000000" mathvariant="normal">…</mi><mo lspace="0em" rspace="0em">​</mo><mn style="--ltx-fg-color:#000000;" mathcolor="#000000"> 2</mn><mo lspace="0.500em" rspace="0em">​</mo><mrow><mo style="--ltx-fg-color:#000000;" mathcolor="#000000" stretchy="false">(</mo><mrow><mi style="--ltx-fg-color:#000000;" mathcolor="#000000">x</mi><mo lspace="0.500em" rspace="0em">​</mo><mtext style="--ltx-fg-color:#000000;" mathcolor="#000000">times</mtext></mrow><mo style="--ltx-fg-color:#000000;" mathcolor="#000000" stretchy="false">)</mo></mrow><mo lspace="0em" rspace="0em">​</mo><mn style="--ltx-fg-color:#000000;" mathcolor="#000000"> 1 0 0</mn><mo lspace="0.500em" rspace="0em">​</mo><mi style="--ltx-fg-color:#000000;" mathcolor="#000000" mathvariant="normal">…</mi><mo lspace="0em" rspace="0em">​</mo><mn style="--ltx-fg-color:#000000;" mathcolor="#000000"> 0</mn><mo lspace="0.500em" rspace="0em">​</mo><mrow><mo style="--ltx-fg-color:#000000;" mathcolor="#000000" stretchy="false">(</mo><mrow><mi style="--ltx-fg-color:#000000;" mathcolor="#000000">x</mi><mo lspace="0.500em" rspace="0em">​</mo><mtext style="--ltx-fg-color:#000000;" mathcolor="#000000">times</mtext></mrow><mo style="--ltx-fg-color:#000000;" mathcolor="#000000" stretchy="false">)</mo></mrow></mrow><mo style="--ltx-fg-color:#000000;" mathcolor="#000000">,</mo></mrow><annotation encoding="application/x-tex">2\ 2\ \dots\ 2\ (x\ \text{times})\ 1\ 0\ 0\ \dots\ 0\ (x\ \text{times}),</annotation></semantics></math></span>
<span class="ltx_eqn_cell ltx_eqn_center_padright"></span></span></span>
</span>
<span id="S15.SS0.SSS0.Px13.p3.pic1.2.2" class="ltx_p"><span id="S15.SS0.SSS0.Px13.p3.pic1.2.2.1" class="ltx_text" style="--ltx-fg-color:#000000;">First, swap the <math id="S15.SS0.SSS0.Px13.p3.pic1.m8" class="ltx_Math" alttext="1" display="inline" intent=":literal"><semantics><mn style="--ltx-fg-color:#000000;" mathcolor="#000000">1</mn><annotation encoding="application/x-tex">1</annotation></semantics></math> with a random element (denote it as <math id="S15.SS0.SSS0.Px13.p3.pic1.m9" class="ltx_Math" alttext="r" display="inline" intent=":literal"><semantics><mi style="--ltx-fg-color:#000000;" mathcolor="#000000">r</mi><annotation encoding="application/x-tex">r</annotation></semantics></math>). Then, for <math id="S15.SS0.SSS0.Px13.p3.pic1.m10" class="ltx_Math" alttext="2x-1" display="inline" intent=":literal"><semantics><mrow><mrow><mn style="--ltx-fg-color:#000000;" mathcolor="#000000">2</mn><mo lspace="0em" rspace="0em">​</mo><mi style="--ltx-fg-color:#000000;" mathcolor="#000000">x</mi></mrow><mo style="--ltx-fg-color:#000000;" mathcolor="#000000">−</mo><mn style="--ltx-fg-color:#000000;" mathcolor="#000000">1</mn></mrow><annotation encoding="application/x-tex">2x-1</annotation></semantics></math> moves, swap the index with the value <math id="S15.SS0.SSS0.Px13.p3.pic1.m11" class="ltx_Math" alttext="1" display="inline" intent=":literal"><semantics><mn style="--ltx-fg-color:#000000;" mathcolor="#000000">1</mn><annotation encoding="application/x-tex">1</annotation></semantics></math> with any index where the correct value must be placed, except <math id="S15.SS0.SSS0.Px13.p3.pic1.m12" class="ltx_Math" alttext="r" display="inline" intent=":literal"><semantics><mi style="--ltx-fg-color:#000000;" mathcolor="#000000">r</mi><annotation encoding="application/x-tex">r</annotation></semantics></math>. Finally, swap <math id="S15.SS0.SSS0.Px13.p3.pic1.m13" class="ltx_Math" alttext="1" display="inline" intent=":literal"><semantics><mn style="--ltx-fg-color:#000000;" mathcolor="#000000">1</mn><annotation encoding="application/x-tex">1</annotation></semantics></math> and <math id="S15.SS0.SSS0.Px13.p3.pic1.m14" class="ltx_Math" alttext="r" display="inline" intent=":literal"><semantics><mi style="--ltx-fg-color:#000000;" mathcolor="#000000">r</mi><annotation encoding="application/x-tex">r</annotation></semantics></math>.</span></span>
</span></span></span></foreignobject></g></g></svg>