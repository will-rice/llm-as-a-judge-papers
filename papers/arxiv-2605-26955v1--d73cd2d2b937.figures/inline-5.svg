<span id="A3.I10.i2.p1.1" class="ltx_p"><span id="A3.I10.i2.p1.1.1" class="ltx_text ltx_font_typewriter" style="font-size:90%;--ltx-fg-color:#000000;">**Explanation:** ‘‘{explanation_b}’’
