<span id="A2.I4.i2.p1.1" class="ltx_p"><span id="A2.I4.i2.p1.1.1" class="ltx_text ltx_font_typewriter ltx_font_bold" style="font-size:90%;--ltx-fg-color:#000000;">Actionability:</span><span id="A2.I4.i2.p1.1.2" class="ltx_text ltx_font_typewriter" style="font-size:90%;--ltx-fg-color:#000000;"> Focus on actionable steps: medications, lifestyle changes, &quot;red flag&quot; warnings, or referral instructions (e.g., &quot;See a cardiologist&quot;).
</span></span>
</span></span>
<span id="A2.I4.i3" class="ltx_item" style="list-style-type:none;"><span class="ltx_tag ltx_tag_item">•</span> 
<span id="A2.I4.i3.p1" class="ltx_para">
<span id="A2.I4.i3.p1.1" class="ltx_p"><span id="A2.I4.i3.p1.1.1" class="ltx_text ltx_font_typewriter ltx_font_bold" style="font-size:90%;--ltx-fg-color:#000000;">Factuality:</span><span id="A2.I4.i3.p1.1.2" class="ltx_text ltx_font_typewriter" style="font-size:90%;--ltx-fg-color:#000000;"> Strictly adhere to the doctor’s original text. Do not hallucinate or add medical advice not present in the source.
</span></span>
</span></span>
</span>
