<span id="S5.SS3.p5.pic1.1.1" class="ltx_p"><span id="S5.SS3.p5.pic1.1.1.1" class="ltx_text ltx_font_bold" style="--ltx-fg-color:#000000;">PBP Judge: <em id="S5.SS3.p5.pic1.1.1.1.1" class="ltx_emph ltx_font_italic">Lock Evidence</em> (no scores, no verdict)</span></span>
</span></span></span></foreignobject></g><g fill-opacity="1.0" transform="matrix(1.0 0.0 0.0 1.0 12.99 14.09)"><foreignobject style="--ltx-fo-width:32.62em;--ltx-fo-height:35.29em;--ltx-fo-depth:0.25em;font-size:10pt;" height="491.83" overflow="visible" transform="matrix(1 0 0 -1 0 488.38)" width="451.37"><span class="ltx_foreignobject_container"><span class="ltx_foreignobject_content">
<span id="S5.SS3.p5.pic1.2" class="ltx_inline-block ltx_minipage ltx_align_bottom" style="width:32.62em;">
<span id="S5.SS3.p5.pic1.2.1" class="ltx_p"><span id="S5.SS3.p5.pic1.2.1.1" class="ltx_text" style="--ltx-fg-color:#000000;">You are an impartial judge. First, write criterion-wise notes for <span id="S5.SS3.p5.pic1.2.1.1.1" class="ltx_text ltx_font_bold">accuracy</span>,
<span id="S5.SS3.p5.pic1.2.1.1.2" class="ltx_text ltx_font_bold">completeness</span>, <span id="S5.SS3.p5.pic1.2.1.1.3" class="ltx_text ltx_font_bold">conciseness</span>, <span id="S5.SS3.p5.pic1.2.1.1.4" class="ltx_text ltx_font_bold">fluency</span>. For every note, quote
or reference the exact span(s) from the <span id="S5.SS3.p5.pic1.2.1.1.5" class="ltx_text ltx_font_bold">Document</span> or <span id="S5.SS3.p5.pic1.2.1.1.6" class="ltx_text ltx_font_bold">Summaries</span>
that support it. <span id="S5.SS3.p5.pic1.2.1.1.7" class="ltx_text ltx_font_bold">Do not</span> provide a verdict. <em id="S5.SS3.p5.pic1.2.1.1.8" class="ltx_emph ltx_font_italic">Score</em> using locked notes only
Using <span id="S5.SS3.p5.pic1.2.1.1.9" class="ltx_text ltx_font_bold">only</span> the <span id="S5.SS3.p5.pic1.2.1.1.10" class="ltx_text ltx_font_typewriter">locked_notes</span> above, assign 0–5 scores for each
criterion and summary. Do <em id="S5.SS3.p5.pic1.2.1.1.11" class="ltx_emph ltx_font_italic">not</em> add new evidence. Aggregate the criterion scores (equal weights unless specified) and produce the
overall verdict and a one–sentence justification that references the locked notes.</span></span>
<span id="S5.SS3.p5.pic1.2.2" class="ltx_p"><span id="S5.SS3.p5.pic1.2.2.1" class="ltx_text ltx_font_bold" style="--ltx-fg-color:#000000;">Document<span id="S5.SS3.p5.pic1.2.2.1.1" class="ltx_text ltx_font_medium">: {<span id="S5.SS3.p5.pic1.2.2.1.1.1" class="ltx_text ltx_font_typewriter">DOC_TEXT</span>}</span></span></span>
<span id="S5.SS3.p5.pic1.2.3" class="ltx_p"><span id="S5.SS3.p5.pic1.2.3.1" class="ltx_text ltx_font_bold" style="--ltx-fg-color:#000000;">Summary 1 (label = {<span id="S5.SS3.p5.pic1.2.3.1.1" class="ltx_text ltx_font_typewriter">LABEL_1</span>})<span id="S5.SS3.p5.pic1.2.3.1.2" class="ltx_text ltx_font_medium">: {<span id="S5.SS3.p5.pic1.2.3.1.2.1" class="ltx_text ltx_font_typewriter">SUM1</span>}</span></span></span>
<span id="S5.SS3.p5.pic1.2.4" class="ltx_p"><span id="S5.SS3.p5.pic1.2.4.1" class="ltx_text ltx_font_bold" style="--ltx-fg-color:#000000;">Summary 2 (label = {<span id="S5.SS3.p5.pic1.2.4.1.1" class="ltx_text ltx_font_typewriter">LABEL_2</span>})<span id="S5.SS3.p5.pic1.2.4.1.2" class="ltx_text ltx_font_medium">: {<span id="S5.SS3.p5.pic1.2.4.1.2.1" class="ltx_text ltx_font_typewriter">SUM2</span>}</span></span></span>
<span id="S5.SS3.p5.pic1.2.5" class="ltx_p"><span id="S5.SS3.p5.pic1.2.5.1" class="ltx_text ltx_font_bold" style="--ltx-fg-color:#000000;">Output<span id="S5.SS3.p5.pic1.2.5.1.1" class="ltx_text ltx_font_medium">:
{{
&quot;verdict&quot;: &quot;[1,2]&quot; | &quot;[2,1]&quot; | &quot;Tie&quot;,
&quot;explanation&quot;: &quot;reference locked evidence only&quot;
}}</span></span></span>
</span></span></span></foreignobject></g></g></svg>