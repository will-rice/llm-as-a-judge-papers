<svg id="A4.pic12" class="ltx_picture" height="415.03" overflow="visible" version="1.1" viewbox="0 0 653.15 415.03" width="653.15"><g style="--ltx-stroke-color:#000000;--ltx-fill-color:#000000;" fill="#000000" stroke="#000000" stroke-width="0.4pt" transform="translate(0,415.03) matrix(1 0 0 -1 0 0)"><g style="--ltx-fill-color:#404040;" fill="#404040" fill-opacity="1.0"><path style="stroke:none" d="M 0 5.32 L 0 409.71 C 0 412.65 2.38 415.03 5.32 415.03 L 647.83 415.03 C 650.77 415.03 653.15 412.65 653.15 409.71 L 653.15 5.32 C 653.15 2.38 650.77 0 647.83 0 L 5.32 0 C 2.38 0 0 2.38 0 5.32 Z" /></g><g style="--ltx-fill-color:#F2F2F2;" fill="#F2F2F2" fill-opacity="1.0"><path style="stroke:none" d="M 1.38 5.32 L 1.38 387.36 L 651.77 387.36 L 651.77 5.32 C 651.77 3.15 650 1.38 647.83 1.38 L 5.32 1.38 C 3.15 1.38 1.38 3.15 1.38 5.32 Z" /></g><g style="--ltx-fill-color:#666666;" fill="#666666" fill-opacity="1.0"><path style="stroke:none" d="M 1.38 388.74 L 1.38 409.71 C 1.38 411.89 3.15 413.65 5.32 413.65 L 647.83 413.65 C 650 413.65 651.77 411.89 651.77 409.71 L 651.77 388.74 Z" /></g><g fill-opacity="1.0" transform="matrix(1.0 0.0 0.0 1.0 6.92 397.74)"><foreignobject style="--ltx-fo-width:46.2em;--ltx-fo-height:0.75em;--ltx-fo-depth:0.25em;font-size:10pt;" height="13.84" overflow="visible" transform="matrix(1 0 0 -1 0 10.38)" width="639.28"><span class="ltx_foreignobject_container"><span class="ltx_foreignobject_content">
<span id="A4.pic12.1" class="ltx_inline-block ltx_minipage ltx_align_bottom" style="width:46.2em;">
<span id="A4.pic12.1.1" class="ltx_p"><span id="A4.pic12.1.1.1" class="ltx_text" style="--ltx-fg-color:#FFFFFF;">Prompt D.12: ACtion Instruction-Following Prompt (<a href="#S2.SS3" title="2.3 Synthesizing a Personalized Report ‣ 2 MySQA: Personalized Deep Research ‣ Language Models Don’t Know What You Want:Evaluating Personalization in Deep Research Needs Real Users" class="ltx_ref"><span class="ltx_text ltx_ref_tag">section</span> <span class="ltx_text ltx_ref_tag">2.3</span></a>)</span></span>
</span></span></span></foreignobject></g><g fill-opacity="1.0" transform="matrix(1.0 0.0 0.0 1.0 6.92 6.92)"><foreignobject style="--ltx-fo-width:46.2em;--ltx-fo-height:27.09em;--ltx-fo-depth:0em;font-size:10pt;" height="374.91" overflow="visible" transform="matrix(1 0 0 -1 0 374.91)" width="639.28"><span class="ltx_foreignobject_container"><span class="ltx_foreignobject_content">
<span id="A4.pic12.2" class="ltx_inline-block ltx_minipage ltx_align_bottom" style="width:46.2em;">
<span id="A4.pic12.2.1" class="ltx_p"><span id="A4.pic12.2.1.1" class="ltx_text" style="--ltx-fg-color:#000000;">You are given a query, an instruction, and a corresponding long answer. As an Instruction-Following Validator, your task is to determine whether the answer correctly follows a given instruction with the boolean flag &quot;was_followed&quot;.
<br class="ltx_break"></span></span>
<span id="A4.pic12.2.2" class="ltx_p"><span id="A4.pic12.2.2.1" class="ltx_text" style="--ltx-fg-color:#000000;">If the response directly follows the instruction, then &quot;was_followed&quot; is true. If the response does not directly adhere to the instruction, either failing to fulfill any of its requirements or failing to acknowledging it, then &quot;was_followed&quot; is False
<br class="ltx_break"></span></span>
<span id="A4.pic12.2.3" class="ltx_p"><span id="A4.pic12.2.3.1" class="ltx_text" style="--ltx-fg-color:#000000;">For example, if the instruction states that the response should &quot;Include a section on metrics&quot; and the response has a section on metrics, then &quot;was_followed&quot; is true
<br class="ltx_break"></span></span>
<span id="A4.pic12.2.4" class="ltx_p"><span id="A4.pic12.2.4.1" class="ltx_text" style="--ltx-fg-color:#000000;">Similarly, if the instruction states that the response should &quot;Discuss future directions&quot; and the response only reports on current trends, then &quot;was_followed&quot; is false
<br class="ltx_break"></span></span>
<span id="A4.pic12.2.5" class="ltx_p"><span id="A4.pic12.2.5.1" class="ltx_text" style="--ltx-fg-color:#000000;">You should be strict with your judgments. If the instruction says the model should do something (e.g. add a section titled &quot;X&quot;, add an analogy on &quot;Y&quot;), the model must follow it exactly for ‘was_followed‘ to be true. If the model vaguely follows the instruction (e.g. adding sections related to &quot;X&quot; but not with the right title, using keywords linked to &quot;Y&quot; but not adding an analogy), ‘was_followed‘ should be false
<br class="ltx_break"></span></span>
<span id="A4.pic12.2.6" class="ltx_p"><span id="A4.pic12.2.6.1" class="ltx_text" style="--ltx-fg-color:#000000;">Return your result as a JSON object with the keys: 1) ‘was_followed‘: a true/false boolean for whether the instruction was followed in the answer; and 2) ‘reason‘: a string explanation behind your decision:
<br class="ltx_break">{{
<br class="ltx_break">&quot;was_followed&quot;: boolean true/false for if the instruction is followed in the answer
<br class="ltx_break">&quot;reason&quot;: string explanation for your decision in &quot;was_followed&quot;
<br class="ltx_break">}}
<br class="ltx_break"></span></span>
<span id="A4.pic12.2.7" class="ltx_p"><span id="A4.pic12.2.7.1" class="ltx_text" style="--ltx-fg-color:#000000;">Question: <math id="A4.pic12.m1" class="ltx_Math" alttext="q" display="inline" intent=":literal"><semantics><mi style="--ltx-fg-color:#000000;" mathcolor="#000000">q</mi><annotation encoding="application/x-tex">q</annotation></semantics></math>
<br class="ltx_break">Instruction: <math id="A4.pic12.m2" class="ltx_Math" alttext="a" display="inline" intent=":literal"><semantics><mi style="--ltx-fg-color:#000000;" mathcolor="#000000">a</mi><annotation encoding="application/x-tex">a</annotation></semantics></math>
<br class="ltx_break">Answer: <math id="A4.pic12.m3" class="ltx_Math" alttext="\mathcal{R}" display="inline" intent=":literal"><semantics><mi style="--ltx-fg-color:#000000;" class="ltx_font_mathcaligraphic" mathcolor="#000000">ℛ</mi><annotation encoding="application/x-tex">\mathcal{R}</annotation></semantics></math>
<br class="ltx_break"></span></span>
</span></span></span></foreignobject></g></g></svg>