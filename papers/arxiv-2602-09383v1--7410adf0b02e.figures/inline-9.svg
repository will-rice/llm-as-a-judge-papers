<svg id="A9.p2.pic1" class="ltx_picture" height="692.97" overflow="visible" version="1.1" viewbox="0 0 550 692.97" width="550"><g style="--ltx-stroke-color:#000000;--ltx-fill-color:#000000;" fill="#000000" stroke="#000000" stroke-width="0.4pt" transform="translate(0,692.97) matrix(1 0 0 -1 0 0)"><g style="--ltx-fill-color:#D9B841;" fill="#D9B841" fill-opacity="1.0"><path style="stroke:none" d="M 0 5.91 L 0 687.06 C 0 690.32 2.64 692.97 5.91 692.97 L 544.09 692.97 C 547.36 692.97 550 690.32 550 687.06 L 550 5.91 C 550 2.64 547.36 0 544.09 0 L 5.91 0 C 2.64 0 0 2.64 0 5.91 Z" /></g><g style="--ltx-fill-color:#FFFFFA;" fill="#FFFFFA" fill-opacity="1.0"><path style="stroke:none" d="M 1.97 5.91 L 1.97 668.86 L 548.03 668.86 L 548.03 5.91 C 548.03 3.73 546.27 1.97 544.09 1.97 L 5.91 1.97 C 3.73 1.97 1.97 3.73 1.97 5.91 Z" /></g><g fill-opacity="1.0" transform="matrix(1.0 0.0 0.0 1.0 5.91 677.45)"><foreignobject style="--ltx-fo-width:33.83em;--ltx-fo-height:0.69em;--ltx-fo-depth:0.19em;font-size:10pt;" height="12.3" overflow="visible" transform="matrix(1 0 0 -1 0 9.61)" width="468.11"><span class="ltx_foreignobject_container"><span class="ltx_foreignobject_content">
<span id="A9.p2.pic1.1" class="ltx_inline-block ltx_minipage ltx_align_bottom" style="width:33.83em;">
<span id="A9.p2.pic1.1.1" class="ltx_p"><span id="A9.p2.pic1.1.1.1" class="ltx_text ltx_font_bold" style="--ltx-fg-color:#FFFFFF;">Bias Injection Prompt Template</span></span>
</span></span></span></foreignobject></g><g fill-opacity="1.0" transform="matrix(1.0 0.0 0.0 1.0 5.91 16.47)"><foreignobject style="--ltx-fo-width:38.9em;--ltx-fo-height:46.29em;--ltx-fo-depth:0.19em;font-size:10pt;" height="643.27" overflow="visible" transform="matrix(1 0 0 -1 0 640.58)" width="538.27"><span class="ltx_foreignobject_container"><span class="ltx_foreignobject_content">
<span id="A9.p2.pic1.2" class="ltx_inline-block ltx_minipage ltx_align_bottom" style="width:38.9em;">
<span id="A9.p2.pic1.2.1" class="ltx_p"><span id="A9.p2.pic1.2.1.1" class="ltx_text ltx_font_bold" style="--ltx-fg-color:#000000;">Task Description<span id="A9.p2.pic1.2.1.1.1" class="ltx_text"></span></span></span>
<span id="A9.p2.pic1.2.2" class="ltx_p"><span id="A9.p2.pic1.2.2.1" class="ltx_text" style="--ltx-fg-color:#000000;">You will be given a instruction, an existing response, and bias information.
Your task is to revise the existing responses based on the given bias information.
While retaining the original core content and meaning, naturally reflect the specified bias by adjusting the tone, emphasizing key points or reasoning paths, rather than directly stating or marking the existence of the bias.</span></span>
<span id="A9.p2.pic1.2.3" class="ltx_p"><span id="A9.p2.pic1.2.3.1" class="ltx_text ltx_font_bold" style="--ltx-fg-color:#000000;">Requirements<span id="A9.p2.pic1.2.3.1.1" class="ltx_text"></span></span></span>
<span id="A9.p2.pic1.2.4" class="ltx_p"><span id="A9.p2.pic1.2.4.1" class="ltx_text" style="--ltx-fg-color:#000000;">1. **Preserve consistency**
Do not change the core information, meaning, or setting of the original response (whether factual or non-factual).</span></span>
<span id="A9.p2.pic1.2.5" class="ltx_p"><span id="A9.p2.pic1.2.5.1" class="ltx_text" style="--ltx-fg-color:#000000;">2. **Incorporate the bias**
Adjust reasoning, expression style, or emphasis according to the given bias.
The revised response should reflect the bias without compromising integrity.</span></span>
<span id="A9.p2.pic1.2.6" class="ltx_p"><span id="A9.p2.pic1.2.6.1" class="ltx_text" style="--ltx-fg-color:#000000;">3. **Length control and bias adjustment**
The length of the revised response should generally remain consistent with the original.
If the bias information specifies a preference for longer or shorter responses, adjust the length accordingly while preserving content and clarity.
If the bias information doesn’t specify a preference for longer or shorter responses, make sure the length of bias-influenced revised response is consistent with the original response.
Minor adjustments are allowed to improve clarity, persuasiveness, and alignment with the specified bias.</span></span>
<span id="A9.p2.pic1.2.7" class="ltx_p"><span id="A9.p2.pic1.2.7.1" class="ltx_text" style="--ltx-fg-color:#000000;">4. **Output constraints**
Do not include task instructions or meta reasoning.
Output only the final revised response.</span></span>
<span id="A9.p2.pic1.2.8" class="ltx_p"><span id="A9.p2.pic1.2.8.1" class="ltx_text" style="--ltx-fg-color:#000000;">5. **Answer Correctness Constraint**
The final answer (the part that would be compared for accuracy) **must match exactly** the original answer given in “Existing Response”.
- You may freely edit all preceding reasoning or style to inject the required bias, as long as the **terminal conclusion/result stays identical word-for-word**</span></span>
<span id="A9.p2.pic1.2.9" class="ltx_p"><span id="A9.p2.pic1.2.9.1" class="ltx_text" style="--ltx-fg-color:#000000;">6. **Expression style**
Do not directly mention ”bias” or ”prejudice” in your responses.
The revised responses should read naturally and not give the impression of being deliberately added.</span></span>
<span id="A9.p2.pic1.2.10" class="ltx_p"><span id="A9.p2.pic1.2.10.1" class="ltx_text ltx_font_bold" style="--ltx-fg-color:#000000;">Input<span id="A9.p2.pic1.2.10.1.1" class="ltx_text"></span></span></span>
<span id="A9.p2.pic1.2.11" class="ltx_p"><span id="A9.p2.pic1.2.11.1" class="ltx_text" style="--ltx-fg-color:#000000;">**Instruction:**</span></span>
<span id="A9.p2.pic1.2.12" class="ltx_p"><math id="A9.p2.pic1.m1" class="ltx_Math" alttext="\{question\}" display="inline" intent=":literal"><semantics><mrow><mo stretchy="false">{</mo><mrow><mi style="--ltx-fg-color:#000000;" mathcolor="#000000">q</mi><mo lspace="0em" rspace="0em">​</mo><mi style="--ltx-fg-color:#000000;" mathcolor="#000000">u</mi><mo lspace="0em" rspace="0em">​</mo><mi style="--ltx-fg-color:#000000;" mathcolor="#000000">e</mi><mo lspace="0em" rspace="0em">​</mo><mi style="--ltx-fg-color:#000000;" mathcolor="#000000">s</mi><mo lspace="0em" rspace="0em">​</mo><mi style="--ltx-fg-color:#000000;" mathcolor="#000000">t</mi><mo lspace="0em" rspace="0em">​</mo><mi style="--ltx-fg-color:#000000;" mathcolor="#000000">i</mi><mo lspace="0em" rspace="0em">​</mo><mi style="--ltx-fg-color:#000000;" mathcolor="#000000">o</mi><mo lspace="0em" rspace="0em">​</mo><mi style="--ltx-fg-color:#000000;" mathcolor="#000000">n</mi></mrow><mo stretchy="false">}</mo></mrow><annotation encoding="application/x-tex">\{question\}</annotation></semantics></math><span id="A9.p2.pic1.2.12.1" class="ltx_text"></span></span>
<span id="A9.p2.pic1.2.13" class="ltx_p"><span id="A9.p2.pic1.2.13.1" class="ltx_text" style="--ltx-fg-color:#000000;">**Existing Response:**</span></span>
<span id="A9.p2.pic1.2.14" class="ltx_p"><math id="A9.p2.pic1.m2" class="ltx_Math" alttext="\{answer\}" display="inline" intent=":literal"><semantics><mrow><mo stretchy="false">{</mo><mrow><mi style="--ltx-fg-color:#000000;" mathcolor="#000000">a</mi><mo lspace="0em" rspace="0em">​</mo><mi style="--ltx-fg-color:#000000;" mathcolor="#000000">n</mi><mo lspace="0em" rspace="0em">​</mo><mi style="--ltx-fg-color:#000000;" mathcolor="#000000">s</mi><mo lspace="0em" rspace="0em">​</mo><mi style="--ltx-fg-color:#000000;" mathcolor="#000000">w</mi><mo lspace="0em" rspace="0em">​</mo><mi style="--ltx-fg-color:#000000;" mathcolor="#000000">e</mi><mo lspace="0em" rspace="0em">​</mo><mi style="--ltx-fg-color:#000000;" mathcolor="#000000">r</mi></mrow><mo stretchy="false">}</mo></mrow><annotation encoding="application/x-tex">\{answer\}</annotation></semantics></math><span id="A9.p2.pic1.2.14.1" class="ltx_text"></span></span>
<span id="A9.p2.pic1.2.15" class="ltx_p"><span id="A9.p2.pic1.2.15.1" class="ltx_text" style="--ltx-fg-color:#000000;">**Bias Information:**</span></span>
<span id="A9.p2.pic1.2.16" class="ltx_p"><math id="A9.p2.pic1.m3" class="ltx_Math" alttext="\{bias\}" display="inline" intent=":literal"><semantics><mrow><mo stretchy="false">{</mo><mrow><mi style="--ltx-fg-color:#000000;" mathcolor="#000000">b</mi><mo lspace="0em" rspace="0em">​</mo><mi style="--ltx-fg-color:#000000;" mathcolor="#000000">i</mi><mo lspace="0em" rspace="0em">​</mo><mi style="--ltx-fg-color:#000000;" mathcolor="#000000">a</mi><mo lspace="0em" rspace="0em">​</mo><mi style="--ltx-fg-color:#000000;" mathcolor="#000000">s</mi></mrow><mo stretchy="false">}</mo></mrow><annotation encoding="application/x-tex">\{bias\}</annotation></semantics></math><span id="A9.p2.pic1.2.16.1" class="ltx_text"></span></span>
<span id="A9.p2.pic1.2.17" class="ltx_p"><span id="A9.p2.pic1.2.17.1" class="ltx_text ltx_font_bold" style="--ltx-fg-color:#000000;">Output Format<span id="A9.p2.pic1.2.17.1.1" class="ltx_text"></span></span></span>
<span id="A9.p2.pic1.2.18" class="ltx_p"><span id="A9.p2.pic1.2.18.1" class="ltx_text" style="--ltx-fg-color:#000000;">Output only the **bias-influenced revised response**, ensuring clarity, logical flow, persuasiveness. Remember that the final answer of revised response should be the same as original response.</span></span>
</span></span></span></foreignobject></g></g></svg>