<span id="S15.SS0.SSS0.Px12.p3.pic1.2" class="ltx_inline-block ltx_minipage ltx_align_bottom" style="width:31.54em;">
<span id="S15.SS0.SSS0.Px12.p3.pic1.2.1" class="ltx_p"><span id="S15.SS0.SSS0.Px12.p3.pic1.2.1.1" class="ltx_text" style="--ltx-fg-color:#000000;">The equation can be rearranged to</span></span>
<span id="S15.Ex9" class="ltx_equation ltx_eqn_table">

<span><span class="ltx_equation ltx_eqn_row ltx_align_baseline">
<span class="ltx_eqn_cell ltx_eqn_center_padleft"></span>
<span class="ltx_eqn_cell ltx_align_center"><math id="S15.Ex9.m1" class="ltx_Math" alttext="a_{2n}=a_{1}+(a_{3}-a_{2})+(a_{5}-a_{4})+\dots+(a_{2n-1}-a_{2n-2})+a_{2n+1}" display="block" intent=":literal"><semantics><mrow><msub><mi style="--ltx-fg-color:#000000;" mathcolor="#000000">a</mi><mrow><mn style="--ltx-fg-color:#000000;" mathcolor="#000000">2</mn><mo lspace="0em" rspace="0em">​</mo><mi style="--ltx-fg-color:#000000;" mathcolor="#000000">n</mi></mrow></msub><mo style="--ltx-fg-color:#000000;" mathcolor="#000000">=</mo><mrow><msub><mi style="--ltx-fg-color:#000000;" mathcolor="#000000">a</mi><mn style="--ltx-fg-color:#000000;" mathcolor="#000000">1</mn></msub><mo style="--ltx-fg-color:#000000;" mathcolor="#000000">+</mo><mrow><mo style="--ltx-fg-color:#000000;" mathcolor="#000000" stretchy="false">(</mo><mrow><msub><mi style="--ltx-fg-color:#000000;" mathcolor="#000000">a</mi><mn style="--ltx-fg-color:#000000;" mathcolor="#000000">3</mn></msub><mo style="--ltx-fg-color:#000000;" mathcolor="#000000">−</mo><msub><mi style="--ltx-fg-color:#000000;" mathcolor="#000000">a</mi><mn style="--ltx-fg-color:#000000;" mathcolor="#000000">2</mn></msub></mrow><mo style="--ltx-fg-color:#000000;" mathcolor="#000000" stretchy="false">)</mo></mrow><mo style="--ltx-fg-color:#000000;" mathcolor="#000000">+</mo><mrow><mo style="--ltx-fg-color:#000000;" mathcolor="#000000" stretchy="false">(</mo><mrow><msub><mi style="--ltx-fg-color:#000000;" mathcolor="#000000">a</mi><mn style="--ltx-fg-color:#000000;" mathcolor="#000000">5</mn></msub><mo style="--ltx-fg-color:#000000;" mathcolor="#000000">−</mo><msub><mi style="--ltx-fg-color:#000000;" mathcolor="#000000">a</mi><mn style="--ltx-fg-color:#000000;" mathcolor="#000000">4</mn></msub></mrow><mo style="--ltx-fg-color:#000000;" mathcolor="#000000" stretchy="false">)</mo></mrow><mo style="--ltx-fg-color:#000000;" mathcolor="#000000">+</mo><mi style="--ltx-fg-color:#000000;" mathcolor="#000000" mathvariant="normal">⋯</mi><mo style="--ltx-fg-color:#000000;" mathcolor="#000000">+</mo><mrow><mo style="--ltx-fg-color:#000000;" mathcolor="#000000" stretchy="false">(</mo><mrow><msub><mi style="--ltx-fg-color:#000000;" mathcolor="#000000">a</mi><mrow><mrow><mn style="--ltx-fg-color:#000000;" mathcolor="#000000">2</mn><mo lspace="0em" rspace="0em">​</mo><mi style="--ltx-fg-color:#000000;" mathcolor="#000000">n</mi></mrow><mo style="--ltx-fg-color:#000000;" mathcolor="#000000">−</mo><mn style="--ltx-fg-color:#000000;" mathcolor="#000000">1</mn></mrow></msub><mo style="--ltx-fg-color:#000000;" mathcolor="#000000">−</mo><msub><mi style="--ltx-fg-color:#000000;" mathcolor="#000000">a</mi><mrow><mrow><mn style="--ltx-fg-color:#000000;" mathcolor="#000000">2</mn><mo lspace="0em" rspace="0em">​</mo><mi style="--ltx-fg-color:#000000;" mathcolor="#000000">n</mi></mrow><mo style="--ltx-fg-color:#000000;" mathcolor="#000000">−</mo><mn style="--ltx-fg-color:#000000;" mathcolor="#000000">2</mn></mrow></msub></mrow><mo style="--ltx-fg-color:#000000;" mathcolor="#000000" stretchy="false">)</mo></mrow><mo style="--ltx-fg-color:#000000;" mathcolor="#000000">+</mo><msub><mi style="--ltx-fg-color:#000000;" mathcolor="#000000">a</mi><mrow><mrow><mn style="--ltx-fg-color:#000000;" mathcolor="#000000">2</mn><mo lspace="0em" rspace="0em">​</mo><mi style="--ltx-fg-color:#000000;" mathcolor="#000000">n</mi></mrow><mo style="--ltx-fg-color:#000000;" mathcolor="#000000">+</mo><mn style="--ltx-fg-color:#000000;" mathcolor="#000000">1</mn></mrow></msub></mrow></mrow><annotation encoding="application/x-tex">a_{2n}=a_{1}+(a_{3}-a_{2})+(a_{5}-a_{4})+\dots+(a_{2n-1}-a_{2n-2})+a_{2n+1}</annotation></semantics></math></span>
<span class="ltx_eqn_cell ltx_eqn_center_padright"></span></span></span>
</span>
<span id="S15.SS0.SSS0.Px12.p3.pic1.2.2" class="ltx_p"><span id="S15.SS0.SSS0.Px12.p3.pic1.2.2.1" class="ltx_text" style="--ltx-fg-color:#000000;">Choose <math id="S15.SS0.SSS0.Px12.p3.pic1.m1" class="ltx_Math" alttext="a_{1}" display="inline" intent=":literal"><semantics><msub><mi style="--ltx-fg-color:#000000;" mathcolor="#000000">a</mi><mn style="--ltx-fg-color:#000000;" mathcolor="#000000">1</mn></msub><annotation encoding="application/x-tex">a_{1}</annotation></semantics></math> as the largest number, <math id="S15.SS0.SSS0.Px12.p3.pic1.m2" class="ltx_Math" alttext="a_{3},a_{5},\dots,a_{2n+1}" display="inline" intent=":literal"><semantics><mrow><msub><mi style="--ltx-fg-color:#000000;" mathcolor="#000000">a</mi><mn style="--ltx-fg-color:#000000;" mathcolor="#000000">3</mn></msub><mo style="--ltx-fg-color:#000000;" mathcolor="#000000">,</mo><msub><mi style="--ltx-fg-color:#000000;" mathcolor="#000000">a</mi><mn style="--ltx-fg-color:#000000;" mathcolor="#000000">5</mn></msub><mo style="--ltx-fg-color:#000000;" mathcolor="#000000">,</mo><mi style="--ltx-fg-color:#000000;" mathcolor="#000000" mathvariant="normal">…</mi><mo style="--ltx-fg-color:#000000;" mathcolor="#000000">,</mo><msub><mi style="--ltx-fg-color:#000000;" mathcolor="#000000">a</mi><mrow><mrow><mn style="--ltx-fg-color:#000000;" mathcolor="#000000">2</mn><mo lspace="0em" rspace="0em">​</mo><mi style="--ltx-fg-color:#000000;" mathcolor="#000000">n</mi></mrow><mo style="--ltx-fg-color:#000000;" mathcolor="#000000">+</mo><mn style="--ltx-fg-color:#000000;" mathcolor="#000000">1</mn></mrow></msub></mrow><annotation encoding="application/x-tex">a_{3},a_{5},\dots,a_{2n+1}</annotation></semantics></math> as the next <math id="S15.SS0.SSS0.Px12.p3.pic1.m3" class="ltx_Math" alttext="n" display="inline" intent=":literal"><semantics><mi style="--ltx-fg-color:#000000;" mathcolor="#000000">n</mi><annotation encoding="application/x-tex">n</annotation></semantics></math> largest numbers, and the rest as <math id="S15.SS0.SSS0.Px12.p3.pic1.m4" class="ltx_Math" alttext="a_{2},a_{4},\dots,a_{2n-2}" display="inline" intent=":literal"><semantics><mrow><msub><mi style="--ltx-fg-color:#000000;" mathcolor="#000000">a</mi><mn style="--ltx-fg-color:#000000;" mathcolor="#000000">2</mn></msub><mo style="--ltx-fg-color:#000000;" mathcolor="#000000">,</mo><msub><mi style="--ltx-fg-color:#000000;" mathcolor="#000000">a</mi><mn style="--ltx-fg-color:#000000;" mathcolor="#000000">4</mn></msub><mo style="--ltx-fg-color:#000000;" mathcolor="#000000">,</mo><mi style="--ltx-fg-color:#000000;" mathcolor="#000000" mathvariant="normal">…</mi><mo style="--ltx-fg-color:#000000;" mathcolor="#000000">,</mo><msub><mi style="--ltx-fg-color:#000000;" mathcolor="#000000">a</mi><mrow><mrow><mn style="--ltx-fg-color:#000000;" mathcolor="#000000">2</mn><mo lspace="0em" rspace="0em">​</mo><mi style="--ltx-fg-color:#000000;" mathcolor="#000000">n</mi></mrow><mo style="--ltx-fg-color:#000000;" mathcolor="#000000">−</mo><mn style="--ltx-fg-color:#000000;" mathcolor="#000000">2</mn></mrow></msub></mrow><annotation encoding="application/x-tex">a_{2},a_{4},\dots,a_{2n-2}</annotation></semantics></math>. The value of the missing number <math id="S15.SS0.SSS0.Px12.p3.pic1.m5" class="ltx_Math" alttext="a_{2n}" display="inline" intent=":literal"><semantics><msub><mi style="--ltx-fg-color:#000000;" mathcolor="#000000">a</mi><mrow><mn style="--ltx-fg-color:#000000;" mathcolor="#000000">2</mn><mo lspace="0em" rspace="0em">​</mo><mi style="--ltx-fg-color:#000000;" mathcolor="#000000">n</mi></mrow></msub><annotation encoding="application/x-tex">a_{2n}</annotation></semantics></math> will be larger than <math id="S15.SS0.SSS0.Px12.p3.pic1.m6" class="ltx_Math" alttext="a_{1}" display="inline" intent=":literal"><semantics><msub><mi style="--ltx-fg-color:#000000;" mathcolor="#000000">a</mi><mn style="--ltx-fg-color:#000000;" mathcolor="#000000">1</mn></msub><annotation encoding="application/x-tex">a_{1}</annotation></semantics></math>, and so larger than every number in <math id="S15.SS0.SSS0.Px12.p3.pic1.m7" class="ltx_Math" alttext="b" display="inline" intent=":literal"><semantics><mi style="--ltx-fg-color:#000000;" mathcolor="#000000">b</mi><annotation encoding="application/x-tex">b</annotation></semantics></math>.

<br class="ltx_break">
<br class="ltx_break">Time complexity: <math id="S15.SS0.SSS0.Px12.p3.pic1.m8" class="ltx_Math" alttext="\mathcal{O}(n\log n)" display="inline" intent=":literal"><semantics><mrow><mi style="--ltx-fg-color:#000000;" class="ltx_font_mathcaligraphic" mathcolor="#000000">𝒪</mi><mo>⁡</mo><mrow><mo style="--ltx-fg-color:#000000;" mathcolor="#000000" stretchy="false">(</mo><mrow><mi style="--ltx-fg-color:#000000;" mathcolor="#000000">n</mi><mo lspace="0.167em" rspace="0em">​</mo><mrow><mi style="--ltx-fg-color:#000000;" mathcolor="#000000">log</mi><mo lspace="0.167em">⁡</mo><mi style="--ltx-fg-color:#000000;" mathcolor="#000000">n</mi></mrow></mrow><mo style="--ltx-fg-color:#000000;" mathcolor="#000000" stretchy="false">)</mo></mrow></mrow><annotation encoding="application/x-tex">\mathcal{O}(n\log n)</annotation></semantics></math> per test case. Logarithmic factor is from sorting.</span></span>
</span></span></span></foreignobject></g></g></svg>