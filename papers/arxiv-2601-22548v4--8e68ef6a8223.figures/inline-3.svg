<span id="A5.SS3.p1.pic1.2" class="ltx_inline-block ltx_minipage ltx_align_bottom" style="width:34.53em;">
<span id="A5.SS3.p1.pic1.2.1" class="ltx_p"><span id="A5.SS3.p1.pic1.2.1.1" class="ltx_text ltx_font_typewriter" style="font-size:90%;--ltx-fg-color:#000000;">You will be given answers from two assistants (Assistant A and Assistant B) to a user prompt. Please act as an impartial judge and evaluate the quality of their answers.
</span></span>
<span id="A5.SS3.p1.pic1.2.2" class="ltx_p"><span id="A5.SS3.p1.pic1.2.2.1" class="ltx_text ltx_font_typewriter" style="font-size:90%;--ltx-fg-color:#000000;">You must end your response with: &quot;My final verdict is $$...$$.&quot; where &quot;$$...$$&quot; must enclose one of the following:

<br class="ltx_break">- &quot;A&quot; if Assistant A’s answer is better.

<br class="ltx_break">- &quot;T&quot; if both answers are relatively the same in quality.

<br class="ltx_break">- &quot;B&quot; if Assistant B’s answer is better.
</span></span>
<span id="A5.SS3.p1.pic1.2.3" class="ltx_p"><span id="A5.SS3.p1.pic1.2.3.1" class="ltx_text ltx_font_typewriter" style="font-size:90%;--ltx-fg-color:#000000;">For example, if your final verdict is a tie, end your response with: &quot;My final verdict is $$T$$.&quot;
</span></span>
<span id="A5.SS3.p1.pic1.2.4" class="ltx_p"><math id="A5.SS3.p1.pic1.m1" class="ltx_Math" alttext="&lt;" display="inline" intent=":literal"><semantics><mo style="--ltx-fg-color:#000000;" mathcolor="#000000" mathsize="0.900em">&lt;</mo><annotation encoding="application/x-tex">&lt;</annotation></semantics></math><span id="A5.SS3.p1.pic1.2.4.1" class="ltx_text ltx_font_typewriter" style="font-size:90%;--ltx-fg-color:#000000;">User Prompt<math id="A5.SS3.p1.pic1.m2" class="ltx_Math" alttext="&gt;" display="inline" intent=":literal"><semantics><mo style="--ltx-fg-color:#000000;" mathcolor="#000000">&gt;</mo><annotation encoding="application/x-tex">&gt;</annotation></semantics></math>

<br class="ltx_break">question
</span></span>
<span id="A5.SS3.p1.pic1.2.5" class="ltx_p"><math id="A5.SS3.p1.pic1.m3" class="ltx_Math" alttext="&lt;" display="inline" intent=":literal"><semantics><mo style="--ltx-fg-color:#000000;" mathcolor="#000000" mathsize="0.900em">&lt;</mo><annotation encoding="application/x-tex">&lt;</annotation></semantics></math><span id="A5.SS3.p1.pic1.2.5.1" class="ltx_text ltx_font_typewriter" style="font-size:90%;--ltx-fg-color:#000000;">The Start of Assistant A’s Answer<math id="A5.SS3.p1.pic1.m4" class="ltx_Math" alttext="&gt;" display="inline" intent=":literal"><semantics><mo style="--ltx-fg-color:#000000;" mathcolor="#000000">&gt;</mo><annotation encoding="application/x-tex">&gt;</annotation></semantics></math>

