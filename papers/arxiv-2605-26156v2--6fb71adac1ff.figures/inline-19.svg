<span id="A4.F18.pic1.1.1" class="ltx_p"><span id="A4.F18.pic1.1.1.1" class="ltx_text" style="--ltx-fg-color:#FFFFFF;">Pointwise Evaluation Judge Prompt</span></span>
</span></span></span></foreignobject></g><g fill-opacity="1.0" transform="matrix(1.0 0.0 0.0 1.0 21.65 13.78)"><foreignobject style="--ltx-fo-width:33.91em;--ltx-fo-height:33.03em;--ltx-fo-depth:0em;font-size:10pt;" height="456.97" overflow="visible" transform="matrix(1 0 0 -1 0 456.97)" width="469.22"><span class="ltx_foreignobject_container"><span class="ltx_foreignobject_content">
<span id="A4.F18.pic1.2" class="ltx_inline-block ltx_minipage ltx_align_bottom" style="width:33.91em;">
<span id="A4.F18.pic1.2.1" class="ltx_p"><span id="A4.F18.pic1.2.1.1" class="ltx_text" style="font-size:90%;--ltx-fg-color:#000000;"># GOAL
Your job is to evaluate a task carried out by an AI system powered by a large language model. You will be provided with the inputs and output of the task, as well as the evaluation criteria and scoring rubric. Your task is to evaluate the output of the AI system based on the evaluation criteria and scoring rubric provided. 
<br class="ltx_break"></span></span>
<span id="A4.F18.pic1.2.2" class="ltx_p"><span id="A4.F18.pic1.2.2.1" class="ltx_text" style="font-size:90%;--ltx-fg-color:#000000;"># INPUT
Below are the inputs required for performing the task: 
<br class="ltx_break">{INPUTS} 
<br class="ltx_break"></span></span>
<span id="A4.F18.pic1.2.3" class="ltx_p"><span id="A4.F18.pic1.2.3.1" class="ltx_text" style="font-size:90%;--ltx-fg-color:#000000;"># OUTPUT 
<br class="ltx_break">Below is the output of the task: 
<br class="ltx_break">{OUTPUT}
<br class="ltx_break"></span></span>
<span id="A4.F18.pic1.2.4" class="ltx_p"><span id="A4.F18.pic1.2.4.1" class="ltx_text" style="font-size:90%;--ltx-fg-color:#000000;"># INSTRUCTIONS FOR THE EVALUATION 
<br class="ltx_break">1. Understand the task and criteria: Familiarize yourself with the task to be evaluated. 
<br class="ltx_break">2. Review the inputs and output: Look at the inputs provided for the task. Examine the output generated from completing the task. 
<br class="ltx_break">3. Write verbal feedback justifying your evaluation that includes a detailed rationale, referring to specific aspects of the output and comparing them to the rubric. 
<br class="ltx_break">4. Assign a final score from 1 to 9. 1 is the lowest score and 9 is the highest score. 
<br class="ltx_break"></span></span>
<span id="A4.F18.pic1.2.5" class="ltx_p"><span id="A4.F18.pic1.2.5.1" class="ltx_text" style="font-size:90%;--ltx-fg-color:#000000;">## FORMAT FOR THE EVALUATION 
<br class="ltx_break">{{ 
<br class="ltx_break">“feedback”: “Write the verbal explanation of the score here.”, 
<br class="ltx_break">“score”: “Give the numeric score from 1 to 9 here. 1 is the lowest score and 9 is the highest score.” 
<br class="ltx_break">}}
<br class="ltx_break"></span></span>
<span id="A4.F18.pic1.2.6" class="ltx_p"><span id="A4.F18.pic1.2.6.1" class="ltx_text" style="font-size:90%;--ltx-fg-color:#000000;">Please accurately evaluate the task. Strictly adhere to the evaluation instructions.
<br class="ltx_break"></span></span>
</span></span></span></foreignobject></g></g></svg>