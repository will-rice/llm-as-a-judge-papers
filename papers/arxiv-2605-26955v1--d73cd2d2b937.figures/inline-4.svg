<svg id="A3.SS4.p1.pic1" class="ltx_picture" height="1021.87" overflow="visible" version="1.1" viewbox="0 0 477.38 1021.87" width="477.38"><g style="--ltx-stroke-color:#000000;--ltx-fill-color:#000000;" fill="#000000" stroke="#000000" stroke-width="0.4pt" transform="translate(0,1021.87) matrix(1 0 0 -1 0 0)"><g style="--ltx-fill-color:#404040;" fill="#404040" fill-opacity="1.0"><path style="stroke:none" d="M 0 5.91 L 0 1015.96 C 0 1019.22 2.64 1021.87 5.91 1021.87 L 471.47 1021.87 C 474.73 1021.87 477.38 1019.22 477.38 1015.96 L 477.38 5.91 C 477.38 2.64 474.73 0 471.47 0 L 5.91 0 C 2.64 0 0 2.64 0 5.91 Z" /></g><g style="--ltx-fill-color:#FFFFFF;" fill="#FFFFFF" fill-opacity="1.0"><path style="stroke:none" d="M 1.97 5.91 L 1.97 997.87 L 475.41 997.87 L 475.41 5.91 C 475.41 3.73 473.65 1.97 471.47 1.97 L 5.91 1.97 C 3.73 1.97 1.97 3.73 1.97 5.91 Z" /></g><g fill-opacity="1.0" transform="matrix(1.0 0.0 0.0 1.0 7.29 1006.47)"><foreignobject style="--ltx-fo-width:29.09em;--ltx-fo-height:0.69em;--ltx-fo-depth:0.19em;font-size:10pt;" height="12.18" overflow="visible" transform="matrix(1 0 0 -1 0 9.49)" width="402.52"><span class="ltx_foreignobject_container"><span class="ltx_foreignobject_content">
<span id="A3.SS4.p1.pic1.1" class="ltx_inline-block ltx_minipage ltx_align_bottom" style="width:29.09em;">
<span id="A3.SS4.p1.pic1.1.1" class="ltx_p"><span id="A3.SS4.p1.pic1.1.1.1" class="ltx_text ltx_font_bold" style="--ltx-fg-color:#FFFFFF;">Prompt</span></span>
</span></span></span></foreignobject></g><g fill-opacity="1.0" transform="matrix(1.0 0.0 0.0 1.0 7.29 10.4)"><foreignobject style="--ltx-fo-width:35.4em;--ltx-fo-height:70.98em;--ltx-fo-depth:0.23em;font-size:10pt;" height="985.28" overflow="visible" transform="matrix(1 0 0 -1 0 982.16)" width="489.84"><span class="ltx_foreignobject_container"><span class="ltx_foreignobject_content">
<span id="A3.SS4.p1.pic1.2" class="ltx_inline-block ltx_minipage ltx_align_bottom" style="width:35.4em;">
<span id="A3.SS4.p1.pic1.2.1" class="ltx_p"><span id="A3.SS4.p1.pic1.2.1.1" class="ltx_text ltx_font_typewriter" style="font-size:90%;--ltx-fg-color:#000000;">Your task is to refine raw LLM-generated annotations into high-quality, standardized data points for an error-detection dataset.

<br class="ltx_break">An LLM initially evaluated another LLM’s response to a specific query to detect errors. It provided a raw error span and an explanation of the error.

<br class="ltx_break">Human validators then reviewed these initial annotations and optionally provided comments.

<br class="ltx_break">If a human validator comment is present, give it priority, as it reflects human oversight over the initial LLM evaluation.

<br class="ltx_break">
<br class="ltx_break">### Objective

<br class="ltx_break">
<br class="ltx_break">Synthesize the provided inputs and generate a final, polished ‘refined_error_span’ and ‘refined_explanation’.

<br class="ltx_break">
<br class="ltx_break">### Input Data
</span></span>
<span id="A3.I4" class="ltx_itemize" style="--ltx-enum-leftmargin:2em;">
<span id="A3.I4.i1" class="ltx_item" style="list-style-type:none;"><span class="ltx_tag ltx_tag_item">-</span> 
<span id="A3.I4.i1.p1" class="ltx_para">
<span id="A3.I4.i1.p1.1" class="ltx_p"><span id="A3.I4.i1.p1.1.1" class="ltx_text ltx_font_typewriter" style="font-size:90%;--ltx-fg-color:#000000;">**Query:** {query}
</span></span>
</span></span>
<span id="A3.I4.i2" class="ltx_item" style="list-style-type:none;"><span class="ltx_tag ltx_tag_item">-</span> 
<span id="A3.I4.i2.p1" class="ltx_para">
<span id="A3.I4.i2.p1.1" class="ltx_p"><span id="A3.I4.i2.p1.1.1" class="ltx_text ltx_font_typewriter" style="font-size:90%;--ltx-fg-color:#000000;">**LLM Response:** {response}
</span></span>
</span></span>
<span id="A3.I4.i3" class="ltx_item" style="list-style-type:none;"><span class="ltx_tag ltx_tag_item">-</span> 
<span id="A3.I4.i3.p1" class="ltx_para">
<span id="A3.I4.i3.p1.1" class="ltx_p"><span id="A3.I4.i3.p1.1.1" class="ltx_text ltx_font_typewriter" style="font-size:90%;--ltx-fg-color:#000000;">**Raw Error Span:** {span}
</span></span>
</span></span>
<span id="A3.I4.i4" class="ltx_item" style="list-style-type:none;"><span class="ltx_tag ltx_tag_item">-</span> 
<span id="A3.I4.i4.p1" class="ltx_para">
<span id="A3.I4.i4.p1.1" class="ltx_p"><span id="A3.I4.i4.p1.1.1" class="ltx_text ltx_font_typewriter" style="font-size:90%;--ltx-fg-color:#000000;">**Raw Explanation:** {explanation}
</span></span>
</span></span>
<span id="A3.I4.i5" class="ltx_item" style="list-style-type:none;"><span class="ltx_tag ltx_tag_item">-</span> 
<span id="A3.I4.i5.p1" class="ltx_para">
<span id="A3.I4.i5.p1.1" class="ltx_p"><span id="A3.I4.i5.p1.1.1" class="ltx_text ltx_font_typewriter" style="font-size:90%;--ltx-fg-color:#000000;">**Validator Comment:** {validation_comment}
</span></span>
</span></span>
</span>
<span id="A3.SS4.p1.pic1.2.2" class="ltx_p"><span id="A3.SS4.p1.pic1.2.2.1" class="ltx_text ltx_font_typewriter" style="font-size:90%;--ltx-fg-color:#000000;">### Refinement Guidelines

<br class="ltx_break"></span></span>
<span id="A3.I5" class="ltx_enumerate" style="--ltx-enum-leftmargin:2em;">
<span id="A3.I5.i1" class="ltx_item" style="list-style-type:none;"><span class="ltx_tag ltx_tag_item">1.</span> 
<span id="A3.I5.i1.p1" class="ltx_para">
<span id="A3.I5.i1.p1.1" class="ltx_p"><span id="A3.I5.i1.p1.1.1" class="ltx_text ltx_font_typewriter" style="font-size:90%;--ltx-fg-color:#000000;">**Exact Span Extraction:** The ‘refined_error_span’ MUST be an exact, continuous substring extracted directly from the ‘‘LLM Response’’. Refine the boundaries of the ‘‘Raw Error Span’’ to include necessary context or remove trailing/irrelevant words, but do not modify the text itself. Ensure the span is concise; avoid including excessive surrounding text that is not directly part of the error.
</span></span>
</span></span>
<span id="A3.I5.i2" class="ltx_item" style="list-style-type:none;"><span class="ltx_tag ltx_tag_item">2.</span> 
<span id="A3.I5.i2.p1" class="ltx_para">
<span id="A3.I5.i2.p1.1" class="ltx_p"><span id="A3.I5.i2.p1.1.1" class="ltx_text ltx_font_typewriter" style="font-size:90%;--ltx-fg-color:#000000;">**Prioritize Human Validator Feedback:** If a ‘‘Validator Comment’’ exists, use it as your primary guide. Incorporate human validators’ insights to resolve any disagreements, correct initial mistakes, or add nuanced context to appropriately adjust the ‘refined_error_span’ and ‘refined_explanation’. In cases where the Validator Comment indicates that the detected span is not actually an error, set the value of ‘refined_error_span’ to ‘null’ and provide a brief justification in the ‘refined_explanation’.
</span></span>
</span></span>
<span id="A3.I5.i3" class="ltx_item" style="list-style-type:none;"><span class="ltx_tag ltx_tag_item">3.</span> 
<span id="A3.I5.i3.p1" class="ltx_para">
<span id="A3.I5.i3.p1.1" class="ltx_p"><span id="A3.I5.i3.p1.1.1" class="ltx_text ltx_font_typewriter" style="font-size:90%;--ltx-fg-color:#000000;">**Language Profile (English as Matrix Language):** Write the ‘refined_explanation’ in English. You may also use code-switched text where English acts as the matrix (base) language, embedding specific expressions, words, or idioms from the original language of the text. Use this code-switching if retaining the original terms helps explain the error more accurately or naturally.
</span></span>
</span></span>
<span id="A3.I5.i4" class="ltx_item" style="list-style-type:none;"><span class="ltx_tag ltx_tag_item">4.</span> 
<span id="A3.I5.i4.p1" class="ltx_para">
<span id="A3.I5.i4.p1.1" class="ltx_p"><span id="A3.I5.i4.p1.1.1" class="ltx_text ltx_font_typewriter" style="font-size:90%;--ltx-fg-color:#000000;">**Use Raw Explanation When Appropriate:** If there is no ‘‘Validator Comment’’ and the ‘‘Raw Explanation’’ is already clear, well-written, and meets the Language Profile guidelines, use the original ‘‘Raw Explanation’’ as the ‘refined_explanation’ without unnecessary modifications.
</span></span>
</span></span>
</span>
<span id="A3.SS4.p1.pic1.2.3" class="ltx_p"><span id="A3.SS4.p1.pic1.2.3.1" class="ltx_text ltx_font_typewriter" style="font-size:90%;--ltx-fg-color:#000000;">### Output Format

<br class="ltx_break">
<br class="ltx_break">Provide your output strictly in the following JSON format without any markdown blocks or additional text:

<br class="ltx_break">{

<br class="ltx_break">‘‘refined_error_span’’: ‘‘The exact erroneous substring from the LLM Response’’ or null,

<br class="ltx_break">‘‘refined_explanation’’: ‘‘A clear and polished explanation of why the span is erroneous’’

<br class="ltx_break">}
</span></span>
</span></span></span></foreignobject></g></g></svg>