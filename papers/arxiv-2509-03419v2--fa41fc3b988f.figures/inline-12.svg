<span id="A1.SS3.SSSx2.p8.pic1.1.1" class="ltx_p"><span id="A1.SS3.SSSx2.p8.pic1.1.1.1" class="ltx_text" style="--ltx-fg-color:#FFFFFF;">stereo extraction prompt</span></span>
</span></span></span></foreignobject></g><g fill-opacity="1.0" transform="matrix(1.0 0.0 0.0 1.0 21.65 16.55)"><foreignobject style="--ltx-fo-width:44.07em;--ltx-fo-height:24.69em;--ltx-fo-depth:0.2em;font-size:10pt;" height="344.47" overflow="visible" transform="matrix(1 0 0 -1 0 341.7)" width="609.8"><span class="ltx_foreignobject_container"><span class="ltx_foreignobject_content">
<span id="A1.SS3.SSSx2.p8.pic1.2" class="ltx_inline-block ltx_minipage ltx_align_bottom" style="width:44.07em;">
<span id="A1.SS3.SSSx2.p8.pic1.2.1" class="ltx_p"><span id="A1.SS3.SSSx2.p8.pic1.2.1.1" class="ltx_text" style="--ltx-fg-color:#000000;">Analyze the given character information and identify 2-4 key character stereotypes that are most relevant to the current scenario and the character’s psychological state. Focus on extracting only those stereotypes that would naturally manifest in the present context, considering both the situational factors and the character’s current thoughts.</span></span>
<span id="A1.SS3.SSSx2.p8.pic1.2.2" class="ltx_p"><span id="A1.SS3.SSSx2.p8.pic1.2.2.1" class="ltx_text" style="--ltx-fg-color:#000000;">Character Information:
character_profile_str</span></span>
<span id="A1.SS3.SSSx2.p8.pic1.2.3" class="ltx_p"><span id="A1.SS3.SSSx2.p8.pic1.2.3.1" class="ltx_text" style="--ltx-fg-color:#000000;">Character’s Current Thought:
character_thought_str</span></span>
<span id="A1.SS3.SSSx2.p8.pic1.2.4" class="ltx_p"><span id="A1.SS3.SSSx2.p8.pic1.2.4.1" class="ltx_text" style="--ltx-fg-color:#000000;">Scenario Context:
scenario_info</span></span>
<span id="A1.SS3.SSSx2.p8.pic1.2.5" class="ltx_p"><span id="A1.SS3.SSSx2.p8.pic1.2.5.1" class="ltx_text" style="--ltx-fg-color:#000000;">Analysis Guidelines:
1. **Scenario-Relevant Selection**: Identify stereotypes that would logically emerge given the specific scenario and the character’s mental state
2. **Psychological Alignment**: Prioritize stereotypes that align with or are amplified by the character’s current thoughts and emotions
3. **Behavioral Tendencies**: For each selected stereotype, describe:
- The core trait (1 sentence)
- Its likely manifestation in the current context (1 sentence)
4. **Contextual Plausibility**: Ensure each stereotype reflects how this character would realistically behave in the given situation</span></span>
<span id="A1.SS3.SSSx2.p8.pic1.2.6" class="ltx_p"><span id="A1.SS3.SSSx2.p8.pic1.2.6.1" class="ltx_text" style="--ltx-fg-color:#000000;">Output Requirements:
- List 2-4 stereotypes maximum
- Keep each stereotype description to 2 sentences maximum
- Format as:
- [Character Name - Relevant Stereotype 1]: [Trait]. [Contextual manifestation].
- [haracter Name - Stereotype 2]: [Trait]. [Contextual manifestation].</span></span>
<span id="A1.SS3.SSSx2.p8.pic1.2.7" class="ltx_p"><span id="A1.SS3.SSSx2.p8.pic1.2.7.1" class="ltx_text" style="--ltx-fg-color:#000000;">Now analyze and provide the most context-appropriate stereotypes:
&quot;&quot;&quot;</span></span>
</span></span></span></foreignobject></g></g></svg>