<span id="A1.I6" class="ltx_itemize">
<span id="A1.I6.i1" class="ltx_item" style="list-style-type:none;"><span class="ltx_tag ltx_tag_item">•</span> 
<span id="A1.I6.i1.p1" class="ltx_para">
<span id="A1.I6.i1.p1.1" class="ltx_p"><span id="A1.I6.i1.p1.1.1" class="ltx_text" style="font-size:90%;--ltx-fg-color:#000000;">“Maintain a running counter for each required element and stop when the target count is reached.”  </span><math id="A1.I6.i1.p1.m1" class="ltx_Math" alttext="\leftarrow" display="inline" intent=":literal"><semantics><mo style="--ltx-fg-color:#000000;" mathcolor="#000000" mathsize="0.900em" stretchy="false">←</mo><annotation encoding="application/x-tex">\leftarrow</annotation></semantics></math><span id="A1.I6.i1.p1.1.2" class="ltx_text" style="font-size:90%;--ltx-fg-color:#000000;"> </span><span id="A1.I6.i1.p1.1.3" class="ltx_text ltx_font_italic" style="font-size:90%;--ltx-fg-color:#000000;">model cannot execute</span></span>
</span></span>
<span id="A1.I6.i2" class="ltx_item" style="list-style-type:none;"><span class="ltx_tag ltx_tag_item">•</span> 
<span id="A1.I6.i2.p1" class="ltx_para">
<span id="A1.I6.i2.p1.1" class="ltx_p"><span id="A1.I6.i2.p1.1.1" class="ltx_text" style="font-size:90%;--ltx-fg-color:#000000;">“Programmatically verify the position of each token; if the count is wrong, rewrite until satisfied.”  </span><math id="A1.I6.i2.p1.m1" class="ltx_Math" alttext="\leftarrow" display="inline" intent=":literal"><semantics><mo style="--ltx-fg-color:#000000;" mathcolor="#000000" mathsize="0.900em" stretchy="false">←</mo><annotation encoding="application/x-tex">\leftarrow</annotation></semantics></math><span id="A1.I6.i2.p1.1.2" class="ltx_text" style="font-size:90%;--ltx-fg-color:#000000;"> </span><span id="A1.I6.i2.p1.1.3" class="ltx_text ltx_font_italic" style="font-size:90%;--ltx-fg-color:#000000;">requires self-verification loop</span></span>
</span></span>
<span id="A1.I6.i3" class="ltx_item" style="list-style-type:none;"><span class="ltx_tag ltx_tag_item">•</span> 
<span id="A1.I6.i3.p1" class="ltx_para">
<span id="A1.I6.i3.p1.1" class="ltx_p"><span id="A1.I6.i3.p1.1.1" class="ltx_text" style="font-size:90%;--ltx-fg-color:#000000;">“Construct a structural outline and reference it when placing required words.”  </span><math id="A1.I6.i3.p1.m1" class="ltx_Math" alttext="\leftarrow" display="inline" intent=":literal"><semantics><mo style="--ltx-fg-color:#000000;" mathcolor="#000000" mathsize="0.900em" stretchy="false">←</mo><annotation encoding="application/x-tex">\leftarrow</annotation></semantics></math><span id="A1.I6.i3.p1.1.2" class="ltx_text" style="font-size:90%;--ltx-fg-color:#000000;"> </span><span id="A1.I6.i3.p1.1.3" class="ltx_text ltx_font_italic" style="font-size:90%;--ltx-fg-color:#000000;">implicit reasoning, not enforced</span></span>
