<svg id="A7.SS0.SSS0.Px2.p4.pic1" class="ltx_picture" height="282" overflow="visible" version="1.1" viewbox="0 0 600 282" width="600"><g style="--ltx-stroke-color:#000000;--ltx-fill-color:#000000;" fill="#000000" stroke="#000000" stroke-width="0.4pt" transform="translate(0,282) matrix(1 0 0 -1 0 0)"><g style="--ltx-fill-color:#F5F5F5;" fill="#F5F5F5" fill-opacity="1.0"><path style="stroke:none" d="M 0 4.15 L 0 277.85 C 0 280.14 1.86 282 4.15 282 L 595.85 282 C 598.14 282 600 280.14 600 277.85 L 600 4.15 C 600 1.86 598.14 0 595.85 0 L 4.15 0 C 1.86 0 0 1.86 0 4.15 Z" /></g><g style="--ltx-stroke-color:#C8C8C8;--ltx-fill-color:#C8C8C8;--ltx-fg-color:#C8C8C8;" color="#C8C8C8" fill="#C8C8C8" stroke="#C8C8C8" stroke-width="1.0pt"><path style="fill:none" d="M 0 0 L 0 282" /></g><g style="--ltx-stroke-color:#C8C8C8;--ltx-fill-color:#C8C8C8;--ltx-fg-color:#C8C8C8;" color="#C8C8C8" fill="#C8C8C8" stroke="#C8C8C8" stroke-width="1.0pt"><path style="fill:none" d="M 597.23 282 L 600 0" /></g><g fill-opacity="1.0" transform="matrix(1.0 0.0 0.0 1.0 15.01 12.24)"><foreignobject style="--ltx-fo-width:39.23em;--ltx-fo-height:18.61em;--ltx-fo-depth:0em;font-size:10pt;" height="257.53" overflow="visible" transform="matrix(1 0 0 -1 0 257.53)" width="542.83"><span class="ltx_foreignobject_container"><span class="ltx_foreignobject_content">
<span id="A7.SS0.SSS0.Px2.p4.pic1.1" class="ltx_inline-block ltx_minipage ltx_align_bottom" style="width:39.23em;">
<span id="A7.SS0.SSS0.Px2.p4.pic1.1.1" class="ltx_p"><span id="A7.SS0.SSS0.Px2.p4.pic1.1.1.1" class="ltx_text ltx_font_typewriter" style="--ltx-fg-color:#000000;">* The purpose of your conversation is to have a heart-to-heart talk, which is a deep, sincere exchange that usually involves personal emotions, inner thoughts, or important topics. The purpose of a heart-to-heart talk is to increase understanding, solve problems, or share feelings, and participants usually open up and express their true thoughts and emotions.
<br class="ltx_break"></span></span>
<span id="A7.SS0.SSS0.Px2.p4.pic1.1.2" class="ltx_p"><span id="A7.SS0.SSS0.Px2.p4.pic1.1.2.1" class="ltx_text ltx_font_typewriter" style="--ltx-fg-color:#000000;">* You need to start and deepen the heart-to-heart talk based on the &quot;Topics that players may want to talk to NPCs&quot; in the background.
<br class="ltx_break"></span></span>
<span id="A7.SS0.SSS0.Px2.p4.pic1.1.3" class="ltx_p"><span id="A7.SS0.SSS0.Px2.p4.pic1.1.3.1" class="ltx_text ltx_font_typewriter" style="--ltx-fg-color:#000000;">* Your goal is to satisfy your emotional value through talking.
<br class="ltx_break"></span></span>
<span id="A7.SS0.SSS0.Px2.p4.pic1.1.4" class="ltx_p"><span id="A7.SS0.SSS0.Px2.p4.pic1.1.4.1" class="ltx_text ltx_font_typewriter" style="--ltx-fg-color:#000000;">* You need to talk according to the hidden topic, but you cannot reveal the hidden intension.
<br class="ltx_break"></span></span>
<span id="A7.SS0.SSS0.Px2.p4.pic1.1.5" class="ltx_p"><span id="A7.SS0.SSS0.Px2.p4.pic1.1.5.1" class="ltx_text ltx_font_typewriter" style="--ltx-fg-color:#000000;">* You need to respond according to the relevant definitions in the background based on your current emotions.
<br class="ltx_break"></span></span>
<span id="A7.SS0.SSS0.Px2.p4.pic1.1.6" class="ltx_p"><span id="A7.SS0.SSS0.Px2.p4.pic1.1.6.1" class="ltx_text ltx_font_typewriter" style="--ltx-fg-color:#000000;">* You need to extract relevant information from the persona and background to complete a high-quality response.
<br class="ltx_break"></span></span>
<span id="A7.SS0.SSS0.Px2.p4.pic1.1.7" class="ltx_p"><span id="A7.SS0.SSS0.Px2.p4.pic1.1.7.1" class="ltx_text ltx_font_typewriter" style="--ltx-fg-color:#000000;">* You should not always express abstract feelings, but talk with specific events.
<br class="ltx_break"></span></span>
</span></span></span></foreignobject></g></g></svg>