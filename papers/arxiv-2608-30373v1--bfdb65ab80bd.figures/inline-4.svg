<span id="A1.SS1.p4.pic1.2" class="ltx_inline-block ltx_minipage ltx_align_bottom" style="width:43.78em;">
<span id="A1.SS1.p4.pic1.2.1" class="ltx_p"><span id="A1.SS1.p4.pic1.2.1.1" class="ltx_text ltx_verbatim ltx_font_typewriter ltx_inline-block" style="width:459.7pt;--ltx-fg-color:#000000;"><span id="A1.SS1.p4.pic1.2.1.1.1" class="ltx_inline-logical-block ltx_parbox ltx_align_top" style="width:459.7pt;">
<span id="A1.SS1.p4.pic1.p1" class="ltx_para ltx_noindent">
<span id="A1.SS1.p4.pic1.p1.1" class="ltx_p">[Score Rubric]</span>
</span></span></span></span>
<span id="A1.SS1.p4.pic1.2.2" class="ltx_p" style="width:459.7pt;"><span id="A1.SS1.p4.pic1.2.2.1" class="ltx_text ltx_verbatim ltx_font_typewriter ltx_inline-block" style="width:459.7pt;--ltx-fg-color:#000000;"><span id="A1.SS1.p4.pic1.2.2.1.1" class="ltx_text ltx_inline-block" style="width:0.0pt;"> </span><span id="A1.SS1.p4.pic1.2.2.1.2" class="ltx_inline-logical-block ltx_parbox ltx_align_top" style="width:459.7pt;">
<span id="A1.SS1.p4.pic1.p2" class="ltx_para ltx_noindent">
<span id="A1.SS1.p4.pic1.p2.1" class="ltx_p">5: Excellent. There are almost no flaws, and specific strengths evident in essay_text are clear.</span>
</span></span></span></span>
<span id="A1.SS1.p4.pic1.2.3" class="ltx_p" style="width:459.7pt;"><span id="A1.SS1.p4.pic1.2.3.1" class="ltx_text ltx_verbatim ltx_font_typewriter ltx_inline-block" style="width:459.7pt;--ltx-fg-color:#000000;"><span id="A1.SS1.p4.pic1.2.3.1.1" class="ltx_inline-logical-block ltx_parbox ltx_align_top" style="width:459.7pt;">
<span id="A1.SS1.p4.pic1.p3" class="ltx_para ltx_noindent">
<span id="A1.SS1.p4.pic1.p3.1" class="ltx_p">4: Good. There are minor weaknesses, but the criterion is generally well satisfied.</span>
</span></span></span></span>
<span id="A1.SS1.p4.pic1.2.4" class="ltx_p" style="width:459.7pt;"><span id="A1.SS1.p4.pic1.2.4.1" class="ltx_text ltx_verbatim ltx_font_typewriter ltx_inline-block" style="width:459.7pt;--ltx-fg-color:#000000;"><span id="A1.SS1.p4.pic1.2.4.1.1" class="ltx_text ltx_inline-block" style="width:0.0pt;"> </span><span id="A1.SS1.p4.pic1.2.4.1.2" class="ltx_inline-logical-block ltx_parbox ltx_align_top" style="width:459.7pt;">
<span id="A1.SS1.p4.pic1.p4" class="ltx_para ltx_noindent">
<span id="A1.SS1.p4.pic1.p4.1" class="ltx_p">3: Average. There are both strengths and weaknesses, and the criterion is partially satisfied.</span>
</span></span></span></span>
<span id="A1.SS1.p4.pic1.2.5" class="ltx_p" style="width:459.7pt;"><span id="A1.SS1.p4.pic1.2.5.1" class="ltx_text ltx_verbatim ltx_font_typewriter ltx_inline-block" style="width:459.7pt;--ltx-fg-color:#000000;"><span id="A1.SS1.p4.pic1.2.5.1.1" class="ltx_inline-logical-block ltx_parbox ltx_align_top" style="width:459.7pt;">
<span id="A1.SS1.p4.pic1.p5" class="ltx_para ltx_noindent">
<span id="A1.SS1.p4.pic1.p5.1" class="ltx_p">2: Poor. Major flaws limit satisfaction of the criterion.</span>
</span></span></span></span>
<span id="A1.SS1.p4.pic1.2.6" class="ltx_p" style="width:459.7pt;"><span id="A1.SS1.p4.pic1.2.6.1" class="ltx_text ltx_verbatim ltx_font_typewriter ltx_inline-block" style="width:459.7pt;--ltx-fg-color:#000000;"><span id="A1.SS1.p4.pic1.2.6.1.1" class="ltx_inline-logical-block ltx_parbox ltx_align_top" style="width:459.7pt;">
<span id="A1.SS1.p4.pic1.p6" class="ltx_para ltx_noindent">
<span id="A1.SS1.p4.pic1.p6.1" class="ltx_p">1: Very poor. The criterion is barely satisfied, or there are severe flaws.</span>
</span></span></span></span>
</span></span></span></foreignobject></g></g></svg>