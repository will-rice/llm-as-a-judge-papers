<span id="S4.SS3.p5.pic1.1" class="ltx_inline-block ltx_minipage ltx_align_bottom" style="width:32.42em;">
<span id="S4.SS3.p5.pic1.1.1" class="ltx_p"><span id="S4.SS3.p5.pic1.1.1.1" class="ltx_text ltx_font_bold" style="--ltx-fg-color:#000000;">Answering RQ2:<span id="S4.SS3.p5.pic1.1.1.1.1" class="ltx_text ltx_font_medium"> The configuration of backbone LLMs, prompting strategy, and decoding temperature exhibit significant and non-linear impacts on correlation and cost. The optimal prompting strategy (especially FSL and CoT) shows a performance inversion across LLMs’scale, while lower temperatures generally benefit the correlation of large-scale LLMs.</span></span></span>
