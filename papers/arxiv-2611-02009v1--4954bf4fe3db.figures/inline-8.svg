<span id="A3.SS2.SSS2.p1.pic1.1" class="ltx_inline-block ltx_minipage ltx_align_bottom" style="width:39.77em;">
<span id="A3.SS2.SSS2.p1.pic1.1.1" class="ltx_p"><span id="A3.SS2.SSS2.p1.pic1.1.1.1" class="ltx_text ltx_font_bold" style="--ltx-fg-color:#FFFFFF;">Prompt for Contextualized Comment Translation</span></span>
</span></span></span></foreignobject></g><g fill-opacity="1.0" transform="matrix(1.0 0.0 0.0 1.0 10.16 13.24)"><foreignobject style="--ltx-fo-width:43.55em;--ltx-fo-height:23.41em;--ltx-fo-depth:0.22em;font-size:10pt;" height="327.02" overflow="visible" transform="matrix(1 0 0 -1 0 323.94)" width="602.61"><span class="ltx_foreignobject_container"><span class="ltx_foreignobject_content">
<span id="A3.SS2.SSS2.p1.pic1.2" class="ltx_inline-block ltx_minipage ltx_align_bottom" style="width:43.55em;">
<span id="A3.SS2.SSS2.p1.pic1.2.1" class="ltx_p"><span id="A3.SS2.SSS2.p1.pic1.2.1.1" class="ltx_text ltx_font_typewriter" style="--ltx-fg-color:#000000;">You are an expert in social media translation. Please translate the
following content into English. Follow these requirements:
</span></span>
<span id="A3.SS2.SSS2.p1.pic1.2.2" class="ltx_p"><span id="A3.SS2.SSS2.p1.pic1.2.2.1" class="ltx_text ltx_font_typewriter" style="--ltx-fg-color:#000000;">1. Placeholders in the form ‘‘#placeholder-x#’’ must not be
translated. Preserve each placeholder at the corresponding position
in the translated text.
</span></span>
<span id="A3.SS2.SSS2.p1.pic1.2.3" class="ltx_p"><span id="A3.SS2.SSS2.p1.pic1.2.3.1" class="ltx_text ltx_font_typewriter" style="--ltx-fg-color:#000000;">2. Output only the translated result. Do not provide explanations or
any additional content.
</span></span>
<span id="A3.SS2.SSS2.p1.pic1.2.4" class="ltx_p"><span id="A3.SS2.SSS2.p1.pic1.2.4.1" class="ltx_text ltx_font_typewriter" style="--ltx-fg-color:#000000;">3. Preserve structural tags such as
&lt;title&gt;&lt;/title&gt;,
&lt;content&gt;&lt;/content&gt;, and
&lt;comment&gt;&lt;/comment&gt;.
The translated result must follow the same tag structure as the input.
</span></span>
<span id="A3.SS2.SSS2.p1.pic1.2.5" class="ltx_p"><span id="A3.SS2.SSS2.p1.pic1.2.5.1" class="ltx_text ltx_font_typewriter" style="--ltx-fg-color:#000000;">When the sentence to be translated contains an unclear reference or
an ambiguous meaning, use the following post or parent-comment context
to determine its intended meaning:
</span></span>
<span id="A3.SS2.SSS2.p1.pic1.2.6" class="ltx_p"><span id="A3.SS2.SSS2.p1.pic1.2.6.1" class="ltx_text ltx_font_typewriter" style="--ltx-fg-color:#000000;">{context}
</span></span>
<span id="A3.SS2.SSS2.p1.pic1.2.7" class="ltx_p"><span id="A3.SS2.SSS2.p1.pic1.2.7.1" class="ltx_text ltx_font_typewriter" style="--ltx-fg-color:#000000;">Return only the final translation and no other content.
</span></span>
<span id="A3.SS2.SSS2.p1.pic1.2.8" class="ltx_p"><span id="A3.SS2.SSS2.p1.pic1.2.8.1" class="ltx_text ltx_font_typewriter" style="--ltx-fg-color:#000000;">Sentence to be translated:
</span></span>
<span id="A3.SS2.SSS2.p1.pic1.2.9" class="ltx_p"><span id="A3.SS2.SSS2.p1.pic1.2.9.1" class="ltx_text ltx_font_typewriter" style="--ltx-fg-color:#000000;">{input}
</span></span>
<span id="A3.SS2.SSS2.p1.pic1.2.10" class="ltx_p"><span id="A3.SS2.SSS2.p1.pic1.2.10.1" class="ltx_text ltx_font_typewriter" style="--ltx-fg-color:#000000;">Please provide the translated result:
</span></span>
</span></span></span></foreignobject></g></g></svg>