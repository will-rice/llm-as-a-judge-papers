<span id="A23.SS4.p3.pic1.2" class="ltx_inline-block ltx_minipage ltx_align_bottom" style="width:43.17em;">
<span id="A23.SS4.p3.pic1.2.1" class="ltx_p"><span id="A23.SS4.p3.pic1.2.1.1" class="ltx_text ltx_font_typewriter" style="--ltx-fg-color:#000000;">###Task Description:
<br class="ltx_break">An instruction (an agentic tool-calling query with its available tool schemas), a response to evaluate (a proposed tool-call plan), a reference answer that gets a score of 5, and a score rubric representing an evaluation criteria are given.
<br class="ltx_break">1. Write a detailed feedback that assesses the quality of the response strictly based on the given score rubric, not evaluating in general.
<br class="ltx_break">2. After writing a feedback, write a score that is an integer between 1 and 5. You should refer to the score rubric.
<br class="ltx_break">3. The output format should look as follows: &quot;Feedback: (write a feedback for criteria) [RESULT] (an integer number between 1 and 5)&quot;
<br class="ltx_break">4. Please do not generate any other opening, closing, and explanations.
<br class="ltx_break" style="--ltx-break-space:4.0pt;">
###The instruction to evaluate:
<br class="ltx_break">Given the user query and available tool schemas below, select and structure the correct tool call(s) to satisfy the query.
<br class="ltx_break" style="--ltx-break-space:2.0pt;">
QUERY:
<br class="ltx_break">{<span id="A23.SS4.p3.pic1.2.1.1.1" class="ltx_text ltx_font_italic">user_message</span>}
<br class="ltx_break" style="--ltx-break-space:4.0pt;">
AVAILABLE TOOLS:
<br class="ltx_break">{<span id="A23.SS4.p3.pic1.2.1.1.2" class="ltx_text ltx_font_italic">available_tools</span>}
<br class="ltx_break" style="--ltx-break-space:4.0pt;">
###Response to evaluate:
<br class="ltx_break">{<span id="A23.SS4.p3.pic1.2.1.1.3" class="ltx_text ltx_font_italic">generated_tool_calls</span>}
<br class="ltx_break" style="--ltx-break-space:4.0pt;">
###Reference Answer (Score 5):
<br class="ltx_break">{<span id="A23.SS4.p3.pic1.2.1.1.4" class="ltx_text ltx_font_italic">expected_responses</span>}
<br class="ltx_break" style="--ltx-break-space:4.0pt;">
###Score Rubrics:
<br class="ltx_break">{<span id="A23.SS4.p3.pic1.2.1.1.5" class="ltx_text ltx_font_italic">one of four metric-specific rubrics: tool selection, parameter structure, sequence &amp; dependency, or query coverage -- each a bracketed criterion followed by five score descriptions, structurally identical to the with GT judge rubric in Appendix <a href="#A23.SS2" title="W.2 Judge prompt: with ground truth (GT condition). ‣ Appendix W Prompts ‣ AgentJudgeBench: A Multi-Difficulty Benchmark for Evaluating LLM Judges on Agentic Tool-Calling" class="ltx_ref"><span class="ltx_text ltx_ref_tag">W.2</span></a></span>}
<br class="ltx_break" style="--ltx-break-space:4.0pt;">
###Feedback:
</span></span>
