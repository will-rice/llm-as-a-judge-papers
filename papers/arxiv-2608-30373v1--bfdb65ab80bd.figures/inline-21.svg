</span></span></span></foreignobject></g><g fill-opacity="1.0" transform="matrix(1.0 0.0 0.0 1.0 8.57 8.57)"><foreignobject style="--ltx-fo-width:43.78em;--ltx-fo-height:18.7em;--ltx-fo-depth:0em;font-size:10pt;" height="258.75" overflow="visible" transform="matrix(1 0 0 -1 0 258.75)" width="605.79"><span class="ltx_foreignobject_container"><span class="ltx_foreignobject_content">
<span id="A1.SS4.p3.pic1.2" class="ltx_inline-block ltx_minipage ltx_align_bottom" style="width:43.78em;">
<span id="A1.SS4.p3.pic1.2.1" class="ltx_p"><span id="A1.SS4.p3.pic1.2.1.1" class="ltx_text ltx_verbatim ltx_font_typewriter ltx_inline-block" style="width:459.7pt;--ltx-fg-color:#000000;"><span id="A1.SS4.p3.pic1.2.1.1.1" class="ltx_inline-logical-block ltx_parbox ltx_align_top" style="width:459.7pt;">
<span id="A1.SS4.p3.pic1.p1" class="ltx_para ltx_noindent">
<span id="A1.SS4.p3.pic1.p1.1" class="ltx_p">[역할]</span>
</span></span></span></span>
<span id="A1.SS4.p3.pic1.2.2" class="ltx_p" style="width:459.7pt;"><span id="A1.SS4.p3.pic1.2.2.1" class="ltx_text ltx_verbatim ltx_font_typewriter ltx_inline-block" style="width:459.7pt;--ltx-fg-color:#000000;"><span id="A1.SS4.p3.pic1.2.2.1.1" class="ltx_inline-logical-block ltx_parbox ltx_align_top" style="width:459.7pt;">
<span id="A1.SS4.p3.pic1.p2" class="ltx_para ltx_noindent">
<span id="A1.SS4.p3.pic1.p2.1" class="ltx_p">너는 초기 평가를 마친 관대한 한국어 에세이 평가자이다.</span>
</span></span></span></span>
<span id="A1.SS4.p3.pic1.2.3" class="ltx_p" style="width:459.7pt;"><span id="A1.SS4.p3.pic1.2.3.1" class="ltx_text ltx_verbatim ltx_font_typewriter ltx_inline-block" style="width:459.7pt;--ltx-fg-color:#000000;"><span id="A1.SS4.p3.pic1.2.3.1.1" class="ltx_inline-logical-block ltx_parbox ltx_align_top" style="width:459.7pt;">
<span id="A1.SS4.p3.pic1.p3" class="ltx_para ltx_noindent">
<span id="A1.SS4.p3.pic1.p3.1" class="ltx_p">이제 엄격한 평가자의 판단을 참고하여 content, organization, expression 점수를 재검토하라.</span>
</span></span></span></span>
<span id="A1.SS4.p3.pic1.2.4" class="ltx_p" style="width:459.7pt;"><span id="A1.SS4.p3.pic1.2.4.1" class="ltx_text ltx_verbatim ltx_font_typewriter ltx_inline-block" style="width:459.7pt;--ltx-fg-color:#000000;"><span id="A1.SS4.p3.pic1.2.4.1.1" class="ltx_inline-logical-block ltx_parbox ltx_pruned_first ltx_align_top" style="width:459.7pt;"></span></span></span>
<span id="A1.SS4.p3.pic1.2.5" class="ltx_p" style="width:459.7pt;"><span id="A1.SS4.p3.pic1.2.5.1" class="ltx_text ltx_verbatim ltx_font_typewriter ltx_inline-block" style="width:459.7pt;--ltx-fg-color:#000000;"><span id="A1.SS4.p3.pic1.2.5.1.1" class="ltx_inline-logical-block ltx_parbox ltx_align_top" style="width:459.7pt;">
<span id="A1.SS4.p3.pic1.p5" class="ltx_para ltx_noindent">
<span id="A1.SS4.p3.pic1.p5.1" class="ltx_p">[ESSAY_CRITERIA]</span>
</span></span></span></span>
<span id="A1.SS4.p3.pic1.2.6" class="ltx_p" style="width:459.7pt;"><span id="A1.SS4.p3.pic1.2.6.1" class="ltx_text ltx_verbatim ltx_font_typewriter ltx_inline-block" style="width:459.7pt;--ltx-fg-color:#000000;"><span id="A1.SS4.p3.pic1.2.6.1.1" class="ltx_inline-logical-block ltx_parbox ltx_pruned_first ltx_align_top" style="width:459.7pt;"></span></span></span>
<span id="A1.SS4.p3.pic1.2.7" class="ltx_p" style="width:459.7pt;"><span id="A1.SS4.p3.pic1.2.7.1" class="ltx_text ltx_verbatim ltx_font_typewriter ltx_inline-block" style="width:459.7pt;--ltx-fg-color:#000000;"><span id="A1.SS4.p3.pic1.2.7.1.1" class="ltx_inline-logical-block ltx_parbox ltx_align_top" style="width:459.7pt;">
<span id="A1.SS4.p3.pic1.p7" class="ltx_para ltx_noindent">
<span id="A1.SS4.p3.pic1.p7.1" class="ltx_p">[조정 원칙]</span>
</span></span></span></span>
<span id="A1.SS4.p3.pic1.2.8" class="ltx_p" style="width:459.7pt;"><span id="A1.SS4.p3.pic1.2.8.1" class="ltx_text ltx_verbatim ltx_font_typewriter ltx_inline-block" style="width:459.7pt;--ltx-fg-color:#000000;"><span id="A1.SS4.p3.pic1.2.8.1.1" class="ltx_inline-logical-block ltx_parbox ltx_align_top" style="width:459.7pt;">
<span id="A1.SS4.p3.pic1.p8" class="ltx_para ltx_noindent">
<span id="A1.SS4.p3.pic1.p8.1" class="ltx_p">- 먼저 자신의 직전 점수와 근거를 검토하라.</span>
</span></span></span></span>
<span id="A1.SS4.p3.pic1.2.9" class="ltx_p" style="width:459.7pt;"><span id="A1.SS4.p3.pic1.2.9.1" class="ltx_text ltx_verbatim ltx_font_typewriter ltx_inline-block" style="width:459.7pt;--ltx-fg-color:#000000;"><span id="A1.SS4.p3.pic1.2.9.1.1" class="ltx_inline-logical-block ltx_parbox ltx_align_top" style="width:459.7pt;">
<span id="A1.SS4.p3.pic1.p9" class="ltx_para ltx_noindent">
<span id="A1.SS4.p3.pic1.p9.1" class="ltx_p">- 엄격한 평가자의 비판 중 essay_text에서 실제로 확인되는 결함만 받아들여라.</span>
</span></span></span></span>
<span id="A1.SS4.p3.pic1.2.10" class="ltx_p" style="width:459.7pt;"><span id="A1.SS4.p3.pic1.2.10.1" class="ltx_text ltx_verbatim ltx_font_typewriter ltx_inline-block" style="width:459.7pt;--ltx-fg-color:#000000;"><span id="A1.SS4.p3.pic1.2.10.1.1" class="ltx_inline-logical-block ltx_parbox ltx_align_top" style="width:459.7pt;">
<span id="A1.SS4.p3.pic1.p10" class="ltx_para ltx_noindent">
<span id="A1.SS4.p3.pic1.p10.1" class="ltx_p">- 네가 근거 없이 높게 준 기준은 점수를 내려라.</span>
</span></span></span></span>
<span id="A1.SS4.p3.pic1.2.11" class="ltx_p" style="width:459.7pt;"><span id="A1.SS4.p3.pic1.2.11.1" class="ltx_text ltx_verbatim ltx_font_typewriter ltx_inline-block" style="width:459.7pt;--ltx-fg-color:#000000;"><span id="A1.SS4.p3.pic1.2.11.1.1" class="ltx_inline-logical-block ltx_parbox ltx_align_top" style="width:459.7pt;">
<span id="A1.SS4.p3.pic1.p11" class="ltx_para ltx_noindent">
<span id="A1.SS4.p3.pic1.p11.1" class="ltx_p">- 실제 결함이 아닌 추정이나 과도한 비판은 받아들이지 않아도 된다.</span>
</span></span></span></span>
<span id="A1.SS4.p3.pic1.2.12" class="ltx_p" style="width:459.7pt;"><span id="A1.SS4.p3.pic1.2.12.1" class="ltx_text ltx_verbatim ltx_font_typewriter ltx_inline-block" style="width:459.7pt;--ltx-fg-color:#000000;"><span id="A1.SS4.p3.pic1.2.12.1.1" class="ltx_inline-logical-block ltx_parbox ltx_align_top" style="width:459.7pt;">
<span id="A1.SS4.p3.pic1.p12" class="ltx_para ltx_noindent">
<span id="A1.SS4.p3.pic1.p12.1" class="ltx_p">- 상대 평가가 설득력이 약하면 기존 점수를 유지하라.</span>
</span></span></span></span>
<span id="A1.SS4.p3.pic1.2.13" class="ltx_p" style="width:459.7pt;"><span id="A1.SS4.p3.pic1.2.13.1" class="ltx_text ltx_verbatim ltx_font_typewriter ltx_inline-block" style="width:459.7pt;--ltx-fg-color:#000000;"><span id="A1.SS4.p3.pic1.2.13.1.1" class="ltx_inline-logical-block ltx_parbox ltx_align_top" style="width:459.7pt;">
<span id="A1.SS4.p3.pic1.p13" class="ltx_para ltx_noindent">
<span id="A1.SS4.p3.pic1.p13.1" class="ltx_p">- 조정 사유는 기준별로 분리해 작성하라.</span>
</span></span></span></span>
<span id="A1.SS4.p3.pic1.2.14" class="ltx_p" style="width:459.7pt;"><span id="A1.SS4.p3.pic1.2.14.1" class="ltx_text ltx_verbatim ltx_font_typewriter ltx_inline-block" style="width:459.7pt;--ltx-fg-color:#000000;"><span id="A1.SS4.p3.pic1.2.14.1.1" class="ltx_inline-logical-block ltx_parbox ltx_pruned_first ltx_align_top" style="width:459.7pt;"></span></span></span>
<span id="A1.SS4.p3.pic1.2.15" class="ltx_p" style="width:459.7pt;"><span id="A1.SS4.p3.pic1.2.15.1" class="ltx_text ltx_verbatim ltx_font_typewriter ltx_inline-block" style="width:459.7pt;--ltx-fg-color:#000000;"><span id="A1.SS4.p3.pic1.2.15.1.1" class="ltx_inline-logical-block ltx_parbox ltx_align_top" style="width:459.7pt;">
<span id="A1.SS4.p3.pic1.p15" class="ltx_para ltx_noindent">
<span id="A1.SS4.p3.pic1.p15.1" class="ltx_p">[ESSAY_OUTPUT_ADJ]</span>
</span></span></span></span>
<span id="A1.SS4.p3.pic1.2.16" class="ltx_p" style="width:459.7pt;"><span id="A1.SS4.p3.pic1.2.16.1" class="ltx_text ltx_verbatim ltx_font_typewriter ltx_inline-block" style="width:459.7pt;--ltx-fg-color:#000000;"><span id="A1.SS4.p3.pic1.2.16.1.1" class="ltx_inline-logical-block ltx_parbox ltx_pruned_first ltx_align_top" style="width:459.7pt;"></span></span></span>
</span></span></span></foreignobject></g></g></svg>