<svg id="A2.SS1.p2.pic1" class="ltx_picture" height="783.47" overflow="visible" version="1.1" viewbox="0 0 653.15 783.47" width="653.15"><g style="--ltx-stroke-color:#000000;--ltx-fill-color:#000000;" fill="#000000" stroke="#000000" stroke-width="0.4pt" transform="translate(0,783.47) matrix(1 0 0 -1 0 0)"><g style="--ltx-fill-color:#666666;" fill="#666666" fill-opacity="1.0"><path style="stroke:none" d="M 0 4.63 L 0 778.84 C 0 781.4 2.07 783.47 4.63 783.47 L 648.52 783.47 C 651.08 783.47 653.15 781.4 653.15 778.84 L 653.15 4.63 C 653.15 2.07 651.08 0 648.52 0 L 4.63 0 C 2.07 0 0 2.07 0 4.63 Z" /></g><g style="--ltx-fill-color:#F5F5F5;" fill="#F5F5F5" fill-opacity="1.0"><path style="stroke:none" d="M 0.69 4.63 L 0.69 761.91 L 652.46 761.91 L 652.46 4.63 C 652.46 2.45 650.7 0.69 648.52 0.69 L 4.63 0.69 C 2.45 0.69 0.69 2.45 0.69 4.63 Z" /></g><g fill-opacity="1.0" transform="matrix(1.0 0.0 0.0 1.0 15.7 769.23)"><foreignobject style="--ltx-fo-width:40.85em;--ltx-fo-height:0.69em;--ltx-fo-depth:0.19em;font-size:10pt;" height="12.3" overflow="visible" transform="matrix(1 0 0 -1 0 9.61)" width="565.25"><span class="ltx_foreignobject_container"><span class="ltx_foreignobject_content">
<span id="A2.SS1.p2.pic1.1" class="ltx_inline-block ltx_minipage ltx_align_bottom" style="width:40.85em;">
<span id="A2.SS1.p2.pic1.1.1" class="ltx_p"><span id="A2.SS1.p2.pic1.1.1.1" class="ltx_text ltx_font_sansserif ltx_font_bold" style="--ltx-fg-color:#FFFFFF;">Baseline Evaluator Prompt: Maths Domain</span></span>
</span></span></span></foreignobject></g><g fill-opacity="1.0" transform="matrix(1.0 0.0 0.0 1.0 15.7 255)"><foreignobject style="--ltx-fo-width:44.93em;--ltx-fo-height:35.55em;--ltx-fo-depth:17.29em;font-size:10pt;" height="731.22" overflow="visible" transform="matrix(1 0 0 -1 0 491.91)" width="621.7"><span class="ltx_foreignobject_container"><span class="ltx_foreignobject_content">
<span id="A2.SS1.p2.pic1.2" class="ltx_inline-block ltx_minipage ltx_align_bottom" style="width:44.93em;">
<span id="A2.SS1.p2.pic1.2.1" class="ltx_p"><span id="A2.SS1.p2.pic1.2.1.1" class="ltx_text" style="--ltx-fg-color:#000000;">The following is a math problem and a solution (split into steps, enclosed with tags and indexed from 0):</span></span>
<span id="A2.SS1.p2.pic1.2.2" class="ltx_p"><span id="A2.SS1.p2.pic1.2.2.1" class="ltx_text ltx_font_bold" style="--ltx-fg-color:#000000;">[Math Problem]<span id="A2.SS1.p2.pic1.2.2.1.1" class="ltx_text ltx_font_medium">
<span id="A2.SS1.p2.pic1.2.2.1.1.1" class="ltx_text ltx_font_typewriter">{problem}</span></span></span></span>
<span id="A2.SS1.p2.pic1.2.3" class="ltx_p"><span id="A2.SS1.p2.pic1.2.3.1" class="ltx_text ltx_font_bold" style="--ltx-fg-color:#000000;">[Solution]<span id="A2.SS1.p2.pic1.2.3.1.1" class="ltx_text ltx_font_medium">
<span id="A2.SS1.p2.pic1.2.3.1.1.1" class="ltx_text ltx_font_typewriter">{steps}</span></span></span></span>
<span id="A2.SS1.p2.pic1.2.4" class="ltx_p"><span id="A2.SS1.p2.pic1.2.4.1" class="ltx_text" style="--ltx-fg-color:#000000;">Your task is to review and critique the solution step-by-step.
For each step, determine if it is correct or incorrect. A correct step is one where all of the content is correct, and is logically consistent with all previous steps and information given in the problem.</span></span>
<span id="A2.SS1.p2.pic1.2.5" class="ltx_p"><span id="A2.SS1.p2.pic1.2.5.1" class="ltx_text" style="--ltx-fg-color:#000000;">An incorrect step is one where the content is incorrect, or is not logically consistent with all previous steps and information given in the problem, or is based on an error in a previous step.</span></span>
<span id="A2.SS1.p2.pic1.2.6" class="ltx_p"><span id="A2.SS1.p2.pic1.2.6.1" class="ltx_text ltx_font_bold" style="--ltx-fg-color:#000000;">Important:<span id="A2.SS1.p2.pic1.2.6.1.1" class="ltx_text ltx_font_medium"> Any step that contains or is based on an error is considered incorrect. That is, if the error is carried forward from a previous step or is based on an error in the previous step, consider the step incorrect. Provide reasoning for your correctness determinations.</span></span></span>
<span id="A2.SS1.p2.pic1.2.7" class="ltx_p"><span id="A2.SS1.p2.pic1.2.7.1" class="ltx_text" style="--ltx-fg-color:#000000;">There are exactly <span id="A2.SS1.p2.pic1.2.7.1.1" class="ltx_text ltx_font_typewriter">{expected_n}</span> solution steps, indexed from Step 0 to Step <span id="A2.SS1.p2.pic1.2.7.1.2" class="ltx_text ltx_font_typewriter">{last_idx}</span>.</span></span>
<span id="A2.SS1.p2.pic1.2.8" class="ltx_p"><span id="A2.SS1.p2.pic1.2.8.1" class="ltx_text" style="--ltx-fg-color:#000000;">Do not give a verdict for the math problem itself.
Give exactly one verdict for each solution step.
Do not skip any step.
Do not add extra steps.</span></span>
<span id="A2.SS1.p2.pic1.2.9" class="ltx_p"><span id="A2.SS1.p2.pic1.2.9.1" class="ltx_text" style="--ltx-fg-color:#000000;">Please use the following format to return your answer:</span></span>
<span id="A2.SS1.p2.pic1.2.10" class="ltx_p"><span id="A2.SS1.p2.pic1.2.10.1" class="ltx_text ltx_font_bold" style="--ltx-fg-color:#000000;">Reasoning:<span id="A2.SS1.p2.pic1.2.10.1.1" class="ltx_text ltx_font_medium">
Step 0: &lt;your reasoning&gt;Step 1: &lt;your reasoning&gt;…</span></span></span>
<span id="A2.SS1.p2.pic1.2.11" class="ltx_p"><span id="A2.SS1.p2.pic1.2.11.1" class="ltx_text ltx_font_bold" style="--ltx-fg-color:#000000;">Verdict:<span id="A2.SS1.p2.pic1.2.11.1.1" class="ltx_text ltx_font_medium">
Step 0: &lt;yes or no&gt;Step 1: &lt;yes or no&gt;…
Step <span id="A2.SS1.p2.pic1.2.11.1.1.1" class="ltx_text ltx_font_typewriter">{last_idx}</span>: &lt;yes or no&gt;</span></span></span>
<span id="A2.SS1.p2.pic1.2.12" class="ltx_p"><span id="A2.SS1.p2.pic1.2.12.1" class="ltx_text ltx_font_bold" style="--ltx-fg-color:#000000;">Rules:<span id="A2.SS1.p2.pic1.2.12.1.1" class="ltx_text"></span></span></span>
<span id="A2.I1" class="ltx_itemize">
<span id="A2.I1.i1" class="ltx_item" style="list-style-type:none;"><span class="ltx_tag ltx_tag_item">•</span> 
<span id="A2.I1.i1.p1" class="ltx_para">
<span id="A2.I1.i1.p1.1" class="ltx_p"><span id="A2.I1.i1.p1.1.1" class="ltx_text" style="--ltx-fg-color:#000000;">Use </span><span id="A2.I1.i1.p1.1.2" class="ltx_text ltx_font_typewriter" style="--ltx-fg-color:#000000;">yes</span><span id="A2.I1.i1.p1.1.3" class="ltx_text" style="--ltx-fg-color:#000000;"> if the step is correct.</span></span>
</span></span>
<span id="A2.I1.i2" class="ltx_item" style="list-style-type:none;padding-top:0.0pt;"><span class="ltx_tag ltx_tag_item">•</span> 
<span id="A2.I1.i2.p1" class="ltx_para">
<span id="A2.I1.i2.p1.1" class="ltx_p"><span id="A2.I1.i2.p1.1.1" class="ltx_text" style="--ltx-fg-color:#000000;">Use </span><span id="A2.I1.i2.p1.1.2" class="ltx_text ltx_font_typewriter" style="--ltx-fg-color:#000000;">no</span><span id="A2.I1.i2.p1.1.3" class="ltx_text" style="--ltx-fg-color:#000000;"> if the step is incorrect.</span></span>
</span></span>
<span id="A2.I1.i3" class="ltx_item" style="list-style-type:none;padding-top:0.0pt;"><span class="ltx_tag ltx_tag_item">•</span> 
<span id="A2.I1.i3.p1" class="ltx_para">
<span id="A2.I1.i3.p1.1" class="ltx_p"><span id="A2.I1.i3.p1.1.1" class="ltx_text" style="--ltx-fg-color:#000000;">Each verdict line must start with </span><span id="A2.I1.i3.p1.1.2" class="ltx_text ltx_font_typewriter" style="--ltx-fg-color:#000000;">Step &lt;index&gt;:</span></span>
</span></span>
<span id="A2.I1.i4" class="ltx_item" style="list-style-type:none;padding-top:0.0pt;"><span class="ltx_tag ltx_tag_item">•</span> 
<span id="A2.I1.i4.p1" class="ltx_para">
<span id="A2.I1.i4.p1.1" class="ltx_p"><span id="A2.I1.i4.p1.1.1" class="ltx_text" style="--ltx-fg-color:#000000;">Each verdict must be exactly </span><span id="A2.I1.i4.p1.1.2" class="ltx_text ltx_font_typewriter" style="--ltx-fg-color:#000000;">yes</span><span id="A2.I1.i4.p1.1.3" class="ltx_text" style="--ltx-fg-color:#000000;"> or </span><span id="A2.I1.i4.p1.1.4" class="ltx_text ltx_font_typewriter" style="--ltx-fg-color:#000000;">no</span><span id="A2.I1.i4.p1.1.5" class="ltx_text" style="--ltx-fg-color:#000000;">.</span></span>
</span></span>
<span id="A2.I1.i5" class="ltx_item" style="list-style-type:none;padding-top:0.0pt;"><span class="ltx_tag ltx_tag_item">•</span> 
<span id="A2.I1.i5.p1" class="ltx_para">
<span id="A2.I1.i5.p1.1" class="ltx_p"><span id="A2.I1.i5.p1.1.1" class="ltx_text" style="--ltx-fg-color:#000000;">Do not give a verdict for the math problem itself.</span></span>
</span></span>
<span id="A2.I1.i6" class="ltx_item" style="list-style-type:none;padding-top:0.0pt;"><span class="ltx_tag ltx_tag_item">•</span> 
<span id="A2.I1.i6.p1" class="ltx_para">
<span id="A2.I1.i6.p1.1" class="ltx_p"><span id="A2.I1.i6.p1.1.1" class="ltx_text" style="--ltx-fg-color:#000000;">Do not add any text after the final verdict line.</span></span>
</span></span>
</span>
</span></span></span></foreignobject></g></g></svg>