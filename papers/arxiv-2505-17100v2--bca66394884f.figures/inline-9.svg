<span id="A5.SS7.p2.pic1.1" class="ltx_inline-block ltx_minipage ltx_align_bottom" style="width:31.37em;">
<span id="A5.SS7.p2.pic1.1.1" class="ltx_p"><span id="A5.SS7.p2.pic1.1.1.1" class="ltx_text" style="--ltx-fg-color:#000000;">Select the Output (a) or Output (b) that provides the correct answer for the given math problem.
<br class="ltx_break"></span></span>
<span id="A5.SS7.p2.pic1.1.2" class="ltx_p"><span id="A5.SS7.p2.pic1.1.2.1" class="ltx_text" style="--ltx-fg-color:#000000;">Here are some rules of the evaluation:
<br class="ltx_break">(1) Your primary objective is to focus on mathematical correctness, determining which output contains the correct mathematical answer.
<br class="ltx_break">(2) You should avoid any potential bias and your judgment should be as objective as possible. For example, the length of the outputs should NOT affect your judgment, as longer responses are not necessarily better than shorter ones.
<br class="ltx_break"></span></span>
<span id="A5.SS7.p2.pic1.1.3" class="ltx_p"><span id="A5.SS7.p2.pic1.1.3.1" class="ltx_text" style="--ltx-fg-color:#000000;">Do NOT provide any explanation for your choice.
<br class="ltx_break">Do NOT say both / neither are good.
<br class="ltx_break">You should answer using ONLY “Output (a)” or “Output (b)”. Do NOT output any other words.
<br class="ltx_break"></span></span>
<span id="A5.SS7.p2.pic1.1.4" class="ltx_p"><span id="A5.SS7.p2.pic1.1.4.1" class="ltx_text" style="--ltx-fg-color:#000000;"># Instruction: {instruction}</span></span>
<span id="A5.SS7.p2.pic1.1.5" class="ltx_p"><span id="A5.SS7.p2.pic1.1.5.1" class="ltx_text" style="--ltx-fg-color:#000000;"># Output (a): {output_(a)}</span></span>
