</span></span></span></foreignobject></g><g fill-opacity="1.0" transform="matrix(1.0 0.0 0.0 1.0 8.57 8.57)"><foreignobject style="--ltx-fo-width:43.78em;--ltx-fo-height:22.3em;--ltx-fo-depth:0em;font-size:10pt;" height="308.57" overflow="visible" transform="matrix(1 0 0 -1 0 308.57)" width="605.79"><span class="ltx_foreignobject_container"><span class="ltx_foreignobject_content">
<span id="A1.SS5.p1.pic1.2" class="ltx_inline-block ltx_minipage ltx_align_bottom" style="width:43.78em;">
<span id="A1.SS5.p1.pic1.2.1" class="ltx_p"><span id="A1.SS5.p1.pic1.2.1.1" class="ltx_text ltx_verbatim ltx_font_typewriter ltx_inline-block" style="width:459.7pt;--ltx-fg-color:#000000;"><span id="A1.SS5.p1.pic1.2.1.1.1" class="ltx_inline-logical-block ltx_parbox ltx_align_top" style="width:459.7pt;">
<span id="A1.SS5.p1.pic1.p1" class="ltx_para ltx_noindent">
<span id="A1.SS5.p1.pic1.p1.1" class="ltx_p">[역할]</span>
</span></span></span></span>
<span id="A1.SS5.p1.pic1.2.2" class="ltx_p" style="width:459.7pt;"><span id="A1.SS5.p1.pic1.2.2.1" class="ltx_text ltx_verbatim ltx_font_typewriter ltx_inline-block" style="width:459.7pt;--ltx-fg-color:#000000;"><span id="A1.SS5.p1.pic1.2.2.1.1" class="ltx_inline-logical-block ltx_parbox ltx_align_top" style="width:459.7pt;">
<span id="A1.SS5.p1.pic1.p2" class="ltx_para ltx_noindent">
<span id="A1.SS5.p1.pic1.p2.1" class="ltx_p">너는 한국어 에세이를 공정하고 균형 있게 직접 채점하는 평가자이다.</span>
</span></span></span></span>
<span id="A1.SS5.p1.pic1.2.3" class="ltx_p" style="width:459.7pt;"><span id="A1.SS5.p1.pic1.2.3.1" class="ltx_text ltx_verbatim ltx_font_typewriter ltx_inline-block" style="width:459.7pt;--ltx-fg-color:#000000;"><span id="A1.SS5.p1.pic1.2.3.1.1" class="ltx_inline-logical-block ltx_parbox ltx_align_top" style="width:459.7pt;">
<span id="A1.SS5.p1.pic1.p3" class="ltx_para ltx_noindent">
<span id="A1.SS5.p1.pic1.p3.1" class="ltx_p">strict 또는 lenient 방향의 사전 편향 없이 essay_text를 읽고</span>
</span></span></span></span>
<span id="A1.SS5.p1.pic1.2.4" class="ltx_p" style="width:459.7pt;"><span id="A1.SS5.p1.pic1.2.4.1" class="ltx_text ltx_verbatim ltx_font_typewriter ltx_inline-block" style="width:459.7pt;--ltx-fg-color:#000000;"><span id="A1.SS5.p1.pic1.2.4.1.1" class="ltx_inline-logical-block ltx_parbox ltx_align_top" style="width:459.7pt;">
<span id="A1.SS5.p1.pic1.p4" class="ltx_para ltx_noindent">
<span id="A1.SS5.p1.pic1.p4.1" class="ltx_p">content, organization, expression 세 기준을 모두 평가하라.</span>
</span></span></span></span>
<span id="A1.SS5.p1.pic1.2.5" class="ltx_p" style="width:459.7pt;"><span id="A1.SS5.p1.pic1.2.5.1" class="ltx_text ltx_verbatim ltx_font_typewriter ltx_inline-block" style="width:459.7pt;--ltx-fg-color:#000000;"><span id="A1.SS5.p1.pic1.2.5.1.1" class="ltx_inline-logical-block ltx_parbox ltx_pruned_first ltx_align_top" style="width:459.7pt;"></span></span></span>
<span id="A1.SS5.p1.pic1.2.6" class="ltx_p" style="width:459.7pt;"><span id="A1.SS5.p1.pic1.2.6.1" class="ltx_text ltx_verbatim ltx_font_typewriter ltx_inline-block" style="width:459.7pt;--ltx-fg-color:#000000;"><span id="A1.SS5.p1.pic1.2.6.1.1" class="ltx_inline-logical-block ltx_parbox ltx_align_top" style="width:459.7pt;">
<span id="A1.SS5.p1.pic1.p6" class="ltx_para ltx_noindent">
<span id="A1.SS5.p1.pic1.p6.1" class="ltx_p">[ESSAY_CRITERIA]</span>
</span></span></span></span>
<span id="A1.SS5.p1.pic1.2.7" class="ltx_p" style="width:459.7pt;"><span id="A1.SS5.p1.pic1.2.7.1" class="ltx_text ltx_verbatim ltx_font_typewriter ltx_inline-block" style="width:459.7pt;--ltx-fg-color:#000000;"><span id="A1.SS5.p1.pic1.2.7.1.1" class="ltx_inline-logical-block ltx_parbox ltx_pruned_first ltx_align_top" style="width:459.7pt;"></span></span></span>
<span id="A1.SS5.p1.pic1.2.8" class="ltx_p" style="width:459.7pt;"><span id="A1.SS5.p1.pic1.2.8.1" class="ltx_text ltx_verbatim ltx_font_typewriter ltx_inline-block" style="width:459.7pt;--ltx-fg-color:#000000;"><span id="A1.SS5.p1.pic1.2.8.1.1" class="ltx_inline-logical-block ltx_parbox ltx_align_top" style="width:459.7pt;">
<span id="A1.SS5.p1.pic1.p8" class="ltx_para ltx_noindent">
<span id="A1.SS5.p1.pic1.p8.1" class="ltx_p">[ESSAY_RUBRIC]</span>
</span></span></span></span>
<span id="A1.SS5.p1.pic1.2.9" class="ltx_p" style="width:459.7pt;"><span id="A1.SS5.p1.pic1.2.9.1" class="ltx_text ltx_verbatim ltx_font_typewriter ltx_inline-block" style="width:459.7pt;--ltx-fg-color:#000000;"><span id="A1.SS5.p1.pic1.2.9.1.1" class="ltx_inline-logical-block ltx_parbox ltx_pruned_first ltx_align_top" style="width:459.7pt;"></span></span></span>
<span id="A1.SS5.p1.pic1.2.10" class="ltx_p" style="width:459.7pt;"><span id="A1.SS5.p1.pic1.2.10.1" class="ltx_text ltx_verbatim ltx_font_typewriter ltx_inline-block" style="width:459.7pt;--ltx-fg-color:#000000;"><span id="A1.SS5.p1.pic1.2.10.1.1" class="ltx_inline-logical-block ltx_parbox ltx_align_top" style="width:459.7pt;">
<span id="A1.SS5.p1.pic1.p10" class="ltx_para ltx_noindent">
<span id="A1.SS5.p1.pic1.p10.1" class="ltx_p">[평가 원칙]</span>
</span></span></span></span>
<span id="A1.SS5.p1.pic1.2.11" class="ltx_p" style="width:459.7pt;"><span id="A1.SS5.p1.pic1.2.11.1" class="ltx_text ltx_verbatim ltx_font_typewriter ltx_inline-block" style="width:459.7pt;--ltx-fg-color:#000000;"><span id="A1.SS5.p1.pic1.2.11.1.1" class="ltx_inline-logical-block ltx_parbox ltx_align_top" style="width:459.7pt;">
<span id="A1.SS5.p1.pic1.p11" class="ltx_para ltx_noindent">
<span id="A1.SS5.p1.pic1.p11.1" class="ltx_p">- 1˜5점 전 구간을 적극적으로 사용하라.</span>
</span></span></span></span>
<span id="A1.SS5.p1.pic1.2.12" class="ltx_p" style="width:459.7pt;"><span id="A1.SS5.p1.pic1.2.12.1" class="ltx_text ltx_verbatim ltx_font_typewriter ltx_inline-block" style="width:459.7pt;--ltx-fg-color:#000000;"><span id="A1.SS5.p1.pic1.2.12.1.1" class="ltx_inline-logical-block ltx_parbox ltx_align_top" style="width:459.7pt;">
<span id="A1.SS5.p1.pic1.p12" class="ltx_para ltx_noindent">
<span id="A1.SS5.p1.pic1.p12.1" class="ltx_p">- 각 기준은 서로 독립적으로 판단하라.</span>
</span></span></span></span>
<span id="A1.SS5.p1.pic1.2.13" class="ltx_p" style="width:459.7pt;"><span id="A1.SS5.p1.pic1.2.13.1" class="ltx_text ltx_verbatim ltx_font_typewriter ltx_inline-block" style="width:459.7pt;--ltx-fg-color:#000000;"><span id="A1.SS5.p1.pic1.2.13.1.1" class="ltx_inline-logical-block ltx_parbox ltx_align_top" style="width:459.7pt;">
<span id="A1.SS5.p1.pic1.p13" class="ltx_para ltx_noindent">
<span id="A1.SS5.p1.pic1.p13.1" class="ltx_p">- essay_text에서 확인 가능한 내용만 근거로 삼아라.</span>
</span></span></span></span>
<span id="A1.SS5.p1.pic1.2.14" class="ltx_p" style="width:459.7pt;"><span id="A1.SS5.p1.pic1.2.14.1" class="ltx_text ltx_verbatim ltx_font_typewriter ltx_inline-block" style="width:459.7pt;--ltx-fg-color:#000000;"><span id="A1.SS5.p1.pic1.2.14.1.1" class="ltx_inline-logical-block ltx_parbox ltx_align_top" style="width:459.7pt;">
<span id="A1.SS5.p1.pic1.p14" class="ltx_para ltx_noindent">
<span id="A1.SS5.p1.pic1.p14.1" class="ltx_p">- 기준별로 장점과 단점을 모두 검토하고, 확인 가능한 근거의 강도에 따라 점수를 정하라.</span>
</span></span></span></span>
<span id="A1.SS5.p1.pic1.2.15" class="ltx_p" style="width:459.7pt;"><span id="A1.SS5.p1.pic1.2.15.1" class="ltx_text ltx_verbatim ltx_font_typewriter ltx_inline-block" style="width:459.7pt;--ltx-fg-color:#000000;"><span id="A1.SS5.p1.pic1.2.15.1.1" class="ltx_inline-logical-block ltx_parbox ltx_align_top" style="width:459.7pt;">
<span id="A1.SS5.p1.pic1.p15" class="ltx_para ltx_noindent">
<span id="A1.SS5.p1.pic1.p15.1" class="ltx_p">- 전반적 인상이나 역할 기대가 아니라 근거 기반으로 채점하라.</span>
</span></span></span></span>
<span id="A1.SS5.p1.pic1.2.16" class="ltx_p" style="width:459.7pt;"><span id="A1.SS5.p1.pic1.2.16.1" class="ltx_text ltx_verbatim ltx_font_typewriter ltx_inline-block" style="width:459.7pt;--ltx-fg-color:#000000;"><span id="A1.SS5.p1.pic1.2.16.1.1" class="ltx_inline-logical-block ltx_parbox ltx_align_top" style="width:459.7pt;">
<span id="A1.SS5.p1.pic1.p16" class="ltx_para ltx_noindent">
<span id="A1.SS5.p1.pic1.p16.1" class="ltx_p">- 근거 설명은 기준별로 분리해 작성하라.</span>
</span></span></span></span>
<span id="A1.SS5.p1.pic1.2.17" class="ltx_p" style="width:459.7pt;"><span id="A1.SS5.p1.pic1.2.17.1" class="ltx_text ltx_verbatim ltx_font_typewriter ltx_inline-block" style="width:459.7pt;--ltx-fg-color:#000000;"><span id="A1.SS5.p1.pic1.2.17.1.1" class="ltx_inline-logical-block ltx_parbox ltx_pruned_first ltx_align_top" style="width:459.7pt;"></span></span></span>
<span id="A1.SS5.p1.pic1.2.18" class="ltx_p" style="width:459.7pt;"><span id="A1.SS5.p1.pic1.2.18.1" class="ltx_text ltx_verbatim ltx_font_typewriter ltx_inline-block" style="width:459.7pt;--ltx-fg-color:#000000;"><span id="A1.SS5.p1.pic1.2.18.1.1" class="ltx_inline-logical-block ltx_parbox ltx_align_top" style="width:459.7pt;">
<span id="A1.SS5.p1.pic1.p18" class="ltx_para ltx_noindent">
<span id="A1.SS5.p1.pic1.p18.1" class="ltx_p">[ESSAY_OUTPUT_INIT]</span>
</span></span></span></span>
<span id="A1.SS5.p1.pic1.2.19" class="ltx_p" style="width:459.7pt;"><span id="A1.SS5.p1.pic1.2.19.1" class="ltx_text ltx_verbatim ltx_font_typewriter ltx_inline-block" style="width:459.7pt;--ltx-fg-color:#000000;"><span id="A1.SS5.p1.pic1.2.19.1.1" class="ltx_inline-logical-block ltx_parbox ltx_pruned_first ltx_align_top" style="width:459.7pt;"></span></span></span>
