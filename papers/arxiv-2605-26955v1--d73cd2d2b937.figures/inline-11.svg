<svg id="A5.SS5.p1.pic1" class="ltx_picture" height="1462.97" overflow="visible" version="1.1" viewbox="0 0 477.38 1462.97" width="477.38"><g style="--ltx-stroke-color:#000000;--ltx-fill-color:#000000;" fill="#000000" stroke="#000000" stroke-width="0.4pt" transform="translate(0,1462.97) matrix(1 0 0 -1 0 0)"><g style="--ltx-fill-color:#404040;" fill="#404040" fill-opacity="1.0"><path style="stroke:none" d="M 0 5.91 L 0 1457.06 C 0 1460.33 2.64 1462.97 5.91 1462.97 L 471.47 1462.97 C 474.73 1462.97 477.38 1460.33 477.38 1457.06 L 477.38 5.91 C 477.38 2.64 474.73 0 471.47 0 L 5.91 0 C 2.64 0 0 2.64 0 5.91 Z" /></g><g style="--ltx-fill-color:#FFFFFF;" fill="#FFFFFF" fill-opacity="1.0"><path style="stroke:none" d="M 1.97 5.91 L 1.97 1438.86 L 475.41 1438.86 L 475.41 5.91 C 475.41 3.73 473.65 1.97 471.47 1.97 L 5.91 1.97 C 3.73 1.97 1.97 3.73 1.97 5.91 Z" /></g><g fill-opacity="1.0" transform="matrix(1.0 0.0 0.0 1.0 7.29 1447.45)"><foreignobject style="--ltx-fo-width:29.09em;--ltx-fo-height:0.69em;--ltx-fo-depth:0.19em;font-size:10pt;" height="12.3" overflow="visible" transform="matrix(1 0 0 -1 0 9.61)" width="402.52"><span class="ltx_foreignobject_container"><span class="ltx_foreignobject_content">
<span id="A5.SS5.p1.pic1.1" class="ltx_inline-block ltx_minipage ltx_align_bottom" style="width:29.09em;">
<span id="A5.SS5.p1.pic1.1.1" class="ltx_p"><span id="A5.SS5.p1.pic1.1.1.1" class="ltx_text ltx_font_bold" style="--ltx-fg-color:#FFFFFF;">{Prompt}</span></span>
</span></span></span></foreignobject></g><g fill-opacity="1.0" transform="matrix(1.0 0.0 0.0 1.0 7.29 10.4)"><foreignobject style="--ltx-fo-width:35.4em;--ltx-fo-height:102.85em;--ltx-fo-depth:0.23em;font-size:10pt;" height="1426.27" overflow="visible" transform="matrix(1 0 0 -1 0 1423.15)" width="489.84"><span class="ltx_foreignobject_container"><span class="ltx_foreignobject_content">
<span id="A5.SS5.p1.pic1.2" class="ltx_inline-block ltx_minipage ltx_align_bottom" style="width:35.4em;">
<span id="A5.SS5.p1.pic1.2.1" class="ltx_p"><span id="A5.SS5.p1.pic1.2.1.1" class="ltx_text ltx_font_typewriter" style="font-size:90%;--ltx-fg-color:#000000;"># Task Description

<br class="ltx_break">
<br class="ltx_break">The goal of this task is to carefully examine a given question and the corresponding response and identify any **cultural or linguistic errors** within each line in the response, based on the provided Error Taxonomy.

<br class="ltx_break">
<br class="ltx_break">Given a **target line** from the response, your task is to detect any erroneous parts within it, classify the error according to the taxonomy, and explain the reason behind the errors.

<br class="ltx_break">
<br class="ltx_break">
<br class="ltx_break">## Error Taxonomy

<br class="ltx_break"></span></span>
<span id="A5.I5" class="ltx_itemize" style="--ltx-enum-leftmargin:2em;">
<span id="A5.I5.i1" class="ltx_item" style="list-style-type:none;"><span class="ltx_tag ltx_tag_item">-</span> 
<span id="A5.I5.i1.p1" class="ltx_para">
<span id="A5.I5.i1.p1.1" class="ltx_p"><span id="A5.I5.i1.p1.1.1" class="ltx_text ltx_font_typewriter" style="font-size:90%;--ltx-fg-color:#000000;">**Explicit Linguistic Error**: Surface-level, mechanical language mistakes. This covers objective violations of language rules, including incorrect grammar, spelling errors, typos, literal translations that misuse vocabulary, or outputting text in the wrong language. These flaws are independent of social context.
</span></span>
</span></span>
<span id="A5.I5.i2" class="ltx_item" style="list-style-type:none;"><span class="ltx_tag ltx_tag_item">-</span> 
<span id="A5.I5.i2.p1" class="ltx_para">
<span id="A5.I5.i2.p1.1" class="ltx_p"><span id="A5.I5.i2.p1.1.1" class="ltx_text ltx_font_typewriter" style="font-size:90%;--ltx-fg-color:#000000;">**Implicit Linguistic Error**: Failures in tone, register, or sociolinguistic nuance. The text may be grammatically correct but reads unnaturally (e.g., ‘‘awkward phrasing’’), or completely misses the unspoken communication rules of the target language.
</span></span>
</span></span>
<span id="A5.I5.i3" class="ltx_item" style="list-style-type:none;"><span class="ltx_tag ltx_tag_item">-</span> 
<span id="A5.I5.i3.p1" class="ltx_para">
<span id="A5.I5.i3.p1.1" class="ltx_p"><span id="A5.I5.i3.p1.1.1" class="ltx_text ltx_font_typewriter" style="font-size:90%;--ltx-fg-color:#000000;">**Cultural Inaccuracy**: Objectively incorrect verifiable facts about a culture. Classify any factual errors regarding a specific country’s artifacts, geography, local ingredients, traditions, historical events, institutions, or demographic makeup here.
</span></span>
</span></span>
<span id="A5.I5.i4" class="ltx_item" style="list-style-type:none;"><span class="ltx_tag ltx_tag_item">-</span> 
<span id="A5.I5.i4.p1" class="ltx_para">
<span id="A5.I5.i4.p1.1" class="ltx_p"><span id="A5.I5.i4.p1.1.1" class="ltx_text ltx_font_typewriter" style="font-size:90%;--ltx-fg-color:#000000;">**Cultural Incoherence**: A contextual clash of cultural elements. The cultural elements mentioned are real, but combining them in the given setting, situation, or alongside other elements is jarring, awkward, or highly unnatural.
</span></span>
</span></span>
<span id="A5.I5.i5" class="ltx_item" style="list-style-type:none;"><span class="ltx_tag ltx_tag_item">-</span> 
<span id="A5.I5.i5.p1" class="ltx_para">
<span id="A5.I5.i5.p1.1" class="ltx_p"><span id="A5.I5.i5.p1.1.1" class="ltx_text ltx_font_typewriter" style="font-size:90%;--ltx-fg-color:#000000;">**Cultural Specificity Error**: Misrepresenting the boundaries of a cultural concept. This occurs when the model over-generalizes (applying a specific trait to an entire population via explicit bias/stereotyping), under-generalizes (treating a broad cultural norm as overly narrow), or conflates distinct regional variations into a single monolith.
</span></span>
</span></span>
<span id="A5.I5.i6" class="ltx_item" style="list-style-type:none;"><span class="ltx_tag ltx_tag_item">-</span> 
<span id="A5.I5.i6.p1" class="ltx_para">
<span id="A5.I5.i6.p1.1" class="ltx_p"><span id="A5.I5.i6.p1.1.1" class="ltx_text ltx_font_typewriter" style="font-size:90%;--ltx-fg-color:#000000;">**Cultural Connotation Error**: Mishandling the implicit symbolic weight or emotional resonance of a concept. This applies when the response fails to grasp deep-seated symbolic, spiritual, or sentimental meanings (e.g., treating a sacred object as a trivial commodity), or carries unintended negative baggage through subtle framing and word choice.
</span></span>
</span></span>
<span id="A5.I5.i7" class="ltx_item" style="list-style-type:none;"><span class="ltx_tag ltx_tag_item">-</span> 
<span id="A5.I5.i7.p1" class="ltx_para">
<span id="A5.I5.i7.p1.1" class="ltx_p"><span id="A5.I5.i7.p1.1.1" class="ltx_text ltx_font_typewriter" style="font-size:90%;--ltx-fg-color:#000000;">**Cultural Missingness**: The absence of critical, non-negotiable cultural context required for the response to be functionally or contextually complete. This applies only when the omission of specific traditions, norms, or nuances results in a ‘‘hollow’’ or ‘‘generic’’ output that fails to address the unique cultural identity of the subject.
</span></span>
</span></span>
</span>
<span id="A5.SS5.p1.pic1.2.2" class="ltx_p"><span id="A5.SS5.p1.pic1.2.2.1" class="ltx_text ltx_font_typewriter" style="font-size:90%;--ltx-fg-color:#000000;">## Output Format

<br class="ltx_break">
<br class="ltx_break">Output the result strictly as a JSON array.
</span></span>
<span id="A5.I6" class="ltx_itemize" style="--ltx-enum-leftmargin:2em;">
<span id="A5.I6.i1" class="ltx_item" style="list-style-type:none;"><span class="ltx_tag ltx_tag_item">-</span> 
<span id="A5.I6.i1.p1" class="ltx_para">
<span id="A5.I6.i1.p1.1" class="ltx_p"><span id="A5.I6.i1.p1.1.1" class="ltx_text ltx_font_typewriter" style="font-size:90%;--ltx-fg-color:#000000;">Each detected error must correspond to a valid, standalone JSON object within the array.
</span></span>
</span></span>
<span id="A5.I6.i2" class="ltx_item" style="list-style-type:none;"><span class="ltx_tag ltx_tag_item">-</span> 
<span id="A5.I6.i2.p1" class="ltx_para">
<span id="A5.I6.i2.p1.1" class="ltx_p"><span id="A5.I6.i2.p1.1.1" class="ltx_text ltx_font_typewriter" style="font-size:90%;--ltx-fg-color:#000000;">Each object must contain exactly these three keys:
</span></span>
<span id="A5.I6.i2.I1" class="ltx_enumerate">
<span id="A5.I6.i2.I0.i1" class="ltx_item" style="list-style-type:none;"><span class="ltx_tag ltx_tag_item">1.</span> 
<span id="A5.I6.i2.I0.i1.p1" class="ltx_para">
<span id="A5.I6.i2.I0.i1.p1.1" class="ltx_p"><span id="A5.I6.i2.I0.i1.p1.1.1" class="ltx_text ltx_font_typewriter" style="font-size:90%;--ltx-fg-color:#000000;">‘‘span’’: The specific text segment corresponding to the erroneous part (string).
</span></span>
</span></span>
<span id="A5.I6.i2.I0.i2" class="ltx_item" style="list-style-type:none;"><span class="ltx_tag ltx_tag_item">2.</span> 
<span id="A5.I6.i2.I0.i2.p1" class="ltx_para">
<span id="A5.I6.i2.I0.i2.p1.1" class="ltx_p"><span id="A5.I6.i2.I0.i2.p1.1.1" class="ltx_text ltx_font_typewriter" style="font-size:90%;--ltx-fg-color:#000000;">‘‘reason’’: An explanation of why this is an error (string).
</span></span>
</span></span>
<span id="A5.I6.i2.I0.i3" class="ltx_item" style="list-style-type:none;"><span class="ltx_tag ltx_tag_item">3.</span> 
<span id="A5.I6.i2.I0.i3.p1" class="ltx_para">
<span id="A5.I6.i2.I0.i3.p1.1" class="ltx_p"><span id="A5.I6.i2.I0.i3.p1.1.1" class="ltx_text ltx_font_typewriter" style="font-size:90%;--ltx-fg-color:#000000;">‘‘error_type’’: Must be exactly one of the seven categories listed in the Error Taxonomy above.
</span></span>
</span></span>
</span>
</span></span>
<span id="A5.I6.i3" class="ltx_item" style="list-style-type:none;"><span class="ltx_tag ltx_tag_item">-</span> 
<span id="A5.I6.i3.p1" class="ltx_para">
<span id="A5.I6.i3.p1.1" class="ltx_p"><span id="A5.I6.i3.p1.1.1" class="ltx_text ltx_font_typewriter" style="font-size:90%;--ltx-fg-color:#000000;">If multiple errors are found, return an array containing all identified error objects.
</span></span>
</span></span>
<span id="A5.I6.i4" class="ltx_item" style="list-style-type:none;"><span class="ltx_tag ltx_tag_item">-</span> 
<span id="A5.I6.i4.p1" class="ltx_para">
<span id="A5.I6.i4.p1.1" class="ltx_p"><span id="A5.I6.i4.p1.1.1" class="ltx_text ltx_font_typewriter" style="font-size:90%;--ltx-fg-color:#000000;">If no errors are found, return an empty array ([]).
</span></span>
</span></span>
<span id="A5.I6.i5" class="ltx_item" style="list-style-type:none;"><span class="ltx_tag ltx_tag_item">-</span> 
<span id="A5.I6.i5.p1" class="ltx_para">
<span id="A5.I6.i5.p1.1" class="ltx_p"><span id="A5.I6.i5.p1.1.1" class="ltx_text ltx_font_typewriter" style="font-size:90%;--ltx-fg-color:#000000;">Do not use Markdown code blocks (e.g., </span><code id="A5.I6.i5.p1.1.2" class="ltx_verbatim ltx_font_typewriter" style="font-size:90%;--ltx-fg-color:#000000;">```</code><span id="A5.I6.i5.p1.1.3" class="ltx_text ltx_font_typewriter" style="font-size:90%;--ltx-fg-color:#000000;">json).
</span></span>
</span></span>
</span>
<span id="A5.SS5.p1.pic1.2.3" class="ltx_p"><span id="A5.SS5.p1.pic1.2.3.1" class="ltx_text ltx_font_typewriter" style="font-size:90%;--ltx-fg-color:#000000;"># Examples

<br class="ltx_break">
<br class="ltx_break">&gt; Example 1

<br class="ltx_break">Question: {query_1}

<br class="ltx_break">Target Line: {paragraph_1}

<br class="ltx_break">Answer:
{error_list_1}

<br class="ltx_break">
<br class="ltx_break">&gt; Example 2

<br class="ltx_break">Question: {query_2}

<br class="ltx_break">Target Line: {paragraph_2}

<br class="ltx_break">Answer:
{error_list_2}

<br class="ltx_break">
<br class="ltx_break">...

<br class="ltx_break">
<br class="ltx_break">
<br class="ltx_break"># Input

<br class="ltx_break">
<br class="ltx_break">## Question

<br class="ltx_break">{query}

<br class="ltx_break">
<br class="ltx_break">## Response

<br class="ltx_break">{response}

<br class="ltx_break">
<br class="ltx_break">## Target Line

<br class="ltx_break">{paragraph}
</span></span>
</span></span></span></foreignobject></g></g></svg>