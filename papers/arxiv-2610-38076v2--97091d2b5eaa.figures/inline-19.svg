<span id="A6.SSx4.SSS0.Px2.p4.pic1.2" class="ltx_inline-block ltx_minipage ltx_align_bottom" style="width:42.56em;">
<span id="A6.SSx4.SSS0.Px2.p4.pic1.2.1" class="ltx_p ltx_align_left"><span id="A6.SSx4.SSS0.Px2.p4.pic1.2.1.1" class="ltx_text ltx_font_typewriter" style="--ltx-fg-color:#000000;">Given a question, its correct answer, and a model’s response, rate how accurately</span></span>
<span id="A6.SSx4.SSS0.Px2.p4.pic1.2.2" class="ltx_p ltx_align_left"><span id="A6.SSx4.SSS0.Px2.p4.pic1.2.2.1" class="ltx_text ltx_font_typewriter" style="--ltx-fg-color:#000000;">the model’s response answers the question. The response should include all key</span></span>
<span id="A6.SSx4.SSS0.Px2.p4.pic1.2.3" class="ltx_p ltx_align_left"><span id="A6.SSx4.SSS0.Px2.p4.pic1.2.3.1" class="ltx_text ltx_font_typewriter" style="--ltx-fg-color:#000000;">information from the correct answer, especially specific details like numbers and</span></span>
<span id="A6.SSx4.SSS0.Px2.p4.pic1.2.4" class="ltx_p ltx_align_left"><span id="A6.SSx4.SSS0.Px2.p4.pic1.2.4.1" class="ltx_text ltx_font_typewriter" style="--ltx-fg-color:#000000;">dates. The response should not contain contradictions. Additional information beyond</span></span>
<span id="A6.SSx4.SSS0.Px2.p4.pic1.2.5" class="ltx_p ltx_align_left"><span id="A6.SSx4.SSS0.Px2.p4.pic1.2.5.1" class="ltx_text ltx_font_typewriter" style="--ltx-fg-color:#000000;">the correct answer is acceptable. Treat hypothetical statements as definitive</span></span>
<span id="A6.SSx4.SSS0.Px2.p4.pic1.2.6" class="ltx_p ltx_align_left"><span id="A6.SSx4.SSS0.Px2.p4.pic1.2.6.1" class="ltx_text ltx_font_typewriter" style="--ltx-fg-color:#000000;">answers.</span></span>
<span id="A6.SSx4.SSS0.Px2.p4.pic1.2.7" class="ltx_p ltx_align_left"><span id="A6.SSx4.SSS0.Px2.p4.pic1.2.7.1" class="ltx_text ltx_font_typewriter" style="--ltx-fg-color:#000000;">Question: conversation</span></span>
<span id="A6.SSx4.SSS0.Px2.p4.pic1.2.8" class="ltx_p ltx_align_left"><span id="A6.SSx4.SSS0.Px2.p4.pic1.2.8.1" class="ltx_text ltx_font_typewriter" style="--ltx-fg-color:#000000;">Correct answer: reference</span></span>
<span id="A6.SSx4.SSS0.Px2.p4.pic1.2.9" class="ltx_p ltx_align_left"><span id="A6.SSx4.SSS0.Px2.p4.pic1.2.9.1" class="ltx_text ltx_font_typewriter" style="--ltx-fg-color:#000000;">Model’s response: prediction</span></span>
<span id="A6.SSx4.SSS0.Px2.p4.pic1.2.10" class="ltx_p ltx_align_left"><span id="A6.SSx4.SSS0.Px2.p4.pic1.2.10.1" class="ltx_text ltx_font_typewriter" style="--ltx-fg-color:#000000;">5 = Fully accurate; 4 = Mostly accurate, minor gaps; 3 = Partially accurate;</span></span>
<span id="A6.SSx4.SSS0.Px2.p4.pic1.2.11" class="ltx_p ltx_align_left"><span id="A6.SSx4.SSS0.Px2.p4.pic1.2.11.1" class="ltx_text ltx_font_typewriter" style="--ltx-fg-color:#000000;">2 = Mostly inaccurate; 1 = Inaccurate or contradictory</span></span>
<span id="A6.SSx4.SSS0.Px2.p4.pic1.2.12" class="ltx_p ltx_align_left"><span id="A6.SSx4.SSS0.Px2.p4.pic1.2.12.1" class="ltx_text ltx_font_typewriter" style="--ltx-fg-color:#000000;">Score (1-5):</span></span>
