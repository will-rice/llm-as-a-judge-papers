<svg id="S3.SS2.p3.pic1" class="ltx_picture" height="163.82" overflow="visible" version="1.1" viewbox="0 0 477.38 163.82" width="477.38"><g style="--ltx-stroke-color:#000000;--ltx-fill-color:#000000;" fill="#000000" stroke="#000000" stroke-width="0.4pt" transform="translate(0,163.82) matrix(1 0 0 -1 0 0)"><g style="--ltx-fill-color:#ABB2BD;" fill="#ABB2BD" fill-opacity="1.0"><path style="stroke:none" d="M 0 4.98 L 0 158.84 C 0 161.59 2.23 163.82 4.98 163.82 L 472.4 163.82 C 475.15 163.82 477.38 161.59 477.38 158.84 L 477.38 4.98 C 477.38 2.23 475.15 0 472.4 0 L 4.98 0 C 2.23 0 0 2.23 0 4.98 Z" /></g><g style="--ltx-fill-color:#F8F8F9;" fill="#F8F8F9" fill-opacity="1.0"><path style="stroke:none" d="M 0.83 4.98 L 0.83 158.84 C 0.83 161.13 2.69 162.99 4.98 162.99 L 472.4 162.99 C 474.69 162.99 476.55 161.13 476.55 158.84 L 476.55 4.98 C 476.55 2.69 474.69 0.83 472.4 0.83 L 4.98 0.83 C 2.69 0.83 0.83 2.69 0.83 4.98 Z" /></g><g fill-opacity="1.0" transform="matrix(1.0 0.0 0.0 1.0 13.07 12.72)"><foreignobject style="--ltx-fo-width:35.25em;--ltx-fo-height:10.23em;--ltx-fo-depth:0.23em;font-size:10pt;" height="144.6" overflow="visible" transform="matrix(1 0 0 -1 0 141.49)" width="487.76"><span class="ltx_foreignobject_container"><span class="ltx_foreignobject_content">
<span id="S3.SS2.p3.pic1.1" class="ltx_inline-block ltx_minipage ltx_align_bottom" style="width:35.25em;">
<span id="S3.SS2.p3.pic1.1.1" class="ltx_p"><span id="S3.SS2.p3.pic1.1.1.1" class="ltx_text ltx_font_bold" style="font-size:90%;--ltx-fg-color:#000000;">Anchor Selection.<span id="S3.SS2.p3.pic1.1.1.1.1" class="ltx_text ltx_font_medium"> Let <math id="S3.SS2.p3.pic1.m1" class="ltx_Math" alttext="Q(e)" display="inline" intent=":literal"><semantics><mrow><mi style="--ltx-fg-color:#000000;" mathcolor="#000000">Q</mi><mo>⁡</mo><mrow><mo style="--ltx-fg-color:#000000;" mathcolor="#000000" stretchy="false">(</mo><mi style="--ltx-fg-color:#000000;" mathcolor="#000000">e</mi><mo style="--ltx-fg-color:#000000;" mathcolor="#000000" stretchy="false">)</mo></mrow></mrow><annotation encoding="application/x-tex">Q(e)</annotation></semantics></math> be evaluator <math id="S3.SS2.p3.pic1.m2" class="ltx_Math" alttext="e" display="inline" intent=":literal"><semantics><mi style="--ltx-fg-color:#000000;" mathcolor="#000000">e</mi><annotation encoding="application/x-tex">e</annotation></semantics></math>’s exact score on the fixed anchor, and <math id="S3.SS2.p3.pic1.m3" class="ltx_Math" alttext="\mathcal{E}" display="inline" intent=":literal"><semantics><mi style="--ltx-fg-color:#000000;" class="ltx_font_mathcaligraphic" mathcolor="#000000">ℰ</mi><annotation encoding="application/x-tex">\mathcal{E}</annotation></semantics></math> a finite candidate set containing the incumbent <math id="S3.SS2.p3.pic1.m4" class="ltx_Math" alttext="e_{\mathrm{old}}" display="inline" intent=":literal"><semantics><msub><mi style="--ltx-fg-color:#000000;" mathcolor="#000000">e</mi><mi style="--ltx-fg-color:#000000;" mathcolor="#000000">old</mi></msub><annotation encoding="application/x-tex">e_{\mathrm{old}}</annotation></semantics></math>. Exact comparison on the full validation set raises <math id="S3.SS2.p3.pic1.m5" class="ltx_Math" alttext="Q" display="inline" intent=":literal"><semantics><mi style="--ltx-fg-color:#000000;" mathcolor="#000000">Q</mi><annotation encoding="application/x-tex">Q</annotation></semantics></math> at every replacement (<a href="#Thmproposition7" title="Proposition 7 (Exact replacement). ‣ F.6.1 Exact validation ‣ F.6 Evaluator Improvement ‣ Appendix F Theory" class="ltx_ref"><span class="ltx_text ltx_ref_tag">Prop.</span> <span class="ltx_text ltx_ref_tag">7</span></a>). If each candidate’s estimate is within <math id="S3.SS2.p3.pic1.m6" class="ltx_Math" alttext="\eta" display="inline" intent=":literal"><semantics><mi style="--ltx-fg-color:#000000;" mathcolor="#000000">η</mi><annotation encoding="application/x-tex">\eta</annotation></semantics></math> of <math id="S3.SS2.p3.pic1.m7" class="ltx_Math" alttext="Q(e)" display="inline" intent=":literal"><semantics><mrow><mi style="--ltx-fg-color:#000000;" mathcolor="#000000">Q</mi><mo>⁡</mo><mrow><mo style="--ltx-fg-color:#000000;" mathcolor="#000000" stretchy="false">(</mo><mi style="--ltx-fg-color:#000000;" mathcolor="#000000">e</mi><mo style="--ltx-fg-color:#000000;" mathcolor="#000000" stretchy="false">)</mo></mrow></mrow><annotation encoding="application/x-tex">Q(e)</annotation></semantics></math> and <math id="S3.SS2.p3.pic1.m8" class="ltx_Math" alttext="e_{\mathrm{new}}" display="inline" intent=":literal"><semantics><msub><mi style="--ltx-fg-color:#000000;" mathcolor="#000000">e</mi><mi style="--ltx-fg-color:#000000;" mathcolor="#000000">new</mi></msub><annotation encoding="application/x-tex">e_{\mathrm{new}}</annotation></semantics></math> has the largest estimate, then</span></span></span>
<span id="S3.Ex3" class="ltx_equation ltx_eqn_table">

<span><span class="ltx_equation ltx_eqn_row ltx_align_baseline">
<span class="ltx_eqn_cell ltx_eqn_center_padleft"></span>
<span class="ltx_eqn_cell ltx_align_center"><math id="S3.Ex3.m1" class="ltx_Math" alttext="Q(e_{\mathrm{new}})\geq\max_{e\in\mathcal{E}}Q(e)-2\eta\geq Q(e_{\mathrm{old}})-2\eta." display="block" intent=":literal"><semantics><mrow><mrow><mrow><mi style="--ltx-fg-color:#000000;" mathcolor="#000000" mathsize="0.900em">Q</mi><mo>⁡</mo><mrow><mo style="--ltx-fg-color:#000000;" mathcolor="#000000" maxsize="0.900em" minsize="0.900em">(</mo><msub><mi style="--ltx-fg-color:#000000;" mathcolor="#000000" mathsize="0.900em">e</mi><mi style="--ltx-fg-color:#000000;" mathcolor="#000000" mathsize="0.900em">new</mi></msub><mo style="--ltx-fg-color:#000000;" mathcolor="#000000" maxsize="0.900em" minsize="0.900em">)</mo></mrow></mrow><mo style="--ltx-fg-color:#000000;" mathcolor="#000000" mathsize="0.900em">≥</mo><mrow><mrow><munder><mi style="--ltx-fg-color:#000000;" mathcolor="#000000" mathsize="0.900em">max</mi><mrow><mi style="--ltx-fg-color:#000000;" mathcolor="#000000" mathsize="0.900em">e</mi><mo style="--ltx-fg-color:#000000;" mathcolor="#000000" mathsize="0.900em">∈</mo><mi style="--ltx-fg-color:#000000;" class="ltx_font_mathcaligraphic" mathcolor="#000000" mathsize="0.900em">ℰ</mi></mrow></munder><mo lspace="0.167em">⁡</mo><mrow><mi style="--ltx-fg-color:#000000;" mathcolor="#000000" mathsize="0.900em">Q</mi><mo>⁡</mo><mrow><mo style="--ltx-fg-color:#000000;" mathcolor="#000000" maxsize="0.900em" minsize="0.900em">(</mo><mi style="--ltx-fg-color:#000000;" mathcolor="#000000" mathsize="0.900em">e</mi><mo style="--ltx-fg-color:#000000;" mathcolor="#000000" maxsize="0.900em" minsize="0.900em">)</mo></mrow></mrow></mrow><mo style="--ltx-fg-color:#000000;" mathcolor="#000000" mathsize="0.900em">−</mo><mrow><mn style="--ltx-fg-color:#000000;" mathcolor="#000000" mathsize="0.900em">2</mn><mo lspace="0em" rspace="0em">​</mo><mi style="--ltx-fg-color:#000000;" mathcolor="#000000" mathsize="0.900em">η</mi></mrow></mrow><mo style="--ltx-fg-color:#000000;" mathcolor="#000000" mathsize="0.900em">≥</mo><mrow><mrow><mi style="--ltx-fg-color:#000000;" mathcolor="#000000" mathsize="0.900em">Q</mi><mo>⁡</mo><mrow><mo style="--ltx-fg-color:#000000;" mathcolor="#000000" maxsize="0.900em" minsize="0.900em">(</mo><msub><mi style="--ltx-fg-color:#000000;" mathcolor="#000000" mathsize="0.900em">e</mi><mi style="--ltx-fg-color:#000000;" mathcolor="#000000" mathsize="0.900em">old</mi></msub><mo style="--ltx-fg-color:#000000;" mathcolor="#000000" maxsize="0.900em" minsize="0.900em">)</mo></mrow></mrow><mo style="--ltx-fg-color:#000000;" mathcolor="#000000" mathsize="0.900em">−</mo><mrow><mn style="--ltx-fg-color:#000000;" mathcolor="#000000" mathsize="0.900em">2</mn><mo lspace="0em" rspace="0em">​</mo><mi style="--ltx-fg-color:#000000;" mathcolor="#000000" mathsize="0.900em">η</mi></mrow></mrow></mrow><mo style="--ltx-fg-color:#000000;" lspace="0em" mathcolor="#000000" mathsize="0.900em">.</mo></mrow><annotation encoding="application/x-tex">Q(e_{\mathrm{new}})\geq\max_{e\in\mathcal{E}}Q(e)-2\eta\geq Q(e_{\mathrm{old}})-2\eta.</annotation></semantics></math></span>
<span class="ltx_eqn_cell ltx_eqn_center_padright"></span></span></span>
</span>
<span id="S3.SS2.p3.pic1.1.2" class="ltx_p"><span id="S3.SS2.p3.pic1.1.2.1" class="ltx_text" style="font-size:90%;--ltx-fg-color:#000000;">Each of the two score approximations contributes at most <math id="S3.SS2.p3.pic1.m9" class="ltx_Math" alttext="\eta" display="inline" intent=":literal"><semantics><mi style="--ltx-fg-color:#000000;" mathcolor="#000000">η</mi><annotation encoding="application/x-tex">\eta</annotation></semantics></math> to the comparison error (<a href="#Thmproposition8" title="Proposition 8 (Comparison error). ‣ F.6.2 Best-belief approximation ‣ F.6 Evaluator Improvement ‣ Appendix F Theory" class="ltx_ref"><span class="ltx_text ltx_ref_tag">Prop.</span> <span class="ltx_text ltx_ref_tag">8</span></a>).</span></span>
</span></span></span></foreignobject></g></g></svg>