<span id="A9.p5.pic1.2.1" class="ltx_p"><span id="A9.p5.pic1.2.1.1" class="ltx_text" style="--ltx-fg-color:#000000;">The same three tools, in the order (1) <span id="A9.p5.pic1.2.1.1.1" class="ltx_text ltx_font_typewriter">calculate_amount_based_deviation</span>, (2) <span id="A9.p5.pic1.2.1.1.2" class="ltx_text ltx_font_typewriter">calculate_temporal_transaction_deviation</span>, (3) <span id="A9.p5.pic1.2.1.1.3" class="ltx_text ltx_font_typewriter">compute_composite_behavior_anomaly_score</span>: the first two calls are swapped relative to the reference, and the third call is emitted immediately with symbolic placeholder arguments (<span id="A9.p5.pic1.2.1.1.4" class="ltx_text ltx_font_typewriter">{% output of function with id 2 %}</span>) rather than waiting for the first two to resolve.</span></span>
