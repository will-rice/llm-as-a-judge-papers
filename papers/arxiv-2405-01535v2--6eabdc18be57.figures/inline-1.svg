<svg id="A8.p1.pic1" class="ltx_picture" height="427.3" overflow="visible" version="1.1" viewbox="0 0 653.15 427.3" width="653.15"><g style="--ltx-stroke-color:#000000;--ltx-fill-color:#000000;" fill="#000000" stroke="#000000" stroke-width="0.4pt" transform="translate(0,427.3) matrix(1 0 0 -1 0 0)"><g style="--ltx-fill-color:#8CFF8C;" fill="#8CFF8C" fill-opacity="1.0"><path style="stroke:none" d="M 0 0 L 0 427.3 L 653.15 427.3 L 653.15 0 Z" /></g><g style="--ltx-fill-color:#FFFFFF;" fill="#FFFFFF" fill-opacity="1.0"><path style="stroke:none" d="M 1.97 1.97 L 1.97 403.19 L 651.18 403.19 L 651.18 1.97 Z" /></g><g fill-opacity="1.0" transform="matrix(1.0 0.0 0.0 1.0 21.65 411.78)"><foreignobject style="--ltx-fo-width:38.32em;--ltx-fo-height:0.69em;--ltx-fo-depth:0.19em;font-size:10pt;" height="12.3" overflow="visible" transform="matrix(1 0 0 -1 0 9.61)" width="530.24"><span class="ltx_foreignobject_container"><span class="ltx_foreignobject_content">
<span id="A8.p1.pic1.1" class="ltx_inline-block ltx_minipage ltx_align_bottom" style="width:38.32em;">
<span id="A8.p1.pic1.1.1" class="ltx_p"><span id="A8.p1.pic1.1.1.1" class="ltx_text ltx_font_bold" style="--ltx-fg-color:#000000;">Prompt for Generating Verbal Feedback in Pairwise Ranking</span></span>
</span></span></span></foreignobject></g><g fill-opacity="1.0" transform="matrix(1.0 0.0 0.0 1.0 21.65 16.47)"><foreignobject style="--ltx-fo-width:44.07em;--ltx-fo-height:27.09em;--ltx-fo-depth:0.19em;font-size:10pt;" height="377.6" overflow="visible" transform="matrix(1 0 0 -1 0 374.91)" width="609.8"><span class="ltx_foreignobject_container"><span class="ltx_foreignobject_content">
<span id="A8.p1.pic1.2" class="ltx_inline-block ltx_minipage ltx_align_bottom" style="width:44.07em;">
<span id="A8.p1.pic1.2.1" class="ltx_p"><span id="A8.p1.pic1.2.1.1" class="ltx_text" style="--ltx-fg-color:#000000;">###Task Description:</span></span>
<span id="A8.p1.pic1.2.2" class="ltx_p"><span id="A8.p1.pic1.2.2.1" class="ltx_text" style="--ltx-fg-color:#000000;">An instruction (might include an Input inside it), two responses to evaluate (denoted as Response A and Response B), a reference answer, and a score rubric representing a evaluation criteria are given.</span></span>
<span id="A8.p1.pic1.2.3" class="ltx_p"><span id="A8.p1.pic1.2.3.1" class="ltx_text" style="--ltx-fg-color:#000000;">1. Write a detailed feedback explaining why {sub_str}, focusing strictly on the aspects highlighted in the evaluation criteria.</span></span>
<span id="A8.p1.pic1.2.4" class="ltx_p"><span id="A8.p1.pic1.2.4.1" class="ltx_text" style="--ltx-fg-color:#000000;">2. While writing the feedback, make comparisons between Response A, Response B, and Reference Answer. Instead of examining Response A and Response B separately, go straight to the point and mention about the commonalities and differences between them.</span></span>
<span id="A8.p1.pic1.2.5" class="ltx_p"><span id="A8.p1.pic1.2.5.1" class="ltx_text" style="--ltx-fg-color:#000000;">3. While writing the feedback, do not start by mentioning {sub_str} in the first sentence. Instead, try to write a reasoning process that delves into the commonalities and differences of the two responses and mention {sub_str} at the last part of your justification.</span></span>
<span id="A8.p1.pic1.2.6" class="ltx_p"><span id="A8.p1.pic1.2.6.1" class="ltx_text" style="--ltx-fg-color:#000000;">4. Within the feedback, do not explicitly mention about the reference answer. For instance, do not use phrases like &quot;Compared to the reference answer&quot;. Assume that you inherently know the reference answer which could be used to determine details that are not present in both responses under assessment.</span></span>
<span id="A8.p1.pic1.2.7" class="ltx_p"><span id="A8.p1.pic1.2.7.1" class="ltx_text" style="--ltx-fg-color:#000000;">5. Please do not generate any other opening, closing, and explanations. Just write the feedback.</span></span>
<span id="A8.p1.pic1.2.8" class="ltx_p"><span id="A8.p1.pic1.2.8.1" class="ltx_text" style="--ltx-fg-color:#000000;">6. Within the feedback, generate a string phrase &quot;[END]&quot; after you are finished.</span></span>
<span id="A8.p1.pic1.2.9" class="ltx_p"><span id="A8.p1.pic1.2.9.1" class="ltx_text" style="--ltx-fg-color:#000000;">###Instruction: {instruction}</span></span>
<span id="A8.p1.pic1.2.10" class="ltx_p"><span id="A8.p1.pic1.2.10.1" class="ltx_text" style="--ltx-fg-color:#000000;">###Response A: {response_A}</span></span>
<span id="A8.p1.pic1.2.11" class="ltx_p"><span id="A8.p1.pic1.2.11.1" class="ltx_text" style="--ltx-fg-color:#000000;">###Response B: {response_B}</span></span>
<span id="A8.p1.pic1.2.12" class="ltx_p"><span id="A8.p1.pic1.2.12.1" class="ltx_text" style="--ltx-fg-color:#000000;">###Reference Answer: {reference_answer}</span></span>
<span id="A8.p1.pic1.2.13" class="ltx_p"><span id="A8.p1.pic1.2.13.1" class="ltx_text" style="--ltx-fg-color:#000000;">###Score Rubric: {criteria}</span></span>
<span id="A8.p1.pic1.2.14" class="ltx_p"><span id="A8.p1.pic1.2.14.1" class="ltx_text" style="--ltx-fg-color:#000000;">###Feedback:</span></span>
</span></span></span></foreignobject></g></g></svg>