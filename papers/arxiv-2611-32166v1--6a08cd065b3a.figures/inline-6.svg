<svg id="A2.F8.pic1" class="ltx_picture ltx_figure_panel" height="672.76" overflow="visible" version="1.1" viewbox="0 0 653.15 672.76" width="653.15"><g style="--ltx-stroke-color:#000000;--ltx-fill-color:#000000;" fill="#000000" stroke="#000000" stroke-width="0.4pt" transform="translate(0,672.76) matrix(1 0 0 -1 0 0)"><g style="--ltx-fill-color:#6464B4;" fill="#6464B4" fill-opacity="1.0"><path style="stroke:none" d="M 0 5.91 L 0 666.86 C 0 670.12 2.64 672.76 5.91 672.76 L 647.24 672.76 C 650.51 672.76 653.15 670.12 653.15 666.86 L 653.15 5.91 C 653.15 2.64 650.51 0 647.24 0 L 5.91 0 C 2.64 0 0 2.64 0 5.91 Z" /></g><g style="--ltx-fill-color:#F5F5FA;" fill="#F5F5FA" fill-opacity="1.0"><path style="stroke:none" d="M 1.97 5.91 L 1.97 647.11 L 651.18 647.11 L 651.18 5.91 C 651.18 3.73 649.42 1.97 647.24 1.97 L 5.91 1.97 C 3.73 1.97 1.97 3.73 1.97 5.91 Z" /></g><g fill-opacity="1.0" transform="matrix(1.0 0.0 0.0 1.0 12.82 656.48)"><foreignobject style="--ltx-fo-width:39.44em;--ltx-fo-height:0.75em;--ltx-fo-depth:0.25em;font-size:10pt;" height="13.84" overflow="visible" transform="matrix(1 0 0 -1 0 10.38)" width="545.74"><span class="ltx_foreignobject_container"><span class="ltx_foreignobject_content">
<span id="A2.F8.pic1.1" class="ltx_inline-block ltx_minipage ltx_align_bottom" style="width:39.44em;">
<span id="A2.F8.pic1.1.1" class="ltx_p"><span id="A2.F8.pic1.1.1.1" class="ltx_text ltx_font_bold" style="--ltx-fg-color:#FFFFFF;">Teacher Stage 2: Rubric (Response Isolation)</span></span>
</span></span></span></foreignobject></g><g fill-opacity="1.0" transform="matrix(1.0 0.0 0.0 1.0 12.82 16.28)"><foreignobject style="--ltx-fo-width:43.19em;--ltx-fo-height:44.81em;--ltx-fo-depth:0.25em;font-size:10pt;" height="623.44" overflow="visible" transform="matrix(1 0 0 -1 0 619.98)" width="597.63"><span class="ltx_foreignobject_container"><span class="ltx_foreignobject_content">
<span id="A2.F8.pic1.2" class="ltx_inline-block ltx_minipage ltx_align_bottom" style="width:43.19em;">
<span id="A2.F8.pic1.2.1" class="ltx_p"><span id="A2.F8.pic1.2.1.1" class="ltx_text" style="--ltx-fg-color:#000000;">You write an evaluation rubric for one instruction, derived ONLY from the difference list supplied below. You have not seen the responses and must not imagine their content.</span></span>
<span id="A2.F8.pic1.2.2" class="ltx_p"><span id="A2.F8.pic1.2.2.1" class="ltx_text ltx_font_bold" style="--ltx-fg-color:#000000;">Rules<span id="A2.F8.pic1.2.2.1.1" class="ltx_text ltx_font_medium">
1. Write 2 to 5 hard rules. Fewer is better: every rule must earn its place.
2. Each hard rule must be objective and atomically verifiable—a single reader could apply it to one response alone and answer pass or fail.
3. Each hard rule must come from a difference marked “material”. Set “from_difference” to that difference’s id. Do not write a rule whose from_difference is immaterial or absent.
4. Each hard rule must quote the instruction that requires it, verbatim, in “instruction_anchor”. If no excerpt of the instruction supports the rule, do not write the rule. Inventing requirements the instruction never makes is the single worst failure here.
5. Each hard rule gets a “priority”: the rung of the ladder it instantiates.
6. Answer-agnostic. Forbidden:</span></span></span>
<span id="A2.I3" class="ltx_itemize ltx_leftmargin_flush">
<span id="A2.I3.i1" class="ltx_item" style="list-style-type:none;"><span class="ltx_tag ltx_tag_item">•</span> 
<span id="A2.I3.i1.p1" class="ltx_para">
<span id="A2.I3.i1.p1.1" class="ltx_p"><span id="A2.I3.i1.p1.1.1" class="ltx_text" style="--ltx-fg-color:#000000;">naming the correct answer, result, or solution method</span></span>
</span></span>
<span id="A2.I3.i2" class="ltx_item" style="list-style-type:none;"><span class="ltx_tag ltx_tag_item">•</span> 
<span id="A2.I3.i2.p1" class="ltx_para">
<span id="A2.I3.i2.p1.1" class="ltx_p"><span id="A2.I3.i2.p1.1.1" class="ltx_text" style="--ltx-fg-color:#000000;">pointing at the place where one response happens to be right or wrong</span></span>
</span></span>
<span id="A2.I3.i3" class="ltx_item" style="list-style-type:none;"><span class="ltx_tag ltx_tag_item">•</span> 
<span id="A2.I3.i3.p1" class="ltx_para">
<span id="A2.I3.i3.p1.1" class="ltx_p"><span id="A2.I3.i3.p1.1.1" class="ltx_text" style="--ltx-fg-color:#000000;">any mention of “Response A”, “Response B”, “Answer A”, or which side is better</span></span>
</span></span>
</span>
<span id="A2.F8.pic1.2.3" class="ltx_p"><span id="A2.F8.pic1.2.3.1" class="ltx_text" style="--ltx-fg-color:#000000;">Bad: “Correct calculation of C’s time using (remaining work) / (C’s rate).”
<br class="ltx_break">Good: “Computes the time for the final worker from the work that remains, not the whole job.”
7. Do not reward length or decorative formatting unless the instruction asks for a length, a format, or a structure.
8. Never write a blanket rule forbidding refusal; a rule about refusal must be conditioned on what the request actually asks for.
9. Add at most 2 principles, and only for genuinely subjective residue that no hard rule can cover. If hard rules suffice, write none.</span></span>
<span id="A2.F8.pic1.2.4" class="ltx_p"><span id="A2.F8.pic1.2.4.1" class="ltx_text ltx_font_bold" style="--ltx-fg-color:#000000;">Priority ladder<span id="A2.F8.pic1.2.4.1.1" class="ltx_text"></span></span></span>
<span id="A2.I4" class="ltx_itemize ltx_leftmargin_flush">
<span id="A2.I4.i1" class="ltx_item" style="list-style-type:none;"><span class="ltx_tag ltx_tag_item">•</span> 
<span id="A2.I4.i1.p1" class="ltx_para">
<span id="A2.I4.i1.p1.1" class="ltx_p"><span id="A2.I4.i1.p1.1.1" class="ltx_text" style="--ltx-fg-color:#000000;">1 = factual accuracy and correctness</span></span>
</span></span>
<span id="A2.I4.i2" class="ltx_item" style="list-style-type:none;"><span class="ltx_tag ltx_tag_item">•</span> 
<span id="A2.I4.i2.p1" class="ltx_para">
<span id="A2.I4.i2.p1.1" class="ltx_p"><span id="A2.I4.i2.p1.1.1" class="ltx_text" style="--ltx-fg-color:#000000;">2 = instruction following and task completion</span></span>
</span></span>
<span id="A2.I4.i3" class="ltx_item" style="list-style-type:none;"><span class="ltx_tag ltx_tag_item">•</span> 
<span id="A2.I4.i3.p1" class="ltx_para">
<span id="A2.I4.i3.p1.1" class="ltx_p"><span id="A2.I4.i3.p1.1.1" class="ltx_text" style="--ltx-fg-color:#000000;">3 = relevance and completeness</span></span>
</span></span>
<span id="A2.I4.i4" class="ltx_item" style="list-style-type:none;"><span class="ltx_tag ltx_tag_item">•</span> 
<span id="A2.I4.i4.p1" class="ltx_para">
<span id="A2.I4.i4.p1.1" class="ltx_p"><span id="A2.I4.i4.p1.1.1" class="ltx_text" style="--ltx-fg-color:#000000;">4 = clarity and concision</span></span>
</span></span>
<span id="A2.I4.i5" class="ltx_item" style="list-style-type:none;"><span class="ltx_tag ltx_tag_item">•</span> 
<span id="A2.I4.i5.p1" class="ltx_para">
<span id="A2.I4.i5.p1.1" class="ltx_p"><span id="A2.I4.i5.p1.1.1" class="ltx_text" style="--ltx-fg-color:#000000;">5 = safety and policy alignment</span></span>
</span></span>
<span id="A2.I4.i6" class="ltx_item" style="list-style-type:none;"><span class="ltx_tag ltx_tag_item">•</span> 
<span id="A2.I4.i6.p1" class="ltx_para">
<span id="A2.I4.i6.p1.1" class="ltx_p"><span id="A2.I4.i6.p1.1.1" class="ltx_text" style="--ltx-fg-color:#000000;">6 = creativity, only when the instruction is open-ended</span></span>
</span></span>
</span>
<span id="A2.F8.pic1.2.5" class="ltx_p"><span id="A2.F8.pic1.2.5.1" class="ltx_text ltx_font_bold" style="--ltx-fg-color:#000000;">Output: strict JSON, nothing else<span id="A2.F8.pic1.2.5.1.1" class="ltx_text"></span></span></span><pre id="A2.F8.pic1.2.6" class="ltx_verbatim ltx_font_typewriter" style="--ltx-fg-color:#000000;">{
  &quot;hard_rules&quot;: [
    {
      &quot;rule_id&quot;: 1,
      &quot;type&quot;: &quot;must&quot;,
      &quot;criterion&quot;: &quot;what a good response achieves or avoids&quot;,
      &quot;test&quot;: &quot;a concrete procedure runnable on a single response&quot;,
      &quot;from_difference&quot;: 1,
      &quot;instruction_anchor&quot;: &quot;verbatim excerpt from the instruction&quot;,
      &quot;priority&quot;: 2
    }
  ],
  &quot;principles&quot;: [
    {&quot;principle_id&quot;: 1, &quot;description&quot;: &quot;...&quot;, &quot;priority&quot;: 4}
  ]
}
</pre>
</span></span></span></foreignobject></g></g></svg>