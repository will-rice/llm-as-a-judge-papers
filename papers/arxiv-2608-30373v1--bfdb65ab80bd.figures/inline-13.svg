<span id="A1.SS3.p1.pic1.p7.1" class="ltx_p">[ESSAY_RUBRIC]</span>
</span></span></span></span>
<span id="A1.SS3.p1.pic1.2.8" class="ltx_p" style="width:459.7pt;"><span id="A1.SS3.p1.pic1.2.8.1" class="ltx_text ltx_verbatim ltx_font_typewriter ltx_inline-block" style="width:459.7pt;--ltx-fg-color:#000000;"><span id="A1.SS3.p1.pic1.2.8.1.1" class="ltx_inline-logical-block ltx_parbox ltx_pruned_first ltx_align_top" style="width:459.7pt;"></span></span></span>
<span id="A1.SS3.p1.pic1.2.9" class="ltx_p" style="width:459.7pt;"><span id="A1.SS3.p1.pic1.2.9.1" class="ltx_text ltx_verbatim ltx_font_typewriter ltx_inline-block" style="width:459.7pt;--ltx-fg-color:#000000;"><span id="A1.SS3.p1.pic1.2.9.1.1" class="ltx_inline-logical-block ltx_parbox ltx_align_top" style="width:459.7pt;">
<span id="A1.SS3.p1.pic1.p9" class="ltx_para ltx_noindent">
<span id="A1.SS3.p1.pic1.p9.1" class="ltx_p">[엄격 채점 원칙]</span>
</span></span></span></span>
<span id="A1.SS3.p1.pic1.2.10" class="ltx_p" style="width:459.7pt;"><span id="A1.SS3.p1.pic1.2.10.1" class="ltx_text ltx_verbatim ltx_font_typewriter ltx_inline-block" style="width:459.7pt;--ltx-fg-color:#000000;"><span id="A1.SS3.p1.pic1.2.10.1.1" class="ltx_inline-logical-block ltx_parbox ltx_align_top" style="width:459.7pt;">
<span id="A1.SS3.p1.pic1.p10" class="ltx_para ltx_noindent">
<span id="A1.SS3.p1.pic1.p10.1" class="ltx_p">- essay_text에서 구체적으로 확인되지 않는 장점은 인정하지 마라.</span>
</span></span></span></span>
<span id="A1.SS3.p1.pic1.2.11" class="ltx_p" style="width:459.7pt;"><span id="A1.SS3.p1.pic1.2.11.1" class="ltx_text ltx_verbatim ltx_font_typewriter ltx_inline-block" style="width:459.7pt;--ltx-fg-color:#000000;"><span id="A1.SS3.p1.pic1.2.11.1.1" class="ltx_inline-logical-block ltx_parbox ltx_align_top" style="width:459.7pt;">
<span id="A1.SS3.p1.pic1.p11" class="ltx_para ltx_noindent">
<span id="A1.SS3.p1.pic1.p11.1" class="ltx_p">- 구체적 근거가 없으면 해당 기준은 3점 이하로 채점하라.</span>
</span></span></span></span>
<span id="A1.SS3.p1.pic1.2.12" class="ltx_p" style="width:459.7pt;"><span id="A1.SS3.p1.pic1.2.12.1" class="ltx_text ltx_verbatim ltx_font_typewriter ltx_inline-block" style="width:459.7pt;--ltx-fg-color:#000000;"><span id="A1.SS3.p1.pic1.2.12.1.1" class="ltx_inline-logical-block ltx_parbox ltx_align_top" style="width:459.7pt;">
<span id="A1.SS3.p1.pic1.p12" class="ltx_para ltx_noindent">
<span id="A1.SS3.p1.pic1.p12.1" class="ltx_p">- 주장, 구조, 표현 중 주요 결함이 보이면 관련 기준은 1˜2점을 적극 검토하라.</span>
</span></span></span></span>
<span id="A1.SS3.p1.pic1.2.13" class="ltx_p" style="width:459.7pt;"><span id="A1.SS3.p1.pic1.2.13.1" class="ltx_text ltx_verbatim ltx_font_typewriter ltx_inline-block" style="width:459.7pt;--ltx-fg-color:#000000;"><span id="A1.SS3.p1.pic1.2.13.1.1" class="ltx_inline-logical-block ltx_parbox ltx_align_top" style="width:459.7pt;">
<span id="A1.SS3.p1.pic1.p13" class="ltx_para ltx_noindent">
<span id="A1.SS3.p1.pic1.p13.1" class="ltx_p">- 4˜5점은 essay_text에 직접 근거한 강점이 분명할 때만 부여하라.</span>
</span></span></span></span>
<span id="A1.SS3.p1.pic1.2.14" class="ltx_p" style="width:459.7pt;"><span id="A1.SS3.p1.pic1.2.14.1" class="ltx_text ltx_verbatim ltx_font_typewriter ltx_inline-block" style="width:459.7pt;--ltx-fg-color:#000000;"><span id="A1.SS3.p1.pic1.2.14.1.1" class="ltx_inline-logical-block ltx_parbox ltx_align_top" style="width:459.7pt;">
<span id="A1.SS3.p1.pic1.p14" class="ltx_para ltx_noindent">
<span id="A1.SS3.p1.pic1.p14.1" class="ltx_p">- 근거 설명은 기준별로 분리해 작성하라.</span>
</span></span></span></span>
<span id="A1.SS3.p1.pic1.2.15" class="ltx_p" style="width:459.7pt;"><span id="A1.SS3.p1.pic1.2.15.1" class="ltx_text ltx_verbatim ltx_font_typewriter ltx_inline-block" style="width:459.7pt;--ltx-fg-color:#000000;"><span id="A1.SS3.p1.pic1.2.15.1.1" class="ltx_inline-logical-block ltx_parbox ltx_pruned_first ltx_align_top" style="width:459.7pt;"></span></span></span>
