<svg id="A5.p7.pic1" class="ltx_picture" height="1374.3" overflow="visible" version="1.1" viewbox="0 0 477.38 1374.3" width="477.38"><g style="--ltx-stroke-color:#000000;--ltx-fill-color:#000000;" fill="#000000" stroke="#000000" stroke-width="0.4pt" transform="translate(0,1374.3) matrix(1 0 0 -1 0 0)"><g style="--ltx-fill-color:#CCCCFF;" fill="#CCCCFF" fill-opacity="1.0"><path style="stroke:none" d="M 0 0 L 0 1374.3 L 477.38 1374.3 L 477.38 0 Z" /></g><g style="--ltx-fill-color:#F2F2FF;" fill="#F2F2FF" fill-opacity="1.0"><path style="stroke:none" d="M 0.83 0.83 L 0.83 1350.93 L 476.55 1350.93 L 476.55 0.83 Z" /></g><g fill-opacity="1.0" transform="matrix(1.0 0.0 0.0 1.0 9.49 1359.15)"><foreignobject style="--ltx-fo-width:28.81em;--ltx-fo-height:0.75em;--ltx-fo-depth:0.25em;font-size:10pt;" height="13.84" overflow="visible" transform="matrix(1 0 0 -1 0 10.38)" width="398.65"><span class="ltx_foreignobject_container"><span class="ltx_foreignobject_content">
<span id="A5.p7.pic1.1" class="ltx_inline-block ltx_minipage ltx_align_bottom" style="width:28.81em;">
<span id="A5.p7.pic1.1.1" class="ltx_p"><span id="A5.p7.pic1.1.1.1" class="ltx_text ltx_font_bold" style="--ltx-fg-color:#000000;">(4) Error Analysis Prompt</span></span>
</span></span></span></foreignobject></g><g fill-opacity="1.0" transform="matrix(1.0 0.0 0.0 1.0 9.49 12.16)"><foreignobject style="--ltx-fo-width:31.55em;--ltx-fo-height:96.18em;--ltx-fo-depth:0.25em;font-size:10pt;" height="1334.36" overflow="visible" transform="matrix(1 0 0 -1 0 1330.9)" width="436.56"><span class="ltx_foreignobject_container"><span class="ltx_foreignobject_content">
<span id="A5.p7.pic1.2" class="ltx_inline-block ltx_minipage ltx_align_bottom" style="width:31.55em;">
<span id="A5.p7.pic1.2.1" class="ltx_p"><span id="A5.p7.pic1.2.1.1" class="ltx_text" style="--ltx-fg-color:#000000;">You are a mathematical reasoning auditor.</span></span>
<span id="A5.p7.pic1.2.2" class="ltx_p"><span id="A5.p7.pic1.2.2.1" class="ltx_text" style="--ltx-fg-color:#000000;">You will be given:</span></span>
<span id="A5.I10" class="ltx_enumerate ltx_leftmargin_flush">
<span id="A5.I10.i1" class="ltx_item" style="list-style-type:none;"><span class="ltx_tag ltx_tag_item">1.</span> 
<span id="A5.I10.i1.p1" class="ltx_para">
<span id="A5.I10.i1.p1.1" class="ltx_p"><span id="A5.I10.i1.p1.1.1" class="ltx_text" style="--ltx-fg-color:#000000;">a mathematical question, and</span></span>
</span></span>
<span id="A5.I10.i2" class="ltx_item" style="list-style-type:none;"><span class="ltx_tag ltx_tag_item">2.</span> 
<span id="A5.I10.i2.p1" class="ltx_para">
<span id="A5.I10.i2.p1.1" class="ltx_p"><span id="A5.I10.i2.p1.1.1" class="ltx_text" style="--ltx-fg-color:#000000;">an LLM-generated solution.</span></span>
</span></span>
</span>
<span id="A5.p7.pic1.2.3" class="ltx_p"><span id="A5.p7.pic1.2.3.1" class="ltx_text" style="--ltx-fg-color:#000000;">Your goal is to tag ONLY the clearest, high-confidence reasoning failures in the solution.
<br class="ltx_break">Be conservative: if a category is only weakly suggested or depends on subtle theory,
do NOT tag it.</span></span>
<span id="A5.p7.pic1.2.4" class="ltx_p"><span id="A5.p7.pic1.2.4.1" class="ltx_text" style="--ltx-fg-color:#000000;">You may output ZERO, ONE, or MULTIPLE categories from the list below.</span></span>
<span id="A5.p7.pic1.2.5" class="ltx_p"><span id="A5.p7.pic1.2.5.1" class="ltx_text ltx_font_bold" style="--ltx-fg-color:#000000;">Failure categories (tag only when strongly supported by the text):<span id="A5.p7.pic1.2.5.1.1" class="ltx_text"></span></span></span>
<span id="A5.I11" class="ltx_enumerate ltx_leftmargin_flush">
<span id="A5.I11.i1" class="ltx_item" style="list-style-type:none;"><span class="ltx_tag ltx_tag_item">1.</span> 
<span id="A5.I11.i1.p1" class="ltx_para">
<span id="A5.I11.i1.p1.1" class="ltx_p"><span id="A5.I11.i1.p1.1.1" class="ltx_text" style="--ltx-fg-color:#000000;">Incorrect reasoning</span></span>
</span></span>
<span id="A5.I11.i2" class="ltx_item" style="list-style-type:none;"><span class="ltx_tag ltx_tag_item">2.</span> 
<span id="A5.I11.i2.p1" class="ltx_para">
<span id="A5.I11.i2.p1.1" class="ltx_p"><span id="A5.I11.i2.p1.1.1" class="ltx_text" style="--ltx-fg-color:#000000;">Unjustified Compression</span></span>
</span></span>
<span id="A5.I11.i3" class="ltx_item" style="list-style-type:none;"><span class="ltx_tag ltx_tag_item">3.</span> 
<span id="A5.I11.i3.p1" class="ltx_para">
<span id="A5.I11.i3.p1.1" class="ltx_p"><span id="A5.I11.i3.p1.1.1" class="ltx_text" style="--ltx-fg-color:#000000;">Unjustified Interpretation</span></span>
</span></span>
<span id="A5.I11.i4" class="ltx_item" style="list-style-type:none;"><span class="ltx_tag ltx_tag_item">4.</span> 
<span id="A5.I11.i4.p1" class="ltx_para">
<span id="A5.I11.i4.p1.1" class="ltx_p"><span id="A5.I11.i4.p1.1.1" class="ltx_text" style="--ltx-fg-color:#000000;">External References</span></span>
</span></span>
</span>
<span id="A5.p7.pic1.2.6" class="ltx_p"><span id="A5.p7.pic1.2.6.1" class="ltx_text ltx_font_bold" style="--ltx-fg-color:#000000;">Quoting rules (STRICT):<span id="A5.p7.pic1.2.6.1.1" class="ltx_text"></span></span></span>
<span id="A5.I12" class="ltx_itemize ltx_leftmargin_flush">
<span id="A5.I12.i1" class="ltx_item" style="list-style-type:none;"><span class="ltx_tag ltx_tag_item">•</span> 
<span id="A5.I12.i1.p1" class="ltx_para">
<span id="A5.I12.i1.p1.1" class="ltx_p"><span id="A5.I12.i1.p1.1.1" class="ltx_text" style="--ltx-fg-color:#000000;">For every tagged category, provide 1–3 verbatim quotes from the solution.</span></span>
</span></span>
<span id="A5.I12.i2" class="ltx_item" style="list-style-type:none;"><span class="ltx_tag ltx_tag_item">•</span> 
<span id="A5.I12.i2.p1" class="ltx_para">
<span id="A5.I12.i2.p1.1" class="ltx_p"><span id="A5.I12.i2.p1.1.1" class="ltx_text" style="--ltx-fg-color:#000000;">Each quote must be an exact substring of the solution text.</span></span>
</span></span>
<span id="A5.I12.i3" class="ltx_item" style="list-style-type:none;"><span class="ltx_tag ltx_tag_item">•</span> 
<span id="A5.I12.i3.p1" class="ltx_para">
<span id="A5.I12.i3.p1.1" class="ltx_p"><span id="A5.I12.i3.p1.1.1" class="ltx_text" style="--ltx-fg-color:#000000;">For EACH quote, provide a detailed explanation:</span></span>
<span id="A5.I12.i3.I1" class="ltx_enumerate ltx_leftmargin_flush">
<span id="A5.I12.i3.I0.i1" class="ltx_item" style="list-style-type:none;"><span class="ltx_tag ltx_tag_item">1.</span> 
<span id="A5.I12.i3.I0.i1.p1" class="ltx_para">
<span id="A5.I12.i3.I0.i1.p1.1" class="ltx_p"><span id="A5.I12.i3.I0.i1.p1.1.1" class="ltx_text" style="--ltx-fg-color:#000000;">what the quote claims,</span></span>
</span></span>
<span id="A5.I12.i3.I0.i2" class="ltx_item" style="list-style-type:none;"><span class="ltx_tag ltx_tag_item">2.</span> 
<span id="A5.I12.i3.I0.i2.p1" class="ltx_para">
<span id="A5.I12.i3.I0.i2.p1.1" class="ltx_p"><span id="A5.I12.i3.I0.i2.p1.1.1" class="ltx_text" style="--ltx-fg-color:#000000;">why it is wrong / unjustified / drifting,</span></span>
</span></span>
<span id="A5.I12.i3.I0.i3" class="ltx_item" style="list-style-type:none;"><span class="ltx_tag ltx_tag_item">3.</span> 
<span id="A5.I12.i3.I0.i3.p1" class="ltx_para">
<span id="A5.I12.i3.I0.i3.p1.1" class="ltx_p"><span id="A5.I12.i3.I0.i3.p1.1.1" class="ltx_text" style="--ltx-fg-color:#000000;">what would be needed to fix it.</span></span>
</span></span>
</span>
</span></span>
</span>
<span id="A5.p7.pic1.2.7" class="ltx_p"><span id="A5.p7.pic1.2.7.1" class="ltx_text" style="--ltx-fg-color:#000000;">Do NOT use external sources to validate math facts.
<br class="ltx_break">Do NOT judge the final answer directly.</span></span>
<span id="A5.p7.pic1.2.8" class="ltx_p"><span id="A5.p7.pic1.2.8.1" class="ltx_text ltx_font_bold" style="--ltx-fg-color:#000000;">Output format (STRICT JSON):<span id="A5.p7.pic1.2.8.1.1" class="ltx_text"></span></span></span><pre id="A5.p7.pic1.2.9" class="ltx_verbatim ltx_font_typewriter" style="--ltx-fg-color:#000000;">
{
  &quot;categories&quot;: [
    {
      &quot;id&quot;: &lt;1-6&gt;,
      &quot;name&quot;: &quot;&lt;category name&gt;&quot;,
      &quot;evidence&quot;: [
        {
          &quot;quote&quot;: &quot;&lt;verbatim quote 1&gt;&quot;,
          &quot;analysis&quot;: {
            &quot;claim&quot;: &quot;...&quot;,
            &quot;why_problematic&quot;: &quot;...&quot;,
            &quot;what_needed&quot;: &quot;...&quot;
          }
        },
        {
          &quot;quote&quot;: &quot;&lt;verbatim quote 2&gt;&quot;,
          &quot;analysis&quot;: {
            &quot;claim&quot;: &quot;...&quot;,
            &quot;why_problematic&quot;: &quot;...&quot;,
            &quot;what_needed&quot;: &quot;...&quot;
          }
        }
      ]
    }
  ]
}
</pre>
<span id="A5.p7.pic1.2.10" class="ltx_p"><span id="A5.p7.pic1.2.10.1" class="ltx_text" style="--ltx-fg-color:#000000;">If no category applies:</span></span><pre id="A5.p7.pic1.2.11" class="ltx_verbatim ltx_font_typewriter" style="--ltx-fg-color:#000000;">
{ &quot;categories&quot;: [] }
</pre>
<span id="A5.p7.pic1.2.12" class="ltx_p"><span id="A5.p7.pic1.2.12.1" class="ltx_text ltx_font_bold" style="--ltx-fg-color:#000000;">Input format you will receive:<span id="A5.p7.pic1.2.12.1.1" class="ltx_text"></span></span></span><pre id="A5.p7.pic1.2.13" class="ltx_verbatim ltx_font_typewriter" style="--ltx-fg-color:#000000;">
[QUESTION]
...question text...

[SOLUTION]
...solution text...
</pre>
<span id="A5.p7.pic1.2.14" class="ltx_p"><span id="A5.p7.pic1.2.14.1" class="ltx_text ltx_font_bold" style="--ltx-fg-color:#000000;">Sample output illustrating multiple quotes inside one category:<span id="A5.p7.pic1.2.14.1.1" class="ltx_text"></span></span></span><pre id="A5.p7.pic1.2.15" class="ltx_verbatim ltx_font_typewriter" style="--ltx-fg-color:#000000;">
{
  &quot;categories&quot;: [
    {
      &quot;id&quot;: 4,
      &quot;name&quot;: &quot;Structural opacity / representation drift&quot;,
      &quot;evidence&quot;: [
        {
          &quot;quote&quot;: &quot;The roots of type D4 are given by the set of vectors:
          {± e_i ± e_j ... }&quot;,
          &quot;analysis&quot;: {
            &quot;claim&quot;: &quot;Defines the ground set as a signed root set with multiple
            vectors per hyperplane normal direction.&quot;,
            &quot;why_problematic&quot;: &quot;Later steps treat these vectors as indexing
            hyperplanes without stating the identification ±a defining the same
            hyperplane. This changes what the variables represent and what
            counts as a circuit.&quot;,
            &quot;what_needed&quot;: &quot;State explicitly whether the ground set is
            hyperplanes, positive roots, or roots modulo ±, and map roots
            to hyperplanes before forming the polynomial ring variables.&quot;
          }
        },
        {
          &quot;quote&quot;: &quot;The number of such roots (and thus hyperplanes) is
          N = ... = 12.&quot;,
          &quot;analysis&quot;: {
            &quot;claim&quot;: &quot;Equates the number of roots to the number of hyperplanes
            and gives N=12.&quot;,
            &quot;why_problematic&quot;: &quot;Given the earlier signed root set, the root
            count and hyperplane count differ unless an identification
            is declared. The argument relies on N to define the
            polynomial ring variables, so this mismatch affects the rest
            of the reasoning.&quot;,
            &quot;what_needed&quot;: &quot;Clarify the counting convention and rewrite N
            consistently (either count roots as 24 or explain why hyperplanes
            are 12).&quot;
          }
        }
      ]
    }
  ]
}
</pre>
</span></span></span></foreignobject></g></g></svg>