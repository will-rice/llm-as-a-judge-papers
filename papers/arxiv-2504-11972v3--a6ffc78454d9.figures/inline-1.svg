<span id="A1.F3.pic1.2.1" class="ltx_p"><span id="A1.F3.pic1.2.1.1" class="ltx_text ltx_font_bold" style="--ltx-fg-color:#000000;">Input:<span id="A1.F3.pic1.2.1.1.1" class="ltx_text ltx_font_medium"> 
<br class="ltx_break">- A question 
<br class="ltx_break">- A gold answer 
<br class="ltx_break">- A predicted answer (from an anonymized model) 
<br class="ltx_break">- Context</span></span></span>
<span id="A1.F3.pic1.2.2" class="ltx_p"><span id="A1.F3.pic1.2.2.1" class="ltx_text ltx_font_bold" style="--ltx-fg-color:#000000;">Output:<span id="A1.F3.pic1.2.2.1.1" class="ltx_text ltx_font_medium"> 
<br class="ltx_break">- </span>Correct (1):<span id="A1.F3.pic1.2.2.1.2" class="ltx_text ltx_font_medium"> The predicted answer matches the gold answer or is a valid alternative (e.g., different but correct ways of writing a name). 
<br class="ltx_break">- </span>Incorrect (0):<span id="A1.F3.pic1.2.2.1.3" class="ltx_text ltx_font_medium"> The predicted answer is wrong or does not align with the gold answer.</span></span></span>
<span id="A1.F3.pic1.2.3" class="ltx_p"><span id="A1.F3.pic1.2.3.1" class="ltx_text ltx_font_bold" style="--ltx-fg-color:#000000;">Notice:<span id="A1.F3.pic1.2.3.1.1" class="ltx_text ltx_font_medium"> In some ambiguous cases, where it is unclear whether the predicted answer is correct or not, please refer to the provided context and use it as the final source for making your judgment.</span></span></span>
