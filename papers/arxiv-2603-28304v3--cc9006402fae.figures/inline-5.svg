<span id="A2.p2.pic1.1.1" class="ltx_p"><span id="A2.p2.pic1.1.1.1" class="ltx_text ltx_font_typewriter ltx_font_bold" style="--ltx-fg-color:#FFFFFF;">Pairwise Comparison COT Judge Prompt</span></span>
</span></span></span></foreignobject></g><g fill-opacity="1.0" transform="matrix(1.0 0.0 0.0 1.0 23.56 18.76)"><foreignobject style="--ltx-fo-width:41.72em;--ltx-fo-height:9.01em;--ltx-fo-depth:0.22em;font-size:10pt;" height="127.76" overflow="visible" transform="matrix(1 0 0 -1 0 124.69)" width="577.29"><span class="ltx_foreignobject_container"><span class="ltx_foreignobject_content">
<span id="A2.p2.pic1.2" class="ltx_inline-block ltx_minipage ltx_align_bottom" style="width:41.72em;">
<span id="A2.p2.pic1.2.1" class="ltx_p"><span id="A2.p2.pic1.2.1.1" class="ltx_text ltx_font_typewriter" style="--ltx-fg-color:#000000;">You are a fair and impartial judge. Your task is to evaluate two AI assistant responses to a user question. First, compare them on helpfulness, relevance, accuracy, depth, and creativity. Then compare them on coherence, clarity, and language quality. Finally, give your verdict.
</span></span>
<span id="A2.p2.pic1.2.2" class="ltx_p"><span id="A2.p2.pic1.2.2.1" class="ltx_text ltx_font_typewriter" style="--ltx-fg-color:#000000;">Respond ONLY with valid JSON using exactly these two keys:
</span></span><pre id="A2.p2.pic1.2.3" class="ltx_verbatim ltx_font_typewriter" style="--ltx-fg-color:#000000;">
{&quot;judge reason&quot;:&quot;&lt;brief explanation&gt;&quot;
,&quot;judge result&quot;:&quot;A&quot;}
</pre>
<span id="A2.p2.pic1.2.4" class="ltx_p"><span id="A2.p2.pic1.2.4.1" class="ltx_text ltx_font_typewriter" style="--ltx-fg-color:#000000;">Use ‘‘A’’ if assistant A is better, ‘‘B’’ if assistant B is better, and ‘‘C’’ for a tie.
Do not output markdown or any extra text outside the JSON object.
</span></span>
</span></span></span></foreignobject></g></g></svg>