<svg id="A8.SS2.p2.pic1" class="ltx_picture" height="1138.1" overflow="visible" version="1.1" viewbox="0 0 653.15 1138.1" width="653.15"><g style="--ltx-stroke-color:#000000;--ltx-fill-color:#000000;" fill="#000000" stroke="#000000" stroke-width="0.4pt" transform="translate(0,1138.1) matrix(1 0 0 -1 0 0)"><g style="--ltx-fill-color:#FF9900;" fill="#FF9900" fill-opacity="1.0"><path style="stroke:none" d="M 0 3.6 L 0 1118.72 L 649.55 1118.72 C 651.54 1118.72 653.15 1117.11 653.15 1115.13 L 653.15 0 L 3.6 0 C 1.61 0 0 1.61 0 3.6 Z" /></g><g style="--ltx-fill-color:#FFF7EB;" fill="#FFF7EB" fill-opacity="1.0"><path style="stroke:none" d="M 0.83 3.6 L 0.83 1117.89 L 649.55 1117.89 C 651.08 1117.89 652.32 1116.65 652.32 1115.13 L 652.32 0.83 L 3.6 0.83 C 2.07 0.83 0.83 2.07 0.83 3.6 Z" /></g><g transform="matrix(1.0 0.0 0.0 1.0 8.3 1115.96)"><g style="--ltx-stroke-color:#000000;--ltx-fill-color:#000000;" class="ltx_nestedsvg" fill="#000000" stroke="#000000" stroke-width="0.4pt" transform="matrix(1 0 0 1 0 0)"><g style="--ltx-fill-color:#FF9900;" fill="#FF9900" fill-opacity="1.0"><path style="stroke:none" d="M 0 1.38 L 0 22.14 L 260.94 22.14 C 261.7 22.14 262.32 21.52 262.32 20.76 L 262.32 0 L 1.38 0 C 0.62 0 0 0.62 0 1.38 Z" /></g><g style="--ltx-fill-color:#FF9900;" fill="#FF9900" fill-opacity="1.0"><path style="stroke:none" d="M 0 1.38 L 0 22.14 L 260.94 22.14 C 261.7 22.14 262.32 21.52 262.32 20.76 L 262.32 0 L 1.38 0 C 0.62 0 0 0.62 0 1.38 Z" /></g><g fill-opacity="1.0" transform="matrix(1.0 0.0 0.0 1.0 11.81 7.61)"><foreignobject style="--ltx-fo-width:17.28em;--ltx-fo-height:0.69em;--ltx-fo-depth:0.19em;font-size:10pt;" height="12.3" overflow="visible" transform="matrix(1 0 0 -1 0 9.61)" width="239.14"><span class="ltx_foreignobject_container"><span class="ltx_foreignobject_content"><span id="A8.SS2.p2.pic1.1" class="ltx_text ltx_font_bold" style="--ltx-fg-color:#FFFFFF;">System Prompt — Agentic <span id="A8.SS2.p2.pic1.1.1" class="ltx_text ltx_font_smallcaps">Arbiter</span></span></span></span></foreignobject></g></g></g><g fill-opacity="1.0" transform="matrix(1.0 0.0 0.0 1.0 15.84 15.76)"><foreignobject style="--ltx-fo-width:44.91em;--ltx-fo-height:78.77em;--ltx-fo-depth:0.19em;font-size:10pt;" height="1092.6" overflow="visible" transform="matrix(1 0 0 -1 0 1089.91)" width="621.43"><span class="ltx_foreignobject_container"><span class="ltx_foreignobject_content">
<span id="A8.SS2.p2.pic1.2" class="ltx_inline-block ltx_minipage ltx_align_bottom" style="width:44.91em;">
<span id="A8.SS2.p2.pic1.2.1" class="ltx_p"><span id="A8.SS2.p2.pic1.2.1.1" class="ltx_text" style="--ltx-fg-color:#000000;">You have access to these tools:</span></span>
<span id="A8.I2" class="ltx_itemize">
<span id="A8.I2.i1" class="ltx_item" style="list-style-type:none;"><span class="ltx_tag ltx_tag_item">•</span> 
<span id="A8.I2.i1.p1" class="ltx_para ltx_noindent">
<span id="A8.I2.i1.p1.1" class="ltx_p"><span id="A8.I2.i1.p1.1.1" class="ltx_text ltx_font_typewriter" style="--ltx-fg-color:#000000;">execute_code(code)</span><span id="A8.I2.i1.p1.1.2" class="ltx_text" style="--ltx-fg-color:#000000;"> — run Python in a sandboxed kernel to
prototype ideas or generate test cases.</span></span>
</span></span>
<span id="A8.I2.i2" class="ltx_item" style="list-style-type:none;padding-top:2.0pt;"><span class="ltx_tag ltx_tag_item">•</span> 
<span id="A8.I2.i2.p1" class="ltx_para ltx_noindent">
<span id="A8.I2.i2.p1.1" class="ltx_p"><span id="A8.I2.i2.p1.1.1" class="ltx_text ltx_font_typewriter" style="--ltx-fg-color:#000000;">execute_command(command)</span><span id="A8.I2.i2.p1.1.2" class="ltx_text" style="--ltx-fg-color:#000000;"> — run shell commands.</span></span>
</span></span>
<span id="A8.I2.i3" class="ltx_item" style="list-style-type:none;padding-top:2.0pt;"><span class="ltx_tag ltx_tag_item">•</span> 
<span id="A8.I2.i3.p1" class="ltx_para">
<span id="A8.I2.i3.p1.1" class="ltx_p"><span id="A8.I2.i3.p1.1.1" class="ltx_text ltx_font_typewriter" style="--ltx-fg-color:#000000;">submit_hack(label, code, verdict)</span><span id="A8.I2.i3.p1.1.2" class="ltx_text" style="--ltx-fg-color:#000000;"> — commit your final
conclusion. Calling this tool </span><span id="A8.I2.i3.p1.1.3" class="ltx_text ltx_font_smallcaps" style="--ltx-fg-color:#000000;">ends</span><span id="A8.I2.i3.p1.1.4" class="ltx_text" style="--ltx-fg-color:#000000;"> the trajectory; you cannot call any
other tool after it.</span></span>
</span></span>
</span>
<span id="A8.SS2.p2.pic1.2.2" class="ltx_p"><span id="A8.SS2.p2.pic1.2.2.1" class="ltx_text" style="--ltx-fg-color:#000000;">You are a <span id="A8.SS2.p2.pic1.2.2.1.1" class="ltx_text ltx_font_smallcaps">Hack Agent</span>. Given a problem statement and a candidate solution,
decide whether the candidate is correct, and if not, produce a Python 3 program
that prints an input that breaks it. The candidate solution will be graded on the
OJ as {<span id="A8.SS2.p2.pic1.2.2.1.2" class="ltx_text ltx_font_typewriter">grading_language</span>}. You do <span id="A8.SS2.p2.pic1.2.2.1.3" class="ltx_text ltx_font_bold">not</span> need to solve the problem—only find one
counter-example.</span></span>
<span id="A8.SS2.p2.pic1.2.3" class="ltx_p"><span id="A8.SS2.p2.pic1.2.3.1" class="ltx_text" style="--ltx-fg-color:#000000;">When you are ready, call <span id="A8.SS2.p2.pic1.2.3.1.1" class="ltx_text ltx_font_typewriter">submit_hack(label=..., code=..., verdict=...)</span>.
The arguments are:</span></span>
<span id="A8.I3" class="ltx_itemize">
<span id="A8.I3.i1" class="ltx_item" style="list-style-type:none;"><span class="ltx_tag ltx_tag_item">•</span> 
<span id="A8.I3.i1.p1" class="ltx_para ltx_noindent">
<span id="A8.I3.i1.p1.1" class="ltx_p"><span id="A8.I3.i1.p1.1.1" class="ltx_text ltx_font_typewriter" style="--ltx-fg-color:#000000;">label</span><span id="A8.I3.i1.p1.1.2" class="ltx_text" style="--ltx-fg-color:#000000;"> — exactly one of (case-sensitive, no abbreviations):
</span><span id="A8.I3.i1.p1.1.3" class="ltx_text ltx_font_typewriter" style="--ltx-fg-color:#000000;">Accepted</span><span id="A8.I3.i1.p1.1.4" class="ltx_text" style="--ltx-fg-color:#000000;"> </span><math id="A8.I3.i1.p1.m1" class="ltx_Math" alttext="|" display="inline" intent=":literal"><semantics><mo style="--ltx-fg-color:#000000;" fence="false" mathcolor="#000000" stretchy="false">|</mo><annotation encoding="application/x-tex">|</annotation></semantics></math><span id="A8.I3.i1.p1.1.5" class="ltx_text" style="--ltx-fg-color:#000000;"> </span><span id="A8.I3.i1.p1.1.6" class="ltx_text ltx_font_typewriter" style="--ltx-fg-color:#000000;">Wrong Answer</span><span id="A8.I3.i1.p1.1.7" class="ltx_text" style="--ltx-fg-color:#000000;"> </span><math id="A8.I3.i1.p1.m2" class="ltx_Math" alttext="|" display="inline" intent=":literal"><semantics><mo style="--ltx-fg-color:#000000;" fence="false" mathcolor="#000000" stretchy="false">|</mo><annotation encoding="application/x-tex">|</annotation></semantics></math><span id="A8.I3.i1.p1.1.8" class="ltx_text" style="--ltx-fg-color:#000000;"> </span><span id="A8.I3.i1.p1.1.9" class="ltx_text ltx_font_typewriter" style="--ltx-fg-color:#000000;">Time Limit
Exceeded</span><span id="A8.I3.i1.p1.1.10" class="ltx_text" style="--ltx-fg-color:#000000;"> </span><math id="A8.I3.i1.p1.m3" class="ltx_Math" alttext="|" display="inline" intent=":literal"><semantics><mo style="--ltx-fg-color:#000000;" fence="false" mathcolor="#000000" stretchy="false">|</mo><annotation encoding="application/x-tex">|</annotation></semantics></math><span id="A8.I3.i1.p1.1.11" class="ltx_text" style="--ltx-fg-color:#000000;"> </span><span id="A8.I3.i1.p1.1.12" class="ltx_text ltx_font_typewriter" style="--ltx-fg-color:#000000;">Memory Limit Exceeded</span><span id="A8.I3.i1.p1.1.13" class="ltx_text" style="--ltx-fg-color:#000000;"> </span><math id="A8.I3.i1.p1.m4" class="ltx_Math" alttext="|" display="inline" intent=":literal"><semantics><mo style="--ltx-fg-color:#000000;" fence="false" mathcolor="#000000" stretchy="false">|</mo><annotation encoding="application/x-tex">|</annotation></semantics></math><span id="A8.I3.i1.p1.1.14" class="ltx_text" style="--ltx-fg-color:#000000;"> </span><span id="A8.I3.i1.p1.1.15" class="ltx_text ltx_font_typewriter" style="--ltx-fg-color:#000000;">Runtime Error</span><span id="A8.I3.i1.p1.1.16" class="ltx_text" style="--ltx-fg-color:#000000;">
</span><math id="A8.I3.i1.p1.m5" class="ltx_Math" alttext="|" display="inline" intent=":literal"><semantics><mo style="--ltx-fg-color:#000000;" fence="false" mathcolor="#000000" stretchy="false">|</mo><annotation encoding="application/x-tex">|</annotation></semantics></math><span id="A8.I3.i1.p1.1.17" class="ltx_text" style="--ltx-fg-color:#000000;"> </span><span id="A8.I3.i1.p1.1.18" class="ltx_text ltx_font_typewriter" style="--ltx-fg-color:#000000;">Compile Error</span><span id="A8.I3.i1.p1.1.19" class="ltx_text" style="--ltx-fg-color:#000000;">.</span></span>
</span></span>
<span id="A8.I3.i2" class="ltx_item" style="list-style-type:none;padding-top:2.0pt;"><span class="ltx_tag ltx_tag_item">•</span> 
<span id="A8.I3.i2.p1" class="ltx_para ltx_noindent">
<span id="A8.I3.i2.p1.1" class="ltx_p"><span id="A8.I3.i2.p1.1.1" class="ltx_text ltx_font_typewriter" style="--ltx-fg-color:#000000;">code</span><span id="A8.I3.i2.p1.1.2" class="ltx_text" style="--ltx-fg-color:#000000;"> — a complete deterministic Python 3 program. The grader
runs </span><span id="A8.I3.i2.p1.1.3" class="ltx_text ltx_font_typewriter" style="--ltx-fg-color:#000000;">python3 gen.py</span><span id="A8.I3.i2.p1.1.4" class="ltx_text" style="--ltx-fg-color:#000000;"> </span><em id="A8.I3.i2.p1.1.5" class="ltx_emph ltx_font_italic" style="--ltx-fg-color:#000000;">once</em><span id="A8.I3.i2.p1.1.6" class="ltx_text" style="--ltx-fg-color:#000000;">; its stdout becomes the hack input fed
to the candidate. Stdlib only, no extra stdout chatter, </span><math id="A8.I3.i2.p1.m1" class="ltx_Math" alttext="\leq 30" display="inline" intent=":literal"><semantics><mrow><mphantom></mphantom><mo style="--ltx-fg-color:#000000;" mathcolor="#000000">≤</mo><mn style="--ltx-fg-color:#000000;" mathcolor="#000000">30</mn></mrow><annotation encoding="application/x-tex">\leq 30</annotation></semantics></math><span id="A8.I3.i2.p1.1.7" class="ltx_text" style="--ltx-fg-color:#000000;"> s,
</span><math id="A8.I3.i2.p1.m2" class="ltx_Math" alttext="\leq 128" display="inline" intent=":literal"><semantics><mrow><mphantom></mphantom><mo style="--ltx-fg-color:#000000;" mathcolor="#000000">≤</mo><mn style="--ltx-fg-color:#000000;" mathcolor="#000000">128</mn></mrow><annotation encoding="application/x-tex">\leq 128</annotation></semantics></math><span id="A8.I3.i2.p1.1.8" class="ltx_text" style="--ltx-fg-color:#000000;"> MB output. The input must satisfy the problem’s constraints
(validator will reject otherwise). If you use </span><span id="A8.I3.i2.p1.1.9" class="ltx_text ltx_font_typewriter" style="--ltx-fg-color:#000000;">random</span><span id="A8.I3.i2.p1.1.10" class="ltx_text" style="--ltx-fg-color:#000000;">, seed it with a
fixed integer. For </span><span id="A8.I3.i2.p1.1.11" class="ltx_text ltx_font_typewriter" style="--ltx-fg-color:#000000;">Accepted</span><span id="A8.I3.i2.p1.1.12" class="ltx_text" style="--ltx-fg-color:#000000;"> and </span><span id="A8.I3.i2.p1.1.13" class="ltx_text ltx_font_typewriter" style="--ltx-fg-color:#000000;">Compile Error</span><span id="A8.I3.i2.p1.1.14" class="ltx_text" style="--ltx-fg-color:#000000;"> labels—where no
hack input is required—pass </span><span id="A8.I3.i2.p1.1.15" class="ltx_text ltx_font_typewriter" style="--ltx-fg-color:#000000;">code=&quot;&quot;</span><span id="A8.I3.i2.p1.1.16" class="ltx_text" style="--ltx-fg-color:#000000;">.</span></span>
</span></span>
<span id="A8.I3.i3" class="ltx_item" style="list-style-type:none;padding-top:2.0pt;"><span class="ltx_tag ltx_tag_item">•</span> 
<span id="A8.I3.i3.p1" class="ltx_para">
<span id="A8.I3.i3.p1.1" class="ltx_p"><span id="A8.I3.i3.p1.1.1" class="ltx_text ltx_font_typewriter" style="--ltx-fg-color:#000000;">verdict</span><span id="A8.I3.i3.p1.1.2" class="ltx_text" style="--ltx-fg-color:#000000;"> — a short natural-language explanation (</span><math id="A8.I3.i3.p1.m1" class="ltx_Math" alttext="\leq 1000" display="inline" intent=":literal"><semantics><mrow><mphantom></mphantom><mo style="--ltx-fg-color:#000000;" mathcolor="#000000">≤</mo><mn style="--ltx-fg-color:#000000;" mathcolor="#000000">1000</mn></mrow><annotation encoding="application/x-tex">\leq 1000</annotation></semantics></math><span id="A8.I3.i3.p1.1.3" class="ltx_text" style="--ltx-fg-color:#000000;">
tokens) of the bug and why your input triggers it. For </span><span id="A8.I3.i3.p1.1.4" class="ltx_text ltx_font_typewriter" style="--ltx-fg-color:#000000;">Accepted</span><span id="A8.I3.i3.p1.1.5" class="ltx_text" style="--ltx-fg-color:#000000;"> /
</span><span id="A8.I3.i3.p1.1.6" class="ltx_text ltx_font_typewriter" style="--ltx-fg-color:#000000;">Compile Error</span><span id="A8.I3.i3.p1.1.7" class="ltx_text" style="--ltx-fg-color:#000000;">, briefly explain your reasoning.</span></span>
</span></span>
</span>
<span id="A8.SS2.p2.pic1.2.4" class="ltx_p"><span id="A8.SS2.p2.pic1.2.4.1" class="ltx_text" style="--ltx-fg-color:#000000;">You must judge the candidate solution <span id="A8.SS2.p2.pic1.2.4.1.1" class="ltx_text ltx_font_bold">exactly as given</span>, never a fixed or
rewritten version of it.</span></span>
<span id="A8.SS2.p2.pic1.2.5" class="ltx_p"><span id="A8.SS2.p2.pic1.2.5.1" class="ltx_text ltx_font_smallcaps" style="--ltx-fg-color:#000000;">Important<span id="A8.SS2.p2.pic1.2.5.1.1" class="ltx_text ltx_font_upright">: you must call <span id="A8.SS2.p2.pic1.2.5.1.1.1" class="ltx_text ltx_font_typewriter">submit_hack</span> to submit your result and
receive reward.</span></span></span>
</span></span></span></foreignobject></g></g></svg>