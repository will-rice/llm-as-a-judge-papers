<span id="A1.SS6.p8.pic1.1.1" class="ltx_p"><span id="A1.SS6.p8.pic1.1.1.1" class="ltx_text ltx_font_bold" style="--ltx-fg-color:#FFFFFF;">Sample 8: Comparative Evaluation by Experts vs. LLM Judges</span></span>
</span></span></span></foreignobject></g><g fill-opacity="1.0" transform="matrix(1.0 0.0 0.0 1.0 11.81 393.47)"><foreignobject style="--ltx-fo-width:45.27em;--ltx-fo-height:4.29em;--ltx-fo-depth:7.38em;font-size:10pt;" height="161.47" overflow="visible" transform="matrix(1 0 0 -1 0 59.42)" width="626.41"><span class="ltx_foreignobject_container"><span class="ltx_foreignobject_content">
<span id="A1.SS6.p8.pic1.2" class="ltx_inline-block ltx_minipage ltx_align_bottom" style="width:45.27em;">
<span id="A1.SS6.p8.pic1.2.1" class="ltx_p"><span id="A1.SS6.p8.pic1.2.1.1" class="ltx_text ltx_font_sansserif ltx_font_bold" style="--ltx-fg-color:#000000;">BACKGROUND PAPER</span><span id="A1.SS6.p8.pic1.2.1.2" class="ltx_text" style="--ltx-fg-color:#000000;"> 
<br class="ltx_break"><span id="A1.SS6.p8.pic1.2.1.2.1" class="ltx_text ltx_font_bold">Title:</span> Large Language Monkeys: Scaling Inference Compute Repeated Sampling 
<br class="ltx_break"><span id="A1.SS6.p8.pic1.2.1.2.2" class="ltx_text ltx_font_bold" style="font-size:90%;">Abstract (Summarized):<span id="A1.SS6.p8.pic1.2.1.2.2.1" class="ltx_text ltx_font_medium"> Scaling the compute used to train language models has dramatically improved their capabilities. In this paper, we explore inference compute as an alternative scaling axis by using the simple technique of repeatedly sampling candidate solutions from a model. Across multiple tasks, we observe that problem-solving coverage scales log-linearly with the number of samples over four orders of magnitude. This suggests the existence of inference-time scaling laws, which directly translate into improved performance for verifiable domains like coding and proofs.</span></span></span></span>
</span></span></span></foreignobject></g><g fill-opacity="1.0" transform="matrix(1.0 0.0 0.0 1.0 11.81 51.94)"><foreignobject style="--ltx-fo-width:45.27em;--ltx-fo-height:15.89em;--ltx-fo-depth:3.18em;font-size:10pt;" height="263.87" overflow="visible" transform="matrix(1 0 0 -1 0 219.8)" width="626.41"><span class="ltx_foreignobject_container"><span class="ltx_foreignobject_content"><span id="A1.SS6.p8.pic1.3" class="ltx_inline-logical-block ltx_minipage ltx_align_bottom" style="width:45.27em;">
<span id="A1.SS6.p8.pic1.p2" class="ltx_para">
<span id="A1.SS6.p8.pic1.p2.1" class="ltx_p"><span id="A1.SS6.p8.pic1.p2.1.1" class="ltx_text ltx_font_sansserif ltx_font_bold" style="--ltx-fg-color:#000000;">GROUND TRUTH RQ</span><span id="A1.SS6.p8.pic1.p2.1.2" class="ltx_text" style="--ltx-fg-color:#000000;"> 
<br class="ltx_break"><span id="A1.SS6.p8.pic1.p2.1.2.1" class="ltx_text ltx_font_italic">“How can an adaptive decoding framework optimize the trade-off between computational cost and reasoning accuracy to achieve high performance without the extensive sampling budget required by Best-of-N methods?”</span></span></span>
<span id="A1.SS6.p8.pic1.p2.2" class="ltx_p"><span id="A1.SS6.p8.pic1.p2.2.1" class="ltx_text ltx_font_sansserif ltx_font_bold" style="--ltx-fg-color:#000000;">BEST GPT-5.5 RQ</span><span id="A1.SS6.p8.pic1.p2.2.2" class="ltx_text" style="--ltx-fg-color:#000000;"> 
<br class="ltx_break"><span id="A1.SS6.p8.pic1.p2.2.2.1" class="ltx_text ltx_font_italic">“How accurately can exponentiated power-law fits estimated from the first 100 or 1,000 samples predict pass@10,000 or pass@100,000 across model families, model sizes, and tasks?”</span></span></span>
</span>
