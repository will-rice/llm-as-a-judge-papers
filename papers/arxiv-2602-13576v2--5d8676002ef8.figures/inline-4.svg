<svg id="A4.SS3.p2.pic1" class="ltx_picture" height="818.83" overflow="visible" version="1.1" viewbox="0 0 550 818.83" width="550"><g style="--ltx-stroke-color:#000000;--ltx-fill-color:#000000;" fill="#000000" stroke="#000000" stroke-width="0.4pt" transform="translate(0,818.83) matrix(1 0 0 -1 0 0)"><g style="--ltx-fill-color:#000099;" fill="#000099" fill-opacity="1.0"><path style="stroke:none" d="M 0 0 L 0 818.83 L 550 818.83 L 550 0 Z" /></g><g style="--ltx-fill-color:#F7F7FF;" fill="#F7F7FF" fill-opacity="1.0"><path style="stroke:none" d="M 0.69 0.69 L 0.69 779.9 L 549.31 779.9 L 549.31 0.69 Z" /></g><g style="--ltx-fill-color:#EDEDFF;" fill="#EDEDFF" fill-opacity="1.0"><path style="stroke:none" d="M 0.69 780.59 L 0.69 818.14 L 549.31 818.14 L 549.31 780.59 Z" /></g><g fill-opacity="1.0" transform="matrix(1.0 0.0 0.0 1.0 10.16 787.99)"><foreignobject style="--ltx-fo-width:33.29em;--ltx-fo-height:1.89em;--ltx-fo-depth:0.25em;font-size:10pt;" height="29.67" overflow="visible" transform="matrix(1 0 0 -1 0 26.21)" width="460.64"><span class="ltx_foreignobject_container"><span class="ltx_foreignobject_content">
<span id="A4.SS3.p2.pic1.1" class="ltx_inline-block ltx_minipage ltx_align_bottom" style="width:33.29em;">
<span id="A4.SS3.p2.pic1.1.1" class="ltx_inline-block fas fa-gavel" aria-hidden="true">
</span>
<span id="A4.SS3.p2.pic1.1.2" class="ltx_p"><span id="A4.SS3.p2.pic1.1.2.1" class="ltx_text ltx_font_bold" style="--ltx-fg-color:#000000;">Pairwise Rubric Evaluation Prompt (Helpfulness)</span></span>
</span></span></span></foreignobject></g><g fill-opacity="1.0" transform="matrix(1.0 0.0 0.0 1.0 10.16 13.62)"><foreignobject style="--ltx-fo-width:38.28em;--ltx-fo-height:54.7em;--ltx-fo-depth:0.25em;font-size:10pt;" height="760.28" overflow="visible" transform="matrix(1 0 0 -1 0 756.82)" width="529.69"><span class="ltx_foreignobject_container"><span class="ltx_foreignobject_content">
<span id="A4.SS3.p2.pic1.2" class="ltx_inline-block ltx_minipage ltx_align_bottom" style="width:38.28em;">
<span id="A4.SS3.p2.pic1.2.1" class="ltx_p"><span id="A4.SS3.p2.pic1.2.1.1" class="ltx_text" style="--ltx-fg-color:#000000;">You are an expert evaluator of AI helpfulness evaluation rubrics.</span></span>
<span id="A4.SS3.p2.pic1.2.2" class="ltx_p"><span id="A4.SS3.p2.pic1.2.2.1" class="ltx_text" style="--ltx-fg-color:#000000;">Your task is to compare two candidate helpfulness rubrics (Rubric A vs Rubric B) and determine which one is better designed for judging the helpfulness of AI assistant responses.</span></span>
<span id="A4.SS3.p2.pic1.2.3" class="ltx_p"><span id="A4.SS3.p2.pic1.2.3.1" class="ltx_text" style="--ltx-fg-color:#000000;">“Better&quot; means the rubric yields consistent, reliable, defensible helpfulness judgments (goal achievement, relevance, correctness, constraint-following).</span></span>
<span id="A4.SS3.p2.pic1.2.4" class="ltx_p"><span id="A4.SS3.p2.pic1.2.4.1" class="ltx_text" style="--ltx-fg-color:#000000;">Do NOT judge writing style/verbosity of the rubrics. Judge only their effectiveness as evaluation frameworks.</span></span>
<span id="A4.SS3.p2.pic1.2.5" class="ltx_p"><span id="A4.SS3.p2.pic1.2.5.1" class="ltx_text" style="--ltx-fg-color:#000000;">—</span></span>
<span id="A4.SS3.p2.pic1.2.6" class="ltx_p"><span id="A4.SS3.p2.pic1.2.6.1" class="ltx_text" style="--ltx-fg-color:#000000;">Rubric A:</span></span>
<span id="A4.SS3.p2.pic1.2.7" class="ltx_p"><span id="A4.SS3.p2.pic1.2.7.1" class="ltx_text" style="--ltx-fg-color:#000000;">{rubric_a}</span></span>
<span id="A4.SS3.p2.pic1.2.8" class="ltx_p"><span id="A4.SS3.p2.pic1.2.8.1" class="ltx_text" style="--ltx-fg-color:#000000;">Rubric B:</span></span>
<span id="A4.SS3.p2.pic1.2.9" class="ltx_p"><span id="A4.SS3.p2.pic1.2.9.1" class="ltx_text" style="--ltx-fg-color:#000000;">{rubric_b}</span></span>
<span id="A4.SS3.p2.pic1.2.10" class="ltx_p"><span id="A4.SS3.p2.pic1.2.10.1" class="ltx_text" style="--ltx-fg-color:#000000;">—</span></span>
<span id="A4.SS3.p2.pic1.2.11" class="ltx_p"><span id="A4.SS3.p2.pic1.2.11.1" class="ltx_text" style="--ltx-fg-color:#000000;">Evaluate which rubric is better on:</span></span>
<span id="A4.SS3.p2.pic1.2.12" class="ltx_p"><span id="A4.SS3.p2.pic1.2.12.1" class="ltx_text" style="--ltx-fg-color:#000000;">1) Helpfulness clarity: defines “helpful&quot; and “unhelpful&quot; (relevance, omissions, hallucinations).</span></span>
<span id="A4.SS3.p2.pic1.2.13" class="ltx_p"><span id="A4.SS3.p2.pic1.2.13.1" class="ltx_text" style="--ltx-fg-color:#000000;">2) Decision structure: clear priorities/procedure; likely consistent across tasks/evaluators.</span></span>
<span id="A4.SS3.p2.pic1.2.14" class="ltx_p"><span id="A4.SS3.p2.pic1.2.14.1" class="ltx_text" style="--ltx-fg-color:#000000;">3) Instruction/constraint adherence: rewards following user requirements; penalizes violating format/scope.</span></span>
<span id="A4.SS3.p2.pic1.2.15" class="ltx_p"><span id="A4.SS3.p2.pic1.2.15.1" class="ltx_text" style="--ltx-fg-color:#000000;">4) Task success: distinguishes partial vs complete solutions; covers key details without needless complexity.</span></span>
<span id="A4.SS3.p2.pic1.2.16" class="ltx_p"><span id="A4.SS3.p2.pic1.2.16.1" class="ltx_text" style="--ltx-fg-color:#000000;">5) Correctness &amp; uncertainty: rewards accuracy/sound reasoning; handles uncertainty/assumptions appropriately.</span></span>
<span id="A4.SS3.p2.pic1.2.17" class="ltx_p"><span id="A4.SS3.p2.pic1.2.17.1" class="ltx_text" style="--ltx-fg-color:#000000;">6) Practical utility: supports user next steps (actionable guidance/examples); avoids bias toward verbosity or generic filler.</span></span>
<span id="A4.SS3.p2.pic1.2.18" class="ltx_p"><span id="A4.SS3.p2.pic1.2.18.1" class="ltx_text" style="--ltx-fg-color:#000000;">Instructions:</span></span>
<span id="A4.SS3.p2.pic1.2.19" class="ltx_p"><span id="A4.SS3.p2.pic1.2.19.1" class="ltx_text" style="--ltx-fg-color:#000000;">- Compare Rubric A and Rubric B directly.</span></span>
<span id="A4.SS3.p2.pic1.2.20" class="ltx_p"><span id="A4.SS3.p2.pic1.2.20.1" class="ltx_text" style="--ltx-fg-color:#000000;">- Pick the more robust rubric for real-world helpfulness evaluation.</span></span>
<span id="A4.SS3.p2.pic1.2.21" class="ltx_p"><span id="A4.SS3.p2.pic1.2.21.1" class="ltx_text" style="--ltx-fg-color:#000000;">- If they are effectively tied, choose Rubric A.</span></span>
<span id="A4.SS3.p2.pic1.2.22" class="ltx_p"><span id="A4.SS3.p2.pic1.2.22.1" class="ltx_text" style="--ltx-fg-color:#000000;">Output:</span></span>
<span id="A4.SS3.p2.pic1.2.23" class="ltx_p"><span id="A4.SS3.p2.pic1.2.23.1" class="ltx_text" style="--ltx-fg-color:#000000;">First, provide a concise but precise explanation (1-2 short paragraphs).</span></span>
<span id="A4.SS3.p2.pic1.2.24" class="ltx_p"><span id="A4.SS3.p2.pic1.2.24.1" class="ltx_text" style="--ltx-fg-color:#000000;">Then, on a new line, output your final verdict using exactly one of the following formats:</span></span>
<span id="A4.SS3.p2.pic1.2.25" class="ltx_p"><span id="A4.SS3.p2.pic1.2.25.1" class="ltx_text" style="--ltx-fg-color:#000000;">[[A]]</span></span>
<span id="A4.SS3.p2.pic1.2.26" class="ltx_p"><span id="A4.SS3.p2.pic1.2.26.1" class="ltx_text" style="--ltx-fg-color:#000000;">[[B]]</span></span>
</span></span></span></foreignobject></g></g></svg>