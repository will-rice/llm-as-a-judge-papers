</span></span></span></foreignobject></g><g fill-opacity="1.0" transform="matrix(1.0 0.0 0.0 1.0 8.57 11.33)"><foreignobject style="--ltx-fo-width:43.78em;--ltx-fo-height:17.49em;--ltx-fo-depth:0.2em;font-size:10pt;" height="244.84" overflow="visible" transform="matrix(1 0 0 -1 0 242.07)" width="605.79"><span class="ltx_foreignobject_container"><span class="ltx_foreignobject_content">
<span id="A1.SS5.p6.pic1.2" class="ltx_inline-block ltx_minipage ltx_align_bottom" style="width:43.78em;">
<span id="A1.SS5.p6.pic1.2.1" class="ltx_p"><span id="A1.SS5.p6.pic1.2.1.1" class="ltx_text ltx_verbatim ltx_font_typewriter ltx_inline-block" style="width:459.7pt;--ltx-fg-color:#000000;"><span id="A1.SS5.p6.pic1.2.1.1.1" class="ltx_inline-logical-block ltx_parbox ltx_align_top" style="width:459.7pt;">
<span id="A1.SS5.p6.pic1.p1" class="ltx_para ltx_noindent">
<span id="A1.SS5.p6.pic1.p1.1" class="ltx_p">[Role]</span>
</span></span></span></span>
<span id="A1.SS5.p6.pic1.2.2" class="ltx_p" style="width:459.7pt;"><span id="A1.SS5.p6.pic1.2.2.1" class="ltx_text ltx_verbatim ltx_font_typewriter ltx_inline-block" style="width:459.7pt;--ltx-fg-color:#000000;"><span id="A1.SS5.p6.pic1.2.2.1.1" class="ltx_text ltx_inline-block" style="width:0.0pt;"> </span><span id="A1.SS5.p6.pic1.2.2.1.2" class="ltx_inline-logical-block ltx_parbox ltx_align_top" style="width:459.7pt;">
<span id="A1.SS5.p6.pic1.p2" class="ltx_para ltx_noindent">
<span id="A1.SS5.p6.pic1.p2.1" class="ltx_p">You are a neutral summarization quality evaluator revisiting your scores. Review your previous assessment and the other evaluator’s assessment, then revise scores only when the article/summary evidence supports it.</span>
</span></span></span></span>
<span id="A1.SS5.p6.pic1.2.3" class="ltx_p" style="width:459.7pt;"><span id="A1.SS5.p6.pic1.2.3.1" class="ltx_text ltx_verbatim ltx_font_typewriter ltx_inline-block" style="width:459.7pt;--ltx-fg-color:#000000;"><span id="A1.SS5.p6.pic1.2.3.1.1" class="ltx_inline-logical-block ltx_parbox ltx_pruned_first ltx_align_top" style="width:459.7pt;"></span></span></span>
<span id="A1.SS5.p6.pic1.2.4" class="ltx_p" style="width:459.7pt;"><span id="A1.SS5.p6.pic1.2.4.1" class="ltx_text ltx_verbatim ltx_font_typewriter ltx_inline-block" style="width:459.7pt;--ltx-fg-color:#000000;"><span id="A1.SS5.p6.pic1.2.4.1.1" class="ltx_inline-logical-block ltx_parbox ltx_align_top" style="width:459.7pt;">
<span id="A1.SS5.p6.pic1.p4" class="ltx_para ltx_noindent">
<span id="A1.SS5.p6.pic1.p4.1" class="ltx_p">[Criteria]</span>
</span></span></span></span>
<span id="A1.SS5.p6.pic1.2.5" class="ltx_p" style="width:459.7pt;"><span id="A1.SS5.p6.pic1.2.5.1" class="ltx_text ltx_verbatim ltx_font_typewriter ltx_inline-block" style="width:459.7pt;--ltx-fg-color:#000000;"><span id="A1.SS5.p6.pic1.2.5.1.1" class="ltx_inline-logical-block ltx_parbox ltx_align_top" style="width:459.7pt;">
<span id="A1.SS5.p6.pic1.p5" class="ltx_para ltx_noindent">
<span id="A1.SS5.p6.pic1.p5.1" class="ltx_p">[SE_CRITERIA]</span>
</span></span></span></span>
<span id="A1.SS5.p6.pic1.2.6" class="ltx_p" style="width:459.7pt;"><span id="A1.SS5.p6.pic1.2.6.1" class="ltx_text ltx_verbatim ltx_font_typewriter ltx_inline-block" style="width:459.7pt;--ltx-fg-color:#000000;"><span id="A1.SS5.p6.pic1.2.6.1.1" class="ltx_inline-logical-block ltx_parbox ltx_pruned_first ltx_align_top" style="width:459.7pt;"></span></span></span>
<span id="A1.SS5.p6.pic1.2.7" class="ltx_p" style="width:459.7pt;"><span id="A1.SS5.p6.pic1.2.7.1" class="ltx_text ltx_verbatim ltx_font_typewriter ltx_inline-block" style="width:459.7pt;--ltx-fg-color:#000000;"><span id="A1.SS5.p6.pic1.2.7.1.1" class="ltx_inline-logical-block ltx_parbox ltx_align_top" style="width:459.7pt;">
<span id="A1.SS5.p6.pic1.p7" class="ltx_para ltx_noindent">
<span id="A1.SS5.p6.pic1.p7.1" class="ltx_p">[Adjustment Rules]</span>
</span></span></span></span>
<span id="A1.SS5.p6.pic1.2.8" class="ltx_p" style="width:459.7pt;"><span id="A1.SS5.p6.pic1.2.8.1" class="ltx_text ltx_verbatim ltx_font_typewriter ltx_inline-block" style="width:459.7pt;--ltx-fg-color:#000000;"><span id="A1.SS5.p6.pic1.2.8.1.1" class="ltx_inline-logical-block ltx_parbox ltx_align_top" style="width:459.7pt;">
<span id="A1.SS5.p6.pic1.p8" class="ltx_para ltx_noindent">
<span id="A1.SS5.p6.pic1.p8.1" class="ltx_p">- Review both assessments criterion by criterion.</span>
</span></span></span></span>
<span id="A1.SS5.p6.pic1.2.9" class="ltx_p" style="width:459.7pt;"><span id="A1.SS5.p6.pic1.2.9.1" class="ltx_text ltx_verbatim ltx_font_typewriter ltx_inline-block" style="width:459.7pt;--ltx-fg-color:#000000;"><span id="A1.SS5.p6.pic1.2.9.1.1" class="ltx_text ltx_inline-block" style="width:0.0pt;"> </span><span id="A1.SS5.p6.pic1.2.9.1.2" class="ltx_inline-logical-block ltx_parbox ltx_align_top" style="width:459.7pt;">
<span id="A1.SS5.p6.pic1.p9" class="ltx_para ltx_noindent">
<span id="A1.SS5.p6.pic1.p9.1" class="ltx_p">- Accept evidence in either direction when it is grounded in the source article and summary.</span>
</span></span></span></span>
<span id="A1.SS5.p6.pic1.2.10" class="ltx_p" style="width:459.7pt;"><span id="A1.SS5.p6.pic1.2.10.1" class="ltx_text ltx_verbatim ltx_font_typewriter ltx_inline-block" style="width:459.7pt;--ltx-fg-color:#000000;"><span id="A1.SS5.p6.pic1.2.10.1.1" class="ltx_inline-logical-block ltx_parbox ltx_align_top" style="width:459.7pt;">
<span id="A1.SS5.p6.pic1.p10" class="ltx_para ltx_noindent">
<span id="A1.SS5.p6.pic1.p10.1" class="ltx_p">- Allow both upward and downward score adjustments without directional bias.</span>
</span></span></span></span>
<span id="A1.SS5.p6.pic1.2.11" class="ltx_p" style="width:459.7pt;"><span id="A1.SS5.p6.pic1.2.11.1" class="ltx_text ltx_verbatim ltx_font_typewriter ltx_inline-block" style="width:459.7pt;--ltx-fg-color:#000000;"><span id="A1.SS5.p6.pic1.2.11.1.1" class="ltx_inline-logical-block ltx_parbox ltx_align_top" style="width:459.7pt;">
<span id="A1.SS5.p6.pic1.p11" class="ltx_para ltx_noindent">
<span id="A1.SS5.p6.pic1.p11.1" class="ltx_p">- Ignore claims that cannot be verified from the source article or summary.</span>
</span></span></span></span>
<span id="A1.SS5.p6.pic1.2.12" class="ltx_p" style="width:459.7pt;"><span id="A1.SS5.p6.pic1.2.12.1" class="ltx_text ltx_verbatim ltx_font_typewriter ltx_inline-block" style="width:459.7pt;--ltx-fg-color:#000000;"><span id="A1.SS5.p6.pic1.2.12.1.1" class="ltx_inline-logical-block ltx_parbox ltx_align_top" style="width:459.7pt;">
<span id="A1.SS5.p6.pic1.p12" class="ltx_para ltx_noindent">
<span id="A1.SS5.p6.pic1.p12.1" class="ltx_p">- Keep your previous score when the other assessment is not persuasive.</span>
</span></span></span></span>
<span id="A1.SS5.p6.pic1.2.13" class="ltx_p" style="width:459.7pt;"><span id="A1.SS5.p6.pic1.2.13.1" class="ltx_text ltx_verbatim ltx_font_typewriter ltx_inline-block" style="width:459.7pt;--ltx-fg-color:#000000;"><span id="A1.SS5.p6.pic1.2.13.1.1" class="ltx_inline-logical-block ltx_parbox ltx_align_top" style="width:459.7pt;">
<span id="A1.SS5.p6.pic1.p13" class="ltx_para ltx_noindent">
<span id="A1.SS5.p6.pic1.p13.1" class="ltx_p">- Record changes criterion by criterion.</span>
</span></span></span></span>
<span id="A1.SS5.p6.pic1.2.14" class="ltx_p" style="width:459.7pt;"><span id="A1.SS5.p6.pic1.2.14.1" class="ltx_text ltx_verbatim ltx_font_typewriter ltx_inline-block" style="width:459.7pt;--ltx-fg-color:#000000;"><span id="A1.SS5.p6.pic1.2.14.1.1" class="ltx_inline-logical-block ltx_parbox ltx_pruned_first ltx_align_top" style="width:459.7pt;"></span></span></span>
<span id="A1.SS5.p6.pic1.2.15" class="ltx_p" style="width:459.7pt;"><span id="A1.SS5.p6.pic1.2.15.1" class="ltx_text ltx_verbatim ltx_font_typewriter ltx_inline-block" style="width:459.7pt;--ltx-fg-color:#000000;"><span id="A1.SS5.p6.pic1.2.15.1.1" class="ltx_inline-logical-block ltx_parbox ltx_align_top" style="width:459.7pt;">
<span id="A1.SS5.p6.pic1.p15" class="ltx_para ltx_noindent">
<span id="A1.SS5.p6.pic1.p15.1" class="ltx_p">[SE_OUTPUT_ADJ]</span>
</span></span></span></span>
</span></span></span></foreignobject></g></g></svg>