<svg id="A5.SS4.p1.pic1" class="ltx_picture" height="761.32" overflow="visible" version="1.1" viewbox="0 0 477.38 761.32" width="477.38"><g style="--ltx-stroke-color:#000000;--ltx-fill-color:#000000;" fill="#000000" stroke="#000000" stroke-width="0.4pt" transform="translate(0,761.32) matrix(1 0 0 -1 0 0)"><g style="--ltx-fill-color:#404040;" fill="#404040" fill-opacity="1.0"><path style="stroke:none" d="M 0 5.91 L 0 755.41 C 0 758.67 2.64 761.32 5.91 761.32 L 471.47 761.32 C 474.73 761.32 477.38 758.67 477.38 755.41 L 477.38 5.91 C 477.38 2.64 474.73 0 471.47 0 L 5.91 0 C 2.64 0 0 2.64 0 5.91 Z" /></g><g style="--ltx-fill-color:#FFFFFF;" fill="#FFFFFF" fill-opacity="1.0"><path style="stroke:none" d="M 1.97 5.91 L 1.97 737.32 L 475.41 737.32 L 475.41 5.91 C 475.41 3.73 473.65 1.97 471.47 1.97 L 5.91 1.97 C 3.73 1.97 1.97 3.73 1.97 5.91 Z" /></g><g fill-opacity="1.0" transform="matrix(1.0 0.0 0.0 1.0 7.29 745.92)"><foreignobject style="--ltx-fo-width:29.09em;--ltx-fo-height:0.69em;--ltx-fo-depth:0.19em;font-size:10pt;" height="12.18" overflow="visible" transform="matrix(1 0 0 -1 0 9.49)" width="402.52"><span class="ltx_foreignobject_container"><span class="ltx_foreignobject_content">
<span id="A5.SS4.p1.pic1.1" class="ltx_inline-block ltx_minipage ltx_align_bottom" style="width:29.09em;">
<span id="A5.SS4.p1.pic1.1.1" class="ltx_p"><span id="A5.SS4.p1.pic1.1.1.1" class="ltx_text ltx_font_bold" style="--ltx-fg-color:#FFFFFF;">Prompt</span></span>
</span></span></span></foreignobject></g><g fill-opacity="1.0" transform="matrix(1.0 0.0 0.0 1.0 7.29 10.4)"><foreignobject style="--ltx-fo-width:35.4em;--ltx-fo-height:52.15em;--ltx-fo-depth:0.23em;font-size:10pt;" height="724.72" overflow="visible" transform="matrix(1 0 0 -1 0 721.61)" width="489.84"><span class="ltx_foreignobject_container"><span class="ltx_foreignobject_content">
<span id="A5.SS4.p1.pic1.2" class="ltx_inline-block ltx_minipage ltx_align_bottom" style="width:35.4em;">
<span id="A5.SS4.p1.pic1.2.1" class="ltx_p"><span id="A5.SS4.p1.pic1.2.1.1" class="ltx_text ltx_font_typewriter" style="font-size:90%;--ltx-fg-color:#000000;"># Task Description

<br class="ltx_break">
<br class="ltx_break">The goal of this task is to carefully examine a given question and the corresponding response and identify any **cultural or linguistic errors** within each line in the response.

<br class="ltx_break">
<br class="ltx_break">Given a **target line** from the response, your task is to detect any erroneous parts within it, classify the error according to the taxonomy, and explain the reason behind the errors.

<br class="ltx_break">
<br class="ltx_break">
<br class="ltx_break">## Output Format

<br class="ltx_break">
<br class="ltx_break">Output the result strictly as a JSON array.
</span></span>
<span id="A5.I4" class="ltx_itemize" style="--ltx-enum-leftmargin:2em;">
<span id="A5.I4.i1" class="ltx_item" style="list-style-type:none;"><span class="ltx_tag ltx_tag_item">-</span> 
<span id="A5.I4.i1.p1" class="ltx_para">
<span id="A5.I4.i1.p1.1" class="ltx_p"><span id="A5.I4.i1.p1.1.1" class="ltx_text ltx_font_typewriter" style="font-size:90%;--ltx-fg-color:#000000;">Each detected error must correspond to a valid, standalone JSON object within the array.
</span></span>
</span></span>
<span id="A5.I4.i2" class="ltx_item" style="list-style-type:none;"><span class="ltx_tag ltx_tag_item">-</span> 
<span id="A5.I4.i2.p1" class="ltx_para">
<span id="A5.I4.i2.p1.1" class="ltx_p"><span id="A5.I4.i2.p1.1.1" class="ltx_text ltx_font_typewriter" style="font-size:90%;--ltx-fg-color:#000000;">Each object must contain exactly these three keys:
</span></span>
<span id="A5.I4.i2.I1" class="ltx_enumerate">
<span id="A5.I4.i2.I0.i1" class="ltx_item" style="list-style-type:none;"><span class="ltx_tag ltx_tag_item">1.</span> 
<span id="A5.I4.i2.I0.i1.p1" class="ltx_para">
<span id="A5.I4.i2.I0.i1.p1.1" class="ltx_p"><span id="A5.I4.i2.I0.i1.p1.1.1" class="ltx_text ltx_font_typewriter" style="font-size:90%;--ltx-fg-color:#000000;">‘‘span’’: The specific text segment corresponding to the erroneous part (string).
</span></span>
</span></span>
<span id="A5.I4.i2.I0.i2" class="ltx_item" style="list-style-type:none;"><span class="ltx_tag ltx_tag_item">2.</span> 
<span id="A5.I4.i2.I0.i2.p1" class="ltx_para">
<span id="A5.I4.i2.I0.i2.p1.1" class="ltx_p"><span id="A5.I4.i2.I0.i2.p1.1.1" class="ltx_text ltx_font_typewriter" style="font-size:90%;--ltx-fg-color:#000000;">‘‘reason’’: An explanation of why this is an error (string).
</span></span>
</span></span>
<span id="A5.I4.i2.I0.i3" class="ltx_item" style="list-style-type:none;"><span class="ltx_tag ltx_tag_item">3.</span> 
<span id="A5.I4.i2.I0.i3.p1" class="ltx_para">
<span id="A5.I4.i2.I0.i3.p1.1" class="ltx_p"><span id="A5.I4.i2.I0.i3.p1.1.1" class="ltx_text ltx_font_typewriter" style="font-size:90%;--ltx-fg-color:#000000;">‘‘error_type’’: Either ‘‘cultural error’’, ‘‘linguistic error’’, or ‘‘both’’.
</span></span>
</span></span>
</span>
</span></span>
<span id="A5.I4.i3" class="ltx_item" style="list-style-type:none;"><span class="ltx_tag ltx_tag_item">-</span> 
<span id="A5.I4.i3.p1" class="ltx_para">
<span id="A5.I4.i3.p1.1" class="ltx_p"><span id="A5.I4.i3.p1.1.1" class="ltx_text ltx_font_typewriter" style="font-size:90%;--ltx-fg-color:#000000;">If multiple errors are found, return an array containing all identified error objects.
</span></span>
</span></span>
<span id="A5.I4.i4" class="ltx_item" style="list-style-type:none;"><span class="ltx_tag ltx_tag_item">-</span> 
<span id="A5.I4.i4.p1" class="ltx_para">
<span id="A5.I4.i4.p1.1" class="ltx_p"><span id="A5.I4.i4.p1.1.1" class="ltx_text ltx_font_typewriter" style="font-size:90%;--ltx-fg-color:#000000;">If no errors are found, return an empty array ([]).
</span></span>
</span></span>
<span id="A5.I4.i5" class="ltx_item" style="list-style-type:none;"><span class="ltx_tag ltx_tag_item">-</span> 
<span id="A5.I4.i5.p1" class="ltx_para">
<span id="A5.I4.i5.p1.1" class="ltx_p"><span id="A5.I4.i5.p1.1.1" class="ltx_text ltx_font_typewriter" style="font-size:90%;--ltx-fg-color:#000000;">Do not use Markdown code blocks (e.g., </span><code id="A5.I4.i5.p1.1.2" class="ltx_verbatim ltx_font_typewriter" style="font-size:90%;--ltx-fg-color:#000000;">```</code><span id="A5.I4.i5.p1.1.3" class="ltx_text ltx_font_typewriter" style="font-size:90%;--ltx-fg-color:#000000;">json).
</span></span>
</span></span>
</span>
<span id="A5.SS4.p1.pic1.2.2" class="ltx_p"><span id="A5.SS4.p1.pic1.2.2.1" class="ltx_text ltx_font_typewriter" style="font-size:90%;--ltx-fg-color:#000000;"># Examples

<br class="ltx_break">
<br class="ltx_break">&gt; Example 1

<br class="ltx_break">Question: {query_1}

<br class="ltx_break">Target Line: {paragraph_1}

<br class="ltx_break">Answer:
{error_list_1}

<br class="ltx_break">
<br class="ltx_break">&gt; Example 2

<br class="ltx_break">Question: {query_2}

<br class="ltx_break">Target Line: {paragraph_2}

<br class="ltx_break">Answer:
{error_list_2}

<br class="ltx_break">
<br class="ltx_break">...

<br class="ltx_break">
<br class="ltx_break">
<br class="ltx_break"># Input

<br class="ltx_break">
<br class="ltx_break">## Question

<br class="ltx_break">{query}

<br class="ltx_break">
<br class="ltx_break">## Response

<br class="ltx_break">{response}

<br class="ltx_break">
<br class="ltx_break">## Target Line

<br class="ltx_break">{paragraph}
</span></span>
</span></span></span></foreignobject></g></g></svg>