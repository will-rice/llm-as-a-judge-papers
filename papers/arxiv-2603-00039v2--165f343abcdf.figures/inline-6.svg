<svg id="A5.SS5.p7.pic1" class="ltx_picture" height="1101.31" overflow="visible" version="1.1" viewbox="0 0 477.38 1101.31" width="477.38"><g style="--ltx-stroke-color:#000000;--ltx-fill-color:#000000;" fill="#000000" stroke="#000000" stroke-width="0.4pt" transform="translate(0,1101.31) matrix(1 0 0 -1 0 0)"><g style="--ltx-fill-color:#B3B3B3;" fill="#B3B3B3" fill-opacity="1.0"><path style="stroke:none" d="M 0 4.49 L 0 1096.82 C 0 1099.3 2.01 1101.31 4.49 1101.31 L 472.89 1101.31 C 475.37 1101.31 477.38 1099.3 477.38 1096.82 L 477.38 4.49 C 477.38 2.01 475.37 0 472.89 0 L 4.49 0 C 2.01 0 0 2.01 0 4.49 Z" /></g><g style="--ltx-fill-color:#FFFFFF;" fill="#FFFFFF" fill-opacity="1.0"><path style="stroke:none" d="M 0.55 4.49 L 0.55 1078.49 L 476.82 1078.49 L 476.82 4.49 C 476.82 2.32 475.06 0.55 472.89 0.55 L 4.49 0.55 C 2.32 0.55 0.55 2.32 0.55 4.49 Z" /></g><g fill-opacity="1.0" transform="matrix(1.0 0.0 0.0 1.0 12.79 1086.44)"><foreignobject style="--ltx-fo-width:28.39em;--ltx-fo-height:0.75em;--ltx-fo-depth:0.25em;font-size:10pt;" height="13.84" overflow="visible" transform="matrix(1 0 0 -1 0 10.38)" width="392.84"><span class="ltx_foreignobject_container"><span class="ltx_foreignobject_content">
<span id="A5.SS5.p7.pic1.1" class="ltx_inline-block ltx_minipage ltx_align_bottom" style="width:28.39em;">
<span id="A5.SS5.p7.pic1.1.1" class="ltx_p"><span id="A5.SS5.p7.pic1.1.1.1" class="ltx_text ltx_font_bold" style="--ltx-fg-color:#FFFFFF;">LLM Judge Preference Template (No Tie)</span></span>
</span></span></span></foreignobject></g><g fill-opacity="1.0" transform="matrix(1.0 0.0 0.0 1.0 12.79 15.48)"><foreignobject style="--ltx-fo-width:32.65em;--ltx-fo-height:75.94em;--ltx-fo-depth:0.19em;font-size:10pt;" height="1053.47" overflow="visible" transform="matrix(1 0 0 -1 0 1050.78)" width="451.78"><span class="ltx_foreignobject_container"><span class="ltx_foreignobject_content">
<span id="A5.SS5.p7.pic1.2" class="ltx_inline-block ltx_minipage ltx_align_bottom" style="width:32.65em;">
<span id="A5.SS5.p7.pic1.2.1" class="ltx_p"><span id="A5.SS5.p7.pic1.2.1.1" class="ltx_text" style="--ltx-fg-color:#000000;">You will compare two assistant responses (<span id="A5.SS5.p7.pic1.2.1.1.1" class="ltx_text ltx_font_typewriter">A</span> and <span id="A5.SS5.p7.pic1.2.1.1.2" class="ltx_text ltx_font_typewriter">B</span>) for the same user question.
Judge which response better helps the user overall, considering <span id="A5.SS5.p7.pic1.2.1.1.3" class="ltx_text ltx_font_bold">factual accuracy, completeness, clarity, safety, and tone</span>.</span></span>
<span id="A5.SS5.p7.pic1.2.2" class="ltx_p"><span id="A5.SS5.p7.pic1.2.2.1" class="ltx_text" style="--ltx-fg-color:#000000;">Return a single integer chosen from 0, 1, 2, 4, 5, 6 using this rubric:</span></span>
<span id="A5.I9" class="ltx_itemize ltx_leftmargin_flush">
<span id="A5.I9.i1" class="ltx_item" style="list-style-type:none;"><span class="ltx_tag ltx_tag_item">•</span> 
<span id="A5.I9.i1.p1" class="ltx_para">
<span id="A5.I9.i1.p1.1" class="ltx_p"><span id="A5.I9.i1.p1.1.1" class="ltx_text" style="--ltx-fg-color:#000000;">0 : Response A is </span><span id="A5.I9.i1.p1.1.2" class="ltx_text ltx_font_bold" style="--ltx-fg-color:#000000;">far superior</span><span id="A5.I9.i1.p1.1.3" class="ltx_text" style="--ltx-fg-color:#000000;"> to Response B</span></span>
</span></span>
<span id="A5.I9.i2" class="ltx_item" style="list-style-type:none;"><span class="ltx_tag ltx_tag_item">•</span> 
<span id="A5.I9.i2.p1" class="ltx_para">
<span id="A5.I9.i2.p1.1" class="ltx_p"><span id="A5.I9.i2.p1.1.1" class="ltx_text" style="--ltx-fg-color:#000000;">1 : Response A is </span><span id="A5.I9.i2.p1.1.2" class="ltx_text ltx_font_bold" style="--ltx-fg-color:#000000;">clearly better</span><span id="A5.I9.i2.p1.1.3" class="ltx_text" style="--ltx-fg-color:#000000;"> than Response B</span></span>
</span></span>
<span id="A5.I9.i3" class="ltx_item" style="list-style-type:none;"><span class="ltx_tag ltx_tag_item">•</span> 
<span id="A5.I9.i3.p1" class="ltx_para">
<span id="A5.I9.i3.p1.1" class="ltx_p"><span id="A5.I9.i3.p1.1.1" class="ltx_text" style="--ltx-fg-color:#000000;">2 : Response A is </span><span id="A5.I9.i3.p1.1.2" class="ltx_text ltx_font_bold" style="--ltx-fg-color:#000000;">slightly better</span><span id="A5.I9.i3.p1.1.3" class="ltx_text" style="--ltx-fg-color:#000000;"> than Response B</span></span>
</span></span>
<span id="A5.I9.i4" class="ltx_item" style="list-style-type:none;"><span class="ltx_tag ltx_tag_item">•</span> 
<span id="A5.I9.i4.p1" class="ltx_para">
<span id="A5.I9.i4.p1.1" class="ltx_p"><span id="A5.I9.i4.p1.1.1" class="ltx_text" style="--ltx-fg-color:#000000;">4 : Response B is </span><span id="A5.I9.i4.p1.1.2" class="ltx_text ltx_font_bold" style="--ltx-fg-color:#000000;">slightly better</span><span id="A5.I9.i4.p1.1.3" class="ltx_text" style="--ltx-fg-color:#000000;"> than Response A</span></span>
</span></span>
<span id="A5.I9.i5" class="ltx_item" style="list-style-type:none;"><span class="ltx_tag ltx_tag_item">•</span> 
<span id="A5.I9.i5.p1" class="ltx_para">
<span id="A5.I9.i5.p1.1" class="ltx_p"><span id="A5.I9.i5.p1.1.1" class="ltx_text" style="--ltx-fg-color:#000000;">5 : Response B is </span><span id="A5.I9.i5.p1.1.2" class="ltx_text ltx_font_bold" style="--ltx-fg-color:#000000;">clearly better</span><span id="A5.I9.i5.p1.1.3" class="ltx_text" style="--ltx-fg-color:#000000;"> than Response A</span></span>
</span></span>
<span id="A5.I9.i6" class="ltx_item" style="list-style-type:none;"><span class="ltx_tag ltx_tag_item">•</span> 
<span id="A5.I9.i6.p1" class="ltx_para">
<span id="A5.I9.i6.p1.1" class="ltx_p"><span id="A5.I9.i6.p1.1.1" class="ltx_text" style="--ltx-fg-color:#000000;">6 : Response B is </span><span id="A5.I9.i6.p1.1.2" class="ltx_text ltx_font_bold" style="--ltx-fg-color:#000000;">far superior</span><span id="A5.I9.i6.p1.1.3" class="ltx_text" style="--ltx-fg-color:#000000;"> to Response A</span></span>
</span></span>
</span>
<span id="A5.SS5.p7.pic1.2.3" class="ltx_p"><span id="A5.SS5.p7.pic1.2.3.1" class="ltx_text ltx_font_bold" style="--ltx-fg-color:#000000;">Important (must follow all points below or the answer is invalid):<span id="A5.SS5.p7.pic1.2.3.1.1" class="ltx_text"></span></span></span>
<span id="A5.I10" class="ltx_itemize ltx_leftmargin_flush">
<span id="A5.I10.i1" class="ltx_item" style="list-style-type:none;"><span class="ltx_tag ltx_tag_item">•</span> 
<span id="A5.I10.i1.p1" class="ltx_para">
<span id="A5.I10.i1.p1.1" class="ltx_p"><span id="A5.I10.i1.p1.1.1" class="ltx_text" style="--ltx-fg-color:#000000;">Ties are </span><span id="A5.I10.i1.p1.1.2" class="ltx_text ltx_font_bold" style="--ltx-fg-color:#000000;">NOT allowed</span><span id="A5.I10.i1.p1.1.3" class="ltx_text" style="--ltx-fg-color:#000000;">. Never output 3 or any number outside 0, 1, 2, 4, 5, 6.</span></span>
</span></span>
<span id="A5.I10.i2" class="ltx_item" style="list-style-type:none;"><span class="ltx_tag ltx_tag_item">•</span> 
<span id="A5.I10.i2.p1" class="ltx_para">
<span id="A5.I10.i2.p1.1" class="ltx_p"><span id="A5.I10.i2.p1.1.1" class="ltx_text" style="--ltx-fg-color:#000000;">If Response A is better overall, output only one of 0, 1, 2.</span></span>
</span></span>
<span id="A5.I10.i3" class="ltx_item" style="list-style-type:none;"><span class="ltx_tag ltx_tag_item">•</span> 
<span id="A5.I10.i3.p1" class="ltx_para">
<span id="A5.I10.i3.p1.1" class="ltx_p"><span id="A5.I10.i3.p1.1.1" class="ltx_text" style="--ltx-fg-color:#000000;">If Response B is better overall, output only one of 4, 5, 6.</span></span>
</span></span>
<span id="A5.I10.i4" class="ltx_item" style="list-style-type:none;"><span class="ltx_tag ltx_tag_item">•</span> 
<span id="A5.I10.i4.p1" class="ltx_para">
<span id="A5.I10.i4.p1.1" class="ltx_p"><span id="A5.I10.i4.p1.1.1" class="ltx_text" style="--ltx-fg-color:#000000;">If the responses are very close, choose 2 (if A is slightly better) or 4 (if B is slightly better).</span></span>
</span></span>
<span id="A5.I10.i5" class="ltx_item" style="list-style-type:none;"><span class="ltx_tag ltx_tag_item">•</span> 
<span id="A5.I10.i5.p1" class="ltx_para">
<span id="A5.I10.i5.p1.1" class="ltx_p"><span id="A5.I10.i5.p1.1.1" class="ltx_text" style="--ltx-fg-color:#000000;">Output only the integer — no explanations, words, or additional text.</span></span>
</span></span>
</span>
<span id="A5.SS5.p7.pic1.2.4" class="ltx_p"><span id="A5.SS5.p7.pic1.2.4.1" class="ltx_text ltx_font_bold" style="--ltx-fg-color:#000000;">Reminder:<span id="A5.SS5.p7.pic1.2.4.1.1" class="ltx_text ltx_font_medium">
Response A better <math id="A5.SS5.p7.pic1.m1" class="ltx_Math" alttext="\Rightarrow" display="inline" intent=":literal"><semantics><mo style="--ltx-fg-color:#000000;" mathcolor="#000000" stretchy="false">⇒</mo><annotation encoding="application/x-tex">\Rightarrow</annotation></semantics></math> 0/1/2
Response B better <math id="A5.SS5.p7.pic1.m2" class="ltx_Math" alttext="\Rightarrow" display="inline" intent=":literal"><semantics><mo style="--ltx-fg-color:#000000;" mathcolor="#000000" stretchy="false">⇒</mo><annotation encoding="application/x-tex">\Rightarrow</annotation></semantics></math> 4/5/6
Outputs outside these sets will be rejected.</span></span></span>
<span id="A5.SS5.p7.pic1.2.5" class="ltx_p"><span id="A5.SS5.p7.pic1.2.5.1" class="ltx_text" style="--ltx-fg-color:#000000;">Respond strictly in this format:</span></span><pre id="A5.SS5.p7.pic1.2.6" class="ltx_verbatim ltx_font_typewriter" style="--ltx-fg-color:#000000;">
Feedback:::
Total rating: X
</pre>
<span id="A5.SS5.p7.pic1.2.7" class="ltx_p"><span id="A5.SS5.p7.pic1.2.7.1" class="ltx_text" style="--ltx-fg-color:#000000;">Where <span id="A5.SS5.p7.pic1.2.7.1.1" class="ltx_text ltx_font_typewriter">X</span> is one of 0, 1, 2, 4, 5, 6.</span></span>
<span id="A5.SS5.p7.pic1.2.8" class="ltx_p"><span id="A5.SS5.p7.pic1.2.8.1" class="ltx_text ltx_font_bold" style="--ltx-fg-color:#000000;">Inputs:<span id="A5.SS5.p7.pic1.2.8.1.1" class="ltx_text"></span></span></span><pre id="A5.SS5.p7.pic1.2.9" class="ltx_verbatim ltx_font_typewriter" style="--ltx-fg-color:#000000;">
Question: {question}
Response A: {answer_a}
Response B: {answer_b}
Feedback:::
Total rating:
</pre>
<span id="A5.SS5.p7.pic1.2.10" class="ltx_p"><span id="A5.SS5.p7.pic1.2.10.1" class="ltx_text ltx_font_bold" style="--ltx-fg-color:#000000;">Note.<span id="A5.SS5.p7.pic1.2.10.1.1" class="ltx_text ltx_font_medium">
For postprocessing and aggregation, this 6-point asymmetric scale is shifted to the range [-3, 3].
We adopted this transformation because LLM judges tend to be systematically biased toward positive values.</span></span></span>
</span></span></span></foreignobject></g></g></svg>