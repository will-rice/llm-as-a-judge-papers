<span id="A1.SS3.p6.pic1.p10" class="ltx_para ltx_noindent">
<span id="A1.SS3.p6.pic1.p10.1" class="ltx_p">[Lenient Rules]</span>
</span></span></span></span>
<span id="A1.SS3.p6.pic1.2.11" class="ltx_p" style="width:459.7pt;"><span id="A1.SS3.p6.pic1.2.11.1" class="ltx_text ltx_verbatim ltx_font_typewriter ltx_inline-block" style="width:459.7pt;--ltx-fg-color:#000000;"><span id="A1.SS3.p6.pic1.2.11.1.1" class="ltx_inline-logical-block ltx_parbox ltx_align_top" style="width:459.7pt;">
<span id="A1.SS3.p6.pic1.p11" class="ltx_para ltx_noindent">
<span id="A1.SS3.p6.pic1.p11.1" class="ltx_p">- If direction (positive/negative) aligns with the article, give higher scores.</span>
</span></span></span></span>
<span id="A1.SS3.p6.pic1.2.12" class="ltx_p" style="width:459.7pt;"><span id="A1.SS3.p6.pic1.2.12.1" class="ltx_text ltx_verbatim ltx_font_typewriter ltx_inline-block" style="width:459.7pt;--ltx-fg-color:#000000;"><span id="A1.SS3.p6.pic1.2.12.1.1" class="ltx_inline-logical-block ltx_parbox ltx_align_top" style="width:459.7pt;">
<span id="A1.SS3.p6.pic1.p12" class="ltx_para ltx_noindent">
<span id="A1.SS3.p6.pic1.p12.1" class="ltx_p">- Only penalize clear hallucinations (content not at all in the article).</span>
</span></span></span></span>
<span id="A1.SS3.p6.pic1.2.13" class="ltx_p" style="width:459.7pt;"><span id="A1.SS3.p6.pic1.2.13.1" class="ltx_text ltx_verbatim ltx_font_typewriter ltx_inline-block" style="width:459.7pt;--ltx-fg-color:#000000;"><span id="A1.SS3.p6.pic1.2.13.1.1" class="ltx_inline-logical-block ltx_parbox ltx_align_top" style="width:459.7pt;">
<span id="A1.SS3.p6.pic1.p13" class="ltx_para ltx_noindent">
<span id="A1.SS3.p6.pic1.p13.1" class="ltx_p">- Default: score &gt;= 3 unless there is obvious failure.</span>
</span></span></span></span>
<span id="A1.SS3.p6.pic1.2.14" class="ltx_p" style="width:459.7pt;"><span id="A1.SS3.p6.pic1.2.14.1" class="ltx_text ltx_verbatim ltx_font_typewriter ltx_inline-block" style="width:459.7pt;--ltx-fg-color:#000000;"><span id="A1.SS3.p6.pic1.2.14.1.1" class="ltx_inline-logical-block ltx_parbox ltx_align_top" style="width:459.7pt;">
<span id="A1.SS3.p6.pic1.p14" class="ltx_para ltx_noindent">
<span id="A1.SS3.p6.pic1.p14.1" class="ltx_p">- Explain each criterion separately.</span>
</span></span></span></span>
