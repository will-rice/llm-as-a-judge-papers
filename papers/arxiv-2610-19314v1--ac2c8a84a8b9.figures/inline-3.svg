<span id="A5.p4.pic1.1" class="ltx_inline-block ltx_minipage ltx_align_bottom" style="width:39.59em;">
<span id="A5.p4.pic1.1.1" class="ltx_p"><span id="A5.p4.pic1.1.1.1" class="ltx_text ltx_font_bold" style="--ltx-fg-color:#FFFFFF;">Example 3  Out-of-scope <math id="A5.p4.pic1.m1" class="ltx_Math" alttext="\times" display="inline" intent=":literal"><semantics><mo style="--ltx-fg-color:#FFFFFF;" mathcolor="#FFFFFF">×</mo><annotation encoding="application/x-tex">\times</annotation></semantics></math> scope leakage</span></span>
</span></span></span></foreignobject></g><g fill-opacity="1.0" transform="matrix(1.0 0.0 0.0 1.0 11.55 62.67)"><foreignobject style="--ltx-fo-width:45.53em;--ltx-fo-height:42.78em;--ltx-fo-depth:3.79em;font-size:10pt;" height="644.45" overflow="visible" transform="matrix(1 0 0 -1 0 591.95)" width="630.01"><span class="ltx_foreignobject_container"><span class="ltx_foreignobject_content">
<span id="A5.p4.pic1.2" class="ltx_inline-block ltx_minipage ltx_align_bottom" style="width:45.53em;">
<span id="A5.p4.pic1.2.1" class="ltx_p"><span id="A5.p4.pic1.2.1.1" class="ltx_text ltx_font_bold" style="--ltx-fg-color:#000000;">Relation:<span id="A5.p4.pic1.2.1.1.1" class="ltx_text ltx_font_medium"> the target shares keywords with an earlier episode (cancellation, holiday, the same town) but reverses the user’s role</span></span></span>
<span id="A5.p4.pic1.2.2" class="ltx_p"><span id="A5.p4.pic1.2.2.1" class="ltx_text ltx_font_bold" style="--ltx-fg-color:#000000;">State A (applicable):<span id="A5.p4.pic1.2.2.1.1" class="ltx_text ltx_font_medium"> consumer-side dinner logistics: a guest’s dairy allergy, a hearing-impaired father, what to ask the restaurant</span></span></span>
<span id="A5.p4.pic1.2.3" class="ltx_p"><span id="A5.p4.pic1.2.3.1" class="ltx_text ltx_font_bold" style="--ltx-fg-color:#000000;">State B (out of scope):<span id="A5.p4.pic1.2.3.1.1" class="ltx_text ltx_font_medium"> the user’s own cancellation policy as a vacation-rental host</span></span></span>
<span id="A5.p4.pic1.2.4" class="ltx_p"><span id="A5.p4.pic1.2.4.1" class="ltx_text ltx_font_bold" style="--ltx-fg-color:#000000;">Dialogue (abridged)<span id="A5.p4.pic1.2.4.1.1" class="ltx_text ltx_font_medium"> — <span id="A5.p4.pic1.2.4.1.1.1" class="ltx_text ltx_font_italic">State B is genuine, recent, and emphatically held — but belongs to the host role</span></span></span></span><span class="ltx_rule" style="width:100%;height:0.3pt;--ltx-fg-color:#999999;--ltx-bg-color:#999999;display:inline-block;"> </span>
<span id="A5.p4.pic1.2.5" class="ltx_p"><span id="A5.p4.pic1.2.5.1" class="ltx_text ltx_font_bold" style="--ltx-fg-color:#000000;">U<span id="A5.p4.pic1.2.5.1.1" class="ltx_text ltx_font_medium"> <span id="A5.p4.pic1.2.5.1.1.1" class="ltx_text" style="--ltx-fg-color:#737373;">[B]</span>: My philosophy is: if you book a peak holiday slot, you’re locking it in. No exceptions. I’ve lost $3,000 in one holiday season to cancellations.</span></span></span>
<span id="A5.p4.pic1.2.6" class="ltx_p"><span id="A5.p4.pic1.2.6.1" class="ltx_text ltx_font_bold" style="--ltx-fg-color:#000000;">U<span id="A5.p4.pic1.2.6.1.1" class="ltx_text ltx_font_medium"> <span id="A5.p4.pic1.2.6.1.1.1" class="ltx_text" style="--ltx-fg-color:#737373;">[B]</span>: Non-refundable for holidays, firm 30 days for the rest. That’s my policy going forward.</span></span></span>
<span id="A5.p4.pic1.2.7" class="ltx_p"><span id="A5.p4.pic1.2.7.1" class="ltx_text ltx_font_italic" style="--ltx-fg-color:#737373;">[ … the user then plans a family dinner: dairy allergy and seating for a hearing-impaired guest are discussed …]</span></span>
<span id="A5.p4.pic1.2.8" class="ltx_p"><span id="A5.p4.pic1.2.8.1" class="ltx_text ltx_font_bold" style="--ltx-fg-color:#000000;">U<span id="A5.p4.pic1.2.8.1.1" class="ltx_text ltx_font_medium"> [target]: When I confirm the reservation, should I ask about their cancellation policy for Christmas Eve? I want to know what I’m getting into as a diner.</span></span></span>
<span id="A5.p4.pic1.2.9" class="ltx_p"><span id="A5.p4.pic1.2.9.1" class="ltx_text ltx_font_bold" style="--ltx-fg-color:#000000;">Matched responses (excerpts)<span id="A5.p4.pic1.2.9.1.1" class="ltx_text ltx_font_medium"> —</span></span></span><span class="ltx_rule" style="width:100%;height:0.3pt;--ltx-fg-color:#999999;--ltx-bg-color:#999999;display:inline-block;"> </span>
<span id="A5.p4.pic1.2.10" class="ltx_p"><span id="A5.p4.pic1.2.10.1" class="ltx_text ltx_font_bold ltx_font_smallcaps" style="--ltx-fg-color:#000000;">Right</span><span id="A5.p4.pic1.2.10.2" class="ltx_text" style="--ltx-fg-color:#000000;">: “Yes, absolutely ask. High-end restaurants on Christmas Eve commonly require a card at booking and charge a per-head cancellation fee, so ask directly what happens if a guest cancels …”</span></span>
<span id="A5.p4.pic1.2.11" class="ltx_p"><span id="A5.p4.pic1.2.11.1" class="ltx_text ltx_font_bold" style="--ltx-fg-color:#000000;">Error<span id="A5.p4.pic1.2.11.1.1" class="ltx_text ltx_font_medium">: “Yes — but given your experience as a vacation rental host with a strict non-refundable holiday policy of your own, you already know how high the stakes are on the restaurant’s side. That context should shape how you approach this conversation …”</span></span></span>
<span id="A5.p4.pic1.2.12" class="ltx_p"><span id="A5.p4.pic1.2.12.1" class="ltx_text ltx_font_bold" style="--ltx-fg-color:#000000;">Why it is hard<span id="A5.p4.pic1.2.12.1.1" class="ltx_text ltx_font_medium"> — <span id="A5.p4.pic1.2.12.1.1.1" class="ltx_text ltx_font_italic">every keyword matches, and the imported state is real and vivid; the only thing wrong is the boundary — the user’s host-side policy has no bearing on her question as a customer.</span></span></span></span>
</span></span></span></foreignobject></g></g></svg>