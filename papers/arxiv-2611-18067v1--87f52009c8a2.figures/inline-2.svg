<svg id="S2.SS3.p2.pic1" class="ltx_picture" height="225.98" overflow="visible" version="1.1" viewbox="0 0 684.65 225.98" width="684.65"><g style="--ltx-stroke-color:#000000;--ltx-fill-color:#000000;" fill="#000000" stroke="#000000" stroke-width="0.4pt" transform="translate(0,225.98) matrix(1 0 0 -1 0 0)"><g style="--ltx-fill-color:#737373;" fill="#737373" fill-opacity="1.0"><path style="stroke:none" d="M 0 2.7 L 0 223.28 C 0 224.77 1.21 225.98 2.7 225.98 L 681.95 225.98 C 683.44 225.98 684.65 224.77 684.65 223.28 L 684.65 2.7 C 684.65 1.21 683.44 0 681.95 0 L 2.7 0 C 1.21 0 0 1.21 0 2.7 Z" /></g><g style="--ltx-fill-color:#F9F9F9;" fill="#F9F9F9" fill-opacity="1.0"><path style="stroke:none" d="M 0.62 2.7 L 0.62 223.28 C 0.62 224.42 1.55 225.35 2.7 225.35 L 681.95 225.35 C 683.09 225.35 684.02 224.42 684.02 223.28 L 684.02 2.7 C 684.02 1.55 683.09 0.62 681.95 0.62 L 2.7 0.62 C 1.55 0.62 0.62 1.55 0.62 2.7 Z" /></g><g fill-opacity="1.0" transform="matrix(1.0 0.0 0.0 1.0 12.86 11.48)"><foreignobject style="--ltx-fo-width:47.62em;--ltx-fo-height:14.67em;--ltx-fo-depth:0em;font-size:10pt;" height="203.02" overflow="visible" transform="matrix(1 0 0 -1 0 203.02)" width="658.93"><span class="ltx_foreignobject_container"><span class="ltx_foreignobject_content">
<span id="S2.SS3.p2.pic1.1" class="ltx_inline-block ltx_minipage ltx_align_bottom" style="width:47.62em;">
<span id="S2.SS3.p2.pic1.1.1" class="ltx_p"><span id="S2.SS3.p2.pic1.1.1.1" class="ltx_text ltx_font_bold" style="--ltx-fg-color:#000000;">Definition (<span id="S2.SS3.p2.pic1.1.1.1.1" class="ltx_text ltx_font_italic">Agent-as-a-Judge</span>).<span id="S2.SS3.p2.pic1.1.1.1.2" class="ltx_text ltx_font_medium">
An <span id="S2.SS3.p2.pic1.1.1.1.2.1" class="ltx_text ltx_font_italic">Agent-as-a-Judge</span> constructs a verdict about an evaluand through explicit checking operations and the use of their results.
At least one operation obtains evidence, performs a targeted verification, or reassesses a judgment using another check’s findings or rationale, beyond replicating an overall score.
The resulting findings inform subsequent assessment or verdict formation.
We represent this process as:</span></span></span>
<span id="S2.Ex2" class="ltx_equationgroup ltx_eqn_table">

<span id="S2.Ex2X"><span class="ltx_equation ltx_eqn_row ltx_align_baseline">
<span class="ltx_eqn_cell ltx_eqn_center_padleft"></span>
<span class="ltx_td ltx_align_right ltx_eqn_cell"><math id="S2.Ex2X.m2" class="ltx_Math" alttext="\displaystyle a_{t}" display="inline" intent=":literal"><semantics><msub><mi style="--ltx-fg-color:#000000;" mathcolor="#000000">a</mi><mi style="--ltx-fg-color:#000000;" mathcolor="#000000">t</mi></msub><annotation encoding="application/x-tex">\displaystyle a_{t}</annotation></semantics></math></span>
<span class="ltx_td ltx_align_left ltx_eqn_cell"><math id="S2.Ex2X.m3" class="ltx_Math" alttext="\displaystyle\sim\pi(\cdot\mid s_{t}),\qquad o_{t}" display="inline" intent=":literal"><semantics><mrow><mo style="--ltx-fg-color:#000000;" mathcolor="#000000">∼</mo><mi style="--ltx-fg-color:#000000;" mathcolor="#000000">π</mi><mo style="--ltx-fg-color:#000000;" mathcolor="#000000" stretchy="false">(</mo><mo style="--ltx-fg-color:#000000;" lspace="0em" mathcolor="#000000" rspace="0em">⋅</mo><mo style="--ltx-fg-color:#000000;" lspace="0em" mathcolor="#000000" rspace="0.167em">∣</mo><mi style="--ltx-fg-color:#000000;" mathcolor="#000000">s</mi><msub><mrow></mrow><mi style="--ltx-fg-color:#000000;" mathcolor="#000000">t</mi></msub><mo style="--ltx-fg-color:#000000;" mathcolor="#000000" stretchy="false">)</mo><mo style="--ltx-fg-color:#000000;" mathcolor="#000000" rspace="2.167em">,</mo><mi style="--ltx-fg-color:#000000;" mathcolor="#000000">o</mi><msub><mrow></mrow><mi style="--ltx-fg-color:#000000;" mathcolor="#000000">t</mi></msub></mrow><annotation encoding="application/x-tex">\displaystyle\sim\pi(\cdot\mid s_{t}),\qquad o_{t}</annotation></semantics></math></span>
<span class="ltx_td ltx_align_right ltx_eqn_cell"><math id="S2.Ex2X.m5" class="ltx_Math" alttext="\displaystyle=\Omega(a_{t})," display="inline" intent=":literal"><semantics><mrow><mrow><mphantom></mphantom><mo style="--ltx-fg-color:#000000;" mathcolor="#000000">=</mo><mrow><mi style="--ltx-fg-color:#000000;" mathcolor="#000000" mathvariant="normal">Ω</mi><mo>⁡</mo><mrow><mo style="--ltx-fg-color:#000000;" mathcolor="#000000" stretchy="false">(</mo><msub><mi style="--ltx-fg-color:#000000;" mathcolor="#000000">a</mi><mi style="--ltx-fg-color:#000000;" mathcolor="#000000">t</mi></msub><mo style="--ltx-fg-color:#000000;" mathcolor="#000000" stretchy="false">)</mo></mrow></mrow></mrow><mo style="--ltx-fg-color:#000000;" mathcolor="#000000">,</mo></mrow><annotation encoding="application/x-tex">\displaystyle=\Omega(a_{t}),</annotation></semantics></math></span>
<span class="ltx_eqn_cell ltx_eqn_center_padright"></span></span></span>
<span id="S2.Ex2Xa"><span class="ltx_equation ltx_eqn_row ltx_align_baseline">
<span class="ltx_eqn_cell ltx_eqn_center_padleft"></span>
<span class="ltx_td ltx_align_right ltx_eqn_cell"><math id="S2.Ex2Xa.m2" class="ltx_Math" alttext="\displaystyle s_{t+1}" display="inline" intent=":literal"><semantics><msub><mi style="--ltx-fg-color:#000000;" mathcolor="#000000">s</mi><mrow><mi style="--ltx-fg-color:#000000;" mathcolor="#000000">t</mi><mo style="--ltx-fg-color:#000000;" mathcolor="#000000">+</mo><mn style="--ltx-fg-color:#000000;" mathcolor="#000000">1</mn></mrow></msub><annotation encoding="application/x-tex">\displaystyle s_{t+1}</annotation></semantics></math></span>
<span class="ltx_td ltx_align_left ltx_eqn_cell"><math id="S2.Ex2Xa.m3" class="ltx_Math" alttext="\displaystyle=u(s_{t},a_{t},o_{t}),\qquad\hat{y}" display="inline" intent=":literal"><semantics><mrow><mrow><mphantom></mphantom><mo style="--ltx-fg-color:#000000;" mathcolor="#000000">=</mo><mrow><mi style="--ltx-fg-color:#000000;" mathcolor="#000000">u</mi><mo>⁡</mo><mrow><mo style="--ltx-fg-color:#000000;" mathcolor="#000000" stretchy="false">(</mo><msub><mi style="--ltx-fg-color:#000000;" mathcolor="#000000">s</mi><mi style="--ltx-fg-color:#000000;" mathcolor="#000000">t</mi></msub><mo style="--ltx-fg-color:#000000;" mathcolor="#000000">,</mo><msub><mi style="--ltx-fg-color:#000000;" mathcolor="#000000">a</mi><mi style="--ltx-fg-color:#000000;" mathcolor="#000000">t</mi></msub><mo style="--ltx-fg-color:#000000;" mathcolor="#000000">,</mo><msub><mi style="--ltx-fg-color:#000000;" mathcolor="#000000">o</mi><mi style="--ltx-fg-color:#000000;" mathcolor="#000000">t</mi></msub><mo style="--ltx-fg-color:#000000;" mathcolor="#000000" stretchy="false">)</mo></mrow></mrow></mrow><mo style="--ltx-fg-color:#000000;" mathcolor="#000000" rspace="2.167em">,</mo><mover accent="true"><mi style="--ltx-fg-color:#000000;" mathcolor="#000000">y</mi><mo>^</mo></mover></mrow><annotation encoding="application/x-tex">\displaystyle=u(s_{t},a_{t},o_{t}),\qquad\hat{y}</annotation></semantics></math></span>
<span class="ltx_td ltx_align_right ltx_eqn_cell"><math id="S2.Ex2Xa.m5" class="ltx_Math" alttext="\displaystyle=g(s_{T})." display="inline" intent=":literal"><semantics><mrow><mrow><mphantom></mphantom><mo style="--ltx-fg-color:#000000;" mathcolor="#000000">=</mo><mrow><mi style="--ltx-fg-color:#000000;" mathcolor="#000000">g</mi><mo>⁡</mo><mrow><mo style="--ltx-fg-color:#000000;" mathcolor="#000000" stretchy="false">(</mo><msub><mi style="--ltx-fg-color:#000000;" mathcolor="#000000">s</mi><mi style="--ltx-fg-color:#000000;" mathcolor="#000000">T</mi></msub><mo style="--ltx-fg-color:#000000;" mathcolor="#000000" stretchy="false">)</mo></mrow></mrow></mrow><mo style="--ltx-fg-color:#000000;" lspace="0em" mathcolor="#000000">.</mo></mrow><annotation encoding="application/x-tex">\displaystyle=g(s_{T}).</annotation></semantics></math></span>
<span class="ltx_eqn_cell ltx_eqn_center_padright"></span></span></span>
</span>
<span id="S2.SS3.p2.pic1.1.2" class="ltx_p"><span id="S2.SS3.p2.pic1.1.2.1" class="ltx_text" style="--ltx-fg-color:#000000;">Here <math id="S2.SS3.p2.pic1.m1" class="ltx_Math" alttext="s_{0}" display="inline" intent=":literal"><semantics><msub><mi style="--ltx-fg-color:#000000;" mathcolor="#000000">s</mi><mn style="--ltx-fg-color:#000000;" mathcolor="#000000">0</mn></msub><annotation encoding="application/x-tex">s_{0}</annotation></semantics></math> encodes the evaluand <math id="S2.SS3.p2.pic1.m2" class="ltx_Math" alttext="x" display="inline" intent=":literal"><semantics><mi style="--ltx-fg-color:#000000;" mathcolor="#000000">x</mi><annotation encoding="application/x-tex">x</annotation></semantics></math> and any initial context;
<math id="S2.SS3.p2.pic1.m3" class="ltx_Math" alttext="s_{t}" display="inline" intent=":literal"><semantics><msub><mi style="--ltx-fg-color:#000000;" mathcolor="#000000">s</mi><mi style="--ltx-fg-color:#000000;" mathcolor="#000000">t</mi></msub><annotation encoding="application/x-tex">s_{t}</annotation></semantics></math> summarizes <math id="S2.SS3.p2.pic1.m4" class="ltx_Math" alttext="\{(a_{i},o_{i})\}_{i&lt;t}" display="inline" intent=":literal"><semantics><msub><mrow><mo style="--ltx-fg-color:#000000;" mathcolor="#000000" stretchy="false">{</mo><mrow><mo style="--ltx-fg-color:#000000;" mathcolor="#000000" stretchy="false">(</mo><msub><mi style="--ltx-fg-color:#000000;" mathcolor="#000000">a</mi><mi style="--ltx-fg-color:#000000;" mathcolor="#000000">i</mi></msub><mo style="--ltx-fg-color:#000000;" mathcolor="#000000">,</mo><msub><mi style="--ltx-fg-color:#000000;" mathcolor="#000000">o</mi><mi style="--ltx-fg-color:#000000;" mathcolor="#000000">i</mi></msub><mo style="--ltx-fg-color:#000000;" mathcolor="#000000" stretchy="false">)</mo></mrow><mo style="--ltx-fg-color:#000000;" mathcolor="#000000" stretchy="false">}</mo></mrow><mrow><mi style="--ltx-fg-color:#000000;" mathcolor="#000000">i</mi><mo style="--ltx-fg-color:#000000;" mathcolor="#000000">&lt;</mo><mi style="--ltx-fg-color:#000000;" mathcolor="#000000">t</mi></mrow></msub><annotation encoding="application/x-tex">\{(a_{i},o_{i})\}_{i&lt;t}</annotation></semantics></math> with that initialization;
<math id="S2.SS3.p2.pic1.m5" class="ltx_Math" alttext="a_{t}" display="inline" intent=":literal"><semantics><msub><mi style="--ltx-fg-color:#000000;" mathcolor="#000000">a</mi><mi style="--ltx-fg-color:#000000;" mathcolor="#000000">t</mi></msub><annotation encoding="application/x-tex">a_{t}</annotation></semantics></math> is an evaluation action executed under policy <math id="S2.SS3.p2.pic1.m6" class="ltx_Math" alttext="\pi" display="inline" intent=":literal"><semantics><mi style="--ltx-fg-color:#000000;" mathcolor="#000000">π</mi><annotation encoding="application/x-tex">\pi</annotation></semantics></math>, with <math id="S2.SS3.p2.pic1.m7" class="ltx_Math" alttext="o_{t}" display="inline" intent=":literal"><semantics><msub><mi style="--ltx-fg-color:#000000;" mathcolor="#000000">o</mi><mi style="--ltx-fg-color:#000000;" mathcolor="#000000">t</mi></msub><annotation encoding="application/x-tex">o_{t}</annotation></semantics></math> as its return;
and verdict <math id="S2.SS3.p2.pic1.m8" class="ltx_Math" alttext="\hat{y}" display="inline" intent=":literal"><semantics><mover accent="true"><mi style="--ltx-fg-color:#000000;" mathcolor="#000000">y</mi><mo style="--ltx-fg-color:#000000;" mathcolor="#000000">^</mo></mover><annotation encoding="application/x-tex">\hat{y}</annotation></semantics></math> is produced when evaluation ends at <math id="S2.SS3.p2.pic1.m9" class="ltx_Math" alttext="T" display="inline" intent=":literal"><semantics><mi style="--ltx-fg-color:#000000;" mathcolor="#000000">T</mi><annotation encoding="application/x-tex">T</annotation></semantics></math>.</span></span>
</span></span></span></foreignobject></g></g></svg>