<svg id="A3.F13.pic1" class="ltx_picture ltx_centering" height="820.46" overflow="visible" version="1.1" viewbox="0 0 653.15 820.46" width="653.15"><g style="--ltx-stroke-color:#000000;--ltx-fill-color:#000000;" fill="#000000" stroke="#000000" stroke-width="0.4pt" transform="translate(0,820.46) matrix(1 0 0 -1 0 0)"><g style="--ltx-fill-color:#CF8B3D;" fill="#CF8B3D" fill-opacity="1.0"><path style="stroke:none" d="M 0 7.61 L 0 812.85 C 0 817.05 3.41 820.46 7.61 820.46 L 645.54 820.46 C 649.74 820.46 653.15 817.05 653.15 812.85 L 653.15 7.61 C 653.15 3.41 649.74 0 645.54 0 L 7.61 0 C 3.41 0 0 3.41 0 7.61 Z" /></g><g style="--ltx-fill-color:#F2F2F2;" fill="#F2F2F2" fill-opacity="1.0"><path style="stroke:none" d="M 0.69 7.61 L 0.69 794.17 L 652.46 794.17 L 652.46 7.61 C 652.46 3.79 649.36 0.69 645.54 0.69 L 7.61 0.69 C 3.79 0.69 0.69 3.79 0.69 7.61 Z" /></g><g fill-opacity="1.0" transform="matrix(1.0 0.0 0.0 1.0 6.23 803.85)"><foreignobject style="--ltx-fo-width:40.26em;--ltx-fo-height:0.75em;--ltx-fo-depth:0.25em;font-size:10pt;" height="13.84" overflow="visible" transform="matrix(1 0 0 -1 0 10.38)" width="557.09"><span class="ltx_foreignobject_container"><span class="ltx_foreignobject_content">
<span id="A3.F13.pic1.1" class="ltx_inline-block ltx_minipage ltx_align_bottom" style="width:40.26em;">
<span id="A3.F13.pic1.1.1" class="ltx_p"><span id="A3.F13.pic1.1.1.1" class="ltx_text ltx_font_bold" style="--ltx-fg-color:#FFFFFF;">Prompt of LLM-as-Decision-Maker (Node Insertion)</span></span>
</span></span></span></foreignobject></g><g fill-opacity="1.0" transform="matrix(1.0 0.0 0.0 1.0 8.99 12.45)"><foreignobject style="--ltx-fo-width:45.9em;--ltx-fo-height:55.9em;--ltx-fo-depth:0.25em;font-size:10pt;" height="776.88" overflow="visible" transform="matrix(1 0 0 -1 0 773.42)" width="635.13"><span class="ltx_foreignobject_container"><span class="ltx_foreignobject_content">
<span id="A3.F13.pic1.2" class="ltx_inline-block ltx_minipage ltx_align_bottom" style="width:45.9em;">
<span id="A3.F13.pic1.2.1" class="ltx_p"><span id="A3.F13.pic1.2.1.1" class="ltx_text" style="--ltx-fg-color:#000000;">Your task is to add a new node to a tree-structured classification system. I will give you some <span id="A3.F13.pic1.2.1.1.1" class="ltx_text ltx_font_typewriter">[Current Level Nodes]</span> and a <span id="A3.F13.pic1.2.1.1.2" class="ltx_text ltx_font_typewriter">[New Node]</span>. You need to determine the next action and respond strictly in the specified format. Before giving the final answer, you must perform brief analysis. 
<br class="ltx_break"></span></span>
<span id="A3.F13.pic1.2.2" class="ltx_p"><span id="A3.F13.pic1.2.2.1" class="ltx_text" style="--ltx-fg-color:#000000;"># Task 1 
<br class="ltx_break">Analyze whether the <span id="A3.F13.pic1.2.2.1.1" class="ltx_text ltx_font_typewriter">[New Node]</span> shares identical meaning with any <span id="A3.F13.pic1.2.2.1.2" class="ltx_text ltx_font_typewriter">[Current Level Nodes]</span> (including exact matches, case variations, abbreviations, or conceptually equivalent expressions). If identical, return <span id="A3.F13.pic1.2.2.1.3" class="ltx_text ltx_font_typewriter">&lt;decision&gt;EXIST&lt;/decision&gt;</span> and skip subsequent tasks. 
<br class="ltx_break">Analyze whether the <span id="A3.F13.pic1.2.2.1.4" class="ltx_text ltx_font_typewriter">[New Node]</span> represents a specific category or a classification criterion. If it’s a classification criterion, return <span id="A3.F13.pic1.2.2.1.5" class="ltx_text ltx_font_typewriter">&lt;decision&gt;EXIST&lt;/decision&gt;</span> and skip subsequent tasks. 
<br class="ltx_break"></span></span>
<span id="A3.F13.pic1.2.3" class="ltx_p"><span id="A3.F13.pic1.2.3.1" class="ltx_text" style="--ltx-fg-color:#000000;"># Task 2 
<br class="ltx_break">Analyze whether the <span id="A3.F13.pic1.2.3.1.1" class="ltx_text ltx_font_typewriter">[New Node]</span> doesn’t belong to any subordinate node of <span id="A3.F13.pic1.2.3.1.2" class="ltx_text ltx_font_typewriter">[Current Level Nodes]</span> but should be at the same level. If yes, return <span id="A3.F13.pic1.2.3.1.3" class="ltx_text ltx_font_typewriter">&lt;decision&gt;ADD&lt;/decision&gt;</span> and skip subsequent tasks. 
<br class="ltx_break"></span></span>
<span id="A3.F13.pic1.2.4" class="ltx_p"><span id="A3.F13.pic1.2.4.1" class="ltx_text" style="--ltx-fg-color:#000000;"># Task 3 
<br class="ltx_break">Identify which <span id="A3.F13.pic1.2.4.1.1" class="ltx_text ltx_font_typewriter">[Current Level Node]</span> the <span id="A3.F13.pic1.2.4.1.2" class="ltx_text ltx_font_typewriter">[New Node]</span> should belong to as a subordinate node. Return the parent node’s name wrapped in <span id="A3.F13.pic1.2.4.1.3" class="ltx_text ltx_font_typewriter">&lt;decision&gt;&lt;/decision&gt;</span>. 
<br class="ltx_break"></span></span>
<span id="A3.F13.pic1.2.5" class="ltx_p"><span id="A3.F13.pic1.2.5.1" class="ltx_text" style="--ltx-fg-color:#000000;">## Example 
<br class="ltx_break">Current Level Nodes: <span id="A3.F13.pic1.2.5.1.1" class="ltx_text ltx_font_typewriter">[&quot;Fruits&quot;, &quot;Vegetables&quot;, &quot;Electronics&quot;]</span> 
<br class="ltx_break">New Node: Phone 
<br class="ltx_break">Output: <span id="A3.F13.pic1.2.5.1.2" class="ltx_text ltx_font_typewriter">&lt;decision&gt;Electronics&lt;/decision&gt;</span> 
<br class="ltx_break"></span></span>
<span id="A3.F13.pic1.2.6" class="ltx_p"><span id="A3.F13.pic1.2.6.1" class="ltx_text" style="--ltx-fg-color:#000000;">## New Node 
<br class="ltx_break">{new_node} 
<br class="ltx_break"></span></span>
<span id="A3.F13.pic1.2.7" class="ltx_p"><span id="A3.F13.pic1.2.7.1" class="ltx_text" style="--ltx-fg-color:#000000;">## Current Level Nodes 
<br class="ltx_break">{current_keys} 
<br class="ltx_break"></span></span>
<span id="A3.F13.pic1.2.8" class="ltx_p"><span id="A3.F13.pic1.2.8.1" class="ltx_text" style="--ltx-fg-color:#000000;">## Reference Classification System (for reference only) 
<br class="ltx_break">{init_tree}</span></span>
</span></span></span></foreignobject></g></g></svg>