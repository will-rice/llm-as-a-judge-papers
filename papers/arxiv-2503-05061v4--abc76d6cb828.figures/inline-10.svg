<span class="ltx_td ltx_align_left ltx_eqn_cell"><math id="A4.Ex1Xc.m3" class="ltx_Math" alttext="\displaystyle=\$7,875-\$3,000=\$4,875" display="inline" intent=":literal"><semantics><mrow><mphantom></mphantom><mo style="--ltx-fg-color:#000000;" mathcolor="#000000" rspace="0.1389em">=</mo><mrow><mrow><mo style="--ltx-fg-color:#000000;" lspace="0.1389em" mathcolor="#000000" rspace="0.167em">$</mo><mn style="--ltx-fg-color:#000000;" mathcolor="#000000">7,875</mn></mrow><mo style="--ltx-fg-color:#000000;" mathcolor="#000000">−</mo><mrow><mo style="--ltx-fg-color:#000000;" lspace="0em" mathcolor="#000000" rspace="0.167em">$</mo><mn style="--ltx-fg-color:#000000;" mathcolor="#000000">3,000</mn></mrow></mrow><mo style="--ltx-fg-color:#000000;" mathcolor="#000000" rspace="0.1389em">=</mo><mrow><mo style="--ltx-fg-color:#000000;" lspace="0.1389em" mathcolor="#000000" rspace="0.167em">$</mo><mn style="--ltx-fg-color:#000000;" mathcolor="#000000">4,875</mn></mrow></mrow><annotation encoding="application/x-tex">\displaystyle=\$7,875-\$3,000=\$4,875</annotation></semantics></math></span>
<span class="ltx_eqn_cell ltx_eqn_center_padright"></span></span></span>
