<svg id="S5.SS2.p6.pic1" class="ltx_picture" height="186.74" overflow="visible" version="1.1" viewbox="0 0 477.38 186.74" width="477.38"><g style="--ltx-stroke-color:#000000;--ltx-fill-color:#000000;" fill="#000000" stroke="#000000" stroke-width="0.4pt" transform="translate(0,186.74) matrix(1 0 0 -1 0 0)"><g style="--ltx-fill-color:#BFBFBF;" fill="#BFBFBF" fill-opacity="1.0"><path style="stroke:none" d="M 0 8.57 L 0 178.18 C 0 182.91 3.84 186.74 8.57 186.74 L 468.81 186.74 C 473.54 186.74 477.38 182.91 477.38 178.18 L 477.38 8.57 C 477.38 3.84 473.54 0 468.81 0 L 8.57 0 C 3.84 0 0 3.84 0 8.57 Z" /></g><g style="--ltx-fill-color:#F2F2F2;" fill="#F2F2F2" fill-opacity="1.0"><path style="stroke:none" d="M 0.69 8.57 L 0.69 178.18 C 0.69 182.53 4.22 186.05 8.57 186.05 L 468.81 186.05 C 473.16 186.05 476.68 182.53 476.68 178.18 L 476.68 8.57 C 476.68 4.22 473.16 0.69 468.81 0.69 L 8.57 0.69 C 4.22 0.69 0.69 4.22 0.69 8.57 Z" /></g><g fill-opacity="1.0" transform="matrix(1.0 0.0 0.0 1.0 20.38 15.19)"><foreignobject style="--ltx-fo-width:31.56em;--ltx-fo-height:11.49em;--ltx-fo-depth:0.19em;font-size:10pt;" height="161.74" overflow="visible" transform="matrix(1 0 0 -1 0 159.05)" width="436.7"><span class="ltx_foreignobject_container"><span class="ltx_foreignobject_content">
<span id="S5.SS2.p6.pic1.1" class="ltx_inline-block ltx_minipage ltx_align_bottom" style="width:31.56em;">
<span id="S5.SS2.p6.pic1.1.1" class="ltx_p"><span id="S5.SS2.p6.pic1.1.1.1" class="ltx_text ltx_font_bold" style="--ltx-fg-color:#000000;">Findings.<span id="S5.SS2.p6.pic1.1.1.1.1" class="ltx_text ltx_font_medium"> (i) Agent feedback on textual quality transfers effectively to new tasks. Group A significantly outperformed the control group on TC, DE, and TXT, demonstrating that universal writing skills are readily generalized. (ii) Adequacy transfer appears muted on APP2 due to a <em id="S5.SS2.p6.pic1.1.1.1.1.1" class="ltx_emph ltx_font_italic">familiarity effect</em>: common e-commerce flows let both groups reach near-ceiling coverage, compressing between-group differences. After removing one low-coverage outlier, Group A’s robust ADQ mean slightly exceeds Group B, indicating transferable coverage skills that are partly masked by domain familiarity.</span></span></span>
</span></span></span></foreignobject></g></g></svg>