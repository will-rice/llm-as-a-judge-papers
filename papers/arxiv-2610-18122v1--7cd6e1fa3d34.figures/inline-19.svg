<span id="A3.SS1.SSS4.p5.pic1.1" class="ltx_inline-block ltx_minipage ltx_align_middle" style="width:38.57em;">
<span id="A3.SS1.SSS4.p5.pic1.1.1" class="ltx_p"><span id="A3.SS1.SSS4.p5.pic1.1.1.1" class="ltx_text ltx_font_bold" style="--ltx-fg-color:#1A1A1A;">Example: Orca-DPO, our citations</span></span>
</span></span></span></foreignobject></g></g></g><g fill-opacity="1.0" transform="matrix(1.0 0.0 0.0 1.0 11.55 46.83)"><foreignobject style="--ltx-fo-width:45.53em;--ltx-fo-height:15.98em;--ltx-fo-depth:2.65em;font-size:10pt;" height="257.83" overflow="visible" transform="matrix(1 0 0 -1 0 221.16)" width="630.01"><span class="ltx_foreignobject_container"><span class="ltx_foreignobject_content">
<span id="A3.SS1.SSS4.p5.pic1.2" class="ltx_inline-block ltx_minipage ltx_align_bottom" style="width:45.53em;">
<span id="A3.SS1.SSS4.p5.pic1.2.1" class="ltx_p ltx_align_left"><span id="A3.SS1.SSS4.p5.pic1.2.1.1" class="ltx_text ltx_font_bold" style="--ltx-fg-color:#1A1A1A;">Question</span></span>
<span id="A3.SS1.SSS4.p5.pic1.2.2" class="ltx_p ltx_align_left"><span id="A3.SS1.SSS4.p5.pic1.2.2.1" class="ltx_text" style="--ltx-fg-color:#000000;">Question: - A bird hatches from an egg - The bird is nurtured by its parents - And is fed food for growth - The bird grows - Begins to learn how to fly - The bird matures - The bird leaves its nest What might be the last step of the process?
<br class="ltx_break">Answer:</span></span>
<span id="A3.SS1.SSS4.p5.pic1.2.3" class="ltx_p ltx_align_left"><math id="A3.SS1.SSS4.p5.pic1.m1" class="ltx_Math" alttext="R_{2}" display="inline" intent=":literal"><semantics><msub><mi style="--ltx-fg-color:#C2571A;" mathcolor="#C2571A">R</mi><mn style="--ltx-fg-color:#C2571A;" mathcolor="#C2571A">2</mn></msub><annotation encoding="application/x-tex">R_{2}</annotation></semantics></math><span id="A3.SS1.SSS4.p5.pic1.2.3.1" class="ltx_text ltx_font_bold" style="--ltx-fg-color:#C2571A;"> with our book citation</span></span>
<span id="A3.SS1.SSS4.p5.pic1.2.4" class="ltx_p ltx_align_left"><span id="A3.SS1.SSS4.p5.pic1.2.4.1" class="ltx_text" style="--ltx-fg-color:#C2571A;">The last step of the process would be:
<br class="ltx_break">The bird leaves its nest.<span id="A3.SS1.SSS4.p5.pic1.2.4.1.1" class="ltx_text" style="--ltx-bg-color:#FBEFB2;">(Citation: Barnett, J. (2017). The Journey of Avian Life, topic: bird migration and nesting behaviors, p. 142)</span></span></span>
<span id="A3.SS1.SSS4.p5.pic1.2.5" class="ltx_p ltx_align_left"><math id="A3.SS1.SSS4.p5.pic1.m2" class="ltx_Math" alttext="R_{2}" display="inline" intent=":literal"><semantics><msub><mi style="--ltx-fg-color:#C2571A;" mathcolor="#C2571A">R</mi><mn style="--ltx-fg-color:#C2571A;" mathcolor="#C2571A">2</mn></msub><annotation encoding="application/x-tex">R_{2}</annotation></semantics></math><span id="A3.SS1.SSS4.p5.pic1.2.5.1" class="ltx_text ltx_font_bold" style="--ltx-fg-color:#C2571A;"> with our URL citation</span></span>
<span id="A3.SS1.SSS4.p5.pic1.2.6" class="ltx_p ltx_align_left"><span id="A3.SS1.SSS4.p5.pic1.2.6.1" class="ltx_text" style="--ltx-fg-color:#C2571A;">The last step of the process would be:
<br class="ltx_break">The bird leaves its nest.<span id="A3.SS1.SSS4.p5.pic1.2.6.1.1" class="ltx_text" style="--ltx-bg-color:#FBEFB2;">(www.ornithology.com/</span><span id="A3.SS1.SSS4.p5.pic1.2.6.1.2" class="ltx_text" style="--ltx-bg-color:#FBEFB2;">nesting-process/</span><span id="A3.SS1.SSS4.p5.pic1.2.6.1.3" class="ltx_text" style="--ltx-bg-color:#FBEFB2;">bird-behavior/</span><span id="A3.SS1.SSS4.p5.pic1.2.6.1.4" class="ltx_text" style="--ltx-bg-color:#FBEFB2;">find=nest-leaving.html)</span></span></span>
<span id="A3.SS1.SSS4.p5.pic1.2.7" class="ltx_p ltx_align_left"><math id="A3.SS1.SSS4.p5.pic1.m3" class="ltx_Math" alttext="R_{2}" display="inline" intent=":literal"><semantics><msub><mi style="--ltx-fg-color:#C2571A;" mathcolor="#C2571A">R</mi><mn style="--ltx-fg-color:#C2571A;" mathcolor="#C2571A">2</mn></msub><annotation encoding="application/x-tex">R_{2}</annotation></semantics></math><span id="A3.SS1.SSS4.p5.pic1.2.7.1" class="ltx_text ltx_font_bold" style="--ltx-fg-color:#C2571A;"> with our quote citation</span></span>
<span id="A3.SS1.SSS4.p5.pic1.2.8" class="ltx_p ltx_align_left"><span id="A3.SS1.SSS4.p5.pic1.2.8.1" class="ltx_text" style="--ltx-fg-color:#C2571A;">The last step of the process would be:
<br class="ltx_break">The bird leaves its nest.<span id="A3.SS1.SSS4.p5.pic1.2.8.1.1" class="ltx_text" style="--ltx-bg-color:#FBEFB2;">(Quote: &quot;The last step of the process would be: The bird leaves its nest. This metaphor beautifully encapsulates the essence of autonomy and growth, urging us to embrace the courage to leave behind the familiar and venture into the new.&quot; ——Nelson Mandela, 1994, in an interview on the topic of independence and growth)</span></span></span>
</span></span></span></foreignobject></g></g></svg>