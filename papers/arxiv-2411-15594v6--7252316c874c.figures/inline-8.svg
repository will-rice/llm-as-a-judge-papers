<span id="S2.SS3.SSS3.p2.pic1.1" class="ltx_inline-block ltx_minipage ltx_align_bottom" style="width:19.79em;">
<span id="S2.SS3.SSS3.p2.pic1.1.1" class="ltx_p"><span id="S2.SS3.SSS3.p2.pic1.1.1.1" class="ltx_text" style="font-size:173%;--ltx-fg-color:#FFFFFF;">Reliability Concerns of Post-processing Method</span></span>
</span></span></span></foreignobject></g><g fill-opacity="1.0" transform="matrix(1.0 0.0 0.0 1.0 21.65 18.43)"><foreignobject style="--ltx-fo-width:19.79em;--ltx-fo-height:19.13em;--ltx-fo-depth:0.21em;font-size:15.85pt;" height="424.11" overflow="visible" transform="matrix(1 0 0 -1 0 419.46)" width="434.03"><span class="ltx_foreignobject_container"><span class="ltx_foreignobject_content">
<span id="S2.SS3.SSS3.p2.pic1.2" class="ltx_inline-block ltx_minipage ltx_align_bottom" style="width:19.79em;">
<span id="S2.SS3.SSS3.p2.pic1.2.1" class="ltx_p"><span id="S2.SS3.SSS3.p2.pic1.2.1.1" class="ltx_text" style="font-size:173%;--ltx-fg-color:#000000;">The post-processing steps applied to LLM outputs introduce their own set of reliability challenges. Rule-based token extraction methods are inherently brittle and susceptible to minor variations in responses, potentially leading to silent errors. While logit-based normalization offers probabilistic scoring, its effectiveness is highly dependent on precise prompt design and consistent model tokenization, where inconsistencies can introduce noise. Furthermore, methods focusing on sentence-level evaluation or response selection risk propagating biases if the scoring LLM is overly sensitive to stylistic rather than substantive cues. Ultimately, all post-processing strategies remain vulnerable to adversarial manipulations designed to inflate evaluation scores without genuine content improvement.</span></span>
</span></span></span></foreignobject></g></g></svg>