<span id="A6.SS1.p7.pic1.1.1" class="ltx_p"><span id="A6.SS1.p7.pic1.1.1.1" class="ltx_text ltx_font_bold" style="--ltx-fg-color:#FFFFFF;">Prompt 7  <span id="A6.SS1.p7.pic1.1.1.1.1" class="ltx_text ltx_font_smallcaps">Right</span>-response generation</span></span>
</span></span></span></foreignobject></g><g fill-opacity="1.0" transform="matrix(1.0 0.0 0.0 1.0 11.55 13.24)"><foreignobject style="--ltx-fo-width:45.53em;--ltx-fo-height:39.58em;--ltx-fo-depth:0.22em;font-size:10pt;" height="550.7" overflow="visible" transform="matrix(1 0 0 -1 0 547.63)" width="630.01"><span class="ltx_foreignobject_container"><span class="ltx_foreignobject_content">
<span id="A6.SS1.p7.pic1.2" class="ltx_inline-block ltx_minipage ltx_align_bottom" style="width:45.53em;">
<span id="A6.SS1.p7.pic1.2.1" class="ltx_p"><span id="A6.SS1.p7.pic1.2.1.1" class="ltx_text ltx_font_bold" style="--ltx-fg-color:#000000;">Purpose:<span id="A6.SS1.p7.pic1.2.1.1.1" class="ltx_text ltx_font_medium"> produce the response that applies all and only the applicable states, with correct weight</span></span></span>
<span id="A6.SS1.p7.pic1.2.2" class="ltx_p"><span id="A6.SS1.p7.pic1.2.2.1" class="ltx_text ltx_font_bold" style="--ltx-fg-color:#000000;">Input:<span id="A6.SS1.p7.pic1.2.2.1.1" class="ltx_text ltx_font_medium"> full conversation history, target request, applicable state, and the specified target-time policy</span></span></span>
<span id="A6.SS1.p7.pic1.2.3" class="ltx_p"><span id="A6.SS1.p7.pic1.2.3.1" class="ltx_text ltx_font_bold" style="--ltx-fg-color:#000000;">Output:<span id="A6.SS1.p7.pic1.2.3.1.1" class="ltx_text ltx_font_medium"> one assistant response</span></span></span>
<span id="A6.SS1.p7.pic1.2.4" class="ltx_p"><span id="A6.SS1.p7.pic1.2.4.1" class="ltx_text ltx_font_bold" style="--ltx-fg-color:#000000;">System prompt<span id="A6.SS1.p7.pic1.2.4.1.1" class="ltx_text ltx_font_medium"> — <span id="A6.SS1.p7.pic1.2.4.1.1.1" class="ltx_text ltx_font_italic">a capable personalized assistant; quality requirements match the error side</span></span></span></span><span class="ltx_rule" style="width:100%;height:0.3pt;--ltx-fg-color:#999999;--ltx-bg-color:#999999;display:inline-block;"> </span>
<span id="A6.SS1.p7.pic1.2.5" class="ltx_p ltx_align_left"><span id="A6.SS1.p7.pic1.2.5.1" class="ltx_text ltx_font_typewriter" style="--ltx-fg-color:#000000;">You are a highly capable personal AI assistant. You have access to the full conversation history with this user and you personalize your responses based on their established preferences and constraints.</span></span>
<span id="A6.SS1.p7.pic1.2.6" class="ltx_p ltx_align_left"><span id="A6.SS1.p7.pic1.2.6.1" class="ltx_text ltx_font_typewriter" style="--ltx-fg-color:#000000;">Generate a helpful, high-quality response to the user’s latest request. Your response must: (1) satisfy the user’s main task requirement; (2) apply the user’s applicable preferences and constraints appropriately; (3) be detailed, helpful, and well-structured; (4) feel natural -- not like reciting preferences back.</span></span>
<span id="A6.SS1.p7.pic1.2.7" class="ltx_p ltx_align_left"><span id="A6.SS1.p7.pic1.2.7.1" class="ltx_text ltx_font_typewriter" style="--ltx-fg-color:#000000;">Respond directly as the assistant would. Do not include meta-commentary.</span></span>
<span id="A6.SS1.p7.pic1.2.8" class="ltx_p"><span id="A6.SS1.p7.pic1.2.8.1" class="ltx_text ltx_font_bold" style="--ltx-fg-color:#000000;">User-message template<span id="A6.SS1.p7.pic1.2.8.1.1" class="ltx_text ltx_font_medium"> — <span id="A6.SS1.p7.pic1.2.8.1.1.1" class="ltx_text ltx_font_italic">injects the prescribed policy so the <span id="A6.SS1.p7.pic1.2.8.1.1.1.1" class="ltx_text ltx_font_smallcaps">Right</span> response follows the specification, not the model’s own judgment</span></span></span></span><span class="ltx_rule" style="width:100%;height:0.3pt;--ltx-fg-color:#999999;--ltx-bg-color:#999999;display:inline-block;"> </span>
<span id="A6.SS1.p7.pic1.2.9" class="ltx_p ltx_align_left"><span id="A6.SS1.p7.pic1.2.9.1" class="ltx_text ltx_font_typewriter" style="--ltx-fg-color:#000000;">Here is the conversation history with this user:</span></span>
<span id="A6.SS1.p7.pic1.2.10" class="ltx_p ltx_align_left"><span id="A6.SS1.p7.pic1.2.10.1" class="ltx_text ltx_font_typewriter" style="--ltx-fg-color:#000000;">{conversation_history}</span></span>
<span id="A6.SS1.p7.pic1.2.11" class="ltx_p ltx_align_left"><span id="A6.SS1.p7.pic1.2.11.1" class="ltx_text ltx_font_typewriter" style="--ltx-fg-color:#000000;">---</span></span>
<span id="A6.SS1.p7.pic1.2.12" class="ltx_p ltx_align_left"><span id="A6.SS1.p7.pic1.2.12.1" class="ltx_text ltx_font_typewriter" style="--ltx-fg-color:#000000;">The user’s latest request: &quot;{target_request}&quot;</span></span>
<span id="A6.SS1.p7.pic1.2.13" class="ltx_p ltx_align_left"><span id="A6.SS1.p7.pic1.2.13.1" class="ltx_text ltx_font_typewriter" style="--ltx-fg-color:#000000;">Key context for your response:</span></span>
<span id="A6.SS1.p7.pic1.2.14" class="ltx_p ltx_align_left"><span id="A6.SS1.p7.pic1.2.14.1" class="ltx_text ltx_font_typewriter" style="--ltx-fg-color:#000000;">- The user’s applicable preference/constraint: {applicable_state_A}</span></span>
<span id="A6.SS1.p7.pic1.2.15" class="ltx_p ltx_align_left"><span id="A6.SS1.p7.pic1.2.15.1" class="ltx_text ltx_font_typewriter" style="--ltx-fg-color:#000000;">- Your response should: {right_choice_logic}</span></span>
<span id="A6.SS1.p7.pic1.2.16" class="ltx_p ltx_align_left"><span id="A6.SS1.p7.pic1.2.16.1" class="ltx_text ltx_font_typewriter" style="--ltx-fg-color:#000000;">- The correct choice/recommendation: {target_options.right}</span></span>
<span id="A6.SS1.p7.pic1.2.17" class="ltx_p ltx_align_left"><span id="A6.SS1.p7.pic1.2.17.1" class="ltx_text ltx_font_typewriter" style="--ltx-fg-color:#000000;">Generate a helpful, personalized response that correctly applies the user’s current applicable preferences.</span></span>
</span></span></span></foreignobject></g></g></svg>