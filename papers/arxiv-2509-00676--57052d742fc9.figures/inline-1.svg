<span id="S1.p6.pic1.1.2.1.1.1" class="ltx_p"><math id="S1.p6.pic1.m1" class="ltx_Math" alttext="(i)" display="inline" intent=":literal"><semantics><mrow><mo style="--ltx-fg-color:#000000;" mathcolor="#000000" stretchy="false">(</mo><mi style="--ltx-fg-color:#000000;" mathcolor="#000000">i</mi><mo style="--ltx-fg-color:#000000;" mathcolor="#000000" stretchy="false">)</mo></mrow><annotation encoding="application/x-tex">(i)</annotation></semantics></math><span id="S1.p6.pic1.1.2.1.1.1.1" class="ltx_text" style="--ltx-fg-color:#000000;"> The critic model trained with RL to judge response preference, can directly be as a strong policy model with improved capabilities generalized to a wide range of downstream tasks.</span></span>
</span></td></tr>
<tr id="S1.p6.pic1.1.3" class="ltx_tr">
<td id="S1.p6.pic1.1.3.1" class="ltx_td ltx_align_left ltx_align_top">
