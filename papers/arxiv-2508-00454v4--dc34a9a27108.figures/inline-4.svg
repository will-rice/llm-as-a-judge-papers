<span id="A7.p3.pic1.1.1" class="ltx_p"><span id="A7.p3.pic1.1.1.1" class="ltx_text ltx_font_bold" style="--ltx-fg-color:#FFFFFF;">Prompts for Pairwise Comparison Evaluation</span></span>
</span></span></span></foreignobject></g><g fill-opacity="1.0" transform="matrix(1.0 0.0 0.0 1.0 11.76 18.94)"><foreignobject style="--ltx-fo-width:45.5em;--ltx-fo-height:22.29em;--ltx-fo-depth:0.25em;font-size:10pt;" height="311.84" overflow="visible" transform="matrix(1 0 0 -1 0 308.38)" width="629.59"><span class="ltx_foreignobject_container"><span class="ltx_foreignobject_content">
<span id="A7.p3.pic1.2" class="ltx_inline-block ltx_minipage ltx_align_bottom" style="width:45.5em;">
<span id="A7.p3.pic1.2.1" class="ltx_p"><span id="A7.p3.pic1.2.1.1" class="ltx_text ltx_font_bold" style="--ltx-fg-color:#000000;">System Prompt<span id="A7.p3.pic1.2.1.1.1" class="ltx_text ltx_font_medium"> 
<br class="ltx_break">You are an expert in evaluating the quality of dialogues. 
<br class="ltx_break">Your task is to objectively and impartially evaluate the overall performance and quality of two AI assistants throughout their multi-turn dialogue.
<br class="ltx_break">### Evaluation rules: ### 
<br class="ltx_break">If Assistant A performs better than Assistant B, respond with &quot;A&quot;; 
<br class="ltx_break">if Assistant B performs better than Assistant A, respond with &quot;B&quot;; 
<br class="ltx_break">If the performance of Assistant A and Assistant B is equivalent, indistinguishable, respond with &quot;Fair&quot;. 
<br class="ltx_break"></span></span></span>
<span id="A7.p3.pic1.2.2" class="ltx_p"><span id="A7.p3.pic1.2.2.1" class="ltx_text ltx_font_bold" style="--ltx-fg-color:#000000;">User Prompt<span id="A7.p3.pic1.2.2.1.1" class="ltx_text ltx_font_medium"> 
<br class="ltx_break">Here are two dialogues you need to compare:
<br class="ltx_break">dialogue A: 
<br class="ltx_break">{dialogue_A} 
<br class="ltx_break"></span></span></span>
<span id="A7.p3.pic1.2.3" class="ltx_p"><span id="A7.p3.pic1.2.3.1" class="ltx_text" style="--ltx-fg-color:#000000;">dialogue B: 
<br class="ltx_break">{dialogue_B} 
<br class="ltx_break">
<br class="ltx_break">### Below are the instructions to assess and compare the overall quality of two responses: ### 
<br class="ltx_break">1. Make your judgment based on the evaluation rules 
<br class="ltx_break">2. Begin your response with one of these exact formats: 
<br class="ltx_break">So my final decision is: {{&quot;Overall&quot;: &quot;A&quot;}} or {{&quot;Overall&quot;: &quot;B&quot;}} or {{&quot;Overall&quot;: &quot;Fair&quot;}} 
<br class="ltx_break"></span></span>
</span></span></span></foreignobject></g></g></svg>