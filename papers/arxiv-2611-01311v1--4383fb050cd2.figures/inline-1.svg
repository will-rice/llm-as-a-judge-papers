" transform="matrix(0.0 1.0 -1.0 0.0 518.61 -62.62)"><path d="M 4.8 0 L 0.89 1.45 L 2.04 0 L 0.89 -1.45 Z" /></g><g style="--ltx-stroke-color:#8C8C8C;" stroke="#8C8C8C"><path style="fill:none" d="M 585.35 -143.98 L 3.04 -143.98 C 1.52 -143.98 0.28 -145.22 0.28 -146.74 L 0.28 -311.56 C 0.28 -313.09 1.52 -314.33 3.04 -314.33 L 585.35 -314.33 C 586.88 -314.33 588.12 -313.09 588.12 -311.56 L 588.12 -146.74 C 588.12 -145.22 586.88 -143.98 585.35 -143.98 Z M 0.28 -314.33" /></g><g style="--ltx-stroke-color:#000000;--ltx-fill-color:#000000;" fill="#000000" stroke="#000000" transform="matrix(1.0 0.0 0.0 1.0 5.81 -157.2)"><foreignobject style="--ltx-fo-width:49.04em;--ltx-fo-height:0.56em;--ltx-fo-depth:10.96em;font-size:10pt;" height="159.28" overflow="visible" transform="matrix(1 0 0 -1 0 7.69)" width="678.58"><span class="ltx_foreignobject_container"><span class="ltx_foreignobject_content">
<span id="S3.F1.pic1.7" class="ltx_inline-block ltx_minipage ltx_align_top" style="width:49.04em;">
<span id="S3.F1.pic1.7.1" class="ltx_p"></span>
<span id="S3.F1.pic1.7.2" class="ltx_p"><span id="S3.F1.pic1.7.2.1" class="ltx_text ltx_font_bold" style="font-size:80%;">What the judge sees.<span id="S3.F1.pic1.7.2.1.1" class="ltx_text ltx_font_medium"> The question, the answer, and both documents’ titles, dates and abstracts, with any
sentence that states the replacement or names the other document removed. The context is one of six primary contexts: no record (<span id="S3.F1.pic1.7.2.1.1.1" class="ltx_text ltx_font_typewriter">both-texts</span>); a line
from the correct record (<span id="S3.F1.pic1.7.2.1.1.2" class="ltx_text ltx_font_typewriter">status</span>); or a line from a damaged record with half its links dropped, where a
dropped link reads as in force. This link is dropped in the damaged record, so its fault is a <em id="S3.F1.pic1.7.2.1.1.3" class="ltx_emph ltx_font_italic">gap fault</em>. The
damaged line is shown four ways with the same content: “in force”, “no replacement recorded”, as an unverified
note, or with a warning that the record is incomplete.</span></span></span>
</span></span></span></foreignobject></g><g style="--ltx-stroke-color:#8C8C8C;" stroke="#8C8C8C"><path style="fill:none" d="M 585.35 -322.75 L 3.04 -322.75 C 1.52 -322.75 0.28 -323.99 0.28 -325.52 L 0.28 -390.71 C 0.28 -392.24 1.52 -393.48 3.04 -393.48 L 585.35 -393.48 C 586.88 -393.48 588.12 -392.24 588.12 -390.71 L 588.12 -325.52 C 588.12 -323.99 586.88 -322.75 585.35 -322.75 Z M 0.28 -393.48" /></g><g style="--ltx-stroke-color:#000000;--ltx-fill-color:#000000;" fill="#000000" stroke="#000000" transform="matrix(1.0 0.0 0.0 1.0 5.81 -335.98)"><foreignobject style="--ltx-fo-width:49.04em;--ltx-fo-height:0.56em;--ltx-fo-depth:3.76em;font-size:10pt;" height="59.65" overflow="visible" transform="matrix(1 0 0 -1 0 7.69)" width="678.58"><span class="ltx_foreignobject_container"><span class="ltx_foreignobject_content">
<span id="S3.F1.pic1.8" class="ltx_inline-block ltx_minipage ltx_align_top" style="width:49.04em;">
<span id="S3.F1.pic1.8.1" class="ltx_p"></span>
<span id="S3.F1.pic1.8.2" class="ltx_p"><span id="S3.F1.pic1.8.2.1" class="ltx_text ltx_font_bold" style="font-size:80%;">Scoring.<span id="S3.F1.pic1.8.2.1.1" class="ltx_text ltx_font_medium"> A fault counts as caught only if a finding names the cited RFC with the reason <em id="S3.F1.pic1.8.2.1.1.1" class="ltx_emph ltx_font_italic">replaced</em>. On
correct answers, a finding that the RFC was replaced or not yet published is a false alarm. A lookup in the record,
with no language model, is the baseline: it catches exactly the faults whose link the record holds.</span></span></span>
</span></span></span></foreignobject></g></g></svg>