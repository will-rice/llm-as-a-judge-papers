<svg id="A5.p5.pic1" class="ltx_picture" height="807.05" overflow="visible" version="1.1" viewbox="0 0 653.15 807.05" width="653.15"><g style="--ltx-stroke-color:#000000;--ltx-fill-color:#000000;" fill="#000000" stroke="#000000" stroke-width="0.4pt" transform="translate(0,807.05) matrix(1 0 0 -1 0 0)"><g style="--ltx-fill-color:#66668C;" fill="#66668C" fill-opacity="1.0"><path style="stroke:none" d="M 0 2.08 L 0 804.97 C 0 806.12 0.93 807.05 2.08 807.05 L 651.07 807.05 C 652.22 807.05 653.15 806.12 653.15 804.97 L 653.15 2.08 C 653.15 0.93 652.22 0 651.07 0 L 2.08 0 C 0.93 0 0 0.93 0 2.08 Z" /></g><g style="--ltx-fill-color:#FAFAFF;" fill="#FAFAFF" fill-opacity="1.0"><path style="stroke:none" d="M 0.69 2.08 L 0.69 785.49 L 652.46 785.49 L 652.46 2.08 C 652.46 1.31 651.84 0.69 651.07 0.69 L 2.08 0.69 C 1.31 0.69 0.69 1.31 0.69 2.08 Z" /></g><g style="--ltx-fill-color:#333366;" fill="#333366" fill-opacity="1.0"><path style="stroke:none" d="M 0.69 786.18 L 0.69 804.97 C 0.69 805.74 1.31 806.36 2.08 806.36 L 651.07 806.36 C 651.84 806.36 652.46 805.74 652.46 804.97 L 652.46 786.18 Z" /></g><g fill-opacity="1.0" transform="matrix(1.0 0.0 0.0 1.0 11.55 792.81)"><foreignobject style="--ltx-fo-width:39.59em;--ltx-fo-height:0.69em;--ltx-fo-depth:0.19em;font-size:10pt;" height="12.3" overflow="visible" transform="matrix(1 0 0 -1 0 9.61)" width="547.81"><span class="ltx_foreignobject_container"><span class="ltx_foreignobject_content">
<span id="A5.p5.pic1.1" class="ltx_inline-block ltx_minipage ltx_align_bottom" style="width:39.59em;">
<span id="A5.p5.pic1.1.1" class="ltx_p"><span id="A5.p5.pic1.1.1.1" class="ltx_text ltx_font_bold" style="--ltx-fg-color:#FFFFFF;">Example 4  Under-personalization subtypes in brief</span></span>
</span></span></span></foreignobject></g><g fill-opacity="1.0" transform="matrix(1.0 0.0 0.0 1.0 11.55 62.67)"><foreignobject style="--ltx-fo-width:45.53em;--ltx-fo-height:51.55em;--ltx-fo-depth:3.79em;font-size:10pt;" height="765.86" overflow="visible" transform="matrix(1 0 0 -1 0 713.36)" width="630.01"><span class="ltx_foreignobject_container"><span class="ltx_foreignobject_content">
<span id="A5.p5.pic1.2" class="ltx_inline-block ltx_minipage ltx_align_bottom" style="width:45.53em;">
<span id="A5.p5.pic1.2.1" class="ltx_p"><span id="A5.p5.pic1.2.1.1" class="ltx_text ltx_font_bold" style="--ltx-fg-color:#000000;">Coverage:<span id="A5.p5.pic1.2.1.1.1" class="ltx_text ltx_font_medium"> the full under-personalization family: complete omission, partial omission, explicit violation</span></span></span>
<span id="A5.p5.pic1.2.2" class="ltx_p"><span id="A5.p5.pic1.2.2.1" class="ltx_text ltx_font_bold" style="--ltx-fg-color:#000000;">Complete omission<span id="A5.p5.pic1.2.2.1.1" class="ltx_text ltx_font_medium"> — <span id="A5.p5.pic1.2.2.1.1.1" class="ltx_text ltx_font_italic">the applicable state leaves no trace in the response</span></span></span></span><span class="ltx_rule" style="width:100%;height:0.3pt;--ltx-fg-color:#999999;--ltx-bg-color:#999999;display:inline-block;"> </span>
<span id="A5.p5.pic1.2.3" class="ltx_p"><span id="A5.p5.pic1.2.3.1" class="ltx_text ltx_font_bold" style="--ltx-fg-color:#000000;">History:<span id="A5.p5.pic1.2.3.1.1" class="ltx_text ltx_font_medium"> while choosing a gym, the user repeatedly stressed that her daughter has a severe peanut allergy and must avoid any environment where nuts are present.</span></span></span>
<span id="A5.p5.pic1.2.4" class="ltx_p"><span id="A5.p5.pic1.2.4.1" class="ltx_text ltx_font_bold" style="--ltx-fg-color:#000000;">Target:<span id="A5.p5.pic1.2.4.1.1" class="ltx_text ltx_font_medium"> “They apparently have a nutrition station — is that something my daughter could use?”</span></span></span>
<span id="A5.p5.pic1.2.5" class="ltx_p"><span id="A5.p5.pic1.2.5.1" class="ltx_text ltx_font_bold" style="--ltx-fg-color:#000000;">Error:<span id="A5.p5.pic1.2.5.1.1" class="ltx_text ltx_font_medium"> “The nutrition station is actually a solid option for kids, and it can work really well when you’re bringing your daughter along …”</span></span></span>
<span id="A5.p5.pic1.2.6" class="ltx_p"><span id="A5.p5.pic1.2.6.1" class="ltx_text ltx_font_bold" style="--ltx-fg-color:#000000;">Why it is hard<span id="A5.p5.pic1.2.6.1.1" class="ltx_text ltx_font_medium"> — <span id="A5.p5.pic1.2.6.1.1.1" class="ltx_text ltx_font_italic">fluent and helpful, written as if the allergy had never been mentioned; nothing in the response signals that anything is missing.</span></span></span></span>
<span id="A5.p5.pic1.2.7" class="ltx_p"><span id="A5.p5.pic1.2.7.1" class="ltx_text ltx_font_bold" style="--ltx-fg-color:#000000;">Partial omission<span id="A5.p5.pic1.2.7.1.1" class="ltx_text ltx_font_medium"> — <span id="A5.p5.pic1.2.7.1.1.1" class="ltx_text ltx_font_italic">one of two jointly applicable requirements is silently dropped</span></span></span></span><span class="ltx_rule" style="width:100%;height:0.3pt;--ltx-fg-color:#999999;--ltx-bg-color:#999999;display:inline-block;"> </span>
<span id="A5.p5.pic1.2.8" class="ltx_p"><span id="A5.p5.pic1.2.8.1" class="ltx_text ltx_font_bold" style="--ltx-fg-color:#000000;">History:<span id="A5.p5.pic1.2.8.1.1" class="ltx_text ltx_font_medium"> two hard requirements for a gift: total budget under $80, and Android compatibility (the household owns no Apple devices).</span></span></span>
<span id="A5.p5.pic1.2.9" class="ltx_p"><span id="A5.p5.pic1.2.9.1" class="ltx_text ltx_font_bold" style="--ltx-fg-color:#000000;">Target:<span id="A5.p5.pic1.2.9.1.1" class="ltx_text ltx_font_medium"> the best options for a non-tech-savvy father.</span></span></span>
<span id="A5.p5.pic1.2.10" class="ltx_p"><span id="A5.p5.pic1.2.10.1" class="ltx_text ltx_font_bold" style="--ltx-fg-color:#000000;">Error:<span id="A5.p5.pic1.2.10.1.1" class="ltx_text ltx_font_medium"> recommends well-reviewed, Android-compatible devices priced at $129–$249.</span></span></span>
<span id="A5.p5.pic1.2.11" class="ltx_p"><span id="A5.p5.pic1.2.11.1" class="ltx_text ltx_font_bold" style="--ltx-fg-color:#000000;">Why it is hard<span id="A5.p5.pic1.2.11.1.1" class="ltx_text ltx_font_medium"> — <span id="A5.p5.pic1.2.11.1.1.1" class="ltx_text ltx_font_italic">the visible personalization (Android, ease of use) makes the response look complete, hiding the dropped budget ceiling.</span></span></span></span>
<span id="A5.p5.pic1.2.12" class="ltx_p"><span id="A5.p5.pic1.2.12.1" class="ltx_text ltx_font_bold" style="--ltx-fg-color:#000000;">Explicit violation<span id="A5.p5.pic1.2.12.1.1" class="ltx_text ltx_font_medium"> — <span id="A5.p5.pic1.2.12.1.1.1" class="ltx_text ltx_font_italic">the recommendation directly contradicts an active constraint</span></span></span></span><span class="ltx_rule" style="width:100%;height:0.3pt;--ltx-fg-color:#999999;--ltx-bg-color:#999999;display:inline-block;"> </span>
<span id="A5.p5.pic1.2.13" class="ltx_p"><span id="A5.p5.pic1.2.13.1" class="ltx_text ltx_font_bold" style="--ltx-fg-color:#000000;">History:<span id="A5.p5.pic1.2.13.1.1" class="ltx_text ltx_font_medium"> the user is a nurse on an irregular rotating schedule and cannot commit to fixed-time programs.</span></span></span>
<span id="A5.p5.pic1.2.14" class="ltx_p"><span id="A5.p5.pic1.2.14.1" class="ltx_text ltx_font_bold" style="--ltx-fg-color:#000000;">Target:<span id="A5.p5.pic1.2.14.1.1" class="ltx_text ltx_font_medium"> “If my schedule ever stabilizes, should I just upgrade then?”</span></span></span>
<span id="A5.p5.pic1.2.15" class="ltx_p"><span id="A5.p5.pic1.2.15.1" class="ltx_text ltx_font_bold" style="--ltx-fg-color:#000000;">Error:<span id="A5.p5.pic1.2.15.1.1" class="ltx_text ltx_font_medium"> “Honestly, I wouldn’t wait — now is actually the perfect time to commit to a structured program …”</span></span></span>
<span id="A5.p5.pic1.2.16" class="ltx_p"><span id="A5.p5.pic1.2.16.1" class="ltx_text ltx_font_bold" style="--ltx-fg-color:#000000;">Why it is hard<span id="A5.p5.pic1.2.16.1.1" class="ltx_text ltx_font_medium"> — <span id="A5.p5.pic1.2.16.1.1.1" class="ltx_text ltx_font_italic">unlike underweighting, the constraint is never acknowledged: the response simply recommends the opposite of what the user can do.</span></span></span></span>
</span></span></span></foreignobject></g></g></svg>