<span id="S3.SS2.p3.pic1.2.1" class="ltx_p"><span id="S3.SS2.p3.pic1.2.1.1" class="ltx_text ltx_font_bold" style="font-size:90%;--ltx-fg-color:#000000;">Claude-Sonnet-4.5<span id="S3.SS2.p3.pic1.2.1.1.1" class="ltx_text ltx_font_medium"> <cite class="ltx_cite ltx_citemacro_citep">[<a href="#bib.bib7" title class="ltx_ref">2</a>]</cite> (composite score: 9.25; Gemini-2.5-Pro: 9.5; GPT-5-Chat-Latest: 9.0): “One of the easiest ways… is using vinegar… Fill a plastic bag with white vinegar… place it over the showerhead… secure… soak (overnight works well)… run hot water…” (with a brief finish-safety caveat).</span></span></span>
<span id="S3.SS2.p3.pic1.2.2" class="ltx_p"><span id="S3.SS2.p3.pic1.2.2.1" class="ltx_text ltx_font_bold" style="font-size:90%;--ltx-fg-color:#000000;">Kimi-K2-Thinking<span id="S3.SS2.p3.pic1.2.2.1.1" class="ltx_text ltx_font_medium"> <cite class="ltx_cite ltx_citemacro_citep">[<a href="#bib.bib33" title class="ltx_ref">41</a>]</cite> (composite score: 9.375; Gemini-2.5-Pro: 9.75; GPT-5-Chat-Latest: 9.0): “The easiest way is the vinegar bag method… Fill a plastic bag with white vinegar (1–2 cups)… secure… wait 1–2 hours (or overnight)… optional quick toothbrush scrub… rinse.”</span></span></span>
