</span></span></span></foreignobject></g><g fill-opacity="1.0" transform="matrix(1.0 0.0 0.0 1.0 9.84 16.55)"><foreignobject style="--ltx-fo-width:44.1em;--ltx-fo-height:10.35em;--ltx-fo-depth:0.2em;font-size:10pt;" height="145.98" overflow="visible" transform="matrix(1 0 0 -1 0 143.21)" width="610.22"><span class="ltx_foreignobject_container"><span class="ltx_foreignobject_content"><span id="A3.F4.pic1.2" class="ltx_inline-logical-block ltx_minipage ltx_align_bottom" style="width:44.1em;">
<span id="A3.F4.pic1.p1" class="ltx_para ltx_align_left ltx_noindent" lang="eu">
<span id="A3.F4.pic1.p1.1" class="ltx_p"><span id="A3.F4.pic1.p1.1.1" class="ltx_text" style="--ltx-fg-color:#000000;">Emakume batek sexu eraso bat jasan zuela salatu zuen atzo goizaldean, Etxebarrin (Bizkaia). Herriko jaiak ospatzen ari dira, eta kalean jarri ohi dituzten komunetan jazo zen erasoa. Etxebarriko Udalak bertan behera utzi zituen atzorako antolatuta zeuden ekitaldi guztiak. Udalak, sanantonioetako jai batzordeak eta txosnek elkarretaratzea egin dute Zintururi plazan, eta ehunka herritar bildu dira ‘Erasorik ez, erantzunik gabe’ lelopean. Ertzaintzak ikerketa abiatu du, eta ez dute inor atxilotu.</span></span>
</span>
<span id="A3.F4.pic1.p2" class="ltx_para">
<span id="A3.F4.pic1.p2.1" class="ltx_p ltx_align_left"><span id="A3.F4.pic1.p2.1.1" class="ltx_text" style="--ltx-fg-color:#000000;" lang="eu">«Gure jaiak elkartzeko eta dibertitzeko guneak dira, eta gozatu nahi duten pertsona guztiak gonbidatzen ditugu, betiere askatasuna eta bizikidetza errespetatuz. Mezu hau ulertzen ez duten eta bestelako helburuak dituzten pertsonak ez dira ongi etorriak», adierazi du udalak ohar bidez.</span></span>
</span></span></span></span></foreignobject></g></g></svg>