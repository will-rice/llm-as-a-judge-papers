<svg id="A1.F7.pic1" class="ltx_picture" height="877.15" overflow="visible" version="1.1" viewbox="0 0 653.15 877.15" width="653.15"><g style="--ltx-stroke-color:#000000;--ltx-fill-color:#000000;" fill="#000000" stroke="#000000" stroke-width="0.4pt" transform="translate(0,877.15) matrix(1 0 0 -1 0 0)"><g style="--ltx-fill-color:#606060;" fill="#606060" fill-opacity="1.0"><path style="stroke:none" d="M 0 5.91 L 0 871.25 C 0 874.51 2.64 877.15 5.91 877.15 L 647.24 877.15 C 650.51 877.15 653.15 874.51 653.15 871.25 L 653.15 5.91 C 653.15 2.64 650.51 0 647.24 0 L 5.91 0 C 2.64 0 0 2.64 0 5.91 Z" /></g><g style="--ltx-fill-color:#F9F9F9;" fill="#F9F9F9" fill-opacity="1.0"><path style="stroke:none" d="M 1.97 5.91 L 1.97 853.04 L 651.18 853.04 L 651.18 5.91 C 651.18 3.73 649.42 1.97 647.24 1.97 L 5.91 1.97 C 3.73 1.97 1.97 3.73 1.97 5.91 Z" /></g><g fill-opacity="1.0" transform="matrix(1.0 0.0 0.0 1.0 21.65 861.64)"><foreignobject style="--ltx-fo-width:38.32em;--ltx-fo-height:0.69em;--ltx-fo-depth:0.19em;font-size:10pt;" height="12.3" overflow="visible" transform="matrix(1 0 0 -1 0 9.61)" width="530.24"><span class="ltx_foreignobject_container"><span class="ltx_foreignobject_content">
<span id="A1.F7.pic1.1" class="ltx_inline-block ltx_minipage ltx_align_bottom" style="width:38.32em;">
<span id="A1.F7.pic1.1.1" class="ltx_p"><span id="A1.F7.pic1.1.1.1" class="ltx_text ltx_font_bold" style="--ltx-fg-color:#FFFFFF;">Prompt: LLM-as-a-Judge Evaluation</span></span>
</span></span></span></foreignobject></g><g fill-opacity="1.0" transform="matrix(1.0 0.0 0.0 1.0 21.65 17.24)"><foreignobject style="--ltx-fo-width:44.07em;--ltx-fo-height:59.55em;--ltx-fo-depth:0.25em;font-size:10pt;" height="827.46" overflow="visible" transform="matrix(1 0 0 -1 0 824)" width="609.8"><span class="ltx_foreignobject_container"><span class="ltx_foreignobject_content"><span id="A1.F7.pic1.2" class="ltx_inline-logical-block ltx_minipage ltx_align_bottom" style="width:44.07em;">
<span id="A1.F7.pic1.p2" class="ltx_para">
<span id="A1.F7.pic1.p2.1" class="ltx_p"><span id="A1.F7.pic1.p2.1.1" class="ltx_text ltx_font_bold" style="--ltx-fg-color:#000000;">System/Role:<span id="A1.F7.pic1.p2.1.1.1" class="ltx_text ltx_font_medium"> You are an expert AI evaluator. Your task is to objectively grade an AI’s response based on two distinct dimensions: Correctness and User-Preference Alignment.</span></span></span>
<span id="A1.F7.pic1.p2.2" class="ltx_p"><span id="A1.F7.pic1.p2.2.1" class="ltx_text ltx_font_bold" style="--ltx-fg-color:#000000;">[INPUTS]
<br class="ltx_break">Original Query:<span id="A1.F7.pic1.p2.2.1.1" class="ltx_text ltx_font_medium"> <span id="A1.F7.pic1.p2.2.1.1.1" class="ltx_text ltx_font_typewriter">{original_query}</span>

<br class="ltx_break"></span>Answer Ground Truth:<span id="A1.F7.pic1.p2.2.1.2" class="ltx_text ltx_font_medium"> <span id="A1.F7.pic1.p2.2.1.2.1" class="ltx_text ltx_font_typewriter">{ground_truth}</span>

<br class="ltx_break"></span>User Preferences:<span id="A1.F7.pic1.p2.2.1.3" class="ltx_text ltx_font_medium"> <span id="A1.F7.pic1.p2.2.1.3.1" class="ltx_text ltx_font_typewriter">{user_preference}</span>

<br class="ltx_break"></span>AI Response to Evaluate:<span id="A1.F7.pic1.p2.2.1.4" class="ltx_text ltx_font_medium"> <span id="A1.F7.pic1.p2.2.1.4.1" class="ltx_text ltx_font_typewriter">{ai_response}</span></span></span></span>
<span id="A1.F7.pic1.p2.3" class="ltx_p"><span id="A1.F7.pic1.p2.3.1" class="ltx_text ltx_font_bold" style="--ltx-fg-color:#000000;">[EVALUATION RUBRIC]<span id="A1.F7.pic1.p2.3.1.1" class="ltx_text ltx_font_medium"> 
<br class="ltx_break"></span>Dimension 1: Correctness against Ground Truth (Score 1-5)<span id="A1.F7.pic1.p2.3.1.2" class="ltx_text ltx_font_medium"> : Evaluate the factual accuracy and completeness of the response STRICTLY based on the provided Answer Ground Truth. Do not use outside knowledge.

<br class="ltx_break"></span>5:<span id="A1.F7.pic1.p2.3.1.3" class="ltx_text ltx_font_medium"> Perfectly aligned. The response contains all core information from the Ground Truth, comprehensively answers the query, and makes no contradictory claims.

<br class="ltx_break"></span>3:<span id="A1.F7.pic1.p2.3.1.4" class="ltx_text ltx_font_medium"> Partially aligned. The response captures the main idea of the Ground Truth but misses important nuances, includes minor contradictions, or adds unverified external details.

<br class="ltx_break"></span>1:<span id="A1.F7.pic1.p2.3.1.5" class="ltx_text ltx_font_medium"> Completely unaligned. The response directly contradicts the Ground Truth, is entirely irrelevant, or hallucinates major facts not present in the Ground Truth.</span></span></span>
<span id="A1.F7.pic1.p2.4" class="ltx_p"><span id="A1.F7.pic1.p2.4.1" class="ltx_text ltx_font_bold" style="--ltx-fg-color:#000000;">Dimension 2: User-Preference Alignment (Score 1-5)<span id="A1.F7.pic1.p2.4.1.1" class="ltx_text ltx_font_medium">: Evaluate how well the response is tailored to the specific User Preferences provided. 
<br class="ltx_break"></span>5:<span id="A1.F7.pic1.p2.4.1.2" class="ltx_text ltx_font_medium"> Perfectly aligned. The tone, formatting, and complexity exactly match the user’s preferences. It feels highly personalized.

<br class="ltx_break"></span>3:<span id="A1.F7.pic1.p2.4.1.3" class="ltx_text ltx_font_medium"> Somewhat aligned. It attempts to meet the preferences but slips into a generic tone, or misses specific formatting constraints.

<br class="ltx_break"></span>1:<span id="A1.F7.pic1.p2.4.1.4" class="ltx_text ltx_font_medium"> Completely unaligned. The response ignores the user’s preferences, uses the wrong tone, or violates specific user constraints.</span></span></span>
<span id="A1.F7.pic1.p2.5" class="ltx_p"><span id="A1.F7.pic1.p2.5.1" class="ltx_text ltx_font_bold" style="--ltx-fg-color:#000000;">[OUTPUT FORMAT]<span id="A1.F7.pic1.p2.5.1.1" class="ltx_text ltx_font_medium"> : You must output your evaluation strictly in the following JSON format. Provide your reasoning before providing the final scores.</span></span></span>
</span>
<span id="A1.F7.pic1.p1" class="ltx_para ltx_noindent">
<span id="A1.F7.pic1.p1.1" class="ltx_p"><span id="A1.F7.pic1.p1.1.1" class="ltx_text ltx_font_typewriter" style="--ltx-fg-color:#000000;">{ </span>
<br class="ltx_break"><span id="A1.F7.pic1.p1.1.2" class="ltx_text ltx_font_typewriter" style="--ltx-fg-color:#000000;">&quot;correctness_evaluation&quot;: { </span>
<br class="ltx_break"><span id="A1.F7.pic1.p1.1.3" class="ltx_text ltx_font_typewriter" style="--ltx-fg-color:#000000;">&quot;reasoning&quot;: &quot;&lt;Step-by-step analysis strictly against Ground Truth&gt;&quot;, </span>
<br class="ltx_break"><span id="A1.F7.pic1.p1.1.4" class="ltx_text ltx_font_typewriter" style="--ltx-fg-color:#000000;">&quot;score&quot;: &lt;1-5&gt; </span>
<br class="ltx_break"><span id="A1.F7.pic1.p1.1.5" class="ltx_text ltx_font_typewriter" style="--ltx-fg-color:#000000;">}, </span>
<br class="ltx_break"><span id="A1.F7.pic1.p1.1.6" class="ltx_text ltx_font_typewriter" style="--ltx-fg-color:#000000;">&quot;alignment_evaluation&quot;: { </span>
<br class="ltx_break"><span id="A1.F7.pic1.p1.1.7" class="ltx_text ltx_font_typewriter" style="--ltx-fg-color:#000000;">&quot;reasoning&quot;: &quot;&lt;Step-by-step analysis of matching User Preferences&gt;&quot;, </span>
<br class="ltx_break"><span id="A1.F7.pic1.p1.1.8" class="ltx_text ltx_font_typewriter" style="--ltx-fg-color:#000000;">&quot;score&quot;: &lt;1-5&gt; </span>
<br class="ltx_break"><span id="A1.F7.pic1.p1.1.9" class="ltx_text ltx_font_typewriter" style="--ltx-fg-color:#000000;">}, </span>
<br class="ltx_break"><span id="A1.F7.pic1.p1.1.10" class="ltx_text ltx_font_typewriter" style="--ltx-fg-color:#000000;">&quot;overall_summary&quot;: &quot;&lt;A 1-2 sentence summary of overall quality&gt;&quot; </span>
<br class="ltx_break"><span id="A1.F7.pic1.p1.1.11" class="ltx_text ltx_font_typewriter" style="--ltx-fg-color:#000000;">}
</span><span id="A1.F7.pic1.p1.1.12" class="ltx_text" style="--ltx-fg-color:#000000;">
</span></span>
</span></span></span></span></foreignobject></g></g></svg>