<span id="A1.SS5.p2.pic1.2.1" class="ltx_p"><span id="A1.SS5.p2.pic1.2.1.1" class="ltx_text ltx_font_bold" style="--ltx-fg-color:#000000;">System Prompt:
<br class="ltx_break"><span id="A1.SS5.p2.pic1.2.1.1.1" class="ltx_text ltx_font_medium">I will provide you with a multiple-choice question, a response from an LLM, and the correct option. Output a valid JSON object containing a single key-value pair, where the key is “is_correct” and corresponding value is a boolean indicating whether or not the LLM-generated selects the correct option.
<br class="ltx_break"></span></span></span>
<span id="A1.SS5.p2.pic1.2.2" class="ltx_p"><span id="A1.SS5.p2.pic1.2.2.1" class="ltx_text ltx_font_bold" style="--ltx-fg-color:#000000;">User Prompt:
<br class="ltx_break"><span id="A1.SS5.p2.pic1.2.2.1.1" class="ltx_text ltx_font_typewriter ltx_font_medium">&lt;|<span id="A1.SS5.p2.pic1.2.2.1.1.1" class="ltx_text ltx_font_serif">Question</span>|&gt;
<br class="ltx_break"><span id="A1.SS5.p2.pic1.2.2.1.1.2" class="ltx_text ltx_font_serif">{question}
<br class="ltx_break"></span></span></span></span>
<span id="A1.SS5.p2.pic1.2.3" class="ltx_p"><span id="A1.SS5.p2.pic1.2.3.1" class="ltx_text ltx_font_typewriter" style="--ltx-fg-color:#000000;">&lt;|<span id="A1.SS5.p2.pic1.2.3.1.1" class="ltx_text ltx_font_serif">LLM Response</span>|&gt;
<br class="ltx_break"><span id="A1.SS5.p2.pic1.2.3.1.2" class="ltx_text ltx_font_serif">{response}
<br class="ltx_break"></span></span></span>
<span id="A1.SS5.p2.pic1.2.4" class="ltx_p"><span id="A1.SS5.p2.pic1.2.4.1" class="ltx_text ltx_font_typewriter" style="--ltx-fg-color:#000000;">&lt;|<span id="A1.SS5.p2.pic1.2.4.1.1" class="ltx_text ltx_font_serif">Correct Answer</span>|&gt;
<br class="ltx_break"><span id="A1.SS5.p2.pic1.2.4.1.2" class="ltx_text ltx_font_serif">{ground_truth}
