1. [material] A: ...  B: ...
   Evidence: A &quot;...&quot; / B &quot;...&quot;
   Instruction: &quot;...&quot;
2. [immaterial: reason] A: ...  B: ...
   Evidence: A &quot;...&quot; / B &quot;...&quot;
&lt;/diff&gt;

&lt;rubric&gt;
Hard Rules:
1. (must) ...
   Test: ...
   From: difference 1
   Priority: 2
Principles:
1. ...
   Priority: 4
&lt;/rubric&gt;

&lt;eval&gt;
1. ...
winner: A

P1. ...
winner: tie
&lt;/eval&gt;

&lt;judgment&gt;
...
&lt;/judgment&gt;

&lt;answer&gt;A&lt;/answer&gt;
</pre>
