<span id="S2.F2.pic4.1.1" class="ltx_p"><span id="S2.F2.pic4.1.1.1" class="ltx_text ltx_font_bold" style="--ltx-fg-color:#000000;">Gold Response:<span id="S2.F2.pic4.1.1.1.1" class="ltx_text ltx_font_medium">
Annual lease rental expense <math id="S2.F2.pic4.m1" class="ltx_Math" alttext="=(3000+9000+9000)/2=10500" display="inline" intent=":literal"><semantics><mrow><mphantom></mphantom><mo style="--ltx-fg-color:#000000;" mathcolor="#000000">=</mo><mrow><mrow><mo style="--ltx-fg-color:#000000;" mathcolor="#000000" stretchy="false">(</mo><mrow><mn style="--ltx-fg-color:#000000;" mathcolor="#000000">3000</mn><mo style="--ltx-fg-color:#000000;" mathcolor="#000000">+</mo><mn style="--ltx-fg-color:#000000;" mathcolor="#000000">9000</mn><mo style="--ltx-fg-color:#000000;" mathcolor="#000000">+</mo><mn style="--ltx-fg-color:#000000;" mathcolor="#000000">9000</mn></mrow><mo style="--ltx-fg-color:#000000;" mathcolor="#000000" stretchy="false">)</mo></mrow><mo style="--ltx-fg-color:#000000;" mathcolor="#000000">/</mo><mn style="--ltx-fg-color:#000000;" mathcolor="#000000">2</mn></mrow><mo style="--ltx-fg-color:#000000;" mathcolor="#000000">=</mo><mn style="--ltx-fg-color:#000000;" mathcolor="#000000">10500</mn></mrow><annotation encoding="application/x-tex">=(3000+9000+9000)/2=10500</annotation></semantics></math> per annum.
Expense to 31 December 2023 <math id="S2.F2.pic4.m2" class="ltx_Math" alttext="=10500\times\frac{9}{12}=7875" display="inline" intent=":literal"><semantics><mrow><mphantom></mphantom><mo style="--ltx-fg-color:#000000;" mathcolor="#000000">=</mo><mrow><mn style="--ltx-fg-color:#000000;" mathcolor="#000000">10500</mn><mo style="--ltx-fg-color:#000000;" lspace="0.222em" mathcolor="#000000" rspace="0.222em">×</mo><mfrac style="--ltx-fg-color:#000000;" mathcolor="#000000"><mn style="--ltx-fg-color:#000000;" mathcolor="#000000">9</mn><mn style="--ltx-fg-color:#000000;" mathcolor="#000000">12</mn></mfrac></mrow><mo style="--ltx-fg-color:#000000;" mathcolor="#000000">=</mo><mn style="--ltx-fg-color:#000000;" mathcolor="#000000">7875</mn></mrow><annotation encoding="application/x-tex">=10500\times\frac{9}{12}=7875</annotation></semantics></math>.
Accrued expense <math id="S2.F2.pic4.m3" class="ltx_Math" alttext="=7875-3000=4875" display="inline" intent=":literal"><semantics><mrow><mphantom></mphantom><mo style="--ltx-fg-color:#000000;" mathcolor="#000000">=</mo><mrow><mn style="--ltx-fg-color:#000000;" mathcolor="#000000">7875</mn><mo style="--ltx-fg-color:#000000;" mathcolor="#000000">−</mo><mn style="--ltx-fg-color:#000000;" mathcolor="#000000">3000</mn></mrow><mo style="--ltx-fg-color:#000000;" mathcolor="#000000">=</mo><mn style="--ltx-fg-color:#000000;" mathcolor="#000000">4875</mn></mrow><annotation encoding="application/x-tex">=7875-3000=4875</annotation></semantics></math>.</span></span></span>
<span id="S2.F2.pic4.1.2" class="ltx_p"><span id="S2.F2.pic4.1.2.1" class="ltx_text" style="--ltx-fg-color:#000000;">The expense in this period of $7,875 is not the same as the payment of $3,000, so we need to accrue an additional expense of $4,875.</span></span>
