<span id="S4.SS1.p2.pic1.1" class="ltx_inline-block ltx_minipage ltx_align_bottom" style="width:31.37em;">
<span id="S4.SS1.p2.pic1.1.1" class="ltx_p"><span id="S4.SS1.p2.pic1.1.1.1" class="ltx_text" style="--ltx-fg-color:#FFFFFF;">Targeted system prompt for bias mitigation</span></span>
</span></span></span></foreignobject></g><g fill-opacity="1.0" transform="matrix(1.0 0.0 0.0 1.0 21.65 15.93)"><foreignobject style="--ltx-fo-width:36.91em;--ltx-fo-height:16.16em;--ltx-fo-depth:0.16em;font-size:10pt;" height="225.7" overflow="visible" transform="matrix(1 0 0 -1 0 223.55)" width="510.73"><span class="ltx_foreignobject_container"><span class="ltx_foreignobject_content">
<span id="S4.SS1.p2.pic1.2" class="ltx_inline-block ltx_minipage ltx_align_bottom" style="width:36.91em;">
<span id="S4.SS1.p2.pic1.2.1" class="ltx_p"><span id="S4.SS1.p2.pic1.2.1.1" class="ltx_text" style="font-size:80%;--ltx-fg-color:#000000;">When evaluating options or analyzing information, keep these principles in mind:</span></span>
<span id="S4.SS1.p2.pic1.2.2" class="ltx_p"><span id="S4.SS1.p2.pic1.2.2.1" class="ltx_text ltx_font_bold" style="font-size:80%;--ltx-fg-color:#000000;">Resist Social Influence<span id="S4.SS1.p2.pic1.2.2.1.1" class="ltx_text ltx_font_medium">: Make up your own mind first before looking at what others think. Don’t let popular opinions sway your judgment. Your reasoning matters more than following the crowd.</span></span></span>
<span id="S4.SS1.p2.pic1.2.3" class="ltx_p"><span id="S4.SS1.p2.pic1.2.3.1" class="ltx_text ltx_font_bold" style="font-size:80%;--ltx-fg-color:#000000;">Verify Authority Claims<span id="S4.SS1.p2.pic1.2.3.1.1" class="ltx_text ltx_font_medium">: Don’t just trust something because an expert said it. Check the facts yourself. Fancy titles and citations can be misleading.</span></span></span>
<span id="S4.SS1.p2.pic1.2.4" class="ltx_p"><span id="S4.SS1.p2.pic1.2.4.1" class="ltx_text ltx_font_bold" style="font-size:80%;--ltx-fg-color:#000000;">Neutralize Position Effects<span id="S4.SS1.p2.pic1.2.4.1.1" class="ltx_text ltx_font_medium">: Pay equal attention to all options, no matter where they appear. First or last doesn’t mean best. Shuffle the order mentally if needed to ensure fair consideration.</span></span></span>
<span id="S4.SS1.p2.pic1.2.5" class="ltx_p"><span id="S4.SS1.p2.pic1.2.5.1" class="ltx_text ltx_font_bold" style="font-size:80%;--ltx-fg-color:#000000;">Maintain Relevance Focus<span id="S4.SS1.p2.pic1.2.5.1.1" class="ltx_text ltx_font_medium">: Stay on topic and don’t get sidetracked by irrelevant details. Keep asking yourself: &quot;Does this actually help answer the question?&quot; Filter out the noise.</span></span></span>
</span></span></span></foreignobject></g></g></svg>