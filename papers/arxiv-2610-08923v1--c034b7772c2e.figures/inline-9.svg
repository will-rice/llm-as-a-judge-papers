<span id="A1.SS5.SSS2.p1.pic1.1" class="ltx_inline-block ltx_minipage ltx_align_bottom" style="width:32.57em;">
<span id="A1.SS5.SSS2.p1.pic1.1.1" class="ltx_p"><span id="A1.SS5.SSS2.p1.pic1.1.1.1" class="ltx_text ltx_font_bold" style="--ltx-fg-color:#FFFFFF;">Generation Objectives - Reasoning Generation</span></span>
</span></span></span></foreignobject></g><g fill-opacity="1.0" transform="matrix(1.0 0.0 0.0 1.0 15.84 360.38)"><foreignobject style="--ltx-fo-width:37.46em;--ltx-fo-height:6.38em;--ltx-fo-depth:25.1em;font-size:10pt;" height="435.64" overflow="visible" transform="matrix(1 0 0 -1 0 88.33)" width="518.34"><span class="ltx_foreignobject_container"><span class="ltx_foreignobject_content">
<span id="A1.SS5.SSS2.p1.pic1.2" class="ltx_inline-block ltx_minipage ltx_align_bottom" style="width:37.46em;">
<span id="A1.SS5.SSS2.p1.pic1.2.1" class="ltx_p"><span id="A1.SS5.SSS2.p1.pic1.2.1.1" class="ltx_text" style="--ltx-fg-color:#000000;">The goal is to generate highly logical and informative reasoning traces and arrive at the most accurate verdict on whether or not Input Data (user
input or AI agent responses) is in compliance or violation of each of the policies in Input Policies, requiring</span></span>
<span id="A1.I2" class="ltx_itemize">
<span id="A1.I2.i1" class="ltx_item" style="list-style-type:none;"><span class="ltx_tag ltx_tag_item">•</span> 
<span id="A1.I2.i1.p1" class="ltx_para ltx_noindent">
<span id="A1.I2.i1.p1.1" class="ltx_p"><span id="A1.I2.i1.p1.1.1" class="ltx_text" style="--ltx-fg-color:#000000;">a single </span><span id="A1.I2.i1.p1.1.2" class="ltx_ERROR undefined">\rmode</span><span id="A1.I2.i1.p1.1.3" class="ltx_text" style="--ltx-fg-color:#000000;">Input Understanding block dissecting the input before any per-policy reasoning</span></span>
</span></span>
<span id="A1.I2.i2" class="ltx_item" style="list-style-type:none;"><span class="ltx_tag ltx_tag_item">•</span> 
<span id="A1.I2.i2.p1" class="ltx_para ltx_noindent">
<span id="A1.I2.i2.p1.1" class="ltx_p"><span id="A1.I2.i2.p1.1.1" class="ltx_text" style="--ltx-fg-color:#000000;">for each policy, in order, a </span><span id="A1.I2.i2.p1.1.2" class="ltx_ERROR undefined">\rmode</span><span id="A1.I2.i2.p1.1.3" class="ltx_text" style="--ltx-fg-color:#000000;">Policy Understanding block, an </span><span id="A1.I2.i2.p1.1.4" class="ltx_ERROR undefined">\rmode</span><span id="A1.I2.i2.p1.1.5" class="ltx_text" style="--ltx-fg-color:#000000;">Input Compliance Understanding block, and a final </span><span id="A1.I2.i2.p1.1.6" class="ltx_ERROR undefined">\rmode</span><span id="A1.I2.i2.p1.1.7" class="ltx_text" style="--ltx-fg-color:#000000;">Compliance/</span><span id="A1.I2.i2.p1.1.8" class="ltx_ERROR undefined">\rmode</span><span id="A1.I2.i2.p1.1.9" class="ltx_text" style="--ltx-fg-color:#000000;">Violation verdict, where the verdict is </span><span id="A1.I2.i2.p1.1.10" class="ltx_ERROR undefined">\rmode</span><span id="A1.I2.i2.p1.1.11" class="ltx_text" style="--ltx-fg-color:#000000;">Violation if </span><em id="A1.I2.i2.p1.1.12" class="ltx_emph ltx_font_italic" style="--ltx-fg-color:#000000;">any</em><span id="A1.I2.i2.p1.1.13" class="ltx_text" style="--ltx-fg-color:#000000;"> scope of that policy is violated and </span><span id="A1.I2.i2.p1.1.14" class="ltx_ERROR undefined">\rmode</span><span id="A1.I2.i2.p1.1.15" class="ltx_text" style="--ltx-fg-color:#000000;">Compliance only if </span><em id="A1.I2.i2.p1.1.16" class="ltx_emph ltx_font_italic" style="--ltx-fg-color:#000000;">all</em><span id="A1.I2.i2.p1.1.17" class="ltx_text" style="--ltx-fg-color:#000000;"> scopes are satisfied</span></span>
</span></span>
<span id="A1.I2.i3" class="ltx_item" style="list-style-type:none;"><span class="ltx_tag ltx_tag_item">•</span> 
<span id="A1.I2.i3.p1" class="ltx_para ltx_noindent">
<span id="A1.I2.i3.p1.1" class="ltx_p"><span id="A1.I2.i3.p1.1.1" class="ltx_text" style="--ltx-fg-color:#000000;">each policy’s reasoning treated in complete isolation from every other policy’s reasoning or verdict</span></span>
</span></span>
<span id="A1.I2.i4" class="ltx_item" style="list-style-type:none;"><span class="ltx_tag ltx_tag_item">•</span> 
<span id="A1.I2.i4.p1" class="ltx_para ltx_noindent">
<span id="A1.I2.i4.p1.1" class="ltx_p"><span id="A1.I2.i4.p1.1.1" class="ltx_text" style="--ltx-fg-color:#000000;">numbered reasoning blocks matching the policy’s index exactly</span></span>
</span></span>
<span id="A1.I2.i5" class="ltx_item" style="list-style-type:none;"><span class="ltx_tag ltx_tag_item">•</span> 
<span id="A1.I2.i5.p1" class="ltx_para">
<span id="A1.I2.i5.p1.1" class="ltx_p"><span id="A1.I2.i5.p1.1.1" class="ltx_text" style="--ltx-fg-color:#000000;">reasoning concise when the verdict is straightforward and more in-depth only when it aids the decision</span></span>
</span></span>
</span>
</span></span></span></foreignobject></g></g></svg>