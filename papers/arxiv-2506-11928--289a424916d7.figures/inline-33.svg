<svg id="S15.SS0.SSS0.Px14.p2.pic1" class="ltx_picture" height="296.77" overflow="visible" version="1.1" viewbox="0 0 477.38 296.77" width="477.38"><g style="--ltx-stroke-color:#000000;--ltx-fill-color:#000000;" fill="#000000" stroke="#000000" stroke-width="0.4pt" transform="translate(0,296.77) matrix(1 0 0 -1 0 0)"><g style="--ltx-fill-color:#BF0000;" fill="#BF0000" fill-opacity="1.0"><path style="stroke:none" d="M 0 5.91 L 0 290.86 C 0 294.12 2.64 296.77 5.91 296.77 L 471.47 296.77 C 474.73 296.77 477.38 294.12 477.38 290.86 L 477.38 5.91 C 477.38 2.64 474.73 0 471.47 0 L 5.91 0 C 2.64 0 0 2.64 0 5.91 Z" /></g><g style="--ltx-fill-color:#FFF2F2;" fill="#FFF2F2" fill-opacity="1.0"><path style="stroke:none" d="M 1.97 5.91 L 1.97 271.12 L 475.41 271.12 L 475.41 5.91 C 475.41 3.73 473.65 1.97 471.47 1.97 L 5.91 1.97 C 3.73 1.97 1.97 3.73 1.97 5.91 Z" /></g><g fill-opacity="1.0" transform="matrix(1.0 0.0 0.0 1.0 21.65 280.49)"><foreignobject style="--ltx-fo-width:31.37em;--ltx-fo-height:0.75em;--ltx-fo-depth:0.25em;font-size:10pt;" height="13.84" overflow="visible" transform="matrix(1 0 0 -1 0 10.38)" width="434.07"><span class="ltx_foreignobject_container"><span class="ltx_foreignobject_content">
<span id="S15.SS0.SSS0.Px14.p2.pic1.1" class="ltx_inline-block ltx_minipage ltx_align_bottom" style="width:31.37em;">
<span id="S15.SS0.SSS0.Px14.p2.pic1.1.1" class="ltx_p"><a href="https://codeforces.com/problemset/problem/2039/B" title class="ltx_ref ltx_href" style="--ltx-fg-color:#FFFFFF;">Example Ad-Hoc Problem (Rated 1000)</a></span>
</span></span></span></foreignobject></g><g fill-opacity="1.0" transform="matrix(1.0 0.0 0.0 1.0 21.65 16.47)"><foreignobject style="--ltx-fo-width:31.37em;--ltx-fo-height:17.55em;--ltx-fo-depth:0.19em;font-size:10pt;" height="245.53" overflow="visible" transform="matrix(1 0 0 -1 0 242.84)" width="434.07"><span class="ltx_foreignobject_container"><span class="ltx_foreignobject_content">
<span id="S15.SS0.SSS0.Px14.p2.pic1.2" class="ltx_inline-block ltx_minipage ltx_align_bottom" style="width:31.37em;">
<span id="S15.SS0.SSS0.Px14.p2.pic1.2.1" class="ltx_p"><span id="S15.SS0.SSS0.Px14.p2.pic1.2.1.1" class="ltx_text" style="--ltx-fg-color:#000000;">For a string <math id="S15.SS0.SSS0.Px14.p2.pic1.m1" class="ltx_Math" alttext="p" display="inline" intent=":literal"><semantics><mi style="--ltx-fg-color:#000000;" mathcolor="#000000">p</mi><annotation encoding="application/x-tex">p</annotation></semantics></math>, let <math id="S15.SS0.SSS0.Px14.p2.pic1.m2" class="ltx_Math" alttext="f(p)" display="inline" intent=":literal"><semantics><mrow><mi style="--ltx-fg-color:#000000;" mathcolor="#000000">f</mi><mo>⁡</mo><mrow><mo style="--ltx-fg-color:#000000;" mathcolor="#000000" stretchy="false">(</mo><mi style="--ltx-fg-color:#000000;" mathcolor="#000000">p</mi><mo style="--ltx-fg-color:#000000;" mathcolor="#000000" stretchy="false">)</mo></mrow></mrow><annotation encoding="application/x-tex">f(p)</annotation></semantics></math> be the number of distinct non-empty substrings of <math id="S15.SS0.SSS0.Px14.p2.pic1.m3" class="ltx_Math" alttext="p" display="inline" intent=":literal"><semantics><mi style="--ltx-fg-color:#000000;" mathcolor="#000000">p</mi><annotation encoding="application/x-tex">p</annotation></semantics></math>. 
<br class="ltx_break">
<br class="ltx_break">Shohag has a string <math id="S15.SS0.SSS0.Px14.p2.pic1.m4" class="ltx_Math" alttext="s" display="inline" intent=":literal"><semantics><mi style="--ltx-fg-color:#000000;" mathcolor="#000000">s</mi><annotation encoding="application/x-tex">s</annotation></semantics></math>. Help him find a non-empty string <math id="S15.SS0.SSS0.Px14.p2.pic1.m5" class="ltx_Math" alttext="p" display="inline" intent=":literal"><semantics><mi style="--ltx-fg-color:#000000;" mathcolor="#000000">p</mi><annotation encoding="application/x-tex">p</annotation></semantics></math> such that <math id="S15.SS0.SSS0.Px14.p2.pic1.m6" class="ltx_Math" alttext="p" display="inline" intent=":literal"><semantics><mi style="--ltx-fg-color:#000000;" mathcolor="#000000">p</mi><annotation encoding="application/x-tex">p</annotation></semantics></math> is a substring of <math id="S15.SS0.SSS0.Px14.p2.pic1.m7" class="ltx_Math" alttext="s" display="inline" intent=":literal"><semantics><mi style="--ltx-fg-color:#000000;" mathcolor="#000000">s</mi><annotation encoding="application/x-tex">s</annotation></semantics></math> and <math id="S15.SS0.SSS0.Px14.p2.pic1.m8" class="ltx_Math" alttext="f(p)" display="inline" intent=":literal"><semantics><mrow><mi style="--ltx-fg-color:#000000;" mathcolor="#000000">f</mi><mo>⁡</mo><mrow><mo style="--ltx-fg-color:#000000;" mathcolor="#000000" stretchy="false">(</mo><mi style="--ltx-fg-color:#000000;" mathcolor="#000000">p</mi><mo style="--ltx-fg-color:#000000;" mathcolor="#000000" stretchy="false">)</mo></mrow></mrow><annotation encoding="application/x-tex">f(p)</annotation></semantics></math> is even of state that no such string exists. 
<br class="ltx_break">
<br class="ltx_break"><span id="S15.SS0.SSS0.Px14.p2.pic1.2.1.1.1" class="ltx_text ltx_font_bold">Input</span> 
<br class="ltx_break">The first line contains a single integer <math id="S15.SS0.SSS0.Px14.p2.pic1.m9" class="ltx_Math" alttext="t\ (1\leq t\leq 10^{4})" display="inline" intent=":literal"><semantics><mrow><mi style="--ltx-fg-color:#000000;" mathcolor="#000000">t</mi><mo lspace="0.500em">⁡</mo><mrow><mo style="--ltx-fg-color:#000000;" mathcolor="#000000" stretchy="false">(</mo><mrow><mn style="--ltx-fg-color:#000000;" mathcolor="#000000">1</mn><mo style="--ltx-fg-color:#000000;" mathcolor="#000000">≤</mo><mi style="--ltx-fg-color:#000000;" mathcolor="#000000">t</mi><mo style="--ltx-fg-color:#000000;" mathcolor="#000000">≤</mo><msup><mn style="--ltx-fg-color:#000000;" mathcolor="#000000">10</mn><mn style="--ltx-fg-color:#000000;" mathcolor="#000000">4</mn></msup></mrow><mo style="--ltx-fg-color:#000000;" mathcolor="#000000" stretchy="false">)</mo></mrow></mrow><annotation encoding="application/x-tex">t\ (1\leq t\leq 10^{4})</annotation></semantics></math> —the number of test cases. 
<br class="ltx_break">
<br class="ltx_break">The first and only line of each test case contains a string <math id="S15.SS0.SSS0.Px14.p2.pic1.m10" class="ltx_Math" alttext="s\ (1\leq|s|\leq 10^{5})" display="inline" intent=":literal"><semantics><mrow><mi style="--ltx-fg-color:#000000;" mathcolor="#000000">s</mi><mo lspace="0.500em">⁡</mo><mrow><mo style="--ltx-fg-color:#000000;" mathcolor="#000000" stretchy="false">(</mo><mrow><mn style="--ltx-fg-color:#000000;" mathcolor="#000000">1</mn><mo style="--ltx-fg-color:#000000;" mathcolor="#000000">≤</mo><mrow><mo style="--ltx-fg-color:#000000;" mathcolor="#000000" stretchy="false">|</mo><mi style="--ltx-fg-color:#000000;" mathcolor="#000000">s</mi><mo style="--ltx-fg-color:#000000;" mathcolor="#000000" stretchy="false">|</mo></mrow><mo style="--ltx-fg-color:#000000;" mathcolor="#000000">≤</mo><msup><mn style="--ltx-fg-color:#000000;" mathcolor="#000000">10</mn><mn style="--ltx-fg-color:#000000;" mathcolor="#000000">5</mn></msup></mrow><mo style="--ltx-fg-color:#000000;" mathcolor="#000000" stretchy="false">)</mo></mrow></mrow><annotation encoding="application/x-tex">s\ (1\leq|s|\leq 10^{5})</annotation></semantics></math> consisting of lowercase English letters. 
<br class="ltx_break">
<br class="ltx_break">It is guaranteed that the sum of the length of <math id="S15.SS0.SSS0.Px14.p2.pic1.m11" class="ltx_Math" alttext="s" display="inline" intent=":literal"><semantics><mi style="--ltx-fg-color:#000000;" mathcolor="#000000">s</mi><annotation encoding="application/x-tex">s</annotation></semantics></math> over all test cases doesn’t exceed <math id="S15.SS0.SSS0.Px14.p2.pic1.m12" class="ltx_Math" alttext="3\cdot 10^{5}" display="inline" intent=":literal"><semantics><mrow><mn style="--ltx-fg-color:#000000;" mathcolor="#000000">3</mn><mo style="--ltx-fg-color:#000000;" lspace="0.222em" mathcolor="#000000" rspace="0.222em">⋅</mo><msup><mn style="--ltx-fg-color:#000000;" mathcolor="#000000">10</mn><mn style="--ltx-fg-color:#000000;" mathcolor="#000000">5</mn></msup></mrow><annotation encoding="application/x-tex">3\cdot 10^{5}</annotation></semantics></math>. 
<br class="ltx_break">
<br class="ltx_break"><span id="S15.SS0.SSS0.Px14.p2.pic1.2.1.1.2" class="ltx_text ltx_font_bold">Output</span> 
<br class="ltx_break">For each test case, print a non-empty string that satisfies the conditions mentioned in the statement, or <math id="S15.SS0.SSS0.Px14.p2.pic1.m13" class="ltx_Math" alttext="-1" display="inline" intent=":literal"><semantics><mrow><mo style="--ltx-fg-color:#000000;" mathcolor="#000000">−</mo><mn style="--ltx-fg-color:#000000;" mathcolor="#000000">1</mn></mrow><annotation encoding="application/x-tex">-1</annotation></semantics></math> if no such string exists. If there are multiple solutions, output any.</span></span>
</span></span></span></foreignobject></g></g></svg>