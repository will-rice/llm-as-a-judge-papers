<span id="A1.SS4.p6.pic1.p4" class="ltx_para ltx_noindent">
<span id="A1.SS4.p6.pic1.p4.1" class="ltx_p">[Criteria]</span>
</span></span></span></span>
<span id="A1.SS4.p6.pic1.2.5" class="ltx_p" style="width:459.7pt;"><span id="A1.SS4.p6.pic1.2.5.1" class="ltx_text ltx_verbatim ltx_font_typewriter ltx_inline-block" style="width:459.7pt;--ltx-fg-color:#000000;"><span id="A1.SS4.p6.pic1.2.5.1.1" class="ltx_inline-logical-block ltx_parbox ltx_align_top" style="width:459.7pt;">
<span id="A1.SS4.p6.pic1.p5" class="ltx_para ltx_noindent">
<span id="A1.SS4.p6.pic1.p5.1" class="ltx_p">[SE_CRITERIA]</span>
</span></span></span></span>
<span id="A1.SS4.p6.pic1.2.6" class="ltx_p" style="width:459.7pt;"><span id="A1.SS4.p6.pic1.2.6.1" class="ltx_text ltx_verbatim ltx_font_typewriter ltx_inline-block" style="width:459.7pt;--ltx-fg-color:#000000;"><span id="A1.SS4.p6.pic1.2.6.1.1" class="ltx_inline-logical-block ltx_parbox ltx_pruned_first ltx_align_top" style="width:459.7pt;"></span></span></span>
<span id="A1.SS4.p6.pic1.2.7" class="ltx_p" style="width:459.7pt;"><span id="A1.SS4.p6.pic1.2.7.1" class="ltx_text ltx_verbatim ltx_font_typewriter ltx_inline-block" style="width:459.7pt;--ltx-fg-color:#000000;"><span id="A1.SS4.p6.pic1.2.7.1.1" class="ltx_inline-logical-block ltx_parbox ltx_align_top" style="width:459.7pt;">
<span id="A1.SS4.p6.pic1.p7" class="ltx_para ltx_noindent">
<span id="A1.SS4.p6.pic1.p7.1" class="ltx_p">[Adjustment Rules]</span>
</span></span></span></span>
<span id="A1.SS4.p6.pic1.2.8" class="ltx_p" style="width:459.7pt;"><span id="A1.SS4.p6.pic1.2.8.1" class="ltx_text ltx_verbatim ltx_font_typewriter ltx_inline-block" style="width:459.7pt;--ltx-fg-color:#000000;"><span id="A1.SS4.p6.pic1.2.8.1.1" class="ltx_inline-logical-block ltx_parbox ltx_align_top" style="width:459.7pt;">
<span id="A1.SS4.p6.pic1.p8" class="ltx_para ltx_noindent">
<span id="A1.SS4.p6.pic1.p8.1" class="ltx_p">- Review your own previous scores and rationale first.</span>
</span></span></span></span>
<span id="A1.SS4.p6.pic1.2.9" class="ltx_p" style="width:459.7pt;"><span id="A1.SS4.p6.pic1.2.9.1" class="ltx_text ltx_verbatim ltx_font_typewriter ltx_inline-block" style="width:459.7pt;--ltx-fg-color:#000000;"><span id="A1.SS4.p6.pic1.2.9.1.1" class="ltx_inline-logical-block ltx_parbox ltx_align_top" style="width:459.7pt;">
<span id="A1.SS4.p6.pic1.p9" class="ltx_para ltx_noindent">
<span id="A1.SS4.p6.pic1.p9.1" class="ltx_p">- Accept strict judge’s criticisms if they identify real flaws in the summary.</span>
</span></span></span></span>
<span id="A1.SS4.p6.pic1.2.10" class="ltx_p" style="width:459.7pt;"><span id="A1.SS4.p6.pic1.2.10.1" class="ltx_text ltx_verbatim ltx_font_typewriter ltx_inline-block" style="width:459.7pt;--ltx-fg-color:#000000;"><span id="A1.SS4.p6.pic1.2.10.1.1" class="ltx_inline-logical-block ltx_parbox ltx_align_top" style="width:459.7pt;">
<span id="A1.SS4.p6.pic1.p10" class="ltx_para ltx_noindent">
<span id="A1.SS4.p6.pic1.p10.1" class="ltx_p">- Lower scores where you were overly generous.</span>
</span></span></span></span>
<span id="A1.SS4.p6.pic1.2.11" class="ltx_p" style="width:459.7pt;"><span id="A1.SS4.p6.pic1.2.11.1" class="ltx_text ltx_verbatim ltx_font_typewriter ltx_inline-block" style="width:459.7pt;--ltx-fg-color:#000000;"><span id="A1.SS4.p6.pic1.2.11.1.1" class="ltx_inline-logical-block ltx_parbox ltx_align_top" style="width:459.7pt;">
<span id="A1.SS4.p6.pic1.p11" class="ltx_para ltx_noindent">
<span id="A1.SS4.p6.pic1.p11.1" class="ltx_p">- Maintain scores where strict judge was too harsh.</span>
</span></span></span></span>
<span id="A1.SS4.p6.pic1.2.12" class="ltx_p" style="width:459.7pt;"><span id="A1.SS4.p6.pic1.2.12.1" class="ltx_text ltx_verbatim ltx_font_typewriter ltx_inline-block" style="width:459.7pt;--ltx-fg-color:#000000;"><span id="A1.SS4.p6.pic1.2.12.1.1" class="ltx_inline-logical-block ltx_parbox ltx_align_top" style="width:459.7pt;">
<span id="A1.SS4.p6.pic1.p12" class="ltx_para ltx_noindent">
<span id="A1.SS4.p6.pic1.p12.1" class="ltx_p">- Keep your previous score when the strict case is not persuasive.</span>
</span></span></span></span>
<span id="A1.SS4.p6.pic1.2.13" class="ltx_p" style="width:459.7pt;"><span id="A1.SS4.p6.pic1.2.13.1" class="ltx_text ltx_verbatim ltx_font_typewriter ltx_inline-block" style="width:459.7pt;--ltx-fg-color:#000000;"><span id="A1.SS4.p6.pic1.2.13.1.1" class="ltx_inline-logical-block ltx_parbox ltx_align_top" style="width:459.7pt;">
<span id="A1.SS4.p6.pic1.p13" class="ltx_para ltx_noindent">
<span id="A1.SS4.p6.pic1.p13.1" class="ltx_p">- Record changes criterion by criterion.</span>
</span></span></span></span>
<span id="A1.SS4.p6.pic1.2.14" class="ltx_p" style="width:459.7pt;"><span id="A1.SS4.p6.pic1.2.14.1" class="ltx_text ltx_verbatim ltx_font_typewriter ltx_inline-block" style="width:459.7pt;--ltx-fg-color:#000000;"><span id="A1.SS4.p6.pic1.2.14.1.1" class="ltx_inline-logical-block ltx_parbox ltx_pruned_first ltx_align_top" style="width:459.7pt;"></span></span></span>
<span id="A1.SS4.p6.pic1.2.15" class="ltx_p" style="width:459.7pt;"><span id="A1.SS4.p6.pic1.2.15.1" class="ltx_text ltx_verbatim ltx_font_typewriter ltx_inline-block" style="width:459.7pt;--ltx-fg-color:#000000;"><span id="A1.SS4.p6.pic1.2.15.1.1" class="ltx_inline-logical-block ltx_parbox ltx_align_top" style="width:459.7pt;">
<span id="A1.SS4.p6.pic1.p15" class="ltx_para ltx_noindent">
<span id="A1.SS4.p6.pic1.p15.1" class="ltx_p">[SE_OUTPUT_ADJ]</span>
</span></span></span></span>
<span id="A1.SS4.p6.pic1.2.16" class="ltx_p" style="width:459.7pt;"><span id="A1.SS4.p6.pic1.2.16.1" class="ltx_text ltx_verbatim ltx_font_typewriter ltx_inline-block" style="width:459.7pt;--ltx-fg-color:#000000;"><span id="A1.SS4.p6.pic1.2.16.1.1" class="ltx_inline-logical-block ltx_parbox ltx_pruned_first ltx_align_top" style="width:459.7pt;"></span></span></span>
