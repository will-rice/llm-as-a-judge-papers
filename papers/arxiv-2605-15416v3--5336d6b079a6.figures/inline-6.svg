</span>
<span id="A4.SS4.p2.pic1.p5" class="ltx_para">
<span id="A4.SS4.p2.pic1.p5.1" class="ltx_p"><span id="A4.SS4.p2.pic1.p5.1.1" class="ltx_text ltx_font_bold" style="--ltx-fg-color:#000000;">Output A
<br class="ltx_break"><span id="A4.SS4.p2.pic1.p5.1.1.1" class="ltx_text ltx_font_medium">I recently visited Pizzeria and had an amazing experience. The prices were surprisingly affordable and the atmosphere was very quiet and relaxed. The food was delicious - definitely some of the best pizza I’ve had. The staff were also very friendly and accommodating. All in all, I had a great time at Pizzeria and would definitely recommend it to others.</span></span></span>
