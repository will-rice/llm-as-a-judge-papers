</span></span></span>
<span id="S3.F3.pic1.2.11" class="ltx_p"><span id="S3.F3.pic1.2.11.1" class="ltx_text" style="--ltx-fg-color:#FF0000;">Score 1: <span id="S3.F3.pic1.2.11.1.1" class="ltx_text ltx_font_typewriter">{score1_description}</span><span id="S3.F3.pic1.2.11.1.2" class="ltx_text"></span></span></span>
