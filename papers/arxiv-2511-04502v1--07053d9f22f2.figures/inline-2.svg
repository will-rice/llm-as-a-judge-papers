<span id="S7.SS2.SSS1.p2.pic1.1.1" class="ltx_p"><span id="S7.SS2.SSS1.p2.pic1.1.1.1" class="ltx_text" style="--ltx-fg-color:#FFFFFF;">Evaluation Prompt</span></span>
</span></span></span></foreignobject></g><g fill-opacity="1.0" transform="matrix(1.0 0.0 0.0 1.0 21.65 16.2)"><foreignobject style="--ltx-fo-width:33.91em;--ltx-fo-height:21.03em;--ltx-fo-depth:0.18em;font-size:10pt;" height="293.35" overflow="visible" transform="matrix(1 0 0 -1 0 290.93)" width="469.22"><span class="ltx_foreignobject_container"><span class="ltx_foreignobject_content">
<span id="S7.SS2.SSS1.p2.pic1.2" class="ltx_inline-block ltx_minipage ltx_align_bottom" style="width:33.91em;">
<span id="S7.SS2.SSS1.p2.pic1.2.1" class="ltx_p"><span id="S7.SS2.SSS1.p2.pic1.2.1.1" class="ltx_text" style="font-size:90%;--ltx-fg-color:#000000;">You will be given a student answer and a ground truth.
<br class="ltx_break"></span></span>
<span id="S7.SS2.SSS1.p2.pic1.2.2" class="ltx_p"><span id="S7.SS2.SSS1.p2.pic1.2.2.1" class="ltx_text" style="font-size:90%;--ltx-fg-color:#000000;">Your task is to evaluate the student answer by comparing it with the ground truth.
Give your evaluation on a scale of 0.0 to 1.0, where 0.0 means that the answer is completely unrelated to the ground truth, and 1.0 means that the answer is completely accurate and aligns perfectly with the ground truth. 
<br class="ltx_break"></span></span>
<span id="S7.SS2.SSS1.p2.pic1.2.3" class="ltx_p"><span id="S7.SS2.SSS1.p2.pic1.2.3.1" class="ltx_text" style="font-size:90%;--ltx-fg-color:#000000;">For instance,
<br class="ltx_break">correctness_score: 0.0 – The answer is completely unrelated to the ground truth.
<br class="ltx_break">correctness_score: 0.3 – The answer has minor relevance but does not align with the ground truth.
<br class="ltx_break">correctness_score: 0.5 – The answer has moderate relevance but contains inaccuracies.
<br class="ltx_break">correctness_score: 0.7 – The answer aligns with the reference but has minor errors or omissions.
<br class="ltx_break">correctness_score: 1.0 – The answer is completely accurate and aligns perfectly with the ground truth.
<br class="ltx_break"></span></span>
<span id="S7.SS2.SSS1.p2.pic1.2.4" class="ltx_p"><span id="S7.SS2.SSS1.p2.pic1.2.4.1" class="ltx_text" style="font-size:90%;--ltx-fg-color:#000000;">You must provide values for correctness_score: in your answer.
<br class="ltx_break"></span></span>
<span id="S7.SS2.SSS1.p2.pic1.2.5" class="ltx_p"><span id="S7.SS2.SSS1.p2.pic1.2.5.1" class="ltx_text" style="font-size:90%;--ltx-fg-color:#000000;">Now here is the student answer and the ground truth.</span></span>
</span></span></span></foreignobject></g></g></svg>