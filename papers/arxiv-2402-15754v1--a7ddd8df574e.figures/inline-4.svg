<span id="A8.F13.pic1.1.5" class="ltx_p"><span id="A8.F13.pic1.1.5.1" class="ltx_text" style="--ltx-fg-color:#000000;">Please return your score on the above metric in the scale of 1 to 5, with 1 being the lowest. 
