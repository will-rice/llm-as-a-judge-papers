<span id="S5.SS3.SSS0.Px3.p3.pic1.1" class="ltx_inline-block ltx_minipage ltx_align_bottom" style="width:45.04em;">
<span id="S5.SS3.SSS0.Px3.p3.pic1.1.1" class="ltx_p"><span id="S5.SS3.SSS0.Px3.p3.pic1.1.1.1" class="ltx_text ltx_font_bold" style="--ltx-fg-color:#418FDE;">Answer to RQ3:</span><span id="S5.SS3.SSS0.Px3.p3.pic1.1.1.2" class="ltx_text" style="--ltx-fg-color:#000000;">
We find that pair-wise evaluation is more suitable for coding-related tasks, which require more fine-grained analysis of candidate responses. However, inherent judgment biases in pair-wise comparisons underscore the importance of positional robustness when applying Best-of-N strategies. Additionally, our results indicate that providing LLM-as-a-Judge models with the entire raw response, without any pre-processing, leads to better performance.</span></span>
</span></span></span></foreignobject></g></g></svg>