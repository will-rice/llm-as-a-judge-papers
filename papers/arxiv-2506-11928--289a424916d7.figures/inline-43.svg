<svg id="S15.SS0.SSS0.Px19.p2.pic1" class="ltx_picture" height="570.2" overflow="visible" version="1.1" viewbox="0 0 477.38 570.2" width="477.38"><g style="--ltx-stroke-color:#000000;--ltx-fill-color:#000000;" fill="#000000" stroke="#000000" stroke-width="0.4pt" transform="translate(0,570.2) matrix(1 0 0 -1 0 0)"><g style="--ltx-fill-color:#BF0000;" fill="#BF0000" fill-opacity="1.0"><path style="stroke:none" d="M 0 5.91 L 0 564.3 C 0 567.56 2.64 570.2 5.91 570.2 L 471.47 570.2 C 474.73 570.2 477.38 567.56 477.38 564.3 L 477.38 5.91 C 477.38 2.64 474.73 0 471.47 0 L 5.91 0 C 2.64 0 0 2.64 0 5.91 Z" /></g><g style="--ltx-fill-color:#FFF2F2;" fill="#FFF2F2" fill-opacity="1.0"><path style="stroke:none" d="M 1.97 5.91 L 1.97 544.55 L 475.41 544.55 L 475.41 5.91 C 475.41 3.73 473.65 1.97 471.47 1.97 L 5.91 1.97 C 3.73 1.97 1.97 3.73 1.97 5.91 Z" /></g><g fill-opacity="1.0" transform="matrix(1.0 0.0 0.0 1.0 21.65 553.92)"><foreignobject style="--ltx-fo-width:31.37em;--ltx-fo-height:0.75em;--ltx-fo-depth:0.25em;font-size:10pt;" height="13.84" overflow="visible" transform="matrix(1 0 0 -1 0 10.38)" width="434.07"><span class="ltx_foreignobject_container"><span class="ltx_foreignobject_content">
<span id="S15.SS0.SSS0.Px19.p2.pic1.1" class="ltx_inline-block ltx_minipage ltx_align_bottom" style="width:31.37em;">
<span id="S15.SS0.SSS0.Px19.p2.pic1.1.1" class="ltx_p"><a href="https://codeforces.com/problemset/problem/2013/C" title class="ltx_ref ltx_href" style="--ltx-fg-color:#FFFFFF;">Example Interactive Problem (Rated 1400)</a></span>
</span></span></span></foreignobject></g><g fill-opacity="1.0" transform="matrix(1.0 0.0 0.0 1.0 21.65 16.47)"><foreignobject style="--ltx-fo-width:31.37em;--ltx-fo-height:37.31em;--ltx-fo-depth:0.19em;font-size:10pt;" height="518.97" overflow="visible" transform="matrix(1 0 0 -1 0 516.28)" width="434.07"><span class="ltx_foreignobject_container"><span class="ltx_foreignobject_content">
<span id="S15.SS0.SSS0.Px19.p2.pic1.2" class="ltx_inline-block ltx_minipage ltx_align_bottom" style="width:31.37em;">
<span id="S15.SS0.SSS0.Px19.p2.pic1.2.1" class="ltx_p"><span id="S15.SS0.SSS0.Px19.p2.pic1.2.1.1" class="ltx_text" style="--ltx-fg-color:#000000;">Dimash learned that Mansur wrote something very unpleasant about him to a friend, so he decided to find out his password at all costs and discover what exactly he wrote.

<br class="ltx_break">
<br class="ltx_break">Believing in the strength of his password, Mansur stated that his password—is a binary string of length <math id="S15.SS0.SSS0.Px19.p2.pic1.m1" class="ltx_Math" alttext="n" display="inline" intent=":literal"><semantics><mi style="--ltx-fg-color:#000000;" mathcolor="#000000">n</mi><annotation encoding="application/x-tex">n</annotation></semantics></math>. He is also ready to answer Dimash’s questions of the following type:

<br class="ltx_break">
<br class="ltx_break">Dimash says a binary string <math id="S15.SS0.SSS0.Px19.p2.pic1.m2" class="ltx_Math" alttext="t" display="inline" intent=":literal"><semantics><mi style="--ltx-fg-color:#000000;" mathcolor="#000000">t</mi><annotation encoding="application/x-tex">t</annotation></semantics></math>, and Mansur replies whether it is true that <math id="S15.SS0.SSS0.Px19.p2.pic1.m3" class="ltx_Math" alttext="t" display="inline" intent=":literal"><semantics><mi style="--ltx-fg-color:#000000;" mathcolor="#000000">t</mi><annotation encoding="application/x-tex">t</annotation></semantics></math> is a substring of his password.

<br class="ltx_break">
<br class="ltx_break">Help Dimash find out the password in no more than <math id="S15.SS0.SSS0.Px19.p2.pic1.m4" class="ltx_Math" alttext="2n" display="inline" intent=":literal"><semantics><mrow><mn style="--ltx-fg-color:#000000;" mathcolor="#000000">2</mn><mo lspace="0em" rspace="0em">​</mo><mi style="--ltx-fg-color:#000000;" mathcolor="#000000">n</mi></mrow><annotation encoding="application/x-tex">2n</annotation></semantics></math> operations; otherwise, Mansur will understand the trick and stop communicating with him.

<br class="ltx_break">
<br class="ltx_break"><span id="S15.SS0.SSS0.Px19.p2.pic1.2.1.1.1" class="ltx_text ltx_font_bold">Input
<br class="ltx_break"></span>Each test contains multiple test cases. The first line contains the number of test cases <math id="S15.SS0.SSS0.Px19.p2.pic1.m5" class="ltx_Math" alttext="t" display="inline" intent=":literal"><semantics><mi style="--ltx-fg-color:#000000;" mathcolor="#000000">t</mi><annotation encoding="application/x-tex">t</annotation></semantics></math> <math id="S15.SS0.SSS0.Px19.p2.pic1.m6" class="ltx_Math" alttext="(1\leq t\leq 100)." display="inline" intent=":literal"><semantics><mrow><mrow><mo style="--ltx-fg-color:#000000;" mathcolor="#000000" stretchy="false">(</mo><mrow><mn style="--ltx-fg-color:#000000;" mathcolor="#000000">1</mn><mo style="--ltx-fg-color:#000000;" mathcolor="#000000">≤</mo><mi style="--ltx-fg-color:#000000;" mathcolor="#000000">t</mi><mo style="--ltx-fg-color:#000000;" mathcolor="#000000">≤</mo><mn style="--ltx-fg-color:#000000;" mathcolor="#000000">100</mn></mrow><mo style="--ltx-fg-color:#000000;" mathcolor="#000000" stretchy="false">)</mo></mrow><mo style="--ltx-fg-color:#000000;" lspace="0em" mathcolor="#000000">.</mo></mrow><annotation encoding="application/x-tex">(1\leq t\leq 100).</annotation></semantics></math> The description of the test cases follows.

<br class="ltx_break">
<br class="ltx_break"><span id="S15.SS0.SSS0.Px19.p2.pic1.2.1.1.2" class="ltx_text ltx_font_bold">Interaction
<br class="ltx_break"></span>At the beginning of each test case, first read <math id="S15.SS0.SSS0.Px19.p2.pic1.m7" class="ltx_Math" alttext="n" display="inline" intent=":literal"><semantics><mi style="--ltx-fg-color:#000000;" mathcolor="#000000">n</mi><annotation encoding="application/x-tex">n</annotation></semantics></math> <math id="S15.SS0.SSS0.Px19.p2.pic1.m8" class="ltx_Math" alttext="(1\leq n\leq 100)" display="inline" intent=":literal"><semantics><mrow><mo style="--ltx-fg-color:#000000;" mathcolor="#000000" stretchy="false">(</mo><mrow><mn style="--ltx-fg-color:#000000;" mathcolor="#000000">1</mn><mo style="--ltx-fg-color:#000000;" mathcolor="#000000">≤</mo><mi style="--ltx-fg-color:#000000;" mathcolor="#000000">n</mi><mo style="--ltx-fg-color:#000000;" mathcolor="#000000">≤</mo><mn style="--ltx-fg-color:#000000;" mathcolor="#000000">100</mn></mrow><mo style="--ltx-fg-color:#000000;" mathcolor="#000000" stretchy="false">)</mo></mrow><annotation encoding="application/x-tex">(1\leq n\leq 100)</annotation></semantics></math>—the size of the binary string. Then proceed to guessing it.

<br class="ltx_break">
<br class="ltx_break">To guess string <math id="S15.SS0.SSS0.Px19.p2.pic1.m9" class="ltx_Math" alttext="s" display="inline" intent=":literal"><semantics><mi style="--ltx-fg-color:#000000;" mathcolor="#000000">s</mi><annotation encoding="application/x-tex">s</annotation></semantics></math>, you can make no more than <math id="S15.SS0.SSS0.Px19.p2.pic1.m10" class="ltx_Math" alttext="2n" display="inline" intent=":literal"><semantics><mrow><mn style="--ltx-fg-color:#000000;" mathcolor="#000000">2</mn><mo lspace="0em" rspace="0em">​</mo><mi style="--ltx-fg-color:#000000;" mathcolor="#000000">n</mi></mrow><annotation encoding="application/x-tex">2n</annotation></semantics></math> queries of the following type:</span></span>
<span id="S15.I13" class="ltx_itemize">
<span id="S15.I13.i1" class="ltx_item" style="list-style-type:none;"><span class="ltx_tag ltx_tag_item">•</span> 
<span id="S15.I13.i1.p1" class="ltx_para">
<span id="S15.I13.i1.p1.1" class="ltx_p"><span id="S15.I13.i1.p1.1.1" class="ltx_text" style="--ltx-fg-color:#000000;">“</span><span id="S15.I13.i1.p1.1.2" class="ltx_text ltx_font_typewriter" style="--ltx-fg-color:#000000;">? t</span><span id="S15.I13.i1.p1.1.3" class="ltx_text" style="--ltx-fg-color:#000000;">”, where </span><math id="S15.I13.i1.p1.m1" class="ltx_Math" alttext="t" display="inline" intent=":literal"><semantics><mi style="--ltx-fg-color:#000000;" mathcolor="#000000">t</mi><annotation encoding="application/x-tex">t</annotation></semantics></math><span id="S15.I13.i1.p1.1.4" class="ltx_text" style="--ltx-fg-color:#000000;"> is a binary string such that </span><math id="S15.I13.i1.p1.m2" class="ltx_Math" alttext="(1\leq|t|\leq n)" display="inline" intent=":literal"><semantics><mrow><mo style="--ltx-fg-color:#000000;" mathcolor="#000000" stretchy="false">(</mo><mrow><mn style="--ltx-fg-color:#000000;" mathcolor="#000000">1</mn><mo style="--ltx-fg-color:#000000;" mathcolor="#000000">≤</mo><mrow><mo style="--ltx-fg-color:#000000;" mathcolor="#000000" stretchy="false">|</mo><mi style="--ltx-fg-color:#000000;" mathcolor="#000000">t</mi><mo style="--ltx-fg-color:#000000;" mathcolor="#000000" stretchy="false">|</mo></mrow><mo style="--ltx-fg-color:#000000;" mathcolor="#000000">≤</mo><mi style="--ltx-fg-color:#000000;" mathcolor="#000000">n</mi></mrow><mo style="--ltx-fg-color:#000000;" mathcolor="#000000" stretchy="false">)</mo></mrow><annotation encoding="application/x-tex">(1\leq|t|\leq n)</annotation></semantics></math><span id="S15.I13.i1.p1.1.5" class="ltx_text" style="--ltx-fg-color:#000000;">.</span></span>
</span></span>
</span>
<span id="S15.SS0.SSS0.Px19.p2.pic1.2.2" class="ltx_p"><span id="S15.SS0.SSS0.Px19.p2.pic1.2.2.1" class="ltx_text" style="--ltx-fg-color:#000000;">In response to this query, you will receive <math id="S15.SS0.SSS0.Px19.p2.pic1.m11" class="ltx_Math" alttext="1" display="inline" intent=":literal"><semantics><mn style="--ltx-fg-color:#000000;" mathcolor="#000000">1</mn><annotation encoding="application/x-tex">1</annotation></semantics></math> if <math id="S15.SS0.SSS0.Px19.p2.pic1.m12" class="ltx_Math" alttext="t" display="inline" intent=":literal"><semantics><mi style="--ltx-fg-color:#000000;" mathcolor="#000000">t</mi><annotation encoding="application/x-tex">t</annotation></semantics></math> is a substring of <math id="S15.SS0.SSS0.Px19.p2.pic1.m13" class="ltx_Math" alttext="s" display="inline" intent=":literal"><semantics><mi style="--ltx-fg-color:#000000;" mathcolor="#000000">s</mi><annotation encoding="application/x-tex">s</annotation></semantics></math>, and <math id="S15.SS0.SSS0.Px19.p2.pic1.m14" class="ltx_Math" alttext="0" display="inline" intent=":literal"><semantics><mn style="--ltx-fg-color:#000000;" mathcolor="#000000">0</mn><annotation encoding="application/x-tex">0</annotation></semantics></math> otherwise.

<br class="ltx_break">
<br class="ltx_break">Once you receive the answer, output a single string in the following format:</span></span>
<span id="S15.I14" class="ltx_itemize">
<span id="S15.I14.i1" class="ltx_item" style="list-style-type:none;"><span class="ltx_tag ltx_tag_item">•</span> 
<span id="S15.I14.i1.p1" class="ltx_para">
<span id="S15.I14.i1.p1.1" class="ltx_p"><span id="S15.I14.i1.p1.1.1" class="ltx_text" style="--ltx-fg-color:#000000;">“</span><span id="S15.I14.i1.p1.1.2" class="ltx_text ltx_font_typewriter" style="--ltx-fg-color:#000000;">! s</span><span id="S15.I14.i1.p1.1.3" class="ltx_text" style="--ltx-fg-color:#000000;">”, where </span><math id="S15.I14.i1.p1.m1" class="ltx_Math" alttext="s" display="inline" intent=":literal"><semantics><mi style="--ltx-fg-color:#000000;" mathcolor="#000000">s</mi><annotation encoding="application/x-tex">s</annotation></semantics></math><span id="S15.I14.i1.p1.1.4" class="ltx_text" style="--ltx-fg-color:#000000;"> is a binary string of size </span><math id="S15.I14.i1.p1.m2" class="ltx_Math" alttext="n" display="inline" intent=":literal"><semantics><mi style="--ltx-fg-color:#000000;" mathcolor="#000000">n</mi><annotation encoding="application/x-tex">n</annotation></semantics></math><span id="S15.I14.i1.p1.1.5" class="ltx_text" style="--ltx-fg-color:#000000;">.</span></span>
</span></span>
</span>
<span id="S15.SS0.SSS0.Px19.p2.pic1.2.3" class="ltx_p"><span id="S15.SS0.SSS0.Px19.p2.pic1.2.3.1" class="ltx_text" style="--ltx-fg-color:#000000;">After that, proceed to solve the next test case.</span></span>
</span></span></span></foreignobject></g></g></svg>