<span id="A1.SS7.p2.pic1.p1" class="ltx_para ltx_noindent">
<span id="A1.SS7.p2.pic1.p1.1" class="ltx_p"><span id="A1.SS7.p2.pic1.p1.1.1" class="ltx_text ltx_font_bold" style="--ltx-fg-color:#000000;">Sampling protocol</span></span>
</span>
<span id="A1.SS7.p2.pic1.p3" class="ltx_para">
<span id="A1.SS7.p2.pic1.p3.1" class="ltx_p"><span id="A1.SS7.p2.pic1.p3.1.1" class="ltx_text" style="--ltx-fg-color:#000000;">Population: the released dataset contains 1,434 research questions. From this RQ pool we drew 50 items uniformly at random without replacement
using Python <span id="A1.SS7.p2.pic1.p3.1.1.1" class="ltx_text ltx_font_typewriter">random.sample</span> with <span id="A1.SS7.p2.pic1.p3.1.1.2" class="ltx_text ltx_font_typewriter">random.seed(42)</span>. Each ID
matches the <span id="A1.SS7.p2.pic1.p3.1.1.3" class="ltx_text ltx_font_typewriter">rq_id</span> field in the released dataset and has the form
<span id="A1.SS7.p2.pic1.p3.1.1.4" class="ltx_text ltx_font_typewriter">&lt;arxiv_id&gt;_rq&lt;index&gt;</span>, where <span id="A1.SS7.p2.pic1.p3.1.1.5" class="ltx_text ltx_font_typewriter">&lt;index&gt;</span> is the position of
the question within the paper’s <span id="A1.SS7.p2.pic1.p3.1.1.6" class="ltx_text ltx_font_typewriter">research_questions</span> list.</span></span>
</span>
