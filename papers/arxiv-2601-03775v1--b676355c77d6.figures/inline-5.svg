<span id="A2.p2.pic1.1" class="ltx_inline-block ltx_minipage ltx_align_bottom" style="width:45.33em;">
<span id="A2.p2.pic1.1.1" class="ltx_p"><span id="A2.p2.pic1.1.1.1" class="ltx_text" style="--ltx-fg-color:#FFFFFF;">User Instructions</span></span>
</span></span></span></foreignobject></g><g fill-opacity="1.0" transform="matrix(1.0 0.0 0.0 1.0 12.93 12.93)"><foreignobject style="--ltx-fo-width:45.33em;--ltx-fo-height:33.45em;--ltx-fo-depth:0em;font-size:10pt;" height="462.85" overflow="visible" transform="matrix(1 0 0 -1 0 462.85)" width="627.24"><span class="ltx_foreignobject_container"><span class="ltx_foreignobject_content">
<span id="A2.p2.pic1.2" class="ltx_inline-block ltx_minipage ltx_align_bottom" style="width:45.33em;">
<span id="A2.p2.pic1.2.1" class="ltx_p"><span id="A2.p2.pic1.2.1.1" class="ltx_text ltx_font_bold" style="--ltx-fg-color:#000000;">Prompt/ instructions for LLM:<span id="A2.p2.pic1.2.1.1.1" class="ltx_text"></span></span></span>
<span id="A2.p2.pic1.2.2" class="ltx_p"><span id="A2.p2.pic1.2.2.1" class="ltx_text" style="--ltx-fg-color:#000000;">Step 1: Read the original yes/no question and the answer.
<br class="ltx_break">Step 2: Flip the original answer.
<br class="ltx_break">Step 3: Work out how to make the answer true.
<br class="ltx_break">Step 4: Write a new question that asks if the answer would be true if the action you worked out in Step 3 was performed. Change the original questions to new questions of unreal conditions with counterfactual presuppositions, using if clauses. Do not change the meaning of questions in new questions.
<br class="ltx_break">Step 5: Write the new answer to the new questions.</span></span>
<span id="A2.p2.pic1.2.3" class="ltx_p"><span id="A2.p2.pic1.2.3.1" class="ltx_text" style="--ltx-fg-color:#000000;">Answer each initial question with the following format:</span></span>
<span id="A2.p2.pic1.2.4" class="ltx_p"><span id="A2.p2.pic1.2.4.1" class="ltx_text ltx_font_typewriter" style="--ltx-fg-color:#000000;">Original question: &lt;original question&gt;
<br class="ltx_break">Original answer: &lt;original answer&gt;
<br class="ltx_break">Step1: The new answer should be &lt;yes/no&gt;, so …
<br class="ltx_break">Step2: How to make …: …
<br class="ltx_break">New question: &lt;new question&gt;<span id="A2.p2.pic1.2.4.1.1" class="ltx_text ltx_font_serif">
</span></span></span>
<span id="A2.p2.pic1.2.5" class="ltx_p"><span id="A2.p2.pic1.2.5.1" class="ltx_text" style="--ltx-fg-color:#000000;">Here are some examples:</span></span>
<span id="A2.p2.pic1.2.6" class="ltx_p"><span id="A2.p2.pic1.2.6.1" class="ltx_text" style="--ltx-fg-color:#000000;">Original question: Would the top of Mount Fuji stick out of the Sea of Japan?
<br class="ltx_break">Original answer: Yes
<br class="ltx_break">New question: If global sea level were 4,000 meters higher, would the top of Mount Fuji stick out of the Sea of Japan?
<br class="ltx_break">New answer: No</span></span>
<span id="A2.p2.pic1.2.7" class="ltx_p"><span id="A2.p2.pic1.2.7.1" class="ltx_text" style="--ltx-fg-color:#000000;">Original question: Would an uninsured person be more likely than an insured person to decline a CT scan?
<br class="ltx_break">Original answer: Yes
<br class="ltx_break">New question: If CT scans were free at the point of care for everyone, would an uninsured person be more likely than an insured person to decline a CT scan?
<br class="ltx_break">New answer: No</span></span>
</span></span></span></foreignobject></g></g></svg>