<span id="S2.I1.i2.p2.pic1.2.1" class="ltx_p"><span id="S2.I1.i2.p2.pic1.2.1.1" class="ltx_text" style="--ltx-fg-color:#000000;">Given integers n, t and an array <math id="S2.I1.i2.p2.pic1.m1" class="ltx_Math" alttext="a_{1},a_{2},...,a_{n}" display="inline" intent=":literal"><semantics><mrow><msub><mi style="--ltx-fg-color:#000000;" mathcolor="#000000">a</mi><mn style="--ltx-fg-color:#000000;" mathcolor="#000000">1</mn></msub><mo style="--ltx-fg-color:#000000;" mathcolor="#000000">,</mo><msub><mi style="--ltx-fg-color:#000000;" mathcolor="#000000">a</mi><mn style="--ltx-fg-color:#000000;" mathcolor="#000000">2</mn></msub><mo style="--ltx-fg-color:#000000;" mathcolor="#000000">,</mo><mi style="--ltx-fg-color:#000000;" mathcolor="#000000" mathvariant="normal">…</mi><mo style="--ltx-fg-color:#000000;" mathcolor="#000000">,</mo><msub><mi style="--ltx-fg-color:#000000;" mathcolor="#000000">a</mi><mi style="--ltx-fg-color:#000000;" mathcolor="#000000">n</mi></msub></mrow><annotation encoding="application/x-tex">a_{1},a_{2},...,a_{n}</annotation></semantics></math>, count the number of ways to partition the array <math id="S2.I1.i2.p2.pic1.m2" class="ltx_Math" alttext="a" display="inline" intent=":literal"><semantics><mi style="--ltx-fg-color:#000000;" mathcolor="#000000">a</mi><annotation encoding="application/x-tex">a</annotation></semantics></math> into disjoint groups (singleton groups allowed) so that the total imbalance, defined as the sum over all groups of (max <math id="S2.I1.i2.p2.pic1.m3" class="ltx_Math" alttext="a" display="inline" intent=":literal"><semantics><mi style="--ltx-fg-color:#000000;" mathcolor="#000000">a</mi><annotation encoding="application/x-tex">a</annotation></semantics></math> in group - min <math id="S2.I1.i2.p2.pic1.m4" class="ltx_Math" alttext="a" display="inline" intent=":literal"><semantics><mi style="--ltx-fg-color:#000000;" mathcolor="#000000">a</mi><annotation encoding="application/x-tex">a</annotation></semantics></math> in group), is at most t. Output the count modulo <math id="S2.I1.i2.p2.pic1.m5" class="ltx_Math" alttext="10^{9}+7" display="inline" intent=":literal"><semantics><mrow><msup><mn style="--ltx-fg-color:#000000;" mathcolor="#000000">10</mn><mn style="--ltx-fg-color:#000000;" mathcolor="#000000">9</mn></msup><mo style="--ltx-fg-color:#000000;" mathcolor="#000000">+</mo><mn style="--ltx-fg-color:#000000;" mathcolor="#000000">7</mn></mrow><annotation encoding="application/x-tex">10^{9}+7</annotation></semantics></math> (a large prime number).</span></span>
<span id="S2.I1.i2.p2.pic1.2.2" class="ltx_p"><span id="S2.I1.i2.p2.pic1.2.2.1" class="ltx_text ltx_font_bold" style="--ltx-fg-color:#000000;">Data range:<span id="S2.I1.i2.p2.pic1.2.2.1.1" class="ltx_text ltx_font_medium"> <math id="S2.I1.i2.p2.pic1.m6" class="ltx_Math" alttext="1\leq n\leq 200,0\leq t\leq 1000,1\leq a_{i}\leq 500" display="inline" intent=":literal"><semantics><mrow><mrow><mn style="--ltx-fg-color:#000000;" mathcolor="#000000">1</mn><mo style="--ltx-fg-color:#000000;" mathcolor="#000000">≤</mo><mi style="--ltx-fg-color:#000000;" mathcolor="#000000">n</mi><mo style="--ltx-fg-color:#000000;" mathcolor="#000000">≤</mo><mn style="--ltx-fg-color:#000000;" mathcolor="#000000">200</mn></mrow><mo style="--ltx-fg-color:#000000;" mathcolor="#000000">,</mo><mrow><mn style="--ltx-fg-color:#000000;" mathcolor="#000000">0</mn><mo style="--ltx-fg-color:#000000;" mathcolor="#000000">≤</mo><mi style="--ltx-fg-color:#000000;" mathcolor="#000000">t</mi><mo style="--ltx-fg-color:#000000;" mathcolor="#000000">≤</mo><mn style="--ltx-fg-color:#000000;" mathcolor="#000000">1000</mn></mrow><mo style="--ltx-fg-color:#000000;" mathcolor="#000000">,</mo><mrow><mn style="--ltx-fg-color:#000000;" mathcolor="#000000">1</mn><mo style="--ltx-fg-color:#000000;" mathcolor="#000000">≤</mo><msub><mi style="--ltx-fg-color:#000000;" mathcolor="#000000">a</mi><mi style="--ltx-fg-color:#000000;" mathcolor="#000000">i</mi></msub><mo style="--ltx-fg-color:#000000;" mathcolor="#000000">≤</mo><mn style="--ltx-fg-color:#000000;" mathcolor="#000000">500</mn></mrow></mrow><annotation encoding="application/x-tex">1\leq n\leq 200,0\leq t\leq 1000,1\leq a_{i}\leq 500</annotation></semantics></math>
