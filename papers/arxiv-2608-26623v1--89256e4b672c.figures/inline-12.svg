<span id="A9.p4.pic1.2.1" class="ltx_p"><span id="A9.p4.pic1.2.1.1" class="ltx_text" style="--ltx-fg-color:#000000;">(1) <span id="A9.p4.pic1.2.1.1.1" class="ltx_text ltx_font_typewriter">calculate_temporal_transaction_deviation</span>, (2) <span id="A9.p4.pic1.2.1.1.2" class="ltx_text ltx_font_typewriter">calculate_amount_based_deviation</span>, (3) <span id="A9.p4.pic1.2.1.1.3" class="ltx_text ltx_font_typewriter">compute_composite_behavior_anomaly_score</span>: the first two calls are independent and must both complete before the third (fan-in), which combines their outputs.</span></span>
