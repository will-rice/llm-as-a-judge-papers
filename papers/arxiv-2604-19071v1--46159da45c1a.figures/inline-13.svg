<span id="A13.SS6.p1.pic1.2" class="ltx_inline-block ltx_minipage ltx_align_bottom" style="width:44.07em;">
<span id="A13.SS6.p1.pic1.2.1" class="ltx_p"><span id="A13.SS6.p1.pic1.2.1.1" class="ltx_text ltx_font_bold" style="--ltx-fg-color:#000000;">Input<span id="A13.SS6.p1.pic1.2.1.1.1" class="ltx_text ltx_font_medium">: Instruction, Reference, Content</span></span></span>
</span></span></span></foreignobject></g><g fill-opacity="1.0" transform="matrix(1.0 0.0 0.0 1.0 21.65 13.78)"><foreignobject style="--ltx-fo-width:44.07em;--ltx-fo-height:42.66em;--ltx-fo-depth:0em;font-size:10pt;" height="590.31" overflow="visible" transform="matrix(1 0 0 -1 0 590.31)" width="609.8"><span class="ltx_foreignobject_container"><span class="ltx_foreignobject_content">
<span id="A13.SS6.p1.pic1.3" class="ltx_inline-block ltx_minipage ltx_align_bottom" style="width:44.07em;">
<span id="A13.SS6.p1.pic1.3.1" class="ltx_p"><span id="A13.SS6.p1.pic1.3.1.1" class="ltx_text" style="--ltx-fg-color:#000000;">Please evaluate the rationality of the chapter and paragraph divisions in the &quot;Writing to Be Evaluated&quot; according to the following principles:</span></span>
<span id="A13.I31" class="ltx_enumerate">
<span id="A13.I31.i1" class="ltx_item" style="list-style-type:none;"><span class="ltx_tag ltx_tag_item">1.</span> 
<span id="A13.I31.i1.p1" class="ltx_para">
<span id="A13.I31.i1.p1.1" class="ltx_p"><span id="A13.I31.i1.p1.1.1" class="ltx_text ltx_font_bold" style="--ltx-fg-color:#000000;">Balance Between Sections</span><span id="A13.I31.i1.p1.1.2" class="ltx_text" style="--ltx-fg-color:#000000;">: Avoid overly long paragraphs (exceeding 500 characters) or having a single chapter that is disproportionately longer than all other chapters combined. Ideally, the length of each section should not vary significantly.</span></span>
</span></span>
<span id="A13.I31.i2" class="ltx_item" style="list-style-type:none;"><span class="ltx_tag ltx_tag_item">2.</span> 
<span id="A13.I31.i2.p1" class="ltx_para">
<span id="A13.I31.i2.p1.1" class="ltx_p"><span id="A13.I31.i2.p1.1.1" class="ltx_text ltx_font_bold" style="--ltx-fg-color:#000000;">Necessity of Chapter Division</span><span id="A13.I31.i2.p1.1.2" class="ltx_text" style="--ltx-fg-color:#000000;">: Dividing content by chapters using titles is necessary for texts with strong structural requirements, such as lengthy novels, reports, or speeches. Avoid meaningless chapter divisions, such as splitting text into separate chapters when it could logically be merged into one. Ideally, each chapter should aim for a word count exceeding 800 characters.</span></span>
</span></span>
<span id="A13.I31.i3" class="ltx_item" style="list-style-type:none;"><span class="ltx_tag ltx_tag_item">3.</span> 
<span id="A13.I31.i3.p1" class="ltx_para">
<span id="A13.I31.i3.p1.1" class="ltx_p"><span id="A13.I31.i3.p1.1.1" class="ltx_text ltx_font_bold" style="--ltx-fg-color:#000000;">Necessity of Paragraph Division</span><span id="A13.I31.i3.p1.1.2" class="ltx_text" style="--ltx-fg-color:#000000;">: All writing (aside from poetry) should avoid excessive paragraphing, such as having a majority of paragraphs consisting of only a single sentence. For poetry, stanzas or paragraphs can be divided according to rhythm. Additionally, avoid failing to segment thoughts—do not lump too many distinct themes or arguments into a single paragraph. Ideally, each paragraph should exceed 50 characters, though briefer paragraphs can be used for rhythmic or tonal purposes.</span></span>
</span></span>
</span>
<span id="A13.SS6.p1.pic1.3.2" class="ltx_p"><span id="A13.SS6.p1.pic1.3.2.1" class="ltx_text" style="--ltx-fg-color:#000000;">Based on the three points above, score the text as follows:</span></span>
<span id="A13.I32" class="ltx_itemize">
<span id="A13.I32.i1" class="ltx_item" style="list-style-type:none;"><span class="ltx_tag ltx_tag_item">•</span> 
<span id="A13.I32.i1.p1" class="ltx_para">
<span id="A13.I32.i1.p1.1" class="ltx_p"><span id="A13.I32.i1.p1.1.1" class="ltx_text ltx_font_bold" style="--ltx-fg-color:#000000;">3 Points</span><span id="A13.I32.i1.p1.1.2" class="ltx_text" style="--ltx-fg-color:#000000;">: Division is reasonable and well-structured.</span></span>
</span></span>
<span id="A13.I32.i2" class="ltx_item" style="list-style-type:none;"><span class="ltx_tag ltx_tag_item">•</span> 
<span id="A13.I32.i2.p1" class="ltx_para">
<span id="A13.I32.i2.p1.1" class="ltx_p"><span id="A13.I32.i2.p1.1.1" class="ltx_text ltx_font_bold" style="--ltx-fg-color:#000000;">2 Points</span><span id="A13.I32.i2.p1.1.2" class="ltx_text" style="--ltx-fg-color:#000000;">: Division is somewhat flawed in its chapters or paragraphs.</span></span>
</span></span>
<span id="A13.I32.i3" class="ltx_item" style="list-style-type:none;"><span class="ltx_tag ltx_tag_item">•</span> 
<span id="A13.I32.i3.p1" class="ltx_para">
<span id="A13.I32.i3.p1.1" class="ltx_p"><span id="A13.I32.i3.p1.1.1" class="ltx_text ltx_font_bold" style="--ltx-fg-color:#000000;">1 Point</span><span id="A13.I32.i3.p1.1.2" class="ltx_text" style="--ltx-fg-color:#000000;">: Division is clearly uncoordinated, lacks structured planning, or the evaluated content is missing.</span></span>
</span></span>
</span>
<span id="A13.SS6.p1.pic1.3.3" class="ltx_p"><span id="A13.SS6.p1.pic1.3.3.1" class="ltx_text ltx_font_bold" style="--ltx-fg-color:#000000;">Writing Instructions<span id="A13.SS6.p1.pic1.3.3.1.1" class="ltx_text"></span></span></span>
<span id="A13.SS6.p1.pic1.3.4" class="ltx_p"><span id="A13.SS6.p1.pic1.3.4.1" class="ltx_text" style="--ltx-fg-color:#000000;">{instruction}</span></span>
<span id="A13.SS6.p1.pic1.3.5" class="ltx_p"><span id="A13.SS6.p1.pic1.3.5.1" class="ltx_text ltx_font_bold" style="--ltx-fg-color:#000000;">Writing to Be Evaluated<span id="A13.SS6.p1.pic1.3.5.1.1" class="ltx_text"></span></span></span>
<span id="A13.SS6.p1.pic1.3.6" class="ltx_p"><span id="A13.SS6.p1.pic1.3.6.1" class="ltx_text" style="--ltx-fg-color:#000000;">{content}</span></span>
<span id="A13.SS6.p1.pic1.3.7" class="ltx_p"><span id="A13.SS6.p1.pic1.3.7.1" class="ltx_text ltx_font_bold" style="--ltx-fg-color:#000000;">Evaluation Process<span id="A13.SS6.p1.pic1.3.7.1.1" class="ltx_text"></span></span></span>
<span id="A13.SS6.p1.pic1.3.8" class="ltx_p"><span id="A13.SS6.p1.pic1.3.8.1" class="ltx_text" style="--ltx-fg-color:#000000;">After assigning a score, provide a brief explanation of your rating. Provide your review with the score enclosed in double square brackets. For example:</span></span>
<span id="A13.SS6.p1.pic1.3.9" class="ltx_p"><span id="A13.SS6.p1.pic1.3.9.1" class="ltx_text" style="--ltx-fg-color:#000000;">Overall Score: [[2]]</span></span>
<span id="A13.SS6.p1.pic1.3.10" class="ltx_p"><span id="A13.SS6.p1.pic1.3.10.1" class="ltx_text" style="--ltx-fg-color:#000000;">Reason: …</span></span>
