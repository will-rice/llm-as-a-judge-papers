<span id="A3.T12.pic1.2" class="ltx_inline-block ltx_minipage ltx_align_bottom" style="width:44.07em;">
<span id="A3.T12.pic1.2.1" class="ltx_p">
<span id="A3.T12.pic1.2.1.1" class="ltx_inline-block ltx_parbox ltx_align_middle" style="width:434.7pt;--ltx-bg-color:#E6F0FF;">
<span id="A3.T12.pic1.2.1.1.1" class="ltx_p"><span id="A3.T12.pic1.2.1.1.1.1" class="ltx_text ltx_font_bold" style="--ltx-fg-color:#000000;">System:</span><span id="A3.T12.pic1.2.1.1.1.2" class="ltx_text" style="--ltx-fg-color:#000000;"> You are an expert in summarization evaluation.</span></span>
</span></span>
<span id="A3.T12.pic1.2.2" class="ltx_p">
<span id="A3.T12.pic1.2.2.1" class="ltx_inline-block ltx_parbox ltx_align_middle" style="width:434.7pt;--ltx-bg-color:#FFF9DB;">
<span id="A3.T12.pic1.2.2.1.1" class="ltx_p"><span id="A3.T12.pic1.2.2.1.1.1" class="ltx_text ltx_font_bold" style="--ltx-fg-color:#000000;">User:
<br class="ltx_break"></span><span id="A3.T12.pic1.2.2.1.1.2" class="ltx_text" style="--ltx-fg-color:#000000;">Evaluate the SUMMARY strictly based on the SOURCE TEXT across four metrics on a 0–5 scale (0 = lowest, 5 = highest). You may use decimals (e.g., 3.5).</span></span>
<span id="A3.T12.pic1.2.2.1.2" class="ltx_p"><span id="A3.T12.pic1.2.2.1.2.1" class="ltx_text" style="--ltx-fg-color:#000000;">Metrics:</span></span>
<span id="A3.T12.pic1.2.2.1.3" class="ltx_p"><span id="A3.T12.pic1.2.2.1.3.1" class="ltx_text" style="--ltx-fg-color:#000000;">(1) Relevance: How well the summary captures key content.</span></span>
<span id="A3.T12.pic1.2.2.1.4" class="ltx_p"><span id="A3.T12.pic1.2.2.1.4.1" class="ltx_text" style="--ltx-fg-color:#000000;">(2) Coherence: Logical flow and organization.</span></span>
<span id="A3.T12.pic1.2.2.1.5" class="ltx_p"><span id="A3.T12.pic1.2.2.1.5.1" class="ltx_text" style="--ltx-fg-color:#000000;">(3) Fluency: Grammar, wording, and readability.</span></span>
<span id="A3.T12.pic1.2.2.1.6" class="ltx_p"><span id="A3.T12.pic1.2.2.1.6.1" class="ltx_text" style="--ltx-fg-color:#000000;">(4) Consistency: Factual consistency with the text (no hallucinations).</span></span>
<span id="A3.T12.pic1.2.2.1.7" class="ltx_p"><span id="A3.T12.pic1.2.2.1.7.1" class="ltx_text" style="--ltx-fg-color:#000000;">SOURCE TEXT:</span></span>
<span id="A3.T12.pic1.2.2.1.8" class="ltx_p"><span id="A3.T12.pic1.2.2.1.8.1" class="ltx_text" style="--ltx-fg-color:#000000;">“{text}”</span></span>
<span id="A3.T12.pic1.2.2.1.9" class="ltx_p"><span id="A3.T12.pic1.2.2.1.9.1" class="ltx_text" style="--ltx-fg-color:#000000;">SUMMARY:</span></span>
<span id="A3.T12.pic1.2.2.1.10" class="ltx_p"><span id="A3.T12.pic1.2.2.1.10.1" class="ltx_text" style="--ltx-fg-color:#000000;">“{summary}”</span></span>
<span id="A3.T12.pic1.2.2.1.11" class="ltx_p"><span id="A3.T12.pic1.2.2.1.11.1" class="ltx_text" style="--ltx-fg-color:#000000;">Return your response in below json format:</span></span>
<span id="A3.T12.pic1.2.2.1.12" class="ltx_p"><span id="A3.T12.pic1.2.2.1.12.1" class="ltx_text ltx_font_typewriter" style="--ltx-fg-color:#000000;">{&quot;relevance&quot;: X, &quot;coherence&quot;: X, &quot;fluency&quot;: X, &quot;consistency&quot;: X, &quot;overall&quot;: X}</span></span>
<span id="A3.T12.pic1.2.2.1.13" class="ltx_p"><span id="A3.T12.pic1.2.2.1.13.1" class="ltx_text" style="--ltx-fg-color:#000000;">Please provide only a single number as your response (“{min}” -“{max}”). Do not include any explanation or additional text.</span></span>
</span></span>
</span></span></span></foreignobject></g></g></svg>