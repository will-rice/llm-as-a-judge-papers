<svg id="A4.pic1.p4.pic1" class="ltx_picture" color="#000000" height="438.6" overflow="visible" version="1.1" viewbox="0 0 612.4 438.6" width="612.4"><g style="--ltx-stroke-color:#000000;--ltx-fill-color:#000000;" fill="#000000" stroke="#000000" stroke-width="0.4pt" transform="translate(0,438.6) matrix(1 0 0 -1 0 0)"><g style="--ltx-fill-color:#B3B336;" fill="#B3B336" fill-opacity="1.0"><path style="stroke:none" d="M 0 7.61 L 0 430.99 C 0 435.19 3.41 438.6 7.61 438.6 L 604.79 438.6 C 608.99 438.6 612.4 435.19 612.4 430.99 L 612.4 7.61 C 612.4 3.41 608.99 0 604.79 0 L 7.61 0 C 3.41 0 0 3.41 0 7.61 Z" /></g><g style="--ltx-fill-color:#FFFFE6;" fill="#FFFFE6" fill-opacity="1.0"><path style="stroke:none" d="M 0.69 7.61 L 0.69 430.99 C 0.69 434.81 3.79 437.91 7.61 437.91 L 604.79 437.91 C 608.61 437.91 611.7 434.81 611.7 430.99 L 611.7 7.61 C 611.7 3.79 608.61 0.69 604.79 0.69 L 7.61 0.69 C 3.79 0.69 0.69 3.79 0.69 7.61 Z" /></g><g fill-opacity="1.0" transform="matrix(1.0 0.0 0.0 1.0 20.38 15.19)"><foreignobject style="--ltx-fo-width:41.31em;--ltx-fo-height:29.7em;--ltx-fo-depth:0.19em;font-size:10pt;" height="413.6" overflow="visible" transform="matrix(1 0 0 -1 0 410.91)" width="571.61"><span class="ltx_foreignobject_container"><span class="ltx_foreignobject_content"><span id="A4.pic1.p4.pic1.1" class="ltx_inline-logical-block ltx_minipage ltx_align_bottom" style="width:41.31em;">
<span id="A4.pic1.p4.pic1.p1" class="ltx_para ltx_noindent">
<span id="A4.pic1.p4.pic1.p1.1" class="ltx_p"><span id="A4.pic1.p4.pic1.p1.1.1" class="ltx_text ltx_font_bold">Response B:</span> 
<br class="ltx_break">To find the length of the shadow cast by a building when the sun’s elevation angle (or altitude) is given, you can use trigonometry. Specifically, you can use the tangent function because it relates the angle of elevation to the ratio of the opposite side (the height of the building) to the adjacent side (the length of the shadow).</span>
</span>
<span id="A4.pic1.p4.pic1.p2" class="ltx_para">
<span id="A4.pic1.p4.pic1.p2.1" class="ltx_p"><span id="A4.pic1.p4.pic1.p2.1.1" class="ltx_text ltx_font_bold">Given:</span></span>
<span id="A4.I8" class="ltx_itemize">
<span id="A4.I8.i1" class="ltx_item" style="list-style-type:none;"><span class="ltx_tag ltx_tag_item"><span id="A4.I8.i1.1" class="ltx_text" style="--ltx-fg-color:#000000;">•</span></span> 
<span id="A4.I8.i1.p1" class="ltx_para">
<span id="A4.I8.i1.p1.1" class="ltx_p">The building’s height (opposite side in the right triangle): ( <span id="A4.I8.i1.p1.1.1" class="ltx_text ltx_font_typewriter">h = 60</span> ) meters</span>
</span></span>
<span id="A4.I8.i2" class="ltx_item" style="list-style-type:none;"><span class="ltx_tag ltx_tag_item"><span id="A4.I8.i2.1" class="ltx_text" style="--ltx-fg-color:#000000;">•</span></span> 
<span id="A4.I8.i2.p1" class="ltx_para">
<span id="A4.I8.i2.p1.1" class="ltx_p">The angle of elevation of the sun: ( <code id="A4.I8.i2.p1.1.1" class="ltx_verbatim ltx_font_typewriter">\theta = 22^\circ</code> )</span>
</span></span>
<span id="A4.I8.i3" class="ltx_item" style="list-style-type:none;"><span class="ltx_tag ltx_tag_item"><span id="A4.I8.i3.1" class="ltx_text" style="--ltx-fg-color:#000000;">•</span></span> 
<span id="A4.I8.i3.p1" class="ltx_para">
<span id="A4.I8.i3.p1.1" class="ltx_p">We are looking for the length of the shadow (adjacent side in the right triangle): ( <span id="A4.I8.i3.p1.1.1" class="ltx_text ltx_font_typewriter">s</span> )</span>
</span></span>
</span>
<span id="A4.pic1.p4.pic1.p2.2" class="ltx_p">The relationship between the angle of elevation, the height of the building, and the length of the shadow is given by the tangent function:</span>
<span id="A4.pic1.p4.pic1.p2.3" class="ltx_p"><code id="A4.pic1.p4.pic1.p2.3.1" class="ltx_verbatim ltx_font_typewriter">\tan(\theta) = \frac{\text{opposite}}{\text{adjacent}} = \frac{h}{s}</code></span>
<span id="A4.pic1.p4.pic1.p2.4" class="ltx_p">Rearranging the equation to solve for the length of the shadow (s):</span>
<span id="A4.pic1.p4.pic1.p2.5" class="ltx_p"><code id="A4.pic1.p4.pic1.p2.5.1" class="ltx_verbatim ltx_font_typewriter">s = \frac{h}{\tan(\theta)}</code></span>
<span id="A4.pic1.p4.pic1.p2.6" class="ltx_p">Now, plug in the given values:</span>
<span id="A4.pic1.p4.pic1.p2.7" class="ltx_p"><code id="A4.pic1.p4.pic1.p2.7.1" class="ltx_verbatim ltx_font_typewriter">s = \frac{60}{\tan(22^\circ)}</code></span>
<span id="A4.pic1.p4.pic1.p2.8" class="ltx_p">Using a calculator to find the tangent of ( <code id="A4.pic1.p4.pic1.p2.8.1" class="ltx_verbatim ltx_font_typewriter">22^\circ</code> ) and then solving for (s):</span>
<span id="A4.pic1.p4.pic1.p2.9" class="ltx_p"><code id="A4.pic1.p4.pic1.p2.9.1" class="ltx_verbatim ltx_font_typewriter">s = \frac{60}{0.4040} \approx 148.51</code></span>
<span id="A4.pic1.p4.pic1.p2.10" class="ltx_p">Therefore, the length of the shadow cast by the building when the sun is 22 degrees above the horizon is approximately 148.51 meters.</span>
</span></span></span></span></foreignobject></g></g></svg>