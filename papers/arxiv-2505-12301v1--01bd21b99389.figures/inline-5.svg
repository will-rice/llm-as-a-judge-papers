<span id="A1.p7.pic1.1.1" class="ltx_p"><span id="A1.p7.pic1.1.1.1" class="ltx_text" style="--ltx-fg-color:#FFFFFF;">Prompts Used for MT-Bench</span></span>
</span></span></span></foreignobject></g><g fill-opacity="1.0" transform="matrix(1.0 0.0 0.0 1.0 21.65 13.78)"><foreignobject style="--ltx-fo-width:31.37em;--ltx-fo-height:33.09em;--ltx-fo-depth:0em;font-size:10pt;" height="457.93" overflow="visible" transform="matrix(1 0 0 -1 0 457.93)" width="434.07"><span class="ltx_foreignobject_container"><span class="ltx_foreignobject_content">
<span id="A1.p7.pic1.2" class="ltx_inline-block ltx_minipage ltx_align_bottom" style="width:31.37em;">
<span id="A1.p7.pic1.2.1" class="ltx_p"><span id="A1.p7.pic1.2.1.1" class="ltx_text" style="--ltx-fg-color:#000000;">Human: For this task, you will be shown two conversations between a user and an AI assistant, labeled A and B. Your goal is to evaluate which response (A or B) better follows the user’s instructions and more helpfully answers their question.
<br class="ltx_break"></span></span>
<span id="A1.p7.pic1.2.2" class="ltx_p"><span id="A1.p7.pic1.2.2.1" class="ltx_text" style="--ltx-fg-color:#000000;">&lt;PrefJudgment&gt; 
<br class="ltx_break">&lt;Conversation A&gt; 
<br class="ltx_break">{conversation_a} 
<br class="ltx_break">&lt;/Conversation A&gt;
<br class="ltx_break"></span></span>
<span id="A1.p7.pic1.2.3" class="ltx_p"><span id="A1.p7.pic1.2.3.1" class="ltx_text" style="--ltx-fg-color:#000000;">&lt;Conversation B&gt; 
<br class="ltx_break">{conversation_b} 
<br class="ltx_break">&lt;/Conversation B&gt;
<br class="ltx_break"></span></span>
<span id="A1.p7.pic1.2.4" class="ltx_p"><span id="A1.p7.pic1.2.4.1" class="ltx_text" style="--ltx-fg-color:#000000;">&lt;Instructions&gt;
<br class="ltx_break">Evaluate the two conversations and choose one of the following:
<br class="ltx_break">a: If Conversation A’s AI assistant better follows the user’s instructions and answers their question
<br class="ltx_break">b: If Conversation B’s AI assistant better follows the user’s instructions and answers their question
<br class="ltx_break">tie: If both AI assistants are equally good/poor in following instructions and answering the user’s question
<br class="ltx_break"></span></span>
<span id="A1.p7.pic1.2.5" class="ltx_p"><span id="A1.p7.pic1.2.5.1" class="ltx_text" style="--ltx-fg-color:#000000;">Consider factors like helpfulness, relevance, accuracy, depth, creativity, and appropriate level of detail when making your evaluation. Do not show positional bias towards A or B. Response length should not unduly influence your decision.
<br class="ltx_break">Make a selection from &quot;a&quot;, &quot;b&quot;, &quot;tie&quot;. Only write the answer with a single word, do not write reasons.
<br class="ltx_break">&lt;/Instructions&gt;
<br class="ltx_break">&lt;/PrefJudgment&gt; 
<br class="ltx_break"></span></span>
<span id="A1.p7.pic1.2.6" class="ltx_p"><span id="A1.p7.pic1.2.6.1" class="ltx_text" style="--ltx-fg-color:#000000;">Assistant:</span></span>
</span></span></span></foreignobject></g></g></svg>