<svg id="A6.SS3.p14.pic1" class="ltx_picture" height="286.46" overflow="visible" version="1.1" viewbox="0 0 477.38 286.46" width="477.38"><g style="--ltx-stroke-color:#000000;--ltx-fill-color:#000000;" fill="#000000" stroke="#000000" stroke-width="0.4pt" transform="translate(0,286.46) matrix(1 0 0 -1 0 0)"><g style="--ltx-fill-color:#FFFFFF;" fill="#FFFFFF" fill-opacity="1.0"><path style="stroke:none" d="M 0 0 L 0 286.46 L 477.38 286.46 L 477.38 0 Z" /></g><g style="--ltx-fill-color:#F2F2F2;" fill="#F2F2F2" fill-opacity="1.0"><path style="stroke:none" d="M 1.97 1.97 L 1.97 284.5 L 475.41 284.5 L 475.41 1.97 Z" /></g><g fill-opacity="1.0" transform="matrix(1.0 0.0 0.0 1.0 21.65 15.93)"><foreignobject style="--ltx-fo-width:36.91em;--ltx-fo-height:18.56em;--ltx-fo-depth:0.16em;font-size:10pt;" height="258.91" overflow="visible" transform="matrix(1 0 0 -1 0 256.76)" width="510.73"><span class="ltx_foreignobject_container"><span class="ltx_foreignobject_content">
<span id="A6.SS3.p14.pic1.1" class="ltx_inline-block ltx_minipage ltx_align_bottom" style="width:36.91em;">
<span id="A6.SS3.p14.pic1.1.1" class="ltx_p"><span id="A6.SS3.p14.pic1.1.1.1" class="ltx_text ltx_font_sansserif" style="font-size:80%;--ltx-fg-color:#000000;">Convolution is correlation with the filter rotated 180 degrees. This makes no difference, if the filter is symmetric, like a Gaussian, or a Laplacian. But it makes a whole lot of difference, when the filter is not symmetric, like a derivative. The reason we need convolution is that it is associative, while correlation, in general, is not. To see why this is true, remember that convolution is multiplication in the frequency domain, which is obviously associative. On the other hand, correlation in the frequency domain is multiplication by the complex conjugate, which is not associative. The associativity of convolution is what allows you to &quot;pre-convolve&quot; the filters, so that you only need to convolve the image with a single filter. For example, let’s say you have an image <math id="A6.SS3.p14.pic1.m1" class="ltx_Math" alttext="f" display="inline" intent=":literal"><semantics><mi style="--ltx-fg-color:#000000;" mathcolor="#000000">f</mi><annotation encoding="application/x-tex">f</annotation></semantics></math>, which you need to convolve with <math id="A6.SS3.p14.pic1.m2" class="ltx_Math" alttext="g" display="inline" intent=":literal"><semantics><mi style="--ltx-fg-color:#000000;" mathcolor="#000000">g</mi><annotation encoding="application/x-tex">g</annotation></semantics></math> and then with <math id="A6.SS3.p14.pic1.m3" class="ltx_Math" alttext="h" display="inline" intent=":literal"><semantics><mi style="--ltx-fg-color:#000000;" mathcolor="#000000">h</mi><annotation encoding="application/x-tex">h</annotation></semantics></math>. <math id="A6.SS3.p14.pic1.m4" class="ltx_Math" alttext="f*g*h=f*(g*h)" display="inline" intent=":literal"><semantics><mrow><mrow><mi style="--ltx-fg-color:#000000;" mathcolor="#000000">f</mi><mo style="--ltx-fg-color:#000000;" lspace="0.222em" mathcolor="#000000" rspace="0.222em">∗</mo><mi style="--ltx-fg-color:#000000;" mathcolor="#000000">g</mi><mo style="--ltx-fg-color:#000000;" lspace="0.222em" mathcolor="#000000" rspace="0.222em">∗</mo><mi style="--ltx-fg-color:#000000;" mathcolor="#000000">h</mi></mrow><mo style="--ltx-fg-color:#000000;" mathcolor="#000000">=</mo><mrow><mi style="--ltx-fg-color:#000000;" mathcolor="#000000">f</mi><mo style="--ltx-fg-color:#000000;" lspace="0.222em" mathcolor="#000000" rspace="0.222em">∗</mo><mrow><mo style="--ltx-fg-color:#000000;" mathcolor="#000000" stretchy="false">(</mo><mrow><mi style="--ltx-fg-color:#000000;" mathcolor="#000000">g</mi><mo style="--ltx-fg-color:#000000;" lspace="0.222em" mathcolor="#000000" rspace="0.222em">∗</mo><mi style="--ltx-fg-color:#000000;" mathcolor="#000000">h</mi></mrow><mo style="--ltx-fg-color:#000000;" mathcolor="#000000" stretchy="false">)</mo></mrow></mrow></mrow><annotation encoding="application/x-tex">f*g*h=f*(g*h)</annotation></semantics></math>. That means you can convolve <math id="A6.SS3.p14.pic1.m5" class="ltx_Math" alttext="g" display="inline" intent=":literal"><semantics><mi style="--ltx-fg-color:#000000;" mathcolor="#000000">g</mi><annotation encoding="application/x-tex">g</annotation></semantics></math> and <math id="A6.SS3.p14.pic1.m6" class="ltx_Math" alttext="h" display="inline" intent=":literal"><semantics><mi style="--ltx-fg-color:#000000;" mathcolor="#000000">h</mi><annotation encoding="application/x-tex">h</annotation></semantics></math> first into a single filter, and then convolve <math id="A6.SS3.p14.pic1.m7" class="ltx_Math" alttext="f" display="inline" intent=":literal"><semantics><mi style="--ltx-fg-color:#000000;" mathcolor="#000000">f</mi><annotation encoding="application/x-tex">f</annotation></semantics></math> with it. This is useful, if you need to convolve many images with <math id="A6.SS3.p14.pic1.m8" class="ltx_Math" alttext="g" display="inline" intent=":literal"><semantics><mi style="--ltx-fg-color:#000000;" mathcolor="#000000">g</mi><annotation encoding="application/x-tex">g</annotation></semantics></math> and <math id="A6.SS3.p14.pic1.m9" class="ltx_Math" alttext="h" display="inline" intent=":literal"><semantics><mi style="--ltx-fg-color:#000000;" mathcolor="#000000">h</mi><annotation encoding="application/x-tex">h</annotation></semantics></math>. You can pre-compute <math id="A6.SS3.p14.pic1.m10" class="ltx_Math" alttext="k=g*h" display="inline" intent=":literal"><semantics><mrow><mi style="--ltx-fg-color:#000000;" mathcolor="#000000">k</mi><mo style="--ltx-fg-color:#000000;" mathcolor="#000000">=</mo><mrow><mi style="--ltx-fg-color:#000000;" mathcolor="#000000">g</mi><mo style="--ltx-fg-color:#000000;" lspace="0.222em" mathcolor="#000000" rspace="0.222em">∗</mo><mi style="--ltx-fg-color:#000000;" mathcolor="#000000">h</mi></mrow></mrow><annotation encoding="application/x-tex">k=g*h</annotation></semantics></math>, and then reuse <math id="A6.SS3.p14.pic1.m11" class="ltx_Math" alttext="k" display="inline" intent=":literal"><semantics><mi style="--ltx-fg-color:#000000;" mathcolor="#000000">k</mi><annotation encoding="application/x-tex">k</annotation></semantics></math> multple times. So if you are doing template matching, i. e. looking for a single template, correlation is sufficient. But if you need to use multiple filters in succession, and you need to perform this operation on multiple images, it makes sense to convolve the multiple filters into a single filter ahead of time.</span></span>
</span></span></span></foreignobject></g></g></svg>