<span id="S4.SS2.SSS0.Px1.p4.pic1.p1" class="ltx_para ltx_noindent">
<span id="S4.SS2.SSS0.Px1.p4.pic1.p1.1" class="ltx_p"><span id="S4.SS2.SSS0.Px1.p4.pic1.p1.1.1" class="ltx_text ltx_font_bold" style="--ltx-fg-color:#000000;">Key finding: </span><span id="S4.SS2.SSS0.Px1.p4.pic1.p1.1.2" class="ltx_text" style="--ltx-fg-color:#000000;">
Across all tasks, prompt biases act as a </span><em id="S4.SS2.SSS0.Px1.p4.pic1.p1.1.3" class="ltx_emph ltx_font_italic" style="--ltx-fg-color:#000000;">positional prior</em><span id="S4.SS2.SSS0.Px1.p4.pic1.p1.1.4" class="ltx_text" style="--ltx-fg-color:#000000;">: </span><span id="S4.SS2.SSS0.Px1.p4.pic1.p1.1.5" class="ltx_text ltx_font_bold" style="--ltx-fg-color:#000000;">CoT/Authority/Refined/Sentiment</span><span id="S4.SS2.SSS0.Px1.p4.pic1.p1.1.6" class="ltx_text" style="--ltx-fg-color:#000000;"> strongly pushes the judge to choose </span><span id="S4.SS2.SSS0.Px1.p4.pic1.p1.1.7" class="ltx_text ltx_font_bold" style="--ltx-fg-color:#000000;">A</span><span id="S4.SS2.SSS0.Px1.p4.pic1.p1.1.8" class="ltx_text" style="--ltx-fg-color:#000000;"> (near-ceiling on A-correct but near-floor on B-correct), while </span><span id="S4.SS2.SSS0.Px1.p4.pic1.p1.1.9" class="ltx_text ltx_font_bold" style="--ltx-fg-color:#000000;">Verbosity</span><span id="S4.SS2.SSS0.Px1.p4.pic1.p1.1.10" class="ltx_text" style="--ltx-fg-color:#000000;"> consistently pushes toward </span><span id="S4.SS2.SSS0.Px1.p4.pic1.p1.1.11" class="ltx_text ltx_font_bold" style="--ltx-fg-color:#000000;">B</span><span id="S4.SS2.SSS0.Px1.p4.pic1.p1.1.12" class="ltx_text" style="--ltx-fg-color:#000000;">.
These patterns are consistent across Qwen3-4B and Qwen2.5-Coder-3B, and the effect size grows with task fragility (TestGen </span><math id="S4.SS2.SSS0.Px1.p4.pic1.p1.m1" class="ltx_Math" alttext="&gt;" display="inline" intent=":literal"><semantics><mo style="--ltx-fg-color:#000000;" mathcolor="#000000">&gt;</mo><annotation encoding="application/x-tex">&gt;</annotation></semantics></math><span id="S4.SS2.SSS0.Px1.p4.pic1.p1.1.13" class="ltx_text" style="--ltx-fg-color:#000000;"> CodeGen </span><math id="S4.SS2.SSS0.Px1.p4.pic1.p1.m2" class="ltx_Math" alttext="&gt;" display="inline" intent=":literal"><semantics><mo style="--ltx-fg-color:#000000;" mathcolor="#000000">&gt;</mo><annotation encoding="application/x-tex">&gt;</annotation></semantics></math><span id="S4.SS2.SSS0.Px1.p4.pic1.p1.1.14" class="ltx_text" style="--ltx-fg-color:#000000;"> CodeRepair).</span></span>
</span></span></span></span></foreignobject></g></g></svg>