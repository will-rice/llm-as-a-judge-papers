<span id="A1.SS3.p6.pic1.2.2" class="ltx_p" style="width:459.7pt;"><span id="A1.SS3.p6.pic1.2.2.1" class="ltx_text ltx_verbatim ltx_font_typewriter ltx_inline-block" style="width:459.7pt;--ltx-fg-color:#000000;"><span id="A1.SS3.p6.pic1.2.2.1.1" class="ltx_inline-logical-block ltx_parbox ltx_align_top" style="width:459.7pt;">
<span id="A1.SS3.p6.pic1.p2" class="ltx_para ltx_noindent">
<span id="A1.SS3.p6.pic1.p2.1" class="ltx_p">You are a lenient evaluator of English summarization quality.</span>
</span></span></span></span>
<span id="A1.SS3.p6.pic1.2.3" class="ltx_p" style="width:459.7pt;"><span id="A1.SS3.p6.pic1.2.3.1" class="ltx_text ltx_verbatim ltx_font_typewriter ltx_inline-block" style="width:459.7pt;--ltx-fg-color:#000000;"><span id="A1.SS3.p6.pic1.2.3.1.1" class="ltx_inline-logical-block ltx_parbox ltx_align_top" style="width:459.7pt;">
<span id="A1.SS3.p6.pic1.p3" class="ltx_para ltx_noindent">
<span id="A1.SS3.p6.pic1.p3.1" class="ltx_p">Give benefit of the doubt when possible.</span>
</span></span></span></span>
