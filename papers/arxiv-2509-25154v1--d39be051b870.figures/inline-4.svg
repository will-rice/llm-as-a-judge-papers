</span></span></span></foreignobject></g><g fill-opacity="1.0" transform="matrix(1.0 0.0 0.0 1.0 21.65 16.55)"><foreignobject style="--ltx-fo-width:48.45em;--ltx-fo-height:27.78em;--ltx-fo-depth:0.2em;font-size:10pt;" height="387.1" overflow="visible" transform="matrix(1 0 0 -1 0 384.33)" width="670.41"><span class="ltx_foreignobject_container"><span class="ltx_foreignobject_content">
<span id="A2.SS2.SSS0.Px3.p4.pic1.2" class="ltx_inline-block ltx_minipage ltx_align_bottom" style="width:48.45em;">
<span id="A2.SS2.SSS0.Px3.p4.pic1.2.1" class="ltx_p"><span id="A2.SS2.SSS0.Px3.p4.pic1.2.1.1" class="ltx_text ltx_font_typewriter" style="font-size:90%;--ltx-fg-color:#000000;">Given a prompt and three responses, follow the rubric to assess relevance and rank the responses.
</span></span>
<span id="A2.SS2.SSS0.Px3.p4.pic1.2.2" class="ltx_p"><span id="A2.SS2.SSS0.Px3.p4.pic1.2.2.1" class="ltx_text ltx_font_typewriter" style="font-size:90%;--ltx-fg-color:#000000;">## Rubric (per-response relevance score in [1, 4]): <span id="A2.SS2.SSS0.Px3.p4.pic1.2.2.1.1" class="ltx_text ltx_font_bold">4</span>: Reasonable and convincing; on par with or better than a likely correct answer. <span id="A2.SS2.SSS0.Px3.p4.pic1.2.2.1.2" class="ltx_text ltx_font_bold">3</span>: Possibly an answer, but not sufficiently convincing; a better-quality answer likely exists. <span id="A2.SS2.SSS0.Px3.p4.pic1.2.2.1.3" class="ltx_text ltx_font_bold">2</span>: Not an acceptable answer; unreasonable or does not address the question, but still on-topic. <span id="A2.SS2.SSS0.Px3.p4.pic1.2.2.1.4" class="ltx_text ltx_font_bold">1</span>: Completely out of context or nonsensical.
</span></span>
<span id="A2.SS2.SSS0.Px3.p4.pic1.2.3" class="ltx_p"><span id="A2.SS2.SSS0.Px3.p4.pic1.2.3.1" class="ltx_text ltx_font_typewriter" style="font-size:90%;--ltx-fg-color:#000000;">## Prompt: [QUERY]
</span></span>
<span id="A2.SS2.SSS0.Px3.p4.pic1.2.4" class="ltx_p"><span id="A2.SS2.SSS0.Px3.p4.pic1.2.4.1" class="ltx_text ltx_font_typewriter" style="font-size:90%;--ltx-fg-color:#000000;">## Response 1: [RESPONSE_1]
</span></span>
<span id="A2.SS2.SSS0.Px3.p4.pic1.2.5" class="ltx_p"><span id="A2.SS2.SSS0.Px3.p4.pic1.2.5.1" class="ltx_text ltx_font_typewriter" style="font-size:90%;--ltx-fg-color:#000000;">## Response 2: [RESPONSE_2]
</span></span>
<span id="A2.SS2.SSS0.Px3.p4.pic1.2.6" class="ltx_p"><span id="A2.SS2.SSS0.Px3.p4.pic1.2.6.1" class="ltx_text ltx_font_typewriter" style="font-size:90%;--ltx-fg-color:#000000;">## Response 3: [RESPONSE_3]
</span></span>
<span id="A2.SS2.SSS0.Px3.p4.pic1.2.7" class="ltx_p"><span id="A2.SS2.SSS0.Px3.p4.pic1.2.7.1" class="ltx_text ltx_font_typewriter" style="font-size:90%;--ltx-fg-color:#000000;">Please output a valid JSON object using the following schema:

   &quot;Rationale&quot;: &lt;explanation for your judgment and ranking&gt;,    &quot;Response1 Score&quot;: &lt;1--4&gt;,    &quot;Response2 Score&quot;: &lt;1--4&gt;,    &quot;Response3 Score&quot;: &lt;1--4&gt;,    &quot;Ranking&quot;: &lt;list of indices indicating best<math id="A2.SS2.SSS0.Px3.p4.pic1.m1" class="ltx_Math" alttext="\rightarrow" display="inline" intent=":literal"><semantics><mo style="--ltx-fg-color:#000000;" mathcolor="#000000" stretchy="false">→</mo><annotation encoding="application/x-tex">\rightarrow</annotation></semantics></math>worst, e.g., [0,1,2]&gt;
</span></span>
<span id="A2.SS2.SSS0.Px3.p4.pic1.2.8" class="ltx_p"><span id="A2.SS2.SSS0.Px3.p4.pic1.2.8.1" class="ltx_text ltx_font_typewriter" style="font-size:90%;--ltx-fg-color:#000000;">Formatted the abovementioned schema and produce the judgment JSON now.
</span></span>
</span></span></span></foreignobject></g></g></svg>