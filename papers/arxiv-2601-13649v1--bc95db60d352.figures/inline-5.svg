<span id="A8.p2.pic1.2" class="ltx_inline-block ltx_minipage ltx_align_bottom" style="width:44.83em;">
<span id="A8.p2.pic1.2.1" class="ltx_p"><span id="A8.p2.pic1.2.1.1" class="ltx_text ltx_font_bold" style="--ltx-fg-color:#000000;">[System]
<br class="ltx_break"><span id="A8.p2.pic1.2.1.1.1" class="ltx_text ltx_font_medium">You are a helpful assistant.
The user will provide a multiple choice question, 4 answer choices and the correct answer.
Your task is to judge whether there is a reasonably high chance for a sufficiently intelligent being
to output the exact correct answer among the four choices, even if the choices are not given.
Questions that fail to meet this requirement may include:</span></span></span>
<span id="A8.p2.pic1.2.2" class="ltx_p"><span id="A8.p2.pic1.2.2.1" class="ltx_text" style="--ltx-fg-color:#000000;">- Questions that contain ’Which of the following…’ or similar phrasing. This makes it impossible to hit the correct answer without seeing the choices. For example, ’Which of the following has a red color?’ A: apple. B:…</span></span>
<span id="A8.p2.pic1.2.3" class="ltx_p"><span id="A8.p2.pic1.2.3.1" class="ltx_text" style="--ltx-fg-color:#000000;">- Questions that are open-ended to an extent that the correct answer cannot be hit with a reasonable chance without seeing the choices. For example, Shakespeare has the motto ___. A: To thine own self be true. B:…</span></span>
<span id="A8.p2.pic1.2.4" class="ltx_p"><span id="A8.p2.pic1.2.4.1" class="ltx_text" style="--ltx-fg-color:#000000;">Please note that if a question has a fixed answer but with multiple possible phrasings, it is still valid. For example, What was the most important finding by the House of Lords in the Pinochet case? A: The Pinochet case confirmed that all public acts enjoy immunity. B:…</span></span>
<span id="A8.p2.pic1.2.5" class="ltx_p"><span id="A8.p2.pic1.2.5.1" class="ltx_text" style="--ltx-fg-color:#000000;">Your output should only contain either ’VALID’ or ’INVALID’, without any additional explanation.</span></span>
<span id="A8.p2.pic1.2.6" class="ltx_p"><span id="A8.p2.pic1.2.6.1" class="ltx_text ltx_font_bold" style="--ltx-fg-color:#000000;">[User]<span id="A8.p2.pic1.2.6.1.1" class="ltx_text"></span></span></span>
<span id="A8.p2.pic1.2.7" class="ltx_p"><span id="A8.p2.pic1.2.7.1" class="ltx_text" style="--ltx-fg-color:#000000;">Question: [question]</span></span>
<span id="A8.p2.pic1.2.8" class="ltx_p"><span id="A8.p2.pic1.2.8.1" class="ltx_text" style="--ltx-fg-color:#000000;">Answer1: [answer1]</span></span>
<span id="A8.p2.pic1.2.9" class="ltx_p"><span id="A8.p2.pic1.2.9.1" class="ltx_text" style="--ltx-fg-color:#000000;">Answer2: [answer2]</span></span>
<span id="A8.p2.pic1.2.10" class="ltx_p"><span id="A8.p2.pic1.2.10.1" class="ltx_text" style="--ltx-fg-color:#000000;">Answer3: [answer3]</span></span>
<span id="A8.p2.pic1.2.11" class="ltx_p"><span id="A8.p2.pic1.2.11.1" class="ltx_text" style="--ltx-fg-color:#000000;">Answer4: [answer4]</span></span>
<span id="A8.p2.pic1.2.12" class="ltx_p"><span id="A8.p2.pic1.2.12.1" class="ltx_text" style="--ltx-fg-color:#000000;">Correct answer: [correct answer]</span></span>
