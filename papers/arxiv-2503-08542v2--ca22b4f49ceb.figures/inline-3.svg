<span id="A6.F9.pic1.2.1" class="ltx_p"><span id="A6.F9.pic1.2.1.1" class="ltx_text" style="--ltx-fg-color:#000000;">You are a helpful assistant acting as an impartial judge. You will be given a Question and a Proposed Answer. Your task is to judge whether the Proposed Answer is correct by comparing it to the Reference Answer. If the Proposed Answer is correct, choose ’True’, otherwise, choose ’False’. Provide a brief explanation for your decision. 
<br class="ltx_break"></span></span>
<span id="A6.F9.pic1.2.2" class="ltx_p"><span id="A6.F9.pic1.2.2.1" class="ltx_text" style="--ltx-fg-color:#000000;">Question: Which comic book was also written by the writer of Crossed? 
<br class="ltx_break"></span></span>
<span id="A6.F9.pic1.2.3" class="ltx_p"><span id="A6.F9.pic1.2.3.1" class="ltx_text" style="--ltx-fg-color:#000000;">Provided Answer: Crossed was written by Garth Ennis. The Boys is a comic book series also written by Garth Ennis. So the comic book that was also written by the writer of Crossed is The Boys. 
<br class="ltx_break"></span></span>
<span id="A6.F9.pic1.2.4" class="ltx_p"><span id="A6.F9.pic1.2.4.1" class="ltx_text" style="--ltx-fg-color:#000000;">Reference Answer: the Vertigo series “Preacher” 
<br class="ltx_break"></span></span>
<span id="A6.F9.pic1.2.5" class="ltx_p"><span id="A6.F9.pic1.2.5.1" class="ltx_text" style="--ltx-fg-color:#000000;">Evaluation: 
<br class="ltx_break"></span></span>
<span id="A6.F9.pic1.2.6" class="ltx_p"><span id="A6.F9.pic1.2.6.1" class="ltx_text" style="--ltx-fg-color:#000000;">Provide your response in the following format: 
<br class="ltx_break">Decision: [True/False] 
<br class="ltx_break">Explanation: [Your brief explanation] 
<br class="ltx_break"></span></span>
</span></span></span></foreignobject></g></g></svg>