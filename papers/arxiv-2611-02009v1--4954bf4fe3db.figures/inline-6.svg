<span id="A3.SS1.p2.pic1.1" class="ltx_inline-block ltx_minipage ltx_align_bottom" style="width:39.77em;">
<span id="A3.SS1.p2.pic1.1.1" class="ltx_p"><span id="A3.SS1.p2.pic1.1.1.1" class="ltx_text ltx_font_bold" style="--ltx-fg-color:#FFFFFF;">Prompt for Translation Self-Refinement</span></span>
</span></span></span></foreignobject></g><g fill-opacity="1.0" transform="matrix(1.0 0.0 0.0 1.0 10.16 13.24)"><foreignobject style="--ltx-fo-width:43.55em;--ltx-fo-height:33.01em;--ltx-fo-depth:0.22em;font-size:10pt;" height="459.86" overflow="visible" transform="matrix(1 0 0 -1 0 456.78)" width="602.61"><span class="ltx_foreignobject_container"><span class="ltx_foreignobject_content">
<span id="A3.SS1.p2.pic1.2" class="ltx_inline-block ltx_minipage ltx_align_bottom" style="width:43.55em;">
<span id="A3.SS1.p2.pic1.2.1" class="ltx_p"><span id="A3.SS1.p2.pic1.2.1.1" class="ltx_text ltx_font_typewriter" style="--ltx-fg-color:#000000;">You are an expert in social media translation. Please revise the
initial English translation according to the source text, the
available context, and the evaluation feedback.
</span></span>
<span id="A3.SS1.p2.pic1.2.2" class="ltx_p"><span id="A3.SS1.p2.pic1.2.2.1" class="ltx_text ltx_font_typewriter" style="--ltx-fg-color:#000000;">The revised translation should preserve the original meaning,
cultural references, emotional tone, and intended pragmatic effect.
It should also be natural and understandable to English-speaking
social media users.
</span></span>
<span id="A3.SS1.p2.pic1.2.3" class="ltx_p"><span id="A3.SS1.p2.pic1.2.3.1" class="ltx_text ltx_font_typewriter" style="--ltx-fg-color:#000000;">Follow these requirements:
</span></span>
<span id="A3.SS1.p2.pic1.2.4" class="ltx_p"><span id="A3.SS1.p2.pic1.2.4.1" class="ltx_text ltx_font_typewriter" style="--ltx-fg-color:#000000;">1. Carefully address the translation problems identified in the
evaluation feedback.
</span></span>
<span id="A3.SS1.p2.pic1.2.5" class="ltx_p"><span id="A3.SS1.p2.pic1.2.5.1" class="ltx_text ltx_font_typewriter" style="--ltx-fg-color:#000000;">2. Do not change parts of the translation that are already correct
unless doing so improves consistency or fluency.
</span></span>
<span id="A3.SS1.p2.pic1.2.6" class="ltx_p"><span id="A3.SS1.p2.pic1.2.6.1" class="ltx_text ltx_font_typewriter" style="--ltx-fg-color:#000000;">3. Placeholders in the form ‘‘#placeholder-x#’’ must not be
translated. Preserve each placeholder at the corresponding position.
</span></span>
<span id="A3.SS1.p2.pic1.2.7" class="ltx_p"><span id="A3.SS1.p2.pic1.2.7.1" class="ltx_text ltx_font_typewriter" style="--ltx-fg-color:#000000;">4. Preserve structural tags such as
&lt;title&gt;&lt;/title&gt;,
&lt;content&gt;&lt;/content&gt;, and
&lt;comment&gt;&lt;/comment&gt;.
</span></span>
<span id="A3.SS1.p2.pic1.2.8" class="ltx_p"><span id="A3.SS1.p2.pic1.2.8.1" class="ltx_text ltx_font_typewriter" style="--ltx-fg-color:#000000;">5. Output only the revised translation. Do not explain your revisions
or provide any additional content.
</span></span>
<span id="A3.SS1.p2.pic1.2.9" class="ltx_p"><span id="A3.SS1.p2.pic1.2.9.1" class="ltx_text ltx_font_typewriter" style="--ltx-fg-color:#000000;">Context:
</span></span>
<span id="A3.SS1.p2.pic1.2.10" class="ltx_p"><span id="A3.SS1.p2.pic1.2.10.1" class="ltx_text ltx_font_typewriter" style="--ltx-fg-color:#000000;">{context}
</span></span>
<span id="A3.SS1.p2.pic1.2.11" class="ltx_p"><span id="A3.SS1.p2.pic1.2.11.1" class="ltx_text ltx_font_typewriter" style="--ltx-fg-color:#000000;">Source text:
</span></span>
<span id="A3.SS1.p2.pic1.2.12" class="ltx_p"><span id="A3.SS1.p2.pic1.2.12.1" class="ltx_text ltx_font_typewriter" style="--ltx-fg-color:#000000;">{source}
</span></span>
<span id="A3.SS1.p2.pic1.2.13" class="ltx_p"><span id="A3.SS1.p2.pic1.2.13.1" class="ltx_text ltx_font_typewriter" style="--ltx-fg-color:#000000;">Initial translation:
</span></span>
<span id="A3.SS1.p2.pic1.2.14" class="ltx_p"><span id="A3.SS1.p2.pic1.2.14.1" class="ltx_text ltx_font_typewriter" style="--ltx-fg-color:#000000;">{translation}
</span></span>
<span id="A3.SS1.p2.pic1.2.15" class="ltx_p"><span id="A3.SS1.p2.pic1.2.15.1" class="ltx_text ltx_font_typewriter" style="--ltx-fg-color:#000000;">Judger feedback:
</span></span>
<span id="A3.SS1.p2.pic1.2.16" class="ltx_p"><span id="A3.SS1.p2.pic1.2.16.1" class="ltx_text ltx_font_typewriter" style="--ltx-fg-color:#000000;">{feedback}
</span></span>
<span id="A3.SS1.p2.pic1.2.17" class="ltx_p"><span id="A3.SS1.p2.pic1.2.17.1" class="ltx_text ltx_font_typewriter" style="--ltx-fg-color:#000000;">Please provide the revised translation:
