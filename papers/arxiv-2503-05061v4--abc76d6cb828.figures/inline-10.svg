<span class="ltx_td ltx_align_left ltx_eqn_cell"><math id="A4.Ex1Xb.m3" class="ltx_Math" alttext="\displaystyle=\$10,500\times\frac{9}{12}=\$7,875" display="inline" intent=":literal"><semantics><mrow><mo style="--ltx-fg-color:#000000;" mathcolor="#000000" rspace="0.1389em">=</mo><mo lspace="0.1389em" rspace="0.167em">$</mo><mn style="--ltx-fg-color:#000000;" mathcolor="#000000">10,500</mn><mo style="--ltx-fg-color:#000000;" lspace="0.222em" mathcolor="#000000" rspace="0.222em">×</mo><mstyle displaystyle="true"><mfrac style="--ltx-fg-color:#000000;" mathcolor="#000000"><mn style="--ltx-fg-color:#000000;" mathcolor="#000000">9</mn><mn style="--ltx-fg-color:#000000;" mathcolor="#000000">12</mn></mfrac></mstyle><mo style="--ltx-fg-color:#000000;" mathcolor="#000000" rspace="0.1389em">=</mo><mo lspace="0.1389em" rspace="0.167em">$</mo><mn style="--ltx-fg-color:#000000;" mathcolor="#000000">7,875</mn></mrow><annotation encoding="application/x-tex">\displaystyle=\$10,500\times\frac{9}{12}=\$7,875</annotation></semantics></math></span>
