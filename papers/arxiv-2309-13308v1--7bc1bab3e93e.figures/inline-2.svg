<svg id="A4.F6.pic1" class="ltx_picture ltx_centering" height="470.9" overflow="visible" version="1.1" viewbox="0 0 550 470.9" width="550"><g style="--ltx-stroke-color:#000000;--ltx-fill-color:#000000;" fill="#000000" stroke="#000000" stroke-width="0.4pt" transform="translate(0,470.9) matrix(1 0 0 -1 0 0)"><g style="--ltx-fill-color:#404040;" fill="#404040" fill-opacity="1.0"><path style="stroke:none" d="M 0 5.18 L 0 465.71 C 0 468.58 2.32 470.9 5.18 470.9 L 544.82 470.9 C 547.68 470.9 550 468.58 550 465.71 L 550 5.18 C 550 2.32 547.68 0 544.82 0 L 5.18 0 C 2.32 0 0 2.32 0 5.18 Z" /></g><g style="--ltx-fill-color:#FAFAFF;" fill="#FAFAFF" fill-opacity="1.0"><path style="stroke:none" d="M 1.25 5.18 L 1.25 465.71 C 1.25 467.89 3.01 469.65 5.18 469.65 L 544.82 469.65 C 546.99 469.65 548.75 467.89 548.75 465.71 L 548.75 5.18 C 548.75 3.01 546.99 1.25 544.82 1.25 L 5.18 1.25 C 3.01 1.25 1.25 3.01 1.25 5.18 Z" /></g><g fill-opacity="1.0" transform="matrix(1.0 0.0 0.0 1.0 20.93 16.52)"><foreignobject style="--ltx-fo-width:36.72em;--ltx-fo-height:31.89em;--ltx-fo-depth:0.25em;font-size:10pt;" height="444.79" overflow="visible" transform="matrix(1 0 0 -1 0 441.33)" width="508.1"><span class="ltx_foreignobject_container"><span class="ltx_foreignobject_content">
<span id="A4.F6.pic1.1" class="ltx_inline-block ltx_minipage ltx_align_bottom" style="width:36.72em;">
<span id="A4.F6.pic1.1.1" class="ltx_p"><span id="A4.F6.pic1.1.1.1" class="ltx_text" style="--ltx-fg-color:#000000;">## Instructions</span></span>
<span id="A4.F6.pic1.1.2" class="ltx_p"><span id="A4.F6.pic1.1.2.1" class="ltx_text" style="--ltx-fg-color:#000000;">Please infer the scoring criteria for the following task:</span></span>
<span id="A4.F6.pic1.1.3" class="ltx_p"><span id="A4.F6.pic1.1.3.1" class="ltx_text" style="--ltx-fg-color:#000000;">[Task data-to-text is to generate natural language sentences from structured data sources. This can be useful for creating chatbots, voice assistants, or text summarizers. Please score the following natural language sentence generated according to a structured data expression. Please return your score on <span id="A4.F6.pic1.1.3.1.1" class="ltx_text" style="--ltx-fg-color:#BF0040;">[Aspect]</span> of the sentence, in the scale of 1 to 6, with 1 being the lowest.] 
<br class="ltx_break"></span></span>
<span id="A4.F6.pic1.1.4" class="ltx_p"><span id="A4.F6.pic1.1.4.1" class="ltx_text" style="--ltx-fg-color:#000000;">- The following is some examples on evaluation of <span id="A4.F6.pic1.1.4.1.1" class="ltx_text" style="--ltx-fg-color:#BF0040;">[Aspect]</span> of the natural language sentence generated from structured data expression (in the range of 1 to 6, where 1 being the lowest).</span></span>
<span id="A4.F6.pic1.1.5" class="ltx_p"><span id="A4.F6.pic1.1.5.1" class="ltx_text" style="--ltx-fg-color:#000000;">- Please carefully read all expressions, generated sentence and its assigned score, and induce the most possible scoring rule and criteria used.</span></span>
<span id="A4.F6.pic1.1.6" class="ltx_p"><span id="A4.F6.pic1.1.6.1" class="ltx_text" style="--ltx-fg-color:#000000;">- It is optimal that, by using the same criteria, you are very likely to assign a same score to the provided reference scores.
<br class="ltx_break"></span></span>
<span id="A4.F6.pic1.1.7" class="ltx_p"><span id="A4.F6.pic1.1.7.1" class="ltx_text" style="--ltx-fg-color:#000000;">## Criteria for <span id="A4.F6.pic1.1.7.1.1" class="ltx_text" style="--ltx-fg-color:#BF0040;">[Aspect]</span></span></span>
<span id="A4.F6.pic1.1.8" class="ltx_p"><span id="A4.F6.pic1.1.8.1" class="ltx_text" style="--ltx-fg-color:#000000;">- The scoring criteria been used. Now it is not explicitly provided, and you should induce it from the following samples.</span></span>
<span id="A4.F6.pic1.1.9" class="ltx_p"><span id="A4.F6.pic1.1.9.1" class="ltx_text" style="--ltx-fg-color:#000000;">- The induced criteria should be able to explain the scores of all the samples provided, being generic and concise. 
<br class="ltx_break"></span></span>
<span id="A4.F6.pic1.1.10" class="ltx_p"><span id="A4.F6.pic1.1.10.1" class="ltx_text" style="--ltx-fg-color:#000000;">## Examples</span></span>
<span id="A4.F6.pic1.1.11" class="ltx_p"><span id="A4.F6.pic1.1.11.1" class="ltx_text" style="--ltx-fg-color:#0000FF;">[In-Context Few-Shot Sampls]<span id="A4.F6.pic1.1.11.1.1" class="ltx_text" style="--ltx-fg-color:#000000;"> 
<br class="ltx_break"></span></span></span>
<span id="A4.F6.pic1.1.12" class="ltx_p"><span id="A4.F6.pic1.1.12.1" class="ltx_text" style="--ltx-fg-color:#000000;">## Induced Criteria</span></span>
<span id="A4.F6.pic1.1.13" class="ltx_p"><span id="A4.F6.pic1.1.13.1" class="ltx_text" style="--ltx-fg-color:#000000;">Criteria for <span id="A4.F6.pic1.1.13.1.1" class="ltx_text" style="--ltx-fg-color:#BF0040;">[Aspect]</span>:</span></span>
