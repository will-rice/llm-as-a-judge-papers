<span id="A2.F9.pic1.1" class="ltx_inline-block ltx_minipage ltx_align_bottom" style="width:44.07em;">
<span id="A2.F9.pic1.1.1" class="ltx_p"><span id="A2.F9.pic1.1.1.1" class="ltx_text ltx_font_bold" style="--ltx-fg-color:#000000;">[System]<span id="A2.F9.pic1.1.1.1.1" class="ltx_text ltx_font_medium"> 
<br class="ltx_break">Please act as an impartial meta-judge and evaluate the decision made by an AI judge on the following user question. The user question is a comparative evaluation task, asking to judge which of two AI assistant responses is better based on correctness and helpfulness. 
<br class="ltx_break">
<br class="ltx_break">The AI judge has already made a selection between Assistant A and Assistant B as the better response, using the following verdict format: 
<br class="ltx_break">- &quot;[[A]]&quot; if Assistant A is better 
<br class="ltx_break">- &quot;[[B]]&quot; if Assistant B is better 
<br class="ltx_break">- &quot;[[C]]&quot; if it is a tie 
<br class="ltx_break"></span></span></span>
<span id="A2.F9.pic1.1.2" class="ltx_p"><span id="A2.F9.pic1.1.2.1" class="ltx_text" style="--ltx-fg-color:#000000;">Your task is to independently perform the same comparison step-by-step and determine whether you agree with the AI judge’s choice. Focus solely on verifying the correctness of the AI judge’s final decision.

<br class="ltx_break"></span></span>
<span id="A2.F9.pic1.1.3" class="ltx_p"><span id="A2.F9.pic1.1.3.1" class="ltx_text" style="--ltx-fg-color:#000000;">After completing your evaluation, provide a concise explanation of your reasoning. Be as objective as possible. Finally, state your verdict in the following format: &quot;**[[Correct]]**&quot; if the AI judge’s selection is correct, or &quot;**[[Incorrect]]**&quot; if it is not. 
<br class="ltx_break"></span></span>
<span id="A2.F9.pic1.1.4" class="ltx_p"><span id="A2.F9.pic1.1.4.1" class="ltx_text ltx_font_bold" style="--ltx-fg-color:#000000;">User Question:<span id="A2.F9.pic1.1.4.1.1" class="ltx_text ltx_font_medium"> 
<br class="ltx_break">{question} 
<br class="ltx_break"></span></span></span>
<span id="A2.F9.pic1.1.5" class="ltx_p"><span id="A2.F9.pic1.1.5.1" class="ltx_text ltx_font_bold" style="--ltx-fg-color:#000000;">[The Start of AI Judge’s Selected Verdict]<span id="A2.F9.pic1.1.5.1.1" class="ltx_text ltx_font_medium"> 
<br class="ltx_break">{response} 
<br class="ltx_break"></span>[The End of AI Judge’s Selected Verdict]<span id="A2.F9.pic1.1.5.1.2" class="ltx_text"></span></span></span>
