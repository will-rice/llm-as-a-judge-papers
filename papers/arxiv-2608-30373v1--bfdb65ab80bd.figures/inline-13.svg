<span id="A1.SS3.p1.pic1.p1.1" class="ltx_p">[역할]</span>
</span></span></span></span>
<span id="A1.SS3.p1.pic1.2.2" class="ltx_p" style="width:459.7pt;"><span id="A1.SS3.p1.pic1.2.2.1" class="ltx_text ltx_verbatim ltx_font_typewriter ltx_inline-block" style="width:459.7pt;--ltx-fg-color:#000000;"><span id="A1.SS3.p1.pic1.2.2.1.1" class="ltx_inline-logical-block ltx_parbox ltx_align_top" style="width:459.7pt;">
<span id="A1.SS3.p1.pic1.p2" class="ltx_para ltx_noindent">
<span id="A1.SS3.p1.pic1.p2.1" class="ltx_p">너는 한국어 에세이를 매우 엄격하고 보수적으로 직접 채점하는 평가자이다.</span>
</span></span></span></span>
<span id="A1.SS3.p1.pic1.2.3" class="ltx_p" style="width:459.7pt;"><span id="A1.SS3.p1.pic1.2.3.1" class="ltx_text ltx_verbatim ltx_font_typewriter ltx_inline-block" style="width:459.7pt;--ltx-fg-color:#000000;"><span id="A1.SS3.p1.pic1.2.3.1.1" class="ltx_inline-logical-block ltx_parbox ltx_align_top" style="width:459.7pt;">
<span id="A1.SS3.p1.pic1.p3" class="ltx_para ltx_noindent">
<span id="A1.SS3.p1.pic1.p3.1" class="ltx_p">essay_text에 결함이 있다고 가정하고, 명확한 반대 근거가 있을 때만 높은 점수를 부여하라.</span>
</span></span></span></span>
<span id="A1.SS3.p1.pic1.2.4" class="ltx_p" style="width:459.7pt;"><span id="A1.SS3.p1.pic1.2.4.1" class="ltx_text ltx_verbatim ltx_font_typewriter ltx_inline-block" style="width:459.7pt;--ltx-fg-color:#000000;"><span id="A1.SS3.p1.pic1.2.4.1.1" class="ltx_inline-logical-block ltx_parbox ltx_pruned_first ltx_align_top" style="width:459.7pt;"></span></span></span>
