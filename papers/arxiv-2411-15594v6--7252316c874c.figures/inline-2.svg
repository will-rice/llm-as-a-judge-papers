<span id="S2.SS1.SSS1.p2.pic1.2" class="ltx_inline-block ltx_minipage ltx_align_bottom" style="width:19.79em;">
<span id="S2.SS1.SSS1.p2.pic1.2.1" class="ltx_p"><span id="S2.SS1.SSS1.p2.pic1.2.1.1" class="ltx_text ltx_font_bold" style="font-size:173%;--ltx-fg-color:#000000;">Likert Scale Scoring:
<br class="ltx_break"><span id="S2.SS1.SSS1.p2.pic1.2.1.1.1" class="ltx_text ltx_font_medium">Evaluate the quality of summaries written for a news article. Rate each summary on four dimensions: <span id="S2.SS1.SSS1.p2.pic1.2.1.1.1.1" class="ltx_text" style="--ltx-fg-color:#0000FF;">{Dimension_1}</span>, <span id="S2.SS1.SSS1.p2.pic1.2.1.1.1.2" class="ltx_text" style="--ltx-fg-color:#0000FF;">{Dimension_2}</span>, <span id="S2.SS1.SSS1.p2.pic1.2.1.1.1.3" class="ltx_text" style="--ltx-fg-color:#0000FF;">{Dimension_3}</span>, and <span id="S2.SS1.SSS1.p2.pic1.2.1.1.1.4" class="ltx_text" style="--ltx-fg-color:#0000FF;">{Dimension_4}</span>. You should rate on a scale from 1 (worst) to 5 (best).
<br class="ltx_break">Article: <span id="S2.SS1.SSS1.p2.pic1.2.1.1.1.5" class="ltx_text" style="--ltx-fg-color:#0000FF;">{Article}</span> 
<br class="ltx_break">Summary: <span id="S2.SS1.SSS1.p2.pic1.2.1.1.1.6" class="ltx_text" style="--ltx-fg-color:#0000FF;">{Summary}</span></span></span></span>
<span id="S2.SS1.SSS1.p2.pic1.2.2" class="ltx_p"><span id="S2.SS1.SSS1.p2.pic1.2.2.1" class="ltx_text ltx_font_bold" style="font-size:173%;--ltx-fg-color:#000000;">Pairwise Comparison:
<br class="ltx_break"><span id="S2.SS1.SSS1.p2.pic1.2.2.1.1" class="ltx_text ltx_font_medium">Given a new article, which summary is better? Answer &quot;Summary 0&quot; or &quot;Summary 1&quot;. You do not need to explain the reason.
<br class="ltx_break">Article: <span id="S2.SS1.SSS1.p2.pic1.2.2.1.1.1" class="ltx_text" style="--ltx-fg-color:#0000FF;">{Article}</span> 
<br class="ltx_break">Summary 0: <span id="S2.SS1.SSS1.p2.pic1.2.2.1.1.2" class="ltx_text" style="--ltx-fg-color:#0000FF;">{Summary_0}</span> 
<br class="ltx_break">Summary 1: <span id="S2.SS1.SSS1.p2.pic1.2.2.1.1.3" class="ltx_text" style="--ltx-fg-color:#0000FF;">{Summary_1}</span></span></span></span>
