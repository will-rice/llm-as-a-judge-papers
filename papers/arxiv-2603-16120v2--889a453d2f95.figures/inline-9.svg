<span id="A4.pic8.1" class="ltx_inline-block ltx_minipage ltx_align_bottom" style="width:46.2em;">
<span id="A4.pic8.1.1" class="ltx_p"><span id="A4.pic8.1.1.1" class="ltx_text" style="--ltx-fg-color:#FFFFFF;">Prompt D.8: Profile Inference Relevance Prompt (<a href="#S2.SS1" title="2.1 Inferring Researcher Profiles ‣ 2 MySQA: Personalized Deep Research ‣ Language Models Don’t Know What You Want:Evaluating Personalization in Deep Research Needs Real Users" class="ltx_ref"><span class="ltx_text ltx_ref_tag">section</span> <span class="ltx_text ltx_ref_tag">2.1</span></a>)</span></span>
</span></span></span></foreignobject></g><g fill-opacity="1.0" transform="matrix(1.0 0.0 0.0 1.0 6.92 10.38)"><foreignobject style="--ltx-fo-width:46.2em;--ltx-fo-height:13.89em;--ltx-fo-depth:0.25em;font-size:10pt;" height="195.72" overflow="visible" transform="matrix(1 0 0 -1 0 192.26)" width="639.28"><span class="ltx_foreignobject_container"><span class="ltx_foreignobject_content">
<span id="A4.pic8.2" class="ltx_inline-block ltx_minipage ltx_align_bottom" style="width:46.2em;">
<span id="A4.pic8.2.1" class="ltx_p"><span id="A4.pic8.2.1.1" class="ltx_text" style="--ltx-fg-color:#000000;">&lt;task&gt;
As a Relevance Validator, your task is to determine whether a specific text from a paper provides support for and is relevant to a broader inference intended to span multiple papers.
If the paper text provides support for at least one aspect of the inference, then it is relevant. If the paper text supports no part of the inference, then it is irrelevant. For example, if the inference claims &quot;Your papers use the terms ’first’ and ’novel’&quot; and from the text we can infer that &quot;The paper uses the term ’first’&quot;, the paper text is relevant since it relates to the claim about ’first’, even though the word ’novel’ is not discussed. Thus, for the paper text to be &quot;Relevant&quot;, it only needs to support one aspect of the inference.
&lt;/task&gt;
<br class="ltx_break"></span></span>
<span id="A4.pic8.2.2" class="ltx_p"><span id="A4.pic8.2.2.1" class="ltx_text" style="--ltx-fg-color:#000000;">Here is the paper text:
&lt;paper text&gt;
<math id="A4.pic8.m1" class="ltx_Math" alttext="d_{\text{cite}}" display="inline" intent=":literal"><semantics><msub><mi style="--ltx-fg-color:#000000;" mathcolor="#000000">d</mi><mtext style="--ltx-fg-color:#000000;" mathcolor="#000000">cite</mtext></msub><annotation encoding="application/x-tex">d_{\text{cite}}</annotation></semantics></math>
&lt;/paper text&gt;
<br class="ltx_break"></span></span>
<span id="A4.pic8.2.3" class="ltx_p"><span id="A4.pic8.2.3.1" class="ltx_text" style="--ltx-fg-color:#000000;">And here is the inference:
&lt;inference&gt;
<math id="A4.pic8.m2" class="ltx_Math" alttext="\mathcal{I}" display="inline" intent=":literal"><semantics><mi style="--ltx-fg-color:#000000;" class="ltx_font_mathcaligraphic" mathcolor="#000000">ℐ</mi><annotation encoding="application/x-tex">\mathcal{I}</annotation></semantics></math>
&lt;/inference&gt;
<br class="ltx_break"></span></span>
<span id="A4.pic8.2.4" class="ltx_p"><span id="A4.pic8.2.4.1" class="ltx_text" style="--ltx-fg-color:#000000;">&lt;format&gt;
Output your response as a json with only a single key &quot;output&quot; and a value of one among - (&quot;Relevant&quot;, &quot;Irrelevant&quot;).
&lt;/format&gt;</span></span>
</span></span></span></foreignobject></g></g></svg>