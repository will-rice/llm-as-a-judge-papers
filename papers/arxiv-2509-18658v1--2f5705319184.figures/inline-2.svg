<span id="A1.F6.pic1.2.1" class="ltx_p"><span id="A1.F6.pic1.2.1.1" class="ltx_text" style="--ltx-fg-color:#000000;">You will receive a generated response based on the question. 
<br class="ltx_break" style="--ltx-break-space:7.5pt;"></span></span>
<span id="A1.F6.pic1.2.2" class="ltx_p"><span id="A1.F6.pic1.2.2.1" class="ltx_text" style="--ltx-fg-color:#000000;">Your mission is to assess whether the generated response answers the question in a well-justified manner. 
<br class="ltx_break" style="--ltx-break-space:7.5pt;"></span></span>
<span id="A1.F6.pic1.2.3" class="ltx_p"><span id="A1.F6.pic1.2.3.1" class="ltx_text" style="--ltx-fg-color:#000000;">Please pay close attention to the instructions and keep this guide handy while completing your review. Feel free to refer back to it as needed. 
<br class="ltx_break" style="--ltx-break-space:10.0pt;"></span></span>
<span id="A1.F6.pic1.2.4" class="ltx_p"><span id="A1.F6.pic1.2.4.1" class="ltx_text ltx_font_bold" style="--ltx-fg-color:#000000;">Evaluation Criterion:<span id="A1.F6.pic1.2.4.1.1" class="ltx_text ltx_font_medium"> 
<br class="ltx_break" style="--ltx-break-space:2.5pt;">
</span>Quality (1–5):<span id="A1.F6.pic1.2.4.1.2" class="ltx_text ltx_font_medium">
1=incomprehensible and wrong,  
5=clear and correct 
