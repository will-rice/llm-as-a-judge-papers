in the translated text.
</span></span>
<span id="A3.SS2.SSS1.p1.pic1.2.3" class="ltx_p"><span id="A3.SS2.SSS1.p1.pic1.2.3.1" class="ltx_text ltx_font_typewriter" style="--ltx-fg-color:#000000;">2. Output only the translated result. Do not provide explanations or
any additional content.
</span></span>
<span id="A3.SS2.SSS1.p1.pic1.2.4" class="ltx_p"><span id="A3.SS2.SSS1.p1.pic1.2.4.1" class="ltx_text ltx_font_typewriter" style="--ltx-fg-color:#000000;">3. Preserve structural tags such as
&lt;title&gt;&lt;/title&gt;,
&lt;content&gt;&lt;/content&gt;, and
&lt;comment&gt;&lt;/comment&gt;.
The translated result must follow the same tag structure as the input.
</span></span>
