<span id="A13.p4.pic1.3.1" class="ltx_p"><span id="A13.p4.pic1.3.1.1" class="ltx_text ltx_font_bold" style="--ltx-fg-color:#000000;">Instruction:
<br class="ltx_break">
<br class="ltx_break"><span id="A13.p4.pic1.3.1.1.1" class="ltx_text ltx_font_medium">###Task Description:
<br class="ltx_break">An instruction (might include an Input inside it), a response to evaluate, and a score rubric representing a evaluation criteria are given.
<br class="ltx_break">1. Write a detailed feedback that assess the quality of the response strictly based on the given score rubric, not evaluating in general.
<br class="ltx_break">2. After writing a feedback, write a score that is an integer between 1 and 5. You should refer to the score rubric.
<br class="ltx_break">3. The output format should look as follows: &quot;Feedback: (write a feedback for criteria) [RESULT ](an integer number between 1 and 5)&quot;
<br class="ltx_break">4. Please do not generate any other opening, closing, and explanations.
<br class="ltx_break">
<br class="ltx_break">###The instruction to evaluate:
<br class="ltx_break"><span id="A13.p4.pic1.3.1.1.1.1" class="ltx_text ltx_font_typewriter" style="--ltx-fg-color:#800080;">{instruction}
<br class="ltx_break">
<br class="ltx_break"></span>###Response to evaluate:
<br class="ltx_break"><span id="A13.p4.pic1.3.1.1.1.2" class="ltx_text ltx_font_typewriter" style="--ltx-fg-color:#800080;">{response}
<br class="ltx_break">
<br class="ltx_break"></span>###Reference Answer (Score 5):
<br class="ltx_break"><span id="A13.p4.pic1.3.1.1.1.3" class="ltx_text ltx_font_typewriter" style="--ltx-fg-color:#800080;">{reference_answer}
<br class="ltx_break">
<br class="ltx_break"></span>###Score Rubrics:
<br class="ltx_break"><span id="A13.p4.pic1.3.1.1.1.4" class="ltx_text ltx_font_typewriter" style="--ltx-fg-color:#800080;">{score_rubric}
<br class="ltx_break">
<br class="ltx_break"></span>###Feedback: 
<br class="ltx_break"></span></span></span>
