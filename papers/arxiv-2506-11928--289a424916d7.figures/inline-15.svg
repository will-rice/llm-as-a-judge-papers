<svg id="S15.SS0.SSS0.Px5.p2.pic1" class="ltx_picture" height="416.65" overflow="visible" version="1.1" viewbox="0 0 477.38 416.65" width="477.38"><g style="--ltx-stroke-color:#000000;--ltx-fill-color:#000000;" fill="#000000" stroke="#000000" stroke-width="0.4pt" transform="translate(0,416.65) matrix(1 0 0 -1 0 0)"><g style="--ltx-fill-color:#BF0000;" fill="#BF0000" fill-opacity="1.0"><path style="stroke:none" d="M 0 5.91 L 0 410.75 C 0 414.01 2.64 416.65 5.91 416.65 L 471.47 416.65 C 474.73 416.65 477.38 414.01 477.38 410.75 L 477.38 5.91 C 477.38 2.64 474.73 0 471.47 0 L 5.91 0 C 2.64 0 0 2.64 0 5.91 Z" /></g><g style="--ltx-fill-color:#FFF2F2;" fill="#FFF2F2" fill-opacity="1.0"><path style="stroke:none" d="M 1.97 5.91 L 1.97 391 L 475.41 391 L 475.41 5.91 C 475.41 3.73 473.65 1.97 471.47 1.97 L 5.91 1.97 C 3.73 1.97 1.97 3.73 1.97 5.91 Z" /></g><g fill-opacity="1.0" transform="matrix(1.0 0.0 0.0 1.0 21.65 400.37)"><foreignobject style="--ltx-fo-width:31.37em;--ltx-fo-height:0.75em;--ltx-fo-depth:0.25em;font-size:10pt;" height="13.84" overflow="visible" transform="matrix(1 0 0 -1 0 10.38)" width="434.07"><span class="ltx_foreignobject_container"><span class="ltx_foreignobject_content">
<span id="S15.SS0.SSS0.Px5.p2.pic1.1" class="ltx_inline-block ltx_minipage ltx_align_bottom" style="width:31.37em;">
<span id="S15.SS0.SSS0.Px5.p2.pic1.1.1" class="ltx_p"><a href="https://codeforces.com/problemset/problem/1990/A" title class="ltx_ref ltx_href" style="--ltx-fg-color:#FFFFFF;">Example Game Theory Problem (Rated 900)</a></span>
</span></span></span></foreignobject></g><g fill-opacity="1.0" transform="matrix(1.0 0.0 0.0 1.0 21.65 16.47)"><foreignobject style="--ltx-fo-width:31.37em;--ltx-fo-height:26.21em;--ltx-fo-depth:0.19em;font-size:10pt;" height="365.42" overflow="visible" transform="matrix(1 0 0 -1 0 362.73)" width="434.07"><span class="ltx_foreignobject_container"><span class="ltx_foreignobject_content">
<span id="S15.SS0.SSS0.Px5.p2.pic1.2" class="ltx_inline-block ltx_minipage ltx_align_bottom" style="width:31.37em;">
<span id="S15.SS0.SSS0.Px5.p2.pic1.2.1" class="ltx_p"><span id="S15.SS0.SSS0.Px5.p2.pic1.2.1.1" class="ltx_text" style="--ltx-fg-color:#000000;">Alice and Bob are playing a game in an array <math id="S15.SS0.SSS0.Px5.p2.pic1.m1" class="ltx_Math" alttext="a" display="inline" intent=":literal"><semantics><mi style="--ltx-fg-color:#000000;" mathcolor="#000000">a</mi><annotation encoding="application/x-tex">a</annotation></semantics></math> of size <math id="S15.SS0.SSS0.Px5.p2.pic1.m2" class="ltx_Math" alttext="n" display="inline" intent=":literal"><semantics><mi style="--ltx-fg-color:#000000;" mathcolor="#000000">n</mi><annotation encoding="application/x-tex">n</annotation></semantics></math>.

<br class="ltx_break">
<br class="ltx_break">They take turns to do operations, with Alice starting first. The player who can not operate will lose. At first, a variable <math id="S15.SS0.SSS0.Px5.p2.pic1.m3" class="ltx_Math" alttext="mx" display="inline" intent=":literal"><semantics><mrow><mi style="--ltx-fg-color:#000000;" mathcolor="#000000">m</mi><mo lspace="0em" rspace="0em">​</mo><mi style="--ltx-fg-color:#000000;" mathcolor="#000000">x</mi></mrow><annotation encoding="application/x-tex">mx</annotation></semantics></math> is set to <math id="S15.SS0.SSS0.Px5.p2.pic1.m4" class="ltx_Math" alttext="0" display="inline" intent=":literal"><semantics><mn style="--ltx-fg-color:#000000;" mathcolor="#000000">0</mn><annotation encoding="application/x-tex">0</annotation></semantics></math>.

<br class="ltx_break">
<br class="ltx_break">In one operation, a player can do:</span></span>
<span id="S15.I3" class="ltx_itemize">
<span id="S15.I3.i1" class="ltx_item" style="list-style-type:none;"><span class="ltx_tag ltx_tag_item">•</span> 
<span id="S15.I3.i1.p1" class="ltx_para">
<span id="S15.I3.i1.p1.1" class="ltx_p"><span id="S15.I3.i1.p1.1.1" class="ltx_text" style="--ltx-fg-color:#000000;">Choose an index </span><math id="S15.I3.i1.p1.m1" class="ltx_Math" alttext="i\ (1\leq i\leq n)" display="inline" intent=":literal"><semantics><mrow><mi style="--ltx-fg-color:#000000;" mathcolor="#000000">i</mi><mo lspace="0.500em">⁡</mo><mrow><mo style="--ltx-fg-color:#000000;" mathcolor="#000000" stretchy="false">(</mo><mrow><mn style="--ltx-fg-color:#000000;" mathcolor="#000000">1</mn><mo style="--ltx-fg-color:#000000;" mathcolor="#000000">≤</mo><mi style="--ltx-fg-color:#000000;" mathcolor="#000000">i</mi><mo style="--ltx-fg-color:#000000;" mathcolor="#000000">≤</mo><mi style="--ltx-fg-color:#000000;" mathcolor="#000000">n</mi></mrow><mo style="--ltx-fg-color:#000000;" mathcolor="#000000" stretchy="false">)</mo></mrow></mrow><annotation encoding="application/x-tex">i\ (1\leq i\leq n)</annotation></semantics></math><span id="S15.I3.i1.p1.1.2" class="ltx_text" style="--ltx-fg-color:#000000;"> such that </span><math id="S15.I3.i1.p1.m2" class="ltx_Math" alttext="a_{i}&gt;mx" display="inline" intent=":literal"><semantics><mrow><msub><mi style="--ltx-fg-color:#000000;" mathcolor="#000000">a</mi><mi style="--ltx-fg-color:#000000;" mathcolor="#000000">i</mi></msub><mo style="--ltx-fg-color:#000000;" mathcolor="#000000">&gt;</mo><mrow><mi style="--ltx-fg-color:#000000;" mathcolor="#000000">m</mi><mo lspace="0em" rspace="0em">​</mo><mi style="--ltx-fg-color:#000000;" mathcolor="#000000">x</mi></mrow></mrow><annotation encoding="application/x-tex">a_{i}&gt;mx</annotation></semantics></math><span id="S15.I3.i1.p1.1.3" class="ltx_text" style="--ltx-fg-color:#000000;"> and set </span><math id="S15.I3.i1.p1.m3" class="ltx_Math" alttext="mx" display="inline" intent=":literal"><semantics><mrow><mi style="--ltx-fg-color:#000000;" mathcolor="#000000">m</mi><mo lspace="0em" rspace="0em">​</mo><mi style="--ltx-fg-color:#000000;" mathcolor="#000000">x</mi></mrow><annotation encoding="application/x-tex">mx</annotation></semantics></math><span id="S15.I3.i1.p1.1.4" class="ltx_text" style="--ltx-fg-color:#000000;"> to </span><math id="S15.I3.i1.p1.m4" class="ltx_Math" alttext="a_{i}" display="inline" intent=":literal"><semantics><msub><mi style="--ltx-fg-color:#000000;" mathcolor="#000000">a</mi><mi style="--ltx-fg-color:#000000;" mathcolor="#000000">i</mi></msub><annotation encoding="application/x-tex">a_{i}</annotation></semantics></math><span id="S15.I3.i1.p1.1.5" class="ltx_text" style="--ltx-fg-color:#000000;"> to </span><math id="S15.I3.i1.p1.m5" class="ltx_Math" alttext="0" display="inline" intent=":literal"><semantics><mn style="--ltx-fg-color:#000000;" mathcolor="#000000">0</mn><annotation encoding="application/x-tex">0</annotation></semantics></math><span id="S15.I3.i1.p1.1.6" class="ltx_text" style="--ltx-fg-color:#000000;">.</span></span>
</span></span>
</span>
<span id="S15.SS0.SSS0.Px5.p2.pic1.2.2" class="ltx_p"><span id="S15.SS0.SSS0.Px5.p2.pic1.2.2.1" class="ltx_text" style="--ltx-fg-color:#000000;">Determine whether Alice has a winning strategy.

<br class="ltx_break">
<br class="ltx_break"><span id="S15.SS0.SSS0.Px5.p2.pic1.2.2.1.1" class="ltx_text ltx_font_bold">Input</span> 
<br class="ltx_break">The first line contains an integer <math id="S15.SS0.SSS0.Px5.p2.pic1.m5" class="ltx_Math" alttext="t\ (1\leq t\leq 10^{3})" display="inline" intent=":literal"><semantics><mrow><mi style="--ltx-fg-color:#000000;" mathcolor="#000000">t</mi><mo lspace="0.500em">⁡</mo><mrow><mo style="--ltx-fg-color:#000000;" mathcolor="#000000" stretchy="false">(</mo><mrow><mn style="--ltx-fg-color:#000000;" mathcolor="#000000">1</mn><mo style="--ltx-fg-color:#000000;" mathcolor="#000000">≤</mo><mi style="--ltx-fg-color:#000000;" mathcolor="#000000">t</mi><mo style="--ltx-fg-color:#000000;" mathcolor="#000000">≤</mo><msup><mn style="--ltx-fg-color:#000000;" mathcolor="#000000">10</mn><mn style="--ltx-fg-color:#000000;" mathcolor="#000000">3</mn></msup></mrow><mo style="--ltx-fg-color:#000000;" mathcolor="#000000" stretchy="false">)</mo></mrow></mrow><annotation encoding="application/x-tex">t\ (1\leq t\leq 10^{3})</annotation></semantics></math>—the number of test cases.

<br class="ltx_break">
<br class="ltx_break">For each test case:</span></span>
<span id="S15.I4" class="ltx_itemize">
<span id="S15.I4.i1" class="ltx_item" style="list-style-type:none;"><span class="ltx_tag ltx_tag_item">•</span> 
<span id="S15.I4.i1.p1" class="ltx_para">
<span id="S15.I4.i1.p1.1" class="ltx_p"><span id="S15.I4.i1.p1.1.1" class="ltx_text" style="--ltx-fg-color:#000000;">The first line contains an integer </span><math id="S15.I4.i1.p1.m1" class="ltx_Math" alttext="n\ (2\leq n\leq 50)" display="inline" intent=":literal"><semantics><mrow><mi style="--ltx-fg-color:#000000;" mathcolor="#000000">n</mi><mo lspace="0.500em">⁡</mo><mrow><mo style="--ltx-fg-color:#000000;" mathcolor="#000000" stretchy="false">(</mo><mrow><mn style="--ltx-fg-color:#000000;" mathcolor="#000000">2</mn><mo style="--ltx-fg-color:#000000;" mathcolor="#000000">≤</mo><mi style="--ltx-fg-color:#000000;" mathcolor="#000000">n</mi><mo style="--ltx-fg-color:#000000;" mathcolor="#000000">≤</mo><mn style="--ltx-fg-color:#000000;" mathcolor="#000000">50</mn></mrow><mo style="--ltx-fg-color:#000000;" mathcolor="#000000" stretchy="false">)</mo></mrow></mrow><annotation encoding="application/x-tex">n\ (2\leq n\leq 50)</annotation></semantics></math><span id="S15.I4.i1.p1.1.2" class="ltx_text" style="--ltx-fg-color:#000000;">—the size of the array.</span></span>
</span></span>
<span id="S15.I4.i2" class="ltx_item" style="list-style-type:none;"><span class="ltx_tag ltx_tag_item">•</span> 
<span id="S15.I4.i2.p1" class="ltx_para">
<span id="S15.I4.i2.p1.1" class="ltx_p"><span id="S15.I4.i2.p1.1.1" class="ltx_text" style="--ltx-fg-color:#000000;">The second line contains </span><math id="S15.I4.i2.p1.m1" class="ltx_Math" alttext="n" display="inline" intent=":literal"><semantics><mi style="--ltx-fg-color:#000000;" mathcolor="#000000">n</mi><annotation encoding="application/x-tex">n</annotation></semantics></math><span id="S15.I4.i2.p1.1.2" class="ltx_text" style="--ltx-fg-color:#000000;"> integers </span><math id="S15.I4.i2.p1.m2" class="ltx_Math" alttext="a_{1},a_{n},\dots a_{n}\ (1\leq a_{i}\leq n)" display="inline" intent=":literal"><semantics><mrow><msub><mi style="--ltx-fg-color:#000000;" mathcolor="#000000">a</mi><mn style="--ltx-fg-color:#000000;" mathcolor="#000000">1</mn></msub><mo style="--ltx-fg-color:#000000;" mathcolor="#000000">,</mo><msub><mi style="--ltx-fg-color:#000000;" mathcolor="#000000">a</mi><mi style="--ltx-fg-color:#000000;" mathcolor="#000000">n</mi></msub><mo style="--ltx-fg-color:#000000;" mathcolor="#000000">,</mo><mrow><mi style="--ltx-fg-color:#000000;" mathcolor="#000000" mathvariant="normal">…</mi><mo lspace="0em" rspace="0em">​</mo><msub><mi style="--ltx-fg-color:#000000;" mathcolor="#000000">a</mi><mi style="--ltx-fg-color:#000000;" mathcolor="#000000">n</mi></msub><mo lspace="0em" rspace="0em">​</mo><mrow><mo style="--ltx-fg-color:#000000;" mathcolor="#000000" stretchy="false">(</mo><mrow><mn style="--ltx-fg-color:#000000;" mathcolor="#000000">1</mn><mo style="--ltx-fg-color:#000000;" mathcolor="#000000">≤</mo><msub><mi style="--ltx-fg-color:#000000;" mathcolor="#000000">a</mi><mi style="--ltx-fg-color:#000000;" mathcolor="#000000">i</mi></msub><mo style="--ltx-fg-color:#000000;" mathcolor="#000000">≤</mo><mi style="--ltx-fg-color:#000000;" mathcolor="#000000">n</mi></mrow><mo style="--ltx-fg-color:#000000;" mathcolor="#000000" stretchy="false">)</mo></mrow></mrow></mrow><annotation encoding="application/x-tex">a_{1},a_{n},\dots a_{n}\ (1\leq a_{i}\leq n)</annotation></semantics></math><span id="S15.I4.i2.p1.1.3" class="ltx_text" style="--ltx-fg-color:#000000;">—the elements of the array.</span></span>
</span></span>
</span>
<span id="S15.SS0.SSS0.Px5.p2.pic1.2.3" class="ltx_p"><span id="S15.SS0.SSS0.Px5.p2.pic1.2.3.1" class="ltx_text ltx_font_bold" style="--ltx-fg-color:#000000;">Output<span id="S15.SS0.SSS0.Px5.p2.pic1.2.3.1.1" class="ltx_text ltx_font_medium"> 
<br class="ltx_break">For each test case, if Alice has a winning strategy, output “YES”. Otherwise, output “NO”.

<br class="ltx_break">
<br class="ltx_break">You can output the answer in any case (upper or lower). For example, the strings “yEs”, “yes”, “Yes”, and “YES” will be recognized as positive responses.</span></span></span>
</span></span></span></foreignobject></g></g></svg>