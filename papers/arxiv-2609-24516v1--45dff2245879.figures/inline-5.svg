</span></span></span><span id="S4.pic5.p9.1.2" class="ltx_text ltx_font_bold" style="--ltx-fg-color:#000000;">  Evaluation</span></span>
</span>
<span id="S4.pic5.p1" class="ltx_para ltx_noindent">
<span id="S4.pic5.p1.1" class="ltx_p"><span id="S4.pic5.p1.1.1" class="ltx_text ltx_align_left ltx_inline-block" style="width:15.0pt;--ltx-fg-color:#000000;">38.</span><span id="S4.pic5.p1.1.2" class="ltx_text" style="--ltx-fg-color:#000000;">How are you evaluating the LLJ?</span></span>
</span>
<span id="S4.pic5.p10" class="ltx_para">
<span id="S4.I8" class="ltx_itemize" style="--ltx-enum-leftmargin:3.7em;">
<span id="S4.I8.i1" class="ltx_item" style="list-style-type:none;"><span class="ltx_tag ltx_tag_item">•</span> 
<span id="S4.I8.i1.p1" class="ltx_para">
<span id="S4.I8.i1.p1.1" class="ltx_p"><span id="S4.I8.i1.p1.1.1" class="ltx_text" style="--ltx-fg-color:#000000;">What metrics/benchmarks are you using?</span></span>
</span></span>
<span id="S4.I8.i2" class="ltx_item" style="list-style-type:none;"><span class="ltx_tag ltx_tag_item">•</span> 
<span id="S4.I8.i2.p1" class="ltx_para">
<span id="S4.I8.i2.p1.1" class="ltx_p"><span id="S4.I8.i2.p1.1.1" class="ltx_text" style="--ltx-fg-color:#000000;">What are the baselines, if any?</span></span>
</span></span>
</span>
</span>
<span id="S4.pic5.p2" class="ltx_para ltx_noindent">
<span id="S4.pic5.p2.1" class="ltx_p"><span id="S4.pic5.p2.1.1" class="ltx_text ltx_align_left ltx_inline-block" style="width:15.0pt;--ltx-fg-color:#000000;">39.</span><span id="S4.pic5.p2.1.2" class="ltx_text" style="--ltx-fg-color:#000000;">Are you presenting non-aggregated results and additional analysis?</span></span>
</span>
<span id="S4.pic5.p3" class="ltx_para ltx_noindent">
<span id="S4.pic5.p3.1" class="ltx_p"><span id="S4.pic5.p3.1.1" class="ltx_text ltx_align_left ltx_inline-block" style="width:15.0pt;--ltx-fg-color:#000000;">40.</span><span id="S4.pic5.p3.1.2" class="ltx_text" style="--ltx-fg-color:#000000;">Are you assessing the validity of the scores?</span></span>
</span>
<span id="S4.pic5.p4" class="ltx_para ltx_noindent">
<span id="S4.pic5.p4.1" class="ltx_p"><span id="S4.pic5.p4.1.1" class="ltx_text ltx_align_left ltx_inline-block" style="width:15.0pt;--ltx-fg-color:#000000;">41.</span><span id="S4.pic5.p4.1.2" class="ltx_text" style="--ltx-fg-color:#000000;">Are you disclosing the limitations of the evaluation process?</span></span>
</span>
<span id="S4.pic5.p5" class="ltx_para ltx_noindent">
<span id="S4.pic5.p5.1" class="ltx_p"><span id="S4.pic5.p5.1.1" class="ltx_text ltx_align_left ltx_inline-block" style="width:15.0pt;--ltx-fg-color:#000000;">42.</span><span id="S4.pic5.p5.1.2" class="ltx_text" style="--ltx-fg-color:#000000;">Is this a dynamic evaluation?</span></span>
</span>
<span id="S4.pic5.p11" class="ltx_para">
<span id="S4.I9" class="ltx_itemize" style="--ltx-enum-leftmargin:3.7em;">
<span id="S4.I9.i1" class="ltx_item" style="list-style-type:none;"><span class="ltx_tag ltx_tag_item">•</span> 
<span id="S4.I9.i1.p1" class="ltx_para">
<span id="S4.I9.i1.p1.1" class="ltx_p"><span id="S4.I9.i1.p1.1.1" class="ltx_text" style="--ltx-fg-color:#000000;">If so, what are the plans for maintaining or retiring the system?</span></span>
</span></span>
</span>
<span id="S4.pic5.p11.1" class="ltx_p"><span id="S4.pic5.p11.1.1" class="ltx_text ltx_font_bold" style="position:relative; bottom:-2.3pt;--ltx-fg-color:#000000;">
<span id="S4.pic5.p11.1.1.1" class="ltx_inline-block ltx_transformed_outer" style="width:0.0pt;height:9.6pt;vertical-align:-0.0pt;"><span class="ltx_transformed_inner" style="transform:translate(0.0pt,-1.4pt) scale(1.4,1.4) ;">
</span></span></span><span id="S4.pic5.p11.1.2" class="ltx_text ltx_font_bold" style="--ltx-fg-color:#000000;">  Ethical Considerations</span></span>
</span>
<span id="S4.pic5.p6" class="ltx_para ltx_noindent">
<span id="S4.pic5.p6.1" class="ltx_p"><span id="S4.pic5.p6.1.1" class="ltx_text ltx_align_left ltx_inline-block" style="width:15.0pt;--ltx-fg-color:#000000;">43.</span><span id="S4.pic5.p6.1.2" class="ltx_text" style="--ltx-fg-color:#000000;">What harms could arise from incorrect evaluation results?</span></span>
</span>
<span id="S4.pic5.p7" class="ltx_para ltx_noindent">
<span id="S4.pic5.p7.1" class="ltx_p"><span id="S4.pic5.p7.1.1" class="ltx_text ltx_align_left ltx_inline-block" style="width:15.0pt;--ltx-fg-color:#000000;">44.</span><span id="S4.pic5.p7.1.2" class="ltx_text" style="--ltx-fg-color:#000000;">How do the social impacts of this evaluation compare to alternative approaches?</span></span>
</span>
<span id="S4.pic5.p8" class="ltx_para ltx_noindent">
<span id="S4.pic5.p8.1" class="ltx_p"><span id="S4.pic5.p8.1.1" class="ltx_text ltx_align_left ltx_inline-block" style="width:15.0pt;--ltx-fg-color:#000000;">45.</span><span id="S4.pic5.p8.1.2" class="ltx_text" style="--ltx-fg-color:#000000;">What harms or risks could arise from using these evaluation results to guide decision-making or as a basis for further work?</span></span>
</span></span></span></span></foreignobject></g></g></svg>