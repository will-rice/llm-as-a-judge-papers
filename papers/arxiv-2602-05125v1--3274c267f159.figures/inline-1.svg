<svg id="A6.SS1.p1.pic1" class="ltx_picture" height="1797.64" overflow="visible" version="1.1" viewbox="0 0 653.15 1797.64" width="653.15"><g style="--ltx-stroke-color:#000000;--ltx-fill-color:#000000;" fill="#000000" stroke="#000000" stroke-width="0.4pt" transform="translate(0,1797.64) matrix(1 0 0 -1 0 0)"><g style="--ltx-fill-color:#000000;" fill="#000000" fill-opacity="1.0"><path style="stroke:none" d="M 0 8.57 L 0 1789.07 C 0 1793.8 3.84 1797.64 8.57 1797.64 L 644.58 1797.64 C 649.31 1797.64 653.15 1793.8 653.15 1789.07 L 653.15 8.57 C 653.15 3.84 649.31 0 644.58 0 L 8.57 0 C 3.84 0 0 3.84 0 8.57 Z" /></g><g style="--ltx-fill-color:#FFFFFF;" fill="#FFFFFF" fill-opacity="1.0"><path style="stroke:none" d="M 0.69 8.57 L 0.69 1776.08 L 652.46 1776.08 L 652.46 8.57 C 652.46 4.22 648.93 0.69 644.58 0.69 L 8.57 0.69 C 4.22 0.69 0.69 4.22 0.69 8.57 Z" /></g><g fill-opacity="1.0" transform="matrix(1.0 0.0 0.0 1.0 12.5 1783.4)"><foreignobject style="--ltx-fo-width:45.4em;--ltx-fo-height:0.69em;--ltx-fo-depth:0.19em;font-size:10pt;" height="12.3" overflow="visible" transform="matrix(1 0 0 -1 0 9.61)" width="628.21"><span class="ltx_foreignobject_container"><span class="ltx_foreignobject_content">
<span id="A6.SS1.p1.pic1.1" class="ltx_inline-block ltx_minipage ltx_align_bottom" style="width:45.4em;">
<span id="A6.SS1.p1.pic1.1.1" class="ltx_p"><span id="A6.SS1.p1.pic1.1.1.1" class="ltx_text" style="--ltx-fg-color:#FFFFFF;">Prompt for initial rubric generation.</span></span>
</span></span></span></foreignobject></g><g fill-opacity="1.0" transform="matrix(1.0 0.0 0.0 1.0 12.5 81.69)"><foreignobject style="--ltx-fo-width:45.4em;--ltx-fo-height:121.6em;--ltx-fo-depth:5em;font-size:10pt;" height="1751.79" overflow="visible" transform="matrix(1 0 0 -1 0 1682.6)" width="628.21"><span class="ltx_foreignobject_container"><span class="ltx_foreignobject_content">
<span id="A6.SS1.p1.pic1.2" class="ltx_inline-block ltx_minipage ltx_align_bottom" style="width:45.4em;">
<span id="A6.SS1.p1.pic1.2.1" class="ltx_p"><span id="A6.SS1.p1.pic1.2.1.1" class="ltx_text" style="--ltx-fg-color:#000000;">Role: You are a rubric designer for an LLM-as-judge system.</span></span>
<span id="A6.SS1.p1.pic1.2.2" class="ltx_p"><span id="A6.SS1.p1.pic1.2.2.1" class="ltx_text" style="--ltx-fg-color:#000000;">Inputs you will receive:</span></span>
<span id="A6.I1" class="ltx_itemize">
<span id="A6.I1.i1" class="ltx_item" style="list-style-type:none;"><span class="ltx_tag ltx_tag_item">•</span> 
<span id="A6.I1.i1.p1" class="ltx_para">
<span id="A6.I1.i1.p1.1" class="ltx_p"><span id="A6.I1.i1.p1.1.1" class="ltx_text" style="--ltx-fg-color:#000000;">Prompt: the task/question the response must answer.</span></span>
</span></span>
<span id="A6.I1.i2" class="ltx_item" style="list-style-type:none;"><span class="ltx_tag ltx_tag_item">•</span> 
<span id="A6.I1.i2.p1" class="ltx_para">
<span id="A6.I1.i2.p1.1" class="ltx_p"><span id="A6.I1.i2.p1.1.1" class="ltx_text ltx_font_italic" style="--ltx-fg-color:#000000;">Responses: a set of responses to be evaluated against rubrics.</span></span>
</span></span>
</span>
<span id="A6.SS1.p1.pic1.2.3" class="ltx_p"><span id="A6.SS1.p1.pic1.2.3.1" class="ltx_text" style="--ltx-fg-color:#000000;">Goal: Design a comprehensive set of rubrics for evaluating responses to the given prompt. Only write rubrics you are confident about. Only propose the best new rubrics.</span></span>
<span id="A6.SS1.p1.pic1.2.4" class="ltx_p"><span id="A6.SS1.p1.pic1.2.4.1" class="ltx_text" style="--ltx-fg-color:#000000;">Requirements:</span></span>
<span id="A6.I2" class="ltx_itemize">
<span id="A6.I2.i1" class="ltx_item" style="list-style-type:none;"><span class="ltx_tag ltx_tag_item">•</span> 
<span id="A6.I2.i1.p1" class="ltx_para">
<span id="A6.I2.i1.p1.1" class="ltx_p"><span id="A6.I2.i1.p1.1.1" class="ltx_text" style="--ltx-fg-color:#000000;">Propose rubrics that collectively cover the most important dimensions needed to judge whether a response correctly and helpfully satisfies the prompt.</span></span>
</span></span>
<span id="A6.I2.i2" class="ltx_item" style="list-style-type:none;"><span class="ltx_tag ltx_tag_item">•</span> 
<span id="A6.I2.i2.p1" class="ltx_para">
<span id="A6.I2.i2.p1.1" class="ltx_p"><span id="A6.I2.i2.p1.1.1" class="ltx_text" style="--ltx-fg-color:#000000;">Each rubric must be consistently judgeable across many responses (avoid vague wording like “good”, “nice”, “high-quality”).</span></span>
</span></span>
<span id="A6.I2.i3" class="ltx_item" style="list-style-type:none;"><span class="ltx_tag ltx_tag_item">•</span> 
<span id="A6.I2.i3.p1" class="ltx_para">
<span id="A6.I2.i3.p1.1" class="ltx_p"><span id="A6.I2.i3.p1.1.1" class="ltx_text" style="--ltx-fg-color:#000000;">Each rubric must be prompt-specific (tied to what the user asked), not generic writing advice.</span></span>
</span></span>
<span id="A6.I2.i4" class="ltx_item" style="list-style-type:none;"><span class="ltx_tag ltx_tag_item">•</span> 
<span id="A6.I2.i4.p1" class="ltx_para">
<span id="A6.I2.i4.p1.1" class="ltx_p"><span id="A6.I2.i4.p1.1.1" class="ltx_text" style="--ltx-fg-color:#000000;">Each rubric should be written as a single criterion with clear, binary pass/fail boundaries. Prefer objective checks.</span></span>
</span></span>
<span id="A6.I2.i5" class="ltx_item" style="list-style-type:none;"><span class="ltx_tag ltx_tag_item">•</span> 
<span id="A6.I2.i5.p1" class="ltx_para">
<span id="A6.I2.i5.p1.1" class="ltx_p"><span id="A6.I2.i5.p1.1.1" class="ltx_text" style="--ltx-fg-color:#000000;">New rubric MUST NOT answer the question directly.</span></span>
</span></span>
<span id="A6.I2.i6" class="ltx_item" style="list-style-type:none;"><span class="ltx_tag ltx_tag_item">•</span> 
<span id="A6.I2.i6.p1" class="ltx_para">
<span id="A6.I2.i6.p1.1" class="ltx_p"><span id="A6.I2.i6.p1.1.1" class="ltx_text ltx_font_italic" style="--ltx-fg-color:#000000;">New rubric MUST NOT repeat any of the responses provided.</span></span>
</span></span>
</span>
<span id="A6.SS1.p1.pic1.2.5" class="ltx_p"><span id="A6.SS1.p1.pic1.2.5.1" class="ltx_text" style="--ltx-fg-color:#000000;">Tips for writing good rubrics:</span></span>
<span id="A6.SS1.p1.pic1.2.6" class="ltx_p"><span id="A6.SS1.p1.pic1.2.6.1" class="ltx_text" style="--ltx-fg-color:#000000;">i. MECE:</span></span>
<span id="A6.I3" class="ltx_itemize" style="--ltx-enum-leftmargin:1.2em;">
<span id="A6.I3.i1" class="ltx_item" style="list-style-type:none;"><span class="ltx_tag ltx_tag_item">•</span> 
<span id="A6.I3.i1.p1" class="ltx_para">
<span id="A6.I3.i1.p1.1" class="ltx_p"><span id="A6.I3.i1.p1.1.1" class="ltx_text" style="--ltx-fg-color:#000000;">Mutually Exclusive, Collectively Exhaustive</span></span>
</span></span>
</span>
<span id="A6.SS1.p1.pic1.2.7" class="ltx_p"><span id="A6.SS1.p1.pic1.2.7.1" class="ltx_text" style="--ltx-fg-color:#000000;">ii. Completeness:</span></span>
<span id="A6.I4" class="ltx_itemize" style="--ltx-enum-leftmargin:1.2em;">
<span id="A6.I4.i1" class="ltx_item" style="list-style-type:none;"><span class="ltx_tag ltx_tag_item">•</span> 
<span id="A6.I4.i1.p1" class="ltx_para">
<span id="A6.I4.i1.p1.1" class="ltx_p"><span id="A6.I4.i1.p1.1.1" class="ltx_text" style="--ltx-fg-color:#000000;">Consider all the elements you would want to include to create a perfect response and put them into the rubric. This means including not only the facts and statements directly requested by the prompt, but also the supporting details that provide justification, reasoning, and logic for your response. Each of these elements should have a criterion because each criterion helps to develop the answer to the question from a slightly different angle.</span></span>
</span></span>
</span>
<span id="A6.SS1.p1.pic1.2.8" class="ltx_p"><span id="A6.SS1.p1.pic1.2.8.1" class="ltx_text" style="--ltx-fg-color:#000000;">iii. No overlapping:</span></span>
<span id="A6.I5" class="ltx_itemize" style="--ltx-enum-leftmargin:1.2em;">
<span id="A6.I5.i1" class="ltx_item" style="list-style-type:none;"><span class="ltx_tag ltx_tag_item">•</span> 
<span id="A6.I5.i1.p1" class="ltx_para">
<span id="A6.I5.i1.p1.1" class="ltx_p"><span id="A6.I5.i1.p1.1.1" class="ltx_text" style="--ltx-fg-color:#000000;">the same error from a model shouldn’t be punished multiple times.</span></span>
</span></span>
</span>
<span id="A6.SS1.p1.pic1.2.9" class="ltx_p"><span id="A6.SS1.p1.pic1.2.9.1" class="ltx_text" style="--ltx-fg-color:#000000;">iv. Diversity:</span></span>
<span id="A6.I6" class="ltx_itemize" style="--ltx-enum-leftmargin:1.2em;">
<span id="A6.I6.i1" class="ltx_item" style="list-style-type:none;"><span class="ltx_tag ltx_tag_item">•</span> 
<span id="A6.I6.i1.p1" class="ltx_para">
<span id="A6.I6.i1.p1.1" class="ltx_p"><span id="A6.I6.i1.p1.1.1" class="ltx_text" style="--ltx-fg-color:#000000;">The rubric items should include variable types of information.</span></span>
</span></span>
<span id="A6.I6.i2" class="ltx_item" style="list-style-type:none;"><span class="ltx_tag ltx_tag_item">•</span> 
<span id="A6.I6.i2.p1" class="ltx_para">
<span id="A6.I6.i2.p1.1" class="ltx_p"><span id="A6.I6.i2.p1.1.1" class="ltx_text" style="--ltx-fg-color:#000000;">If all criteria are like “the response mentions A”, “the response mentions B”, then this is not a good rubric.</span></span>
</span></span>
</span>
<span id="A6.SS1.p1.pic1.2.10" class="ltx_p"><span id="A6.SS1.p1.pic1.2.10.1" class="ltx_text" style="--ltx-fg-color:#000000;">v: How many rubric items for each prompt</span></span>
<span id="A6.I7" class="ltx_itemize" style="--ltx-enum-leftmargin:1.2em;">
<span id="A6.I7.i1" class="ltx_item" style="list-style-type:none;"><span class="ltx_tag ltx_tag_item">•</span> 
<span id="A6.I7.i1.p1" class="ltx_para">
<span id="A6.I7.i1.p1.1" class="ltx_p"><span id="A6.I7.i1.p1.1.1" class="ltx_text" style="--ltx-fg-color:#000000;">There is no golden standard, and the desired number of rubrics varies by accounts and task types.</span></span>
</span></span>
<span id="A6.I7.i2" class="ltx_item" style="list-style-type:none;"><span class="ltx_tag ltx_tag_item">•</span> 
<span id="A6.I7.i2.p1" class="ltx_para">
<span id="A6.I7.i2.p1.1" class="ltx_p"><span id="A6.I7.i2.p1.1.1" class="ltx_text" style="--ltx-fg-color:#000000;">Write rubrics that cover all aspects of an ideal response.</span></span>
</span></span>
</span>
<span id="A6.SS1.p1.pic1.2.11" class="ltx_p"><span id="A6.SS1.p1.pic1.2.11.1" class="ltx_text" style="--ltx-fg-color:#000000;">vi: How many rubric items to fail</span></span>
<span id="A6.I8" class="ltx_itemize" style="--ltx-enum-leftmargin:1.2em;">
<span id="A6.I8.i1" class="ltx_item" style="list-style-type:none;"><span class="ltx_tag ltx_tag_item">•</span> 
<span id="A6.I8.i1.p1" class="ltx_para">
<span id="A6.I8.i1.p1.1" class="ltx_p"><span id="A6.I8.i1.p1.1.1" class="ltx_text" style="--ltx-fg-color:#000000;">A good rule of thumb is that the model fails on 50 per cent of rubrics items</span></span>
</span></span>
</span>
<span id="A6.SS1.p1.pic1.2.12" class="ltx_p"><span id="A6.SS1.p1.pic1.2.12.1" class="ltx_text" style="--ltx-fg-color:#000000;">vii: Atomicity / Non-stacked</span></span>
<span id="A6.I9" class="ltx_itemize" style="--ltx-enum-leftmargin:1.2em;">
<span id="A6.I9.i1" class="ltx_item" style="list-style-type:none;"><span class="ltx_tag ltx_tag_item">•</span> 
<span id="A6.I9.i1.p1" class="ltx_para">
<span id="A6.I9.i1.p1.1" class="ltx_p"><span id="A6.I9.i1.p1.1.1" class="ltx_text" style="--ltx-fg-color:#000000;">Each rubric criterion should evaluate exactly one distinct aspect. Avoid bundling multiple criteria into a single rubric. Most stacked criteria with the word “and” can be broken up into multiple pieces.</span></span>
</span></span>
<span id="A6.I9.i2" class="ltx_item" style="list-style-type:none;"><span class="ltx_tag ltx_tag_item">•</span> 
<span id="A6.I9.i2.p1" class="ltx_para">
<span id="A6.I9.i2.p1.1" class="ltx_p"><span id="A6.I9.i2.p1.1.1" class="ltx_text" style="--ltx-fg-color:#000000;">BAD: Response identifies George Washington as the first U.S. president and mentions he served two terms.</span></span>
</span></span>
<span id="A6.I9.i3" class="ltx_item" style="list-style-type:none;"><span class="ltx_tag ltx_tag_item">•</span> 
<span id="A6.I9.i3.p1" class="ltx_para">
<span id="A6.I9.i3.p1.1" class="ltx_p"><span id="A6.I9.i3.p1.1.1" class="ltx_text" style="--ltx-fg-color:#000000;">GOOD: Response identifies George Washington as the first U.S. president.</span></span>
</span></span>
<span id="A6.I9.i4" class="ltx_item" style="list-style-type:none;"><span class="ltx_tag ltx_tag_item">•</span> 
<span id="A6.I9.i4.p1" class="ltx_para">
<span id="A6.I9.i4.p1.1" class="ltx_p"><span id="A6.I9.i4.p1.1.1" class="ltx_text" style="--ltx-fg-color:#000000;">GOOD: Response mentions that George Washington served two terms.</span></span>
</span></span>
</span>
<span id="A6.SS1.p1.pic1.2.13" class="ltx_p"><span id="A6.SS1.p1.pic1.2.13.1" class="ltx_text" style="--ltx-fg-color:#000000;">viii: Specificity</span></span>
<span id="A6.I10" class="ltx_itemize" style="--ltx-enum-leftmargin:1.2em;">
<span id="A6.I10.i1" class="ltx_item" style="list-style-type:none;"><span class="ltx_tag ltx_tag_item">•</span> 
<span id="A6.I10.i1.p1" class="ltx_para">
<span id="A6.I10.i1.p1.1" class="ltx_p"><span id="A6.I10.i1.p1.1.1" class="ltx_text" style="--ltx-fg-color:#000000;">Criteria should be binary (true or false) and objective.</span></span>
</span></span>
<span id="A6.I10.i2" class="ltx_item" style="list-style-type:none;"><span class="ltx_tag ltx_tag_item">•</span> 
<span id="A6.I10.i2.p1" class="ltx_para">
<span id="A6.I10.i2.p1.1" class="ltx_p"><span id="A6.I10.i2.p1.1.1" class="ltx_text" style="--ltx-fg-color:#000000;">Avoid vague descriptions (e.g., “the response must be accurate” is vague).</span></span>
</span></span>
<span id="A6.I10.i3" class="ltx_item" style="list-style-type:none;"><span class="ltx_tag ltx_tag_item">•</span> 
<span id="A6.I10.i3.p1" class="ltx_para">
<span id="A6.I10.i3.p1.1" class="ltx_p"><span id="A6.I10.i3.p1.1.1" class="ltx_text" style="--ltx-fg-color:#000000;">Example: “The response should list exactly three examples.”</span></span>
</span></span>
</span>
<span id="A6.SS1.p1.pic1.2.14" class="ltx_p"><span id="A6.SS1.p1.pic1.2.14.1" class="ltx_text" style="--ltx-fg-color:#000000;">ix: Self-contained</span></span>
<span id="A6.I11" class="ltx_itemize" style="--ltx-enum-leftmargin:1.2em;">
<span id="A6.I11.i1" class="ltx_item" style="list-style-type:none;"><span class="ltx_tag ltx_tag_item">•</span> 
<span id="A6.I11.i1.p1" class="ltx_para">
<span id="A6.I11.i1.p1.1" class="ltx_p"><span id="A6.I11.i1.p1.1.1" class="ltx_text" style="--ltx-fg-color:#000000;">Each criterion should contain all the information needed to evaluate a response. For example: “Mentions the capital city of Canada” </span><math id="A6.I11.i1.p1.m1" class="ltx_Math" alttext="\rightarrow" display="inline" intent=":literal"><semantics><mo style="--ltx-fg-color:#000000;" mathcolor="#000000" stretchy="false">→</mo><annotation encoding="application/x-tex">\rightarrow</annotation></semantics></math><span id="A6.I11.i1.p1.1.2" class="ltx_text" style="--ltx-fg-color:#000000;"> BAD; “Mentions the capital city of Canada is Ottawa” </span><math id="A6.I11.i1.p1.m2" class="ltx_Math" alttext="\rightarrow" display="inline" intent=":literal"><semantics><mo style="--ltx-fg-color:#000000;" mathcolor="#000000" stretchy="false">→</mo><annotation encoding="application/x-tex">\rightarrow</annotation></semantics></math><span id="A6.I11.i1.p1.1.3" class="ltx_text" style="--ltx-fg-color:#000000;"> GOOD.</span></span>
</span></span>
</span>
<span id="A6.SS1.p1.pic1.2.15" class="ltx_p"><span id="A6.SS1.p1.pic1.2.15.1" class="ltx_text" style="--ltx-fg-color:#000000;">x: Criterion should be verifiable without requiring external search.</span></span>
<span id="A6.I12" class="ltx_itemize" style="--ltx-enum-leftmargin:1.2em;">
<span id="A6.I12.i1" class="ltx_item" style="list-style-type:none;"><span class="ltx_tag ltx_tag_item">•</span> 
<span id="A6.I12.i1.p1" class="ltx_para">
<span id="A6.I12.i1.p1.1" class="ltx_p"><span id="A6.I12.i1.p1.1.1" class="ltx_text" style="--ltx-fg-color:#000000;">BAD: Response names any of the Nobel Prize winners in Physics in 2023</span></span>
</span></span>
<span id="A6.I12.i2" class="ltx_item" style="list-style-type:none;"><span class="ltx_tag ltx_tag_item">•</span> 
<span id="A6.I12.i2.p1" class="ltx_para">
<span id="A6.I12.i2.p1.1" class="ltx_p"><span id="A6.I12.i2.p1.1.1" class="ltx_text" style="--ltx-fg-color:#000000;">GOOD: Response names any of the following Nobel Prize winners in Physics in 2023: Pierre Agostini, Ferenc Krausz, or Anne L’Huillier.</span></span>
</span></span>
</span>
<span id="A6.SS1.p1.pic1.2.16" class="ltx_p"><span id="A6.SS1.p1.pic1.2.16.1" class="ltx_text" style="--ltx-fg-color:#000000;">Below are the inputs:</span></span>
<span id="A6.I13" class="ltx_itemize" style="--ltx-enum-leftmargin:1.2em;">
<span id="A6.I13.i1" class="ltx_item" style="list-style-type:none;"><span class="ltx_tag ltx_tag_item">•</span> 
<span id="A6.I13.i1.p1" class="ltx_para">
<span id="A6.I13.i1.p1.1" class="ltx_p"><span id="A6.I13.i1.p1.1.1" class="ltx_text ltx_font_typewriter" style="--ltx-fg-color:#000000;">Here is the user prompt for which we want to generate a rubric:
<br class="ltx_break">PROMPT: {prompt}</span></span>
</span></span>
<span id="A6.I13.i2" class="ltx_item" style="list-style-type:none;"><span class="ltx_tag ltx_tag_item">•</span> 
<span id="A6.I13.i2.p1" class="ltx_para">
<span id="A6.I13.i2.p1.1" class="ltx_p"><span id="A6.I13.i2.p1.1.1" class="ltx_text ltx_font_typewriter ltx_font_italic" style="--ltx-fg-color:#000000;">Here are a list of reference responses:
<br class="ltx_break">RESPONSES: <span id="A6.I13.i2.p1.1.1.1" class="ltx_text ltx_font_upright">{</span>responses<span id="A6.I13.i2.p1.1.1.2" class="ltx_text ltx_font_upright">}</span><span id="A6.I13.i2.p1.1.1.3" class="ltx_text ltx_font_serif">
</span></span></span>
</span></span>
</span>
<span id="A6.SS1.p1.pic1.2.17" class="ltx_p"><span id="A6.SS1.p1.pic1.2.17.1" class="ltx_text" style="--ltx-fg-color:#000000;">Output STRICTLY in below format. No other text is allowed:</span></span>
<span id="A6.I14" class="ltx_itemize" style="--ltx-enum-leftmargin:1.2em;">
