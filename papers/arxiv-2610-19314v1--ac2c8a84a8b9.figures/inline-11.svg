<span id="A6.SS1.p6.pic1.1" class="ltx_inline-block ltx_minipage ltx_align_bottom" style="width:39.59em;">
<span id="A6.SS1.p6.pic1.1.1" class="ltx_p"><span id="A6.SS1.p6.pic1.1.1.1" class="ltx_text ltx_font_bold" style="--ltx-fg-color:#FFFFFF;">Prompt 6  Dialogue realization — instantiation template</span></span>
</span></span></span></foreignobject></g><g fill-opacity="1.0" transform="matrix(1.0 0.0 0.0 1.0 11.55 13.24)"><foreignobject style="--ltx-fo-width:45.53em;--ltx-fo-height:52.82em;--ltx-fo-depth:0.22em;font-size:10pt;" height="733.88" overflow="visible" transform="matrix(1 0 0 -1 0 730.81)" width="630.01"><span class="ltx_foreignobject_container"><span class="ltx_foreignobject_content">
<span id="A6.SS1.p6.pic1.2" class="ltx_inline-block ltx_minipage ltx_align_bottom" style="width:45.53em;">
<span id="A6.SS1.p6.pic1.2.1" class="ltx_p"><span id="A6.SS1.p6.pic1.2.1.1" class="ltx_text ltx_font_bold" style="--ltx-fg-color:#000000;">Purpose:<span id="A6.SS1.p6.pic1.2.1.1.1" class="ltx_text ltx_font_medium"> binds one accepted specification into the conversation-writing call</span></span></span>
<span id="A6.SS1.p6.pic1.2.2" class="ltx_p"><span id="A6.SS1.p6.pic1.2.2.1" class="ltx_text ltx_font_bold" style="--ltx-fg-color:#000000;">Input:<span id="A6.SS1.p6.pic1.2.2.1.1" class="ltx_text ltx_font_medium"> specification fields; relation-specific structure block</span></span></span>
<span id="A6.SS1.p6.pic1.2.3" class="ltx_p"><span id="A6.SS1.p6.pic1.2.3.1" class="ltx_text ltx_font_bold" style="--ltx-fg-color:#000000;">Output:<span id="A6.SS1.p6.pic1.2.3.1.1" class="ltx_text ltx_font_medium"> consumed under the system prompt of Prompt <a href="#A6.SS1" title="F.1 Generation Pipeline ‣ Appendix F Prompt System ‣ PersEvalBench: Can LLM Evaluators Judge Contextually Appropriate Use of Persona Information?" class="ltx_ref"><span class="ltx_text ltx_ref_tag">F.1</span></a></span></span></span>
<span id="A6.SS1.p6.pic1.2.4" class="ltx_p"><span id="A6.SS1.p6.pic1.2.4.1" class="ltx_text ltx_font_bold" style="--ltx-fg-color:#000000;">Scenario details<span id="A6.SS1.p6.pic1.2.4.1.1" class="ltx_text ltx_font_medium"> — <span id="A6.SS1.p6.pic1.2.4.1.1.1" class="ltx_text ltx_font_italic">the specification fields the dialogue must realize verbatim</span></span></span></span><span class="ltx_rule" style="width:100%;height:0.3pt;--ltx-fg-color:#999999;--ltx-bg-color:#999999;display:inline-block;"> </span>
<span id="A6.SS1.p6.pic1.2.5" class="ltx_p ltx_align_left"><span id="A6.SS1.p6.pic1.2.5.1" class="ltx_text ltx_font_typewriter" style="--ltx-fg-color:#000000;">Generate a realistic multi-episode conversation for this scenario:</span></span>
<span id="A6.SS1.p6.pic1.2.6" class="ltx_p ltx_align_left"><span id="A6.SS1.p6.pic1.2.6.1" class="ltx_text ltx_font_typewriter" style="--ltx-fg-color:#000000;">- Scene type: {scenario_relation}</span></span>
<span id="A6.SS1.p6.pic1.2.7" class="ltx_p ltx_align_left"><span id="A6.SS1.p6.pic1.2.7.1" class="ltx_text ltx_font_typewriter" style="--ltx-fg-color:#000000;">- Primary error: {error_subtype}</span></span>
<span id="A6.SS1.p6.pic1.2.8" class="ltx_p ltx_align_left"><span id="A6.SS1.p6.pic1.2.8.1" class="ltx_text ltx_font_typewriter" style="--ltx-fg-color:#000000;">- Applicable State A: {applicable_state_A}</span></span>
<span id="A6.SS1.p6.pic1.2.9" class="ltx_p ltx_align_left"><span id="A6.SS1.p6.pic1.2.9.1" class="ltx_text ltx_font_typewriter" style="--ltx-fg-color:#000000;">- Decoy State B: {decoy_or_non_applicable_state_B}</span></span>
<span id="A6.SS1.p6.pic1.2.10" class="ltx_p ltx_align_left"><span id="A6.SS1.p6.pic1.2.10.1" class="ltx_text ltx_font_typewriter" style="--ltx-fg-color:#000000;">- A--B relation: {A_B_relation}</span></span>
<span id="A6.SS1.p6.pic1.2.11" class="ltx_p ltx_align_left"><span id="A6.SS1.p6.pic1.2.11.1" class="ltx_text ltx_font_typewriter" style="--ltx-fg-color:#000000;">- Scope/status difference: {scope_or_status_difference}</span></span>
<span id="A6.SS1.p6.pic1.2.12" class="ltx_p ltx_align_left"><span id="A6.SS1.p6.pic1.2.12.1" class="ltx_text ltx_font_typewriter" style="--ltx-fg-color:#000000;">- Evidence form: {preference_expression}</span></span>
<span id="A6.SS1.p6.pic1.2.13" class="ltx_p ltx_align_left"><span id="A6.SS1.p6.pic1.2.13.1" class="ltx_text ltx_font_typewriter" style="--ltx-fg-color:#000000;">- Evidence distance: {evidence_distance_category}</span></span>
<span id="A6.SS1.p6.pic1.2.14" class="ltx_p ltx_align_left"><span id="A6.SS1.p6.pic1.2.14.1" class="ltx_text ltx_font_typewriter" style="--ltx-fg-color:#000000;">- Target episode: {target_episode}</span></span>
<span id="A6.SS1.p6.pic1.2.15" class="ltx_p ltx_align_left"><span id="A6.SS1.p6.pic1.2.15.1" class="ltx_text ltx_font_typewriter" style="--ltx-fg-color:#000000;">Episode 1 context: {episode_1_state}</span></span>
<span id="A6.SS1.p6.pic1.2.16" class="ltx_p ltx_align_left"><span id="A6.SS1.p6.pic1.2.16.1" class="ltx_text ltx_font_typewriter" style="--ltx-fg-color:#000000;">Episode 2 context: {episode_2_state_or_change}</span></span>
<span id="A6.SS1.p6.pic1.2.17" class="ltx_p ltx_align_left"><span id="A6.SS1.p6.pic1.2.17.1" class="ltx_text ltx_font_typewriter" style="--ltx-fg-color:#000000;">Target turn: the RIGHT response would {target_options.right}; the user’s request at the target must naturally require personalization.</span></span>
<span id="A6.SS1.p6.pic1.2.18" class="ltx_p"><span id="A6.SS1.p6.pic1.2.18.1" class="ltx_text ltx_font_bold" style="--ltx-fg-color:#000000;">Structure<span id="A6.SS1.p6.pic1.2.18.1.1" class="ltx_text ltx_font_medium"> — <span id="A6.SS1.p6.pic1.2.18.1.1.1" class="ltx_text ltx_font_italic">relation-specific episode and turn budgets; long middles create genuine interference and distance</span></span></span></span><span class="ltx_rule" style="width:100%;height:0.3pt;--ltx-fg-color:#999999;--ltx-bg-color:#999999;display:inline-block;"> </span>
<span id="A6.SS1.p6.pic1.2.19" class="ltx_p ltx_align_left"><span id="A6.SS1.p6.pic1.2.19.1" class="ltx_text ltx_font_typewriter" style="--ltx-fg-color:#000000;">{relation-specific plan; e.g., for same-episode re-entry (minimum 18 turns):</span></span>
<span id="A6.SS1.p6.pic1.2.20" class="ltx_p ltx_align_left"><span id="A6.SS1.p6.pic1.2.20.1" class="ltx_text ltx_font_typewriter" style="--ltx-fg-color:#000000;">Episode 1 (6--8 turns): establish the main task and express State A naturally, with back-and-forth about details.</span></span>
<span id="A6.SS1.p6.pic1.2.21" class="ltx_p ltx_align_left"><span id="A6.SS1.p6.pic1.2.21.1" class="ltx_text ltx_font_typewriter" style="--ltx-fg-color:#000000;">Episode 2 (6--8 turns): a different task in which decoy State B is expressed; long enough to create real interference and distance.</span></span>
<span id="A6.SS1.p6.pic1.2.22" class="ltx_p ltx_align_left"><span id="A6.SS1.p6.pic1.2.22.1" class="ltx_text ltx_font_typewriter" style="--ltx-fg-color:#000000;">Episode 3 (4--6 turns): return to Episode 1’s task; the TARGET turn is the user’s final request here.}</span></span>
<span id="A6.SS1.p6.pic1.2.23" class="ltx_p"><span id="A6.SS1.p6.pic1.2.23.1" class="ltx_text ltx_font_bold" style="--ltx-fg-color:#000000;">Requirements<span id="A6.SS1.p6.pic1.2.23.1.1" class="ltx_text ltx_font_medium"> — <span id="A6.SS1.p6.pic1.2.23.1.1.1" class="ltx_text ltx_font_italic">state placement and naturalness</span></span></span></span><span class="ltx_rule" style="width:100%;height:0.3pt;--ltx-fg-color:#999999;--ltx-bg-color:#999999;display:inline-block;"> </span>
<span id="A6.SS1.p6.pic1.2.24" class="ltx_p ltx_align_left"><span id="A6.SS1.p6.pic1.2.24.1" class="ltx_text ltx_font_typewriter" style="--ltx-fg-color:#000000;">1. Express State A naturally in its designated episode using the &quot;{preference_expression}&quot; style.</span></span>
<span id="A6.SS1.p6.pic1.2.25" class="ltx_p ltx_align_left"><span id="A6.SS1.p6.pic1.2.25.1" class="ltx_text ltx_font_typewriter" style="--ltx-fg-color:#000000;">2. Express decoy State B in its designated episode.</span></span>
<span id="A6.SS1.p6.pic1.2.26" class="ltx_p ltx_align_left"><span id="A6.SS1.p6.pic1.2.26.1" class="ltx_text ltx_font_typewriter" style="--ltx-fg-color:#000000;">3. The target turn must be a natural user request, not contrived.</span></span>
<span id="A6.SS1.p6.pic1.2.27" class="ltx_p ltx_align_left"><span id="A6.SS1.p6.pic1.2.27.1" class="ltx_text ltx_font_typewriter" style="--ltx-fg-color:#000000;">4. Make the conversation feel like a real personal-assistant interaction.</span></span>
<span id="A6.SS1.p6.pic1.2.28" class="ltx_p ltx_align_left"><span id="A6.SS1.p6.pic1.2.28.1" class="ltx_text ltx_font_typewriter" style="--ltx-fg-color:#000000;">5. Include enough context that both states are clearly established.</span></span>
</span></span></span></foreignobject></g></g></svg>