<span id="S5.SS1.p5.pic1.1" class="ltx_inline-block ltx_minipage ltx_align_bottom" style="width:33.5em;">
<span id="S5.SS1.p5.pic1.1.1" class="ltx_p"><span id="S5.SS1.p5.pic1.1.1.1" class="ltx_text ltx_font_bold" style="--ltx-fg-color:#000000;">Finding 1:<span id="S5.SS1.p5.pic1.1.1.1.1" class="ltx_text ltx_font_medium"> Current LLM-as-a-judge metrics are capable of relatively ranking programs but lack the internal calibration to assign absolute scores. While agentic approaches substantially boost LLMs’ ranking performance, they uniformly degrade absolute agreement, suggesting a fundamental trade-off between reasoning depth and absolute score calibration.</span></span></span>
