<svg id="A7.SS1.p2.pic1" class="ltx_picture" height="552.64" overflow="visible" version="1.1" viewbox="0 0 477.38 552.64" width="477.38"><g style="--ltx-stroke-color:#000000;--ltx-fill-color:#000000;" fill="#000000" stroke="#000000" stroke-width="0.4pt" transform="translate(0,552.64) matrix(1 0 0 -1 0 0)"><g style="--ltx-fill-color:#9999FF;" fill="#9999FF" fill-opacity="1.0"><path style="stroke:none" d="M 0 5.91 L 0 546.73 C 0 549.99 2.64 552.64 5.91 552.64 L 471.47 552.64 C 474.73 552.64 477.38 549.99 477.38 546.73 L 477.38 5.91 C 477.38 2.64 474.73 0 471.47 0 L 5.91 0 C 2.64 0 0 2.64 0 5.91 Z" /></g><g style="--ltx-fill-color:#F7F7FF;" fill="#F7F7FF" fill-opacity="1.0"><path style="stroke:none" d="M 1.97 5.91 L 1.97 513.84 L 475.41 513.84 L 475.41 5.91 C 475.41 3.73 473.65 1.97 471.47 1.97 L 5.91 1.97 C 3.73 1.97 1.97 3.73 1.97 5.91 Z" /></g><g fill-opacity="1.0" transform="matrix(1.0 0.0 0.0 1.0 21.65 536.35)"><foreignobject style="--ltx-fo-width:27.28em;--ltx-fo-height:0.75em;--ltx-fo-depth:1.2em;font-size:10pt;" height="26.98" overflow="visible" transform="matrix(1 0 0 -1 0 10.38)" width="377.48"><span class="ltx_foreignobject_container"><span class="ltx_foreignobject_content">
<span id="A7.SS1.p2.pic1.1" class="ltx_inline-block ltx_minipage ltx_align_bottom" style="width:27.28em;">
<span id="A7.SS1.p2.pic1.1.1" class="ltx_p"><span id="A7.SS1.p2.pic1.1.1.1" class="ltx_text ltx_font_bold" style="--ltx-fg-color:#FFFFFF;">Informal specification (natural language) <math id="A7.SS1.p2.pic1.m1" class="ltx_Math" alttext="s_{I}" display="inline" intent=":literal"><semantics><msub><mi style="--ltx-fg-color:#FFFFFF;" mathcolor="#FFFFFF">s</mi><mi style="--ltx-fg-color:#FFFFFF;" mathcolor="#FFFFFF">I</mi></msub><annotation encoding="application/x-tex">s_{I}</annotation></semantics></math> for Codeforces 1051-B</span></span>
</span></span></span></foreignobject></g><g fill-opacity="1.0" transform="matrix(1.0 0.0 0.0 1.0 21.65 130.01)"><foreignobject style="--ltx-fo-width:39.35em;--ltx-fo-height:26.89em;--ltx-fo-depth:8.4em;font-size:10pt;" height="488.26" overflow="visible" transform="matrix(1 0 0 -1 0 372.03)" width="544.49"><span class="ltx_foreignobject_container"><span class="ltx_foreignobject_content">
<span id="A7.SS1.p2.pic1.2" class="ltx_inline-block ltx_minipage ltx_align_bottom" style="width:39.35em;">
<span id="A7.SS1.p2.pic1.2.1" class="ltx_p"><span id="A7.SS1.p2.pic1.2.1.1" class="ltx_text ltx_font_bold" style="font-size:70%;--ltx-fg-color:#000000;">Problem link.<span id="A7.SS1.p2.pic1.2.1.1.1" class="ltx_text ltx_font_medium">  <a href="https://codeforces.com/problemset/problem/1051/B" title class="ltx_ref ltx_url ltx_font_typewriter">https://codeforces.com/problemset/problem/1051/B</a></span></span></span>
<span id="A7.SS1.p2.pic1.2.2" class="ltx_p"><span id="A7.SS1.p2.pic1.2.2.1" class="ltx_text" style="font-size:70%;--ltx-fg-color:#000000;">You are given a set of all integers from <math id="A7.SS1.p2.pic1.m2" class="ltx_Math" alttext="l" display="inline" intent=":literal"><semantics><mi style="--ltx-fg-color:#000000;" mathcolor="#000000">l</mi><annotation encoding="application/x-tex">l</annotation></semantics></math> to <math id="A7.SS1.p2.pic1.m3" class="ltx_Math" alttext="r" display="inline" intent=":literal"><semantics><mi style="--ltx-fg-color:#000000;" mathcolor="#000000">r</mi><annotation encoding="application/x-tex">r</annotation></semantics></math> inclusive, <math id="A7.SS1.p2.pic1.m4" class="ltx_Math" alttext="l&lt;r" display="inline" intent=":literal"><semantics><mrow><mi style="--ltx-fg-color:#000000;" mathcolor="#000000">l</mi><mo style="--ltx-fg-color:#000000;" mathcolor="#000000">&lt;</mo><mi style="--ltx-fg-color:#000000;" mathcolor="#000000">r</mi></mrow><annotation encoding="application/x-tex">l&lt;r</annotation></semantics></math>,
<math id="A7.SS1.p2.pic1.m5" class="ltx_Math" alttext="(r-l+1)\leq 3\cdot 10^{5}" display="inline" intent=":literal"><semantics><mrow><mrow><mo style="--ltx-fg-color:#000000;" mathcolor="#000000" stretchy="false">(</mo><mrow><mrow><mi style="--ltx-fg-color:#000000;" mathcolor="#000000">r</mi><mo style="--ltx-fg-color:#000000;" mathcolor="#000000">−</mo><mi style="--ltx-fg-color:#000000;" mathcolor="#000000">l</mi></mrow><mo style="--ltx-fg-color:#000000;" mathcolor="#000000">+</mo><mn style="--ltx-fg-color:#000000;" mathcolor="#000000">1</mn></mrow><mo style="--ltx-fg-color:#000000;" mathcolor="#000000" stretchy="false">)</mo></mrow><mo style="--ltx-fg-color:#000000;" mathcolor="#000000">≤</mo><mrow><mn style="--ltx-fg-color:#000000;" mathcolor="#000000">3</mn><mo style="--ltx-fg-color:#000000;" lspace="0.222em" mathcolor="#000000" rspace="0.222em">⋅</mo><msup><mn style="--ltx-fg-color:#000000;" mathcolor="#000000">10</mn><mn style="--ltx-fg-color:#000000;" mathcolor="#000000">5</mn></msup></mrow></mrow><annotation encoding="application/x-tex">(r-l+1)\leq 3\cdot 10^{5}</annotation></semantics></math> and <math id="A7.SS1.p2.pic1.m6" class="ltx_Math" alttext="(r-l)" display="inline" intent=":literal"><semantics><mrow><mo style="--ltx-fg-color:#000000;" mathcolor="#000000" stretchy="false">(</mo><mrow><mi style="--ltx-fg-color:#000000;" mathcolor="#000000">r</mi><mo style="--ltx-fg-color:#000000;" mathcolor="#000000">−</mo><mi style="--ltx-fg-color:#000000;" mathcolor="#000000">l</mi></mrow><mo style="--ltx-fg-color:#000000;" mathcolor="#000000" stretchy="false">)</mo></mrow><annotation encoding="application/x-tex">(r-l)</annotation></semantics></math> is always odd.</span></span>
<span id="A7.SS1.p2.pic1.2.3" class="ltx_p"><span id="A7.SS1.p2.pic1.2.3.1" class="ltx_text" style="font-size:70%;--ltx-fg-color:#000000;">You want to split these numbers into exactly <math id="A7.SS1.p2.pic1.m7" class="ltx_Math" alttext="\frac{r-l+1}{2}" display="inline" intent=":literal"><semantics><mfrac style="--ltx-fg-color:#000000;" mathcolor="#000000"><mrow><mrow><mi style="--ltx-fg-color:#000000;" mathcolor="#000000">r</mi><mo style="--ltx-fg-color:#000000;" mathcolor="#000000">−</mo><mi style="--ltx-fg-color:#000000;" mathcolor="#000000">l</mi></mrow><mo style="--ltx-fg-color:#000000;" mathcolor="#000000">+</mo><mn style="--ltx-fg-color:#000000;" mathcolor="#000000">1</mn></mrow><mn style="--ltx-fg-color:#000000;" mathcolor="#000000">2</mn></mfrac><annotation encoding="application/x-tex">\frac{r-l+1}{2}</annotation></semantics></math> pairs in
such a way that for each pair <math id="A7.SS1.p2.pic1.m8" class="ltx_Math" alttext="(i,j)" display="inline" intent=":literal"><semantics><mrow><mo style="--ltx-fg-color:#000000;" mathcolor="#000000" stretchy="false">(</mo><mi style="--ltx-fg-color:#000000;" mathcolor="#000000">i</mi><mo style="--ltx-fg-color:#000000;" mathcolor="#000000">,</mo><mi style="--ltx-fg-color:#000000;" mathcolor="#000000">j</mi><mo style="--ltx-fg-color:#000000;" mathcolor="#000000" stretchy="false">)</mo></mrow><annotation encoding="application/x-tex">(i,j)</annotation></semantics></math> the greatest common divisor of <math id="A7.SS1.p2.pic1.m9" class="ltx_Math" alttext="i" display="inline" intent=":literal"><semantics><mi style="--ltx-fg-color:#000000;" mathcolor="#000000">i</mi><annotation encoding="application/x-tex">i</annotation></semantics></math> and
<math id="A7.SS1.p2.pic1.m10" class="ltx_Math" alttext="j" display="inline" intent=":literal"><semantics><mi style="--ltx-fg-color:#000000;" mathcolor="#000000">j</mi><annotation encoding="application/x-tex">j</annotation></semantics></math> is equal to <math id="A7.SS1.p2.pic1.m11" class="ltx_Math" alttext="1" display="inline" intent=":literal"><semantics><mn style="--ltx-fg-color:#000000;" mathcolor="#000000">1</mn><annotation encoding="application/x-tex">1</annotation></semantics></math>. Each number should appear in exactly one of the pairs.</span></span>
<span id="A7.SS1.p2.pic1.2.4" class="ltx_p"><span id="A7.SS1.p2.pic1.2.4.1" class="ltx_text" style="font-size:70%;--ltx-fg-color:#000000;">Print the resulting pairs or output that no solution exists. If there are multiple solutions, print any of them.</span></span>
<span id="A7.SS1.p2.pic1.2.5" class="ltx_p"><span id="A7.SS1.p2.pic1.2.5.1" class="ltx_text ltx_font_bold" style="font-size:70%;--ltx-fg-color:#000000;">Input.<span id="A7.SS1.p2.pic1.2.5.1.1" class="ltx_text"></span></span></span>
<span id="A7.SS1.p2.pic1.2.6" class="ltx_p"><span id="A7.SS1.p2.pic1.2.6.1" class="ltx_text" style="font-size:70%;--ltx-fg-color:#000000;">The only line contains two integers <math id="A7.SS1.p2.pic1.m12" class="ltx_Math" alttext="l" display="inline" intent=":literal"><semantics><mi style="--ltx-fg-color:#000000;" mathcolor="#000000">l</mi><annotation encoding="application/x-tex">l</annotation></semantics></math> and <math id="A7.SS1.p2.pic1.m13" class="ltx_Math" alttext="r" display="inline" intent=":literal"><semantics><mi style="--ltx-fg-color:#000000;" mathcolor="#000000">r</mi><annotation encoding="application/x-tex">r</annotation></semantics></math> (<math id="A7.SS1.p2.pic1.m14" class="ltx_Math" alttext="1\leq l&lt;r\leq 10^{18}" display="inline" intent=":literal"><semantics><mrow><mn style="--ltx-fg-color:#000000;" mathcolor="#000000">1</mn><mo style="--ltx-fg-color:#000000;" mathcolor="#000000">≤</mo><mi style="--ltx-fg-color:#000000;" mathcolor="#000000">l</mi><mo style="--ltx-fg-color:#000000;" mathcolor="#000000">&lt;</mo><mi style="--ltx-fg-color:#000000;" mathcolor="#000000">r</mi><mo style="--ltx-fg-color:#000000;" mathcolor="#000000">≤</mo><msup><mn style="--ltx-fg-color:#000000;" mathcolor="#000000">10</mn><mn style="--ltx-fg-color:#000000;" mathcolor="#000000">18</mn></msup></mrow><annotation encoding="application/x-tex">1\leq l&lt;r\leq 10^{18}</annotation></semantics></math>, <math id="A7.SS1.p2.pic1.m15" class="ltx_Math" alttext="r-l+1\leq 3\cdot 10^{5}" display="inline" intent=":literal"><semantics><mrow><mrow><mrow><mi style="--ltx-fg-color:#000000;" mathcolor="#000000">r</mi><mo style="--ltx-fg-color:#000000;" mathcolor="#000000">−</mo><mi style="--ltx-fg-color:#000000;" mathcolor="#000000">l</mi></mrow><mo style="--ltx-fg-color:#000000;" mathcolor="#000000">+</mo><mn style="--ltx-fg-color:#000000;" mathcolor="#000000">1</mn></mrow><mo style="--ltx-fg-color:#000000;" mathcolor="#000000">≤</mo><mrow><mn style="--ltx-fg-color:#000000;" mathcolor="#000000">3</mn><mo style="--ltx-fg-color:#000000;" lspace="0.222em" mathcolor="#000000" rspace="0.222em">⋅</mo><msup><mn style="--ltx-fg-color:#000000;" mathcolor="#000000">10</mn><mn style="--ltx-fg-color:#000000;" mathcolor="#000000">5</mn></msup></mrow></mrow><annotation encoding="application/x-tex">r-l+1\leq 3\cdot 10^{5}</annotation></semantics></math>, <math id="A7.SS1.p2.pic1.m16" class="ltx_Math" alttext="(r-l)" display="inline" intent=":literal"><semantics><mrow><mo style="--ltx-fg-color:#000000;" mathcolor="#000000" stretchy="false">(</mo><mrow><mi style="--ltx-fg-color:#000000;" mathcolor="#000000">r</mi><mo style="--ltx-fg-color:#000000;" mathcolor="#000000">−</mo><mi style="--ltx-fg-color:#000000;" mathcolor="#000000">l</mi></mrow><mo style="--ltx-fg-color:#000000;" mathcolor="#000000" stretchy="false">)</mo></mrow><annotation encoding="application/x-tex">(r-l)</annotation></semantics></math> is odd).</span></span>
<span id="A7.SS1.p2.pic1.2.7" class="ltx_p"><span id="A7.SS1.p2.pic1.2.7.1" class="ltx_text ltx_font_bold" style="font-size:70%;--ltx-fg-color:#000000;">Output.<span id="A7.SS1.p2.pic1.2.7.1.1" class="ltx_text"></span></span></span>
<span id="A7.SS1.p2.pic1.2.8" class="ltx_p"><span id="A7.SS1.p2.pic1.2.8.1" class="ltx_text" style="font-size:70%;--ltx-fg-color:#000000;">If any solution exists, print “YES” in the first line. Each of the next <math id="A7.SS1.p2.pic1.m17" class="ltx_Math" alttext="\frac{r-l+1}{2}" display="inline" intent=":literal"><semantics><mfrac style="--ltx-fg-color:#000000;" mathcolor="#000000"><mrow><mrow><mi style="--ltx-fg-color:#000000;" mathcolor="#000000">r</mi><mo style="--ltx-fg-color:#000000;" mathcolor="#000000">−</mo><mi style="--ltx-fg-color:#000000;" mathcolor="#000000">l</mi></mrow><mo style="--ltx-fg-color:#000000;" mathcolor="#000000">+</mo><mn style="--ltx-fg-color:#000000;" mathcolor="#000000">1</mn></mrow><mn style="--ltx-fg-color:#000000;" mathcolor="#000000">2</mn></mfrac><annotation encoding="application/x-tex">\frac{r-l+1}{2}</annotation></semantics></math> lines should contain some pair of integers. GCD of numbers in each pair should be equal to <math id="A7.SS1.p2.pic1.m18" class="ltx_Math" alttext="1" display="inline" intent=":literal"><semantics><mn style="--ltx-fg-color:#000000;" mathcolor="#000000">1</mn><annotation encoding="application/x-tex">1</annotation></semantics></math>. All <math id="A7.SS1.p2.pic1.m19" class="ltx_Math" alttext="(r-l+1)" display="inline" intent=":literal"><semantics><mrow><mo style="--ltx-fg-color:#000000;" mathcolor="#000000" stretchy="false">(</mo><mrow><mrow><mi style="--ltx-fg-color:#000000;" mathcolor="#000000">r</mi><mo style="--ltx-fg-color:#000000;" mathcolor="#000000">−</mo><mi style="--ltx-fg-color:#000000;" mathcolor="#000000">l</mi></mrow><mo style="--ltx-fg-color:#000000;" mathcolor="#000000">+</mo><mn style="--ltx-fg-color:#000000;" mathcolor="#000000">1</mn></mrow><mo style="--ltx-fg-color:#000000;" mathcolor="#000000" stretchy="false">)</mo></mrow><annotation encoding="application/x-tex">(r-l+1)</annotation></semantics></math> numbers should be pairwise distinct and should have values from <math id="A7.SS1.p2.pic1.m20" class="ltx_Math" alttext="l" display="inline" intent=":literal"><semantics><mi style="--ltx-fg-color:#000000;" mathcolor="#000000">l</mi><annotation encoding="application/x-tex">l</annotation></semantics></math> to <math id="A7.SS1.p2.pic1.m21" class="ltx_Math" alttext="r" display="inline" intent=":literal"><semantics><mi style="--ltx-fg-color:#000000;" mathcolor="#000000">r</mi><annotation encoding="application/x-tex">r</annotation></semantics></math> inclusive.</span></span>
<span id="A7.SS1.p2.pic1.2.9" class="ltx_p"><span id="A7.SS1.p2.pic1.2.9.1" class="ltx_text" style="font-size:70%;--ltx-fg-color:#000000;">If there are multiple solutions, print any of them.</span></span>
<span id="A7.SS1.p2.pic1.2.10" class="ltx_p"><span id="A7.SS1.p2.pic1.2.10.1" class="ltx_text" style="font-size:70%;--ltx-fg-color:#000000;">If there exists no solution, print “NO”.</span></span>
<span id="A7.SS1.p2.pic1.2.11" class="ltx_p"><span id="A7.SS1.p2.pic1.2.11.1" class="ltx_text ltx_font_bold" style="font-size:70%;--ltx-fg-color:#000000;">Example.<span id="A7.SS1.p2.pic1.2.11.1.1" class="ltx_text"></span></span></span>
<span id="A7.SS1.p2.pic1.2.12" class="ltx_p ltx_align_left"><span id="A7.SS1.p2.pic1.2.12.1" class="ltx_text ltx_font_typewriter" style="font-size:70%;--ltx-fg-color:#000000;">Input:
<br class="ltx_break">1 8
<br class="ltx_break" style="--ltx-break-space:4.0pt;">
Output:
<br class="ltx_break">YES
<br class="ltx_break">2 7
<br class="ltx_break">4 1
<br class="ltx_break">3 8
<br class="ltx_break">6 5
</span></span>
</span></span></span></foreignobject></g></g></svg>