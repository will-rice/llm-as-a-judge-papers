<span id="A3.I9.i1.p1.1" class="ltx_p"><span id="A3.I9.i1.p1.1.1" class="ltx_text ltx_font_typewriter" style="font-size:90%;--ltx-fg-color:#000000;">**Erroneous Span:** ‘‘{span_a}’’
</span></span>
</span></span>
<span id="A3.I9.i2" class="ltx_item" style="list-style-type:none;"><span class="ltx_tag ltx_tag_item">-</span> 
