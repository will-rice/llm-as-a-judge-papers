<svg id="S15.SS0.SSS0.Px18.p2.pic1" class="ltx_picture" height="594.65" overflow="visible" version="1.1" viewbox="0 0 477.38 594.65" width="477.38"><g style="--ltx-stroke-color:#000000;--ltx-fill-color:#000000;" fill="#000000" stroke="#000000" stroke-width="0.4pt" transform="translate(0,594.65) matrix(1 0 0 -1 0 0)"><g style="--ltx-fill-color:#BF0000;" fill="#BF0000" fill-opacity="1.0"><path style="stroke:none" d="M 0 5.91 L 0 588.74 C 0 592 2.64 594.65 5.91 594.65 L 471.47 594.65 C 474.73 594.65 477.38 592 477.38 588.74 L 477.38 5.91 C 477.38 2.64 474.73 0 471.47 0 L 5.91 0 C 2.64 0 0 2.64 0 5.91 Z" /></g><g style="--ltx-fill-color:#FFF2F2;" fill="#FFF2F2" fill-opacity="1.0"><path style="stroke:none" d="M 1.97 5.91 L 1.97 569 L 475.41 569 L 475.41 5.91 C 475.41 3.73 473.65 1.97 471.47 1.97 L 5.91 1.97 C 3.73 1.97 1.97 3.73 1.97 5.91 Z" /></g><g fill-opacity="1.0" transform="matrix(1.0 0.0 0.0 1.0 21.65 578.36)"><foreignobject style="--ltx-fo-width:31.37em;--ltx-fo-height:0.75em;--ltx-fo-depth:0.25em;font-size:10pt;" height="13.84" overflow="visible" transform="matrix(1 0 0 -1 0 10.38)" width="434.07"><span class="ltx_foreignobject_container"><span class="ltx_foreignobject_content">
<span id="S15.SS0.SSS0.Px18.p2.pic1.1" class="ltx_inline-block ltx_minipage ltx_align_bottom" style="width:31.37em;">
<span id="S15.SS0.SSS0.Px18.p2.pic1.1.1" class="ltx_p"><a href="https://codeforces.com/problemset/problem/2000/D" title class="ltx_ref ltx_href" style="--ltx-fg-color:#FFFFFF;">Example Two Pointers Problem (Rated 1200)</a></span>
</span></span></span></foreignobject></g><g fill-opacity="1.0" transform="matrix(1.0 0.0 0.0 1.0 21.65 16.47)"><foreignobject style="--ltx-fo-width:31.37em;--ltx-fo-height:39.08em;--ltx-fo-depth:0.19em;font-size:10pt;" height="543.42" overflow="visible" transform="matrix(1 0 0 -1 0 540.73)" width="434.07"><span class="ltx_foreignobject_container"><span class="ltx_foreignobject_content">
<span id="S15.SS0.SSS0.Px18.p2.pic1.2" class="ltx_inline-block ltx_minipage ltx_align_bottom" style="width:31.37em;">
<span id="S15.SS0.SSS0.Px18.p2.pic1.2.1" class="ltx_p"><span id="S15.SS0.SSS0.Px18.p2.pic1.2.1.1" class="ltx_text" style="--ltx-fg-color:#000000;">Vlad found a strip of <math id="S15.SS0.SSS0.Px18.p2.pic1.m1" class="ltx_Math" alttext="n" display="inline" intent=":literal"><semantics><mi style="--ltx-fg-color:#000000;" mathcolor="#000000">n</mi><annotation encoding="application/x-tex">n</annotation></semantics></math> cells, numbered from left to right from <math id="S15.SS0.SSS0.Px18.p2.pic1.m2" class="ltx_Math" alttext="1" display="inline" intent=":literal"><semantics><mn style="--ltx-fg-color:#000000;" mathcolor="#000000">1</mn><annotation encoding="application/x-tex">1</annotation></semantics></math> to <math id="S15.SS0.SSS0.Px18.p2.pic1.m3" class="ltx_Math" alttext="n" display="inline" intent=":literal"><semantics><mi style="--ltx-fg-color:#000000;" mathcolor="#000000">n</mi><annotation encoding="application/x-tex">n</annotation></semantics></math>. In the <math id="S15.SS0.SSS0.Px18.p2.pic1.m4" class="ltx_Math" alttext="i" display="inline" intent=":literal"><semantics><mi style="--ltx-fg-color:#000000;" mathcolor="#000000">i</mi><annotation encoding="application/x-tex">i</annotation></semantics></math>-th cell, there is a positive integer <math id="S15.SS0.SSS0.Px18.p2.pic1.m5" class="ltx_Math" alttext="a_{i}" display="inline" intent=":literal"><semantics><msub><mi style="--ltx-fg-color:#000000;" mathcolor="#000000">a</mi><mi style="--ltx-fg-color:#000000;" mathcolor="#000000">i</mi></msub><annotation encoding="application/x-tex">a_{i}</annotation></semantics></math> and a letter <math id="S15.SS0.SSS0.Px18.p2.pic1.m6" class="ltx_Math" alttext="s_{i}" display="inline" intent=":literal"><semantics><msub><mi style="--ltx-fg-color:#000000;" mathcolor="#000000">s</mi><mi style="--ltx-fg-color:#000000;" mathcolor="#000000">i</mi></msub><annotation encoding="application/x-tex">s_{i}</annotation></semantics></math>, where all <math id="S15.SS0.SSS0.Px18.p2.pic1.m7" class="ltx_Math" alttext="s_{i}" display="inline" intent=":literal"><semantics><msub><mi style="--ltx-fg-color:#000000;" mathcolor="#000000">s</mi><mi style="--ltx-fg-color:#000000;" mathcolor="#000000">i</mi></msub><annotation encoding="application/x-tex">s_{i}</annotation></semantics></math> are either <span id="S15.SS0.SSS0.Px18.p2.pic1.2.1.1.1" class="ltx_text ltx_font_typewriter">‘L’</span> or <span id="S15.SS0.SSS0.Px18.p2.pic1.2.1.1.2" class="ltx_text ltx_font_typewriter">‘R’</span>. 
<br class="ltx_break">
<br class="ltx_break">Vlad invites you to try to score the maximum possible points by performing any (possibly zero) number of operations. 
<br class="ltx_break">
<br class="ltx_break">In one operation, you can choose two indices <math id="S15.SS0.SSS0.Px18.p2.pic1.m8" class="ltx_Math" alttext="l" display="inline" intent=":literal"><semantics><mi style="--ltx-fg-color:#000000;" mathcolor="#000000">l</mi><annotation encoding="application/x-tex">l</annotation></semantics></math> and <math id="S15.SS0.SSS0.Px18.p2.pic1.m9" class="ltx_Math" alttext="r\ (1\leq l&lt;r\leq n)" display="inline" intent=":literal"><semantics><mrow><mi style="--ltx-fg-color:#000000;" mathcolor="#000000">r</mi><mo lspace="0.500em">⁡</mo><mrow><mo style="--ltx-fg-color:#000000;" mathcolor="#000000" stretchy="false">(</mo><mrow><mn style="--ltx-fg-color:#000000;" mathcolor="#000000">1</mn><mo style="--ltx-fg-color:#000000;" mathcolor="#000000">≤</mo><mi style="--ltx-fg-color:#000000;" mathcolor="#000000">l</mi><mo style="--ltx-fg-color:#000000;" mathcolor="#000000">&lt;</mo><mi style="--ltx-fg-color:#000000;" mathcolor="#000000">r</mi><mo style="--ltx-fg-color:#000000;" mathcolor="#000000">≤</mo><mi style="--ltx-fg-color:#000000;" mathcolor="#000000">n</mi></mrow><mo style="--ltx-fg-color:#000000;" mathcolor="#000000" stretchy="false">)</mo></mrow></mrow><annotation encoding="application/x-tex">r\ (1\leq l&lt;r\leq n)</annotation></semantics></math> such that <math id="S15.SS0.SSS0.Px18.p2.pic1.m10" class="ltx_Math" alttext="s_{l}=\texttt{`L&#39;}" display="inline" intent=":literal"><semantics><mrow><msub><mi style="--ltx-fg-color:#000000;" mathcolor="#000000">s</mi><mi style="--ltx-fg-color:#000000;" mathcolor="#000000">l</mi></msub><mo style="--ltx-fg-color:#000000;" mathcolor="#000000">=</mo><mtext style="--ltx-fg-color:#000000;" class="ltx_mathvariant_monospace" mathcolor="#000000">‘L’</mtext></mrow><annotation encoding="application/x-tex">s_{l}=\texttt{`L&#39;}</annotation></semantics></math> and <math id="S15.SS0.SSS0.Px18.p2.pic1.m11" class="ltx_Math" alttext="s_{r}=\texttt{`R&#39;}" display="inline" intent=":literal"><semantics><mrow><msub><mi style="--ltx-fg-color:#000000;" mathcolor="#000000">s</mi><mi style="--ltx-fg-color:#000000;" mathcolor="#000000">r</mi></msub><mo style="--ltx-fg-color:#000000;" mathcolor="#000000">=</mo><mtext style="--ltx-fg-color:#000000;" class="ltx_mathvariant_monospace" mathcolor="#000000">‘R’</mtext></mrow><annotation encoding="application/x-tex">s_{r}=\texttt{`R&#39;}</annotation></semantics></math> and do the following:</span></span>
<span id="S15.I12" class="ltx_itemize">
<span id="S15.I12.i1" class="ltx_item" style="list-style-type:none;"><span class="ltx_tag ltx_tag_item">•</span> 
<span id="S15.I12.i1.p1" class="ltx_para">
<span id="S15.I12.i1.p1.1" class="ltx_p"><span id="S15.I12.i1.p1.1.1" class="ltx_text" style="--ltx-fg-color:#000000;">add </span><math id="S15.I12.i1.p1.m1" class="ltx_Math" alttext="a_{l}+a_{l+1}+\dots+a_{r-1}+a_{r}" display="inline" intent=":literal"><semantics><mrow><msub><mi style="--ltx-fg-color:#000000;" mathcolor="#000000">a</mi><mi style="--ltx-fg-color:#000000;" mathcolor="#000000">l</mi></msub><mo style="--ltx-fg-color:#000000;" mathcolor="#000000">+</mo><msub><mi style="--ltx-fg-color:#000000;" mathcolor="#000000">a</mi><mrow><mi style="--ltx-fg-color:#000000;" mathcolor="#000000">l</mi><mo style="--ltx-fg-color:#000000;" mathcolor="#000000">+</mo><mn style="--ltx-fg-color:#000000;" mathcolor="#000000">1</mn></mrow></msub><mo style="--ltx-fg-color:#000000;" mathcolor="#000000">+</mo><mi style="--ltx-fg-color:#000000;" mathcolor="#000000" mathvariant="normal">⋯</mi><mo style="--ltx-fg-color:#000000;" mathcolor="#000000">+</mo><msub><mi style="--ltx-fg-color:#000000;" mathcolor="#000000">a</mi><mrow><mi style="--ltx-fg-color:#000000;" mathcolor="#000000">r</mi><mo style="--ltx-fg-color:#000000;" mathcolor="#000000">−</mo><mn style="--ltx-fg-color:#000000;" mathcolor="#000000">1</mn></mrow></msub><mo style="--ltx-fg-color:#000000;" mathcolor="#000000">+</mo><msub><mi style="--ltx-fg-color:#000000;" mathcolor="#000000">a</mi><mi style="--ltx-fg-color:#000000;" mathcolor="#000000">r</mi></msub></mrow><annotation encoding="application/x-tex">a_{l}+a_{l+1}+\dots+a_{r-1}+a_{r}</annotation></semantics></math><span id="S15.I12.i1.p1.1.2" class="ltx_text" style="--ltx-fg-color:#000000;"> points to the current score;</span></span>
</span></span>
<span id="S15.I12.i2" class="ltx_item" style="list-style-type:none;"><span class="ltx_tag ltx_tag_item">•</span> 
<span id="S15.I12.i2.p1" class="ltx_para">
<span id="S15.I12.i2.p1.1" class="ltx_p"><span id="S15.I12.i2.p1.1.1" class="ltx_text" style="--ltx-fg-color:#000000;">replace </span><math id="S15.I12.i2.p1.m1" class="ltx_Math" alttext="s_{i}" display="inline" intent=":literal"><semantics><msub><mi style="--ltx-fg-color:#000000;" mathcolor="#000000">s</mi><mi style="--ltx-fg-color:#000000;" mathcolor="#000000">i</mi></msub><annotation encoding="application/x-tex">s_{i}</annotation></semantics></math><span id="S15.I12.i2.p1.1.2" class="ltx_text" style="--ltx-fg-color:#000000;"> with </span><span id="S15.I12.i2.p1.1.3" class="ltx_text ltx_font_typewriter" style="--ltx-fg-color:#000000;">‘.’</span><span id="S15.I12.i2.p1.1.4" class="ltx_text" style="--ltx-fg-color:#000000;"> for all </span><math id="S15.I12.i2.p1.m2" class="ltx_Math" alttext="l\leq i\leq r" display="inline" intent=":literal"><semantics><mrow><mi style="--ltx-fg-color:#000000;" mathcolor="#000000">l</mi><mo style="--ltx-fg-color:#000000;" mathcolor="#000000">≤</mo><mi style="--ltx-fg-color:#000000;" mathcolor="#000000">i</mi><mo style="--ltx-fg-color:#000000;" mathcolor="#000000">≤</mo><mi style="--ltx-fg-color:#000000;" mathcolor="#000000">r</mi></mrow><annotation encoding="application/x-tex">l\leq i\leq r</annotation></semantics></math><span id="S15.I12.i2.p1.1.5" class="ltx_text" style="--ltx-fg-color:#000000;">, meaning you can no longer choose these indices.</span></span>
</span></span>
</span>
<span id="S15.SS0.SSS0.Px18.p2.pic1.2.2" class="ltx_p"><span id="S15.SS0.SSS0.Px18.p2.pic1.2.2.1" class="ltx_text" style="--ltx-fg-color:#000000;">What is the maximum score that can be achieved? 
<br class="ltx_break">
<br class="ltx_break"><span id="S15.SS0.SSS0.Px18.p2.pic1.2.2.1.1" class="ltx_text ltx_font_bold">Input</span> 
<br class="ltx_break">The first line contains one integer <math id="S15.SS0.SSS0.Px18.p2.pic1.m12" class="ltx_Math" alttext="t\ (1\leq t\leq 10^{4})" display="inline" intent=":literal"><semantics><mrow><mi style="--ltx-fg-color:#000000;" mathcolor="#000000">t</mi><mo lspace="0.500em">⁡</mo><mrow><mo style="--ltx-fg-color:#000000;" mathcolor="#000000" stretchy="false">(</mo><mrow><mn style="--ltx-fg-color:#000000;" mathcolor="#000000">1</mn><mo style="--ltx-fg-color:#000000;" mathcolor="#000000">≤</mo><mi style="--ltx-fg-color:#000000;" mathcolor="#000000">t</mi><mo style="--ltx-fg-color:#000000;" mathcolor="#000000">≤</mo><msup><mn style="--ltx-fg-color:#000000;" mathcolor="#000000">10</mn><mn style="--ltx-fg-color:#000000;" mathcolor="#000000">4</mn></msup></mrow><mo style="--ltx-fg-color:#000000;" mathcolor="#000000" stretchy="false">)</mo></mrow></mrow><annotation encoding="application/x-tex">t\ (1\leq t\leq 10^{4})</annotation></semantics></math>—the number of test cases. 
<br class="ltx_break">
<br class="ltx_break">The first line of each test case contains one integer <math id="S15.SS0.SSS0.Px18.p2.pic1.m13" class="ltx_Math" alttext="n\ (2\leq n\leq 2\cdot 10^{5})" display="inline" intent=":literal"><semantics><mrow><mi style="--ltx-fg-color:#000000;" mathcolor="#000000">n</mi><mo lspace="0.500em">⁡</mo><mrow><mo style="--ltx-fg-color:#000000;" mathcolor="#000000" stretchy="false">(</mo><mrow><mn style="--ltx-fg-color:#000000;" mathcolor="#000000">2</mn><mo style="--ltx-fg-color:#000000;" mathcolor="#000000">≤</mo><mi style="--ltx-fg-color:#000000;" mathcolor="#000000">n</mi><mo style="--ltx-fg-color:#000000;" mathcolor="#000000">≤</mo><mrow><mn style="--ltx-fg-color:#000000;" mathcolor="#000000">2</mn><mo style="--ltx-fg-color:#000000;" lspace="0.222em" mathcolor="#000000" rspace="0.222em">⋅</mo><msup><mn style="--ltx-fg-color:#000000;" mathcolor="#000000">10</mn><mn style="--ltx-fg-color:#000000;" mathcolor="#000000">5</mn></msup></mrow></mrow><mo style="--ltx-fg-color:#000000;" mathcolor="#000000" stretchy="false">)</mo></mrow></mrow><annotation encoding="application/x-tex">n\ (2\leq n\leq 2\cdot 10^{5})</annotation></semantics></math>—the length of the strip. 
<br class="ltx_break">
<br class="ltx_break">The second line of each test case contains <math id="S15.SS0.SSS0.Px18.p2.pic1.m14" class="ltx_Math" alttext="n" display="inline" intent=":literal"><semantics><mi style="--ltx-fg-color:#000000;" mathcolor="#000000">n</mi><annotation encoding="application/x-tex">n</annotation></semantics></math> integers <math id="S15.SS0.SSS0.Px18.p2.pic1.m15" class="ltx_Math" alttext="a_{1},a_{2},\dots,a_{2}\ (1\leq a_{i}\leq 10^{5})" display="inline" intent=":literal"><semantics><mrow><msub><mi style="--ltx-fg-color:#000000;" mathcolor="#000000">a</mi><mn style="--ltx-fg-color:#000000;" mathcolor="#000000">1</mn></msub><mo style="--ltx-fg-color:#000000;" mathcolor="#000000">,</mo><msub><mi style="--ltx-fg-color:#000000;" mathcolor="#000000">a</mi><mn style="--ltx-fg-color:#000000;" mathcolor="#000000">2</mn></msub><mo style="--ltx-fg-color:#000000;" mathcolor="#000000">,</mo><mi style="--ltx-fg-color:#000000;" mathcolor="#000000" mathvariant="normal">…</mi><mo style="--ltx-fg-color:#000000;" mathcolor="#000000">,</mo><mrow><msub><mi style="--ltx-fg-color:#000000;" mathcolor="#000000">a</mi><mn style="--ltx-fg-color:#000000;" mathcolor="#000000">2</mn></msub><mo lspace="0em" rspace="0em">​</mo><mrow><mo style="--ltx-fg-color:#000000;" mathcolor="#000000" stretchy="false">(</mo><mrow><mn style="--ltx-fg-color:#000000;" mathcolor="#000000">1</mn><mo style="--ltx-fg-color:#000000;" mathcolor="#000000">≤</mo><msub><mi style="--ltx-fg-color:#000000;" mathcolor="#000000">a</mi><mi style="--ltx-fg-color:#000000;" mathcolor="#000000">i</mi></msub><mo style="--ltx-fg-color:#000000;" mathcolor="#000000">≤</mo><msup><mn style="--ltx-fg-color:#000000;" mathcolor="#000000">10</mn><mn style="--ltx-fg-color:#000000;" mathcolor="#000000">5</mn></msup></mrow><mo style="--ltx-fg-color:#000000;" mathcolor="#000000" stretchy="false">)</mo></mrow></mrow></mrow><annotation encoding="application/x-tex">a_{1},a_{2},\dots,a_{2}\ (1\leq a_{i}\leq 10^{5})</annotation></semantics></math>—the numbers written on the strip. 
<br class="ltx_break">
<br class="ltx_break">The third line of each test case contains a string <math id="S15.SS0.SSS0.Px18.p2.pic1.m16" class="ltx_Math" alttext="s" display="inline" intent=":literal"><semantics><mi style="--ltx-fg-color:#000000;" mathcolor="#000000">s</mi><annotation encoding="application/x-tex">s</annotation></semantics></math> of <math id="S15.SS0.SSS0.Px18.p2.pic1.m17" class="ltx_Math" alttext="n" display="inline" intent=":literal"><semantics><mi style="--ltx-fg-color:#000000;" mathcolor="#000000">n</mi><annotation encoding="application/x-tex">n</annotation></semantics></math> characters <span id="S15.SS0.SSS0.Px18.p2.pic1.2.2.1.2" class="ltx_text ltx_font_typewriter">‘L’</span> and <span id="S15.SS0.SSS0.Px18.p2.pic1.2.2.1.3" class="ltx_text ltx_font_typewriter">‘R’</span>. 
<br class="ltx_break">
<br class="ltx_break">It is guaranteed that the sum of the values of <math id="S15.SS0.SSS0.Px18.p2.pic1.m18" class="ltx_Math" alttext="n" display="inline" intent=":literal"><semantics><mi style="--ltx-fg-color:#000000;" mathcolor="#000000">n</mi><annotation encoding="application/x-tex">n</annotation></semantics></math> across all test cases does not exceed <math id="S15.SS0.SSS0.Px18.p2.pic1.m19" class="ltx_Math" alttext="2\cdot 10^{5}" display="inline" intent=":literal"><semantics><mrow><mn style="--ltx-fg-color:#000000;" mathcolor="#000000">2</mn><mo style="--ltx-fg-color:#000000;" lspace="0.222em" mathcolor="#000000" rspace="0.222em">⋅</mo><msup><mn style="--ltx-fg-color:#000000;" mathcolor="#000000">10</mn><mn style="--ltx-fg-color:#000000;" mathcolor="#000000">5</mn></msup></mrow><annotation encoding="application/x-tex">2\cdot 10^{5}</annotation></semantics></math>, 
<br class="ltx_break">
<br class="ltx_break"><span id="S15.SS0.SSS0.Px18.p2.pic1.2.2.1.4" class="ltx_text ltx_font_bold">Output</span> 
<br class="ltx_break">For each test case, output one integer—the maximum possible number of points that can be scored.</span></span>
</span></span></span></foreignobject></g></g></svg>