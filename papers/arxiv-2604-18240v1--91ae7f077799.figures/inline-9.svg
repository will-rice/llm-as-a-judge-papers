<svg id="A1.SS11.SSS1.p5.pic1" class="ltx_picture" height="1272.52" overflow="visible" version="1.1" viewbox="0 0 653.15 1272.52" width="653.15"><g style="--ltx-stroke-color:#000000;--ltx-fill-color:#000000;" fill="#000000" stroke="#000000" stroke-width="0.4pt" transform="translate(0,1272.52) matrix(1 0 0 -1 0 0)"><g style="--ltx-fill-color:#29CCCC;" fill="#29CCCC" fill-opacity="1.0"><path style="stroke:none" d="M 0 0 L 0 1272.52 L 653.15 1272.52 L 653.15 0 Z" /></g><g style="--ltx-fill-color:#E6FFFF;" fill="#E6FFFF" fill-opacity="1.0"><path style="stroke:none" d="M 1.38 1.38 L 1.38 1249.43 L 651.77 1249.43 L 651.77 1.38 Z" /></g><g style="--ltx-fill-color:#80FFFF;" fill="#80FFFF" fill-opacity="1.0"><path style="stroke:none" d="M 1.38 1249.43 L 1.38 1271.14 L 651.77 1271.14 L 651.77 1249.43 Z" /></g><g fill-opacity="1.0" transform="matrix(1.0 0.0 0.0 1.0 21.07 1256.82)"><foreignobject style="--ltx-fo-width:38.4em;--ltx-fo-height:0.75em;--ltx-fo-depth:0.25em;font-size:10pt;" height="13.84" overflow="visible" transform="matrix(1 0 0 -1 0 10.38)" width="531.35"><span class="ltx_foreignobject_container"><span class="ltx_foreignobject_content">
<span id="A1.SS11.SSS1.p5.pic1.1" class="ltx_inline-block ltx_minipage ltx_align_bottom" style="width:38.4em;">
<span id="A1.SS11.SSS1.p5.pic1.1.1" class="ltx_p"><span id="A1.SS11.SSS1.p5.pic1.1.1.1" class="ltx_text ltx_font_bold" style="--ltx-fg-color:#000000;">Agent-as-a-Judge Prompt (Wide)</span></span>
</span></span></span></foreignobject></g><g fill-opacity="1.0" transform="matrix(1.0 0.0 0.0 1.0 21.07 15.89)"><foreignobject style="--ltx-fo-width:44.16em;--ltx-fo-height:88.3em;--ltx-fo-depth:0.19em;font-size:10pt;" height="1224.44" overflow="visible" transform="matrix(1 0 0 -1 0 1221.74)" width="611.05"><span class="ltx_foreignobject_container"><span class="ltx_foreignobject_content">
<span id="A1.SS11.SSS1.p5.pic1.2" class="ltx_inline-block ltx_minipage ltx_align_bottom" style="width:44.16em;">
<span id="A1.SS11.SSS1.p5.pic1.2.1" class="ltx_p"><span id="A1.SS11.SSS1.p5.pic1.2.1.1" class="ltx_text" style="--ltx-fg-color:#000000;"># Agent-as-a-Judge Task
<br class="ltx_break"></span></span>
<span id="A1.SS11.SSS1.p5.pic1.2.2" class="ltx_p"><span id="A1.SS11.SSS1.p5.pic1.2.2.1" class="ltx_text" style="--ltx-fg-color:#000000;">You will verify the factual correctness of ONE Single-Row extracted from a Response.
<br class="ltx_break">You MUST follow all instructions precisely and avoid any interpretation that goes beyond what is explicitly required.
<br class="ltx_break"></span></span>
<span id="A1.SS11.SSS1.p5.pic1.2.3" class="ltx_p"><span id="A1.SS11.SSS1.p5.pic1.2.3.1" class="ltx_text" style="--ltx-fg-color:#000000;">—————————————————
<br class="ltx_break">## Provided Inputs
<br class="ltx_break"></span></span>
<span id="A1.SS11.SSS1.p5.pic1.2.4" class="ltx_p"><span id="A1.SS11.SSS1.p5.pic1.2.4.1" class="ltx_text" style="--ltx-fg-color:#000000;">### Query
<br class="ltx_break"></span></span>
<span id="A1.SS11.SSS1.p5.pic1.2.5" class="ltx_p"><span id="A1.SS11.SSS1.p5.pic1.2.5.1" class="ltx_text" style="--ltx-fg-color:#000000;">[The Start of Query]
<br class="ltx_break"></span></span>
<span id="A1.SS11.SSS1.p5.pic1.2.6" class="ltx_p"><span id="A1.SS11.SSS1.p5.pic1.2.6.1" class="ltx_text" style="--ltx-fg-color:#000000;">{query}
<br class="ltx_break"></span></span>
<span id="A1.SS11.SSS1.p5.pic1.2.7" class="ltx_p"><span id="A1.SS11.SSS1.p5.pic1.2.7.1" class="ltx_text" style="--ltx-fg-color:#000000;">[The End of Query]
<br class="ltx_break"></span></span>
<span id="A1.SS11.SSS1.p5.pic1.2.8" class="ltx_p"><span id="A1.SS11.SSS1.p5.pic1.2.8.1" class="ltx_text" style="--ltx-fg-color:#000000;">### Response
<br class="ltx_break"></span></span>
<span id="A1.SS11.SSS1.p5.pic1.2.9" class="ltx_p"><span id="A1.SS11.SSS1.p5.pic1.2.9.1" class="ltx_text" style="--ltx-fg-color:#000000;">[The Start of Response]
<br class="ltx_break"></span></span>
<span id="A1.SS11.SSS1.p5.pic1.2.10" class="ltx_p"><span id="A1.SS11.SSS1.p5.pic1.2.10.1" class="ltx_text" style="--ltx-fg-color:#000000;">{response}
<br class="ltx_break"></span></span>
<span id="A1.SS11.SSS1.p5.pic1.2.11" class="ltx_p"><span id="A1.SS11.SSS1.p5.pic1.2.11.1" class="ltx_text" style="--ltx-fg-color:#000000;">[The End of Response]
<br class="ltx_break"></span></span>
<span id="A1.SS11.SSS1.p5.pic1.2.12" class="ltx_p"><span id="A1.SS11.SSS1.p5.pic1.2.12.1" class="ltx_text" style="--ltx-fg-color:#000000;">### Single-Row (One extracted item)
<br class="ltx_break"></span></span>
<span id="A1.SS11.SSS1.p5.pic1.2.13" class="ltx_p"><span id="A1.SS11.SSS1.p5.pic1.2.13.1" class="ltx_text" style="--ltx-fg-color:#000000;">[The Start of Single-Row]
<br class="ltx_break"></span></span>
<span id="A1.SS11.SSS1.p5.pic1.2.14" class="ltx_p"><span id="A1.SS11.SSS1.p5.pic1.2.14.1" class="ltx_text" style="--ltx-fg-color:#000000;">{single_row}
<br class="ltx_break"></span></span>
<span id="A1.SS11.SSS1.p5.pic1.2.15" class="ltx_p"><span id="A1.SS11.SSS1.p5.pic1.2.15.1" class="ltx_text" style="--ltx-fg-color:#000000;">[The End of Single-Row]
<br class="ltx_break"></span></span>
<span id="A1.SS11.SSS1.p5.pic1.2.16" class="ltx_p"><span id="A1.SS11.SSS1.p5.pic1.2.16.1" class="ltx_text" style="--ltx-fg-color:#000000;">—————————————————
<br class="ltx_break">## Core Principle
<br class="ltx_break"></span></span>
<span id="A1.SS11.SSS1.p5.pic1.2.17" class="ltx_p"><span id="A1.SS11.SSS1.p5.pic1.2.17.1" class="ltx_text" style="--ltx-fg-color:#000000;">Your task is NOT to evaluate whether the Single-Row answers the entire Query. Your task IS ONLY to evaluate whether THIS Single-Row:
<br class="ltx_break"></span></span>
<span id="A1.SS11.SSS1.p5.pic1.2.18" class="ltx_p"><span id="A1.SS11.SSS1.p5.pic1.2.18.1" class="ltx_text" style="--ltx-fg-color:#000000;">1. Correctly reflects the part of the Response it was extracted from;
<br class="ltx_break">2. Is factually correct according to verification tools.
<br class="ltx_break"></span></span>
<span id="A1.SS11.SSS1.p5.pic1.2.19" class="ltx_p"><span id="A1.SS11.SSS1.p5.pic1.2.19.1" class="ltx_text" style="--ltx-fg-color:#000000;">You MUST ignore completeness. You MUST evaluate only the correctness of THIS Single-Row’s own claims.
<br class="ltx_break"></span></span>
<span id="A1.SS11.SSS1.p5.pic1.2.20" class="ltx_p"><span id="A1.SS11.SSS1.p5.pic1.2.20.1" class="ltx_text" style="--ltx-fg-color:#000000;">—————————————————
<br class="ltx_break">## Role and High-Level Objective
<br class="ltx_break"></span></span>
<span id="A1.SS11.SSS1.p5.pic1.2.21" class="ltx_p"><span id="A1.SS11.SSS1.p5.pic1.2.21.1" class="ltx_text" style="--ltx-fg-color:#000000;">Act as a neutral, impartial judge. All factual checks must be performed using Playwright MCP tools.
<br class="ltx_break"></span></span>
<span id="A1.SS11.SSS1.p5.pic1.2.22" class="ltx_p"><span id="A1.SS11.SSS1.p5.pic1.2.22.1" class="ltx_text" style="--ltx-fg-color:#000000;">—————————————————
<br class="ltx_break">## Step-by-Step Evaluation Procedure
<br class="ltx_break"></span></span>
<span id="A1.SS11.SSS1.p5.pic1.2.23" class="ltx_p"><span id="A1.SS11.SSS1.p5.pic1.2.23.1" class="ltx_text" style="--ltx-fg-color:#000000;">### Step 1 — Initial Read
<br class="ltx_break">- Read the Query, Response, and Single-Row fully.
<br class="ltx_break"></span></span>
<span id="A1.SS11.SSS1.p5.pic1.2.24" class="ltx_p"><span id="A1.SS11.SSS1.p5.pic1.2.24.1" class="ltx_text" style="--ltx-fg-color:#000000;">### Step 2 — Trace Source in the Response
<br class="ltx_break">- Locate the corresponding content in the Response.
<br class="ltx_break">- Confirm the Single-Row faithfully reflects the Response.
<br class="ltx_break"></span></span>
<span id="A1.SS11.SSS1.p5.pic1.2.25" class="ltx_p"><span id="A1.SS11.SSS1.p5.pic1.2.25.1" class="ltx_text" style="--ltx-fg-color:#000000;">### Step 3 — Verify Each Claim Individually with Playwright MCP Tools
<br class="ltx_break">- Focus strictly on content relevant to the Query.
<br class="ltx_break">- Do not let style, language, or level of detail influence judgement.
<br class="ltx_break">- Treat &quot;N/A&quot;, &quot;NA&quot;, or &quot;Data Unavailable&quot; as problematic unless explicitly allowed.
<br class="ltx_break">- Follow explicit references in the Response: URLs, citations, or footnotes (e.g., [^1], &lt;sup&gt;1&lt;/sup&gt;).
<br class="ltx_break">- Open referenced pages with Playwright MCP tools and locate supporting evidence.
<br class="ltx_break">- Primarily rely on references in the Response; if none exist, search authoritative sources using the tools.
<br class="ltx_break">- If a reference is unreachable, paywalled, or does not support the claim, mark accordingly.
<br class="ltx_break">- Verify every field if the item contains multiple attributes (e.g., in a table row).
<br class="ltx_break">- Numeric values must strictly match authoritative sources—no tolerance allowed.
<br class="ltx_break"></span></span>
<span id="A1.SS11.SSS1.p5.pic1.2.26" class="ltx_p"><span id="A1.SS11.SSS1.p5.pic1.2.26.1" class="ltx_text" style="--ltx-fg-color:#000000;">### Step 4 — Record Verification Results
<br class="ltx_break">For every claim in the Single-Row record:
<br class="ltx_break">- Supported / Contradicted / Not verifiable
<br class="ltx_break"></span></span>
<span id="A1.SS11.SSS1.p5.pic1.2.27" class="ltx_p"><span id="A1.SS11.SSS1.p5.pic1.2.27.1" class="ltx_text" style="--ltx-fg-color:#000000;">—————————————————
<br class="ltx_break">## Final judgement Rules
<br class="ltx_break"></span></span>
<span id="A1.SS11.SSS1.p5.pic1.2.28" class="ltx_p"><span id="A1.SS11.SSS1.p5.pic1.2.28.1" class="ltx_text" style="--ltx-fg-color:#000000;">A Single-Row is labeled **[1]** ONLY IF:
<br class="ltx_break">1. It contains at least one claim relevant to the Query; AND
<br class="ltx_break">2. Every claim is factually correct; AND
<br class="ltx_break">3. It faithfully represents the Response.
<br class="ltx_break"></span></span>
<span id="A1.SS11.SSS1.p5.pic1.2.29" class="ltx_p"><span id="A1.SS11.SSS1.p5.pic1.2.29.1" class="ltx_text" style="--ltx-fg-color:#000000;">Otherwise, assign **[0]**.
<br class="ltx_break"></span></span>
<span id="A1.SS11.SSS1.p5.pic1.2.30" class="ltx_p"><span id="A1.SS11.SSS1.p5.pic1.2.30.1" class="ltx_text" style="--ltx-fg-color:#000000;">### If ANY claim is:
<br class="ltx_break">- incorrect, OR
<br class="ltx_break">- missing, OR
<br class="ltx_break">- unverifiable
<br class="ltx_break">→ assign **[0]**
<br class="ltx_break"></span></span>
<span id="A1.SS11.SSS1.p5.pic1.2.31" class="ltx_p"><span id="A1.SS11.SSS1.p5.pic1.2.31.1" class="ltx_text" style="--ltx-fg-color:#000000;">—————————————————
<br class="ltx_break">## Strict Requirements
<br class="ltx_break"></span></span>
<span id="A1.SS11.SSS1.p5.pic1.2.32" class="ltx_p"><span id="A1.SS11.SSS1.p5.pic1.2.32.1" class="ltx_text" style="--ltx-fg-color:#000000;">- You MUST use Playwright MCP tools for all factual verification.
<br class="ltx_break">- You MUST NOT add or infer information beyond what is provided.
<br class="ltx_break"></span></span>
<span id="A1.SS11.SSS1.p5.pic1.2.33" class="ltx_p"><span id="A1.SS11.SSS1.p5.pic1.2.33.1" class="ltx_text" style="--ltx-fg-color:#000000;">—————————————————
<br class="ltx_break">## Output Format (Strict)
<br class="ltx_break"></span></span>
<span id="A1.SS11.SSS1.p5.pic1.2.34" class="ltx_p"><span id="A1.SS11.SSS1.p5.pic1.2.34.1" class="ltx_text" style="--ltx-fg-color:#000000;">Your final output must be exactly one line:
<br class="ltx_break"></span></span>
<span id="A1.SS11.SSS1.p5.pic1.2.35" class="ltx_p"><span id="A1.SS11.SSS1.p5.pic1.2.35.1" class="ltx_text" style="--ltx-fg-color:#000000;">Response: [1]
<br class="ltx_break">or
<br class="ltx_break">Response: [0]
<br class="ltx_break"></span></span>
<span id="A1.SS11.SSS1.p5.pic1.2.36" class="ltx_p"><span id="A1.SS11.SSS1.p5.pic1.2.36.1" class="ltx_text" style="--ltx-fg-color:#000000;">Nothing else.
<br class="ltx_break"></span></span>
</span></span></span></foreignobject></g></g></svg>