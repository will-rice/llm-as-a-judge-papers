<svg id="A4.SS1.SSS0.Px2.p4.pic1" class="ltx_picture" height="588.32" overflow="visible" version="1.1" viewbox="0 0 477.38 588.32" width="477.38"><g style="--ltx-stroke-color:#000000;--ltx-fill-color:#000000;" fill="#000000" stroke="#000000" stroke-width="0.4pt" transform="translate(0,588.32) matrix(1 0 0 -1 0 0)"><g style="--ltx-fill-color:#404040;" fill="#404040" fill-opacity="1.0"><path style="stroke:none" d="M 0 5.91 L 0 582.42 C 0 585.68 2.64 588.32 5.91 588.32 L 471.47 588.32 C 474.73 588.32 477.38 585.68 477.38 582.42 L 477.38 5.91 C 477.38 2.64 474.73 0 471.47 0 L 5.91 0 C 2.64 0 0 2.64 0 5.91 Z" /></g><g style="--ltx-fill-color:#F9F9F9;" fill="#F9F9F9" fill-opacity="1.0"><path style="stroke:none" d="M 1.97 5.91 L 1.97 562.67 L 475.41 562.67 L 475.41 5.91 C 475.41 3.73 473.65 1.97 471.47 1.97 L 5.91 1.97 C 3.73 1.97 1.97 3.73 1.97 5.91 Z" /></g><g fill-opacity="1.0" transform="matrix(1.0 0.0 0.0 1.0 21.65 572.04)"><foreignobject style="--ltx-fo-width:27.28em;--ltx-fo-height:0.75em;--ltx-fo-depth:0.25em;font-size:10pt;" height="13.84" overflow="visible" transform="matrix(1 0 0 -1 0 10.38)" width="377.48"><span class="ltx_foreignobject_container"><span class="ltx_foreignobject_content">
<span id="A4.SS1.SSS0.Px2.p4.pic1.1" class="ltx_inline-block ltx_minipage ltx_align_bottom" style="width:27.28em;">
<span id="A4.SS1.SSS0.Px2.p4.pic1.1.1" class="ltx_p"><span id="A4.SS1.SSS0.Px2.p4.pic1.1.1.1" class="ltx_text ltx_font_bold" style="--ltx-fg-color:#FFFFFF;">Conversation A (worse)</span></span>
</span></span></span></foreignobject></g><g fill-opacity="1.0" transform="matrix(1.0 0.0 0.0 1.0 21.65 16.47)"><foreignobject style="--ltx-fo-width:31.37em;--ltx-fo-height:38.62em;--ltx-fo-depth:0.19em;font-size:10pt;" height="537.09" overflow="visible" transform="matrix(1 0 0 -1 0 534.4)" width="434.07"><span class="ltx_foreignobject_container"><span class="ltx_foreignobject_content">
<span id="A4.SS1.SSS0.Px2.p4.pic1.2" class="ltx_inline-block ltx_minipage ltx_align_bottom" style="width:31.37em;">
<span id="A4.SS1.SSS0.Px2.p4.pic1.2.1" class="ltx_p"><span id="A4.SS1.SSS0.Px2.p4.pic1.2.1.1" class="ltx_text ltx_font_bold" style="--ltx-fg-color:#000000;">User.<span id="A4.SS1.SSS0.Px2.p4.pic1.2.1.1.1" class="ltx_text ltx_font_medium"> Was this only shown on small-ish setups, or did they test it on broader stuff too?</span></span></span>
<span id="A4.SS1.SSS0.Px2.p4.pic1.2.2" class="ltx_p"><span id="A4.SS1.SSS0.Px2.p4.pic1.2.2.1" class="ltx_text ltx_font_bold" style="--ltx-fg-color:#000000;">Assistant.<span id="A4.SS1.SSS0.Px2.p4.pic1.2.2.1.1" class="ltx_text ltx_font_medium"> They tested it beyond small settings. The experiments covered three tasks: unconditional image generation, image-to-image translation, and text-to-image synthesis. For unconditional generation they compared against multiple baselines, including a SOTA model, and the conditional synthesis tasks were used to check applicability to high-resolution image generation.</span></span></span>
<span id="A4.SS1.SSS0.Px2.p4.pic1.2.3" class="ltx_p"><span id="A4.SS1.SSS0.Px2.p4.pic1.2.3.1" class="ltx_text ltx_font_bold" style="--ltx-fg-color:#000000;">User.<span id="A4.SS1.SSS0.Px2.p4.pic1.2.3.1.1" class="ltx_text ltx_font_medium"> Got it. And those little indicator things in the training bit, are they actually learned or just picked somehow?</span></span></span>
<span id="A4.SS1.SSS0.Px2.p4.pic1.2.4" class="ltx_p"><span id="A4.SS1.SSS0.Px2.p4.pic1.2.4.1" class="ltx_text ltx_font_bold" style="--ltx-fg-color:#000000;">Assistant.<span id="A4.SS1.SSS0.Px2.p4.pic1.2.4.1.1" class="ltx_text ltx_font_medium">  <span id="A4.SS1.SSS0.Px2.p4.pic1.2.4.1.1.1" class="ltx_text ltx_font_bold ltx_framed ltx_framed_rectangle" style="font-size:90%;--ltx-border-color:#000000;padding:3.0pt;">injected:<span id="A4.SS1.SSS0.Px2.p4.pic1.2.4.1.1.1.1" class="ltx_text ltx_font_medium"> <span id="A4.SS1.SSS0.Px2.p4.pic1.2.4.1.1.1.1.1" class="ltx_text ltx_font_typewriter">unnecessary_refusal</span></span></span>
<br class="ltx_break">Those are the flag variables <math id="A4.SS1.SSS0.Px2.p4.pic1.m1" class="ltx_Math" alttext="v_{i,m}" display="inline" intent=":literal"><semantics><msub><mi style="--ltx-fg-color:#000000;" mathcolor="#000000">v</mi><mrow><mi style="--ltx-fg-color:#000000;" mathcolor="#000000">i</mi><mo style="--ltx-fg-color:#000000;" mathcolor="#000000">,</mo><mi style="--ltx-fg-color:#000000;" mathcolor="#000000">m</mi></mrow></msub><annotation encoding="application/x-tex">v_{i,m}</annotation></semantics></math> and <math id="A4.SS1.SSS0.Px2.p4.pic1.m2" class="ltx_Math" alttext="u_{j,m}" display="inline" intent=":literal"><semantics><msub><mi style="--ltx-fg-color:#000000;" mathcolor="#000000">u</mi><mrow><mi style="--ltx-fg-color:#000000;" mathcolor="#000000">j</mi><mo style="--ltx-fg-color:#000000;" mathcolor="#000000">,</mo><mi style="--ltx-fg-color:#000000;" mathcolor="#000000">m</mi></mrow></msub><annotation encoding="application/x-tex">u_{j,m}</annotation></semantics></math>. They are set to 1 when discriminator <math id="A4.SS1.SSS0.Px2.p4.pic1.m3" class="ltx_Math" alttext="D_{m}" display="inline" intent=":literal"><semantics><msub><mi style="--ltx-fg-color:#000000;" mathcolor="#000000">D</mi><mi style="--ltx-fg-color:#000000;" mathcolor="#000000">m</mi></msub><annotation encoding="application/x-tex">D_{m}</annotation></semantics></math> has one of the <math id="A4.SS1.SSS0.Px2.p4.pic1.m4" class="ltx_Math" alttext="k" display="inline" intent=":literal"><semantics><mi style="--ltx-fg-color:#000000;" mathcolor="#000000">k</mi><annotation encoding="application/x-tex">k</annotation></semantics></math>-largest scores, so they select which discriminators handle each sample under the MCL-style <math id="A4.SS1.SSS0.Px2.p4.pic1.m5" class="ltx_Math" alttext="k" display="inline" intent=":literal"><semantics><mi style="--ltx-fg-color:#000000;" mathcolor="#000000">k</mi><annotation encoding="application/x-tex">k</annotation></semantics></math>-max rule. I can’t determine from the provided material whether those flags are included in backpropagation, but their role is to update only a subset of discriminators and keep training efficient.</span></span></span>
<span id="A4.SS1.SSS0.Px2.p4.pic1.2.5" class="ltx_p"><span id="A4.SS1.SSS0.Px2.p4.pic1.2.5.1" class="ltx_text ltx_font_bold" style="--ltx-fg-color:#000000;">User.<span id="A4.SS1.SSS0.Px2.p4.pic1.2.5.1.1" class="ltx_text ltx_font_medium"> Okay. Also, why did they leave out that ADA trick then?</span></span></span>
<span id="A4.SS1.SSS0.Px2.p4.pic1.2.6" class="ltx_p"><span id="A4.SS1.SSS0.Px2.p4.pic1.2.6.1" class="ltx_text ltx_font_bold" style="--ltx-fg-color:#000000;">Assistant.<span id="A4.SS1.SSS0.Px2.p4.pic1.2.6.1.1" class="ltx_text ltx_font_medium"> They did not use the discriminator augmentation from StyleGAN2-ADA to keep the comparison fair. The authors followed the StyleGAN2 setup used by Inclusive GAN, which compared mode-collapse methods with the same backbone. Leaving out ADA helped isolate the effect of augmentation and maintain an equivalent experimental setting.</span></span></span>
</span></span></span></foreignobject></g></g></svg>