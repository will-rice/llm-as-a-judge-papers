<svg id="S3.p2.pic1" class="ltx_picture" height="401.82" overflow="visible" version="1.1" viewbox="0 0 477.38 401.82" width="477.38"><g style="--ltx-stroke-color:#000000;--ltx-fill-color:#000000;" fill="#000000" stroke="#000000" stroke-width="0.4pt" transform="translate(0,401.82) matrix(1 0 0 -1 0 0)"><g style="--ltx-fill-color:#4D6BF3;" fill="#4D6BF3" fill-opacity="1.0"><path style="stroke:none" d="M 0 10.65 L 0 382.94 C 0 388.83 4.77 393.6 10.65 393.6 L 466.72 393.6 C 472.61 393.6 477.38 388.83 477.38 382.94 L 477.38 10.65 C 477.38 4.77 472.61 0 466.72 0 L 10.65 0 C 4.77 0 0 4.77 0 10.65 Z" /></g><g style="--ltx-fill-color:#EFF2FE;" fill="#EFF2FE" fill-opacity="1.0"><path style="stroke:none" d="M 0.97 10.65 L 0.97 382.94 C 0.97 388.29 5.31 392.63 10.65 392.63 L 466.72 392.63 C 472.07 392.63 476.41 388.29 476.41 382.94 L 476.41 10.65 C 476.41 5.31 472.07 0.97 466.72 0.97 L 10.65 0.97 C 5.31 0.97 0.97 5.31 0.97 10.65 Z" /></g><g transform="matrix(1.0 0.0 0.0 1.0 11.07 385.29)"><g style="--ltx-stroke-color:#000000;--ltx-fill-color:#000000;" class="ltx_nestedsvg" fill="#000000" stroke="#000000" stroke-width="0.4pt" transform="matrix(1 0 0 1 0 0)"><g style="--ltx-fill-color:#4D6BF3;" fill="#4D6BF3" fill-opacity="1.0"><path style="stroke:none" d="M 0 2.08 L 0 14.45 C 0 15.6 0.93 16.53 2.08 16.53 L 189.96 16.53 C 191.1 16.53 192.03 15.6 192.03 14.45 L 192.03 2.08 C 192.03 0.93 191.1 0 189.96 0 L 2.08 0 C 0.93 0 0 0.93 0 2.08 Z" /></g><g style="--ltx-fill-color:#4D6BF3;" fill="#4D6BF3" fill-opacity="1.0"><path style="stroke:none" d="M 0 2.08 L 0 14.45 C 0 15.6 0.93 16.53 2.08 16.53 L 189.96 16.53 C 191.1 16.53 192.03 15.6 192.03 14.45 L 192.03 2.08 C 192.03 0.93 191.1 0 189.96 0 L 2.08 0 C 0.93 0 0 0.93 0 2.08 Z" /></g><g fill-opacity="1.0" transform="matrix(1.0 0.0 0.0 1.0 8.3 3.46)"><foreignobject style="--ltx-fo-width:11em;--ltx-fo-height:0.6em;--ltx-fo-depth:0em;font-size:11.5pt;" height="9.61" overflow="visible" transform="matrix(1 0 0 -1 0 9.61)" width="174.99"><span class="ltx_foreignobject_container"><span class="ltx_foreignobject_content"><span id="S3.p2.pic1.1" class="ltx_text ltx_font_bold" style="--ltx-fg-color:#FFFFFF;">Roles of Decision Models</span></span></span></foreignobject></g></g></g><g fill-opacity="1.0" transform="matrix(1.0 0.0 0.0 1.0 17.36 352.91)"><foreignobject style="--ltx-fo-width:31.99em;--ltx-fo-height:1.69em;--ltx-fo-depth:24.45em;font-size:10pt;" height="361.65" overflow="visible" transform="matrix(1 0 0 -1 0 23.33)" width="442.65"><span class="ltx_foreignobject_container"><span class="ltx_foreignobject_content">
<span id="S3.p2.pic1.2" class="ltx_inline-block ltx_minipage ltx_align_bottom" style="width:31.99em;">
<span id="S3.I1" class="ltx_itemize">
<span id="S3.I1.i1" class="ltx_item" style="list-style-type:none;"><span class="ltx_tag ltx_tag_item">•</span> 
<span id="S3.I1.i1.p1" class="ltx_para">
<span id="S3.I1.i1.p1.1" class="ltx_p"><span id="S3.I1.i1.p1.1.1" class="ltx_text ltx_font_bold" style="--ltx-fg-color:#000000;">Actor.</span><span id="S3.I1.i1.p1.1.2" class="ltx_text" style="--ltx-fg-color:#000000;"> At each step, the decision model answers a multiple-choice question about which action to take next. It receives the goal, the interaction history, and the current observation, then selects one of the valid actions and assigns a probability to each option. The selected action is executed in the environment (Section </span><a href="#S3.SS1" title="3.1 Decision Models as Actors ‣ 3 Understanding Decision Models on Agentic Tasks ‣ Actor, Judge, or Teacher? Understanding Decision Models in Long-Horizon Agents" class="ltx_ref" style="--ltx-fg-color:#000000;"><span class="ltx_text ltx_ref_tag">3.1</span></a><span id="S3.I1.i1.p1.1.3" class="ltx_text" style="--ltx-fg-color:#000000;">).</span></span>
</span></span>
<span id="S3.I1.i2" class="ltx_item" style="list-style-type:none;"><span class="ltx_tag ltx_tag_item">•</span> 
<span id="S3.I1.i2.p1" class="ltx_para">
<span id="S3.I1.i2.p1.1" class="ltx_p"><span id="S3.I1.i2.p1.1.1" class="ltx_text ltx_font_bold" style="--ltx-fg-color:#000000;">Judge.</span><span id="S3.I1.i2.p1.1.2" class="ltx_text" style="--ltx-fg-color:#000000;"> The decision model scores the actions in trajectories recorded from other policies, as in LLM-as-a-judge </span><cite class="ltx_cite ltx_citemacro_citep"><span id="S3.I1.i2.p1.1.3" class="ltx_text" style="--ltx-fg-color:#000000;">(</span><a href="#bib.bib29" title class="ltx_ref">Zheng et al., 2023</a><span id="S3.I1.i2.p1.1.5" class="ltx_text" style="--ltx-fg-color:#000000;">)</span></cite><span id="S3.I1.i2.p1.1.6" class="ltx_text" style="--ltx-fg-color:#000000;">. For each executed action, it answers a yes/no question about that action, such as whether it helped achieve the goal, and returns a score in </span><math id="S3.I1.i2.p1.m1" class="ltx_Math" alttext="[0,1]" display="inline" intent=":literal"><semantics><mrow><mo style="--ltx-fg-color:#000000;" mathcolor="#000000" stretchy="false">[</mo><mn style="--ltx-fg-color:#000000;" mathcolor="#000000">0</mn><mo style="--ltx-fg-color:#000000;" mathcolor="#000000">,</mo><mn style="--ltx-fg-color:#000000;" mathcolor="#000000">1</mn><mo style="--ltx-fg-color:#000000;" mathcolor="#000000" stretchy="false">]</mo></mrow><annotation encoding="application/x-tex">[0,1]</annotation></semantics></math><span id="S3.I1.i2.p1.1.7" class="ltx_text" style="--ltx-fg-color:#000000;"> (Section </span><a href="#S3.SS2" title="3.2 Decision Models as Judges ‣ 3 Understanding Decision Models on Agentic Tasks ‣ Actor, Judge, or Teacher? Understanding Decision Models in Long-Horizon Agents" class="ltx_ref" style="--ltx-fg-color:#000000;"><span class="ltx_text ltx_ref_tag">3.2</span></a><span id="S3.I1.i2.p1.1.8" class="ltx_text" style="--ltx-fg-color:#000000;">).</span></span>
</span></span>
<span id="S3.I1.i3" class="ltx_item" style="list-style-type:none;"><span class="ltx_tag ltx_tag_item">•</span> 
<span id="S3.I1.i3.p1" class="ltx_para">
<span id="S3.I1.i3.p1.1" class="ltx_p"><span id="S3.I1.i3.p1.1.1" class="ltx_text ltx_font_bold" style="--ltx-fg-color:#000000;">Teacher.</span><span id="S3.I1.i3.p1.1.2" class="ltx_text" style="--ltx-fg-color:#000000;"> The decision model scores actions as a Judge does, but on trajectories from the policy being trained. The scores are combined with outcome rewards in GRPO </span><cite class="ltx_cite ltx_citemacro_citep"><span id="S3.I1.i3.p1.1.3" class="ltx_text" style="--ltx-fg-color:#000000;">(</span><a href="#bib.bib16" title class="ltx_ref">Shao et al., 2024</a><span id="S3.I1.i3.p1.1.5" class="ltx_text" style="--ltx-fg-color:#000000;">)</span></cite><span id="S3.I1.i3.p1.1.6" class="ltx_text" style="--ltx-fg-color:#000000;"> as step-level supervision. The decision model stays fixed during training and is not used at test time (Section </span><a href="#S3.SS3" title="3.3 Decision Models as Teachers ‣ 3 Understanding Decision Models on Agentic Tasks ‣ Actor, Judge, or Teacher? Understanding Decision Models in Long-Horizon Agents" class="ltx_ref" style="--ltx-fg-color:#000000;"><span class="ltx_text ltx_ref_tag">3.3</span></a><span id="S3.I1.i3.p1.1.7" class="ltx_text" style="--ltx-fg-color:#000000;">).</span></span>
</span></span>
</span>
</span></span></span></foreignobject></g></g></svg>