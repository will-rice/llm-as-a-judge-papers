<span id="Sx2.SSx2.p4.pic1.2.1" class="ltx_p"><span id="Sx2.SSx2.p4.pic1.2.1.1" class="ltx_text ltx_font_typewriter" style="--ltx-fg-color:#000000;">You are a strict grader. Compare the response to the ground truth. You DO NOT NEED to assess the correctness of the response. Judge based on content alignment.
