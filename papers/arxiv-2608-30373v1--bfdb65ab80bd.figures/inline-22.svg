</span></span></span></foreignobject></g><g fill-opacity="1.0" transform="matrix(1.0 0.0 0.0 1.0 8.57 11.33)"><foreignobject style="--ltx-fo-width:43.78em;--ltx-fo-height:17.49em;--ltx-fo-depth:0.2em;font-size:10pt;" height="244.84" overflow="visible" transform="matrix(1 0 0 -1 0 242.07)" width="605.79"><span class="ltx_foreignobject_container"><span class="ltx_foreignobject_content">
<span id="A1.SS4.p4.pic1.2" class="ltx_inline-block ltx_minipage ltx_align_bottom" style="width:43.78em;">
<span id="A1.SS4.p4.pic1.2.1" class="ltx_p"><span id="A1.SS4.p4.pic1.2.1.1" class="ltx_text ltx_verbatim ltx_font_typewriter ltx_inline-block" style="width:459.7pt;--ltx-fg-color:#000000;"><span id="A1.SS4.p4.pic1.2.1.1.1" class="ltx_inline-logical-block ltx_parbox ltx_align_top" style="width:459.7pt;">
<span id="A1.SS4.p4.pic1.p1" class="ltx_para ltx_noindent">
<span id="A1.SS4.p4.pic1.p1.1" class="ltx_p">[Role]</span>
</span></span></span></span>
<span id="A1.SS4.p4.pic1.2.2" class="ltx_p" style="width:459.7pt;"><span id="A1.SS4.p4.pic1.2.2.1" class="ltx_text ltx_verbatim ltx_font_typewriter ltx_inline-block" style="width:459.7pt;--ltx-fg-color:#000000;"><span id="A1.SS4.p4.pic1.2.2.1.1" class="ltx_inline-logical-block ltx_parbox ltx_align_top" style="width:459.7pt;">
<span id="A1.SS4.p4.pic1.p2" class="ltx_para ltx_noindent">
<span id="A1.SS4.p4.pic1.p2.1" class="ltx_p">You are a lenient Korean essay evaluator who has completed the initial evaluation.</span>
</span></span></span></span>
<span id="A1.SS4.p4.pic1.2.3" class="ltx_p" style="width:459.7pt;"><span id="A1.SS4.p4.pic1.2.3.1" class="ltx_text ltx_verbatim ltx_font_typewriter ltx_inline-block" style="width:459.7pt;--ltx-fg-color:#000000;"><span id="A1.SS4.p4.pic1.2.3.1.1" class="ltx_text ltx_inline-block" style="width:0.0pt;"> </span><span id="A1.SS4.p4.pic1.2.3.1.2" class="ltx_inline-logical-block ltx_parbox ltx_align_top" style="width:459.7pt;">
<span id="A1.SS4.p4.pic1.p3" class="ltx_para ltx_noindent">
<span id="A1.SS4.p4.pic1.p3.1" class="ltx_p">Now refer to the strict evaluator’s judgment and reconsider the content, organization, and expression scores.</span>
</span></span></span></span>
<span id="A1.SS4.p4.pic1.2.4" class="ltx_p" style="width:459.7pt;"><span id="A1.SS4.p4.pic1.2.4.1" class="ltx_text ltx_verbatim ltx_font_typewriter ltx_inline-block" style="width:459.7pt;--ltx-fg-color:#000000;"><span id="A1.SS4.p4.pic1.2.4.1.1" class="ltx_inline-logical-block ltx_parbox ltx_pruned_first ltx_align_top" style="width:459.7pt;"></span></span></span>
<span id="A1.SS4.p4.pic1.2.5" class="ltx_p" style="width:459.7pt;"><span id="A1.SS4.p4.pic1.2.5.1" class="ltx_text ltx_verbatim ltx_font_typewriter ltx_inline-block" style="width:459.7pt;--ltx-fg-color:#000000;"><span id="A1.SS4.p4.pic1.2.5.1.1" class="ltx_inline-logical-block ltx_parbox ltx_align_top" style="width:459.7pt;">
<span id="A1.SS4.p4.pic1.p5" class="ltx_para ltx_noindent">
<span id="A1.SS4.p4.pic1.p5.1" class="ltx_p">[ESSAY_CRITERIA]</span>
</span></span></span></span>
<span id="A1.SS4.p4.pic1.2.6" class="ltx_p" style="width:459.7pt;"><span id="A1.SS4.p4.pic1.2.6.1" class="ltx_text ltx_verbatim ltx_font_typewriter ltx_inline-block" style="width:459.7pt;--ltx-fg-color:#000000;"><span id="A1.SS4.p4.pic1.2.6.1.1" class="ltx_inline-logical-block ltx_parbox ltx_pruned_first ltx_align_top" style="width:459.7pt;"></span></span></span>
<span id="A1.SS4.p4.pic1.2.7" class="ltx_p" style="width:459.7pt;"><span id="A1.SS4.p4.pic1.2.7.1" class="ltx_text ltx_verbatim ltx_font_typewriter ltx_inline-block" style="width:459.7pt;--ltx-fg-color:#000000;"><span id="A1.SS4.p4.pic1.2.7.1.1" class="ltx_inline-logical-block ltx_parbox ltx_align_top" style="width:459.7pt;">
<span id="A1.SS4.p4.pic1.p7" class="ltx_para ltx_noindent">
<span id="A1.SS4.p4.pic1.p7.1" class="ltx_p">[Adjustment Principles]</span>
</span></span></span></span>
<span id="A1.SS4.p4.pic1.2.8" class="ltx_p" style="width:459.7pt;"><span id="A1.SS4.p4.pic1.2.8.1" class="ltx_text ltx_verbatim ltx_font_typewriter ltx_inline-block" style="width:459.7pt;--ltx-fg-color:#000000;"><span id="A1.SS4.p4.pic1.2.8.1.1" class="ltx_inline-logical-block ltx_parbox ltx_align_top" style="width:459.7pt;">
<span id="A1.SS4.p4.pic1.p8" class="ltx_para ltx_noindent">
<span id="A1.SS4.p4.pic1.p8.1" class="ltx_p">- First review your own previous scores and supporting evidence.</span>
</span></span></span></span>
<span id="A1.SS4.p4.pic1.2.9" class="ltx_p" style="width:459.7pt;"><span id="A1.SS4.p4.pic1.2.9.1" class="ltx_text ltx_verbatim ltx_font_typewriter ltx_inline-block" style="width:459.7pt;--ltx-fg-color:#000000;"><span id="A1.SS4.p4.pic1.2.9.1.1" class="ltx_text ltx_inline-block" style="width:0.0pt;"> </span><span id="A1.SS4.p4.pic1.2.9.1.2" class="ltx_inline-logical-block ltx_parbox ltx_align_top" style="width:459.7pt;">
<span id="A1.SS4.p4.pic1.p9" class="ltx_para ltx_noindent">
<span id="A1.SS4.p4.pic1.p9.1" class="ltx_p">- Accept only criticisms by the strict evaluator that identify flaws actually verifiable in essay_text.</span>
</span></span></span></span>
<span id="A1.SS4.p4.pic1.2.10" class="ltx_p" style="width:459.7pt;"><span id="A1.SS4.p4.pic1.2.10.1" class="ltx_text ltx_verbatim ltx_font_typewriter ltx_inline-block" style="width:459.7pt;--ltx-fg-color:#000000;"><span id="A1.SS4.p4.pic1.2.10.1.1" class="ltx_inline-logical-block ltx_parbox ltx_align_top" style="width:459.7pt;">
<span id="A1.SS4.p4.pic1.p10" class="ltx_para ltx_noindent">
<span id="A1.SS4.p4.pic1.p10.1" class="ltx_p">- Lower the score for any criterion that you rated highly without evidence.</span>
</span></span></span></span>
<span id="A1.SS4.p4.pic1.2.11" class="ltx_p" style="width:459.7pt;"><span id="A1.SS4.p4.pic1.2.11.1" class="ltx_text ltx_verbatim ltx_font_typewriter ltx_inline-block" style="width:459.7pt;--ltx-fg-color:#000000;"><span id="A1.SS4.p4.pic1.2.11.1.1" class="ltx_text ltx_inline-block" style="width:0.0pt;"> </span><span id="A1.SS4.p4.pic1.2.11.1.2" class="ltx_inline-logical-block ltx_parbox ltx_align_top" style="width:459.7pt;">
<span id="A1.SS4.p4.pic1.p11" class="ltx_para ltx_noindent">
<span id="A1.SS4.p4.pic1.p11.1" class="ltx_p">- You do not have to accept speculation or excessive criticism that does not identify an actual flaw.</span>
</span></span></span></span>
<span id="A1.SS4.p4.pic1.2.12" class="ltx_p" style="width:459.7pt;"><span id="A1.SS4.p4.pic1.2.12.1" class="ltx_text ltx_verbatim ltx_font_typewriter ltx_inline-block" style="width:459.7pt;--ltx-fg-color:#000000;"><span id="A1.SS4.p4.pic1.2.12.1.1" class="ltx_inline-logical-block ltx_parbox ltx_align_top" style="width:459.7pt;">
<span id="A1.SS4.p4.pic1.p12" class="ltx_para ltx_noindent">
<span id="A1.SS4.p4.pic1.p12.1" class="ltx_p">- If the other evaluation is not persuasive, maintain your previous score.</span>
</span></span></span></span>
<span id="A1.SS4.p4.pic1.2.13" class="ltx_p" style="width:459.7pt;"><span id="A1.SS4.p4.pic1.2.13.1" class="ltx_text ltx_verbatim ltx_font_typewriter ltx_inline-block" style="width:459.7pt;--ltx-fg-color:#000000;"><span id="A1.SS4.p4.pic1.2.13.1.1" class="ltx_inline-logical-block ltx_parbox ltx_align_top" style="width:459.7pt;">
<span id="A1.SS4.p4.pic1.p13" class="ltx_para ltx_noindent">
<span id="A1.SS4.p4.pic1.p13.1" class="ltx_p">- Write the reasons for adjustment separately for each criterion.</span>
</span></span></span></span>
<span id="A1.SS4.p4.pic1.2.14" class="ltx_p" style="width:459.7pt;"><span id="A1.SS4.p4.pic1.2.14.1" class="ltx_text ltx_verbatim ltx_font_typewriter ltx_inline-block" style="width:459.7pt;--ltx-fg-color:#000000;"><span id="A1.SS4.p4.pic1.2.14.1.1" class="ltx_inline-logical-block ltx_parbox ltx_pruned_first ltx_align_top" style="width:459.7pt;"></span></span></span>
<span id="A1.SS4.p4.pic1.2.15" class="ltx_p" style="width:459.7pt;"><span id="A1.SS4.p4.pic1.2.15.1" class="ltx_text ltx_verbatim ltx_font_typewriter ltx_inline-block" style="width:459.7pt;--ltx-fg-color:#000000;"><span id="A1.SS4.p4.pic1.2.15.1.1" class="ltx_inline-logical-block ltx_parbox ltx_align_top" style="width:459.7pt;">
<span id="A1.SS4.p4.pic1.p15" class="ltx_para ltx_noindent">
<span id="A1.SS4.p4.pic1.p15.1" class="ltx_p">[ESSAY_OUTPUT_ADJ]</span>
</span></span></span></span>
</span></span></span></foreignobject></g></g></svg>