<svg id="A5.SS1.p5.pic1" class="ltx_picture" height="812.62" overflow="visible" version="1.1" viewbox="0 0 550 812.62" width="550"><g style="--ltx-stroke-color:#000000;--ltx-fill-color:#000000;" fill="#000000" stroke="#000000" stroke-width="0.4pt" transform="translate(0,812.62) matrix(1 0 0 -1 0 0)"><g style="--ltx-fill-color:#102484;" fill="#102484" fill-opacity="1.0"><path style="stroke:none" d="M 0 10.95 L 0 801.67 C 0 807.72 4.9 812.62 10.95 812.62 L 539.05 812.62 C 545.1 812.62 550 807.72 550 801.67 L 550 10.95 C 550 4.9 545.1 0 539.05 0 L 10.95 0 C 4.9 0 0 4.9 0 10.95 Z" /></g><g style="--ltx-fill-color:#EBEEF9;" fill="#EBEEF9" fill-opacity="1.0"><path style="stroke:none" d="M 1.11 10.95 L 1.11 790.23 L 548.89 790.23 L 548.89 10.95 C 548.89 5.51 544.49 1.11 539.05 1.11 L 10.95 1.11 C 5.51 1.11 1.11 5.51 1.11 10.95 Z" /></g><g style="--ltx-fill-color:#102484;" fill="#102484" fill-opacity="1.0"><path style="stroke:none" d="M 1.11 791.34 L 1.11 801.67 C 1.11 807.11 5.51 811.51 10.95 811.51 L 539.05 811.51 C 544.49 811.51 548.89 807.11 548.89 801.67 L 548.89 791.34 Z" /></g><g fill-opacity="1.0" transform="matrix(1.0 0.0 0.0 1.0 16.11 797.97)"><foreignobject style="--ltx-fo-width:34.02em;--ltx-fo-height:0.69em;--ltx-fo-depth:0.19em;font-size:10pt;" height="12.3" overflow="visible" transform="matrix(1 0 0 -1 0 9.61)" width="470.74"><span class="ltx_foreignobject_container"><span class="ltx_foreignobject_content">
<span id="A5.SS1.p5.pic1.1" class="ltx_inline-block ltx_minipage ltx_align_bottom" style="width:34.02em;">
<span id="A5.SS1.p5.pic1.1.1" class="ltx_p"><span id="A5.SS1.p5.pic1.1.1.1" class="ltx_text ltx_font_sansserif ltx_font_bold" style="--ltx-fg-color:#FFFFFF;">Reference-based verification evaluation prompt for FARE</span></span>
</span></span></span></foreignobject></g><g fill-opacity="1.0" transform="matrix(1.0 0.0 0.0 1.0 16.11 19.57)"><foreignobject style="--ltx-fo-width:35.64em;--ltx-fo-height:54.61em;--ltx-fo-depth:0.25em;font-size:10pt;" height="759.12" overflow="visible" transform="matrix(1 0 0 -1 0 755.66)" width="493.16"><span class="ltx_foreignobject_container"><span class="ltx_foreignobject_content">
<span id="A5.SS1.p5.pic1.2" class="ltx_inline-block ltx_minipage ltx_align_bottom" style="width:35.64em;">
<span id="A5.SS1.p5.pic1.2.1" class="ltx_p"><span id="A5.SS1.p5.pic1.2.1.1" class="ltx_text ltx_font_typewriter" style="--ltx-fg-color:#000000;">### System Prompt
</span></span>
<span id="A5.SS1.p5.pic1.2.2" class="ltx_p"><span id="A5.SS1.p5.pic1.2.2.1" class="ltx_text ltx_font_typewriter" style="--ltx-fg-color:#000000;">Please act as an impartial judge and evaluate if a response provided by an AI assistant (candidate answer) is consistent with a provided reference answer.
Your job is to determine is the assistant’s response is consistent with the reference answer.
</span></span>
<span id="A5.SS1.p5.pic1.2.3" class="ltx_p"><span id="A5.SS1.p5.pic1.2.3.1" class="ltx_text ltx_font_typewriter" style="--ltx-fg-color:#000000;">If the response is consistent, output [A].
</span></span>
<span id="A5.SS1.p5.pic1.2.4" class="ltx_p"><span id="A5.SS1.p5.pic1.2.4.1" class="ltx_text ltx_font_typewriter" style="--ltx-fg-color:#000000;">If the response is incorrect, output [B].
</span></span>
<span id="A5.SS1.p5.pic1.2.5" class="ltx_p"><span id="A5.SS1.p5.pic1.2.5.1" class="ltx_text ltx_font_typewriter" style="--ltx-fg-color:#000000;">Here are some rules for evaluation.
</span></span>
<span id="A5.SS1.p5.pic1.2.6" class="ltx_p"><span id="A5.SS1.p5.pic1.2.6.1" class="ltx_text ltx_font_typewriter" style="--ltx-fg-color:#000000;">(1) Refer to the given reference answer and determine if the candidate’s answer is consistent with the reference answer.
</span></span>
<span id="A5.SS1.p5.pic1.2.7" class="ltx_p"><span id="A5.SS1.p5.pic1.2.7.1" class="ltx_text ltx_font_typewriter" style="--ltx-fg-color:#000000;">(2) The reference answer is always correct and the question is perfectly valid. Take the reference answer as the ground truth.
</span></span>
<span id="A5.SS1.p5.pic1.2.8" class="ltx_p"><span id="A5.SS1.p5.pic1.2.8.1" class="ltx_text ltx_font_typewriter" style="--ltx-fg-color:#000000;">(3) When determining if the candidate’s answer is consistent with the reference answer, only compare the final answer. Ignore any potential errors in the reasoning processes.
</span></span>
<span id="A5.SS1.p5.pic1.2.9" class="ltx_p"><span id="A5.SS1.p5.pic1.2.9.1" class="ltx_text ltx_font_typewriter" style="--ltx-fg-color:#000000;">(4) Some answers may be expressed in different ways, such as some answers may be a mathematical expression, some answers may be a textual description, as long as the meaning expressed is the same. Before making a judgment, please understand the question and the reference answer first, and then judge whether the candidate’s answer is consistent with the reference answer.
</span></span>
<span id="A5.SS1.p5.pic1.2.10" class="ltx_p"><span id="A5.SS1.p5.pic1.2.10.1" class="ltx_text ltx_font_typewriter" style="--ltx-fg-color:#000000;">(5) Some answers may consist of multiple items, such as multiple-choice questions, multiple-select questions, fill-in-the-blank questions, etc. Regardless of the question type, the final answer will be considered correct as long as it matches the standard answer, regardless of whether the reasoning process is correct. For multiple-select questions and multiple-blank fill-in-the-blank questions, all corresponding options or blanks must be answered correctly and match the standard answer exactly to be deemed correct.
</span></span>
<span id="A5.SS1.p5.pic1.2.11" class="ltx_p"><span id="A5.SS1.p5.pic1.2.11.1" class="ltx_text ltx_font_typewriter" style="--ltx-fg-color:#000000;">Before outputting your final judgment, provide an explanation of your judgment. Your explanation should discuss why the response is correct, incorrect, or invalid. The explanation should concretely discuss reasons for your judgment.
After outputting your explanation, provide your final judgment. Use the following format:
</span></span>
<span id="A5.SS1.p5.pic1.2.12" class="ltx_p"><span id="A5.SS1.p5.pic1.2.12.1" class="ltx_text ltx_font_typewriter" style="--ltx-fg-color:#000000;">Explanation: Your explanation here
</span></span>
<span id="A5.SS1.p5.pic1.2.13" class="ltx_p"><span id="A5.SS1.p5.pic1.2.13.1" class="ltx_text ltx_font_typewriter" style="--ltx-fg-color:#000000;">Verdict: Your final judgment of [A] or [B]
</span></span>
<span id="A5.SS1.p5.pic1.2.14" class="ltx_p"><span id="A5.SS1.p5.pic1.2.14.1" class="ltx_text ltx_font_typewriter" style="--ltx-fg-color:#000000;">### User Prompt
</span></span>
<span id="A5.SS1.p5.pic1.2.15" class="ltx_p"><span id="A5.SS1.p5.pic1.2.15.1" class="ltx_text ltx_font_typewriter" style="--ltx-fg-color:#000000;">&lt;|User Prompt|&gt;
</span></span>
<span id="A5.SS1.p5.pic1.2.16" class="ltx_p"><span id="A5.SS1.p5.pic1.2.16.1" class="ltx_text ltx_font_typewriter" style="--ltx-fg-color:#000000;">{question}
</span></span>
<span id="A5.SS1.p5.pic1.2.17" class="ltx_p"><span id="A5.SS1.p5.pic1.2.17.1" class="ltx_text ltx_font_typewriter" style="--ltx-fg-color:#000000;">&lt;|The Start of Assistant’s Answer|&gt;
</span></span>
<span id="A5.SS1.p5.pic1.2.18" class="ltx_p"><span id="A5.SS1.p5.pic1.2.18.1" class="ltx_text ltx_font_typewriter" style="--ltx-fg-color:#000000;">{response}
</span></span>
<span id="A5.SS1.p5.pic1.2.19" class="ltx_p"><span id="A5.SS1.p5.pic1.2.19.1" class="ltx_text ltx_font_typewriter" style="--ltx-fg-color:#000000;">&lt;|The End of Assistant’s Answer|&gt;
</span></span>
<span id="A5.SS1.p5.pic1.2.20" class="ltx_p"><span id="A5.SS1.p5.pic1.2.20.1" class="ltx_text ltx_font_typewriter" style="--ltx-fg-color:#000000;">&lt;|The Start of Reference Answer|&gt;
</span></span>
<span id="A5.SS1.p5.pic1.2.21" class="ltx_p"><span id="A5.SS1.p5.pic1.2.21.1" class="ltx_text ltx_font_typewriter" style="--ltx-fg-color:#000000;">{reference}
</span></span>
<span id="A5.SS1.p5.pic1.2.22" class="ltx_p"><span id="A5.SS1.p5.pic1.2.22.1" class="ltx_text ltx_font_typewriter" style="--ltx-fg-color:#000000;">&lt;|The End of Reference Answer|&gt;
</span></span>
</span></span></span></foreignobject></g></g></svg>