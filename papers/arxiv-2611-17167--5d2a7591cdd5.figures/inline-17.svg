<span id="A2.SS2.SSS2.Px2.p2.pic1.2.5" class="ltx_p"><span id="A2.SS2.SSS2.Px2.p2.pic1.2.5.1" class="ltx_text" style="font-size:90%;--ltx-fg-color:#000000;">Use the supplied question key exactly. Set value to a finite JSON number between 0 and 1, inclusive. Include only the supplied question key in answers. Do not include additional fields, explanations, or Markdown fences.</span></span>
