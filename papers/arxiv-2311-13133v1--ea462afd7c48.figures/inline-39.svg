<svg id="A8.SS1.p6.pic1" class="ltx_picture" height="307.37" overflow="visible" version="1.1" viewbox="0 0 477.38 307.37" width="477.38"><g style="--ltx-stroke-color:#000000;--ltx-fill-color:#000000;" fill="#000000" stroke="#000000" stroke-width="0.4pt" transform="translate(0,307.37) matrix(1 0 0 -1 0 0)"><g style="--ltx-fill-color:#FFFFFF;" fill="#FFFFFF" fill-opacity="1.0"><path style="stroke:none" d="M 0 0 L 0 307.37 L 477.38 307.37 L 477.38 0 Z" /></g><g style="--ltx-fill-color:#F2F2F2;" fill="#F2F2F2" fill-opacity="1.0"><path style="stroke:none" d="M 1.97 1.97 L 1.97 305.41 L 475.41 305.41 L 475.41 1.97 Z" /></g><g fill-opacity="1.0" transform="matrix(1.0 0.0 0.0 1.0 21.65 15.93)"><foreignobject style="--ltx-fo-width:36.91em;--ltx-fo-height:20.07em;--ltx-fo-depth:0.16em;font-size:10pt;" height="279.82" overflow="visible" transform="matrix(1 0 0 -1 0 277.67)" width="510.73"><span class="ltx_foreignobject_container"><span class="ltx_foreignobject_content">
<span id="A8.SS1.p6.pic1.1" class="ltx_inline-block ltx_minipage ltx_align_bottom" style="width:36.91em;">
<span id="A8.SS1.p6.pic1.1.1" class="ltx_p"><span id="A8.SS1.p6.pic1.1.1.1" class="ltx_text ltx_font_sansserif" style="font-size:80%;--ltx-fg-color:#000000;">The following resources can help you assess how broadly a book is used and accepted by scholars.</span></span>
<span id="A8.I2" class="ltx_itemize">
<span id="A8.I2.i1" class="ltx_item" style="list-style-type:none;"><span class="ltx_tag ltx_tag_item">•</span> 
<span id="A8.I2.i1.p1" class="ltx_para">
<span id="A8.I2.i1.p1.1" class="ltx_p"><span id="A8.I2.i1.p1.1.1" class="ltx_text ltx_font_sansserif" style="font-size:80%;--ltx-fg-color:#000000;">**Scholarly impact** : You can look at how often a book is cited in academic literature to measure its scholarly impact. For example, Google Scholar and Scopus are commonly used citation databases that provide information about how often an academic work is cited by other scholars.</span></span>
</span></span>
<span id="A8.I2.i2" class="ltx_item" style="list-style-type:none;"><span class="ltx_tag ltx_tag_item">•</span> 
<span id="A8.I2.i2.p1" class="ltx_para">
<span id="A8.I2.i2.p1.1" class="ltx_p"><span id="A8.I2.i2.p1.1.1" class="ltx_text ltx_font_sansserif" style="font-size:80%;--ltx-fg-color:#000000;">**Reviews** : In addition, you can look at book reviews to see how widely a book is discussed by scholars. Many academic journals and websites publish book reviews that discuss new academic works in their field.</span></span>
</span></span>
<span id="A8.I2.i3" class="ltx_item" style="list-style-type:none;"><span class="ltx_tag ltx_tag_item">•</span> 
<span id="A8.I2.i3.p1" class="ltx_para">
<span id="A8.I2.i3.p1.1" class="ltx_p"><span id="A8.I2.i3.p1.1.1" class="ltx_text ltx_font_sansserif" style="font-size:80%;--ltx-fg-color:#000000;">**Readership**: You can also assess how widely a book is read by scholars by looking at its sales and print run. For example, publishers often report how many copies of a book they have sold or printed, which provides a sense of how broadly a book has been adopted by scholars.</span></span>
</span></span>
</span>
<span id="A8.SS1.p6.pic1.1.2" class="ltx_p"><span id="A8.SS1.p6.pic1.1.2.1" class="ltx_text ltx_font_sansserif" style="font-size:80%;--ltx-fg-color:#000000;">In summary, you can look at how often an academic work is cited, discussed, and read to assess its scholarly impact.</span></span>
</span></span></span></foreignobject></g></g></svg>