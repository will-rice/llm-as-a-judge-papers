<svg id="A2.SS0.SSS0.Px2.p2.pic1" class="ltx_picture" height="379.11" overflow="visible" version="1.1" viewbox="0 0 650 379.11" width="650"><g style="--ltx-stroke-color:#000000;--ltx-fill-color:#000000;" fill="#000000" stroke="#000000" stroke-width="0.4pt" transform="translate(0,379.11) matrix(1 0 0 -1 0 0)"><g style="--ltx-fill-color:#8C8C8C;" fill="#8C8C8C" fill-opacity="1.0"><path style="stroke:none" d="M 0 3.74 L 0 375.37 C 0 377.43 1.67 379.11 3.74 379.11 L 646.26 379.11 C 648.33 379.11 650 377.43 650 375.37 L 650 3.74 C 650 1.67 648.33 0 646.26 0 L 3.74 0 C 1.67 0 0 1.67 0 3.74 Z" /></g><g style="--ltx-fill-color:#FAFAFA;" fill="#FAFAFA" fill-opacity="1.0"><path style="stroke:none" d="M 0.97 3.74 L 0.97 356.84 L 649.03 356.84 L 649.03 3.74 C 649.03 2.21 647.79 0.97 646.26 0.97 L 3.74 0.97 C 2.21 0.97 0.97 2.21 0.97 3.74 Z" /></g><g style="--ltx-fill-color:#737373;" fill="#737373" fill-opacity="1.0"><path style="stroke:none" d="M 0.97 357.81 L 0.97 375.37 C 0.97 376.9 2.21 378.14 3.74 378.14 L 646.26 378.14 C 647.79 378.14 649.03 376.9 649.03 375.37 L 649.03 357.81 Z" /></g><g fill-opacity="1.0" transform="matrix(1.0 0.0 0.0 1.0 14.59 364.86)"><foreignobject style="--ltx-fo-width:42.13em;--ltx-fo-height:0.68em;--ltx-fo-depth:0.23em;font-size:10pt;" height="12.45" overflow="visible" transform="matrix(1 0 0 -1 0 9.34)" width="582.96"><span class="ltx_foreignobject_container"><span class="ltx_foreignobject_content">
<span id="A2.SS0.SSS0.Px2.p2.pic1.1" class="ltx_inline-block ltx_minipage ltx_align_bottom" style="width:42.13em;">
<span id="A2.SS0.SSS0.Px2.p2.pic1.1.1" class="ltx_p"><span id="A2.SS0.SSS0.Px2.p2.pic1.1.1.1" class="ltx_text ltx_font_bold" style="font-size:90%;--ltx-fg-color:#FFFFFF;">Construct edit (treatment arm, <math id="A2.SS0.SSS0.Px2.p2.pic1.m1" class="ltx_Math" alttext="T_{\mathrm{C}}" display="inline" intent=":literal"><semantics><msub><mi style="--ltx-fg-color:#FFFFFF;" mathcolor="#FFFFFF">T</mi><mi style="--ltx-fg-color:#FFFFFF;" mathcolor="#FFFFFF" mathvariant="normal">C</mi></msub><annotation encoding="application/x-tex">T_{\mathrm{C}}</annotation></semantics></math>)</span></span>
</span></span></span></foreignobject></g><g fill-opacity="1.0" transform="matrix(1.0 0.0 0.0 1.0 14.59 14.94)"><foreignobject style="--ltx-fo-width:48.51em;--ltx-fo-height:23.93em;--ltx-fo-depth:0.23em;font-size:10pt;" height="334.17" overflow="visible" transform="matrix(1 0 0 -1 0 331.05)" width="671.24"><span class="ltx_foreignobject_container"><span class="ltx_foreignobject_content">
<span id="A2.SS0.SSS0.Px2.p2.pic1.2" class="ltx_inline-block ltx_minipage ltx_align_bottom" style="width:48.51em;">
<span id="A2.SS0.SSS0.Px2.p2.pic1.2.1" class="ltx_p"><span id="A2.SS0.SSS0.Px2.p2.pic1.2.1.1" class="ltx_text" style="font-size:90%;--ltx-fg-color:#000000;">You rewrite scientific sentences to make them claim MORE than their evidence supports, changing
nothing else.</span></span>
<span id="A2.SS0.SSS0.Px2.p2.pic1.2.2" class="ltx_p"><span id="A2.SS0.SSS0.Px2.p2.pic1.2.2.1" class="ltx_text" style="font-size:90%;--ltx-fg-color:#000000;">Input sentence (well-calibrated: it states exactly what the evidence licenses): <code id="A2.SS0.SSS0.Px2.p2.pic1.2.2.1.1" class="ltx_verbatim ltx_font_typewriter">{sentence}</code>
<br class="ltx_break">Evidence context from the source article: <code id="A2.SS0.SSS0.Px2.p2.pic1.2.2.1.2" class="ltx_verbatim ltx_font_typewriter">{evidence}</code></span></span>
<span id="A2.SS0.SSS0.Px2.p2.pic1.2.3" class="ltx_p"><span id="A2.SS0.SSS0.Px2.p2.pic1.2.3.1" class="ltx_text" style="font-size:90%;--ltx-fg-color:#000000;">Apply EXACTLY ONE edit of type <code id="A2.SS0.SSS0.Px2.p2.pic1.2.3.1.1" class="ltx_verbatim ltx_font_typewriter">{edit_type}</code> (<code id="A2.SS0.SSS0.Px2.p2.pic1.2.3.1.2" class="ltx_verbatim ltx_font_typewriter">{edit_gloss}</code>).</span></span>
<span id="A2.SS0.SSS0.Px2.p2.pic1.2.4" class="ltx_p"><span id="A2.SS0.SSS0.Px2.p2.pic1.2.4.1" class="ltx_text" style="font-size:90%;--ltx-fg-color:#000000;">Hard constraints. Violating any one of them makes the output useless:</span></span>
<span id="A2.I1" class="ltx_enumerate">
<span id="A2.I1.i1" class="ltx_item" style="list-style-type:none;"><span class="ltx_tag ltx_tag_item">1.</span> 
<span id="A2.I1.i1.p1" class="ltx_para">
<span id="A2.I1.i1.p1.1" class="ltx_p"><span id="A2.I1.i1.p1.1.1" class="ltx_text" style="font-size:90%;--ltx-fg-color:#000000;">Do NOT add, remove, or alter any factual content: no numbers changed, no entities swapped,
no new findings introduced.</span></span>
</span></span>
<span id="A2.I1.i2" class="ltx_item" style="list-style-type:none;padding-top:0.0pt;"><span class="ltx_tag ltx_tag_item">2.</span> 
<span id="A2.I1.i2.p1" class="ltx_para">
<span id="A2.I1.i2.p1.1" class="ltx_p"><span id="A2.I1.i2.p1.1.1" class="ltx_text" style="font-size:90%;--ltx-fg-color:#000000;">Do NOT introduce provenance language. Never write “this study”, “the authors”,
“Figure N”, “in our data”, or any equivalent. Neither sentence may point at a source.</span></span>
</span></span>
<span id="A2.I1.i3" class="ltx_item" style="list-style-type:none;padding-top:0.0pt;"><span class="ltx_tag ltx_tag_item">3.</span> 
<span id="A2.I1.i3.p1" class="ltx_para">
<span id="A2.I1.i3.p1.1" class="ltx_p"><span id="A2.I1.i3.p1.1.1" class="ltx_text" style="font-size:90%;--ltx-fg-color:#000000;">Keep the register identical. If the input is plain declarative prose, so is the output.</span></span>
</span></span>
<span id="A2.I1.i4" class="ltx_item" style="list-style-type:none;padding-top:0.0pt;"><span class="ltx_tag ltx_tag_item">4.</span> 
<span id="A2.I1.i4.p1" class="ltx_para">
<span id="A2.I1.i4.p1.1" class="ltx_p"><span id="A2.I1.i4.p1.1.1" class="ltx_text" style="font-size:90%;--ltx-fg-color:#000000;">Keep the length within </span><code id="A2.I1.i4.p1.1.2" class="ltx_verbatim ltx_font_typewriter" style="font-size:90%;--ltx-fg-color:#000000;">{tol}</code><span id="A2.I1.i4.p1.1.3" class="ltx_text" style="font-size:90%;--ltx-fg-color:#000000;"> percent of the input’s token count. If your edit would
shorten the sentence, compensate elsewhere WITHOUT adding content.</span></span>
</span></span>
<span id="A2.I1.i5" class="ltx_item" style="list-style-type:none;padding-top:0.0pt;"><span class="ltx_tag ltx_tag_item">5.</span> 
<span id="A2.I1.i5.p1" class="ltx_para">
<span id="A2.I1.i5.p1.1" class="ltx_p"><span id="A2.I1.i5.p1.1.1" class="ltx_text" style="font-size:90%;--ltx-fg-color:#000000;">Change exactly one scope slot (the one named above) and leave the others alone.</span></span>
</span></span>
</span>
<span id="A2.SS0.SSS0.Px2.p2.pic1.2.5" class="ltx_p"><span id="A2.SS0.SSS0.Px2.p2.pic1.2.5.1" class="ltx_text" style="font-size:90%;--ltx-fg-color:#000000;">Return JSON only: <code id="A2.SS0.SSS0.Px2.p2.pic1.2.5.1.1" class="ltx_verbatim ltx_font_typewriter">{&quot;edited&quot;: ..., &quot;slot_changed&quot;: &quot;{edit_type}&quot;, &quot;what_widened&quot;: ...,</code>
<code id="A2.SS0.SSS0.Px2.p2.pic1.2.5.1.2" class="ltx_verbatim ltx_font_typewriter">&quot;what_it_became&quot;: ..., &quot;facts_preserved&quot;: true, &quot;anchor_free&quot;: true}</code></span></span>
</span></span></span></foreignobject></g></g></svg>