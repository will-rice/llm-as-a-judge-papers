<span id="A2.F12.pic1.2" class="ltx_inline-block ltx_minipage ltx_align_bottom" style="width:36.89em;">
<span id="A2.F12.pic1.2.1" class="ltx_p ltx_parbox ltx_align_middle" style="width:368.9pt;"><span id="A2.F12.pic1.2.1.1" class="ltx_text ltx_font_bold" style="--ltx-fg-color:#000000;">System Message:</span><span id="A2.F12.pic1.2.1.2" class="ltx_text" style="--ltx-fg-color:#000000;"> </span><pre id="A2.F12.pic1.2.1.3" class="ltx_verbatim ltx_font_typewriter" style="--ltx-fg-color:#000000;">
You are an efficient assistant tasked with evaluating and selecting the most suitable large language model (LLM) based on the quality of their responses to specific instructions. This evaluation process will be used to generate a ranking that reflects the most accurate and user-preferred outputs.</pre></span>
<span id="A2.F12.pic1.2.2" class="ltx_p ltx_parbox ltx_align_middle" style="width:368.9pt;"><span id="A2.F12.pic1.2.2.1" class="ltx_text ltx_font_bold" style="--ltx-fg-color:#000000;">User Message:</span><span id="A2.F12.pic1.2.2.2" class="ltx_text" style="--ltx-fg-color:#000000;"> </span><pre id="A2.F12.pic1.2.2.3" class="ltx_verbatim ltx_font_typewriter" style="--ltx-fg-color:#000000;">
I need a ranking for several large language models. I’ll provide you with prompts given to these models and their corresponding results. Your role is to assess these outputs and choose the one that delivers the best result from a human perspective.
## Instruction
{
 &quot;instruction&quot;: &quot;&quot;&quot;<span id="A2.F12.pic1.2.2.3.1" class="ltx_text" style="--ltx-fg-color:#FF8000;">{instruction}</span>&quot;&quot;&quot;,
}
## Model Outputs
Here are the unordered responses from the models. Each result is tied to a model with a unique identifier.
{
 {
  &quot;model_identifier&quot;: &quot;m&quot;,
  &quot;output&quot;: &quot;&quot;&quot;<span id="A2.F12.pic1.2.2.3.2" class="ltx_text" style="--ltx-fg-color:#FF8000;">{output_1}</span>&quot;&quot;&quot;
 },
 {
  &quot;model_identifier&quot;: &quot;M&quot;,
  &quot;output&quot;: &quot;&quot;&quot;<span id="A2.F12.pic1.2.2.3.3" class="ltx_text" style="--ltx-fg-color:#FF8000;">{output_2}</span>&quot;&quot;&quot;
 }
}
## Task
Evaluate the models based on the relevance and quality of their responses, and choose the model that provided the best result. Your answer should only include the model identifier for the best model. Your final response will be used as the name of the top model, so ensure that it only contains one of the following identifiers with no additional characters (no spaces, quotes, or new lines): m or M.
## Best Model Identifier</pre></span>
