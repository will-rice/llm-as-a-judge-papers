<span id="S3.F2.pic1.3.2" class="ltx_p ltx_align_left"><span id="S3.F2.pic1.3.2.1" class="ltx_text ltx_font_bold" style="font-size:70%;">Answers, grade formula and label
<br class="ltx_break" style="--ltx-break-space:2.0pt;"><span id="S3.F2.pic1.3.2.1.1" class="ltx_text ltx_font_medium">
<math id="S3.F2.pic1.m1" class="ltx_Math" alttext="g_{k}(d)=0" display="inline" intent=":literal"><semantics><mrow><mrow><msub><mi>g</mi><mi>k</mi></msub><mo lspace="0em" rspace="0em">​</mo><mrow><mo stretchy="false">(</mo><mi>d</mi><mo stretchy="false">)</mo></mrow></mrow><mo>=</mo><mn>0</mn></mrow><annotation encoding="application/x-tex">g_{k}(d)=0</annotation></semantics></math> if not on subject; 1 if no answer; 3 if exact and dedicated; 2 otherwise.
<br class="ltx_break"><math id="S3.F2.pic1.m2" class="ltx_Math" alttext="\ell(d)=\left\lfloor\frac{1}{3}\sum_{k=1}^{3}g_{k}(d)\right\rfloor" display="inline" intent=":literal"><semantics><mrow><mrow><mi mathvariant="normal">ℓ</mi><mo>⁡</mo><mrow><mo stretchy="false">(</mo><mi>d</mi><mo stretchy="false">)</mo></mrow></mrow><mo>=</mo><mrow><mo>⌊</mo><mrow><mfrac><mn>1</mn><mn>3</mn></mfrac><mo lspace="0em" rspace="0em">​</mo><mrow><msubsup><mo>∑</mo><mrow><mi>k</mi><mo>=</mo><mn>1</mn></mrow><mn>3</mn></msubsup><mrow><msub><mi>g</mi><mi>k</mi></msub><mo lspace="0em" rspace="0em">​</mo><mrow><mo stretchy="false">(</mo><mi>d</mi><mo stretchy="false">)</mo></mrow></mrow></mrow></mrow><mo>⌋</mo></mrow></mrow><annotation encoding="application/x-tex">\ell(d)=\left\lfloor\frac{1}{3}\sum_{k=1}^{3}g_{k}(d)\right\rfloor</annotation></semantics></math>
<br class="ltx_break" style="--ltx-break-space:3.0pt;">
<math id="S3.F2.pic1.m3" class="ltx_Math" alttext="d_{1}" display="inline" intent=":literal"><semantics><msub><mi>d</mi><mn>1</mn></msub><annotation encoding="application/x-tex">d_{1}</annotation></semantics></math>: <span id="S3.F2.pic1.3.2.1.1.1" class="ltx_text ltx_font_italic">The Salvation Army was founded in London’s East End in 1865 by one-time Methodist minister William Booth …
<br class="ltx_break"></span>program 1 answers: on subject, some, exact, dedicated; grades <math id="S3.F2.pic1.m4" class="ltx_Math" alttext="(3,3,3)\rightarrow\ell=3" display="inline" intent=":literal"><semantics><mrow><mrow><mo stretchy="false">(</mo><mn>3</mn><mo>,</mo><mn>3</mn><mo>,</mo><mn>3</mn><mo stretchy="false">)</mo></mrow><mo stretchy="false">→</mo><mi mathvariant="normal">ℓ</mi><mo>=</mo><mn>3</mn></mrow><annotation encoding="application/x-tex">(3,3,3)\rightarrow\ell=3</annotation></semantics></math> (NIST 3)
<br class="ltx_break" style="--ltx-break-space:2.0pt;">
<math id="S3.F2.pic1.m5" class="ltx_Math" alttext="d_{2}" display="inline" intent=":literal"><semantics><msub><mi>d</mi><mn>2</mn></msub><annotation encoding="application/x-tex">d_{2}</annotation></semantics></math>: <span id="S3.F2.pic1.3.2.1.1.2" class="ltx_text ltx_font_italic">…a quasi-military command structure in 1878 when the title, ‘The Salvation Army’, was brought into use.
<br class="ltx_break"></span>program 1 answers: on subject only; grades <math id="S3.F2.pic1.m6" class="ltx_Math" alttext="(1,0,1)\rightarrow\ell=\lfloor 0.67\rfloor=0" display="inline" intent=":literal"><semantics><mrow><mrow><mo stretchy="false">(</mo><mn>1</mn><mo>,</mo><mn>0</mn><mo>,</mo><mn>1</mn><mo stretchy="false">)</mo></mrow><mo stretchy="false">→</mo><mi mathvariant="normal">ℓ</mi><mo>=</mo><mrow><mo maxsize="1.430em" minsize="1.430em" stretchy="true">⌊</mo><mn>0.67</mn><mo maxsize="1.430em" minsize="1.430em" stretchy="true">⌋</mo></mrow><mo>=</mo><mn>0</mn></mrow><annotation encoding="application/x-tex">(1,0,1)\rightarrow\ell=\lfloor 0.67\rfloor=0</annotation></semantics></math> (NIST 0)</span></span></span>
