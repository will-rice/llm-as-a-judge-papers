<span id="A10.F8.pic1.p3.pic1.1" class="ltx_inline-block ltx_minipage ltx_align_bottom" style="width:41.73em;">
<span id="A10.F8.pic1.p3.pic1.1.1" class="ltx_p">A 2D fluid flow is described by the velocity field:</span>
<span id="A10.F8.pic1.p3.pic1.1.2" class="ltx_p">u = -1xy</span>
<span id="A10.F8.pic1.p3.pic1.1.3" class="ltx_p">v = 1x<span id="A10.F8.pic1.p3.pic1.1.3.1" class="ltx_text" style="--ltx-fg-color:#000000;">ˆ</span>2 - 2y<span id="A10.F8.pic1.p3.pic1.1.3.2" class="ltx_text" style="--ltx-fg-color:#000000;">ˆ</span>2</span>
<span id="A10.F8.pic1.p3.pic1.1.4" class="ltx_p">where u and v are in m/s, and x and y are in meters.</span>
<span id="A10.F8.pic1.p3.pic1.1.5" class="ltx_p">Calculate the vorticity at the point (1.3, 1.1) m and determine if the flow is rotational or
irrotational at that point.</span>
</span></span></span></foreignobject></g></g></svg>