<span id="S1.p4.pic1.2.1" class="ltx_p"><span id="S1.p4.pic1.2.1.1" class="ltx_text" style="--ltx-fg-color:#000000;">A model’s own likelihood over a candidate hypothesis is a stronger signal of scientific correctness than explicitly prompting a proprietary model to rank candidates. Nearly every open-weight LLM we tested beats the prompted baseline. Which intrinsic scorer is better, however, is model-dependent: the raw-logit energy criterion helps some models substantially and fails for others, and understanding why is an open question.</span></span>
</span></span></span></foreignobject></g></g></svg>