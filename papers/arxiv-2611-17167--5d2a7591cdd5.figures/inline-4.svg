n class="ltx_foreignobject_container"><span class="ltx_foreignobject_content"><span id="S3.SS3.p1.pic1.1" class="ltx_text ltx_font_bold" style="--ltx-fg-color:#FFFFFF;">Finding 3</span></span></span></foreignobject></g></g></g><g fill-opacity="1.0" transform="matrix(1.0 0.0 0.0 1.0 17.36 11.82)"><foreignobject style="--ltx-fo-width:27.82em;--ltx-fo-height:9.09em;--ltx-fo-depth:0em;font-size:10pt;" height="125.84" overflow="visible" transform="matrix(1 0 0 -1 0 125.84)" width="384.95"><span class="ltx_foreignobject_container"><span class="ltx_foreignobject_content">
<span id="S3.SS3.p1.pic1.2" class="ltx_inline-block ltx_minipage ltx_align_bottom" style="width:27.82em;">
<span id="S3.SS3.p1.pic1.2.1" class="ltx_p"><span id="S3.SS3.p1.pic1.2.1.1" class="ltx_text ltx_font_bold" style="--ltx-fg-color:#000000;">The judgments that best distinguish action contributions also provide the most effective supervision for policy learning. Scoring whether each action helped achieve the goal after seeing the whole trajectory produces the strongest policies, with the largest gains on tasks that the Actor struggles to complete. The trained policies outperform the decision model that teaches them, especially on tasks it rarely completes as an Actor.</span></span>
</span></span></span></foreignobject></g></g></svg>