<span id="A11.T13.pic1.1" class="ltx_inline-block ltx_minipage ltx_align_bottom" style="width:44.07em;">
<span id="A11.T13.pic1.1.1" class="ltx_p"><span id="A11.T13.pic1.1.1.1" class="ltx_text" style="--ltx-fg-color:#000000;">[Question] <span id="A11.T13.pic1.1.1.1.1" class="ltx_text" style="--ltx-fg-color:#0000E6;">{Q}</span></span></span>
<span id="A11.T13.pic1.1.2" class="ltx_p"><span id="A11.T13.pic1.1.2.1" class="ltx_text" style="--ltx-fg-color:#000000;">[The Start of Assistant A’s response] <span id="A11.T13.pic1.1.2.1.1" class="ltx_text" style="--ltx-fg-color:#0000E6;">{R1}</span> [The End of Assistant A’s response]</span></span>
<span id="A11.T13.pic1.1.3" class="ltx_p"><span id="A11.T13.pic1.1.3.1" class="ltx_text" style="--ltx-fg-color:#000000;">[The Start of Assistant B’s response] <span id="A11.T13.pic1.1.3.1.1" class="ltx_text" style="--ltx-fg-color:#0000E6;">{R2}</span> [The End of Assistant B’s response]</span></span>
<span id="A11.T13.pic1.1.4" class="ltx_p"><span id="A11.T13.pic1.1.4.1" class="ltx_text" style="--ltx-fg-color:#000000;">[System]</span></span>
<span id="A11.T13.pic1.1.5" class="ltx_p"><span id="A11.T13.pic1.1.5.1" class="ltx_text" style="--ltx-fg-color:#000000;">Please act as an impartial judge and evaluate the quality of the responses provided by two AI assistants to the user question displayed below.</span></span>
<span id="A11.T13.pic1.1.6" class="ltx_p"><span id="A11.T13.pic1.1.6.1" class="ltx_text" style="--ltx-fg-color:#000000;">You should choose the assistant that follows the user’s instructions and answers the user’s question better. Your evaluation should consider factors such as the helpfulness, relevance, accuracy, depth, creativity, and level of detail of their responses. Begin your evaluation by comparing the two responses and provide a short explanation.</span></span>
<span id="A11.T13.pic1.1.7" class="ltx_p"><span id="A11.T13.pic1.1.7.1" class="ltx_text" style="--ltx-fg-color:#000000;">Avoid any positional biases and ensure that the order in which the responses were presented does not influence your decision. Do not allow the length of the responses to influence your evaluation. Do not favor certain names of the assistants. Be as objective as possible.</span></span>
<span id="A11.T13.pic1.1.8" class="ltx_p"><span id="A11.T13.pic1.1.8.1" class="ltx_text" style="--ltx-fg-color:#000000;">After providing your explanation, output your final verdict by strictly following this format: [[A]] if assistant A is better, [[B]] if assistant B is better, and [[C]] for a tie.</span></span>
</span></span></span></foreignobject></g></g></svg>