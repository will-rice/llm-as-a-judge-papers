<span id="A4.p4.pic1.p4" class="ltx_para">
<span id="A4.p4.pic1.p4.1" class="ltx_p"><span id="A4.p4.pic1.p4.1.1" class="ltx_text" style="--ltx-fg-color:#000000;">You are given a task in some context (<span id="A4.p4.pic1.p4.1.1.1" class="ltx_text ltx_font_bold">Input</span>), and a candidate answer. Evaluate whether the response is correct and accurate, focusing only on content and solution validity.</span></span>
<span id="A4.p4.pic1.p4.2" class="ltx_p"><span id="A4.p4.pic1.p4.2.1" class="ltx_text" style="--ltx-fg-color:#000000;">Note that style, presentation, format, or language issues should not affect the evaluation of correctness.</span></span>
</span>
<span id="A4.p4.pic1.p1" class="ltx_para ltx_noindent">
<span id="A4.p4.pic1.p1.1" class="ltx_p"><span id="A4.p4.pic1.p1.1.1" class="ltx_text ltx_font_bold" style="--ltx-fg-color:#000000;">Task:</span><span id="A4.p4.pic1.p1.1.2" class="ltx_text" style="--ltx-fg-color:#000000;"> {prompt}</span>
<br class="ltx_break"><span id="A4.p4.pic1.p1.1.3" class="ltx_text ltx_font_bold" style="--ltx-fg-color:#000000;">Candidate Response:</span><span id="A4.p4.pic1.p1.1.4" class="ltx_text" style="--ltx-fg-color:#000000;"> {prediction}</span></span>
</span>
<span id="A4.p4.pic1.p2" class="ltx_para ltx_noindent">
<span id="A4.p4.pic1.p2.1" class="ltx_p"><span id="A4.p4.pic1.p2.1.1" class="ltx_text ltx_font_bold" style="--ltx-fg-color:#000000;">Instruction:</span><span id="A4.p4.pic1.p2.1.2" class="ltx_text" style="--ltx-fg-color:#000000;"> Evaluate whether the response is correct and accurate for the given task.</span></span>
</span>
<span id="A4.p4.pic1.p5" class="ltx_para">
<span id="A4.p4.pic1.p5.1" class="ltx_p"><span id="A4.p4.pic1.p5.1.1" class="ltx_text" style="--ltx-fg-color:#000000;">First explain your reasoning, then provide your final answer. Use the following format:</span></span>
<span id="A4.p4.pic1.p5.2" class="ltx_quote">
<span id="A4.p4.pic1.p5.2.1" class="ltx_p"><span id="A4.p4.pic1.p5.2.1.1" class="ltx_text" style="--ltx-fg-color:#000000;">Explanation: [Explanation], Answer: [Answer]</span></span>
</span>
</span>
<span id="A4.p4.pic1.p3" class="ltx_para ltx_noindent">
<span id="A4.p4.pic1.p3.1" class="ltx_p"><span id="A4.p4.pic1.p3.1.1" class="ltx_text" style="--ltx-fg-color:#000000;">where </span><span id="A4.p4.pic1.p3.1.2" class="ltx_text ltx_font_typewriter" style="--ltx-fg-color:#000000;">[Answer]</span><span id="A4.p4.pic1.p3.1.3" class="ltx_text" style="--ltx-fg-color:#000000;"> is one of:</span></span>
<span id="A4.p4.pic1.p3.2" class="ltx_quote">
<span id="A4.p4.pic1.p3.2.1" class="ltx_p"><span id="A4.p4.pic1.p3.2.1.1" class="ltx_text ltx_font_typewriter" style="--ltx-fg-color:#000000;">correct
<br class="ltx_break">partially correct
<br class="ltx_break">incorrect</span></span>
</span>
</span></span></span></span></foreignobject></g></g></svg>