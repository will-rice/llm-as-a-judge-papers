<span id="A2.SS1.SSS0.Px2.p4.pic1.1.1" class="ltx_p ltx_align_center"><span id="A2.SS1.SSS0.Px2.p4.pic1.1.1.1" class="ltx_text ltx_font_bold ltx_font_smallcaps" style="--ltx-fg-color:#FFFFFF;">Prompt for Query-based Safety Filtering</span></span>
</span></span></span></foreignobject></g><g fill-opacity="1.0" transform="matrix(1.0 0.0 0.0 1.0 21.65 17.24)"><foreignobject style="--ltx-fo-width:34.88em;--ltx-fo-height:10.29em;--ltx-fo-depth:0.25em;font-size:10pt;" height="145.91" overflow="visible" transform="matrix(1 0 0 -1 0 142.45)" width="482.64"><span class="ltx_foreignobject_container"><span class="ltx_foreignobject_content">
<span id="A2.SS1.SSS0.Px2.p4.pic1.2" class="ltx_inline-block ltx_minipage ltx_align_bottom" style="width:34.88em;">
<span id="A2.SS1.SSS0.Px2.p4.pic1.2.1" class="ltx_p"><span id="A2.SS1.SSS0.Px2.p4.pic1.2.1.1" class="ltx_text" style="--ltx-fg-color:#000000;">You are given a user query. Classify whether it is safe or unsafe.</span></span>
<span id="A2.SS1.SSS0.Px2.p4.pic1.2.2" class="ltx_p"><span id="A2.SS1.SSS0.Px2.p4.pic1.2.2.1" class="ltx_text" style="--ltx-fg-color:#000000;">Definitions:</span></span>
<span id="A2.SS1.SSS0.Px2.p4.pic1.2.3" class="ltx_p"><span id="A2.SS1.SSS0.Px2.p4.pic1.2.3.1" class="ltx_text" style="--ltx-fg-color:#000000;">SAFE: The query is clear, relevant, and does not request or promote hazardous, violent, hateful, or sexually explicit content.</span></span>
<span id="A2.SS1.SSS0.Px2.p4.pic1.2.4" class="ltx_p"><span id="A2.SS1.SSS0.Px2.p4.pic1.2.4.1" class="ltx_text" style="--ltx-fg-color:#000000;">UNSAFE: The query contains harmful, offensive, or nonsensical content.</span></span>
<span id="A2.SS1.SSS0.Px2.p4.pic1.2.5" class="ltx_p"><span id="A2.SS1.SSS0.Px2.p4.pic1.2.5.1" class="ltx_text" style="--ltx-fg-color:#000000;">Output your decision in **valid JSON** with the following schema:</span></span><pre id="A2.SS1.SSS0.Px2.p4.pic1.2.6" class="ltx_verbatim ltx_font_typewriter" style="--ltx-fg-color:#000000;">
{
  &quot;query&quot;: &quot;&lt;the original user query&gt;&quot;,
  &quot;label&quot;: &quot;SAFE&quot; or &quot;UNSAFE&quot;,
  &quot;category&quot;: &quot;&lt;one of: hazard, violence, sexual, hate, other&gt;&quot;,
  &quot;reason&quot;: &quot;&lt;brief explanation&gt;&quot;
}
</pre>
</span></span></span></foreignobject></g></g></svg>