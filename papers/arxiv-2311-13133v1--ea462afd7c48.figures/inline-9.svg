<svg id="A6.SS2.p10.pic1" class="ltx_picture" height="87.83" overflow="visible" version="1.1" viewbox="0 0 477.38 87.83" width="477.38"><g style="--ltx-stroke-color:#000000;--ltx-fill-color:#000000;" fill="#000000" stroke="#000000" stroke-width="0.4pt" transform="translate(0,87.83) matrix(1 0 0 -1 0 0)"><g style="--ltx-fill-color:#FFFFFF;" fill="#FFFFFF" fill-opacity="1.0"><path style="stroke:none" d="M 0 0 L 0 87.83 L 477.38 87.83 L 477.38 0 Z" /></g><g style="--ltx-fill-color:#F2F2F2;" fill="#F2F2F2" fill-opacity="1.0"><path style="stroke:none" d="M 1.97 1.97 L 1.97 85.86 L 475.41 85.86 L 475.41 1.97 Z" /></g><g fill-opacity="1.0" transform="matrix(1.0 0.0 0.0 1.0 21.65 16.55)"><foreignobject style="--ltx-fo-width:36.91em;--ltx-fo-height:4.16em;--ltx-fo-depth:0.2em;font-size:10pt;" height="60.27" overflow="visible" transform="matrix(1 0 0 -1 0 57.5)" width="510.73"><span class="ltx_foreignobject_container"><span class="ltx_foreignobject_content">
<span id="A6.SS2.p10.pic1.1" class="ltx_inline-block ltx_minipage ltx_align_bottom" style="width:36.91em;">
<span id="A6.SS2.p10.pic1.1.1" class="ltx_p"><span id="A6.SS2.p10.pic1.1.1.1" class="ltx_text ltx_font_sansserif" style="font-size:80%;--ltx-fg-color:#000000;">We create a right triangle with the slant height as the hypotenuse, the height from the vertex to the center of the base as one of the legs, and a radius as the other leg. By Pythagorean theorem, the radius measures <math id="A6.SS2.p10.pic1.m1" class="ltx_Math" alttext="\sqrt{13^{2}-12^{2}}=5" display="inline" intent=":literal"><semantics><mrow><msqrt style="--ltx-fg-color:#000000;" mathcolor="#000000"><mrow><msup><mn style="--ltx-fg-color:#000000;" mathcolor="#000000">13</mn><mn style="--ltx-fg-color:#000000;" mathcolor="#000000">2</mn></msup><mo style="--ltx-fg-color:#000000;" mathcolor="#000000">−</mo><msup><mn style="--ltx-fg-color:#000000;" mathcolor="#000000">12</mn><mn style="--ltx-fg-color:#000000;" mathcolor="#000000">2</mn></msup></mrow></msqrt><mo style="--ltx-fg-color:#000000;" mathcolor="#000000">=</mo><mn style="--ltx-fg-color:#000000;" mathcolor="#000000">5</mn></mrow><annotation encoding="application/x-tex">\sqrt{13^{2}-12^{2}}=5</annotation></semantics></math> cm. It follows that the volume of the cone is <math id="A6.SS2.p10.pic1.m2" class="ltx_Math" alttext="(1/3)\pi(5^{2})(12)=100\pi" display="inline" intent=":literal"><semantics><mrow><mrow><mrow><mo style="--ltx-fg-color:#000000;" mathcolor="#000000" stretchy="false">(</mo><mrow><mn style="--ltx-fg-color:#000000;" mathcolor="#000000">1</mn><mo style="--ltx-fg-color:#000000;" mathcolor="#000000">/</mo><mn style="--ltx-fg-color:#000000;" mathcolor="#000000">3</mn></mrow><mo style="--ltx-fg-color:#000000;" mathcolor="#000000" stretchy="false">)</mo></mrow><mo lspace="0em" rspace="0em">​</mo><mi style="--ltx-fg-color:#000000;" mathcolor="#000000">π</mi><mo lspace="0em" rspace="0em">​</mo><mrow><mo style="--ltx-fg-color:#000000;" mathcolor="#000000" stretchy="false">(</mo><msup><mn style="--ltx-fg-color:#000000;" mathcolor="#000000">5</mn><mn style="--ltx-fg-color:#000000;" mathcolor="#000000">2</mn></msup><mo style="--ltx-fg-color:#000000;" mathcolor="#000000" stretchy="false">)</mo></mrow><mo lspace="0em" rspace="0em">​</mo><mrow><mo style="--ltx-fg-color:#000000;" mathcolor="#000000" stretchy="false">(</mo><mn style="--ltx-fg-color:#000000;" mathcolor="#000000">12</mn><mo style="--ltx-fg-color:#000000;" mathcolor="#000000" stretchy="false">)</mo></mrow></mrow><mo style="--ltx-fg-color:#000000;" mathcolor="#000000">=</mo><mrow><mn style="--ltx-fg-color:#000000;" mathcolor="#000000">100</mn><mo lspace="0em" rspace="0em">​</mo><mi style="--ltx-fg-color:#000000;" mathcolor="#000000">π</mi></mrow></mrow><annotation encoding="application/x-tex">(1/3)\pi(5^{2})(12)=100\pi</annotation></semantics></math>.</span></span>
</span></span></span></foreignobject></g></g></svg>