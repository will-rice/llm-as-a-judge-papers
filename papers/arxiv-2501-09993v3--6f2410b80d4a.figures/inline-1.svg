<span id="A5.SS1.p1.pic1.2.1" class="ltx_p"><span id="A5.SS1.p1.pic1.2.1.1" class="ltx_text ltx_font_bold" style="--ltx-fg-color:#000000;">[Begin story excerpt]<span id="A5.SS1.p1.pic1.2.1.1.1" class="ltx_text ltx_font_medium"> 
<br class="ltx_break">“Christmas won’t be Christmas without any presents,” grumbled Jo. “It’s so dreadful to be poor!” sighed Meg, looking out the window at the snow-covered streets of Concord. “I don’t think it’s fair…” 
<br class="ltx_break">… 
<br class="ltx_break">“Glad to find you so merry, my girls,” said a cheery voice at the door… “A letter! A letter! Three cheers for Father!” 
<br class="ltx_break"></span>[End story excerpt]<span id="A5.SS1.p1.pic1.2.1.1.2" class="ltx_text ltx_font_medium"> 
<br class="ltx_break"></span></span></span>
