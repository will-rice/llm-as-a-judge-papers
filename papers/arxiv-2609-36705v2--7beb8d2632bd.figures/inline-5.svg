<span id="A1.F11.p1.pic1.1.3" class="ltx_p ltx_align_left"><span id="A1.F11.p1.pic1.1.3.1" class="ltx_text ltx_font_bold" style="font-size:90%;--ltx-fg-color:#000000;">Label basis:<span id="A1.F11.p1.pic1.1.3.1.1" class="ltx_text ltx_font_medium"> recorded human preference.</span></span></span>
