<span id="A1.SS6.p6.pic1.2" class="ltx_inline-block ltx_minipage ltx_align_bottom" style="width:36.62em;">
<span id="A1.SS6.p6.pic1.2.1" class="ltx_p"><span id="A1.SS6.p6.pic1.2.1.1" class="ltx_text ltx_font_bold" style="--ltx-fg-color:#000000;">System Prompt:
<br class="ltx_break"><span id="A1.SS6.p6.pic1.2.1.1.1" class="ltx_text ltx_font_medium">You are a fair judge assistant assigned to deliver insightful feedback that compares individual performances, highlighting how each stands relative to others within the same cohort.
<br class="ltx_break"></span></span></span>
<span id="A1.SS6.p6.pic1.2.2" class="ltx_p"><span id="A1.SS6.p6.pic1.2.2.1" class="ltx_text ltx_font_bold" style="--ltx-fg-color:#000000;">User Prompt:
<br class="ltx_break"><span id="A1.SS6.p6.pic1.2.2.1.1" class="ltx_text ltx_font_medium">###Task Description:
<br class="ltx_break">An instruction (might include an Input inside it), a response to evaluate, and a score rubric representing a evaluation criteria are given.
<br class="ltx_break">1. Write a detailed feedback that assess the quality of two responses strictly based on the given score rubric, not evaluating in general.
<br class="ltx_break">2. After writing a feedback, choose a better response between Response A and Response B. You should refer to the score rubric.
<br class="ltx_break">3. The output format should look as follows: “(write a feedback for criteria) [RESULT] (A or B)”
4. Please do not generate any other opening, closing, and explanations.
<br class="ltx_break"></span></span></span>
<span id="A1.SS6.p6.pic1.2.3" class="ltx_p"><span id="A1.SS6.p6.pic1.2.3.1" class="ltx_text" style="--ltx-fg-color:#000000;">###Instruction:
<br class="ltx_break">{question}
<br class="ltx_break"></span></span>
<span id="A1.SS6.p6.pic1.2.4" class="ltx_p"><span id="A1.SS6.p6.pic1.2.4.1" class="ltx_text" style="--ltx-fg-color:#000000;">###Response A:
<br class="ltx_break">{response_a}
<br class="ltx_break"></span></span>
<span id="A1.SS6.p6.pic1.2.5" class="ltx_p"><span id="A1.SS6.p6.pic1.2.5.1" class="ltx_text" style="--ltx-fg-color:#000000;">###Response B:
<br class="ltx_break">{response_b}
<br class="ltx_break"></span></span>
<span id="A1.SS6.p6.pic1.2.6" class="ltx_p"><span id="A1.SS6.p6.pic1.2.6.1" class="ltx_text" style="--ltx-fg-color:#000000;">###Score Rubric:
<br class="ltx_break">[Are the model’s responses factually correct and well-supported by evidence?]
<br class="ltx_break"></span></span>
