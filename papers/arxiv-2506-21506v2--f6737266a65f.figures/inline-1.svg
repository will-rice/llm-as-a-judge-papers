<svg id="A4.SS2.p4.pic1" class="ltx_picture" height="692.43" overflow="visible" version="1.1" viewbox="0 0 477.38 692.43" width="477.38"><g style="--ltx-stroke-color:#000000;--ltx-fill-color:#000000;" fill="#000000" stroke="#000000" stroke-width="0.4pt" transform="translate(0,692.43) matrix(1 0 0 -1 0 0)"><g style="--ltx-fill-color:#003B00;" fill="#003B00" fill-opacity="1.0"><path style="stroke:none" d="M 0 5.91 L 0 686.52 C 0 689.79 2.64 692.43 5.91 692.43 L 471.47 692.43 C 474.73 692.43 477.38 689.79 477.38 686.52 L 477.38 5.91 C 477.38 2.64 474.73 0 471.47 0 L 5.91 0 C 2.64 0 0 2.64 0 5.91 Z" /></g><g style="--ltx-fill-color:#E6F1E6;" fill="#E6F1E6" fill-opacity="1.0"><path style="stroke:none" d="M 1.97 5.91 L 1.97 668.32 L 475.41 668.32 L 475.41 5.91 C 475.41 3.73 473.65 1.97 471.47 1.97 L 5.91 1.97 C 3.73 1.97 1.97 3.73 1.97 5.91 Z" /></g><g fill-opacity="1.0" transform="matrix(1.0 0.0 0.0 1.0 21.65 676.92)"><foreignobject style="--ltx-fo-width:31.37em;--ltx-fo-height:0.69em;--ltx-fo-depth:0.19em;font-size:10pt;" height="12.3" overflow="visible" transform="matrix(1 0 0 -1 0 9.61)" width="434.07"><span class="ltx_foreignobject_container"><span class="ltx_foreignobject_content">
<span id="A4.SS2.p4.pic1.1" class="ltx_inline-block ltx_minipage ltx_align_bottom" style="width:31.37em;">
<span id="A4.SS2.p4.pic1.1.1" class="ltx_p"><span id="A4.SS2.p4.pic1.1.1.1" class="ltx_text" style="--ltx-fg-color:#FFFFFF;">Prompt for Extractor</span></span>
</span></span></span></foreignobject></g><g fill-opacity="1.0" transform="matrix(1.0 0.0 0.0 1.0 21.65 16.89)"><foreignobject style="--ltx-fo-width:33.91em;--ltx-fo-height:46.23em;--ltx-fo-depth:0.23em;font-size:10pt;" height="642.74" overflow="visible" transform="matrix(1 0 0 -1 0 639.62)" width="469.22"><span class="ltx_foreignobject_container"><span class="ltx_foreignobject_content">
<span id="A4.SS2.p4.pic1.2" class="ltx_inline-block ltx_minipage ltx_align_bottom" style="width:33.91em;">
<span id="A4.SS2.p4.pic1.2.1" class="ltx_p"><span id="A4.SS2.p4.pic1.2.1.1" class="ltx_text" style="font-size:90%;--ltx-fg-color:#000000;">You are responsible for extracting specific information of interest from the provided answer text for a task. For context, we are evaluating the correctness of an answer to a web information-gathering task. This extraction step helps us identify relevant information for subsequent validation. You must carefully follow the provided extraction instructions to accurately extract information from the answer.</span></span>
<span id="A4.SS2.p4.pic1.2.2" class="ltx_p"><span id="A4.SS2.p4.pic1.2.2.1" class="ltx_text ltx_font_bold" style="font-size:90%;--ltx-fg-color:#000000;">GENERAL RULES:<span id="A4.SS2.p4.pic1.2.2.1.1" class="ltx_text"></span></span></span>
<span id="A4.SS2.p4.pic1.2.3" class="ltx_p"><span id="A4.SS2.p4.pic1.2.3.1" class="ltx_text" style="font-size:90%;--ltx-fg-color:#000000;">1. Do not add, omit, or invent any information. Extract only information explicitly mentioned in the provided answer exactly as it appears.</span></span>
<span id="A4.SS2.p4.pic1.2.4" class="ltx_p"><span id="A4.SS2.p4.pic1.2.4.1" class="ltx_text" style="font-size:90%;--ltx-fg-color:#000000;">2. If any required information is missing from the answer, explicitly return <span id="A4.SS2.p4.pic1.2.4.1.1" class="ltx_text ltx_font_typewriter">null</span> as the JSON value.</span></span>
<span id="A4.SS2.p4.pic1.2.5" class="ltx_p"><span id="A4.SS2.p4.pic1.2.5.1" class="ltx_text" style="font-size:90%;--ltx-fg-color:#000000;">3. You will also receive the original task description as context. Understand it clearly, as it provides essential background for the extraction. You may apply common-sense reasoning to assist your extraction, but your final result must be accurately extracted from the answer text provided.</span></span>
<span id="A4.SS2.p4.pic1.2.6" class="ltx_p"><span id="A4.SS2.p4.pic1.2.6.1" class="ltx_text" style="font-size:90%;--ltx-fg-color:#000000;">4. Occasionally, additional instructions might be provided to aid your extraction. Carefully follow those instructions when available.</span></span>
<span id="A4.SS2.p4.pic1.2.7" class="ltx_p"><span id="A4.SS2.p4.pic1.2.7.1" class="ltx_text ltx_font_bold" style="font-size:90%;--ltx-fg-color:#000000;">SPECIAL RULES FOR URL EXTRACTION:<span id="A4.SS2.p4.pic1.2.7.1.1" class="ltx_text"></span></span></span>
<span id="A4.SS2.p4.pic1.2.8" class="ltx_p"><span id="A4.SS2.p4.pic1.2.8.1" class="ltx_text" style="font-size:90%;--ltx-fg-color:#000000;">These rules apply only when URL fields are required in the extraction.</span></span>
<span id="A4.SS2.p4.pic1.2.9" class="ltx_p"><span id="A4.SS2.p4.pic1.2.9.1" class="ltx_text" style="font-size:90%;--ltx-fg-color:#000000;">1. Extract only URLs explicitly present in the answer text. Do not create or infer any URLs.</span></span>
<span id="A4.SS2.p4.pic1.2.10" class="ltx_p"><span id="A4.SS2.p4.pic1.2.10.1" class="ltx_text" style="font-size:90%;--ltx-fg-color:#000000;">2. Extract only valid URLs. Ignore obviously invalid or malformed URLs.</span></span>
<span id="A4.SS2.p4.pic1.2.11" class="ltx_p"><span id="A4.SS2.p4.pic1.2.11.1" class="ltx_text" style="font-size:90%;--ltx-fg-color:#000000;">3. If a URL is missing a protocol (<span id="A4.SS2.p4.pic1.2.11.1.1" class="ltx_text ltx_font_typewriter">http //</span> or <span id="A4.SS2.p4.pic1.2.11.1.2" class="ltx_text ltx_font_typewriter">https //</span>), prepend <span id="A4.SS2.p4.pic1.2.11.1.3" class="ltx_text ltx_font_typewriter">http //</span>.</span></span>
<span id="A4.SS2.p4.pic1.2.12" class="ltx_p"><span id="A4.SS2.p4.pic1.2.12.1" class="ltx_text ltx_font_bold" style="font-size:90%;--ltx-fg-color:#000000;">Instruction for Extraction:<span id="A4.SS2.p4.pic1.2.12.1.1" class="ltx_text"></span></span></span>
<span id="A4.SS2.p4.pic1.2.13" class="ltx_quote">
<span id="A4.SS2.p4.pic1.2.13.1" class="ltx_p"><span id="A4.SS2.p4.pic1.2.13.1.1" class="ltx_text" style="font-size:90%;--ltx-fg-color:#000000;">{extraction_prompt}</span></span>
</span>
<span id="A4.SS2.p4.pic1.2.14" class="ltx_p"><span id="A4.SS2.p4.pic1.2.14.1" class="ltx_text ltx_font_bold" style="font-size:90%;--ltx-fg-color:#000000;">Original Task Description:<span id="A4.SS2.p4.pic1.2.14.1.1" class="ltx_text"></span></span></span>
<span id="A4.SS2.p4.pic1.2.15" class="ltx_quote">
<span id="A4.SS2.p4.pic1.2.15.1" class="ltx_p"><span id="A4.SS2.p4.pic1.2.15.1.1" class="ltx_text" style="font-size:90%;--ltx-fg-color:#000000;">{task_description}</span></span>
</span>
<span id="A4.SS2.p4.pic1.2.16" class="ltx_p"><span id="A4.SS2.p4.pic1.2.16.1" class="ltx_text ltx_font_bold" style="font-size:90%;--ltx-fg-color:#000000;">Complete Answer to the Task:<span id="A4.SS2.p4.pic1.2.16.1.1" class="ltx_text"></span></span></span>
<span id="A4.SS2.p4.pic1.2.17" class="ltx_quote">
<span id="A4.SS2.p4.pic1.2.17.1" class="ltx_p"><span id="A4.SS2.p4.pic1.2.17.1.1" class="ltx_text" style="font-size:90%;--ltx-fg-color:#000000;">{answer}</span></span>
</span>
<span id="A4.SS2.p4.pic1.2.18" class="ltx_p"><span id="A4.SS2.p4.pic1.2.18.1" class="ltx_text ltx_font_bold" style="font-size:90%;--ltx-fg-color:#000000;">Additional Instructions (if any):<span id="A4.SS2.p4.pic1.2.18.1.1" class="ltx_text"></span></span></span>
<span id="A4.SS2.p4.pic1.2.19" class="ltx_quote">
<span id="A4.SS2.p4.pic1.2.19.1" class="ltx_p"><span id="A4.SS2.p4.pic1.2.19.1.1" class="ltx_text" style="font-size:90%;--ltx-fg-color:#000000;">{additional_instruction}</span></span>
</span>
</span></span></span></foreignobject></g></g></svg>