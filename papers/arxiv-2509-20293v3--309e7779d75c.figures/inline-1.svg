<span id="S1.p5.pic1.1" class="ltx_inline-block ltx_minipage ltx_align_bottom" style="width:37.48em;">
<span id="S1.p5.pic1.1.1" class="ltx_p"><span id="S1.p5.pic1.1.1.1" class="ltx_text" style="--ltx-fg-color:#FFFFFF;">Contributions</span></span>
</span></span></span></foreignobject></g><g fill-opacity="1.0" transform="matrix(1.0 0.0 0.0 1.0 15.7 12.93)"><foreignobject style="--ltx-fo-width:37.48em;--ltx-fo-height:27.54em;--ltx-fo-depth:0em;font-size:10pt;" height="381.06" overflow="visible" transform="matrix(1 0 0 -1 0 381.06)" width="518.62"><span class="ltx_foreignobject_container"><span class="ltx_foreignobject_content">
<span id="S1.p5.pic1.2" class="ltx_inline-block ltx_minipage ltx_align_bottom" style="width:37.48em;">
<span id="S1.I1" class="ltx_itemize">
<span id="S1.I1.i1" class="ltx_item" style="list-style-type:none;"><span class="ltx_tag ltx_tag_item">•</span> 
<span id="S1.I1.i1.p1" class="ltx_para ltx_noindent">
<span id="S1.I1.i1.p1.1" class="ltx_p"><span id="S1.I1.i1.p1.1.1" class="ltx_text ltx_font_bold" style="--ltx-fg-color:#000000;">Mechanisms:</span><span id="S1.I1.i1.p1.1.2" class="ltx_text" style="--ltx-fg-color:#000000;"> We introduce two novel diagnostic metrics for LLM judge benchmarks –</span></span>
</span>
<span id="S1.I1.i1.p2" class="ltx_para ltx_noindent">
<span id="S1.I1.i1.p2.1" class="ltx_p"><span id="S1.I1.i1.p2.1.1" class="ltx_text" style="--ltx-fg-color:#000000;">(1) </span><span id="S1.I1.i1.p2.1.2" class="ltx_text ltx_font_bold" style="--ltx-fg-color:#000000;">Schematic adherence</span><span id="S1.I1.i1.p2.1.3" class="ltx_text" style="--ltx-fg-color:#000000;"> quantifies how well overall verdicts derive from factor-wise rubric scores.</span></span>
</span>
<span id="S1.I1.i1.p3" class="ltx_para ltx_noindent">
<span id="S1.I1.i1.p3.1" class="ltx_p"><span id="S1.I1.i1.p3.1.1" class="ltx_text" style="--ltx-fg-color:#000000;">(2) </span><span id="S1.I1.i1.p3.1.2" class="ltx_text ltx_font_bold" style="--ltx-fg-color:#000000;">Psychometric validity</span><span id="S1.I1.i1.p3.1.3" class="ltx_text" style="--ltx-fg-color:#000000;"> aggregates internal consistency and discriminant validity to quantify the degree to which a benchmark’s design fits with its judgment rubric.</span></span>
</span></span>
<span id="S1.I1.i2" class="ltx_item" style="list-style-type:none;"><span class="ltx_tag ltx_tag_item">•</span> 
<span id="S1.I1.i2.p1" class="ltx_para ltx_noindent">
<span id="S1.I1.i2.p1.1" class="ltx_p"><span id="S1.I1.i2.p1.1.1" class="ltx_text ltx_font_bold" style="--ltx-fg-color:#000000;">Case study:</span><span id="S1.I1.i2.p1.1.2" class="ltx_text" style="--ltx-fg-color:#000000;"> Applying both mechanisms to </span><span id="S1.I1.i2.p1.1.3" class="ltx_text ltx_font_italic" style="--ltx-fg-color:#000000;">Arena-Hard Auto</span><span id="S1.I1.i2.p1.1.4" class="ltx_text" style="--ltx-fg-color:#000000;"> </span><cite class="ltx_cite ltx_citemacro_citep"><span id="S1.I1.i2.p1.1.5" class="ltx_text" style="--ltx-fg-color:#000000;">(</span><a href="#bib.bib17" title class="ltx_ref">Li et al., 2024b</a><span id="S1.I1.i2.p1.1.7" class="ltx_text" style="--ltx-fg-color:#000000;">)</span></cite><span id="S1.I1.i2.p1.1.8" class="ltx_text" style="--ltx-fg-color:#000000;">, we uncover severe rubric incoherence and factor collapse across judges (e.g., ¿90% unexplained variance for DeepSeek-R1-32B; factor correlations ¿0.93 across criteria), and show that ELO-style aggregation collapses uncertainty into seemingly stable rankings.</span></span>
</span></span>
<span id="S1.I1.i3" class="ltx_item" style="list-style-type:none;"><span class="ltx_tag ltx_tag_item">•</span> 
<span id="S1.I1.i3.p1" class="ltx_para">
<span id="S1.I1.i3.p1.1" class="ltx_p"><span id="S1.I1.i3.p1.1.1" class="ltx_text ltx_font_bold" style="--ltx-fg-color:#000000;">Guidance:</span><span id="S1.I1.i3.p1.1.2" class="ltx_text" style="--ltx-fg-color:#000000;"> Actionable design principles for LLM-judged benchmarks: tighten objectives, audit factor structure, report uncertainty, avoid aggregation that erases variance, and constrain scope to where judges exhibit validity.</span></span>
</span></span>
</span>
</span></span></span></foreignobject></g></g></svg>