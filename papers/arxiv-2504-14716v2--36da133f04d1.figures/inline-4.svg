<span id="A1.SS3.p3.pic1.2" class="ltx_inline-block ltx_minipage ltx_align_bottom" style="width:39.18em;">
<span id="A1.SS3.p3.pic1.2.1" class="ltx_p"><span id="A1.SS3.p3.pic1.2.1.1" class="ltx_text" style="font-size:80%;--ltx-fg-color:#000000;">You are given a multi-step conversation between a USER and an ASSISTANT. Your task is to rewrite the ASSISTANT’s response to make it:</span></span>
<span id="A1.I3" class="ltx_itemize">
<span id="A1.I3.i1" class="ltx_item" style="list-style-type:none;"><span class="ltx_tag ltx_tag_item">•</span> 
<span id="A1.I3.i1.p1" class="ltx_para">
<span id="A1.I3.i1.p1.1" class="ltx_p"><span id="A1.I3.i1.p1.1.1" class="ltx_text" style="font-size:80%;--ltx-fg-color:#000000;">Complex: The language should be dense and intellectually elevated, reflecting a high level of academic or professional expertise.
Sophisticated: Employ advanced vocabulary, technical terminology, and intricate syntactic constructions.</span></span>
</span></span>
<span id="A1.I3.i2" class="ltx_item" style="list-style-type:none;"><span class="ltx_tag ltx_tag_item">•</span> 
<span id="A1.I3.i2.p1" class="ltx_para">
<span id="A1.I3.i2.p1.1" class="ltx_p"><span id="A1.I3.i2.p1.1.1" class="ltx_text" style="font-size:80%;--ltx-fg-color:#000000;">Expert-Level: The revised version should read as though authored by a domain expert addressing an equally knowledgeable audience.</span></span>
</span></span>
</span>
<span id="A1.SS3.p3.pic1.2.2" class="ltx_p"><span id="A1.SS3.p3.pic1.2.2.1" class="ltx_text" style="font-size:80%;--ltx-fg-color:#000000;">Important Constraints:</span></span>
<span id="A1.I4" class="ltx_itemize">
<span id="A1.I4.i1" class="ltx_item" style="list-style-type:none;"><span class="ltx_tag ltx_tag_item">•</span> 
<span id="A1.I4.i1.p1" class="ltx_para">
<span id="A1.I4.i1.p1.1" class="ltx_p"><span id="A1.I4.i1.p1.1.1" class="ltx_text" style="font-size:80%;--ltx-fg-color:#000000;">Do NOT alter the factual content of the ASSISTANT’s responses. Modify tone only.</span></span>
</span></span>
<span id="A1.I4.i2" class="ltx_item" style="list-style-type:none;"><span class="ltx_tag ltx_tag_item">•</span> 
<span id="A1.I4.i2.p1" class="ltx_para">
<span id="A1.I4.i2.p1.1" class="ltx_p"><span id="A1.I4.i2.p1.1.1" class="ltx_text" style="font-size:80%;--ltx-fg-color:#000000;">Do NOT correct incorrect information. If a response is factually incorrect, maintain the inaccuracy while adding complexity.</span></span>
</span></span>
<span id="A1.I4.i3" class="ltx_item" style="list-style-type:none;"><span class="ltx_tag ltx_tag_item">•</span> 
<span id="A1.I4.i3.p1" class="ltx_para">
<span id="A1.I4.i3.p1.1" class="ltx_p"><span id="A1.I4.i3.p1.1.1" class="ltx_text" style="font-size:80%;--ltx-fg-color:#000000;">Do NOT change numerical figures, statistics, or data points within the response.</span></span>
</span></span>
<span id="A1.I4.i4" class="ltx_item" style="list-style-type:none;"><span class="ltx_tag ltx_tag_item">•</span> 
<span id="A1.I4.i4.p1" class="ltx_para">
<span id="A1.I4.i4.p1.1" class="ltx_p"><span id="A1.I4.i4.p1.1.1" class="ltx_text" style="font-size:80%;--ltx-fg-color:#000000;">Preserve the original number and order of interactions.</span></span>
</span></span>
</span>
<span id="A1.SS3.p3.pic1.2.3" class="ltx_p"><span id="A1.SS3.p3.pic1.2.3.1" class="ltx_text" style="font-size:80%;--ltx-fg-color:#000000;">##Start of conversation##</span></span>
