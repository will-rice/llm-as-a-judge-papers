</span></span></span></foreignobject></g><g fill-opacity="1.0" transform="matrix(1.0 0.0 0.0 1.0 12.36 15.05)"><foreignobject style="--ltx-fo-width:14.77em;--ltx-fo-height:32.07em;--ltx-fo-depth:0.19em;font-size:10pt;" height="446.48" overflow="visible" transform="matrix(1 0 0 -1 0 443.79)" width="204.38"><span class="ltx_foreignobject_container"><span class="ltx_foreignobject_content">
<span id="S4.SS3.p3.pic1.2" class="ltx_inline-block ltx_minipage ltx_align_bottom" style="width:14.77em;">
<span id="S4.SS3.p3.pic1.2.1" class="ltx_p"><span id="S4.SS3.p3.pic1.2.1.1" class="ltx_text ltx_font_bold" style="--ltx-fg-color:#000000;">Character1: Harry Potter<span id="S4.SS3.p3.pic1.2.1.1.1" class="ltx_text ltx_font_medium"> 
<br class="ltx_break">[Thinking: </span><span id="S4.SS3.p3.pic1.2.1.1.2" class="ltx_text" style="--ltx-fg-color:#B30000;">Why doesn’t Ron understand</span><span id="S4.SS3.p3.pic1.2.1.1.3" class="ltx_text ltx_font_medium"> how important this is?] 
<br class="ltx_break">I want to know what he’s up to. And don’t tell me it’s all in my head, not after what I overheard between him and Snape.</span></span></span>
<span id="S4.SS3.p3.pic1.2.2" class="ltx_p"><span id="S4.SS3.p3.pic1.2.2.1" class="ltx_text ltx_font_bold" style="--ltx-fg-color:#000000;">Character2: Unknown<span id="S4.SS3.p3.pic1.2.2.1.1" class="ltx_text ltx_font_medium"> 
<br class="ltx_break">[Thinking: I need to be careful here. </span><span id="S4.SS3.p3.pic1.2.2.1.2" class="ltx_text" style="--ltx-fg-color:#B30000;">I don’t want to dismiss Harry’s concerns</span><span id="S4.SS3.p3.pic1.2.2.1.3" class="ltx_text ltx_font_medium">, but this is getting out of hand.] 
<br class="ltx_break">I never said it was all in your head, but there’s no rule saying only one person at a time can be plotting anything in this place! </span><span id="S4.SS3.p3.pic1.2.2.1.4" class="ltx_text" style="--ltx-fg-color:#B30000;">You’re getting a bit obsessed with Malfoy, Harry</span><span id="S4.SS3.p3.pic1.2.2.1.5" class="ltx_text ltx_font_medium">.</span></span></span>
<span id="S4.SS3.p3.pic1.2.3" class="ltx_p"><span id="S4.SS3.p3.pic1.2.3.1" class="ltx_text ltx_font_bold" style="--ltx-fg-color:#000000;">Candidate Roles:<span id="S4.SS3.p3.pic1.2.3.1.1" class="ltx_text"></span></span></span>
