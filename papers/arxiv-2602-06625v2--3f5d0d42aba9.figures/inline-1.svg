<svg id="A1.SS1.p1.pic1" class="ltx_picture" height="373.31" overflow="visible" version="1.1" viewbox="0 0 477.38 373.31" width="477.38"><g style="--ltx-stroke-color:#000000;--ltx-fill-color:#000000;" fill="#000000" stroke="#000000" stroke-width="0.4pt" transform="translate(0,373.31) matrix(1 0 0 -1 0 0)"><g style="--ltx-fill-color:#666666;" fill="#666666" fill-opacity="1.0"><path style="stroke:none" d="M 0 3.46 L 0 369.85 C 0 371.76 1.55 373.31 3.46 373.31 L 473.92 373.31 C 475.83 373.31 477.38 371.76 477.38 369.85 L 477.38 3.46 C 477.38 1.55 475.83 0 473.92 0 L 3.46 0 C 1.55 0 0 1.55 0 3.46 Z" /></g><g style="--ltx-fill-color:#F7F7F7;" fill="#F7F7F7" fill-opacity="1.0"><path style="stroke:none" d="M 0.69 3.46 L 0.69 350.21 L 476.68 350.21 L 476.68 3.46 C 476.68 1.93 475.45 0.69 473.92 0.69 L 3.46 0.69 C 1.93 0.69 0.69 1.93 0.69 3.46 Z" /></g><g fill-opacity="1.0" transform="matrix(1.0 0.0 0.0 1.0 12.93 358.3)"><foreignobject style="--ltx-fo-width:28.37em;--ltx-fo-height:0.75em;--ltx-fo-depth:0.25em;font-size:10pt;" height="13.84" overflow="visible" transform="matrix(1 0 0 -1 0 10.38)" width="392.56"><span class="ltx_foreignobject_container"><span class="ltx_foreignobject_content">
<span id="A1.SS1.p1.pic1.1" class="ltx_inline-block ltx_minipage ltx_align_bottom" style="width:28.37em;">
<span id="A1.SS1.p1.pic1.1.1" class="ltx_p"><span id="A1.SS1.p1.pic1.1.1.1" class="ltx_text ltx_font_bold" style="--ltx-fg-color:#FFFFFF;">Direct Preference Optimization (DPO)</span></span>
</span></span></span></foreignobject></g><g fill-opacity="1.0" transform="matrix(1.0 0.0 0.0 1.0 12.93 15.7)"><foreignobject style="--ltx-fo-width:32.63em;--ltx-fo-height:23.29em;--ltx-fo-depth:0.2em;font-size:10pt;" height="325.04" overflow="visible" transform="matrix(1 0 0 -1 0 322.28)" width="451.51"><span class="ltx_foreignobject_container"><span class="ltx_foreignobject_content">
<span id="A1.SS1.p1.pic1.2" class="ltx_inline-block ltx_minipage ltx_align_bottom" style="width:32.63em;">
<span id="A1.SS1.p1.pic1.2.1" class="ltx_p"><span id="A1.SS1.p1.pic1.2.1.1" class="ltx_text" style="--ltx-fg-color:#000000;">We construct a preference dataset <math id="A1.SS1.p1.pic1.m1" class="ltx_Math" alttext="\mathcal{D}_{\text{pref}}" display="inline" intent=":literal"><semantics><msub><mi style="--ltx-fg-color:#000000;" class="ltx_font_mathcaligraphic" mathcolor="#000000">𝒟</mi><mtext style="--ltx-fg-color:#000000;" mathcolor="#000000">pref</mtext></msub><annotation encoding="application/x-tex">\mathcal{D}_{\text{pref}}</annotation></semantics></math> consisting of tuples <math id="A1.SS1.p1.pic1.m2" class="ltx_Math" alttext="(q,y^{+},y^{-})" display="inline" intent=":literal"><semantics><mrow><mo style="--ltx-fg-color:#000000;" mathcolor="#000000" stretchy="false">(</mo><mi style="--ltx-fg-color:#000000;" mathcolor="#000000">q</mi><mo style="--ltx-fg-color:#000000;" mathcolor="#000000">,</mo><msup><mi style="--ltx-fg-color:#000000;" mathcolor="#000000">y</mi><mo style="--ltx-fg-color:#000000;" mathcolor="#000000">+</mo></msup><mo style="--ltx-fg-color:#000000;" mathcolor="#000000">,</mo><msup><mi style="--ltx-fg-color:#000000;" mathcolor="#000000">y</mi><mo style="--ltx-fg-color:#000000;" mathcolor="#000000">−</mo></msup><mo style="--ltx-fg-color:#000000;" mathcolor="#000000" stretchy="false">)</mo></mrow><annotation encoding="application/x-tex">(q,y^{+},y^{-})</annotation></semantics></math>, where <math id="A1.SS1.p1.pic1.m3" class="ltx_Math" alttext="q" display="inline" intent=":literal"><semantics><mi style="--ltx-fg-color:#000000;" mathcolor="#000000">q</mi><annotation encoding="application/x-tex">q</annotation></semantics></math> denotes the evaluation input (e.g., task, reference, and an answer pair), and <math id="A1.SS1.p1.pic1.m4" class="ltx_Math" alttext="y^{+}" display="inline" intent=":literal"><semantics><msup><mi style="--ltx-fg-color:#000000;" mathcolor="#000000">y</mi><mo style="--ltx-fg-color:#000000;" mathcolor="#000000">+</mo></msup><annotation encoding="application/x-tex">y^{+}</annotation></semantics></math>/<math id="A1.SS1.p1.pic1.m5" class="ltx_Math" alttext="y^{-}" display="inline" intent=":literal"><semantics><msup><mi style="--ltx-fg-color:#000000;" mathcolor="#000000">y</mi><mo style="--ltx-fg-color:#000000;" mathcolor="#000000">−</mo></msup><annotation encoding="application/x-tex">y^{-}</annotation></semantics></math> are the preferred and dispreferred judgement outputs, respectively. In our setting, <math id="A1.SS1.p1.pic1.m6" class="ltx_Math" alttext="y^{+}" display="inline" intent=":literal"><semantics><msup><mi style="--ltx-fg-color:#000000;" mathcolor="#000000">y</mi><mo style="--ltx-fg-color:#000000;" mathcolor="#000000">+</mo></msup><annotation encoding="application/x-tex">y^{+}</annotation></semantics></math> is obtained from a stronger teacher judge, while <math id="A1.SS1.p1.pic1.m7" class="ltx_Math" alttext="y^{-}" display="inline" intent=":literal"><semantics><msup><mi style="--ltx-fg-color:#000000;" mathcolor="#000000">y</mi><mo style="--ltx-fg-color:#000000;" mathcolor="#000000">−</mo></msup><annotation encoding="application/x-tex">y^{-}</annotation></semantics></math> is produced by the current (or a weaker) judge model on the same input <math id="A1.SS1.p1.pic1.m8" class="ltx_Math" alttext="q" display="inline" intent=":literal"><semantics><mi style="--ltx-fg-color:#000000;" mathcolor="#000000">q</mi><annotation encoding="application/x-tex">q</annotation></semantics></math>.</span></span>
<span id="A1.SS1.p1.pic1.2.2" class="ltx_p"><span id="A1.SS1.p1.pic1.2.2.1" class="ltx_text" style="--ltx-fg-color:#000000;">Following DPO, we define the probability that the policy <math id="A1.SS1.p1.pic1.m9" class="ltx_Math" alttext="\pi_{\phi}" display="inline" intent=":literal"><semantics><msub><mi style="--ltx-fg-color:#000000;" mathcolor="#000000">π</mi><mi style="--ltx-fg-color:#000000;" mathcolor="#000000">ϕ</mi></msub><annotation encoding="application/x-tex">\pi_{\phi}</annotation></semantics></math> prefers <math id="A1.SS1.p1.pic1.m10" class="ltx_Math" alttext="y^{+}" display="inline" intent=":literal"><semantics><msup><mi style="--ltx-fg-color:#000000;" mathcolor="#000000">y</mi><mo style="--ltx-fg-color:#000000;" mathcolor="#000000">+</mo></msup><annotation encoding="application/x-tex">y^{+}</annotation></semantics></math> over <math id="A1.SS1.p1.pic1.m11" class="ltx_Math" alttext="y^{-}" display="inline" intent=":literal"><semantics><msup><mi style="--ltx-fg-color:#000000;" mathcolor="#000000">y</mi><mo style="--ltx-fg-color:#000000;" mathcolor="#000000">−</mo></msup><annotation encoding="application/x-tex">y^{-}</annotation></semantics></math> as a logistic model of the <em id="A1.SS1.p1.pic1.2.2.1.1" class="ltx_emph ltx_font_italic">relative log-likelihood ratio</em> against a fixed reference policy <math id="A1.SS1.p1.pic1.m12" class="ltx_Math" alttext="\pi_{\text{ref}}" display="inline" intent=":literal"><semantics><msub><mi style="--ltx-fg-color:#000000;" mathcolor="#000000">π</mi><mtext style="--ltx-fg-color:#000000;" mathcolor="#000000">ref</mtext></msub><annotation encoding="application/x-tex">\pi_{\text{ref}}</annotation></semantics></math>:</span></span>
<span id="A1.E2" class="ltx_equation ltx_eqn_table">

<span><span class="ltx_equation ltx_eqn_row ltx_align_baseline">
<span class="ltx_eqn_cell ltx_eqn_center_padleft"></span>
<span class="ltx_eqn_cell ltx_align_center"><math id="A1.E2.m1" class="ltx_Math" alttext="p_{\phi}\!\left(y^{+}\succ y^{-}\mid q\right)=\sigma\!\Big(\beta\big[\log\pi_{\phi}(y^{+}\mid q)-\log\pi_{\phi}(y^{-}\mid q)-\log\pi_{\text{ref}}(y^{+}\mid q)+\log\pi_{\text{ref}}(y^{-}\mid q)\big]\Big)," display="block" intent=":literal"><semantics><mrow><mrow><mrow><msub><mi style="--ltx-fg-color:#000000;" mathcolor="#000000">p</mi><mi style="--ltx-fg-color:#000000;" mathcolor="#000000">ϕ</mi></msub><mo lspace="0em" rspace="0em">​</mo><mrow><mo style="--ltx-fg-color:#000000;" mathcolor="#000000">(</mo><mrow><msup><mi style="--ltx-fg-color:#000000;" mathcolor="#000000">y</mi><mo style="--ltx-fg-color:#000000;" mathcolor="#000000">+</mo></msup><mo style="--ltx-fg-color:#000000;" mathcolor="#000000">≻</mo><msup><mi style="--ltx-fg-color:#000000;" mathcolor="#000000">y</mi><mo style="--ltx-fg-color:#000000;" mathcolor="#000000">−</mo></msup></mrow><mo style="--ltx-fg-color:#000000;" fence="true" lspace="0em" mathcolor="#000000" rspace="0em">∣</mo><mi style="--ltx-fg-color:#000000;" mathcolor="#000000">q</mi><mo style="--ltx-fg-color:#000000;" mathcolor="#000000">)</mo></mrow></mrow><mo style="--ltx-fg-color:#000000;" mathcolor="#000000">=</mo><mrow><mpadded style="width:0.437em;" width="0.437em"><mi style="--ltx-fg-color:#000000;" mathcolor="#000000">σ</mi></mpadded><mo>⁡</mo><mrow><mo style="--ltx-fg-color:#000000;" mathcolor="#000000" maxsize="1.600em" minsize="1.600em">(</mo><mrow><mi style="--ltx-fg-color:#000000;" mathcolor="#000000">β</mi><mo>⁡</mo><mrow><mo style="--ltx-fg-color:#000000;" mathcolor="#000000" maxsize="1.200em" minsize="1.200em">[</mo><mrow><mrow><mrow><mrow><mi style="--ltx-fg-color:#000000;" mathcolor="#000000">log</mi><mo lspace="0.167em">⁡</mo><msub><mi style="--ltx-fg-color:#000000;" mathcolor="#000000">π</mi><mi style="--ltx-fg-color:#000000;" mathcolor="#000000">ϕ</mi></msub></mrow><mo lspace="0em" rspace="0em">​</mo><mrow><mo style="--ltx-fg-color:#000000;" mathcolor="#000000" stretchy="false">(</mo><msup><mi style="--ltx-fg-color:#000000;" mathcolor="#000000">y</mi><mo style="--ltx-fg-color:#000000;" mathcolor="#000000">+</mo></msup><mo style="--ltx-fg-color:#000000;" fence="true" lspace="0em" mathcolor="#000000" rspace="0em">∣</mo><mi style="--ltx-fg-color:#000000;" mathcolor="#000000">q</mi><mo style="--ltx-fg-color:#000000;" mathcolor="#000000" stretchy="false">)</mo></mrow></mrow><mo style="--ltx-fg-color:#000000;" mathcolor="#000000">−</mo><mrow><mrow><mi style="--ltx-fg-color:#000000;" mathcolor="#000000">log</mi><mo lspace="0.167em">⁡</mo><msub><mi style="--ltx-fg-color:#000000;" mathcolor="#000000">π</mi><mi style="--ltx-fg-color:#000000;" mathcolor="#000000">ϕ</mi></msub></mrow><mo lspace="0em" rspace="0em">​</mo><mrow><mo style="--ltx-fg-color:#000000;" mathcolor="#000000" stretchy="false">(</mo><msup><mi style="--ltx-fg-color:#000000;" mathcolor="#000000">y</mi><mo style="--ltx-fg-color:#000000;" mathcolor="#000000">−</mo></msup><mo style="--ltx-fg-color:#000000;" fence="true" lspace="0em" mathcolor="#000000" rspace="0em">∣</mo><mi style="--ltx-fg-color:#000000;" mathcolor="#000000">q</mi><mo style="--ltx-fg-color:#000000;" mathcolor="#000000" stretchy="false">)</mo></mrow></mrow><mo style="--ltx-fg-color:#000000;" mathcolor="#000000">−</mo><mrow><mrow><mi style="--ltx-fg-color:#000000;" mathcolor="#000000">log</mi><mo lspace="0.167em">⁡</mo><msub><mi style="--ltx-fg-color:#000000;" mathcolor="#000000">π</mi><mtext style="--ltx-fg-color:#000000;" mathcolor="#000000">ref</mtext></msub></mrow><mo lspace="0em" rspace="0em">​</mo><mrow><mo style="--ltx-fg-color:#000000;" mathcolor="#000000" stretchy="false">(</mo><msup><mi style="--ltx-fg-color:#000000;" mathcolor="#000000">y</mi><mo style="--ltx-fg-color:#000000;" mathcolor="#000000">+</mo></msup><mo style="--ltx-fg-color:#000000;" fence="true" lspace="0em" mathcolor="#000000" rspace="0em">∣</mo><mi style="--ltx-fg-color:#000000;" mathcolor="#000000">q</mi><mo style="--ltx-fg-color:#000000;" mathcolor="#000000" stretchy="false">)</mo></mrow></mrow></mrow><mo style="--ltx-fg-color:#000000;" mathcolor="#000000">+</mo><mrow><mrow><mi style="--ltx-fg-color:#000000;" mathcolor="#000000">log</mi><mo lspace="0.167em">⁡</mo><msub><mi style="--ltx-fg-color:#000000;" mathcolor="#000000">π</mi><mtext style="--ltx-fg-color:#000000;" mathcolor="#000000">ref</mtext></msub></mrow><mo lspace="0em" rspace="0em">​</mo><mrow><mo style="--ltx-fg-color:#000000;" mathcolor="#000000" stretchy="false">(</mo><msup><mi style="--ltx-fg-color:#000000;" mathcolor="#000000">y</mi><mo style="--ltx-fg-color:#000000;" mathcolor="#000000">−</mo></msup><mo style="--ltx-fg-color:#000000;" fence="true" lspace="0em" mathcolor="#000000" rspace="0em">∣</mo><mi style="--ltx-fg-color:#000000;" mathcolor="#000000">q</mi><mo style="--ltx-fg-color:#000000;" mathcolor="#000000" stretchy="false">)</mo></mrow></mrow></mrow><mo style="--ltx-fg-color:#000000;" mathcolor="#000000" maxsize="1.200em" minsize="1.200em">]</mo></mrow></mrow><mo style="--ltx-fg-color:#000000;" mathcolor="#000000" maxsize="1.600em" minsize="1.600em">)</mo></mrow></mrow></mrow><mo style="--ltx-fg-color:#000000;" mathcolor="#000000">,</mo></mrow><annotation encoding="application/x-tex">p_{\phi}\!\left(y^{+}\succ y^{-}\mid q\right)=\sigma\!\Big(\beta\big[\log\pi_{\phi}(y^{+}\mid q)-\log\pi_{\phi}(y^{-}\mid q)-\log\pi_{\text{ref}}(y^{+}\mid q)+\log\pi_{\text{ref}}(y^{-}\mid q)\big]\Big),</annotation></semantics></math></span>
<span class="ltx_eqn_cell ltx_eqn_center_padright"></span>
<span rowspan="1" class="ltx_eqn_cell ltx_eqn_eqno ltx_align_middle ltx_align_right"><span class="ltx_tag ltx_tag_equation ltx_align_right">(2)</span></span></span></span>
</span>
<span id="A1.SS1.p1.pic1.2.3" class="ltx_p"><span id="A1.SS1.p1.pic1.2.3.1" class="ltx_text" style="--ltx-fg-color:#000000;">where <math id="A1.SS1.p1.pic1.m13" class="ltx_Math" alttext="\sigma(\cdot)" display="inline" intent=":literal"><semantics><mrow><mi style="--ltx-fg-color:#000000;" mathcolor="#000000">σ</mi><mo>⁡</mo><mrow><mo style="--ltx-fg-color:#000000;" mathcolor="#000000" stretchy="false">(</mo><mo style="--ltx-fg-color:#000000;" lspace="0em" mathcolor="#000000" rspace="0em">⋅</mo><mo style="--ltx-fg-color:#000000;" mathcolor="#000000" stretchy="false">)</mo></mrow></mrow><annotation encoding="application/x-tex">\sigma(\cdot)</annotation></semantics></math> is the sigmoid function and <math id="A1.SS1.p1.pic1.m14" class="ltx_Math" alttext="\beta&gt;0" display="inline" intent=":literal"><semantics><mrow><mi style="--ltx-fg-color:#000000;" mathcolor="#000000">β</mi><mo style="--ltx-fg-color:#000000;" mathcolor="#000000">&gt;</mo><mn style="--ltx-fg-color:#000000;" mathcolor="#000000">0</mn></mrow><annotation encoding="application/x-tex">\beta&gt;0</annotation></semantics></math> is a temperature parameter.</span></span>
<span id="A1.SS1.p1.pic1.2.4" class="ltx_p"><span id="A1.SS1.p1.pic1.2.4.1" class="ltx_text" style="--ltx-fg-color:#000000;">The DPO objective minimizes the negative log-likelihood of the observed preferences:</span></span>
<span id="A1.E3" class="ltx_equation ltx_eqn_table">

<span><span class="ltx_equation ltx_eqn_row ltx_align_baseline">
<span class="ltx_eqn_cell ltx_eqn_center_padleft"></span>
<span class="ltx_eqn_cell ltx_align_center"><math id="A1.E3.m1" class="ltx_Math" alttext="\mathcal{L}_{\text{DPO}}(\phi)=\mathbb{E}_{(q,y^{+},y^{-})\sim\mathcal{D}_{\text{pref}}}\left[-\log p_{\phi}\!\left(y^{+}\succ y^{-}\mid q\right)\right]." display="block" intent=":literal"><semantics><mrow><mrow><mrow><msub><mi style="--ltx-fg-color:#000000;" class="ltx_font_mathcaligraphic" mathcolor="#000000">ℒ</mi><mtext style="--ltx-fg-color:#000000;" mathcolor="#000000">DPO</mtext></msub><mo lspace="0em" rspace="0em">​</mo><mrow><mo style="--ltx-fg-color:#000000;" mathcolor="#000000" stretchy="false">(</mo><mi style="--ltx-fg-color:#000000;" mathcolor="#000000">ϕ</mi><mo style="--ltx-fg-color:#000000;" mathcolor="#000000" stretchy="false">)</mo></mrow></mrow><mo style="--ltx-fg-color:#000000;" mathcolor="#000000">=</mo><mrow><msub><mi style="--ltx-fg-color:#000000;" mathcolor="#000000">𝔼</mi><mrow><mrow><mo style="--ltx-fg-color:#000000;" mathcolor="#000000" stretchy="false">(</mo><mi style="--ltx-fg-color:#000000;" mathcolor="#000000">q</mi><mo style="--ltx-fg-color:#000000;" mathcolor="#000000">,</mo><msup><mi style="--ltx-fg-color:#000000;" mathcolor="#000000">y</mi><mo style="--ltx-fg-color:#000000;" mathcolor="#000000">+</mo></msup><mo style="--ltx-fg-color:#000000;" mathcolor="#000000">,</mo><msup><mi style="--ltx-fg-color:#000000;" mathcolor="#000000">y</mi><mo style="--ltx-fg-color:#000000;" mathcolor="#000000">−</mo></msup><mo style="--ltx-fg-color:#000000;" mathcolor="#000000" stretchy="false">)</mo></mrow><mo style="--ltx-fg-color:#000000;" mathcolor="#000000">∼</mo><msub><mi style="--ltx-fg-color:#000000;" class="ltx_font_mathcaligraphic" mathcolor="#000000">𝒟</mi><mtext style="--ltx-fg-color:#000000;" mathcolor="#000000">pref</mtext></msub></mrow></msub><mo lspace="0em" rspace="0em">​</mo><mrow><mo style="--ltx-fg-color:#000000;" mathcolor="#000000">[</mo><mrow><mo style="--ltx-fg-color:#000000;" mathcolor="#000000" rspace="0.167em">−</mo><mrow><mrow><mi style="--ltx-fg-color:#000000;" mathcolor="#000000">log</mi><mo lspace="0.167em">⁡</mo><msub><mi style="--ltx-fg-color:#000000;" mathcolor="#000000">p</mi><mi style="--ltx-fg-color:#000000;" mathcolor="#000000">ϕ</mi></msub></mrow><mo lspace="0em" rspace="0em">​</mo><mrow><mo style="--ltx-fg-color:#000000;" mathcolor="#000000">(</mo><mrow><msup><mi style="--ltx-fg-color:#000000;" mathcolor="#000000">y</mi><mo style="--ltx-fg-color:#000000;" mathcolor="#000000">+</mo></msup><mo style="--ltx-fg-color:#000000;" mathcolor="#000000">≻</mo><msup><mi style="--ltx-fg-color:#000000;" mathcolor="#000000">y</mi><mo style="--ltx-fg-color:#000000;" mathcolor="#000000">−</mo></msup></mrow><mo style="--ltx-fg-color:#000000;" fence="true" lspace="0em" mathcolor="#000000" rspace="0em">∣</mo><mi style="--ltx-fg-color:#000000;" mathcolor="#000000">q</mi><mo style="--ltx-fg-color:#000000;" mathcolor="#000000">)</mo></mrow></mrow></mrow><mo style="--ltx-fg-color:#000000;" mathcolor="#000000">]</mo></mrow></mrow></mrow><mo style="--ltx-fg-color:#000000;" lspace="0em" mathcolor="#000000">.</mo></mrow><annotation encoding="application/x-tex">\mathcal{L}_{\text{DPO}}(\phi)=\mathbb{E}_{(q,y^{+},y^{-})\sim\mathcal{D}_{\text{pref}}}\left[-\log p_{\phi}\!\left(y^{+}\succ y^{-}\mid q\right)\right].</annotation></semantics></math></span>
<span class="ltx_eqn_cell ltx_eqn_center_padright"></span>
<span rowspan="1" class="ltx_eqn_cell ltx_eqn_eqno ltx_align_middle ltx_align_right"><span class="ltx_tag ltx_tag_equation ltx_align_right">(3)</span></span></span></span>
</span>
<span id="A1.SS1.p1.pic1.2.5" class="ltx_p"><span id="A1.SS1.p1.pic1.2.5.1" class="ltx_text" style="--ltx-fg-color:#000000;">Optimizing Eq. (<a href="#A1.E3" title="Equation 3 ‣ A.1 Direct Preference Optimization (DPO) ‣ Appendix A Appendix ‣ FairJudge: An Adaptive, Debiased, and Consistent LLM-as-a-Judge" class="ltx_ref"><span class="ltx_text ltx_ref_tag">3</span></a>) increases the policy’s relative preference for teacher-consistent judgements while regularizing against excessive deviation from <math id="A1.SS1.p1.pic1.m15" class="ltx_Math" alttext="\pi_{\text{ref}}" display="inline" intent=":literal"><semantics><msub><mi style="--ltx-fg-color:#000000;" mathcolor="#000000">π</mi><mtext style="--ltx-fg-color:#000000;" mathcolor="#000000">ref</mtext></msub><annotation encoding="application/x-tex">\pi_{\text{ref}}</annotation></semantics></math> through the reference-normalized log-ratio in Eq. (<a href="#A1.E2" title="Equation 2 ‣ A.1 Direct Preference Optimization (DPO) ‣ Appendix A Appendix ‣ FairJudge: An Adaptive, Debiased, and Consistent LLM-as-a-Judge" class="ltx_ref"><span class="ltx_text ltx_ref_tag">2</span></a>).</span></span>
</span></span></span></foreignobject></g></g></svg>