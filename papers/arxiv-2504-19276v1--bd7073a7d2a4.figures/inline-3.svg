<svg id="A4.SS2.p1.pic1" class="ltx_picture" height="498.8" overflow="visible" version="1.1" viewbox="0 0 550 498.8" width="550"><g style="--ltx-stroke-color:#000000;--ltx-fill-color:#000000;" fill="#000000" stroke="#000000" stroke-width="0.4pt" transform="translate(0,498.8) matrix(1 0 0 -1 0 0)"><g style="--ltx-fill-color:#000080;" fill="#000080" fill-opacity="1.0"><path style="stroke:none" d="M 0 0 L 0 498.8 L 550 498.8 L 550 0 Z" /></g><g style="--ltx-fill-color:#E6E6FF;" fill="#E6E6FF" fill-opacity="1.0"><path style="stroke:none" d="M 3.15 3.15 L 3.15 472.32 L 546.85 472.32 L 546.85 3.15 Z" /></g><g fill-opacity="1.0" transform="matrix(1.0 0.0 0.0 1.0 22.83 482.1)"><foreignobject style="--ltx-fo-width:31.7em;--ltx-fo-height:0.69em;--ltx-fo-depth:0.19em;font-size:10pt;" height="12.3" overflow="visible" transform="matrix(1 0 0 -1 0 9.61)" width="438.64"><span class="ltx_foreignobject_container"><span class="ltx_foreignobject_content">
<span id="A4.SS2.p1.pic1.1" class="ltx_inline-block ltx_minipage ltx_align_bottom" style="width:31.7em;">
<span id="A4.SS2.p1.pic1.1.1" class="ltx_p"><span id="A4.SS2.p1.pic1.1.1.1" class="ltx_text ltx_font_bold" style="--ltx-fg-color:#FFFFFF;">Reward Model Prompts</span></span>
</span></span></span></foreignobject></g><g fill-opacity="1.0" transform="matrix(1.0 0.0 0.0 1.0 22.83 18.42)"><foreignobject style="--ltx-fo-width:36.45em;--ltx-fo-height:31.95em;--ltx-fo-depth:0.25em;font-size:10pt;" height="445.56" overflow="visible" transform="matrix(1 0 0 -1 0 442.1)" width="504.37"><span class="ltx_foreignobject_container"><span class="ltx_foreignobject_content">
<span id="A4.SS2.p1.pic1.2" class="ltx_inline-block ltx_minipage ltx_align_bottom" style="width:36.45em;">
<span id="A4.SS2.p1.pic1.2.1" class="ltx_p"><span id="A4.SS2.p1.pic1.2.1.1" class="ltx_text ltx_font_bold" style="--ltx-fg-color:#000000;">[Task]<span id="A4.SS2.p1.pic1.2.1.1.1" class="ltx_text ltx_font_medium"> Suppose that you are an expert in <span id="A4.SS2.p1.pic1.2.1.1.1.1" class="ltx_text ltx_font_typewriter">{task_field}</span>, please rate an RLHF data pair consisting of a query, positive response and negative response.
<br class="ltx_break"></span></span></span>
<span id="A4.SS2.p1.pic1.2.2" class="ltx_p"><span id="A4.SS2.p1.pic1.2.2.1" class="ltx_text ltx_font_bold" style="--ltx-fg-color:#000000;">[Guideline]<span id="A4.SS2.p1.pic1.2.2.1.1" class="ltx_text ltx_font_medium"> Reference criteria:</span></span></span>
<span id="A4.SS2.p1.pic1.2.3" class="ltx_p"><span id="A4.SS2.p1.pic1.2.3.1" class="ltx_text" style="--ltx-fg-color:#000000;">1. The positive response should be coherent and correct as possible;</span></span>
<span id="A4.SS2.p1.pic1.2.4" class="ltx_p"><span id="A4.SS2.p1.pic1.2.4.1" class="ltx_text" style="--ltx-fg-color:#000000;">2. The negative response should be worse than the positive one in certain way, but not wander off the topic or diverge in too many aspects. For example, if the positive response is “The capital of France is Paris”, a good negative response should be something like “The capital of France is London”, but not “France is a country in Europe” (diverge too much in topic) or “Capital France London is” (diverge both in knowledge and language).
<br class="ltx_break"></span></span>
<span id="A4.SS2.p1.pic1.2.5" class="ltx_p"><span id="A4.SS2.p1.pic1.2.5.1" class="ltx_text ltx_font_bold" style="--ltx-fg-color:#000000;">[Requirement]<span id="A4.SS2.p1.pic1.2.5.1.1" class="ltx_text ltx_font_medium"> Please provide an integer score between 1 and 10 indicating the quality of the data pair if used in RLHF. The higher the score, the better the data pair. Please first analyze the positive response and the negative response, and then give the score in the format of “score/10”.
<br class="ltx_break"></span></span></span>
<span id="A4.SS2.p1.pic1.2.6" class="ltx_p"><span id="A4.SS2.p1.pic1.2.6.1" class="ltx_text ltx_font_typewriter" style="--ltx-fg-color:#000000;">{examples}
<br class="ltx_break"></span></span>
<span id="A4.SS2.p1.pic1.2.7" class="ltx_p"><span id="A4.SS2.p1.pic1.2.7.1" class="ltx_text ltx_font_typewriter" style="--ltx-fg-color:#000000;">{context}
<br class="ltx_break"></span></span>
<span id="A4.SS2.p1.pic1.2.8" class="ltx_p"><span id="A4.SS2.p1.pic1.2.8.1" class="ltx_text" style="--ltx-fg-color:#000000;">Query: <span id="A4.SS2.p1.pic1.2.8.1.1" class="ltx_text ltx_font_typewriter">{query}
<br class="ltx_break"></span></span></span>
<span id="A4.SS2.p1.pic1.2.9" class="ltx_p"><span id="A4.SS2.p1.pic1.2.9.1" class="ltx_text" style="--ltx-fg-color:#000000;">Positive Response: <span id="A4.SS2.p1.pic1.2.9.1.1" class="ltx_text ltx_font_typewriter">{positive}</span></span></span>
<span id="A4.SS2.p1.pic1.2.10" class="ltx_p"><span id="A4.SS2.p1.pic1.2.10.1" class="ltx_text" style="--ltx-fg-color:#000000;">Negative Response: <span id="A4.SS2.p1.pic1.2.10.1.1" class="ltx_text ltx_font_typewriter">{negative}</span></span></span>
</span></span></span></foreignobject></g></g></svg>