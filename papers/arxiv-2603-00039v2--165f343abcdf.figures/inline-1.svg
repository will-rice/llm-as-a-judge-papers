<svg id="A5.SS5.p2.pic1" class="ltx_picture" height="951.87" overflow="visible" version="1.1" viewbox="0 0 477.38 951.87" width="477.38"><g style="--ltx-stroke-color:#000000;--ltx-fill-color:#000000;" fill="#000000" stroke="#000000" stroke-width="0.4pt" transform="translate(0,951.87) matrix(1 0 0 -1 0 0)"><g style="--ltx-fill-color:#B3B3B3;" fill="#B3B3B3" fill-opacity="1.0"><path style="stroke:none" d="M 0 4.49 L 0 947.38 C 0 949.86 2.01 951.87 4.49 951.87 L 472.89 951.87 C 475.37 951.87 477.38 949.86 477.38 947.38 L 477.38 4.49 C 477.38 2.01 475.37 0 472.89 0 L 4.49 0 C 2.01 0 0 2.01 0 4.49 Z" /></g><g style="--ltx-fill-color:#FFFFFF;" fill="#FFFFFF" fill-opacity="1.0"><path style="stroke:none" d="M 0.55 4.49 L 0.55 912.44 L 476.82 912.44 L 476.82 4.49 C 476.82 2.32 475.06 0.55 472.89 0.55 L 4.49 0.55 C 2.32 0.55 0.55 2.32 0.55 4.49 Z" /></g><g fill-opacity="1.0" transform="matrix(1.0 0.0 0.0 1.0 12.79 937)"><foreignobject style="--ltx-fo-width:28.39em;--ltx-fo-height:0.75em;--ltx-fo-depth:1.45em;font-size:10pt;" height="30.44" overflow="visible" transform="matrix(1 0 0 -1 0 10.38)" width="392.84"><span class="ltx_foreignobject_container"><span class="ltx_foreignobject_content">
<span id="A5.SS5.p2.pic1.1" class="ltx_inline-block ltx_minipage ltx_align_bottom" style="width:28.39em;">
<span id="A5.SS5.p2.pic1.1.1" class="ltx_p"><span id="A5.SS5.p2.pic1.1.1.1" class="ltx_text ltx_font_bold" style="--ltx-fg-color:#FFFFFF;">LLM Judge Scoring Template (ASSET – Sentence Simplification)</span></span>
</span></span></span></foreignobject></g><g fill-opacity="1.0" transform="matrix(1.0 0.0 0.0 1.0 12.79 15.87)"><foreignobject style="--ltx-fo-width:31.1em;--ltx-fo-height:63.91em;--ltx-fo-depth:0.22em;font-size:10pt;" height="887.42" overflow="visible" transform="matrix(1 0 0 -1 0 884.35)" width="430.34"><span class="ltx_foreignobject_container"><span class="ltx_foreignobject_content">
<span id="A5.SS5.p2.pic1.2" class="ltx_inline-block ltx_minipage ltx_align_bottom" style="width:31.1em;">
<span id="A5.SS5.p2.pic1.2.1" class="ltx_p"><span id="A5.SS5.p2.pic1.2.1.1" class="ltx_text" style="--ltx-fg-color:#000000;">You are rating the quality of a simplified sentence for a specific aspect of text simplification.
Examine both sentences carefully before assigning a single integer score in [0, 100].
Use the whole range; do not default to 50 or round to multiples of 5 unless warranted.</span></span>
<span id="A5.SS5.p2.pic1.2.2" class="ltx_p"><span id="A5.SS5.p2.pic1.2.2.1" class="ltx_text ltx_font_bold" style="--ltx-fg-color:#000000;">Aspect to evaluate:<span id="A5.SS5.p2.pic1.2.2.1.1" class="ltx_text ltx_font_medium"> {aspect}</span></span></span>
<span id="A5.SS5.p2.pic1.2.3" class="ltx_p"><span id="A5.SS5.p2.pic1.2.3.1" class="ltx_text" style="--ltx-fg-color:#000000;">Interpret the aspect as follows (case-insensitive):</span></span>
<span id="A5.I1" class="ltx_itemize ltx_leftmargin_flush">
<span id="A5.I1.i1" class="ltx_item" style="list-style-type:none;"><span class="ltx_tag ltx_tag_item">•</span> 
<span id="A5.I1.i1.p1" class="ltx_para">
<span id="A5.I1.i1.p1.1" class="ltx_p"><span id="A5.I1.i1.p1.1.1" class="ltx_text ltx_font_bold" style="--ltx-fg-color:#000000;">meaning / meaning preservation</span><span id="A5.I1.i1.p1.1.2" class="ltx_text" style="--ltx-fg-color:#000000;"> — Judge how faithfully the simplification preserves the original meaning (facts, relations, intent). Ignore simplicity/fluency except where they alter meaning.</span></span>
</span></span>
<span id="A5.I1.i2" class="ltx_item" style="list-style-type:none;"><span class="ltx_tag ltx_tag_item">•</span> 
<span id="A5.I1.i2.p1" class="ltx_para">
<span id="A5.I1.i2.p1.1" class="ltx_p"><span id="A5.I1.i2.p1.1.1" class="ltx_text ltx_font_bold" style="--ltx-fg-color:#000000;">fluency / grammaticality</span><span id="A5.I1.i2.p1.1.2" class="ltx_text" style="--ltx-fg-color:#000000;"> — Judge grammatical correctness and naturalness of the simplification. Ignore meaning differences and degree of simplification; do not reward added content.</span></span>
</span></span>
<span id="A5.I1.i3" class="ltx_item" style="list-style-type:none;"><span class="ltx_tag ltx_tag_item">•</span> 
<span id="A5.I1.i3.p1" class="ltx_para">
<span id="A5.I1.i3.p1.1" class="ltx_p"><span id="A5.I1.i3.p1.1.1" class="ltx_text ltx_font_bold" style="--ltx-fg-color:#000000;">simplicity / readability</span><span id="A5.I1.i3.p1.1.2" class="ltx_text" style="--ltx-fg-color:#000000;"> — Judge how much easier to read the simplification is compared with the original (shorter sentences, simpler vocabulary/structure). Minor meaning loss may be acceptable, but removing essential information or making text ambiguous should not receive top scores.</span></span>
</span></span>
<span id="A5.I1.i4" class="ltx_item" style="list-style-type:none;"><span class="ltx_tag ltx_tag_item">•</span> 
<span id="A5.I1.i4.p1" class="ltx_para">
<span id="A5.I1.i4.p1.1" class="ltx_p"><span id="A5.I1.i4.p1.1.1" class="ltx_text ltx_font_bold" style="--ltx-fg-color:#000000;">other</span><span id="A5.I1.i4.p1.1.2" class="ltx_text" style="--ltx-fg-color:#000000;"> — If the aspect is unrecognised, judge overall simplification quality, prioritising meaning preservation, then fluency, then simplicity.</span></span>
</span></span>
</span>
<span id="A5.SS5.p2.pic1.2.4" class="ltx_p"><span id="A5.SS5.p2.pic1.2.4.1" class="ltx_text ltx_font_bold" style="--ltx-fg-color:#000000;">Anchor guidance (choose any integer within each band):<span id="A5.SS5.p2.pic1.2.4.1.1" class="ltx_text"></span></span></span>
<span id="A5.I2" class="ltx_itemize ltx_leftmargin_flush">
<span id="A5.I2.i1" class="ltx_item" style="list-style-type:none;"><span class="ltx_tag ltx_tag_item">•</span> 
<span id="A5.I2.i1.p1" class="ltx_para">
<span id="A5.I2.i1.p1.1" class="ltx_p"><span id="A5.I2.i1.p1.1.1" class="ltx_text" style="--ltx-fg-color:#000000;">0–20 Unusable for the aspect.</span></span>
</span></span>
<span id="A5.I2.i2" class="ltx_item" style="list-style-type:none;"><span class="ltx_tag ltx_tag_item">•</span> 
<span id="A5.I2.i2.p1" class="ltx_para">
<span id="A5.I2.i2.p1.1" class="ltx_p"><span id="A5.I2.i2.p1.1.1" class="ltx_text" style="--ltx-fg-color:#000000;">21–40 Poor for the aspect.</span></span>
</span></span>
<span id="A5.I2.i3" class="ltx_item" style="list-style-type:none;"><span class="ltx_tag ltx_tag_item">•</span> 
<span id="A5.I2.i3.p1" class="ltx_para">
<span id="A5.I2.i3.p1.1" class="ltx_p"><span id="A5.I2.i3.p1.1.1" class="ltx_text" style="--ltx-fg-color:#000000;">41–60 Mixed: noticeable problems but some positives.</span></span>
</span></span>
<span id="A5.I2.i4" class="ltx_item" style="list-style-type:none;"><span class="ltx_tag ltx_tag_item">•</span> 
<span id="A5.I2.i4.p1" class="ltx_para">
<span id="A5.I2.i4.p1.1" class="ltx_p"><span id="A5.I2.i4.p1.1.1" class="ltx_text" style="--ltx-fg-color:#000000;">61–80 Good: solid performance with minor issues.</span></span>
</span></span>
<span id="A5.I2.i5" class="ltx_item" style="list-style-type:none;"><span class="ltx_tag ltx_tag_item">•</span> 
<span id="A5.I2.i5.p1" class="ltx_para">
<span id="A5.I2.i5.p1.1" class="ltx_p"><span id="A5.I2.i5.p1.1.1" class="ltx_text" style="--ltx-fg-color:#000000;">81–95 Very good: strong performance with only tiny flaws.</span></span>
</span></span>
<span id="A5.I2.i6" class="ltx_item" style="list-style-type:none;"><span class="ltx_tag ltx_tag_item">•</span> 
<span id="A5.I2.i6.p1" class="ltx_para">
<span id="A5.I2.i6.p1.1" class="ltx_p"><span id="A5.I2.i6.p1.1.1" class="ltx_text" style="--ltx-fg-color:#000000;">96–100 Excellent for the aspect.</span></span>
</span></span>
</span>
<span id="A5.SS5.p2.pic1.2.5" class="ltx_p"><span id="A5.SS5.p2.pic1.2.5.1" class="ltx_text ltx_font_bold" style="--ltx-fg-color:#000000;">General rules:<span id="A5.SS5.p2.pic1.2.5.1.1" class="ltx_text"></span></span></span>
<span id="A5.I3" class="ltx_itemize ltx_leftmargin_flush">
<span id="A5.I3.i1" class="ltx_item" style="list-style-type:none;"><span class="ltx_tag ltx_tag_item">•</span> 
<span id="A5.I3.i1.p1" class="ltx_para">
<span id="A5.I3.i1.p1.1" class="ltx_p"><span id="A5.I3.i1.p1.1.1" class="ltx_text" style="--ltx-fg-color:#000000;">Focus strictly on the stated aspect when scoring.</span></span>
</span></span>
<span id="A5.I3.i2" class="ltx_item" style="list-style-type:none;"><span class="ltx_tag ltx_tag_item">•</span> 
<span id="A5.I3.i2.p1" class="ltx_para">
<span id="A5.I3.i2.p1.1" class="ltx_p"><span id="A5.I3.i2.p1.1.1" class="ltx_text" style="--ltx-fg-color:#000000;">Do not reward hallucinations or added facts not in the original.</span></span>
</span></span>
<span id="A5.I3.i3" class="ltx_item" style="list-style-type:none;"><span class="ltx_tag ltx_tag_item">•</span> 
<span id="A5.I3.i3.p1" class="ltx_para">
<span id="A5.I3.i3.p1.1" class="ltx_p"><span id="A5.I3.i3.p1.1.1" class="ltx_text" style="--ltx-fg-color:#000000;">Non-round integers are allowed (e.g., 73, 88) if they best reflect quality.</span></span>
</span></span>
</span>
<span id="A5.SS5.p2.pic1.2.6" class="ltx_p"><span id="A5.SS5.p2.pic1.2.6.1" class="ltx_text" style="--ltx-fg-color:#000000;">Respond strictly in this format:</span></span><pre id="A5.SS5.p2.pic1.2.7" class="ltx_verbatim ltx_font_typewriter" style="--ltx-fg-color:#000000;">
Feedback:::
Total rating: X
</pre>
<span id="A5.SS5.p2.pic1.2.8" class="ltx_p"><span id="A5.SS5.p2.pic1.2.8.1" class="ltx_text" style="--ltx-fg-color:#000000;">Where <span id="A5.SS5.p2.pic1.2.8.1.1" class="ltx_text ltx_font_typewriter">X</span> is an integer in [0, 100]. Output nothing else.</span></span>
<span id="A5.SS5.p2.pic1.2.9" class="ltx_p"><span id="A5.SS5.p2.pic1.2.9.1" class="ltx_text ltx_font_bold" style="--ltx-fg-color:#000000;">Original sentence:<span id="A5.SS5.p2.pic1.2.9.1.1" class="ltx_text ltx_font_medium">
{original}</span></span></span>
<span id="A5.SS5.p2.pic1.2.10" class="ltx_p"><span id="A5.SS5.p2.pic1.2.10.1" class="ltx_text ltx_font_bold" style="--ltx-fg-color:#000000;">Candidate simplification:<span id="A5.SS5.p2.pic1.2.10.1.1" class="ltx_text ltx_font_medium">
{simplification}</span></span></span>
<span id="A5.SS5.p2.pic1.2.11" class="ltx_p"><span id="A5.SS5.p2.pic1.2.11.1" class="ltx_text ltx_font_bold" style="--ltx-fg-color:#000000;">Expected output:<span id="A5.SS5.p2.pic1.2.11.1.1" class="ltx_text"></span></span></span><pre id="A5.SS5.p2.pic1.2.12" class="ltx_verbatim ltx_font_typewriter" style="--ltx-fg-color:#000000;">
Feedback:::
Total rating:
</pre>
</span></span></span></foreignobject></g></g></svg>