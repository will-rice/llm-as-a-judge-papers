<svg id="A1.F14.pic1" class="ltx_picture ltx_centering" height="504.78" overflow="visible" version="1.1" viewbox="0 0 653.15 504.78" width="653.15"><g style="--ltx-stroke-color:#000000;--ltx-fill-color:#000000;" fill="#000000" stroke="#000000" stroke-width="0.4pt" transform="translate(0,504.78) matrix(1 0 0 -1 0 0)"><g style="--ltx-fill-color:#404040;" fill="#404040" fill-opacity="1.0"><path style="stroke:none" d="M 0 5.91 L 0 498.88 C 0 502.14 2.64 504.78 5.91 504.78 L 647.24 504.78 C 650.51 504.78 653.15 502.14 653.15 498.88 L 653.15 5.91 C 653.15 2.64 650.51 0 647.24 0 L 5.91 0 C 2.64 0 0 2.64 0 5.91 Z" /></g><g style="--ltx-fill-color:#F2F2F2;" fill="#F2F2F2" fill-opacity="1.0"><path style="stroke:none" d="M 1.97 5.91 L 1.97 498.88 C 1.97 501.05 3.73 502.81 5.91 502.81 L 647.24 502.81 C 649.42 502.81 651.18 501.05 651.18 498.88 L 651.18 5.91 C 651.18 3.73 649.42 1.97 647.24 1.97 L 5.91 1.97 C 3.73 1.97 1.97 3.73 1.97 5.91 Z" /></g><g fill-opacity="1.0" transform="matrix(1.0 0.0 0.0 1.0 7.29 16.47)"><foreignobject style="--ltx-fo-width:46.15em;--ltx-fo-height:34.29em;--ltx-fo-depth:0.19em;font-size:10pt;" height="477.23" overflow="visible" transform="matrix(1 0 0 -1 0 474.54)" width="638.59"><span class="ltx_foreignobject_container"><span class="ltx_foreignobject_content">
<span id="A1.F14.pic1.1" class="ltx_inline-block ltx_minipage ltx_align_bottom" style="width:46.15em;">
<span id="A1.F14.pic1.1.1" class="ltx_p"><span id="A1.F14.pic1.1.1.1" class="ltx_text ltx_font_smallcaps" style="--ltx-fg-color:#000000;">template A.4.6
<br class="ltx_break"><span id="A1.F14.pic1.1.1.1.1" class="ltx_text ltx_font_upright">You are an expert linguistic evaluator and subject matter expert fluent in {language_cannonical}. Your task is to determine whether the given answer correctly responds to the question.

<br class="ltx_break">
<br class="ltx_break">{judge_desc}:</span></span></span>
<span id="A1.F14.pic1.1.2" class="ltx_p"><span id="A1.F14.pic1.1.2.1" class="ltx_text" style="--ltx-fg-color:#000000;">- Consider the meaning and intent of the answer, not just surface form</span></span>
<span id="A1.F14.pic1.1.3" class="ltx_p"><span id="A1.F14.pic1.1.3.1" class="ltx_text" style="--ltx-fg-color:#000000;">- Recognize that valid answers may use different but equivalent word forms</span></span>
<span id="A1.F14.pic1.1.4" class="ltx_p"><span id="A1.F14.pic1.1.4.1" class="ltx_text" style="--ltx-fg-color:#000000;">- Be sensitive to dialectal variation and alternate correct forms

<br class="ltx_break">
<br class="ltx_break"></span></span>
<span id="A1.F14.pic1.1.5" class="ltx_p"><span id="A1.F14.pic1.1.5.1" class="ltx_text" style="--ltx-fg-color:#000000;">Your evaluation has two steps:</span></span>
<span id="A1.F14.pic1.1.6" class="ltx_p"><span id="A1.F14.pic1.1.6.1" class="ltx_text" style="--ltx-fg-color:#000000;">Step 1 — Extract:</span></span>
<span id="A1.F14.pic1.1.7" class="ltx_p"><span id="A1.F14.pic1.1.7.1" class="ltx_text" style="--ltx-fg-color:#000000;">Identify the core answer within the Generated Answer.</span></span>
<span id="A1.F14.pic1.1.8" class="ltx_p"><span id="A1.F14.pic1.1.8.1" class="ltx_text" style="--ltx-fg-color:#000000;">{language_cannonical} responses often contain elaboration, context, or explanation around the actual answer. Extract only the essential answer as a short phrase or word.

<br class="ltx_break">
<br class="ltx_break">Step 2 — Evaluate:</span></span>
<span id="A1.F14.pic1.1.9" class="ltx_p"><span id="A1.F14.pic1.1.9.1" class="ltx_text" style="--ltx-fg-color:#000000;">Based on the extracted answer, assess whether it correctly matches with the Ground Truth Answer.

<br class="ltx_break">
<br class="ltx_break">## Question</span></span>
<span id="A1.F14.pic1.1.10" class="ltx_p"><span id="A1.F14.pic1.1.10.1" class="ltx_text" style="--ltx-fg-color:#000000;">{question}</span></span>
<span id="A1.F14.pic1.1.11" class="ltx_p"><span id="A1.F14.pic1.1.11.1" class="ltx_text" style="--ltx-fg-color:#000000;">## Generated Answer</span></span>
<span id="A1.F14.pic1.1.12" class="ltx_p"><span id="A1.F14.pic1.1.12.1" class="ltx_text" style="--ltx-fg-color:#000000;">{gen_answer}</span></span>
<span id="A1.F14.pic1.1.13" class="ltx_p"><span id="A1.F14.pic1.1.13.1" class="ltx_text" style="--ltx-fg-color:#000000;">## Ground Truth Answer</span></span>
<span id="A1.F14.pic1.1.14" class="ltx_p"><span id="A1.F14.pic1.1.14.1" class="ltx_text" style="--ltx-fg-color:#000000;">{gt_answer}

<br class="ltx_break">
<br class="ltx_break"></span></span>
<span id="A1.F14.pic1.1.15" class="ltx_p"><span id="A1.F14.pic1.1.15.1" class="ltx_text" style="--ltx-fg-color:#000000;">Respond using this exact JSON format:</span></span>
<span id="A1.F14.pic1.1.16" class="ltx_p"><span id="A1.F14.pic1.1.16.1" class="ltx_text" style="--ltx-fg-color:#000000;">{{</span></span>
<span id="A1.F14.pic1.1.17" class="ltx_p"><span id="A1.F14.pic1.1.17.1" class="ltx_text" style="--ltx-fg-color:#000000;">“extracted_answer”: “&lt;short core answer extracted from Generated Answer&gt;”,</span></span>
<span id="A1.F14.pic1.1.18" class="ltx_p"><span id="A1.F14.pic1.1.18.1" class="ltx_text" style="--ltx-fg-color:#000000;">“explanation”: “&lt;step-by-step evaluation of the extracted answer&gt;”,</span></span>
<span id="A1.F14.pic1.1.19" class="ltx_p"><span id="A1.F14.pic1.1.19.1" class="ltx_text" style="--ltx-fg-color:#000000;">“verdict”: “&lt;CORRECT or INCORRECT&gt;”</span></span>
<span id="A1.F14.pic1.1.20" class="ltx_p"><span id="A1.F14.pic1.1.20.1" class="ltx_text" style="--ltx-fg-color:#000000;">}}
<br class="ltx_break">
<br class="ltx_break">Output only the JSON object. Nothing before or after it.</span></span>
</span></span></span></foreignobject></g></g></svg>