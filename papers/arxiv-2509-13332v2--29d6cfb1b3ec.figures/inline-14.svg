<span id="A5.F16.pic1.1.1" class="ltx_p"><span id="A5.F16.pic1.1.1.1" class="ltx_text ltx_font_bold" style="--ltx-fg-color:#FFFFFF;">Rubric for MRewardBench subset: llmbar-adver-GPTOut</span></span>
</span></span></span></foreignobject></g><g fill-opacity="1.0" transform="matrix(1.0 0.0 0.0 1.0 20.79 15.99)"><foreignobject style="--ltx-fo-width:31.5em;--ltx-fo-height:13.81em;--ltx-fo-depth:0.22em;font-size:10pt;" class="ltx_minipage" height="194.18" overflow="visible" transform="matrix(1 0 0 -1 0 191.11)" width="30em"><span class="ltx_foreignobject_container"><span class="ltx_foreignobject_content"><pre id="A5.F16.pic1.2" class="ltx_verbatim ltx_font_typewriter" style="--ltx-fg-color:#000000;">Pairwise judge where outputs may be eloquent but wrong.
Steps:
1) Read the User Question and the answers from Assistant A and
   Assistant B.
2) Checks:
   - Correctness over style: correctness and compliance dominate
   eloquence.
   - Constraint coverage: all requirements satisfied.
   - Grounding: no invented facts; consistent with the User
   Question/context.
   - Clarity without fluff.
3) Penalize: stylish-but-incorrect content, hallucinations,
   requirement misses.
4) Decision: choose Assistant A if it is more correct and compliant;
   otherwise choose Assistant B.
5) Neutrality: ignore presentation order, assistant names, and length.

</pre></span></span></foreignobject></g></g></svg>