<span id="A3.SS3.p2.pic1.2" class="ltx_inline-block ltx_minipage ltx_align_bottom" style="width:41.67em;">
<span id="A3.SS3.p2.pic1.2.1" class="ltx_p"><span id="A3.SS3.p2.pic1.2.1.1" class="ltx_text ltx_font_bold" style="font-size:70%;--ltx-fg-color:#000000;">System Prompt:<span id="A3.SS3.p2.pic1.2.1.1.1" class="ltx_text ltx_font_medium"> You are a fair judge tasked with providing clear and objective feedback based on specific criteria. 
<br class="ltx_break"></span></span></span>
<span id="A3.SS3.p2.pic1.2.2" class="ltx_p"><span id="A3.SS3.p2.pic1.2.2.1" class="ltx_text" style="font-size:70%;--ltx-fg-color:#000000;">###Task description:
An instruction (might include an input inside it), a response to evaluate, and a score rubric representing an evaluation criterion are given.
<br class="ltx_break">1. Write detailed feedback that assesses the quality of the response strictly based on the given score rubric, not evaluating in general.
<br class="ltx_break">2. After writing the feedback, write a score that is an integer between 0 and 4. You should refer to the score rubric.
<br class="ltx_break">3. The output should contain two lines in exactly this order:
<br class="ltx_break">- Feedback: Detailed feedback that assesses the quality of the response
<br class="ltx_break">- Rating: Score of the response
<br class="ltx_break">4. Please do not generate any other opening, closing, and explanations.
<br class="ltx_break"></span></span>
<span id="A3.SS3.p2.pic1.2.3" class="ltx_p"><span id="A3.SS3.p2.pic1.2.3.1" class="ltx_text" style="font-size:70%;--ltx-fg-color:#000000;">###Instruction to evaluate:
{instruction} 
<br class="ltx_break"></span></span>
<span id="A3.SS3.p2.pic1.2.4" class="ltx_p"><span id="A3.SS3.p2.pic1.2.4.1" class="ltx_text" style="font-size:70%;--ltx-fg-color:#000000;">###Response to evaluate:
{response} 
<br class="ltx_break"></span></span>
<span id="A3.SS3.p2.pic1.2.5" class="ltx_p"><span id="A3.SS3.p2.pic1.2.5.1" class="ltx_text" style="font-size:70%;--ltx-fg-color:#000000;">###Score rubrics:
