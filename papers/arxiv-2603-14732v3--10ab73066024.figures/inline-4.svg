<span id="S5.F17.pic1.2.1" class="ltx_p"><span id="S5.F17.pic1.2.1.1" class="ltx_text ltx_font_bold" style="font-size:90%;--ltx-fg-color:#000000;">Q5.<span id="S5.F17.pic1.2.1.1.1" class="ltx_text ltx_font_medium"> A soccer field is 100.0 m long; an American football field is 100.0 yd. Which is longer, and by how much (in yards)?
<br class="ltx_break"><span id="S5.F17.pic1.2.1.1.1.1" class="ltx_text ltx_font_italic">Solution:</span> 9.4 yards (1 mark)
<br class="ltx_break" style="--ltx-break-space:4.0pt;">
</span>Q6.<span id="S5.F17.pic1.2.1.1.2" class="ltx_text ltx_font_medium"> Estimate the number of books that can be shelved in a library with <math id="S5.F17.pic1.m1" class="ltx_Math" alttext="3500\;\mathrm{m}^{2}" display="inline" intent=":literal"><semantics><mrow><mn style="--ltx-fg-color:#000000;" mathcolor="#000000">3500</mn><mo lspace="0.280em" rspace="0em">​</mo><msup><mi style="--ltx-fg-color:#000000;" mathcolor="#000000" mathvariant="normal">m</mi><mn style="--ltx-fg-color:#000000;" mathcolor="#000000">2</mn></msup></mrow><annotation encoding="application/x-tex">3500\;\mathrm{m}^{2}</annotation></semantics></math> of floor space (8 shelves high, 1.5 m corridors, books 25 cm tall and 4 cm wide).
<br class="ltx_break"><span id="S5.F17.pic1.2.1.1.2.1" class="ltx_text ltx_font_italic">Solution:</span> <math id="S5.F17.pic1.m2" class="ltx_Math" alttext="6\times 10^{5}" display="inline" intent=":literal"><semantics><mrow><mn style="--ltx-fg-color:#000000;" mathcolor="#000000">6</mn><mo style="--ltx-fg-color:#000000;" lspace="0.222em" mathcolor="#000000" rspace="0.222em">×</mo><msup><mn style="--ltx-fg-color:#000000;" mathcolor="#000000">10</mn><mn style="--ltx-fg-color:#000000;" mathcolor="#000000">5</mn></msup></mrow><annotation encoding="application/x-tex">6\times 10^{5}</annotation></semantics></math> books (1 mark)
<br class="ltx_break" style="--ltx-break-space:4.0pt;">
<span id="S5.F17.pic1.2.1.1.2.2" class="ltx_text"></span></span></span></span>
