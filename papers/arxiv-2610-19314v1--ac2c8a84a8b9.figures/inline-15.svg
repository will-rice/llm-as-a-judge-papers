<svg id="A6.SS2.p2.pic1" class="ltx_picture" height="1120.25" overflow="visible" version="1.1" viewbox="0 0 653.15 1120.25" width="653.15"><g style="--ltx-stroke-color:#000000;--ltx-fill-color:#000000;" fill="#000000" stroke="#000000" stroke-width="0.4pt" transform="translate(0,1120.25) matrix(1 0 0 -1 0 0)"><g style="--ltx-fill-color:#737373;" fill="#737373" fill-opacity="1.0"><path style="stroke:none" d="M 0 2.08 L 0 1118.17 C 0 1119.32 0.93 1120.25 2.08 1120.25 L 651.07 1120.25 C 652.22 1120.25 653.15 1119.32 653.15 1118.17 L 653.15 2.08 C 653.15 0.93 652.22 0 651.07 0 L 2.08 0 C 0.93 0 0 0.93 0 2.08 Z" /></g><g style="--ltx-fill-color:#FAFAFA;" fill="#FAFAFA" fill-opacity="1.0"><path style="stroke:none" d="M 0.69 2.08 L 0.69 1098.69 L 652.46 1098.69 L 652.46 2.08 C 652.46 1.31 651.84 0.69 651.07 0.69 L 2.08 0.69 C 1.31 0.69 0.69 1.31 0.69 2.08 Z" /></g><g style="--ltx-fill-color:#595959;" fill="#595959" fill-opacity="1.0"><path style="stroke:none" d="M 0.69 1099.38 L 0.69 1118.17 C 0.69 1118.94 1.31 1119.56 2.08 1119.56 L 651.07 1119.56 C 651.84 1119.56 652.46 1118.94 652.46 1118.17 L 652.46 1099.38 Z" /></g><g fill-opacity="1.0" transform="matrix(1.0 0.0 0.0 1.0 11.55 1106.01)"><foreignobject style="--ltx-fo-width:39.59em;--ltx-fo-height:0.69em;--ltx-fo-depth:0.19em;font-size:10pt;" height="12.3" overflow="visible" transform="matrix(1 0 0 -1 0 9.61)" width="547.81"><span class="ltx_foreignobject_container"><span class="ltx_foreignobject_content">
<span id="A6.SS2.p2.pic1.1" class="ltx_inline-block ltx_minipage ltx_align_bottom" style="width:39.59em;">
<span id="A6.SS2.p2.pic1.1.1" class="ltx_p"><span id="A6.SS2.p2.pic1.1.1.1" class="ltx_text ltx_font_bold" style="--ltx-fg-color:#FFFFFF;">Prompt 10  End-to-end evaluation</span></span>
</span></span></span></foreignobject></g><g fill-opacity="1.0" transform="matrix(1.0 0.0 0.0 1.0 11.55 13.24)"><foreignobject style="--ltx-fo-width:45.53em;--ltx-fo-height:77.76em;--ltx-fo-depth:0.22em;font-size:10pt;" height="1079.07" overflow="visible" transform="matrix(1 0 0 -1 0 1075.99)" width="630.01"><span class="ltx_foreignobject_container"><span class="ltx_foreignobject_content">
<span id="A6.SS2.p2.pic1.2" class="ltx_inline-block ltx_minipage ltx_align_bottom" style="width:45.53em;">
<span id="A6.SS2.p2.pic1.2.1" class="ltx_p"><span id="A6.SS2.p2.pic1.2.1.1" class="ltx_text ltx_font_bold" style="--ltx-fg-color:#000000;">Purpose:<span id="A6.SS2.p2.pic1.2.1.1.1" class="ltx_text ltx_font_medium"> single-pass verdict, subtype, and evidence elicitation</span></span></span>
<span id="A6.SS2.p2.pic1.2.2" class="ltx_p"><span id="A6.SS2.p2.pic1.2.2.1" class="ltx_text ltx_font_bold" style="--ltx-fg-color:#000000;">Input:<span id="A6.SS2.p2.pic1.2.2.1.1" class="ltx_text ltx_font_medium"> context under the active visibility condition, target request, candidate response</span></span></span>
<span id="A6.SS2.p2.pic1.2.3" class="ltx_p"><span id="A6.SS2.p2.pic1.2.3.1" class="ltx_text ltx_font_bold" style="--ltx-fg-color:#000000;">Output:<span id="A6.SS2.p2.pic1.2.3.1.1" class="ltx_text ltx_font_medium"> <span id="A6.SS2.p2.pic1.2.3.1.1.1" class="ltx_text ltx_font_typewriter">{verdict, subtypes, confidence, reasoning}</span></span></span></span>
<span id="A6.SS2.p2.pic1.2.4" class="ltx_p"><span id="A6.SS2.p2.pic1.2.4.1" class="ltx_text ltx_font_bold" style="--ltx-fg-color:#000000;">Inputs<span id="A6.SS2.p2.pic1.2.4.1.1" class="ltx_text ltx_font_medium"> — <span id="A6.SS2.p2.pic1.2.4.1.1.1" class="ltx_text ltx_font_italic">the three task elements</span></span></span></span><span class="ltx_rule" style="width:100%;height:0.3pt;--ltx-fg-color:#999999;--ltx-bg-color:#999999;display:inline-block;"> </span>
<span id="A6.SS2.p2.pic1.2.5" class="ltx_p ltx_align_left"><span id="A6.SS2.p2.pic1.2.5.1" class="ltx_text ltx_font_typewriter" style="--ltx-fg-color:#000000;">Given the conversation context below, evaluate whether the assistant response correctly uses the user’s preferences, constraints, and expressed states.</span></span>
<span id="A6.SS2.p2.pic1.2.6" class="ltx_p ltx_align_left"><span id="A6.SS2.p2.pic1.2.6.1" class="ltx_text ltx_font_typewriter" style="--ltx-fg-color:#000000;">Conversation context: {context}</span></span>
<span id="A6.SS2.p2.pic1.2.7" class="ltx_p ltx_align_left"><span id="A6.SS2.p2.pic1.2.7.1" class="ltx_text ltx_font_typewriter" style="--ltx-fg-color:#000000;">User request: {user_request}</span></span>
<span id="A6.SS2.p2.pic1.2.8" class="ltx_p ltx_align_left"><span id="A6.SS2.p2.pic1.2.8.1" class="ltx_text ltx_font_typewriter" style="--ltx-fg-color:#000000;">Assistant response: {response}</span></span>
<span id="A6.SS2.p2.pic1.2.9" class="ltx_p"><span id="A6.SS2.p2.pic1.2.9.1" class="ltx_text ltx_font_bold" style="--ltx-fg-color:#000000;">Decision procedure<span id="A6.SS2.p2.pic1.2.9.1.1" class="ltx_text ltx_font_medium"> — <span id="A6.SS2.p2.pic1.2.9.1.1.1" class="ltx_text ltx_font_italic">identify applicable states, check the response, then classify</span></span></span></span><span class="ltx_rule" style="width:100%;height:0.3pt;--ltx-fg-color:#999999;--ltx-bg-color:#999999;display:inline-block;"> </span>
<span id="A6.SS2.p2.pic1.2.10" class="ltx_p ltx_align_left"><span id="A6.SS2.p2.pic1.2.10.1" class="ltx_text ltx_font_typewriter" style="--ltx-fg-color:#000000;">Step 1: Identify applicable user preferences/constraints from the context; list which are relevant to this specific request.</span></span>
<span id="A6.SS2.p2.pic1.2.11" class="ltx_p ltx_align_left"><span id="A6.SS2.p2.pic1.2.11.1" class="ltx_text ltx_font_typewriter" style="--ltx-fg-color:#000000;">Step 2: Check the response against each applicable preference.</span></span>
<span id="A6.SS2.p2.pic1.2.12" class="ltx_p ltx_align_left"><span id="A6.SS2.p2.pic1.2.12.1" class="ltx_text ltx_font_typewriter" style="--ltx-fg-color:#000000;">Step 3: Classify using the decision tree below.</span></span>
<span id="A6.SS2.p2.pic1.2.13" class="ltx_p"><span id="A6.SS2.p2.pic1.2.13.1" class="ltx_text ltx_font_bold" style="--ltx-fg-color:#000000;">Verdict taxonomy<span id="A6.SS2.p2.pic1.2.13.1.1" class="ltx_text ltx_font_medium"> — <span id="A6.SS2.p2.pic1.2.13.1.1.1" class="ltx_text ltx_font_italic">the three-way decision tree with subtype anchors</span></span></span></span><span class="ltx_rule" style="width:100%;height:0.3pt;--ltx-fg-color:#999999;--ltx-bg-color:#999999;display:inline-block;"> </span>
<span id="A6.SS2.p2.pic1.2.14" class="ltx_p ltx_align_left"><span id="A6.SS2.p2.pic1.2.14.1" class="ltx_text ltx_font_typewriter" style="--ltx-fg-color:#000000;">OVER_PERSONALIZED (the response actively uses wrong information):</span></span>
<span id="A6.SS2.p2.pic1.2.15" class="ltx_p ltx_align_left"><span id="A6.SS2.p2.pic1.2.15.1" class="ltx_text ltx_font_typewriter" style="--ltx-fg-color:#000000;">- uses a preference that belongs to a different person</span></span>
<span id="A6.SS2.p2.pic1.2.16" class="ltx_p ltx_align_left"><span id="A6.SS2.p2.pic1.2.16.1" class="ltx_text ltx_font_typewriter" style="--ltx-fg-color:#000000;">- uses a stale/outdated preference (superseded by newer information)</span></span>
<span id="A6.SS2.p2.pic1.2.17" class="ltx_p ltx_align_left"><span id="A6.SS2.p2.pic1.2.17.1" class="ltx_text ltx_font_typewriter" style="--ltx-fg-color:#000000;">- uses a preference from a different scope (e.g., business constraints applied to a personal trip)</span></span>
<span id="A6.SS2.p2.pic1.2.18" class="ltx_p ltx_align_left"><span id="A6.SS2.p2.pic1.2.18.1" class="ltx_text ltx_font_typewriter" style="--ltx-fg-color:#000000;">- uses information that is irrelevant to this specific request</span></span>
<span id="A6.SS2.p2.pic1.2.19" class="ltx_p ltx_align_left"><span id="A6.SS2.p2.pic1.2.19.1" class="ltx_text ltx_font_typewriter" style="--ltx-fg-color:#000000;">- acts on a preference the user never stated (unsupported inference)</span></span>
<span id="A6.SS2.p2.pic1.2.20" class="ltx_p ltx_align_left"><span id="A6.SS2.p2.pic1.2.20.1" class="ltx_text ltx_font_typewriter" style="--ltx-fg-color:#000000;">- lets a soft preference dominate over the primary task requirement</span></span>
<span id="A6.SS2.p2.pic1.2.21" class="ltx_p ltx_align_left"><span id="A6.SS2.p2.pic1.2.21.1" class="ltx_text ltx_font_typewriter" style="--ltx-fg-color:#000000;">UNDER_PERSONALIZED (the response fails to use correct information):</span></span>
<span id="A6.SS2.p2.pic1.2.22" class="ltx_p ltx_align_left"><span id="A6.SS2.p2.pic1.2.22.1" class="ltx_text ltx_font_typewriter" style="--ltx-fg-color:#000000;">- gives a generic response ignoring a clearly applicable preference (complete omission)</span></span>
<span id="A6.SS2.p2.pic1.2.23" class="ltx_p ltx_align_left"><span id="A6.SS2.p2.pic1.2.23.1" class="ltx_text ltx_font_typewriter" style="--ltx-fg-color:#000000;">- uses some preferences but misses a critical one (partial omission)</span></span>
<span id="A6.SS2.p2.pic1.2.24" class="ltx_p ltx_align_left"><span id="A6.SS2.p2.pic1.2.24.1" class="ltx_text ltx_font_typewriter" style="--ltx-fg-color:#000000;">- acknowledges a constraint but treats it as optional/soft (underweighting)</span></span>
<span id="A6.SS2.p2.pic1.2.25" class="ltx_p ltx_align_left"><span id="A6.SS2.p2.pic1.2.25.1" class="ltx_text ltx_font_typewriter" style="--ltx-fg-color:#000000;">- directly contradicts a stated preference without acknowledging it (explicit violation; if the response contradicts a newer preference by using stale information, that is OVER, not UNDER)</span></span>
<span id="A6.SS2.p2.pic1.2.26" class="ltx_p ltx_align_left"><span id="A6.SS2.p2.pic1.2.26.1" class="ltx_text ltx_font_typewriter" style="--ltx-fg-color:#000000;">RIGHT: the response correctly applies all relevant current preferences without over- or under-applying them.</span></span>
<span id="A6.SS2.p2.pic1.2.27" class="ltx_p"><span id="A6.SS2.p2.pic1.2.27.1" class="ltx_text ltx_font_bold" style="--ltx-fg-color:#000000;">Disambiguation rule<span id="A6.SS2.p2.pic1.2.27.1.1" class="ltx_text ltx_font_medium"> — <span id="A6.SS2.p2.pic1.2.27.1.1.1" class="ltx_text ltx_font_italic">resolves mixed cases by the primary mechanism</span></span></span></span><span class="ltx_rule" style="width:100%;height:0.3pt;--ltx-fg-color:#999999;--ltx-bg-color:#999999;display:inline-block;"> </span>
<span id="A6.SS2.p2.pic1.2.28" class="ltx_p ltx_align_left"><span id="A6.SS2.p2.pic1.2.28.1" class="ltx_text ltx_font_typewriter" style="--ltx-fg-color:#000000;">- Generic response referencing no user-specific information -&gt; UNDER</span></span>
<span id="A6.SS2.p2.pic1.2.29" class="ltx_p ltx_align_left"><span id="A6.SS2.p2.pic1.2.29.1" class="ltx_text ltx_font_typewriter" style="--ltx-fg-color:#000000;">- Actively applies wrong or inapplicable information -&gt; OVER</span></span>
<span id="A6.SS2.p2.pic1.2.30" class="ltx_p ltx_align_left"><span id="A6.SS2.p2.pic1.2.30.1" class="ltx_text ltx_font_typewriter" style="--ltx-fg-color:#000000;">- If both occur, classify by the primary mechanism: substitution of B for A -&gt; OVER; simply not using A -&gt; UNDER</span></span>
<span id="A6.SS2.p2.pic1.2.31" class="ltx_p"><span id="A6.SS2.p2.pic1.2.31.1" class="ltx_text ltx_font_bold" style="--ltx-fg-color:#000000;">Output contract<span id="A6.SS2.p2.pic1.2.31.1.1" class="ltx_text ltx_font_medium"> — <span id="A6.SS2.p2.pic1.2.31.1.1.1" class="ltx_text ltx_font_italic">canonical subtype labels; JSON only</span></span></span></span><span class="ltx_rule" style="width:100%;height:0.3pt;--ltx-fg-color:#999999;--ltx-bg-color:#999999;display:inline-block;"> </span>
<span id="A6.SS2.p2.pic1.2.32" class="ltx_p ltx_align_left"><span id="A6.SS2.p2.pic1.2.32.1" class="ltx_text ltx_font_typewriter" style="--ltx-fg-color:#000000;">Respond with a JSON object containing:</span></span>
<span id="A6.SS2.p2.pic1.2.33" class="ltx_p ltx_align_left"><span id="A6.SS2.p2.pic1.2.33.1" class="ltx_text ltx_font_typewriter" style="--ltx-fg-color:#000000;">- &quot;verdict&quot;: one of &quot;RIGHT&quot;, &quot;OVER_PERSONALIZED&quot;, &quot;UNDER_PERSONALIZED&quot;</span></span>
<span id="A6.SS2.p2.pic1.2.34" class="ltx_p ltx_align_left"><span id="A6.SS2.p2.pic1.2.34.1" class="ltx_text ltx_font_typewriter" style="--ltx-fg-color:#000000;">- &quot;subtypes&quot;: the primary error subtype if applicable, drawn from: under.complete_omission, under.partial_omission, under.underweighting, under.explicit_violation, over.irrelevant_use, over.scope_leakage, over.stale_or_superseded, over.unsupported_inference, over.over_dominance; an empty list if RIGHT</span></span>
<span id="A6.SS2.p2.pic1.2.35" class="ltx_p ltx_align_left"><span id="A6.SS2.p2.pic1.2.35.1" class="ltx_text ltx_font_typewriter" style="--ltx-fg-color:#000000;">- &quot;confidence&quot;: float 0.0--1.0</span></span>
<span id="A6.SS2.p2.pic1.2.36" class="ltx_p ltx_align_left"><span id="A6.SS2.p2.pic1.2.36.1" class="ltx_text ltx_font_typewriter" style="--ltx-fg-color:#000000;">- &quot;reasoning&quot;: brief explanation citing which preference was mishandled and how</span></span>
<span id="A6.SS2.p2.pic1.2.37" class="ltx_p ltx_align_left"><span id="A6.SS2.p2.pic1.2.37.1" class="ltx_text ltx_font_typewriter" style="--ltx-fg-color:#000000;">Respond only with the JSON object, no other text.</span></span>
</span></span></span></foreignobject></g></g></svg>