<span id="A8.p10.pic1.2.1" class="ltx_p"><span id="A8.p10.pic1.2.1.1" class="ltx_text" style="--ltx-fg-color:#000000;">You will be provided with a prompt for an LLM and asked to rate its quality on a scale of 1 to 5.
<br class="ltx_break">When rating, consider factors such as clarity, specificity, relevance, conciseness, and the prompt’s effectiveness in guiding the LLM to generate useful and appropriate responses.
<br class="ltx_break">Use the following scale:
<br class="ltx_break">1 - very bad
<br class="ltx_break">2 - bad
<br class="ltx_break">3 - OK
<br class="ltx_break">4 - good
<br class="ltx_break">5 - very good
<br class="ltx_break">
<br class="ltx_break">Please follow the JSON format below:
<br class="ltx_break">```json 
<br class="ltx_break">{
<br class="ltx_break"><span id="A8.p10.pic1.2.1.1.1" class="ltx_text"></span> &quot;quality&quot;: int (1-5)
<br class="ltx_break">}
<br class="ltx_break">```
<br class="ltx_break">
<br class="ltx_break">** Prompt ** 
<br class="ltx_break">[PROMPT]</span></span>
</span></span></span></foreignobject></g></g></svg>