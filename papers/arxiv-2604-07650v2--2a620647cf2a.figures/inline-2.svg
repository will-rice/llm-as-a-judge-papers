<span id="A2.SS3.p3.pic1.2" class="ltx_inline-block ltx_minipage ltx_align_bottom" style="width:36.62em;">
<span id="A2.SS3.p3.pic1.2.1" class="ltx_p"><span id="A2.SS3.p3.pic1.2.1.1" class="ltx_text ltx_font_bold" style="--ltx-fg-color:#000000;">Evaluation Criteria<span id="A2.SS3.p3.pic1.2.1.1.1" class="ltx_text"></span></span></span>
<span id="A2.SS3.p3.pic1.2.2" class="ltx_p"><span id="A2.SS3.p3.pic1.2.2.1" class="ltx_text" style="--ltx-fg-color:#000000;">Given the question, candidate options, and the <span id="A2.SS3.p3.pic1.2.2.1.1" class="ltx_text" style="--ltx-fg-color:#0000FF;">Selected Option</span> produced by each model, evaluate whether the model’s final answer is correct. The correctness judgment should focus <span id="A2.SS3.p3.pic1.2.2.1.2" class="ltx_text ltx_font_bold">only</span> on the choice of option, rather than the explanation.</span></span>
<span id="A2.I2" class="ltx_itemize">
<span id="A2.I2.i1" class="ltx_item" style="list-style-type:none;"><span class="ltx_tag ltx_tag_item">•</span> 
<span id="A2.I2.i1.p1" class="ltx_para ltx_noindent">
<span id="A2.I2.i1.p1.1" class="ltx_p"><span id="A2.I2.i1.p1.1.1" class="ltx_text ltx_font_bold" style="--ltx-fg-color:#0000FF;">1</span><span id="A2.I2.i1.p1.1.2" class="ltx_text" style="--ltx-fg-color:#000000;"> </span><math id="A2.I2.i1.p1.m1" class="ltx_Math" alttext="\rightarrow" display="inline" intent=":literal"><semantics><mo style="--ltx-fg-color:#000000;" mathcolor="#000000" stretchy="false">→</mo><annotation encoding="application/x-tex">\rightarrow</annotation></semantics></math><span id="A2.I2.i1.p1.1.3" class="ltx_text" style="--ltx-fg-color:#000000;"> Correct</span></span>
</span></span>
<span id="A2.I2.i2" class="ltx_item" style="list-style-type:none;"><span class="ltx_tag ltx_tag_item">•</span> 
<span id="A2.I2.i2.p1" class="ltx_para">
<span id="A2.I2.i2.p1.1" class="ltx_p"><span id="A2.I2.i2.p1.1.1" class="ltx_text ltx_font_bold" style="--ltx-fg-color:#0000FF;">0</span><span id="A2.I2.i2.p1.1.2" class="ltx_text" style="--ltx-fg-color:#000000;"> </span><math id="A2.I2.i2.p1.m1" class="ltx_Math" alttext="\rightarrow" display="inline" intent=":literal"><semantics><mo style="--ltx-fg-color:#000000;" mathcolor="#000000" stretchy="false">→</mo><annotation encoding="application/x-tex">\rightarrow</annotation></semantics></math><span id="A2.I2.i2.p1.1.3" class="ltx_text" style="--ltx-fg-color:#000000;"> Incorrect or missing</span></span>
</span></span>
</span>
<span id="A2.SS3.p3.pic1.2.3" class="ltx_p"><span id="A2.SS3.p3.pic1.2.3.1" class="ltx_text ltx_font_bold" style="--ltx-fg-color:#000000;">Rules<span id="A2.SS3.p3.pic1.2.3.1.1" class="ltx_text"></span></span></span>
<span id="A2.I3" class="ltx_itemize">
<span id="A2.I3.i1" class="ltx_item" style="list-style-type:none;"><span class="ltx_tag ltx_tag_item">•</span> 
<span id="A2.I3.i1.p1" class="ltx_para ltx_noindent">
<span id="A2.I3.i1.p1.1" class="ltx_p"><span id="A2.I3.i1.p1.1.1" class="ltx_text" style="--ltx-fg-color:#000000;">Evaluate correctness based on the model’s selected option.</span></span>
</span></span>
<span id="A2.I3.i2" class="ltx_item" style="list-style-type:none;"><span class="ltx_tag ltx_tag_item">•</span> 
<span id="A2.I3.i2.p1" class="ltx_para ltx_noindent">
<span id="A2.I3.i2.p1.1" class="ltx_p"><span id="A2.I3.i2.p1.1.1" class="ltx_text" style="--ltx-fg-color:#000000;">If the model explicitly states a single option that matches the correct answer, assign </span><span id="A2.I3.i2.p1.1.2" class="ltx_text ltx_font_bold" style="--ltx-fg-color:#000000;">1</span><span id="A2.I3.i2.p1.1.3" class="ltx_text" style="--ltx-fg-color:#000000;">.</span></span>
</span></span>
<span id="A2.I3.i3" class="ltx_item" style="list-style-type:none;"><span class="ltx_tag ltx_tag_item">•</span> 
<span id="A2.I3.i3.p1" class="ltx_para ltx_noindent">
<span id="A2.I3.i3.p1.1" class="ltx_p"><span id="A2.I3.i3.p1.1.1" class="ltx_text" style="--ltx-fg-color:#000000;">If the model explicitly states a single option that does not match the correct answer, assign </span><span id="A2.I3.i3.p1.1.2" class="ltx_text ltx_font_bold" style="--ltx-fg-color:#000000;">0</span><span id="A2.I3.i3.p1.1.3" class="ltx_text" style="--ltx-fg-color:#000000;">.</span></span>
</span></span>
<span id="A2.I3.i4" class="ltx_item" style="list-style-type:none;"><span class="ltx_tag ltx_tag_item">•</span> 
<span id="A2.I3.i4.p1" class="ltx_para">
<span id="A2.I3.i4.p1.1" class="ltx_p"><span id="A2.I3.i4.p1.1.1" class="ltx_text" style="--ltx-fg-color:#000000;">If the response does not contain a clear final answer, assign </span><span id="A2.I3.i4.p1.1.2" class="ltx_text ltx_font_bold" style="--ltx-fg-color:#000000;">0</span><span id="A2.I3.i4.p1.1.3" class="ltx_text" style="--ltx-fg-color:#000000;">.</span></span>
</span></span>
</span>
</span></span></span></foreignobject></g></g></svg>