<span id="S5.F4.pic1.1.1" class="ltx_p"><span id="S5.F4.pic1.1.1.1" class="ltx_text ltx_font_bold" style="font-size:80%;--ltx-fg-color:#FFFFFF;">Instruction given to the two human annotators</span></span>
</span></span></span></foreignobject></g><g fill-opacity="1.0" transform="matrix(1.0 0.0 0.0 1.0 12.5 12.69)"><foreignobject style="--ltx-fo-width:38.46em;--ltx-fo-height:19.76em;--ltx-fo-depth:0.16em;font-size:10pt;" height="275.51" overflow="visible" transform="matrix(1 0 0 -1 0 273.36)" width="532.18"><span class="ltx_foreignobject_container"><span class="ltx_foreignobject_content">
<span id="S5.F4.pic1.2" class="ltx_inline-block ltx_minipage ltx_align_bottom" style="width:38.46em;">
<span id="S5.F4.pic1.2.1" class="ltx_p"><span id="S5.F4.pic1.2.1.1" class="ltx_text ltx_font_bold" style="font-size:80%;--ltx-fg-color:#000000;">Material shown for each sampled instance:<span id="S5.F4.pic1.2.1.1.1" class="ltx_text ltx_font_medium"> the user instruction, the two
original responses together with their preference label, the rewritten response
pair, and the definition of the bias type that the rewrite is meant to
inject.
<br class="ltx_break" style="--ltx-break-space:4.0pt;">
</span>Q1 Injection success:<span id="S5.F4.pic1.2.1.1.2" class="ltx_text ltx_font_medium"> Does the rewritten response carry the superficial
feature described by the bias definition, while remaining fluent and faithful to
the content of the original response? <em id="S5.F4.pic1.2.1.1.2.1" class="ltx_emph ltx_font_italic">Yes / No</em>
<br class="ltx_break" style="--ltx-break-space:4.0pt;">
</span>Q2 Preference preserved:<span id="S5.F4.pic1.2.1.1.3" class="ltx_text ltx_font_medium"> Setting the injected superficial feature aside,
would the response that was preferred before the rewrite still be preferred on
substantive quality? <em id="S5.F4.pic1.2.1.1.3.1" class="ltx_emph ltx_font_italic">Yes / No</em>
<br class="ltx_break" style="--ltx-break-space:4.0pt;">
</span>Guidelines:<span id="S5.F4.pic1.2.1.1.4" class="ltx_text ltx_font_medium">
(i) Answer Q2 on substantive quality only. The injected feature itself is never a
reason to prefer a response.
(ii) Answer <em id="S5.F4.pic1.2.1.1.4.1" class="ltx_emph ltx_font_italic">No</em> to Q2 only when the rewrite actually changes which response
is better, not when it merely makes a response look more appealing.
(iii) Label every instance independently and do not discuss it with the other
annotator during annotation.</span></span></span>
</span></span></span></foreignobject></g></g></svg>