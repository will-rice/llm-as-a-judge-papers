<span id="A1.SS5.SSS1.p3.pic1.1" class="ltx_inline-block ltx_minipage ltx_align_bottom" style="width:32.57em;">
<span id="A1.SS5.SSS1.p3.pic1.1.1" class="ltx_p"><span id="A1.SS5.SSS1.p3.pic1.1.1.1" class="ltx_text ltx_font_bold" style="--ltx-fg-color:#FFFFFF;">Generator Instruction - Dynamic Policy Generation</span></span>
</span></span></span></foreignobject></g><g fill-opacity="1.0" transform="matrix(1.0 0.0 0.0 1.0 15.84 15.76)"><foreignobject style="--ltx-fo-width:37.46em;--ltx-fo-height:94.11em;--ltx-fo-depth:0.19em;font-size:10pt;" height="1304.92" overflow="visible" transform="matrix(1 0 0 -1 0 1302.23)" width="518.34"><span class="ltx_foreignobject_container"><span class="ltx_foreignobject_content">
<span id="A1.SS5.SSS1.p3.pic1.2" class="ltx_inline-block ltx_minipage ltx_align_bottom" style="width:37.46em;">
<span id="A1.SS5.SSS1.p3.pic1.2.1" class="ltx_p"><span id="A1.SS5.SSS1.p3.pic1.2.1.1" class="ltx_text" style="--ltx-fg-color:#000000;">You are a generation assistant. Your task is to generate data label descriptions to achieve the goal
outlined in Generation Objective. Carefully follow the steps below:
<br class="ltx_break" style="--ltx-break-space:4.0pt;">
1. For the data label provided in Input Label, first generate a set of scopes that clearly outline the
extent to which the label characterizes different textual contents. These textual contents are either
user inputs/queries or AI agent responses to user inputs.
<br class="ltx_break">2. Given the scopes you identified in the previous step, synthesize a description that incorporates and
reflects all or only a subset of the scopes.
<br class="ltx_break">3. A successful label description must be carefully tailored to Moderation Type.
<br class="ltx_break">4. The total number of sets of descriptions for Input Label is controlled by New Data Count, i.e. you
must repeat step 2 above New Data Count number of times.
<br class="ltx_break">5. You must generate New Data Count significantly different descriptions for Input Label.
<br class="ltx_break">6. Each description
should be a cohesive instruction or rule for a guardian agent for allowed or disallowed contents based on
the subset of the scopes you have chosen.
<br class="ltx_break" style="--ltx-break-space:8.0pt;">
You must follow the output format as outlined in the XML format below.
<br class="ltx_break" style="--ltx-break-space:4.0pt;">
– <span id="A1.SS5.SSS1.p3.pic1.2.1.1.1" class="ltx_text ltx_font_typewriter">&lt;think&gt;</span> This tag wraps the internal reasoning and includes:
<br class="ltx_break">  – <span id="A1.SS5.SSS1.p3.pic1.2.1.1.2" class="ltx_text ltx_font_typewriter">&lt;steps&gt;</span>: A concrete attempt to solve the task with logical and incremental
steps. This section applies reasoning or domain knowledge, and may include decisions, rule applications,
etc.
<br class="ltx_break">  – <span id="A1.SS5.SSS1.p3.pic1.2.1.1.3" class="ltx_text ltx_font_typewriter">&lt;scopes&gt;</span>: Enumerated list of scopes you identified based on your reasoning
steps. Scopes must be numbered starting from <span id="A1.SS5.SSS1.p3.pic1.2.1.1.4" class="ltx_text ltx_font_typewriter">1</span> to the maximum number of scopes identified.
<br class="ltx_break" style="--ltx-break-space:4.0pt;">
Repeat the following fields New Data Count number of times. Numbers must go up from 1 up to New Data
Count.
<br class="ltx_break">– <span id="A1.SS5.SSS1.p3.pic1.2.1.1.5" class="ltx_text ltx_font_typewriter">&lt;answer&gt;</span>: This is the final output, i.e. the description for Input Label given the
different subsets of scopes. This description outlines context or actions in a textual input that are or
are not allowed. The tone of the descriptions must be imperative.
<br class="ltx_break">–<span id="A1.SS5.SSS1.p3.pic1.2.1.1.6" class="ltx_text ltx_font_typewriter">&lt;scopes_used&gt;</span>: For each description generated in <span id="A1.SS5.SSS1.p3.pic1.2.1.1.7" class="ltx_text ltx_font_typewriter">&lt;answer&gt;</span>, specify comma-separated
numbers corresponding to the subset of the scopes from the enumerated list in <span id="A1.SS5.SSS1.p3.pic1.2.1.1.8" class="ltx_text ltx_font_typewriter">&lt;scopes&gt;</span> in the
think step above that you have used to generate each description.
<br class="ltx_break" style="--ltx-break-space:4.0pt;">
For example, if New Data Count is 3, the <span id="A1.SS5.SSS1.p3.pic1.2.1.1.9" class="ltx_text ltx_font_typewriter">&lt;answer&gt;</span> format should repeat three times, following
<span id="A1.SS5.SSS1.p3.pic1.2.1.1.10" class="ltx_text ltx_font_typewriter">1.</span>, <span id="A1.SS5.SSS1.p3.pic1.2.1.1.11" class="ltx_text ltx_font_typewriter">2.</span>, and <span id="A1.SS5.SSS1.p3.pic1.2.1.1.12" class="ltx_text ltx_font_typewriter">3.</span>. Then, the entire output looks like the following:</span></span>
<span id="A1.SS5.SSS1.p3.pic1.2.2" class="ltx_quote">
<span id="A1.SS5.SSS1.p3.pic1.2.2.1" class="ltx_p"><span id="A1.SS5.SSS1.p3.pic1.2.2.1.1" class="ltx_text ltx_font_typewriter" style="--ltx-fg-color:#000000;">&lt;think&gt;
<br class="ltx_break">  &lt;steps&gt;&lt;/steps&gt;
<br class="ltx_break" style="--ltx-break-space:2.0pt;">
  &lt;scopes&gt;
<br class="ltx_break">    1. Scope 1
<br class="ltx_break">    2. Scope 2
<br class="ltx_break">    3. Scope 3
<br class="ltx_break">    ...
<br class="ltx_break">  &lt;/scopes&gt;
<br class="ltx_break">&lt;/think&gt;
<br class="ltx_break" style="--ltx-break-space:4.0pt;">
1.
<br class="ltx_break">&lt;answer&gt;&lt;/answer&gt;
<br class="ltx_break">&lt;scopes_used&gt;
<br class="ltx_break">  2, 3
<br class="ltx_break">&lt;/scopes_used&gt;
<br class="ltx_break" style="--ltx-break-space:4.0pt;">
2.
<br class="ltx_break">&lt;answer&gt;&lt;/answer&gt;
<br class="ltx_break">&lt;scopes_used&gt;
<br class="ltx_break">  1, 4, 5
<br class="ltx_break">&lt;/scopes_used&gt;
</span></span>
</span>
<span id="A1.SS5.SSS1.p3.pic1.2.3" class="ltx_p"><span id="A1.SS5.SSS1.p3.pic1.2.3.1" class="ltx_text" style="--ltx-fg-color:#000000;">You must still choose a subset of scopes
identified in <span id="A1.SS5.SSS1.p3.pic1.2.3.1.1" class="ltx_text ltx_font_typewriter">&lt;think&gt;</span> section and synthesize the label description.
<br class="ltx_break" style="--ltx-break-space:4.0pt;"></span></span>
<span id="A1.SS5.SSS1.p3.pic1.2.4" class="ltx_p"><span id="A1.SS5.SSS1.p3.pic1.2.4.1" class="ltx_text ltx_font_bold" style="--ltx-fg-color:#000000;">Generation Objective:
<br class="ltx_break" style="--ltx-break-space:4.0pt;"><span id="A1.SS5.SSS1.p3.pic1.2.4.1.1" class="ltx_text ltx_font_medium">
</span>New Data Count:
<br class="ltx_break" style="--ltx-break-space:4.0pt;"><span id="A1.SS5.SSS1.p3.pic1.2.4.1.2" class="ltx_text ltx_font_medium">
</span>Moderation Type:
<br class="ltx_break" style="--ltx-break-space:4.0pt;"><span id="A1.SS5.SSS1.p3.pic1.2.4.1.3" class="ltx_text ltx_font_medium">
</span>Input Label:
<br class="ltx_break"></span></span>
