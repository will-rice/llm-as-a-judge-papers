<em id="S1.p7.pic1.1.1.1.1.1" class="ltx_emph ltx_font_italic">Let <math id="S1.p7.pic1.m1" class="ltx_Math" alttext="\theta" display="inline" intent=":literal"><semantics><mi style="--ltx-fg-color:#000000;" mathcolor="#000000">θ</mi><annotation encoding="application/x-tex">\theta</annotation></semantics></math> be the confidence estimator parameters, <math id="S1.p7.pic1.m2" class="ltx_Math" alttext="\gamma" display="inline" intent=":literal"><semantics><mi style="--ltx-fg-color:#000000;" mathcolor="#000000">γ</mi><annotation encoding="application/x-tex">\gamma</annotation></semantics></math> be the margin, and <math id="S1.p7.pic1.m3" class="ltx_Math" alttext="\beta" display="inline" intent=":literal"><semantics><mi style="--ltx-fg-color:#000000;" mathcolor="#000000">β</mi><annotation encoding="application/x-tex">\beta</annotation></semantics></math> be the hyper-parameter, the estimator is optimized via</em></span></span></span>
