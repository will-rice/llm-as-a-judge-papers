<span id="A1.F9.p2.pic1.1" class="ltx_inline-block ltx_minipage ltx_align_bottom" style="width:16.95em;">
<span id="A1.F9.p2.pic1.1.1" class="ltx_p"><span id="A1.F9.p2.pic1.1.1.1" class="ltx_text" style="font-size:70%;--ltx-fg-color:#000000;">Please undertake the evaluation of factual consistency of the summaries to the article. I will provide you with a detailed evaluation guideline and a specific format requirement. Your task is to assess whether the summary accurately reflects the information presented in the article, and then assign a numerical score based on the following criteria:</span></span>
<span id="A1.F9.p2.pic1.1.2" class="ltx_p"><span id="A1.F9.p2.pic1.1.2.1" class="ltx_text" style="font-size:70%;--ltx-fg-color:#000000;">1. Summaries must be factually consistent with the article. A summary is deemed factually consistent if all the numbers in the summary are presented the same way as in the article and if the facts presented align accurately with those in the article.
<br class="ltx_break">2. You should score the factual consistency of the summary on a scale of <span id="A1.F9.p2.pic1.1.2.1.1" class="ltx_text" style="--ltx-fg-color:#BF0000;">1 to 10</span>, where 1 indicates completely inconsistent and 10 indicates completely consistent.
<br class="ltx_break">3. The input will follow the format provided below, with the article, summary, and a placeholder for the score.
<br class="ltx_break">4. Evaluate the factual consistency strictly based on the information provided in the article. Do not incorporate any external information.</span></span>
<span id="A1.F9.p2.pic1.1.3" class="ltx_p"><span id="A1.F9.p2.pic1.1.3.1" class="ltx_text" style="font-size:70%;--ltx-fg-color:#000000;">Here is the format of the input:</span></span>
<span id="A1.F9.p2.pic1.1.4" class="ltx_p"><span id="A1.F9.p2.pic1.1.4.1" class="ltx_text" style="font-size:70%;--ltx-fg-color:#000000;">{&quot;consistency_score&quot;: score
}</span></span>
<span id="A1.F9.p2.pic1.1.5" class="ltx_p"><span id="A1.F9.p2.pic1.1.5.1" class="ltx_text" style="font-size:70%;--ltx-fg-color:#000000;">The article:
<br class="ltx_break">{article}</span></span>
<span id="A1.F9.p2.pic1.1.6" class="ltx_p"><span id="A1.F9.p2.pic1.1.6.1" class="ltx_text" style="font-size:70%;--ltx-fg-color:#000000;">The summary:
<br class="ltx_break">{summary}</span></span>
<span id="A1.F9.p2.pic1.1.7" class="ltx_p"><span id="A1.F9.p2.pic1.1.7.1" class="ltx_text" style="font-size:70%;--ltx-fg-color:#000000;">What is the factual consistency score of the summary with the article?</span></span>
</span></span></span></foreignobject></g></g></svg>