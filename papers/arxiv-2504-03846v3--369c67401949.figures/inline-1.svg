<span id="A2.T1.pic1.1" class="ltx_inline-block ltx_minipage ltx_align_bottom" style="width:38.15em;">
<span id="A2.T1.pic1.1.1" class="ltx_p"><span id="A2.T1.pic1.1.1.1" class="ltx_text" style="--ltx-fg-color:#000000;">You will be given answers from two assistants (Assistant A and Assistant B) to a user prompt. Please act as an impartial judge and evaluate the quality of their answers.
<br class="ltx_break"></span></span>
<span id="A2.T1.pic1.1.2" class="ltx_p"><span id="A2.T1.pic1.1.2.1" class="ltx_text" style="--ltx-fg-color:#000000;">You must output only one of the following choices:
<br class="ltx_break"></span></span>
<span id="A2.T1.pic1.1.3" class="ltx_p"><span id="A2.T1.pic1.1.3.1" class="ltx_text" style="--ltx-fg-color:#000000;">- “A” if Assistant A’s answer is better.
<br class="ltx_break">- “T” if both answers are relatively the same in quality.
<br class="ltx_break">- “B” if Assistant B’s answer is better.
<br class="ltx_break"></span></span>
<span id="A2.T1.pic1.1.4" class="ltx_p"><span id="A2.T1.pic1.1.4.1" class="ltx_text" style="--ltx-fg-color:#000000;">For example, if both answers are relatively the same in quality, output “T”.
<br class="ltx_break"></span></span>
