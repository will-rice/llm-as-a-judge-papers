 9.61)" width="229.46"><span class="ltx_foreignobject_container"><span class="ltx_foreignobject_content"><span id="A2.SS1.SSS2.Px2.p2.pic1.1" class="ltx_text ltx_font_bold" style="--ltx-fg-color:#FFFFFF;">Prompted Actor System Prompt</span></span></span></foreignobject></g></g></g><g fill-opacity="1.0" transform="matrix(1.0 0.0 0.0 1.0 17.36 14.25)"><foreignobject style="--ltx-fo-width:34.58em;--ltx-fo-height:18.63em;--ltx-fo-depth:0.18em;font-size:10pt;" height="260.14" overflow="visible" transform="matrix(1 0 0 -1 0 257.72)" width="478.49"><span class="ltx_foreignobject_container"><span class="ltx_foreignobject_content">
<span id="A2.SS1.SSS2.Px2.p2.pic1.2" class="ltx_inline-block ltx_minipage ltx_align_bottom" style="width:34.58em;">
<span id="A2.SS1.SSS2.Px2.p2.pic1.2.1" class="ltx_p"><span id="A2.SS1.SSS2.Px2.p2.pic1.2.1.1" class="ltx_text" style="font-size:90%;--ltx-fg-color:#000000;">You select the next action for an agent.</span></span>
<span id="A2.SS1.SSS2.Px2.p2.pic1.2.2" class="ltx_p"><span id="A2.SS1.SSS2.Px2.p2.pic1.2.2.1" class="ltx_text" style="font-size:90%;--ltx-fg-color:#000000;">Answer the question using only the supplied context and available options.</span></span>
<span id="A2.SS1.SSS2.Px2.p2.pic1.2.3" class="ltx_p"><span id="A2.SS1.SSS2.Px2.p2.pic1.2.3.1" class="ltx_text" style="font-size:90%;--ltx-fg-color:#000000;">Assign a probability to every option, expressing your estimate that it is the best next action under the supplied question. These probabilities describe the relative preference among the options, not the probability of eventual task success.</span></span>
<span id="A2.SS1.SSS2.Px2.p2.pic1.2.4" class="ltx_p"><span id="A2.SS1.SSS2.Px2.p2.pic1.2.4.1" class="ltx_text" style="font-size:90%;--ltx-fg-color:#000000;">Return a single JSON object with this structure:</span></span><pre id="A2.SS1.SSS2.Px2.p2.pic1.2.5" class="ltx_verbatim ltx_font_typewriter" style="font-size:90%;--ltx-fg-color:#000000;">
{&quot;answers&quot;: {
    &quot;&lt;question_key&gt;&quot;: {
      &quot;type&quot;: &quot;choice&quot;,
      &quot;choice&quot;: &quot;&lt;selected_option_id&gt;&quot;,
      &quot;probabilities&quot;: {&quot;&lt;option_id&gt;&quot;: 0.0},
      &quot;confidence&quot;: 0.0
    }
}}
</pre>
<span id="A2.SS1.SSS2.Px2.p2.pic1.2.6" class="ltx_p"><span id="A2.SS1.SSS2.Px2.p2.pic1.2.6.1" class="ltx_text" style="font-size:90%;--ltx-fg-color:#000000;">Use the supplied question key and option IDs exactly. Include every option ID exactly once in probabilities. Each probability must be between 0 and 1, and their sum must equal 1. Select the option with the highest probability. Break ties by choosing the option appearing first in the supplied options. Set confidence to the selected option’s probability.</span></span>
<span id="A2.SS1.SSS2.Px2.p2.pic1.2.7" class="ltx_p"><span id="A2.SS1.SSS2.Px2.p2.pic1.2.7.1" class="ltx_text" style="font-size:90%;--ltx-fg-color:#000000;">Do not include additional fields, explanations, or Markdown fences.</span></span>
</span></span></span></foreignobject></g></g></svg>