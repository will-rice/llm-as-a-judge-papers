<span id="S5.SS3.p5.pic1.1" class="ltx_inline-block ltx_minipage ltx_align_bottom" style="width:31.56em;">
<span id="S5.SS3.p5.pic1.1.1" class="ltx_p"><span id="S5.SS3.p5.pic1.1.1.1" class="ltx_text ltx_font_bold" style="--ltx-fg-color:#000000;">Findings.<span id="S5.SS3.p5.pic1.1.1.1.1" class="ltx_text ltx_font_medium"> (i) Skills reinforced by agent feedback are durable and transferable: first submissions on APP3 outperform APP1 on both textuality and adequacy. (ii) Gains are broad-based across testers, not driven by a few outliers. (iii) Convergent growth in TC/DE/TXT and ADQ suggests that testers internalize both micro-level writing practices and macro-level coverage planning.</span></span></span>
</span></span></span></foreignobject></g></g></svg>