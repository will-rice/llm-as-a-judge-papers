<span id="A3.F29.pic1.2.1" class="ltx_p"><span id="A3.F29.pic1.2.1.1" class="ltx_text" style="--ltx-fg-color:#000000;">Dear Participant,</span></span>
<span id="A3.F29.pic1.2.2" class="ltx_p"><span id="A3.F29.pic1.2.2.1" class="ltx_text" style="--ltx-fg-color:#000000;">We are conducting a study on question generation for large language model. The attached Excel file contains 20 rows, each presenting two questions generated by different strategies. Please:</span></span>
<span id="A3.I1" class="ltx_enumerate">
<span id="A3.I1.i1" class="ltx_item" style="list-style-type:none;"><span class="ltx_tag ltx_tag_item">1.</span> 
<span id="A3.I1.i1.p1" class="ltx_para">
<span id="A3.I1.i1.p1.1" class="ltx_p"><span id="A3.I1.i1.p1.1.1" class="ltx_text" style="--ltx-fg-color:#000000;">Assess the </span><span id="A3.I1.i1.p1.1.2" class="ltx_text ltx_font_bold" style="--ltx-fg-color:#000000;">quality</span><span id="A3.I1.i1.p1.1.3" class="ltx_text" style="--ltx-fg-color:#000000;"> of both questions (poor quality indicators include: oversimplification, incompleteness, or unclear phrasing).</span></span>
</span></span>
<span id="A3.I1.i2" class="ltx_item" style="list-style-type:none;"><span class="ltx_tag ltx_tag_item">2.</span> 
<span id="A3.I1.i2.p1" class="ltx_para">
<span id="A3.I1.i2.p1.1" class="ltx_p"><span id="A3.I1.i2.p1.1.1" class="ltx_text" style="--ltx-fg-color:#000000;">Evaluate whether each question appears to be </span><span id="A3.I1.i2.p1.1.2" class="ltx_text ltx_font_bold" style="--ltx-fg-color:#000000;">human-authored</span><span id="A3.I1.i2.p1.1.3" class="ltx_text" style="--ltx-fg-color:#000000;">.</span></span>
</span></span>
</span>
<span id="A3.F29.pic1.2.3" class="ltx_p"><span id="A3.F29.pic1.2.3.1" class="ltx_text" style="--ltx-fg-color:#000000;">Rating Scheme:</span></span>
<span id="A3.I2" class="ltx_itemize">
<span id="A3.I2.i1" class="ltx_item" style="list-style-type:none;"><span class="ltx_tag ltx_tag_item">•</span> 
<span id="A3.I2.i1.p1" class="ltx_para">
<span id="A3.I2.i1.p1.1" class="ltx_p"><span id="A3.I2.i1.p1.1.1" class="ltx_text" style="--ltx-fg-color:#000000;">For quality/authenticity:</span></span>
<span id="A3.I2.i1.I1" class="ltx_itemize">
<span id="A3.I2.i1.I1.i1" class="ltx_item" style="list-style-type:none;"><span class="ltx_tag ltx_tag_item"><span id="A3.I2.i1.I1.i1.1" class="ltx_text ltx_font_bold">–</span></span> 
