<span id="S2.SS1.p4.pic1.1" class="ltx_inline-block ltx_minipage ltx_align_bottom" style="width:47.62em;">
<span id="S2.SS1.p4.pic1.1.1" class="ltx_p"><span id="S2.SS1.p4.pic1.1.1.1" class="ltx_text ltx_font_bold" style="--ltx-fg-color:#000000;">Definition (<span id="S2.SS1.p4.pic1.1.1.1.1" class="ltx_text ltx_font_italic">LLM-as-a-Judge</span>).<span id="S2.SS1.p4.pic1.1.1.1.2" class="ltx_text ltx_font_medium">
In the fixed-context setting considered here, an <span id="S2.SS1.p4.pic1.1.1.1.2.1" class="ltx_text ltx_font_italic">LLM-as-a-Judge</span> maps an evaluand and a supplied evaluation context to a verdict:</span></span></span>
<span id="S2.Ex1" class="ltx_equation ltx_eqn_table">

<span><span class="ltx_equation ltx_eqn_row ltx_align_baseline">
<span class="ltx_eqn_cell ltx_eqn_center_padleft"></span>
<span class="ltx_eqn_cell ltx_align_center"><math id="S2.Ex1.m1" class="ltx_Math" alttext="\hat{y}=J_{\mathrm{LLM}}(x,\mathcal{C})," display="block" intent=":literal"><semantics><mrow><mrow><mover accent="true"><mi style="--ltx-fg-color:#000000;" mathcolor="#000000">y</mi><mo style="--ltx-fg-color:#000000;" mathcolor="#000000">^</mo></mover><mo style="--ltx-fg-color:#000000;" mathcolor="#000000">=</mo><mrow><msub><mi style="--ltx-fg-color:#000000;" mathcolor="#000000">J</mi><mi style="--ltx-fg-color:#000000;" mathcolor="#000000">LLM</mi></msub><mo lspace="0em" rspace="0em">​</mo><mrow><mo style="--ltx-fg-color:#000000;" mathcolor="#000000" stretchy="false">(</mo><mi style="--ltx-fg-color:#000000;" mathcolor="#000000">x</mi><mo style="--ltx-fg-color:#000000;" mathcolor="#000000">,</mo><mi style="--ltx-fg-color:#000000;" class="ltx_font_mathcaligraphic" mathcolor="#000000">𝒞</mi><mo style="--ltx-fg-color:#000000;" mathcolor="#000000" stretchy="false">)</mo></mrow></mrow></mrow><mo style="--ltx-fg-color:#000000;" mathcolor="#000000">,</mo></mrow><annotation encoding="application/x-tex">\hat{y}=J_{\mathrm{LLM}}(x,\mathcal{C}),</annotation></semantics></math></span>
<span class="ltx_eqn_cell ltx_eqn_center_padright"></span></span></span>
</span>
<span id="S2.SS1.p4.pic1.1.2" class="ltx_p"><span id="S2.SS1.p4.pic1.1.2.1" class="ltx_text" style="--ltx-fg-color:#000000;">where <math id="S2.SS1.p4.pic1.m1" class="ltx_Math" alttext="x" display="inline" intent=":literal"><semantics><mi style="--ltx-fg-color:#000000;" mathcolor="#000000">x</mi><annotation encoding="application/x-tex">x</annotation></semantics></math> is the evaluand, <math id="S2.SS1.p4.pic1.m2" class="ltx_Math" alttext="\mathcal{C}" display="inline" intent=":literal"><semantics><mi style="--ltx-fg-color:#000000;" class="ltx_font_mathcaligraphic" mathcolor="#000000">𝒞</mi><annotation encoding="application/x-tex">\mathcal{C}</annotation></semantics></math> is the supplied evaluation context, and <math id="S2.SS1.p4.pic1.m3" class="ltx_Math" alttext="\hat{y}" display="inline" intent=":literal"><semantics><mover accent="true"><mi style="--ltx-fg-color:#000000;" mathcolor="#000000">y</mi><mo style="--ltx-fg-color:#000000;" mathcolor="#000000">^</mo></mover><annotation encoding="application/x-tex">\hat{y}</annotation></semantics></math> is the verdict.</span></span>
</span></span></span></foreignobject></g></g></svg>