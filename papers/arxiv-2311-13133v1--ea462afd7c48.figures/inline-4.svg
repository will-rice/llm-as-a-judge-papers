<span id="A6.SS2.p5.pic1.1.1" class="ltx_p"><span id="A6.SS2.p5.pic1.1.1.1" class="ltx_text ltx_font_sansserif" style="font-size:80%;--ltx-fg-color:#000000;">Some fun scenarios for your kids to play with their Barbies include designing Barbies’ dream homes, organizing a Barbie-themed party, or staging a fashion show with their Barbies. Barbie games can also involve learning basic household skills, such as cooking or cleaning, or practicing Barbie’s favorite activities, such as shopping or dancing. Some other fun Barbie scenarios include Barbie vacation adventures or a makeover salon!</span></span>
