</span></span></span></foreignobject></g><g fill-opacity="1.0" transform="matrix(1.0 0.0 0.0 1.0 12.64 13.36)"><foreignobject style="--ltx-fo-width:47.08em;--ltx-fo-height:10.29em;--ltx-fo-depth:0.19em;font-size:10pt;" height="145.14" overflow="visible" transform="matrix(1 0 0 -1 0 142.45)" width="651.45"><span class="ltx_foreignobject_container"><span class="ltx_foreignobject_content">
<span id="A4.SS1.p3.pic1.2" class="ltx_inline-block ltx_minipage ltx_align_bottom" style="width:47.08em;">
<span id="A4.SS1.p3.pic1.2.1" class="ltx_p"><span id="A4.SS1.p3.pic1.2.1.1" class="ltx_text" style="--ltx-fg-color:#000000;">You are an expert at breaking a hard task into simpler subtasks. Given a task, output the FEW essential sub-questions/subtasks whose answers, once combined, fully solve the task.
<br class="ltx_break">Rules:
<br class="ltx_break">- Output the 3-5 most essential subtasks only — never more than 5.
<br class="ltx_break">- Each subtask must be SIMPLER than the whole task and genuinely needed.
<br class="ltx_break">- Order them so earlier subtasks are useful for later ones.
<br class="ltx_break">- Make them specific to THIS task; avoid vague meta-steps like ‘understand the problem’ or ‘write the answer’.
<br class="ltx_break">Output a numbered list of the subtasks only, nothing else.</span></span>
</span></span></span></foreignobject></g></g></svg>