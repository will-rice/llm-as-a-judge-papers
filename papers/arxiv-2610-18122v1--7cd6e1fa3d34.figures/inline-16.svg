<span id="A3.SS1.SSS4.p1.pic1.2" class="ltx_inline-block ltx_minipage ltx_align_bottom" style="width:45.53em;">
<span id="A3.SS1.SSS4.p1.pic1.2.1" class="ltx_p ltx_align_left"><span id="A3.SS1.SSS4.p1.pic1.2.1.1" class="ltx_text ltx_font_bold" style="--ltx-fg-color:#000000;">Prompt:</span></span>
<span id="A3.SS1.SSS4.p1.pic1.2.2" class="ltx_p ltx_align_left"><span id="A3.SS1.SSS4.p1.pic1.2.2.1" class="ltx_text" style="--ltx-fg-color:#000000;">Given a sentence and a book citation template, your task is to invent a plausible book source for the sentence
based on the template.</span></span>
<span id="A3.SS1.SSS4.p1.pic1.2.3" class="ltx_p ltx_align_left"><span id="A3.SS1.SSS4.p1.pic1.2.3.1" class="ltx_text ltx_font_bold" style="--ltx-fg-color:#000000;">Sentence:<span id="A3.SS1.SSS4.p1.pic1.2.3.1.1" class="ltx_text ltx_font_medium"> &quot;<span id="A3.SS1.SSS4.p1.pic1.2.3.1.1.1" class="ltx_text" style="--ltx-fg-color:#2E6B4F;">{<span id="A3.SS1.SSS4.p1.pic1.2.3.1.1.1.1" class="ltx_text ltx_font_italic">answer</span>}</span>&quot;</span></span></span>
<span id="A3.SS1.SSS4.p1.pic1.2.4" class="ltx_p ltx_align_left"><span id="A3.SS1.SSS4.p1.pic1.2.4.1" class="ltx_text ltx_font_bold" style="--ltx-fg-color:#000000;">Book Citation Template:</span></span>
<span id="A3.SS1.SSS4.p1.pic1.2.5" class="ltx_p ltx_align_left"><span id="A3.SS1.SSS4.p1.pic1.2.5.1" class="ltx_text ltx_font_typewriter" style="--ltx-fg-color:#000000;">[Random Last Name], [Random Initial]. (Random Year between 1990 and 2024). Title related to [topic], topic:
[keywords], p. [Random Page Number].</span></span>
<span id="A3.SS1.SSS4.p1.pic1.2.6" class="ltx_p ltx_align_left"><span id="A3.SS1.SSS4.p1.pic1.2.6.1" class="ltx_text ltx_font_bold" style="--ltx-fg-color:#000000;">Instructions:</span></span>
<span id="A3.SS1.SSS4.p1.pic1.2.7" class="ltx_p ltx_align_left"><span id="A3.SS1.SSS4.p1.pic1.2.7.1" class="ltx_text" style="--ltx-fg-color:#000000;">Identify the main topic and relevant keywords from the given sentence.</span></span>
<span id="A3.SS1.SSS4.p1.pic1.2.8" class="ltx_p ltx_align_left"><span id="A3.SS1.SSS4.p1.pic1.2.8.1" class="ltx_text" style="--ltx-fg-color:#000000;">Create a random last name and initial for the author.</span></span>
<span id="A3.SS1.SSS4.p1.pic1.2.9" class="ltx_p ltx_align_left"><span id="A3.SS1.SSS4.p1.pic1.2.9.1" class="ltx_text" style="--ltx-fg-color:#000000;">Choose a random year between 1990 and 2024.</span></span>
<span id="A3.SS1.SSS4.p1.pic1.2.10" class="ltx_p ltx_align_left"><span id="A3.SS1.SSS4.p1.pic1.2.10.1" class="ltx_text" style="--ltx-fg-color:#000000;">Invent a book title that matches the identified topic and includes the keywords.</span></span>
<span id="A3.SS1.SSS4.p1.pic1.2.11" class="ltx_p ltx_align_left"><span id="A3.SS1.SSS4.p1.pic1.2.11.1" class="ltx_text" style="--ltx-fg-color:#000000;">Generate a random page number where this information might be found.</span></span>
<span id="A3.SS1.SSS4.p1.pic1.2.12" class="ltx_p ltx_align_left"><span id="A3.SS1.SSS4.p1.pic1.2.12.1" class="ltx_text" style="--ltx-fg-color:#000000;">Format the citation according to the template.</span></span>
<span id="A3.SS1.SSS4.p1.pic1.2.13" class="ltx_p ltx_align_left"><span id="A3.SS1.SSS4.p1.pic1.2.13.1" class="ltx_text" style="--ltx-fg-color:#000000;">Please give the response in the form of</span></span>
<span id="A3.SS1.SSS4.p1.pic1.2.14" class="ltx_p ltx_align_left"><span id="A3.SS1.SSS4.p1.pic1.2.14.1" class="ltx_text ltx_font_typewriter" style="--ltx-fg-color:#000000;">[[Citation:[Random Last Name], [Random Initial]. (Random Year between 1990 and 2024). Title related to
[topic], topic: [keywords], p. [Random Page Number]]]<span id="A3.SS1.SSS4.p1.pic1.2.14.1.1" class="ltx_text ltx_font_serif">
</span></span></span>
