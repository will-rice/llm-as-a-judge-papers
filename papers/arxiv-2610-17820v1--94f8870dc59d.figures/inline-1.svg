<span id="S6.SS4.p6.pic1.1" class="ltx_inline-block ltx_minipage ltx_align_bottom" style="width:48.9em;">
<span id="S6.SS4.p6.pic1.1.1" class="ltx_p"><span id="S6.SS4.p6.pic1.1.1.1" class="ltx_text ltx_font_bold" style="--ltx-fg-color:#000000;">Answer to RQ1.<span id="S6.SS4.p6.pic1.1.1.1.1" class="ltx_text ltx_font_medium"> On input moderation and injection detection,
<span id="S6.SS4.p6.pic1.1.1.1.1.1" class="ltx_text ltx_font_smallcaps">Jev</span> is at least as robust as the LLM judges, and it passes far fewer
A5a messages (9% against 54–56% for the GPT judges). On phishing detection
it is not among the best, and Llama Guard 3 breaks most (62% under A2).
Which design is most robust depends on the task.</span></span></span>
