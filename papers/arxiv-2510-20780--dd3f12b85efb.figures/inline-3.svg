<span id="A3.SS4.p1.pic1.2.6" class="ltx_p"><span id="A3.SS4.p1.pic1.2.6.1" class="ltx_text" style="--ltx-fg-color:#000000;">Based on the source segment and machine translation surrounded with triple backticks, identify error types in the translation, classify them and give a score. The categories of errors are: accuracy (addition, mistranslation, omission, untranslated text), fluency (character encoding, grammar, inconsistency, punctuation, register, spelling), style (awkward), terminology (inappropriate for context, inconsistent use), non-translation, other, or no-error.
Each error is classified as one of three categories: critical, major, and minor. Critical errors inhibit comprehension of the text. Major errors disrupt the flow, but what the text is trying to say is still understandable. Minor errors are technically errors, but do not disrupt the flow or hinder comprehension.
For each error span, please deduct corresponding points based on following reference points: -25=“Cirtical”, -5=“Major”, -1=“Minor”, -0.1=“Minor/Fluency/Punctuation:0.1”, 0=“No-error”.</span></span>
