<span id="S4.SS1.p3.pic1.1" class="ltx_inline-block ltx_minipage ltx_align_bottom" style="width:31.37em;">
<span id="S4.SS1.p3.pic1.1.1" class="ltx_p"><span id="S4.SS1.p3.pic1.1.1.1" class="ltx_text ltx_font_bold" style="--ltx-fg-color:#000000;">Takeaway.<span id="S4.SS1.p3.pic1.1.1.1.1" class="ltx_text ltx_font_medium"> When selecting LLM judges for legal RAG evaluation, avoid relying on single metrics like Krippendorff’s alpha in skewed distributions. Instead, use Gwet’s AC2 for agreement assessment and rank correlation coefficients for ordering consistency—this multimetric approach reveals nuanced judge capabilities that single metrics miss.</span></span></span>
