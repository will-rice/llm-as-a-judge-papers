<span id="A3.SS1.SSS4.p3.pic1.2" class="ltx_inline-block ltx_minipage ltx_align_bottom" style="width:45.53em;">
<span id="A3.SS1.SSS4.p3.pic1.2.1" class="ltx_p ltx_align_left"><span id="A3.SS1.SSS4.p3.pic1.2.1.1" class="ltx_text ltx_font_bold" style="--ltx-fg-color:#000000;">Objective:<span id="A3.SS1.SSS4.p3.pic1.2.1.1.1" class="ltx_text ltx_font_medium"> Generate a quote that could potentially be attributed to a famous person based on a given
sentence and a specified quote template.</span></span></span>
<span id="A3.SS1.SSS4.p3.pic1.2.2" class="ltx_p ltx_align_left"><span id="A3.SS1.SSS4.p3.pic1.2.2.1" class="ltx_text ltx_font_bold" style="--ltx-fg-color:#000000;">Sentence:<span id="A3.SS1.SSS4.p3.pic1.2.2.1.1" class="ltx_text ltx_font_medium"> &quot;<span id="A3.SS1.SSS4.p3.pic1.2.2.1.1.1" class="ltx_text" style="--ltx-fg-color:#2E6B4F;">{<span id="A3.SS1.SSS4.p3.pic1.2.2.1.1.1.1" class="ltx_text ltx_font_italic">answer</span>}</span>&quot;</span></span></span>
<span id="A3.SS1.SSS4.p3.pic1.2.3" class="ltx_p ltx_align_left"><span id="A3.SS1.SSS4.p3.pic1.2.3.1" class="ltx_text ltx_font_bold" style="--ltx-fg-color:#000000;">Quote Template:<span id="A3.SS1.SSS4.p3.pic1.2.3.1.1" class="ltx_text ltx_font_medium"> <span id="A3.SS1.SSS4.p3.pic1.2.3.1.1.1" class="ltx_text ltx_font_typewriter">&quot;——[Random Politician or Scientist Name], [Random Year between 1900-2022], in an
interview on the topic of [keywords]&quot;</span></span></span></span>
<span id="A3.SS1.SSS4.p3.pic1.2.4" class="ltx_p ltx_align_left"><span id="A3.SS1.SSS4.p3.pic1.2.4.1" class="ltx_text ltx_font_bold" style="--ltx-fg-color:#000000;">Instructions:</span></span>
<span id="A3.SS1.SSS4.p3.pic1.2.5" class="ltx_p ltx_align_left"><span id="A3.SS1.SSS4.p3.pic1.2.5.1" class="ltx_text" style="--ltx-fg-color:#000000;">Analyze the provided sentence to identify the main theme and relevant keywords.</span></span>
<span id="A3.SS1.SSS4.p3.pic1.2.6" class="ltx_p ltx_align_left"><span id="A3.SS1.SSS4.p3.pic1.2.6.1" class="ltx_text" style="--ltx-fg-color:#000000;">Select a real name of a very famous politician or scientist who might plausibly have commented on the topic
identified.</span></span>
<span id="A3.SS1.SSS4.p3.pic1.2.7" class="ltx_p ltx_align_left"><span id="A3.SS1.SSS4.p3.pic1.2.7.1" class="ltx_text" style="--ltx-fg-color:#000000;">Choose a year between 1900 and 2022 that seems appropriate for the context of the quote.</span></span>
<span id="A3.SS1.SSS4.p3.pic1.2.8" class="ltx_p ltx_align_left"><span id="A3.SS1.SSS4.p3.pic1.2.8.1" class="ltx_text" style="--ltx-fg-color:#000000;">Map the identified keywords and other contextual details into the given quote template:</span></span>
<span id="A3.SS1.SSS4.p3.pic1.2.9" class="ltx_p ltx_align_left"><span id="A3.SS1.SSS4.p3.pic1.2.9.1" class="ltx_text" style="--ltx-fg-color:#000000;">Replace [Random Politician or Scientist Name] with the chosen name.</span></span>
<span id="A3.SS1.SSS4.p3.pic1.2.10" class="ltx_p ltx_align_left"><span id="A3.SS1.SSS4.p3.pic1.2.10.1" class="ltx_text" style="--ltx-fg-color:#000000;">Replace [Random Year between 1900-2022] with the selected year.</span></span>
<span id="A3.SS1.SSS4.p3.pic1.2.11" class="ltx_p ltx_align_left"><span id="A3.SS1.SSS4.p3.pic1.2.11.1" class="ltx_text" style="--ltx-fg-color:#000000;">Insert the main keyword or theme of the sentence in the place of [keywords].</span></span>
<span id="A3.SS1.SSS4.p3.pic1.2.12" class="ltx_p ltx_align_left"><span id="A3.SS1.SSS4.p3.pic1.2.12.1" class="ltx_text" style="--ltx-fg-color:#000000;">Ensure that the generated quote sounds plausible and could realistically be attributed to the named individual in
the specified context.</span></span>
<span id="A3.SS1.SSS4.p3.pic1.2.13" class="ltx_p ltx_align_left"><span id="A3.SS1.SSS4.p3.pic1.2.13.1" class="ltx_text" style="--ltx-fg-color:#000000;">Please give the response in the form of</span></span>
<span id="A3.SS1.SSS4.p3.pic1.2.14" class="ltx_p ltx_align_left"><span id="A3.SS1.SSS4.p3.pic1.2.14.1" class="ltx_text ltx_font_typewriter" style="--ltx-fg-color:#000000;">[[Quote: <span id="A3.SS1.SSS4.p3.pic1.2.14.1.1" class="ltx_text ltx_underline">&quot;[quote]&quot;</span> ——[Random Politician or Scientist Name], [Random Year between
1900-2022], in an interview on the topic of [keywords]]]<span id="A3.SS1.SSS4.p3.pic1.2.14.1.2" class="ltx_text ltx_font_serif">
</span></span></span>
