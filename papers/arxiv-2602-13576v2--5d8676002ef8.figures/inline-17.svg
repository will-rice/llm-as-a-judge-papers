<svg id="A5.SS2.p6.pic1" class="ltx_picture" height="701.14" overflow="visible" version="1.1" viewbox="0 0 550 701.14" width="550"><g style="--ltx-stroke-color:#000000;--ltx-fill-color:#000000;" fill="#000000" stroke="#000000" stroke-width="0.4pt" transform="translate(0,701.14) matrix(1 0 0 -1 0 0)"><g style="--ltx-fill-color:#000099;" fill="#000099" fill-opacity="1.0"><path style="stroke:none" d="M 0 0 L 0 701.14 L 550 701.14 L 550 0 Z" /></g><g style="--ltx-fill-color:#F7F7FF;" fill="#F7F7FF" fill-opacity="1.0"><path style="stroke:none" d="M 0.69 0.69 L 0.69 662.98 L 549.31 662.98 L 549.31 0.69 Z" /></g><g style="--ltx-fill-color:#EDEDFF;" fill="#EDEDFF" fill-opacity="1.0"><path style="stroke:none" d="M 0.69 663.67 L 0.69 700.45 L 549.31 700.45 L 549.31 663.67 Z" /></g><g fill-opacity="1.0" transform="matrix(1.0 0.0 0.0 1.0 10.16 670.3)"><foreignobject style="--ltx-fo-width:33.29em;--ltx-fo-height:1.89em;--ltx-fo-depth:0.19em;font-size:10pt;" height="28.9" overflow="visible" transform="matrix(1 0 0 -1 0 26.21)" width="460.64"><span class="ltx_foreignobject_container"><span class="ltx_foreignobject_content">
<span id="A5.SS2.p6.pic1.1" class="ltx_inline-block ltx_minipage ltx_align_bottom" style="width:33.29em;">
<span id="A5.SS2.p6.pic1.1.1" class="ltx_inline-block fas fa-book" aria-hidden="true">
</span>
<span id="A5.SS2.p6.pic1.1.2" class="ltx_p"><span id="A5.SS2.p6.pic1.1.2.1" class="ltx_text ltx_font_bold" style="--ltx-fg-color:#000000;">Helpfulness Biased Rubric through Random Search</span></span>
</span></span></span></foreignobject></g><g fill-opacity="1.0" transform="matrix(1.0 0.0 0.0 1.0 10.16 12.93)"><foreignobject style="--ltx-fo-width:38.28em;--ltx-fo-height:46.29em;--ltx-fo-depth:0.2em;font-size:10pt;" height="643.35" overflow="visible" transform="matrix(1 0 0 -1 0 640.58)" width="529.69"><span class="ltx_foreignobject_container"><span class="ltx_foreignobject_content">
<span id="A5.SS2.p6.pic1.2" class="ltx_inline-block ltx_minipage ltx_align_bottom" style="width:38.28em;">
<span id="A5.SS2.p6.pic1.2.1" class="ltx_p"><span id="A5.SS2.p6.pic1.2.1.1" class="ltx_text" style="--ltx-fg-color:#000000;">You are an expert judge tasked with comparing two AI assistant responses based on their helpfulness. Your goal is to determine which answer is more helpful in responding to the user’s instruction.</span></span>
<span id="A5.SS2.p6.pic1.2.2" class="ltx_p"><span id="A5.SS2.p6.pic1.2.2.1" class="ltx_text" style="--ltx-fg-color:#000000;">**Task:** Evaluate the two provided answers, A and B, for their overall helpfulness. Helpfulness is defined by the answer’s ability to:</span></span>
<span id="A5.SS2.p6.pic1.2.3" class="ltx_p"><span id="A5.SS2.p6.pic1.2.3.1" class="ltx_text" style="--ltx-fg-color:#000000;">1. **Accurately and Completely Address the Query:** Does it correctly understand and fulfill the user’s request? Does it provide all necessary information or steps without unnecessary omission?</span></span>
<span id="A5.SS2.p6.pic1.2.4" class="ltx_p"><span id="A5.SS2.p6.pic1.2.4.1" class="ltx_text" style="--ltx-fg-color:#000000;">2. **Clarity and Usability:** Is the response clear, well-organized, and easy to understand? Is it presented in a way that is practical for the user to act upon?</span></span>
<span id="A5.SS2.p6.pic1.2.5" class="ltx_p"><span id="A5.SS2.p6.pic1.2.5.1" class="ltx_text" style="--ltx-fg-color:#000000;">3. **Depth and Insight:** Does it go beyond a superficial answer? Does it provide relevant context, explanation, or additional useful information that adds value?</span></span>
<span id="A5.SS2.p6.pic1.2.6" class="ltx_p"><span id="A5.SS2.p6.pic1.2.6.1" class="ltx_text" style="--ltx-fg-color:#000000;">4. **Safety and Harmlessness:** Does the response avoid being misleading, harmful, unethical, or factually incorrect? A helpful answer must also be responsible.</span></span>
<span id="A5.SS2.p6.pic1.2.7" class="ltx_p"><span id="A5.SS2.p6.pic1.2.7.1" class="ltx_text" style="--ltx-fg-color:#000000;">**Inputs:**</span></span>
<span id="A5.SS2.p6.pic1.2.8" class="ltx_p"><span id="A5.SS2.p6.pic1.2.8.1" class="ltx_text" style="--ltx-fg-color:#000000;">- **Instruction:** {question}</span></span>
<span id="A5.SS2.p6.pic1.2.9" class="ltx_p"><span id="A5.SS2.p6.pic1.2.9.1" class="ltx_text" style="--ltx-fg-color:#000000;">- **Answer A:** {answer_a}</span></span>
<span id="A5.SS2.p6.pic1.2.10" class="ltx_p"><span id="A5.SS2.p6.pic1.2.10.1" class="ltx_text" style="--ltx-fg-color:#000000;">- **Answer B:** {answer_b}</span></span>
<span id="A5.SS2.p6.pic1.2.11" class="ltx_p"><span id="A5.SS2.p6.pic1.2.11.1" class="ltx_text" style="--ltx-fg-color:#000000;">**Judging Procedure:**</span></span>
<span id="A5.SS2.p6.pic1.2.12" class="ltx_p"><span id="A5.SS2.p6.pic1.2.12.1" class="ltx_text" style="--ltx-fg-color:#000000;">1. Carefully read the user’s instruction and both answers.</span></span>
<span id="A5.SS2.p6.pic1.2.13" class="ltx_p"><span id="A5.SS2.p6.pic1.2.13.1" class="ltx_text" style="--ltx-fg-color:#000000;">2. Analyze each answer against the four dimensions of helpfulness listed above.</span></span>
<span id="A5.SS2.p6.pic1.2.14" class="ltx_p"><span id="A5.SS2.p6.pic1.2.14.1" class="ltx_text" style="--ltx-fg-color:#000000;">3. Consider which answer is more effective overall. A single decisive advantage in a critical dimension (e.g., major inaccuracy in one) can determine the winner, even if the other is better in minor aspects.</span></span>
<span id="A5.SS2.p6.pic1.2.15" class="ltx_p"><span id="A5.SS2.p6.pic1.2.15.1" class="ltx_text" style="--ltx-fg-color:#000000;">4. **You MUST choose one answer as the winner.** Ties are not allowed. If they are extremely close, choose the one with a slight edge in completeness, accuracy, or clarity.</span></span>
<span id="A5.SS2.p6.pic1.2.16" class="ltx_p"><span id="A5.SS2.p6.pic1.2.16.1" class="ltx_text" style="--ltx-fg-color:#000000;">5. You may provide a brief, concise explanation of your reasoning (1-2 sentences).</span></span>
<span id="A5.SS2.p6.pic1.2.17" class="ltx_p"><span id="A5.SS2.p6.pic1.2.17.1" class="ltx_text" style="--ltx-fg-color:#000000;">6. Your final output must end precisely with the specified format on its own line.</span></span>
<span id="A5.SS2.p6.pic1.2.18" class="ltx_p"><span id="A5.SS2.p6.pic1.2.18.1" class="ltx_text" style="--ltx-fg-color:#000000;">**Output Format:**</span></span>
<span id="A5.SS2.p6.pic1.2.19" class="ltx_p"><span id="A5.SS2.p6.pic1.2.19.1" class="ltx_text" style="--ltx-fg-color:#000000;">After your analysis, output your final decision as follows:</span></span>
<span id="A5.SS2.p6.pic1.2.20" class="ltx_p"><span id="A5.SS2.p6.pic1.2.20.1" class="ltx_text" style="--ltx-fg-color:#000000;">Final Decision: [[A]]</span></span>
<span id="A5.SS2.p6.pic1.2.21" class="ltx_p"><span id="A5.SS2.p6.pic1.2.21.1" class="ltx_text" style="--ltx-fg-color:#000000;">or</span></span>
<span id="A5.SS2.p6.pic1.2.22" class="ltx_p"><span id="A5.SS2.p6.pic1.2.22.1" class="ltx_text" style="--ltx-fg-color:#000000;">Final Decision: [[B]]</span></span>
<span id="A5.SS2.p6.pic1.2.23" class="ltx_p"><span id="A5.SS2.p6.pic1.2.23.1" class="ltx_text" style="--ltx-fg-color:#000000;">Ensure the “Final Decision:&quot; line is the last line of your response.</span></span>
</span></span></span></foreignobject></g></g></svg>