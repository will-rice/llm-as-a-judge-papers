</span></span></span></foreignobject></g><g fill-opacity="1.0" transform="matrix(1.0 0.0 0.0 1.0 15.84 14.22)"><foreignobject style="--ltx-fo-width:42.56em;--ltx-fo-height:24.61em;--ltx-fo-depth:0.08em;font-size:10pt;" height="341.7" overflow="visible" transform="matrix(1 0 0 -1 0 340.55)" width="588.91"><span class="ltx_foreignobject_container"><span class="ltx_foreignobject_content">
<span id="A6.SSx12.SSS0.Px1.p4.pic1.2" class="ltx_inline-block ltx_minipage ltx_align_bottom" style="width:42.56em;">
<span id="A6.SSx12.SSS0.Px1.p4.pic1.2.1" class="ltx_p ltx_align_left"><span id="A6.SSx12.SSS0.Px1.p4.pic1.2.1.1" class="ltx_text ltx_font_typewriter" style="--ltx-fg-color:#000000;">You will be given one summary written for a source document.</span></span>
<span id="A6.SSx12.SSS0.Px1.p4.pic1.2.2" class="ltx_p ltx_align_left"><span id="A6.SSx12.SSS0.Px1.p4.pic1.2.2.1" class="ltx_text ltx_font_typewriter" style="--ltx-fg-color:#000000;">Your task is to rate the summary on one metric: Coherence.</span></span>
<span id="A6.SSx12.SSS0.Px1.p4.pic1.2.3" class="ltx_p ltx_align_left"><span id="A6.SSx12.SSS0.Px1.p4.pic1.2.3.1" class="ltx_text ltx_font_typewriter" style="--ltx-fg-color:#000000;">Please make sure you read and understand these instructions carefully. Please keep</span></span>
<span id="A6.SSx12.SSS0.Px1.p4.pic1.2.4" class="ltx_p ltx_align_left"><span id="A6.SSx12.SSS0.Px1.p4.pic1.2.4.1" class="ltx_text ltx_font_typewriter" style="--ltx-fg-color:#000000;">this document open while reviewing, and refer to it as needed.</span></span>
<span id="A6.SSx12.SSS0.Px1.p4.pic1.2.5" class="ltx_p ltx_align_left"><span id="A6.SSx12.SSS0.Px1.p4.pic1.2.5.1" class="ltx_text ltx_font_typewriter" style="--ltx-fg-color:#000000;">Evaluation Criteria:</span></span>
<span id="A6.SSx12.SSS0.Px1.p4.pic1.2.6" class="ltx_p ltx_align_left"><span id="A6.SSx12.SSS0.Px1.p4.pic1.2.6.1" class="ltx_text ltx_font_typewriter" style="--ltx-fg-color:#000000;">Coherence (1-5) - the collective quality of all sentences. We align this dimension</span></span>
<span id="A6.SSx12.SSS0.Px1.p4.pic1.2.7" class="ltx_p ltx_align_left"><span id="A6.SSx12.SSS0.Px1.p4.pic1.2.7.1" class="ltx_text ltx_font_typewriter" style="--ltx-fg-color:#000000;">with the DUC quality question of structure and coherence whereby &quot;the summary should</span></span>
<span id="A6.SSx12.SSS0.Px1.p4.pic1.2.8" class="ltx_p ltx_align_left"><span id="A6.SSx12.SSS0.Px1.p4.pic1.2.8.1" class="ltx_text ltx_font_typewriter" style="--ltx-fg-color:#000000;">be well-structured and well-organized. The summary should not just be a heap of</span></span>
<span id="A6.SSx12.SSS0.Px1.p4.pic1.2.9" class="ltx_p ltx_align_left"><span id="A6.SSx12.SSS0.Px1.p4.pic1.2.9.1" class="ltx_text ltx_font_typewriter" style="--ltx-fg-color:#000000;">related information, but should build from sentence to sentence to a coherent body</span></span>
<span id="A6.SSx12.SSS0.Px1.p4.pic1.2.10" class="ltx_p ltx_align_left"><span id="A6.SSx12.SSS0.Px1.p4.pic1.2.10.1" class="ltx_text ltx_font_typewriter" style="--ltx-fg-color:#000000;">of information about a topic.&quot;</span></span>
<span id="A6.SSx12.SSS0.Px1.p4.pic1.2.11" class="ltx_p ltx_align_left"><span id="A6.SSx12.SSS0.Px1.p4.pic1.2.11.1" class="ltx_text ltx_font_typewriter" style="--ltx-fg-color:#000000;">Evaluation Steps:</span></span>
<span id="A6.SSx12.SSS0.Px1.p4.pic1.2.12" class="ltx_p ltx_align_left"><span id="A6.SSx12.SSS0.Px1.p4.pic1.2.12.1" class="ltx_text ltx_font_typewriter" style="--ltx-fg-color:#000000;">1. Read the source document carefully.</span></span>
<span id="A6.SSx12.SSS0.Px1.p4.pic1.2.13" class="ltx_p ltx_align_left"><span id="A6.SSx12.SSS0.Px1.p4.pic1.2.13.1" class="ltx_text ltx_font_typewriter" style="--ltx-fg-color:#000000;">2. Read the summary and compare it to the source document.</span></span>
<span id="A6.SSx12.SSS0.Px1.p4.pic1.2.14" class="ltx_p ltx_align_left"><span id="A6.SSx12.SSS0.Px1.p4.pic1.2.14.1" class="ltx_text ltx_font_typewriter" style="--ltx-fg-color:#000000;">3. Assign a score for coherence on a scale of 1-5, where 1 is the lowest and 5 is</span></span>
<span id="A6.SSx12.SSS0.Px1.p4.pic1.2.15" class="ltx_p ltx_align_left"><span id="A6.SSx12.SSS0.Px1.p4.pic1.2.15.1" class="ltx_text ltx_font_typewriter" style="--ltx-fg-color:#000000;">the highest.</span></span>
<span id="A6.SSx12.SSS0.Px1.p4.pic1.2.16" class="ltx_p ltx_align_left"><span id="A6.SSx12.SSS0.Px1.p4.pic1.2.16.1" class="ltx_text ltx_font_typewriter" style="--ltx-fg-color:#000000;">Source Document:</span></span>
<span id="A6.SSx12.SSS0.Px1.p4.pic1.2.17" class="ltx_p ltx_align_left"><span id="A6.SSx12.SSS0.Px1.p4.pic1.2.17.1" class="ltx_text ltx_font_typewriter" style="--ltx-fg-color:#000000;">conversation</span></span>
<span id="A6.SSx12.SSS0.Px1.p4.pic1.2.18" class="ltx_p ltx_align_left"><span id="A6.SSx12.SSS0.Px1.p4.pic1.2.18.1" class="ltx_text ltx_font_typewriter" style="--ltx-fg-color:#000000;">Summary:</span></span>
<span id="A6.SSx12.SSS0.Px1.p4.pic1.2.19" class="ltx_p ltx_align_left"><span id="A6.SSx12.SSS0.Px1.p4.pic1.2.19.1" class="ltx_text ltx_font_typewriter" style="--ltx-fg-color:#000000;">prediction</span></span>
<span id="A6.SSx12.SSS0.Px1.p4.pic1.2.20" class="ltx_p ltx_align_left"><span id="A6.SSx12.SSS0.Px1.p4.pic1.2.20.1" class="ltx_text ltx_font_typewriter" style="--ltx-fg-color:#000000;">Evaluation Form (scores ONLY):</span></span>
<span id="A6.SSx12.SSS0.Px1.p4.pic1.2.21" class="ltx_p ltx_align_left"><span id="A6.SSx12.SSS0.Px1.p4.pic1.2.21.1" class="ltx_text ltx_font_typewriter" style="--ltx-fg-color:#000000;">- Coherence (1-5):</span></span>
</span></span></span></foreignobject></g></g></svg>