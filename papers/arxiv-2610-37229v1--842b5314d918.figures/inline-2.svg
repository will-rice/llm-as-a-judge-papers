</span></span></span></foreignobject></g><g fill-opacity="1.0" transform="matrix(1.0 0.0 0.0 1.0 10.3 61.81)"><foreignobject style="--ltx-fo-width:43.53em;--ltx-fo-height:16.28em;--ltx-fo-depth:3.82em;font-size:10pt;" height="278.2" overflow="visible" transform="matrix(1 0 0 -1 0 225.32)" width="602.33"><span class="ltx_foreignobject_container"><span class="ltx_foreignobject_content"><span id="A1.SS4.p3.pic1.2" class="ltx_inline-logical-block ltx_minipage ltx_align_bottom" style="width:43.53em;">
<span id="A1.SS4.p3.pic1.p1" class="ltx_para ltx_align_left ltx_noindent">
<span id="A1.SS4.p3.pic1.p1.1" class="ltx_p"><span id="A1.SS4.p3.pic1.p1.1.1" class="ltx_text ltx_font_typewriter ltx_font_bold" style="--ltx-fg-color:#000000;">Instructions:</span><span id="A1.SS4.p3.pic1.p1.1.2" class="ltx_text ltx_font_typewriter" style="--ltx-fg-color:#000000;"> Review the entire candidate response. Determine whether it contains factual contradiction. Choose H if at least one factual claim satisfies the H criterion. Otherwise choose N. Evaluate only factual contradiction.</span></span>
</span>
<span id="A1.SS4.p3.pic1.p2" class="ltx_para ltx_align_left ltx_noindent">
<span id="A1.SS4.p3.pic1.p2.1" class="ltx_p"><span id="A1.SS4.p3.pic1.p2.1.1" class="ltx_text ltx_font_typewriter ltx_font_bold" style="--ltx-fg-color:#000000;">Criterion H:</span><span id="A1.SS4.p3.pic1.p2.1.2" class="ltx_text ltx_font_typewriter" style="--ltx-fg-color:#000000;"> At least one factual claim conflicts with reliable, verifiable real-world information. This includes an incorrect entity, relation, date, number, location, attribute, event, or other factual statement. Reliable evidence must establish that the claim is false.</span></span>
</span>
<span id="A1.SS4.p3.pic1.p3" class="ltx_para ltx_align_left ltx_noindent">
<span id="A1.SS4.p3.pic1.p3.1" class="ltx_p"><span id="A1.SS4.p3.pic1.p3.1.1" class="ltx_text ltx_font_typewriter ltx_font_bold" style="--ltx-fg-color:#000000;">Criterion N:</span><span id="A1.SS4.p3.pic1.p3.1.2" class="ltx_text ltx_font_typewriter" style="--ltx-fg-color:#000000;"> No factual claim conflicts with reliable, verifiable real-world information. A claim that is merely unsupported, uncertain, subjective, or difficult to verify does not count as factual contradiction.</span></span>
</span>
<span id="A1.SS4.p3.pic1.p4" class="ltx_para ltx_align_left ltx_noindent">
<span id="A1.SS4.p3.pic1.p4.1" class="ltx_p"><span id="A1.SS4.p3.pic1.p4.1.1" class="ltx_text ltx_font_typewriter ltx_font_bold" style="--ltx-fg-color:#000000;">State:</span></span>
</span>
<span id="A1.SS4.p3.pic1.p5" class="ltx_para ltx_align_left ltx_noindent">
<span id="A1.SS4.p3.pic1.p5.1" class="ltx_p"><span id="A1.SS4.p3.pic1.p5.1.1" class="ltx_text ltx_font_typewriter" style="--ltx-fg-color:#000000;">candidate_response: &quot;[the model-generated answer being judged]&quot;;</span></span>
</span>
<span id="A1.SS4.p3.pic1.p6" class="ltx_para ltx_align_left ltx_noindent">
