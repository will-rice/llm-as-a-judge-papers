<span id="A4.SS2.SSS1.p4.pic1.1.1" class="ltx_p"><span id="A4.SS2.SSS1.p4.pic1.1.1.1" class="ltx_text ltx_font_bold" style="font-size:90%;--ltx-fg-color:#FFFFFF;">Rollout Process [Excerpt]</span></span>
</span></span></span></foreignobject></g><g fill-opacity="1.0" transform="matrix(1.0 0.0 0.0 1.0 10.16 11.2)"><foreignobject style="--ltx-fo-width:35.71em;--ltx-fo-height:12.08em;--ltx-fo-depth:0.18em;font-size:10pt;" height="169.51" overflow="visible" transform="matrix(1 0 0 -1 0 167.08)" width="494.13"><span class="ltx_foreignobject_container"><span class="ltx_foreignobject_content">
<span id="A4.SS2.SSS1.p4.pic1.2" class="ltx_inline-block ltx_minipage ltx_align_bottom" style="width:35.71em;">
<span id="A4.SS2.SSS1.p4.pic1.2.1" class="ltx_p"><span id="A4.SS2.SSS1.p4.pic1.2.1.1" class="ltx_text ltx_font_italic" style="font-size:90%;--ltx-fg-color:#000000;">[Excerpt — Repeated retrieval attempts around the same source]<span id="A4.SS2.SSS1.p4.pic1.2.1.1.1" class="ltx_text"></span></span></span>
<span id="A4.SS2.SSS1.p4.pic1.2.2" class="ltx_p"><span id="A4.SS2.SSS1.p4.pic1.2.2.1" class="ltx_text" style="font-size:90%;--ltx-fg-color:#000000;">The rollout repeatedly searches for and attempts to access the same paper and
closely related variants of the same evidence target, including queries such as
“Supercompetitor status of Drosophila Myc cells requires p53 abstract,”
followed by repeated visits to PubMed, PMC, Cell, ScienceDirect, Jina proxy, and
NCBI Eutils pages for the same or near-identical article.</span></span>
<span id="A4.SS2.SSS1.p4.pic1.2.3" class="ltx_p"><span id="A4.SS2.SSS1.p4.pic1.2.3.1" class="ltx_text" style="font-size:90%;--ltx-fg-color:#000000;">Many of these visits return inaccessible-page failures such as
“webpage content could not be accessed.” Despite these failures, the rollout
continues to issue similar search and visit calls around the same article rather
than substantially changing the search strategy or broadening the evidence base.</span></span>
</span></span></span></foreignobject></g></g></svg>