</span></span></span></foreignobject></g><g fill-opacity="1.0" transform="matrix(1.0 0.0 0.0 1.0 21.65 17.24)"><foreignobject style="--ltx-fo-width:44.07em;--ltx-fo-height:43.89em;--ltx-fo-depth:0.25em;font-size:10pt;" height="610.83" overflow="visible" transform="matrix(1 0 0 -1 0 607.37)" width="609.8"><span class="ltx_foreignobject_container"><span class="ltx_foreignobject_content">
<span id="A6.p1.pic1.3" class="ltx_inline-block ltx_minipage ltx_align_bottom" style="width:44.07em;">
<span id="A6.p1.pic1.3.1" class="ltx_p"><span id="A6.p1.pic1.3.1.1" class="ltx_text" style="--ltx-fg-color:#000000;">Assume that you are to provide instructions to a large language model, asking it to generate the following fiction. Provide detailed instructions with the following structure: 
<br class="ltx_break"></span></span>
<span id="A6.p1.pic1.3.2" class="ltx_p"><span id="A6.p1.pic1.3.2.1" class="ltx_text" style="--ltx-fg-color:#000000;">1. Plot and Structure: Summarize the main content of the fiction in one sentence of no more than 100 words. 
<br class="ltx_break">2. Character Development: Describe the personalities, experiences, and relationships of the main characters in no more than 100 words per character, with a maximum of 5 characters in total. 
<br class="ltx_break">3. Theme and Message: Summarize the theme and message the fiction aims to convey in no more than 100 words. 
<br class="ltx_break">4. Language and Style: Describe the overall linguistic style of the fiction and the level of detail in its descriptions, in no more than 100 words. 
<br class="ltx_break">5. Emotional Resonance: Specify the type of emotional resonance the fiction aims to evoke in readers in no more than 100 words. 
<br class="ltx_break">6. Innovation and Originality: Describe how the fiction should demonstrate uniqueness or originality in no more than 100 words. 
<br class="ltx_break"></span></span>
<span id="A6.p1.pic1.3.3" class="ltx_p"><span id="A6.p1.pic1.3.3.1" class="ltx_text" style="--ltx-fg-color:#000000;">Output the instructions using the following format: 
<br class="ltx_break"></span></span>
<span id="A6.p1.pic1.3.4" class="ltx_p"><span id="A6.p1.pic1.3.4.1" class="ltx_text" style="--ltx-fg-color:#000000;">&lt;Plot and Structure Start&gt; 
<br class="ltx_break">xxxx 
<br class="ltx_break">&lt;Plot and Structure End&gt; 
<br class="ltx_break"></span></span>
<span id="A6.p1.pic1.3.5" class="ltx_p"><span id="A6.p1.pic1.3.5.1" class="ltx_text" style="--ltx-fg-color:#000000;">&lt;Character Development Start&gt; 
<br class="ltx_break">xxxx 
<br class="ltx_break">&lt;Character Development End&gt; 
<br class="ltx_break"></span></span>
<span id="A6.p1.pic1.3.6" class="ltx_p"><span id="A6.p1.pic1.3.6.1" class="ltx_text" style="--ltx-fg-color:#000000;">&lt;Theme and Message Start&gt; 
<br class="ltx_break">xxxx 
<br class="ltx_break">&lt;Theme and Message End&gt; 
<br class="ltx_break"></span></span>
<span id="A6.p1.pic1.3.7" class="ltx_p"><span id="A6.p1.pic1.3.7.1" class="ltx_text" style="--ltx-fg-color:#000000;">&lt;Language and Style Start&gt; 
<br class="ltx_break">xxxx 
<br class="ltx_break">&lt;Language and Style End&gt; 
<br class="ltx_break"></span></span>
<span id="A6.p1.pic1.3.8" class="ltx_p"><span id="A6.p1.pic1.3.8.1" class="ltx_text" style="--ltx-fg-color:#000000;">&lt;Emotional Resonance Start&gt; 
<br class="ltx_break">xxxx 
<br class="ltx_break">&lt;Emotional Resonance End&gt; 
<br class="ltx_break"></span></span>
<span id="A6.p1.pic1.3.9" class="ltx_p"><span id="A6.p1.pic1.3.9.1" class="ltx_text" style="--ltx-fg-color:#000000;">&lt;Innovation and Originality Start&gt; 
<br class="ltx_break">xxxx 
<br class="ltx_break">&lt;Innovation and Originality End&gt; 
<br class="ltx_break"></span></span>
<span id="A6.p1.pic1.3.10" class="ltx_p"><span id="A6.p1.pic1.3.10.1" class="ltx_text" style="--ltx-fg-color:#000000;">Please base your response on the following target fiction. 
<br class="ltx_break"></span></span>
<span id="A6.p1.pic1.3.11" class="ltx_p"><span id="A6.p1.pic1.3.11.1" class="ltx_text" style="--ltx-fg-color:#000000;">[Target Fiction Start] 
<br class="ltx_break"></span></span>
<span id="A6.p1.pic1.3.12" class="ltx_p"><span id="A6.p1.pic1.3.12.1" class="ltx_text" style="--ltx-fg-color:#000000;">{content} 
<br class="ltx_break"></span></span>
<span id="A6.p1.pic1.3.13" class="ltx_p"><span id="A6.p1.pic1.3.13.1" class="ltx_text" style="--ltx-fg-color:#000000;">[Target Fiction End] 
<br class="ltx_break"></span></span>
</span></span></span></foreignobject></g></g></svg>