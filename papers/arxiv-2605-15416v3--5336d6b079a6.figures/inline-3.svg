<svg id="S3.SS2.p9.pic1" class="ltx_picture" height="140.34" overflow="visible" version="1.1" viewbox="0 0 477.38 140.34" width="477.38"><g style="--ltx-stroke-color:#000000;--ltx-fill-color:#000000;" fill="#000000" stroke="#000000" stroke-width="0.4pt" transform="translate(0,140.34) matrix(1 0 0 -1 0 0)"><g style="--ltx-fill-color:#ECECEC;" fill="#ECECEC" fill-opacity="1.0"><path style="stroke:none" d="M 0 0 L 0 140.34 L 477.38 140.34 L 477.38 0 Z" /></g><g style="--ltx-fill-color:#ECECEC;" fill="#ECECEC" fill-opacity="1.0"><path style="stroke:none" d="M 1.97 1.97 L 1.97 138.37 L 475.41 138.37 L 475.41 1.97 Z" /></g><g fill-opacity="1.0" transform="matrix(1.0 0.0 0.0 1.0 5.91 124.83)"><foreignobject style="--ltx-fo-width:33.65em;--ltx-fo-height:0.69em;--ltx-fo-depth:8.59em;font-size:10pt;" height="128.53" overflow="visible" transform="matrix(1 0 0 -1 0 9.61)" width="465.62"><span class="ltx_foreignobject_container"><span class="ltx_foreignobject_content"><span id="S3.SS2.p9.pic1.1" class="ltx_inline-logical-block ltx_minipage ltx_align_bottom" style="width:33.65em;">
<span id="S3.Thmtheorem5" class="ltx_theorem ltx_theorem_remark">
<h6 class="ltx_title ltx_runin ltx_title_theorem" style="--ltx-fg-color:#000000;"><span class="ltx_tag ltx_tag_theorem"><span id="S3.Thmtheorem5.2" class="ltx_text ltx_font_italic">Remark 3.5</span></span><span id="S3.Thmtheorem5.3" class="ltx_text ltx_font_italic"> </span>(Interpretation)<span id="S3.Thmtheorem5.4" class="ltx_text ltx_font_italic">.</span></h6>
<span id="S3.Thmtheorem5.p1" class="ltx_para">
<span id="S3.Thmtheorem5.p1.1" class="ltx_p"><span id="S3.Thmtheorem5.p1.1.1" class="ltx_text" style="--ltx-fg-color:#000000;">Corollary </span><a href="#S3.Thmtheorem4" title="Corollary 3.4. ‣ 3.2 Theoretical Analyses ‣ 3 Theoretical Analyses for Confidence Ranking ‣ Margin-Adaptive Confidence Ranking for Reliable LLM Judgement" class="ltx_ref" style="--ltx-fg-color:#000000;"><span class="ltx_text ltx_ref_tag">3.4</span></a><span id="S3.Thmtheorem5.p1.1.2" class="ltx_text" style="--ltx-fg-color:#000000;"> shows that the expected misranking probability is controlled by a margin-based empirical ranking loss and a margin-dependent complexity term.
A larger margin </span><math id="S3.Thmtheorem5.p1.m1" class="ltx_Math" alttext="\gamma" display="inline" intent=":literal"><semantics><mi style="--ltx-fg-color:#000000;" mathcolor="#000000">γ</mi><annotation encoding="application/x-tex">\gamma</annotation></semantics></math><span id="S3.Thmtheorem5.p1.1.3" class="ltx_text" style="--ltx-fg-color:#000000;"> reduces the complexity penalty, but simultaneously amplifies the empirical loss and makes it harder to optimize, while a smaller </span><math id="S3.Thmtheorem5.p1.m2" class="ltx_Math" alttext="\gamma" display="inline" intent=":literal"><semantics><mi style="--ltx-fg-color:#000000;" mathcolor="#000000">γ</mi><annotation encoding="application/x-tex">\gamma</annotation></semantics></math><span id="S3.Thmtheorem5.p1.1.4" class="ltx_text" style="--ltx-fg-color:#000000;"> eases optimization at the cost of weaker guarantees.
Thus, the bound formalizes a margin-based trade-off between ranking separability and model complexity, motivating the adaptive optimizer in the following.</span></span>
</span>
</span></span></span></span></foreignobject></g></g></svg>