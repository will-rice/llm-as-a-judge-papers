<span id="A4.pic9.1" class="ltx_inline-block ltx_minipage ltx_align_bottom" style="width:46.2em;">
<span id="A4.pic9.1.1" class="ltx_p"><span id="A4.pic9.1.1.1" class="ltx_text" style="--ltx-fg-color:#FFFFFF;">Prompt D.9: Profile Inference Specificity (<a href="#S2.SS1" title="2.1 Inferring Researcher Profiles ‣ 2 MySQA: Personalized Deep Research ‣ Language Models Don’t Know What You Want:Evaluating Personalization in Deep Research Needs Real Users" class="ltx_ref"><span class="ltx_text ltx_ref_tag">section</span> <span class="ltx_text ltx_ref_tag">2.1</span></a>)</span></span>
</span></span></span></foreignobject></g><g fill-opacity="1.0" transform="matrix(1.0 0.0 0.0 1.0 6.92 10.38)"><foreignobject style="--ltx-fo-width:46.2em;--ltx-fo-height:23.49em;--ltx-fo-depth:0.25em;font-size:10pt;" height="328.56" overflow="visible" transform="matrix(1 0 0 -1 0 325.1)" width="639.28"><span class="ltx_foreignobject_container"><span class="ltx_foreignobject_content">
<span id="A4.pic9.2" class="ltx_inline-block ltx_minipage ltx_align_bottom" style="width:46.2em;">
<span id="A4.pic9.2.1" class="ltx_p"><span id="A4.pic9.2.1.1" class="ltx_text" style="--ltx-fg-color:#000000;">&lt;task&gt;
As a Specificity Validator, your task is to rate the specificity of a given inference about a computer science researcher from one to five.
&lt;/task&gt;
<br class="ltx_break"></span></span>
<span id="A4.pic9.2.2" class="ltx_p"><span id="A4.pic9.2.2.1" class="ltx_text" style="--ltx-fg-color:#000000;">Use the following criteria:
<br class="ltx_break">&lt;criteria&gt;
<br class="ltx_break">Criteria: Personalization: How specifically tailored and insightful is the inference about the computer science researcher?
<br class="ltx_break">Score 1: Extremely vague or generic; the inference could apply to almost any researcher in computer science.
<br class="ltx_break">Score 2: Broad and minimally tailored; captures a common area or trait that applies to many researchers in computer science.
<br class="ltx_break">Score 3: Moderately specific; identifies a more refined topic or pattern but still describes a large population of computer science researchers.
<br class="ltx_break">Score 4: Specific and reasonably personalized; reflects a more distinctive sub-area, approach, or motivation of the researcher.
<br class="ltx_break">Score 5: Highly specific and personalized; demonstrates a deep, nuanced inference that could plausibly distinguish this researcher from almost every other researcher in their field.
<br class="ltx_break">&lt;/criteria&gt;
<br class="ltx_break"></span></span>
<span id="A4.pic9.2.3" class="ltx_p"><span id="A4.pic9.2.3.1" class="ltx_text" style="--ltx-fg-color:#000000;">Here is the inference you must rate:
&lt;inference&gt;
<math id="A4.pic9.m1" class="ltx_Math" alttext="\mathcal{I}" display="inline" intent=":literal"><semantics><mi style="--ltx-fg-color:#000000;" class="ltx_font_mathcaligraphic" mathcolor="#000000">ℐ</mi><annotation encoding="application/x-tex">\mathcal{I}</annotation></semantics></math>
&lt;/inference&gt;
<br class="ltx_break"></span></span>
<span id="A4.pic9.2.4" class="ltx_p"><span id="A4.pic9.2.4.1" class="ltx_text" style="--ltx-fg-color:#000000;">&lt;format&gt;
Output your response as a json with only a single key &quot;output&quot; and an integer rating for Specificity from one to five.
&lt;/format&gt;</span></span>
</span></span></span></foreignobject></g></g></svg>