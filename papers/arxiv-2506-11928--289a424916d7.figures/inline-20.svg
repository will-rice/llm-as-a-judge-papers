<svg id="S15.SS0.SSS0.Px7.p3.pic1" class="ltx_picture" height="422.62" overflow="visible" version="1.1" viewbox="0 0 477.38 422.62" width="477.38"><g style="--ltx-stroke-color:#000000;--ltx-fill-color:#000000;" fill="#000000" stroke="#000000" stroke-width="0.4pt" transform="translate(0,422.62) matrix(1 0 0 -1 0 0)"><g style="--ltx-fill-color:#4285F4;" fill="#4285F4" fill-opacity="1.0"><path style="stroke:none" d="M 0 7.5 L 0 415.12 C 0 419.26 3.36 422.62 7.5 422.62 L 469.87 422.62 C 474.02 422.62 477.38 419.26 477.38 415.12 L 477.38 7.5 C 477.38 3.36 474.02 0 469.87 0 L 7.5 0 C 3.36 0 0 3.36 0 7.5 Z" /></g><g style="--ltx-fill-color:#F5F5F5;" fill="#F5F5F5" fill-opacity="1.0"><path style="stroke:none" d="M 1.97 7.5 L 1.97 384.24 L 475.41 384.24 L 475.41 7.5 C 475.41 4.45 472.93 1.97 469.87 1.97 L 7.5 1.97 C 4.45 1.97 1.97 4.45 1.97 7.5 Z" /></g><g fill-opacity="1.0" transform="matrix(1.0 0.0 0.0 1.0 20.48 391.67)"><foreignobject style="--ltx-fo-width:27.43em;--ltx-fo-height:1.89em;--ltx-fo-depth:0.19em;font-size:10pt;" height="28.9" overflow="visible" transform="matrix(1 0 0 -1 0 26.21)" width="379.55"><span class="ltx_foreignobject_container"><span class="ltx_foreignobject_content">
<span id="S15.SS0.SSS0.Px7.p3.pic1.1" class="ltx_inline-block ltx_minipage ltx_align_bottom" style="width:27.43em;">
<span id="S15.SS0.SSS0.Px7.p3.pic1.1.1" class="ltx_p"><span id="S15.SS0.SSS0.Px7.p3.pic1.1.1.1" class="ltx_text" style="position:relative; bottom:0.9pt;"></span><a href="https://codeforces.com/blog/entry/136886" title class="ltx_ref ltx_href ltx_font_bold" style="--ltx-fg-color:#FFFFFF;">Tutorial</a><span id="S15.SS0.SSS0.Px7.p3.pic1.1.1.2" class="ltx_text ltx_font_bold" style="--ltx-fg-color:#FFFFFF;"> — <a href="https://codeforces.com/problemset/submission/2042/313304461" title class="ltx_ref ltx_href">Human’s accepted submission</a> — <a href="https://gist.github.com/anonymous-llm-code/29379b0a31a6a01eef51da03c2942863" title class="ltx_ref ltx_href"><span class="ltx_text ltx_font_typewriter">o3-mini</span>’s rejected submission</a></span></span>
</span></span></span></foreignobject></g><g fill-opacity="1.0" transform="matrix(1.0 0.0 0.0 1.0 20.48 15.3)"><foreignobject style="--ltx-fo-width:31.54em;--ltx-fo-height:25.89em;--ltx-fo-depth:0.19em;font-size:10pt;" height="361" overflow="visible" transform="matrix(1 0 0 -1 0 358.31)" width="436.42"><span class="ltx_foreignobject_container"><span class="ltx_foreignobject_content">
<span id="S15.SS0.SSS0.Px7.p3.pic1.2" class="ltx_inline-block ltx_minipage ltx_align_bottom" style="width:31.54em;">
<span id="S15.SS0.SSS0.Px7.p3.pic1.2.1" class="ltx_p"><span id="S15.SS0.SSS0.Px7.p3.pic1.2.1.1" class="ltx_text" style="--ltx-fg-color:#000000;">Firstly, if several segments are equal, then the answer for all of them is zero. Now let’s move to the problem where all segments are distinct. User <math id="S15.SS0.SSS0.Px7.p3.pic1.m1" class="ltx_Math" alttext="j" display="inline" intent=":literal"><semantics><mi style="--ltx-fg-color:#000000;" mathcolor="#000000">j</mi><annotation encoding="application/x-tex">j</annotation></semantics></math> is a predictor for user <math id="S15.SS0.SSS0.Px7.p3.pic1.m2" class="ltx_Math" alttext="i" display="inline" intent=":literal"><semantics><mi style="--ltx-fg-color:#000000;" mathcolor="#000000">i</mi><annotation encoding="application/x-tex">i</annotation></semantics></math> iff <math id="S15.SS0.SSS0.Px7.p3.pic1.m3" class="ltx_Math" alttext="l_{j}\leq l_{i}\leq r_{i}\leq r_{j}" display="inline" intent=":literal"><semantics><mrow><msub><mi style="--ltx-fg-color:#000000;" mathcolor="#000000">l</mi><mi style="--ltx-fg-color:#000000;" mathcolor="#000000">j</mi></msub><mo style="--ltx-fg-color:#000000;" mathcolor="#000000">≤</mo><msub><mi style="--ltx-fg-color:#000000;" mathcolor="#000000">l</mi><mi style="--ltx-fg-color:#000000;" mathcolor="#000000">i</mi></msub><mo style="--ltx-fg-color:#000000;" mathcolor="#000000">≤</mo><msub><mi style="--ltx-fg-color:#000000;" mathcolor="#000000">r</mi><mi style="--ltx-fg-color:#000000;" mathcolor="#000000">i</mi></msub><mo style="--ltx-fg-color:#000000;" mathcolor="#000000">≤</mo><msub><mi style="--ltx-fg-color:#000000;" mathcolor="#000000">r</mi><mi style="--ltx-fg-color:#000000;" mathcolor="#000000">j</mi></msub></mrow><annotation encoding="application/x-tex">l_{j}\leq l_{i}\leq r_{i}\leq r_{j}</annotation></semantics></math>. Also, a track is strongly recommended if it is in all predictor segments, i.e. the track belongs to the intersection <math id="S15.SS0.SSS0.Px7.p3.pic1.m4" class="ltx_Math" alttext="[L,R]" display="inline" intent=":literal"><semantics><mrow><mo style="--ltx-fg-color:#000000;" mathcolor="#000000" stretchy="false">[</mo><mi style="--ltx-fg-color:#000000;" mathcolor="#000000">L</mi><mo style="--ltx-fg-color:#000000;" mathcolor="#000000">,</mo><mi style="--ltx-fg-color:#000000;" mathcolor="#000000">R</mi><mo style="--ltx-fg-color:#000000;" mathcolor="#000000" stretchy="false">]</mo></mrow><annotation encoding="application/x-tex">[L,R]</annotation></semantics></math> of all predictors. Since the segment <math id="S15.SS0.SSS0.Px7.p3.pic1.m5" class="ltx_Math" alttext="[l_{i},r_{i}]" display="inline" intent=":literal"><semantics><mrow><mo style="--ltx-fg-color:#000000;" mathcolor="#000000" stretchy="false">[</mo><msub><mi style="--ltx-fg-color:#000000;" mathcolor="#000000">l</mi><mi style="--ltx-fg-color:#000000;" mathcolor="#000000">i</mi></msub><mo style="--ltx-fg-color:#000000;" mathcolor="#000000">,</mo><msub><mi style="--ltx-fg-color:#000000;" mathcolor="#000000">r</mi><mi style="--ltx-fg-color:#000000;" mathcolor="#000000">i</mi></msub><mo style="--ltx-fg-color:#000000;" mathcolor="#000000" stretchy="false">]</mo></mrow><annotation encoding="application/x-tex">[l_{i},r_{i}]</annotation></semantics></math> also belongs to <math id="S15.SS0.SSS0.Px7.p3.pic1.m6" class="ltx_Math" alttext="[L,R]" display="inline" intent=":literal"><semantics><mrow><mo style="--ltx-fg-color:#000000;" mathcolor="#000000" stretchy="false">[</mo><mi style="--ltx-fg-color:#000000;" mathcolor="#000000">L</mi><mo style="--ltx-fg-color:#000000;" mathcolor="#000000">,</mo><mi style="--ltx-fg-color:#000000;" mathcolor="#000000">R</mi><mo style="--ltx-fg-color:#000000;" mathcolor="#000000" stretchy="false">]</mo></mrow><annotation encoding="application/x-tex">[L,R]</annotation></semantics></math>, then the tracks we need to find form two intervals <math id="S15.SS0.SSS0.Px7.p3.pic1.m7" class="ltx_Math" alttext="[L,l_{i})" display="inline" intent=":literal"><semantics><mrow><mo style="--ltx-fg-color:#000000;" mathcolor="#000000" stretchy="false">[</mo><mi style="--ltx-fg-color:#000000;" mathcolor="#000000">L</mi><mo style="--ltx-fg-color:#000000;" mathcolor="#000000">,</mo><msub><mi style="--ltx-fg-color:#000000;" mathcolor="#000000">l</mi><mi style="--ltx-fg-color:#000000;" mathcolor="#000000">i</mi></msub><mo style="--ltx-fg-color:#000000;" mathcolor="#000000" stretchy="false">)</mo></mrow><annotation encoding="application/x-tex">[L,l_{i})</annotation></semantics></math> and <math id="S15.SS0.SSS0.Px7.p3.pic1.m8" class="ltx_Math" alttext="(r_{i},R]" display="inline" intent=":literal"><semantics><mrow><mo style="--ltx-fg-color:#000000;" mathcolor="#000000" stretchy="false">(</mo><msub><mi style="--ltx-fg-color:#000000;" mathcolor="#000000">r</mi><mi style="--ltx-fg-color:#000000;" mathcolor="#000000">i</mi></msub><mo style="--ltx-fg-color:#000000;" mathcolor="#000000">,</mo><mi style="--ltx-fg-color:#000000;" mathcolor="#000000">R</mi><mo style="--ltx-fg-color:#000000;" mathcolor="#000000" stretchy="false">]</mo></mrow><annotation encoding="application/x-tex">(r_{i},R]</annotation></semantics></math>.

<br class="ltx_break">
<br class="ltx_break">Let’s focus on finding interval <math id="S15.SS0.SSS0.Px7.p3.pic1.m9" class="ltx_Math" alttext="(r_{i},R]" display="inline" intent=":literal"><semantics><mrow><mo style="--ltx-fg-color:#000000;" mathcolor="#000000" stretchy="false">(</mo><msub><mi style="--ltx-fg-color:#000000;" mathcolor="#000000">r</mi><mi style="--ltx-fg-color:#000000;" mathcolor="#000000">i</mi></msub><mo style="--ltx-fg-color:#000000;" mathcolor="#000000">,</mo><mi style="--ltx-fg-color:#000000;" mathcolor="#000000">R</mi><mo style="--ltx-fg-color:#000000;" mathcolor="#000000" stretchy="false">]</mo></mrow><annotation encoding="application/x-tex">(r_{i},R]</annotation></semantics></math>. Since the right border of the intersection is the minimum among right borders, then our task is to find the minimum among <math id="S15.SS0.SSS0.Px7.p3.pic1.m10" class="ltx_Math" alttext="r_{j}" display="inline" intent=":literal"><semantics><msub><mi style="--ltx-fg-color:#000000;" mathcolor="#000000">r</mi><mi style="--ltx-fg-color:#000000;" mathcolor="#000000">j</mi></msub><annotation encoding="application/x-tex">r_{j}</annotation></semantics></math>-s such that <math id="S15.SS0.SSS0.Px7.p3.pic1.m11" class="ltx_Math" alttext="r_{j}\geq r_{i}" display="inline" intent=":literal"><semantics><mrow><msub><mi style="--ltx-fg-color:#000000;" mathcolor="#000000">r</mi><mi style="--ltx-fg-color:#000000;" mathcolor="#000000">j</mi></msub><mo style="--ltx-fg-color:#000000;" mathcolor="#000000">≥</mo><msub><mi style="--ltx-fg-color:#000000;" mathcolor="#000000">r</mi><mi style="--ltx-fg-color:#000000;" mathcolor="#000000">i</mi></msub></mrow><annotation encoding="application/x-tex">r_{j}\geq r_{i}</annotation></semantics></math> while <math id="S15.SS0.SSS0.Px7.p3.pic1.m12" class="ltx_Math" alttext="l_{j}\leq l_{i}" display="inline" intent=":literal"><semantics><mrow><msub><mi style="--ltx-fg-color:#000000;" mathcolor="#000000">l</mi><mi style="--ltx-fg-color:#000000;" mathcolor="#000000">j</mi></msub><mo style="--ltx-fg-color:#000000;" mathcolor="#000000">≤</mo><msub><mi style="--ltx-fg-color:#000000;" mathcolor="#000000">l</mi><mi style="--ltx-fg-color:#000000;" mathcolor="#000000">i</mi></msub></mrow><annotation encoding="application/x-tex">l_{j}\leq l_{i}</annotation></semantics></math>. Let’s do it in the following way: let’s sort all segments by <math id="S15.SS0.SSS0.Px7.p3.pic1.m13" class="ltx_Math" alttext="l_{i}" display="inline" intent=":literal"><semantics><msub><mi style="--ltx-fg-color:#000000;" mathcolor="#000000">l</mi><mi style="--ltx-fg-color:#000000;" mathcolor="#000000">i</mi></msub><annotation encoding="application/x-tex">l_{i}</annotation></semantics></math> in increasing order; in case of equal <math id="S15.SS0.SSS0.Px7.p3.pic1.m14" class="ltx_Math" alttext="l_{i}" display="inline" intent=":literal"><semantics><msub><mi style="--ltx-fg-color:#000000;" mathcolor="#000000">l</mi><mi style="--ltx-fg-color:#000000;" mathcolor="#000000">i</mi></msub><annotation encoding="application/x-tex">l_{i}</annotation></semantics></math>-s, sort them by <math id="S15.SS0.SSS0.Px7.p3.pic1.m15" class="ltx_Math" alttext="r_{i}" display="inline" intent=":literal"><semantics><msub><mi style="--ltx-fg-color:#000000;" mathcolor="#000000">r</mi><mi style="--ltx-fg-color:#000000;" mathcolor="#000000">i</mi></msub><annotation encoding="application/x-tex">r_{i}</annotation></semantics></math> in decreasing order. If we process segments in the given order, then by the moment we process the <math id="S15.SS0.SSS0.Px7.p3.pic1.m16" class="ltx_Math" alttext="i" display="inline" intent=":literal"><semantics><mi style="--ltx-fg-color:#000000;" mathcolor="#000000">i</mi><annotation encoding="application/x-tex">i</annotation></semantics></math>-th segment, all its predictors will be already processed.

<br class="ltx_break">
<br class="ltx_break">Let’s keep <math id="S15.SS0.SSS0.Px7.p3.pic1.m17" class="ltx_Math" alttext="r_{i}" display="inline" intent=":literal"><semantics><msub><mi style="--ltx-fg-color:#000000;" mathcolor="#000000">r</mi><mi style="--ltx-fg-color:#000000;" mathcolor="#000000">i</mi></msub><annotation encoding="application/x-tex">r_{i}</annotation></semantics></math>-s of all processed segments so far in an ”ordered set” <math id="S15.SS0.SSS0.Px7.p3.pic1.m18" class="ltx_Math" alttext="S" display="inline" intent=":literal"><semantics><mi style="--ltx-fg-color:#000000;" mathcolor="#000000">S</mi><annotation encoding="application/x-tex">S</annotation></semantics></math> (<span id="S15.SS0.SSS0.Px7.p3.pic1.2.1.1.1" class="ltx_text ltx_font_typewriter">std::set</span>, for example). Suppose we process segment <math id="S15.SS0.SSS0.Px7.p3.pic1.m19" class="ltx_Math" alttext="i" display="inline" intent=":literal"><semantics><mi style="--ltx-fg-color:#000000;" mathcolor="#000000">i</mi><annotation encoding="application/x-tex">i</annotation></semantics></math>. Since the right borders of all predictors are already in <math id="S15.SS0.SSS0.Px7.p3.pic1.m20" class="ltx_Math" alttext="S" display="inline" intent=":literal"><semantics><mi style="--ltx-fg-color:#000000;" mathcolor="#000000">S</mi><annotation encoding="application/x-tex">S</annotation></semantics></math> and their <math id="S15.SS0.SSS0.Px7.p3.pic1.m21" class="ltx_Math" alttext="r_{j}\geq r_{i}" display="inline" intent=":literal"><semantics><mrow><msub><mi style="--ltx-fg-color:#000000;" mathcolor="#000000">r</mi><mi style="--ltx-fg-color:#000000;" mathcolor="#000000">j</mi></msub><mo style="--ltx-fg-color:#000000;" mathcolor="#000000">≥</mo><msub><mi style="--ltx-fg-color:#000000;" mathcolor="#000000">r</mi><mi style="--ltx-fg-color:#000000;" mathcolor="#000000">i</mi></msub></mrow><annotation encoding="application/x-tex">r_{j}\geq r_{i}</annotation></semantics></math>, then finding the minimum among them is equivalent to just taking <math id="S15.SS0.SSS0.Px7.p3.pic1.m22" class="ltx_Math" alttext="R=S.\text{lower\_bound}(r_{i})" display="inline" intent=":literal"><semantics><mrow><mrow><mi style="--ltx-fg-color:#000000;" mathcolor="#000000">R</mi><mo style="--ltx-fg-color:#000000;" mathcolor="#000000">=</mo><mi style="--ltx-fg-color:#000000;" mathcolor="#000000">S</mi></mrow><mo style="--ltx-fg-color:#000000;" lspace="0em" mathcolor="#000000" rspace="0.167em">.</mo><mrow><mtext style="--ltx-fg-color:#000000;" mathcolor="#000000">lower_bound</mtext><mo lspace="0em" rspace="0em">​</mo><mrow><mo style="--ltx-fg-color:#000000;" mathcolor="#000000" stretchy="false">(</mo><msub><mi style="--ltx-fg-color:#000000;" mathcolor="#000000">r</mi><mi style="--ltx-fg-color:#000000;" mathcolor="#000000">i</mi></msub><mo style="--ltx-fg-color:#000000;" mathcolor="#000000" stretchy="false">)</mo></mrow></mrow></mrow><annotation encoding="application/x-tex">R=S.\text{lower\_bound}(r_{i})</annotation></semantics></math>. Then we can add <math id="S15.SS0.SSS0.Px7.p3.pic1.m23" class="ltx_Math" alttext="R-r_{i}" display="inline" intent=":literal"><semantics><mrow><mi style="--ltx-fg-color:#000000;" mathcolor="#000000">R</mi><mo style="--ltx-fg-color:#000000;" mathcolor="#000000">−</mo><msub><mi style="--ltx-fg-color:#000000;" mathcolor="#000000">r</mi><mi style="--ltx-fg-color:#000000;" mathcolor="#000000">i</mi></msub></mrow><annotation encoding="application/x-tex">R-r_{i}</annotation></semantics></math> to the answer for the <math id="S15.SS0.SSS0.Px7.p3.pic1.m24" class="ltx_Math" alttext="i" display="inline" intent=":literal"><semantics><mi style="--ltx-fg-color:#000000;" mathcolor="#000000">i</mi><annotation encoding="application/x-tex">i</annotation></semantics></math>-th segment. In order to calculate intervals <math id="S15.SS0.SSS0.Px7.p3.pic1.m25" class="ltx_Math" alttext="[L,l_{i})" display="inline" intent=":literal"><semantics><mrow><mo style="--ltx-fg-color:#000000;" mathcolor="#000000" stretchy="false">[</mo><mi style="--ltx-fg-color:#000000;" mathcolor="#000000">L</mi><mo style="--ltx-fg-color:#000000;" mathcolor="#000000">,</mo><msub><mi style="--ltx-fg-color:#000000;" mathcolor="#000000">l</mi><mi style="--ltx-fg-color:#000000;" mathcolor="#000000">i</mi></msub><mo style="--ltx-fg-color:#000000;" mathcolor="#000000" stretchy="false">)</mo></mrow><annotation encoding="application/x-tex">[L,l_{i})</annotation></semantics></math> we can just reflect all segments and solve the same problem.</span></span>
</span></span></span></foreignobject></g></g></svg>