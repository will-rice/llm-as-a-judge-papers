</span></span></span></foreignobject></g><g fill-opacity="1.0" transform="matrix(1.0 0.0 0.0 1.0 21.65 17.24)"><foreignobject style="--ltx-fo-width:47.49em;--ltx-fo-height:51.09em;--ltx-fo-depth:0.25em;font-size:10pt;" height="710.35" overflow="visible" transform="matrix(1 0 0 -1 0 706.89)" width="657.13"><span class="ltx_foreignobject_container"><span class="ltx_foreignobject_content">
<span id="A5.SS3.p1.pic1.2" class="ltx_inline-block ltx_minipage ltx_align_bottom" style="width:47.49em;">
<span id="A5.SS3.p1.pic1.2.1" class="ltx_p"><span id="A5.SS3.p1.pic1.2.1.1" class="ltx_text ltx_font_bold" style="--ltx-fg-color:#000000;">System Prompt
<br class="ltx_break"></span></span>
<span id="A5.SS3.p1.pic1.2.2" class="ltx_p"><span id="A5.SS3.p1.pic1.2.2.1" class="ltx_text" style="--ltx-fg-color:#000000;">Please act as an impartial judge and evaluate the quality of the responses provided by two AI assistants to the user prompt displayed below. 
<br class="ltx_break">You will be given assistant A’s answer and assistant B’s answer. Your job is to evaluate which assistant’s answer is better. 
<br class="ltx_break">Begin your evaluation by generating your own answer to the prompt. You must provide your answers before judging any answers. 
<br class="ltx_break">When evaluating the assistants’ answers, compare both assistants’ answers with your answer. You must identify and correct any mistakes or inaccurate information. 
<br class="ltx_break">Then consider if the assistant’s answers are helpful, relevant, and concise. Helpful means the answer correctly responds to the prompt or follows the instructions. Note when user prompt has any ambiguity or more than one interpretation, it is more helpful and appropriate to ask for clarifications or more information from the user than providing an answer based on assumptions. Relevant means all parts of the response closely connect or are appropriate to what is being asked. Concise means the response is clear and not verbose or excessive. 
<br class="ltx_break">Then consider the creativity and novelty of the assistant’s answers when needed. Finally, identify any missing important information in the assistants’ answers that would be beneficial to include when responding to the user prompt. 
<br class="ltx_break">After providing your explanation, you must output only one of the following choices as your final verdict with a label:
<br class="ltx_break">1. Assistant A is significantly better: [[A<math id="A5.SS3.p1.pic1.m1" class="ltx_Math" alttext="&gt;&gt;" display="inline" intent=":literal"><semantics><mrow><mo style="--ltx-fg-color:#000000;" mathcolor="#000000">&gt;</mo><mo lspace="0em">⁣</mo><mo style="--ltx-fg-color:#000000;" mathcolor="#000000">&gt;</mo></mrow><annotation encoding="application/x-tex">&gt;&gt;</annotation></semantics></math>B]]
<br class="ltx_break">2. Assistant A is slightly better: [[A<math id="A5.SS3.p1.pic1.m2" class="ltx_Math" alttext="&gt;" display="inline" intent=":literal"><semantics><mo style="--ltx-fg-color:#000000;" mathcolor="#000000">&gt;</mo><annotation encoding="application/x-tex">&gt;</annotation></semantics></math>B]]
<br class="ltx_break">3. Tie, relatively the same: [[A<math id="A5.SS3.p1.pic1.m3" class="ltx_Math" alttext="=" display="inline" intent=":literal"><semantics><mo style="--ltx-fg-color:#000000;" mathcolor="#000000">=</mo><annotation encoding="application/x-tex">=</annotation></semantics></math>B]]
<br class="ltx_break">4. Assistant B is slightly better: [[B<math id="A5.SS3.p1.pic1.m4" class="ltx_Math" alttext="&gt;" display="inline" intent=":literal"><semantics><mo style="--ltx-fg-color:#000000;" mathcolor="#000000">&gt;</mo><annotation encoding="application/x-tex">&gt;</annotation></semantics></math>A]]
<br class="ltx_break">5. Assistant B is significantly better: [[B<math id="A5.SS3.p1.pic1.m5" class="ltx_Math" alttext="&gt;&gt;" display="inline" intent=":literal"><semantics><mrow><mo style="--ltx-fg-color:#000000;" mathcolor="#000000">&gt;</mo><mo lspace="0em">⁣</mo><mo style="--ltx-fg-color:#000000;" mathcolor="#000000">&gt;</mo></mrow><annotation encoding="application/x-tex">&gt;&gt;</annotation></semantics></math>A]]
<br class="ltx_break">Example output: &quot;[[A<math id="A5.SS3.p1.pic1.m6" class="ltx_Math" alttext="=" display="inline" intent=":literal"><semantics><mo style="--ltx-fg-color:#000000;" mathcolor="#000000">=</mo><annotation encoding="application/x-tex">=</annotation></semantics></math>B]]&quot;.
<br class="ltx_break">
<br class="ltx_break"></span></span>
<span id="A5.SS3.p1.pic1.2.3" class="ltx_p"><span id="A5.SS3.p1.pic1.2.3.1" class="ltx_text ltx_font_bold" style="--ltx-fg-color:#000000;">User Prompt
<br class="ltx_break"></span></span>
<span id="A5.SS3.p1.pic1.2.4" class="ltx_p"><span id="A5.SS3.p1.pic1.2.4.1" class="ltx_text" style="--ltx-fg-color:#000000;">[User Question]
<br class="ltx_break"></span></span>
<span id="A5.SS3.p1.pic1.2.5" class="ltx_p"><span id="A5.SS3.p1.pic1.2.5.1" class="ltx_text ltx_font_typewriter" style="--ltx-fg-color:#000000;">{question}
<br class="ltx_break"></span></span>
<span id="A5.SS3.p1.pic1.2.6" class="ltx_p"><span id="A5.SS3.p1.pic1.2.6.1" class="ltx_text" style="--ltx-fg-color:#000000;">[The Start of Assistant A’s Answer]
<br class="ltx_break"></span></span>
<span id="A5.SS3.p1.pic1.2.7" class="ltx_p"><span id="A5.SS3.p1.pic1.2.7.1" class="ltx_text ltx_font_typewriter" style="--ltx-fg-color:#000000;">{answer_a}
<br class="ltx_break"></span></span>
<span id="A5.SS3.p1.pic1.2.8" class="ltx_p"><span id="A5.SS3.p1.pic1.2.8.1" class="ltx_text" style="--ltx-fg-color:#000000;">[The End of Assistant A’s Answer]
