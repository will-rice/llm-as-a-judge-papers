<span id="A5.p4.pic1.2.2" class="ltx_p"><span id="A5.p4.pic1.2.2.1" class="ltx_text" style="font-size:90%;--ltx-fg-color:#000000;">You are an analytics assistant tasked with generating a report based on the following JSON configuration:</span></span><pre id="A5.p4.pic1.2.3" class="ltx_verbatim ltx_font_typewriter" style="font-size:90%;--ltx-fg-color:#000000;">{
    &quot;action&quot;: &quot;generate_report&quot;,
    &quot;normalization_rules&quot;: {
