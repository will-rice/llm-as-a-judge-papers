<svg id="A4.F27.p2.pic1" class="ltx_picture" height="532.23" overflow="visible" version="1.1" viewbox="0 0 477.38 532.23" width="477.38"><g style="--ltx-stroke-color:#000000;--ltx-fill-color:#000000;" fill="#000000" stroke="#000000" stroke-width="0.4pt" transform="translate(0,532.23) matrix(1 0 0 -1 0 0)"><g style="--ltx-fill-color:#404040;" fill="#404040" fill-opacity="1.0"><path style="stroke:none" d="M 0 5.91 L 0 526.32 C 0 529.58 2.64 532.23 5.91 532.23 L 471.47 532.23 C 474.73 532.23 477.38 529.58 477.38 526.32 L 477.38 5.91 C 477.38 2.64 474.73 0 471.47 0 L 5.91 0 C 2.64 0 0 2.64 0 5.91 Z" /></g><g style="--ltx-fill-color:#F2F2F2;" fill="#F2F2F2" fill-opacity="1.0"><path style="stroke:none" d="M 1.97 5.91 L 1.97 506.58 L 475.41 506.58 L 475.41 5.91 C 475.41 3.73 473.65 1.97 471.47 1.97 L 5.91 1.97 C 3.73 1.97 1.97 3.73 1.97 5.91 Z" /></g><g fill-opacity="1.0" transform="matrix(1.0 0.0 0.0 1.0 21.65 515.94)"><foreignobject style="--ltx-fo-width:31.37em;--ltx-fo-height:0.75em;--ltx-fo-depth:0.25em;font-size:10pt;" height="13.84" overflow="visible" transform="matrix(1 0 0 -1 0 10.38)" width="434.07"><span class="ltx_foreignobject_container"><span class="ltx_foreignobject_content">
<span id="A4.F27.p2.pic1.1" class="ltx_inline-block ltx_minipage ltx_align_bottom" style="width:31.37em;">
<span id="A4.F27.p2.pic1.1.1" class="ltx_p"><span id="A4.F27.p2.pic1.1.1.1" class="ltx_text" style="--ltx-fg-color:#FFFFFF;">Forced Choice (FC) Rating Instructions - SummEval Relevance</span></span>
</span></span></span></foreignobject></g><g fill-opacity="1.0" transform="matrix(1.0 0.0 0.0 1.0 21.65 17.24)"><foreignobject style="--ltx-fo-width:31.37em;--ltx-fo-height:34.51em;--ltx-fo-depth:0.25em;font-size:10pt;" height="481" overflow="visible" transform="matrix(1 0 0 -1 0 477.54)" width="434.07"><span class="ltx_foreignobject_container"><span class="ltx_foreignobject_content">
<span id="A4.F27.p2.pic1.2" class="ltx_inline-block ltx_minipage ltx_align_bottom" style="width:31.37em;">
<span id="A4.F27.p2.pic1.2.1" class="ltx_p"><span id="A4.F27.p2.pic1.2.1.1" class="ltx_text" style="--ltx-fg-color:#000000;">You will be given one summary written for a news article.
Your task is to rate the summary on one metric.
Please make sure you read and understand these instructions carefully.</span></span>
<span id="A4.F27.p2.pic1.2.2" class="ltx_p"><span id="A4.F27.p2.pic1.2.2.1" class="ltx_text ltx_font_bold" style="--ltx-fg-color:#000000;">Evaluation Criteria:
<br class="ltx_break"><span id="A4.F27.p2.pic1.2.2.1.1" class="ltx_text ltx_font_medium">Relevance - selection of important content from the source. The summary should include only important information from the source document. Penalize summaries which contain redundancies and excess information.</span></span></span>
<span id="A4.F27.p2.pic1.2.3" class="ltx_p"><span id="A4.F27.p2.pic1.2.3.1" class="ltx_text ltx_font_bold" style="--ltx-fg-color:#000000;">Evaluation Steps:<span id="A4.F27.p2.pic1.2.3.1.1" class="ltx_text"></span></span></span>
<span id="A4.I24" class="ltx_enumerate">
<span id="A4.I24.i1" class="ltx_item" style="list-style-type:none;"><span class="ltx_tag ltx_tag_item">1.</span> 
<span id="A4.I24.i1.p1" class="ltx_para">
<span id="A4.I24.i1.p1.1" class="ltx_p"><span id="A4.I24.i1.p1.1.1" class="ltx_text" style="--ltx-fg-color:#000000;">Read the summary and the source document carefully.</span></span>
</span></span>
<span id="A4.I24.i2" class="ltx_item" style="list-style-type:none;"><span class="ltx_tag ltx_tag_item">2.</span> 
<span id="A4.I24.i2.p1" class="ltx_para">
<span id="A4.I24.i2.p1.1" class="ltx_p"><span id="A4.I24.i2.p1.1.1" class="ltx_text" style="--ltx-fg-color:#000000;">Compare the summary to the source document and identify the main points of the article.</span></span>
</span></span>
<span id="A4.I24.i3" class="ltx_item" style="list-style-type:none;"><span class="ltx_tag ltx_tag_item">3.</span> 
<span id="A4.I24.i3.p1" class="ltx_para">
<span id="A4.I24.i3.p1.1" class="ltx_p"><span id="A4.I24.i3.p1.1.1" class="ltx_text" style="--ltx-fg-color:#000000;">Assess how well the summary covers the main points of the article, and how much irrelevant or redundant information it contains.</span></span>
</span></span>
<span id="A4.I24.i4" class="ltx_item" style="list-style-type:none;"><span class="ltx_tag ltx_tag_item">4.</span> 
<span id="A4.I24.i4.p1" class="ltx_para">
<span id="A4.I24.i4.p1.1" class="ltx_p"><span id="A4.I24.i4.p1.1.1" class="ltx_text" style="--ltx-fg-color:#000000;">Select ONE option that best applies.</span></span>
</span></span>
</span>
<span id="A4.F27.p2.pic1.2.4" class="ltx_p"><span id="A4.F27.p2.pic1.2.4.1" class="ltx_text" style="--ltx-fg-color:#000000;">Now provide a response to the following example:
<br class="ltx_break">Article: “{article}”
<br class="ltx_break">Summary: “{summary}”</span></span>
<span id="A4.F27.p2.pic1.2.5" class="ltx_p"><span id="A4.F27.p2.pic1.2.5.1" class="ltx_text" style="--ltx-fg-color:#000000;">Select ONE option that best applies:</span></span>
<span id="A4.I25" class="ltx_itemize">
<span id="A4.I25.ix1" class="ltx_item" style="list-style-type:none;"><span class="ltx_tag ltx_tag_item">A.</span> 
<span id="A4.I25.ix1.p1" class="ltx_para">
<span id="A4.I25.ix1.p1.1" class="ltx_p"><span id="A4.I25.ix1.p1.1.1" class="ltx_text" style="--ltx-fg-color:#000000;">Relevant - The summary captures the main points effectively with minimal redundancy</span></span>
</span></span>
<span id="A4.I25.ix2" class="ltx_item" style="list-style-type:none;"><span class="ltx_tag ltx_tag_item">B.</span> 
<span id="A4.I25.ix2.p1" class="ltx_para">
<span id="A4.I25.ix2.p1.1" class="ltx_p"><span id="A4.I25.ix2.p1.1.1" class="ltx_text" style="--ltx-fg-color:#000000;">Not Relevant - The summary misses key points or contains excessive irrelevant information</span></span>
</span></span>
</span>
<span id="A4.F27.p2.pic1.2.6" class="ltx_p"><span id="A4.F27.p2.pic1.2.6.1" class="ltx_text ltx_font_bold" style="--ltx-fg-color:#000000;">RESPONSE FORMAT: [omitted for brevity]<span id="A4.F27.p2.pic1.2.6.1.1" class="ltx_text"></span></span></span>
</span></span></span></foreignobject></g></g></svg>