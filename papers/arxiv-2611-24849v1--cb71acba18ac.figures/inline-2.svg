<span id="S3.F2.pic1.1.1" class="ltx_p"></span>
<span id="S3.F2.pic1.1.2" class="ltx_p ltx_align_left"><span id="S3.F2.pic1.1.2.1" class="ltx_text ltx_font_bold" style="font-size:70%;">Topic and grade definitions
<br class="ltx_break" style="--ltx-break-space:2.0pt;"><span id="S3.F2.pic1.1.2.1.1" class="ltx_text ltx_font_medium">
<em id="S3.F2.pic1.1.2.1.1.1" class="ltx_emph ltx_font_italic">DL 2019 topic 962179:</em> <span id="S3.F2.pic1.1.2.1.1.2" class="ltx_text ltx_font_italic">when was the salvation army founded
<br class="ltx_break" style="--ltx-break-space:2.0pt;"></span>
[3] dedicated to the query and contains the exact answer
<br class="ltx_break">[2] some answer, possibly unclear or hidden among extraneous information
<br class="ltx_break">[1] related, does not answer  [0] irrelevant
<br class="ltx_break" style="--ltx-break-space:2.0pt;">
The prompt turns these definitions into four questions per document: <span id="S3.F2.pic1.1.2.1.1.3" class="ltx_text ltx_font_typewriter">on_subject</span>, <span id="S3.F2.pic1.1.2.1.1.4" class="ltx_text ltx_font_typewriter">some_answer</span>, <span id="S3.F2.pic1.1.2.1.1.5" class="ltx_text ltx_font_typewriter">exact_answer</span>, <span id="S3.F2.pic1.1.2.1.1.6" class="ltx_text ltx_font_typewriter">dedicated</span>.</span></span></span>
</span></span></span></foreignobject></g><path style="fill:none" d="M 284.65 -0.28 L 100.78 -0.28 C 99.25 -0.28 98.01 -1.52 98.01 -3.04 L 98.01 -279.86 C 98.01 -281.39 99.25 -282.62 100.78 -282.62 L 284.65 -282.62 C 286.18 -282.62 287.42 -281.39 287.42 -279.86 L 287.42 -3.04 C 287.42 -1.52 286.18 -0.28 284.65 -0.28 Z M 98.01 -282.62" /><g style="--ltx-stroke-color:#000000;--ltx-fill-color:#000000;" fill="#000000" stroke="#000000" transform="matrix(1.0 0.0 0.0 1.0 102.16 -11.07)"><foreignobject style="--ltx-fo-width:16.42em;--ltx-fo-height:0.48em;--ltx-fo-depth:19.33em;font-size:10pt;" height="274.05" overflow="visible" transform="matrix(1 0 0 -1 0 6.65)" width="227.21"><span class="ltx_foreignobject_container"><span class="ltx_foreignobject_content">
<span id="S3.F2.pic1.2" class="ltx_inline-block ltx_minipage ltx_align_top" style="width:16.42em;">
<span id="S3.F2.pic1.2.1" class="ltx_p"></span>
<span id="S3.F2.pic1.2.2" class="ltx_p ltx_align_left"><span id="S3.F2.pic1.2.2.1" class="ltx_text ltx_font_bold" style="font-size:70%;">Program 1<span id="S3.F2.pic1.2.2.1.1" class="ltx_text ltx_font_medium"> (shortened)
<br class="ltx_break" style="--ltx-break-space:2.0pt;">
<span id="S3.F2.pic1.2.2.1.1.1" class="ltx_text ltx_font_typewriter" style="font-size:71%;">SA = re.compile(r&quot;salvation\s+army&quot;, re.I)
<br class="ltx_break">KEY_YEARS = {1865, 1878}
<br class="ltx_break">def assess(query, results):  # whole pool
<br class="ltx_break">  for r in results:
<br class="ltx_break">    text = r[&quot;text&quot;]
<br class="ltx_break">    on_subject = bool(SA.search(text)) or ...
<br class="ltx_break">    for s in jk.sentences(text):
<br class="ltx_break">      if (STRONG_FOUND.search(s)
<br class="ltx_break">            and jk.years(s) &amp; KEY_YEARS):
<br class="ltx_break">        strong_sent_key = True
<br class="ltx_break">    some = strong_sent_key or found_sent_year
<br class="ltx_break">    exact = strong_sent_key
<br class="ltx_break">    dedicated = (jk.unrelated_share(query, text)
<br class="ltx_break">                 &lt; 0.45 and focus)
<br class="ltx_break">    out.append({&quot;on_subject&quot;: on_subject, ...})</span></span></span></span>
</span></span></span></foreignobject></g><path style="fill:none" d="M 546.26 -0.28 L 307.27 -0.28 C 305.74 -0.28 304.51 -1.52 304.51 -3.04 L 304.51 -252.73 C 304.51 -254.25 305.74 -255.49 307.27 -255.49 L 546.26 -255.49 C 547.79 -255.49 549.03 -254.25 549.03 -252.73 L 549.03 -3.04 C 549.03 -1.52 547.79 -0.28 546.26 -0.28 Z M 304.51 -255.49" /><g style="--ltx-stroke-color:#000000;--ltx-fill-color:#000000;" fill="#000000" stroke="#000000" transform="matrix(1.0 0.0 0.0 1.0 308.66 -11.15)"><foreignobject style="--ltx-fo-width:21.41em;--ltx-fo-height:0.49em;--ltx-fo-depth:17.36em;font-size:10pt;" height="246.92" overflow="visible" transform="matrix(1 0 0 -1 0 6.73)" width="296.25"><span class="ltx_foreignobject_container"><span class="ltx_foreignobject_content">
<span id="S3.F2.pic1.3" class="ltx_inline-block ltx_minipage ltx_align_top" style="width:21.41em;">
