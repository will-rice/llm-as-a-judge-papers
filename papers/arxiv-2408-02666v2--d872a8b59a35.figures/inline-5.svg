<span id="A1.F10.pic1.2.1" class="ltx_p"><span id="A1.F10.pic1.2.1.1" class="ltx_text" style="--ltx-fg-color:#000000;">Below is a conversation between an user and an AI Assistant.

<br class="ltx_break">
<br class="ltx_break"> [User Question]

<br class="ltx_break"><span id="A1.F10.pic1.2.1.1.1" class="ltx_text" style="--ltx-fg-color:#0000FF;">{Instruction}</span>

<br class="ltx_break">
<br class="ltx_break"> [The start of Assistant’s Answer]
<br class="ltx_break"><span id="A1.F10.pic1.2.1.1.2" class="ltx_text" style="--ltx-fg-color:#0000FF;">{Baseline Response}
<br class="ltx_break"></span> [The end of Assistant’s Answer]

<br class="ltx_break">
<br class="ltx_break">Please rewrite the Assistant’s Answer to make it worse. Specifically, the rewritten worse answer should closely resemble the original answer but is worse in terms of one or multiple of the following aspects: helpfulness, correctness, coherence, verbosity.</span></span>
<span id="A1.F10.pic1.2.2" class="ltx_p"><span id="A1.F10.pic1.2.2.1" class="ltx_text" style="--ltx-fg-color:#000000;">IMPORTANT: Please strictly follow the following format:</span></span>
<span id="A1.F10.pic1.2.3" class="ltx_p"><span id="A1.F10.pic1.2.3.1" class="ltx_text" style="--ltx-fg-color:#000000;">First, choose one or multiple aspects to generate a worse answer, such as rewrite the original answer to be unhelpful, incorrect, lack of coherence, more verbose, etc.</span></span>
