<svg id="A7.p5.pic1" class="ltx_picture" height="1081.94" overflow="visible" version="1.1" viewbox="0 0 550 1081.94" width="550"><g style="--ltx-stroke-color:#000000;--ltx-fill-color:#000000;" fill="#000000" stroke="#000000" stroke-width="0.4pt" transform="translate(0,1081.94) matrix(1 0 0 -1 0 0)"><g style="--ltx-fill-color:#D9B841;" fill="#D9B841" fill-opacity="1.0"><path style="stroke:none" d="M 0 5.91 L 0 1076.04 C 0 1079.3 2.64 1081.94 5.91 1081.94 L 544.09 1081.94 C 547.36 1081.94 550 1079.3 550 1076.04 L 550 5.91 C 550 2.64 547.36 0 544.09 0 L 5.91 0 C 2.64 0 0 2.64 0 5.91 Z" /></g><g style="--ltx-fill-color:#FFFFFA;" fill="#FFFFFA" fill-opacity="1.0"><path style="stroke:none" d="M 1.97 5.91 L 1.97 1056.29 L 548.03 1056.29 L 548.03 5.91 C 548.03 3.73 546.27 1.97 544.09 1.97 L 5.91 1.97 C 3.73 1.97 1.97 3.73 1.97 5.91 Z" /></g><g fill-opacity="1.0" transform="matrix(1.0 0.0 0.0 1.0 5.91 1065.66)"><foreignobject style="--ltx-fo-width:33.83em;--ltx-fo-height:0.75em;--ltx-fo-depth:0.25em;font-size:10pt;" height="13.84" overflow="visible" transform="matrix(1 0 0 -1 0 10.38)" width="468.11"><span class="ltx_foreignobject_container"><span class="ltx_foreignobject_content">
<span id="A7.p5.pic1.1" class="ltx_inline-block ltx_minipage ltx_align_bottom" style="width:33.83em;">
<span id="A7.p5.pic1.1.1" class="ltx_p"><span id="A7.p5.pic1.1.1.1" class="ltx_text ltx_font_bold" style="--ltx-fg-color:#FFFFFF;">Biases Identified from Qwen2.5-7B-Instruct (Initial Social Bias Library)</span></span>
</span></span></span></foreignobject></g><g fill-opacity="1.0" transform="matrix(1.0 0.0 0.0 1.0 5.91 1019.65)"><foreignobject style="--ltx-fo-width:38.9em;--ltx-fo-height:1.79em;--ltx-fo-depth:72.7em;font-size:10pt;" height="1030.72" overflow="visible" transform="matrix(1 0 0 -1 0 24.83)" width="538.27"><span class="ltx_foreignobject_container"><span class="ltx_foreignobject_content">
<span id="A7.p5.pic1.2" class="ltx_inline-block ltx_minipage ltx_align_bottom" style="width:38.9em;">
<span id="A7.I2" class="ltx_itemize" style="--ltx-enum-leftmargin:5mm;">
<span id="A7.I2.i1" class="ltx_item" style="list-style-type:none;"><span class="ltx_tag ltx_tag_item"><math id="A7.I2.i1.m1" class="ltx_Math" alttext="\triangleright" display="inline" intent=":literal"><semantics><mo>⊳</mo><annotation encoding="application/x-tex">\triangleright</annotation></semantics></math></span> 
<span id="A7.I2.i1.p1" class="ltx_para ltx_noindent">
<span id="A7.I2.i1.p1.1" class="ltx_p"><span id="A7.I2.i1.p1.1.1" class="ltx_text ltx_font_bold" style="--ltx-fg-color:#000000;">Confirmation Bias</span><span id="A7.I2.i1.p1.1.2" class="ltx_text" style="--ltx-fg-color:#000000;">: The tendency to search for, interpret, favor, and recall information in a way that confirms one’s preexisting beliefs or hypotheses. In this context, the LLM seems to have favored the answer that aligns with its initial reasoning, even though the reasoning itself was flawed, leading to an incorrect choice.</span></span>
</span></span>
<span id="A7.I2.i2" class="ltx_item" style="list-style-type:none;"><span class="ltx_tag ltx_tag_item"><math id="A7.I2.i2.m1" class="ltx_Math" alttext="\triangleright" display="inline" intent=":literal"><semantics><mo>⊳</mo><annotation encoding="application/x-tex">\triangleright</annotation></semantics></math></span> 
<span id="A7.I2.i2.p1" class="ltx_para ltx_noindent">
<span id="A7.I2.i2.p1.1" class="ltx_p"><span id="A7.I2.i2.p1.1.1" class="ltx_text ltx_font_bold" style="--ltx-fg-color:#000000;">Length Bias</span><span id="A7.I2.i2.p1.1.2" class="ltx_text" style="--ltx-fg-color:#000000;">: Refers to the tendency of large language models (LLMs) to prefer longer (or shorter) generated outputs when evaluating text quality, while disregarding the actual content quality or relevance.</span></span>
</span></span>
<span id="A7.I2.i3" class="ltx_item" style="list-style-type:none;"><span class="ltx_tag ltx_tag_item"><math id="A7.I2.i3.m1" class="ltx_Math" alttext="\triangleright" display="inline" intent=":literal"><semantics><mo>⊳</mo><annotation encoding="application/x-tex">\triangleright</annotation></semantics></math></span> 
<span id="A7.I2.i3.p1" class="ltx_para ltx_noindent">
<span id="A7.I2.i3.p1.1" class="ltx_p"><span id="A7.I2.i3.p1.1.1" class="ltx_text ltx_font_bold" style="--ltx-fg-color:#000000;">Completeness Bias</span><span id="A7.I2.i3.p1.1.2" class="ltx_text" style="--ltx-fg-color:#000000;">: Refers to the tendency of large language models (LLMs) to prefer answers that provide more comprehensive or detailed information, even if the additional information is not strictly necessary to answer the question accurately.</span></span>
</span></span>
<span id="A7.I2.i4" class="ltx_item" style="list-style-type:none;"><span class="ltx_tag ltx_tag_item"><math id="A7.I2.i4.m1" class="ltx_Math" alttext="\triangleright" display="inline" intent=":literal"><semantics><mo>⊳</mo><annotation encoding="application/x-tex">\triangleright</annotation></semantics></math></span> 
<span id="A7.I2.i4.p1" class="ltx_para ltx_noindent">
<span id="A7.I2.i4.p1.1" class="ltx_p"><span id="A7.I2.i4.p1.1.1" class="ltx_text ltx_font_bold" style="--ltx-fg-color:#000000;">Complexity Bias</span><span id="A7.I2.i4.p1.1.2" class="ltx_text" style="--ltx-fg-color:#000000;">: Refers to the tendency of large language models (LLMs) to prefer more complex and detailed answers over simpler ones, even when the simpler answer is sufficient or more appropriate. This bias can lead to overcomplicating issues and overlooking straightforward solutions.</span></span>
</span></span>
<span id="A7.I2.i5" class="ltx_item" style="list-style-type:none;"><span class="ltx_tag ltx_tag_item"><math id="A7.I2.i5.m1" class="ltx_Math" alttext="\triangleright" display="inline" intent=":literal"><semantics><mo>⊳</mo><annotation encoding="application/x-tex">\triangleright</annotation></semantics></math></span> 
<span id="A7.I2.i5.p1" class="ltx_para ltx_noindent">
<span id="A7.I2.i5.p1.1" class="ltx_p"><span id="A7.I2.i5.p1.1.1" class="ltx_text ltx_font_bold" style="--ltx-fg-color:#000000;">Richness Bias</span><span id="A7.I2.i5.p1.1.2" class="ltx_text" style="--ltx-fg-color:#000000;">: Refers to the tendency of large language models (LLMs) to prefer more detailed, complex, and vivid narratives, even if the simpler narrative is equally valid or appropriate for the context. This bias can lead the LLM to overvalue complexity and detail at the expense of clarity and conciseness.</span></span>
</span></span>
<span id="A7.I2.i6" class="ltx_item" style="list-style-type:none;"><span class="ltx_tag ltx_tag_item"><math id="A7.I2.i6.m1" class="ltx_Math" alttext="\triangleright" display="inline" intent=":literal"><semantics><mo>⊳</mo><annotation encoding="application/x-tex">\triangleright</annotation></semantics></math></span> 
<span id="A7.I2.i6.p1" class="ltx_para ltx_noindent">
<span id="A7.I2.i6.p1.1" class="ltx_p"><span id="A7.I2.i6.p1.1.1" class="ltx_text ltx_font_bold" style="--ltx-fg-color:#000000;">Familiarity Bias</span><span id="A7.I2.i6.p1.1.2" class="ltx_text" style="--ltx-fg-color:#000000;">: Refers to the tendency of large language models (LLMs) to prefer code or solutions that are more familiar or commonly seen, even if they are not necessarily the most efficient or concise. This bias can lead to the selection of more verbose or traditional coding practices over more modern or optimized ones.</span></span>
</span></span>
<span id="A7.I2.i7" class="ltx_item" style="list-style-type:none;"><span class="ltx_tag ltx_tag_item"><math id="A7.I2.i7.m1" class="ltx_Math" alttext="\triangleright" display="inline" intent=":literal"><semantics><mo>⊳</mo><annotation encoding="application/x-tex">\triangleright</annotation></semantics></math></span> 
<span id="A7.I2.i7.p1" class="ltx_para ltx_noindent">
<span id="A7.I2.i7.p1.1" class="ltx_p"><span id="A7.I2.i7.p1.1.1" class="ltx_text ltx_font_bold" style="--ltx-fg-color:#000000;">Action Bias</span><span id="A7.I2.i7.p1.1.2" class="ltx_text" style="--ltx-fg-color:#000000;">: Refers to the tendency of large language models (LLMs) to prefer providing detailed and actionable information, even when such information might be dangerous or inappropriate, over providing a safer, more cautious response.</span></span>
</span></span>
<span id="A7.I2.i8" class="ltx_item" style="list-style-type:none;"><span class="ltx_tag ltx_tag_item"><math id="A7.I2.i8.m1" class="ltx_Math" alttext="\triangleright" display="inline" intent=":literal"><semantics><mo>⊳</mo><annotation encoding="application/x-tex">\triangleright</annotation></semantics></math></span> 
<span id="A7.I2.i8.p1" class="ltx_para ltx_noindent">
<span id="A7.I2.i8.p1.1" class="ltx_p"><span id="A7.I2.i8.p1.1.1" class="ltx_text ltx_font_bold" style="--ltx-fg-color:#000000;">Moral Licensing</span><span id="A7.I2.i8.p1.1.2" class="ltx_text" style="--ltx-fg-color:#000000;">: Moral licensing is a psychological phenomenon where a person’s positive actions or attitudes give them the psychological license to engage in behaviors that are otherwise considered unethical or inappropriate. In this context, the LLM’s detailed and seemingly responsible guidance for creating an automated social media interaction script may inadvertently provide a justification for engaging in behavior that could be seen as manipulative or unethical, despite the ethical caveats provided.</span></span>
</span></span>
<span id="A7.I2.i9" class="ltx_item" style="list-style-type:none;"><span class="ltx_tag ltx_tag_item"><math id="A7.I2.i9.m1" class="ltx_Math" alttext="\triangleright" display="inline" intent=":literal"><semantics><mo>⊳</mo><annotation encoding="application/x-tex">\triangleright</annotation></semantics></math></span> 
<span id="A7.I2.i9.p1" class="ltx_para ltx_noindent">
<span id="A7.I2.i9.p1.1" class="ltx_p"><span id="A7.I2.i9.p1.1.1" class="ltx_text ltx_font_bold" style="--ltx-fg-color:#000000;">Relevance Bias</span><span id="A7.I2.i9.p1.1.2" class="ltx_text" style="--ltx-fg-color:#000000;">: Refers to the tendency of large language models (LLMs) to prefer answers that are more directly relevant to the question, even if the content is harmful or unethical, over answers that are less relevant but more ethical or appropriate.</span></span>
</span></span>
<span id="A7.I2.i10" class="ltx_item" style="list-style-type:none;"><span class="ltx_tag ltx_tag_item"><math id="A7.I2.i10.m1" class="ltx_Math" alttext="\triangleright" display="inline" intent=":literal"><semantics><mo>⊳</mo><annotation encoding="application/x-tex">\triangleright</annotation></semantics></math></span> 
<span id="A7.I2.i10.p1" class="ltx_para ltx_noindent">
<span id="A7.I2.i10.p1.1" class="ltx_p"><span id="A7.I2.i10.p1.1.1" class="ltx_text ltx_font_bold" style="--ltx-fg-color:#000000;">Factual Error Bias</span><span id="A7.I2.i10.p1.1.2" class="ltx_text" style="--ltx-fg-color:#000000;">: Refers to the tendency of large language models (LLMs) to generate or accept information that contains factual errors or inaccuracies, often due to outdated knowledge or incorrect information in the training data.</span></span>
</span></span>
<span id="A7.I2.i11" class="ltx_item" style="list-style-type:none;"><span class="ltx_tag ltx_tag_item"><math id="A7.I2.i11.m1" class="ltx_Math" alttext="\triangleright" display="inline" intent=":literal"><semantics><mo>⊳</mo><annotation encoding="application/x-tex">\triangleright</annotation></semantics></math></span> 
<span id="A7.I2.i11.p1" class="ltx_para ltx_noindent">
<span id="A7.I2.i11.p1.1" class="ltx_p"><span id="A7.I2.i11.p1.1.1" class="ltx_text ltx_font_bold" style="--ltx-fg-color:#000000;">Authority Bias</span><span id="A7.I2.i11.p1.1.2" class="ltx_text" style="--ltx-fg-color:#000000;">: Refers to the tendency to attribute greater accuracy or importance to information that is associated with or presented in a way that suggests authority or expertise, even if such association is not directly relevant to the content’s validity.</span></span>
</span></span>
<span id="A7.I2.i12" class="ltx_item" style="list-style-type:none;"><span class="ltx_tag ltx_tag_item"><math id="A7.I2.i12.m1" class="ltx_Math" alttext="\triangleright" display="inline" intent=":literal"><semantics><mo>⊳</mo><annotation encoding="application/x-tex">\triangleright</annotation></semantics></math></span> 
<span id="A7.I2.i12.p1" class="ltx_para">
<span id="A7.I2.i12.p1.1" class="ltx_p"><span id="A7.I2.i12.p1.1.1" class="ltx_text ltx_font_bold" style="--ltx-fg-color:#000000;">Aesthetic Bias</span><span id="A7.I2.i12.p1.1.2" class="ltx_text" style="--ltx-fg-color:#000000;">: Refers to the tendency of large language models (LLMs) to prefer answers that are visually appealing or well-formatted, even if they have minor functional issues, over answers that are functionally correct but less visually appealing.</span></span>
</span></span>
</span>
</span></span></span></foreignobject></g></g></svg>