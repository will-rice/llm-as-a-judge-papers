<span id="A1.F7.pic1.p13.1" class="ltx_p"># Instructions</span>
</span></span></span></span>
<span id="A1.F7.pic1.2.14" class="ltx_p" style="width:381.5pt;"><span id="A1.F7.pic1.2.14.1" class="ltx_text ltx_verbatim ltx_font_typewriter ltx_inline-block" style="width:381.5pt;--ltx-fg-color:#000000;"><span id="A1.F7.pic1.2.14.1.1" class="ltx_inline-logical-block ltx_parbox ltx_align_top" style="width:381.5pt;">
<span id="A1.F7.pic1.p14" class="ltx_para ltx_noindent">
<span id="A1.F7.pic1.p14.1" class="ltx_p">Return a json object with &quot;criteria_met&quot; field.</span>
</span></span></span></span>
<span id="A1.F7.pic1.2.15" class="ltx_p" style="width:381.5pt;"><span id="A1.F7.pic1.2.15.1" class="ltx_text ltx_verbatim ltx_font_typewriter ltx_inline-block" style="width:381.5pt;--ltx-fg-color:#000000;"><span id="A1.F7.pic1.2.15.1.1" class="ltx_inline-logical-block ltx_parbox ltx_align_top" style="width:381.5pt;">
<span id="A1.F7.pic1.p15" class="ltx_para ltx_noindent">
<span id="A1.F7.pic1.p15.1" class="ltx_p">- The &quot;criteria_met&quot; field should be a boolean indicating whether the</span>
</span></span></span></span>
<span id="A1.F7.pic1.2.16" class="ltx_p" style="width:381.5pt;"><span id="A1.F7.pic1.2.16.1" class="ltx_text ltx_verbatim ltx_font_typewriter ltx_inline-block" style="width:381.5pt;--ltx-fg-color:#000000;"><span id="A1.F7.pic1.2.16.1.1" class="ltx_inline-logical-block ltx_parbox ltx_align_top" style="width:381.5pt;">
<span id="A1.F7.pic1.p16" class="ltx_para ltx_noindent">
<span id="A1.F7.pic1.p16.1" class="ltx_p">  response meets the criteria of the rubric item. If a rubric item has</span>
</span></span></span></span>
<span id="A1.F7.pic1.2.17" class="ltx_p" style="width:381.5pt;"><span id="A1.F7.pic1.2.17.1" class="ltx_text ltx_verbatim ltx_font_typewriter ltx_inline-block" style="width:381.5pt;--ltx-fg-color:#000000;"><span id="A1.F7.pic1.2.17.1.1" class="ltx_text ltx_inline-block" style="width:0.0pt;"> </span><span id="A1.F7.pic1.2.17.1.2" class="ltx_text ltx_inline-block" style="width:0.0pt;"> </span><span id="A1.F7.pic1.2.17.1.3" class="ltx_inline-logical-block ltx_parbox ltx_align_top" style="width:381.5pt;">
<span id="A1.F7.pic1.p17" class="ltx_para ltx_noindent">
<span id="A1.F7.pic1.p17.1" class="ltx_p">  multiple sentences or criteria, you should consider all of them. If any</span>
</span></span></span></span>
<span id="A1.F7.pic1.2.18" class="ltx_p" style="width:381.5pt;"><span id="A1.F7.pic1.2.18.1" class="ltx_text ltx_verbatim ltx_font_typewriter ltx_inline-block" style="width:381.5pt;--ltx-fg-color:#000000;"><span id="A1.F7.pic1.2.18.1.1" class="ltx_text ltx_inline-block" style="width:0.0pt;"> </span><span id="A1.F7.pic1.2.18.1.2" class="ltx_text ltx_inline-block" style="width:0.0pt;"> </span><span id="A1.F7.pic1.2.18.1.3" class="ltx_inline-logical-block ltx_parbox ltx_align_top" style="width:381.5pt;">
<span id="A1.F7.pic1.p18" class="ltx_para ltx_noindent">
<span id="A1.F7.pic1.p18.1" class="ltx_p">  of the criteria is not met, the answer should be false. Only return true</span>
</span></span></span></span>
<span id="A1.F7.pic1.2.19" class="ltx_p" style="width:381.5pt;"><span id="A1.F7.pic1.2.19.1" class="ltx_text ltx_verbatim ltx_font_typewriter ltx_inline-block" style="width:381.5pt;--ltx-fg-color:#000000;"><span id="A1.F7.pic1.2.19.1.1" class="ltx_inline-logical-block ltx_parbox ltx_align_top" style="width:381.5pt;">
<span id="A1.F7.pic1.p19" class="ltx_para ltx_noindent">
<span id="A1.F7.pic1.p19.1" class="ltx_p">  is all of the criteria are met.</span>
</span></span></span></span>
<span id="A1.F7.pic1.2.20" class="ltx_p" style="width:381.5pt;"><span id="A1.F7.pic1.2.20.1" class="ltx_text ltx_verbatim ltx_font_typewriter ltx_inline-block" style="width:381.5pt;--ltx-fg-color:#000000;"><span id="A1.F7.pic1.2.20.1.1" class="ltx_inline-logical-block ltx_parbox ltx_pruned_first ltx_align_top" style="width:381.5pt;"></span></span></span>
