<svg id="S15.SS0.SSS0.Px19.p3.pic1" class="ltx_picture" height="289.78" overflow="visible" version="1.1" viewbox="0 0 477.38 289.78" width="477.38"><g style="--ltx-stroke-color:#000000;--ltx-fill-color:#000000;" fill="#000000" stroke="#000000" stroke-width="0.4pt" transform="translate(0,289.78) matrix(1 0 0 -1 0 0)"><g style="--ltx-fill-color:#4285F4;" fill="#4285F4" fill-opacity="1.0"><path style="stroke:none" d="M 0 7.5 L 0 282.28 C 0 286.42 3.36 289.78 7.5 289.78 L 469.87 289.78 C 474.02 289.78 477.38 286.42 477.38 282.28 L 477.38 7.5 C 477.38 3.36 474.02 0 469.87 0 L 7.5 0 C 3.36 0 0 3.36 0 7.5 Z" /></g><g style="--ltx-fill-color:#F5F5F5;" fill="#F5F5F5" fill-opacity="1.0"><path style="stroke:none" d="M 1.97 7.5 L 1.97 251.41 L 475.41 251.41 L 475.41 7.5 C 475.41 4.45 472.93 1.97 469.87 1.97 L 7.5 1.97 C 4.45 1.97 1.97 4.45 1.97 7.5 Z" /></g><g fill-opacity="1.0" transform="matrix(1.0 0.0 0.0 1.0 20.48 258.83)"><foreignobject style="--ltx-fo-width:27.43em;--ltx-fo-height:1.89em;--ltx-fo-depth:0.19em;font-size:10pt;" height="28.9" overflow="visible" transform="matrix(1 0 0 -1 0 26.21)" width="379.55"><span class="ltx_foreignobject_container"><span class="ltx_foreignobject_content">
<span id="S15.SS0.SSS0.Px19.p3.pic1.1" class="ltx_inline-block ltx_minipage ltx_align_bottom" style="width:27.43em;">
<span id="S15.SS0.SSS0.Px19.p3.pic1.1.1" class="ltx_p"><span id="S15.SS0.SSS0.Px19.p3.pic1.1.1.1" class="ltx_text" style="position:relative; bottom:0.9pt;"></span><a href="https://codeforces.com/blog/entry/134224" title class="ltx_ref ltx_href ltx_font_bold" style="--ltx-fg-color:#FFFFFF;">Tutorial</a><span id="S15.SS0.SSS0.Px19.p3.pic1.1.1.2" class="ltx_text ltx_font_bold" style="--ltx-fg-color:#FFFFFF;"> — <a href="https://codeforces.com/contest/2013/submission/282029424" title class="ltx_ref ltx_href">Human’s accepted submission</a> — <a href="https://gist.github.com/anonymous-llm-code/f50f9b8c8c5ad116eed9c455d86878aa" title class="ltx_ref ltx_href"><span class="ltx_text ltx_font_typewriter">Gemini 2.5 Pro</span>’s rejected submission</a></span></span>
</span></span></span></foreignobject></g><g fill-opacity="1.0" transform="matrix(1.0 0.0 0.0 1.0 20.48 15.3)"><foreignobject style="--ltx-fo-width:31.54em;--ltx-fo-height:16.29em;--ltx-fo-depth:0.19em;font-size:10pt;" height="228.16" overflow="visible" transform="matrix(1 0 0 -1 0 225.47)" width="436.42"><span class="ltx_foreignobject_container"><span class="ltx_foreignobject_content">
<span id="S15.SS0.SSS0.Px19.p3.pic1.2" class="ltx_inline-block ltx_minipage ltx_align_bottom" style="width:31.54em;">
<span id="S15.SS0.SSS0.Px19.p3.pic1.2.1" class="ltx_p"><span id="S15.SS0.SSS0.Px19.p3.pic1.2.1.1" class="ltx_text" style="--ltx-fg-color:#000000;">We will initially maintain an empty string <math id="S15.SS0.SSS0.Px19.p3.pic1.m1" class="ltx_Math" alttext="t" display="inline" intent=":literal"><semantics><mi style="--ltx-fg-color:#000000;" mathcolor="#000000">t</mi><annotation encoding="application/x-tex">t</annotation></semantics></math> such that <math id="S15.SS0.SSS0.Px19.p3.pic1.m2" class="ltx_Math" alttext="t" display="inline" intent=":literal"><semantics><mi style="--ltx-fg-color:#000000;" mathcolor="#000000">t</mi><annotation encoding="application/x-tex">t</annotation></semantics></math> appears as a substring in <math id="S15.SS0.SSS0.Px19.p3.pic1.m3" class="ltx_Math" alttext="s" display="inline" intent=":literal"><semantics><mi style="--ltx-fg-color:#000000;" mathcolor="#000000">s</mi><annotation encoding="application/x-tex">s</annotation></semantics></math>.

<br class="ltx_break">
<br class="ltx_break">We will increase the string <math id="S15.SS0.SSS0.Px19.p3.pic1.m4" class="ltx_Math" alttext="t" display="inline" intent=":literal"><semantics><mi style="--ltx-fg-color:#000000;" mathcolor="#000000">t</mi><annotation encoding="application/x-tex">t</annotation></semantics></math> by one character until its length is less than <math id="S15.SS0.SSS0.Px19.p3.pic1.m5" class="ltx_Math" alttext="n" display="inline" intent=":literal"><semantics><mi style="--ltx-fg-color:#000000;" mathcolor="#000000">n</mi><annotation encoding="application/x-tex">n</annotation></semantics></math>.

<br class="ltx_break">
<br class="ltx_break">We will perform <math id="S15.SS0.SSS0.Px19.p3.pic1.m6" class="ltx_Math" alttext="n" display="inline" intent=":literal"><semantics><mi style="--ltx-fg-color:#000000;" mathcolor="#000000">n</mi><annotation encoding="application/x-tex">n</annotation></semantics></math> iterations. In each iteration, we will check the strings <math id="S15.SS0.SSS0.Px19.p3.pic1.m7" class="ltx_Math" alttext="t+0" display="inline" intent=":literal"><semantics><mrow><mi style="--ltx-fg-color:#000000;" mathcolor="#000000">t</mi><mo style="--ltx-fg-color:#000000;" mathcolor="#000000">+</mo><mn style="--ltx-fg-color:#000000;" mathcolor="#000000">0</mn></mrow><annotation encoding="application/x-tex">t+0</annotation></semantics></math> and <math id="S15.SS0.SSS0.Px19.p3.pic1.m8" class="ltx_Math" alttext="t+1" display="inline" intent=":literal"><semantics><mrow><mi style="--ltx-fg-color:#000000;" mathcolor="#000000">t</mi><mo style="--ltx-fg-color:#000000;" mathcolor="#000000">+</mo><mn style="--ltx-fg-color:#000000;" mathcolor="#000000">1</mn></mrow><annotation encoding="application/x-tex">t+1</annotation></semantics></math>. If one of them appears in <math id="S15.SS0.SSS0.Px19.p3.pic1.m9" class="ltx_Math" alttext="s" display="inline" intent=":literal"><semantics><mi style="--ltx-fg-color:#000000;" mathcolor="#000000">s</mi><annotation encoding="application/x-tex">s</annotation></semantics></math> as a substring, we will add the appropriate character to the end of <math id="S15.SS0.SSS0.Px19.p3.pic1.m10" class="ltx_Math" alttext="t" display="inline" intent=":literal"><semantics><mi style="--ltx-fg-color:#000000;" mathcolor="#000000">t</mi><annotation encoding="application/x-tex">t</annotation></semantics></math> and proceed to the next iteration.

<br class="ltx_break">
<br class="ltx_break">If neither of these two strings appears in <math id="S15.SS0.SSS0.Px19.p3.pic1.m11" class="ltx_Math" alttext="s" display="inline" intent=":literal"><semantics><mi style="--ltx-fg-color:#000000;" mathcolor="#000000">s</mi><annotation encoding="application/x-tex">s</annotation></semantics></math>, it means that the string <math id="S15.SS0.SSS0.Px19.p3.pic1.m12" class="ltx_Math" alttext="t" display="inline" intent=":literal"><semantics><mi style="--ltx-fg-color:#000000;" mathcolor="#000000">t</mi><annotation encoding="application/x-tex">t</annotation></semantics></math> is a suffix of the string <math id="S15.SS0.SSS0.Px19.p3.pic1.m13" class="ltx_Math" alttext="s" display="inline" intent=":literal"><semantics><mi style="--ltx-fg-color:#000000;" mathcolor="#000000">s</mi><annotation encoding="application/x-tex">s</annotation></semantics></math>. After this iteration, we will check the string <math id="S15.SS0.SSS0.Px19.p3.pic1.m14" class="ltx_Math" alttext="0+t" display="inline" intent=":literal"><semantics><mrow><mn style="--ltx-fg-color:#000000;" mathcolor="#000000">0</mn><mo style="--ltx-fg-color:#000000;" mathcolor="#000000">+</mo><mi style="--ltx-fg-color:#000000;" mathcolor="#000000">t</mi></mrow><annotation encoding="application/x-tex">0+t</annotation></semantics></math>. If it appears in <math id="S15.SS0.SSS0.Px19.p3.pic1.m15" class="ltx_Math" alttext="s" display="inline" intent=":literal"><semantics><mi style="--ltx-fg-color:#000000;" mathcolor="#000000">s</mi><annotation encoding="application/x-tex">s</annotation></semantics></math>, we will add <math id="S15.SS0.SSS0.Px19.p3.pic1.m16" class="ltx_Math" alttext="0" display="inline" intent=":literal"><semantics><mn style="--ltx-fg-color:#000000;" mathcolor="#000000">0</mn><annotation encoding="application/x-tex">0</annotation></semantics></math> to <math id="S15.SS0.SSS0.Px19.p3.pic1.m17" class="ltx_Math" alttext="t" display="inline" intent=":literal"><semantics><mi style="--ltx-fg-color:#000000;" mathcolor="#000000">t</mi><annotation encoding="application/x-tex">t</annotation></semantics></math>; otherwise, we will add <math id="S15.SS0.SSS0.Px19.p3.pic1.m18" class="ltx_Math" alttext="1" display="inline" intent=":literal"><semantics><mn style="--ltx-fg-color:#000000;" mathcolor="#000000">1</mn><annotation encoding="application/x-tex">1</annotation></semantics></math>.

<br class="ltx_break">
<br class="ltx_break">Thus, in each iteration, we perform 2 queries, except for one iteration in which we perform 3 queries. However, after this iteration, we will make only 1 query, so the total number of queries will not exceed <math id="S15.SS0.SSS0.Px19.p3.pic1.m19" class="ltx_Math" alttext="2\cdot n" display="inline" intent=":literal"><semantics><mrow><mn style="--ltx-fg-color:#000000;" mathcolor="#000000">2</mn><mo style="--ltx-fg-color:#000000;" lspace="0.222em" mathcolor="#000000" rspace="0.222em">⋅</mo><mi style="--ltx-fg-color:#000000;" mathcolor="#000000">n</mi></mrow><annotation encoding="application/x-tex">2\cdot n</annotation></semantics></math>.</span></span>
</span></span></span></foreignobject></g></g></svg>