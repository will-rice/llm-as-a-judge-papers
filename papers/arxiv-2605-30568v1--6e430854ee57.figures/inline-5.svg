<span id="A1.p8.pic1.1.1" class="ltx_p"><span id="A1.p8.pic1.1.1.1" class="ltx_text ltx_font_sansserif ltx_font_bold" style="--ltx-fg-color:#FFFFFF;">Pointwise judge</span></span>
</span></span></span></foreignobject></g><g fill-opacity="1.0" transform="matrix(1.0 0.0 0.0 1.0 10.16 165.66)"><foreignobject style="--ltx-fo-width:43.55em;--ltx-fo-height:17.49em;--ltx-fo-depth:0.22em;font-size:10pt;" height="245.03" overflow="visible" transform="matrix(1 0 0 -1 0 241.96)" width="602.61"><span class="ltx_foreignobject_container"><span class="ltx_foreignobject_content">
<span id="A1.p8.pic1.2" class="ltx_inline-block ltx_minipage ltx_align_bottom" style="width:43.55em;">
<span id="A1.p8.pic1.2.1" class="ltx_p"><span id="A1.p8.pic1.2.1.1" class="ltx_text ltx_font_bold" style="--ltx-fg-color:#000000;">System:<span id="A1.p8.pic1.2.1.1.1" class="ltx_text ltx_font_typewriter ltx_font_medium"> You are a helpful assistant that evaluates the quality of AI responses. You will be given a prompt, an evaluation rubric, and an AI response. Use the rubric criteria to assess the response and assign a score from 1 to 5.
</span></span></span>
<span id="A1.p8.pic1.2.2" class="ltx_p"><span id="A1.p8.pic1.2.2.1" class="ltx_text ltx_font_typewriter" style="--ltx-fg-color:#000000;">Scoring scale:
<br class="ltx_break">  1 = Poor -- The response fails to address the prompt or has critical issues
<br class="ltx_break">  2 = Below Average -- The response partially addresses the prompt but has significant shortcomings
<br class="ltx_break">  3 = Average -- The response adequately addresses the prompt with some room for improvement
<br class="ltx_break">  4 = Good -- The response effectively addresses the prompt with minor issues
<br class="ltx_break">  5 = Excellent -- The response thoroughly and skillfully addresses the prompt
</span></span>
<span id="A1.p8.pic1.2.3" class="ltx_p"><span id="A1.p8.pic1.2.3.1" class="ltx_text ltx_font_typewriter" style="--ltx-fg-color:#000000;">You must output ONLY a single JSON object with two keys:
<br class="ltx_break">- &quot;score&quot;: an integer from 1 to 5
<br class="ltx_break">- &quot;reason&quot;: a brief one-sentence explanation referencing the rubric criteria
</span></span>
</span></span></span></foreignobject></g><g fill-opacity="1.0" transform="matrix(1.0 0.0 0.0 1.0 10.16 13.24)"><foreignobject style="--ltx-fo-width:43.55em;--ltx-fo-height:9.09em;--ltx-fo-depth:0.22em;font-size:10pt;" height="128.8" overflow="visible" transform="matrix(1 0 0 -1 0 125.73)" width="602.61"><span class="ltx_foreignobject_container"><span class="ltx_foreignobject_content">
<span id="A1.p8.pic1.3" class="ltx_inline-block ltx_minipage ltx_align_bottom" style="width:43.55em;">
<span id="A1.p8.pic1.3.1" class="ltx_p"><span id="A1.p8.pic1.3.1.1" class="ltx_text ltx_font_bold" style="--ltx-fg-color:#000000;">User:<span id="A1.p8.pic1.3.1.1.1" class="ltx_text ltx_font_typewriter ltx_font_medium"> [Prompt]
<br class="ltx_break">{prompt}
<br class="ltx_break" style="--ltx-break-space:5.3pt;">
[Evaluation Rubric]
<br class="ltx_break">{rubric}
<br class="ltx_break" style="--ltx-break-space:5.3pt;">
[Response]
<br class="ltx_break">{response}
<br class="ltx_break" style="--ltx-break-space:5.3pt;">
Based on the rubric, score this response from 1 to 5. Output only the JSON object.
</span></span></span>
</span></span></span></foreignobject></g></g></svg>