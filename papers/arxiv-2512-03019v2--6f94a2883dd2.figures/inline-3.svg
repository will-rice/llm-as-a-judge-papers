<span id="A1.F7.pic1.2" class="ltx_inline-block ltx_minipage ltx_align_bottom" style="width:42.68em;">
<span id="A1.F7.pic1.2.1" class="ltx_p"><span id="A1.F7.pic1.2.1.1" class="ltx_text ltx_font_typewriter" style="font-size:70%;--ltx-fg-color:#000000;">**Evaluation Procedure:**
<br class="ltx_break">
<br class="ltx_break">You are tasked with a comparative linguistic assessment of two parallel translations from {sl} into {tl}. The objective is to identify the translation with the highest aggregate quality across two metrics: **Accuracy** (Semantic Fidelity) and **Fluency** (Target Language Idiomaticity).
<br class="ltx_break">1. **Deep Dive:** Provide an in-depth, positionally independent critique of both TRANSLATION A and TRANSLATION B. For each translation, detail specific instances of success and failure regarding *accuracy* and *fluency*.
<br class="ltx_break">2. **Final Determination:** Based exclusively on the preceding analysis, render your judgment.
<br class="ltx_break">**Positional bias is strictly prohibited.**
<br class="ltx_break">**Required Tagged Output:**
<br class="ltx_break">* **[[A]]**: A demonstrates overall superior quality.
<br class="ltx_break">* **[[B]]**: B demonstrates overall superior quality.
<br class="ltx_break">* **[[SAME]]**: Both A and B are indistinguishable in quality.
<br class="ltx_break">
<br class="ltx_break">[SOURCE TEXT]
<br class="ltx_break">{source} 
<br class="ltx_break">
<br class="ltx_break">[TRANSLATION A]
<br class="ltx_break">{translation_a} 
<br class="ltx_break">
<br class="ltx_break">[TRANSLATION B]
<br class="ltx_break">{translation_b} 
<br class="ltx_break"></span></span>
