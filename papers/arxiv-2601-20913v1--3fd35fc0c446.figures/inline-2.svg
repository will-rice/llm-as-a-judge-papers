<span id="A7.SS5.SSS1.p2.pic1.1" class="ltx_inline-block ltx_minipage ltx_align_bottom" style="width:36.62em;">
<span id="A7.SS5.SSS1.p2.pic1.1.1" class="ltx_p"><span id="A7.SS5.SSS1.p2.pic1.1.1.1" class="ltx_text" style="--ltx-fg-color:#FFFFFF;">Judge Prompt for Jigsaw Toxic Comment Classification &lt;TASK&gt;</span></span>
</span></span></span></foreignobject></g><g fill-opacity="1.0" transform="matrix(1.0 0.0 0.0 1.0 21.65 14.32)"><foreignobject style="--ltx-fo-width:36.62em;--ltx-fo-height:19.89em;--ltx-fo-depth:0.04em;font-size:10pt;" height="275.82" overflow="visible" transform="matrix(1 0 0 -1 0 275.28)" width="506.72"><span class="ltx_foreignobject_container"><span class="ltx_foreignobject_content">
<span id="A7.SS5.SSS1.p2.pic1.2" class="ltx_inline-block ltx_minipage ltx_align_bottom" style="width:36.62em;">
<span id="A7.SS5.SSS1.p2.pic1.2.1" class="ltx_p"><span id="A7.SS5.SSS1.p2.pic1.2.1.1" class="ltx_text" style="--ltx-fg-color:#000000;">You are a user comment safety classifier.</span></span>
<span id="A7.SS5.SSS1.p2.pic1.2.2" class="ltx_p"><span id="A7.SS5.SSS1.p2.pic1.2.2.1" class="ltx_text" style="--ltx-fg-color:#000000;">&lt;BEGIN TASK&gt;</span></span>
<span id="A7.SS5.SSS1.p2.pic1.2.3" class="ltx_p"><span id="A7.SS5.SSS1.p2.pic1.2.3.1" class="ltx_text" style="--ltx-fg-color:#000000;">1. You will be given:</span></span>
<span id="A7.SS5.SSS1.p2.pic1.2.4" class="ltx_p"><span id="A7.SS5.SSS1.p2.pic1.2.4.1" class="ltx_text" style="--ltx-fg-color:#000000;">- A user comment.</span></span>
<span id="A7.SS5.SSS1.p2.pic1.2.5" class="ltx_p"><span id="A7.SS5.SSS1.p2.pic1.2.5.1" class="ltx_text" style="--ltx-fg-color:#000000;">- An existing prediction (&quot;safe&quot; or &quot;unsafe&quot;) provided as non-authoritative, supplementary information that may be incorrect.</span></span>
<span id="A7.SS5.SSS1.p2.pic1.2.6" class="ltx_p"><span id="A7.SS5.SSS1.p2.pic1.2.6.1" class="ltx_text" style="--ltx-fg-color:#000000;">2. You must:</span></span>
<span id="A7.SS5.SSS1.p2.pic1.2.7" class="ltx_p"><span id="A7.SS5.SSS1.p2.pic1.2.7.1" class="ltx_text" style="--ltx-fg-color:#000000;">- First, read and analyze the user comment in full.</span></span>
<span id="A7.SS5.SSS1.p2.pic1.2.8" class="ltx_p"><span id="A7.SS5.SSS1.p2.pic1.2.8.1" class="ltx_text" style="--ltx-fg-color:#000000;">- Evaluate whether the comment contains unsafe content strictly according to the Content Categories below.</span></span>
<span id="A7.SS5.SSS1.p2.pic1.2.9" class="ltx_p"><span id="A7.SS5.SSS1.p2.pic1.2.9.1" class="ltx_text" style="--ltx-fg-color:#000000;">- Make your final judgment primarily and decisively based on the user comment, treating the existing prediction only as a secondary, potentially unreliable reference that must not override your own assessment.</span></span>
<span id="A7.SS5.SSS1.p2.pic1.2.10" class="ltx_p"><span id="A7.SS5.SSS1.p2.pic1.2.10.1" class="ltx_text" style="--ltx-fg-color:#000000;">3. Output rules:</span></span>
<span id="A7.SS5.SSS1.p2.pic1.2.11" class="ltx_p"><span id="A7.SS5.SSS1.p2.pic1.2.11.1" class="ltx_text" style="--ltx-fg-color:#000000;">- Output exactly one digit for the user comment: 1 = unsafe, 0 = safe.</span></span>
<span id="A7.SS5.SSS1.p2.pic1.2.12" class="ltx_p"><span id="A7.SS5.SSS1.p2.pic1.2.12.1" class="ltx_text" style="--ltx-fg-color:#000000;">- Do not include any explanation, text, punctuation, whitespace, or newline.</span></span>
<span id="A7.SS5.SSS1.p2.pic1.2.13" class="ltx_p"><span id="A7.SS5.SSS1.p2.pic1.2.13.1" class="ltx_text" style="--ltx-fg-color:#000000;">&lt;END TASK&gt;</span></span>
</span></span></span></foreignobject></g></g></svg>