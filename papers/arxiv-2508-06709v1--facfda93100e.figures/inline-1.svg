<svg id="A4.p2.pic1" class="ltx_picture" height="449.09" overflow="visible" version="1.1" viewbox="0 0 650 449.09" width="650"><g style="--ltx-stroke-color:#000000;--ltx-fill-color:#000000;" fill="#000000" stroke="#000000" stroke-width="0.4pt" transform="translate(0,449.09) matrix(1 0 0 -1 0 0)"><g style="--ltx-fill-color:#404040;" fill="#404040" fill-opacity="1.0"><path style="stroke:none" d="M 0 5.91 L 0 443.18 C 0 446.44 2.64 449.09 5.91 449.09 L 644.09 449.09 C 647.36 449.09 650 446.44 650 443.18 L 650 5.91 C 650 2.64 647.36 0 644.09 0 L 5.91 0 C 2.64 0 0 2.64 0 5.91 Z" /></g><g style="--ltx-fill-color:#F9F9F9;" fill="#F9F9F9" fill-opacity="1.0"><path style="stroke:none" d="M 1.97 5.91 L 1.97 424.97 L 648.03 424.97 L 648.03 5.91 C 648.03 3.73 646.27 1.97 644.09 1.97 L 5.91 1.97 C 3.73 1.97 1.97 3.73 1.97 5.91 Z" /></g><g fill-opacity="1.0" transform="matrix(1.0 0.0 0.0 1.0 21.65 433.57)"><foreignobject style="--ltx-fo-width:43.85em;--ltx-fo-height:0.69em;--ltx-fo-depth:0.19em;font-size:10pt;" height="12.3" overflow="visible" transform="matrix(1 0 0 -1 0 9.61)" width="606.76"><span class="ltx_foreignobject_container"><span class="ltx_foreignobject_content">
<span id="A4.p2.pic1.1" class="ltx_inline-block ltx_minipage ltx_align_bottom" style="width:43.85em;">
<span id="A4.p2.pic1.1.1" class="ltx_p"><span id="A4.p2.pic1.1.1.1" class="ltx_text" style="--ltx-fg-color:#FFFFFF;">Faithfulness Prompt</span></span>
</span></span></span></foreignobject></g><g fill-opacity="1.0" transform="matrix(1.0 0.0 0.0 1.0 21.65 80.2)"><foreignobject style="--ltx-fo-width:43.85em;--ltx-fo-height:24.06em;--ltx-fo-depth:4.8em;font-size:10pt;" height="399.39" overflow="visible" transform="matrix(1 0 0 -1 0 332.97)" width="606.76"><span class="ltx_foreignobject_container"><span class="ltx_foreignobject_content"><span id="A4.p2.pic1.2" class="ltx_inline-logical-block ltx_minipage ltx_align_bottom" style="width:43.85em;">
<span id="A4.p2.pic1.p4" class="ltx_para">
<span id="A4.p2.pic1.p4.1" class="ltx_p"><span id="A4.p2.pic1.p4.1.1" class="ltx_text" style="--ltx-fg-color:#000000;">You are given a task in some context (<span id="A4.p2.pic1.p4.1.1.1" class="ltx_text ltx_font_bold">Input</span>), and a candidate answer. Is the candidate answer faithful to the task description and context?</span></span>
<span id="A4.p2.pic1.p4.2" class="ltx_p"><span id="A4.p2.pic1.p4.2.1" class="ltx_text" style="--ltx-fg-color:#000000;">A response is considered <span id="A4.p2.pic1.p4.2.1.1" class="ltx_text ltx_font_italic">unfaithful</span> only when (1) it clearly contradicts the context, or (2) the task implies that the response must be based on the context (e.g., a summarization task). If the task does not require grounding in the context, the model may use its own knowledge, even if unverifiable.</span></span>
</span>
<span id="A4.p2.pic1.p1" class="ltx_para ltx_noindent">
<span id="A4.p2.pic1.p1.1" class="ltx_p"><span id="A4.p2.pic1.p1.1.1" class="ltx_text ltx_font_bold" style="--ltx-fg-color:#000000;">Task:</span><span id="A4.p2.pic1.p1.1.2" class="ltx_text" style="--ltx-fg-color:#000000;"> {prompt}</span>
<br class="ltx_break"><span id="A4.p2.pic1.p1.1.3" class="ltx_text ltx_font_bold" style="--ltx-fg-color:#000000;">Candidate Response:</span><span id="A4.p2.pic1.p1.1.4" class="ltx_text" style="--ltx-fg-color:#000000;"> {prediction}</span></span>
</span>
<span id="A4.p2.pic1.p2" class="ltx_para ltx_noindent">
<span id="A4.p2.pic1.p2.1" class="ltx_p"><span id="A4.p2.pic1.p2.1.1" class="ltx_text ltx_font_bold" style="--ltx-fg-color:#000000;">Instruction:</span><span id="A4.p2.pic1.p2.1.2" class="ltx_text" style="--ltx-fg-color:#000000;"> Evaluate how much of the information in the answer is faithful to the available context.</span></span>
</span>
<span id="A4.p2.pic1.p5" class="ltx_para">
<span id="A4.p2.pic1.p5.1" class="ltx_p"><span id="A4.p2.pic1.p5.1.1" class="ltx_text" style="--ltx-fg-color:#000000;">First explain your reasoning, then provide your final answer. Use the following format:</span></span>
<span id="A4.p2.pic1.p5.2" class="ltx_quote">
<span id="A4.p2.pic1.p5.2.1" class="ltx_p"><span id="A4.p2.pic1.p5.2.1.1" class="ltx_text" style="--ltx-fg-color:#000000;">Explanation: [Explanation], Answer: [Answer]</span></span>
</span>
</span>
<span id="A4.p2.pic1.p3" class="ltx_para ltx_noindent">
<span id="A4.p2.pic1.p3.1" class="ltx_p"><span id="A4.p2.pic1.p3.1.1" class="ltx_text" style="--ltx-fg-color:#000000;">where </span><span id="A4.p2.pic1.p3.1.2" class="ltx_text ltx_font_typewriter" style="--ltx-fg-color:#000000;">[Answer]</span><span id="A4.p2.pic1.p3.1.3" class="ltx_text" style="--ltx-fg-color:#000000;"> is one of:</span></span>
<span id="A4.p2.pic1.p3.2" class="ltx_quote">
<span id="A4.p2.pic1.p3.2.1" class="ltx_p"><span id="A4.p2.pic1.p3.2.1.1" class="ltx_text ltx_font_typewriter" style="--ltx-fg-color:#000000;">none is faithful
<br class="ltx_break">some is faithful
<br class="ltx_break">approximately half is faithful
<br class="ltx_break">most is faithful
<br class="ltx_break">all is faithful</span></span>
</span>
</span></span></span></span></foreignobject></g></g></svg>