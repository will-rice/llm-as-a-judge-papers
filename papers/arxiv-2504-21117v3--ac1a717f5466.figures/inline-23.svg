<span id="A1.F9.p3.pic1.1" class="ltx_inline-block ltx_minipage ltx_align_bottom" style="width:16.95em;">
<span id="A1.F9.p3.pic1.1.1" class="ltx_p"><span id="A1.F9.p3.pic1.1.1.1" class="ltx_text" style="font-size:70%;--ltx-fg-color:#000000;">As an esteemed fact-checker, your responsibility is to meticulously evaluate the factual consistency of the provided summaries in relation to the corresponding articles. Below, you will find the detailed evaluation guideline along with the required format.</span></span>
<span id="A1.F9.p3.pic1.1.2" class="ltx_p"><span id="A1.F9.p3.pic1.1.2.1" class="ltx_text" style="font-size:70%;--ltx-fg-color:#000000;">Detailed Evaluation Guideline:
<br class="ltx_break">- Summaries must strictly adhere to the facts presented in the article.
<br class="ltx_break">- Any inference or speculation not explicitly mentioned in the article must be identified as inconsistent.
<br class="ltx_break">- The consistency score should be a numerical value ranging from <span id="A1.F9.p3.pic1.1.2.1.1" class="ltx_text" style="--ltx-fg-color:#BF0000;">0 to 100</span>, where 100 indicates perfect factual alignment.
<br class="ltx_break">Output Format:
<br class="ltx_break">- Your output should be a JSON object with the keys: ärticle,̈ s̈ummary,̈ and c̈onsistency_score.̈</span></span>
<span id="A1.F9.p3.pic1.1.3" class="ltx_p"><span id="A1.F9.p3.pic1.1.3.1" class="ltx_text" style="font-size:70%;--ltx-fg-color:#000000;">Proceed with your evaluation using the given article and summary. 
<br class="ltx_break">Article:
<br class="ltx_break">{article}</span></span>
<span id="A1.F9.p3.pic1.1.4" class="ltx_p"><span id="A1.F9.p3.pic1.1.4.1" class="ltx_text" style="font-size:70%;--ltx-fg-color:#000000;">Summary:
<br class="ltx_break">{summary}</span></span>
