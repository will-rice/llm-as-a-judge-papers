<span id="A4.F8.pic1.2.1" class="ltx_p"><span id="A4.F8.pic1.2.1.1" class="ltx_text ltx_verbatim ltx_font_typewriter ltx_inline-block" style="width:453.1pt;--ltx-fg-color:#000000;"><span id="A4.F8.pic1.2.1.1.1" class="ltx_text ltx_inline-block" style="width:0.0pt;"> </span><span id="A4.F8.pic1.2.1.1.2" class="ltx_text ltx_inline-block" style="width:0.0pt;"> </span><span id="A4.F8.pic1.2.1.1.3" class="ltx_text ltx_inline-block" style="width:21.0pt;"> </span><span id="A4.F8.pic1.2.1.1.4" class="ltx_inline-logical-block ltx_parbox ltx_align_top" style="width:432.1pt;">
<span id="A4.F8.pic1.p1" class="ltx_para ltx_noindent">
<span id="A4.F8.pic1.p1.1" class="ltx_p">You are an expert evaluator. You will be given a USER QUERY and TWO candidate responses (A, B). Score the OVERALL quality of each response on an integer scale of 0-10, where:</span>
</span></span></span></span>
<span id="A4.F8.pic1.2.2" class="ltx_p" style="width:453.1pt;"><span id="A4.F8.pic1.2.2.1" class="ltx_text ltx_verbatim ltx_font_typewriter ltx_inline-block" style="width:453.1pt;--ltx-fg-color:#000000;"><span id="A4.F8.pic1.2.2.1.1" class="ltx_inline-logical-block ltx_parbox ltx_pruned_first ltx_align_top" style="width:453.1pt;"></span></span></span>
<span id="A4.F8.pic1.2.3" class="ltx_p" style="width:453.1pt;"><span id="A4.F8.pic1.2.3.1" class="ltx_text ltx_verbatim ltx_font_typewriter ltx_inline-block" style="width:453.1pt;--ltx-fg-color:#000000;"><span id="A4.F8.pic1.2.3.1.1" class="ltx_text ltx_inline-block" style="width:0.0pt;"> </span><span id="A4.F8.pic1.2.3.1.2" class="ltx_text ltx_inline-block" style="width:0.0pt;"> </span><span id="A4.F8.pic1.2.3.1.3" class="ltx_text ltx_inline-block" style="width:21.0pt;"> </span><span id="A4.F8.pic1.2.3.1.4" class="ltx_inline-logical-block ltx_parbox ltx_align_top" style="width:432.1pt;">
<span id="A4.F8.pic1.p3" class="ltx_para ltx_noindent">
<span id="A4.F8.pic1.p3.1" class="ltx_p">- 10 = excellent: factually correct, complete, helpful, well-structured, safe, addresses the user’s true need.</span>
</span></span></span></span>
<span id="A4.F8.pic1.2.4" class="ltx_p" style="width:453.1pt;"><span id="A4.F8.pic1.2.4.1" class="ltx_text ltx_verbatim ltx_font_typewriter ltx_inline-block" style="width:453.1pt;--ltx-fg-color:#000000;"><span id="A4.F8.pic1.2.4.1.1" class="ltx_inline-logical-block ltx_parbox ltx_align_top" style="width:453.1pt;">
<span id="A4.F8.pic1.p4" class="ltx_para ltx_noindent">
<span id="A4.F8.pic1.p4.1" class="ltx_p">- 7-9 = good: minor issues only.</span>
</span></span></span></span>
<span id="A4.F8.pic1.2.5" class="ltx_p" style="width:453.1pt;"><span id="A4.F8.pic1.2.5.1" class="ltx_text ltx_verbatim ltx_font_typewriter ltx_inline-block" style="width:453.1pt;--ltx-fg-color:#000000;"><span id="A4.F8.pic1.2.5.1.1" class="ltx_inline-logical-block ltx_parbox ltx_align_top" style="width:453.1pt;">
<span id="A4.F8.pic1.p5" class="ltx_para ltx_noindent">
<span id="A4.F8.pic1.p5.1" class="ltx_p">- 4-6 = mediocre: partially helpful but with notable problems.</span>
</span></span></span></span>
<span id="A4.F8.pic1.2.6" class="ltx_p" style="width:453.1pt;"><span id="A4.F8.pic1.2.6.1" class="ltx_text ltx_verbatim ltx_font_typewriter ltx_inline-block" style="width:453.1pt;--ltx-fg-color:#000000;"><span id="A4.F8.pic1.2.6.1.1" class="ltx_inline-logical-block ltx_parbox ltx_align_top" style="width:453.1pt;">
<span id="A4.F8.pic1.p6" class="ltx_para ltx_noindent">
<span id="A4.F8.pic1.p6.1" class="ltx_p">- 1-3 = poor: largely unhelpful, wrong, or unsafe.</span>
</span></span></span></span>
<span id="A4.F8.pic1.2.7" class="ltx_p" style="width:453.1pt;"><span id="A4.F8.pic1.2.7.1" class="ltx_text ltx_verbatim ltx_font_typewriter ltx_inline-block" style="width:453.1pt;--ltx-fg-color:#000000;"><span id="A4.F8.pic1.2.7.1.1" class="ltx_inline-logical-block ltx_parbox ltx_align_top" style="width:453.1pt;">
<span id="A4.F8.pic1.p7" class="ltx_para ltx_noindent">
<span id="A4.F8.pic1.p7.1" class="ltx_p">- 0 = unusable (empty / refusal-without-reason / completely off-topic).</span>
</span></span></span></span>
<span id="A4.F8.pic1.2.8" class="ltx_p" style="width:453.1pt;"><span id="A4.F8.pic1.2.8.1" class="ltx_text ltx_verbatim ltx_font_typewriter ltx_inline-block" style="width:453.1pt;--ltx-fg-color:#000000;"><span id="A4.F8.pic1.2.8.1.1" class="ltx_inline-logical-block ltx_parbox ltx_pruned_first ltx_align_top" style="width:453.1pt;"></span></span></span>
