<svg id="A1.SS2.p1.pic1" class="ltx_picture" height="244.42" overflow="visible" version="1.1" viewbox="0 0 477.38 244.42" width="477.38"><g style="--ltx-stroke-color:#000000;--ltx-fill-color:#000000;" fill="#000000" stroke="#000000" stroke-width="0.4pt" transform="translate(0,244.42) matrix(1 0 0 -1 0 0)"><g style="--ltx-fill-color:#666666;" fill="#666666" fill-opacity="1.0"><path style="stroke:none" d="M 0 3.46 L 0 240.96 C 0 242.88 1.55 244.42 3.46 244.42 L 473.92 244.42 C 475.83 244.42 477.38 242.88 477.38 240.96 L 477.38 3.46 C 477.38 1.55 475.83 0 473.92 0 L 3.46 0 C 1.55 0 0 1.55 0 3.46 Z" /></g><g style="--ltx-fill-color:#F7F7F7;" fill="#F7F7F7" fill-opacity="1.0"><path style="stroke:none" d="M 0.69 3.46 L 0.69 222.87 L 476.68 222.87 L 476.68 3.46 C 476.68 1.93 475.45 0.69 473.92 0.69 L 3.46 0.69 C 1.93 0.69 0.69 1.93 0.69 3.46 Z" /></g><g fill-opacity="1.0" transform="matrix(1.0 0.0 0.0 1.0 12.93 230.19)"><foreignobject style="--ltx-fo-width:28.37em;--ltx-fo-height:0.69em;--ltx-fo-depth:0.19em;font-size:10pt;" height="12.3" overflow="visible" transform="matrix(1 0 0 -1 0 9.61)" width="392.56"><span class="ltx_foreignobject_container"><span class="ltx_foreignobject_content">
<span id="A1.SS2.p1.pic1.1" class="ltx_inline-block ltx_minipage ltx_align_bottom" style="width:28.37em;">
<span id="A1.SS2.p1.pic1.1.1" class="ltx_p"><span id="A1.SS2.p1.pic1.1.1.1" class="ltx_text ltx_font_bold" style="--ltx-fg-color:#FFFFFF;">GRPO Objective</span></span>
</span></span></span></foreignobject></g><g fill-opacity="1.0" transform="matrix(1.0 0.0 0.0 1.0 12.93 35.06)"><foreignobject style="--ltx-fo-width:32.63em;--ltx-fo-height:12.69em;--ltx-fo-depth:1.6em;font-size:10pt;" height="197.7" overflow="visible" transform="matrix(1 0 0 -1 0 175.57)" width="451.51"><span class="ltx_foreignobject_container"><span class="ltx_foreignobject_content">
<span id="A1.SS2.p1.pic1.2" class="ltx_inline-block ltx_minipage ltx_align_bottom" style="width:32.63em;">
<span id="A1.SS2.p1.pic1.2.1" class="ltx_p"><span id="A1.SS2.p1.pic1.2.1.1" class="ltx_text" style="--ltx-fg-color:#000000;">During GRPO training, for each iteration and a given input <math id="A1.SS2.p1.pic1.m1" class="ltx_Math" alttext="q" display="inline" intent=":literal"><semantics><mi style="--ltx-fg-color:#000000;" mathcolor="#000000">q</mi><annotation encoding="application/x-tex">q</annotation></semantics></math>, we sample a group of <math id="A1.SS2.p1.pic1.m2" class="ltx_Math" alttext="M" display="inline" intent=":literal"><semantics><mi style="--ltx-fg-color:#000000;" mathcolor="#000000">M</mi><annotation encoding="application/x-tex">M</annotation></semantics></math> candidate outputs <math id="A1.SS2.p1.pic1.m3" class="ltx_Math" alttext="\{y_{j}\}_{j=1}^{M}" display="inline" intent=":literal"><semantics><msubsup><mrow><mo style="--ltx-fg-color:#000000;" mathcolor="#000000" stretchy="false">{</mo><msub><mi style="--ltx-fg-color:#000000;" mathcolor="#000000">y</mi><mi style="--ltx-fg-color:#000000;" mathcolor="#000000">j</mi></msub><mo style="--ltx-fg-color:#000000;" mathcolor="#000000" stretchy="false">}</mo></mrow><mrow><mi style="--ltx-fg-color:#000000;" mathcolor="#000000">j</mi><mo style="--ltx-fg-color:#000000;" mathcolor="#000000">=</mo><mn style="--ltx-fg-color:#000000;" mathcolor="#000000">1</mn></mrow><mi style="--ltx-fg-color:#000000;" mathcolor="#000000">M</mi></msubsup><annotation encoding="application/x-tex">\{y_{j}\}_{j=1}^{M}</annotation></semantics></math> from the reference policy <math id="A1.SS2.p1.pic1.m4" class="ltx_Math" alttext="\pi_{\text{ref}}" display="inline" intent=":literal"><semantics><msub><mi style="--ltx-fg-color:#000000;" mathcolor="#000000">π</mi><mtext style="--ltx-fg-color:#000000;" mathcolor="#000000">ref</mtext></msub><annotation encoding="application/x-tex">\pi_{\text{ref}}</annotation></semantics></math>. Each candidate <math id="A1.SS2.p1.pic1.m5" class="ltx_Math" alttext="j" display="inline" intent=":literal"><semantics><mi style="--ltx-fg-color:#000000;" mathcolor="#000000">j</mi><annotation encoding="application/x-tex">j</annotation></semantics></math> receives a scalar reward <math id="A1.SS2.p1.pic1.m6" class="ltx_Math" alttext="r_{j}" display="inline" intent=":literal"><semantics><msub><mi style="--ltx-fg-color:#000000;" mathcolor="#000000">r</mi><mi style="--ltx-fg-color:#000000;" mathcolor="#000000">j</mi></msub><annotation encoding="application/x-tex">r_{j}</annotation></semantics></math>. We compute the group-relative advantage as:</span></span>
<span id="A1.E4" class="ltx_equation ltx_eqn_table">

<span><span class="ltx_equation ltx_eqn_row ltx_align_baseline">
<span class="ltx_eqn_cell ltx_eqn_center_padleft"></span>
<span class="ltx_eqn_cell ltx_align_center"><math id="A1.E4.m1" class="ltx_Math" alttext="\tilde{A}_{j}=\frac{r_{j}-\mu_{r}}{\sigma_{r}},\quad\mu_{r}=\frac{1}{M}\sum_{j=1}^{M}r_{j},\quad\sigma_{r}=\sqrt{\frac{1}{M}\sum_{j=1}^{M}(r_{j}-\mu_{r})^{2}}." display="block" intent=":literal"><semantics><mrow><mrow><mrow><msub><mover accent="true"><mi style="--ltx-fg-color:#000000;" mathcolor="#000000">A</mi><mo style="--ltx-fg-color:#000000;" mathcolor="#000000">~</mo></mover><mi style="--ltx-fg-color:#000000;" mathcolor="#000000">j</mi></msub><mo style="--ltx-fg-color:#000000;" mathcolor="#000000">=</mo><mfrac style="--ltx-fg-color:#000000;" mathcolor="#000000"><mrow><msub><mi style="--ltx-fg-color:#000000;" mathcolor="#000000">r</mi><mi style="--ltx-fg-color:#000000;" mathcolor="#000000">j</mi></msub><mo style="--ltx-fg-color:#000000;" mathcolor="#000000">−</mo><msub><mi style="--ltx-fg-color:#000000;" mathcolor="#000000">μ</mi><mi style="--ltx-fg-color:#000000;" mathcolor="#000000">r</mi></msub></mrow><msub><mi style="--ltx-fg-color:#000000;" mathcolor="#000000">σ</mi><mi style="--ltx-fg-color:#000000;" mathcolor="#000000">r</mi></msub></mfrac></mrow><mo style="--ltx-fg-color:#000000;" mathcolor="#000000" rspace="1.167em">,</mo><mrow><msub><mi style="--ltx-fg-color:#000000;" mathcolor="#000000">μ</mi><mi style="--ltx-fg-color:#000000;" mathcolor="#000000">r</mi></msub><mo style="--ltx-fg-color:#000000;" mathcolor="#000000">=</mo><mrow><mfrac style="--ltx-fg-color:#000000;" mathcolor="#000000"><mn style="--ltx-fg-color:#000000;" mathcolor="#000000">1</mn><mi style="--ltx-fg-color:#000000;" mathcolor="#000000">M</mi></mfrac><mo lspace="0em" rspace="0em">​</mo><mrow><munderover><mo style="--ltx-fg-color:#000000;" mathcolor="#000000" movablelimits="false">∑</mo><mrow><mi style="--ltx-fg-color:#000000;" mathcolor="#000000">j</mi><mo style="--ltx-fg-color:#000000;" mathcolor="#000000">=</mo><mn style="--ltx-fg-color:#000000;" mathcolor="#000000">1</mn></mrow><mi style="--ltx-fg-color:#000000;" mathcolor="#000000">M</mi></munderover><msub><mi style="--ltx-fg-color:#000000;" mathcolor="#000000">r</mi><mi style="--ltx-fg-color:#000000;" mathcolor="#000000">j</mi></msub></mrow></mrow></mrow><mo style="--ltx-fg-color:#000000;" mathcolor="#000000" rspace="1.167em">,</mo><mrow><msub><mi style="--ltx-fg-color:#000000;" mathcolor="#000000">σ</mi><mi style="--ltx-fg-color:#000000;" mathcolor="#000000">r</mi></msub><mo style="--ltx-fg-color:#000000;" mathcolor="#000000">=</mo><msqrt style="--ltx-fg-color:#000000;" mathcolor="#000000"><mrow><mfrac style="--ltx-fg-color:#000000;" mathcolor="#000000"><mn style="--ltx-fg-color:#000000;" mathcolor="#000000">1</mn><mi style="--ltx-fg-color:#000000;" mathcolor="#000000">M</mi></mfrac><mo lspace="0em" rspace="0em">​</mo><mrow><munderover><mo style="--ltx-fg-color:#000000;" mathcolor="#000000" movablelimits="false" rspace="0em">∑</mo><mrow><mi style="--ltx-fg-color:#000000;" mathcolor="#000000">j</mi><mo style="--ltx-fg-color:#000000;" mathcolor="#000000">=</mo><mn style="--ltx-fg-color:#000000;" mathcolor="#000000">1</mn></mrow><mi style="--ltx-fg-color:#000000;" mathcolor="#000000">M</mi></munderover><msup><mrow><mo style="--ltx-fg-color:#000000;" mathcolor="#000000" stretchy="false">(</mo><mrow><msub><mi style="--ltx-fg-color:#000000;" mathcolor="#000000">r</mi><mi style="--ltx-fg-color:#000000;" mathcolor="#000000">j</mi></msub><mo style="--ltx-fg-color:#000000;" mathcolor="#000000">−</mo><msub><mi style="--ltx-fg-color:#000000;" mathcolor="#000000">μ</mi><mi style="--ltx-fg-color:#000000;" mathcolor="#000000">r</mi></msub></mrow><mo style="--ltx-fg-color:#000000;" mathcolor="#000000" stretchy="false">)</mo></mrow><mn style="--ltx-fg-color:#000000;" mathcolor="#000000">2</mn></msup></mrow></mrow></msqrt></mrow></mrow><mo style="--ltx-fg-color:#000000;" lspace="0em" mathcolor="#000000">.</mo></mrow><annotation encoding="application/x-tex">\tilde{A}_{j}=\frac{r_{j}-\mu_{r}}{\sigma_{r}},\quad\mu_{r}=\frac{1}{M}\sum_{j=1}^{M}r_{j},\quad\sigma_{r}=\sqrt{\frac{1}{M}\sum_{j=1}^{M}(r_{j}-\mu_{r})^{2}}.</annotation></semantics></math></span>
<span class="ltx_eqn_cell ltx_eqn_center_padright"></span>
<span rowspan="1" class="ltx_eqn_cell ltx_eqn_eqno ltx_align_middle ltx_align_right"><span class="ltx_tag ltx_tag_equation ltx_align_right">(4)</span></span></span></span>
</span>
<span id="A1.SS2.p1.pic1.2.2" class="ltx_p"><span id="A1.SS2.p1.pic1.2.2.1" class="ltx_text" style="--ltx-fg-color:#000000;">Here, <math id="A1.SS2.p1.pic1.m7" class="ltx_Math" alttext="\mu_{r}" display="inline" intent=":literal"><semantics><msub><mi style="--ltx-fg-color:#000000;" mathcolor="#000000">μ</mi><mi style="--ltx-fg-color:#000000;" mathcolor="#000000">r</mi></msub><annotation encoding="application/x-tex">\mu_{r}</annotation></semantics></math> and <math id="A1.SS2.p1.pic1.m8" class="ltx_Math" alttext="\sigma_{r}" display="inline" intent=":literal"><semantics><msub><mi style="--ltx-fg-color:#000000;" mathcolor="#000000">σ</mi><mi style="--ltx-fg-color:#000000;" mathcolor="#000000">r</mi></msub><annotation encoding="application/x-tex">\sigma_{r}</annotation></semantics></math> denote the mean and standard deviation of the rewards within the group, respectively. Let the importance ratio be defined as:</span></span>
<span id="A1.E5" class="ltx_equation ltx_eqn_table">

<span><span class="ltx_equation ltx_eqn_row ltx_align_baseline">
<span class="ltx_eqn_cell ltx_eqn_center_padleft"></span>
<span class="ltx_eqn_cell ltx_align_center"><math id="A1.E5.m1" class="ltx_Math" alttext="\varrho_{j}=\frac{\pi_{\phi}(y_{j}\mid q)}{\pi_{\text{ref}}(y_{j}\mid q)}." display="block" intent=":literal"><semantics><mrow><mrow><msub><mi style="--ltx-fg-color:#000000;" mathcolor="#000000">ϱ</mi><mi style="--ltx-fg-color:#000000;" mathcolor="#000000">j</mi></msub><mo style="--ltx-fg-color:#000000;" mathcolor="#000000">=</mo><mfrac style="--ltx-fg-color:#000000;" mathcolor="#000000"><mrow><msub><mi style="--ltx-fg-color:#000000;" mathcolor="#000000">π</mi><mi style="--ltx-fg-color:#000000;" mathcolor="#000000">ϕ</mi></msub><mo lspace="0em" rspace="0em">​</mo><mrow><mo style="--ltx-fg-color:#000000;" mathcolor="#000000" stretchy="false">(</mo><msub><mi style="--ltx-fg-color:#000000;" mathcolor="#000000">y</mi><mi style="--ltx-fg-color:#000000;" mathcolor="#000000">j</mi></msub><mo style="--ltx-fg-color:#000000;" fence="true" lspace="0em" mathcolor="#000000" rspace="0em">∣</mo><mi style="--ltx-fg-color:#000000;" mathcolor="#000000">q</mi><mo style="--ltx-fg-color:#000000;" mathcolor="#000000" stretchy="false">)</mo></mrow></mrow><mrow><msub><mi style="--ltx-fg-color:#000000;" mathcolor="#000000">π</mi><mtext style="--ltx-fg-color:#000000;" mathcolor="#000000">ref</mtext></msub><mo lspace="0em" rspace="0em">​</mo><mrow><mo style="--ltx-fg-color:#000000;" mathcolor="#000000" stretchy="false">(</mo><msub><mi style="--ltx-fg-color:#000000;" mathcolor="#000000">y</mi><mi style="--ltx-fg-color:#000000;" mathcolor="#000000">j</mi></msub><mo style="--ltx-fg-color:#000000;" fence="true" lspace="0em" mathcolor="#000000" rspace="0em">∣</mo><mi style="--ltx-fg-color:#000000;" mathcolor="#000000">q</mi><mo style="--ltx-fg-color:#000000;" mathcolor="#000000" stretchy="false">)</mo></mrow></mrow></mfrac></mrow><mo style="--ltx-fg-color:#000000;" lspace="0em" mathcolor="#000000">.</mo></mrow><annotation encoding="application/x-tex">\varrho_{j}=\frac{\pi_{\phi}(y_{j}\mid q)}{\pi_{\text{ref}}(y_{j}\mid q)}.</annotation></semantics></math></span>
<span class="ltx_eqn_cell ltx_eqn_center_padright"></span>
<span rowspan="1" class="ltx_eqn_cell ltx_eqn_eqno ltx_align_middle ltx_align_right"><span class="ltx_tag ltx_tag_equation ltx_align_right">(5)</span></span></span></span>
</span>
<span id="A1.SS2.p1.pic1.2.3" class="ltx_p"><span id="A1.SS2.p1.pic1.2.3.1" class="ltx_text" style="--ltx-fg-color:#000000;">The clipped surrogate objective of GRPO is formalized as:</span></span>
<span id="A1.E6" class="ltx_equation ltx_eqn_table">

<span><span class="ltx_equation ltx_eqn_row ltx_align_baseline">
<span class="ltx_eqn_cell ltx_eqn_center_padleft"></span>
<span class="ltx_eqn_cell ltx_align_center"><math id="A1.E6.m1" class="ltx_math_unparsed" alttext="\mathcal{L}_{\text{GRPO}}(\phi)=\mathbb{E}_{q\sim P,\{y_{j}\}\sim\pi_{\text{ref}}}\left[\frac{1}{M}\sum_{j=1}^{M}\min\left(\varrho_{j}\tilde{A}_{j},\,\operatorname{clip}(\varrho_{j},1-\epsilon,1+\epsilon)\tilde{A}_{j}\right)-\lambda\,D_{\mathrm{KL}}\!\left(\pi_{\phi}(\cdot\mid q)\,\|\,\pi_{\text{ref}}(\cdot\mid q)\right)\right]." display="block" intent=":literal"><semantics><mrow><msub><mi style="--ltx-fg-color:#000000;" class="ltx_font_mathcaligraphic" mathcolor="#000000">ℒ</mi><mtext style="--ltx-fg-color:#000000;" mathcolor="#000000">GRPO</mtext></msub><mrow><mo style="--ltx-fg-color:#000000;" mathcolor="#000000" stretchy="false">(</mo><mi style="--ltx-fg-color:#000000;" mathcolor="#000000">ϕ</mi><mo style="--ltx-fg-color:#000000;" mathcolor="#000000" stretchy="false">)</mo></mrow><mo style="--ltx-fg-color:#000000;" mathcolor="#000000">=</mo><msub><mi style="--ltx-fg-color:#000000;" mathcolor="#000000">𝔼</mi><mrow><mrow><mi style="--ltx-fg-color:#000000;" mathcolor="#000000">q</mi><mo style="--ltx-fg-color:#000000;" mathcolor="#000000">∼</mo><mi style="--ltx-fg-color:#000000;" mathcolor="#000000">P</mi></mrow><mo style="--ltx-fg-color:#000000;" mathcolor="#000000">,</mo><mrow><mrow><mo style="--ltx-fg-color:#000000;" mathcolor="#000000" stretchy="false">{</mo><msub><mi style="--ltx-fg-color:#000000;" mathcolor="#000000">y</mi><mi style="--ltx-fg-color:#000000;" mathcolor="#000000">j</mi></msub><mo style="--ltx-fg-color:#000000;" mathcolor="#000000" stretchy="false">}</mo></mrow><mo style="--ltx-fg-color:#000000;" mathcolor="#000000">∼</mo><msub><mi style="--ltx-fg-color:#000000;" mathcolor="#000000">π</mi><mtext style="--ltx-fg-color:#000000;" mathcolor="#000000">ref</mtext></msub></mrow></mrow></msub><mrow><mo style="--ltx-fg-color:#000000;" mathcolor="#000000">[</mo><mfrac style="--ltx-fg-color:#000000;" mathcolor="#000000"><mn style="--ltx-fg-color:#000000;" mathcolor="#000000">1</mn><mi style="--ltx-fg-color:#000000;" mathcolor="#000000">M</mi></mfrac><munderover><mo style="--ltx-fg-color:#000000;" mathcolor="#000000" movablelimits="false">∑</mo><mrow><mi style="--ltx-fg-color:#000000;" mathcolor="#000000">j</mi><mo style="--ltx-fg-color:#000000;" mathcolor="#000000">=</mo><mn style="--ltx-fg-color:#000000;" mathcolor="#000000">1</mn></mrow><mi style="--ltx-fg-color:#000000;" mathcolor="#000000">M</mi></munderover><mi style="--ltx-fg-color:#000000;" mathcolor="#000000">min</mi><mrow><mo style="--ltx-fg-color:#000000;" mathcolor="#000000">(</mo><msub><mi style="--ltx-fg-color:#000000;" mathcolor="#000000">ϱ</mi><mi style="--ltx-fg-color:#000000;" mathcolor="#000000">j</mi></msub><msub><mover accent="true"><mi style="--ltx-fg-color:#000000;" mathcolor="#000000">A</mi><mo>~</mo></mover><mi style="--ltx-fg-color:#000000;" mathcolor="#000000">j</mi></msub><mo style="--ltx-fg-color:#000000;" mathcolor="#000000" rspace="0.337em">,</mo><mi style="--ltx-fg-color:#000000;" mathcolor="#000000">clip</mi><mrow><mo style="--ltx-fg-color:#000000;" mathcolor="#000000" stretchy="false">(</mo><msub><mi style="--ltx-fg-color:#000000;" mathcolor="#000000">ϱ</mi><mi style="--ltx-fg-color:#000000;" mathcolor="#000000">j</mi></msub><mo style="--ltx-fg-color:#000000;" mathcolor="#000000">,</mo><mn style="--ltx-fg-color:#000000;" mathcolor="#000000">1</mn><mo style="--ltx-fg-color:#000000;" mathcolor="#000000">−</mo><mi style="--ltx-fg-color:#000000;" mathcolor="#000000">ϵ</mi><mo style="--ltx-fg-color:#000000;" mathcolor="#000000">,</mo><mn style="--ltx-fg-color:#000000;" mathcolor="#000000">1</mn><mo style="--ltx-fg-color:#000000;" mathcolor="#000000">+</mo><mi style="--ltx-fg-color:#000000;" mathcolor="#000000">ϵ</mi><mo style="--ltx-fg-color:#000000;" mathcolor="#000000" stretchy="false">)</mo></mrow><msub><mover accent="true"><mi style="--ltx-fg-color:#000000;" mathcolor="#000000">A</mi><mo>~</mo></mover><mi style="--ltx-fg-color:#000000;" mathcolor="#000000">j</mi></msub><mo style="--ltx-fg-color:#000000;" mathcolor="#000000">)</mo></mrow><mo style="--ltx-fg-color:#000000;" mathcolor="#000000">−</mo><mi style="--ltx-fg-color:#000000;" mathcolor="#000000">λ</mi><msub><mi style="--ltx-fg-color:#000000;" mathcolor="#000000">D</mi><mi style="--ltx-fg-color:#000000;" mathcolor="#000000">KL</mi></msub><mrow><mo style="--ltx-fg-color:#000000;" mathcolor="#000000">(</mo><msub><mi style="--ltx-fg-color:#000000;" mathcolor="#000000">π</mi><mi style="--ltx-fg-color:#000000;" mathcolor="#000000">ϕ</mi></msub><mrow><mo style="--ltx-fg-color:#000000;" mathcolor="#000000" stretchy="false">(</mo><mo style="--ltx-fg-color:#000000;" lspace="0em" mathcolor="#000000" rspace="0em">⋅</mo><mo style="--ltx-fg-color:#000000;" lspace="0em" mathcolor="#000000" rspace="0.167em">∣</mo><mi style="--ltx-fg-color:#000000;" mathcolor="#000000">q</mi><mo style="--ltx-fg-color:#000000;" mathcolor="#000000" stretchy="false">)</mo></mrow><mo style="--ltx-fg-color:#000000;" lspace="0.170em" mathcolor="#000000" rspace="0.337em">∥</mo><msub><mi style="--ltx-fg-color:#000000;" mathcolor="#000000">π</mi><mtext style="--ltx-fg-color:#000000;" mathcolor="#000000">ref</mtext></msub><mrow><mo style="--ltx-fg-color:#000000;" mathcolor="#000000" stretchy="false">(</mo><mo style="--ltx-fg-color:#000000;" lspace="0em" mathcolor="#000000" rspace="0em">⋅</mo><mo style="--ltx-fg-color:#000000;" lspace="0em" mathcolor="#000000" rspace="0.167em">∣</mo><mi style="--ltx-fg-color:#000000;" mathcolor="#000000">q</mi><mo style="--ltx-fg-color:#000000;" mathcolor="#000000" stretchy="false">)</mo></mrow><mo style="--ltx-fg-color:#000000;" mathcolor="#000000">)</mo></mrow><mo style="--ltx-fg-color:#000000;" mathcolor="#000000">]</mo></mrow><mo style="--ltx-fg-color:#000000;" lspace="0em" mathcolor="#000000">.</mo></mrow><annotation encoding="application/x-tex">\mathcal{L}_{\text{GRPO}}(\phi)=\mathbb{E}_{q\sim P,\{y_{j}\}\sim\pi_{\text{ref}}}\left[\frac{1}{M}\sum_{j=1}^{M}\min\left(\varrho_{j}\tilde{A}_{j},\,\operatorname{clip}(\varrho_{j},1-\epsilon,1+\epsilon)\tilde{A}_{j}\right)-\lambda\,D_{\mathrm{KL}}\!\left(\pi_{\phi}(\cdot\mid q)\,\|\,\pi_{\text{ref}}(\cdot\mid q)\right)\right].</annotation></semantics></math></span>
<span class="ltx_eqn_cell ltx_eqn_center_padright"></span>
<span rowspan="1" class="ltx_eqn_cell ltx_eqn_eqno ltx_align_middle ltx_align_right"><span class="ltx_tag ltx_tag_equation ltx_align_right">(6)</span></span></span></span>
</span>
</span></span></span></foreignobject></g></g></svg>