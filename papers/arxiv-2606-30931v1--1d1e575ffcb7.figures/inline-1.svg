<svg id="p2.pic1" class="ltx_picture" height="945.59" overflow="visible" version="1.1" viewbox="0 0 550 945.59" width="550"><g style="--ltx-stroke-color:#000000;--ltx-fill-color:#000000;" fill="#000000" stroke="#000000" stroke-width="0.4pt" transform="translate(0,945.59) matrix(1 0 0 -1 0 0)"><g style="--ltx-fill-color:#F0F0F0;" fill="#F0F0F0" fill-opacity="1.0"><path style="stroke:none" d="M 0 11.81 L 0 933.78 C 0 940.3 5.29 945.59 11.81 945.59 L 538.19 945.59 C 544.71 945.59 550 940.3 550 933.78 L 550 11.81 C 550 5.29 544.71 0 538.19 0 L 11.81 0 C 5.29 0 0 5.29 0 11.81 Z" /></g><g style="--ltx-fill-color:#F0F0F0;" fill="#F0F0F0" fill-opacity="1.0"><path style="stroke:none" d="M 0 11.81 L 0 933.78 C 0 940.3 5.29 945.59 11.81 945.59 L 538.19 945.59 C 544.71 945.59 550 940.3 550 933.78 L 550 11.81 C 550 5.29 544.71 0 538.19 0 L 11.81 0 C 5.29 0 0 5.29 0 11.81 Z" /></g><g fill-opacity="1.0" transform="matrix(1.0 0.0 0.0 1.0 27.56 23.62)"><foreignobject style="--ltx-fo-width:35.77em;--ltx-fo-height:64.92em;--ltx-fo-depth:0em;font-size:10pt;" height="898.35" overflow="visible" transform="matrix(1 0 0 -1 0 898.35)" width="494.96"><span class="ltx_foreignobject_container"><span class="ltx_foreignobject_content"><span id="p2.pic1.1" class="ltx_inline-logical-block ltx_minipage ltx_align_bottom" style="width:35.77em;">
<span id="p2.pic1.p1" class="ltx_para ltx_noindent">
<span id="p2.pic1.p1.1" class="ltx_p"><span id="p2.pic1.p1.1.1" class="ltx_text ltx_font_bold" style="--ltx-fg-color:#000000;">Abstract.</span></span>
</span>
<span id="p2.pic1.p2" class="ltx_para ltx_noindent">
<span id="p2.pic1.p2.1" class="ltx_p"><span id="p2.pic1.p2.1.1" class="ltx_text" style="--ltx-fg-color:#000000;">The LLM Jury, a </span><em id="p2.pic1.p2.1.2" class="ltx_emph ltx_font_italic" style="--ltx-fg-color:#000000;">Panel of LLM Evaluators</em><span id="p2.pic1.p2.1.3" class="ltx_text" style="--ltx-fg-color:#000000;">
(</span><span id="p2.pic1.p2.1.4" class="ltx_text ltx_font_smallcaps" style="--ltx-fg-color:#000000;">PoLL</span><span id="p2.pic1.p2.1.5" class="ltx_text" style="--ltx-fg-color:#000000;">) </span><cite class="ltx_cite ltx_citemacro_citep"><span id="p2.pic1.p2.1.6" class="ltx_text" style="--ltx-fg-color:#000000;">(</span><a href="#bib.bib5" title class="ltx_ref">Verga et al., 2024</a><span id="p2.pic1.p2.1.8" class="ltx_text" style="--ltx-fg-color:#000000;">)</span></cite><span id="p2.pic1.p2.1.9" class="ltx_text" style="--ltx-fg-color:#000000;"> reporting consensus
scores, has become a practical alternative to single judge LLM
evaluation, yet its statistical behaviour remains poorly
understood.
We formalize the LLM Jury setup under the Huber contamination model,
and show that </span><span id="p2.pic1.p2.1.10" class="ltx_text ltx_font_smallcaps" style="--ltx-fg-color:#000000;">PoLL</span><span id="p2.pic1.p2.1.11" class="ltx_text" style="--ltx-fg-color:#000000;"> incurs unbounded bias under any positive
contamination, regardless of jury size, whenever a single judge
fails in a biased, LLM-typical way (mode collapse, sycophancy,
safety refusal).
We frame the jury consensus problem as an instance of classical
robust mean estimation and
propose </span><span id="p2.pic1.p2.1.12" class="ltx_text ltx_font_smallcaps" style="--ltx-fg-color:#000000;">RoPoLL</span><span id="p2.pic1.p2.1.13" class="ltx_text" style="--ltx-fg-color:#000000;"> (</span><span id="p2.pic1.p2.1.14" class="ltx_text ltx_font_bold" style="--ltx-fg-color:#000000;">Ro</span><span id="p2.pic1.p2.1.15" class="ltx_text" style="--ltx-fg-color:#000000;">bust </span><span id="p2.pic1.p2.1.16" class="ltx_text ltx_font_bold" style="--ltx-fg-color:#000000;">P</span><span id="p2.pic1.p2.1.17" class="ltx_text" style="--ltx-fg-color:#000000;">anel
</span><span id="p2.pic1.p2.1.18" class="ltx_text ltx_font_bold" style="--ltx-fg-color:#000000;">o</span><span id="p2.pic1.p2.1.19" class="ltx_text" style="--ltx-fg-color:#000000;">f </span><span id="p2.pic1.p2.1.20" class="ltx_text ltx_font_bold" style="--ltx-fg-color:#000000;">LL</span><span id="p2.pic1.p2.1.21" class="ltx_text" style="--ltx-fg-color:#000000;">M-as-Judge), which preserves the
</span><span id="p2.pic1.p2.1.22" class="ltx_text ltx_font_smallcaps" style="--ltx-fg-color:#000000;">PoLL</span><span id="p2.pic1.p2.1.23" class="ltx_text" style="--ltx-fg-color:#000000;"> panel and substitutes the aggregation function with a robust mean estimator.
Among classical robust estimators, we instantiate </span><span id="p2.pic1.p2.1.24" class="ltx_text ltx_font_smallcaps" style="--ltx-fg-color:#000000;">RoPoLL</span><span id="p2.pic1.p2.1.25" class="ltx_text" style="--ltx-fg-color:#000000;">
with the geometric median (GM), a tuning-free,
joint-distance-preserving mean estimator that yields the optimal finite-sample breakdown
point </span><math id="p2.pic1.p2.m1" class="ltx_Math" alttext="1/2" display="inline" intent=":literal"><semantics><mrow><mn style="--ltx-fg-color:#000000;" mathcolor="#000000">1</mn><mo style="--ltx-fg-color:#000000;" mathcolor="#000000">/</mo><mn style="--ltx-fg-color:#000000;" mathcolor="#000000">2</mn></mrow><annotation encoding="application/x-tex">1/2</annotation></semantics></math><span id="p2.pic1.p2.1.26" class="ltx_text" style="--ltx-fg-color:#000000;">.
We establish a finite-sample error bound and an
information-theoretic minimax lower bound that match on the
parametric rate </span><math id="p2.pic1.p2.m2" class="ltx_Math" alttext="\sigma\sqrt{d/N}" display="inline" intent=":literal"><semantics><mrow><mi style="--ltx-fg-color:#000000;" mathcolor="#000000">σ</mi><mo lspace="0em" rspace="0em">​</mo><msqrt style="--ltx-fg-color:#000000;" mathcolor="#000000"><mrow><mi style="--ltx-fg-color:#000000;" mathcolor="#000000">d</mi><mo style="--ltx-fg-color:#000000;" mathcolor="#000000">/</mo><mi style="--ltx-fg-color:#000000;" mathcolor="#000000">N</mi></mrow></msqrt></mrow><annotation encoding="application/x-tex">\sigma\sqrt{d/N}</annotation></semantics></math><span id="p2.pic1.p2.1.27" class="ltx_text" style="--ltx-fg-color:#000000;"> and differ on the breakdown
floor by a factor of </span><math id="p2.pic1.p2.m3" class="ltx_Math" alttext="\sqrt{d}" display="inline" intent=":literal"><semantics><msqrt style="--ltx-fg-color:#000000;" mathcolor="#000000"><mi style="--ltx-fg-color:#000000;" mathcolor="#000000">d</mi></msqrt><annotation encoding="application/x-tex">\sqrt{d}</annotation></semantics></math><span id="p2.pic1.p2.1.28" class="ltx_text" style="--ltx-fg-color:#000000;"> – a
statistical-computational gap that polynomial-time </span><span id="p2.pic1.p2.1.29" class="ltx_text ltx_font_smallcaps" style="--ltx-fg-color:#000000;">RoPoLL</span><span id="p2.pic1.p2.1.30" class="ltx_text" style="--ltx-fg-color:#000000;">
pays relative to the (intractable) Tukey halfspace median.
Across </span><math id="p2.pic1.p2.m4" class="ltx_Math" alttext="13" display="inline" intent=":literal"><semantics><mn style="--ltx-fg-color:#000000;" mathcolor="#000000">13</mn><annotation encoding="application/x-tex">13</annotation></semantics></math><span id="p2.pic1.p2.1.31" class="ltx_text" style="--ltx-fg-color:#000000;"> open-weight judges (</span><math id="p2.pic1.p2.m5" class="ltx_Math" alttext="4" display="inline" intent=":literal"><semantics><mn style="--ltx-fg-color:#000000;" mathcolor="#000000">4</mn><annotation encoding="application/x-tex">4</annotation></semantics></math><span id="p2.pic1.p2.1.32" class="ltx_text" style="--ltx-fg-color:#000000;"> B–</span><math id="p2.pic1.p2.m6" class="ltx_Math" alttext="675" display="inline" intent=":literal"><semantics><mn style="--ltx-fg-color:#000000;" mathcolor="#000000">675</mn><annotation encoding="application/x-tex">675</annotation></semantics></math><span id="p2.pic1.p2.1.33" class="ltx_text" style="--ltx-fg-color:#000000;"> B), three
reward-model benchmarks, and four corruption regimes at rates up
to </span><math id="p2.pic1.p2.m7" class="ltx_Math" alttext="50\%" display="inline" intent=":literal"><semantics><mrow><mn style="--ltx-fg-color:#000000;" mathcolor="#000000">50</mn><mo style="--ltx-fg-color:#000000;" mathcolor="#000000">%</mo></mrow><annotation encoding="application/x-tex">50\%</annotation></semantics></math><span id="p2.pic1.p2.1.34" class="ltx_text" style="--ltx-fg-color:#000000;">, </span><span id="p2.pic1.p2.1.35" class="ltx_text ltx_font_smallcaps" style="--ltx-fg-color:#000000;">RoPoLL</span><span id="p2.pic1.p2.1.36" class="ltx_text" style="--ltx-fg-color:#000000;"> dominates </span><span id="p2.pic1.p2.1.37" class="ltx_text ltx_font_smallcaps" style="--ltx-fg-color:#000000;">PoLL</span><span id="p2.pic1.p2.1.38" class="ltx_text" style="--ltx-fg-color:#000000;"> on every biased
corruption type: by </span><math id="p2.pic1.p2.m8" class="ltx_Math" alttext="\approx 19\%" display="inline" intent=":literal"><semantics><mrow><mphantom></mphantom><mo style="--ltx-fg-color:#000000;" mathcolor="#000000">≈</mo><mrow><mn style="--ltx-fg-color:#000000;" mathcolor="#000000">19</mn><mo style="--ltx-fg-color:#000000;" mathcolor="#000000">%</mo></mrow></mrow><annotation encoding="application/x-tex">\approx 19\%</annotation></semantics></math><span id="p2.pic1.p2.1.39" class="ltx_text" style="--ltx-fg-color:#000000;"> on cross-dimensional attacks at
matched compute, and by orders of magnitude on heavy-tailed
Byzantine adversaries (whose unbounded first moments make any
breakdown-positive aggregator beat averaging unconditionally).
A </span><math id="p2.pic1.p2.m9" class="ltx_Math" alttext="3" display="inline" intent=":literal"><semantics><mn style="--ltx-fg-color:#000000;" mathcolor="#000000">3</mn><annotation encoding="application/x-tex">3</annotation></semantics></math><span id="p2.pic1.p2.1.40" class="ltx_text" style="--ltx-fg-color:#000000;">-judge </span><span id="p2.pic1.p2.1.41" class="ltx_text ltx_font_smallcaps" style="--ltx-fg-color:#000000;">RoPoLL</span><span id="p2.pic1.p2.1.42" class="ltx_text" style="--ltx-fg-color:#000000;"> committee at </span><math id="p2.pic1.p2.m10" class="ltx_Math" alttext="38" display="inline" intent=":literal"><semantics><mn style="--ltx-fg-color:#000000;" mathcolor="#000000">38</mn><annotation encoding="application/x-tex">38</annotation></semantics></math><span id="p2.pic1.p2.1.43" class="ltx_text" style="--ltx-fg-color:#000000;"> B beats
Mistral-Large-3 (</span><math id="p2.pic1.p2.m11" class="ltx_Math" alttext="675" display="inline" intent=":literal"><semantics><mn style="--ltx-fg-color:#000000;" mathcolor="#000000">675</mn><annotation encoding="application/x-tex">675</annotation></semantics></math><span id="p2.pic1.p2.1.44" class="ltx_text" style="--ltx-fg-color:#000000;"> B) by </span><math id="p2.pic1.p2.m12" class="ltx_math_unparsed" alttext="1.31\times" display="inline" intent=":literal"><semantics><mrow><mn style="--ltx-fg-color:#000000;" mathcolor="#000000">1.31</mn><mo style="--ltx-fg-color:#000000;" lspace="0.222em" mathcolor="#000000">×</mo></mrow><annotation encoding="application/x-tex">1.31\times</annotation></semantics></math><span id="p2.pic1.p2.1.45" class="ltx_text" style="--ltx-fg-color:#000000;"> on HelpSteer-2 under
</span><math id="p2.pic1.p2.m13" class="ltx_Math" alttext="30\%" display="inline" intent=":literal"><semantics><mrow><mn style="--ltx-fg-color:#000000;" mathcolor="#000000">30</mn><mo style="--ltx-fg-color:#000000;" mathcolor="#000000">%</mo></mrow><annotation encoding="application/x-tex">30\%</annotation></semantics></math><span id="p2.pic1.p2.1.46" class="ltx_text" style="--ltx-fg-color:#000000;"> </span><span id="p2.pic1.p2.1.47" class="ltx_text ltx_font_typewriter" style="--ltx-fg-color:#000000;">bimodal-random</span><span id="p2.pic1.p2.1.48" class="ltx_text" style="--ltx-fg-color:#000000;"> corruption – an </span><math id="p2.pic1.p2.m14" class="ltx_math_unparsed" alttext="18\times" display="inline" intent=":literal"><semantics><mrow><mn style="--ltx-fg-color:#000000;" mathcolor="#000000">18</mn><mo style="--ltx-fg-color:#000000;" lspace="0.222em" mathcolor="#000000">×</mo></mrow><annotation encoding="application/x-tex">18\times</annotation></semantics></math><span id="p2.pic1.p2.1.49" class="ltx_text" style="--ltx-fg-color:#000000;"> parameter
advantage with strictly better accuracy.
A Noisy-GT control confirms the premium is paid against
</span><em id="p2.pic1.p2.1.50" class="ltx_emph ltx_font_italic" style="--ltx-fg-color:#000000;">biased</em><span id="p2.pic1.p2.1.51" class="ltx_text" style="--ltx-fg-color:#000000;"> contamination, not benign Gaussian imprecision (where
</span><span id="p2.pic1.p2.1.52" class="ltx_text ltx_font_smallcaps" style="--ltx-fg-color:#000000;">PoLL</span><span id="p2.pic1.p2.1.53" class="ltx_text" style="--ltx-fg-color:#000000;"> is statistically optimal).
Overall, we establish that robust aggregation of a small, diverse committee is a
parameter-efficient and statistically principled alternative to
scaling a single large LLM-as-judge.</span></span>
</span>
<span id="p2.pic1.p3" class="ltx_para">
<span id="p2.pic1.p3.1" class="ltx_p ltx_minipage ltx_align_bottom" style="width:250.4pt;"><span id="p2.pic1.p3.1.1" class="ltx_text ltx_font_bold" style="--ltx-fg-color:#000000;">Correspondence:</span><span id="p2.pic1.p3.1.2" class="ltx_text" style="--ltx-fg-color:#000000;"> </span><span id="p2.pic1.p3.1.3" class="ltx_text ltx_font_typewriter ltx_framed ltx_framed_rectangle" style="--ltx-fg-color:#000000;--ltx-border-color:#000000;padding:3.0pt;">achanish@amazon.com</span></span>
