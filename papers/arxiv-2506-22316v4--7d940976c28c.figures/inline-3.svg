<span id="S3.F3.pic1.2.1" class="ltx_p"><span id="S3.F3.pic1.2.1.1" class="ltx_text ltx_font_typewriter" style="--ltx-fg-color:#000000;">###<span id="S3.F3.pic1.2.1.1.1" class="ltx_text ltx_font_serif"> Task Description:
</span></span></span>
<span id="S3.F3.pic1.2.2" class="ltx_p"><span id="S3.F3.pic1.2.2.1" class="ltx_text" style="--ltx-fg-color:#000000;">An instruction (might include an Input inside it), a response to evaluate, <span id="S3.F3.pic1.2.2.1.1" class="ltx_text" style="--ltx-fg-color:#FF0000;">a reference answer that gets a score of 5,</span> and a score rubric representing a evaluation criteria are given.</span></span>
<span id="S3.F3.pic1.2.3" class="ltx_p"><span id="S3.F3.pic1.2.3.1" class="ltx_text" style="--ltx-fg-color:#000000;">1. Write a detailed feedback that assess the quality of the response strictly based on the given score rubric, not evaluating in general.</span></span>
<span id="S3.F3.pic1.2.4" class="ltx_p"><span id="S3.F3.pic1.2.4.1" class="ltx_text" style="--ltx-fg-color:#000000;">2. After writing a feedback, write a score that is <span id="S3.F3.pic1.2.4.1.1" class="ltx_text" style="--ltx-fg-color:#FF0000;">an integer between 1 and 5</span>. You should refer to the score rubric.</span></span>
<span id="S3.F3.pic1.2.5" class="ltx_p"><span id="S3.F3.pic1.2.5.1" class="ltx_text" style="--ltx-fg-color:#000000;">3. The output format should look as follows: “Feedback: (write a feedback for criteria) [RESULT] <span id="S3.F3.pic1.2.5.1.1" class="ltx_text" style="--ltx-fg-color:#FF0000;">(an integer number between 1 and 5)</span>”</span></span>
<span id="S3.F3.pic1.2.6" class="ltx_p"><span id="S3.F3.pic1.2.6.1" class="ltx_text" style="--ltx-fg-color:#000000;">4. Please do not generate any other opening, closing, and explanations.</span></span>
<span id="S3.F3.pic1.2.7" class="ltx_p"><span id="S3.F3.pic1.2.7.1" class="ltx_text ltx_font_typewriter" style="--ltx-fg-color:#FF0000;">###<span id="S3.F3.pic1.2.7.1.1" class="ltx_text ltx_font_serif"> Reference Answer (Score 5):<span id="S3.F3.pic1.2.7.1.1.1" class="ltx_text" style="--ltx-fg-color:#000000;">
</span></span></span></span>
<span id="S3.F3.pic1.2.8" class="ltx_p"><span id="S3.F3.pic1.2.8.1" class="ltx_text ltx_font_typewriter" style="--ltx-fg-color:#FF0000;">{orig_reference_answer}</span><span id="S3.F3.pic1.2.8.2" class="ltx_text"></span></span>
