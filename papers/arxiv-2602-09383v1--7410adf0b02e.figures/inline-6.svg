<svg id="A8.p2.pic1" class="ltx_picture" height="773.22" overflow="visible" version="1.1" viewbox="0 0 550 773.22" width="550"><g style="--ltx-stroke-color:#000000;--ltx-fill-color:#000000;" fill="#000000" stroke="#000000" stroke-width="0.4pt" transform="translate(0,773.22) matrix(1 0 0 -1 0 0)"><g style="--ltx-fill-color:#D9B841;" fill="#D9B841" fill-opacity="1.0"><path style="stroke:none" d="M 0 5.91 L 0 767.32 C 0 770.58 2.64 773.22 5.91 773.22 L 544.09 773.22 C 547.36 773.22 550 770.58 550 767.32 L 550 5.91 C 550 2.64 547.36 0 544.09 0 L 5.91 0 C 2.64 0 0 2.64 0 5.91 Z" /></g><g style="--ltx-fill-color:#FFFFFA;" fill="#FFFFFA" fill-opacity="1.0"><path style="stroke:none" d="M 1.97 5.91 L 1.97 749.11 L 548.03 749.11 L 548.03 5.91 C 548.03 3.73 546.27 1.97 544.09 1.97 L 5.91 1.97 C 3.73 1.97 1.97 3.73 1.97 5.91 Z" /></g><g fill-opacity="1.0" transform="matrix(1.0 0.0 0.0 1.0 5.91 757.71)"><foreignobject style="--ltx-fo-width:33.83em;--ltx-fo-height:0.69em;--ltx-fo-depth:0.19em;font-size:10pt;" height="12.3" overflow="visible" transform="matrix(1 0 0 -1 0 9.61)" width="468.11"><span class="ltx_foreignobject_container"><span class="ltx_foreignobject_content">
<span id="A8.p2.pic1.1" class="ltx_inline-block ltx_minipage ltx_align_bottom" style="width:33.83em;">
<span id="A8.p2.pic1.1.1" class="ltx_p"><span id="A8.p2.pic1.1.1.1" class="ltx_text ltx_font_bold" style="--ltx-fg-color:#FFFFFF;">The Initial Basic Biases Library Used in Our Work</span></span>
</span></span></span></foreignobject></g><g fill-opacity="1.0" transform="matrix(1.0 0.0 0.0 1.0 5.91 712.47)"><foreignobject style="--ltx-fo-width:38.9em;--ltx-fo-height:1.79em;--ltx-fo-depth:50.49em;font-size:10pt;" height="723.53" overflow="visible" transform="matrix(1 0 0 -1 0 24.83)" width="538.27"><span class="ltx_foreignobject_container"><span class="ltx_foreignobject_content">
<span id="A8.p2.pic1.2" class="ltx_inline-block ltx_minipage ltx_align_bottom" style="width:38.9em;">
<span id="A8.I1" class="ltx_itemize" style="--ltx-enum-leftmargin:5mm;">
<span id="A8.I1.i1" class="ltx_item" style="list-style-type:none;"><span class="ltx_tag ltx_tag_item"><math id="A8.I1.i1.m1" class="ltx_Math" alttext="\triangleright" display="inline" intent=":literal"><semantics><mo>⊳</mo><annotation encoding="application/x-tex">\triangleright</annotation></semantics></math></span> 
<span id="A8.I1.i1.p1" class="ltx_para ltx_noindent">
<span id="A8.I1.i1.p1.1" class="ltx_p"><span id="A8.I1.i1.p1.1.1" class="ltx_text ltx_font_bold" style="--ltx-fg-color:#000000;">Length Bias</span><span id="A8.I1.i1.p1.1.2" class="ltx_text" style="--ltx-fg-color:#000000;">: Refers to the tendency of large language models (LLMs) to prefer longer (or shorter) generated outputs when evaluating text quality, while disregarding the actual content quality or relevance.</span></span>
</span></span>
<span id="A8.I1.i2" class="ltx_item" style="list-style-type:none;"><span class="ltx_tag ltx_tag_item"><math id="A8.I1.i2.m1" class="ltx_Math" alttext="\triangleright" display="inline" intent=":literal"><semantics><mo>⊳</mo><annotation encoding="application/x-tex">\triangleright</annotation></semantics></math></span> 
<span id="A8.I1.i2.p1" class="ltx_para ltx_noindent">
<span id="A8.I1.i2.p1.1" class="ltx_p"><span id="A8.I1.i2.p1.1.1" class="ltx_text ltx_font_bold" style="--ltx-fg-color:#000000;">Positional Bias</span><span id="A8.I1.i2.p1.1.2" class="ltx_text" style="--ltx-fg-color:#000000;">: Refers to the systematic preference of LLMs toward information in specific positions (e.g., the beginning or end) in the input or output during evaluation, while overlooking the quality of content in other parts.</span></span>
</span></span>
<span id="A8.I1.i3" class="ltx_item" style="list-style-type:none;"><span class="ltx_tag ltx_tag_item"><math id="A8.I1.i3.m1" class="ltx_Math" alttext="\triangleright" display="inline" intent=":literal"><semantics><mo>⊳</mo><annotation encoding="application/x-tex">\triangleright</annotation></semantics></math></span> 
<span id="A8.I1.i3.p1" class="ltx_para ltx_noindent">
<span id="A8.I1.i3.p1.1" class="ltx_p"><span id="A8.I1.i3.p1.1.1" class="ltx_text ltx_font_bold" style="--ltx-fg-color:#000000;">Authority Bias</span><span id="A8.I1.i3.p1.1.2" class="ltx_text" style="--ltx-fg-color:#000000;">: In LLM-as-a-judge evaluations, the model tends to over-rely on authoritative sources (e.g., celebrities, institutions, cited literature) or authoritative phrasing (e.g., ”studies show,” ”experts believe”) as a basis for quality assessment, while disregarding the actual logical coherence, factual accuracy, or relevance of the content.</span></span>
</span></span>
<span id="A8.I1.i4" class="ltx_item" style="list-style-type:none;"><span class="ltx_tag ltx_tag_item"><math id="A8.I1.i4.m1" class="ltx_Math" alttext="\triangleright" display="inline" intent=":literal"><semantics><mo>⊳</mo><annotation encoding="application/x-tex">\triangleright</annotation></semantics></math></span> 
<span id="A8.I1.i4.p1" class="ltx_para ltx_noindent">
<span id="A8.I1.i4.p1.1" class="ltx_p"><span id="A8.I1.i4.p1.1.1" class="ltx_text ltx_font_bold" style="--ltx-fg-color:#000000;">Compassion Fade Bias </span><span id="A8.I1.i4.p1.1.2" class="ltx_text" style="--ltx-fg-color:#000000;">: In LLM-as-a-judge evaluations, the model exhibits systematic differences in its assessment of identical content depending on whether well-known model names (e.g., GPT-4, Claude) or anonymous identifiers are mentioned. This bias reflects the model’s implicit preference or discrimination toward ”authoritative models” or ”brand effects,” analogous to compassion fade in human psychology (reduced attention toward anonymous individuals).</span></span>
</span></span>
<span id="A8.I1.i5" class="ltx_item" style="list-style-type:none;"><span class="ltx_tag ltx_tag_item"><math id="A8.I1.i5.m1" class="ltx_Math" alttext="\triangleright" display="inline" intent=":literal"><semantics><mo>⊳</mo><annotation encoding="application/x-tex">\triangleright</annotation></semantics></math></span> 
<span id="A8.I1.i5.p1" class="ltx_para ltx_noindent">
<span id="A8.I1.i5.p1.1" class="ltx_p"><span id="A8.I1.i5.p1.1.1" class="ltx_text ltx_font_bold" style="--ltx-fg-color:#000000;">Fallacy-Oversight Bias</span><span id="A8.I1.i5.p1.1.2" class="ltx_text" style="--ltx-fg-color:#000000;">: In LLM-as-a-judge evaluations, the model tends to focus solely on the correctness of the final conclusion while overlooking logical fallacies in the reasoning process (e.g., equivocation, false causality, circular reasoning). This bias leads the model to potentially assign high scores to responses with ”correct conclusions but flawed reasoning” while undervaluing those with ”incorrect conclusions but valid logic.”</span></span>
</span></span>
<span id="A8.I1.i6" class="ltx_item" style="list-style-type:none;"><span class="ltx_tag ltx_tag_item"><math id="A8.I1.i6.m1" class="ltx_Math" alttext="\triangleright" display="inline" intent=":literal"><semantics><mo>⊳</mo><annotation encoding="application/x-tex">\triangleright</annotation></semantics></math></span> 
<span id="A8.I1.i6.p1" class="ltx_para ltx_noindent">
<span id="A8.I1.i6.p1.1" class="ltx_p"><span id="A8.I1.i6.p1.1.1" class="ltx_text ltx_font_bold" style="--ltx-fg-color:#000000;">Sentiment Bias </span><span id="A8.I1.i6.p1.1.2" class="ltx_text" style="--ltx-fg-color:#000000;">: In LLM-as-a-judge evaluations, the model exhibits systematic preference towards positive or negative sentiments expressed in texts, thereby compromising its objective assessment of content quality. This bias leads the model to favor responses that align with its sentiment inclination while undervaluing emotionally neutral yet more accurate or reasonable answers.</span></span>
</span></span>
<span id="A8.I1.i7" class="ltx_item" style="list-style-type:none;"><span class="ltx_tag ltx_tag_item"><math id="A8.I1.i7.m1" class="ltx_Math" alttext="\triangleright" display="inline" intent=":literal"><semantics><mo>⊳</mo><annotation encoding="application/x-tex">\triangleright</annotation></semantics></math></span> 
<span id="A8.I1.i7.p1" class="ltx_para">
<span id="A8.I1.i7.p1.1" class="ltx_p"><span id="A8.I1.i7.p1.1.1" class="ltx_text ltx_font_bold" style="--ltx-fg-color:#000000;">Refinement-Aware Bias</span><span id="A8.I1.i7.p1.1.2" class="ltx_text" style="--ltx-fg-color:#000000;">: In LLM-as-a-judge evaluations, when the model is informed that a text is an ”optimized” or ”revised” version (e.g., ”this has been polished by experts” or ”this is the third improved draft”), its evaluation criteria undergo systematic changes, leading to inconsistent ratings for identical content with versus without refinement labels. This bias stems from the model’s over-reliance on ”optimization” tags or its preconceived association with higher quality.</span></span>
</span></span>
</span>
</span></span></span></foreignobject></g></g></svg>