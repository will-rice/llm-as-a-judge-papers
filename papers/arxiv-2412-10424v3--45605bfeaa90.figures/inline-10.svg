<br class="ltx_break">You are given a question, a reference solution, and the model’s output, which is broken down into atomic fact units, along with their correctness and justification. The model has revised the incorrect parts of its original output, and these revisions are provided in the model’s correction statement.</span></span></span>
<span id="A4.SS2.SSS1.p4.pic1.2.2" class="ltx_p"><span id="A4.SS2.SSS1.p4.pic1.2.2.1" class="ltx_text" style="--ltx-fg-color:#000000;">Your task is to update the model’s original output by replacing the corresponding revised facts with those found in the model’s correction statement. Ensure that updated facts are from the model’s correction statement, not the reference solution. For facts that were not revised, maintain the same content and correctness as before, so that your output contains the same number of atomic facts as the model’s original output.</span></span>
