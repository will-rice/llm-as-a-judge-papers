<span id="A1.SS4.SSS0.Px1.p4.pic1.2" class="ltx_inline-block ltx_minipage ltx_align_bottom" style="width:16.34em;">
<span id="A1.SS4.SSS0.Px1.p4.pic1.2.1" class="ltx_p"><span id="A1.SS4.SSS0.Px1.p4.pic1.2.1.1" class="ltx_text" style="font-size:90%;--ltx-fg-color:#000000;">On E2E at epsilon <math id="A1.SS4.SSS0.Px1.p4.pic1.m1" class="ltx_Math" alttext="=8" display="inline" intent=":literal"><semantics><mrow><mphantom></mphantom><mo style="--ltx-fg-color:#000000;" mathcolor="#000000">=</mo><mn style="--ltx-fg-color:#000000;" mathcolor="#000000">8</mn></mrow><annotation encoding="application/x-tex">=8</annotation></semantics></math>, their extra DP-SGD experiment used learning rate <math id="A1.SS4.SSS0.Px1.p4.pic1.m2" class="ltx_Math" alttext="3" display="inline" intent=":literal"><semantics><mn style="--ltx-fg-color:#000000;" mathcolor="#000000">3</mn><annotation encoding="application/x-tex">3</annotation></semantics></math> and clipping norm <math id="A1.SS4.SSS0.Px1.p4.pic1.m3" class="ltx_Math" alttext="0.1" display="inline" intent=":literal"><semantics><mn style="--ltx-fg-color:#000000;" mathcolor="#000000">0.1</mn><annotation encoding="application/x-tex">0.1</annotation></semantics></math> and reached BLEU <math id="A1.SS4.SSS0.Px1.p4.pic1.m4" class="ltx_Math" alttext="63.17" display="inline" intent=":literal"><semantics><mn style="--ltx-fg-color:#000000;" mathcolor="#000000">63.17</mn><annotation encoding="application/x-tex">63.17</annotation></semantics></math> over <math id="A1.SS4.SSS0.Px1.p4.pic1.m5" class="ltx_Math" alttext="3" display="inline" intent=":literal"><semantics><mn style="--ltx-fg-color:#000000;" mathcolor="#000000">3</mn><annotation encoding="application/x-tex">3</annotation></semantics></math> seeds, which was on par with DP-Adam. DP-Adam itself was not claimed as the contribution, even though after the same subsampled Gaussian gradient privatization, Adam-style updates preserve privacy by post-processing. The contribution was applying known DP optimization effectively to full language-model fine-tuning, with the memory trick making it computationally practical. Also, the cited GPT-2 work did not privately fine-tune GPT-2 with DP-SGD; it fine-tuned GPT-2 non-privately…</span></span>
</span></span></span></foreignobject></g></g></svg>