<svg id="A3.pic2" class="ltx_picture ltx_centering" height="1332.94" overflow="visible" version="1.1" viewbox="0 0 653.15 1332.94" width="653.15"><g style="--ltx-stroke-color:#000000;--ltx-fill-color:#000000;" fill="#000000" stroke="#000000" stroke-width="0.4pt" transform="translate(0,1332.94) matrix(1 0 0 -1 0 0)"><g style="--ltx-fill-color:#000000;" fill="#000000" fill-opacity="1.0"><path style="stroke:none" d="M 0 8.7 L 0 1324.24 C 0 1329.04 3.9 1332.94 8.7 1332.94 L 644.45 1332.94 C 649.25 1332.94 653.15 1329.04 653.15 1324.24 L 653.15 8.7 C 653.15 3.9 649.25 0 644.45 0 L 8.7 0 C 3.9 0 0 3.9 0 8.7 Z" /></g><g style="--ltx-fill-color:#FBFBFB;" fill="#FBFBFB" fill-opacity="1.0"><path style="stroke:none" d="M 0.83 8.7 L 0.83 1311.11 L 652.32 1311.11 L 652.32 8.7 C 652.32 4.36 648.79 0.83 644.45 0.83 L 8.7 0.83 C 4.36 0.83 0.83 4.36 0.83 8.7 Z" /></g><g fill-opacity="1.0" transform="matrix(1.0 0.0 0.0 1.0 10.67 1318.56)"><foreignobject style="--ltx-fo-width:45.66em;--ltx-fo-height:0.69em;--ltx-fo-depth:0.19em;font-size:10pt;" height="12.3" overflow="visible" transform="matrix(1 0 0 -1 0 9.61)" width="631.81"><span class="ltx_foreignobject_container"><span class="ltx_foreignobject_content">
<span id="A3.pic2.1" class="ltx_inline-block ltx_minipage ltx_align_bottom" style="width:45.66em;">
<span id="A3.pic2.1.1" class="ltx_p"><span id="A3.pic2.1.1.1" class="ltx_text" style="--ltx-fg-color:#FFFFFF;">Evidence Support Evaluation Questions</span></span>
</span></span></span></foreignobject></g><g fill-opacity="1.0" transform="matrix(1.0 0.0 0.0 1.0 10.67 242.47)"><foreignobject style="--ltx-fo-width:45.66em;--ltx-fo-height:76.66em;--ltx-fo-depth:16.89em;font-size:10pt;" height="1294.54" overflow="visible" transform="matrix(1 0 0 -1 0 1060.77)" width="631.81"><span class="ltx_foreignobject_container"><span class="ltx_foreignobject_content">
<span id="A3.pic2.2" class="ltx_inline-block ltx_minipage ltx_align_bottom" style="width:45.66em;">
<span id="A3.pic2.2.1" class="ltx_p"><span id="A3.pic2.2.1.1" class="ltx_text ltx_font_bold" style="--ltx-fg-color:#000000;">Factual Accuracy (6 questions)<span id="A3.pic2.2.1.1.1" class="ltx_text"></span></span></span>
<span id="A3.I6" class="ltx_enumerate ltx_leftmargin_flush">
<span id="A3.I6.i1" class="ltx_item" style="list-style-type:none;"><span class="ltx_tag ltx_tag_item">1.</span> 
<span id="A3.I6.i1.p1" class="ltx_para">
<span id="A3.I6.i1.p1.1" class="ltx_p"><span id="A3.I6.i1.p1.1.1" class="ltx_text" style="--ltx-fg-color:#000000;">To what extent does the evidence directly support the key claims in the answer, with no unsupported assertions?</span></span>
</span></span>
<span id="A3.I6.i2" class="ltx_item" style="list-style-type:none;"><span class="ltx_tag ltx_tag_item">2.</span> 
<span id="A3.I6.i2.p1" class="ltx_para">
<span id="A3.I6.i2.p1.1" class="ltx_p"><span id="A3.I6.i2.p1.1.1" class="ltx_text" style="--ltx-fg-color:#000000;">How well do the retrieved passages contradict or fail to support any statements in the answer?</span></span>
</span></span>
<span id="A3.I6.i3" class="ltx_item" style="list-style-type:none;"><span class="ltx_tag ltx_tag_item">3.</span> 
<span id="A3.I6.i3.p1" class="ltx_para">
<span id="A3.I6.i3.p1.1" class="ltx_p"><span id="A3.I6.i3.p1.1.1" class="ltx_text" style="--ltx-fg-color:#000000;">To what degree does the answer avoid overgeneralizing or making broad inferences beyond what is stated in the evidence?</span></span>
</span></span>
<span id="A3.I6.i4" class="ltx_item" style="list-style-type:none;"><span class="ltx_tag ltx_tag_item">4.</span> 
<span id="A3.I6.i4.p1" class="ltx_para">
<span id="A3.I6.i4.p1.1" class="ltx_p"><span id="A3.I6.i4.p1.1.1" class="ltx_text" style="--ltx-fg-color:#000000;">How precisely does the answer align with the specificity (e.g., timeframes, quantities, conditions) provided in the evidence?</span></span>
</span></span>
<span id="A3.I6.i5" class="ltx_item" style="list-style-type:none;"><span class="ltx_tag ltx_tag_item">5.</span> 
<span id="A3.I6.i5.p1" class="ltx_para">
<span id="A3.I6.i5.p1.1" class="ltx_p"><span id="A3.I6.i5.p1.1.1" class="ltx_text" style="--ltx-fg-color:#000000;">To what extent are all named entities, events, and relationships in the answer accurately reflected in the evidence passages?</span></span>
</span></span>
<span id="A3.I6.i6" class="ltx_item" style="list-style-type:none;"><span class="ltx_tag ltx_tag_item">6.</span> 
<span id="A3.I6.i6.p1" class="ltx_para">
<span id="A3.I6.i6.p1.1" class="ltx_p"><span id="A3.I6.i6.p1.1.1" class="ltx_text" style="--ltx-fg-color:#000000;">How well does the answer refrain from introducing plausible but unverified details not present in the evidence?</span></span>
</span></span>
</span>
<span id="A3.pic2.2.2" class="ltx_p"><span id="A3.pic2.2.2.1" class="ltx_text ltx_font_bold" style="--ltx-fg-color:#000000;">Completeness of Support (6 questions)<span id="A3.pic2.2.2.1.1" class="ltx_text"></span></span></span>
<span id="A3.I7" class="ltx_enumerate ltx_leftmargin_flush">
<span id="A3.I7.i7" class="ltx_item" style="list-style-type:none;"><span class="ltx_tag ltx_tag_item">7.</span> 
<span id="A3.I7.i7.p1" class="ltx_para">
<span id="A3.I7.i7.p1.1" class="ltx_p"><span id="A3.I7.i7.p1.1.1" class="ltx_text" style="--ltx-fg-color:#000000;">To what extent does the evidence directly support all key claims in the answer, with no unsupported assertions?</span></span>
</span></span>
<span id="A3.I7.i8" class="ltx_item" style="list-style-type:none;"><span class="ltx_tag ltx_tag_item">8.</span> 
<span id="A3.I7.i8.p1" class="ltx_para">
<span id="A3.I7.i8.p1.1" class="ltx_p"><span id="A3.I7.i8.p1.1.1" class="ltx_text" style="--ltx-fg-color:#000000;">How well do the retrieved passages contain specific details or examples that match the level of specificity in the answer?</span></span>
</span></span>
<span id="A3.I7.i9" class="ltx_item" style="list-style-type:none;"><span class="ltx_tag ltx_tag_item">9.</span> 
<span id="A3.I7.i9.p1" class="ltx_para">
<span id="A3.I7.i9.p1.1" class="ltx_p"><span id="A3.I7.i9.p1.1.1" class="ltx_text" style="--ltx-fg-color:#000000;">To what degree does the evidence fully cover the scope of the answer, including all sub-claims or components mentioned?</span></span>
</span></span>
<span id="A3.I7.i10" class="ltx_item" style="list-style-type:none;"><span class="ltx_tag ltx_tag_item">10.</span> 
<span id="A3.I7.i10.p1" class="ltx_para">
<span id="A3.I7.i10.p1.1" class="ltx_p"><span id="A3.I7.i10.p1.1.1" class="ltx_text" style="--ltx-fg-color:#000000;">How consistently do the passages align with the answer without introducing contradictions or conflicting information?</span></span>
</span></span>
<span id="A3.I7.i11" class="ltx_item" style="list-style-type:none;"><span class="ltx_tag ltx_tag_item">11.</span> 
<span id="A3.I7.i11.p1" class="ltx_para">
<span id="A3.I7.i11.p1.1" class="ltx_p"><span id="A3.I7.i11.p1.1.1" class="ltx_text" style="--ltx-fg-color:#000000;">To what extent does the answer avoid overgeneralizing beyond what is reasonably supported by the evidence?</span></span>
</span></span>
<span id="A3.I7.i12" class="ltx_item" style="list-style-type:none;"><span class="ltx_tag ltx_tag_item">12.</span> 
<span id="A3.I7.i12.p1" class="ltx_para">
<span id="A3.I7.i12.p1.1" class="ltx_p"><span id="A3.I7.i12.p1.1.1" class="ltx_text" style="--ltx-fg-color:#000000;">How well do the passages provide sufficient context or explanation to justify causal or inferential claims made in the answer?</span></span>
</span></span>
</span>
<span id="A3.pic2.2.3" class="ltx_p"><span id="A3.pic2.2.3.1" class="ltx_text ltx_font_bold" style="--ltx-fg-color:#000000;">Specificity Alignment (6 questions)<span id="A3.pic2.2.3.1.1" class="ltx_text"></span></span></span>
<span id="A3.I8" class="ltx_enumerate ltx_leftmargin_flush">
<span id="A3.I8.i13" class="ltx_item" style="list-style-type:none;"><span class="ltx_tag ltx_tag_item">13.</span> 
<span id="A3.I8.i13.p1" class="ltx_para">
<span id="A3.I8.i13.p1.1" class="ltx_p"><span id="A3.I8.i13.p1.1.1" class="ltx_text" style="--ltx-fg-color:#000000;">To what extent does the answer reflect the same level of specificity as the evidence, avoiding unwarranted generalizations or oversimplifications?</span></span>
</span></span>
<span id="A3.I8.i14" class="ltx_item" style="list-style-type:none;"><span class="ltx_tag ltx_tag_item">14.</span> 
<span id="A3.I8.i14.p1" class="ltx_para">
<span id="A3.I8.i14.p1.1" class="ltx_p"><span id="A3.I8.i14.p1.1.1" class="ltx_text" style="--ltx-fg-color:#000000;">How well do the key claims in the answer map directly to specific details or data points in the evidence, rather than relying on vague or peripheral information?</span></span>
</span></span>
<span id="A3.I8.i15" class="ltx_item" style="list-style-type:none;"><span class="ltx_tag ltx_tag_item">15.</span> 
<span id="A3.I8.i15.p1" class="ltx_para">
<span id="A3.I8.i15.p1.1" class="ltx_p"><span id="A3.I8.i15.p1.1.1" class="ltx_text" style="--ltx-fg-color:#000000;">To what degree does the evidence support the precise scope (e.g., time frame, population, location) asserted in the answer without overextension?</span></span>
</span></span>
<span id="A3.I8.i16" class="ltx_item" style="list-style-type:none;"><span class="ltx_tag ltx_tag_item">16.</span> 
<span id="A3.I8.i16.p1" class="ltx_para">
<span id="A3.I8.i16.p1.1" class="ltx_p"><span id="A3.I8.i16.p1.1.1" class="ltx_text" style="--ltx-fg-color:#000000;">How closely does the answer avoid introducing concepts or conclusions that are more specific than what is warranted by the evidence?</span></span>
</span></span>
<span id="A3.I8.i17" class="ltx_item" style="list-style-type:none;"><span class="ltx_tag ltx_tag_item">17.</span> 
<span id="A3.I8.i17.p1" class="ltx_para">
<span id="A3.I8.i17.p1.1" class="ltx_p"><span id="A3.I8.i17.p1.1.1" class="ltx_text" style="--ltx-fg-color:#000000;">To what extent are named entities, quantities, or relationships in the answer explicitly grounded in corresponding specific mentions within the evidence?</span></span>
</span></span>
<span id="A3.I8.i18" class="ltx_item" style="list-style-type:none;"><span class="ltx_tag ltx_tag_item">18.</span> 
<span id="A3.I8.i18.p1" class="ltx_para">
<span id="A3.I8.i18.p1.1" class="ltx_p"><span id="A3.I8.i18.p1.1.1" class="ltx_text" style="--ltx-fg-color:#000000;">How well does the answer maintain alignment with the evidence by neither omitting critical qualifying conditions nor adding unsupported qualifiers?</span></span>
</span></span>
</span>
<span id="A3.pic2.2.4" class="ltx_p"><span id="A3.pic2.2.4.1" class="ltx_text ltx_font_bold" style="--ltx-fg-color:#000000;">Consistency with Evidence (6 questions)<span id="A3.pic2.2.4.1.1" class="ltx_text"></span></span></span>
<span id="A3.I9" class="ltx_enumerate ltx_leftmargin_flush">
<span id="A3.I9.i19" class="ltx_item" style="list-style-type:none;"><span class="ltx_tag ltx_tag_item">19.</span> 
<span id="A3.I9.i19.p1" class="ltx_para">
<span id="A3.I9.i19.p1.1" class="ltx_p"><span id="A3.I9.i19.p1.1.1" class="ltx_text" style="--ltx-fg-color:#000000;">To what extent does the evidence directly support the key claims in the answer, with no unsupported assertions?</span></span>
</span></span>
<span id="A3.I9.i20" class="ltx_item" style="list-style-type:none;"><span class="ltx_tag ltx_tag_item">20.</span> 
<span id="A3.I9.i20.p1" class="ltx_para">
<span id="A3.I9.i20.p1.1" class="ltx_p"><span id="A3.I9.i20.p1.1.1" class="ltx_text" style="--ltx-fg-color:#000000;">How well do the retrieved passages contradict or conflict with any statements in the answer?</span></span>
</span></span>
<span id="A3.I9.i21" class="ltx_item" style="list-style-type:none;"><span class="ltx_tag ltx_tag_item">21.</span> 
<span id="A3.I9.i21.p1" class="ltx_para">
<span id="A3.I9.i21.p1.1" class="ltx_p"><span id="A3.I9.i21.p1.1.1" class="ltx_text" style="--ltx-fg-color:#000000;">To what degree does the answer avoid overgeneralizing beyond the scope or specificity of the evidence provided?</span></span>
</span></span>
<span id="A3.I9.i22" class="ltx_item" style="list-style-type:none;"><span class="ltx_tag ltx_tag_item">22.</span> 
<span id="A3.I9.i22.p1" class="ltx_para">
<span id="A3.I9.i22.p1.1" class="ltx_p"><span id="A3.I9.i22.p1.1.1" class="ltx_text" style="--ltx-fg-color:#000000;">How closely does the answer align with the factual details and context present in the evidence, avoiding subtle distortions or misrepresentations?</span></span>
</span></span>
<span id="A3.I9.i23" class="ltx_item" style="list-style-type:none;"><span class="ltx_tag ltx_tag_item">23.</span> 
<span id="A3.I9.i23.p1" class="ltx_para">
<span id="A3.I9.i23.p1.1" class="ltx_p"><span id="A3.I9.i23.p1.1.1" class="ltx_text" style="--ltx-fg-color:#000000;">To what extent can each component of a multi-part answer be individually justified by at least one evidence passage?</span></span>
</span></span>
<span id="A3.I9.i24" class="ltx_item" style="list-style-type:none;"><span class="ltx_tag ltx_tag_item">24.</span> 
<span id="A3.I9.i24.p1" class="ltx_para">
<span id="A3.I9.i24.p1.1" class="ltx_p"><span id="A3.I9.i24.p1.1.1" class="ltx_text" style="--ltx-fg-color:#000000;">How well does the answer reflect the certainty level (e.g., tentative, definitive) expressed in the evidence, without introducing unwarranted confidence or ambiguity?</span></span>
</span></span>
</span>
<span id="A3.pic2.2.5" class="ltx_p"><span id="A3.pic2.2.5.1" class="ltx_text ltx_font_bold" style="--ltx-fg-color:#000000;">Source Attribution (6 questions)<span id="A3.pic2.2.5.1.1" class="ltx_text"></span></span></span>
<span id="A3.I10" class="ltx_enumerate ltx_leftmargin_flush">
<span id="A3.I10.i25" class="ltx_item" style="list-style-type:none;"><span class="ltx_tag ltx_tag_item">25.</span> 
<span id="A3.I10.i25.p1" class="ltx_para">
<span id="A3.I10.i25.p1.1" class="ltx_p"><span id="A3.I10.i25.p1.1.1" class="ltx_text" style="--ltx-fg-color:#000000;">To what extent does the evidence explicitly attribute the claim to a credible source or original provider of information?</span></span>
</span></span>
<span id="A3.I10.i26" class="ltx_item" style="list-style-type:none;"><span class="ltx_tag ltx_tag_item">26.</span> 
<span id="A3.I10.i26.p1" class="ltx_para">
<span id="A3.I10.i26.p1.1" class="ltx_p"><span id="A3.I10.i26.p1.1.1" class="ltx_text" style="--ltx-fg-color:#000000;">How well do the retrieved passages support the specificity of the claim, without introducing unsupported details or omitting critical qualifiers present in the source?</span></span>
</span></span>
<span id="A3.I10.i27" class="ltx_item" style="list-style-type:none;"><span class="ltx_tag ltx_tag_item">27.</span> 
<span id="A3.I10.i27.p1" class="ltx_para">
<span id="A3.I10.i27.p1.1" class="ltx_p"><span id="A3.I10.i27.p1.1.1" class="ltx_text" style="--ltx-fg-color:#000000;">To what degree is the claim directly verifiable from the cited evidence, rather than requiring inference beyond what the source states?</span></span>
</span></span>
<span id="A3.I10.i28" class="ltx_item" style="list-style-type:none;"><span class="ltx_tag ltx_tag_item">28.</span> 
<span id="A3.I10.i28.p1" class="ltx_para">
<span id="A3.I10.i28.p1.1" class="ltx_p"><span id="A3.I10.i28.p1.1.1" class="ltx_text" style="--ltx-fg-color:#000000;">How consistently does the answer reflect the source’s intended meaning, avoiding misrepresentation or overgeneralization of the evidence?</span></span>
</span></span>
<span id="A3.I10.i29" class="ltx_item" style="list-style-type:none;"><span class="ltx_tag ltx_tag_item">29.</span> 
<span id="A3.I10.i29.p1" class="ltx_para">
<span id="A3.I10.i29.p1.1" class="ltx_p"><span id="A3.I10.i29.p1.1.1" class="ltx_text" style="--ltx-fg-color:#000000;">To what extent does the evidence rule out contradictions or significant discrepancies with the claim being made?</span></span>
</span></span>
<span id="A3.I10.i30" class="ltx_item" style="list-style-type:none;"><span class="ltx_tag ltx_tag_item">30.</span> 
<span id="A3.I10.i30.p1" class="ltx_para">
<span id="A3.I10.i30.p1.1" class="ltx_p"><span id="A3.I10.i30.p1.1.1" class="ltx_text" style="--ltx-fg-color:#000000;">How clearly is the connection between the evidence and the claim articulated, such that the support is traceable and transparent?</span></span>
</span></span>
</span>
</span></span></span></foreignobject></g></g></svg>