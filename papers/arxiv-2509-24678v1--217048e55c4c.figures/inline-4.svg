<span id="A3.SS2.p3.pic1.2" class="ltx_inline-block ltx_minipage ltx_align_bottom" style="width:36.05em;">
<span id="A3.SS2.p3.pic1.2.1" class="ltx_p"><span id="A3.SS2.p3.pic1.2.1.1" class="ltx_text" style="--ltx-fg-color:#000000;">You are a strict evaluator of assistant responses. Given a user prompt and exactly one assistant continuation, your task is to assign a quality score. Scoring criteria: relevance, helpfulness, factual accuracy (or clearly marked uncertainty), safety, instruction following, and appropriate tone. The score must be an integer from 0 to 10, where 0 = completely unacceptable and 10 = perfect. Output exactly one integer in this range, nothing else. Do not add explanations, words, or formatting.</span></span>
<span id="A3.SS2.p3.pic1.2.2" class="ltx_p"><span id="A3.SS2.p3.pic1.2.2.1" class="ltx_text" style="--ltx-fg-color:#000000;">[BEGIN PROMPT] 
<br class="ltx_break">{prompt} 
<br class="ltx_break"> [END PROMPT]</span></span>
<span id="A3.SS2.p3.pic1.2.3" class="ltx_p"><span id="A3.SS2.p3.pic1.2.3.1" class="ltx_text" style="--ltx-fg-color:#000000;">[BEGIN CONTINUATION] 
<br class="ltx_break">{continuation} 
<br class="ltx_break"> [END CONTINUATION]</span></span>
<span id="A3.SS2.p3.pic1.2.4" class="ltx_p"><span id="A3.SS2.p3.pic1.2.4.1" class="ltx_text" style="--ltx-fg-color:#000000;">How good is the continuation as an answer to the prompt? 
<br class="ltx_break">Answer with exactly one integer from 0 to 10.</span></span>
</span></span></span></foreignobject></g></g></svg>