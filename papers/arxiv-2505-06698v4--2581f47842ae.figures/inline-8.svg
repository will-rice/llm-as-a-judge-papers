<span id="A3.F15.pic1.1.1" class="ltx_p"><span id="A3.F15.pic1.1.1.1" class="ltx_text ltx_font_bold" style="--ltx-fg-color:#FFFFFF;">Prompt of Domain Annotation</span></span>
</span></span></span></foreignobject></g><g fill-opacity="1.0" transform="matrix(1.0 0.0 0.0 1.0 8.99 12.45)"><foreignobject style="--ltx-fo-width:45.9em;--ltx-fo-height:19.89em;--ltx-fo-depth:0.25em;font-size:10pt;" height="278.74" overflow="visible" transform="matrix(1 0 0 -1 0 275.28)" width="635.13"><span class="ltx_foreignobject_container"><span class="ltx_foreignobject_content">
<span id="A3.F15.pic1.2" class="ltx_inline-block ltx_minipage ltx_align_bottom" style="width:45.9em;">
<span id="A3.F15.pic1.2.1" class="ltx_p"><span id="A3.F15.pic1.2.1.1" class="ltx_text" style="--ltx-fg-color:#000000;">You are tasked with categorizing a given query into one of the following six categories:
<br class="ltx_break">1. **roleplay**
<br class="ltx_break">2. **coding**
<br class="ltx_break">3. **mathematics**
<br class="ltx_break">4. **reasoning**
<br class="ltx_break">5. **knowledge**
<br class="ltx_break">6. **writing**
<br class="ltx_break">7. **other**
<br class="ltx_break"></span></span>
<span id="A3.F15.pic1.2.2" class="ltx_p"><span id="A3.F15.pic1.2.2.1" class="ltx_text" style="--ltx-fg-color:#000000;">For each query provided, determine the most appropriate category and output the result in lowcase enclosed within &lt;domain&gt; and &lt;/domain&gt; tags.
<br class="ltx_break"></span></span>
<span id="A3.F15.pic1.2.3" class="ltx_p"><span id="A3.F15.pic1.2.3.1" class="ltx_text" style="--ltx-fg-color:#000000;">**Example**:
<br class="ltx_break">Query: &quot;How do I write a compelling essay introduction?&quot;
<br class="ltx_break">Output: &lt;domain&gt;roleplay&lt;/domain&gt;
<br class="ltx_break"></span></span>
<span id="A3.F15.pic1.2.4" class="ltx_p"><span id="A3.F15.pic1.2.4.1" class="ltx_text" style="--ltx-fg-color:#000000;">**Now, analyze the following query**:
<br class="ltx_break">&lt;|begin_of_query|&gt;
<br class="ltx_break">{query}
<br class="ltx_break">&lt;|end_of_query|&gt;</span></span>
</span></span></span></foreignobject></g></g></svg>