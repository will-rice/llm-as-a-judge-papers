<svg id="Ax2.F4.pic1" class="ltx_picture ltx_centering" height="1157.21" overflow="visible" version="1.1" viewbox="0 0 640.08 1157.21" width="640.08"><g style="--ltx-stroke-color:#000000;--ltx-fill-color:#000000;" fill="#000000" stroke="#000000" stroke-width="0.4pt" transform="translate(0,1157.21) matrix(1 0 0 -1 0 0)"><g style="--ltx-fill-color:#000000;" fill="#000000" fill-opacity="1.0"><path style="stroke:none" d="M 0 0 L 0 1157.21 L 640.08 1157.21 L 640.08 0 Z" /></g><g style="--ltx-fill-color:#FFFFFF;" fill="#FFFFFF" fill-opacity="1.0"><path style="stroke:none" d="M 0.42 0.42 L 0.42 1156.79 L 639.67 1156.79 L 639.67 0.42 Z" /></g><g fill-opacity="1.0" transform="matrix(1.0 0.0 0.0 1.0 12.23 11.36)"><foreignobject style="--ltx-fo-width:42.37em;--ltx-fo-height:82.21em;--ltx-fo-depth:0.22em;font-size:10pt;" height="1140.64" overflow="visible" transform="matrix(1 0 0 -1 0 1137.57)" width="586.28"><span class="ltx_foreignobject_container"><span class="ltx_foreignobject_content">
<span id="Ax2.F4.pic1.1" class="ltx_inline-block ltx_minipage ltx_align_bottom" style="width:42.37em;">
<span id="Ax2.F4.pic1.1.1" class="ltx_p"><span id="Ax2.F4.pic1.1.1.1" class="ltx_text ltx_verbatim ltx_font_typewriter ltx_inline-block" style="width:444.9pt;--ltx-fg-color:#000000;">You are given a JSON object containing human-written ArgQuality rubric axes used for evaluating argumentative text across the Dagstuhl-15512 ArgQuality</span></span>
<span id="Ax2.F4.pic1.1.2" class="ltx_p" style="width:444.9pt;"><span id="Ax2.F4.pic1.1.2.1" class="ltx_text ltx_verbatim ltx_font_typewriter ltx_inline-block" style="width:444.9pt;--ltx-fg-color:#000000;">corpus.</span></span>
<span id="Ax2.F4.pic1.1.3" class="ltx_p" style="width:444.9pt;"><span id="Ax2.F4.pic1.1.3.1" class="ltx_text ltx_verbatim ltx_inline-block" style="width:444.9pt;"></span></span>
<span id="Ax2.F4.pic1.1.4" class="ltx_p" style="width:444.9pt;"><span id="Ax2.F4.pic1.1.4.1" class="ltx_text ltx_verbatim ltx_font_typewriter ltx_inline-block" style="width:444.9pt;--ltx-fg-color:#000000;">Generate one executable Python rubric that scores a candidate argument response to a user instruction, issue, claim, stance, or argumentative prompt.</span></span>
<span id="Ax2.F4.pic1.1.5" class="ltx_p" style="width:444.9pt;"><span id="Ax2.F4.pic1.1.5.1" class="ltx_text ltx_verbatim ltx_inline-block" style="width:444.9pt;"></span></span>
<span id="Ax2.F4.pic1.1.6" class="ltx_p" style="width:444.9pt;"><span id="Ax2.F4.pic1.1.6.1" class="ltx_text ltx_verbatim ltx_font_typewriter ltx_inline-block" style="width:444.9pt;--ltx-fg-color:#000000;">The generated rubric must define exactly fifteen functions:</span></span>
<span id="Ax2.F4.pic1.1.7" class="ltx_p" style="width:444.9pt;"><span id="Ax2.F4.pic1.1.7.1" class="ltx_text ltx_verbatim ltx_font_typewriter ltx_inline-block" style="width:444.9pt;--ltx-fg-color:#000000;">1. def score_response(query: str, text: str):</span></span>
<span id="Ax2.F4.pic1.1.8" class="ltx_p" style="width:444.9pt;"><span id="Ax2.F4.pic1.1.8.1" class="ltx_text ltx_verbatim ltx_font_typewriter ltx_inline-block" style="width:444.9pt;--ltx-fg-color:#000000;">2. Fourteen axis-specific functions:</span></span>
<span id="Ax2.F4.pic1.1.9" class="ltx_p" style="width:444.9pt;"><span id="Ax2.F4.pic1.1.9.1" class="ltx_text ltx_verbatim ltx_font_typewriter ltx_inline-block" style="width:444.9pt;--ltx-fg-color:#000000;">   def score_cogency(query: str, text: str):</span></span>
<span id="Ax2.F4.pic1.1.10" class="ltx_p" style="width:444.9pt;"><span id="Ax2.F4.pic1.1.10.1" class="ltx_text ltx_verbatim ltx_font_typewriter ltx_inline-block" style="width:444.9pt;--ltx-fg-color:#000000;">   def score_local_acceptability(query: str, text: str):</span></span>
<span id="Ax2.F4.pic1.1.11" class="ltx_p" style="width:444.9pt;"><span id="Ax2.F4.pic1.1.11.1" class="ltx_text ltx_verbatim ltx_font_typewriter ltx_inline-block" style="width:444.9pt;--ltx-fg-color:#000000;">   def score_local_relevance(query: str, text: str):</span></span>
<span id="Ax2.F4.pic1.1.12" class="ltx_p" style="width:444.9pt;"><span id="Ax2.F4.pic1.1.12.1" class="ltx_text ltx_verbatim ltx_font_typewriter ltx_inline-block" style="width:444.9pt;--ltx-fg-color:#000000;">   def score_local_sufficiency(query: str, text: str):</span></span>
<span id="Ax2.F4.pic1.1.13" class="ltx_p" style="width:444.9pt;"><span id="Ax2.F4.pic1.1.13.1" class="ltx_text ltx_verbatim ltx_font_typewriter ltx_inline-block" style="width:444.9pt;--ltx-fg-color:#000000;">   def score_effectiveness(query: str, text: str):</span></span>
<span id="Ax2.F4.pic1.1.14" class="ltx_p" style="width:444.9pt;"><span id="Ax2.F4.pic1.1.14.1" class="ltx_text ltx_verbatim ltx_font_typewriter ltx_inline-block" style="width:444.9pt;--ltx-fg-color:#000000;">   def score_credibility(query: str, text: str):</span></span>
<span id="Ax2.F4.pic1.1.15" class="ltx_p" style="width:444.9pt;"><span id="Ax2.F4.pic1.1.15.1" class="ltx_text ltx_verbatim ltx_font_typewriter ltx_inline-block" style="width:444.9pt;--ltx-fg-color:#000000;">   def score_emotional_appeal(query: str, text: str):</span></span>
<span id="Ax2.F4.pic1.1.16" class="ltx_p" style="width:444.9pt;"><span id="Ax2.F4.pic1.1.16.1" class="ltx_text ltx_verbatim ltx_font_typewriter ltx_inline-block" style="width:444.9pt;--ltx-fg-color:#000000;">   def score_clarity(query: str, text: str):</span></span>
<span id="Ax2.F4.pic1.1.17" class="ltx_p" style="width:444.9pt;"><span id="Ax2.F4.pic1.1.17.1" class="ltx_text ltx_verbatim ltx_font_typewriter ltx_inline-block" style="width:444.9pt;--ltx-fg-color:#000000;">   def score_appropriateness(query: str, text: str):</span></span>
<span id="Ax2.F4.pic1.1.18" class="ltx_p" style="width:444.9pt;"><span id="Ax2.F4.pic1.1.18.1" class="ltx_text ltx_verbatim ltx_font_typewriter ltx_inline-block" style="width:444.9pt;--ltx-fg-color:#000000;">   def score_arrangement(query: str, text: str):</span></span>
<span id="Ax2.F4.pic1.1.19" class="ltx_p" style="width:444.9pt;"><span id="Ax2.F4.pic1.1.19.1" class="ltx_text ltx_verbatim ltx_font_typewriter ltx_inline-block" style="width:444.9pt;--ltx-fg-color:#000000;">   def score_reasonableness(query: str, text: str):</span></span>
<span id="Ax2.F4.pic1.1.20" class="ltx_p" style="width:444.9pt;"><span id="Ax2.F4.pic1.1.20.1" class="ltx_text ltx_verbatim ltx_font_typewriter ltx_inline-block" style="width:444.9pt;--ltx-fg-color:#000000;">   def score_global_acceptability(query: str, text: str):</span></span>
<span id="Ax2.F4.pic1.1.21" class="ltx_p" style="width:444.9pt;"><span id="Ax2.F4.pic1.1.21.1" class="ltx_text ltx_verbatim ltx_font_typewriter ltx_inline-block" style="width:444.9pt;--ltx-fg-color:#000000;">   def score_global_relevance(query: str, text: str):</span></span>
<span id="Ax2.F4.pic1.1.22" class="ltx_p" style="width:444.9pt;"><span id="Ax2.F4.pic1.1.22.1" class="ltx_text ltx_verbatim ltx_font_typewriter ltx_inline-block" style="width:444.9pt;--ltx-fg-color:#000000;">   def score_global_sufficiency(query: str, text: str):</span></span>
<span id="Ax2.F4.pic1.1.23" class="ltx_p" style="width:444.9pt;"><span id="Ax2.F4.pic1.1.23.1" class="ltx_text ltx_verbatim ltx_inline-block" style="width:444.9pt;"></span></span>
<span id="Ax2.F4.pic1.1.24" class="ltx_p" style="width:444.9pt;"><span id="Ax2.F4.pic1.1.24.1" class="ltx_text ltx_verbatim ltx_font_typewriter ltx_inline-block" style="width:444.9pt;--ltx-fg-color:#000000;">The top-level score_response function must call the fourteen axis-specific functions and sum their scores.</span></span>
<span id="Ax2.F4.pic1.1.25" class="ltx_p" style="width:444.9pt;"><span id="Ax2.F4.pic1.1.25.1" class="ltx_text ltx_verbatim ltx_inline-block" style="width:444.9pt;"></span></span>
<span id="Ax2.F4.pic1.1.26" class="ltx_p" style="width:444.9pt;"><span id="Ax2.F4.pic1.1.26.1" class="ltx_text ltx_verbatim ltx_font_typewriter ltx_inline-block" style="width:444.9pt;--ltx-fg-color:#000000;">The rubric should evaluate only the user instruction/query and candidate argument. Treat query as the full issue, instruction, claim, stance, or</span></span>
<span id="Ax2.F4.pic1.1.27" class="ltx_p" style="width:444.9pt;"><span id="Ax2.F4.pic1.1.27.1" class="ltx_text ltx_verbatim ltx_font_typewriter ltx_inline-block" style="width:444.9pt;--ltx-fg-color:#000000;">argumentative prompt.</span></span>
<span id="Ax2.F4.pic1.1.28" class="ltx_p" style="width:444.9pt;"><span id="Ax2.F4.pic1.1.28.1" class="ltx_text ltx_verbatim ltx_inline-block" style="width:444.9pt;"></span></span>
<span id="Ax2.F4.pic1.1.29" class="ltx_p" style="width:444.9pt;"><span id="Ax2.F4.pic1.1.29.1" class="ltx_text ltx_verbatim ltx_font_typewriter ltx_inline-block" style="width:444.9pt;--ltx-fg-color:#000000;">Return only Python code. Do not include markdown fences or prose.</span></span>
<span id="Ax2.F4.pic1.1.30" class="ltx_p" style="width:444.9pt;"><span id="Ax2.F4.pic1.1.30.1" class="ltx_text ltx_verbatim ltx_inline-block" style="width:444.9pt;"></span></span>
<span id="Ax2.F4.pic1.1.31" class="ltx_p" style="width:444.9pt;"><span id="Ax2.F4.pic1.1.31.1" class="ltx_text ltx_verbatim ltx_font_typewriter ltx_inline-block" style="width:444.9pt;--ltx-fg-color:#000000;">Input format:</span></span>
<span id="Ax2.F4.pic1.1.32" class="ltx_p" style="width:444.9pt;"><span id="Ax2.F4.pic1.1.32.1" class="ltx_text ltx_verbatim ltx_font_typewriter ltx_inline-block" style="width:444.9pt;--ltx-fg-color:#000000;">Convert the following natural-language human-written rubrics into executable rubric functions:</span></span>
<span id="Ax2.F4.pic1.1.33" class="ltx_p" style="width:444.9pt;"><span id="Ax2.F4.pic1.1.33.1" class="ltx_text ltx_verbatim ltx_inline-block" style="width:444.9pt;"></span></span>
<span id="Ax2.F4.pic1.1.34" class="ltx_p" style="width:444.9pt;"><span id="Ax2.F4.pic1.1.34.1" class="ltx_text ltx_verbatim ltx_font_typewriter ltx_inline-block" style="width:444.9pt;--ltx-fg-color:#000000;">{</span></span>
<span id="Ax2.F4.pic1.1.35" class="ltx_p" style="width:444.9pt;"><span id="Ax2.F4.pic1.1.35.1" class="ltx_text ltx_verbatim ltx_font_typewriter ltx_inline-block" style="width:444.9pt;--ltx-fg-color:#000000;">  ...</span></span>
<span id="Ax2.F4.pic1.1.36" class="ltx_p" style="width:444.9pt;"><span id="Ax2.F4.pic1.1.36.1" class="ltx_text ltx_verbatim ltx_font_typewriter ltx_inline-block" style="width:444.9pt;--ltx-fg-color:#000000;">  &quot;axes&quot;: [</span></span>
<span id="Ax2.F4.pic1.1.37" class="ltx_p" style="width:444.9pt;"><span id="Ax2.F4.pic1.1.37.1" class="ltx_text ltx_verbatim ltx_font_typewriter ltx_inline-block" style="width:444.9pt;--ltx-fg-color:#000000;">    {</span></span>
<span id="Ax2.F4.pic1.1.38" class="ltx_p" style="width:444.9pt;"><span id="Ax2.F4.pic1.1.38.1" class="ltx_text ltx_verbatim ltx_font_typewriter ltx_inline-block" style="width:444.9pt;--ltx-fg-color:#000000;">      &quot;id&quot;: &quot;cogency&quot;,</span></span>
<span id="Ax2.F4.pic1.1.39" class="ltx_p" style="width:444.9pt;"><span id="Ax2.F4.pic1.1.39.1" class="ltx_text ltx_verbatim ltx_font_typewriter ltx_inline-block" style="width:444.9pt;--ltx-fg-color:#000000;">      &quot;axis&quot;: &quot;Cogency&quot;,</span></span>
<span id="Ax2.F4.pic1.1.40" class="ltx_p" style="width:444.9pt;"><span id="Ax2.F4.pic1.1.40.1" class="ltx_text ltx_verbatim ltx_font_typewriter ltx_inline-block" style="width:444.9pt;--ltx-fg-color:#000000;">      &quot;definition&quot;: &quot;Assesses whether an argument has acceptable premises that are relevant to its conclusion and sufficient to justify drawing</span></span>
<span id="Ax2.F4.pic1.1.41" class="ltx_p" style="width:444.9pt;"><span id="Ax2.F4.pic1.1.41.1" class="ltx_text ltx_verbatim ltx_font_typewriter ltx_inline-block" style="width:444.9pt;--ltx-fg-color:#000000;">      that conclusion.&quot;</span></span>
<span id="Ax2.F4.pic1.1.42" class="ltx_p" style="width:444.9pt;"><span id="Ax2.F4.pic1.1.42.1" class="ltx_text ltx_verbatim ltx_font_typewriter ltx_inline-block" style="width:444.9pt;--ltx-fg-color:#000000;">    },</span></span>
<span id="Ax2.F4.pic1.1.43" class="ltx_p" style="width:444.9pt;"><span id="Ax2.F4.pic1.1.43.1" class="ltx_text ltx_verbatim ltx_font_typewriter ltx_inline-block" style="width:444.9pt;--ltx-fg-color:#000000;">    {</span></span>
<span id="Ax2.F4.pic1.1.44" class="ltx_p" style="width:444.9pt;"><span id="Ax2.F4.pic1.1.44.1" class="ltx_text ltx_verbatim ltx_font_typewriter ltx_inline-block" style="width:444.9pt;--ltx-fg-color:#000000;">      &quot;id&quot;: &quot;local_acceptability&quot;,</span></span>
<span id="Ax2.F4.pic1.1.45" class="ltx_p" style="width:444.9pt;"><span id="Ax2.F4.pic1.1.45.1" class="ltx_text ltx_verbatim ltx_font_typewriter ltx_inline-block" style="width:444.9pt;--ltx-fg-color:#000000;">      &quot;axis&quot;: &quot;Local acceptability&quot;,</span></span>
<span id="Ax2.F4.pic1.1.46" class="ltx_p" style="width:444.9pt;"><span id="Ax2.F4.pic1.1.46.1" class="ltx_text ltx_verbatim ltx_font_typewriter ltx_inline-block" style="width:444.9pt;--ltx-fg-color:#000000;">      &quot;definition&quot;: &quot;Assesses whether a premise is rationally worthy of being believed to be true.&quot;</span></span>
<span id="Ax2.F4.pic1.1.47" class="ltx_p" style="width:444.9pt;"><span id="Ax2.F4.pic1.1.47.1" class="ltx_text ltx_verbatim ltx_font_typewriter ltx_inline-block" style="width:444.9pt;--ltx-fg-color:#000000;">    },</span></span>
<span id="Ax2.F4.pic1.1.48" class="ltx_p" style="width:444.9pt;"><span id="Ax2.F4.pic1.1.48.1" class="ltx_text ltx_verbatim ltx_font_typewriter ltx_inline-block" style="width:444.9pt;--ltx-fg-color:#000000;">    ...</span></span>
<span id="Ax2.F4.pic1.1.49" class="ltx_p" style="width:444.9pt;"><span id="Ax2.F4.pic1.1.49.1" class="ltx_text ltx_verbatim ltx_font_typewriter ltx_inline-block" style="width:444.9pt;--ltx-fg-color:#000000;">  ]</span></span>
<span id="Ax2.F4.pic1.1.50" class="ltx_p" style="width:444.9pt;"><span id="Ax2.F4.pic1.1.50.1" class="ltx_text ltx_verbatim ltx_font_typewriter ltx_inline-block" style="width:444.9pt;--ltx-fg-color:#000000;">}</span></span>
<span id="Ax2.F4.pic1.1.51" class="ltx_p" style="width:444.9pt;"><span id="Ax2.F4.pic1.1.51.1" class="ltx_text ltx_verbatim ltx_inline-block" style="width:444.9pt;"></span></span>
<span id="Ax2.F4.pic1.1.52" class="ltx_p" style="width:444.9pt;"><span id="Ax2.F4.pic1.1.52.1" class="ltx_text ltx_verbatim ltx_font_typewriter ltx_inline-block" style="width:444.9pt;--ltx-fg-color:#000000;">The generated executable rubric must satisfy:</span></span>
<span id="Ax2.F4.pic1.1.53" class="ltx_p" style="width:444.9pt;"><span id="Ax2.F4.pic1.1.53.1" class="ltx_text ltx_verbatim ltx_font_typewriter ltx_inline-block" style="width:444.9pt;--ltx-fg-color:#000000;">- def score_response(query: str, text: str)</span></span>
<span id="Ax2.F4.pic1.1.54" class="ltx_p" style="width:444.9pt;"><span id="Ax2.F4.pic1.1.54.1" class="ltx_text ltx_verbatim ltx_font_typewriter ltx_inline-block" style="width:444.9pt;--ltx-fg-color:#000000;">- exactly fourteen axis-specific scoring functions</span></span>
<span id="Ax2.F4.pic1.1.55" class="ltx_p" style="width:444.9pt;"><span id="Ax2.F4.pic1.1.55.1" class="ltx_text ltx_verbatim ltx_font_typewriter ltx_inline-block" style="width:444.9pt;--ltx-fg-color:#000000;">- each axis function returns: &quot;score&quot;, &quot;max_possible&quot;, &quot;reasons&quot;</span></span>
<span id="Ax2.F4.pic1.1.56" class="ltx_p" style="width:444.9pt;"><span id="Ax2.F4.pic1.1.56.1" class="ltx_text ltx_verbatim ltx_font_typewriter ltx_inline-block" style="width:444.9pt;--ltx-fg-color:#000000;">- score_response returns: &quot;score&quot;, &quot;max_possible&quot;, &quot;normalized_score&quot;, &quot;reasons&quot;</span></span>
<span id="Ax2.F4.pic1.1.57" class="ltx_p" style="width:444.9pt;"><span id="Ax2.F4.pic1.1.57.1" class="ltx_text ltx_verbatim ltx_font_typewriter ltx_inline-block" style="width:444.9pt;--ltx-fg-color:#000000;">- score_response calls all fourteen axis functions</span></span>
<span id="Ax2.F4.pic1.1.58" class="ltx_p" style="width:444.9pt;"><span id="Ax2.F4.pic1.1.58.1" class="ltx_text ltx_verbatim ltx_font_typewriter ltx_inline-block" style="width:444.9pt;--ltx-fg-color:#000000;">- normalized_score = score / max_possible</span></span>
<span id="Ax2.F4.pic1.1.59" class="ltx_p" style="width:444.9pt;"><span id="Ax2.F4.pic1.1.59.1" class="ltx_text ltx_verbatim ltx_font_typewriter ltx_inline-block" style="width:444.9pt;--ltx-fg-color:#000000;">- max_possible is a single numeric literal equal to the sum of axis maxima</span></span>
<span id="Ax2.F4.pic1.1.60" class="ltx_p" style="width:444.9pt;"><span id="Ax2.F4.pic1.1.60.1" class="ltx_text ltx_verbatim ltx_font_typewriter ltx_inline-block" style="width:444.9pt;--ltx-fg-color:#000000;">- all scores are clamped to valid ranges</span></span>
<span id="Ax2.F4.pic1.1.61" class="ltx_p" style="width:444.9pt;"><span id="Ax2.F4.pic1.1.61.1" class="ltx_text ltx_verbatim ltx_inline-block" style="width:444.9pt;"></span></span>
<span id="Ax2.F4.pic1.1.62" class="ltx_p" style="width:444.9pt;"><span id="Ax2.F4.pic1.1.62.1" class="ltx_text ltx_verbatim ltx_font_typewriter ltx_inline-block" style="width:444.9pt;--ltx-fg-color:#000000;">Requirements:</span></span>
<span id="Ax2.F4.pic1.1.63" class="ltx_p" style="width:444.9pt;"><span id="Ax2.F4.pic1.1.63.1" class="ltx_text ltx_verbatim ltx_font_typewriter ltx_inline-block" style="width:444.9pt;--ltx-fg-color:#000000;">Use deterministic Python only. No file I/O, network calls, external APIs, or LLM calls. Use only query and text. Reward clear claims, relevant and</span></span>
<span id="Ax2.F4.pic1.1.64" class="ltx_p" style="width:444.9pt;"><span id="Ax2.F4.pic1.1.64.1" class="ltx_text ltx_verbatim ltx_font_typewriter ltx_inline-block" style="width:444.9pt;--ltx-fg-color:#000000;">acceptable premises, sufficient support, credible wording, appropriate emotional appeal, coherent arrangement, reasonable framing, issue relevance,</span></span>
<span id="Ax2.F4.pic1.1.65" class="ltx_p" style="width:444.9pt;"><span id="Ax2.F4.pic1.1.65.1" class="ltx_text ltx_verbatim ltx_font_typewriter ltx_inline-block" style="width:444.9pt;--ltx-fg-color:#000000;">and counterargument handling. Penalize unsupported assertions, irrelevant premises, implausible claims, weak evidence, circular reasoning,</span></span>
<span id="Ax2.F4.pic1.1.66" class="ltx_p" style="width:444.9pt;"><span id="Ax2.F4.pic1.1.66.1" class="ltx_text ltx_verbatim ltx_font_typewriter ltx_inline-block" style="width:444.9pt;--ltx-fg-color:#000000;">strawman arguments, ad hominem attacks, excessive emotional manipulation, unclear wording, disorganized structure,</span></span>
<span id="Ax2.F4.pic1.1.67" class="ltx_p" style="width:444.9pt;"><span id="Ax2.F4.pic1.1.67.1" class="ltx_text ltx_verbatim ltx_font_typewriter ltx_inline-block" style="width:444.9pt;--ltx-fg-color:#000000;">off-topic content, missing conclusions, and merely restating the stance without reasons.</span></span>
<span id="Ax2.F4.pic1.1.68" class="ltx_p" style="width:444.9pt;"><span id="Ax2.F4.pic1.1.68.1" class="ltx_text ltx_verbatim ltx_inline-block" style="width:444.9pt;"></span></span>
<span id="Ax2.F4.pic1.1.69" class="ltx_p" style="width:444.9pt;"><span id="Ax2.F4.pic1.1.69.1" class="ltx_text ltx_verbatim ltx_font_typewriter ltx_inline-block" style="width:444.9pt;--ltx-fg-color:#000000;">Generate the complete Python rubric now.</span></span>
</span></span></span></foreignobject></g></g></svg>