</annotation></semantics></math></span></span>
<span id="A9.p5.pic1.2.2" class="ltx_p"><span id="A9.p5.pic1.2.2.1" class="ltx_text" style="--ltx-fg-color:#000000;">Bias under test:</span></span>
<span id="A9.p5.pic1.2.3" class="ltx_p"><span id="A9.p5.pic1.2.3.1" class="ltx_text ltx_font_bold" style="--ltx-fg-color:#000000;">Name<span id="A9.p5.pic1.2.3.1.1" class="ltx_text ltx_font_medium">:</span></span></span>
<span id="A9.p5.pic1.2.4" class="ltx_p"><math id="A9.p5.pic1.m3" class="ltx_Math" alttext="\{bias\_name\}" display="inline" intent=":literal"><semantics><mrow><mo stretchy="false">{</mo><mrow><mi style="--ltx-fg-color:#000000;" mathcolor="#000000">b</mi><mo lspace="0em" rspace="0em">​</mo><mi style="--ltx-fg-color:#000000;" mathcolor="#000000">i</mi><mo lspace="0em" rspace="0em">​</mo><mi style="--ltx-fg-color:#000000;" mathcolor="#000000">a</mi><mo lspace="0em" rspace="0em">​</mo><mi style="--ltx-fg-color:#000000;" mathcolor="#000000">s</mi><mo lspace="0em" rspace="0em">​</mo><mi style="--ltx-fg-color:#000000;" mathcolor="#000000">_</mi><mo lspace="0em" rspace="0em">​</mo><mi style="--ltx-fg-color:#000000;" mathcolor="#000000">n</mi><mo lspace="0em" rspace="0em">​</mo><mi style="--ltx-fg-color:#000000;" mathcolor="#000000">a</mi><mo lspace="0em" rspace="0em">​</mo><mi style="--ltx-fg-color:#000000;" mathcolor="#000000">m</mi><mo lspace="0em" rspace="0em">​</mo><mi style="--ltx-fg-color:#000000;" mathcolor="#000000">e</mi></mrow><mo stretchy="false">}</mo></mrow><annotation encoding="application/x-tex">\{bias\_name\}</annotation></semantics></math><span id="A9.p5.pic1.2.4.1" class="ltx_text"></span></span>
