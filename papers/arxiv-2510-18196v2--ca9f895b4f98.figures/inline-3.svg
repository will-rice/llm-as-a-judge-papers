<span id="A1.p4.pic1.1.1" class="ltx_p"><span id="A1.p4.pic1.1.1.1" class="ltx_text ltx_font_bold" style="--ltx-fg-color:#FFFFFF;">Score Range {min_range}-{max_range} for Consistency</span></span>
</span></span></span></foreignobject></g><g fill-opacity="1.0" transform="matrix(1.0 0.0 0.0 1.0 22.14 24.83)"><foreignobject style="--ltx-fo-width:44em;--ltx-fo-height:25.89em;--ltx-fo-depth:0.19em;font-size:10pt;" height="361" overflow="visible" transform="matrix(1 0 0 -1 0 358.31)" width="608.84"><span class="ltx_foreignobject_container"><span class="ltx_foreignobject_content">
<span id="A1.p4.pic1.2" class="ltx_inline-block ltx_minipage ltx_align_bottom" style="width:44em;">
<span id="A1.p4.pic1.2.1" class="ltx_p"><span id="A1.p4.pic1.2.1.1" class="ltx_text" style="--ltx-fg-color:#000000;">You will be given one summary written for a news article.

<br class="ltx_break">
<br class="ltx_break">Your task is to rate the summary on one metric.

<br class="ltx_break">
<br class="ltx_break">Please make sure you read and understand these instructions carefully. Please keep this document open while reviewing, and refer to it as needed.

<br class="ltx_break">
<br class="ltx_break">Evaluation Criteria:

<br class="ltx_break">
<br class="ltx_break">Consistency ({min_range}-{max_range}) - the factual alignment between the summary and the summarized source. A factually consistent summary contains only statements that are entailed by the source document. Annotators were also asked to penalize summaries that contained hallucinated facts.

<br class="ltx_break">
<br class="ltx_break">Evaluation Steps:

<br class="ltx_break">
<br class="ltx_break">1. Read the news article carefully and identify the main topic and key points.
<br class="ltx_break">2. Read the summary and compare it to the news article. Check if the summary covers the main topic and key points of the news article, and if it presents them in a clear and logical order.
<br class="ltx_break">3. Assign a score for consistency based on the Evaluation Criteria.

<br class="ltx_break">
<br class="ltx_break"></span></span>
<span id="A1.p4.pic1.2.2" class="ltx_p"><span id="A1.p4.pic1.2.2.1" class="ltx_text" style="--ltx-fg-color:#000000;">Example:

<br class="ltx_break">
<br class="ltx_break"></span></span>
<span id="A1.p4.pic1.2.3" class="ltx_p"><span id="A1.p4.pic1.2.3.1" class="ltx_text" style="--ltx-fg-color:#000000;">Source Text:

<br class="ltx_break">
<br class="ltx_break"></span></span>
<span id="A1.p4.pic1.2.4" class="ltx_p"><span id="A1.p4.pic1.2.4.1" class="ltx_text" style="--ltx-fg-color:#000000;">{{Document]}}

<br class="ltx_break">
<br class="ltx_break"></span></span>
<span id="A1.p4.pic1.2.5" class="ltx_p"><span id="A1.p4.pic1.2.5.1" class="ltx_text" style="--ltx-fg-color:#000000;">Summary:

<br class="ltx_break">
<br class="ltx_break"></span></span>
<span id="A1.p4.pic1.2.6" class="ltx_p"><span id="A1.p4.pic1.2.6.1" class="ltx_text" style="--ltx-fg-color:#000000;">{{Summary}}

<br class="ltx_break">
<br class="ltx_break"></span></span>
<span id="A1.p4.pic1.2.7" class="ltx_p"><span id="A1.p4.pic1.2.7.1" class="ltx_text" style="--ltx-fg-color:#000000;">Evaluation Form (scores ONLY):

<br class="ltx_break">
<br class="ltx_break"></span></span>
<span id="A1.p4.pic1.2.8" class="ltx_p"><span id="A1.p4.pic1.2.8.1" class="ltx_text" style="--ltx-fg-color:#000000;">- Consistency:

<br class="ltx_break">
<br class="ltx_break"></span></span>
<span id="A1.p4.pic1.2.9" class="ltx_p"><span id="A1.p4.pic1.2.9.1" class="ltx_text" style="--ltx-fg-color:#000000;">What is the consistency of the summary above? Provide only rating and no other text.</span></span>
</span></span></span></foreignobject></g></g></svg>