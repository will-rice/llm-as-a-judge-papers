<svg id="A8.p3.pic1" class="ltx_picture" height="743.03" overflow="visible" version="1.1" viewbox="0 0 550 743.03" width="550"><g style="--ltx-stroke-color:#000000;--ltx-fill-color:#000000;" fill="#000000" stroke="#000000" stroke-width="0.4pt" transform="translate(0,743.03) matrix(1 0 0 -1 0 0)"><g style="--ltx-fill-color:#404040;" fill="#404040" fill-opacity="1.0"><path style="stroke:none" d="M 0 5.91 L 0 737.13 C 0 740.39 2.64 743.03 5.91 743.03 L 544.09 743.03 C 547.36 743.03 550 740.39 550 737.13 L 550 5.91 C 550 2.64 547.36 0 544.09 0 L 5.91 0 C 2.64 0 0 2.64 0 5.91 Z" /></g><g style="--ltx-fill-color:#F2F2F2;" fill="#F2F2F2" fill-opacity="1.0"><path style="stroke:none" d="M 1.97 5.91 L 1.97 718.92 L 548.03 718.92 L 548.03 5.91 C 548.03 3.73 546.27 1.97 544.09 1.97 L 5.91 1.97 C 3.73 1.97 1.97 3.73 1.97 5.91 Z" /></g><g fill-opacity="1.0" transform="matrix(1.0 0.0 0.0 1.0 21.65 727.52)"><foreignobject style="--ltx-fo-width:36.62em;--ltx-fo-height:0.69em;--ltx-fo-depth:0.19em;font-size:10pt;" height="12.3" overflow="visible" transform="matrix(1 0 0 -1 0 9.61)" width="506.72"><span class="ltx_foreignobject_container"><span class="ltx_foreignobject_content">
<span id="A8.p3.pic1.1" class="ltx_inline-block ltx_minipage ltx_align_bottom" style="width:36.62em;">
<span id="A8.p3.pic1.1.1" class="ltx_p"><span id="A8.p3.pic1.1.1.1" class="ltx_text" style="--ltx-fg-color:#FFFFFF;">Judgment Dimension Categorization Prompt</span></span>
</span></span></span></foreignobject></g><g fill-opacity="1.0" transform="matrix(1.0 0.0 0.0 1.0 21.65 16.85)"><foreignobject style="--ltx-fo-width:34.88em;--ltx-fo-height:49.89em;--ltx-fo-depth:0.22em;font-size:10pt;" height="693.34" overflow="visible" transform="matrix(1 0 0 -1 0 690.27)" width="482.64"><span class="ltx_foreignobject_container"><span class="ltx_foreignobject_content">
<span id="A8.p3.pic1.2" class="ltx_inline-block ltx_minipage ltx_align_bottom" style="width:34.88em;">
<span id="A8.p3.pic1.2.1" class="ltx_p"><span id="A8.p3.pic1.2.1.1" class="ltx_text ltx_font_typewriter" style="--ltx-fg-color:#000000;">Given a pairwise comparison judgment made by an AI, please categorize each considered aspect in the rationale to one of the following categories:
</span></span>
<span id="A8.p3.pic1.2.2" class="ltx_p"><span id="A8.p3.pic1.2.2.1" class="ltx_text ltx_font_typewriter" style="--ltx-fg-color:#000000;">{</span></span>
<span id="A8.p3.pic1.2.3" class="ltx_p"><span id="A8.p3.pic1.2.3.1" class="ltx_text ltx_font_typewriter" style="--ltx-fg-color:#000000;">&quot;Factuality&quot;: &quot;Whether the information provided in the response is accurate, based on reliable facts and data.&quot;,
</span></span>
<span id="A8.p3.pic1.2.4" class="ltx_p"><span id="A8.p3.pic1.2.4.1" class="ltx_text ltx_font_typewriter" style="--ltx-fg-color:#000000;">&quot;User Satisfaction&quot;: &quot;Whether the response meets the user’s question and needs, and provides a comprehensive and appropriate answer to the question.&quot;,
</span></span>
<span id="A8.p3.pic1.2.5" class="ltx_p"><span id="A8.p3.pic1.2.5.1" class="ltx_text ltx_font_typewriter" style="--ltx-fg-color:#000000;">&quot;Logical Coherence&quot;: &quot;Whether the response maintains overall consistency and logical coherence between different sections, avoiding self-contradiction.&quot;,
</span></span>
<span id="A8.p3.pic1.2.6" class="ltx_p"><span id="A8.p3.pic1.2.6.1" class="ltx_text ltx_font_typewriter" style="--ltx-fg-color:#000000;">&quot;Richness&quot;: &quot;Whether the response includes rich info, depth, context, diversity, detailed explanations and examples to meet user needs and provide a comprehensive understanding.&quot;,
</span></span>
<span id="A8.p3.pic1.2.7" class="ltx_p"><span id="A8.p3.pic1.2.7.1" class="ltx_text ltx_font_typewriter" style="--ltx-fg-color:#000000;">&quot;Creativity&quot;: &quot;Whether the response is innovative or unique, providing novel insights or solutions.&quot;,
</span></span>
<span id="A8.p3.pic1.2.8" class="ltx_p"><span id="A8.p3.pic1.2.8.1" class="ltx_text ltx_font_typewriter" style="--ltx-fg-color:#000000;">&quot;Fairness and Responsibility&quot;: &quot;Whether the advice or information provided in the response is feasible, carries acertain degree of responsibility, and considers potential risks and consequences.&quot;,
</span></span>
<span id="A8.p3.pic1.2.9" class="ltx_p"><span id="A8.p3.pic1.2.9.1" class="ltx_text ltx_font_typewriter" style="--ltx-fg-color:#000000;">&quot;Completeness&quot;: &quot;Whether the response provides sufficient information and details to meet the user’s needs, and whether it avoids omitting important aspects.&quot;,
</span></span>
<span id="A8.p3.pic1.2.10" class="ltx_p"><span id="A8.p3.pic1.2.10.1" class="ltx_text ltx_font_typewriter" style="--ltx-fg-color:#000000;">&quot;Clarity&quot;: &quot;Whether the response is clear and understandable, and whether it uses concise language and structure so that the user can easily understand it.&quot;,
</span></span>
<span id="A8.p3.pic1.2.11" class="ltx_p"><span id="A8.p3.pic1.2.11.1" class="ltx_text ltx_font_typewriter" style="--ltx-fg-color:#000000;">&quot;Others&quot;: &quot;Other aspects which is not listed above.&quot;
</span></span>
<span id="A8.p3.pic1.2.12" class="ltx_p"><span id="A8.p3.pic1.2.12.1" class="ltx_text ltx_font_typewriter" style="--ltx-fg-color:#000000;">}</span></span>
<span id="A8.p3.pic1.2.13" class="ltx_p"><span id="A8.p3.pic1.2.13.1" class="ltx_text ltx_font_typewriter" style="--ltx-fg-color:#000000;">## Judgment: [JUDGMENT]
</span></span>
<span id="A8.p3.pic1.2.14" class="ltx_p"><span id="A8.p3.pic1.2.14.1" class="ltx_text ltx_font_typewriter" style="--ltx-fg-color:#000000;">Please output the generated content in a json format, for example:
{
&quot;Factuality&quot;: // list, all aspects that belong to this category, such as [&quot;correctness&quot;, &quot;mistakes&quot;]
...
}
</span></span>
<span id="A8.p3.pic1.2.15" class="ltx_p"><span id="A8.p3.pic1.2.15.1" class="ltx_text ltx_font_typewriter" style="--ltx-fg-color:#000000;">Formatted the abovementioned schema and categorize aspects in the judgment:
</span></span>
</span></span></span></foreignobject></g></g></svg>