<span id="A1.SSx2.p2.pic1.2.1" class="ltx_p"><span id="A1.SSx2.p2.pic1.2.1.1" class="ltx_text ltx_font_italic" style="--ltx-fg-color:#000000;">Theme 2: Recognition Perceived as Important<span id="A1.SSx2.p2.pic1.2.1.1.1" class="ltx_text"></span></span></span>
<span id="A1.I4" class="ltx_itemize">
<span id="A1.I4.i1" class="ltx_item" style="list-style-type:none;"><span class="ltx_tag ltx_tag_item">•</span> 
<span id="A1.I4.i1.p1" class="ltx_para">
<span id="A1.I4.i1.p1.1" class="ltx_p"><span id="A1.I4.i1.p1.1.1" class="ltx_text ltx_font_bold" style="--ltx-fg-color:#000000;">Description:</span><span id="A1.I4.i1.p1.1.2" class="ltx_text" style="--ltx-fg-color:#000000;"> Individuals indicated there are many different recognition opportunities for career development, training, and promotion, some feel this is contributing to motivation and engagement. The ability to provide pathways for recognition and advancement was frequently cited as something that is valued. Some individuals connected recognition and advancement, reinforcing perceptions of value associated with recognition.</span></span>
</span></span>
<span id="A1.I4.i2" class="ltx_item" style="list-style-type:none;"><span class="ltx_tag ltx_tag_item">•</span> 
<span id="A1.I4.i2.p1" class="ltx_para">
<span id="A1.I4.i2.p1.1" class="ltx_p"><span id="A1.I4.i2.p1.1.1" class="ltx_text ltx_font_bold" style="--ltx-fg-color:#000000;">Quote:</span><span id="A1.I4.i2.p1.1.2" class="ltx_text" style="--ltx-fg-color:#000000;"> &quot;Lot of opportunities to be recognized, which is something I appreciate. Being recognized is important to advancement I think.&quot;</span></span>
</span></span>
</span>
</span></span></span></foreignobject></g></g></svg>