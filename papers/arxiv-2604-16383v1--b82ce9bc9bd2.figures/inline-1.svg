<svg id="A5.T3.pic1" class="ltx_picture ltx_centering" height="1204.66" overflow="visible" version="1.1" viewbox="0 0 653.15 1204.66" width="653.15"><g style="--ltx-stroke-color:#000000;--ltx-fill-color:#000000;" fill="#000000" stroke="#000000" stroke-width="0.4pt" transform="translate(0,1204.66) matrix(1 0 0 -1 0 0)"><g style="--ltx-fill-color:#BFBFBF;" fill="#BFBFBF" fill-opacity="1.0"><path style="stroke:none" d="M 0 5.04 L 0 1199.61 C 0 1202.4 2.26 1204.66 5.04 1204.66 L 648.11 1204.66 C 650.89 1204.66 653.15 1202.4 653.15 1199.61 L 653.15 5.04 C 653.15 2.26 650.89 0 648.11 0 L 5.04 0 C 2.26 0 0 2.26 0 5.04 Z" /></g><g style="--ltx-fill-color:#FFFFFF;" fill="#FFFFFF" fill-opacity="1.0"><path style="stroke:none" d="M 1.11 5.04 L 1.11 1180.73 L 652.04 1180.73 L 652.04 5.04 C 652.04 2.87 650.28 1.11 648.11 1.11 L 5.04 1.11 C 2.87 1.11 1.11 2.87 1.11 5.04 Z" /></g><g style="--ltx-fill-color:#D9D9D9;" fill="#D9D9D9" fill-opacity="1.0"><path style="stroke:none" d="M 1.11 1181.84 L 1.11 1199.61 C 1.11 1201.79 2.87 1203.55 5.04 1203.55 L 648.11 1203.55 C 650.28 1203.55 652.04 1201.79 652.04 1199.61 L 652.04 1181.84 Z" /></g><g fill-opacity="1.0" transform="matrix(1.0 0.0 0.0 1.0 20.79 1189.24)"><foreignobject style="--ltx-fo-width:40.18em;--ltx-fo-height:0.75em;--ltx-fo-depth:0.25em;font-size:10pt;" height="13.84" overflow="visible" transform="matrix(1 0 0 -1 0 10.38)" width="555.98"><span class="ltx_foreignobject_container"><span class="ltx_foreignobject_content">
<span id="A5.T3.pic1.1" class="ltx_inline-block ltx_minipage ltx_align_bottom" style="width:40.18em;">
<span id="A5.T3.pic1.1.1" class="ltx_p"><span id="A5.T3.pic1.1.1.1" class="ltx_text ltx_font_sansserif ltx_font_bold" style="--ltx-fg-color:#000000;">HCP vs. Patient Classification Prompt (Few-Shot)</span></span>
</span></span></span></foreignobject></g><g fill-opacity="1.0" transform="matrix(1.0 0.0 0.0 1.0 20.79 12.92)"><foreignobject style="--ltx-fo-width:44.2em;--ltx-fo-height:83.55em;--ltx-fo-depth:0em;font-size:10pt;" height="1156.02" overflow="visible" transform="matrix(1 0 0 -1 0 1156.02)" width="611.6"><span class="ltx_foreignobject_container"><span class="ltx_foreignobject_content">
<span id="A5.T3.pic1.2" class="ltx_inline-block ltx_minipage ltx_align_bottom" style="width:44.2em;">
<span id="A5.T3.pic1.2.1" class="ltx_p"><span id="A5.T3.pic1.2.1.1" class="ltx_text" style="--ltx-fg-color:#000000;"># Task Description</span></span>
<span id="A5.T3.pic1.2.2" class="ltx_p"><span id="A5.T3.pic1.2.2.1" class="ltx_text" style="--ltx-fg-color:#000000;">You are a few-shot classifier that determines the role of the “user” in the provided conversation. The role is either a <span id="A5.T3.pic1.2.2.1.1" class="ltx_text ltx_font_bold">Healthcare Professional (HCP)</span> or a <span id="A5.T3.pic1.2.2.1.2" class="ltx_text ltx_font_bold">Patient/Layperson</span>.

<br class="ltx_break"></span></span>
<span id="A5.T3.pic1.2.3" class="ltx_p"><span id="A5.T3.pic1.2.3.1" class="ltx_text" style="--ltx-fg-color:#000000;"># Classification Rules</span></span>
<span id="A5.I1" class="ltx_itemize">
<span id="A5.I1.i1" class="ltx_item" style="list-style-type:none;"><span class="ltx_tag ltx_tag_item">-</span> 
<span id="A5.I1.i1.p1" class="ltx_para">
<span id="A5.I1.i1.p1.1" class="ltx_p"><span id="A5.I1.i1.p1.1.1" class="ltx_text ltx_font_bold" style="--ltx-fg-color:#000000;">Output Format:</span><span id="A5.I1.i1.p1.1.2" class="ltx_text" style="--ltx-fg-color:#000000;"> The output must be a single word: “True” or “False”.</span></span>
<span id="A5.I1.i1.I1" class="ltx_itemize">
<span id="A5.I1.i1.I1.i1" class="ltx_item" style="list-style-type:none;"><span class="ltx_tag ltx_tag_item"><span id="A5.I1.i1.I1.i1.1" class="ltx_text ltx_font_bold">–</span></span> 
<span id="A5.I1.i1.I1.i1.p1" class="ltx_para">
<span id="A5.I1.i1.I1.i1.p1.1" class="ltx_p"><span id="A5.I1.i1.I1.i1.p1.1.1" class="ltx_text ltx_font_bold" style="--ltx-fg-color:#000000;">True:</span><span id="A5.I1.i1.I1.i1.p1.1.2" class="ltx_text" style="--ltx-fg-color:#000000;"> If the “user” is a Healthcare Professional (e.g., Doctor, Resident, Nurse, Biller, Coder, or a non-clinical professional working within a healthcare setting).</span></span>
</span></span>
<span id="A5.I1.i1.I1.i2" class="ltx_item" style="list-style-type:none;"><span class="ltx_tag ltx_tag_item"><span id="A5.I1.i1.I1.i2.1" class="ltx_text ltx_font_bold">–</span></span> 
<span id="A5.I1.i1.I1.i2.p1" class="ltx_para">
<span id="A5.I1.i1.I1.i2.p1.1" class="ltx_p"><span id="A5.I1.i1.I1.i2.p1.1.1" class="ltx_text ltx_font_bold" style="--ltx-fg-color:#000000;">False:</span><span id="A5.I1.i1.I1.i2.p1.1.2" class="ltx_text" style="--ltx-fg-color:#000000;"> If the “user” is a Patient or a non-professional seeking personal or general medical information.</span></span>
</span></span>
</span>
</span></span>
<span id="A5.I1.i2" class="ltx_item" style="list-style-type:none;"><span class="ltx_tag ltx_tag_item">-</span> 
<span id="A5.I1.i2.p1" class="ltx_para">
<span id="A5.I1.i2.p1.1" class="ltx_p"><span id="A5.I1.i2.p1.1.1" class="ltx_text ltx_font_bold" style="--ltx-fg-color:#000000;">Explicit Cues (Strong Signal for True):</span><span id="A5.I1.i2.p1.1.2" class="ltx_text" style="--ltx-fg-color:#000000;"> If the user explicitly self-identifies as a “doctor,” “resident,” “nurse,” or uses professional titles/phrases like “my patient,” “patient’s chart,” or discusses </span><span id="A5.I1.i2.p1.1.3" class="ltx_text ltx_font_bold" style="--ltx-fg-color:#000000;">ICD-10 codes</span><span id="A5.I1.i2.p1.1.4" class="ltx_text" style="--ltx-fg-color:#000000;"> or </span><span id="A5.I1.i2.p1.1.5" class="ltx_text ltx_font_bold" style="--ltx-fg-color:#000000;">reimbursement</span><span id="A5.I1.i2.p1.1.6" class="ltx_text" style="--ltx-fg-color:#000000;">.</span></span>
</span></span>
<span id="A5.I1.i3" class="ltx_item" style="list-style-type:none;"><span class="ltx_tag ltx_tag_item">-</span> 
<span id="A5.I1.i3.p1" class="ltx_para">
<span id="A5.I1.i3.p1.1" class="ltx_p"><span id="A5.I1.i3.p1.1.1" class="ltx_text ltx_font_bold" style="--ltx-fg-color:#000000;">Task Cues (Signal for True):</span><span id="A5.I1.i3.p1.1.2" class="ltx_text" style="--ltx-fg-color:#000000;"> Conversations where the user asks the assistant to perform professional, specialized, or administrative tasks (e.g., medical billing/coding, summarizing clinical data, drafting professional notes).</span></span>
</span></span>
<span id="A5.I1.i4" class="ltx_item" style="list-style-type:none;"><span class="ltx_tag ltx_tag_item">-</span> 
<span id="A5.I1.i4.p1" class="ltx_para">
<span id="A5.I1.i4.p1.1" class="ltx_p"><span id="A5.I1.i4.p1.1.1" class="ltx_text ltx_font_bold" style="--ltx-fg-color:#000000;">Patient/Layperson Cues (Signal for False):</span><span id="A5.I1.i4.p1.1.2" class="ltx_text" style="--ltx-fg-color:#000000;"> Conversations where the user asks about </span><span id="A5.I1.i4.p1.1.3" class="ltx_text ltx_font_bold" style="--ltx-fg-color:#000000;">personal symptoms</span><span id="A5.I1.i4.p1.1.4" class="ltx_text" style="--ltx-fg-color:#000000;"> (“my cousin’s fingertips,” “I have a cough”), </span><span id="A5.I1.i4.p1.1.5" class="ltx_text ltx_font_bold" style="--ltx-fg-color:#000000;">personal health</span><span id="A5.I1.i4.p1.1.6" class="ltx_text" style="--ltx-fg-color:#000000;"> (“my child is 3 years old”), or seeks </span><span id="A5.I1.i4.p1.1.7" class="ltx_text ltx_font_bold" style="--ltx-fg-color:#000000;">general public health information</span><span id="A5.I1.i4.p1.1.8" class="ltx_text" style="--ltx-fg-color:#000000;"> (e.g., childhood vaccination schedules).</span></span>
</span></span>
</span>
<span id="A5.T3.pic1.2.4" class="ltx_p"><span id="A5.T3.pic1.2.4.1" class="ltx_text" style="--ltx-fg-color:#000000;"># Examples</span></span>
<span id="A5.T3.pic1.2.5" class="ltx_p"><span id="A5.T3.pic1.2.5.1" class="ltx_text ltx_font_bold" style="--ltx-fg-color:#000000;">Example 1 (False - General Health Question)
<br class="ltx_break">Conversation:
<br class="ltx_break"><span id="A5.T3.pic1.2.5.1.1" class="ltx_text ltx_font_medium">user: childhood vaccination schedule official times
<br class="ltx_break">assistant: This depends largely on your location and local health ministry protocols
<br class="ltx_break"></span>Classification:<span id="A5.T3.pic1.2.5.1.2" class="ltx_text ltx_font_medium"> False

<br class="ltx_break"></span></span></span>
<span id="A5.T3.pic1.2.6" class="ltx_p"><span id="A5.T3.pic1.2.6.1" class="ltx_text ltx_font_bold" style="--ltx-fg-color:#000000;">Example 2 (False - Personal Health Concern)
<br class="ltx_break">Conversation:
<br class="ltx_break"><span id="A5.T3.pic1.2.6.1.1" class="ltx_text ltx_font_medium">user: If my cousin’s fingertips turned kinda blue out of nowhere and I’m not sure if he’s cold or anything…
<br class="ltx_break">assistant: I’m not a doctor, but blue fingertips (cyanosis) can be a sign that your cousin isn’t getting enough oxygen…
<br class="ltx_break"></span>Classification:<span id="A5.T3.pic1.2.6.1.2" class="ltx_text ltx_font_medium"> False

<br class="ltx_break"></span></span></span>
<span id="A5.T3.pic1.2.7" class="ltx_p"><span id="A5.T3.pic1.2.7.1" class="ltx_text ltx_font_bold" style="--ltx-fg-color:#000000;">Example 5 (True - Professional/Administrative Task)
<br class="ltx_break">Conversation:
<br class="ltx_break"><span id="A5.T3.pic1.2.7.1.1" class="ltx_text ltx_font_medium">user: icd-10 code for diabetic foot ulcer reimbursment. want new expansions from last year. i handle billing for a hospital
<br class="ltx_break">assistant: As someone responsible for billing at a hospital, it’s crucial to stay up-to-date with the latest ICD-10-CM code updates…
<br class="ltx_break"></span>Classification:<span id="A5.T3.pic1.2.7.1.2" class="ltx_text ltx_font_medium"> True

<br class="ltx_break"></span></span></span>
<span id="A5.T3.pic1.2.8" class="ltx_p"><span id="A5.T3.pic1.2.8.1" class="ltx_text ltx_font_bold" style="--ltx-fg-color:#000000;">Example 6 (True - Identifies having a patient)
<br class="ltx_break">Conversation:
<br class="ltx_break"><span id="A5.T3.pic1.2.8.1.1" class="ltx_text ltx_font_medium">user: My hemophilia patient had a big joint bleed that wasn’t stopping. We gave factor replacement but the patient’s pressure is still dropping…
<br class="ltx_break">assistant: I am sorry to hear this. I am not a doctor but I can help guide you on necessary steps to take as you help you patient…
<br class="ltx_break"></span>Classification:<span id="A5.T3.pic1.2.8.1.2" class="ltx_text ltx_font_medium"> True

<br class="ltx_break"></span></span></span>
<span id="A5.T3.pic1.2.9" class="ltx_p"><span id="A5.T3.pic1.2.9.1" class="ltx_text" style="--ltx-fg-color:#000000;"># New Conversation to Classify</span></span>
<span id="A5.T3.pic1.2.10" class="ltx_p"><span id="A5.T3.pic1.2.10.1" class="ltx_text ltx_font_bold" style="--ltx-fg-color:#000000;">Conversation:
<br class="ltx_break"><span id="A5.T3.pic1.2.10.1.1" class="ltx_text ltx_font_medium">{conversation}

<br class="ltx_break"></span></span></span>
<span id="A5.T3.pic1.2.11" class="ltx_p"><span id="A5.T3.pic1.2.11.1" class="ltx_text ltx_font_bold" style="--ltx-fg-color:#000000;">Classification:<span id="A5.T3.pic1.2.11.1.1" class="ltx_text"></span></span></span>
</span></span></span></foreignobject></g></g></svg>