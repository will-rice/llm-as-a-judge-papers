<span id="A5.F17.pic1.1.1" class="ltx_p"><span id="A5.F17.pic1.1.1.1" class="ltx_text ltx_font_bold" style="--ltx-fg-color:#FFFFFF;">Rubric for MRewardBench subset: llmbar-adver-manual</span></span>
</span></span></span></foreignobject></g><g fill-opacity="1.0" transform="matrix(1.0 0.0 0.0 1.0 20.79 15.99)"><foreignobject style="--ltx-fo-width:31.5em;--ltx-fo-height:13.89em;--ltx-fo-depth:0.22em;font-size:10pt;" class="ltx_minipage" height="195.33" overflow="visible" transform="matrix(1 0 0 -1 0 192.26)" width="30em"><span class="ltx_foreignobject_container"><span class="ltx_foreignobject_content"><pre id="A5.F17.pic1.2" class="ltx_verbatim ltx_font_typewriter" style="--ltx-fg-color:#000000;">Pairwise judge for manually curated traps.
Steps:
1) Read the User Question and the answers from Assistant A and
   Assistant B.
2) Checks:
   - Trap robustness: avoids curated pitfalls; follows instructions
   exactly.
   - Accuracy: arithmetic/logic correct; no hallucinations.
   - Constraint adherence: explicit constraints fully met.
   - Justified steps: if shown, steps are consistent and error-free.
3) Penalize: hallucinations, calculation/logic slips, constraint
   violations.
4) Decision: choose Assistant A if it remains accurate and compliant
   while avoiding traps; otherwise choose Assistant B.
5) Neutrality: ignore presentation order, assistant names, and length.

</pre></span></span></foreignobject></g></g></svg>