<svg id="A4.pic1" class="ltx_picture ltx_centering" height="1321.43" overflow="visible" version="1.1" viewbox="0 0 653.15 1321.43" width="653.15"><g style="--ltx-stroke-color:#000000;--ltx-fill-color:#000000;" fill="#000000" stroke="#000000" stroke-width="0.4pt" transform="translate(0,1321.43) matrix(1 0 0 -1 0 0)"><g style="--ltx-fill-color:#91CC75;" fill="#91CC75" fill-opacity="1.0"><path style="stroke:none" d="M 0 7.61 L 0 1313.82 C 0 1318.02 3.41 1321.43 7.61 1321.43 L 645.54 1321.43 C 649.74 1321.43 653.15 1318.02 653.15 1313.82 L 653.15 7.61 C 653.15 3.41 649.74 0 645.54 0 L 7.61 0 C 3.41 0 0 3.41 0 7.61 Z" /></g><g style="--ltx-fill-color:#F2F2FF;" fill="#F2F2FF" fill-opacity="1.0"><path style="stroke:none" d="M 0.69 7.61 L 0.69 1299.87 L 652.46 1299.87 L 652.46 7.61 C 652.46 3.79 649.36 0.69 645.54 0.69 L 7.61 0.69 C 3.79 0.69 0.69 3.79 0.69 7.61 Z" /></g><g fill-opacity="1.0" transform="matrix(1.0 0.0 0.0 1.0 20.38 1307.19)"><foreignobject style="--ltx-fo-width:38.49em;--ltx-fo-height:0.69em;--ltx-fo-depth:0.19em;font-size:10pt;" height="12.3" overflow="visible" transform="matrix(1 0 0 -1 0 9.61)" width="532.59"><span class="ltx_foreignobject_container"><span class="ltx_foreignobject_content">
<span id="A4.pic1.1" class="ltx_inline-block ltx_minipage ltx_align_bottom" style="width:38.49em;">
<span id="A4.pic1.1.1" class="ltx_p"><span id="A4.pic1.1.1.1" class="ltx_text ltx_font_bold" style="--ltx-fg-color:#FFFFFF;">Preference Filpping Example 1</span></span>
</span></span></span></foreignobject></g><g fill-opacity="1.0" transform="matrix(1.0 0.0 0.0 1.0 20.38 12.5)"><foreignobject style="--ltx-fo-width:44.26em;--ltx-fo-height:92.19em;--ltx-fo-depth:0em;font-size:10pt;" height="1275.57" overflow="visible" transform="matrix(1 0 0 -1 0 1275.57)" width="612.43"><span class="ltx_foreignobject_container"><span class="ltx_foreignobject_content"><span id="A4.pic1.2" class="ltx_inline-logical-block ltx_minipage ltx_align_bottom" style="width:44.26em;">
<span id="A4.pic1.p1" class="ltx_para ltx_noindent">
<span id="A4.pic1.p1.1" class="ltx_p"><span id="A4.pic1.p1.1.1" class="ltx_text ltx_font_bold" style="--ltx-fg-color:#000000;">Instruction:</span><span id="A4.pic1.p1.1.2" class="ltx_text" style="--ltx-fg-color:#000000;"> When the sun is 22° above the horizon, how long is the shadow cast by a building that is 60 meters high?</span>
<br class="ltx_break"></span>
</span>
<div class="ltx_pagination ltx_role_start_2_columns"></div>
<span id="A4.pic1.p2" class="ltx_para ltx_noindent"><span class="ltx_inline-block"><svg id="A4.pic1.p2.pic1" class="ltx_picture" color="#000000" height="369.72" overflow="visible" version="1.1" viewbox="0 0 612.4 369.72" width="612.4"><g style="--ltx-stroke-color:#000000;--ltx-fill-color:#000000;" fill="#000000" stroke="#000000" stroke-width="0.4pt" transform="translate(0,369.72) matrix(1 0 0 -1 0 0)"><g style="--ltx-fill-color:#00B300;" fill="#00B300" fill-opacity="1.0"><path style="stroke:none" d="M 0 7.61 L 0 362.11 C 0 366.32 3.41 369.72 7.61 369.72 L 604.79 369.72 C 608.99 369.72 612.4 366.32 612.4 362.11 L 612.4 7.61 C 612.4 3.41 608.99 0 604.79 0 L 7.61 0 C 3.41 0 0 3.41 0 7.61 Z" /></g><g style="--ltx-fill-color:#E6FFE6;" fill="#E6FFE6" fill-opacity="1.0"><path style="stroke:none" d="M 0.69 7.61 L 0.69 362.11 C 0.69 365.93 3.79 369.03 7.61 369.03 L 604.79 369.03 C 608.61 369.03 611.7 365.93 611.7 362.11 L 611.7 7.61 C 611.7 3.79 608.61 0.69 604.79 0.69 L 7.61 0.69 C 3.79 0.69 0.69 3.79 0.69 7.61 Z" /></g><g fill-opacity="1.0" transform="matrix(1.0 0.0 0.0 1.0 20.38 15.19)"><foreignobject style="--ltx-fo-width:41.31em;--ltx-fo-height:24.72em;--ltx-fo-depth:0.19em;font-size:10pt;" height="344.72" overflow="visible" transform="matrix(1 0 0 -1 0 342.03)" width="571.61"><span class="ltx_foreignobject_container"><span class="ltx_foreignobject_content"><span id="A4.pic1.p2.pic1.1" class="ltx_inline-logical-block ltx_minipage ltx_align_bottom" style="width:41.31em;">
<span id="A4.pic1.p2.pic1.p1" class="ltx_para ltx_noindent">
<span id="A4.pic1.p2.pic1.p1.1" class="ltx_p"><span id="A4.pic1.p2.pic1.p1.1.1" class="ltx_text ltx_font_bold">Response A:</span> 
<br class="ltx_break">Here’s how to solve this problem:</span>
</span>
<span id="A4.pic1.p2.pic1.p2" class="ltx_para">
<span id="A4.pic1.p2.pic1.p2.1" class="ltx_p">Understanding the Concept</span>
<span id="A4.pic1.p2.pic1.p2.2" class="ltx_p">This problem involves trigonometry. We can use the tangent function:</span>
<span id="A4.I2" class="ltx_itemize">
<span id="A4.I2.i1" class="ltx_item" style="list-style-type:none;"><span class="ltx_tag ltx_tag_item"><span id="A4.I2.i1.1" class="ltx_text" style="--ltx-fg-color:#000000;">•</span></span> 
<span id="A4.I2.i1.p1" class="ltx_para">
<span id="A4.I2.i1.p1.1" class="ltx_p">tan(angle)= opposite side / adjacent side</span>
</span></span>
</span>
<span id="A4.pic1.p2.pic1.p2.3" class="ltx_p">In this case:</span>
<span id="A4.I3" class="ltx_itemize">
<span id="A4.I3.i1" class="ltx_item" style="list-style-type:none;"><span class="ltx_tag ltx_tag_item"><span id="A4.I3.i1.1" class="ltx_text" style="--ltx-fg-color:#000000;">•</span></span> 
<span id="A4.I3.i1.p1" class="ltx_para">
<span id="A4.I3.i1.p1.1" class="ltx_p">angle: <math id="A4.I3.i1.p1.m1" class="ltx_Math" alttext="22^{\circ}" display="inline" intent=":literal"><semantics><msup><mn>22</mn><mo>∘</mo></msup><annotation encoding="application/x-tex">22^{\circ}</annotation></semantics></math> (the angle the sun makes with the horizon)</span>
</span></span>
<span id="A4.I3.i2" class="ltx_item" style="list-style-type:none;"><span class="ltx_tag ltx_tag_item"><span id="A4.I3.i2.1" class="ltx_text" style="--ltx-fg-color:#000000;">•</span></span> 
<span id="A4.I3.i2.p1" class="ltx_para">
<span id="A4.I3.i2.p1.1" class="ltx_p">opposite side: 60 meters (the height of the building)</span>
</span></span>
<span id="A4.I3.i3" class="ltx_item" style="list-style-type:none;"><span class="ltx_tag ltx_tag_item"><span id="A4.I3.i3.1" class="ltx_text" style="--ltx-fg-color:#000000;">•</span></span> 
<span id="A4.I3.i3.p1" class="ltx_para">
<span id="A4.I3.i3.p1.1" class="ltx_p">adjacent side: the length of the shadow (what we want to find)</span>
</span></span>
</span>
<span id="A4.pic1.p2.pic1.p2.4" class="ltx_p">Calculation</span>
<span id="A4.I4" class="ltx_enumerate">
<span id="A4.I4.i1" class="ltx_item" style="list-style-type:none;"><span class="ltx_tag ltx_tag_item"><span id="A4.I4.i1.1" class="ltx_text" style="--ltx-fg-color:#000000;">1.</span></span> 
<span id="A4.I4.i1.p1" class="ltx_para">
<span id="A4.I4.i1.p1.1" class="ltx_p">Set up the equation:</span>
</span>
<span id="A4.I4.i1.p2" class="ltx_para">
<span id="A4.I4.i1.p2.1" class="ltx_p"><math id="A4.I4.i1.p2.m1" class="ltx_Math" alttext="\tan\left(22^{\circ}\right)=60" display="inline" intent=":literal"><semantics><mrow><mrow><mi>tan</mi><mo>⁡</mo><mrow><mo>(</mo><msup><mn>22</mn><mo>∘</mo></msup><mo>)</mo></mrow></mrow><mo>=</mo><mn>60</mn></mrow><annotation encoding="application/x-tex">\tan\left(22^{\circ}\right)=60</annotation></semantics></math> meters / adjacent side</span>
</span></span>
<span id="A4.I4.i2" class="ltx_item" style="list-style-type:none;"><span class="ltx_tag ltx_tag_item"><span id="A4.I4.i2.1" class="ltx_text" style="--ltx-fg-color:#000000;">2.</span></span> 
<span id="A4.I4.i2.p1" class="ltx_para">
<span id="A4.I4.i2.p1.1" class="ltx_p">Solve for the adjacent side (shadow length):</span>
</span>
<span id="A4.I4.i2.p2" class="ltx_para">
<span id="A4.I4.i2.p2.1" class="ltx_p">adjacent side <math id="A4.I4.i2.p2.m1" class="ltx_Math" alttext="=60" display="inline" intent=":literal"><semantics><mrow><mphantom></mphantom><mo>=</mo><mn>60</mn></mrow><annotation encoding="application/x-tex">=60</annotation></semantics></math> meters <math id="A4.I4.i2.p2.m2" class="ltx_Math" alttext="/\tan\left(22^{\circ}\right)" display="inline" intent=":literal"><semantics><mrow><mphantom></mphantom><mo>/</mo><mrow><mi>tan</mi><mo>⁡</mo><mrow><mo>(</mo><msup><mn>22</mn><mo>∘</mo></msup><mo>)</mo></mrow></mrow></mrow><annotation encoding="application/x-tex">/\tan\left(22^{\circ}\right)</annotation></semantics></math></span>
</span></span>
<span id="A4.I4.i3" class="ltx_item" style="list-style-type:none;"><span class="ltx_tag ltx_tag_item"><span id="A4.I4.i3.1" class="ltx_text" style="--ltx-fg-color:#000000;">3.</span></span> 
<span id="A4.I4.i3.p1" class="ltx_para">
<span id="A4.I4.i3.p1.1" class="ltx_p">Calculate:</span>
</span>
<span id="A4.I4.i3.p2" class="ltx_para">
<span id="A4.I4.i3.p2.1" class="ltx_p">adjacent side <math id="A4.I4.i3.p2.m1" class="ltx_Math" alttext="\approx 60" display="inline" intent=":literal"><semantics><mrow><mphantom></mphantom><mo>≈</mo><mn>60</mn></mrow><annotation encoding="application/x-tex">\approx 60</annotation></semantics></math> meters / <math id="A4.I4.i3.p2.m2" class="ltx_Math" alttext="0.404\approx 148.51" display="inline" intent=":literal"><semantics><mrow><mn>0.404</mn><mo>≈</mo><mn>148.51</mn></mrow><annotation encoding="application/x-tex">0.404\approx 148.51</annotation></semantics></math> meters</span>
</span></span>
</span>
<span id="A4.pic1.p2.pic1.p2.5" class="ltx_p">Answer</span>
<span id="A4.pic1.p2.pic1.p2.6" class="ltx_p">The shadow cast by the building is approximately 148.51 meters long.</span>
</span></span></span></span></foreignobject></g></g></svg>