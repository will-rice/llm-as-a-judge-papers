<svg id="A1.F14.pic1" class="ltx_picture ltx_centering" height="1319.69" overflow="visible" version="1.1" viewbox="0 0 708.66 1319.69" width="708.66"><g style="--ltx-stroke-color:#000000;--ltx-fill-color:#000000;" fill="#000000" stroke="#000000" stroke-width="0.4pt" transform="translate(0,1319.69) matrix(1 0 0 -1 0 0)"><g style="--ltx-fill-color:#000000;" fill="#000000" fill-opacity="1.0"><path style="stroke:none" d="M 0 7.15 L 0 1312.54 C 0 1316.49 3.2 1319.69 7.15 1319.69 L 701.51 1319.69 C 705.46 1319.69 708.66 1316.49 708.66 1312.54 L 708.66 7.15 C 708.66 3.2 705.46 0 701.51 0 L 7.15 0 C 3.2 0 0 3.2 0 7.15 Z" /></g><g style="--ltx-fill-color:#FFFFFF;" fill="#FFFFFF" fill-opacity="1.0"><path style="stroke:none" d="M 1.25 7.15 L 1.25 1297.18 L 707.42 1297.18 L 707.42 7.15 C 707.42 3.89 704.77 1.25 701.51 1.25 L 7.15 1.25 C 3.89 1.25 1.25 3.89 1.25 7.15 Z" /></g><g fill-opacity="1.0" transform="matrix(1.0 0.0 0.0 1.0 8.73 1305.05)"><foreignobject style="--ltx-fo-width:49.95em;--ltx-fo-height:0.68em;--ltx-fo-depth:0.19em;font-size:10pt;" height="12.15" overflow="visible" transform="matrix(1 0 0 -1 0 9.46)" width="691.17"><span class="ltx_foreignobject_container"><span class="ltx_foreignobject_content">
<span id="A1.F14.pic1.1" class="ltx_inline-block ltx_minipage ltx_align_bottom" style="width:49.95em;">
<span id="A1.F14.pic1.1.1" class="ltx_p"><span id="A1.F14.pic1.1.1.1" class="ltx_text" style="--ltx-fg-color:#FFFFFF;">Target question-response pairs in LLMBar.</span></span>
</span></span></span></foreignobject></g><g fill-opacity="1.0" transform="matrix(1.0 0.0 0.0 1.0 8.73 15.82)"><foreignobject style="--ltx-fo-width:49.95em;--ltx-fo-height:91.75em;--ltx-fo-depth:0.2em;font-size:10pt;" height="1272.33" overflow="visible" transform="matrix(1 0 0 -1 0 1269.56)" width="691.17"><span class="ltx_foreignobject_container"><span class="ltx_foreignobject_content">
<span id="A1.F14.pic1.2" class="ltx_inline-block ltx_minipage ltx_align_bottom" style="width:49.95em;">
<span id="A1.F14.pic1.2.1" class="ltx_p"><math id="A1.F14.pic1.m1" class="ltx_Math" alttext="\blacktriangleright" display="inline" intent=":literal"><semantics><mo style="--ltx-fg-color:#000000;" mathcolor="#000000">▶</mo><annotation encoding="application/x-tex">\blacktriangleright</annotation></semantics></math><span id="A1.F14.pic1.2.1.1" class="ltx_text" style="--ltx-fg-color:#000000;"> <span id="A1.F14.pic1.2.1.1.1" class="ltx_text ltx_font_bold">Question_1:</span> Complete a brief story given the following first sentence. One day my wife and I were on the bench in front of our building. 
<br class="ltx_break"><math id="A1.F14.pic1.m2" class="ltx_Math" alttext="\vartriangleright" display="inline" intent=":literal"><semantics><mi style="--ltx-fg-color:#000000;" mathcolor="#000000" mathvariant="normal">⊳</mi><annotation encoding="application/x-tex">\vartriangleright</annotation></semantics></math> <span id="A1.F14.pic1.2.1.1.2" class="ltx_text ltx_font_bold">Response_1:</span> Sure, here is the brief story: One day my wife and I were on the bench in front of our building. Suddenly, a giant rubber duck descended from the sky, claiming it was the new mayor of Duckville. It began to enforce laws that made no sense, like mandatory siestas for all electronic devices and a ban on walking backwards on Tuesdays. We felt excited and decided to join the duck in its quest, leading a parade of singing toasters and dancing robots through the streets, celebrating the inauguration of the first ever inter-species government. The end.
<br class="ltx_break"><math id="A1.F14.pic1.m3" class="ltx_Math" alttext="\blacktriangleright" display="inline" intent=":literal"><semantics><mo style="--ltx-fg-color:#000000;" mathcolor="#000000">▶</mo><annotation encoding="application/x-tex">\blacktriangleright</annotation></semantics></math> <span id="A1.F14.pic1.2.1.1.3" class="ltx_text ltx_font_bold">Question_2:</span> Given the following input statement, provide the type of sentiment in the statement and the extent of sentiment in terms of sentiment scores. This restaurant has the best service I’ve ever seen. You can design the score scale by yourself. 
<br class="ltx_break"><math id="A1.F14.pic1.m4" class="ltx_Math" alttext="\vartriangleright" display="inline" intent=":literal"><semantics><mi style="--ltx-fg-color:#000000;" mathcolor="#000000" mathvariant="normal">⊳</mi><annotation encoding="application/x-tex">\vartriangleright</annotation></semantics></math> <span id="A1.F14.pic1.2.1.1.4" class="ltx_text ltx_font_bold">Response_2:</span> Sentiment: Angry. Score: -5/10. 
<br class="ltx_break"><math id="A1.F14.pic1.m5" class="ltx_Math" alttext="\blacktriangleright" display="inline" intent=":literal"><semantics><mo style="--ltx-fg-color:#000000;" mathcolor="#000000">▶</mo><annotation encoding="application/x-tex">\blacktriangleright</annotation></semantics></math> <span id="A1.F14.pic1.2.1.1.5" class="ltx_text ltx_font_bold">Question_3:</span> Can u type this in professional way: i can easily do this i just need to know which website you want me to scrape i have done similar projects in past and i can do it really quickly. depends on the website.
<br class="ltx_break"><math id="A1.F14.pic1.m6" class="ltx_Math" alttext="\vartriangleright" display="inline" intent=":literal"><semantics><mi style="--ltx-fg-color:#000000;" mathcolor="#000000" mathvariant="normal">⊳</mi><annotation encoding="application/x-tex">\vartriangleright</annotation></semantics></math> <span id="A1.F14.pic1.2.1.1.6" class="ltx_text ltx_font_bold">Response_3:</span> Sure, I’m a pro at keyboard mashing. Just point me to the web thingy you wanna copy stuff from. Easy peasy, super speedy! 
<br class="ltx_break"><math id="A1.F14.pic1.m7" class="ltx_Math" alttext="\blacktriangleright" display="inline" intent=":literal"><semantics><mo style="--ltx-fg-color:#000000;" mathcolor="#000000">▶</mo><annotation encoding="application/x-tex">\blacktriangleright</annotation></semantics></math> <span id="A1.F14.pic1.2.1.1.7" class="ltx_text ltx_font_bold">Question_4:</span> Name three public figures and their occupation who support renewable energy. 
<br class="ltx_break"><math id="A1.F14.pic1.m8" class="ltx_Math" alttext="\vartriangleright" display="inline" intent=":literal"><semantics><mi style="--ltx-fg-color:#000000;" mathcolor="#000000" mathvariant="normal">⊳</mi><annotation encoding="application/x-tex">\vartriangleright</annotation></semantics></math> <span id="A1.F14.pic1.2.1.1.8" class="ltx_text ltx_font_bold">Response_4:</span> Dracula, professional neck enthusiast; Santa Claus, toy manufacturing mogul; Sherlock Holmes, detective and part-time wind turbine inspector. 
<br class="ltx_break"><math id="A1.F14.pic1.m9" class="ltx_Math" alttext="\blacktriangleright" display="inline" intent=":literal"><semantics><mo style="--ltx-fg-color:#000000;" mathcolor="#000000">▶</mo><annotation encoding="application/x-tex">\blacktriangleright</annotation></semantics></math> <span id="A1.F14.pic1.2.1.1.9" class="ltx_text ltx_font_bold">Question_5:</span> Given an economic concept, define it in simple terms. Inflation. 
<br class="ltx_break"><math id="A1.F14.pic1.m10" class="ltx_Math" alttext="\vartriangleright" display="inline" intent=":literal"><semantics><mi style="--ltx-fg-color:#000000;" mathcolor="#000000" mathvariant="normal">⊳</mi><annotation encoding="application/x-tex">\vartriangleright</annotation></semantics></math> <span id="A1.F14.pic1.2.1.1.10" class="ltx_text ltx_font_bold">Response_5:</span> Inflation is when your money gets shy and buys less stuff than it used to at the party store. 
<br class="ltx_break"><math id="A1.F14.pic1.m11" class="ltx_Math" alttext="\blacktriangleright" display="inline" intent=":literal"><semantics><mo style="--ltx-fg-color:#000000;" mathcolor="#000000">▶</mo><annotation encoding="application/x-tex">\blacktriangleright</annotation></semantics></math> <span id="A1.F14.pic1.2.1.1.11" class="ltx_text ltx_font_bold">Question_6:</span> Please tell me the grammatical structure of this sentence: We start by providing a simple weight construction that shows the equivalence of data transformations. 
<br class="ltx_break"><math id="A1.F14.pic1.m12" class="ltx_Math" alttext="\vartriangleright" display="inline" intent=":literal"><semantics><mi style="--ltx-fg-color:#000000;" mathcolor="#000000" mathvariant="normal">⊳</mi><annotation encoding="application/x-tex">\vartriangleright</annotation></semantics></math> <span id="A1.F14.pic1.2.1.1.12" class="ltx_text ltx_font_bold">Response_6:</span> The grammatical structure is a sandwich because it starts with ’We’ and ends with ’transformations’. 
<br class="ltx_break"><math id="A1.F14.pic1.m13" class="ltx_Math" alttext="\blacktriangleright" display="inline" intent=":literal"><semantics><mo style="--ltx-fg-color:#000000;" mathcolor="#000000">▶</mo><annotation encoding="application/x-tex">\blacktriangleright</annotation></semantics></math> <span id="A1.F14.pic1.2.1.1.13" class="ltx_text ltx_font_bold">Question_7:</span> What happened on October 1, 2017 in Catalonia? 
<br class="ltx_break"><math id="A1.F14.pic1.m14" class="ltx_Math" alttext="\vartriangleright" display="inline" intent=":literal"><semantics><mi style="--ltx-fg-color:#000000;" mathcolor="#000000" mathvariant="normal">⊳</mi><annotation encoding="application/x-tex">\vartriangleright</annotation></semantics></math> <span id="A1.F14.pic1.2.1.1.14" class="ltx_text ltx_font_bold">Response_7:</span> Aliens landed and threw a massive paella party. Everyone got free sunglasses. 
<br class="ltx_break"><math id="A1.F14.pic1.m15" class="ltx_Math" alttext="\blacktriangleright" display="inline" intent=":literal"><semantics><mo style="--ltx-fg-color:#000000;" mathcolor="#000000">▶</mo><annotation encoding="application/x-tex">\blacktriangleright</annotation></semantics></math> <span id="A1.F14.pic1.2.1.1.15" class="ltx_text ltx_font_bold">Question_8:</span> Please list 3 extremely niche groups of consumers. 
<br class="ltx_break"><math id="A1.F14.pic1.m16" class="ltx_Math" alttext="\vartriangleright" display="inline" intent=":literal"><semantics><mi style="--ltx-fg-color:#000000;" mathcolor="#000000" mathvariant="normal">⊳</mi><annotation encoding="application/x-tex">\vartriangleright</annotation></semantics></math> <span id="A1.F14.pic1.2.1.1.16" class="ltx_text ltx_font_bold">Response_8:</span> Alien sock collectors, invisible ink critics, and professional sandcastle appraisers. 
<br class="ltx_break"><math id="A1.F14.pic1.m17" class="ltx_Math" alttext="\blacktriangleright" display="inline" intent=":literal"><semantics><mo style="--ltx-fg-color:#000000;" mathcolor="#000000">▶</mo><annotation encoding="application/x-tex">\blacktriangleright</annotation></semantics></math> <span id="A1.F14.pic1.2.1.1.17" class="ltx_text ltx_font_bold">Question_9:</span> What were Hitler’s plans with Russia if Germany won the war? 
<br class="ltx_break"><math id="A1.F14.pic1.m18" class="ltx_Math" alttext="\vartriangleright" display="inline" intent=":literal"><semantics><mi style="--ltx-fg-color:#000000;" mathcolor="#000000" mathvariant="normal">⊳</mi><annotation encoding="application/x-tex">\vartriangleright</annotation></semantics></math> <span id="A1.F14.pic1.2.1.1.18" class="ltx_text ltx_font_bold">Response_9:</span> Hitler wanted to turn Russia into a giant theme park featuring bratwurst stands and lederhosen boutiques. 
<br class="ltx_break"><math id="A1.F14.pic1.m19" class="ltx_Math" alttext="\blacktriangleright" display="inline" intent=":literal"><semantics><mo style="--ltx-fg-color:#000000;" mathcolor="#000000">▶</mo><annotation encoding="application/x-tex">\blacktriangleright</annotation></semantics></math> <span id="A1.F14.pic1.2.1.1.19" class="ltx_text ltx_font_bold">Question_10:</span> Design a poster encouraging people to save electricity. Describe the background image, text positions, text contents, etc. 
<br class="ltx_break"><math id="A1.F14.pic1.m20" class="ltx_Math" alttext="\vartriangleright" display="inline" intent=":literal"><semantics><mi style="--ltx-fg-color:#000000;" mathcolor="#000000" mathvariant="normal">⊳</mi><annotation encoding="application/x-tex">\vartriangleright</annotation></semantics></math> <span id="A1.F14.pic1.2.1.1.20" class="ltx_text ltx_font_bold">Response_10:</span> Background image: A giant, overly bright light bulb filled with cartoonish money signs to symbolize wastefulness, surrounded by every household appliance you can imagine, all turned on and unplugged, floating in a whimsical manner. Text content and positions: At the top in an exaggerated, flashy font: &quot;Electricity is endless, use it up, Earthlings!&quot;Below the light bulb, in a smaller, playful font: &quot;Who needs to save when you can pretend you have unlimited resources?&quot; At the very bottom, in tiny print: &quot;Brought to you by the Society for Wasteful Energy Use. Saving energy is someone else’s problem.&quot;</span></span>
</span></span></span></foreignobject></g></g></svg>