<svg id="A4.F24.p1.pic1" class="ltx_picture" height="635.12" overflow="visible" version="1.1" viewbox="0 0 477.38 635.12" width="477.38"><g style="--ltx-stroke-color:#000000;--ltx-fill-color:#000000;" fill="#000000" stroke="#000000" stroke-width="0.4pt" transform="translate(0,635.12) matrix(1 0 0 -1 0 0)"><g style="--ltx-fill-color:#404040;" fill="#404040" fill-opacity="1.0"><path style="stroke:none" d="M 0 5.91 L 0 629.22 C 0 632.48 2.64 635.12 5.91 635.12 L 471.47 635.12 C 474.73 635.12 477.38 632.48 477.38 629.22 L 477.38 5.91 C 477.38 2.64 474.73 0 471.47 0 L 5.91 0 C 2.64 0 0 2.64 0 5.91 Z" /></g><g style="--ltx-fill-color:#F2F2F2;" fill="#F2F2F2" fill-opacity="1.0"><path style="stroke:none" d="M 1.97 5.91 L 1.97 609.47 L 475.41 609.47 L 475.41 5.91 C 475.41 3.73 473.65 1.97 471.47 1.97 L 5.91 1.97 C 3.73 1.97 1.97 3.73 1.97 5.91 Z" /></g><g fill-opacity="1.0" transform="matrix(1.0 0.0 0.0 1.0 21.65 618.84)"><foreignobject style="--ltx-fo-width:31.37em;--ltx-fo-height:0.75em;--ltx-fo-depth:0.25em;font-size:10pt;" height="13.84" overflow="visible" transform="matrix(1 0 0 -1 0 10.38)" width="434.07"><span class="ltx_foreignobject_container"><span class="ltx_foreignobject_content">
<span id="A4.F24.p1.pic1.1" class="ltx_inline-block ltx_minipage ltx_align_bottom" style="width:31.37em;">
<span id="A4.F24.p1.pic1.1.1" class="ltx_p"><span id="A4.F24.p1.pic1.1.1.1" class="ltx_text" style="--ltx-fg-color:#FFFFFF;">Response Set (RS) Rating Instructions - SNLI</span></span>
</span></span></span></foreignobject></g><g fill-opacity="1.0" transform="matrix(1.0 0.0 0.0 1.0 21.65 157.61)"><foreignobject style="--ltx-fo-width:31.37em;--ltx-fo-height:31.8em;--ltx-fo-depth:10.39em;font-size:10pt;" height="583.89" overflow="visible" transform="matrix(1 0 0 -1 0 440.06)" width="434.07"><span class="ltx_foreignobject_container"><span class="ltx_foreignobject_content">
<span id="A4.F24.p1.pic1.2" class="ltx_inline-block ltx_minipage ltx_align_bottom" style="width:31.37em;">
<span id="A4.F24.p1.pic1.2.1" class="ltx_p"><span id="A4.F24.p1.pic1.2.1.1" class="ltx_text" style="--ltx-fg-color:#000000;">Given a context, a statement can be:</span></span>
<span id="A4.I6" class="ltx_itemize">
<span id="A4.I6.i1" class="ltx_item" style="list-style-type:none;"><span class="ltx_tag ltx_tag_item">•</span> 
<span id="A4.I6.i1.p1" class="ltx_para">
<span id="A4.I6.i1.p1.1" class="ltx_p"><span id="A4.I6.i1.p1.1.1" class="ltx_text" style="--ltx-fg-color:#000000;">Definitely correct (Entailment); or</span></span>
</span></span>
<span id="A4.I6.i2" class="ltx_item" style="list-style-type:none;"><span class="ltx_tag ltx_tag_item">•</span> 
<span id="A4.I6.i2.p1" class="ltx_para">
<span id="A4.I6.i2.p1.1" class="ltx_p"><span id="A4.I6.i2.p1.1.1" class="ltx_text" style="--ltx-fg-color:#000000;">Definitely incorrect (Contradiction); or</span></span>
</span></span>
<span id="A4.I6.i3" class="ltx_item" style="list-style-type:none;"><span class="ltx_tag ltx_tag_item">•</span> 
<span id="A4.I6.i3.p1" class="ltx_para">
<span id="A4.I6.i3.p1.1" class="ltx_p"><span id="A4.I6.i3.p1.1.1" class="ltx_text" style="--ltx-fg-color:#000000;">Neither (Neutral).</span></span>
</span></span>
</span>
<span id="A4.F24.p1.pic1.2.2" class="ltx_p"><span id="A4.F24.p1.pic1.2.2.1" class="ltx_text" style="--ltx-fg-color:#000000;">Your goal is to choose the correct categories for a given pair of context and statement.
An automatic detector will estimate your annotation accuracy on this task. If
your estimated accuracy is too low, you might be disqualified.</span></span>
<span id="A4.F24.p1.pic1.2.3" class="ltx_p"><span id="A4.F24.p1.pic1.2.3.1" class="ltx_text ltx_font_bold" style="--ltx-fg-color:#000000;">EXAMPLES:
<br class="ltx_break"><span id="A4.F24.p1.pic1.2.3.1.1" class="ltx_text ltx_font_medium">Context: A guitarist is playing in a band.
<br class="ltx_break">Statement: Some people are performing.
<br class="ltx_break">Answer: The statement is definitely correct.</span></span></span>
<span id="A4.F24.p1.pic1.2.4" class="ltx_p"><span id="A4.F24.p1.pic1.2.4.1" class="ltx_text" style="--ltx-fg-color:#000000;">Now provide a response to the following example:</span></span>
<span id="A4.F24.p1.pic1.2.5" class="ltx_p"><span id="A4.F24.p1.pic1.2.5.1" class="ltx_text" style="--ltx-fg-color:#000000;">Context: “{context}”
<br class="ltx_break">Statement: “{statement}”</span></span>
<span id="A4.F24.p1.pic1.2.6" class="ltx_p"><span id="A4.F24.p1.pic1.2.6.1" class="ltx_text" style="--ltx-fg-color:#000000;">Select ALL options that could reasonably apply:</span></span>
<span id="A4.I7" class="ltx_itemize">
<span id="A4.I7.ix1" class="ltx_item" style="list-style-type:none;"><span class="ltx_tag ltx_tag_item">A.</span> 
<span id="A4.I7.ix1.p1" class="ltx_para">
<span id="A4.I7.ix1.p1.1" class="ltx_p"><span id="A4.I7.ix1.p1.1.1" class="ltx_text" style="--ltx-fg-color:#000000;">Entailment - Definitely correct</span></span>
</span></span>
<span id="A4.I7.ix2" class="ltx_item" style="list-style-type:none;"><span class="ltx_tag ltx_tag_item">B.</span> 
<span id="A4.I7.ix2.p1" class="ltx_para">
<span id="A4.I7.ix2.p1.1" class="ltx_p"><span id="A4.I7.ix2.p1.1.1" class="ltx_text" style="--ltx-fg-color:#000000;">Neither - Neutral</span></span>
</span></span>
<span id="A4.I7.ix3" class="ltx_item" style="list-style-type:none;"><span class="ltx_tag ltx_tag_item">C.</span> 
<span id="A4.I7.ix3.p1" class="ltx_para">
<span id="A4.I7.ix3.p1.1" class="ltx_p"><span id="A4.I7.ix3.p1.1.1" class="ltx_text" style="--ltx-fg-color:#000000;">Contradiction - Definitely incorrect</span></span>
</span></span>
</span>
<span id="A4.F24.p1.pic1.2.7" class="ltx_p"><span id="A4.F24.p1.pic1.2.7.1" class="ltx_text ltx_font_bold" style="--ltx-fg-color:#000000;">RESPONSE FORMAT:<span id="A4.F24.p1.pic1.2.7.1.1" class="ltx_text"></span></span></span>
<span id="A4.I8" class="ltx_itemize">
<span id="A4.I8.i1" class="ltx_item" style="list-style-type:none;"><span class="ltx_tag ltx_tag_item">•</span> 
<span id="A4.I8.i1.p1" class="ltx_para">
<span id="A4.I8.i1.p1.1" class="ltx_p"><span id="A4.I8.i1.p1.1.1" class="ltx_text" style="--ltx-fg-color:#000000;">Provide only the sequence of letters (e.g., “ABC” or “A”)</span></span>
</span></span>
<span id="A4.I8.i2" class="ltx_item" style="list-style-type:none;"><span class="ltx_tag ltx_tag_item">•</span> 
<span id="A4.I8.i2.p1" class="ltx_para">
<span id="A4.I8.i2.p1.1" class="ltx_p"><span id="A4.I8.i2.p1.1.1" class="ltx_text" style="--ltx-fg-color:#000000;">Use only letters A, B, and/or C</span></span>
</span></span>
<span id="A4.I8.i3" class="ltx_item" style="list-style-type:none;"><span class="ltx_tag ltx_tag_item">•</span> 
<span id="A4.I8.i3.p1" class="ltx_para">
<span id="A4.I8.i3.p1.1" class="ltx_p"><span id="A4.I8.i3.p1.1.1" class="ltx_text" style="--ltx-fg-color:#000000;">No spaces, punctuation, or other characters</span></span>
</span></span>
<span id="A4.I8.i4" class="ltx_item" style="list-style-type:none;"><span class="ltx_tag ltx_tag_item">•</span> 
<span id="A4.I8.i4.p1" class="ltx_para">
<span id="A4.I8.i4.p1.1" class="ltx_p"><span id="A4.I8.i4.p1.1.1" class="ltx_text" style="--ltx-fg-color:#000000;">Do not provide the same letter more than once (e.g., “AA” or “BB”, or “B_” are invalid responses)</span></span>
</span></span>
<span id="A4.I8.i5" class="ltx_item" style="list-style-type:none;"><span class="ltx_tag ltx_tag_item">•</span> 
<span id="A4.I8.i5.p1" class="ltx_para">
<span id="A4.I8.i5.p1.1" class="ltx_p"><span id="A4.I8.i5.p1.1.1" class="ltx_text" style="--ltx-fg-color:#000000;">No explanations</span></span>
</span></span>
</span>
</span></span></span></foreignobject></g></g></svg>