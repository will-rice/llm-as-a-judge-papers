<span class="ltx_foreignobject_container"><span class="ltx_foreignobject_content"><span id="S3.SS2.p1.pic1.1" class="ltx_text ltx_font_bold" style="--ltx-fg-color:#FFFFFF;">Finding 2</span></span></span></foreignobject></g></g></g><g fill-opacity="1.0" transform="matrix(1.0 0.0 0.0 1.0 17.36 14.51)"><foreignobject style="--ltx-fo-width:27.82em;--ltx-fo-height:9.09em;--ltx-fo-depth:0.19em;font-size:10pt;" height="128.53" overflow="visible" transform="matrix(1 0 0 -1 0 125.84)" width="384.95"><span class="ltx_foreignobject_container"><span class="ltx_foreignobject_content">
<span id="S3.SS2.p1.pic1.2" class="ltx_inline-block ltx_minipage ltx_align_bottom" style="width:27.82em;">
<span id="S3.SS2.p1.pic1.2.1" class="ltx_p"><span id="S3.SS2.p1.pic1.2.1.1" class="ltx_text ltx_font_bold" style="--ltx-fg-color:#000000;">As Judges, the same models can recognize contributions they overlook as Actors. This depends on what they see and what they are asked. Seeing the whole trajectory reveals how earlier actions contribute to later goal completion. Asking whether each action helped achieve the goal then distinguishes their contributions more clearly than asking whether the task will succeed, which gives similar scores to actions within a trajectory.</span></span>
</span></span></span></foreignobject></g></g></svg>