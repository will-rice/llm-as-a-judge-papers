<span id="A5.F23.pic1.1.1" class="ltx_p"><span id="A5.F23.pic1.1.1.1" class="ltx_text ltx_font_bold" style="--ltx-fg-color:#FFFFFF;">Rubric for MRewardBench subset: hep-python</span></span>
</span></span></span></foreignobject></g><g fill-opacity="1.0" transform="matrix(1.0 0.0 0.0 1.0 20.79 12.92)"><foreignobject style="--ltx-fo-width:31.5em;--ltx-fo-height:16.29em;--ltx-fo-depth:0em;font-size:10pt;" class="ltx_minipage" height="225.47" overflow="visible" transform="matrix(1 0 0 -1 0 225.47)" width="30em"><span class="ltx_foreignobject_container"><span class="ltx_foreignobject_content"><pre id="A5.F23.pic1.2" class="ltx_verbatim ltx_font_typewriter" style="--ltx-fg-color:#000000;">Pairwise judge for HumanEvalPack (Python).
Steps:
1) Read the function spec in the User Question; read code from
   Assistant A and Assistant B.
2) Checks:
   - Functional correctness: logic matches the spec; would pass
   canonical tests.
   - API contract: correct signature, imports, and return
   types/values.
   - Edge cases &amp; algorithm: handles edge inputs with sensible
   complexity.
   - Readability/idioms: clear, idiomatic Python.
3) Penalize: wrong signature/returns, missing imports, logic that
   obviously fails tests.
4) Decision: choose Assistant A if it would pass more tests while
   respecting the contract (or is simpler/clearer when both correct);
   otherwise choose Assistant B.
5) Neutrality: ignore presentation order and assistant names.

</pre></span></span></foreignobject></g></g></svg>