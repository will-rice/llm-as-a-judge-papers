<span id="A3.SS2.p2.pic1.2" class="ltx_inline-block ltx_minipage ltx_align_bottom" style="width:31.37em;">
<span id="A3.SS2.p2.pic1.2.1" class="ltx_p"><code id="A3.SS2.p2.pic1.2.1.1" class="ltx_verbatim ltx_font_typewriter" style="--ltx-fg-color:#000000;">{Source Language}</code><span id="A3.SS2.p2.pic1.2.1.2" class="ltx_text" style="--ltx-fg-color:#000000;"> source:</span></span>
<span id="A3.SS2.p2.pic1.2.2" class="ltx_p"><code id="A3.SS2.p2.pic1.2.2.1" class="ltx_verbatim ltx_font_typewriter" style="--ltx-fg-color:#000000;">{Source Text}</code></span>
<span id="A3.SS2.p2.pic1.2.3" class="ltx_p"><code id="A3.SS2.p2.pic1.2.3.1" class="ltx_verbatim ltx_font_typewriter" style="--ltx-fg-color:#000000;">{Target Language}</code><span id="A3.SS2.p2.pic1.2.3.2" class="ltx_text" style="--ltx-fg-color:#000000;"> human reference:</span></span>
<span id="A3.SS2.p2.pic1.2.4" class="ltx_p"><code id="A3.SS2.p2.pic1.2.4.1" class="ltx_verbatim ltx_font_typewriter" style="--ltx-fg-color:#000000;">{Reference Text}</code></span>
<span id="A3.SS2.p2.pic1.2.5" class="ltx_p"><code id="A3.SS2.p2.pic1.2.5.1" class="ltx_verbatim ltx_font_typewriter" style="--ltx-fg-color:#000000;">{Source Language}</code><span id="A3.SS2.p2.pic1.2.5.2" class="ltx_text" style="--ltx-fg-color:#000000;"> translation:</span></span>
<span id="A3.SS2.p2.pic1.2.6" class="ltx_p"><code id="A3.SS2.p2.pic1.2.6.1" class="ltx_verbatim ltx_font_typewriter" style="--ltx-fg-color:#000000;">{Translation Text}</code></span>
<span id="A3.SS2.p2.pic1.2.7" class="ltx_p"><span id="A3.SS2.p2.pic1.2.7.1" class="ltx_text" style="--ltx-fg-color:#000000;">Based on the source segment, human reference and machine translation surrounded with triple backticks, identify error types in the translation and classify them. The categories of errors are: accuracy (addition, mistranslation, omission, untranslated text), fluency (character encoding, grammar, inconsistency, punctuation, register, spelling), style (awkward), terminology (inappropriate for context, inconsistent use), non-translation, other, or no-error.
Each error is classified as one of three categories: critical, major, and minor. Critical errors inhibit comprehension of the text. Major errors disrupt the flow, but what the text is trying to say is still understandable. Minor errors are technically errors, but do not disrupt the flow or hinder comprehension.
Strictly output error classification results in this format:</span></span>
<span id="A3.SS2.p2.pic1.2.8" class="ltx_p"><span id="A3.SS2.p2.pic1.2.8.1" class="ltx_text" style="--ltx-fg-color:#000000;">Critical:</span></span>
<span id="A3.SS2.p2.pic1.2.9" class="ltx_p"><span id="A3.SS2.p2.pic1.2.9.1" class="ltx_text" style="--ltx-fg-color:#000000;">[error_type]-[error_spans] (one per line, use no-error if empty)</span></span>
<span id="A3.SS2.p2.pic1.2.10" class="ltx_p"><span id="A3.SS2.p2.pic1.2.10.1" class="ltx_text" style="--ltx-fg-color:#000000;">Major:</span></span>
<span id="A3.SS2.p2.pic1.2.11" class="ltx_p"><span id="A3.SS2.p2.pic1.2.11.1" class="ltx_text" style="--ltx-fg-color:#000000;">[error_type]-[error_spans] (one per line, use no-error if empty)</span></span>
<span id="A3.SS2.p2.pic1.2.12" class="ltx_p"><span id="A3.SS2.p2.pic1.2.12.1" class="ltx_text" style="--ltx-fg-color:#000000;">Minor:</span></span>
<span id="A3.SS2.p2.pic1.2.13" class="ltx_p"><span id="A3.SS2.p2.pic1.2.13.1" class="ltx_text" style="--ltx-fg-color:#000000;">[error_type]-[error_spans] (one per line, use no-error if empty).</span></span>
