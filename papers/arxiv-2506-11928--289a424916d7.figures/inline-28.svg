<svg id="S15.SS0.SSS0.Px11.p3.pic1" class="ltx_picture" height="240.74" overflow="visible" version="1.1" viewbox="0 0 477.38 240.74" width="477.38"><g style="--ltx-stroke-color:#000000;--ltx-fill-color:#000000;" fill="#000000" stroke="#000000" stroke-width="0.4pt" transform="translate(0,240.74) matrix(1 0 0 -1 0 0)"><g style="--ltx-fill-color:#4285F4;" fill="#4285F4" fill-opacity="1.0"><path style="stroke:none" d="M 0 7.5 L 0 233.24 C 0 237.38 3.36 240.74 7.5 240.74 L 469.87 240.74 C 474.02 240.74 477.38 237.38 477.38 233.24 L 477.38 7.5 C 477.38 3.36 474.02 0 469.87 0 L 7.5 0 C 3.36 0 0 3.36 0 7.5 Z" /></g><g style="--ltx-fill-color:#F5F5F5;" fill="#F5F5F5" fill-opacity="1.0"><path style="stroke:none" d="M 1.97 7.5 L 1.97 202.36 L 475.41 202.36 L 475.41 7.5 C 475.41 4.45 472.93 1.97 469.87 1.97 L 7.5 1.97 C 4.45 1.97 1.97 4.45 1.97 7.5 Z" /></g><g fill-opacity="1.0" transform="matrix(1.0 0.0 0.0 1.0 20.48 209.79)"><foreignobject style="--ltx-fo-width:27.43em;--ltx-fo-height:1.89em;--ltx-fo-depth:0.19em;font-size:10pt;" height="28.9" overflow="visible" transform="matrix(1 0 0 -1 0 26.21)" width="379.55"><span class="ltx_foreignobject_container"><span class="ltx_foreignobject_content">
<span id="S15.SS0.SSS0.Px11.p3.pic1.1" class="ltx_inline-block ltx_minipage ltx_align_bottom" style="width:27.43em;">
<span id="S15.SS0.SSS0.Px11.p3.pic1.1.1" class="ltx_p"><span id="S15.SS0.SSS0.Px11.p3.pic1.1.1.1" class="ltx_text" style="position:relative; bottom:0.9pt;"></span><a href="https://codeforces.com/blog/entry/137018" title class="ltx_ref ltx_href ltx_font_bold" style="--ltx-fg-color:#FFFFFF;">Tutorial</a><span id="S15.SS0.SSS0.Px11.p3.pic1.1.1.2" class="ltx_text ltx_font_bold" style="--ltx-fg-color:#FFFFFF;"> — <a href="https://codeforces.com/problemset/submission/2050/297202098" title class="ltx_ref ltx_href">Human’s accepted submission</a> — <a href="https://gist.github.com/anonymous-llm-code/6991a6a7968c3dc96b5310a6faef3a20" title class="ltx_ref ltx_href"><span class="ltx_text ltx_font_typewriter">Gemini 2.5 Pro</span>’s rejected submission</a></span></span>
</span></span></span></foreignobject></g><g fill-opacity="1.0" transform="matrix(1.0 0.0 0.0 1.0 20.48 16.07)"><foreignobject style="--ltx-fo-width:31.54em;--ltx-fo-height:12.69em;--ltx-fo-depth:0.25em;font-size:10pt;" height="179.11" overflow="visible" transform="matrix(1 0 0 -1 0 175.66)" width="436.42"><span class="ltx_foreignobject_container"><span class="ltx_foreignobject_content">
<span id="S15.SS0.SSS0.Px11.p3.pic1.2" class="ltx_inline-block ltx_minipage ltx_align_bottom" style="width:31.54em;">
<span id="S15.SS0.SSS0.Px11.p3.pic1.2.1" class="ltx_p"><span id="S15.SS0.SSS0.Px11.p3.pic1.2.1.1" class="ltx_text" style="--ltx-fg-color:#000000;">Let’s choose some vertices <math id="S15.SS0.SSS0.Px11.p3.pic1.m1" class="ltx_Math" alttext="a" display="inline" intent=":literal"><semantics><mi style="--ltx-fg-color:#000000;" mathcolor="#000000">a</mi><annotation encoding="application/x-tex">a</annotation></semantics></math> and <math id="S15.SS0.SSS0.Px11.p3.pic1.m2" class="ltx_Math" alttext="b" display="inline" intent=":literal"><semantics><mi style="--ltx-fg-color:#000000;" mathcolor="#000000">b</mi><annotation encoding="application/x-tex">b</annotation></semantics></math>, between which there are <math id="S15.SS0.SSS0.Px11.p3.pic1.m3" class="ltx_Math" alttext="k" display="inline" intent=":literal"><semantics><mi style="--ltx-fg-color:#000000;" mathcolor="#000000">k</mi><annotation encoding="application/x-tex">k</annotation></semantics></math> edges. Then, when removing this path, the tree will split into <math id="S15.SS0.SSS0.Px11.p3.pic1.m4" class="ltx_Math" alttext="s-2\cdot k" display="inline" intent=":literal"><semantics><mrow><mi style="--ltx-fg-color:#000000;" mathcolor="#000000">s</mi><mo style="--ltx-fg-color:#000000;" mathcolor="#000000">−</mo><mrow><mn style="--ltx-fg-color:#000000;" mathcolor="#000000">2</mn><mo style="--ltx-fg-color:#000000;" lspace="0.222em" mathcolor="#000000" rspace="0.222em">⋅</mo><mi style="--ltx-fg-color:#000000;" mathcolor="#000000">k</mi></mrow></mrow><annotation encoding="application/x-tex">s-2\cdot k</annotation></semantics></math>, where <math id="S15.SS0.SSS0.Px11.p3.pic1.m5" class="ltx_Math" alttext="s" display="inline" intent=":literal"><semantics><mi style="--ltx-fg-color:#000000;" mathcolor="#000000">s</mi><annotation encoding="application/x-tex">s</annotation></semantics></math> is the sum of the degrees of the vertices on the path (this is exactly how many edges are connected to the chosen path). 
<br class="ltx_break">
<br class="ltx_break">Let’s suspend the tree from vertex <math id="S15.SS0.SSS0.Px11.p3.pic1.m6" class="ltx_Math" alttext="1" display="inline" intent=":literal"><semantics><mn style="--ltx-fg-color:#000000;" mathcolor="#000000">1</mn><annotation encoding="application/x-tex">1</annotation></semantics></math>, and for each vertex <math id="S15.SS0.SSS0.Px11.p3.pic1.m7" class="ltx_Math" alttext="v" display="inline" intent=":literal"><semantics><mi style="--ltx-fg-color:#000000;" mathcolor="#000000">v</mi><annotation encoding="application/x-tex">v</annotation></semantics></math> of the given tree, we will calculate two values: <span id="S15.SS0.SSS0.Px11.p3.pic1.2.1.1.1" class="ltx_text ltx_markedasmath">dp[v].x</span> —the best answer if the path starts at vertex <math id="S15.SS0.SSS0.Px11.p3.pic1.m9" class="ltx_Math" alttext="v" display="inline" intent=":literal"><semantics><mi style="--ltx-fg-color:#000000;" mathcolor="#000000">v</mi><annotation encoding="application/x-tex">v</annotation></semantics></math> and ends in its subtree, and <span id="S15.SS0.SSS0.Px11.p3.pic1.2.1.1.2" class="ltx_text ltx_markedasmath">dp[v].y</span> —the best answer if the path passes through vertex <math id="S15.SS0.SSS0.Px11.p3.pic1.m11" class="ltx_Math" alttext="v" display="inline" intent=":literal"><semantics><mi style="--ltx-fg-color:#000000;" mathcolor="#000000">v</mi><annotation encoding="application/x-tex">v</annotation></semantics></math> from one of its children to another. The recalculations of the dynamic programming will be similar to those used in finding the diameter of the tree using dynamic programming. 
<br class="ltx_break">
<br class="ltx_break">The answer will be largest value among all <span id="S15.SS0.SSS0.Px11.p3.pic1.2.1.1.3" class="ltx_text ltx_markedasmath">dp[v].x</span> and <span id="S15.SS0.SSS0.Px11.p3.pic1.2.1.1.4" class="ltx_text ltx_markedasmath">dp[v].y</span>.</span></span>
</span></span></span></foreignobject></g></g></svg>