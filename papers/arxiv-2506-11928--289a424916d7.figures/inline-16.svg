<span id="S15.SS0.SSS0.Px5.p3.pic1.2" class="ltx_inline-block ltx_minipage ltx_align_bottom" style="width:31.54em;">
<span id="S15.SS0.SSS0.Px5.p3.pic1.2.1" class="ltx_p"><span id="S15.SS0.SSS0.Px5.p3.pic1.2.1.1" class="ltx_text" style="--ltx-fg-color:#000000;">Case <math id="S15.SS0.SSS0.Px5.p3.pic1.m1" class="ltx_Math" alttext="1" display="inline" intent=":literal"><semantics><mn style="--ltx-fg-color:#000000;" mathcolor="#000000">1</mn><annotation encoding="application/x-tex">1</annotation></semantics></math>: When all values appear an even number of times, Alice will lose. This is because no matter which number Alice chooses, Bob can mimic Alice’s move.

<br class="ltx_break">
<br class="ltx_break">Case <math id="S15.SS0.SSS0.Px5.p3.pic1.m2" class="ltx_Math" alttext="2" display="inline" intent=":literal"><semantics><mn style="--ltx-fg-color:#000000;" mathcolor="#000000">2</mn><annotation encoding="application/x-tex">2</annotation></semantics></math>: When at least one value appears an odd number of times, Alice will win. Alice only needs to choose the maximum value that appears an odd number of times, which will force Bob into Case <math id="S15.SS0.SSS0.Px5.p3.pic1.m3" class="ltx_Math" alttext="1" display="inline" intent=":literal"><semantics><mn style="--ltx-fg-color:#000000;" mathcolor="#000000">1</mn><annotation encoding="application/x-tex">1</annotation></semantics></math>.

<br class="ltx_break">
<br class="ltx_break">Time complexity: <math id="S15.SS0.SSS0.Px5.p3.pic1.m4" class="ltx_Math" alttext="O(n)" display="inline" intent=":literal"><semantics><mrow><mi style="--ltx-fg-color:#000000;" mathcolor="#000000">O</mi><mo>⁡</mo><mrow><mo style="--ltx-fg-color:#000000;" mathcolor="#000000" stretchy="false">(</mo><mi style="--ltx-fg-color:#000000;" mathcolor="#000000">n</mi><mo style="--ltx-fg-color:#000000;" mathcolor="#000000" stretchy="false">)</mo></mrow></mrow><annotation encoding="application/x-tex">O(n)</annotation></semantics></math>.</span></span>
</span></span></span></foreignobject></g></g></svg>