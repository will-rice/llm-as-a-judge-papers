<span id="A10.p2.pic1.1.1" class="ltx_p"><span id="A10.p2.pic1.1.1.1" class="ltx_text ltx_font_bold" style="--ltx-fg-color:#000000;">Pairwise Ranking Prompt Template</span></span>
</span></span></span></foreignobject></g><g fill-opacity="1.0" transform="matrix(1.0 0.0 0.0 1.0 21.65 16.47)"><foreignobject style="--ltx-fo-width:44.07em;--ltx-fo-height:22.29em;--ltx-fo-depth:0.19em;font-size:10pt;" height="311.18" overflow="visible" transform="matrix(1 0 0 -1 0 308.49)" width="609.8"><span class="ltx_foreignobject_container"><span class="ltx_foreignobject_content">
<span id="A10.p2.pic1.2" class="ltx_inline-block ltx_minipage ltx_align_bottom" style="width:44.07em;">
<span id="A10.p2.pic1.2.1" class="ltx_p"><span id="A10.p2.pic1.2.1.1" class="ltx_text" style="--ltx-fg-color:#000000;">###Task Description:</span></span>
<span id="A10.p2.pic1.2.2" class="ltx_p"><span id="A10.p2.pic1.2.2.1" class="ltx_text" style="--ltx-fg-color:#000000;">An instruction (might include an Input inside it), a response to evaluate, and a score rubric representing a evaluation criteria are given.</span></span>
<span id="A10.p2.pic1.2.3" class="ltx_p"><span id="A10.p2.pic1.2.3.1" class="ltx_text" style="--ltx-fg-color:#000000;">1. Write a detailed feedback that assess the quality of two responses strictly based on the given score rubric, not evaluating in general.</span></span>
<span id="A10.p2.pic1.2.4" class="ltx_p"><span id="A10.p2.pic1.2.4.1" class="ltx_text" style="--ltx-fg-color:#000000;">2. After writing a feedback, choose a better response between Response A and Response B. You should refer to the score rubric.</span></span>
<span id="A10.p2.pic1.2.5" class="ltx_p"><span id="A10.p2.pic1.2.5.1" class="ltx_text" style="--ltx-fg-color:#000000;">3. The output format should look as follows: &quot;Feedback: (write a feedback for criteria) [RESULT] (A or B)&quot;</span></span>
<span id="A10.p2.pic1.2.6" class="ltx_p"><span id="A10.p2.pic1.2.6.1" class="ltx_text" style="--ltx-fg-color:#000000;">4. Please do not generate any other opening, closing, and explanations.</span></span>
<span id="A10.p2.pic1.2.7" class="ltx_p"><span id="A10.p2.pic1.2.7.1" class="ltx_text" style="--ltx-fg-color:#000000;">###Instruction:</span></span>
<span id="A10.p2.pic1.2.8" class="ltx_p"><span id="A10.p2.pic1.2.8.1" class="ltx_text" style="--ltx-fg-color:#000000;">{orig_instruction}</span></span>
<span id="A10.p2.pic1.2.9" class="ltx_p"><span id="A10.p2.pic1.2.9.1" class="ltx_text" style="--ltx-fg-color:#000000;">###Response A:</span></span>
<span id="A10.p2.pic1.2.10" class="ltx_p"><span id="A10.p2.pic1.2.10.1" class="ltx_text" style="--ltx-fg-color:#000000;">{response_A}</span></span>
<span id="A10.p2.pic1.2.11" class="ltx_p"><span id="A10.p2.pic1.2.11.1" class="ltx_text" style="--ltx-fg-color:#000000;">###Response B:</span></span>
<span id="A10.p2.pic1.2.12" class="ltx_p"><span id="A10.p2.pic1.2.12.1" class="ltx_text" style="--ltx-fg-color:#000000;">{response_B}</span></span>
<span id="A10.p2.pic1.2.13" class="ltx_p"><span id="A10.p2.pic1.2.13.1" class="ltx_text" style="--ltx-fg-color:#000000;">###Score Rubric:</span></span>
<span id="A10.p2.pic1.2.14" class="ltx_p"><span id="A10.p2.pic1.2.14.1" class="ltx_text" style="--ltx-fg-color:#000000;">{score_rubric}</span></span>
<span id="A10.p2.pic1.2.15" class="ltx_p"><span id="A10.p2.pic1.2.15.1" class="ltx_text" style="--ltx-fg-color:#000000;">###Feedback:</span></span>
</span></span></span></foreignobject></g></g></svg>