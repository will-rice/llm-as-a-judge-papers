<span id="A9.p2.pic1.2.5" class="ltx_p"><span id="A9.p2.pic1.2.5.1" class="ltx_text" style="--ltx-fg-color:#000000;">{{question.strip()}}</span></span>
<span id="A9.p2.pic1.2.6" class="ltx_p"><span id="A9.p2.pic1.2.6.1" class="ltx_text" style="--ltx-fg-color:#000000;">{% for choice in choices %}</span></span>
