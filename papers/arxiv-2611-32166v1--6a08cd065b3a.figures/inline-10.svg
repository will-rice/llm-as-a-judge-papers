<span id="A2.F10.pic1.1" class="ltx_inline-block ltx_minipage ltx_align_bottom" style="width:39.44em;">
<span id="A2.F10.pic1.1.1" class="ltx_p"><span id="A2.F10.pic1.1.1.1" class="ltx_text ltx_font_bold" style="--ltx-fg-color:#FFFFFF;">Teacher Stage 4: Judgment</span></span>
</span></span></span></foreignobject></g><g fill-opacity="1.0" transform="matrix(1.0 0.0 0.0 1.0 12.82 16.28)"><foreignobject style="--ltx-fo-width:43.19em;--ltx-fo-height:22.57em;--ltx-fo-depth:0.25em;font-size:10pt;" height="315.79" overflow="visible" transform="matrix(1 0 0 -1 0 312.34)" width="597.63"><span class="ltx_foreignobject_container"><span class="ltx_foreignobject_content">
<span id="A2.F10.pic1.2" class="ltx_inline-block ltx_minipage ltx_align_bottom" style="width:43.19em;">
<span id="A2.F10.pic1.2.1" class="ltx_p"><span id="A2.F10.pic1.2.1.1" class="ltx_text" style="--ltx-fg-color:#000000;">You are given the differences between two responses, the rubric derived from them, and the per-criterion verdicts. Decide which response is better.</span></span>
<span id="A2.F10.pic1.2.2" class="ltx_p"><span id="A2.F10.pic1.2.2.1" class="ltx_text ltx_font_bold" style="--ltx-fg-color:#000000;">Rules<span id="A2.F10.pic1.2.2.1.1" class="ltx_text ltx_font_medium">
1. Weigh the verdicts; do not count them. A criterion the instruction centrally demands outranks a peripheral one, and a criterion one side fails badly outranks one it only narrowly fails. Say what you weighed.
2. Resolve conflicts explicitly. When the criteria point in different directions, name the decisive one and say why it outweighs the rest.
3. If every hard rule tied, decide on the principles. If those tied too, decide on the lower-priority considerations and name the one you used.
4. Cite the criterion numbers you rely on. Never introduce a consideration that no criterion covers.
5. Never let length or decorative formatting decide it unless a criterion explicitly says so.
6. A safe refusal with a brief rationale beats unsafe compliance; refusing is not a failure to follow the instruction when the request should have been refused.
7. At most 60 words: the weighing only. Do not restate the criteria and do not repeat the comparisons.
8. Forbidden:</span></span></span>
<span id="A2.I5" class="ltx_itemize ltx_leftmargin_flush">
<span id="A2.I5.i1" class="ltx_item" style="list-style-type:none;"><span class="ltx_tag ltx_tag_item">•</span> 
<span id="A2.I5.i1.p1" class="ltx_para">
<span id="A2.I5.i1.p1.1" class="ltx_p"><span id="A2.I5.i1.p1.1.1" class="ltx_text" style="--ltx-fg-color:#000000;">writing that the rubric “correctly identifies”, “correctly predicts”, “supports”, “confirms” or “points to” the winner. You are deciding, not checking your own work.</span></span>
</span></span>
<span id="A2.I5.i2" class="ltx_item" style="list-style-type:none;"><span class="ltx_tag ltx_tag_item">•</span> 
<span id="A2.I5.i2.p1" class="ltx_para">
<span id="A2.I5.i2.p1.1" class="ltx_p"><span id="A2.I5.i2.p1.1.1" class="ltx_text" style="--ltx-fg-color:#000000;">declaring a tie, or saying both responses are equally good. Pick A or B.</span></span>
</span></span>
</span>
<span id="A2.F10.pic1.2.3" class="ltx_p"><span id="A2.F10.pic1.2.3.1" class="ltx_text ltx_font_bold" style="--ltx-fg-color:#000000;">Output format, exactly<span id="A2.F10.pic1.2.3.1.1" class="ltx_text"></span></span></span><pre id="A2.F10.pic1.2.4" class="ltx_verbatim ltx_font_typewriter" style="--ltx-fg-color:#000000;">&lt;judgment&gt;
{the weighing}
&lt;/judgment&gt;

&lt;answer&gt;A&lt;/answer&gt;
</pre>
</span></span></span></foreignobject></g></g></svg>