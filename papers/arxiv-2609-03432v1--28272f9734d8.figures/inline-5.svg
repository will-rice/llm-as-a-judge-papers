<svg id="A4.SS3.p1.pic1" class="ltx_picture" height="355.96" overflow="visible" version="1.1" viewbox="0 0 653.15 355.96" width="653.15"><g style="--ltx-stroke-color:#000000;--ltx-fill-color:#000000;" fill="#000000" stroke="#000000" stroke-width="0.4pt" transform="translate(0,355.96) matrix(1 0 0 -1 0 0)"><g style="--ltx-fill-color:#000000;" fill="#000000" fill-opacity="1.0"><path style="stroke:none" d="M 0 5.91 L 0 350.05 C 0 353.32 2.64 355.96 5.91 355.96 L 647.24 355.96 C 650.51 355.96 653.15 353.32 653.15 350.05 L 653.15 5.91 C 653.15 2.64 650.51 0 647.24 0 L 5.91 0 C 2.64 0 0 2.64 0 5.91 Z" /></g><g style="--ltx-fill-color:#F9F9F9;" fill="#F9F9F9" fill-opacity="1.0"><path style="stroke:none" d="M 1.97 5.91 L 1.97 331.85 L 651.18 331.85 L 651.18 5.91 C 651.18 3.73 649.42 1.97 647.24 1.97 L 5.91 1.97 C 3.73 1.97 1.97 3.73 1.97 5.91 Z" /></g><g fill-opacity="1.0" transform="matrix(1.0 0.0 0.0 1.0 21.65 340.45)"><foreignobject style="--ltx-fo-width:44.07em;--ltx-fo-height:0.69em;--ltx-fo-depth:0.19em;font-size:10pt;" height="12.3" overflow="visible" transform="matrix(1 0 0 -1 0 9.61)" width="609.8"><span class="ltx_foreignobject_container"><span class="ltx_foreignobject_content">
<span id="A4.SS3.p1.pic1.1" class="ltx_inline-block ltx_minipage ltx_align_bottom" style="width:44.07em;">
<span id="A4.SS3.p1.pic1.1.1" class="ltx_p"><span id="A4.SS3.p1.pic1.1.1.1" class="ltx_text" style="--ltx-fg-color:#FFFFFF;">Judge-LLM System Prompts</span></span>
</span></span></span></foreignobject></g><g fill-opacity="1.0" transform="matrix(1.0 0.0 0.0 1.0 21.65 16.85)"><foreignobject style="--ltx-fo-width:41.97em;--ltx-fo-height:21.91em;--ltx-fo-depth:0.22em;font-size:10pt;" height="306.26" overflow="visible" transform="matrix(1 0 0 -1 0 303.19)" width="580.75"><span class="ltx_foreignobject_container"><span class="ltx_foreignobject_content">
<span id="A4.SS3.p1.pic1.2" class="ltx_inline-block ltx_minipage ltx_align_bottom" style="width:41.97em;">
<span id="A4.SS3.p1.pic1.2.1" class="ltx_p"><span id="A4.SS3.p1.pic1.2.1.1" class="ltx_text ltx_font_typewriter" style="--ltx-fg-color:#000000;">You are an objective and impartial evaluation model responsible for assessing the response based on the provided structured result (SoT (Structure-of-Thought) output).
</span></span>
<span id="A4.SS3.p1.pic1.2.2" class="ltx_p"><span id="A4.SS3.p1.pic1.2.2.1" class="ltx_text ltx_font_typewriter" style="--ltx-fg-color:#000000;">The input textual response belongs to CGPST (Contextualized-Grounding and Procedurally-Structured Task). In this task, the respondent is required to complete the following six steps sequentially based on a given future scenario:
</span></span>
<span id="A4.SS3.p1.pic1.2.3" class="ltx_p"><span id="A4.SS3.p1.pic1.2.3.1" class="ltx_text ltx_font_typewriter" style="--ltx-fg-color:#000000;">1.Identify Challenges: Identify up to 8 reasonable challenges based on the future scenario.
</span></span>
<span id="A4.SS3.p1.pic1.2.4" class="ltx_p"><span id="A4.SS3.p1.pic1.2.4.1" class="ltx_text ltx_font_typewriter" style="--ltx-fg-color:#000000;">2.Select an Underlying Problem: Select the most promising and meaningful challenge from Step-1 as the underlying problem.
</span></span>
<span id="A4.SS3.p1.pic1.2.5" class="ltx_p"><span id="A4.SS3.p1.pic1.2.5.1" class="ltx_text ltx_font_typewriter" style="--ltx-fg-color:#000000;">3.Produce Solutions: Generate up to 8 solutions for the underlying problem from Step-2.
</span></span>
<span id="A4.SS3.p1.pic1.2.6" class="ltx_p"><span id="A4.SS3.p1.pic1.2.6.1" class="ltx_text ltx_font_typewriter" style="--ltx-fg-color:#000000;">4.Select Criteria: Generate 5 evaluation criteria for the solutions from Step-3.
</span></span>
<span id="A4.SS3.p1.pic1.2.7" class="ltx_p"><span id="A4.SS3.p1.pic1.2.7.1" class="ltx_text ltx_font_typewriter" style="--ltx-fg-color:#000000;">5.Apply Criteria to Top Solution: Rank the solutions from Step-3 using the criteria from Step-4 and select the highest-scoring solution.
</span></span>
<span id="A4.SS3.p1.pic1.2.8" class="ltx_p"><span id="A4.SS3.p1.pic1.2.8.1" class="ltx_text ltx_font_typewriter" style="--ltx-fg-color:#000000;">6.Develop an Action Plan: Develop the top solution from Step-5 into a comprehensive action plan to address the underlying problem from Step-2.
</span></span>
</span></span></span></foreignobject></g></g></svg>