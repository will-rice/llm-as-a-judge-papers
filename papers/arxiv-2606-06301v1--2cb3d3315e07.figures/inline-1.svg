<span id="S5.SS1.p6.pic1.1" class="ltx_inline-block ltx_minipage ltx_align_bottom" style="width:31.56em;">
<span id="S5.SS1.p6.pic1.1.1" class="ltx_p"><span id="S5.SS1.p6.pic1.1.1.1" class="ltx_text ltx_font_bold" style="--ltx-fg-color:#000000;">Findings.<span id="S5.SS1.p6.pic1.1.1.1.1" class="ltx_text ltx_font_medium"> (i) Groups A and B are comparable at baseline (after excluding one ADQ outlier in A), satisfying the prerequisite for an intervention/control contrast. (ii) Agent feedback produces immediate, measurable gains within the same round: most testers improve TC/DE/TXT and many close adequacy gaps, with numerous cases reaching ADQ=100%. (iii) Gains are larger where baseline headroom is greater (e.g., A’s ADQ), whereas near-ceiling metrics show smaller but still positive deltas. (iv) The improvements are robust across apps and testers; occasional small trade-offs do not change the overall positive direction.</span></span></span>
</span></span></span></foreignobject></g></g></svg>