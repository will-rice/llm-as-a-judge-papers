er"><span class="ltx_foreignobject_content"><span id="S5.SS2.p4.pic1.1" class="ltx_text" style="--ltx-fg-color:#FFFFFF;">Takeaway</span></span></span></foreignobject></g></g></g><g fill-opacity="1.0" transform="matrix(1.0 0.0 0.0 1.0 10.58 128.12)"><foreignobject style="--ltx-fo-width:38.22em;--ltx-fo-height:1.79em;--ltx-fo-depth:8.49em;font-size:10pt;" height="142.37" overflow="visible" transform="matrix(1 0 0 -1 0 24.83)" width="528.86"><span class="ltx_foreignobject_container"><span class="ltx_foreignobject_content">
<span id="S5.SS2.p4.pic1.2" class="ltx_inline-block ltx_minipage ltx_align_bottom" style="width:38.22em;">
<span id="S5.I1" class="ltx_itemize ltx_leftmargin_flush">
<span id="S5.I1.i1" class="ltx_item" style="list-style-type:none;"><span class="ltx_tag ltx_tag_item">•</span> 
<span id="S5.I1.i1.p1" class="ltx_para ltx_noindent">
<span id="S5.I1.i1.p1.1" class="ltx_p"><span id="S5.I1.i1.p1.1.1" class="ltx_text" style="--ltx-fg-color:#000000;">VLM judges are systematically susceptible to CoT manipulation, with content-based fabrications, especially Progress Fabrication, causing the most severe degradation.</span></span>
</span></span>
<span id="S5.I1.i2" class="ltx_item" style="list-style-type:none;"><span class="ltx_tag ltx_tag_item">•</span> 
<span id="S5.I1.i2.p1" class="ltx_para ltx_noindent">
<span id="S5.I1.i2.p1.1" class="ltx_p"><span id="S5.I1.i2.p1.1.1" class="ltx_text" style="--ltx-fg-color:#000000;">Style-only manipulations induce smaller but non-trivial FPR increases of 5–10 points, showing that even surface-level changes can bias judges.</span></span>
</span></span>
<span id="S5.I1.i3" class="ltx_item" style="list-style-type:none;"><span class="ltx_tag ltx_tag_item">•</span> 
<span id="S5.I1.i3.p1" class="ltx_para">
<span id="S5.I1.i3.p1.1" class="ltx_p"><span id="S5.I1.i3.p1.1.1" class="ltx_text" style="--ltx-fg-color:#000000;">Strong baseline judgment performance (e.g., F1 score) does not predict robustness to manipulation. Models with similar F1 scores exhibit materially different susceptibility.</span></span>
</span></span>
</span>
</span></span></span></foreignobject></g></g></svg>