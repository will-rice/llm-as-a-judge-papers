<span id="A7.F6.pic1.1.1" class="ltx_p"><span id="A7.F6.pic1.1.1.1" class="ltx_text ltx_font_typewriter" style="--ltx-fg-color:#000000;">You are an expert in analysing the failure cases in natural language generation tasks 
<br class="ltx_break">You are given a question, ground truth label(s), and the answer generated by an LLM. 
<br class="ltx_break">The generated answer was not accepted by the automatic evaluation measured with metric {metric info} 
<br class="ltx_break">Read all these materials and reply what is the particular failure case in this example, i. e. why exactly the generated response was not accepted. 
<br class="ltx_break">The problem can be in any part of the pipeline, including the question itself or any aspects of the system outputs. 
<br class="ltx_break">IMPORTANT: identify ONE, MOST IMPORTANT, SPECIFIC, CLEARLY VISIBLE issue in each test case. 
<br class="ltx_break"><span id="A7.F6.pic1.1.1.1.1" class="ltx_text ltx_font_serif">
</span></span></span>
