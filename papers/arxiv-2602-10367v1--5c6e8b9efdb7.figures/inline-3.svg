<span id="A2.I4.i1.p1" class="ltx_para">
<span id="A2.I4.i1.p1.1" class="ltx_p"><span id="A2.I4.i1.p1.1.1" class="ltx_text ltx_font_typewriter ltx_font_bold" style="font-size:90%;--ltx-fg-color:#000000;">Extract:</span><span id="A2.I4.i1.p1.1.2" class="ltx_text ltx_font_typewriter" style="font-size:90%;--ltx-fg-color:#000000;"> Identify the doctor’s primary diagnosis (or differential diagnosis), reasoning, and specific recommendations.
</span></span>
</span></span>
<span id="A2.I4.i2" class="ltx_item" style="list-style-type:none;"><span class="ltx_tag ltx_tag_item">•</span> 
