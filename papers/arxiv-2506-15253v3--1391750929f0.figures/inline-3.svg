<span id="S4.SS3.p2.pic1.1" class="ltx_inline-block ltx_minipage ltx_align_bottom" style="width:33.18em;">
<span id="S4.SS3.p2.pic1.1.1" class="ltx_p"><span id="S4.SS3.p2.pic1.1.1.1" class="ltx_text ltx_font_bold" style="--ltx-fg-color:#000000;">Answer to RQ2:<span id="S4.SS3.p2.pic1.1.1.1.1" class="ltx_text ltx_font_medium"> Dynamic environment observation is necessary. Only checking the final environment misses transient violations, while removing environment observers altogether further loses many effects that never appear in tool-call logs. Therefore, accurate specification-based evaluation requires dynamic environment observation during execution.</span></span></span>
