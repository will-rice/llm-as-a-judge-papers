<svg id="A1.SS12.p2.pic1" class="ltx_picture" height="875.29" overflow="visible" version="1.1" viewbox="0 0 653.15 875.29" width="653.15"><g style="--ltx-stroke-color:#000000;--ltx-fill-color:#000000;" fill="#000000" stroke="#000000" stroke-width="0.4pt" transform="translate(0,875.29) matrix(1 0 0 -1 0 0)"><g style="--ltx-fill-color:#595959;" fill="#595959" fill-opacity="1.0"><path style="stroke:none" d="M 0 5.91 L 0 869.38 C 0 872.64 2.64 875.29 5.91 875.29 L 647.24 875.29 C 650.51 875.29 653.15 872.64 653.15 869.38 L 653.15 5.91 C 653.15 2.64 650.51 0 647.24 0 L 5.91 0 C 2.64 0 0 2.64 0 5.91 Z" /></g><g style="--ltx-fill-color:#F9F9F9;" fill="#F9F9F9" fill-opacity="1.0"><path style="stroke:none" d="M 1.97 5.91 L 1.97 851.18 L 651.18 851.18 L 651.18 5.91 C 651.18 3.73 649.42 1.97 647.24 1.97 L 5.91 1.97 C 3.73 1.97 1.97 3.73 1.97 5.91 Z" /></g><g fill-opacity="1.0" transform="matrix(1.0 0.0 0.0 1.0 21.65 859.77)"><foreignobject style="--ltx-fo-width:44.07em;--ltx-fo-height:0.69em;--ltx-fo-depth:0.19em;font-size:10pt;" height="12.3" overflow="visible" transform="matrix(1 0 0 -1 0 9.61)" width="609.8"><span class="ltx_foreignobject_container"><span class="ltx_foreignobject_content">
<span id="A1.SS12.p2.pic1.1" class="ltx_inline-block ltx_minipage ltx_align_bottom" style="width:44.07em;">
<span id="A1.SS12.p2.pic1.1.1" class="ltx_p"><span id="A1.SS12.p2.pic1.1.1.1" class="ltx_text" style="--ltx-fg-color:#FFFFFF;">Pairwise Judge with Scores</span></span>
</span></span></span></foreignobject></g><g fill-opacity="1.0" transform="matrix(1.0 0.0 0.0 1.0 21.65 17.24)"><foreignobject style="--ltx-fo-width:44.07em;--ltx-fo-height:59.42em;--ltx-fo-depth:0.25em;font-size:10pt;" height="825.6" overflow="visible" transform="matrix(1 0 0 -1 0 822.14)" width="609.8"><span class="ltx_foreignobject_container"><span class="ltx_foreignobject_content">
<span id="A1.SS12.p2.pic1.2" class="ltx_inline-block ltx_minipage ltx_align_bottom" style="width:44.07em;">
<span id="A1.SS12.p2.pic1.2.1" class="ltx_p"><span id="A1.SS12.p2.pic1.2.1.1" class="ltx_text ltx_font_bold" style="--ltx-fg-color:#000000;">Prompt:<span id="A1.SS12.p2.pic1.2.1.1.1" class="ltx_text ltx_font_medium">
You are given a user question and two responses from two AI assistants. Your task is to act as an impartial judge and evaluate which response better follows the user’s instructions and provides a higher-quality answer.</span></span></span>
<span id="A1.SS12.p2.pic1.2.2" class="ltx_p"><span id="A1.SS12.p2.pic1.2.2.1" class="ltx_text" style="--ltx-fg-color:#000000;">First, provide your reasoning within &lt;think&gt; and &lt;/think&gt; tags. This should include your evaluation criteria for a high-quality response, a detailed comparison of the two responses, and when helpful, a reference answer as part of your evaluation. Be explicit in your thought process, referencing your criteria and explaining how each response aligns with or deviates from them.</span></span>
<span id="A1.SS12.p2.pic1.2.3" class="ltx_p"><span id="A1.SS12.p2.pic1.2.3.1" class="ltx_text" style="--ltx-fg-color:#000000;">If you are not entirely sure of the correctness of your verdict, you should verbally express your uncertainty in your thought process.</span></span>
<span id="A1.SS12.p2.pic1.2.4" class="ltx_p"><span id="A1.SS12.p2.pic1.2.4.1" class="ltx_text" style="--ltx-fg-color:#000000;">Avoid any position biases and ensure that the order in which the responses were presented does not influence your decision. Do not allow the length of the responses to influence your evaluation. Do not favor certain names of the assistants. Be as objective as possible.</span></span>
<span id="A1.SS12.p2.pic1.2.5" class="ltx_p"><span id="A1.SS12.p2.pic1.2.5.1" class="ltx_text" style="--ltx-fg-color:#000000;">Finally, assign the assistant’s response a score from 0 to 10, using either an integer or a decimal with up to 0.1 precision, with a higher score indicating a higher-quality response that better satisfies the criteria. Enclose the scores within the tags &lt;score_A&gt; &lt;/score_A&gt;, and &lt;score_B&gt; &lt;/score_B&gt;.</span></span>
<span id="A1.SS12.p2.pic1.2.6" class="ltx_p"><span id="A1.SS12.p2.pic1.2.6.1" class="ltx_text" style="--ltx-fg-color:#000000;">Format your output like this: 
<br class="ltx_break">&lt;think&gt; your_thinking_process &lt;/think&gt; 
<br class="ltx_break">&lt;score_A&gt; your_score_a &lt;/score_A&gt;  &lt;score_B&gt; your_score_b &lt;/score_B&gt;</span></span>
<span id="A1.SS12.p2.pic1.2.7" class="ltx_p"><span id="A1.SS12.p2.pic1.2.7.1" class="ltx_text" style="--ltx-fg-color:#000000;">Also, provide a confidence score (0-100) for your judgment, representing how likely your answer is to be correct, enclosed within &lt;confidence&gt; and &lt;/confidence&gt; tags.</span></span>
<span id="A1.SS12.p2.pic1.2.8" class="ltx_p"><span id="A1.SS12.p2.pic1.2.8.1" class="ltx_text" style="--ltx-fg-color:#000000;">- &lt;confidence&gt; 50 &lt;/confidence&gt;</span></span>
<span id="A1.SS12.p2.pic1.2.9" class="ltx_p"><span id="A1.SS12.p2.pic1.2.9.1" class="ltx_text" style="--ltx-fg-color:#000000;">Below are the user’s question and the two responses:</span></span>
<span id="A1.SS12.p2.pic1.2.10" class="ltx_p"><span id="A1.SS12.p2.pic1.2.10.1" class="ltx_text" style="--ltx-fg-color:#000000;">[User Question]</span></span>
<span id="A1.SS12.p2.pic1.2.11" class="ltx_p"><span id="A1.SS12.p2.pic1.2.11.1" class="ltx_text" style="--ltx-fg-color:#000000;">{input}</span></span>
<span id="A1.SS12.p2.pic1.2.12" class="ltx_p"><span id="A1.SS12.p2.pic1.2.12.1" class="ltx_text" style="--ltx-fg-color:#000000;">[The Start of Assistant A’s Answer]</span></span>
<span id="A1.SS12.p2.pic1.2.13" class="ltx_p"><span id="A1.SS12.p2.pic1.2.13.1" class="ltx_text" style="--ltx-fg-color:#000000;">{response_1}</span></span>
<span id="A1.SS12.p2.pic1.2.14" class="ltx_p"><span id="A1.SS12.p2.pic1.2.14.1" class="ltx_text" style="--ltx-fg-color:#000000;">[The End of Assistant A’s Answer]</span></span>
<span id="A1.SS12.p2.pic1.2.15" class="ltx_p"><span id="A1.SS12.p2.pic1.2.15.1" class="ltx_text" style="--ltx-fg-color:#000000;">[The Start of Assistant B’s Answer]</span></span>
<span id="A1.SS12.p2.pic1.2.16" class="ltx_p"><span id="A1.SS12.p2.pic1.2.16.1" class="ltx_text" style="--ltx-fg-color:#000000;">{response_2}</span></span>
<span id="A1.SS12.p2.pic1.2.17" class="ltx_p"><span id="A1.SS12.p2.pic1.2.17.1" class="ltx_text" style="--ltx-fg-color:#000000;">[The End of Assistant B’s Answer]</span></span>
</span></span></span></foreignobject></g></g></svg>