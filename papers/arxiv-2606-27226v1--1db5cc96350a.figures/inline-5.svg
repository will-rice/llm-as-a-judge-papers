<span id="A1.SS1.pic1.p3" class="ltx_para">
<span id="A1.SS1.pic1.p3.1" class="ltx_p"><span id="A1.SS1.pic1.p3.1.1" class="ltx_text ltx_font_bold" style="font-size:90%;--ltx-fg-color:#000000;">Decomposed reasoning:<span id="A1.SS1.pic1.p3.1.1.1" class="ltx_text ltx_font_medium"> 
</span><span id="A1.SS1.pic1.p3.1.1.2" class="ltx_text" style="--ltx-fg-color:#C62828;">N</span><span id="A1.SS1.pic1.p3.1.1.3" class="ltx_text ltx_font_medium"> Q1 (omits key details: demographics, conditions)  
</span><span id="A1.SS1.pic1.p3.1.1.4" class="ltx_text" style="--ltx-fg-color:#2E7D32;">Y</span><span id="A1.SS1.pic1.p3.1.1.5" class="ltx_text ltx_font_medium"> Q2 (no fabricated content)  
</span><span id="A1.SS1.pic1.p3.1.1.6" class="ltx_text" style="--ltx-fg-color:#2E7D32;">Y</span><span id="A1.SS1.pic1.p3.1.1.7" class="ltx_text ltx_font_medium"> Q3 (no redundancy)  
</span><span id="A1.SS1.pic1.p3.1.1.8" class="ltx_text" style="--ltx-fg-color:#2E7D32;">Y</span><span id="A1.SS1.pic1.p3.1.1.9" class="ltx_text ltx_font_medium"> Q4 (no trivial padding)  
</span><span id="A1.SS1.pic1.p3.1.1.10" class="ltx_text" style="--ltx-fg-color:#C62828;">N</span><span id="A1.SS1.pic1.p3.1.1.11" class="ltx_text ltx_font_medium"> Q5 (too sparse, misses important aspects)  
</span><span id="A1.SS1.pic1.p3.1.1.12" class="ltx_text" style="--ltx-fg-color:#2E7D32;">Y</span><span id="A1.SS1.pic1.p3.1.1.13" class="ltx_text ltx_font_medium"> Q6 (included content is relevant)</span></span></span>
<span id="A1.SS1.pic1.p3.2" class="ltx_p"><span id="A1.SS1.pic1.p3.2.1" class="ltx_text ltx_font_bold" style="font-size:90%;--ltx-fg-color:#000000;">Insight:<span id="A1.SS1.pic1.p3.2.1.1" class="ltx_text ltx_font_medium">
The summary captures the central event accurately but is too brief.
BinEval rewards what it <em id="A1.SS1.pic1.p3.2.1.1.1" class="ltx_emph ltx_font_italic">does</em> right (on-topic, no fabrication, no padding) while penalising omissions (Q1, Q5). Score: <math id="A1.SS1.pic1.m1" class="ltx_Math" alttext="4/6\to 3.67" display="inline" intent=":literal"><semantics><mrow><mrow><mn style="--ltx-fg-color:#000000;" mathcolor="#000000">4</mn><mo style="--ltx-fg-color:#000000;" mathcolor="#000000">/</mo><mn style="--ltx-fg-color:#000000;" mathcolor="#000000">6</mn></mrow><mo style="--ltx-fg-color:#000000;" mathcolor="#000000" stretchy="false">→</mo><mn style="--ltx-fg-color:#000000;" mathcolor="#000000">3.67</mn></mrow><annotation encoding="application/x-tex">4/6\to 3.67</annotation></semantics></math>, matching human 3.33.
G-Eval and UniEval again conflate <em id="A1.SS1.pic1.p3.2.1.1.2" class="ltx_emph ltx_font_italic">incompleteness</em> with <em id="A1.SS1.pic1.p3.2.1.1.3" class="ltx_emph ltx_font_italic">irrelevance</em>, assigning the minimum score despite the summary being factually on-topic.</span></span></span>
