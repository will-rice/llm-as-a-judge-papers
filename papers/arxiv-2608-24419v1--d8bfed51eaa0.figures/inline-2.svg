<span id="S1.SS1.p3.pic1.p1" class="ltx_para ltx_noindent">
<span id="S1.SS1.p3.pic1.p1.1" class="ltx_p"><span id="S1.SS1.p3.pic1.p1.1.1" class="ltx_text ltx_font_bold" style="--ltx-fg-color:#000000;">Companion submission, disclosed.</span><span id="S1.SS1.p3.pic1.p1.1.2" class="ltx_text" style="--ltx-fg-color:#000000;"> A second submission by an overlapping author
set characterises the corpus that supplies our probe items and C4’s case study
</span><cite class="ltx_cite ltx_citemacro_citep"><span id="S1.SS1.p3.pic1.p1.1.3" class="ltx_text" style="--ltx-fg-color:#000000;">[</span><a href="#bib.bib61" title class="ltx_ref">4</a><span id="S1.SS1.p3.pic1.p1.1.4" class="ltx_text" style="--ltx-fg-color:#000000;">]</span></cite><span id="S1.SS1.p3.pic1.p1.1.5" class="ltx_text" style="--ltx-fg-color:#000000;">. It adopts this paper’s decomposition and its construct-blind predictor
family, and reports the corpus-side measurements; this paper reports the judge-side ones. Neither
depends on the other’s results, and the one quantity that would cross between them, a bound on
judge accuracy from a per-sentence gold set, is unrun in both and stated as such in both
(§</span><a href="#S5.SS5" title="5.5 What it costs: a blinded replacement, and Δ ‣ 5 Experiments: the profile, the asymmetry, and what the rulers could have seen ‣ A Judge Should Know What Changed: Construct Validity for LLM-as-a-Judge Evaluation" class="ltx_ref" style="--ltx-fg-color:#000000;"><span class="ltx_text ltx_ref_tag">5.5</span></a><span id="S1.SS1.p3.pic1.p1.1.6" class="ltx_text" style="--ltx-fg-color:#000000;">).</span></span>
</span></span></span></span></foreignobject></g></g></svg>