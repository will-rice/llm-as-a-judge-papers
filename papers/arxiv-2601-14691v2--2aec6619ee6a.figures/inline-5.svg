<span id="S5.SS5.SSS0.Px2.p2.pic1.2" class="ltx_inline-block ltx_minipage ltx_align_bottom" style="width:38.22em;">
<span id="S5.I2" class="ltx_itemize ltx_leftmargin_flush">
<span id="S5.I2.i1" class="ltx_item" style="list-style-type:none;"><span class="ltx_tag ltx_tag_item">•</span> 
<span id="S5.I2.i1.p1" class="ltx_para ltx_noindent">
<span id="S5.I2.i1.p1.1" class="ltx_p"><span id="S5.I2.i1.p1.1.1" class="ltx_text" style="--ltx-fg-color:#000000;">Robustness to CoT manipulation trades off against recall: mitigation strategies reduce false positives but also substantially increase false negatives or decrease recall on true successes.</span></span>
</span></span>
<span id="S5.I2.i2" class="ltx_item" style="list-style-type:none;"><span class="ltx_tag ltx_tag_item">•</span> 
<span id="S5.I2.i2.p1" class="ltx_para">
<span id="S5.I2.i2.p1.1" class="ltx_p"><span id="S5.I2.i2.p1.1.1" class="ltx_text" style="--ltx-fg-color:#000000;">CoTs provide valuable signal: removing them eliminates the manipulation surface but hurts recall, suggesting current mitigations adjust strictness rather than improve discrimination.</span></span>
</span></span>
</span>
</span></span></span></foreignobject></g></g></svg>