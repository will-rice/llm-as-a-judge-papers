<svg id="S3.F1.pic1" class="ltx_picture ltx_centering" height="1479.33" overflow="visible" version="1.1" viewbox="0 0 650 1479.33" width="650"><g style="--ltx-stroke-color:#000000;--ltx-fill-color:#000000;" fill="#000000" stroke="#000000" stroke-width="0.4pt" transform="translate(0,1479.33) matrix(1 0 0 -1 0 0)"><g style="--ltx-fill-color:#404040;" fill="#404040" fill-opacity="1.0"><path style="stroke:none" d="M 0 6.64 L 0 1472.69 C 0 1476.36 2.97 1479.33 6.64 1479.33 L 643.36 1479.33 C 647.03 1479.33 650 1476.36 650 1472.69 L 650 6.64 C 650 2.97 647.03 0 643.36 0 L 6.64 0 C 2.97 0 0 2.97 0 6.64 Z" /></g><g style="--ltx-fill-color:#F9F9F9;" fill="#F9F9F9" fill-opacity="1.0"><path style="stroke:none" d="M 1.11 6.64 L 1.11 1440.34 L 648.89 1440.34 L 648.89 6.64 C 648.89 3.58 646.42 1.11 643.36 1.11 L 6.64 1.11 C 3.58 1.11 1.11 3.58 1.11 6.64 Z" /></g><g fill-opacity="1.0" transform="matrix(1.0 0.0 0.0 1.0 13.35 1448.08)"><foreignobject style="--ltx-fo-width:45.05em;--ltx-fo-height:1.89em;--ltx-fo-depth:0.19em;font-size:10pt;" height="28.9" overflow="visible" transform="matrix(1 0 0 -1 0 26.21)" width="623.37"><span class="ltx_foreignobject_container"><span class="ltx_foreignobject_content">
<span id="S3.F1.pic1.1" class="ltx_inline-block ltx_minipage ltx_align_bottom" style="width:45.05em;">
<span id="S3.F1.pic1.1.1" class="ltx_p"><span id="S3.F1.pic1.1.1.1" class="ltx_text ltx_font_bold" style="--ltx-fg-color:#FFFFFF;">Example – <span id="S3.F1.pic1.1.1.1.1" class="ltx_text ltx_font_italic">Who did the United States win its independence from?</span></span></span>
</span></span></span></foreignobject></g><g fill-opacity="1.0" transform="matrix(1.0 0.0 0.0 1.0 13.35 1405.96)"><foreignobject style="--ltx-fo-width:45.05em;--ltx-fo-height:1.8em;--ltx-fo-depth:100.85em;font-size:10pt;" height="1420.31" overflow="visible" transform="matrix(1 0 0 -1 0 24.91)" width="623.37"><span class="ltx_foreignobject_container"><span class="ltx_foreignobject_content">
<span id="S3.F1.pic1.2" class="ltx_inline-block ltx_minipage ltx_align_bottom" style="width:45.05em;">
<span id="S3.I1" class="ltx_itemize">
<span id="S3.I1.i1" class="ltx_item" style="list-style-type:none;"><span class="ltx_tag ltx_tag_item">•</span> 
<span id="S3.I1.i1.p1" class="ltx_para ltx_noindent">
<span id="S3.I1.i1.p1.1" class="ltx_p"><span id="S3.I1.i1.p1.1.1" class="ltx_text ltx_font_bold" style="--ltx-fg-color:#000000;">A0 (Reference)</span><span id="S3.I1.i1.p1.1.2" class="ltx_text" style="--ltx-fg-color:#000000;">: Independence Day, commonly known as the Fourth of July or July Fourth, is </span><span id="S3.I1.i1.p1.1.3" class="ltx_text" style="--ltx-fg-color:#008080;">a federal holiday</span><span id="S3.I1.i1.p1.1.4" class="ltx_text" style="--ltx-fg-color:#000000;"> in the United States celebrating </span><span id="S3.I1.i1.p1.1.5" class="ltx_text" style="--ltx-fg-color:#008080;">the adoption of the Declaration of Independence</span><span id="S3.I1.i1.p1.1.6" class="ltx_text" style="--ltx-fg-color:#000000;"> </span><span id="S3.I1.i1.p1.1.7" class="ltx_text" style="--ltx-fg-color:#008080;">on July 4, 1776</span><span id="S3.I1.i1.p1.1.8" class="ltx_text" style="--ltx-fg-color:#000000;">. </span><span id="S3.I1.i1.p1.1.9" class="ltx_text" style="--ltx-fg-color:#008080;">On this day</span><span id="S3.I1.i1.p1.1.10" class="ltx_text" style="--ltx-fg-color:#000000;">, the Continental Congress announced that the thirteen American colonies considered themselves a new nation, called </span><span id="S3.I1.i1.p1.1.11" class="ltx_text" style="--ltx-fg-color:#008080;">the United States of America</span><span id="S3.I1.i1.p1.1.12" class="ltx_text" style="--ltx-fg-color:#000000;">, and were no longer under </span><span id="S3.I1.i1.p1.1.13" class="ltx_text" style="--ltx-fg-color:#008080;">British rule</span><span id="S3.I1.i1.p1.1.14" class="ltx_text" style="--ltx-fg-color:#000000;">. Interestingly, the Congress had voted to declare independence </span><span id="S3.I1.i1.p1.1.15" class="ltx_text" style="--ltx-fg-color:#008080;">two days</span><span id="S3.I1.i1.p1.1.16" class="ltx_text" style="--ltx-fg-color:#000000;"> earlier, </span><span id="S3.I1.i1.p1.1.17" class="ltx_text" style="--ltx-fg-color:#008080;">on July 2</span><span id="S3.I1.i1.p1.1.18" class="ltx_text" style="--ltx-fg-color:#000000;">.</span></span>
</span></span>
<span id="S3.I1.i2" class="ltx_item" style="list-style-type:none;"><span class="ltx_tag ltx_tag_item">•</span> 
<span id="S3.I1.i2.p1" class="ltx_para ltx_noindent">
<span id="S3.I1.i2.p1.1" class="ltx_p"><span id="S3.I1.i2.p1.1.1" class="ltx_text ltx_font_bold" style="--ltx-fg-color:#000000;">A1 (Low perturbation)</span><span id="S3.I1.i2.p1.1.2" class="ltx_text" style="--ltx-fg-color:#000000;">: Independence Day, commonly known as the Fourth of July or July Fourth, is </span><span id="S3.I1.i2.p1.1.3" class="ltx_text" style="--ltx-fg-color:#008080;">a federal holiday</span><span id="S3.I1.i2.p1.1.4" class="ltx_text" style="--ltx-fg-color:#000000;"> in the United States celebrating </span><span id="S3.I1.i2.p1.1.5" class="ltx_text" style="--ltx-fg-color:#008080;">the adoption of the Declaration of Independence</span><span id="S3.I1.i2.p1.1.6" class="ltx_text" style="--ltx-fg-color:#000000;"> </span><span id="S3.I1.i2.p1.1.7" class="ltx_text" style="--ltx-fg-color:#FF0000;">on August 5, 1776</span><span id="S3.I1.i2.p1.1.8" class="ltx_text" style="--ltx-fg-color:#000000;">. </span><span id="S3.I1.i2.p1.1.9" class="ltx_text" style="--ltx-fg-color:#008080;">On this day</span><span id="S3.I1.i2.p1.1.10" class="ltx_text" style="--ltx-fg-color:#000000;">, the Continental Congress announced that the thirteen American colonies considered themselves a new nation, called </span><span id="S3.I1.i2.p1.1.11" class="ltx_text" style="--ltx-fg-color:#008080;">the United States of America</span><span id="S3.I1.i2.p1.1.12" class="ltx_text" style="--ltx-fg-color:#000000;">, and were no longer under </span><span id="S3.I1.i2.p1.1.13" class="ltx_text" style="--ltx-fg-color:#008080;">British rule</span><span id="S3.I1.i2.p1.1.14" class="ltx_text" style="--ltx-fg-color:#000000;">. Interestingly, the Congress had voted to declare independence </span><span id="S3.I1.i2.p1.1.15" class="ltx_text" style="--ltx-fg-color:#008080;">two days</span><span id="S3.I1.i2.p1.1.16" class="ltx_text" style="--ltx-fg-color:#000000;"> earlier, </span><span id="S3.I1.i2.p1.1.17" class="ltx_text" style="--ltx-fg-color:#008080;">on July 2</span><span id="S3.I1.i2.p1.1.18" class="ltx_text" style="--ltx-fg-color:#000000;">.</span></span>
</span></span>
<span id="S3.I1.i3" class="ltx_item" style="list-style-type:none;"><span class="ltx_tag ltx_tag_item">•</span> 
<span id="S3.I1.i3.p1" class="ltx_para ltx_noindent">
<span id="S3.I1.i3.p1.1" class="ltx_p"><span id="S3.I1.i3.p1.1.1" class="ltx_text ltx_font_bold" style="--ltx-fg-color:#000000;">A2 (Medium perturbation)</span><span id="S3.I1.i3.p1.1.2" class="ltx_text" style="--ltx-fg-color:#000000;">: Independence Day, commonly known as the Fourth of July or July Fourth, is </span><span id="S3.I1.i3.p1.1.3" class="ltx_text" style="--ltx-fg-color:#008080;">a federal holiday</span><span id="S3.I1.i3.p1.1.4" class="ltx_text" style="--ltx-fg-color:#000000;"> in the United States celebrating </span><span id="S3.I1.i3.p1.1.5" class="ltx_text" style="--ltx-fg-color:#008080;">the adoption of the Declaration of Independence</span><span id="S3.I1.i3.p1.1.6" class="ltx_text" style="--ltx-fg-color:#000000;"> on </span><span id="S3.I1.i3.p1.1.7" class="ltx_text" style="--ltx-fg-color:#FF0000;">August 5, 1781</span><span id="S3.I1.i3.p1.1.8" class="ltx_text" style="--ltx-fg-color:#000000;">. </span><span id="S3.I1.i3.p1.1.9" class="ltx_text" style="--ltx-fg-color:#FF0000;">On that moment</span><span id="S3.I1.i3.p1.1.10" class="ltx_text" style="--ltx-fg-color:#000000;">, the Continental Congress announced that the thirteen American colonies considered themselves a new nation, called the </span><span id="S3.I1.i3.p1.1.11" class="ltx_text" style="--ltx-fg-color:#008080;">United States of America</span><span id="S3.I1.i3.p1.1.12" class="ltx_text" style="--ltx-fg-color:#000000;">, and were no longer under </span><span id="S3.I1.i3.p1.1.13" class="ltx_text" style="--ltx-fg-color:#008080;">British rule</span><span id="S3.I1.i3.p1.1.14" class="ltx_text" style="--ltx-fg-color:#000000;">. Interestingly, the Congress had voted to declare independence </span><span id="S3.I1.i3.p1.1.15" class="ltx_text" style="--ltx-fg-color:#FF0000;">several days</span><span id="S3.I1.i3.p1.1.16" class="ltx_text" style="--ltx-fg-color:#000000;"> earlier, </span><span id="S3.I1.i3.p1.1.17" class="ltx_text" style="--ltx-fg-color:#008080;">on July 2</span><span id="S3.I1.i3.p1.1.18" class="ltx_text" style="--ltx-fg-color:#000000;">.</span></span>
</span></span>
<span id="S3.I1.i4" class="ltx_item" style="list-style-type:none;"><span class="ltx_tag ltx_tag_item">•</span> 
<span id="S3.I1.i4.p1" class="ltx_para ltx_noindent">
<span id="S3.I1.i4.p1.1" class="ltx_p"><span id="S3.I1.i4.p1.1.1" class="ltx_text ltx_font_bold" style="--ltx-fg-color:#000000;">A3 (High perturbation)</span><span id="S3.I1.i4.p1.1.2" class="ltx_text" style="--ltx-fg-color:#000000;">: Independence Day, commonly known as the Fourth of July or July Fourth, is an </span><span id="S3.I1.i4.p1.1.3" class="ltx_text" style="--ltx-fg-color:#FF0000;">unofficial event</span><span id="S3.I1.i4.p1.1.4" class="ltx_text" style="--ltx-fg-color:#000000;"> in the United States celebrating </span><span id="S3.I1.i4.p1.1.5" class="ltx_text" style="--ltx-fg-color:#FF0000;">a proposal of</span><span id="S3.I1.i4.p1.1.6" class="ltx_text" style="--ltx-fg-color:#000000;"> </span><span id="S3.I1.i4.p1.1.7" class="ltx_text" style="--ltx-fg-color:#008080;">the Declaration of Independence</span><span id="S3.I1.i4.p1.1.8" class="ltx_text" style="--ltx-fg-color:#000000;"> </span><span id="S3.I1.i4.p1.1.9" class="ltx_text" style="--ltx-fg-color:#FF0000;">on August 5, 1781</span><span id="S3.I1.i4.p1.1.10" class="ltx_text" style="--ltx-fg-color:#000000;">. On that moment, the Continental Congress announced that the thirteen American colonies considered themselves a new nation, called the </span><span id="S3.I1.i4.p1.1.11" class="ltx_text" style="--ltx-fg-color:#008080;">United States of America</span><span id="S3.I1.i4.p1.1.12" class="ltx_text" style="--ltx-fg-color:#000000;">, and were no longer under </span><span id="S3.I1.i4.p1.1.13" class="ltx_text" style="--ltx-fg-color:#008080;">British rule</span><span id="S3.I1.i4.p1.1.14" class="ltx_text" style="--ltx-fg-color:#000000;">. Interestingly, the Congress had voted to declare independence </span><span id="S3.I1.i4.p1.1.15" class="ltx_text" style="--ltx-fg-color:#FF0000;">several days</span><span id="S3.I1.i4.p1.1.16" class="ltx_text" style="--ltx-fg-color:#000000;"> earlier, </span><span id="S3.I1.i4.p1.1.17" class="ltx_text" style="--ltx-fg-color:#FF0000;">on August 2</span><span id="S3.I1.i4.p1.1.18" class="ltx_text" style="--ltx-fg-color:#000000;">.</span></span>
</span></span>
<span id="S3.I1.i5" class="ltx_item" style="list-style-type:none;"><span class="ltx_tag ltx_tag_item">•</span> 
<span id="S3.I1.i5.p1" class="ltx_para">
<span id="S3.I1.i5.p1.1" class="ltx_p"><span id="S3.I1.i5.p1.1.1" class="ltx_text ltx_font_bold" style="--ltx-fg-color:#000000;">A4 (Extreme perturbation)</span><span id="S3.I1.i5.p1.1.2" class="ltx_text" style="--ltx-fg-color:#000000;">: Independence Day, commonly known as the Fourth of July or July Fourth, is </span><span id="S3.I1.i5.p1.1.3" class="ltx_text" style="--ltx-fg-color:#FF0000;">an unofficial event</span><span id="S3.I1.i5.p1.1.4" class="ltx_text" style="--ltx-fg-color:#000000;"> in the United States celebrating </span><span id="S3.I1.i5.p1.1.5" class="ltx_text" style="--ltx-fg-color:#FF0000;">a proposal of the drafting of Independence</span><span id="S3.I1.i5.p1.1.6" class="ltx_text" style="--ltx-fg-color:#000000;"> on </span><span id="S3.I1.i5.p1.1.7" class="ltx_text" style="--ltx-fg-color:#FF0000;">August 5, 1781</span><span id="S3.I1.i5.p1.1.8" class="ltx_text" style="--ltx-fg-color:#000000;">. </span><span id="S3.I1.i5.p1.1.9" class="ltx_text" style="--ltx-fg-color:#FF0000;">On that moment</span><span id="S3.I1.i5.p1.1.10" class="ltx_text" style="--ltx-fg-color:#000000;">, the Continental Congress announced that the thirteen American colonies considered themselves a new nation, called </span><span id="S3.I1.i5.p1.1.11" class="ltx_text" style="--ltx-fg-color:#FF0000;">the United States of the Colonies</span><span id="S3.I1.i5.p1.1.12" class="ltx_text" style="--ltx-fg-color:#000000;">, and were no longer under </span><span id="S3.I1.i5.p1.1.13" class="ltx_text" style="--ltx-fg-color:#FF0000;">Spanish rule</span><span id="S3.I1.i5.p1.1.14" class="ltx_text" style="--ltx-fg-color:#000000;">. Interestingly, the Congress had voted to declare independence </span><span id="S3.I1.i5.p1.1.15" class="ltx_text" style="--ltx-fg-color:#FF0000;">several days</span><span id="S3.I1.i5.p1.1.16" class="ltx_text" style="--ltx-fg-color:#000000;"> earlier, </span><span id="S3.I1.i5.p1.1.17" class="ltx_text" style="--ltx-fg-color:#FF0000;">on August 2</span><span id="S3.I1.i5.p1.1.18" class="ltx_text" style="--ltx-fg-color:#000000;">.</span></span>
</span></span>
</span>
</span></span></span></foreignobject></g></g></svg>