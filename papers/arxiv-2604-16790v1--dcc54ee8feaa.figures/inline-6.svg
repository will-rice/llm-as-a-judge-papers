<span id="S4.SS1.SSS2.Px3.p6.pic1.p1" class="ltx_para ltx_noindent">
<span id="S4.SS1.SSS2.Px3.p6.pic1.p1.1" class="ltx_p"><span id="S4.SS1.SSS2.Px3.p6.pic1.p1.1.1" class="ltx_text ltx_font_bold" style="--ltx-fg-color:#000000;">Key findings: </span><span id="S4.SS1.SSS2.Px3.p6.pic1.p1.1.2" class="ltx_text" style="--ltx-fg-color:#000000;">
Qwen2.5-Coder-3B is </span><span id="S4.SS1.SSS2.Px3.p6.pic1.p1.1.3" class="ltx_text ltx_font_bold" style="--ltx-fg-color:#000000;">highly position-dependent</span><span id="S4.SS1.SSS2.Px3.p6.pic1.p1.1.4" class="ltx_text" style="--ltx-fg-color:#000000;">: the no-bias baseline drops sharply from A-correct to B-correct.
When </span><span id="S4.SS1.SSS2.Px3.p6.pic1.p1.1.5" class="ltx_text ltx_font_bold" style="--ltx-fg-color:#000000;">A</span><span id="S4.SS1.SSS2.Px3.p6.pic1.p1.1.6" class="ltx_text" style="--ltx-fg-color:#000000;"> is correct, refined/sentiment/authority/coT strongly boost all tasks,
but when </span><span id="S4.SS1.SSS2.Px3.p6.pic1.p1.1.7" class="ltx_text ltx_font_bold" style="--ltx-fg-color:#000000;">B</span><span id="S4.SS1.SSS2.Px3.p6.pic1.p1.1.8" class="ltx_text" style="--ltx-fg-color:#000000;"> is correct, these same cues </span><span id="S4.SS1.SSS2.Px3.p6.pic1.p1.1.9" class="ltx_text ltx_font_bold" style="--ltx-fg-color:#000000;">collapse</span><span id="S4.SS1.SSS2.Px3.p6.pic1.p1.1.10" class="ltx_text" style="--ltx-fg-color:#000000;"> accuracy,
while verbosity (and to a lesser extent Diversity/Final-only/Distraction) </span><span id="S4.SS1.SSS2.Px3.p6.pic1.p1.1.11" class="ltx_text ltx_font_bold" style="--ltx-fg-color:#000000;">reverses the trend</span><span id="S4.SS1.SSS2.Px3.p6.pic1.p1.1.12" class="ltx_text" style="--ltx-fg-color:#000000;"> and dominates on B-correct.</span></span>
</span></span></span></span></foreignobject></g></g></svg>