<svg id="A4.pic11" class="ltx_picture" height="352.07" overflow="visible" version="1.1" viewbox="0 0 653.15 352.07" width="653.15"><g style="--ltx-stroke-color:#000000;--ltx-fill-color:#000000;" fill="#000000" stroke="#000000" stroke-width="0.4pt" transform="translate(0,352.07) matrix(1 0 0 -1 0 0)"><g style="--ltx-fill-color:#404040;" fill="#404040" fill-opacity="1.0"><path style="stroke:none" d="M 0 5.32 L 0 346.75 C 0 349.69 2.38 352.07 5.32 352.07 L 647.83 352.07 C 650.77 352.07 653.15 349.69 653.15 346.75 L 653.15 5.32 C 653.15 2.38 650.77 0 647.83 0 L 5.32 0 C 2.38 0 0 2.38 0 5.32 Z" /></g><g style="--ltx-fill-color:#F2F2F2;" fill="#F2F2F2" fill-opacity="1.0"><path style="stroke:none" d="M 1.38 5.32 L 1.38 324.4 L 651.77 324.4 L 651.77 5.32 C 651.77 3.15 650 1.38 647.83 1.38 L 5.32 1.38 C 3.15 1.38 1.38 3.15 1.38 5.32 Z" /></g><g style="--ltx-fill-color:#666666;" fill="#666666" fill-opacity="1.0"><path style="stroke:none" d="M 1.38 325.78 L 1.38 346.75 C 1.38 348.93 3.15 350.69 5.32 350.69 L 647.83 350.69 C 650 350.69 651.77 348.93 651.77 346.75 L 651.77 325.78 Z" /></g><g fill-opacity="1.0" transform="matrix(1.0 0.0 0.0 1.0 6.92 334.78)"><foreignobject style="--ltx-fo-width:46.2em;--ltx-fo-height:0.75em;--ltx-fo-depth:0.25em;font-size:10pt;" height="13.84" overflow="visible" transform="matrix(1 0 0 -1 0 10.38)" width="639.28"><span class="ltx_foreignobject_container"><span class="ltx_foreignobject_content">
<span id="A4.pic11.1" class="ltx_inline-block ltx_minipage ltx_align_bottom" style="width:46.2em;">
<span id="A4.pic11.1.1" class="ltx_p"><span id="A4.pic11.1.1.1" class="ltx_text" style="--ltx-fg-color:#FFFFFF;">Prompt D.11: Action Relevance Prompt (<a href="#S2.SS2" title="2.2 Proposing Actions to Take ‣ 2 MySQA: Personalized Deep Research ‣ Language Models Don’t Know What You Want:Evaluating Personalization in Deep Research Needs Real Users" class="ltx_ref"><span class="ltx_text ltx_ref_tag">section</span> <span class="ltx_text ltx_ref_tag">2.2</span></a>)</span></span>
</span></span></span></foreignobject></g><g fill-opacity="1.0" transform="matrix(1.0 0.0 0.0 1.0 6.92 10.38)"><foreignobject style="--ltx-fo-width:46.2em;--ltx-fo-height:22.29em;--ltx-fo-depth:0.25em;font-size:10pt;" height="311.95" overflow="visible" transform="matrix(1 0 0 -1 0 308.49)" width="639.28"><span class="ltx_foreignobject_container"><span class="ltx_foreignobject_content">
<span id="A4.pic11.2" class="ltx_inline-block ltx_minipage ltx_align_bottom" style="width:46.2em;">
<span id="A4.pic11.2.1" class="ltx_p"><span id="A4.pic11.2.1.1" class="ltx_text" style="--ltx-fg-color:#000000;">As a Plan Contradiction Validator, your task is to determine if a plan step directly conflicts the instructions in the query.
The query will be a question related to scientific research.
The plan will describe a list of suggestions an external question answering model could execute to generate a better response.
<br class="ltx_break"></span></span>
<span id="A4.pic11.2.2" class="ltx_p"><span id="A4.pic11.2.2.1" class="ltx_text" style="--ltx-fg-color:#000000;">Your output should denote whether the plan has a &quot;CONFLICT&quot; or &quot;NO_CONFLICT&quot; with the query. For example, if the query asks &quot;What are the best question answering datasets?&quot; and a plan step says &quot;Focus search on summarization benchmarks&quot;, there would be a &quot;CONFLICT&quot;, since the model cannot focus on summarization benchmarks without ignoring question answering datasets, and thus would have to ignore the query to follow the instruction. However, if a plan step for this query said &quot;Focus on Extractive Question Answering&quot; it would be &quot;NO_CONFLICT&quot;, since the model could follow this step while still answering the query. Similarly, if the plan step said &quot;Draw connections to summarization benchmarks&quot; it would be &quot;NO_CONFLICT&quot;, as drawing a connection does not mean ignoring the request in the query.</span></span>
<span id="A4.pic11.2.3" class="ltx_p"><span id="A4.pic11.2.3.1" class="ltx_text" style="--ltx-fg-color:#000000;">&lt;/task&gt;
<br class="ltx_break"></span></span>
<span id="A4.pic11.2.4" class="ltx_p"><span id="A4.pic11.2.4.1" class="ltx_text" style="--ltx-fg-color:#000000;">&lt;query&gt;
<math id="A4.pic11.m1" class="ltx_Math" alttext="q" display="inline" intent=":literal"><semantics><mi style="--ltx-fg-color:#000000;" mathcolor="#000000">q</mi><annotation encoding="application/x-tex">q</annotation></semantics></math>
&lt;/query&gt;
<br class="ltx_break"></span></span>
<span id="A4.pic11.2.5" class="ltx_p"><span id="A4.pic11.2.5.1" class="ltx_text" style="--ltx-fg-color:#000000;">&lt;plan step&gt;
<math id="A4.pic11.m2" class="ltx_Math" alttext="a" display="inline" intent=":literal"><semantics><mi style="--ltx-fg-color:#000000;" mathcolor="#000000">a</mi><annotation encoding="application/x-tex">a</annotation></semantics></math>
&lt;/plan step&gt;
<br class="ltx_break"></span></span>
<span id="A4.pic11.2.6" class="ltx_p"><span id="A4.pic11.2.6.1" class="ltx_text" style="--ltx-fg-color:#000000;">&lt;format&gt;
Output your response as a json with two keys: 1) &quot;output&quot; with a value of one among - (&quot;CONFLICT&quot;, &quot;NO_CONFLICT&quot;); and 2) &quot;explanation&quot; with a brief explanation as to why.
&lt;/format&gt;</span></span>
</span></span></span></foreignobject></g></g></svg>