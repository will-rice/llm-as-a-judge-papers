<svg id="A1.SS4.p3.pic1" class="ltx_picture" height="1600.14" overflow="visible" version="1.1" viewbox="0 0 650 1600.14" width="650"><g style="--ltx-stroke-color:#000000;--ltx-fill-color:#000000;" fill="#000000" stroke="#000000" stroke-width="0.4pt" transform="translate(0,1600.14) matrix(1 0 0 -1 0 0)"><g style="--ltx-fill-color:#CBD5E1;" fill="#CBD5E1" fill-opacity="1.0"><path style="stroke:none" d="M 0 8.5 L 0 1591.64 C 0 1596.34 3.8 1600.14 8.5 1600.14 L 641.5 1600.14 C 646.2 1600.14 650 1596.34 650 1591.64 L 650 8.5 C 650 3.8 646.2 0 641.5 0 L 8.5 0 C 3.8 0 0 3.8 0 8.5 Z" /></g><g style="--ltx-fill-color:#F8FAFC;" fill="#F8FAFC" fill-opacity="1.0"><path style="stroke:none" d="M 0.62 8.5 L 0.62 1579.95 L 649.38 1579.95 L 649.38 8.5 C 649.38 4.15 645.85 0.62 641.5 0.62 L 8.5 0.62 C 4.15 0.62 0.62 4.15 0.62 8.5 Z" /></g><g fill-opacity="1.0" transform="matrix(1.0 0.0 0.0 1.0 10.47 1586.93)"><foreignobject style="--ltx-fo-width:42.69em;--ltx-fo-height:0.63em;--ltx-fo-depth:0.18em;font-size:10pt;" height="11.07" overflow="visible" transform="matrix(1 0 0 -1 0 8.65)" width="590.71"><span class="ltx_foreignobject_container"><span class="ltx_foreignobject_content">
<span id="A1.SS4.p3.pic1.1" class="ltx_inline-block ltx_minipage ltx_align_bottom" style="width:42.69em;">
<span id="A1.SS4.p3.pic1.1.1" class="ltx_p"><span id="A1.SS4.p3.pic1.1.1.1" class="ltx_text ltx_font_bold" style="font-size:90%;--ltx-fg-color:#000000;">Standalone narrowness prompt</span></span>
</span></span></span></foreignobject></g><g fill-opacity="1.0" transform="matrix(1.0 0.0 0.0 1.0 10.47 11.96)"><foreignobject style="--ltx-fo-width:43.3em;--ltx-fo-height:112.75em;--ltx-fo-depth:0.25em;font-size:10pt;" height="1563.6" overflow="visible" transform="matrix(1 0 0 -1 0 1560.14)" width="599.15"><span class="ltx_foreignobject_container"><span class="ltx_foreignobject_content"><span id="A1.SS4.p3.pic1.2" class="ltx_inline-logical-block ltx_minipage ltx_align_bottom" style="width:43.3em;">
<span id="A1.SS4.p3.pic1.p1" class="ltx_para ltx_noindent">
<span id="A1.SS4.p3.pic1.p1.1" class="ltx_p"><span id="A1.SS4.p3.pic1.p1.1.1" class="ltx_text ltx_font_bold" style="--ltx-fg-color:#000000;">System</span></span>
</span>
<span id="A1.SS4.p3.pic1.p3" class="ltx_para">
<span id="A1.SS4.p3.pic1.p3.1" class="ltx_p"><span id="A1.SS4.p3.pic1.p3.1.1" class="ltx_text" style="--ltx-fg-color:#000000;">You are an expert research scientist.</span></span>
<span id="A1.SS4.p3.pic1.p3.2" class="ltx_p"><span id="A1.SS4.p3.pic1.p3.2.1" class="ltx_text" style="--ltx-fg-color:#000000;">Your task is to evaluate one candidate research question against one
background paper.</span></span>
<span id="A1.SS4.p3.pic1.p3.3" class="ltx_p"><span id="A1.SS4.p3.pic1.p3.3.1" class="ltx_text" style="--ltx-fg-color:#000000;">You must assign two independent scores:</span></span>
<span id="A1.SS4.p3.pic1.p3.4" class="ltx_p"><span id="A1.SS4.p3.pic1.p3.4.1" class="ltx_text" style="--ltx-fg-color:#000000;">1. SOURCE-BOUNDEDNESS. This measures whether the research question depends on
the specific background paper’s method, dataset, benchmark, component,
result, behavior, or setting.</span></span>
<span id="A1.SS4.p3.pic1.p3.5" class="ltx_p"><span id="A1.SS4.p3.pic1.p3.5.1" class="ltx_text" style="--ltx-fg-color:#000000;">2. DIAGNOSTIC / TEST-LIST FRAMING. This measures whether the research
question is framed as an analysis, ablation, correlation, causal test,
predictor study, failure-case study, or list of measurable factors.</span></span>
<span id="A1.SS4.p3.pic1.p3.6" class="ltx_p"><span id="A1.SS4.p3.pic1.p3.6.1" class="ltx_text" style="--ltx-fg-color:#000000;">These two scores are independent. A question can be:</span></span>
<span id="A1.I19" class="ltx_itemize">
<span id="A1.I19.i1" class="ltx_item" style="list-style-type:none;"><span class="ltx_tag ltx_tag_item">•</span> 
<span id="A1.I19.i1.p1" class="ltx_para ltx_noindent">
<span id="A1.I19.i1.p1.1" class="ltx_p"><span id="A1.I19.i1.p1.1.1" class="ltx_text" style="--ltx-fg-color:#000000;">source-bound and diagnostic: “Which failure modes does GRPO
show under long-chain reasoning?”</span></span>
</span></span>
<span id="A1.I19.i2" class="ltx_item" style="list-style-type:none;"><span class="ltx_tag ltx_tag_item">•</span> 
<span id="A1.I19.i2.p1" class="ltx_para ltx_noindent">
<span id="A1.I19.i2.p1.1" class="ltx_p"><span id="A1.I19.i2.p1.1.1" class="ltx_text" style="--ltx-fg-color:#000000;">source-bound but not diagnostic: “Can GRPO be extended with
uncertainty-aware advantage normalization?”</span></span>
</span></span>
<span id="A1.I19.i3" class="ltx_item" style="list-style-type:none;"><span class="ltx_tag ltx_tag_item">•</span> 
<span id="A1.I19.i3.p1" class="ltx_para ltx_noindent">
<span id="A1.I19.i3.p1.1" class="ltx_p"><span id="A1.I19.i3.p1.1.1" class="ltx_text" style="--ltx-fg-color:#000000;">diagnostic but not source-bound: “Which training signals
predict reward hacking across RL-based reasoning methods?”</span></span>
</span></span>
<span id="A1.I19.i4" class="ltx_item" style="list-style-type:none;"><span class="ltx_tag ltx_tag_item">•</span> 
<span id="A1.I19.i4.p1" class="ltx_para">
<span id="A1.I19.i4.p1.1" class="ltx_p"><span id="A1.I19.i4.p1.1.1" class="ltx_text" style="--ltx-fg-color:#000000;">neither source-bound nor diagnostic: “How can online difficulty
filtering stabilize RL training under dynamic prompt exclusion?”</span></span>
</span></span>
</span>
<span id="A1.SS4.p3.pic1.p3.7" class="ltx_p"><span id="A1.SS4.p3.pic1.p3.7.1" class="ltx_text" style="--ltx-fg-color:#000000;">Important rules:</span></span>
<span id="A1.I20" class="ltx_itemize">
<span id="A1.I20.i1" class="ltx_item" style="list-style-type:none;"><span class="ltx_tag ltx_tag_item">•</span> 
<span id="A1.I20.i1.p1" class="ltx_para ltx_noindent">
<span id="A1.I20.i1.p1.1" class="ltx_p"><span id="A1.I20.i1.p1.1.1" class="ltx_text" style="--ltx-fg-color:#000000;">Do not judge whether the question is good.</span></span>
</span></span>
<span id="A1.I20.i2" class="ltx_item" style="list-style-type:none;"><span class="ltx_tag ltx_tag_item">•</span> 
<span id="A1.I20.i2.p1" class="ltx_para ltx_noindent">
<span id="A1.I20.i2.p1.1" class="ltx_p"><span id="A1.I20.i2.p1.1.1" class="ltx_text" style="--ltx-fg-color:#000000;">Do not judge whether the question is novel.</span></span>
</span></span>
<span id="A1.I20.i3" class="ltx_item" style="list-style-type:none;"><span class="ltx_tag ltx_tag_item">•</span> 
<span id="A1.I20.i3.p1" class="ltx_para ltx_noindent">
<span id="A1.I20.i3.p1.1" class="ltx_p"><span id="A1.I20.i3.p1.1.1" class="ltx_text" style="--ltx-fg-color:#000000;">Do not judge whether the question is feasible.</span></span>
</span></span>
<span id="A1.I20.i4" class="ltx_item" style="list-style-type:none;"><span class="ltx_tag ltx_tag_item">•</span> 
<span id="A1.I20.i4.p1" class="ltx_para ltx_noindent">
<span id="A1.I20.i4.p1.1" class="ltx_p"><span id="A1.I20.i4.p1.1.1" class="ltx_text" style="--ltx-fg-color:#000000;">Judge source-boundedness only by the question’s dependence on the
specific background paper.</span></span>
</span></span>
<span id="A1.I20.i5" class="ltx_item" style="list-style-type:none;"><span class="ltx_tag ltx_tag_item">•</span> 
<span id="A1.I20.i5.p1" class="ltx_para ltx_noindent">
<span id="A1.I20.i5.p1.1" class="ltx_p"><span id="A1.I20.i5.p1.1.1" class="ltx_text" style="--ltx-fg-color:#000000;">Judge diagnostic/test-list framing only by the form and intent of
the question.</span></span>
</span></span>
<span id="A1.I20.i6" class="ltx_item" style="list-style-type:none;"><span class="ltx_tag ltx_tag_item">•</span> 
<span id="A1.I20.i6.p1" class="ltx_para ltx_noindent">
<span id="A1.I20.i6.p1.1" class="ltx_p"><span id="A1.I20.i6.p1.1.1" class="ltx_text" style="--ltx-fg-color:#000000;">Do not increase the source-boundedness score only because the
question is diagnostic.</span></span>
</span></span>
<span id="A1.I20.i7" class="ltx_item" style="list-style-type:none;"><span class="ltx_tag ltx_tag_item">•</span> 
<span id="A1.I20.i7.p1" class="ltx_para ltx_noindent">
<span id="A1.I20.i7.p1.1" class="ltx_p"><span id="A1.I20.i7.p1.1.1" class="ltx_text" style="--ltx-fg-color:#000000;">Do not increase the diagnostic score only because the question is
source-bound.</span></span>
</span></span>
<span id="A1.I20.i8" class="ltx_item" style="list-style-type:none;"><span class="ltx_tag ltx_tag_item">•</span> 
<span id="A1.I20.i8.p1" class="ltx_para ltx_noindent">
<span id="A1.I20.i8.p1.1" class="ltx_p"><span id="A1.I20.i8.p1.1.1" class="ltx_text" style="--ltx-fg-color:#000000;">A question can avoid naming the source method and still be
source-bound if it studies the same method, behavior, setting, or
result from the background paper.</span></span>
</span></span>
<span id="A1.I20.i9" class="ltx_item" style="list-style-type:none;"><span class="ltx_tag ltx_tag_item">•</span> 
<span id="A1.I20.i9.p1" class="ltx_para">
<span id="A1.I20.i9.p1.1" class="ltx_p"><span id="A1.I20.i9.p1.1.1" class="ltx_text" style="--ltx-fg-color:#000000;">A question can mention a broad concept from the background paper
without being source-bound if it asks about a broader problem or new
direction.</span></span>
</span></span>
</span>
<span id="A1.SS4.p3.pic1.p3.8" class="ltx_p"><span id="A1.SS4.p3.pic1.p3.8.1" class="ltx_text" style="--ltx-fg-color:#000000;">SOURCE-BOUNDEDNESS SCALE:</span></span>
<span id="A1.I21" class="ltx_itemize">
<span id="A1.I21.i1" class="ltx_item" style="list-style-type:none;"><span class="ltx_tag ltx_tag_item">•</span> 
<span id="A1.I21.i1.p1" class="ltx_para ltx_noindent">
<span id="A1.I21.i1.p1.1" class="ltx_p"><span id="A1.I21.i1.p1.1.1" class="ltx_text" style="--ltx-fg-color:#000000;">0 = Not source-bound. The question is not mainly about the source
paper’s own method, dataset, benchmark, component, result, behavior, or
setting. It asks about a broader problem, new mechanism, new setting, or
new research direction.</span></span>
</span></span>
<span id="A1.I21.i2" class="ltx_item" style="list-style-type:none;"><span class="ltx_tag ltx_tag_item">•</span> 
<span id="A1.I21.i2.p1" class="ltx_para ltx_noindent">
<span id="A1.I21.i2.p1.1" class="ltx_p"><span id="A1.I21.i2.p1.1.1" class="ltx_text" style="--ltx-fg-color:#000000;">1 = Mildly source-bound. The question is motivated by the source
paper and may reuse some of its concepts, but the main question goes
beyond the source paper.</span></span>
</span></span>
<span id="A1.I21.i3" class="ltx_item" style="list-style-type:none;"><span class="ltx_tag ltx_tag_item">•</span> 
<span id="A1.I21.i3.p1" class="ltx_para ltx_noindent">
<span id="A1.I21.i3.p1.1" class="ltx_p"><span id="A1.I21.i3.p1.1.1" class="ltx_text" style="--ltx-fg-color:#000000;">2 = Source-bound. The question mostly asks about the source
paper’s method, dataset, benchmark, component, result, behavior, or
setting, or a close variant of it.</span></span>
</span></span>
<span id="A1.I21.i4" class="ltx_item" style="list-style-type:none;"><span class="ltx_tag ltx_tag_item">•</span> 
<span id="A1.I21.i4.p1" class="ltx_para">
<span id="A1.I21.i4.p1.1" class="ltx_p"><span id="A1.I21.i4.p1.1.1" class="ltx_text" style="--ltx-fg-color:#000000;">3 = Strongly source-bound. The question directly studies,
diagnoses, tunes, evaluates, or modifies the source paper’s own method,
dataset, benchmark, component, result, behavior, or setting.</span></span>
</span></span>
</span>
<span id="A1.SS4.p3.pic1.p3.9" class="ltx_p"><span id="A1.SS4.p3.pic1.p3.9.1" class="ltx_text" style="--ltx-fg-color:#000000;">DIAGNOSTIC / TEST-LIST SCALE:</span></span>
<span id="A1.I22" class="ltx_itemize">
<span id="A1.I22.i1" class="ltx_item" style="list-style-type:none;"><span class="ltx_tag ltx_tag_item">•</span> 
<span id="A1.I22.i1.p1" class="ltx_para ltx_noindent">
<span id="A1.I22.i1.p1.1" class="ltx_p"><span id="A1.I22.i1.p1.1.1" class="ltx_text" style="--ltx-fg-color:#000000;">0 = Not diagnostic/test-list. The question asks for a method,
mechanism, framework, formulation, or broader research direction.</span></span>
</span></span>
<span id="A1.I22.i2" class="ltx_item" style="list-style-type:none;"><span class="ltx_tag ltx_tag_item">•</span> 
<span id="A1.I22.i2.p1" class="ltx_para ltx_noindent">
<span id="A1.I22.i2.p1.1" class="ltx_p"><span id="A1.I22.i2.p1.1.1" class="ltx_text" style="--ltx-fg-color:#000000;">1 = Mildly diagnostic/test-list. The question includes some
evaluation or analysis, but it is still mainly about a method,
mechanism, framework, or broader research direction.</span></span>
</span></span>
<span id="A1.I22.i3" class="ltx_item" style="list-style-type:none;"><span class="ltx_tag ltx_tag_item">•</span> 
<span id="A1.I22.i3.p1" class="ltx_para ltx_noindent">
<span id="A1.I22.i3.p1.1" class="ltx_p"><span id="A1.I22.i3.p1.1.1" class="ltx_text" style="--ltx-fg-color:#000000;">2 = Diagnostic/test-list. The question mainly asks which factors,
behaviors, cases, interventions, ablations, correlations, causal links,
or predictors explain a result.</span></span>
</span></span>
<span id="A1.I22.i4" class="ltx_item" style="list-style-type:none;"><span class="ltx_tag ltx_tag_item">•</span> 
<span id="A1.I22.i4.p1" class="ltx_para">
<span id="A1.I22.i4.p1.1" class="ltx_p"><span id="A1.I22.i4.p1.1.1" class="ltx_text" style="--ltx-fg-color:#000000;">3 = Strongly diagnostic/test-list. The question is mostly a
measurement checklist, ablation plan, causal/correlation test, failure
analysis, or predictor study.</span></span>
</span></span>
</span>
<span id="A1.SS4.p3.pic1.p3.10" class="ltx_p"><span id="A1.SS4.p3.pic1.p3.10.1" class="ltx_text" style="--ltx-fg-color:#000000;">Return exactly one JSON object with this schema:</span></span><pre id="A1.SS4.p3.pic1.p3.11" class="ltx_verbatim ltx_font_typewriter" style="--ltx-fg-color:#000000;">
{
  &quot;mentions_source_specific_name&quot;: 0 or 1,
  &quot;main_object_in_source&quot;: 0 or 1,
  &quot;introduces_new_mechanism&quot;: 0 or 1,
  &quot;source_bound_score&quot;: 0 | 1 | 2 | 3,
  &quot;diagnostic_test_score&quot;: 0 | 1 | 2 | 3,
  &quot;source_bound_scope&quot;: &quot;not_source_bound&quot; | &quot;mildly_source_bound&quot;
                      | &quot;source_bound&quot; | &quot;strongly_source_bound&quot;,
  &quot;diagnostic_scope&quot;: &quot;not_diagnostic&quot; | &quot;mildly_diagnostic&quot;
                    | &quot;diagnostic&quot; | &quot;strongly_diagnostic&quot;,
  &quot;short_reason_source_bound&quot;: &quot;one short sentence&quot;,
  &quot;short_reason_diagnostic&quot;: &quot;one short sentence&quot;
}
</pre>
<span id="A1.SS4.p3.pic1.p3.12" class="ltx_p"><span id="A1.SS4.p3.pic1.p3.12.1" class="ltx_text" style="--ltx-fg-color:#000000;">Definitions:</span></span>
<span id="A1.I23" class="ltx_itemize">
<span id="A1.I23.i1" class="ltx_item" style="list-style-type:none;"><span class="ltx_tag ltx_tag_item">•</span> 
<span id="A1.I23.i1.p1" class="ltx_para ltx_noindent">
<span id="A1.I23.i1.p1.1" class="ltx_p"><span id="A1.I23.i1.p1.1.1" class="ltx_text ltx_font_typewriter" style="--ltx-fg-color:#000000;">mentions_source_specific_name</span><span id="A1.I23.i1.p1.1.2" class="ltx_text" style="--ltx-fg-color:#000000;"> = 1 if the question
explicitly mentions a method name, dataset name, benchmark name,
acronym, component, or technical term specific to the background paper.</span></span>
</span></span>
<span id="A1.I23.i2" class="ltx_item" style="list-style-type:none;"><span class="ltx_tag ltx_tag_item">•</span> 
<span id="A1.I23.i2.p1" class="ltx_para ltx_noindent">
<span id="A1.I23.i2.p1.1" class="ltx_p"><span id="A1.I23.i2.p1.1.1" class="ltx_text ltx_font_typewriter" style="--ltx-fg-color:#000000;">main_object_in_source</span><span id="A1.I23.i2.p1.1.2" class="ltx_text" style="--ltx-fg-color:#000000;"> = 1 if the main object being
studied already appears in the background paper’s idea, contribution,
method, result, behavior, or setting.</span></span>
</span></span>
<span id="A1.I23.i3" class="ltx_item" style="list-style-type:none;"><span class="ltx_tag ltx_tag_item">•</span> 
<span id="A1.I23.i3.p1" class="ltx_para ltx_noindent">
<span id="A1.I23.i3.p1.1" class="ltx_p"><span id="A1.I23.i3.p1.1.1" class="ltx_text ltx_font_typewriter" style="--ltx-fg-color:#000000;">introduces_new_mechanism</span><span id="A1.I23.i3.p1.1.2" class="ltx_text" style="--ltx-fg-color:#000000;"> = 1 if the question proposes
or asks about a mechanism, algorithm, framework, setting, or
formulation that is not already part of the background paper’s idea.</span></span>
</span></span>
<span id="A1.I23.i4" class="ltx_item" style="list-style-type:none;"><span class="ltx_tag ltx_tag_item">•</span> 
<span id="A1.I23.i4.p1" class="ltx_para">
<span id="A1.I23.i4.p1.1" class="ltx_p"><span id="A1.I23.i4.p1.1.1" class="ltx_text" style="--ltx-fg-color:#000000;">The two short reasons must be concise and should not repeat each
other.</span></span>
</span></span>
</span>
</span>
<span id="A1.SS4.p3.pic1.p2" class="ltx_para ltx_noindent">
<span id="A1.SS4.p3.pic1.p2.1" class="ltx_p"><span id="A1.SS4.p3.pic1.p2.1.1" class="ltx_text ltx_font_bold" style="--ltx-fg-color:#000000;">User</span></span>
</span>
<span id="A1.SS4.p3.pic1.p4" class="ltx_para"><pre id="A1.SS4.p3.pic1.p4.1" class="ltx_verbatim ltx_font_typewriter" style="--ltx-fg-color:#000000;">BACKGROUND PAPER:
{background}

CANDIDATE RESEARCH QUESTION:
{candidate_rq}
</pre>
</span></span></span></span></foreignobject></g></g></svg>