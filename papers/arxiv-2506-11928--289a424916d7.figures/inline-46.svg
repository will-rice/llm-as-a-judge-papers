<svg id="S16.p3.pic1" class="ltx_picture" height="997.16" overflow="visible" version="1.1" viewbox="0 0 477.38 997.16" width="477.38"><g style="--ltx-stroke-color:#000000;--ltx-fill-color:#000000;" fill="#000000" stroke="#000000" stroke-width="0.4pt" transform="translate(0,997.16) matrix(1 0 0 -1 0 0)"><g style="--ltx-fill-color:#4285F4;" fill="#4285F4" fill-opacity="1.0"><path style="stroke:none" d="M 0 7.5 L 0 989.66 C 0 993.8 3.36 997.16 7.5 997.16 L 469.87 997.16 C 474.02 997.16 477.38 993.8 477.38 989.66 L 477.38 7.5 C 477.38 3.36 474.02 0 469.87 0 L 7.5 0 C 3.36 0 0 3.36 0 7.5 Z" /></g><g style="--ltx-fill-color:#F5F5F5;" fill="#F5F5F5" fill-opacity="1.0"><path style="stroke:none" d="M 1.97 7.5 L 1.97 978.08 L 475.41 978.08 L 475.41 7.5 C 475.41 4.45 472.93 1.97 469.87 1.97 L 7.5 1.97 C 4.45 1.97 1.97 4.45 1.97 7.5 Z" /></g><g fill-opacity="1.0" transform="matrix(1.0 0.0 0.0 1.0 20.48 982.82)"><foreignobject style="--ltx-fo-width:27.43em;--ltx-fo-height:0.69em;--ltx-fo-depth:0em;font-size:10pt;" height="9.61" overflow="visible" transform="matrix(1 0 0 -1 0 9.61)" width="379.55"><span class="ltx_foreignobject_container"><span class="ltx_foreignobject_content">
<span id="S16.p3.pic1.1" class="ltx_inline-block ltx_minipage ltx_align_bottom" style="width:27.43em;">
<span id="S16.p3.pic1.1.1" class="ltx_p"><span id="S16.p3.pic1.1.1.1" class="ltx_text" style="position:relative; bottom:0.9pt;"></span><a href="https://codeforces.com/blog/entry/136908" title class="ltx_ref ltx_href ltx_font_bold" style="--ltx-fg-color:#FFFFFF;">Official Tutorial</a></span>
</span></span></span></foreignobject></g><g fill-opacity="1.0" transform="matrix(1.0 0.0 0.0 1.0 20.48 12.61)"><foreignobject style="--ltx-fo-width:31.54em;--ltx-fo-height:69.01em;--ltx-fo-depth:0em;font-size:10pt;" height="954.84" overflow="visible" transform="matrix(1 0 0 -1 0 954.84)" width="436.42"><span class="ltx_foreignobject_container"><span class="ltx_foreignobject_content">
<span id="S16.p3.pic1.2" class="ltx_inline-block ltx_minipage ltx_align_bottom" style="width:31.54em;">
<span id="S16.p3.pic1.2.1" class="ltx_p"><span id="S16.p3.pic1.2.1.1" class="ltx_text" style="--ltx-fg-color:#000000;">The key observation is that <em id="S16.p3.pic1.2.1.1.1" class="ltx_emph ltx_font_italic">each element can be moved to the back at most once</em>.
Fix any subset of indices that will ever be moved.
If we perform the operation <em id="S16.p3.pic1.2.1.1.2" class="ltx_emph ltx_font_italic">exactly once</em> on every element of that subset (in any order),
their final relative order is fixed and their values are each increased by <math id="S16.p3.pic1.m1" class="ltx_Math" alttext="1" display="inline" intent=":literal"><semantics><mn style="--ltx-fg-color:#000000;" mathcolor="#000000">1</mn><annotation encoding="application/x-tex">1</annotation></semantics></math>.
To minimise the final array lexicographically we clearly want those “moved” elements to appear in <em id="S16.p3.pic1.2.1.1.3" class="ltx_emph ltx_font_italic">increasing order</em>.</span></span>
<span id="S16.p3.pic1.2.2" class="ltx_p"><span id="S16.p3.pic1.2.2.1" class="ltx_text" style="--ltx-fg-color:#000000;">Hence the problem reduces to determining <em id="S16.p3.pic1.2.2.1.1" class="ltx_emph ltx_font_italic">which</em> elements must be moved to the back.</span></span>
<span id="S16.p3.pic1.2.3" class="ltx_p"><span id="S16.p3.pic1.2.3.1" class="ltx_text ltx_font_bold" style="--ltx-fg-color:#000000;">Greedy construction (left → right).<span id="S16.p3.pic1.2.3.1.1" class="ltx_text ltx_font_medium">
To obtain the lexicographically smallest array we decide each position greedily:</span></span></span>
<span id="S16.I3" class="ltx_enumerate">
<span id="S16.I3.i1" class="ltx_item" style="list-style-type:none;"><span class="ltx_tag ltx_tag_item">1.</span> 
<span id="S16.I3.i1.p1" class="ltx_para">
<span id="S16.I3.i1.p1.1" class="ltx_p"><span id="S16.I3.i1.p1.1.1" class="ltx_text" style="--ltx-fg-color:#000000;">The first position must contain the </span><em id="S16.I3.i1.p1.1.2" class="ltx_emph ltx_font_italic" style="--ltx-fg-color:#000000;">global minimum</em><span id="S16.I3.i1.p1.1.3" class="ltx_text" style="--ltx-fg-color:#000000;">.
Therefore every element that appears before that minimum in the original array must be moved to the back (and thus increased by </span><math id="S16.I3.i1.p1.m1" class="ltx_Math" alttext="1" display="inline" intent=":literal"><semantics><mn style="--ltx-fg-color:#000000;" mathcolor="#000000">1</mn><annotation encoding="application/x-tex">1</annotation></semantics></math><span id="S16.I3.i1.p1.1.4" class="ltx_text" style="--ltx-fg-color:#000000;">).</span></span>
</span></span>
<span id="S16.I3.i2" class="ltx_item" style="list-style-type:none;"><span class="ltx_tag ltx_tag_item">2.</span> 
<span id="S16.I3.i2.p1" class="ltx_para">
<span id="S16.I3.i2.p1.1" class="ltx_p"><span id="S16.I3.i2.p1.1.1" class="ltx_text" style="--ltx-fg-color:#000000;">For the second position we now choose the smallest possible value among</span></span>
<span id="S16.I3.i2.I1" class="ltx_itemize">
<span id="S16.I3.i2.I0.i1" class="ltx_item" style="list-style-type:none;"><span class="ltx_tag ltx_tag_item">•</span> 
<span id="S16.I3.i2.I0.i1.p1" class="ltx_para">
<span id="S16.I3.i2.I0.i1.p1.1" class="ltx_p"><span id="S16.I3.i2.I0.i1.p1.1.1" class="ltx_text" style="--ltx-fg-color:#000000;">the suffix minimum that follows the global minimum, and</span></span>
</span></span>
<span id="S16.I3.i2.I0.i2" class="ltx_item" style="list-style-type:none;"><span class="ltx_tag ltx_tag_item">•</span> 
<span id="S16.I3.i2.I0.i2.p1" class="ltx_para">
<span id="S16.I3.i2.I0.i2.p1.1" class="ltx_p"><span id="S16.I3.i2.I0.i2.p1.1.1" class="ltx_text" style="--ltx-fg-color:#000000;">the set of elements that have already been moved to the back.</span></span>
</span></span>
</span>
</span></span>
<span id="S16.I3.i3" class="ltx_item" style="list-style-type:none;"><span class="ltx_tag ltx_tag_item">3.</span> 
<span id="S16.I3.i3.p1" class="ltx_para">
<span id="S16.I3.i3.p1.1" class="ltx_p"><span id="S16.I3.i3.p1.1.1" class="ltx_text" style="--ltx-fg-color:#000000;">We repeat this procedure while we can still take the next value from the </span><em id="S16.I3.i3.p1.1.2" class="ltx_emph ltx_font_italic" style="--ltx-fg-color:#000000;">suffix-minimum sequence</em><span id="S16.I3.i3.p1.1.3" class="ltx_text" style="--ltx-fg-color:#000000;">.
Eventually the next candidate is </span><em id="S16.I3.i3.p1.1.4" class="ltx_emph ltx_font_italic" style="--ltx-fg-color:#000000;">smaller</em><span id="S16.I3.i3.p1.1.5" class="ltx_text" style="--ltx-fg-color:#000000;"> in the pile of “moved” elements than in the remaining suffix minima.
At that moment every element still to the right must be moved once (hence increased by </span><math id="S16.I3.i3.p1.m1" class="ltx_Math" alttext="1" display="inline" intent=":literal"><semantics><mn style="--ltx-fg-color:#000000;" mathcolor="#000000">1</mn><annotation encoding="application/x-tex">1</annotation></semantics></math><span id="S16.I3.i3.p1.1.6" class="ltx_text" style="--ltx-fg-color:#000000;">), and afterward all moved elements are listed in increasing order.</span></span>
</span></span>
</span>
<span id="S16.p3.pic1.2.4" class="ltx_p"><span id="S16.p3.pic1.2.4.1" class="ltx_text ltx_font_bold" style="--ltx-fg-color:#000000;">Resulting structure of the answer.<span id="S16.p3.pic1.2.4.1.1" class="ltx_text ltx_font_medium">
The final array therefore consists of</span></span></span>
<span id="S16.I4" class="ltx_itemize">
<span id="S16.I4.i1" class="ltx_item" style="list-style-type:none;"><span class="ltx_tag ltx_tag_item">•</span> 
<span id="S16.I4.i1.p1" class="ltx_para">
<span id="S16.I4.i1.p1.1" class="ltx_p"><span id="S16.I4.i1.p1.1.1" class="ltx_text" style="--ltx-fg-color:#000000;">a prefix equal to a contiguous segment of the suffix-minimum sequence (starting with the global minimum), followed by</span></span>
</span></span>
<span id="S16.I4.i2" class="ltx_item" style="list-style-type:none;"><span class="ltx_tag ltx_tag_item">•</span> 
<span id="S16.I4.i2.p1" class="ltx_para">
<span id="S16.I4.i2.p1.1" class="ltx_p"><em id="S16.I4.i2.p1.1.1" class="ltx_emph ltx_font_italic" style="--ltx-fg-color:#000000;">all other</em><span id="S16.I4.i2.p1.1.2" class="ltx_text" style="--ltx-fg-color:#000000;"> elements, each increased by </span><math id="S16.I4.i2.p1.m1" class="ltx_Math" alttext="1" display="inline" intent=":literal"><semantics><mn style="--ltx-fg-color:#000000;" mathcolor="#000000">1</mn><annotation encoding="application/x-tex">1</annotation></semantics></math><span id="S16.I4.i2.p1.1.3" class="ltx_text" style="--ltx-fg-color:#000000;"> and then written in sorted ascending order.</span></span>
</span></span>
</span>
<span id="S16.p3.pic1.2.5" class="ltx_p"><span id="S16.p3.pic1.2.5.1" class="ltx_text ltx_font_bold" style="--ltx-fg-color:#000000;">Implementation details.<span id="S16.p3.pic1.2.5.1.1" class="ltx_text"></span></span></span>
<span id="S16.I5" class="ltx_itemize">
<span id="S16.I5.i1" class="ltx_item" style="list-style-type:none;"><span class="ltx_tag ltx_tag_item">•</span> 
<span id="S16.I5.i1.p1" class="ltx_para">
<span id="S16.I5.i1.p1.1" class="ltx_p"><span id="S16.I5.i1.p1.1.1" class="ltx_text" style="--ltx-fg-color:#000000;">Pre-compute the suffix minima array.</span></span>
</span></span>
<span id="S16.I5.i2" class="ltx_item" style="list-style-type:none;"><span class="ltx_tag ltx_tag_item">•</span> 
<span id="S16.I5.i2.p1" class="ltx_para">
<span id="S16.I5.i2.p1.1" class="ltx_p"><span id="S16.I5.i2.p1.1.1" class="ltx_text" style="--ltx-fg-color:#000000;">Scan the original array from left to right, maintaining a multiset (or priority queue) of values that have already been moved.</span></span>
</span></span>
<span id="S16.I5.i3" class="ltx_item" style="list-style-type:none;"><span class="ltx_tag ltx_tag_item">•</span> 
<span id="S16.I5.i3.p1" class="ltx_para">
<span id="S16.I5.i3.p1.1" class="ltx_p"><span id="S16.I5.i3.p1.1.1" class="ltx_text" style="--ltx-fg-color:#000000;">At each step decide whether the next output element comes from the current suffix minimum or from the multiset.</span></span>
</span></span>
<span id="S16.I5.i4" class="ltx_item" style="list-style-type:none;"><span class="ltx_tag ltx_tag_item">•</span> 
<span id="S16.I5.i4.p1" class="ltx_para">
<span id="S16.I5.i4.p1.1" class="ltx_p"><span id="S16.I5.i4.p1.1.1" class="ltx_text" style="--ltx-fg-color:#000000;">Once the multiset yields a strictly smaller value, output that value, move every remaining original element into the multiset (adding </span><math id="S16.I5.i4.p1.m1" class="ltx_Math" alttext="1" display="inline" intent=":literal"><semantics><mn style="--ltx-fg-color:#000000;" mathcolor="#000000">1</mn><annotation encoding="application/x-tex">1</annotation></semantics></math><span id="S16.I5.i4.p1.1.2" class="ltx_text" style="--ltx-fg-color:#000000;">), and finally output the multiset contents in increasing order.</span></span>
</span></span>
</span>
<span id="S16.p3.pic1.2.6" class="ltx_p"><span id="S16.p3.pic1.2.6.1" class="ltx_text ltx_font_bold" style="--ltx-fg-color:#000000;">Complexity.<span id="S16.p3.pic1.2.6.1.1" class="ltx_text ltx_font_medium">
The procedure performs standard multiset operations on at most <math id="S16.p3.pic1.m2" class="ltx_Math" alttext="n" display="inline" intent=":literal"><semantics><mi style="--ltx-fg-color:#000000;" mathcolor="#000000">n</mi><annotation encoding="application/x-tex">n</annotation></semantics></math> elements, resulting in a total complexity of <math id="S16.p3.pic1.m3" class="ltx_Math" alttext="\mathcal{O}(n\log n)" display="inline" intent=":literal"><semantics><mrow><mi style="--ltx-fg-color:#000000;" class="ltx_font_mathcaligraphic" mathcolor="#000000">𝒪</mi><mo>⁡</mo><mrow><mo style="--ltx-fg-color:#000000;" mathcolor="#000000" stretchy="false">(</mo><mrow><mi style="--ltx-fg-color:#000000;" mathcolor="#000000">n</mi><mo lspace="0.167em" rspace="0em">​</mo><mrow><mi style="--ltx-fg-color:#000000;" mathcolor="#000000">log</mi><mo lspace="0.167em">⁡</mo><mi style="--ltx-fg-color:#000000;" mathcolor="#000000">n</mi></mrow></mrow><mo style="--ltx-fg-color:#000000;" mathcolor="#000000" stretchy="false">)</mo></mrow></mrow><annotation encoding="application/x-tex">\mathcal{O}(n\log n)</annotation></semantics></math>, which easily meets the constraints.</span></span></span>
</span></span></span></foreignobject></g></g></svg>