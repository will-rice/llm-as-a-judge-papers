<span id="S4.SS0.SSSx3.p2.pic1.1" class="ltx_inline-block ltx_minipage ltx_align_bottom" style="width:30.81em;">
<span id="S4.SS0.SSSx3.p2.pic1.1.1" class="ltx_p"><span id="S4.SS0.SSSx3.p2.pic1.1.1.1" class="ltx_text ltx_font_bold" style="font-size:90%;--ltx-fg-color:#FFFFFF;">Preliminary human concordance</span></span>
</span></span></span></foreignobject></g><g fill-opacity="1.0" transform="matrix(1.0 0.0 0.0 1.0 11.69 12.72)"><foreignobject style="--ltx-fo-width:35.47em;--ltx-fo-height:25.83em;--ltx-fo-depth:0.18em;font-size:10pt;" height="359.77" overflow="visible" transform="matrix(1 0 0 -1 0 357.34)" width="490.8"><span class="ltx_foreignobject_container"><span class="ltx_foreignobject_content">
<span id="S4.SS0.SSSx3.p2.pic1.2" class="ltx_inline-block ltx_minipage ltx_align_bottom" style="width:35.47em;">
<span id="S4.SS0.SSSx3.p2.pic1.2.1" class="ltx_p"><span id="S4.SS0.SSSx3.p2.pic1.2.1.1" class="ltx_text" style="font-size:90%;--ltx-fg-color:#000000;">Holistic clinical preference has no ground truth: expert raters need not agree,
and routinely do not. The external check for the judge is therefore whether
judge–expert preference scores concord with each expert at least as strongly as
the experts concord with one another, the standard bar for LLM-judge validation
<cite class="ltx_cite ltx_citemacro_cite">[<a href="#bib.bib13" title class="ltx_ref">13</a>]</cite>. As a preliminary, system-agnostic instance, two licensed
psychologists independently blind-rated 50 separate synthetic es-MX transcripts
by pairwise preference. The transcripts were produced by the EMPATH auditor
(gpt-5.4-mini) from two deliberately undisclosed emotional-support systems and
scored by a separate EMPATH judge instance (claude-opus-4-6, not the S2 judges). Judge–clinician preference
concordance was 76% (Gwet’s AC1 <cite class="ltx_cite ltx_citemacro_cite">[<a href="#bib.bib16" title class="ltx_ref">16</a>]</cite> 0.61, <math id="S4.SS0.SSSx3.p2.pic1.m1" class="ltx_Math" alttext="p{=}0.013" display="inline" intent=":literal"><semantics><mrow><mi style="--ltx-fg-color:#000000;" mathcolor="#000000">p</mi><mo style="--ltx-fg-color:#000000;" mathcolor="#000000">=</mo><mn style="--ltx-fg-color:#000000;" mathcolor="#000000">0.013</mn></mrow><annotation encoding="application/x-tex">p{=}0.013</annotation></semantics></math>, <math id="S4.SS0.SSSx3.p2.pic1.m2" class="ltx_Math" alttext="n{=}21" display="inline" intent=":literal"><semantics><mrow><mi style="--ltx-fg-color:#000000;" mathcolor="#000000">n</mi><mo style="--ltx-fg-color:#000000;" mathcolor="#000000">=</mo><mn style="--ltx-fg-color:#000000;" mathcolor="#000000">21</mn></mrow><annotation encoding="application/x-tex">n{=}21</annotation></semantics></math>) and 60%
(AC1 0.20, <math id="S4.SS0.SSSx3.p2.pic1.m3" class="ltx_Math" alttext="n{=}15" display="inline" intent=":literal"><semantics><mrow><mi style="--ltx-fg-color:#000000;" mathcolor="#000000">n</mi><mo style="--ltx-fg-color:#000000;" mathcolor="#000000">=</mo><mn style="--ltx-fg-color:#000000;" mathcolor="#000000">15</mn></mrow><annotation encoding="application/x-tex">n{=}15</annotation></semantics></math>, n.s.). Clinician–clinician concordance was 47%
(AC1 <math id="S4.SS0.SSSx3.p2.pic1.m4" class="ltx_Math" alttext="-0.04" display="inline" intent=":literal"><semantics><mrow><mo style="--ltx-fg-color:#000000;" mathcolor="#000000">−</mo><mn style="--ltx-fg-color:#000000;" mathcolor="#000000">0.04</mn></mrow><annotation encoding="application/x-tex">-0.04</annotation></semantics></math>, <math id="S4.SS0.SSSx3.p2.pic1.m5" class="ltx_Math" alttext="n{=}17" display="inline" intent=":literal"><semantics><mrow><mi style="--ltx-fg-color:#000000;" mathcolor="#000000">n</mi><mo style="--ltx-fg-color:#000000;" mathcolor="#000000">=</mo><mn style="--ltx-fg-color:#000000;" mathcolor="#000000">17</mn></mrow><annotation encoding="application/x-tex">n{=}17</annotation></semantics></math>), so judge–clinician concordance met or exceeded the
clinicians’ mutual concordance, the reference ceiling for this subjective task.
This evidence is preliminary holistic-preference concordance from two raters,
significant for one. It uses a judge model and corpus <em id="S4.SS0.SSSx3.p2.pic1.2.1.1.1" class="ltx_emph ltx_font_italic">distinct from</em> the
S2 grid, so it bears on the judging protocol rather than on the S2 judges’
scores. Per-metric criterion validity against a larger pre-registered clinician
panel remains deferred. One clinician’s free-text notes also flagged informal
register, such as slang address. The rubric already scores this issue under
<span id="S4.SS0.SSSx3.p2.pic1.2.1.1.2" class="ltx_text ltx_font_typewriter">cultural_sensitivity</span>, so this isolated note converges with the metric
set rather than indicating a coverage gap.</span></span>
</span></span></span></foreignobject></g></g></svg>