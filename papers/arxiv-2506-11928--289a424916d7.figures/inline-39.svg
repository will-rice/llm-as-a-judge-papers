<svg id="S15.SS0.SSS0.Px17.p2.pic1" class="ltx_picture" height="407.04" overflow="visible" version="1.1" viewbox="0 0 477.38 407.04" width="477.38"><g style="--ltx-stroke-color:#000000;--ltx-fill-color:#000000;" fill="#000000" stroke="#000000" stroke-width="0.4pt" transform="translate(0,407.04) matrix(1 0 0 -1 0 0)"><g style="--ltx-fill-color:#BF0000;" fill="#BF0000" fill-opacity="1.0"><path style="stroke:none" d="M 0 5.91 L 0 401.14 C 0 404.4 2.64 407.04 5.91 407.04 L 471.47 407.04 C 474.73 407.04 477.38 404.4 477.38 401.14 L 477.38 5.91 C 477.38 2.64 474.73 0 471.47 0 L 5.91 0 C 2.64 0 0 2.64 0 5.91 Z" /></g><g style="--ltx-fill-color:#FFF2F2;" fill="#FFF2F2" fill-opacity="1.0"><path style="stroke:none" d="M 1.97 5.91 L 1.97 381.39 L 475.41 381.39 L 475.41 5.91 C 475.41 3.73 473.65 1.97 471.47 1.97 L 5.91 1.97 C 3.73 1.97 1.97 3.73 1.97 5.91 Z" /></g><g fill-opacity="1.0" transform="matrix(1.0 0.0 0.0 1.0 21.65 390.76)"><foreignobject style="--ltx-fo-width:31.37em;--ltx-fo-height:0.75em;--ltx-fo-depth:0.25em;font-size:10pt;" height="13.84" overflow="visible" transform="matrix(1 0 0 -1 0 10.38)" width="434.07"><span class="ltx_foreignobject_container"><span class="ltx_foreignobject_content">
<span id="S15.SS0.SSS0.Px17.p2.pic1.1" class="ltx_inline-block ltx_minipage ltx_align_bottom" style="width:31.37em;">
<span id="S15.SS0.SSS0.Px17.p2.pic1.1.1" class="ltx_p"><a href="https://codeforces.com/problemset/problem/1988/C" title class="ltx_ref ltx_href" style="--ltx-fg-color:#FFFFFF;">Example Bitmasking Problem (Rated 1300)</a></span>
</span></span></span></foreignobject></g><g fill-opacity="1.0" transform="matrix(1.0 0.0 0.0 1.0 21.65 16.47)"><foreignobject style="--ltx-fo-width:31.37em;--ltx-fo-height:25.52em;--ltx-fo-depth:0.19em;font-size:10pt;" height="355.81" overflow="visible" transform="matrix(1 0 0 -1 0 353.12)" width="434.07"><span class="ltx_foreignobject_container"><span class="ltx_foreignobject_content">
<span id="S15.SS0.SSS0.Px17.p2.pic1.2" class="ltx_inline-block ltx_minipage ltx_align_bottom" style="width:31.37em;">
<span id="S15.SS0.SSS0.Px17.p2.pic1.2.1" class="ltx_p"><span id="S15.SS0.SSS0.Px17.p2.pic1.2.1.1" class="ltx_text" style="--ltx-fg-color:#000000;">You are given a positive integer <math id="S15.SS0.SSS0.Px17.p2.pic1.m1" class="ltx_Math" alttext="n" display="inline" intent=":literal"><semantics><mi style="--ltx-fg-color:#000000;" mathcolor="#000000">n</mi><annotation encoding="application/x-tex">n</annotation></semantics></math>. Find the <span id="S15.SS0.SSS0.Px17.p2.pic1.2.1.1.1" class="ltx_text ltx_font_bold">longest</span> sequence of positive integers <math id="S15.SS0.SSS0.Px17.p2.pic1.m2" class="ltx_Math" alttext="a=[a_{1},a_{2},\dots,a_{k}]" display="inline" intent=":literal"><semantics><mrow><mi style="--ltx-fg-color:#000000;" mathcolor="#000000">a</mi><mo style="--ltx-fg-color:#000000;" mathcolor="#000000">=</mo><mrow><mo style="--ltx-fg-color:#000000;" mathcolor="#000000" stretchy="false">[</mo><mrow><msub><mi style="--ltx-fg-color:#000000;" mathcolor="#000000">a</mi><mn style="--ltx-fg-color:#000000;" mathcolor="#000000">1</mn></msub><mo style="--ltx-fg-color:#000000;" mathcolor="#000000">,</mo><msub><mi style="--ltx-fg-color:#000000;" mathcolor="#000000">a</mi><mn style="--ltx-fg-color:#000000;" mathcolor="#000000">2</mn></msub><mo style="--ltx-fg-color:#000000;" mathcolor="#000000">,</mo><mi style="--ltx-fg-color:#000000;" mathcolor="#000000" mathvariant="normal">…</mi><mo style="--ltx-fg-color:#000000;" mathcolor="#000000">,</mo><msub><mi style="--ltx-fg-color:#000000;" mathcolor="#000000">a</mi><mi style="--ltx-fg-color:#000000;" mathcolor="#000000">k</mi></msub></mrow><mo style="--ltx-fg-color:#000000;" mathcolor="#000000" stretchy="false">]</mo></mrow></mrow><annotation encoding="application/x-tex">a=[a_{1},a_{2},\dots,a_{k}]</annotation></semantics></math> that satisfies the following conditions, and print the sequence:</span></span>
<span id="S15.I11" class="ltx_itemize">
<span id="S15.I11.i1" class="ltx_item" style="list-style-type:none;"><span class="ltx_tag ltx_tag_item">•</span> 
<span id="S15.I11.i1.p1" class="ltx_para">
<span id="S15.I11.i1.p1.1" class="ltx_p"><math id="S15.I11.i1.p1.m1" class="ltx_Math" alttext="a_{i}\leq n" display="inline" intent=":literal"><semantics><mrow><msub><mi style="--ltx-fg-color:#000000;" mathcolor="#000000">a</mi><mi style="--ltx-fg-color:#000000;" mathcolor="#000000">i</mi></msub><mo style="--ltx-fg-color:#000000;" mathcolor="#000000">≤</mo><mi style="--ltx-fg-color:#000000;" mathcolor="#000000">n</mi></mrow><annotation encoding="application/x-tex">a_{i}\leq n</annotation></semantics></math><span id="S15.I11.i1.p1.1.1" class="ltx_text" style="--ltx-fg-color:#000000;"> for all </span><math id="S15.I11.i1.p1.m2" class="ltx_Math" alttext="1\leq i\leq k" display="inline" intent=":literal"><semantics><mrow><mn style="--ltx-fg-color:#000000;" mathcolor="#000000">1</mn><mo style="--ltx-fg-color:#000000;" mathcolor="#000000">≤</mo><mi style="--ltx-fg-color:#000000;" mathcolor="#000000">i</mi><mo style="--ltx-fg-color:#000000;" mathcolor="#000000">≤</mo><mi style="--ltx-fg-color:#000000;" mathcolor="#000000">k</mi></mrow><annotation encoding="application/x-tex">1\leq i\leq k</annotation></semantics></math><span id="S15.I11.i1.p1.1.2" class="ltx_text" style="--ltx-fg-color:#000000;">.</span></span>
</span></span>
<span id="S15.I11.i2" class="ltx_item" style="list-style-type:none;"><span class="ltx_tag ltx_tag_item">•</span> 
<span id="S15.I11.i2.p1" class="ltx_para">
<span id="S15.I11.i2.p1.1" class="ltx_p"><math id="S15.I11.i2.p1.m1" class="ltx_Math" alttext="a" display="inline" intent=":literal"><semantics><mi style="--ltx-fg-color:#000000;" mathcolor="#000000">a</mi><annotation encoding="application/x-tex">a</annotation></semantics></math><span id="S15.I11.i2.p1.1.1" class="ltx_text" style="--ltx-fg-color:#000000;"> is strictly increasing. That is, </span><math id="S15.I11.i2.p1.m2" class="ltx_Math" alttext="a_{i}&gt;a_{i-1}" display="inline" intent=":literal"><semantics><mrow><msub><mi style="--ltx-fg-color:#000000;" mathcolor="#000000">a</mi><mi style="--ltx-fg-color:#000000;" mathcolor="#000000">i</mi></msub><mo style="--ltx-fg-color:#000000;" mathcolor="#000000">&gt;</mo><msub><mi style="--ltx-fg-color:#000000;" mathcolor="#000000">a</mi><mrow><mi style="--ltx-fg-color:#000000;" mathcolor="#000000">i</mi><mo style="--ltx-fg-color:#000000;" mathcolor="#000000">−</mo><mn style="--ltx-fg-color:#000000;" mathcolor="#000000">1</mn></mrow></msub></mrow><annotation encoding="application/x-tex">a_{i}&gt;a_{i-1}</annotation></semantics></math><span id="S15.I11.i2.p1.1.2" class="ltx_text" style="--ltx-fg-color:#000000;"> for all </span><math id="S15.I11.i2.p1.m3" class="ltx_Math" alttext="2\leq i\leq k" display="inline" intent=":literal"><semantics><mrow><mn style="--ltx-fg-color:#000000;" mathcolor="#000000">2</mn><mo style="--ltx-fg-color:#000000;" mathcolor="#000000">≤</mo><mi style="--ltx-fg-color:#000000;" mathcolor="#000000">i</mi><mo style="--ltx-fg-color:#000000;" mathcolor="#000000">≤</mo><mi style="--ltx-fg-color:#000000;" mathcolor="#000000">k</mi></mrow><annotation encoding="application/x-tex">2\leq i\leq k</annotation></semantics></math><span id="S15.I11.i2.p1.1.3" class="ltx_text" style="--ltx-fg-color:#000000;">.</span></span>
</span></span>
<span id="S15.I11.i3" class="ltx_item" style="list-style-type:none;"><span class="ltx_tag ltx_tag_item">•</span> 
<span id="S15.I11.i3.p1" class="ltx_para">
<span id="S15.I11.i3.p1.1" class="ltx_p"><math id="S15.I11.i3.p1.m1" class="ltx_Math" alttext="a_{i}|a_{i-1}=n" display="inline" intent=":literal"><semantics><mrow><msub><mi style="--ltx-fg-color:#000000;" mathcolor="#000000">a</mi><mi style="--ltx-fg-color:#000000;" mathcolor="#000000">i</mi></msub><mo style="--ltx-fg-color:#000000;" fence="false" mathcolor="#000000">|</mo><mrow><msub><mi style="--ltx-fg-color:#000000;" mathcolor="#000000">a</mi><mrow><mi style="--ltx-fg-color:#000000;" mathcolor="#000000">i</mi><mo style="--ltx-fg-color:#000000;" mathcolor="#000000">−</mo><mn style="--ltx-fg-color:#000000;" mathcolor="#000000">1</mn></mrow></msub><mo style="--ltx-fg-color:#000000;" mathcolor="#000000">=</mo><mi style="--ltx-fg-color:#000000;" mathcolor="#000000">n</mi></mrow></mrow><annotation encoding="application/x-tex">a_{i}|a_{i-1}=n</annotation></semantics></math><span id="S15.I11.i3.p1.1.1" class="ltx_text" style="--ltx-fg-color:#000000;"> for all </span><math id="S15.I11.i3.p1.m2" class="ltx_Math" alttext="2\leq i\leq k" display="inline" intent=":literal"><semantics><mrow><mn style="--ltx-fg-color:#000000;" mathcolor="#000000">2</mn><mo style="--ltx-fg-color:#000000;" mathcolor="#000000">≤</mo><mi style="--ltx-fg-color:#000000;" mathcolor="#000000">i</mi><mo style="--ltx-fg-color:#000000;" mathcolor="#000000">≤</mo><mi style="--ltx-fg-color:#000000;" mathcolor="#000000">k</mi></mrow><annotation encoding="application/x-tex">2\leq i\leq k</annotation></semantics></math><span id="S15.I11.i3.p1.1.2" class="ltx_text" style="--ltx-fg-color:#000000;"> where </span><math id="S15.I11.i3.p1.m3" class="ltx_Math" alttext="|" display="inline" intent=":literal"><semantics><mo style="--ltx-fg-color:#000000;" fence="false" mathcolor="#000000" stretchy="false">|</mo><annotation encoding="application/x-tex">|</annotation></semantics></math><span id="S15.I11.i3.p1.1.3" class="ltx_text" style="--ltx-fg-color:#000000;"> denotes the bitwise OR operation.</span></span>
</span></span>
</span>
<span id="S15.SS0.SSS0.Px17.p2.pic1.2.2" class="ltx_p"><span id="S15.SS0.SSS0.Px17.p2.pic1.2.2.1" class="ltx_text ltx_font_bold" style="--ltx-fg-color:#000000;">Input<span id="S15.SS0.SSS0.Px17.p2.pic1.2.2.1.1" class="ltx_text ltx_font_medium"> 
<br class="ltx_break">Each test contains multiple test cases. The first line contains the number of test cases <math id="S15.SS0.SSS0.Px17.p2.pic1.m3" class="ltx_Math" alttext="t\ (1\leq t\leq 1000)" display="inline" intent=":literal"><semantics><mrow><mi style="--ltx-fg-color:#000000;" mathcolor="#000000">t</mi><mo lspace="0.500em">⁡</mo><mrow><mo style="--ltx-fg-color:#000000;" mathcolor="#000000" stretchy="false">(</mo><mrow><mn style="--ltx-fg-color:#000000;" mathcolor="#000000">1</mn><mo style="--ltx-fg-color:#000000;" mathcolor="#000000">≤</mo><mi style="--ltx-fg-color:#000000;" mathcolor="#000000">t</mi><mo style="--ltx-fg-color:#000000;" mathcolor="#000000">≤</mo><mn style="--ltx-fg-color:#000000;" mathcolor="#000000">1000</mn></mrow><mo style="--ltx-fg-color:#000000;" mathcolor="#000000" stretchy="false">)</mo></mrow></mrow><annotation encoding="application/x-tex">t\ (1\leq t\leq 1000)</annotation></semantics></math>. Description of the test cases follows. 
<br class="ltx_break">
<br class="ltx_break">The only line of each test case contains one integer <math id="S15.SS0.SSS0.Px17.p2.pic1.m4" class="ltx_Math" alttext="n\ (1\leq n\leq 10^{18})" display="inline" intent=":literal"><semantics><mrow><mi style="--ltx-fg-color:#000000;" mathcolor="#000000">n</mi><mo lspace="0.500em">⁡</mo><mrow><mo style="--ltx-fg-color:#000000;" mathcolor="#000000" stretchy="false">(</mo><mrow><mn style="--ltx-fg-color:#000000;" mathcolor="#000000">1</mn><mo style="--ltx-fg-color:#000000;" mathcolor="#000000">≤</mo><mi style="--ltx-fg-color:#000000;" mathcolor="#000000">n</mi><mo style="--ltx-fg-color:#000000;" mathcolor="#000000">≤</mo><msup><mn style="--ltx-fg-color:#000000;" mathcolor="#000000">10</mn><mn style="--ltx-fg-color:#000000;" mathcolor="#000000">18</mn></msup></mrow><mo style="--ltx-fg-color:#000000;" mathcolor="#000000" stretchy="false">)</mo></mrow></mrow><annotation encoding="application/x-tex">n\ (1\leq n\leq 10^{18})</annotation></semantics></math>. 
<br class="ltx_break">
<br class="ltx_break">It’s guaranteed that the sum of lengths of the longest valid sequences does not exceed <math id="S15.SS0.SSS0.Px17.p2.pic1.m5" class="ltx_Math" alttext="5\cdot 10^{5}" display="inline" intent=":literal"><semantics><mrow><mn style="--ltx-fg-color:#000000;" mathcolor="#000000">5</mn><mo style="--ltx-fg-color:#000000;" lspace="0.222em" mathcolor="#000000" rspace="0.222em">⋅</mo><msup><mn style="--ltx-fg-color:#000000;" mathcolor="#000000">10</mn><mn style="--ltx-fg-color:#000000;" mathcolor="#000000">5</mn></msup></mrow><annotation encoding="application/x-tex">5\cdot 10^{5}</annotation></semantics></math>. 
<br class="ltx_break">
<br class="ltx_break"></span>Output<span id="S15.SS0.SSS0.Px17.p2.pic1.2.2.1.2" class="ltx_text ltx_font_medium"> 
<br class="ltx_break">For each testcase, print two lines. In the first line, print the length of your constructed sequence, <math id="S15.SS0.SSS0.Px17.p2.pic1.m6" class="ltx_Math" alttext="k" display="inline" intent=":literal"><semantics><mi style="--ltx-fg-color:#000000;" mathcolor="#000000">k</mi><annotation encoding="application/x-tex">k</annotation></semantics></math>. In the second line, print <math id="S15.SS0.SSS0.Px17.p2.pic1.m7" class="ltx_Math" alttext="k" display="inline" intent=":literal"><semantics><mi style="--ltx-fg-color:#000000;" mathcolor="#000000">k</mi><annotation encoding="application/x-tex">k</annotation></semantics></math> positive integers, denoting the sequence. If there are multiple longest sequences, you can print any of them.</span></span></span>
</span></span></span></foreignobject></g></g></svg>