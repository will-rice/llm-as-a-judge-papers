<svg id="A2.F7.p1.pic1" class="ltx_picture" height="564.99" overflow="visible" version="1.1" viewbox="0 0 665 564.99" width="665"><g style="--ltx-stroke-color:#000000;--ltx-fill-color:#000000;" fill="#000000" stroke="#000000" stroke-width="0.4pt" transform="translate(0,564.99) matrix(1 0 0 -1 0 0)"><g style="--ltx-fill-color:#666666;" fill="#666666" fill-opacity="1.0"><path style="stroke:none" d="M 0 2.91 L 0 562.09 C 0 563.69 1.3 564.99 2.91 564.99 L 662.09 564.99 C 663.7 564.99 665 563.69 665 562.09 L 665 2.91 C 665 1.3 663.7 0 662.09 0 L 2.91 0 C 1.3 0 0 1.3 0 2.91 Z" /></g><g style="--ltx-fill-color:#FAFAFA;" fill="#FAFAFA" fill-opacity="1.0"><path style="stroke:none" d="M 0.83 2.91 L 0.83 545.62 L 664.17 545.62 L 664.17 2.91 C 664.17 1.76 663.24 0.83 662.09 0.83 L 2.91 0.83 C 1.76 0.83 0.83 1.76 0.83 2.91 Z" /></g><g fill-opacity="1.0" transform="matrix(1.0 0.0 0.0 1.0 13.07 552.54)"><foreignobject style="--ltx-fo-width:47.11em;--ltx-fo-height:0.56em;--ltx-fo-depth:0.16em;font-size:10pt;" height="9.84" overflow="visible" transform="matrix(1 0 0 -1 0 7.69)" width="651.87"><span class="ltx_foreignobject_container"><span class="ltx_foreignobject_content">
<span id="A2.F7.p1.pic1.1" class="ltx_inline-block ltx_minipage ltx_align_bottom" style="width:47.11em;">
<span id="A2.F7.p1.pic1.1.1" class="ltx_p"><span id="A2.F7.p1.pic1.1.1.1" class="ltx_text ltx_font_bold" style="font-size:80%;--ltx-fg-color:#FFFFFF;">Listwise Evaluation Prompt</span></span>
</span></span></span></foreignobject></g><g fill-opacity="1.0" transform="matrix(1.0 0.0 0.0 1.0 13.07 14.11)"><foreignobject style="--ltx-fo-width:62.82em;--ltx-fo-height:37.63em;--ltx-fo-depth:0.18em;font-size:10pt;" height="523.08" overflow="visible" transform="matrix(1 0 0 -1 0 520.66)" width="869.25"><span class="ltx_foreignobject_container"><span class="ltx_foreignobject_content">
<span id="A2.F7.p1.pic1.2" class="ltx_inline-block ltx_minipage ltx_align_bottom" style="width:62.82em;">
<span id="A2.F7.p1.pic1.2.1" class="ltx_p"><span id="A2.F7.p1.pic1.2.1.1" class="ltx_text ltx_font_typewriter" style="font-size:70%;--ltx-fg-color:#000000;">You are an impartial judge evaluating the quality of three AI assistant responses to the same user request. 
<br class="ltx_break"></span></span>
<span id="A2.F7.p1.pic1.2.2" class="ltx_p"><span id="A2.F7.p1.pic1.2.2.1" class="ltx_text ltx_font_typewriter" style="font-size:70%;--ltx-fg-color:#000000;">You must rank the three assistants from best to worst. 
<br class="ltx_break"></span></span>
<span id="A2.F7.p1.pic1.2.3" class="ltx_p"><span id="A2.F7.p1.pic1.2.3.1" class="ltx_text ltx_font_typewriter" style="font-size:70%;--ltx-fg-color:#000000;">Your evaluation must consider: 
<br class="ltx_break">- Helpfulness 
<br class="ltx_break">- Relevance 
<br class="ltx_break">- Accuracy 
<br class="ltx_break">- Depth 
<br class="ltx_break">- Creativity 
<br class="ltx_break">- Level of detail 
<br class="ltx_break"></span></span>
<span id="A2.F7.p1.pic1.2.4" class="ltx_p"><span id="A2.F7.p1.pic1.2.4.1" class="ltx_text ltx_font_typewriter" style="font-size:70%;--ltx-fg-color:#000000;">Avoid position bias. Do not let the order of responses influence your judgment. 
<br class="ltx_break">Do not favor longer responses. Be as objective as possible. 
<br class="ltx_break"></span></span>
<span id="A2.F7.p1.pic1.2.5" class="ltx_p"><span id="A2.F7.p1.pic1.2.5.1" class="ltx_text ltx_font_typewriter" style="font-size:70%;--ltx-fg-color:#000000;">If two or three responses are genuinely indistinguishable in quality, ties are allowed. 
<br class="ltx_break"></span></span>
<span id="A2.F7.p1.pic1.2.6" class="ltx_p"><span id="A2.F7.p1.pic1.2.6.1" class="ltx_text ltx_font_typewriter" style="font-size:70%;--ltx-fg-color:#000000;">Output exactly one final ranking in one of these formats and nothing else: 
<br class="ltx_break">Ranking:[A&gt;B&gt;C] 
<br class="ltx_break">[3]
Ranking:[A&gt;C&gt;B] 
<br class="ltx_break">Ranking:[B&gt;A&gt;C] 
<br class="ltx_break">Ranking:[B&gt;C&gt;A] 
<br class="ltx_break">Ranking:[C&gt;A&gt;B] 
<br class="ltx_break">Ranking:[C&gt;B&gt;A] 
<br class="ltx_break">Ranking:[A=B&gt;C] 
<br class="ltx_break">Ranking:[A=C&gt;B] 
<br class="ltx_break">Ranking:[B=C&gt;A] 
<br class="ltx_break">Ranking:[A&gt;B=C] 
<br class="ltx_break">Ranking:[B&gt;A=C] 
<br class="ltx_break">Ranking:[C&gt;A=B] 
<br class="ltx_break">Ranking:[A=B=C] 
<br class="ltx_break"></span></span>
<span id="A2.F7.p1.pic1.2.7" class="ltx_p"><span id="A2.F7.p1.pic1.2.7.1" class="ltx_text ltx_font_typewriter" style="font-size:70%;--ltx-fg-color:#000000;">Instruction: {instruction} 
<br class="ltx_break">Input: {input} 
<br class="ltx_break">Assistant A: {answerA} 
<br class="ltx_break">Assistant B: {answerB} 
<br class="ltx_break">Assistant C: {answerC}
</span></span>
</span></span></span></foreignobject></g></g></svg>