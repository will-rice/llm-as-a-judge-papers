<span id="A13.p3.pic1.2.1" class="ltx_p"><span id="A13.p3.pic1.2.1.1" class="ltx_text ltx_font_bold" style="--ltx-fg-color:#000000;">System message:
<br class="ltx_break">
<br class="ltx_break"><span id="A13.p3.pic1.2.1.1.1" class="ltx_text ltx_font_medium">You are helpful and creative rubric generator. You should brainstorm a creative and impressive rubric to evaluate how well a language model follows the given preference.
<br class="ltx_break">You are given 3 example rubrics and a preference for a specific dimension.
<br class="ltx_break">Suppose you are to evaluate a language model. Create a score rubric that can assess whether the model has generated a response that is tailored to the preference.
<br class="ltx_break">
<br class="ltx_break">[Rules ]
<br class="ltx_break">- The rubric should be structured to evaluate whether a language model has created a response considering the given preferences.
<br class="ltx_break">- Please do not generate any other opening, closing, and explanations.
<br class="ltx_break">- Output the score rubric in JSON format. Please format the output as same as the examples with no extra or surrounding text.
<br class="ltx_break"></span></span></span>
</span></span></span></foreignobject></g><g fill-opacity="1.0" transform="matrix(1.0 0.0 0.0 1.0 21.65 16.47)"><foreignobject style="--ltx-fo-width:31.37em;--ltx-fo-height:9.09em;--ltx-fo-depth:0.19em;font-size:10pt;" height="128.53" overflow="visible" transform="matrix(1 0 0 -1 0 125.84)" width="434.07"><span class="ltx_foreignobject_container"><span class="ltx_foreignobject_content">
