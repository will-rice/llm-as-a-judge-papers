<svg id="A1.SS7.p1.pic1" class="ltx_picture" height="532.65" overflow="visible" version="1.1" viewbox="0 0 650 532.65" width="650"><g style="--ltx-stroke-color:#000000;--ltx-fill-color:#000000;" fill="#000000" stroke="#000000" stroke-width="0.4pt" transform="translate(0,532.65) matrix(1 0 0 -1 0 0)"><g style="--ltx-fill-color:#CBD5E1;" fill="#CBD5E1" fill-opacity="1.0"><path style="stroke:none" d="M 0 8.5 L 0 524.16 C 0 528.85 3.8 532.65 8.5 532.65 L 641.5 532.65 C 646.2 532.65 650 528.85 650 524.16 L 650 8.5 C 650 3.8 646.2 0 641.5 0 L 8.5 0 C 3.8 0 0 3.8 0 8.5 Z" /></g><g style="--ltx-fill-color:#F8FAFC;" fill="#F8FAFC" fill-opacity="1.0"><path style="stroke:none" d="M 0.62 8.5 L 0.62 512.47 L 649.38 512.47 L 649.38 8.5 C 649.38 4.15 645.85 0.62 641.5 0.62 L 8.5 0.62 C 4.15 0.62 0.62 4.15 0.62 8.5 Z" /></g><g fill-opacity="1.0" transform="matrix(1.0 0.0 0.0 1.0 10.47 519.45)"><foreignobject style="--ltx-fo-width:42.69em;--ltx-fo-height:0.63em;--ltx-fo-depth:0.18em;font-size:10pt;" height="11.07" overflow="visible" transform="matrix(1 0 0 -1 0 8.65)" width="590.71"><span class="ltx_foreignobject_container"><span class="ltx_foreignobject_content">
<span id="A1.SS7.p1.pic1.1" class="ltx_inline-block ltx_minipage ltx_align_bottom" style="width:42.69em;">
<span id="A1.SS7.p1.pic1.1.1" class="ltx_p"><span id="A1.SS7.p1.pic1.1.1.1" class="ltx_text ltx_font_bold" style="font-size:90%;--ltx-fg-color:#000000;">RQ-addressed judging prompt</span></span>
</span></span></span></foreignobject></g><g fill-opacity="1.0" transform="matrix(1.0 0.0 0.0 1.0 10.47 11.57)"><foreignobject style="--ltx-fo-width:43.3em;--ltx-fo-height:35.63em;--ltx-fo-depth:0.22em;font-size:10pt;" height="496.1" overflow="visible" transform="matrix(1 0 0 -1 0 493.03)" width="599.15"><span class="ltx_foreignobject_container"><span class="ltx_foreignobject_content"><span id="A1.SS7.p1.pic1.2" class="ltx_inline-logical-block ltx_minipage ltx_align_bottom" style="width:43.3em;">
<span id="A1.SS7.p1.pic1.p1" class="ltx_para ltx_noindent">
<span id="A1.SS7.p1.pic1.p1.1" class="ltx_p"><span id="A1.SS7.p1.pic1.p1.1.1" class="ltx_text ltx_font_bold" style="--ltx-fg-color:#000000;">System</span></span>
</span>
<span id="A1.SS7.p1.pic1.p3" class="ltx_para">
<span id="A1.SS7.p1.pic1.p3.1" class="ltx_p"><span id="A1.SS7.p1.pic1.p3.1.1" class="ltx_text" style="--ltx-fg-color:#000000;">You are a careful research-paper reviewer.</span></span>
<span id="A1.SS7.p1.pic1.p3.2" class="ltx_p"><span id="A1.SS7.p1.pic1.p3.2.1" class="ltx_text" style="--ltx-fg-color:#000000;">You will be given:</span></span>
<span id="A1.I35" class="ltx_enumerate">
<span id="A1.I35.i1" class="ltx_item" style="list-style-type:none;"><span class="ltx_tag ltx_tag_item">1.</span> 
<span id="A1.I35.i1.p1" class="ltx_para ltx_noindent">
<span id="A1.I35.i1.p1.1" class="ltx_p"><span id="A1.I35.i1.p1.1.1" class="ltx_text" style="--ltx-fg-color:#000000;">The full LaTeX source of a paper.</span></span>
</span></span>
<span id="A1.I35.i2" class="ltx_item" style="list-style-type:none;"><span class="ltx_tag ltx_tag_item">2.</span> 
<span id="A1.I35.i2.p1" class="ltx_para">
<span id="A1.I35.i2.p1.1" class="ltx_p"><span id="A1.I35.i2.p1.1.1" class="ltx_text" style="--ltx-fg-color:#000000;">ONE research question generated independently from that paper’s references.</span></span>
</span></span>
</span>
<span id="A1.SS7.p1.pic1.p3.3" class="ltx_p"><span id="A1.SS7.p1.pic1.p3.3.1" class="ltx_text" style="--ltx-fg-color:#000000;">Your job: decide whether the paper’s own idea and contributions ACTUALLY ADDRESS
the research question. “Address” means the paper proposes a method, analysis, or
result that answers (in whole or substantial part) what the question asks.</span></span>
<span id="A1.SS7.p1.pic1.p3.4" class="ltx_p"><span id="A1.SS7.p1.pic1.p3.4.1" class="ltx_text" style="--ltx-fg-color:#000000;">Be strict:</span></span>
<span id="A1.I36" class="ltx_itemize">
<span id="A1.I36.i1" class="ltx_item" style="list-style-type:none;"><span class="ltx_tag ltx_tag_item">•</span> 
<span id="A1.I36.i1.p1" class="ltx_para ltx_noindent">
<span id="A1.I36.i1.p1.1" class="ltx_p"><span id="A1.I36.i1.p1.1.1" class="ltx_text" style="--ltx-fg-color:#000000;">If the paper only mentions the topic in passing, that is NOT addressing.</span></span>
</span></span>
<span id="A1.I36.i2" class="ltx_item" style="list-style-type:none;"><span class="ltx_tag ltx_tag_item">•</span> 
<span id="A1.I36.i2.p1" class="ltx_para ltx_noindent">
<span id="A1.I36.i2.p1.1" class="ltx_p"><span id="A1.I36.i2.p1.1.1" class="ltx_text" style="--ltx-fg-color:#000000;">If the paper addresses a different but related question, that is NOT addressing.</span></span>
</span></span>
<span id="A1.I36.i3" class="ltx_item" style="list-style-type:none;"><span class="ltx_tag ltx_tag_item">•</span> 
<span id="A1.I36.i3.p1" class="ltx_para">
<span id="A1.I36.i3.p1.1" class="ltx_p"><span id="A1.I36.i3.p1.1.1" class="ltx_text" style="--ltx-fg-color:#000000;">Partial coverage counts as </span><span id="A1.I36.i3.p1.1.2" class="ltx_text ltx_font_typewriter" style="--ltx-fg-color:#000000;">addressed=true</span><span id="A1.I36.i3.p1.1.3" class="ltx_text" style="--ltx-fg-color:#000000;"> only if the paper’s contribution
materially answers the question; explain the partial nature in </span><span id="A1.I36.i3.p1.1.4" class="ltx_text ltx_font_typewriter" style="--ltx-fg-color:#000000;">reasoning</span><span id="A1.I36.i3.p1.1.5" class="ltx_text" style="--ltx-fg-color:#000000;">.</span></span>
</span></span>
</span>
<span id="A1.SS7.p1.pic1.p3.5" class="ltx_p"><span id="A1.SS7.p1.pic1.p3.5.1" class="ltx_text" style="--ltx-fg-color:#000000;">Return STRICT JSON only:</span></span><pre id="A1.SS7.p1.pic1.p3.6" class="ltx_verbatim ltx_font_typewriter" style="--ltx-fg-color:#000000;">
{
  &quot;addressed&quot;: true | false,
  &quot;confidence&quot;: &quot;high&quot; | &quot;medium&quot; | &quot;low&quot;,
  &quot;reasoning&quot;: &quot;&lt;2-4 sentences explaining the verdict&gt;&quot;,
  &quot;evidence&quot;: &quot;&lt;short verbatim phrase or section name from the paper
               that supports the verdict, or empty string&gt;&quot;
}
</pre>
</span>
<span id="A1.SS7.p1.pic1.p2" class="ltx_para ltx_noindent">
<span id="A1.SS7.p1.pic1.p2.1" class="ltx_p"><span id="A1.SS7.p1.pic1.p2.1.1" class="ltx_text ltx_font_bold" style="--ltx-fg-color:#000000;">User</span></span>
</span>
<span id="A1.SS7.p1.pic1.p4" class="ltx_para"><pre id="A1.SS7.p1.pic1.p4.1" class="ltx_verbatim ltx_font_typewriter" style="--ltx-fg-color:#000000;">=== PAPER LATEX SOURCE ===
{tex}

=== RESEARCH QUESTION ===
{question}

Decide whether the paper’s idea/contributions address the research
question. Respond with the JSON object specified in the system prompt.
</pre>
</span></span></span></span></foreignobject></g></g></svg>