<span id="A12.SS1.p1.pic1.1" class="ltx_inline-block ltx_minipage ltx_align_bottom" style="width:44.07em;">
<span id="A12.SS1.p1.pic1.1.1" class="ltx_p"><span id="A12.SS1.p1.pic1.1.1.1" class="ltx_text" style="--ltx-fg-color:#FFFFFF;">Prompts for Edge Weighting</span></span>
</span></span></span></foreignobject></g><g fill-opacity="1.0" transform="matrix(1.0 0.0 0.0 1.0 21.65 451.67)"><foreignobject style="--ltx-fo-width:44.07em;--ltx-fo-height:1.89em;--ltx-fo-depth:0.19em;font-size:10pt;" height="28.79" overflow="visible" transform="matrix(1 0 0 -1 0 26.1)" width="609.8"><span class="ltx_foreignobject_container"><span class="ltx_foreignobject_content">
<span id="A12.SS1.p1.pic1.2" class="ltx_inline-block ltx_minipage ltx_align_bottom" style="width:44.07em;">
<span id="A12.SS1.p1.pic1.2.1" class="ltx_p"><span id="A12.SS1.p1.pic1.2.1.1" class="ltx_text ltx_font_bold" style="--ltx-fg-color:#000000;">Input<span id="A12.SS1.p1.pic1.2.1.1.1" class="ltx_text ltx_font_medium">: Writing Instruction <math id="A12.SS1.p1.pic1.m1" class="ltx_Math" alttext="\mathcal{I}" display="inline" intent=":literal"><semantics><mi style="--ltx-fg-color:#000000;" class="ltx_font_mathcaligraphic" mathcolor="#000000">ℐ</mi><annotation encoding="application/x-tex">\mathcal{I}</annotation></semantics></math></span></span></span>
</span></span></span></foreignobject></g><g fill-opacity="1.0" transform="matrix(1.0 0.0 0.0 1.0 21.65 17.24)"><foreignobject style="--ltx-fo-width:44.07em;--ltx-fo-height:29.49em;--ltx-fo-depth:0.25em;font-size:10pt;" height="411.58" overflow="visible" transform="matrix(1 0 0 -1 0 408.12)" width="609.8"><span class="ltx_foreignobject_container"><span class="ltx_foreignobject_content">
<span id="A12.SS1.p1.pic1.3" class="ltx_inline-block ltx_minipage ltx_align_bottom" style="width:44.07em;">
<span id="A12.SS1.p1.pic1.3.1" class="ltx_p"><span id="A12.SS1.p1.pic1.3.1.1" class="ltx_text" style="--ltx-fg-color:#000000;">Please assign a weight to each evaluation dimension based on the following writing instruction and evaluation dimensions. Follow these rules when assigning weights:</span></span>
<span id="A12.SS1.p1.pic1.3.2" class="ltx_p"><span id="A12.SS1.p1.pic1.3.2.1" class="ltx_text" style="--ltx-fg-color:#000000;">1. The sum of the weights of all evaluation dimensions must equal 1.</span></span>
<span id="A12.SS1.p1.pic1.3.3" class="ltx_p"><span id="A12.SS1.p1.pic1.3.3.1" class="ltx_text" style="--ltx-fg-color:#000000;">2. The weights should be floating-point numbers between 0 and 1, rounded to a maximum of two decimal places. In rare cases, negative weights are allowed but no lower than -1.</span></span>
<span id="A12.SS1.p1.pic1.3.4" class="ltx_p"><span id="A12.SS1.p1.pic1.3.4.1" class="ltx_text" style="--ltx-fg-color:#000000;">3. Each dimension’s weight should be reasonably allocated according to its relevance to the characteristics of the writing instruction. Negative weights are permitted. For example, in argumentative writing, the weight for emotional expression can be set very low (e.g., 0 0.1) since emotional expression may hinder the rigor of argumentation.</span></span>
<span id="A12.SS1.p1.pic1.3.5" class="ltx_p"><span id="A12.SS1.p1.pic1.3.5.1" class="ltx_text" style="--ltx-fg-color:#000000;">4. After assigning weights to all dimensions, provide a brief explanation for your choices.</span></span>
<span id="A12.SS1.p1.pic1.3.6" class="ltx_p"><span id="A12.SS1.p1.pic1.3.6.1" class="ltx_text" style="--ltx-fg-color:#000000;">[Writing Instruction Start]</span></span>
<span id="A12.SS1.p1.pic1.3.7" class="ltx_p"><span id="A12.SS1.p1.pic1.3.7.1" class="ltx_text" style="--ltx-fg-color:#000000;">{instruction}</span></span>
<span id="A12.SS1.p1.pic1.3.8" class="ltx_p"><span id="A12.SS1.p1.pic1.3.8.1" class="ltx_text" style="--ltx-fg-color:#000000;">[Writing Instruction End]</span></span>
<span id="A12.SS1.p1.pic1.3.9" class="ltx_p"><span id="A12.SS1.p1.pic1.3.9.1" class="ltx_text" style="--ltx-fg-color:#000000;">[Evaluation Dimensions Start]</span></span>
<span id="A12.SS1.p1.pic1.3.10" class="ltx_p"><span id="A12.SS1.p1.pic1.3.10.1" class="ltx_text" style="--ltx-fg-color:#000000;">1. Introduction and Conclusion : The introduction should be engaging and innovative; the conclusion should go beyond mere summary, aiming to impress or resonate deeply, and avoid formulaic openings or endings.</span></span>
<span id="A12.SS1.p1.pic1.3.11" class="ltx_p"><span id="A12.SS1.p1.pic1.3.11.1" class="ltx_text" style="--ltx-fg-color:#000000;">2. Language and Rhetoric : Rich vocabulary and clear sentences; the writing should vividly describe objects (scenery, people, psychology, actions, etc.) and make skillful use of rhetoric or writing techniques (e.g., metaphor, parallelism).</span></span>
<span id="A12.SS1.p1.pic1.3.12" class="ltx_p"><span id="A12.SS1.p1.pic1.3.12.1" class="ltx_text" style="--ltx-fg-color:#000000;">3. Argumentative Logic : Logical progression should flow seamlessly, leading readers naturally from common knowledge to deeper thoughts; argumentation must be solid and avoid jumping to conclusions or excessive slogan-style assertions.</span></span>
<span id="A12.SS1.p1.pic1.3.13" class="ltx_p"><span id="A12.SS1.p1.pic1.3.13.1" class="ltx_text" style="--ltx-fg-color:#000000;">4. Emotional Expression : Tailored to the target audience and writing content, emotions conveyed by the author or characters should evoke a strong resonance in readers.
[Evaluation Dimensions End]</span></span>
</span></span></span></foreignobject></g></g></svg>