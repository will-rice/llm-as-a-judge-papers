<span id="A3.F4.pic3.p1.1" class="ltx_p"><span id="A3.F4.pic3.p1.1.1" class="ltx_text" style="--ltx-fg-color:#000000;">Hona hemen testua laburtuta:</span></span>
</span>
<span id="A3.F4.pic3.p2" class="ltx_para">
<span id="A3.F4.pic3.p2.1" class="ltx_p"><span id="A3.F4.pic3.p2.1.1" class="ltx_text" style="--ltx-fg-color:#000000;" lang="eu">Etxebarrin (Bizkaia), herriko jaietan, emakume batek sexu eraso bat jasan zuen atzo goizaldean kalean jarritako komunetan. Ondorioz, Udalak egun horretarako aurreikusitako ekitaldi guztiak bertan behera utzi zituen. Zintururi plazan elkarretaratzea egin zuten Udalak, jai batzordeak eta txosnek, eta ehunka herritar bildu ziren “Erasorik ez, erantzunik gabe” lelopean. Ertzaintzak ikerketa abiatu du, baina ez da inor atxilotu oraindik. Udalak ohar batean adierazi du jaiak bizikidetza eta askatasuna errespetatuz ospatu behar direla, eta erasoak egiten dituzten pertsonak ez direla ongi etorriak.</span></span>
</span></span></span></span></foreignobject></g></g></svg>