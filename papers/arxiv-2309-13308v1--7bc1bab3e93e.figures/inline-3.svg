<span id="A4.F7.pic1.1" class="ltx_inline-block ltx_minipage ltx_align_bottom" style="width:36.72em;">
<span id="A4.F7.pic1.1.1" class="ltx_p"><span id="A4.F7.pic1.1.1.1" class="ltx_text" style="--ltx-fg-color:#000000;">## Instructions</span></span>
<span id="A4.F7.pic1.1.2" class="ltx_p"><span id="A4.F7.pic1.1.2.1" class="ltx_text" style="--ltx-fg-color:#000000;">Please infer the scoring criteria for the following task:</span></span>
<span id="A4.F7.pic1.1.3" class="ltx_p"><span id="A4.F7.pic1.1.3.1" class="ltx_text" style="--ltx-fg-color:#000000;">[Evaluate the <span id="A4.F7.pic1.1.3.1.1" class="ltx_text" style="--ltx-fg-color:#BF0040;">factual consistency</span> of the summary to the article. Check how well the summary is supported by the article and whether it contains untruthful or misleading facts. Score 1 if the summary is factually consistent with the article, 0 otherwise.] 
<br class="ltx_break"></span></span>
<span id="A4.F7.pic1.1.4" class="ltx_p"><span id="A4.F7.pic1.1.4.1" class="ltx_text" style="--ltx-fg-color:#000000;">- The following is some examples on evaluation of <span id="A4.F7.pic1.1.4.1.1" class="ltx_text" style="--ltx-fg-color:#BF0040;">factual consistency</span> of generated summary to the article.</span></span>
<span id="A4.F7.pic1.1.5" class="ltx_p"><span id="A4.F7.pic1.1.5.1" class="ltx_text" style="--ltx-fg-color:#000000;">- Please carefully read all summary - article pairs and its assigned score, and induce the most possible scoring rule and criteria used.</span></span>
<span id="A4.F7.pic1.1.6" class="ltx_p"><span id="A4.F7.pic1.1.6.1" class="ltx_text" style="--ltx-fg-color:#000000;">- It is optimal that, by using the same criteria, you are very likely to assign a same score to the provided reference scores. 
<br class="ltx_break"></span></span>
<span id="A4.F7.pic1.1.7" class="ltx_p"><span id="A4.F7.pic1.1.7.1" class="ltx_text" style="--ltx-fg-color:#000000;">## Criteria for <span id="A4.F7.pic1.1.7.1.1" class="ltx_text" style="--ltx-fg-color:#BF0040;">factual consistency</span></span></span>
<span id="A4.F7.pic1.1.8" class="ltx_p"><span id="A4.F7.pic1.1.8.1" class="ltx_text" style="--ltx-fg-color:#000000;">- The scoring criteria been used. Now it is not explicitly provided, and you should induce it from the following samples.</span></span>
<span id="A4.F7.pic1.1.9" class="ltx_p"><span id="A4.F7.pic1.1.9.1" class="ltx_text" style="--ltx-fg-color:#000000;">- The induced criteria should be able to explain the scores of all the samples provided, being generic and concise. 
<br class="ltx_break"></span></span>
<span id="A4.F7.pic1.1.10" class="ltx_p"><span id="A4.F7.pic1.1.10.1" class="ltx_text" style="--ltx-fg-color:#000000;">## Examples</span></span>
<span id="A4.F7.pic1.1.11" class="ltx_p"><span id="A4.F7.pic1.1.11.1" class="ltx_text" style="--ltx-fg-color:#0000FF;">[In-Context Few-Shot Samples]<span id="A4.F7.pic1.1.11.1.1" class="ltx_text" style="--ltx-fg-color:#000000;"> 
<br class="ltx_break"></span></span></span>
<span id="A4.F7.pic1.1.12" class="ltx_p"><span id="A4.F7.pic1.1.12.1" class="ltx_text" style="--ltx-fg-color:#000000;">## Induced Criteria</span></span>
<span id="A4.F7.pic1.1.13" class="ltx_p"><span id="A4.F7.pic1.1.13.1" class="ltx_text" style="--ltx-fg-color:#000000;">Criteria for <span id="A4.F7.pic1.1.13.1.1" class="ltx_text" style="--ltx-fg-color:#BF0040;">factual consistency</span>:</span></span>
