<span id="A4.pic1.1" class="ltx_inline-block ltx_minipage ltx_align_bottom" style="width:45.66em;">
<span id="A4.pic1.1.1" class="ltx_p"><span id="A4.pic1.1.1.1" class="ltx_text" style="--ltx-fg-color:#FFFFFF;">Concept Generation - MEMERAG</span></span>
</span></span></span></foreignobject></g><g fill-opacity="1.0" transform="matrix(1.0 0.0 0.0 1.0 10.67 145)"><foreignobject style="--ltx-fo-width:45.66em;--ltx-fo-height:4.06em;--ltx-fo-depth:9.85em;font-size:10pt;" height="192.48" overflow="visible" transform="matrix(1 0 0 -1 0 56.18)" width="631.81"><span class="ltx_foreignobject_container"><span class="ltx_foreignobject_content"><span id="A4.pic1.2" class="ltx_inline-logical-block ltx_minipage ltx_align_bottom" style="width:45.66em;">
<span id="A4.pic1.p1" class="ltx_para ltx_noindent">
<span id="A4.pic1.p1.1" class="ltx_p"><span id="A4.pic1.p1.1.1" class="ltx_text ltx_font_typewriter" style="--ltx-fg-color:#000000;">&quot;system_prompt&quot;: &quot;You are an evidence-grounding evaluator. Your goal is to identify key verification concepts for checking whether answers are supported by evidence.&quot;</span></span>
</span>
<span id="A4.pic1.p2" class="ltx_para ltx_noindent">
<span id="A4.pic1.p2.1" class="ltx_p"><span id="A4.pic1.p2.1.1" class="ltx_text ltx_font_typewriter" style="--ltx-fg-color:#000000;">&quot;task_prompt&quot;: &quot;Generate 3–5 distinct verification concepts that are essential for evaluating whether an answer is supported by evidence passages.\n\nGuidelines:\n- Concepts should cover different aspects of evidence grounding (e.g., factual accuracy, completeness, specificity, consistency, source attribution).\n- Each concept should be general enough to apply across different topics and domains.\n- Concepts should target different failure modes where answers might not be properly supported.\n- Keep concepts concise (2–5 words each).\n\nReturn exactly this format:\n\n&lt;concepts&gt;\n&lt;concept1&gt;[Concept name]&lt;/concept1&gt;\n&lt;concept2&gt;[Concept name]&lt;/concept2&gt;\n...\n&lt;/concepts&gt;&quot;</span></span>
</span></span></span></span></foreignobject></g></g></svg>