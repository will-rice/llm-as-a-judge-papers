</span></span></span></foreignobject></g><g fill-opacity="1.0" transform="matrix(1.0 0.0 0.0 1.0 9.84 16.55)"><foreignobject style="--ltx-fo-width:44.1em;--ltx-fo-height:11.5em;--ltx-fo-depth:0.2em;font-size:10pt;" height="161.89" overflow="visible" transform="matrix(1 0 0 -1 0 159.13)" width="610.22"><span class="ltx_foreignobject_container"><span class="ltx_foreignobject_content"><span id="A3.F5.pic1.2" class="ltx_inline-logical-block ltx_minipage ltx_align_bottom" style="width:44.1em;">
<span id="A3.F5.pic1.p1" class="ltx_para ltx_align_left ltx_noindent" lang="es">
<span id="A3.F5.pic1.p1.1" class="ltx_p"><span id="A3.F5.pic1.p1.1.1" class="ltx_text" style="--ltx-fg-color:#000000;">La Policía ha detenido en Alemania al joven de 17 años que estaba siendo buscado como presunto autor de la muerte de su hermana , de 14 , cuyo cadáver fue hallado en el domicilio familiar de Mataró , Barcelona , el pasado junio . El joven ha sido trasladado ya a España y ha sido puesto a disposición de la fiscalía de menores , según fuentes cercanas al caso . El menor estaba siendo buscado desde el pasado mes de junio , después de que se encontrara en el domicilio familiar el cadáver de su hermana , de 14 años , con heridas de arma blanca . El crimen ocurrió cuando la madre de ambos menores , de origen ruso , se encontraba de viaje , por lo que los dos adolescentes se habían quedado solos en la vivienda , situada en el barrio Cerdanyola de Mataró . Alertada por no poder contactar con sus hijos , la mujer pidió a unos amigos que acudieran a su domicilio , donde estos encontraron el cadáver de la menor , sin rastro de su hermano mayor.</span></span>
</span></span></span></span></foreignobject></g></g></svg>