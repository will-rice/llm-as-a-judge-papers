<span id="A6.F29.pic1.1.1" class="ltx_p"><span id="A6.F29.pic1.1.1.1" class="ltx_text" style="--ltx-fg-color:#FF0000;">You are a help assistant tasked with extracting the precise key answer from given output sentences. You must only provide the extracted key answer without including any additional text.
<span id="A6.F29.pic1.1.1.1.1" class="ltx_text"></span></span></span>
<span id="A6.F29.pic1.1.2" class="ltx_p"><span id="A6.F29.pic1.1.2.1" class="ltx_text" style="--ltx-fg-color:#000000;">—
<br class="ltx_break"><span id="A6.F29.pic1.1.2.1.1" class="ltx_text" style="--ltx-fg-color:#FF8000;">
I will provide you with a question, output sentences along with an answer range. The output sentences are the responses to the question provided. The answer range could either describe the type of answer expected or list all possible valid answers. Using the information provided, you must accurately and precisely determine and extract the intended key answer from the output sentences. Please don’t have your subjective thoughts about the question.
<br class="ltx_break">If the output sentences present multiple different answers, carefully determine if the later provided answer is a correction or modification of a previous one. If so, extract this corrected or modified answer as the final response. Conversely, if the output sentences fluctuate between multiple answers without a clear final answer, you should output [No valid answer].
<br class="ltx_break">For a question of type &quot;classify_text&quot;, if the output sentences do not clearly provide any answer within the specified answer range, then the output should be [No valid answer].
Additionally, if the answer range is a list and the answer given in the output sentences is not included in the answer range, also output [No valid answer].
</span></span></span>
<span id="A6.F29.pic1.1.3" class="ltx_p"><span id="A6.F29.pic1.1.3.1" class="ltx_text" style="--ltx-fg-color:#000000;">—
