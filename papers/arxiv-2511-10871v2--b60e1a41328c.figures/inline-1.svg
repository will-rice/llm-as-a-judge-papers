<span id="S4.SS1.p5.pic1.1" class="ltx_inline-block ltx_minipage ltx_align_bottom" style="width:44.91em;">
<span id="S4.SS1.p5.pic1.1.1" class="ltx_p"><span id="S4.SS1.p5.pic1.1.1.1" class="ltx_text ltx_font_bold" style="--ltx-fg-color:#000000;">Takeaway:<span id="S4.SS1.p5.pic1.1.1.1.1" class="ltx_text ltx_font_medium">
Conversational framing significantly alters a model’s initial accuracy. This impact is <em id="S4.SS1.p5.pic1.1.1.1.1.1" class="ltx_emph ltx_font_italic">asymmetric</em>. Some models become sycophantic, boosting accuracy on agreement tasks but harming it on disagreement, while others become overly-critical, penalizing even correct statements.</span></span></span>
</span></span></span></foreignobject></g></g></svg>