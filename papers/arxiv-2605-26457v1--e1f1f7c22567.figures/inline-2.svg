<span id="S2.F2.p1.pic1.1.1" class="ltx_p"><span id="S2.F2.p1.pic1.1.1.1" class="ltx_text ltx_font_bold" style="font-size:50%;--ltx-fg-color:#FFFFFF;">Informal problem description (<math id="S2.F2.p1.pic1.m1" class="ltx_Math" alttext="s_{I}" display="inline" intent=":literal"><semantics><msub><mi style="--ltx-fg-color:#FFFFFF;" mathcolor="#FFFFFF">s</mi><mi style="--ltx-fg-color:#FFFFFF;" mathcolor="#FFFFFF">I</mi></msub><annotation encoding="application/x-tex">s_{I}</annotation></semantics></math>) for the binary-search task</span></span>
</span></span></span></foreignobject></g><g fill-opacity="1.0" transform="matrix(1.0 0.0 0.0 1.0 10.16 6.7)"><foreignobject style="--ltx-fo-width:32.31em;--ltx-fo-height:48.23em;--ltx-fo-depth:0em;font-size:6.81pt;" height="454.21" overflow="visible" transform="matrix(1 0 0 -1 0 454.21)" width="304.27"><span class="ltx_foreignobject_container"><span class="ltx_foreignobject_content">
<span id="S2.F2.p1.pic1.2" class="ltx_inline-block ltx_minipage ltx_align_bottom" style="width:32.31em;">
<span id="S2.F2.p1.pic1.2.1" class="ltx_p"><span id="S2.F2.p1.pic1.2.1.1" class="ltx_text" style="font-size:50%;--ltx-fg-color:#000000;">You are given an integer array <span id="S2.F2.p1.pic1.2.1.1.1" class="ltx_text ltx_font_typewriter">arr</span> of length <span id="S2.F2.p1.pic1.2.1.1.2" class="ltx_text ltx_font_typewriter">n</span> and an integer
<span id="S2.F2.p1.pic1.2.1.1.3" class="ltx_text ltx_font_typewriter">k</span>. The array is sorted. Your task is to find the leftmost position at
which <span id="S2.F2.p1.pic1.2.1.1.4" class="ltx_text ltx_font_typewriter">k</span> occurs in the array. Positions are zero-indexed. If <span id="S2.F2.p1.pic1.2.1.1.5" class="ltx_text ltx_font_typewriter">k</span>
does not occur in the array, print <span id="S2.F2.p1.pic1.2.1.1.6" class="ltx_text ltx_font_typewriter">-1</span>.</span></span>
<span id="S2.F2.p1.pic1.2.2" class="ltx_p"><span id="S2.F2.p1.pic1.2.2.1" class="ltx_text ltx_font_bold" style="font-size:50%;--ltx-fg-color:#000000;">Input.<span id="S2.F2.p1.pic1.2.2.1.1" class="ltx_text ltx_font_medium">  The first line contains one integer <span id="S2.F2.p1.pic1.2.2.1.1.1" class="ltx_text ltx_font_typewriter">n</span> (<span id="S2.F2.p1.pic1.2.2.1.1.2" class="ltx_text ltx_font_typewriter">1 &lt;= n &lt;= 200000</span>).
The second line contains <span id="S2.F2.p1.pic1.2.2.1.1.3" class="ltx_text ltx_font_typewriter">n</span> integers
<span id="S2.F2.p1.pic1.2.2.1.1.4" class="ltx_text ltx_font_typewriter">arr_0, arr_1, ..., arr_{n-1}</span>; it is guaranteed that the array is
sorted. The third line contains <span id="S2.F2.p1.pic1.2.2.1.1.5" class="ltx_text ltx_font_typewriter">k</span>.</span></span></span>
<span id="S2.F2.p1.pic1.2.3" class="ltx_p"><span id="S2.F2.p1.pic1.2.3.1" class="ltx_text ltx_font_bold" style="font-size:50%;--ltx-fg-color:#000000;">Output.<span id="S2.F2.p1.pic1.2.3.1.1" class="ltx_text ltx_font_medium">  Print the smallest index where the array has element <span id="S2.F2.p1.pic1.2.3.1.1.1" class="ltx_text ltx_font_typewriter">k</span>, or <span id="S2.F2.p1.pic1.2.3.1.1.2" class="ltx_text ltx_font_typewriter">-1</span>
if no such index exists.</span></span></span>
</span></span></span></foreignobject></g></g></svg>