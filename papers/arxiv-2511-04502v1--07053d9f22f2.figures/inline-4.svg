<span id="S7.SS2.SSS3.p2.pic1.2" class="ltx_inline-block ltx_minipage ltx_align_bottom" style="width:33.91em;">
<span id="S7.SS2.SSS3.p2.pic1.2.1" class="ltx_p"><span id="S7.SS2.SSS3.p2.pic1.2.1.1" class="ltx_text" style="font-size:90%;--ltx-fg-color:#000000;">You will be given a context and a question.
<br class="ltx_break"></span></span>
<span id="S7.SS2.SSS3.p2.pic1.2.2" class="ltx_p"><span id="S7.SS2.SSS3.p2.pic1.2.2.1" class="ltx_text" style="font-size:90%;--ltx-fg-color:#000000;">Your task is to determine if the question is clearly and unambiguously answerable using only the given context.
- If the context contains **all** the necessary information to answer the question **without making assumptions** or using **any external knowledge**, then the groundedness is 1.
- Otherwise, if any key information is **missing**, ambiguous, or requires inference beyond what is stated, then the groundedness is 0.
<br class="ltx_break"></span></span>
<span id="S7.SS2.SSS3.p2.pic1.2.3" class="ltx_p"><span id="S7.SS2.SSS3.p2.pic1.2.3.1" class="ltx_text" style="font-size:90%;--ltx-fg-color:#000000;">You MUST provide values for ’answerability_flag:’ in your answer.
<br class="ltx_break"></span></span>
<span id="S7.SS2.SSS3.p2.pic1.2.4" class="ltx_p"><span id="S7.SS2.SSS3.p2.pic1.2.4.1" class="ltx_text" style="font-size:90%;--ltx-fg-color:#000000;">Use only the provided context. Do not use prior knowledge, common sense, or information not explicitly contained in the context.</span></span>
</span></span></span></foreignobject></g></g></svg>