</span>
<span id="A4.SS4.p7.pic1.p5" class="ltx_para">
<span id="A4.SS4.p7.pic1.p5.1" class="ltx_p"><span id="A4.SS4.p7.pic1.p5.1.1" class="ltx_text ltx_font_bold" style="--ltx-fg-color:#000000;">Summary A
<br class="ltx_break"><span id="A4.SS4.p7.pic1.p5.1.1.1" class="ltx_text ltx_font_medium">Been on dates with a guy that I really like and he doesn’t seem interested, am I overreacting or is he just being awkward?</span></span></span>
</span>
