<span id="S3.p2.pic1.1.1" class="ltx_p"><span id="S3.p2.pic1.1.1.1" class="ltx_text ltx_font_bold" style="--ltx-fg-color:#000000;">Finding 1: Attribute judgments often agree even when overall judgments differ.<span id="S3.p2.pic1.1.1.1.1" class="ltx_text ltx_font_medium">
