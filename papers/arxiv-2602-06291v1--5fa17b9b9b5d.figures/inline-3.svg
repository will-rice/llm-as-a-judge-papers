<svg id="A4.p4.pic1" class="ltx_picture" height="260.57" overflow="visible" version="1.1" viewbox="0 0 477.38 260.57" width="477.38"><g style="--ltx-stroke-color:#000000;--ltx-fill-color:#000000;" fill="#000000" stroke="#000000" stroke-width="0.4pt" transform="translate(0,260.57) matrix(1 0 0 -1 0 0)"><g style="--ltx-fill-color:#BFDFDF;" fill="#BFDFDF" fill-opacity="1.0"><path style="stroke:none" d="M 0 0 L 0 260.57 L 477.38 260.57 L 477.38 0 Z" /></g><g style="--ltx-fill-color:#F5FAFA;" fill="#F5FAFA" fill-opacity="1.0"><path style="stroke:none" d="M 0.83 0.83 L 0.83 237.2 L 476.55 237.2 L 476.55 0.83 Z" /></g><g fill-opacity="1.0" transform="matrix(1.0 0.0 0.0 1.0 9.49 245.43)"><foreignobject style="--ltx-fo-width:28.81em;--ltx-fo-height:0.75em;--ltx-fo-depth:0.25em;font-size:10pt;" height="13.84" overflow="visible" transform="matrix(1 0 0 -1 0 10.38)" width="398.65"><span class="ltx_foreignobject_container"><span class="ltx_foreignobject_content">
<span id="A4.p4.pic1.1" class="ltx_inline-block ltx_minipage ltx_align_bottom" style="width:28.81em;">
<span id="A4.p4.pic1.1.1" class="ltx_p"><span id="A4.p4.pic1.1.1.1" class="ltx_text ltx_font_bold" style="--ltx-fg-color:#000000;">Expert-Written: Auslander–Reiten Translate (Q&amp;A)</span></span>
</span></span></span></foreignobject></g><g fill-opacity="1.0" transform="matrix(1.0 0.0 0.0 1.0 9.49 12.16)"><foreignobject style="--ltx-fo-width:33.13em;--ltx-fo-height:15.69em;--ltx-fo-depth:0.25em;font-size:10pt;" height="220.63" overflow="visible" transform="matrix(1 0 0 -1 0 217.17)" width="458.43"><span class="ltx_foreignobject_container"><span class="ltx_foreignobject_content">
<span id="A4.p4.pic1.2" class="ltx_inline-block ltx_minipage ltx_align_bottom" style="width:33.13em;">
<span id="A4.p4.pic1.2.1" class="ltx_p"><span id="A4.p4.pic1.2.1.1" class="ltx_text ltx_font_bold" style="--ltx-fg-color:#000000;">Question.<span id="A4.p4.pic1.2.1.1.1" class="ltx_text ltx_font_medium"> 
<br class="ltx_break">Let <math id="A4.p4.pic1.m1" class="ltx_Math" alttext="G" display="inline" intent=":literal"><semantics><mi style="--ltx-fg-color:#000000;" mathcolor="#000000">G</mi><annotation encoding="application/x-tex">G</annotation></semantics></math> be the elementary abelian group of order <math id="A4.p4.pic1.m2" class="ltx_Math" alttext="9" display="inline" intent=":literal"><semantics><mn style="--ltx-fg-color:#000000;" mathcolor="#000000">9</mn><annotation encoding="application/x-tex">9</annotation></semantics></math> and <math id="A4.p4.pic1.m3" class="ltx_Math" alttext="K" display="inline" intent=":literal"><semantics><mi style="--ltx-fg-color:#000000;" mathcolor="#000000">K</mi><annotation encoding="application/x-tex">K</annotation></semantics></math> the field with <math id="A4.p4.pic1.m4" class="ltx_Math" alttext="3" display="inline" intent=":literal"><semantics><mn style="--ltx-fg-color:#000000;" mathcolor="#000000">3</mn><annotation encoding="application/x-tex">3</annotation></semantics></math> elements.
Let <math id="A4.p4.pic1.m5" class="ltx_Math" alttext="KG" display="inline" intent=":literal"><semantics><mrow><mi style="--ltx-fg-color:#000000;" mathcolor="#000000">K</mi><mo lspace="0em" rspace="0em">​</mo><mi style="--ltx-fg-color:#000000;" mathcolor="#000000">G</mi></mrow><annotation encoding="application/x-tex">KG</annotation></semantics></math> be the group algebra of <math id="A4.p4.pic1.m6" class="ltx_Math" alttext="G" display="inline" intent=":literal"><semantics><mi style="--ltx-fg-color:#000000;" mathcolor="#000000">G</mi><annotation encoding="application/x-tex">G</annotation></semantics></math> over <math id="A4.p4.pic1.m7" class="ltx_Math" alttext="K" display="inline" intent=":literal"><semantics><mi style="--ltx-fg-color:#000000;" mathcolor="#000000">K</mi><annotation encoding="application/x-tex">K</annotation></semantics></math>. Let <math id="A4.p4.pic1.m8" class="ltx_Math" alttext="S" display="inline" intent=":literal"><semantics><mi style="--ltx-fg-color:#000000;" mathcolor="#000000">S</mi><annotation encoding="application/x-tex">S</annotation></semantics></math> be the unique (up to isomorphism) simple <math id="A4.p4.pic1.m9" class="ltx_Math" alttext="KG" display="inline" intent=":literal"><semantics><mrow><mi style="--ltx-fg-color:#000000;" mathcolor="#000000">K</mi><mo lspace="0em" rspace="0em">​</mo><mi style="--ltx-fg-color:#000000;" mathcolor="#000000">G</mi></mrow><annotation encoding="application/x-tex">KG</annotation></semantics></math>-module.
What is the vector space dimension of <math id="A4.p4.pic1.m10" class="ltx_Math" alttext="\tau^{4}(S)" display="inline" intent=":literal"><semantics><mrow><msup><mi style="--ltx-fg-color:#000000;" mathcolor="#000000">τ</mi><mn style="--ltx-fg-color:#000000;" mathcolor="#000000">4</mn></msup><mo lspace="0em" rspace="0em">​</mo><mrow><mo style="--ltx-fg-color:#000000;" mathcolor="#000000" stretchy="false">(</mo><mi style="--ltx-fg-color:#000000;" mathcolor="#000000">S</mi><mo style="--ltx-fg-color:#000000;" mathcolor="#000000" stretchy="false">)</mo></mrow></mrow><annotation encoding="application/x-tex">\tau^{4}(S)</annotation></semantics></math>, the Auslander–Reiten translate applied four times to <math id="A4.p4.pic1.m11" class="ltx_Math" alttext="S" display="inline" intent=":literal"><semantics><mi style="--ltx-fg-color:#000000;" mathcolor="#000000">S</mi><annotation encoding="application/x-tex">S</annotation></semantics></math>?</span></span></span>
<span id="A4.p4.pic1.2.2" class="ltx_p"><span id="A4.p4.pic1.2.2.1" class="ltx_text ltx_font_bold" style="--ltx-fg-color:#000000;">Solution.<span id="A4.p4.pic1.2.2.1.1" class="ltx_text ltx_font_medium"> 
<br class="ltx_break"><math id="A4.p4.pic1.m12" class="ltx_Math" alttext="KG" display="inline" intent=":literal"><semantics><mrow><mi style="--ltx-fg-color:#000000;" mathcolor="#000000">K</mi><mo lspace="0em" rspace="0em">​</mo><mi style="--ltx-fg-color:#000000;" mathcolor="#000000">G</mi></mrow><annotation encoding="application/x-tex">KG</annotation></semantics></math> is isomorphic as a <math id="A4.p4.pic1.m13" class="ltx_Math" alttext="K" display="inline" intent=":literal"><semantics><mi style="--ltx-fg-color:#000000;" mathcolor="#000000">K</mi><annotation encoding="application/x-tex">K</annotation></semantics></math>-algebra to <math id="A4.p4.pic1.m14" class="ltx_Math" alttext="K[x,y]/(x^{3},y^{3})" display="inline" intent=":literal"><semantics><mrow><mrow><mi style="--ltx-fg-color:#000000;" mathcolor="#000000">K</mi><mo>⁡</mo><mrow><mo style="--ltx-fg-color:#000000;" mathcolor="#000000" stretchy="false">[</mo><mrow><mi style="--ltx-fg-color:#000000;" mathcolor="#000000">x</mi><mo style="--ltx-fg-color:#000000;" mathcolor="#000000">,</mo><mi style="--ltx-fg-color:#000000;" mathcolor="#000000">y</mi></mrow><mo style="--ltx-fg-color:#000000;" mathcolor="#000000" stretchy="false">]</mo></mrow></mrow><mo style="--ltx-fg-color:#000000;" mathcolor="#000000">/</mo><mrow><mo style="--ltx-fg-color:#000000;" mathcolor="#000000" stretchy="false">(</mo><msup><mi style="--ltx-fg-color:#000000;" mathcolor="#000000">x</mi><mn style="--ltx-fg-color:#000000;" mathcolor="#000000">3</mn></msup><mo style="--ltx-fg-color:#000000;" mathcolor="#000000">,</mo><msup><mi style="--ltx-fg-color:#000000;" mathcolor="#000000">y</mi><mn style="--ltx-fg-color:#000000;" mathcolor="#000000">3</mn></msup><mo style="--ltx-fg-color:#000000;" mathcolor="#000000" stretchy="false">)</mo></mrow></mrow><annotation encoding="application/x-tex">K[x,y]/(x^{3},y^{3})</annotation></semantics></math> since <math id="A4.p4.pic1.m15" class="ltx_Math" alttext="K" display="inline" intent=":literal"><semantics><mi style="--ltx-fg-color:#000000;" mathcolor="#000000">K</mi><annotation encoding="application/x-tex">K</annotation></semantics></math> has characteristic <math id="A4.p4.pic1.m16" class="ltx_Math" alttext="3" display="inline" intent=":literal"><semantics><mn style="--ltx-fg-color:#000000;" mathcolor="#000000">3</mn><annotation encoding="application/x-tex">3</annotation></semantics></math>.
Now <math id="A4.p4.pic1.m17" class="ltx_Math" alttext="KG" display="inline" intent=":literal"><semantics><mrow><mi style="--ltx-fg-color:#000000;" mathcolor="#000000">K</mi><mo lspace="0em" rspace="0em">​</mo><mi style="--ltx-fg-color:#000000;" mathcolor="#000000">G</mi></mrow><annotation encoding="application/x-tex">KG</annotation></semantics></math> is a symmetric Frobenius algebra and thus the Auslander–Reiten translate <math id="A4.p4.pic1.m18" class="ltx_Math" alttext="\tau" display="inline" intent=":literal"><semantics><mi style="--ltx-fg-color:#000000;" mathcolor="#000000">τ</mi><annotation encoding="application/x-tex">\tau</annotation></semantics></math> is isomorphic to
<math id="A4.p4.pic1.m19" class="ltx_Math" alttext="\Omega^{2}" display="inline" intent=":literal"><semantics><msup><mi style="--ltx-fg-color:#000000;" mathcolor="#000000" mathvariant="normal">Ω</mi><mn style="--ltx-fg-color:#000000;" mathcolor="#000000">2</mn></msup><annotation encoding="application/x-tex">\Omega^{2}</annotation></semantics></math>, the second syzygy functor, in the stable module category. Thus one has to calculate the eighth
syzygy module of <math id="A4.p4.pic1.m20" class="ltx_Math" alttext="S" display="inline" intent=":literal"><semantics><mi style="--ltx-fg-color:#000000;" mathcolor="#000000">S</mi><annotation encoding="application/x-tex">S</annotation></semantics></math>, which is reduced to standard commutative algebra/linear algebra.</span></span></span>
</span></span></span></foreignobject></g></g></svg>