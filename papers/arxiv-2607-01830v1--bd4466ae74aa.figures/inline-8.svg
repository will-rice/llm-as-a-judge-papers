<span id="A4.F14.pic1.1.1" class="ltx_p"><span id="A4.F14.pic1.1.1.1" class="ltx_text ltx_font_bold" style="--ltx-fg-color:#FFFFFF;">Rubric Consolidation Prompt.</span></span>
</span></span></span></foreignobject></g><g fill-opacity="1.0" transform="matrix(1.0 0.0 0.0 1.0 13.07 15.84)"><foreignobject style="--ltx-fo-width:43.15em;--ltx-fo-height:29.55em;--ltx-fo-depth:0.2em;font-size:10pt;" height="411.66" overflow="visible" transform="matrix(1 0 0 -1 0 408.89)" width="597.07"><span class="ltx_foreignobject_container"><span class="ltx_foreignobject_content">
<span id="A4.F14.pic1.2" class="ltx_inline-block ltx_minipage ltx_align_bottom" style="width:43.15em;">
<span id="A4.F14.pic1.2.1" class="ltx_p"><span id="A4.F14.pic1.2.1.1" class="ltx_text ltx_verbatim ltx_font_typewriter ltx_inline-block" style="width:453.1pt;--ltx-fg-color:#000000;"><span id="A4.F14.pic1.2.1.1.1" class="ltx_text ltx_inline-block" style="width:0.0pt;"> </span><span id="A4.F14.pic1.2.1.1.2" class="ltx_text ltx_inline-block" style="width:0.0pt;"> </span><span id="A4.F14.pic1.2.1.1.3" class="ltx_text ltx_inline-block" style="width:21.0pt;"> </span><span id="A4.F14.pic1.2.1.1.4" class="ltx_inline-logical-block ltx_parbox ltx_align_top" style="width:432.1pt;">
<span id="A4.F14.pic1.p1" class="ltx_para ltx_noindent">
<span id="A4.F14.pic1.p1.1" class="ltx_p">You are a rubric consolidation expert. You are given {num_sets} sets of evaluation rubrics, all generated for the SAME user query and sample response, but from DIFFERENT evaluation perspectives.</span>
</span></span></span></span>
<span id="A4.F14.pic1.2.2" class="ltx_p" style="width:453.1pt;"><span id="A4.F14.pic1.2.2.1" class="ltx_text ltx_verbatim ltx_font_typewriter ltx_inline-block" style="width:453.1pt;--ltx-fg-color:#000000;"><span id="A4.F14.pic1.2.2.1.1" class="ltx_inline-logical-block ltx_parbox ltx_pruned_first ltx_align_top" style="width:453.1pt;"></span></span></span>
<span id="A4.F14.pic1.2.3" class="ltx_p" style="width:453.1pt;"><span id="A4.F14.pic1.2.3.1" class="ltx_text ltx_verbatim ltx_font_typewriter ltx_inline-block" style="width:453.1pt;--ltx-fg-color:#000000;"><span id="A4.F14.pic1.2.3.1.1" class="ltx_text ltx_inline-block" style="width:0.0pt;"> </span><span id="A4.F14.pic1.2.3.1.2" class="ltx_text ltx_inline-block" style="width:0.0pt;"> </span><span id="A4.F14.pic1.2.3.1.3" class="ltx_text ltx_inline-block" style="width:21.0pt;"> </span><span id="A4.F14.pic1.2.3.1.4" class="ltx_inline-logical-block ltx_parbox ltx_align_top" style="width:432.1pt;">
<span id="A4.F14.pic1.p3" class="ltx_para ltx_noindent">
<span id="A4.F14.pic1.p3.1" class="ltx_p">Your task: merge them into ONE unified, non-redundant rubric set following these strict rules:</span>
</span></span></span></span>
<span id="A4.F14.pic1.2.4" class="ltx_p" style="width:453.1pt;"><span id="A4.F14.pic1.2.4.1" class="ltx_text ltx_verbatim ltx_font_typewriter ltx_inline-block" style="width:453.1pt;--ltx-fg-color:#000000;"><span id="A4.F14.pic1.2.4.1.1" class="ltx_inline-logical-block ltx_parbox ltx_pruned_first ltx_align_top" style="width:453.1pt;"></span></span></span>
<span id="A4.F14.pic1.2.5" class="ltx_p" style="width:453.1pt;"><span id="A4.F14.pic1.2.5.1" class="ltx_text ltx_verbatim ltx_font_typewriter ltx_inline-block" style="width:453.1pt;--ltx-fg-color:#000000;"><span id="A4.F14.pic1.2.5.1.1" class="ltx_inline-logical-block ltx_parbox ltx_align_top" style="width:453.1pt;">
<span id="A4.F14.pic1.p5" class="ltx_para ltx_noindent">
<span id="A4.F14.pic1.p5.1" class="ltx_p">**Merge Rules:**</span>
</span></span></span></span>
<span id="A4.F14.pic1.2.6" class="ltx_p" style="width:453.1pt;"><span id="A4.F14.pic1.2.6.1" class="ltx_text ltx_verbatim ltx_font_typewriter ltx_inline-block" style="width:453.1pt;--ltx-fg-color:#000000;"><span id="A4.F14.pic1.2.6.1.1" class="ltx_text ltx_inline-block" style="width:0.0pt;"> </span><span id="A4.F14.pic1.2.6.1.2" class="ltx_text ltx_inline-block" style="width:0.0pt;"> </span><span id="A4.F14.pic1.2.6.1.3" class="ltx_text ltx_inline-block" style="width:21.0pt;"> </span><span id="A4.F14.pic1.2.6.1.4" class="ltx_inline-logical-block ltx_parbox ltx_align_top" style="width:432.1pt;">
<span id="A4.F14.pic1.p6" class="ltx_para ltx_noindent">
<span id="A4.F14.pic1.p6.1" class="ltx_p">1. **Deduplication**: If two or more criteria describe the SAME thing (even with different wording), keep only ONE version — choose the most precise and clearly worded one. Assign the highest weight among the duplicates.</span>
</span></span></span></span>
<span id="A4.F14.pic1.2.7" class="ltx_p" style="width:453.1pt;"><span id="A4.F14.pic1.2.7.1" class="ltx_text ltx_verbatim ltx_font_typewriter ltx_inline-block" style="width:453.1pt;--ltx-fg-color:#000000;"><span id="A4.F14.pic1.2.7.1.1" class="ltx_text ltx_inline-block" style="width:0.0pt;"> </span><span id="A4.F14.pic1.2.7.1.2" class="ltx_text ltx_inline-block" style="width:0.0pt;"> </span><span id="A4.F14.pic1.2.7.1.3" class="ltx_text ltx_inline-block" style="width:21.0pt;"> </span><span id="A4.F14.pic1.2.7.1.4" class="ltx_inline-logical-block ltx_parbox ltx_align_top" style="width:432.1pt;">
<span id="A4.F14.pic1.p7" class="ltx_para ltx_noindent">
<span id="A4.F14.pic1.p7.1" class="ltx_p">2. **Contradiction removal**: If two criteria directly CONTRADICT each other (e.g., one says &quot;the response MUST include X&quot; and another says &quot;the response should NOT include X&quot;), remove BOTH. They indicate perspective-specific artifacts, not universal quality criteria.</span>
</span></span></span></span>
<span id="A4.F14.pic1.2.8" class="ltx_p" style="width:453.1pt;"><span id="A4.F14.pic1.2.8.1" class="ltx_text ltx_verbatim ltx_font_typewriter ltx_inline-block" style="width:453.1pt;--ltx-fg-color:#000000;"><span id="A4.F14.pic1.2.8.1.1" class="ltx_text ltx_inline-block" style="width:0.0pt;"> </span><span id="A4.F14.pic1.2.8.1.2" class="ltx_text ltx_inline-block" style="width:0.0pt;"> </span><span id="A4.F14.pic1.2.8.1.3" class="ltx_text ltx_inline-block" style="width:21.0pt;"> </span><span id="A4.F14.pic1.2.8.1.4" class="ltx_inline-logical-block ltx_parbox ltx_align_top" style="width:432.1pt;">
<span id="A4.F14.pic1.p8" class="ltx_para ltx_noindent">
<span id="A4.F14.pic1.p8.1" class="ltx_p">3. **Keep the rest**: All remaining non-duplicate, non-contradictory criteria should be included in the final merged set.</span>
</span></span></span></span>
<span id="A4.F14.pic1.2.9" class="ltx_p" style="width:453.1pt;"><span id="A4.F14.pic1.2.9.1" class="ltx_text ltx_verbatim ltx_font_typewriter ltx_inline-block" style="width:453.1pt;--ltx-fg-color:#000000;"><span id="A4.F14.pic1.2.9.1.1" class="ltx_inline-logical-block ltx_parbox ltx_pruned_first ltx_align_top" style="width:453.1pt;"></span></span></span>
<span id="A4.F14.pic1.2.10" class="ltx_p" style="width:453.1pt;"><span id="A4.F14.pic1.2.10.1" class="ltx_text ltx_verbatim ltx_font_typewriter ltx_inline-block" style="width:453.1pt;--ltx-fg-color:#000000;"><span id="A4.F14.pic1.2.10.1.1" class="ltx_inline-logical-block ltx_parbox ltx_pruned_first ltx_align_top" style="width:453.1pt;"></span></span></span>
<span id="A4.F14.pic1.2.11" class="ltx_p" style="width:453.1pt;"><span id="A4.F14.pic1.2.11.1" class="ltx_text ltx_verbatim ltx_font_typewriter ltx_inline-block" style="width:453.1pt;--ltx-fg-color:#000000;"><span id="A4.F14.pic1.2.11.1.1" class="ltx_inline-logical-block ltx_parbox ltx_align_top" style="width:453.1pt;">
<span id="A4.F14.pic1.p11" class="ltx_para ltx_noindent">
<span id="A4.F14.pic1.p11.1" class="ltx_p">---</span>
</span></span></span></span>
<span id="A4.F14.pic1.2.12" class="ltx_p" style="width:453.1pt;"><span id="A4.F14.pic1.2.12.1" class="ltx_text ltx_verbatim ltx_font_typewriter ltx_inline-block" style="width:453.1pt;--ltx-fg-color:#000000;"><span id="A4.F14.pic1.2.12.1.1" class="ltx_inline-logical-block ltx_parbox ltx_align_top" style="width:453.1pt;">
<span id="A4.F14.pic1.p12" class="ltx_para ltx_noindent">
<span id="A4.F14.pic1.p12.1" class="ltx_p">**USER QUERY:**</span>
</span></span></span></span>
<span id="A4.F14.pic1.2.13" class="ltx_p" style="width:453.1pt;"><span id="A4.F14.pic1.2.13.1" class="ltx_text ltx_verbatim ltx_font_typewriter ltx_inline-block" style="width:453.1pt;--ltx-fg-color:#000000;"><span id="A4.F14.pic1.2.13.1.1" class="ltx_inline-logical-block ltx_parbox ltx_align_top" style="width:453.1pt;">
<span id="A4.F14.pic1.p13" class="ltx_para ltx_noindent">
<span id="A4.F14.pic1.p13.1" class="ltx_p">{query}</span>
</span></span></span></span>
<span id="A4.F14.pic1.2.14" class="ltx_p" style="width:453.1pt;"><span id="A4.F14.pic1.2.14.1" class="ltx_text ltx_verbatim ltx_font_typewriter ltx_inline-block" style="width:453.1pt;--ltx-fg-color:#000000;"><span id="A4.F14.pic1.2.14.1.1" class="ltx_inline-logical-block ltx_parbox ltx_pruned_first ltx_align_top" style="width:453.1pt;"></span></span></span>
<span id="A4.F14.pic1.2.15" class="ltx_p" style="width:453.1pt;"><span id="A4.F14.pic1.2.15.1" class="ltx_text ltx_verbatim ltx_font_typewriter ltx_inline-block" style="width:453.1pt;--ltx-fg-color:#000000;"><span id="A4.F14.pic1.2.15.1.1" class="ltx_inline-logical-block ltx_parbox ltx_align_top" style="width:453.1pt;">
<span id="A4.F14.pic1.p15" class="ltx_para ltx_noindent">
<span id="A4.F14.pic1.p15.1" class="ltx_p">{rubric_sets}</span>
</span></span></span></span>
<span id="A4.F14.pic1.2.16" class="ltx_p" style="width:453.1pt;"><span id="A4.F14.pic1.2.16.1" class="ltx_text ltx_verbatim ltx_font_typewriter ltx_inline-block" style="width:453.1pt;--ltx-fg-color:#000000;"><span id="A4.F14.pic1.2.16.1.1" class="ltx_inline-logical-block ltx_parbox ltx_pruned_first ltx_align_top" style="width:453.1pt;"></span></span></span>
<span id="A4.F14.pic1.2.17" class="ltx_p" style="width:453.1pt;"><span id="A4.F14.pic1.2.17.1" class="ltx_text ltx_verbatim ltx_font_typewriter ltx_inline-block" style="width:453.1pt;--ltx-fg-color:#000000;"><span id="A4.F14.pic1.2.17.1.1" class="ltx_inline-logical-block ltx_parbox ltx_align_top" style="width:453.1pt;">
<span id="A4.F14.pic1.p17" class="ltx_para ltx_noindent">
<span id="A4.F14.pic1.p17.1" class="ltx_p">---</span>
</span></span></span></span>
<span id="A4.F14.pic1.2.18" class="ltx_p" style="width:453.1pt;"><span id="A4.F14.pic1.2.18.1" class="ltx_text ltx_verbatim ltx_font_typewriter ltx_inline-block" style="width:453.1pt;--ltx-fg-color:#000000;"><span id="A4.F14.pic1.2.18.1.1" class="ltx_inline-logical-block ltx_parbox ltx_align_top" style="width:453.1pt;">
<span id="A4.F14.pic1.p18" class="ltx_para ltx_noindent">
<span id="A4.F14.pic1.p18.1" class="ltx_p">**OUTPUT:** Return ONLY a valid JSON array. No explanatory text before or after.</span>
</span></span></span></span>
<span id="A4.F14.pic1.2.19" class="ltx_p" style="width:453.1pt;"><span id="A4.F14.pic1.2.19.1" class="ltx_text ltx_verbatim ltx_font_typewriter ltx_inline-block" style="width:453.1pt;--ltx-fg-color:#000000;"><span id="A4.F14.pic1.2.19.1.1" class="ltx_inline-logical-block ltx_parbox ltx_align_top" style="width:453.1pt;">
<span id="A4.F14.pic1.p19" class="ltx_para ltx_noindent">
<span id="A4.F14.pic1.p19.1" class="ltx_p">Each element: {{&quot;criterion&quot;: &quot;Does the response ...?&quot;, &quot;weight&quot;: 1-3}}.</span>
</span></span></span></span>
<span id="A4.F14.pic1.2.20" class="ltx_p" style="width:453.1pt;"><span id="A4.F14.pic1.2.20.1" class="ltx_text ltx_verbatim ltx_font_typewriter ltx_inline-block" style="width:453.1pt;--ltx-fg-color:#000000;"><span id="A4.F14.pic1.2.20.1.1" class="ltx_inline-logical-block ltx_parbox ltx_align_top" style="width:453.1pt;">
<span id="A4.F14.pic1.p20" class="ltx_para ltx_noindent">
<span id="A4.F14.pic1.p20.1" class="ltx_p">Target: NO MORE THAN 20 criteria after merging.</span>
</span></span></span></span>
<span id="A4.F14.pic1.2.21" class="ltx_p" style="width:453.1pt;"><span id="A4.F14.pic1.2.21.1" class="ltx_text ltx_verbatim ltx_font_typewriter ltx_inline-block" style="width:453.1pt;--ltx-fg-color:#000000;"><span id="A4.F14.pic1.2.21.1.1" class="ltx_inline-logical-block ltx_parbox ltx_pruned_first ltx_align_top" style="width:453.1pt;"></span></span></span>
