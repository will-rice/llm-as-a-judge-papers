</span></span></span></foreignobject></g><g fill-opacity="1.0" transform="matrix(1.0 0.0 0.0 1.0 21.65 57.98)"><foreignobject style="--ltx-fo-width:31.37em;--ltx-fo-height:23.78em;--ltx-fo-depth:3.19em;font-size:10pt;" height="373.22" overflow="visible" transform="matrix(1 0 0 -1 0 329.02)" width="434.07"><span class="ltx_foreignobject_container"><span class="ltx_foreignobject_content">
<span id="A1.SSx1.p1.pic1.2" class="ltx_inline-block ltx_minipage ltx_align_bottom" style="width:31.37em;">
<span id="A1.SSx1.p1.pic1.2.1" class="ltx_p"><span id="A1.SSx1.p1.pic1.2.1.1" class="ltx_text" style="--ltx-fg-color:#000000;">You are a behavioral research scientist whose job is to review outputs for thematic alignment. You will skillfully review, analyze, and determine whether or not the content in the &lt;theme&gt;&lt;/theme&gt;, &lt;description&gt;&lt;/description&gt;, and &lt;quote&gt;&lt;/quote&gt; are aligned in meaning or not using this scale:1 (not aligned), 2 (somewhat aligned), or 3 (completely aligned).</span></span>
<span id="A1.SSx1.p1.pic1.2.2" class="ltx_p"><span id="A1.SSx1.p1.pic1.2.2.1" class="ltx_text" style="--ltx-fg-color:#000000;">Follow these steps in order and do NOT to miss theme2 and theme3:</span></span>
<span id="A1.I1" class="ltx_enumerate">
<span id="A1.I1.i1" class="ltx_item" style="list-style-type:none;"><span class="ltx_tag ltx_tag_item">(1)</span> 
<span id="A1.I1.i1.p1" class="ltx_para">
<span id="A1.I1.i1.p1.1" class="ltx_p"><span id="A1.I1.i1.p1.1.1" class="ltx_text" style="--ltx-fg-color:#000000;">Review the information in each theme: &lt;theme1&gt;&lt;/theme1&gt;, &lt;theme2&gt;&lt;/theme2&gt;, &lt;theme3&gt;&lt;/theme3&gt;</span></span>
</span></span>
<span id="A1.I1.i2" class="ltx_item" style="list-style-type:none;"><span class="ltx_tag ltx_tag_item">(2)</span> 
<span id="A1.I1.i2.p1" class="ltx_para">
<span id="A1.I1.i2.p1.1" class="ltx_p"><span id="A1.I1.i2.p1.1.1" class="ltx_text" style="--ltx-fg-color:#000000;">Check for alignment between the meaning within each of the themes: &lt;theme1&gt;&lt;/theme1&gt;, &lt;theme2&gt;&lt;/theme2&gt;, and &lt;them3&gt;&lt;/theme3&gt;.</span></span>
</span></span>
<span id="A1.I1.i3" class="ltx_item" style="list-style-type:none;"><span class="ltx_tag ltx_tag_item">(3)</span> 
<span id="A1.I1.i3.p1" class="ltx_para">
<span id="A1.I1.i3.p1.1" class="ltx_p"><span id="A1.I1.i3.p1.1.1" class="ltx_text" style="--ltx-fg-color:#000000;">Based on each theme reviewed in step 1,2,and 3 assign an alignment rating score for each theme based on the following scale: 1 (not aligned), 2 (somewhat aligned), or 3 (completely aligned).</span></span>
</span></span>
</span>
<span id="A1.SSx1.p1.pic1.2.3" class="ltx_p"><span id="A1.SSx1.p1.pic1.2.3.1" class="ltx_text ltx_font_bold" style="--ltx-fg-color:#000000;">Assistant:<span id="A1.SSx1.p1.pic1.2.3.1.1" class="ltx_text"></span></span></span>
<span id="A1.I2" class="ltx_itemize">
<span id="A1.I2.i1" class="ltx_item" style="list-style-type:none;"><span class="ltx_tag ltx_tag_item">•</span> 
<span id="A1.I2.i1.p1" class="ltx_para">
<span id="A1.I2.i1.p1.1" class="ltx_p"><span id="A1.I2.i1.p1.1.1" class="ltx_text" style="--ltx-fg-color:#000000;">Rating score for each theme</span></span>
</span></span>
