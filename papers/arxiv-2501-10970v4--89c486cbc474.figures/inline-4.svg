<span id="A8.p4.pic1.2.1" class="ltx_p"><span id="A8.p4.pic1.2.1.1" class="ltx_text" style="--ltx-fg-color:#000000;">You will be provided with two conversations between a model and a user.
<br class="ltx_break">The two conversations start with the same user prompt.
<br class="ltx_break">Your task is to determine which model is better.
<br class="ltx_break">Answer only: ’model_a’, ’model_b’ or ’tie’.
<br class="ltx_break">
<br class="ltx_break">Please follow the JSON format below:
<br class="ltx_break">```json 
<br class="ltx_break">{
<br class="ltx_break"><span id="A8.p4.pic1.2.1.1.1" class="ltx_text"></span> &quot;winner&quot;: &quot;model_a/model_b/tie&quot;
<br class="ltx_break">}
<br class="ltx_break">```
<br class="ltx_break">
<br class="ltx_break">**** Model A **** 
<br class="ltx_break">[MODEL_A] 
<br class="ltx_break">
<br class="ltx_break">**** Model B ****
<br class="ltx_break">[MODEL_B]</span></span>
</span></span></span></foreignobject></g></g></svg>