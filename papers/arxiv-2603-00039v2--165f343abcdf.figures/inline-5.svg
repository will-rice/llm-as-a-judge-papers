</span></span></span></foreignobject></g><g fill-opacity="1.0" transform="matrix(1.0 0.0 0.0 1.0 12.79 16.25)"><foreignobject style="--ltx-fo-width:31.1em;--ltx-fo-height:25.87em;--ltx-fo-depth:0.25em;font-size:10pt;" height="361.46" overflow="visible" transform="matrix(1 0 0 -1 0 358)" width="430.34"><span class="ltx_foreignobject_container"><span class="ltx_foreignobject_content">
<span id="A5.SS5.p6.pic1.2" class="ltx_inline-block ltx_minipage ltx_align_bottom" style="width:31.1em;">
<span id="A5.SS5.p6.pic1.2.1" class="ltx_p"><span id="A5.SS5.p6.pic1.2.1.1" class="ltx_text" style="--ltx-fg-color:#000000;">You are evaluating the <span id="A5.SS5.p6.pic1.2.1.1.1" class="ltx_text ltx_font_bold">overall sentiment</span> of a Yelp restaurant review.
Read the entire review, consider the reviewer’s tone, described experiences, and final impression, then assign a single star rating from 1 to 5 according to this rubric:</span></span>
<span id="A5.I8" class="ltx_itemize ltx_leftmargin_flush">
<span id="A5.I8.i1" class="ltx_item" style="list-style-type:none;"><span class="ltx_tag ltx_tag_item">•</span> 
<span id="A5.I8.i1.p1" class="ltx_para">
<span id="A5.I8.i1.p1.1" class="ltx_p"><span id="A5.I8.i1.p1.1.1" class="ltx_text" style="--ltx-fg-color:#000000;">1 – Strongly negative; serious problems or clear dissatisfaction.</span></span>
</span></span>
<span id="A5.I8.i2" class="ltx_item" style="list-style-type:none;"><span class="ltx_tag ltx_tag_item">•</span> 
<span id="A5.I8.i2.p1" class="ltx_para">
<span id="A5.I8.i2.p1.1" class="ltx_p"><span id="A5.I8.i2.p1.1.1" class="ltx_text" style="--ltx-fg-color:#000000;">2 – Mostly negative; several complaints outweigh positives.</span></span>
</span></span>
<span id="A5.I8.i3" class="ltx_item" style="list-style-type:none;"><span class="ltx_tag ltx_tag_item">•</span> 
<span id="A5.I8.i3.p1" class="ltx_para">
<span id="A5.I8.i3.p1.1" class="ltx_p"><span id="A5.I8.i3.p1.1.1" class="ltx_text" style="--ltx-fg-color:#000000;">3 – Mixed or neutral; balanced feedback with no strong lean.</span></span>
</span></span>
<span id="A5.I8.i4" class="ltx_item" style="list-style-type:none;"><span class="ltx_tag ltx_tag_item">•</span> 
<span id="A5.I8.i4.p1" class="ltx_para">
<span id="A5.I8.i4.p1.1" class="ltx_p"><span id="A5.I8.i4.p1.1.1" class="ltx_text" style="--ltx-fg-color:#000000;">4 – Mostly positive; satisfied with only minor issues.</span></span>
</span></span>
<span id="A5.I8.i5" class="ltx_item" style="list-style-type:none;"><span class="ltx_tag ltx_tag_item">•</span> 
<span id="A5.I8.i5.p1" class="ltx_para">
<span id="A5.I8.i5.p1.1" class="ltx_p"><span id="A5.I8.i5.p1.1.1" class="ltx_text" style="--ltx-fg-color:#000000;">5 – Highly positive; enthusiastic praise and strong recommendation.</span></span>
</span></span>
</span>
<span id="A5.SS5.p6.pic1.2.2" class="ltx_p"><span id="A5.SS5.p6.pic1.2.2.1" class="ltx_text" style="--ltx-fg-color:#000000;">Base the rating on the <span id="A5.SS5.p6.pic1.2.2.1.1" class="ltx_text ltx_font_bold">reviewer’s intent</span>, not your personal opinion, and ignore formatting quirks.</span></span>
<span id="A5.SS5.p6.pic1.2.3" class="ltx_p"><span id="A5.SS5.p6.pic1.2.3.1" class="ltx_text" style="--ltx-fg-color:#000000;">Respond exactly in this format:</span></span><pre id="A5.SS5.p6.pic1.2.4" class="ltx_verbatim ltx_font_typewriter" style="--ltx-fg-color:#000000;">
Feedback:::
Total rating: X
</pre>
<span id="A5.SS5.p6.pic1.2.5" class="ltx_p"><span id="A5.SS5.p6.pic1.2.5.1" class="ltx_text" style="--ltx-fg-color:#000000;">Where <span id="A5.SS5.p6.pic1.2.5.1.1" class="ltx_text ltx_font_typewriter">X</span> is an integer from 1 to 5 and nothing else.</span></span>
<span id="A5.SS5.p6.pic1.2.6" class="ltx_p"><span id="A5.SS5.p6.pic1.2.6.1" class="ltx_text ltx_font_bold" style="--ltx-fg-color:#000000;">Input:<span id="A5.SS5.p6.pic1.2.6.1.1" class="ltx_text"></span></span></span><pre id="A5.SS5.p6.pic1.2.7" class="ltx_verbatim ltx_font_typewriter" style="--ltx-fg-color:#000000;">
Review:
{text}

Feedback:::
Total rating:
</pre>
</span></span></span></foreignobject></g></g></svg>