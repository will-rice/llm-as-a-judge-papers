<span id="A1.p9.pic1.1.1" class="ltx_p"><span id="A1.p9.pic1.1.1.1" class="ltx_text" style="--ltx-fg-color:#FFFFFF;">Prompts Used for NLI Tasks</span></span>
</span></span></span></foreignobject></g><g fill-opacity="1.0" transform="matrix(1.0 0.0 0.0 1.0 21.65 16.47)"><foreignobject style="--ltx-fo-width:31.37em;--ltx-fo-height:21.09em;--ltx-fo-depth:0.19em;font-size:10pt;" height="294.58" overflow="visible" transform="matrix(1 0 0 -1 0 291.89)" width="434.07"><span class="ltx_foreignobject_container"><span class="ltx_foreignobject_content">
<span id="A1.p9.pic1.2" class="ltx_inline-block ltx_minipage ltx_align_bottom" style="width:31.37em;">
<span id="A1.p9.pic1.2.1" class="ltx_p"><span id="A1.p9.pic1.2.1.1" class="ltx_text" style="--ltx-fg-color:#000000;">You will be given a premise and a hypothesis. Your task is to determine whether the hypothesis logically follows from the premise. Choose only one of the following labels and output your answer with ONLY the label (one word), ensuring there are no spaces or other characters in the answer.
<br class="ltx_break"></span></span>
<span id="A1.p9.pic1.2.2" class="ltx_p"><span id="A1.p9.pic1.2.2.1" class="ltx_text" style="--ltx-fg-color:#000000;">Possible labels:
<br class="ltx_break"></span></span>
<span id="A1.p9.pic1.2.3" class="ltx_p"><span id="A1.p9.pic1.2.3.1" class="ltx_text" style="--ltx-fg-color:#000000;">entailment: The hypothesis follows logically from the information contained in the premise.
<br class="ltx_break">neutral: It is not possible to determine whether the hypothesis is true or false without further information.
<br class="ltx_break">contradiction: The hypothesis is logically false from the information contained in the premise.
<br class="ltx_break"></span></span>
<span id="A1.p9.pic1.2.4" class="ltx_p"><span id="A1.p9.pic1.2.4.1" class="ltx_text" style="--ltx-fg-color:#000000;">Read the following premise and hypothesis thoroughly and select the correct answer from the three answer labels. 
<br class="ltx_break"></span></span>
<span id="A1.p9.pic1.2.5" class="ltx_p"><span id="A1.p9.pic1.2.5.1" class="ltx_text" style="--ltx-fg-color:#000000;">Premise:
{premise}
<br class="ltx_break"></span></span>
<span id="A1.p9.pic1.2.6" class="ltx_p"><span id="A1.p9.pic1.2.6.1" class="ltx_text" style="--ltx-fg-color:#000000;">Hypothesis:
{hypothesis}
<br class="ltx_break"></span></span>
<span id="A1.p9.pic1.2.7" class="ltx_p"><span id="A1.p9.pic1.2.7.1" class="ltx_text" style="--ltx-fg-color:#000000;">Make a selection from &quot;entailment&quot;, &quot;neutral&quot;, &quot;contradiction&quot;. Only write the answer with a single word, do not write reasons.</span></span>
</span></span></span></foreignobject></g></g></svg>