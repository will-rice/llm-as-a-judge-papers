<span id="A1.SSx2.p1.pic1.2" class="ltx_inline-block ltx_minipage ltx_align_bottom" style="width:31.37em;">
<span id="A1.SSx2.p1.pic1.2.1" class="ltx_p"><span id="A1.SSx2.p1.pic1.2.1.1" class="ltx_text ltx_font_italic" style="--ltx-fg-color:#000000;">Theme 1: Learning and Development Desires<span id="A1.SSx2.p1.pic1.2.1.1.1" class="ltx_text"></span></span></span>
<span id="A1.I3" class="ltx_itemize">
<span id="A1.I3.i1" class="ltx_item" style="list-style-type:none;"><span class="ltx_tag ltx_tag_item">•</span> 
<span id="A1.I3.i1.p1" class="ltx_para">
<span id="A1.I3.i1.p1.1" class="ltx_p"><span id="A1.I3.i1.p1.1.1" class="ltx_text ltx_font_bold" style="--ltx-fg-color:#000000;">Description:</span><span id="A1.I3.i1.p1.1.2" class="ltx_text" style="--ltx-fg-color:#000000;"> Many individuals expressed their satisfaction with learning and development opportunities. However, some individuals requested more opportunities to engage in multi-day hands-on learning sessions with expert mentors to aid in learning and skill development. Some individuals suggested more learning and development trainings on a more regular cadence.</span></span>
</span></span>
<span id="A1.I3.i2" class="ltx_item" style="list-style-type:none;"><span class="ltx_tag ltx_tag_item">•</span> 
<span id="A1.I3.i2.p1" class="ltx_para">
<span id="A1.I3.i2.p1.1" class="ltx_p"><span id="A1.I3.i2.p1.1.1" class="ltx_text ltx_font_bold" style="--ltx-fg-color:#000000;">Quote:</span><span id="A1.I3.i2.p1.1.2" class="ltx_text" style="--ltx-fg-color:#000000;"> &quot;I really love the opportunities to learn and grow here. There are a lot of options for new and tenured people to learn. That said, I would love more hands-on training options with mentors; it would be great to be able to ask questions with an expert on-hand.&quot;</span></span>
</span></span>
</span>
</span></span></span></foreignobject></g></g></svg>