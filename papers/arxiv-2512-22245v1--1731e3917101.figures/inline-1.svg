<svg id="A1.SS11.p1.pic1" class="ltx_picture" height="710.34" overflow="visible" version="1.1" viewbox="0 0 653.15 710.34" width="653.15"><g style="--ltx-stroke-color:#000000;--ltx-fill-color:#000000;" fill="#000000" stroke="#000000" stroke-width="0.4pt" transform="translate(0,710.34) matrix(1 0 0 -1 0 0)"><g style="--ltx-fill-color:#595959;" fill="#595959" fill-opacity="1.0"><path style="stroke:none" d="M 0 5.91 L 0 704.44 C 0 707.7 2.64 710.34 5.91 710.34 L 647.24 710.34 C 650.51 710.34 653.15 707.7 653.15 704.44 L 653.15 5.91 C 653.15 2.64 650.51 0 647.24 0 L 5.91 0 C 2.64 0 0 2.64 0 5.91 Z" /></g><g style="--ltx-fill-color:#F9F9F9;" fill="#F9F9F9" fill-opacity="1.0"><path style="stroke:none" d="M 1.97 5.91 L 1.97 686.23 L 651.18 686.23 L 651.18 5.91 C 651.18 3.73 649.42 1.97 647.24 1.97 L 5.91 1.97 C 3.73 1.97 1.97 3.73 1.97 5.91 Z" /></g><g fill-opacity="1.0" transform="matrix(1.0 0.0 0.0 1.0 21.65 694.83)"><foreignobject style="--ltx-fo-width:44.07em;--ltx-fo-height:0.69em;--ltx-fo-depth:0.19em;font-size:10pt;" height="12.3" overflow="visible" transform="matrix(1 0 0 -1 0 9.61)" width="609.8"><span class="ltx_foreignobject_container"><span class="ltx_foreignobject_content">
<span id="A1.SS11.p1.pic1.1" class="ltx_inline-block ltx_minipage ltx_align_bottom" style="width:44.07em;">
<span id="A1.SS11.p1.pic1.1.1" class="ltx_p"><span id="A1.SS11.p1.pic1.1.1.1" class="ltx_text" style="--ltx-fg-color:#FFFFFF;">Pairwise Judge with Verdicts</span></span>
</span></span></span></foreignobject></g><g fill-opacity="1.0" transform="matrix(1.0 0.0 0.0 1.0 21.65 17.24)"><foreignobject style="--ltx-fo-width:44.07em;--ltx-fo-height:47.49em;--ltx-fo-depth:0.25em;font-size:10pt;" height="660.65" overflow="visible" transform="matrix(1 0 0 -1 0 657.19)" width="609.8"><span class="ltx_foreignobject_container"><span class="ltx_foreignobject_content">
<span id="A1.SS11.p1.pic1.2" class="ltx_inline-block ltx_minipage ltx_align_bottom" style="width:44.07em;">
<span id="A1.SS11.p1.pic1.2.1" class="ltx_p"><span id="A1.SS11.p1.pic1.2.1.1" class="ltx_text ltx_font_bold" style="--ltx-fg-color:#000000;">Prompt:<span id="A1.SS11.p1.pic1.2.1.1.1" class="ltx_text"></span></span></span>
<span id="A1.SS11.p1.pic1.2.2" class="ltx_p"><span id="A1.SS11.p1.pic1.2.2.1" class="ltx_text" style="--ltx-fg-color:#000000;">You are given a user question and two responses from two AI assistants. Your task is to act as an impartial judge and evaluate which response better follows the user’s instructions and provides a higher-quality answer.</span></span>
<span id="A1.SS11.p1.pic1.2.3" class="ltx_p"><span id="A1.SS11.p1.pic1.2.3.1" class="ltx_text" style="--ltx-fg-color:#000000;">First, provide your reasoning within &lt;think&gt; and &lt;/think&gt; tags. This should include your evaluation criteria for a high-quality response, a detailed comparison of the two responses, and when helpful, a reference answer as part of your evaluation. Be explicit in your thought process, referencing your criteria and explaining how each response aligns with or deviates from them.</span></span>
<span id="A1.SS11.p1.pic1.2.4" class="ltx_p"><span id="A1.SS11.p1.pic1.2.4.1" class="ltx_text" style="--ltx-fg-color:#000000;">If you are not entirely sure of the correctness of your verdict, you should verbally express your uncertainty in your thought process.</span></span>
<span id="A1.SS11.p1.pic1.2.5" class="ltx_p"><span id="A1.SS11.p1.pic1.2.5.1" class="ltx_text" style="--ltx-fg-color:#000000;">Avoid any position biases and ensure that the order in which the responses were presented does not influence your decision. Do not allow the length of the responses to influence your evaluation. Do not favor certain names of the assistants. Be as objective as possible.</span></span>
<span id="A1.SS11.p1.pic1.2.6" class="ltx_p"><span id="A1.SS11.p1.pic1.2.6.1" class="ltx_text" style="--ltx-fg-color:#000000;">Finally, provide your verdict within &lt;answer&gt; and &lt;/answer&gt; tags, strictly following this format:
- &lt;answer&gt; [[A]] &lt;/answer&gt; if Assistant A is better
- &lt;answer&gt; [[B]] &lt;/answer&gt; if Assistant B is better</span></span>
<span id="A1.SS11.p1.pic1.2.7" class="ltx_p"><span id="A1.SS11.p1.pic1.2.7.1" class="ltx_text" style="--ltx-fg-color:#000000;">Below are the user’s question and the two responses:</span></span>
<span id="A1.SS11.p1.pic1.2.8" class="ltx_p"><span id="A1.SS11.p1.pic1.2.8.1" class="ltx_text" style="--ltx-fg-color:#000000;">User Question]
{input}</span></span>
<span id="A1.SS11.p1.pic1.2.9" class="ltx_p"><span id="A1.SS11.p1.pic1.2.9.1" class="ltx_text" style="--ltx-fg-color:#000000;">[The Start of Assistant A’s Answer]</span></span>
<span id="A1.SS11.p1.pic1.2.10" class="ltx_p"><span id="A1.SS11.p1.pic1.2.10.1" class="ltx_text" style="--ltx-fg-color:#000000;">{response_1}</span></span>
<span id="A1.SS11.p1.pic1.2.11" class="ltx_p"><span id="A1.SS11.p1.pic1.2.11.1" class="ltx_text" style="--ltx-fg-color:#000000;">[The End of Assistant A’s Answer]</span></span>
<span id="A1.SS11.p1.pic1.2.12" class="ltx_p"><span id="A1.SS11.p1.pic1.2.12.1" class="ltx_text" style="--ltx-fg-color:#000000;">[The Start of Assistant B’s Answer]</span></span>
<span id="A1.SS11.p1.pic1.2.13" class="ltx_p"><span id="A1.SS11.p1.pic1.2.13.1" class="ltx_text" style="--ltx-fg-color:#000000;">{response_2}</span></span>
<span id="A1.SS11.p1.pic1.2.14" class="ltx_p"><span id="A1.SS11.p1.pic1.2.14.1" class="ltx_text" style="--ltx-fg-color:#000000;">[The End of Assistant B’s Answer]</span></span>
</span></span></span></foreignobject></g></g></svg>