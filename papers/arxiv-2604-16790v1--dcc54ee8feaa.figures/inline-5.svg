<span id="S4.SS1.SSS1.Px3.p4.pic1.p1" class="ltx_para ltx_noindent">
<span id="S4.SS1.SSS1.Px3.p4.pic1.p1.1" class="ltx_p"><span id="S4.SS1.SSS1.Px3.p4.pic1.p1.1.1" class="ltx_text ltx_font_bold" style="--ltx-fg-color:#000000;">Key findings:</span><span id="S4.SS1.SSS1.Px3.p4.pic1.p1.1.2" class="ltx_text" style="--ltx-fg-color:#000000;">
Qwen3-4B exhibits pronounced positional sensitivity, with judgment difficulty systematically decreasing when the correct answer resides in position B rather than A, even in the absence of bias injection. Beyond this sequential effect, we observe significant effect of injected bias, with several injected biases exhibiting opposite directions in B-correct versus A-correct scenarios. This indicates that these bias has a consistent effects on the judge rather than uniform performance modulators.</span></span>
</span></span></span></span></foreignobject></g></g></svg>