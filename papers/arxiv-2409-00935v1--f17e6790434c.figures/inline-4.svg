</span>
<span id="A0.I1.i9.p2" class="ltx_para">
<span id="A0.I1.i9.p2.1" class="ltx_p"><span id="A0.I1.i9.p2.1.1" class="ltx_text" style="--ltx-fg-color:#000000;">#!/usr/bin/env python</span></span>
</span>
<span id="A0.I1.i9.p3" class="ltx_para">
<span id="A0.I1.i9.p3.1" class="ltx_p"><span id="A0.I1.i9.p3.1.1" class="ltx_text" style="--ltx-fg-color:#000000;"># -*- coding: utf-8 -*-</span></span>
</span>
<span id="A0.I1.i9.p4" class="ltx_para">
<span id="A0.I1.i9.p4.1" class="ltx_p"><span id="A0.I1.i9.p4.1.1" class="ltx_text" style="--ltx-fg-color:#000000;">from struct import *</span></span>
</span>
<span id="A0.I1.i9.p5" class="ltx_para">
<span id="A0.I1.i9.p5.1" class="ltx_p"><span id="A0.I1.i9.p5.1.1" class="ltx_text" style="--ltx-fg-color:#000000;">data=“è&lt;87&gt;&lt;8d&gt;”</span></span>
</span>
<span id="A0.I1.i9.p6" class="ltx_para">
<span id="A0.I1.i9.p6.1" class="ltx_p"><span id="A0.I1.i9.p6.1.1" class="ltx_text" style="--ltx-fg-color:#000000;">udata=data.decode(“utf-8”)</span></span>
</span>
<span id="A0.I1.i9.p7" class="ltx_para">
<span id="A0.I1.i9.p7.1" class="ltx_p"><span id="A0.I1.i9.p7.1.1" class="ltx_text" style="--ltx-fg-color:#000000;">data=udata.encode(“shift-jis”).decode(“shift-jis”)</span></span>
</span>
<span id="A0.I1.i9.p8" class="ltx_para">
<span id="A0.I1.i9.p8.1" class="ltx_p"><span id="A0.I1.i9.p8.1.1" class="ltx_text" style="--ltx-fg-color:#000000;">code=unpack(data, “Q”)</span></span>
</span>
<span id="A0.I1.i9.p9" class="ltx_para">
<span id="A0.I1.i9.p9.1" class="ltx_p"><span id="A0.I1.i9.p9.1.1" class="ltx_text" style="--ltx-fg-color:#000000;">print code</span></span>
</span>
