<span id="A3.F9.pic2.2.1" class="ltx_p"><span id="A3.F9.pic2.2.1.1" class="ltx_text" style="--ltx-fg-color:#000000;">First, you should choose no more than <span id="A3.F9.pic2.2.1.1.1" class="ltx_text ltx_font_italic">num</span> scoring criteria from the given candidate Scoring Criteria that you think are important for the task. Then, assign weights to these chosen aspect.
You are tasked with evaluating a pair of texts based on the given Scoring Criteria you have selected.</span></span>
<span id="A3.F9.pic2.2.2" class="ltx_p"><span id="A3.F9.pic2.2.2.1" class="ltx_text ltx_font_bold" style="--ltx-fg-color:#0000FF;">Aspect-1</span><span id="A3.F9.pic2.2.2.2" class="ltx_text" style="--ltx-fg-color:#000000;">:<span id="A3.F9.pic2.2.2.2.1" class="ltx_text ltx_font_italic">Rubric-1
<br class="ltx_break"></span><span id="A3.F9.pic2.2.2.2.2" class="ltx_text ltx_font_bold" style="--ltx-fg-color:#0000FF;">Aspect-2</span>:<span id="A3.F9.pic2.2.2.2.3" class="ltx_text ltx_font_italic">Rubric-2</span> 
<br class="ltx_break"><span id="A3.F9.pic2.2.2.2.4" class="ltx_text ltx_font_bold" style="--ltx-fg-color:#0000FF;">Aspect-3</span>:<span id="A3.F9.pic2.2.2.2.5" class="ltx_text ltx_font_italic">Rubric-3
<br class="ltx_break"></span></span></span>
<span id="A3.F9.pic2.2.3" class="ltx_p"><span id="A3.F9.pic2.2.3.1" class="ltx_text" style="--ltx-fg-color:#000000;">## Texts to be evaluated
<br class="ltx_break">Text-1: Essay1: &quot;Dear Local Newspaper, @CAPS1 are so many ….
<br class="ltx_break">Text-2: The use of computer benefits society due to the possitive affect …</span></span>
<span id="A3.F9.pic2.2.4" class="ltx_p"><span id="A3.F9.pic2.2.4.1" class="ltx_text" style="--ltx-fg-color:#000000;">For each criterion, provide a brief analysis and assign scores.
Then, provide a comprehensive score upon them. The final score ranges from a to b.
<br class="ltx_break"></span></span>
<span id="A3.F9.pic2.2.5" class="ltx_p"><span id="A3.F9.pic2.2.5.1" class="ltx_text" style="--ltx-fg-color:#000000;">## Output Format Requirements
<br class="ltx_break">Selected Aspects: &lt;Aspects and weights&gt;. The key evaluation aspects you selected are enclosed within &lt;Aspect&gt; &lt;/Aspect&gt; tags. For example, &lt;Aspect&gt;Content, Goal&lt;/Aspect&gt;, with weights: <code id="A3.F9.pic2.2.5.1.1" class="ltx_verbatim ltx_font_typewriter">\weighted{x,y}</code>.
<br class="ltx_break">Analysis: &lt;Compare and evaluate different texts based on given Criteria from multiple aspects you’ve selected&gt;. The Analysis are enclosed within &lt;Analysis&gt; &lt;/Analysis&gt; tags.
<br class="ltx_break">Scores: &lt;Based on analysis and scores of this pair of texts across various aspects and considering the weights of aspects, synthesize an overall score. The final scores are placed in <code id="A3.F9.pic2.2.5.1.2" class="ltx_verbatim ltx_font_typewriter">\box{x,y}</code>.</span></span>
</span></span></span></foreignobject></g></g></svg>