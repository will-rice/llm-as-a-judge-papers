<svg id="A4.SS2.p2.pic1" class="ltx_picture" height="303.42" overflow="visible" version="1.1" viewbox="0 0 653.15 303.42" width="653.15"><g style="--ltx-stroke-color:#000000;--ltx-fill-color:#000000;" fill="#000000" stroke="#000000" stroke-width="0.4pt" transform="translate(0,303.42) matrix(1 0 0 -1 0 0)"><g style="--ltx-fill-color:#606060;" fill="#606060" fill-opacity="1.0"><path style="stroke:none" d="M 0 5.91 L 0 297.52 C 0 300.78 2.64 303.42 5.91 303.42 L 647.24 303.42 C 650.51 303.42 653.15 300.78 653.15 297.52 L 653.15 5.91 C 653.15 2.64 650.51 0 647.24 0 L 5.91 0 C 2.64 0 0 2.64 0 5.91 Z" /></g><g style="--ltx-fill-color:#F9F9F9;" fill="#F9F9F9" fill-opacity="1.0"><path style="stroke:none" d="M 1.97 5.91 L 1.97 279.47 L 651.18 279.47 L 651.18 5.91 C 651.18 3.73 649.42 1.97 647.24 1.97 L 5.91 1.97 C 3.73 1.97 1.97 3.73 1.97 5.91 Z" /></g><g fill-opacity="1.0" transform="matrix(1.0 0.0 0.0 1.0 21.65 288.06)"><foreignobject style="--ltx-fo-width:44.07em;--ltx-fo-height:0.68em;--ltx-fo-depth:0.19em;font-size:10pt;" height="12.15" overflow="visible" transform="matrix(1 0 0 -1 0 9.46)" width="609.8"><span class="ltx_foreignobject_container"><span class="ltx_foreignobject_content">
<span id="A4.SS2.p2.pic1.1" class="ltx_inline-block ltx_minipage ltx_align_bottom" style="width:44.07em;">
<span id="A4.SS2.p2.pic1.1.1" class="ltx_p"><span id="A4.SS2.p2.pic1.1.1.1" class="ltx_text" style="--ltx-fg-color:#FFFFFF;">Input</span></span>
</span></span></span></foreignobject></g><g fill-opacity="1.0" transform="matrix(1.0 0.0 0.0 1.0 21.65 12.92)"><foreignobject style="--ltx-fo-width:41.97em;--ltx-fo-height:18.69em;--ltx-fo-depth:0.22em;font-size:10pt;" height="261.75" overflow="visible" transform="matrix(1 0 0 -1 0 258.68)" width="580.75"><span class="ltx_foreignobject_container"><span class="ltx_foreignobject_content">
<span id="A4.SS2.p2.pic1.2" class="ltx_inline-block ltx_minipage ltx_align_bottom" style="width:41.97em;">
<span id="A4.SS2.p2.pic1.2.1" class="ltx_p"><span id="A4.SS2.p2.pic1.2.1.1" class="ltx_text ltx_font_bold" style="--ltx-fg-color:#000000;">Instruction:<span id="A4.SS2.p2.pic1.2.1.1.1" class="ltx_text ltx_font_medium"> You are given two integers <span id="A4.SS2.p2.pic1.2.1.1.1.1" class="ltx_text ltx_font_typewriter">num1</span> and <span id="A4.SS2.p2.pic1.2.1.1.1.2" class="ltx_text ltx_font_typewriter">num2</span>. In one operation, you can choose integer <math id="A4.SS2.p2.pic1.m1" class="ltx_Math" alttext="i" display="inline" intent=":literal"><semantics><mi style="--ltx-fg-color:#000000;" mathcolor="#000000">i</mi><annotation encoding="application/x-tex">i</annotation></semantics></math> in the range <math id="A4.SS2.p2.pic1.m2" class="ltx_Math" alttext="[0,60]" display="inline" intent=":literal"><semantics><mrow><mo style="--ltx-fg-color:#000000;" mathcolor="#000000" stretchy="false">[</mo><mn style="--ltx-fg-color:#000000;" mathcolor="#000000">0</mn><mo style="--ltx-fg-color:#000000;" mathcolor="#000000">,</mo><mn style="--ltx-fg-color:#000000;" mathcolor="#000000">60</mn><mo style="--ltx-fg-color:#000000;" mathcolor="#000000" stretchy="false">]</mo></mrow><annotation encoding="application/x-tex">[0,60]</annotation></semantics></math> and subtract <math id="A4.SS2.p2.pic1.m3" class="ltx_Math" alttext="2^{i}+\texttt{num2}" display="inline" intent=":literal"><semantics><mrow><msup><mn style="--ltx-fg-color:#000000;" mathcolor="#000000">2</mn><mi style="--ltx-fg-color:#000000;" mathcolor="#000000">i</mi></msup><mo style="--ltx-fg-color:#000000;" mathcolor="#000000">+</mo><mtext style="--ltx-fg-color:#000000;" class="ltx_mathvariant_monospace" mathcolor="#000000">num2</mtext></mrow><annotation encoding="application/x-tex">2^{i}+\texttt{num2}</annotation></semantics></math> from <span id="A4.SS2.p2.pic1.2.1.1.1.3" class="ltx_text ltx_font_typewriter">num1</span>. Return the minimum number of operations needed to make <span id="A4.SS2.p2.pic1.2.1.1.1.4" class="ltx_text ltx_font_typewriter">num1</span> equal to 0. If impossible, return <math id="A4.SS2.p2.pic1.m4" class="ltx_Math" alttext="-1" display="inline" intent=":literal"><semantics><mrow><mo style="--ltx-fg-color:#000000;" mathcolor="#000000">−</mo><mn style="--ltx-fg-color:#000000;" mathcolor="#000000">1</mn></mrow><annotation encoding="application/x-tex">-1</annotation></semantics></math>.</span></span></span>
<span id="A4.SS2.p2.pic1.2.2" class="ltx_p"><span id="A4.SS2.p2.pic1.2.2.1" class="ltx_text ltx_font_bold" style="--ltx-fg-color:#000000;">Response A:<span id="A4.SS2.p2.pic1.2.2.1.1" class="ltx_text"></span></span></span><pre id="A4.SS2.p2.pic1.2.3" class="ltx_verbatim ltx_font_typewriter" style="--ltx-fg-color:#000000;">
for k in range(61):
  target = num1 - k * num2
  if target &gt;= 0 and bin(target).count(’1’) &lt;= k:
    return k
return -1
</pre>
<span id="A4.SS2.p2.pic1.2.4" class="ltx_p"><span id="A4.SS2.p2.pic1.2.4.1" class="ltx_text ltx_font_bold" style="--ltx-fg-color:#000000;">Response B:<span id="A4.SS2.p2.pic1.2.4.1.1" class="ltx_text"></span></span></span><pre id="A4.SS2.p2.pic1.2.5" class="ltx_verbatim ltx_font_typewriter" style="--ltx-fg-color:#000000;">
for k in range(61):
  target = num1 - k * num2
  if target &lt; 0: continue
  if bin(target).count(’1’) &lt;= k and k &lt;= target:
    return k
return -1
</pre>
</span></span></span></foreignobject></g></g></svg>