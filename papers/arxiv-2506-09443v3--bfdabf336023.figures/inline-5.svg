<span id="S5.SS2.SSS1.p6.pic1.1" class="ltx_inline-block ltx_minipage ltx_align_bottom" style="width:36.16em;">
<span id="S5.SS2.SSS1.p6.pic1.1.1" class="ltx_p"><math id="S5.SS2.SSS1.p6.pic1.m1" class="ltx_Math" alttext="\bullet" display="inline" intent=":literal"><semantics><mo mathsize="0.900em">∙</mo><annotation encoding="application/x-tex">\bullet</annotation></semantics></math><span id="S5.SS2.SSS1.p6.pic1.1.1.1" class="ltx_text ltx_font_bold" style="font-size:90%;">Finding 5:<span id="S5.SS2.SSS1.p6.pic1.1.1.1.1" class="ltx_text ltx_font_medium"> The robustness of LLM-as-a-Judge systems is highly sensitive to the choice of prompt template. 
<br class="ltx_break"><math id="S5.SS2.SSS1.p6.pic1.m2" class="ltx_Math" alttext="\bullet" display="inline" intent=":literal"><semantics><mo>∙</mo><annotation encoding="application/x-tex">\bullet</annotation></semantics></math></span>Finding 6:<span id="S5.SS2.SSS1.p6.pic1.1.1.1.2" class="ltx_text ltx_font_medium"> We propose a low-cost yet highly transferable prompt template optimization method that improves robustness. The optimized template consistently outperforms the existing prompt template.</span></span></span>
