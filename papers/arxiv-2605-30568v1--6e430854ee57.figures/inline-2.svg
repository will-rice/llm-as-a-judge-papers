<span id="A1.p4.pic1.1" class="ltx_inline-block ltx_minipage ltx_align_bottom" style="width:39.77em;">
<span id="A1.p4.pic1.1.1" class="ltx_p"><span id="A1.p4.pic1.1.1.1" class="ltx_text ltx_font_sansserif ltx_font_bold" style="--ltx-fg-color:#FFFFFF;">Dataset-specific rubric generation (pointwise)</span></span>
</span></span></span></foreignobject></g><g fill-opacity="1.0" transform="matrix(1.0 0.0 0.0 1.0 10.16 129.38)"><foreignobject style="--ltx-fo-width:43.55em;--ltx-fo-height:10.29em;--ltx-fo-depth:0.22em;font-size:10pt;" height="145.41" overflow="visible" transform="matrix(1 0 0 -1 0 142.33)" width="602.61"><span class="ltx_foreignobject_container"><span class="ltx_foreignobject_content">
<span id="A1.p4.pic1.2" class="ltx_inline-block ltx_minipage ltx_align_bottom" style="width:43.55em;">
<span id="A1.p4.pic1.2.1" class="ltx_p"><span id="A1.p4.pic1.2.1.1" class="ltx_text ltx_font_bold" style="--ltx-fg-color:#000000;">System:<span id="A1.p4.pic1.2.1.1.1" class="ltx_text ltx_font_typewriter ltx_font_medium"> You are an expert evaluator designing assessment criteria for scoring AI assistant responses. Your task is to create a general-purpose evaluation rubric that can be applied to ANY type of prompt-response pair, where each response is scored individually on a 1--5 scale.
</span></span></span>
<span id="A1.p4.pic1.2.2" class="ltx_p"><span id="A1.p4.pic1.2.2.1" class="ltx_text ltx_font_typewriter" style="--ltx-fg-color:#000000;">The rubric should cover the key dimensions that distinguish a good AI response from a poor one, regardless of the specific task.
</span></span>
<span id="A1.p4.pic1.2.3" class="ltx_p"><span id="A1.p4.pic1.2.3.1" class="ltx_text ltx_font_typewriter" style="--ltx-fg-color:#000000;">Output ONLY a numbered list of 3--5 criteria. Each criterion should be one clear sentence describing what to evaluate.
</span></span>
</span></span></span></foreignobject></g><g fill-opacity="1.0" transform="matrix(1.0 0.0 0.0 1.0 10.16 10.16)"><foreignobject style="--ltx-fo-width:43.55em;--ltx-fo-height:6.69em;--ltx-fo-depth:0em;font-size:10pt;" height="92.52" overflow="visible" transform="matrix(1 0 0 -1 0 92.52)" width="602.61"><span class="ltx_foreignobject_container"><span class="ltx_foreignobject_content">
<span id="A1.p4.pic1.3" class="ltx_inline-block ltx_minipage ltx_align_bottom" style="width:43.55em;">
<span id="A1.p4.pic1.3.1" class="ltx_p"><span id="A1.p4.pic1.3.1.1" class="ltx_text ltx_font_bold" style="--ltx-fg-color:#000000;">User:<span id="A1.p4.pic1.3.1.1.1" class="ltx_text ltx_font_typewriter ltx_font_medium"> Create a general-purpose evaluation rubric for scoring individual AI assistant responses on a 1--5 scale. The rubric should be applicable to any type of task (factual Q&amp;A, creative writing, coding, reasoning, summarization, advice, etc.) without any task-specific or instance-specific information.
</span></span></span>
<span id="A1.p4.pic1.3.2" class="ltx_p"><span id="A1.p4.pic1.3.2.1" class="ltx_text ltx_font_typewriter" style="--ltx-fg-color:#000000;">Write the evaluation rubric.
</span></span>
</span></span></span></foreignobject></g></g></svg>