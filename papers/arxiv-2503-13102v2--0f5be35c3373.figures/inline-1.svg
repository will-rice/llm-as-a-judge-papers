<svg id="A1.p1.pic1" class="ltx_picture" height="474.42" overflow="visible" version="1.1" viewbox="0 0 653.15 474.42" width="653.15"><g style="--ltx-stroke-color:#000000;--ltx-fill-color:#000000;" fill="#000000" stroke="#000000" stroke-width="0.4pt" transform="translate(0,474.42) matrix(1 0 0 -1 0 0)"><g style="--ltx-fill-color:#000000;" fill="#000000" fill-opacity="1.0"><path style="stroke:none" d="M 0 5.91 L 0 468.51 C 0 471.78 2.64 474.42 5.91 474.42 L 647.24 474.42 C 650.51 474.42 653.15 471.78 653.15 468.51 L 653.15 5.91 C 653.15 2.64 650.51 0 647.24 0 L 5.91 0 C 2.64 0 0 2.64 0 5.91 Z" /></g><g style="--ltx-fill-color:#FFFFFF;" fill="#FFFFFF" fill-opacity="1.0"><path style="stroke:none" d="M 1.97 5.91 L 1.97 450.31 L 651.18 450.31 L 651.18 5.91 C 651.18 3.73 649.42 1.97 647.24 1.97 L 5.91 1.97 C 3.73 1.97 1.97 3.73 1.97 5.91 Z" /></g><g fill-opacity="1.0" transform="matrix(1.0 0.0 0.0 1.0 21.65 458.91)"><foreignobject style="--ltx-fo-width:44.07em;--ltx-fo-height:0.69em;--ltx-fo-depth:0.19em;font-size:10pt;" height="12.3" overflow="visible" transform="matrix(1 0 0 -1 0 9.61)" width="609.8"><span class="ltx_foreignobject_container"><span class="ltx_foreignobject_content">
<span id="A1.p1.pic1.1" class="ltx_inline-block ltx_minipage ltx_align_bottom" style="width:44.07em;">
<span id="A1.p1.pic1.1.1" class="ltx_p"><span id="A1.p1.pic1.1.1.1" class="ltx_text" style="--ltx-fg-color:#FFFFFF;">Which chatbot performed better?</span></span>
</span></span></span></foreignobject></g><g fill-opacity="1.0" transform="matrix(1.0 0.0 0.0 1.0 21.65 13.78)"><foreignobject style="--ltx-fo-width:44.07em;--ltx-fo-height:30.69em;--ltx-fo-depth:0em;font-size:10pt;" height="424.72" overflow="visible" transform="matrix(1 0 0 -1 0 424.72)" width="609.8"><span class="ltx_foreignobject_container"><span class="ltx_foreignobject_content">
<span id="A1.p1.pic1.2" class="ltx_inline-block ltx_minipage ltx_align_bottom" style="width:44.07em;">
<span id="A1.p1.pic1.2.1" class="ltx_p ltx_align_center"><span id="A1.p1.pic1.2.1.1" class="ltx_text ltx_font_bold" style="--ltx-fg-color:#000000;">Annotation Guidelines</span></span>
<span id="A1.p1.pic1.2.2" class="ltx_p"><span id="A1.p1.pic1.2.2.1" class="ltx_text" style="--ltx-fg-color:#000000;">As part of this task, you will be shown:</span></span>
<span id="A1.I1" class="ltx_itemize">
<span id="A1.I1.i1" class="ltx_item" style="list-style-type:none;"><span class="ltx_tag ltx_tag_item">•</span> 
<span id="A1.I1.i1.p1" class="ltx_para">
<span id="A1.I1.i1.p1.1" class="ltx_p"><span id="A1.I1.i1.p1.1.1" class="ltx_text" style="--ltx-fg-color:#000000;">A </span><span id="A1.I1.i1.p1.1.2" class="ltx_text ltx_font_bold" style="--ltx-fg-color:#000000;">user query</span><span id="A1.I1.i1.p1.1.3" class="ltx_text" style="--ltx-fg-color:#000000;"> in Russian addressed to a chatbot</span></span>
</span></span>
<span id="A1.I1.i2" class="ltx_item" style="list-style-type:none;"><span class="ltx_tag ltx_tag_item">•</span> 
<span id="A1.I1.i2.p1" class="ltx_para">
<span id="A1.I1.i2.p1.1" class="ltx_p"><span id="A1.I1.i2.p1.1.1" class="ltx_text" style="--ltx-fg-color:#000000;">The </span><span id="A1.I1.i2.p1.1.2" class="ltx_text ltx_font_bold" style="--ltx-fg-color:#000000;">responses</span><span id="A1.I1.i2.p1.1.3" class="ltx_text" style="--ltx-fg-color:#000000;"> of two different chatbots to the corresponding query.</span></span>
</span></span>
</span>
<span id="A1.p1.pic1.2.3" class="ltx_p"><span id="A1.p1.pic1.2.3.1" class="ltx_text" style="--ltx-fg-color:#000000;">Chatbots may make various types of errors. The types of errors are listed in the table below. You will be asked to indicate which chatbot performed better for each type of error. There are four possible annotation options (you must choose exactly one):</span></span>
<span id="A1.I2" class="ltx_itemize">
<span id="A1.I2.i1" class="ltx_item" style="list-style-type:none;"><span class="ltx_tag ltx_tag_item">•</span> 
<span id="A1.I2.i1.p1" class="ltx_para">
<span id="A1.I2.i1.p1.1" class="ltx_p"><span id="A1.I2.i1.p1.1.1" class="ltx_text" style="--ltx-fg-color:#000000;">“A is better” — chatbot A performed better</span></span>
</span></span>
<span id="A1.I2.i2" class="ltx_item" style="list-style-type:none;"><span class="ltx_tag ltx_tag_item">•</span> 
<span id="A1.I2.i2.p1" class="ltx_para">
<span id="A1.I2.i2.p1.1" class="ltx_p"><span id="A1.I2.i2.p1.1.1" class="ltx_text" style="--ltx-fg-color:#000000;">“B is better” — chatbot B performed better</span></span>
</span></span>
<span id="A1.I2.i3" class="ltx_item" style="list-style-type:none;"><span class="ltx_tag ltx_tag_item">•</span> 
<span id="A1.I2.i3.p1" class="ltx_para">
<span id="A1.I2.i3.p1.1" class="ltx_p"><span id="A1.I2.i3.p1.1.1" class="ltx_text" style="--ltx-fg-color:#000000;">“Both are good” — both chatbots performed well</span></span>
</span></span>
<span id="A1.I2.i4" class="ltx_item" style="list-style-type:none;"><span class="ltx_tag ltx_tag_item">•</span> 
<span id="A1.I2.i4.p1" class="ltx_para">
<span id="A1.I2.i4.p1.1" class="ltx_p"><span id="A1.I2.i4.p1.1.1" class="ltx_text" style="--ltx-fg-color:#000000;">“Both are bad” — both chatbots performed poorly</span></span>
</span></span>
</span>
<span id="A1.p1.pic1.2.4" class="ltx_p"><span id="A1.p1.pic1.2.4.1" class="ltx_text" style="--ltx-fg-color:#000000;">The number of errors does not matter; if <span id="A1.p1.pic1.2.4.1.1" class="ltx_text ltx_font_bold">at least one error</span> is made, the chatbot is considered to have performed poorly on the task.</span></span>
<span id="A1.p1.pic1.2.5" class="ltx_p"><span id="A1.p1.pic1.2.5.1" class="ltx_text" style="--ltx-fg-color:#000000;">You also need to indicate which response, in your opinion, was better <span id="A1.p1.pic1.2.5.1.1" class="ltx_text ltx_font_bold">based on overall impression</span>. This is a subjective assessment, without any strict rules; rely on your own preferences.</span></span>
<span id="A1.p1.pic1.2.6" class="ltx_p"><span id="A1.p1.pic1.2.6.1" class="ltx_text" style="--ltx-fg-color:#000000;">If you notice an error that is not listed in the table, leave a comment and describe the error you noticed.</span></span>
</span></span></span></foreignobject></g></g></svg>