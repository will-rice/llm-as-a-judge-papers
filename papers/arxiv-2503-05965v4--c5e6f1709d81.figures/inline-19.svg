<svg id="A4.F31.p2.pic1" class="ltx_picture" height="547.41" overflow="visible" version="1.1" viewbox="0 0 477.38 547.41" width="477.38"><g style="--ltx-stroke-color:#000000;--ltx-fill-color:#000000;" fill="#000000" stroke="#000000" stroke-width="0.4pt" transform="translate(0,547.41) matrix(1 0 0 -1 0 0)"><g style="--ltx-fill-color:#404040;" fill="#404040" fill-opacity="1.0"><path style="stroke:none" d="M 0 5.91 L 0 541.5 C 0 544.77 2.64 547.41 5.91 547.41 L 471.47 547.41 C 474.73 547.41 477.38 544.77 477.38 541.5 L 477.38 5.91 C 477.38 2.64 474.73 0 471.47 0 L 5.91 0 C 2.64 0 0 2.64 0 5.91 Z" /></g><g style="--ltx-fill-color:#F2F2F2;" fill="#F2F2F2" fill-opacity="1.0"><path style="stroke:none" d="M 1.97 5.91 L 1.97 521.76 L 475.41 521.76 L 475.41 5.91 C 475.41 3.73 473.65 1.97 471.47 1.97 L 5.91 1.97 C 3.73 1.97 1.97 3.73 1.97 5.91 Z" /></g><g fill-opacity="1.0" transform="matrix(1.0 0.0 0.0 1.0 21.65 531.13)"><foreignobject style="--ltx-fo-width:31.37em;--ltx-fo-height:0.75em;--ltx-fo-depth:0.25em;font-size:10pt;" height="13.84" overflow="visible" transform="matrix(1 0 0 -1 0 10.38)" width="434.07"><span class="ltx_foreignobject_container"><span class="ltx_foreignobject_content">
<span id="A4.F31.p2.pic1.1" class="ltx_inline-block ltx_minipage ltx_align_bottom" style="width:31.37em;">
<span id="A4.F31.p2.pic1.1.1" class="ltx_p"><span id="A4.F31.p2.pic1.1.1.1" class="ltx_text" style="--ltx-fg-color:#FFFFFF;">Forced Choice (FC) Rating Instructions - QAGS</span></span>
</span></span></span></foreignobject></g><g fill-opacity="1.0" transform="matrix(1.0 0.0 0.0 1.0 21.65 113.33)"><foreignobject style="--ltx-fo-width:31.37em;--ltx-fo-height:28.66em;--ltx-fo-depth:7.19em;font-size:10pt;" height="496.18" overflow="visible" transform="matrix(1 0 0 -1 0 396.63)" width="434.07"><span class="ltx_foreignobject_container"><span class="ltx_foreignobject_content">
<span id="A4.F31.p2.pic1.2" class="ltx_inline-block ltx_minipage ltx_align_bottom" style="width:31.37em;">
<span id="A4.F31.p2.pic1.2.1" class="ltx_p"><span id="A4.F31.p2.pic1.2.1.1" class="ltx_text" style="--ltx-fg-color:#000000;">In this task, you will read an article and a sentence.</span></span>
<span id="A4.F31.p2.pic1.2.2" class="ltx_p"><span id="A4.F31.p2.pic1.2.2.1" class="ltx_text" style="--ltx-fg-color:#000000;">The task is to determine if the sentence is factually correct given the contents of the article. Many sentences contain portions of text copied directly from the article.
Be careful as some sentences may be combinations of two different parts of the article, resulting in sentences that overall aren’t supported by the article.
Some article sentences may seem out of place (for example, “Scroll down for video”).
If the sentence is a copy of an article sentence, including one of these sentences, you should still treat it as factually supported.
Otherwise, if the sentence doesn’t make sense, you should mark it as not supported. Also note that the article may be cut off at the end.</span></span>
<span id="A4.F31.p2.pic1.2.3" class="ltx_p"><span id="A4.F31.p2.pic1.2.3.1" class="ltx_text" style="--ltx-fg-color:#000000;">Now provide a response to the following example:
<br class="ltx_break">Article: “{article}”
<br class="ltx_break">Sentence: “{sentence}”</span></span>
<span id="A4.F31.p2.pic1.2.4" class="ltx_p"><span id="A4.F31.p2.pic1.2.4.1" class="ltx_text" style="--ltx-fg-color:#000000;">Is the sentence supported by the article? Select ONE option that best applies:</span></span>
<span id="A4.I44" class="ltx_itemize">
<span id="A4.I44.ix1" class="ltx_item" style="list-style-type:none;"><span class="ltx_tag ltx_tag_item">A.</span> 
<span id="A4.I44.ix1.p1" class="ltx_para">
<span id="A4.I44.ix1.p1.1" class="ltx_p"><span id="A4.I44.ix1.p1.1.1" class="ltx_text" style="--ltx-fg-color:#000000;">Supported - The sentence is factually correct given the contents of the article</span></span>
</span></span>
<span id="A4.I44.ix2" class="ltx_item" style="list-style-type:none;"><span class="ltx_tag ltx_tag_item">B.</span> 
<span id="A4.I44.ix2.p1" class="ltx_para">
<span id="A4.I44.ix2.p1.1" class="ltx_p"><span id="A4.I44.ix2.p1.1.1" class="ltx_text" style="--ltx-fg-color:#000000;">Not Supported - The sentence contains facts not supported by the article</span></span>
</span></span>
</span>
<span id="A4.F31.p2.pic1.2.5" class="ltx_p"><span id="A4.F31.p2.pic1.2.5.1" class="ltx_text ltx_font_bold" style="--ltx-fg-color:#000000;">RESPONSE FORMAT:<span id="A4.F31.p2.pic1.2.5.1.1" class="ltx_text"></span></span></span>
<span id="A4.I45" class="ltx_itemize">
<span id="A4.I45.i1" class="ltx_item" style="list-style-type:none;"><span class="ltx_tag ltx_tag_item">•</span> 
<span id="A4.I45.i1.p1" class="ltx_para">
<span id="A4.I45.i1.p1.1" class="ltx_p"><span id="A4.I45.i1.p1.1.1" class="ltx_text" style="--ltx-fg-color:#000000;">Provide only a single letter: A or B</span></span>
</span></span>
<span id="A4.I45.i2" class="ltx_item" style="list-style-type:none;"><span class="ltx_tag ltx_tag_item">•</span> 
<span id="A4.I45.i2.p1" class="ltx_para">
<span id="A4.I45.i2.p1.1" class="ltx_p"><span id="A4.I45.i2.p1.1.1" class="ltx_text" style="--ltx-fg-color:#000000;">The letter must be the first character in your response</span></span>
</span></span>
<span id="A4.I45.i3" class="ltx_item" style="list-style-type:none;"><span class="ltx_tag ltx_tag_item">•</span> 
<span id="A4.I45.i3.p1" class="ltx_para">
<span id="A4.I45.i3.p1.1" class="ltx_p"><span id="A4.I45.i3.p1.1.1" class="ltx_text" style="--ltx-fg-color:#000000;">No spaces, punctuation, or other characters</span></span>
</span></span>
<span id="A4.I45.i4" class="ltx_item" style="list-style-type:none;"><span class="ltx_tag ltx_tag_item">•</span> 
<span id="A4.I45.i4.p1" class="ltx_para">
<span id="A4.I45.i4.p1.1" class="ltx_p"><span id="A4.I45.i4.p1.1.1" class="ltx_text" style="--ltx-fg-color:#000000;">No explanation</span></span>
</span></span>
</span>
</span></span></span></foreignobject></g></g></svg>