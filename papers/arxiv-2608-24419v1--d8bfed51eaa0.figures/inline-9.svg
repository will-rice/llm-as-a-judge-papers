<span id="A2.SS0.SSS0.Px2.p3.pic1.1.1" class="ltx_p"><span id="A2.SS0.SSS0.Px2.p3.pic1.1.1.1" class="ltx_text ltx_font_bold" style="font-size:90%;--ltx-fg-color:#FFFFFF;">Register edit (control arm, <math id="A2.SS0.SSS0.Px2.p3.pic1.m1" class="ltx_Math" alttext="T_{\mathrm{I}}" display="inline" intent=":literal"><semantics><msub><mi style="--ltx-fg-color:#FFFFFF;" mathcolor="#FFFFFF">T</mi><mi style="--ltx-fg-color:#FFFFFF;" mathcolor="#FFFFFF" mathvariant="normal">I</mi></msub><annotation encoding="application/x-tex">T_{\mathrm{I}}</annotation></semantics></math>)</span></span>
</span></span></span></foreignobject></g><g fill-opacity="1.0" transform="matrix(1.0 0.0 0.0 1.0 14.59 14.94)"><foreignobject style="--ltx-fo-width:48.51em;--ltx-fo-height:18.55em;--ltx-fo-depth:0.23em;font-size:10pt;" height="259.79" overflow="visible" transform="matrix(1 0 0 -1 0 256.68)" width="671.24"><span class="ltx_foreignobject_container"><span class="ltx_foreignobject_content">
<span id="A2.SS0.SSS0.Px2.p3.pic1.2" class="ltx_inline-block ltx_minipage ltx_align_bottom" style="width:48.51em;">
<span id="A2.SS0.SSS0.Px2.p3.pic1.2.1" class="ltx_p"><span id="A2.SS0.SSS0.Px2.p3.pic1.2.1.1" class="ltx_text" style="font-size:90%;--ltx-fg-color:#000000;">You rewrite scientific sentences to change their SURFACE FORM ONLY, leaving the claim and its
scope exactly as they were.</span></span>
<span id="A2.SS0.SSS0.Px2.p3.pic1.2.2" class="ltx_p"><span id="A2.SS0.SSS0.Px2.p3.pic1.2.2.1" class="ltx_text" style="font-size:90%;--ltx-fg-color:#000000;">Input sentence: <code id="A2.SS0.SSS0.Px2.p3.pic1.2.2.1.1" class="ltx_verbatim ltx_font_typewriter">{sentence}</code></span></span>
<span id="A2.SS0.SSS0.Px2.p3.pic1.2.3" class="ltx_p"><span id="A2.SS0.SSS0.Px2.p3.pic1.2.3.1" class="ltx_text" style="font-size:90%;--ltx-fg-color:#000000;">Apply EXACTLY ONE edit of type <code id="A2.SS0.SSS0.Px2.p3.pic1.2.3.1.1" class="ltx_verbatim ltx_font_typewriter">{edit_type}</code> (<code id="A2.SS0.SSS0.Px2.p3.pic1.2.3.1.2" class="ltx_verbatim ltx_font_typewriter">{edit_gloss}</code>).</span></span>
<span id="A2.SS0.SSS0.Px2.p3.pic1.2.4" class="ltx_p"><span id="A2.SS0.SSS0.Px2.p3.pic1.2.4.1" class="ltx_text" style="font-size:90%;--ltx-fg-color:#000000;">Hard constraints:</span></span>
<span id="A2.I2" class="ltx_enumerate">
<span id="A2.I2.i1" class="ltx_item" style="list-style-type:none;"><span class="ltx_tag ltx_tag_item">1.</span> 
<span id="A2.I2.i1.p1" class="ltx_para">
<span id="A2.I2.i1.p1.1" class="ltx_p"><span id="A2.I2.i1.p1.1.1" class="ltx_text" style="font-size:90%;--ltx-fg-color:#000000;">The claim must remain true of exactly the same population, conditions, and modality. Do
not widen or narrow anything.</span></span>
</span></span>
<span id="A2.I2.i2" class="ltx_item" style="list-style-type:none;padding-top:0.0pt;"><span class="ltx_tag ltx_tag_item">2.</span> 
<span id="A2.I2.i2.p1" class="ltx_para">
<span id="A2.I2.i2.p1.1" class="ltx_p"><span id="A2.I2.i2.p1.1.1" class="ltx_text" style="font-size:90%;--ltx-fg-color:#000000;">Do NOT add or remove factual content.</span></span>
</span></span>
<span id="A2.I2.i3" class="ltx_item" style="list-style-type:none;padding-top:0.0pt;"><span class="ltx_tag ltx_tag_item">3.</span> 
<span id="A2.I2.i3.p1" class="ltx_para">
<span id="A2.I2.i3.p1.1" class="ltx_p"><span id="A2.I2.i3.p1.1.1" class="ltx_text" style="font-size:90%;--ltx-fg-color:#000000;">Do NOT introduce provenance language.</span></span>
</span></span>
<span id="A2.I2.i4" class="ltx_item" style="list-style-type:none;padding-top:0.0pt;"><span class="ltx_tag ltx_tag_item">4.</span> 
<span id="A2.I2.i4.p1" class="ltx_para">
<span id="A2.I2.i4.p1.1" class="ltx_p"><span id="A2.I2.i4.p1.1.1" class="ltx_text" style="font-size:90%;--ltx-fg-color:#000000;">Keep the length within </span><code id="A2.I2.i4.p1.1.2" class="ltx_verbatim ltx_font_typewriter" style="font-size:90%;--ltx-fg-color:#000000;">{tol}</code><span id="A2.I2.i4.p1.1.3" class="ltx_text" style="font-size:90%;--ltx-fg-color:#000000;"> percent of the input’s token count.</span></span>
</span></span>
</span>
<span id="A2.SS0.SSS0.Px2.p3.pic1.2.5" class="ltx_p"><span id="A2.SS0.SSS0.Px2.p3.pic1.2.5.1" class="ltx_text" style="font-size:90%;--ltx-fg-color:#000000;">Return JSON only: <code id="A2.SS0.SSS0.Px2.p3.pic1.2.5.1.1" class="ltx_verbatim ltx_font_typewriter">{&quot;edited&quot;: ..., &quot;surface_change&quot;: &quot;{edit_type}&quot;,</code>
<code id="A2.SS0.SSS0.Px2.p3.pic1.2.5.1.2" class="ltx_verbatim ltx_font_typewriter">&quot;scope_unchanged&quot;: true, &quot;facts_preserved&quot;: true, &quot;anchor_free&quot;: true}</code></span></span>
</span></span></span></foreignobject></g></g></svg>