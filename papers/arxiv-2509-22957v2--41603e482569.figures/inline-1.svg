</span></span>
</span>
<span id="A5.F8.p1.pic1.2.2" class="ltx_p"><span id="A5.F8.p1.pic1.2.2.1" class="ltx_text" style="--ltx-fg-color:#000000;">Now, imagining that you possess these characteristics, you should evaluate the AI assistant’s response to your user queries.</span></span>
<span id="A5.F8.p1.pic1.2.3" class="ltx_p"><span id="A5.F8.p1.pic1.2.3.1" class="ltx_text" style="--ltx-fg-color:#000000;">All prompts will be of the format: “{rating_instructions}”</span></span>
