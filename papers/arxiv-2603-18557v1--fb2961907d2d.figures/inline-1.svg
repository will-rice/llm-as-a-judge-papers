<svg id="A3.pic1" class="ltx_picture ltx_centering" height="1332.94" overflow="visible" version="1.1" viewbox="0 0 653.15 1332.94" width="653.15"><g style="--ltx-stroke-color:#000000;--ltx-fill-color:#000000;" fill="#000000" stroke="#000000" stroke-width="0.4pt" transform="translate(0,1332.94) matrix(1 0 0 -1 0 0)"><g style="--ltx-fill-color:#000000;" fill="#000000" fill-opacity="1.0"><path style="stroke:none" d="M 0 8.7 L 0 1324.24 C 0 1329.04 3.9 1332.94 8.7 1332.94 L 644.45 1332.94 C 649.25 1332.94 653.15 1329.04 653.15 1324.24 L 653.15 8.7 C 653.15 3.9 649.25 0 644.45 0 L 8.7 0 C 3.9 0 0 3.9 0 8.7 Z" /></g><g style="--ltx-fill-color:#FBFBFB;" fill="#FBFBFB" fill-opacity="1.0"><path style="stroke:none" d="M 0.83 8.7 L 0.83 1311.11 L 652.32 1311.11 L 652.32 8.7 C 652.32 4.36 648.79 0.83 644.45 0.83 L 8.7 0.83 C 4.36 0.83 0.83 4.36 0.83 8.7 Z" /></g><g fill-opacity="1.0" transform="matrix(1.0 0.0 0.0 1.0 10.67 1318.56)"><foreignobject style="--ltx-fo-width:45.66em;--ltx-fo-height:0.69em;--ltx-fo-depth:0.19em;font-size:10pt;" height="12.3" overflow="visible" transform="matrix(1 0 0 -1 0 9.61)" width="631.81"><span class="ltx_foreignobject_container"><span class="ltx_foreignobject_content">
<span id="A3.pic1.1" class="ltx_inline-block ltx_minipage ltx_align_bottom" style="width:45.66em;">
<span id="A3.pic1.1.1" class="ltx_p"><span id="A3.pic1.1.1.1" class="ltx_text" style="--ltx-fg-color:#FFFFFF;">Summary Evaluation Questions</span></span>
</span></span></span></foreignobject></g><g fill-opacity="1.0" transform="matrix(1.0 0.0 0.0 1.0 10.67 239.78)"><foreignobject style="--ltx-fo-width:45.66em;--ltx-fo-height:76.86em;--ltx-fo-depth:16.7em;font-size:10pt;" height="1294.54" overflow="visible" transform="matrix(1 0 0 -1 0 1063.46)" width="631.81"><span class="ltx_foreignobject_container"><span class="ltx_foreignobject_content">
<span id="A3.pic1.2" class="ltx_inline-block ltx_minipage ltx_align_bottom" style="width:45.66em;">
<span id="A3.pic1.2.1" class="ltx_p"><span id="A3.pic1.2.1.1" class="ltx_text ltx_font_bold" style="--ltx-fg-color:#000000;">Factual Accuracy (6 questions)<span id="A3.pic1.2.1.1.1" class="ltx_text"></span></span></span>
<span id="A3.I1" class="ltx_enumerate ltx_leftmargin_flush">
<span id="A3.I1.i1" class="ltx_item" style="list-style-type:none;"><span class="ltx_tag ltx_tag_item">1.</span> 
<span id="A3.I1.i1.p1" class="ltx_para">
<span id="A3.I1.i1.p1.1" class="ltx_p"><span id="A3.I1.i1.p1.1.1" class="ltx_text" style="--ltx-fg-color:#000000;">Does the summary include any claims that are not explicitly supported by information in the source document?</span></span>
</span></span>
<span id="A3.I1.i2" class="ltx_item" style="list-style-type:none;"><span class="ltx_tag ltx_tag_item">2.</span> 
<span id="A3.I1.i2.p1" class="ltx_para">
<span id="A3.I1.i2.p1.1" class="ltx_p"><span id="A3.I1.i2.p1.1.1" class="ltx_text" style="--ltx-fg-color:#000000;">Does the summary contradict any specific fact, detail, or relationship stated in the source document?</span></span>
</span></span>
<span id="A3.I1.i3" class="ltx_item" style="list-style-type:none;"><span class="ltx_tag ltx_tag_item">3.</span> 
<span id="A3.I1.i3.p1" class="ltx_para">
<span id="A3.I1.i3.p1.1" class="ltx_p"><span id="A3.I1.i3.p1.1.1" class="ltx_text" style="--ltx-fg-color:#000000;">Are events, actions, or attributes in the summary correctly attributed to the individuals, entities, or sources named in the source document?</span></span>
</span></span>
<span id="A3.I1.i4" class="ltx_item" style="list-style-type:none;"><span class="ltx_tag ltx_tag_item">4.</span> 
<span id="A3.I1.i4.p1" class="ltx_para">
<span id="A3.I1.i4.p1.1" class="ltx_p"><span id="A3.I1.i4.p1.1.1" class="ltx_text" style="--ltx-fg-color:#000000;">Does the summary present speculative, uncertain, or conditional information from the source as definitive or certain?</span></span>
</span></span>
<span id="A3.I1.i5" class="ltx_item" style="list-style-type:none;"><span class="ltx_tag ltx_tag_item">5.</span> 
<span id="A3.I1.i5.p1" class="ltx_para">
<span id="A3.I1.i5.p1.1" class="ltx_p"><span id="A3.I1.i5.p1.1.1" class="ltx_text" style="--ltx-fg-color:#000000;">Does the summary accurately reflect the relative importance or prominence of key points as presented in the source document?</span></span>
</span></span>
<span id="A3.I1.i6" class="ltx_item" style="list-style-type:none;"><span class="ltx_tag ltx_tag_item">6.</span> 
<span id="A3.I1.i6.p1" class="ltx_para">
<span id="A3.I1.i6.p1.1" class="ltx_p"><span id="A3.I1.i6.p1.1.1" class="ltx_text" style="--ltx-fg-color:#000000;">Does the summary introduce numerical data, statistics, or quantitative claims that differ from those in the source document?</span></span>
</span></span>
</span>
<span id="A3.pic1.2.2" class="ltx_p"><span id="A3.pic1.2.2.1" class="ltx_text ltx_font_bold" style="--ltx-fg-color:#000000;">Contradiction Detection (6 questions)<span id="A3.pic1.2.2.1.1" class="ltx_text"></span></span></span>
<span id="A3.I2" class="ltx_enumerate ltx_leftmargin_flush">
<span id="A3.I2.i7" class="ltx_item" style="list-style-type:none;"><span class="ltx_tag ltx_tag_item">7.</span> 
<span id="A3.I2.i7.p1" class="ltx_para">
<span id="A3.I2.i7.p1.1" class="ltx_p"><span id="A3.I2.i7.p1.1.1" class="ltx_text" style="--ltx-fg-color:#000000;">Does the summary attribute a claim, opinion, or action to a source or entity that is not supported or explicitly stated in the source document?</span></span>
</span></span>
<span id="A3.I2.i8" class="ltx_item" style="list-style-type:none;"><span class="ltx_tag ltx_tag_item">8.</span> 
<span id="A3.I2.i8.p1" class="ltx_para">
<span id="A3.I2.i8.p1.1" class="ltx_p"><span id="A3.I2.i8.p1.1.1" class="ltx_text" style="--ltx-fg-color:#000000;">Does the summary present a possibility or uncertainty as a definitive fact, thereby increasing the level of certainty beyond what is expressed in the source document?</span></span>
</span></span>
<span id="A3.I2.i9" class="ltx_item" style="list-style-type:none;"><span class="ltx_tag ltx_tag_item">9.</span> 
<span id="A3.I2.i9.p1" class="ltx_para">
<span id="A3.I2.i9.p1.1" class="ltx_p"><span id="A3.I2.i9.p1.1.1" class="ltx_text" style="--ltx-fg-color:#000000;">Does the summary state that an event occurred, or a condition exists, when the source document explicitly indicates it did not happen or was not the case?</span></span>
</span></span>
<span id="A3.I2.i10" class="ltx_item" style="list-style-type:none;"><span class="ltx_tag ltx_tag_item">10.</span> 
<span id="A3.I2.i10.p1" class="ltx_para">
<span id="A3.I2.i10.p1.1" class="ltx_p"><span id="A3.I2.i10.p1.1.1" class="ltx_text" style="--ltx-fg-color:#000000;">Does the summary include a causal relationship between two events that is not stated, implied, or supported by the source document?</span></span>
</span></span>
<span id="A3.I2.i11" class="ltx_item" style="list-style-type:none;"><span class="ltx_tag ltx_tag_item">11.</span> 
<span id="A3.I2.i11.p1" class="ltx_para">
<span id="A3.I2.i11.p1.1" class="ltx_p"><span id="A3.I2.i11.p1.1.1" class="ltx_text" style="--ltx-fg-color:#000000;">Does the summary report a numerical value, statistic, or quantitative detail that contradicts the figures provided in the source document?</span></span>
</span></span>
<span id="A3.I2.i12" class="ltx_item" style="list-style-type:none;"><span class="ltx_tag ltx_tag_item">12.</span> 
<span id="A3.I2.i12.p1" class="ltx_para">
<span id="A3.I2.i12.p1.1" class="ltx_p"><span id="A3.I2.i12.p1.1.1" class="ltx_text" style="--ltx-fg-color:#000000;">Does the summary describe an action or outcome as having happened in the past when the source document states it is planned, proposed, or speculative?</span></span>
</span></span>
</span>
<span id="A3.pic1.2.3" class="ltx_p"><span id="A3.pic1.2.3.1" class="ltx_text ltx_font_bold" style="--ltx-fg-color:#000000;">Claim Support (6 questions)<span id="A3.pic1.2.3.1.1" class="ltx_text"></span></span></span>
<span id="A3.I3" class="ltx_enumerate ltx_leftmargin_flush">
<span id="A3.I3.i13" class="ltx_item" style="list-style-type:none;"><span class="ltx_tag ltx_tag_item">13.</span> 
<span id="A3.I3.i13.p1" class="ltx_para">
<span id="A3.I3.i13.p1.1" class="ltx_p"><span id="A3.I3.i13.p1.1.1" class="ltx_text" style="--ltx-fg-color:#000000;">Does the summary include any claims that are not explicitly supported by evidence or statements in the source document?</span></span>
</span></span>
<span id="A3.I3.i14" class="ltx_item" style="list-style-type:none;"><span class="ltx_tag ltx_tag_item">14.</span> 
<span id="A3.I3.i14.p1" class="ltx_para">
<span id="A3.I3.i14.p1.1" class="ltx_p"><span id="A3.I3.i14.p1.1.1" class="ltx_text" style="--ltx-fg-color:#000000;">Are there any statements in the summary that directly contradict information provided in the source document?</span></span>
</span></span>
<span id="A3.I3.i15" class="ltx_item" style="list-style-type:none;"><span class="ltx_tag ltx_tag_item">15.</span> 
<span id="A3.I3.i15.p1" class="ltx_para">
<span id="A3.I3.i15.p1.1" class="ltx_p"><span id="A3.I3.i15.p1.1.1" class="ltx_text" style="--ltx-fg-color:#000000;">Does the summary attribute actions, opinions, or statements to individuals or entities that are not assigned to them in the source document?</span></span>
</span></span>
<span id="A3.I3.i16" class="ltx_item" style="list-style-type:none;"><span class="ltx_tag ltx_tag_item">16.</span> 
<span id="A3.I3.i16.p1" class="ltx_para">
<span id="A3.I3.i16.p1.1" class="ltx_p"><span id="A3.I3.i16.p1.1.1" class="ltx_text" style="--ltx-fg-color:#000000;">To what extent does the summary present speculative or conditional information from the source as definitive or certain?</span></span>
</span></span>
<span id="A3.I3.i17" class="ltx_item" style="list-style-type:none;"><span class="ltx_tag ltx_tag_item">17.</span> 
<span id="A3.I3.i17.p1" class="ltx_para">
<span id="A3.I3.i17.p1.1" class="ltx_p"><span id="A3.I3.i17.p1.1.1" class="ltx_text" style="--ltx-fg-color:#000000;">Does the summary introduce new causal relationships or implications between events that are not stated or logically supported in the source document?</span></span>
</span></span>
<span id="A3.I3.i18" class="ltx_item" style="list-style-type:none;"><span class="ltx_tag ltx_tag_item">18.</span> 
<span id="A3.I3.i18.p1" class="ltx_para">
<span id="A3.I3.i18.p1.1" class="ltx_p"><span id="A3.I3.i18.p1.1.1" class="ltx_text" style="--ltx-fg-color:#000000;">Are key details in the summary distorted in a way that alters the meaning or significance of the information presented in the source document?</span></span>
</span></span>
</span>
<span id="A3.pic1.2.4" class="ltx_p"><span id="A3.pic1.2.4.1" class="ltx_text ltx_font_bold" style="--ltx-fg-color:#000000;">Misrepresentation Identification (6 questions)<span id="A3.pic1.2.4.1.1" class="ltx_text"></span></span></span>
<span id="A3.I4" class="ltx_enumerate ltx_leftmargin_flush">
<span id="A3.I4.i19" class="ltx_item" style="list-style-type:none;"><span class="ltx_tag ltx_tag_item">19.</span> 
<span id="A3.I4.i19.p1" class="ltx_para">
<span id="A3.I4.i19.p1.1" class="ltx_p"><span id="A3.I4.i19.p1.1.1" class="ltx_text" style="--ltx-fg-color:#000000;">Does the summary attribute a claim, opinion, or action to a source or entity that is not supported or explicitly stated in the source document?</span></span>
</span></span>
<span id="A3.I4.i20" class="ltx_item" style="list-style-type:none;"><span class="ltx_tag ltx_tag_item">20.</span> 
<span id="A3.I4.i20.p1" class="ltx_para">
<span id="A3.I4.i20.p1.1" class="ltx_p"><span id="A3.I4.i20.p1.1.1" class="ltx_text" style="--ltx-fg-color:#000000;">Does the summary present a speculative or conditional statement from the source as a definitive fact?</span></span>
</span></span>
<span id="A3.I4.i21" class="ltx_item" style="list-style-type:none;"><span class="ltx_tag ltx_tag_item">21.</span> 
<span id="A3.I4.i21.p1" class="ltx_para">
<span id="A3.I4.i21.p1.1" class="ltx_p"><span id="A3.I4.i21.p1.1.1" class="ltx_text" style="--ltx-fg-color:#000000;">Does the summary include a key event, outcome, or statistic that is not mentioned or implied in the source document?</span></span>
</span></span>
<span id="A3.I4.i22" class="ltx_item" style="list-style-type:none;"><span class="ltx_tag ltx_tag_item">22.</span> 
<span id="A3.I4.i22.p1" class="ltx_para">
<span id="A3.I4.i22.p1.1" class="ltx_p"><span id="A3.I4.i22.p1.1.1" class="ltx_text" style="--ltx-fg-color:#000000;">Does the summary reverse, invert, or otherwise distort the causal or temporal relationship between two events described in the source document?</span></span>
</span></span>
<span id="A3.I4.i23" class="ltx_item" style="list-style-type:none;"><span class="ltx_tag ltx_tag_item">23.</span> 
<span id="A3.I4.i23.p1" class="ltx_para">
<span id="A3.I4.i23.p1.1" class="ltx_p"><span id="A3.I4.i23.p1.1.1" class="ltx_text" style="--ltx-fg-color:#000000;">Does the summary exaggerate the strength, scope, or certainty of a finding, trend, or conclusion beyond what is stated in the source document?</span></span>
</span></span>
<span id="A3.I4.i24" class="ltx_item" style="list-style-type:none;"><span class="ltx_tag ltx_tag_item">24.</span> 
<span id="A3.I4.i24.p1" class="ltx_para">
<span id="A3.I4.i24.p1.1" class="ltx_p"><span id="A3.I4.i24.p1.1.1" class="ltx_text" style="--ltx-fg-color:#000000;">Does the summary omit a critical qualifying condition, limitation, or exception present in the source that changes the interpretation of the information?</span></span>
</span></span>
</span>
<span id="A3.pic1.2.5" class="ltx_p"><span id="A3.pic1.2.5.1" class="ltx_text ltx_font_bold" style="--ltx-fg-color:#000000;">Certainty Calibration (6 questions)<span id="A3.pic1.2.5.1.1" class="ltx_text"></span></span></span>
<span id="A3.I5" class="ltx_enumerate ltx_leftmargin_flush">
<span id="A3.I5.i25" class="ltx_item" style="list-style-type:none;"><span class="ltx_tag ltx_tag_item">25.</span> 
<span id="A3.I5.i25.p1" class="ltx_para">
<span id="A3.I5.i25.p1.1" class="ltx_p"><span id="A3.I5.i25.p1.1.1" class="ltx_text" style="--ltx-fg-color:#000000;">Does the summary present a claim as certain or definitive when the source document expresses it as uncertain, tentative, or conditional?</span></span>
</span></span>
<span id="A3.I5.i26" class="ltx_item" style="list-style-type:none;"><span class="ltx_tag ltx_tag_item">26.</span> 
<span id="A3.I5.i26.p1" class="ltx_para">
<span id="A3.I5.i26.p1.1" class="ltx_p"><span id="A3.I5.i26.p1.1.1" class="ltx_text" style="--ltx-fg-color:#000000;">Does the summary introduce a level of confidence or precision (e.g., “proves,” “definitely,” “exactly”) in a claim that is not supported by the degree of certainty used in the source document?</span></span>
</span></span>
<span id="A3.I5.i27" class="ltx_item" style="list-style-type:none;"><span class="ltx_tag ltx_tag_item">27.</span> 
<span id="A3.I5.i27.p1" class="ltx_para">
<span id="A3.I5.i27.p1.1" class="ltx_p"><span id="A3.I5.i27.p1.1.1" class="ltx_text" style="--ltx-fg-color:#000000;">Are probabilities, frequencies, or likelihoods in the summary accurately reflected in terms of their magnitude and wording compared to the source document (e.g., “likely” vs. “possible” vs. “certain”)?</span></span>
</span></span>
<span id="A3.I5.i28" class="ltx_item" style="list-style-type:none;"><span class="ltx_tag ltx_tag_item">28.</span> 
<span id="A3.I5.i28.p1" class="ltx_para">
<span id="A3.I5.i28.p1.1" class="ltx_p"><span id="A3.I5.i28.p1.1.1" class="ltx_text" style="--ltx-fg-color:#000000;">Does the summary omit hedging language (e.g., “may,” “suggests,” “appears to”) present in the source, thereby overstating the strength of a conclusion?</span></span>
</span></span>
<span id="A3.I5.i29" class="ltx_item" style="list-style-type:none;"><span class="ltx_tag ltx_tag_item">29.</span> 
<span id="A3.I5.i29.p1" class="ltx_para">
<span id="A3.I5.i29.p1.1" class="ltx_p"><span id="A3.I5.i29.p1.1.1" class="ltx_text" style="--ltx-fg-color:#000000;">To what extent does the summary mirror the source document’s attribution of claims to specific agents, studies, or evidence, without shifting responsibility or generalizing to broader consensus?</span></span>
</span></span>
<span id="A3.I5.i30" class="ltx_item" style="list-style-type:none;"><span class="ltx_tag ltx_tag_item">30.</span> 
<span id="A3.I5.i30.p1" class="ltx_para">
<span id="A3.I5.i30.p1.1" class="ltx_p"><span id="A3.I5.i30.p1.1.1" class="ltx_text" style="--ltx-fg-color:#000000;">Does the summary elevate a hypothesis, preliminary finding, or speculative idea from the source to the status of an established fact?</span></span>
</span></span>
</span>
</span></span></span></foreignobject></g></g></svg>