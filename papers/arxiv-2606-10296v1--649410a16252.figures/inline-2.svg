<span id="A1.F4.pic1.2.1" class="ltx_p"><span id="A1.F4.pic1.2.1.1" class="ltx_text ltx_font_bold" style="--ltx-fg-color:#000000;">Role Preamble
<br class="ltx_break"><span id="A1.F4.pic1.2.1.1.1" class="ltx_text ltx_font_medium">$ROLE_PREAMBLE</span></span></span>
<span id="A1.F4.pic1.2.2" class="ltx_p"><span id="A1.F4.pic1.2.2.1" class="ltx_text ltx_font_bold" style="--ltx-fg-color:#000000;">[Rubric Scoring]:<span id="A1.F4.pic1.2.2.1.1" class="ltx_text ltx_font_medium"> You are a Critic. Identify weaknesses or
rubric misalignments in the essay for the trait “$TRAIT_NAME”.
Challenge the Advocate’s claims using specific textual evidence distinct
from that already cited. Do not assign a score or discuss strengths.</span></span></span>
<span id="A1.F4.pic1.2.3" class="ltx_p"><span id="A1.F4.pic1.2.3.1" class="ltx_text ltx_font_bold" style="--ltx-fg-color:#000000;">[Mathematical Reasoning]:<span id="A1.F4.pic1.2.3.1.1" class="ltx_text ltx_font_medium"> You are a Verifier. Independently
check each step of the Solver’s derivation for correctness. If an error
exists, identify the first incorrect step and provide an alternative
derivation from that point. Do not confirm or deny the final answer
without showing your own working.</span></span></span>
<span id="A1.F4.pic1.2.4" class="ltx_p"><span id="A1.F4.pic1.2.4.1" class="ltx_text ltx_font_bold" style="--ltx-fg-color:#000000;">[Factual QA]:<span id="A1.F4.pic1.2.4.1.1" class="ltx_text ltx_font_medium"> You are a Challenger. Question the Proponent’s
evidence and argue for the most strongly supported alternative answer.
Cite specific passages that the Proponent overlooked or misinterpreted.
Do not reuse evidence already cited by the Proponent.</span></span></span>
<span id="A1.F4.pic1.2.5" class="ltx_p"><span id="A1.F4.pic1.2.5.1" class="ltx_text ltx_font_bold" style="--ltx-fg-color:#000000;">Shared Constraints
<br class="ltx_break"><span id="A1.F4.pic1.2.5.1.1" class="ltx_text ltx_font_medium">Organize your response using the following sections: <span id="A1.F4.pic1.2.5.1.1.1" class="ltx_text ltx_font_italic">Challenge</span>,
<span id="A1.F4.pic1.2.5.1.1.2" class="ltx_text ltx_font_italic">Counter-Evidence</span>, <span id="A1.F4.pic1.2.5.1.1.3" class="ltx_text ltx_font_italic">Reasoning</span>, <span id="A1.F4.pic1.2.5.1.1.4" class="ltx_text ltx_font_italic">Conclusion</span>.
<br class="ltx_break">Do not introduce information outside the provided task context.
