<span id="A1.SS6.p1.pic1.1.1" class="ltx_p"><span id="A1.SS6.p1.pic1.1.1.1" class="ltx_text ltx_font_bold" style="--ltx-fg-color:#FFFFFF;">LLMs prompt to measure coherence</span></span>
</span></span></span></foreignobject></g><g fill-opacity="1.0" transform="matrix(1.0 0.0 0.0 1.0 21.07 13.19)"><foreignobject style="--ltx-fo-width:45.93em;--ltx-fo-height:21.53em;--ltx-fo-depth:0em;font-size:10pt;" height="297.84" overflow="visible" transform="matrix(1 0 0 -1 0 297.84)" width="635.54"><span class="ltx_foreignobject_container"><span class="ltx_foreignobject_content">
<span id="A1.SS6.p1.pic1.2" class="ltx_inline-block ltx_minipage ltx_align_bottom" style="width:45.93em;">
<span id="A1.SS6.p1.pic1.2.1" class="ltx_p"><span id="A1.SS6.p1.pic1.2.1.1" class="ltx_text" style="font-size:90%;--ltx-fg-color:#000000;">You will be given one answer written for a question.</span></span>
<span id="A1.SS6.p1.pic1.2.2" class="ltx_p"><span id="A1.SS6.p1.pic1.2.2.1" class="ltx_text" style="font-size:90%;--ltx-fg-color:#000000;">Your task is to rate the answer on one metric.</span></span>
<span id="A1.SS6.p1.pic1.2.3" class="ltx_p"><span id="A1.SS6.p1.pic1.2.3.1" class="ltx_text" style="font-size:90%;--ltx-fg-color:#000000;">Please make sure you read and understand these instructions carefully. Please keep this document open while reviewing, and refer to it as needed.</span></span>
<span id="A1.SS6.p1.pic1.2.4" class="ltx_p"><span id="A1.SS6.p1.pic1.2.4.1" class="ltx_text" style="font-size:90%;--ltx-fg-color:#000000;">Evaluation Criteria:</span></span>
<span id="A1.SS6.p1.pic1.2.5" class="ltx_p"><span id="A1.SS6.p1.pic1.2.5.1" class="ltx_text" style="font-size:90%;--ltx-fg-color:#000000;">Coherence (1-5) - the collective quality of all sentences. We align this dimension with the DUC quality question of structure and coherence whereby “the answer should be well-structured and well-organized. The answer should not just be a heap of related information, but should build from sentence to a coherent body of information about a topic.”</span></span>
<span id="A1.SS6.p1.pic1.2.6" class="ltx_p"><span id="A1.SS6.p1.pic1.2.6.1" class="ltx_text" style="font-size:90%;--ltx-fg-color:#000000;">Evaluation Steps:</span></span>
<span id="A1.SS6.p1.pic1.2.7" class="ltx_p"><span id="A1.SS6.p1.pic1.2.7.1" class="ltx_text" style="font-size:90%;--ltx-fg-color:#000000;">1. Read the question carefully and identify the main topic and key points.</span></span>
<span id="A1.SS6.p1.pic1.2.8" class="ltx_p"><span id="A1.SS6.p1.pic1.2.8.1" class="ltx_text" style="font-size:90%;--ltx-fg-color:#000000;">2. Read the answer and compare it to the question. Check if the answer covers the main topic and key points of the question, and if it presents them in a clear and logical order.</span></span>
<span id="A1.SS6.p1.pic1.2.9" class="ltx_p"><span id="A1.SS6.p1.pic1.2.9.1" class="ltx_text" style="font-size:90%;--ltx-fg-color:#000000;">3. Assign a score for coherence on a scale of 1 to 5, where 1 is the lowest and 5 is the highest based on the Evaluation Criteria.</span></span>
<span id="A1.SS6.p1.pic1.2.10" class="ltx_p"><span id="A1.SS6.p1.pic1.2.10.1" class="ltx_text" style="font-size:90%;--ltx-fg-color:#000000;">Example:</span></span>
<span id="A1.SS6.p1.pic1.2.11" class="ltx_p"><span id="A1.SS6.p1.pic1.2.11.1" class="ltx_text" style="font-size:90%;--ltx-fg-color:#000000;">Question:</span></span>
<span id="A1.SS6.p1.pic1.2.12" class="ltx_p"><span id="A1.SS6.p1.pic1.2.12.1" class="ltx_text" style="font-size:90%;--ltx-fg-color:#000000;">Answer:</span></span>
<span id="A1.SS6.p1.pic1.2.13" class="ltx_p"><span id="A1.SS6.p1.pic1.2.13.1" class="ltx_text" style="font-size:90%;--ltx-fg-color:#000000;">Evaluation Form (scores ONLY):</span></span>
