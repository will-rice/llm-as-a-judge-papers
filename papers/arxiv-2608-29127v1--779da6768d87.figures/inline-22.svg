<span id="A2.SS1.p1.pic1.1.1" class="ltx_p"><span id="A2.SS1.p1.pic1.1.1.1" class="ltx_text ltx_verbatim ltx_font_typewriter ltx_inline-block" style="width:324.5pt;--ltx-fg-color:#000000;"><span id="A2.SS1.p1.pic1.1.1.1.1" class="ltx_text ltx_inline-block" style="width:0.0pt;"> </span><span id="A2.SS1.p1.pic1.1.1.1.2" class="ltx_text ltx_inline-block" style="width:0.0pt;"> </span><span id="A2.SS1.p1.pic1.1.1.1.3" class="ltx_inline-logical-block ltx_parbox ltx_align_top" style="width:324.5pt;">
<span id="A2.SS1.p1.pic1.p1" class="ltx_para ltx_noindent">
<span id="A2.SS1.p1.pic1.p1.1" class="ltx_p">You are given a user question and two responses from two AI assistants. Your task is to act as an impartial judge and evaluate which response better follows the user’s instructions and provides a higher-quality answer.</span>
</span></span></span></span>
<span id="A2.SS1.p1.pic1.1.2" class="ltx_p" style="width:324.5pt;"><span id="A2.SS1.p1.pic1.1.2.1" class="ltx_text ltx_verbatim ltx_font_typewriter ltx_inline-block" style="width:324.5pt;--ltx-fg-color:#000000;"><span id="A2.SS1.p1.pic1.1.2.1.1" class="ltx_inline-logical-block ltx_parbox ltx_pruned_first ltx_align_top" style="width:324.5pt;"></span></span></span>
<span id="A2.SS1.p1.pic1.1.3" class="ltx_p" style="width:324.5pt;"><span id="A2.SS1.p1.pic1.1.3.1" class="ltx_text ltx_verbatim ltx_font_typewriter ltx_inline-block" style="width:324.5pt;--ltx-fg-color:#000000;"><span id="A2.SS1.p1.pic1.1.3.1.1" class="ltx_text ltx_inline-block" style="width:0.0pt;"> </span><span id="A2.SS1.p1.pic1.1.3.1.2" class="ltx_text ltx_inline-block" style="width:0.0pt;"> </span><span id="A2.SS1.p1.pic1.1.3.1.3" class="ltx_inline-logical-block ltx_parbox ltx_align_top" style="width:324.5pt;">
<span id="A2.SS1.p1.pic1.p3" class="ltx_para ltx_noindent">
<span id="A2.SS1.p1.pic1.p3.1" class="ltx_p">Think carefully about how to assess the quality of the responses, and enclose your reasoning within &lt;think&gt; and &lt;/think&gt; tags. Your reasoning should include your evaluation criteria, a clear understanding of what an ideal response would look like for this particular question, and a concrete example of such an ideal or reference answer if possible. Then compare both assistants’ responses to your ideal or reference answer, explaining how each aligns with or deviates from your expectations. Be specific and avoid vague or overly general judgments. Remain as objective as possible.</span>
</span></span></span></span>
<span id="A2.SS1.p1.pic1.1.4" class="ltx_p" style="width:324.5pt;"><span id="A2.SS1.p1.pic1.1.4.1" class="ltx_text ltx_verbatim ltx_font_typewriter ltx_inline-block" style="width:324.5pt;--ltx-fg-color:#000000;"><span id="A2.SS1.p1.pic1.1.4.1.1" class="ltx_inline-logical-block ltx_parbox ltx_pruned_first ltx_align_top" style="width:324.5pt;"></span></span></span>
