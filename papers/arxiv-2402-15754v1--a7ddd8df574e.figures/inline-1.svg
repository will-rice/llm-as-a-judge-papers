<span id="A8.F10.pic1.1" class="ltx_inline-block ltx_minipage ltx_align_bottom" style="width:44.18em;">
<span id="A8.F10.pic1.1.1" class="ltx_p"><span id="A8.F10.pic1.1.1.1" class="ltx_text ltx_font_bold" style="--ltx-fg-color:#000000;">A) Generic template for Hierarchical Criteria Decomposition<span id="A8.F10.pic1.1.1.1.1" class="ltx_text ltx_font_medium"> 
<br class="ltx_break">
<br class="ltx_break">I would like to perform automatic evaluation on quality of <span id="A8.F10.pic1.1.1.1.1.1" class="ltx_text" style="--ltx-fg-color:#BF0040;">[Evaluation Task]</span>. 
<br class="ltx_break"></span></span></span>
<span id="A8.F10.pic1.1.2" class="ltx_p"><span id="A8.F10.pic1.1.2.1" class="ltx_text" style="--ltx-fg-color:#0000FF;">[Backgrounds and Definitions of Evaluation Task]<span id="A8.F10.pic1.1.2.1.1" class="ltx_text" style="--ltx-fg-color:#000000;">. 
<br class="ltx_break"></span></span></span>
<span id="A8.F10.pic1.1.3" class="ltx_p"><span id="A8.F10.pic1.1.3.1" class="ltx_text" style="--ltx-fg-color:#000000;">I would like to to evaluate <span id="A8.F10.pic1.1.3.1.1" class="ltx_text" style="--ltx-fg-color:#BF0040;">[List of Criteria to Decompose]</span>. 
<br class="ltx_break"></span></span>
<span id="A8.F10.pic1.1.4" class="ltx_p"><span id="A8.F10.pic1.1.4.1" class="ltx_text" style="--ltx-fg-color:#000000;">Please give me around <span id="A8.F10.pic1.1.4.1.1" class="ltx_text" style="--ltx-fg-color:#BF0040;">[Desired Child Count]</span> fine-grained evaluation critics to evaluate them. I want to obtain a final comprehensive evaluation based on an overall aggregation on fine-grained metrics. With the fine-grained metrics, I can better dispatch the evaluation task to different workers and make a better overall efficiency and accuracy. 
<br class="ltx_break"></span></span>
<span id="A8.F10.pic1.1.5" class="ltx_p"><span id="A8.F10.pic1.1.5.1" class="ltx_text ltx_font_bold" style="--ltx-fg-color:#000000;">B) An example use case for SummEval
<br class="ltx_break">
<br class="ltx_break"><span id="A8.F10.pic1.1.5.1.1" class="ltx_text ltx_font_medium">I would like to perform automatic evaluation on quality of <span id="A8.F10.pic1.1.5.1.1.1" class="ltx_text" style="--ltx-fg-color:#BF0040;">text summarization</span>. 
<br class="ltx_break"></span></span></span>
<span id="A8.F10.pic1.1.6" class="ltx_p"><span id="A8.F10.pic1.1.6.1" class="ltx_text" style="--ltx-fg-color:#0000FF;">A text summarization is a shorter passage that encompasses the key details of original article but much shorter. 
<br class="ltx_break"></span></span>
<span id="A8.F10.pic1.1.7" class="ltx_p"><span id="A8.F10.pic1.1.7.1" class="ltx_text" style="--ltx-fg-color:#000000;">I would like to to evaluate its <span id="A8.F10.pic1.1.7.1.1" class="ltx_text" style="--ltx-fg-color:#BF0040;">coherence, consistency, fluency, and relevance</span>. 
<br class="ltx_break"></span></span>
<span id="A8.F10.pic1.1.8" class="ltx_p"><span id="A8.F10.pic1.1.8.1" class="ltx_text" style="--ltx-fg-color:#000000;">Please give me around <span id="A8.F10.pic1.1.8.1.1" class="ltx_text" style="--ltx-fg-color:#BF0040;">10-15</span> fine-grained evaluation critics to evaluate them. I want to obtain a final comprehensive evaluation based on an overall aggregation on fine-grained metrics. With the fine-grained metrics, I can better dispatch the evaluation task to different workers and make a better overall efficiency and accuracy.</span></span>
</span></span></span></foreignobject></g></g></svg>