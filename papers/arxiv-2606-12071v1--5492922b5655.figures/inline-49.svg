<span id="A1.SS5.p1.pic1.2.1" class="ltx_p"><span id="A1.SS5.p1.pic1.2.1.1" class="ltx_text ltx_font_sansserif ltx_font_bold" style="--ltx-fg-color:#000000;">BACKGROUND PAPER</span><span id="A1.SS5.p1.pic1.2.1.2" class="ltx_text" style="--ltx-fg-color:#000000;"> 
<br class="ltx_break"><span id="A1.SS5.p1.pic1.2.1.2.1" class="ltx_text ltx_font_bold">Title:</span> DeepSeek-R1: Incentivizing Reasoning Capability in LLMs via Reinforcement Learning 
<br class="ltx_break"><span id="A1.SS5.p1.pic1.2.1.2.2" class="ltx_text ltx_font_bold">Abstract (Summarized):</span> 
<br class="ltx_break">This paper demonstrates that pure reinforcement learning (RL), without human-annotated data, can incentivize advanced, emergent reasoning capabilities (e.g., self-reflection, verification) in Large Language Models. The resulting models achieve superior performance on verifiable tasks like math and coding, and their learned reasoning patterns can be successfully distilled into smaller models.</span></span>
</span></span></span></foreignobject></g><g fill-opacity="1.0" transform="matrix(1.0 0.0 0.0 1.0 21.65 665.43)"><foreignobject style="--ltx-fo-width:43.85em;--ltx-fo-height:14.95em;--ltx-fo-depth:47.09em;font-size:10pt;" height="858.46" overflow="visible" transform="matrix(1 0 0 -1 0 206.81)" width="606.76"><span class="ltx_foreignobject_container"><span class="ltx_foreignobject_content"><span id="A1.SS5.p1.pic1.3" class="ltx_inline-logical-block ltx_minipage ltx_align_bottom" style="width:43.85em;">
