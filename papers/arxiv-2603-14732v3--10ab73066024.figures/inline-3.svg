<span id="S5.F16.pic1.2.1" class="ltx_p"><span id="S5.F16.pic1.2.1.1" class="ltx_text ltx_font_bold" style="font-size:90%;--ltx-fg-color:#000000;">Q3.<span id="S5.F16.pic1.2.1.1.1" class="ltx_text ltx_font_medium"> A host pours wine remnants into a jug and inserts a cork (<math id="S5.F16.pic1.m1" class="ltx_Math" alttext="2.00\;\mathrm{cm}" display="inline" intent=":literal"><semantics><mrow><mn style="--ltx-fg-color:#000000;" mathcolor="#000000">2.00</mn><mo lspace="0.280em" rspace="0em">​</mo><mi style="--ltx-fg-color:#000000;" mathcolor="#000000">cm</mi></mrow><annotation encoding="application/x-tex">2.00\;\mathrm{cm}</annotation></semantics></math> diameter) in direct contact with the wine. Find the force on the cork.
<br class="ltx_break"><span id="S5.F16.pic1.2.1.1.1.1" class="ltx_text ltx_font_italic">Solution:</span> <math id="S5.F16.pic1.m2" class="ltx_Math" alttext="5.76\times 10^{3}\;\mathrm{N}" display="inline" intent=":literal"><semantics><mrow><mrow><mn style="--ltx-fg-color:#000000;" mathcolor="#000000">5.76</mn><mo style="--ltx-fg-color:#000000;" lspace="0.222em" mathcolor="#000000" rspace="0.222em">×</mo><msup><mn style="--ltx-fg-color:#000000;" mathcolor="#000000">10</mn><mn style="--ltx-fg-color:#000000;" mathcolor="#000000">3</mn></msup></mrow><mo lspace="0em" rspace="0em">​</mo><mi style="--ltx-fg-color:#000000;" mathcolor="#000000" mathvariant="normal">N</mi></mrow><annotation encoding="application/x-tex">5.76\times 10^{3}\;\mathrm{N}</annotation></semantics></math> (1 mark)
<br class="ltx_break" style="--ltx-break-space:4.0pt;">
</span>Q4.<span id="S5.F16.pic1.2.1.1.2" class="ltx_text ltx_font_medium"> Ali uses a hot water bottle to keep warm and decides to switch to a heated seed pack. Suggest how a fair comparison could be made.
