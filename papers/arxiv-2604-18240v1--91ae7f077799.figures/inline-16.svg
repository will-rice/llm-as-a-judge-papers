<span id="A1.SS11.SSS3.p8.pic1.1" class="ltx_inline-block ltx_minipage ltx_align_bottom" style="width:38.4em;">
<span id="A1.SS11.SSS3.p8.pic1.1.1" class="ltx_p"><span id="A1.SS11.SSS3.p8.pic1.1.1.1" class="ltx_text ltx_font_bold" style="--ltx-fg-color:#000000;">Agent-as-a-Judge Prompt (Observation)</span></span>
</span></span></span></foreignobject></g><g fill-opacity="1.0" transform="matrix(1.0 0.0 0.0 1.0 21.07 15.89)"><foreignobject style="--ltx-fo-width:44.16em;--ltx-fo-height:17.55em;--ltx-fo-depth:0.19em;font-size:10pt;" height="245.53" overflow="visible" transform="matrix(1 0 0 -1 0 242.84)" width="611.05"><span class="ltx_foreignobject_container"><span class="ltx_foreignobject_content">
<span id="A1.SS11.SSS3.p8.pic1.2" class="ltx_inline-block ltx_minipage ltx_align_bottom" style="width:44.16em;">
<span id="A1.SS11.SSS3.p8.pic1.2.1" class="ltx_p"><span id="A1.SS11.SSS3.p8.pic1.2.1.1" class="ltx_text" style="--ltx-fg-color:#000000;">Environment returned {observation_type}: {observation}</span></span>
<span id="A1.SS11.SSS3.p8.pic1.2.2" class="ltx_p"><span id="A1.SS11.SSS3.p8.pic1.2.2.1" class="ltx_text" style="--ltx-fg-color:#000000;">Based on this observation, choose your next action:
<br class="ltx_break">ACTION: {{&quot;action_type&quot;: &quot;ACTION_TYPE&quot;, &quot;param1&quot;: value1, &quot;param2&quot;: value2}}
<br class="ltx_break">REASONING: [explanation of your decision based on the observation]</span></span>
<span id="A1.SS11.SSS3.p8.pic1.2.3" class="ltx_p"><span id="A1.SS11.SSS3.p8.pic1.2.3.1" class="ltx_text" style="--ltx-fg-color:#000000;">Provide only one action per response. Avoid providing multiple ACTION lines. The system executes one action at a time, and you will receive the result before choosing the next action.</span></span>
<span id="A1.SS11.SSS3.p8.pic1.2.4" class="ltx_p"><span id="A1.SS11.SSS3.p8.pic1.2.4.1" class="ltx_text" style="--ltx-fg-color:#000000;">Remember to use the exact action_type values from the available actions list.
<br class="ltx_break"></span></span>
<span id="A1.SS11.SSS3.p8.pic1.2.5" class="ltx_p"><span id="A1.SS11.SSS3.p8.pic1.2.5.1" class="ltx_text" style="--ltx-fg-color:#000000;">CRITICAL COORDINATE USAGE:
<br class="ltx_break">- Avoid guessing generic positions like (960,540) unless they are within a valid node from the current tree.
<br class="ltx_break">- If your last action had no effect, re-check the target node bounds in the current environment’s tree and try again precisely.
<br class="ltx_break"></span></span>
<span id="A1.SS11.SSS3.p8.pic1.2.6" class="ltx_p"><span id="A1.SS11.SSS3.p8.pic1.2.6.1" class="ltx_text" style="--ltx-fg-color:#000000;">TRUNCATION CHECK:
<br class="ltx_break">- If observation contains &quot;[TRUNCATED_WARNING]&quot;, tree is truncated and may be missing end content. Do NOT make any assumptions.</span></span>
</span></span></span></foreignobject></g></g></svg>