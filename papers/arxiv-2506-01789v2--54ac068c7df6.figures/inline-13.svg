<span id="A2.SS7.SSS1.p1.pic1.2" class="ltx_inline-block ltx_minipage ltx_align_bottom" style="width:31.37em;">
<span id="A2.SS7.SSS1.p1.pic1.2.1" class="ltx_p"><span id="A2.SS7.SSS1.p1.pic1.2.1.1" class="ltx_text" style="--ltx-fg-color:#000000;">### INSTRUCTION
<br class="ltx_break">Carefully evaluate the quality and characteristics of the **new datasets** introduced in the paper using the rubric provided below. 
<br class="ltx_break"></span></span>
<span id="A2.SS7.SSS1.p1.pic1.2.2" class="ltx_p"><span id="A2.SS7.SSS1.p1.pic1.2.2.1" class="ltx_text" style="--ltx-fg-color:#000000;">Please follow these rules: 
<br class="ltx_break">- **Only assess new datasets** that are introduced by the authors. Do **not** evaluate any pre-existing datasets mentioned in the paper. 
<br class="ltx_break">- Base your judgments **strictly on the content of the paper**. Do **not** infer or speculate beyond what is explicitly stated. 
<br class="ltx_break">- Use the rubric definitions to guide your labeling. Provide clear references and reasoning wherever applicable. 
<br class="ltx_break"></span></span>
<span id="A2.SS7.SSS1.p1.pic1.2.3" class="ltx_p"><span id="A2.SS7.SSS1.p1.pic1.2.3.1" class="ltx_text" style="--ltx-fg-color:#000000;">### PAPER
<br class="ltx_break">{{ paper_text }} 
<br class="ltx_break"></span></span>
<span id="A2.SS7.SSS1.p1.pic1.2.4" class="ltx_p"><span id="A2.SS7.SSS1.p1.pic1.2.4.1" class="ltx_text" style="--ltx-fg-color:#000000;">### RUBRIC 
<br class="ltx_break">Metric: Reproducibility 
<br class="ltx_break">Description: This metric pertains to whether the code used for constructing the dataset is made publicly available or not for reproducibility and evaluates the transparency and completeness of the dataset creation documentation, which is crucial for reproducibility, ethical assessment, and downstream usability. 
<br class="ltx_break"></span></span>
