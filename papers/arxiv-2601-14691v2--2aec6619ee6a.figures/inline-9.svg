<span id="A4.F14.pic1.2" class="ltx_inline-block ltx_minipage ltx_align_bottom" style="width:36.62em;">
<span id="A4.F14.pic1.2.1" class="ltx_p"><span id="A4.F14.pic1.2.1.1" class="ltx_text" style="--ltx-fg-color:#000000;">You are an expert in evaluating the performance of a web navigation agent.
The agent is designed to help a human user navigate a website to complete a task.
Given the user’s task, the agent’s action history, agent’s thoughts, and
screenshots of web pages along the agent’s trajectory, your goal is to determine
whether the agent has successfully completed the task.</span></span>
<span id="A4.F14.pic1.2.2" class="ltx_p"><span id="A4.F14.pic1.2.2.1" class="ltx_text" style="--ltx-fg-color:#000000;">You MUST ground your decision on the agent’s actions and the screenshots of web pages along the agent’s trajectory. You should not blindly trust the agent’s thoughts as they may be incorrect or misleading.</span></span>
<span id="A4.F14.pic1.2.3" class="ltx_p"><span id="A4.F14.pic1.2.3.1" class="ltx_text" style="--ltx-fg-color:#000000;">Format your response as follows: 
<br class="ltx_break"><math id="A4.F14.pic1.m1" class="ltx_Math" alttext="&lt;" display="inline" intent=":literal"><semantics><mo style="--ltx-fg-color:#000000;" mathcolor="#000000">&lt;</mo><annotation encoding="application/x-tex">&lt;</annotation></semantics></math>your thoughts and reasoning process about the task and the agent’s actions<math id="A4.F14.pic1.m2" class="ltx_Math" alttext="&gt;" display="inline" intent=":literal"><semantics><mo style="--ltx-fg-color:#000000;" mathcolor="#000000">&gt;</mo><annotation encoding="application/x-tex">&gt;</annotation></semantics></math> 
<br class="ltx_break"><span id="A4.F14.pic1.2.3.1.1" class="ltx_text ltx_font_bold">Status: success or failure</span></span></span>
<span id="A4.F14.pic1.2.4" class="ltx_p"><span id="A4.F14.pic1.2.4.1" class="ltx_text ltx_font_bold" style="--ltx-fg-color:#000000;">User Task:<span id="A4.F14.pic1.2.4.1.1" class="ltx_text ltx_font_medium"> <span id="A4.F14.pic1.2.4.1.1.1" class="ltx_text ltx_font_typewriter">{task}</span></span></span></span>
<span id="A4.F14.pic1.2.5" class="ltx_p"><span id="A4.F14.pic1.2.5.1" class="ltx_text ltx_font_bold" style="--ltx-fg-color:#000000;">Agent Thoughts and Actions:<span id="A4.F14.pic1.2.5.1.1" class="ltx_text ltx_font_medium"> 
<br class="ltx_break"><span id="A4.F14.pic1.2.5.1.1.1" class="ltx_text ltx_font_typewriter">{agent_action_history}</span></span></span></span>
<span id="A4.F14.pic1.2.6" class="ltx_p"><span id="A4.F14.pic1.2.6.1" class="ltx_text" style="--ltx-fg-color:#000000;">Below are screenshots of the agent’s navigation trajectory. 
<br class="ltx_break"><span id="A4.F14.pic1.2.6.1.1" class="ltx_text ltx_font_typewriter">{screenshots}</span></span></span>
