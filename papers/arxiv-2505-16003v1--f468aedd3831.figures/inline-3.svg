<span id="A1.SS3.p1.pic1.1" class="ltx_inline-block ltx_minipage ltx_align_bottom" style="width:44.07em;">
<span id="A1.SS3.p1.pic1.1.1" class="ltx_p"><span id="A1.SS3.p1.pic1.1.1.1" class="ltx_text" style="--ltx-fg-color:#FFFFFF;">Evaluator Instructions</span></span>
</span></span></span></foreignobject></g><g fill-opacity="1.0" transform="matrix(1.0 0.0 0.0 1.0 21.65 16.47)"><foreignobject style="--ltx-fo-width:44.07em;--ltx-fo-height:13.89em;--ltx-fo-depth:0.19em;font-size:10pt;" height="194.95" overflow="visible" transform="matrix(1 0 0 -1 0 192.26)" width="609.8"><span class="ltx_foreignobject_container"><span class="ltx_foreignobject_content">
<span id="A1.SS3.p1.pic1.2" class="ltx_inline-block ltx_minipage ltx_align_bottom" style="width:44.07em;">
<span id="A1.SS3.p1.pic1.2.1" class="ltx_p"><span id="A1.SS3.p1.pic1.2.1.1" class="ltx_text" style="--ltx-fg-color:#000000;">Please act as an impartial judge and evaluate the quality of the responses provided by two AI assistants to the user question displayed below. You should choose the assistant that follows the user’s instructions and answers the user’s question better.</span></span>
<span id="A1.SS3.p1.pic1.2.2" class="ltx_p"><span id="A1.SS3.p1.pic1.2.2.1" class="ltx_text" style="--ltx-fg-color:#000000;">Your evaluation should consider factors such as the clarity, intelligence, likability, trustworthiness, and level of detail of their responses.</span></span>
<span id="A1.SS3.p1.pic1.2.3" class="ltx_p"><span id="A1.SS3.p1.pic1.2.3.1" class="ltx_text" style="--ltx-fg-color:#000000;">Begin your evaluation by comparing the two responses and provide a short explanation. Avoid any position biases and ensure that the order in which the responses were presented does not influence your decision.</span></span>
<span id="A1.SS3.p1.pic1.2.4" class="ltx_p"><span id="A1.SS3.p1.pic1.2.4.1" class="ltx_text" style="--ltx-fg-color:#000000;">Do not allow the length of the responses to influence your evaluation. Do not favor certain names of the assistants. Be as objective as possible.</span></span>
<span id="A1.SS3.p1.pic1.2.5" class="ltx_p"><span id="A1.SS3.p1.pic1.2.5.1" class="ltx_text" style="--ltx-fg-color:#000000;">Each assistant receives an overall score on a scale of 1 to 10, where a higher score indicates a better response.</span></span>
</span></span></span></foreignobject></g></g></svg>