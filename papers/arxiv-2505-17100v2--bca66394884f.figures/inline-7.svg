<svg id="A5.SS5.p1.pic1" class="ltx_picture" height="439.9" overflow="visible" version="1.1" viewbox="0 0 477.38 439.9" width="477.38"><g style="--ltx-stroke-color:#000000;--ltx-fill-color:#000000;" fill="#000000" stroke="#000000" stroke-width="0.4pt" transform="translate(0,439.9) matrix(1 0 0 -1 0 0)"><g style="--ltx-fill-color:#333333;" fill="#333333" fill-opacity="1.0"><path style="stroke:none" d="M 0 5.91 L 0 434 C 0 437.26 2.64 439.9 5.91 439.9 L 471.47 439.9 C 474.73 439.9 477.38 437.26 477.38 434 L 477.38 5.91 C 477.38 2.64 474.73 0 471.47 0 L 5.91 0 C 2.64 0 0 2.64 0 5.91 Z" /></g><g style="--ltx-fill-color:#F9F9F9;" fill="#F9F9F9" fill-opacity="1.0"><path style="stroke:none" d="M 1.97 5.91 L 1.97 434 C 1.97 436.17 3.73 437.93 5.91 437.93 L 471.47 437.93 C 473.65 437.93 475.41 436.17 475.41 434 L 475.41 5.91 C 475.41 3.73 473.65 1.97 471.47 1.97 L 5.91 1.97 C 3.73 1.97 1.97 3.73 1.97 5.91 Z" /></g><g fill-opacity="1.0" transform="matrix(1.0 0.0 0.0 1.0 21.65 17.24)"><foreignobject style="--ltx-fo-width:31.37em;--ltx-fo-height:29.55em;--ltx-fo-depth:0.25em;font-size:10pt;" height="412.35" overflow="visible" transform="matrix(1 0 0 -1 0 408.89)" width="434.07"><span class="ltx_foreignobject_container"><span class="ltx_foreignobject_content">
<span id="A5.SS5.p1.pic1.1" class="ltx_inline-block ltx_minipage ltx_align_bottom" style="width:31.37em;">
<span id="A5.SS5.p1.pic1.1.1" class="ltx_p"><span id="A5.SS5.p1.pic1.1.1.1" class="ltx_text" style="--ltx-fg-color:#000000;">You are given an instruction and {# options} outputs, along with your prior evaluation result and a bias analysis.
<br class="ltx_break"></span></span>
<span id="A5.SS5.p1.pic1.1.2" class="ltx_p"><span id="A5.SS5.p1.pic1.1.2.1" class="ltx_text" style="--ltx-fg-color:#000000;">Your task is to reconsider and make a final decision on which output – {option index} – better follows and correctly completes the given instruction, based on the prior evaluation results and the provided bias analysis.
<br class="ltx_break"></span></span>
<span id="A5.SS5.p1.pic1.1.3" class="ltx_p"><span id="A5.SS5.p1.pic1.1.3.1" class="ltx_text" style="--ltx-fg-color:#000000;">Please follow these rules during your re-evaluation:</span></span>
<span id="A5.SS5.p1.pic1.1.4" class="ltx_p"><span id="A5.SS5.p1.pic1.1.4.1" class="ltx_text" style="--ltx-fg-color:#000000;">(1) Your primary objective is to judge which output more faithfully and correctly follows the instruction.</span></span>
<span id="A5.SS5.p1.pic1.1.5" class="ltx_p"><span id="A5.SS5.p1.pic1.1.5.1" class="ltx_text" style="--ltx-fg-color:#000000;">(2) You should avoid any potential bias and your judgment should be as objective as possible. For example, the order in which the outputs are presented should NOT affect your judgment – Output (a) and Output (b) are equally likely to be better.</span></span>
<span id="A5.SS5.p1.pic1.1.6" class="ltx_p"><span id="A5.SS5.p1.pic1.1.6.1" class="ltx_text" style="--ltx-fg-color:#000000;">(3) The bias detection results are for reference – you may consider them when deciding whether the previous choice was affected by bias, but your final judgment should be your own.
<br class="ltx_break"></span></span>
<span id="A5.SS5.p1.pic1.1.7" class="ltx_p"><span id="A5.SS5.p1.pic1.1.7.1" class="ltx_text" style="--ltx-fg-color:#000000;">Do NOT provide any explanation for your choice.</span></span>
<span id="A5.SS5.p1.pic1.1.8" class="ltx_p"><span id="A5.SS5.p1.pic1.1.8.1" class="ltx_text" style="--ltx-fg-color:#000000;">Do NOT say both / neither are better.
Your response should be only &quot;Output (a)&quot; or &quot;Output (b)&quot;. Do NOT output any other text.
<br class="ltx_break"></span></span>
<span id="A5.SS5.p1.pic1.1.9" class="ltx_p"><span id="A5.SS5.p1.pic1.1.9.1" class="ltx_text" style="--ltx-fg-color:#000000;">### Instruction: {input}</span></span>
<span id="A5.SS5.p1.pic1.1.10" class="ltx_p"><span id="A5.SS5.p1.pic1.1.10.1" class="ltx_text" style="--ltx-fg-color:#000000;">### Outputs: {options}</span></span>
<span id="A5.SS5.p1.pic1.1.11" class="ltx_p"><span id="A5.SS5.p1.pic1.1.11.1" class="ltx_text" style="--ltx-fg-color:#000000;">### Prior Evaluation Result: {LLM previous evaluation}
<br class="ltx_break"></span></span>
<span id="A5.SS5.p1.pic1.1.12" class="ltx_p"><span id="A5.SS5.p1.pic1.1.12.1" class="ltx_text" style="--ltx-fg-color:#000000;">### Bias Analysis:
{RBD output}
<br class="ltx_break"></span></span>
<span id="A5.SS5.p1.pic1.1.13" class="ltx_p"><span id="A5.SS5.p1.pic1.1.13.1" class="ltx_text" style="--ltx-fg-color:#000000;"># After reconsideration, which is better, Output (a) or Output (b)? Your response should be either &quot;Output (a)&quot; or &quot;Output (b)&quot;.</span></span>
</span></span></span></foreignobject></g></g></svg>