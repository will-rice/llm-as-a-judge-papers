<svg id="A11.F11.pic1" class="ltx_picture ltx_centering" height="220.02" overflow="visible" version="1.1" viewbox="0 0 653.15 220.02" width="653.15"><g style="--ltx-stroke-color:#000000;--ltx-fill-color:#000000;" fill="#000000" stroke="#000000" stroke-width="0.4pt" transform="translate(0,220.02) matrix(1 0 0 -1 0 0)"><g style="--ltx-fill-color:#000099;" fill="#000099" fill-opacity="1.0"><path style="stroke:none" d="M 0 0 L 0 220.02 L 653.15 220.02 L 653.15 0 Z" /></g><g style="--ltx-fill-color:#FAFAFF;" fill="#FAFAFF" fill-opacity="1.0"><path style="stroke:none" d="M 1.11 1.11 L 1.11 218.91 L 652.04 218.91 L 652.04 1.11 Z" /></g><g fill-opacity="1.0" transform="matrix(1.0 0.0 0.0 1.0 20.79 15.99)"><foreignobject style="--ltx-fo-width:42.1em;--ltx-fo-height:13.81em;--ltx-fo-depth:0.22em;font-size:10pt;" height="194.18" overflow="visible" transform="matrix(1 0 0 -1 0 191.11)" width="582.55"><span class="ltx_foreignobject_container"><span class="ltx_foreignobject_content">
<span id="A11.F11.pic1.1" class="ltx_inline-block ltx_minipage ltx_align_bottom" style="width:42.1em;">
<span id="A11.F11.pic1.1.1" class="ltx_p"><span id="A11.F11.pic1.1.1.1" class="ltx_text ltx_font_typewriter" style="--ltx-fg-color:#000000;">Generate a prompt for an evaluator that includes example-specific evaluation criteria and step-by-step evaluation procedures. The evaluator will base their evaluation on the prompt and it will help the evaluator accurately judge the correctness and reasoning quality of given responses, and identify which answer is better. 
<br class="ltx_break"></span></span>
<span id="A11.F11.pic1.1.2" class="ltx_p"><span id="A11.F11.pic1.1.2.1" class="ltx_text ltx_font_typewriter" style="--ltx-fg-color:#000000;">Generated evaluation prompt MUST include 
<br class="ltx_break">- evaluation criteria specific for the given example 
<br class="ltx_break">- evaluation steps specific for the given example to induce an accurate and reliable judgment. 
<br class="ltx_break"></span></span>
<span id="A11.F11.pic1.1.3" class="ltx_p"><span id="A11.F11.pic1.1.3.1" class="ltx_text ltx_font_typewriter" style="--ltx-fg-color:#000000;">Additionally, the evaluation prompt MUST instruct the evaluator that their final judgment must be expressed only in one of the following two formats: 
<br class="ltx_break">‘[[A]]’ or ‘[[B]]’. 
<br class="ltx_break"></span></span>
<span id="A11.F11.pic1.1.4" class="ltx_p"><span id="A11.F11.pic1.1.4.1" class="ltx_text ltx_font_typewriter" style="--ltx-fg-color:#000000;">Output exactly ONLY THE PROMPT. 
<br class="ltx_break"></span></span>
</span></span></span></foreignobject></g></g></svg>