<span id="A5.p5.pic1.1.1" class="ltx_p"><span id="A5.p5.pic1.1.1.1" class="ltx_text ltx_font_bold" style="--ltx-fg-color:#000000;">(2-b) LLM-Judge: UQBench Correctness Prompt</span></span>
</span></span></span></foreignobject></g><g fill-opacity="1.0" transform="matrix(1.0 0.0 0.0 1.0 9.49 12.16)"><foreignobject style="--ltx-fo-width:33.13em;--ltx-fo-height:46.08em;--ltx-fo-depth:0.25em;font-size:10pt;" height="641.05" overflow="visible" transform="matrix(1 0 0 -1 0 637.59)" width="458.43"><span class="ltx_foreignobject_container"><span class="ltx_foreignobject_content">
<span id="A5.p5.pic1.2" class="ltx_inline-block ltx_minipage ltx_align_bottom" style="width:33.13em;">
<span id="A5.p5.pic1.2.1" class="ltx_p"><span id="A5.p5.pic1.2.1.1" class="ltx_text" style="--ltx-fg-color:#000000;">Please act as an impartial judge and evaluate whether the AI assistant’s response is completely correct in both process and conclusion. Consider correctness, usefulness, completeness, and depth in your assessment. Consider whether this answer completely solves the user’s question. You should rely on your own reasoning to form a reference or partial solution first and compare the AI assistant’s response to your reasoning. Begin your evaluation by giving a brief summary of your thoughts on the response. Focus on whether it is accurate, addresses the question well, and is reasonably detailed. Be precise about any errors or gaps you notice. Keep your explanation unbiased and do not let any external factors or the question’s difficulty level sway your evaluation.</span></span>
<span id="A5.p5.pic1.2.2" class="ltx_p"><span id="A5.p5.pic1.2.2.1" class="ltx_text ltx_font_bold" style="--ltx-fg-color:#000000;">Notes:<span id="A5.p5.pic1.2.2.1.1" class="ltx_text"></span></span></span>
<span id="A5.I8" class="ltx_enumerate ltx_leftmargin_flush">
<span id="A5.I8.i1" class="ltx_item" style="list-style-type:none;"><span class="ltx_tag ltx_tag_item">1.</span> 
<span id="A5.I8.i1.p1" class="ltx_para">
<span id="A5.I8.i1.p1.1" class="ltx_p"><span id="A5.I8.i1.p1.1.1" class="ltx_text" style="--ltx-fg-color:#000000;">If the answer is partial, high-level, or just states that this is an open problem, you should not accept it.</span></span>
</span></span>
<span id="A5.I8.i2" class="ltx_item" style="list-style-type:none;"><span class="ltx_tag ltx_tag_item">2.</span> 
<span id="A5.I8.i2.p1" class="ltx_para">
<span id="A5.I8.i2.p1.1" class="ltx_p"><span id="A5.I8.i2.p1.1.1" class="ltx_text" style="--ltx-fg-color:#000000;">If the answer lacks details or is not comprehensive, you should not accept it.</span></span>
</span></span>
<span id="A5.I8.i3" class="ltx_item" style="list-style-type:none;"><span class="ltx_tag ltx_tag_item">3.</span> 
<span id="A5.I8.i3.p1" class="ltx_para">
<span id="A5.I8.i3.p1.1" class="ltx_p"><span id="A5.I8.i3.p1.1.1" class="ltx_text" style="--ltx-fg-color:#000000;">If the answer contains any errors, you should not accept it.</span></span>
</span></span>
<span id="A5.I8.i4" class="ltx_item" style="list-style-type:none;"><span class="ltx_tag ltx_tag_item">4.</span> 
<span id="A5.I8.i4.p1" class="ltx_para">
<span id="A5.I8.i4.p1.1" class="ltx_p"><span id="A5.I8.i4.p1.1.1" class="ltx_text" style="--ltx-fg-color:#000000;">You should only accept the answer if it is at least 95%.</span></span>
</span></span>
<span id="A5.I8.i5" class="ltx_item" style="list-style-type:none;"><span class="ltx_tag ltx_tag_item">5.</span> 
<span id="A5.I8.i5.p1" class="ltx_para">
<span id="A5.I8.i5.p1.1" class="ltx_p"><span id="A5.I8.i5.p1.1.1" class="ltx_text" style="--ltx-fg-color:#000000;">If the question is a puzzle, the requirement of completeness can be appropriately relaxed.</span></span>
</span></span>
</span>
<span id="A5.p5.pic1.2.3" class="ltx_p"><span id="A5.p5.pic1.2.3.1" class="ltx_text" style="--ltx-fg-color:#000000;">After providing your explanation, please decide whether this answer is the correct answer to the question. Think twice about whether this answer solves the user’s question.</span></span>
<span id="A5.p5.pic1.2.4" class="ltx_p"><span id="A5.p5.pic1.2.4.1" class="ltx_text" style="--ltx-fg-color:#000000;">You must strictly follow this format: <code id="A5.p5.pic1.2.4.1.1" class="ltx_verbatim ltx_font_typewriter">Accepted: [[Y]]</code> if you decide to accept the answer or <code id="A5.p5.pic1.2.4.1.2" class="ltx_verbatim ltx_font_typewriter">Accepted: [[N]]</code> if you decide not to accept the answer.</span></span><span class="ltx_rule" style="width:100%;height:1px;--ltx-fg-color:#000000;--ltx-bg-color:#000000;display:inline-block;"> </span>
<span id="A5.p5.pic1.2.5" class="ltx_p"><span id="A5.p5.pic1.2.5.1" class="ltx_text ltx_font_bold" style="--ltx-fg-color:#000000;">[Question]
<br class="ltx_break">Question Content
<br class="ltx_break"><code id="A5.p5.pic1.2.5.1.1" class="ltx_verbatim ltx_font_typewriter ltx_font_medium">{original question}</code><span id="A5.p5.pic1.2.5.1.2" class="ltx_text"></span></span></span>
<span id="A5.p5.pic1.2.6" class="ltx_p"><span id="A5.p5.pic1.2.6.1" class="ltx_text ltx_font_bold" style="--ltx-fg-color:#000000;">[The Answer to Evaluate]
<br class="ltx_break"><code id="A5.p5.pic1.2.6.1.1" class="ltx_verbatim ltx_font_typewriter ltx_font_medium">{candidate solution}</code><span id="A5.p5.pic1.2.6.1.2" class="ltx_text"></span></span></span>
</span></span></span></foreignobject></g></g></svg>