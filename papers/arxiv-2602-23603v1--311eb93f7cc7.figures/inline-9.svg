<span id="A1.SS9.p1.pic1.2" class="ltx_inline-block ltx_minipage ltx_align_bottom" style="width:45.93em;">
<span id="A1.SS9.p1.pic1.2.1" class="ltx_p"><span id="A1.SS9.p1.pic1.2.1.1" class="ltx_text" style="font-size:90%;--ltx-fg-color:#000000;">You will be given a question. You will then be given one answer written for this question.</span></span>
<span id="A1.SS9.p1.pic1.2.2" class="ltx_p"><span id="A1.SS9.p1.pic1.2.2.1" class="ltx_text" style="font-size:90%;--ltx-fg-color:#000000;">Your task is to rate the answer on one metric.</span></span>
<span id="A1.SS9.p1.pic1.2.3" class="ltx_p"><span id="A1.SS9.p1.pic1.2.3.1" class="ltx_text" style="font-size:90%;--ltx-fg-color:#000000;">Please make sure you read and understand these instructions carefully. Please keep this document open while reviewing, and refer to it as needed.</span></span>
<span id="A1.SS9.p1.pic1.2.4" class="ltx_p"><span id="A1.SS9.p1.pic1.2.4.1" class="ltx_text" style="font-size:90%;--ltx-fg-color:#000000;">Evaluation Criteria:</span></span>
<span id="A1.SS9.p1.pic1.2.5" class="ltx_p"><span id="A1.SS9.p1.pic1.2.5.1" class="ltx_text" style="font-size:90%;--ltx-fg-color:#000000;">Completeness (1-5) - the degree to which the answer is a comprehensive encapsulation of the relevant information required by the question.
A complete answer addresses all parts of the question thoroughly, accurately captures the main points, and does not omit crucial elements.</span></span>
<span id="A1.SS9.p1.pic1.2.6" class="ltx_p"><span id="A1.SS9.p1.pic1.2.6.1" class="ltx_text" style="font-size:90%;--ltx-fg-color:#000000;">Evaluation Steps:</span></span>
<span id="A1.SS9.p1.pic1.2.7" class="ltx_p"><span id="A1.SS9.p1.pic1.2.7.1" class="ltx_text" style="font-size:90%;--ltx-fg-color:#000000;">1. Read the question carefully and identify the main aspects that must be covered for a complete response.</span></span>
<span id="A1.SS9.p1.pic1.2.8" class="ltx_p"><span id="A1.SS9.p1.pic1.2.8.1" class="ltx_text" style="font-size:90%;--ltx-fg-color:#000000;">2. Read the answer and compare it to the question. Check if the answer addresses all essential aspects, main ideas, and pertinent details required by the question.</span></span>
<span id="A1.SS9.p1.pic1.2.9" class="ltx_p"><span id="A1.SS9.p1.pic1.2.9.1" class="ltx_text" style="font-size:90%;--ltx-fg-color:#000000;">3. Assign a score for completeness based on the Evaluation Criteria.</span></span>
<span id="A1.SS9.p1.pic1.2.10" class="ltx_p"><span id="A1.SS9.p1.pic1.2.10.1" class="ltx_text" style="font-size:90%;--ltx-fg-color:#000000;">Example:</span></span>
