<span id="S5.SS2.SSS0.Px2.p2.pic1.1" class="ltx_inline-block ltx_minipage ltx_align_bottom" style="width:45.04em;">
<span id="S5.SS2.SSS0.Px2.p2.pic1.1.1" class="ltx_p"><span id="S5.SS2.SSS0.Px2.p2.pic1.1.1.1" class="ltx_text ltx_font_bold" style="--ltx-fg-color:#418FDE;">Answer to RQ2:</span><span id="S5.SS2.SSS0.Px2.p2.pic1.1.1.2" class="ltx_text" style="--ltx-fg-color:#000000;">
Overall, existing LLM-as-a-Judge models exhibit limited generalization capabilities. In particular, many models are highly sensitive to the ordering of responses in the pair-wise evaluation: their accuracy drops significantly depending on whether the good response is presented first or second. Stronger LLM-as-a-Judge models, such as Gemini-2.5-Pro, demonstrate greater robustness to such position swaps. Nevertheless, all models display considerable variability in performance when judging responses generated by different LLM Programmers. These findings highlight the importance of future research focused on improving the generalization and robustness of LLM-as-a-Judge systems.</span></span>
</span></span></span></foreignobject></g></g></svg>