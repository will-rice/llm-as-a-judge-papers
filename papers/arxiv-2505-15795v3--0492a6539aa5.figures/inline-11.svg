<span id="A7.SS3.pic2.2" class="ltx_inline-block ltx_minipage ltx_align_bottom" style="width:31.37em;">
<span id="A7.SS3.pic2.2.1" class="ltx_p"><span id="A7.SS3.pic2.2.1.1" class="ltx_text" style="font-size:80%;--ltx-fg-color:#000000;">The following are some examples of common verbs that are often confused with each other:

<br class="ltx_break">
<br class="ltx_break">1. ”Be” and ”am”: These verbs are often confused, especially in the negative form (”isn’t” vs. ”is not”). Remember that ”be” is usually used in the progressive form (”being”), while ”am” is the present tense first-person singular form of the verb ”to be.”

<br class="ltx_break">
<br class="ltx_break">2. ”Lie” and ”lay”: These verbs are often confused, especially in the past tense. ”Lie” is usually used in the intransitive sense, meaning ”to rest or be located,” while ”lay” is typically used in the transitive sense, meaning ”to place or put.”

<br class="ltx_break">
<br class="ltx_break">3. ”Rise” and ”raise”: These verbs are often confused, especially in the past tense. ”Rise” is usually used in the intransitive sense, meaning ”to rise or elevate,” while ”raise” is typically used in the transitive sense, meaning ”to lift or elevate.”

<br class="ltx_break">
<br class="ltx_break">Remember to pay attention to the context and the specific meanings of the verbs in question. Context and word choice can often clarify the intended meaning and help avoid confusion.
<span id="A7.SS3.pic2.2.1.1.1" class="ltx_text"></span></span></span>
