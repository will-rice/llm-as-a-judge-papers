<span id="A5.p1.pic1.2.1" class="ltx_p"><span id="A5.p1.pic1.2.1.1" class="ltx_text ltx_font_bold" style="--ltx-fg-color:#000000;">Input<span id="A5.p1.pic1.2.1.1.1" class="ltx_text ltx_font_medium">: content</span></span></span>
</span></span></span></foreignobject></g><g fill-opacity="1.0" transform="matrix(1.0 0.0 0.0 1.0 21.65 16.55)"><foreignobject style="--ltx-fo-width:44.07em;--ltx-fo-height:91.81em;--ltx-fo-depth:0.2em;font-size:10pt;" height="1273.17" overflow="visible" transform="matrix(1 0 0 -1 0 1270.41)" width="609.8"><span class="ltx_foreignobject_container"><span class="ltx_foreignobject_content">
<span id="A5.p1.pic1.3" class="ltx_inline-block ltx_minipage ltx_align_bottom" style="width:44.07em;">
<span id="A5.p1.pic1.3.1" class="ltx_p"><span id="A5.p1.pic1.3.1.1" class="ltx_text" style="--ltx-fg-color:#000000;">Act as a professional fiction reviewer. Evaluate the provided novel and rate it across the specified dimensions. For each dimension, assign a score between 1 and 5 and provide a brief explanation. Finally, give the fiction an overall score between 1 and 5.</span></span>
<span id="A5.p1.pic1.3.2" class="ltx_p"><span id="A5.p1.pic1.3.2.1" class="ltx_text" style="--ltx-fg-color:#000000;">[Fiction Start]</span></span>
<span id="A5.p1.pic1.3.3" class="ltx_p"><span id="A5.p1.pic1.3.3.1" class="ltx_text" style="--ltx-fg-color:#000000;">{content}</span></span>
<span id="A5.p1.pic1.3.4" class="ltx_p"><span id="A5.p1.pic1.3.4.1" class="ltx_text" style="--ltx-fg-color:#000000;">[Fiction End]</span></span>
<span id="A5.p1.pic1.3.5" class="ltx_p"><span id="A5.p1.pic1.3.5.1" class="ltx_text" style="--ltx-fg-color:#000000;">[Criteria Start]</span></span>
<span id="A5.I1" class="ltx_enumerate">
<span id="A5.I1.i1" class="ltx_item" style="list-style-type:none;"><span class="ltx_tag ltx_tag_item">1.</span> 
<span id="A5.I1.i1.p1" class="ltx_para">
<span id="A5.I1.i1.p1.1" class="ltx_p"><span id="A5.I1.i1.p1.1.1" class="ltx_text ltx_font_bold" style="--ltx-fg-color:#000000;">Plot and Structure</span></span>
<span id="A5.I1.i1.I1" class="ltx_itemize">
<span id="A5.I1.i1.I1.i1" class="ltx_item" style="list-style-type:none;"><span class="ltx_tag ltx_tag_item">•</span> 
<span id="A5.I1.i1.I1.i1.p1" class="ltx_para">
<span id="A5.I1.i1.I1.i1.p1.1" class="ltx_p"><span id="A5.I1.i1.I1.i1.p1.1.1" class="ltx_text ltx_font_bold" style="--ltx-fg-color:#000000;">Plot Compactness</span><span id="A5.I1.i1.I1.i1.p1.1.2" class="ltx_text" style="--ltx-fg-color:#000000;">: Are the plotlines cohesive and tight? Do they hold enough allure to sustain the reader’s interest?</span></span>
</span></span>
<span id="A5.I1.i1.I1.i2" class="ltx_item" style="list-style-type:none;"><span class="ltx_tag ltx_tag_item">•</span> 
<span id="A5.I1.i1.I1.i2.p1" class="ltx_para">
<span id="A5.I1.i1.I1.i2.p1.1" class="ltx_p"><span id="A5.I1.i1.I1.i2.p1.1.1" class="ltx_text ltx_font_bold" style="--ltx-fg-color:#000000;">Structural Layout</span><span id="A5.I1.i1.I1.i2.p1.1.2" class="ltx_text" style="--ltx-fg-color:#000000;">: Is the novel’s structure sound? Does it avoid dragging or feeling hollow? For medium to long-form novels, are there clear stages of exposition, rising action, climax, falling action, and resolution?</span></span>
</span></span>
<span id="A5.I1.i1.I1.i3" class="ltx_item" style="list-style-type:none;"><span class="ltx_tag ltx_tag_item">•</span> 
<span id="A5.I1.i1.I1.i3.p1" class="ltx_para">
<span id="A5.I1.i1.I1.i3.p1.1" class="ltx_p"><span id="A5.I1.i1.I1.i3.p1.1.1" class="ltx_text ltx_font_bold" style="--ltx-fg-color:#000000;">Pacing and Rhythm</span><span id="A5.I1.i1.I1.i3.p1.1.2" class="ltx_text" style="--ltx-fg-color:#000000;">: Is the progression of the story balanced? Do the unfolding events carry tension and momentum?</span></span>
</span></span>
</span>
</span></span>
<span id="A5.I1.i2" class="ltx_item" style="list-style-type:none;"><span class="ltx_tag ltx_tag_item">2.</span> 
<span id="A5.I1.i2.p1" class="ltx_para">
<span id="A5.I1.i2.p1.1" class="ltx_p"><span id="A5.I1.i2.p1.1.1" class="ltx_text ltx_font_bold" style="--ltx-fg-color:#000000;">Character Development</span></span>
<span id="A5.I1.i2.I1" class="ltx_itemize">
<span id="A5.I1.i2.I1.i1" class="ltx_item" style="list-style-type:none;"><span class="ltx_tag ltx_tag_item">•</span> 
<span id="A5.I1.i2.I1.i1.p1" class="ltx_para">
<span id="A5.I1.i2.I1.i1.p1.1" class="ltx_p"><span id="A5.I1.i2.I1.i1.p1.1.1" class="ltx_text ltx_font_bold" style="--ltx-fg-color:#000000;">Character Depth</span><span id="A5.I1.i2.I1.i1.p1.1.2" class="ltx_text" style="--ltx-fg-color:#000000;">: Are the characters well-rounded and multi-dimensional? Do they exhibit unique personalities?</span></span>
</span></span>
<span id="A5.I1.i2.I1.i2" class="ltx_item" style="list-style-type:none;"><span class="ltx_tag ltx_tag_item">•</span> 
<span id="A5.I1.i2.I1.i2.p1" class="ltx_para">
<span id="A5.I1.i2.I1.i2.p1.1" class="ltx_p"><span id="A5.I1.i2.I1.i2.p1.1.1" class="ltx_text ltx_font_bold" style="--ltx-fg-color:#000000;">Character Growth</span><span id="A5.I1.i2.I1.i2.p1.1.2" class="ltx_text" style="--ltx-fg-color:#000000;">: Does the novel convincingly portray the characters’ growth, transformations, or conflicts? Are there evident internal struggles and clear character arcs?</span></span>
</span></span>
<span id="A5.I1.i2.I1.i3" class="ltx_item" style="list-style-type:none;"><span class="ltx_tag ltx_tag_item">•</span> 
<span id="A5.I1.i2.I1.i3.p1" class="ltx_para">
<span id="A5.I1.i2.I1.i3.p1.1" class="ltx_p"><span id="A5.I1.i2.I1.i3.p1.1.1" class="ltx_text ltx_font_bold" style="--ltx-fg-color:#000000;">Character Relationships</span><span id="A5.I1.i2.I1.i3.p1.1.2" class="ltx_text" style="--ltx-fg-color:#000000;">: Are the interactions between characters natural, and do they meaningfully advance the plot?</span></span>
</span></span>
</span>
</span></span>
<span id="A5.I1.i3" class="ltx_item" style="list-style-type:none;"><span class="ltx_tag ltx_tag_item">3.</span> 
<span id="A5.I1.i3.p1" class="ltx_para">
<span id="A5.I1.i3.p1.1" class="ltx_p"><span id="A5.I1.i3.p1.1.1" class="ltx_text ltx_font_bold" style="--ltx-fg-color:#000000;">Themes and Ideas</span></span>
<span id="A5.I1.i3.I1" class="ltx_itemize">
<span id="A5.I1.i3.I1.i1" class="ltx_item" style="list-style-type:none;"><span class="ltx_tag ltx_tag_item">•</span> 
<span id="A5.I1.i3.I1.i1.p1" class="ltx_para">
<span id="A5.I1.i3.I1.i1.p1.1" class="ltx_p"><span id="A5.I1.i3.I1.i1.p1.1.1" class="ltx_text ltx_font_bold" style="--ltx-fg-color:#000000;">Thematic Depth</span><span id="A5.I1.i3.I1.i1.p1.1.2" class="ltx_text" style="--ltx-fg-color:#000000;">: Does the novel explore a clear, compelling, and thought-provoking theme?</span></span>
</span></span>
<span id="A5.I1.i3.I1.i2" class="ltx_item" style="list-style-type:none;"><span class="ltx_tag ltx_tag_item">•</span> 
<span id="A5.I1.i3.I1.i2.p1" class="ltx_para">
<span id="A5.I1.i3.I1.i2.p1.1" class="ltx_p"><span id="A5.I1.i3.I1.i2.p1.1.1" class="ltx_text ltx_font_bold" style="--ltx-fg-color:#000000;">Expression of Ideas</span><span id="A5.I1.i3.I1.i2.p1.1.2" class="ltx_text" style="--ltx-fg-color:#000000;">: Does the novel convey profound concepts through its characters, plot, or symbolism? Does it inspire reflection in its readers?</span></span>
</span></span>
<span id="A5.I1.i3.I1.i3" class="ltx_item" style="list-style-type:none;"><span class="ltx_tag ltx_tag_item">•</span> 
<span id="A5.I1.i3.I1.i3.p1" class="ltx_para">
<span id="A5.I1.i3.I1.i3.p1.1" class="ltx_p"><span id="A5.I1.i3.I1.i3.p1.1.1" class="ltx_text ltx_font_bold" style="--ltx-fg-color:#000000;">Socio-Cultural Context</span><span id="A5.I1.i3.I1.i3.p1.1.2" class="ltx_text" style="--ltx-fg-color:#000000;">: Does the novel provide deep insight into a particular era, society, or culture through its story and characters?</span></span>
</span></span>
</span>
</span></span>
<span id="A5.I1.i4" class="ltx_item" style="list-style-type:none;"><span class="ltx_tag ltx_tag_item">4.</span> 
<span id="A5.I1.i4.p1" class="ltx_para">
<span id="A5.I1.i4.p1.1" class="ltx_p"><span id="A5.I1.i4.p1.1.1" class="ltx_text ltx_font_bold" style="--ltx-fg-color:#000000;">Language and Writing Style</span></span>
<span id="A5.I1.i4.I1" class="ltx_itemize">
<span id="A5.I1.i4.I1.i1" class="ltx_item" style="list-style-type:none;"><span class="ltx_tag ltx_tag_item">•</span> 
<span id="A5.I1.i4.I1.i1.p1" class="ltx_para">
<span id="A5.I1.i4.I1.i1.p1.1" class="ltx_p"><span id="A5.I1.i4.I1.i1.p1.1.1" class="ltx_text ltx_font_bold" style="--ltx-fg-color:#000000;">Language Style</span><span id="A5.I1.i4.I1.i1.p1.1.2" class="ltx_text" style="--ltx-fg-color:#000000;">: Is the author’s prose vivid and elegant? Does it effectively convey the emotions and thoughts of the characters?</span></span>
</span></span>
<span id="A5.I1.i4.I1.i2" class="ltx_item" style="list-style-type:none;"><span class="ltx_tag ltx_tag_item">•</span> 
<span id="A5.I1.i4.I1.i2.p1" class="ltx_para">
<span id="A5.I1.i4.I1.i2.p1.1" class="ltx_p"><span id="A5.I1.i4.I1.i2.p1.1.1" class="ltx_text ltx_font_bold" style="--ltx-fg-color:#000000;">Tonal Consistency</span><span id="A5.I1.i4.I1.i2.p1.1.2" class="ltx_text" style="--ltx-fg-color:#000000;">: Does the language align with the story’s atmosphere and context? Does it enhance the emotional intensity of the novel?</span></span>
</span></span>
<span id="A5.I1.i4.I1.i3" class="ltx_item" style="list-style-type:none;"><span class="ltx_tag ltx_tag_item">•</span> 
<span id="A5.I1.i4.I1.i3.p1" class="ltx_para">
<span id="A5.I1.i4.I1.i3.p1.1" class="ltx_p"><span id="A5.I1.i4.I1.i3.p1.1.1" class="ltx_text ltx_font_bold" style="--ltx-fg-color:#000000;">Descriptive Detail</span><span id="A5.I1.i4.I1.i3.p1.1.2" class="ltx_text" style="--ltx-fg-color:#000000;">: Are the descriptive details fitting? Do they aid in character-building, setting the mood, or driving the narrative forward?</span></span>
</span></span>
</span>
</span></span>
<span id="A5.I1.i5" class="ltx_item" style="list-style-type:none;"><span class="ltx_tag ltx_tag_item">5.</span> 
<span id="A5.I1.i5.p1" class="ltx_para">
<span id="A5.I1.i5.p1.1" class="ltx_p"><span id="A5.I1.i5.p1.1.1" class="ltx_text ltx_font_bold" style="--ltx-fg-color:#000000;">Emotional Resonance</span></span>
<span id="A5.I1.i5.I1" class="ltx_itemize">
<span id="A5.I1.i5.I1.i1" class="ltx_item" style="list-style-type:none;"><span class="ltx_tag ltx_tag_item">•</span> 
<span id="A5.I1.i5.I1.i1.p1" class="ltx_para">
<span id="A5.I1.i5.I1.i1.p1.1" class="ltx_p"><span id="A5.I1.i5.I1.i1.p1.1.1" class="ltx_text ltx_font_bold" style="--ltx-fg-color:#000000;">Emotional Depth</span><span id="A5.I1.i5.I1.i1.p1.1.2" class="ltx_text" style="--ltx-fg-color:#000000;">: Does the novel evoke emotional resonance? Does it draw readers in and make them empathetic to the story?</span></span>
</span></span>
<span id="A5.I1.i5.I1.i2" class="ltx_item" style="list-style-type:none;"><span class="ltx_tag ltx_tag_item">•</span> 
<span id="A5.I1.i5.I1.i2.p1" class="ltx_para">
<span id="A5.I1.i5.I1.i2.p1.1" class="ltx_p"><span id="A5.I1.i5.I1.i2.p1.1.1" class="ltx_text ltx_font_bold" style="--ltx-fg-color:#000000;">Authenticity</span><span id="A5.I1.i5.I1.i2.p1.1.2" class="ltx_text" style="--ltx-fg-color:#000000;">: Are the emotions portrayed realistic and believable? Do they genuinely move the reader?</span></span>
</span></span>
</span>
</span></span>
<span id="A5.I1.i6" class="ltx_item" style="list-style-type:none;"><span class="ltx_tag ltx_tag_item">6.</span> 
<span id="A5.I1.i6.p1" class="ltx_para">
<span id="A5.I1.i6.p1.1" class="ltx_p"><span id="A5.I1.i6.p1.1.1" class="ltx_text ltx_font_bold" style="--ltx-fg-color:#000000;">Innovation and Uniqueness</span></span>
<span id="A5.I1.i6.I1" class="ltx_itemize">
<span id="A5.I1.i6.I1.i1" class="ltx_item" style="list-style-type:none;"><span class="ltx_tag ltx_tag_item">•</span> 
<span id="A5.I1.i6.I1.i1.p1" class="ltx_para">
<span id="A5.I1.i6.I1.i1.p1.1" class="ltx_p"><span id="A5.I1.i6.I1.i1.p1.1.1" class="ltx_text ltx_font_bold" style="--ltx-fg-color:#000000;">Innovative Elements</span><span id="A5.I1.i6.I1.i1.p1.1.2" class="ltx_text" style="--ltx-fg-color:#000000;">: Does the novel showcase originality? Does it challenge traditional narrative conventions or stylistic norms?</span></span>
</span></span>
<span id="A5.I1.i6.I1.i2" class="ltx_item" style="list-style-type:none;"><span class="ltx_tag ltx_tag_item">•</span> 
<span id="A5.I1.i6.I1.i2.p1" class="ltx_para">
<span id="A5.I1.i6.I1.i2.p1.1" class="ltx_p"><span id="A5.I1.i6.I1.i2.p1.1.1" class="ltx_text ltx_font_bold" style="--ltx-fg-color:#000000;">Unique Perspective</span><span id="A5.I1.i6.I1.i2.p1.1.2" class="ltx_text" style="--ltx-fg-color:#000000;">: Does the story approach its topic from a distinctive angle? Does it reflect a strong, memorable voice?</span></span>
</span></span>
</span>
</span></span>
</span>
<span id="A5.p1.pic1.3.6" class="ltx_p"><span id="A5.p1.pic1.3.6.1" class="ltx_text" style="--ltx-fg-color:#000000;">[Criteria End]</span></span>
<span id="A5.p1.pic1.3.7" class="ltx_p"><span id="A5.p1.pic1.3.7.1" class="ltx_text" style="--ltx-fg-color:#000000;">Begin your evaluation by assigning a score between 1 and 5 for each dimension, along with a brief explanation. Conclude with the novel’s overall score (1 to 5). A score of 1–2 indicates the dimension performed poorly, 3–4 means it was average, and 5 means it excelled.</span></span>
<span id="A5.p1.pic1.3.8" class="ltx_p"><span id="A5.p1.pic1.3.8.1" class="ltx_text" style="--ltx-fg-color:#000000;">Please use the following example output format:</span></span>
<span id="A5.p1.pic1.3.9" class="ltx_p"><span id="A5.p1.pic1.3.9.1" class="ltx_text" style="--ltx-fg-color:#000000;">&quot;Plot and Structure&quot;: 2 
<br class="ltx_break">&quot;Character Development&quot;: 3 
<br class="ltx_break">&quot;Themes and Ideas&quot;: 4 
<br class="ltx_break">&quot;Language and Writing Style&quot;: 3 
<br class="ltx_break">&quot;Emotional Resonance&quot;: 3 
<br class="ltx_break">&quot;Innovation and Uniqueness&quot;: 2 
<br class="ltx_break">&quot;Overall Rating&quot;: 3</span></span>
</span></span></span></foreignobject></g></g></svg>