<span id="S4.Thmtheorem1" class="ltx_theorem ltx_theorem_remark">
<h6 class="ltx_title ltx_runin ltx_title_theorem" style="--ltx-fg-color:#000000;"><span class="ltx_tag ltx_tag_theorem"><span id="S4.Thmtheorem1.2" class="ltx_text ltx_font_italic">Remark 4.1</span></span><span id="S4.Thmtheorem1.3" class="ltx_text ltx_font_italic">.</span></h6>
<span id="S4.Thmtheorem1.p1" class="ltx_para">
<span id="S4.Thmtheorem1.p1.1" class="ltx_p"><span id="S4.Thmtheorem1.p1.1.1" class="ltx_text" style="--ltx-fg-color:#000000;">The margin-based bound exposes a fundamental trade-off between empirical ranking performance and model complexity.
By designing training procedures that adapt the margin during training, we can construct confidence estimators whose induced rankings generalize more reliably.
This encourages confidence estimators to produce smooth and well-ordered confidence scores, thereby supporting the near-monotonic selective risk curves required for human-agreement guarantees.
Moreover, since ranking structure lies at the core of selective evaluation, adaptive margin training directly enhances the robustness and reliability of downstream human-agreement guarantees.</span></span>
</span>
</span></span></span></span></foreignobject></g></g></svg>