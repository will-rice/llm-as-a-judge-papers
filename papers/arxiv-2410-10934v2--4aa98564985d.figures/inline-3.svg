<svg id="A1.F8.pic1" class="ltx_picture ltx_centering" height="1444.39" overflow="visible" version="1.1" viewbox="0 0 653.15 1444.39" width="653.15"><g style="--ltx-stroke-color:#000000;--ltx-fill-color:#000000;" fill="#000000" stroke="#000000" stroke-width="0.4pt" transform="translate(0,1444.39) matrix(1 0 0 -1 0 0)"><g style="--ltx-fill-color:#0078FF;" fill="#0078FF" fill-opacity="1.0"><path style="stroke:none" d="M 0 5.91 L 0 1438.49 C 0 1441.75 2.64 1444.39 5.91 1444.39 L 647.24 1444.39 C 650.51 1444.39 653.15 1441.75 653.15 1438.49 L 653.15 5.91 C 653.15 2.64 650.51 0 647.24 0 L 5.91 0 C 2.64 0 0 2.64 0 5.91 Z" /></g><g style="--ltx-fill-color:#FFFFFF;" fill="#FFFFFF" fill-opacity="1.0"><path style="stroke:none" d="M 1.97 5.91 L 1.97 1420.28 L 651.18 1420.28 L 651.18 5.91 C 651.18 3.73 649.42 1.97 647.24 1.97 L 5.91 1.97 C 3.73 1.97 1.97 3.73 1.97 5.91 Z" /></g><g style="--ltx-fill-color:#E6F1FF;" fill="#E6F1FF" fill-opacity="1.0"><path style="stroke:none" d="M 1.97 1422.25 L 1.97 1438.49 C 1.97 1440.66 3.73 1442.43 5.91 1442.43 L 647.24 1442.43 C 649.42 1442.43 651.18 1440.66 651.18 1438.49 L 651.18 1422.25 Z" /></g><g fill-opacity="1.0" transform="matrix(1.0 0.0 0.0 1.0 21.65 1428.88)"><foreignobject style="--ltx-fo-width:38.32em;--ltx-fo-height:0.69em;--ltx-fo-depth:0.19em;font-size:10pt;" height="12.3" overflow="visible" transform="matrix(1 0 0 -1 0 9.61)" width="530.24"><span class="ltx_foreignobject_container"><span class="ltx_foreignobject_content">
<span id="A1.F8.pic1.1" class="ltx_inline-block ltx_minipage ltx_align_bottom" style="width:38.32em;">
<span id="A1.F8.pic1.1.1" class="ltx_p"><span id="A1.F8.pic1.1.1.1" class="ltx_text ltx_font_bold" style="--ltx-fg-color:#0078FF;">Paper: <em id="A1.F8.pic1.1.1.1.1" class="ltx_emph ltx_font_italic">Agent-as-a-Judge: Evaluating Agents with Agents</em></span></span>
</span></span></span></foreignobject></g><g fill-opacity="1.0" transform="matrix(1.0 0.0 0.0 1.0 21.65 13.78)"><foreignobject style="--ltx-fo-width:44.07em;--ltx-fo-height:100.8em;--ltx-fo-depth:0em;font-size:10pt;" height="1394.71" overflow="visible" transform="matrix(1 0 0 -1 0 1394.71)" width="609.8"><span class="ltx_foreignobject_container"><span class="ltx_foreignobject_content">
<span id="A1.F8.pic1.2" class="ltx_inline-block ltx_minipage ltx_align_bottom" style="width:44.07em;">
<span id="A1.F8.pic1.2.1" class="ltx_p ltx_align_center"><span id="A1.F8.pic1.2.1.1" class="ltx_text ltx_font_bold" style="--ltx-fg-color:#0078FF;">Key Logic</span><span id="A1.F8.pic1.2.1.2" class="ltx_text"></span></span>
<span id="A1.I1" class="ltx_itemize ltx_centering">
<span id="A1.I1.i1" class="ltx_item" style="list-style-type:none;"><span class="ltx_tag ltx_tag_item"><math id="A1.I1.i1.m1" class="ltx_Math" alttext="\blacksquare" display="inline" intent=":literal"><semantics><mi style="--ltx-fg-color:#0078FF;" mathcolor="#0078FF" mathsize="0.700em" mathvariant="normal">■</mi><annotation encoding="application/x-tex">\blacksquare</annotation></semantics></math></span> 
<span id="A1.I1.i1.p1" class="ltx_para">
<span id="A1.I1.i1.p1.1" class="ltx_p"><span id="A1.I1.i1.p1.1.1" class="ltx_text ltx_font_bold" style="--ltx-fg-color:#0078FF;">Step 1: Concept Proposal</span><span id="A1.I1.i1.p1.1.2" class="ltx_text" style="--ltx-fg-color:#000000;"> </span>
<br class="ltx_break"><span id="A1.I1.i1.p1.1.3" class="ltx_text ltx_font_bold" style="--ltx-fg-color:#000000;">Description:</span><span id="A1.I1.i1.p1.1.4" class="ltx_text" style="--ltx-fg-color:#000000;"> We propose the </span><span id="A1.I1.i1.p1.1.5" class="ltx_text ltx_font_bold" style="--ltx-fg-color:#000000;">Agent-as-a-Judge</span><span id="A1.I1.i1.p1.1.6" class="ltx_text" style="--ltx-fg-color:#000000;"> concept, an extension of the LLM-as-a-Judge framework, aimed at evaluating agentic systems using other agentic systems.</span></span>
</span></span>
<span id="A1.I1.i2" class="ltx_item" style="list-style-type:none;"><span class="ltx_tag ltx_tag_item"><math id="A1.I1.i2.m1" class="ltx_Math" alttext="\blacksquare" display="inline" intent=":literal"><semantics><mi style="--ltx-fg-color:#0078FF;" mathcolor="#0078FF" mathsize="0.700em" mathvariant="normal">■</mi><annotation encoding="application/x-tex">\blacksquare</annotation></semantics></math></span> 
<span id="A1.I1.i2.p1" class="ltx_para">
<span id="A1.I1.i2.p1.1" class="ltx_p"><span id="A1.I1.i2.p1.1.1" class="ltx_text ltx_font_bold" style="--ltx-fg-color:#0078FF;">Step 2: Dataset Creation</span><span id="A1.I1.i2.p1.1.2" class="ltx_text" style="--ltx-fg-color:#000000;"> </span>
<br class="ltx_break"><span id="A1.I1.i2.p1.1.3" class="ltx_text ltx_font_bold" style="--ltx-fg-color:#000000;">Description:</span><span id="A1.I1.i2.p1.1.4" class="ltx_text" style="--ltx-fg-color:#000000;"> To address the lack of suitable datasets for evaluating agentic systems in automated AI development, we introduce </span><span id="A1.I1.i2.p1.1.5" class="ltx_text ltx_font_bold" style="--ltx-fg-color:#000000;">DevAI</span><span id="A1.I1.i2.p1.1.6" class="ltx_text" style="--ltx-fg-color:#000000;">, a new dataset consisting of 55 realistic AI code generation tasks. This also serves as a testbed for the Agent-as-a-Judge proof-of-concept.</span></span>
</span></span>
<span id="A1.I1.i3" class="ltx_item" style="list-style-type:none;"><span class="ltx_tag ltx_tag_item"><math id="A1.I1.i3.m1" class="ltx_Math" alttext="\blacksquare" display="inline" intent=":literal"><semantics><mi style="--ltx-fg-color:#0078FF;" mathcolor="#0078FF" mathsize="0.700em" mathvariant="normal">■</mi><annotation encoding="application/x-tex">\blacksquare</annotation></semantics></math></span> 
<span id="A1.I1.i3.p1" class="ltx_para">
<span id="A1.I1.i3.p1.1" class="ltx_p"><span id="A1.I1.i3.p1.1.1" class="ltx_text ltx_font_bold" style="--ltx-fg-color:#0078FF;">Step 3: Baseline Evaluation of Developer Agents <span id="A1.I1.i3.p1.1.1.1" class="ltx_text" style="--ltx-fg-color:#FF8000;">(Experiment Level 1)</span></span><span id="A1.I1.i3.p1.1.2" class="ltx_text" style="--ltx-fg-color:#000000;"> </span>
<br class="ltx_break"><span id="A1.I1.i3.p1.1.3" class="ltx_text ltx_font_bold" style="--ltx-fg-color:#000000;">Description:</span><span id="A1.I1.i3.p1.1.4" class="ltx_text" style="--ltx-fg-color:#000000;"> In the first level of experiments, we select three popular open-source developer agents: </span><span id="A1.I1.i3.p1.1.5" class="ltx_text ltx_font_bold" style="--ltx-fg-color:#000000;">MetaGPT</span><span id="A1.I1.i3.p1.1.6" class="ltx_text" style="--ltx-fg-color:#000000;">, </span><span id="A1.I1.i3.p1.1.7" class="ltx_text ltx_font_bold" style="--ltx-fg-color:#000000;">GPT-Pilot</span><span id="A1.I1.i3.p1.1.8" class="ltx_text" style="--ltx-fg-color:#000000;">, and </span><span id="A1.I1.i3.p1.1.9" class="ltx_text ltx_font_bold" style="--ltx-fg-color:#000000;">OpenHands</span><span id="A1.I1.i3.p1.1.10" class="ltx_text" style="--ltx-fg-color:#000000;">. These agents are evaluated on the </span><span id="A1.I1.i3.p1.1.11" class="ltx_text ltx_font_bold" style="--ltx-fg-color:#000000;">DevAI</span><span id="A1.I1.i3.p1.1.12" class="ltx_text" style="--ltx-fg-color:#000000;"> tasks to establish performance baselines.</span></span>
</span></span>
<span id="A1.I1.i4" class="ltx_item" style="list-style-type:none;"><span class="ltx_tag ltx_tag_item"><math id="A1.I1.i4.m1" class="ltx_Math" alttext="\blacksquare" display="inline" intent=":literal"><semantics><mi style="--ltx-fg-color:#0078FF;" mathcolor="#0078FF" mathsize="0.700em" mathvariant="normal">■</mi><annotation encoding="application/x-tex">\blacksquare</annotation></semantics></math></span> 
<span id="A1.I1.i4.p1" class="ltx_para">
<span id="A1.I1.i4.p1.1" class="ltx_p"><span id="A1.I1.i4.p1.1.1" class="ltx_text ltx_font_bold" style="--ltx-fg-color:#0078FF;">Step 4: Conducting Human-as-a-Judge Evaluation</span><span id="A1.I1.i4.p1.1.2" class="ltx_text" style="--ltx-fg-color:#000000;"> </span>
<br class="ltx_break"><span id="A1.I1.i4.p1.1.3" class="ltx_text ltx_font_bold" style="--ltx-fg-color:#000000;">Description:</span><span id="A1.I1.i4.p1.1.4" class="ltx_text" style="--ltx-fg-color:#000000;"> We conduct a </span><span id="A1.I1.i4.p1.1.5" class="ltx_text ltx_font_bold" style="--ltx-fg-color:#000000;">Human-as-a-Judge</span><span id="A1.I1.i4.p1.1.6" class="ltx_text" style="--ltx-fg-color:#000000;"> experiment, where three human experts assess the performance of the developer agents on the same DevAI tasks.</span></span>
</span></span>
<span id="A1.I1.i5" class="ltx_item" style="list-style-type:none;"><span class="ltx_tag ltx_tag_item"><math id="A1.I1.i5.m1" class="ltx_Math" alttext="\blacksquare" display="inline" intent=":literal"><semantics><mi style="--ltx-fg-color:#0078FF;" mathcolor="#0078FF" mathsize="0.700em" mathvariant="normal">■</mi><annotation encoding="application/x-tex">\blacksquare</annotation></semantics></math></span> 
<span id="A1.I1.i5.p1" class="ltx_para">
<span id="A1.I1.i5.p1.1" class="ltx_p"><span id="A1.I1.i5.p1.1.1" class="ltx_text ltx_font_bold" style="--ltx-fg-color:#0078FF;">Step 5: Human-as-a-Judge Analysis <span id="A1.I1.i5.p1.1.1.1" class="ltx_text" style="--ltx-fg-color:#FF8000;">(Experiment Level 2)</span></span><span id="A1.I1.i5.p1.1.2" class="ltx_text" style="--ltx-fg-color:#000000;"> </span>
<br class="ltx_break"><span id="A1.I1.i5.p1.1.3" class="ltx_text ltx_font_bold" style="--ltx-fg-color:#000000;">Description:</span><span id="A1.I1.i5.p1.1.4" class="ltx_text" style="--ltx-fg-color:#000000;"> In the second level of experiments, we statistically analyze the results of Human-as-a-Judge evaluations, focusing on the costs of human labor and potential biases, highlighting the challenges of relying on human evaluation for complex tasks.</span></span>
</span></span>
<span id="A1.I1.i6" class="ltx_item" style="list-style-type:none;"><span class="ltx_tag ltx_tag_item"><math id="A1.I1.i6.m1" class="ltx_Math" alttext="\blacksquare" display="inline" intent=":literal"><semantics><mi style="--ltx-fg-color:#0078FF;" mathcolor="#0078FF" mathsize="0.700em" mathvariant="normal">■</mi><annotation encoding="application/x-tex">\blacksquare</annotation></semantics></math></span> 
<span id="A1.I1.i6.p1" class="ltx_para">
<span id="A1.I1.i6.p1.1" class="ltx_p"><span id="A1.I1.i6.p1.1.1" class="ltx_text ltx_font_bold" style="--ltx-fg-color:#0078FF;">Step 6: Agent-as-a-Judge Implementation</span><span id="A1.I1.i6.p1.1.2" class="ltx_text" style="--ltx-fg-color:#000000;"> </span>
<br class="ltx_break"><span id="A1.I1.i6.p1.1.3" class="ltx_text ltx_font_bold" style="--ltx-fg-color:#000000;">Description:</span><span id="A1.I1.i6.p1.1.4" class="ltx_text" style="--ltx-fg-color:#000000;"> We design and implement the </span><span id="A1.I1.i6.p1.1.5" class="ltx_text ltx_font_bold" style="--ltx-fg-color:#000000;">Agent-as-a-Judge</span><span id="A1.I1.i6.p1.1.6" class="ltx_text" style="--ltx-fg-color:#000000;"> proof-of-concept to evaluate code generation on the </span><span id="A1.I1.i6.p1.1.7" class="ltx_text ltx_font_bold" style="--ltx-fg-color:#000000;">DevAI</span><span id="A1.I1.i6.p1.1.8" class="ltx_text" style="--ltx-fg-color:#000000;"> dataset. This system incorporates modules such as graph, search, read, and ask, providing multi-dimensional evaluation metrics.</span></span>
</span></span>
<span id="A1.I1.i7" class="ltx_item" style="list-style-type:none;"><span class="ltx_tag ltx_tag_item"><math id="A1.I1.i7.m1" class="ltx_Math" alttext="\blacksquare" display="inline" intent=":literal"><semantics><mi style="--ltx-fg-color:#0078FF;" mathcolor="#0078FF" mathsize="0.700em" mathvariant="normal">■</mi><annotation encoding="application/x-tex">\blacksquare</annotation></semantics></math></span> 
<span id="A1.I1.i7.p1" class="ltx_para">
<span id="A1.I1.i7.p1.1" class="ltx_p"><span id="A1.I1.i7.p1.1.1" class="ltx_text ltx_font_bold" style="--ltx-fg-color:#0078FF;">Step 7: Comparing AI Judge Systems <span id="A1.I1.i7.p1.1.1.1" class="ltx_text" style="--ltx-fg-color:#FF8000;">(Experiment Level 3)</span></span><span id="A1.I1.i7.p1.1.2" class="ltx_text" style="--ltx-fg-color:#000000;"> </span>
<br class="ltx_break"><span id="A1.I1.i7.p1.1.3" class="ltx_text ltx_font_bold" style="--ltx-fg-color:#000000;">Description:</span><span id="A1.I1.i7.p1.1.4" class="ltx_text" style="--ltx-fg-color:#000000;"> In the third level of experiments, we compare three judgment systems: </span><span id="A1.I1.i7.p1.1.5" class="ltx_text ltx_font_bold" style="--ltx-fg-color:#000000;">Agent-as-a-Judge</span><span id="A1.I1.i7.p1.1.6" class="ltx_text" style="--ltx-fg-color:#000000;">, </span><span id="A1.I1.i7.p1.1.7" class="ltx_text ltx_font_bold" style="--ltx-fg-color:#000000;">LLM-as-a-Judge</span><span id="A1.I1.i7.p1.1.8" class="ltx_text" style="--ltx-fg-color:#000000;">, and </span><span id="A1.I1.i7.p1.1.9" class="ltx_text ltx_font_bold" style="--ltx-fg-color:#000000;">Human-as-a-Judge</span><span id="A1.I1.i7.p1.1.10" class="ltx_text" style="--ltx-fg-color:#000000;">, all applied to the same DevAI tasks. Our results show that </span><span id="A1.I1.i7.p1.1.11" class="ltx_text ltx_font_bold" style="--ltx-fg-color:#000000;">Agent-as-a-Judge</span><span id="A1.I1.i7.p1.1.12" class="ltx_text" style="--ltx-fg-color:#000000;"> performs comparably to human evaluators and surpasses </span><span id="A1.I1.i7.p1.1.13" class="ltx_text ltx_font_bold" style="--ltx-fg-color:#000000;">LLM-as-a-Judge</span><span id="A1.I1.i7.p1.1.14" class="ltx_text" style="--ltx-fg-color:#000000;"> in more complex reasoning and evaluation tasks.</span></span>
</span></span>
</span>
<span id="A1.F8.pic1.2.2" class="ltx_p ltx_align_center"><span id="A1.F8.pic1.2.2.1" class="ltx_text ltx_font_bold" style="--ltx-fg-color:#0078FF;">Future Directions</span><span id="A1.F8.pic1.2.2.2" class="ltx_text"></span></span>
<span id="A1.I2" class="ltx_itemize ltx_centering">
<span id="A1.I2.i1" class="ltx_item" style="list-style-type:none;"><span class="ltx_tag ltx_tag_item"><math id="A1.I2.i1.m1" class="ltx_Math" alttext="\blacksquare" display="inline" intent=":literal"><semantics><mi style="--ltx-fg-color:#0078FF;" mathcolor="#0078FF" mathsize="0.700em" mathvariant="normal">■</mi><annotation encoding="application/x-tex">\blacksquare</annotation></semantics></math></span> 
<span id="A1.I2.i1.p1" class="ltx_para">
<span id="A1.I2.i1.p1.1" class="ltx_p"><span id="A1.I2.i1.p1.1.1" class="ltx_text ltx_font_bold" style="--ltx-fg-color:#0078FF;">Direction 1: Intermediate Feedback for Agentic Self-Improvement</span><span id="A1.I2.i1.p1.1.2" class="ltx_text" style="--ltx-fg-color:#000000;"> </span>
<br class="ltx_break"><span id="A1.I2.i1.p1.1.3" class="ltx_text ltx_font_bold" style="--ltx-fg-color:#000000;">Description:</span><span id="A1.I2.i1.p1.1.4" class="ltx_text" style="--ltx-fg-color:#000000;"> </span><span id="A1.I2.i1.p1.1.5" class="ltx_text ltx_font_bold" style="--ltx-fg-color:#000000;">Agent-as-a-Judge</span><span id="A1.I2.i1.p1.1.6" class="ltx_text" style="--ltx-fg-color:#000000;"> offers intermediate feedback, crucial for reinforcement learning, where rewards are sparse but vital for improvement. It also enables real-time issue identification and resolution in complex, multi-stage tasks, overcoming the limitations of delayed feedback.</span></span>
</span></span>
<span id="A1.I2.i2" class="ltx_item" style="list-style-type:none;"><span class="ltx_tag ltx_tag_item"><math id="A1.I2.i2.m1" class="ltx_Math" alttext="\blacksquare" display="inline" intent=":literal"><semantics><mi style="--ltx-fg-color:#0078FF;" mathcolor="#0078FF" mathsize="0.700em" mathvariant="normal">■</mi><annotation encoding="application/x-tex">\blacksquare</annotation></semantics></math></span> 
<span id="A1.I2.i2.p1" class="ltx_para">
<span id="A1.I2.i2.p1.1" class="ltx_p"><span id="A1.I2.i2.p1.1.1" class="ltx_text ltx_font_bold" style="--ltx-fg-color:#0078FF;">Direction 2: Flywheel Effect Driven by Agent-as-a-Judge</span><span id="A1.I2.i2.p1.1.2" class="ltx_text" style="--ltx-fg-color:#000000;"> </span>
<br class="ltx_break"><span id="A1.I2.i2.p1.1.3" class="ltx_text ltx_font_bold" style="--ltx-fg-color:#000000;">Description:</span><span id="A1.I2.i2.p1.1.4" class="ltx_text" style="--ltx-fg-color:#000000;">
The iterative feedback cycle between the </span><span id="A1.I2.i2.p1.1.5" class="ltx_text ltx_font_bold" style="--ltx-fg-color:#000000;">Agent-as-a-Judge</span><span id="A1.I2.i2.p1.1.6" class="ltx_text" style="--ltx-fg-color:#000000;"> and evaluated agents (such as </span><span id="A1.I2.i2.p1.1.7" class="ltx_text ltx_font_bold" style="--ltx-fg-color:#000000;">Developer Agents</span><span id="A1.I2.i2.p1.1.8" class="ltx_text" style="--ltx-fg-color:#000000;"> here) could create a flywheel effect, where mutual improvements lead to progressively greater optimization. This dynamic could drive an agentic self-play system and complement LLM reasoning data to embed agentic features into foundation models.</span></span>
</span></span>
</span>
</span></span></span></foreignobject></g></g></svg>