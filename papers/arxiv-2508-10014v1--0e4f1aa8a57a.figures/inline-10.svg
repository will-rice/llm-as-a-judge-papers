</span></span></span></foreignobject></g><g fill-opacity="1.0" transform="matrix(1.0 0.0 0.0 1.0 12.36 15.05)"><foreignobject style="--ltx-fo-width:14.77em;--ltx-fo-height:30.09em;--ltx-fo-depth:0.19em;font-size:10pt;" height="419.11" overflow="visible" transform="matrix(1 0 0 -1 0 416.42)" width="204.38"><span class="ltx_foreignobject_container"><span class="ltx_foreignobject_content">
