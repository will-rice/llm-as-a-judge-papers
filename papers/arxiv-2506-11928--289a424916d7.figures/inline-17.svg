<svg id="S15.SS0.SSS0.Px6.p2.pic1" class="ltx_picture" height="594.19" overflow="visible" version="1.1" viewbox="0 0 477.38 594.19" width="477.38"><g style="--ltx-stroke-color:#000000;--ltx-fill-color:#000000;" fill="#000000" stroke="#000000" stroke-width="0.4pt" transform="translate(0,594.19) matrix(1 0 0 -1 0 0)"><g style="--ltx-fill-color:#BF0000;" fill="#BF0000" fill-opacity="1.0"><path style="stroke:none" d="M 0 5.91 L 0 588.28 C 0 591.54 2.64 594.19 5.91 594.19 L 471.47 594.19 C 474.73 594.19 477.38 591.54 477.38 588.28 L 477.38 5.91 C 477.38 2.64 474.73 0 471.47 0 L 5.91 0 C 2.64 0 0 2.64 0 5.91 Z" /></g><g style="--ltx-fill-color:#FFF2F2;" fill="#FFF2F2" fill-opacity="1.0"><path style="stroke:none" d="M 1.97 5.91 L 1.97 568.54 L 475.41 568.54 L 475.41 5.91 C 475.41 3.73 473.65 1.97 471.47 1.97 L 5.91 1.97 C 3.73 1.97 1.97 3.73 1.97 5.91 Z" /></g><g fill-opacity="1.0" transform="matrix(1.0 0.0 0.0 1.0 21.65 577.91)"><foreignobject style="--ltx-fo-width:31.37em;--ltx-fo-height:0.75em;--ltx-fo-depth:0.25em;font-size:10pt;" height="13.84" overflow="visible" transform="matrix(1 0 0 -1 0 10.38)" width="434.07"><span class="ltx_foreignobject_container"><span class="ltx_foreignobject_content">
<span id="S15.SS0.SSS0.Px6.p2.pic1.1" class="ltx_inline-block ltx_minipage ltx_align_bottom" style="width:31.37em;">
<span id="S15.SS0.SSS0.Px6.p2.pic1.1.1" class="ltx_p"><a href="https://codeforces.com/problemset/problem/2042/A" title class="ltx_ref ltx_href" style="--ltx-fg-color:#FFFFFF;">Example Greedy Problem (Rated 800)</a></span>
</span></span></span></foreignobject></g><g fill-opacity="1.0" transform="matrix(1.0 0.0 0.0 1.0 21.65 16.47)"><foreignobject style="--ltx-fo-width:31.37em;--ltx-fo-height:39.04em;--ltx-fo-depth:0.19em;font-size:10pt;" height="542.96" overflow="visible" transform="matrix(1 0 0 -1 0 540.27)" width="434.07"><span class="ltx_foreignobject_container"><span class="ltx_foreignobject_content">
<span id="S15.SS0.SSS0.Px6.p2.pic1.2" class="ltx_inline-block ltx_minipage ltx_align_bottom" style="width:31.37em;">
<span id="S15.SS0.SSS0.Px6.p2.pic1.2.1" class="ltx_p"><span id="S15.SS0.SSS0.Px6.p2.pic1.2.1.1" class="ltx_text" style="--ltx-fg-color:#000000;">There are <math id="S15.SS0.SSS0.Px6.p2.pic1.m1" class="ltx_Math" alttext="n" display="inline" intent=":literal"><semantics><mi style="--ltx-fg-color:#000000;" mathcolor="#000000">n</mi><annotation encoding="application/x-tex">n</annotation></semantics></math> chests; the <math id="S15.SS0.SSS0.Px6.p2.pic1.m2" class="ltx_Math" alttext="i" display="inline" intent=":literal"><semantics><mi style="--ltx-fg-color:#000000;" mathcolor="#000000">i</mi><annotation encoding="application/x-tex">i</annotation></semantics></math>-th chest initially contains <math id="S15.SS0.SSS0.Px6.p2.pic1.m3" class="ltx_Math" alttext="a_{i}" display="inline" intent=":literal"><semantics><msub><mi style="--ltx-fg-color:#000000;" mathcolor="#000000">a</mi><mi style="--ltx-fg-color:#000000;" mathcolor="#000000">i</mi></msub><annotation encoding="application/x-tex">a_{i}</annotation></semantics></math> coins. For each chest, you can choose any non-negative (<math id="S15.SS0.SSS0.Px6.p2.pic1.m4" class="ltx_Math" alttext="0" display="inline" intent=":literal"><semantics><mn style="--ltx-fg-color:#000000;" mathcolor="#000000">0</mn><annotation encoding="application/x-tex">0</annotation></semantics></math> or greater) number of coins to add to that chest, with one constraint: the total number of coins in all chests must become <span id="S15.SS0.SSS0.Px6.p2.pic1.2.1.1.1" class="ltx_text ltx_font_bold">at least</span> <math id="S15.SS0.SSS0.Px6.p2.pic1.m5" class="ltx_Math" alttext="k" display="inline" intent=":literal"><semantics><mi style="--ltx-fg-color:#000000;" mathcolor="#000000">k</mi><annotation encoding="application/x-tex">k</annotation></semantics></math>.

<br class="ltx_break">
<br class="ltx_break">After you’ve finished adding coins to the chests, greedy Monocarp comes, who wants the coins. He will take the chests one by one, and since he is greedy, he will always choose the chest with the maximum number of coins. Monocarp will stop as soon as the total number of coins in chests he takes is <span id="S15.SS0.SSS0.Px6.p2.pic1.2.1.1.2" class="ltx_text ltx_font_bold">at least</span> <math id="S15.SS0.SSS0.Px6.p2.pic1.m6" class="ltx_Math" alttext="k" display="inline" intent=":literal"><semantics><mi style="--ltx-fg-color:#000000;" mathcolor="#000000">k</mi><annotation encoding="application/x-tex">k</annotation></semantics></math>.

<br class="ltx_break">
<br class="ltx_break">You want Monocarp to take as few coins as possible, so you have to add coins to the chests in such a way that, when Monocarp stops taking chests, he will have <span id="S15.SS0.SSS0.Px6.p2.pic1.2.1.1.3" class="ltx_text ltx_font_bold">exactly</span> <math id="S15.SS0.SSS0.Px6.p2.pic1.m7" class="ltx_Math" alttext="k" display="inline" intent=":literal"><semantics><mi style="--ltx-fg-color:#000000;" mathcolor="#000000">k</mi><annotation encoding="application/x-tex">k</annotation></semantics></math> coins. Calculate the minimum number of coins you have to add.

<br class="ltx_break">
<br class="ltx_break"><span id="S15.SS0.SSS0.Px6.p2.pic1.2.1.1.4" class="ltx_text ltx_font_bold">Input</span> 
<br class="ltx_break">The first line contains one integer <math id="S15.SS0.SSS0.Px6.p2.pic1.m8" class="ltx_Math" alttext="t\ (1\leq t\leq 1000)" display="inline" intent=":literal"><semantics><mrow><mi style="--ltx-fg-color:#000000;" mathcolor="#000000">t</mi><mo lspace="0.500em">⁡</mo><mrow><mo style="--ltx-fg-color:#000000;" mathcolor="#000000" stretchy="false">(</mo><mrow><mn style="--ltx-fg-color:#000000;" mathcolor="#000000">1</mn><mo style="--ltx-fg-color:#000000;" mathcolor="#000000">≤</mo><mi style="--ltx-fg-color:#000000;" mathcolor="#000000">t</mi><mo style="--ltx-fg-color:#000000;" mathcolor="#000000">≤</mo><mn style="--ltx-fg-color:#000000;" mathcolor="#000000">1000</mn></mrow><mo style="--ltx-fg-color:#000000;" mathcolor="#000000" stretchy="false">)</mo></mrow></mrow><annotation encoding="application/x-tex">t\ (1\leq t\leq 1000)</annotation></semantics></math>—the number of the test cases.

<br class="ltx_break">
<br class="ltx_break">Each test case consists of two lines:</span></span>
<span id="S15.I5" class="ltx_itemize">
<span id="S15.I5.i1" class="ltx_item" style="list-style-type:none;"><span class="ltx_tag ltx_tag_item">•</span> 
<span id="S15.I5.i1.p1" class="ltx_para">
<span id="S15.I5.i1.p1.1" class="ltx_p"><span id="S15.I5.i1.p1.1.1" class="ltx_text" style="--ltx-fg-color:#000000;">The first line contains two integers </span><math id="S15.I5.i1.p1.m1" class="ltx_Math" alttext="n" display="inline" intent=":literal"><semantics><mi style="--ltx-fg-color:#000000;" mathcolor="#000000">n</mi><annotation encoding="application/x-tex">n</annotation></semantics></math><span id="S15.I5.i1.p1.1.2" class="ltx_text" style="--ltx-fg-color:#000000;"> and </span><math id="S15.I5.i1.p1.m2" class="ltx_math_unparsed" alttext="k\ (1\leq n\leq 50;1\leq k\leq 10^{7})" display="inline" intent=":literal"><semantics><mrow><mi style="--ltx-fg-color:#000000;" mathcolor="#000000">k</mi><mrow><mo style="--ltx-fg-color:#000000;" lspace="0.500em" mathcolor="#000000" stretchy="false">(</mo><mn style="--ltx-fg-color:#000000;" mathcolor="#000000">1</mn><mo style="--ltx-fg-color:#000000;" mathcolor="#000000">≤</mo><mi style="--ltx-fg-color:#000000;" mathcolor="#000000">n</mi><mo style="--ltx-fg-color:#000000;" mathcolor="#000000">≤</mo><mn style="--ltx-fg-color:#000000;" mathcolor="#000000">50</mn><mo style="--ltx-fg-color:#000000;" mathcolor="#000000">;</mo><mn style="--ltx-fg-color:#000000;" mathcolor="#000000">1</mn><mo style="--ltx-fg-color:#000000;" mathcolor="#000000">≤</mo><mi style="--ltx-fg-color:#000000;" mathcolor="#000000">k</mi><mo style="--ltx-fg-color:#000000;" mathcolor="#000000">≤</mo><msup><mn style="--ltx-fg-color:#000000;" mathcolor="#000000">10</mn><mn style="--ltx-fg-color:#000000;" mathcolor="#000000">7</mn></msup><mo style="--ltx-fg-color:#000000;" mathcolor="#000000" stretchy="false">)</mo></mrow></mrow><annotation encoding="application/x-tex">k\ (1\leq n\leq 50;1\leq k\leq 10^{7})</annotation></semantics></math><span id="S15.I5.i1.p1.1.3" class="ltx_text" style="--ltx-fg-color:#000000;">;</span></span>
</span></span>
<span id="S15.I5.i2" class="ltx_item" style="list-style-type:none;"><span class="ltx_tag ltx_tag_item">•</span> 
<span id="S15.I5.i2.p1" class="ltx_para">
<span id="S15.I5.i2.p1.1" class="ltx_p"><span id="S15.I5.i2.p1.1.1" class="ltx_text" style="--ltx-fg-color:#000000;">The second line contains </span><math id="S15.I5.i2.p1.m1" class="ltx_Math" alttext="n" display="inline" intent=":literal"><semantics><mi style="--ltx-fg-color:#000000;" mathcolor="#000000">n</mi><annotation encoding="application/x-tex">n</annotation></semantics></math><span id="S15.I5.i2.p1.1.2" class="ltx_text" style="--ltx-fg-color:#000000;"> integers </span><math id="S15.I5.i2.p1.m2" class="ltx_Math" alttext="a_{1},a_{2},\dots,a_{n}\ (1\leq a_{i}\leq k" display="inline" intent=":literal"><semantics><mrow><msub><mi style="--ltx-fg-color:#000000;" mathcolor="#000000">a</mi><mn style="--ltx-fg-color:#000000;" mathcolor="#000000">1</mn></msub><mo style="--ltx-fg-color:#000000;" mathcolor="#000000">,</mo><msub><mi style="--ltx-fg-color:#000000;" mathcolor="#000000">a</mi><mn style="--ltx-fg-color:#000000;" mathcolor="#000000">2</mn></msub><mo style="--ltx-fg-color:#000000;" mathcolor="#000000">,</mo><mi style="--ltx-fg-color:#000000;" mathcolor="#000000" mathvariant="normal">…</mi><mo style="--ltx-fg-color:#000000;" mathcolor="#000000">,</mo><mrow><msub><mi style="--ltx-fg-color:#000000;" mathcolor="#000000">a</mi><mi style="--ltx-fg-color:#000000;" mathcolor="#000000">n</mi></msub><mo lspace="0em" rspace="0em">​</mo><mrow><mo style="--ltx-fg-color:#000000;" mathcolor="#000000" stretchy="false">(</mo><mrow><mn style="--ltx-fg-color:#000000;" mathcolor="#000000">1</mn><mo style="--ltx-fg-color:#000000;" mathcolor="#000000">≤</mo><msub><mi style="--ltx-fg-color:#000000;" mathcolor="#000000">a</mi><mi style="--ltx-fg-color:#000000;" mathcolor="#000000">i</mi></msub><mo style="--ltx-fg-color:#000000;" mathcolor="#000000">≤</mo><mi style="--ltx-fg-color:#000000;" mathcolor="#000000">k</mi></mrow><mo style="--ltx-fg-color:#000000;" fence="true" lspace="0em" mathcolor="#000000">CLOSE</mo></mrow></mrow></mrow><annotation encoding="application/x-tex">a_{1},a_{2},\dots,a_{n}\ (1\leq a_{i}\leq k</annotation></semantics></math><span id="S15.I5.i2.p1.1.3" class="ltx_text" style="--ltx-fg-color:#000000;">.</span></span>
</span></span>
</span>
<span id="S15.SS0.SSS0.Px6.p2.pic1.2.2" class="ltx_p"><span id="S15.SS0.SSS0.Px6.p2.pic1.2.2.1" class="ltx_text ltx_font_bold" style="--ltx-fg-color:#000000;">Output<span id="S15.SS0.SSS0.Px6.p2.pic1.2.2.1.1" class="ltx_text ltx_font_medium"> 
<br class="ltx_break">For each test case, print one integer—the minimum number of coins you have to add so that, when Monocarp stops taking the chests, he has </span>exactly<span id="S15.SS0.SSS0.Px6.p2.pic1.2.2.1.2" class="ltx_text ltx_font_medium"> <math id="S15.SS0.SSS0.Px6.p2.pic1.m9" class="ltx_Math" alttext="k" display="inline" intent=":literal"><semantics><mi style="--ltx-fg-color:#000000;" mathcolor="#000000">k</mi><annotation encoding="application/x-tex">k</annotation></semantics></math> coins. It can be shown that under the constraints of the problem, it is always possible.</span></span></span>
</span></span></span></foreignobject></g></g></svg>