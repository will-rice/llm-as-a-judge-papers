<span id="A1.SS6.p10.pic1.1.1" class="ltx_p"><span id="A1.SS6.p10.pic1.1.1.1" class="ltx_text ltx_font_bold" style="--ltx-fg-color:#FFFFFF;">Sample 10: Comparative Evaluation by Experts vs. LLM Judges</span></span>
</span></span></span></foreignobject></g><g fill-opacity="1.0" transform="matrix(1.0 0.0 0.0 1.0 11.81 376.86)"><foreignobject style="--ltx-fo-width:45.27em;--ltx-fo-height:4.29em;--ltx-fo-depth:7.38em;font-size:10pt;" height="161.47" overflow="visible" transform="matrix(1 0 0 -1 0 59.42)" width="626.41"><span class="ltx_foreignobject_container"><span class="ltx_foreignobject_content">
<span id="A1.SS6.p10.pic1.2" class="ltx_inline-block ltx_minipage ltx_align_bottom" style="width:45.27em;">
<span id="A1.SS6.p10.pic1.2.1" class="ltx_p"><span id="A1.SS6.p10.pic1.2.1.1" class="ltx_text ltx_font_sansserif ltx_font_bold" style="--ltx-fg-color:#000000;">BACKGROUND PAPER</span><span id="A1.SS6.p10.pic1.2.1.2" class="ltx_text" style="--ltx-fg-color:#000000;"> 
<br class="ltx_break"><span id="A1.SS6.p10.pic1.2.1.2.1" class="ltx_text ltx_font_bold">Title:</span> Process Reinforcement through Implicit Rewards 
<br class="ltx_break"><span id="A1.SS6.p10.pic1.2.1.2.2" class="ltx_text ltx_font_bold" style="font-size:90%;">Abstract (Summarized):<span id="A1.SS6.p10.pic1.2.1.2.2.1" class="ltx_text ltx_font_medium"> Dense process rewards have proven to be a highly effective alternative to sparse outcome-level rewards in the inference-time scaling of large language models, particularly for complex multi-step reasoning. However, collecting high-quality process labels is prohibitively expensive, making process reward models (PRMs) vulnerable to reward hacking. To address this, we propose PRIME (Process Reinforcement through Implicit Rewards), which enables online PRM updates using only policy rollouts and outcome labels, substantially reducing development overhead while boosting reasoning performance.</span></span></span></span>
</span></span></span></foreignobject></g><g fill-opacity="1.0" transform="matrix(1.0 0.0 0.0 1.0 11.81 51.94)"><foreignobject style="--ltx-fo-width:45.27em;--ltx-fo-height:14.69em;--ltx-fo-depth:3.18em;font-size:10pt;" height="247.26" overflow="visible" transform="matrix(1 0 0 -1 0 203.2)" width="626.41"><span class="ltx_foreignobject_container"><span class="ltx_foreignobject_content"><span id="A1.SS6.p10.pic1.3" class="ltx_inline-logical-block ltx_minipage ltx_align_bottom" style="width:45.27em;">
<span id="A1.SS6.p10.pic1.p2" class="ltx_para">
<span id="A1.SS6.p10.pic1.p2.1" class="ltx_p"><span id="A1.SS6.p10.pic1.p2.1.1" class="ltx_text ltx_font_sansserif ltx_font_bold" style="--ltx-fg-color:#000000;">GROUND TRUTH RQ</span><span id="A1.SS6.p10.pic1.p2.1.2" class="ltx_text" style="--ltx-fg-color:#000000;"> 
<br class="ltx_break"><span id="A1.SS6.p10.pic1.p2.1.2.1" class="ltx_text ltx_font_italic">“How can an online difficulty filtering algorithm maintain a fixed effective batch size to prevent training destabilization during dynamic prompt exclusion?”</span></span></span>
<span id="A1.SS6.p10.pic1.p2.2" class="ltx_p"><span id="A1.SS6.p10.pic1.p2.2.1" class="ltx_text ltx_font_sansserif ltx_font_bold" style="--ltx-fg-color:#000000;">BEST GPT-5.5 RQ</span><span id="A1.SS6.p10.pic1.p2.2.2" class="ltx_text" style="--ltx-fg-color:#000000;"> 
<br class="ltx_break"><span id="A1.SS6.p10.pic1.p2.2.2.1" class="ltx_text ltx_font_italic">“Which types of reasoning steps receive systematically incorrect implicit process rewards in PRIME, and do those misassigned rewards predict later policy errors?”</span></span></span>
</span>
