<span id="A6.T9.pic1.2.1" class="ltx_p"><span id="A6.T9.pic1.2.1.1" class="ltx_text ltx_font_typewriter" style="--ltx-fg-color:#808080;"># We use the train capacity ’neck’ to simulate unlimited bus throughput erroneously
<br class="ltx_break"><span id="A6.T9.pic1.2.1.1.1" class="ltx_text" style="--ltx-fg-color:#000000;">N = int(input())
<br class="ltx_break">neck = 10 ** 16
<br class="ltx_break"></span># The code treats taxi and airplane timings as if they were the same bottleneck, which is false
<br class="ltx_break"><span id="A6.T9.pic1.2.1.1.2" class="ltx_text" style="--ltx-fg-color:#000000;">for _ in range(5):
<br class="ltx_break">    neck = min(neck, int(input()))
<br class="ltx_break"></span># Incorrectly assumes ship departures don’t affect the final time calculation
<br class="ltx_break"><span id="A6.T9.pic1.2.1.1.3" class="ltx_text" style="--ltx-fg-color:#000000;">print(((N + neck - 1) // neck) - 1 + 5)
</span></span></span>
