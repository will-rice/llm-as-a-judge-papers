<svg id="A6.SS2.p1.pic1" class="ltx_picture" height="576.9" overflow="visible" version="1.1" viewbox="0 0 653.15 576.9" width="653.15"><g style="--ltx-stroke-color:#000000;--ltx-fill-color:#000000;" fill="#000000" stroke="#000000" stroke-width="0.4pt" transform="translate(0,576.9) matrix(1 0 0 -1 0 0)"><g style="--ltx-fill-color:#000000;" fill="#000000" fill-opacity="1.0"><path style="stroke:none" d="M 0 8.57 L 0 568.34 C 0 573.07 3.84 576.9 8.57 576.9 L 644.58 576.9 C 649.31 576.9 653.15 573.07 653.15 568.34 L 653.15 8.57 C 653.15 3.84 649.31 0 644.58 0 L 8.57 0 C 3.84 0 0 3.84 0 8.57 Z" /></g><g style="--ltx-fill-color:#FFFFFF;" fill="#FFFFFF" fill-opacity="1.0"><path style="stroke:none" d="M 0.69 8.57 L 0.69 555.35 L 652.46 555.35 L 652.46 8.57 C 652.46 4.22 648.93 0.69 644.58 0.69 L 8.57 0.69 C 4.22 0.69 0.69 4.22 0.69 8.57 Z" /></g><g fill-opacity="1.0" transform="matrix(1.0 0.0 0.0 1.0 12.5 562.67)"><foreignobject style="--ltx-fo-width:45.4em;--ltx-fo-height:0.69em;--ltx-fo-depth:0.19em;font-size:10pt;" height="12.3" overflow="visible" transform="matrix(1 0 0 -1 0 9.61)" width="628.21"><span class="ltx_foreignobject_container"><span class="ltx_foreignobject_content">
<span id="A6.SS2.p1.pic1.1" class="ltx_inline-block ltx_minipage ltx_align_bottom" style="width:45.4em;">
<span id="A6.SS2.p1.pic1.1.1" class="ltx_p"><span id="A6.SS2.p1.pic1.1.1.1" class="ltx_text" style="--ltx-fg-color:#FFFFFF;">Prompt for checking overlapping rubrics.</span></span>
</span></span></span></foreignobject></g><g fill-opacity="1.0" transform="matrix(1.0 0.0 0.0 1.0 12.5 27.49)"><foreignobject style="--ltx-fo-width:45.4em;--ltx-fo-height:37.29em;--ltx-fo-depth:1.08em;font-size:10pt;" height="531.04" overflow="visible" transform="matrix(1 0 0 -1 0 516.05)" width="628.21"><span class="ltx_foreignobject_container"><span class="ltx_foreignobject_content">
<span id="A6.SS2.p1.pic1.2" class="ltx_inline-block ltx_minipage ltx_align_bottom" style="width:45.4em;">
<span id="A6.SS2.p1.pic1.2.1" class="ltx_p"><span id="A6.SS2.p1.pic1.2.1.1" class="ltx_text" style="--ltx-fg-color:#000000;">You are checking whether a new rubric substantially overlaps with ANY of the existing rubrics. If ANY overlap is found, output YES; otherwise output NO.</span></span>
<span id="A6.SS2.p1.pic1.2.2" class="ltx_p"><span id="A6.SS2.p1.pic1.2.2.1" class="ltx_text" style="--ltx-fg-color:#000000;">Definition of substantial overlapping:</span></span>
<span id="A6.I19" class="ltx_itemize" style="--ltx-enum-leftmargin:1.2em;">
<span id="A6.I19.i1" class="ltx_item" style="list-style-type:none;"><span class="ltx_tag ltx_tag_item">•</span> 
<span id="A6.I19.i1.p1" class="ltx_para">
<span id="A6.I19.i1.p1.1" class="ltx_p"><span id="A6.I19.i1.p1.1.1" class="ltx_text" style="--ltx-fg-color:#000000;">The new rubric has the same intent as an existing rubric, or is a strict subset/superset of it, or </span><math id="A6.I19.i1.p1.m1" class="ltx_Math" alttext="\geq 70\%" display="inline" intent=":literal"><semantics><mrow><mphantom></mphantom><mo style="--ltx-fg-color:#000000;" mathcolor="#000000">≥</mo><mrow><mn style="--ltx-fg-color:#000000;" mathcolor="#000000">70</mn><mo style="--ltx-fg-color:#000000;" mathcolor="#000000">%</mo></mrow></mrow><annotation encoding="application/x-tex">\geq 70\%</annotation></semantics></math><span id="A6.I19.i1.p1.1.2" class="ltx_text" style="--ltx-fg-color:#000000;"> of its meaning is covered by the existing rubric so that applying both would not materially change scoring outcomes.</span></span>
</span></span>
<span id="A6.I19.i2" class="ltx_item" style="list-style-type:none;"><span class="ltx_tag ltx_tag_item">•</span> 
<span id="A6.I19.i2.p1" class="ltx_para">
<span id="A6.I19.i2.p1.1" class="ltx_p"><span id="A6.I19.i2.p1.1.1" class="ltx_text" style="--ltx-fg-color:#000000;">Match on meaning, not wording. Treat synonyms, paraphrases, and inverses with the same effect as overlapping (e.g., “be concise” </span><math id="A6.I19.i2.p1.m1" class="ltx_Math" alttext="\approx" display="inline" intent=":literal"><semantics><mo style="--ltx-fg-color:#000000;" mathcolor="#000000">≈</mo><annotation encoding="application/x-tex">\approx</annotation></semantics></math><span id="A6.I19.i2.p1.1.2" class="ltx_text" style="--ltx-fg-color:#000000;"> “avoid unnecessary verbosity”).</span></span>
</span></span>
<span id="A6.I19.i3" class="ltx_item" style="list-style-type:none;"><span class="ltx_tag ltx_tag_item">•</span> 
<span id="A6.I19.i3.p1" class="ltx_para">
<span id="A6.I19.i3.p1.1" class="ltx_p"><span id="A6.I19.i3.p1.1.1" class="ltx_text" style="--ltx-fg-color:#000000;">Ignore trivial phrasing, tone, and example differences unless they change the requirement.</span></span>
</span></span>
</span>
<span id="A6.SS2.p1.pic1.2.3" class="ltx_p"><span id="A6.SS2.p1.pic1.2.3.1" class="ltx_text" style="--ltx-fg-color:#000000;">Edge cases:</span></span>
<span id="A6.I20" class="ltx_itemize" style="--ltx-enum-leftmargin:1.2em;">
<span id="A6.I20.i1" class="ltx_item" style="list-style-type:none;"><span class="ltx_tag ltx_tag_item">•</span> 
<span id="A6.I20.i1.p1" class="ltx_para">
<span id="A6.I20.i1.p1.1" class="ltx_p"><span id="A6.I20.i1.p1.1.1" class="ltx_text" style="--ltx-fg-color:#000000;">If scopes are disjoint (different capability/goal) </span><math id="A6.I20.i1.p1.m1" class="ltx_Math" alttext="\rightarrow" display="inline" intent=":literal"><semantics><mo style="--ltx-fg-color:#000000;" mathcolor="#000000" stretchy="false">→</mo><annotation encoding="application/x-tex">\rightarrow</annotation></semantics></math><span id="A6.I20.i1.p1.1.2" class="ltx_text" style="--ltx-fg-color:#000000;"> NO.</span></span>
</span></span>
<span id="A6.I20.i2" class="ltx_item" style="list-style-type:none;"><span class="ltx_tag ltx_tag_item">•</span> 
<span id="A6.I20.i2.p1" class="ltx_para">
<span id="A6.I20.i2.p1.1" class="ltx_p"><span id="A6.I20.i2.p1.1.1" class="ltx_text" style="--ltx-fg-color:#000000;">If the new rubric adds only minor qualifiers (e.g., “clearly”/“appropriately”) without changing evaluation </span><math id="A6.I20.i2.p1.m1" class="ltx_Math" alttext="\rightarrow" display="inline" intent=":literal"><semantics><mo style="--ltx-fg-color:#000000;" mathcolor="#000000" stretchy="false">→</mo><annotation encoding="application/x-tex">\rightarrow</annotation></semantics></math><span id="A6.I20.i2.p1.1.2" class="ltx_text" style="--ltx-fg-color:#000000;"> YES.</span></span>
</span></span>
<span id="A6.I20.i3" class="ltx_item" style="list-style-type:none;"><span class="ltx_tag ltx_tag_item">•</span> 
<span id="A6.I20.i3.p1" class="ltx_para">
<span id="A6.I20.i3.p1.1" class="ltx_p"><span id="A6.I20.i3.p1.1.1" class="ltx_text" style="--ltx-fg-color:#000000;">If the new rubric merely narrows the context while keeping the same criterion (subset) or broadens it (superset) </span><math id="A6.I20.i3.p1.m1" class="ltx_Math" alttext="\rightarrow" display="inline" intent=":literal"><semantics><mo style="--ltx-fg-color:#000000;" mathcolor="#000000" stretchy="false">→</mo><annotation encoding="application/x-tex">\rightarrow</annotation></semantics></math><span id="A6.I20.i3.p1.1.2" class="ltx_text" style="--ltx-fg-color:#000000;"> YES.</span></span>
</span></span>
</span>
<span id="A6.SS2.p1.pic1.2.4" class="ltx_p"><span id="A6.SS2.p1.pic1.2.4.1" class="ltx_text" style="--ltx-fg-color:#000000;">Input format:</span></span>
<span id="A6.I21" class="ltx_itemize" style="--ltx-enum-leftmargin:1.2em;">
<span id="A6.I21.i1" class="ltx_item" style="list-style-type:none;"><span class="ltx_tag ltx_tag_item">•</span> 
<span id="A6.I21.i1.p1" class="ltx_para">
<span id="A6.I21.i1.p1.1" class="ltx_p"><span id="A6.I21.i1.p1.1.1" class="ltx_text ltx_font_typewriter" style="--ltx-fg-color:#000000;">EXISTING_RUBRICS: {existing_rubrics}</span></span>
</span></span>
<span id="A6.I21.i2" class="ltx_item" style="list-style-type:none;"><span class="ltx_tag ltx_tag_item">•</span> 
<span id="A6.I21.i2.p1" class="ltx_para">
<span id="A6.I21.i2.p1.1" class="ltx_p"><span id="A6.I21.i2.p1.1.1" class="ltx_text ltx_font_typewriter" style="--ltx-fg-color:#000000;">NEW_RUBRIC: {new_rubric}</span></span>
</span></span>
</span>
<span id="A6.SS2.p1.pic1.2.5" class="ltx_p"><span id="A6.SS2.p1.pic1.2.5.1" class="ltx_text" style="--ltx-fg-color:#000000;">Output STRICTLY in below format. No other text is allowed:</span></span>
<span id="A6.I22" class="ltx_itemize" style="--ltx-enum-leftmargin:1.2em;">
<span id="A6.I22.i1" class="ltx_item" style="list-style-type:none;"><span class="ltx_tag ltx_tag_item">•</span> 
<span id="A6.I22.i1.p1" class="ltx_para">
<span id="A6.I22.i1.p1.1" class="ltx_p"><span id="A6.I22.i1.p1.1.1" class="ltx_text ltx_font_typewriter" style="--ltx-fg-color:#000000;">&lt;EVALUATION&gt; YES/NO &lt;/EVALUATION&gt;</span></span>
</span></span>
</span>
</span></span></span></foreignobject></g></g></svg>