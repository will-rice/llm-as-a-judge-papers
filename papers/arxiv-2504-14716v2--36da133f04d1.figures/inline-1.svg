<span id="S3.SS3.SSS0.Px2.p5.pic1.2" class="ltx_inline-block ltx_minipage ltx_align_bottom" style="width:39.18em;">
<span id="S3.SS3.SSS0.Px2.p5.pic1.2.1" class="ltx_p"><span id="S3.SS3.SSS0.Px2.p5.pic1.2.1.1" class="ltx_text" style="font-size:80%;--ltx-fg-color:#000000;">You are given an instruction and two responses ’A’ and ’B’ generated by a language model. The instruction consists of an open ended task marked ’Question’ and text format requirements marked ’Format’. Analyze each response for adherence to every text formatting instruction one by one. 
<br class="ltx_break">
<br class="ltx_break">After evaluating instructions followed, state which response better adheres to the text format requirements. Output ’A’ is response A is better, ’B’ if response B is better or ’C’ if both responses are equally effective to indicate Tie. Avoid any position biases and ensure that the order in which the responses were presented does not influence your decision. Do not allow the length of the responses to influence your evaluation. Do not favor certain names of the assistants. Be as objective as possible. Output your final answer as a preference between the two assistants by strictly following this output format: [[A]] if assistant A is better, [[B]] if assistant B is better, and [[C]] for a tie.

<br class="ltx_break"></span></span>
<span id="S3.SS3.SSS0.Px2.p5.pic1.2.2" class="ltx_p"><span id="S3.SS3.SSS0.Px2.p5.pic1.2.2.1" class="ltx_text ltx_font_typewriter" style="font-size:80%;--ltx-fg-color:#000000;">#Instruction: {{input}}<span id="S3.SS3.SSS0.Px2.p5.pic1.2.2.1.1" class="ltx_text ltx_font_serif"> 
