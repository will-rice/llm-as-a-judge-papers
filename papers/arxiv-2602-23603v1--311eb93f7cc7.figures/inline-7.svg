<span id="A1.SS7.p1.pic1.2.1" class="ltx_p"><span id="A1.SS7.p1.pic1.2.1.1" class="ltx_text" style="font-size:90%;--ltx-fg-color:#000000;">You will be given one answer written for a question.</span></span>
<span id="A1.SS7.p1.pic1.2.2" class="ltx_p"><span id="A1.SS7.p1.pic1.2.2.1" class="ltx_text" style="font-size:90%;--ltx-fg-color:#000000;">Your task is to rate the answer on one metric.</span></span>
<span id="A1.SS7.p1.pic1.2.3" class="ltx_p"><span id="A1.SS7.p1.pic1.2.3.1" class="ltx_text" style="font-size:90%;--ltx-fg-color:#000000;">Please make sure you read and understand these instructions carefully. Please keep this document open while reviewing, and refer to it as needed.</span></span>
<span id="A1.SS7.p1.pic1.2.4" class="ltx_p"><span id="A1.SS7.p1.pic1.2.4.1" class="ltx_text" style="font-size:90%;--ltx-fg-color:#000000;">Evaluation Criteria:</span></span>
<span id="A1.SS7.p1.pic1.2.5" class="ltx_p"><span id="A1.SS7.p1.pic1.2.5.1" class="ltx_text" style="font-size:90%;--ltx-fg-color:#000000;">Fluency (1-3): the quality of the answer in terms of grammar, spelling, punctuation, word choice, and sentence structure.</span></span>
<span id="A1.SS7.p1.pic1.2.6" class="ltx_p"><span id="A1.SS7.p1.pic1.2.6.1" class="ltx_text" style="font-size:90%;--ltx-fg-color:#000000;">- 1: Poor. The answer has many errors that make it hard to understand or sound unnatural.</span></span>
<span id="A1.SS7.p1.pic1.2.7" class="ltx_p"><span id="A1.SS7.p1.pic1.2.7.1" class="ltx_text" style="font-size:90%;--ltx-fg-color:#000000;">- 2: Fair. The answer has some errors that affect the clarity or smoothness of the text, but the main points are still comprehensible.</span></span>
<span id="A1.SS7.p1.pic1.2.8" class="ltx_p"><span id="A1.SS7.p1.pic1.2.8.1" class="ltx_text" style="font-size:90%;--ltx-fg-color:#000000;">- 3: Good. The answer has few or no errors and is easy to read and follow.</span></span>
<span id="A1.SS7.p1.pic1.2.9" class="ltx_p"><span id="A1.SS7.p1.pic1.2.9.1" class="ltx_text" style="font-size:90%;--ltx-fg-color:#000000;">Example:</span></span>
