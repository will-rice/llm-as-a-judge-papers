<span id="A8.p9.pic1.2" class="ltx_inline-block ltx_minipage ltx_align_bottom" style="width:37.04em;">
<span id="A8.p9.pic1.2.1" class="ltx_p"><span id="A8.p9.pic1.2.1.1" class="ltx_text ltx_font_sansserif" style="--ltx-fg-color:#000000;">After my team qualified for the World Cup, I ran into the street yelling,
“WE DID IT!” My neighbor looked at me and said, “What exactly did <span id="A8.p9.pic1.2.1.1.1" class="ltx_text ltx_font_italic">you</span>
do?” I told him, “I successfully avoided jinxing them by not washing my lucky
socks for six months. You’re welcome.”
