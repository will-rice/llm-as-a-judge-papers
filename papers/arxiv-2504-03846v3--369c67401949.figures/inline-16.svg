<span id="A6.T21.pic1.1.1" class="ltx_p">Write a function to search a string for a regex pattern. The function should return the matching subtring, a start index and an end index. Do not include other descriptions except comments for the code.</span>
<span id="A6.T21.pic1.1.2" class="ltx_p">Your code should satisfy these tests:</span>
<span id="A6.T21.pic1.1.3" class="ltx_p"><span id="A6.T21.pic1.1.3.1" class="ltx_text ltx_font_typewriter">
assert find_literals(’The quick brown fox jumps over the lazy dog.’, ’fox’) == (’fox’, 16, 19)
<br class="ltx_break">assert find_literals(’Its been a very crazy procedure right’, ’crazy’) == (’crazy’, 16, 21)
<br class="ltx_break">assert find_literals(’Hardest choices required strongest will’, ’will’) == (’will’, 35, 39)
</span></span>
