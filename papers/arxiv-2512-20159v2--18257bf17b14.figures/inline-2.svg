<span id="S5.SS1.p8.pic1.1" class="ltx_inline-block ltx_minipage ltx_align_bottom" style="width:33.5em;">
<span id="S5.SS1.p8.pic1.1.1" class="ltx_p"><span id="S5.SS1.p8.pic1.1.1.1" class="ltx_text ltx_font_bold" style="--ltx-fg-color:#000000;">Finding 2:<span id="S5.SS1.p8.pic1.1.1.1.1" class="ltx_text ltx_font_medium"> LLM-as-a-judge metrics exhibit systematic pessimism, frequently underestimating the quality of programs. While rule-based metrics achieve superior distributional fidelity with low correlation, LLM-as-a-judge metrics trade this fidelity for ranking capability, resulting in more accurate relative orders but biased absolute scores.</span></span></span>
</span></span></span></foreignobject></g></g></svg>