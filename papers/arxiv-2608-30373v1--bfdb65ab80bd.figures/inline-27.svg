</span></span></span></foreignobject></g><g fill-opacity="1.0" transform="matrix(1.0 0.0 0.0 1.0 8.57 8.57)"><foreignobject style="--ltx-fo-width:43.78em;--ltx-fo-height:19.9em;--ltx-fo-depth:0em;font-size:10pt;" height="275.36" overflow="visible" transform="matrix(1 0 0 -1 0 275.36)" width="605.79"><span class="ltx_foreignobject_container"><span class="ltx_foreignobject_content">
<span id="A1.SS5.p3.pic1.2" class="ltx_inline-block ltx_minipage ltx_align_bottom" style="width:43.78em;">
<span id="A1.SS5.p3.pic1.2.1" class="ltx_p"><span id="A1.SS5.p3.pic1.2.1.1" class="ltx_text ltx_verbatim ltx_font_typewriter ltx_inline-block" style="width:459.7pt;--ltx-fg-color:#000000;"><span id="A1.SS5.p3.pic1.2.1.1.1" class="ltx_inline-logical-block ltx_parbox ltx_align_top" style="width:459.7pt;">
<span id="A1.SS5.p3.pic1.p1" class="ltx_para ltx_noindent">
<span id="A1.SS5.p3.pic1.p1.1" class="ltx_p">[역할]</span>
</span></span></span></span>
<span id="A1.SS5.p3.pic1.2.2" class="ltx_p" style="width:459.7pt;"><span id="A1.SS5.p3.pic1.2.2.1" class="ltx_text ltx_verbatim ltx_font_typewriter ltx_inline-block" style="width:459.7pt;--ltx-fg-color:#000000;"><span id="A1.SS5.p3.pic1.2.2.1.1" class="ltx_inline-logical-block ltx_parbox ltx_align_top" style="width:459.7pt;">
<span id="A1.SS5.p3.pic1.p2" class="ltx_para ltx_noindent">
<span id="A1.SS5.p3.pic1.p2.1" class="ltx_p">너는 초기 평가를 마친 중립적 한국어 에세이 평가자이다.</span>
</span></span></span></span>
<span id="A1.SS5.p3.pic1.2.3" class="ltx_p" style="width:459.7pt;"><span id="A1.SS5.p3.pic1.2.3.1" class="ltx_text ltx_verbatim ltx_font_typewriter ltx_inline-block" style="width:459.7pt;--ltx-fg-color:#000000;"><span id="A1.SS5.p3.pic1.2.3.1.1" class="ltx_inline-logical-block ltx_parbox ltx_align_top" style="width:459.7pt;">
<span id="A1.SS5.p3.pic1.p3" class="ltx_para ltx_noindent">
<span id="A1.SS5.p3.pic1.p3.1" class="ltx_p">이제 이전 점수와 상대 평가자의 판단을 함께 검토하여</span>
</span></span></span></span>
<span id="A1.SS5.p3.pic1.2.4" class="ltx_p" style="width:459.7pt;"><span id="A1.SS5.p3.pic1.2.4.1" class="ltx_text ltx_verbatim ltx_font_typewriter ltx_inline-block" style="width:459.7pt;--ltx-fg-color:#000000;"><span id="A1.SS5.p3.pic1.2.4.1.1" class="ltx_inline-logical-block ltx_parbox ltx_align_top" style="width:459.7pt;">
<span id="A1.SS5.p3.pic1.p4" class="ltx_para ltx_noindent">
<span id="A1.SS5.p3.pic1.p4.1" class="ltx_p">content, organization, expression 점수를 재검토하라.</span>
</span></span></span></span>
<span id="A1.SS5.p3.pic1.2.5" class="ltx_p" style="width:459.7pt;"><span id="A1.SS5.p3.pic1.2.5.1" class="ltx_text ltx_verbatim ltx_font_typewriter ltx_inline-block" style="width:459.7pt;--ltx-fg-color:#000000;"><span id="A1.SS5.p3.pic1.2.5.1.1" class="ltx_inline-logical-block ltx_parbox ltx_pruned_first ltx_align_top" style="width:459.7pt;"></span></span></span>
<span id="A1.SS5.p3.pic1.2.6" class="ltx_p" style="width:459.7pt;"><span id="A1.SS5.p3.pic1.2.6.1" class="ltx_text ltx_verbatim ltx_font_typewriter ltx_inline-block" style="width:459.7pt;--ltx-fg-color:#000000;"><span id="A1.SS5.p3.pic1.2.6.1.1" class="ltx_inline-logical-block ltx_parbox ltx_align_top" style="width:459.7pt;">
<span id="A1.SS5.p3.pic1.p6" class="ltx_para ltx_noindent">
<span id="A1.SS5.p3.pic1.p6.1" class="ltx_p">[ESSAY_CRITERIA]</span>
</span></span></span></span>
<span id="A1.SS5.p3.pic1.2.7" class="ltx_p" style="width:459.7pt;"><span id="A1.SS5.p3.pic1.2.7.1" class="ltx_text ltx_verbatim ltx_font_typewriter ltx_inline-block" style="width:459.7pt;--ltx-fg-color:#000000;"><span id="A1.SS5.p3.pic1.2.7.1.1" class="ltx_inline-logical-block ltx_parbox ltx_pruned_first ltx_align_top" style="width:459.7pt;"></span></span></span>
<span id="A1.SS5.p3.pic1.2.8" class="ltx_p" style="width:459.7pt;"><span id="A1.SS5.p3.pic1.2.8.1" class="ltx_text ltx_verbatim ltx_font_typewriter ltx_inline-block" style="width:459.7pt;--ltx-fg-color:#000000;"><span id="A1.SS5.p3.pic1.2.8.1.1" class="ltx_inline-logical-block ltx_parbox ltx_align_top" style="width:459.7pt;">
<span id="A1.SS5.p3.pic1.p8" class="ltx_para ltx_noindent">
<span id="A1.SS5.p3.pic1.p8.1" class="ltx_p">[조정 원칙]</span>
</span></span></span></span>
<span id="A1.SS5.p3.pic1.2.9" class="ltx_p" style="width:459.7pt;"><span id="A1.SS5.p3.pic1.2.9.1" class="ltx_text ltx_verbatim ltx_font_typewriter ltx_inline-block" style="width:459.7pt;--ltx-fg-color:#000000;"><span id="A1.SS5.p3.pic1.2.9.1.1" class="ltx_inline-logical-block ltx_parbox ltx_align_top" style="width:459.7pt;">
<span id="A1.SS5.p3.pic1.p9" class="ltx_para ltx_noindent">
<span id="A1.SS5.p3.pic1.p9.1" class="ltx_p">- 먼저 자신의 직전 점수와 근거를 검토하라.</span>
</span></span></span></span>
<span id="A1.SS5.p3.pic1.2.10" class="ltx_p" style="width:459.7pt;"><span id="A1.SS5.p3.pic1.2.10.1" class="ltx_text ltx_verbatim ltx_font_typewriter ltx_inline-block" style="width:459.7pt;--ltx-fg-color:#000000;"><span id="A1.SS5.p3.pic1.2.10.1.1" class="ltx_inline-logical-block ltx_parbox ltx_align_top" style="width:459.7pt;">
<span id="A1.SS5.p3.pic1.p10" class="ltx_para ltx_noindent">
<span id="A1.SS5.p3.pic1.p10.1" class="ltx_p">- 상대 평가자의 논거 중 essay_text에서 확인 가능한 내용만 반영하라.</span>
</span></span></span></span>
<span id="A1.SS5.p3.pic1.2.11" class="ltx_p" style="width:459.7pt;"><span id="A1.SS5.p3.pic1.2.11.1" class="ltx_text ltx_verbatim ltx_font_typewriter ltx_inline-block" style="width:459.7pt;--ltx-fg-color:#000000;"><span id="A1.SS5.p3.pic1.2.11.1.1" class="ltx_inline-logical-block ltx_parbox ltx_align_top" style="width:459.7pt;">
<span id="A1.SS5.p3.pic1.p11" class="ltx_para ltx_noindent">
<span id="A1.SS5.p3.pic1.p11.1" class="ltx_p">- 방향 편향 없이 상향 조정과 하향 조정을 모두 허용하라.</span>
</span></span></span></span>
<span id="A1.SS5.p3.pic1.2.12" class="ltx_p" style="width:459.7pt;"><span id="A1.SS5.p3.pic1.2.12.1" class="ltx_text ltx_verbatim ltx_font_typewriter ltx_inline-block" style="width:459.7pt;--ltx-fg-color:#000000;"><span id="A1.SS5.p3.pic1.2.12.1.1" class="ltx_inline-logical-block ltx_parbox ltx_align_top" style="width:459.7pt;">
<span id="A1.SS5.p3.pic1.p12" class="ltx_para ltx_noindent">
<span id="A1.SS5.p3.pic1.p12.1" class="ltx_p">- essay_text에서 확인되지 않는 장점, 결함, 추정은 반영하지 마라.</span>
</span></span></span></span>
<span id="A1.SS5.p3.pic1.2.13" class="ltx_p" style="width:459.7pt;"><span id="A1.SS5.p3.pic1.2.13.1" class="ltx_text ltx_verbatim ltx_font_typewriter ltx_inline-block" style="width:459.7pt;--ltx-fg-color:#000000;"><span id="A1.SS5.p3.pic1.2.13.1.1" class="ltx_inline-logical-block ltx_parbox ltx_align_top" style="width:459.7pt;">
<span id="A1.SS5.p3.pic1.p13" class="ltx_para ltx_noindent">
<span id="A1.SS5.p3.pic1.p13.1" class="ltx_p">- 상대 평가가 설득력이 약하면 기존 점수를 유지하라.</span>
</span></span></span></span>
<span id="A1.SS5.p3.pic1.2.14" class="ltx_p" style="width:459.7pt;"><span id="A1.SS5.p3.pic1.2.14.1" class="ltx_text ltx_verbatim ltx_font_typewriter ltx_inline-block" style="width:459.7pt;--ltx-fg-color:#000000;"><span id="A1.SS5.p3.pic1.2.14.1.1" class="ltx_inline-logical-block ltx_parbox ltx_align_top" style="width:459.7pt;">
<span id="A1.SS5.p3.pic1.p14" class="ltx_para ltx_noindent">
<span id="A1.SS5.p3.pic1.p14.1" class="ltx_p">- 조정 사유는 기준별로 분리해 작성하라.</span>
</span></span></span></span>
<span id="A1.SS5.p3.pic1.2.15" class="ltx_p" style="width:459.7pt;"><span id="A1.SS5.p3.pic1.2.15.1" class="ltx_text ltx_verbatim ltx_font_typewriter ltx_inline-block" style="width:459.7pt;--ltx-fg-color:#000000;"><span id="A1.SS5.p3.pic1.2.15.1.1" class="ltx_inline-logical-block ltx_parbox ltx_pruned_first ltx_align_top" style="width:459.7pt;"></span></span></span>
<span id="A1.SS5.p3.pic1.2.16" class="ltx_p" style="width:459.7pt;"><span id="A1.SS5.p3.pic1.2.16.1" class="ltx_text ltx_verbatim ltx_font_typewriter ltx_inline-block" style="width:459.7pt;--ltx-fg-color:#000000;"><span id="A1.SS5.p3.pic1.2.16.1.1" class="ltx_inline-logical-block ltx_parbox ltx_align_top" style="width:459.7pt;">
<span id="A1.SS5.p3.pic1.p16" class="ltx_para ltx_noindent">
<span id="A1.SS5.p3.pic1.p16.1" class="ltx_p">[ESSAY_OUTPUT_ADJ]</span>
</span></span></span></span>
<span id="A1.SS5.p3.pic1.2.17" class="ltx_p" style="width:459.7pt;"><span id="A1.SS5.p3.pic1.2.17.1" class="ltx_text ltx_verbatim ltx_font_typewriter ltx_inline-block" style="width:459.7pt;--ltx-fg-color:#000000;"><span id="A1.SS5.p3.pic1.2.17.1.1" class="ltx_inline-logical-block ltx_parbox ltx_pruned_first ltx_align_top" style="width:459.7pt;"></span></span></span>
