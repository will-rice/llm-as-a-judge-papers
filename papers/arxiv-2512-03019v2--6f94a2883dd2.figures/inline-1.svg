<span id="A1.F5.pic1.2" class="ltx_inline-block ltx_minipage ltx_align_bottom" style="width:42.68em;">
<span id="A1.F5.pic1.2.1" class="ltx_p"><span id="A1.F5.pic1.2.1.1" class="ltx_text ltx_font_typewriter" style="font-size:70%;--ltx-fg-color:#000000;">You are given two translations of a source text from {sl} to {tl}.
<br class="ltx_break">Your job is to pick which translation is better based on fluency and accuracy.
<br class="ltx_break">
<br class="ltx_break">You should return a rating based on this:
<br class="ltx_break">If A is better than B: [[A]]
<br class="ltx_break">If A and B have the same accuracy and fluency: [[SAME]]
<br class="ltx_break">If B is better than A: [[B]]
<br class="ltx_break">
<br class="ltx_break">AVOID POSITIONAL BIAS.
<br class="ltx_break">
<br class="ltx_break">First analyze in depth the source and two translations by listing weaknesses and strengths and then output the rating [[A]], [[B]] and [[SAME]].
<br class="ltx_break">
<br class="ltx_break">[SOURCE TEXT]
<br class="ltx_break">{source} 
<br class="ltx_break">
<br class="ltx_break">[TRANSLATION A]
<br class="ltx_break">{translation_a} 
<br class="ltx_break">
<br class="ltx_break">[TRANSLATION B]
