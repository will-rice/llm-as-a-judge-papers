<span id="A1.p11.pic1.1" class="ltx_inline-block ltx_minipage ltx_align_bottom" style="width:39.77em;">
<span id="A1.p11.pic1.1.1" class="ltx_p"><span id="A1.p11.pic1.1.1.1" class="ltx_text ltx_font_sansserif ltx_font_bold" style="--ltx-fg-color:#FFFFFF;">Meta-judge (rubric comparison)</span></span>
</span></span></span></foreignobject></g><g fill-opacity="1.0" transform="matrix(1.0 0.0 0.0 1.0 10.16 182.65)"><foreignobject style="--ltx-fo-width:43.55em;--ltx-fo-height:15.09em;--ltx-fo-depth:0.25em;font-size:10pt;" height="212.21" overflow="visible" transform="matrix(1 0 0 -1 0 208.75)" width="602.61"><span class="ltx_foreignobject_container"><span class="ltx_foreignobject_content">
<span id="A1.p11.pic1.2" class="ltx_inline-block ltx_minipage ltx_align_bottom" style="width:43.55em;">
<span id="A1.p11.pic1.2.1" class="ltx_p"><span id="A1.p11.pic1.2.1.1" class="ltx_text ltx_font_bold" style="--ltx-fg-color:#000000;">System:<span id="A1.p11.pic1.2.1.1.1" class="ltx_text ltx_font_typewriter ltx_font_medium"> You are a meta-evaluator that assesses the quality of evaluation rubrics. You will be given a task prompt and two candidate rubrics (Rubric A and Rubric B). Determine which rubric would be more effective for evaluating AI responses to the given prompt.
</span></span></span>
<span id="A1.p11.pic1.2.2" class="ltx_p"><span id="A1.p11.pic1.2.2.1" class="ltx_text ltx_font_typewriter" style="--ltx-fg-color:#000000;">Consider these dimensions:
<br class="ltx_break">1. Specificity: Are criteria concrete and testable (yes/no answerable), or vague and subjective?
<br class="ltx_break">2. Coverage: Do criteria address the key aspects an expert would check?
<br class="ltx_break">3. Discriminability: Can these criteria distinguish genuinely good responses from superficially good ones?
<br class="ltx_break">4. Domain-appropriateness: Do criteria reflect the expertise level the task requires?
</span></span>
<span id="A1.p11.pic1.2.3" class="ltx_p"><span id="A1.p11.pic1.2.3.1" class="ltx_text ltx_font_typewriter" style="--ltx-fg-color:#000000;">Output ONLY a JSON object:
<br class="ltx_break">{&quot;winner&quot;: &quot;A&quot; or &quot;B&quot;, &quot;reason&quot;: &quot;brief explanation&quot;}
</span></span>
</span></span></span></foreignobject></g><g fill-opacity="1.0" transform="matrix(1.0 0.0 0.0 1.0 10.16 13.24)"><foreignobject style="--ltx-fo-width:43.55em;--ltx-fo-height:10.29em;--ltx-fo-depth:0.22em;font-size:10pt;" height="145.41" overflow="visible" transform="matrix(1 0 0 -1 0 142.33)" width="602.61"><span class="ltx_foreignobject_container"><span class="ltx_foreignobject_content">
<span id="A1.p11.pic1.3" class="ltx_inline-block ltx_minipage ltx_align_bottom" style="width:43.55em;">
<span id="A1.p11.pic1.3.1" class="ltx_p"><span id="A1.p11.pic1.3.1.1" class="ltx_text ltx_font_bold" style="--ltx-fg-color:#000000;">User:<span id="A1.p11.pic1.3.1.1.1" class="ltx_text ltx_font_typewriter ltx_font_medium"> [Task Prompt]
<br class="ltx_break">{prompt}
<br class="ltx_break" style="--ltx-break-space:5.3pt;">
[Rubric A]
<br class="ltx_break">{rubric_a}
<br class="ltx_break" style="--ltx-break-space:5.3pt;">
[Rubric B]
<br class="ltx_break">{rubric_b}
<br class="ltx_break" style="--ltx-break-space:5.3pt;">
Which rubric is better for evaluating responses to this task? Output only the JSON object.
</span></span></span>
</span></span></span></foreignobject></g></g></svg>