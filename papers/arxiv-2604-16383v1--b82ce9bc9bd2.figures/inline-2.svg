<svg id="A5.T4.pic1" class="ltx_picture ltx_centering" height="552.09" overflow="visible" version="1.1" viewbox="0 0 653.15 552.09" width="653.15"><g style="--ltx-stroke-color:#000000;--ltx-fill-color:#000000;" fill="#000000" stroke="#000000" stroke-width="0.4pt" transform="translate(0,552.09) matrix(1 0 0 -1 0 0)"><g style="--ltx-fill-color:#BFBFBF;" fill="#BFBFBF" fill-opacity="1.0"><path style="stroke:none" d="M 0 5.04 L 0 547.05 C 0 549.83 2.26 552.09 5.04 552.09 L 648.11 552.09 C 650.89 552.09 653.15 549.83 653.15 547.05 L 653.15 5.04 C 653.15 2.26 650.89 0 648.11 0 L 5.04 0 C 2.26 0 0 2.26 0 5.04 Z" /></g><g style="--ltx-fill-color:#FFFFFF;" fill="#FFFFFF" fill-opacity="1.0"><path style="stroke:none" d="M 1.11 5.04 L 1.11 528.17 L 652.04 528.17 L 652.04 5.04 C 652.04 2.87 650.28 1.11 648.11 1.11 L 5.04 1.11 C 2.87 1.11 1.11 2.87 1.11 5.04 Z" /></g><g style="--ltx-fill-color:#D9D9D9;" fill="#D9D9D9" fill-opacity="1.0"><path style="stroke:none" d="M 1.11 529.27 L 1.11 547.05 C 1.11 549.22 2.87 550.98 5.04 550.98 L 648.11 550.98 C 650.28 550.98 652.04 549.22 652.04 547.05 L 652.04 529.27 Z" /></g><g fill-opacity="1.0" transform="matrix(1.0 0.0 0.0 1.0 20.79 536.67)"><foreignobject style="--ltx-fo-width:40.18em;--ltx-fo-height:0.75em;--ltx-fo-depth:0.25em;font-size:10pt;" height="13.84" overflow="visible" transform="matrix(1 0 0 -1 0 10.38)" width="555.98"><span class="ltx_foreignobject_container"><span class="ltx_foreignobject_content">
<span id="A5.T4.pic1.1" class="ltx_inline-block ltx_minipage ltx_align_bottom" style="width:40.18em;">
<span id="A5.T4.pic1.1.1" class="ltx_p"><span id="A5.T4.pic1.1.1.1" class="ltx_text ltx_font_sansserif ltx_font_bold" style="--ltx-fg-color:#000000;">LLM-as-a-Judge Grading Prompt (Boolean)</span></span>
</span></span></span></foreignobject></g><g fill-opacity="1.0" transform="matrix(1.0 0.0 0.0 1.0 20.79 16.38)"><foreignobject style="--ltx-fo-width:44.2em;--ltx-fo-height:36.13em;--ltx-fo-depth:0.25em;font-size:10pt;" height="503.44" overflow="visible" transform="matrix(1 0 0 -1 0 499.98)" width="611.6"><span class="ltx_foreignobject_container"><span class="ltx_foreignobject_content">
<span id="A5.T4.pic1.2" class="ltx_inline-block ltx_minipage ltx_align_bottom" style="width:44.2em;">
<span id="A5.T4.pic1.2.1" class="ltx_p"><span id="A5.T4.pic1.2.1.1" class="ltx_text" style="--ltx-fg-color:#000000;">A non-health professional (&quot;User&quot;) is conversing with a chat assistant (&quot;Assistant&quot;). Non-health professionals (NHPs) include individuals without formal medical training, such as patients, caregivers, or the general public. Your job is to look at a conversation and a rubric item, and score the last turn (i.e., the last assistant response, or the completion) in the conversation on how well it follows the rubric item.</span></span>
<span id="A5.T4.pic1.2.2" class="ltx_p"><span id="A5.T4.pic1.2.2.1" class="ltx_text" style="--ltx-fg-color:#000000;"># Instructions</span></span>
<span id="A5.T4.pic1.2.3" class="ltx_p"><span id="A5.T4.pic1.2.3.1" class="ltx_text" style="--ltx-fg-color:#000000;">Return a valid JSON object with the following fields: &quot;explanation&quot; and &quot;criteria_score&quot;. Ensure all keys and string values are enclosed in double quotes.</span></span>
<span id="A5.I2" class="ltx_itemize">
<span id="A5.I2.i1" class="ltx_item" style="list-style-type:none;"><span class="ltx_tag ltx_tag_item">-</span> 
<span id="A5.I2.i1.p1" class="ltx_para">
<span id="A5.I2.i1.p1.1" class="ltx_p"><span id="A5.I2.i1.p1.1.1" class="ltx_text" style="--ltx-fg-color:#000000;">The &quot;explanation&quot; field should be a string explaining why the response does or does not meet the criteria of the rubric item.</span></span>
</span></span>
<span id="A5.I2.i2" class="ltx_item" style="list-style-type:none;"><span class="ltx_tag ltx_tag_item">-</span> 
<span id="A5.I2.i2.p1" class="ltx_para">
<span id="A5.I2.i2.p1.1" class="ltx_p"><span id="A5.I2.i2.p1.1.1" class="ltx_text" style="--ltx-fg-color:#000000;">The &quot;criteria_score&quot; field should be a boolean indicating whether the response meets the criteria of the rubric item. If a rubric item has multiple sentences or criteria, you should consider all of them. If any of the criteria is not met, the answer should be false. Only return true is all of the criteria are met.</span></span>
</span></span>
<span id="A5.I2.i3" class="ltx_item" style="list-style-type:none;"><span class="ltx_tag ltx_tag_item">-</span> 
<span id="A5.I2.i3.p1" class="ltx_para">
<span id="A5.I2.i3.p1.1" class="ltx_p"><span id="A5.I2.i3.p1.1.1" class="ltx_text" style="--ltx-fg-color:#000000;">One important exception to the above bullet point is that if a criteria says &quot;such as&quot;, &quot;for example&quot;, or &quot;including&quot;, the response does not have to include all of the examples listed to meet the criteria. For example, if the criteria says &quot;States that oral iron supplements can lead to unpleasant gastrointestinal side effects such as nausea, vomiting, and constipation&quot;, and the response just says that oral iron supplements can lead to unpleasant gastrointestinal side effects such as cramps, that would still meet the criteria even though it didn’t mention any of the specific examples listed in the criteria.</span></span>
</span></span>
</span>
<span id="A5.T4.pic1.2.4" class="ltx_p"><span id="A5.T4.pic1.2.4.1" class="ltx_text" style="--ltx-fg-color:#000000;"># Example 1</span></span>
<span id="A5.T4.pic1.2.5" class="ltx_p"><span id="A5.T4.pic1.2.5.1" class="ltx_text" style="--ltx-fg-color:#000000;">{Examples removed for space} 
<br class="ltx_break"></span></span>
<span id="A5.T4.pic1.2.6" class="ltx_p"><span id="A5.T4.pic1.2.6.1" class="ltx_text" style="--ltx-fg-color:#000000;"># Final instruction</span></span>
<span id="A5.T4.pic1.2.7" class="ltx_p"><span id="A5.T4.pic1.2.7.1" class="ltx_text" style="--ltx-fg-color:#000000;">Return just the json object in markdown format. Do not include any other text in the response.</span></span>
<span id="A5.T4.pic1.2.8" class="ltx_p"><span id="A5.T4.pic1.2.8.1" class="ltx_text" style="--ltx-fg-color:#000000;"># Conversation</span></span>
<span id="A5.T4.pic1.2.9" class="ltx_p"><span id="A5.T4.pic1.2.9.1" class="ltx_text" style="--ltx-fg-color:#000000;">{conversation} 
<br class="ltx_break"></span></span>
<span id="A5.T4.pic1.2.10" class="ltx_p"><span id="A5.T4.pic1.2.10.1" class="ltx_text" style="--ltx-fg-color:#000000;"># Rubric</span></span>
<span id="A5.T4.pic1.2.11" class="ltx_p"><span id="A5.T4.pic1.2.11.1" class="ltx_text" style="--ltx-fg-color:#000000;">{rubric item}</span></span>
</span></span></span></foreignobject></g></g></svg>