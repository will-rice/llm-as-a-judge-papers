<svg id="A8.p4.pic1" class="ltx_picture" height="1389.12" overflow="visible" version="1.1" viewbox="0 0 550 1389.12" width="550"><g style="--ltx-stroke-color:#000000;--ltx-fill-color:#000000;" fill="#000000" stroke="#000000" stroke-width="0.4pt" transform="translate(0,1389.12) matrix(1 0 0 -1 0 0)"><g style="--ltx-fill-color:#D9B841;" fill="#D9B841" fill-opacity="1.0"><path style="stroke:none" d="M 0 5.91 L 0 1383.22 C 0 1386.48 2.64 1389.12 5.91 1389.12 L 544.09 1389.12 C 547.36 1389.12 550 1386.48 550 1383.22 L 550 5.91 C 550 2.64 547.36 0 544.09 0 L 5.91 0 C 2.64 0 0 2.64 0 5.91 Z" /></g><g style="--ltx-fill-color:#FFFFFA;" fill="#FFFFFA" fill-opacity="1.0"><path style="stroke:none" d="M 1.97 5.91 L 1.97 1363.47 L 548.03 1363.47 L 548.03 5.91 C 548.03 3.73 546.27 1.97 544.09 1.97 L 5.91 1.97 C 3.73 1.97 1.97 3.73 1.97 5.91 Z" /></g><g fill-opacity="1.0" transform="matrix(1.0 0.0 0.0 1.0 5.91 1372.84)"><foreignobject style="--ltx-fo-width:33.83em;--ltx-fo-height:0.75em;--ltx-fo-depth:0.25em;font-size:10pt;" height="13.84" overflow="visible" transform="matrix(1 0 0 -1 0 10.38)" width="468.11"><span class="ltx_foreignobject_container"><span class="ltx_foreignobject_content">
<span id="A8.p4.pic1.1" class="ltx_inline-block ltx_minipage ltx_align_bottom" style="width:33.83em;">
<span id="A8.p4.pic1.1.1" class="ltx_p"><span id="A8.p4.pic1.1.1.1" class="ltx_text ltx_font_bold" style="--ltx-fg-color:#FFFFFF;">Discovered Biases of Qwen3-8B (Non-Thinking) when Acting as Judge</span></span>
</span></span></span></foreignobject></g><g fill-opacity="1.0" transform="matrix(1.0 0.0 0.0 1.0 5.91 1326.83)"><foreignobject style="--ltx-fo-width:38.9em;--ltx-fo-height:1.79em;--ltx-fo-depth:94.9em;font-size:10pt;" height="1337.9" overflow="visible" transform="matrix(1 0 0 -1 0 24.83)" width="538.27"><span class="ltx_foreignobject_container"><span class="ltx_foreignobject_content">
<span id="A8.p4.pic1.2" class="ltx_inline-block ltx_minipage ltx_align_bottom" style="width:38.9em;">
<span id="A8.I3" class="ltx_itemize" style="--ltx-enum-leftmargin:5mm;">
<span id="A8.I3.i1" class="ltx_item" style="list-style-type:none;"><span class="ltx_tag ltx_tag_item"><math id="A8.I3.i1.m1" class="ltx_Math" alttext="\triangleright" display="inline" intent=":literal"><semantics><mo>⊳</mo><annotation encoding="application/x-tex">\triangleright</annotation></semantics></math></span> 
<span id="A8.I3.i1.p1" class="ltx_para ltx_noindent">
<span id="A8.I3.i1.p1.1" class="ltx_p"><span id="A8.I3.i1.p1.1.1" class="ltx_text ltx_font_bold" style="--ltx-fg-color:#000000;">Accuracy Bias</span><span id="A8.I3.i1.p1.1.2" class="ltx_text" style="--ltx-fg-color:#000000;">: Refers to the tendency of large language models (LLMs) to favor responses that appear to be more precise or detailed, even if the precision is incorrect, over simpler or more straightforward correct answers. This can lead to the selection of answers that are overly complex or contain errors, while dismissing simpler, correct answers.</span></span>
</span></span>
<span id="A8.I3.i2" class="ltx_item" style="list-style-type:none;"><span class="ltx_tag ltx_tag_item"><math id="A8.I3.i2.m1" class="ltx_Math" alttext="\triangleright" display="inline" intent=":literal"><semantics><mo>⊳</mo><annotation encoding="application/x-tex">\triangleright</annotation></semantics></math></span> 
<span id="A8.I3.i2.p1" class="ltx_para ltx_noindent">
<span id="A8.I3.i2.p1.1" class="ltx_p"><span id="A8.I3.i2.p1.1.1" class="ltx_text ltx_font_bold" style="--ltx-fg-color:#000000;">Educational Value Bias</span><span id="A8.I3.i2.p1.1.2" class="ltx_text" style="--ltx-fg-color:#000000;">: Refers to the tendency of large language models (LLMs) to prefer answers that provide educational value or detailed explanations over those that are concise and directly answer the question, even if the latter are technically correct and sufficient.</span></span>
</span></span>
<span id="A8.I3.i3" class="ltx_item" style="list-style-type:none;"><span class="ltx_tag ltx_tag_item"><math id="A8.I3.i3.m1" class="ltx_Math" alttext="\triangleright" display="inline" intent=":literal"><semantics><mo>⊳</mo><annotation encoding="application/x-tex">\triangleright</annotation></semantics></math></span> 
<span id="A8.I3.i3.p1" class="ltx_para ltx_noindent">
<span id="A8.I3.i3.p1.1" class="ltx_p"><span id="A8.I3.i3.p1.1.1" class="ltx_text ltx_font_bold" style="--ltx-fg-color:#000000;">Elaboration Bias</span><span id="A8.I3.i3.p1.1.2" class="ltx_text" style="--ltx-fg-color:#000000;">: Refers to the tendency of large language models (LLMs) to favor more detailed and elaborately described information, even if the additional details do not necessarily increase the relevance or accuracy of the content. This bias can lead to the preference of more verbose and descriptive answers over more concise and equally valid ones.</span></span>
</span></span>
<span id="A8.I3.i4" class="ltx_item" style="list-style-type:none;"><span class="ltx_tag ltx_tag_item"><math id="A8.I3.i4.m1" class="ltx_Math" alttext="\triangleright" display="inline" intent=":literal"><semantics><mo>⊳</mo><annotation encoding="application/x-tex">\triangleright</annotation></semantics></math></span> 
<span id="A8.I3.i4.p1" class="ltx_para ltx_noindent">
<span id="A8.I3.i4.p1.1" class="ltx_p"><span id="A8.I3.i4.p1.1.1" class="ltx_text ltx_font_bold" style="--ltx-fg-color:#000000;">Information Bias</span><span id="A8.I3.i4.p1.1.2" class="ltx_text" style="--ltx-fg-color:#000000;">: Refers to the tendency of large language models (LLMs) to provide more detailed information, even when it is not necessarily beneficial or safe, under the assumption that more information is always better. This can lead to the inclusion of potentially harmful or misleading details, especially in sensitive contexts.</span></span>
</span></span>
<span id="A8.I3.i5" class="ltx_item" style="list-style-type:none;"><span class="ltx_tag ltx_tag_item"><math id="A8.I3.i5.m1" class="ltx_Math" alttext="\triangleright" display="inline" intent=":literal"><semantics><mo>⊳</mo><annotation encoding="application/x-tex">\triangleright</annotation></semantics></math></span> 
<span id="A8.I3.i5.p1" class="ltx_para ltx_noindent">
<span id="A8.I3.i5.p1.1" class="ltx_p"><span id="A8.I3.i5.p1.1.1" class="ltx_text ltx_font_bold" style="--ltx-fg-color:#000000;">Action Bias</span><span id="A8.I3.i5.p1.1.2" class="ltx_text" style="--ltx-fg-color:#000000;">: Refers to the tendency of individuals or systems to prefer providing specific, actionable advice over more general or cautious guidance, even when the situation may warrant a more conservative approach. This bias can lead to overconfidence in the effectiveness of the provided advice, especially in situations where professional expertise is crucial.</span></span>
</span></span>
<span id="A8.I3.i6" class="ltx_item" style="list-style-type:none;"><span class="ltx_tag ltx_tag_item"><math id="A8.I3.i6.m1" class="ltx_Math" alttext="\triangleright" display="inline" intent=":literal"><semantics><mo>⊳</mo><annotation encoding="application/x-tex">\triangleright</annotation></semantics></math></span> 
<span id="A8.I3.i6.p1" class="ltx_para ltx_noindent">
<span id="A8.I3.i6.p1.1" class="ltx_p"><span id="A8.I3.i6.p1.1.1" class="ltx_text ltx_font_bold" style="--ltx-fg-color:#000000;">Moral Licensing</span><span id="A8.I3.i6.p1.1.2" class="ltx_text" style="--ltx-fg-color:#000000;">: Moral licensing is a psychological phenomenon where individuals feel they have earned the right to act unethically after engaging in good behavior or expressing ethical concerns. In this context, the LLM’s detailed explanation of how to create fake news, despite the ethical warnings, might inadvertently provide a sense of moral justification for the user to proceed with the harmful action.</span></span>
</span></span>
<span id="A8.I3.i7" class="ltx_item" style="list-style-type:none;"><span class="ltx_tag ltx_tag_item"><math id="A8.I3.i7.m1" class="ltx_Math" alttext="\triangleright" display="inline" intent=":literal"><semantics><mo>⊳</mo><annotation encoding="application/x-tex">\triangleright</annotation></semantics></math></span> 
<span id="A8.I3.i7.p1" class="ltx_para ltx_noindent">
<span id="A8.I3.i7.p1.1" class="ltx_p"><span id="A8.I3.i7.p1.1.1" class="ltx_text ltx_font_bold" style="--ltx-fg-color:#000000;">Stereotype Bias</span><span id="A8.I3.i7.p1.1.2" class="ltx_text" style="--ltx-fg-color:#000000;">: Refers to the tendency of large language models (LLMs) to recognize and respond to harmful stereotypes, even when the content is not explicitly biased, by prioritizing responses that challenge or correct the stereotype. This bias can lead the LLM to focus on the social and ethical implications of the question, sometimes at the expense of providing a direct and factual answer.</span></span>
</span></span>
<span id="A8.I3.i8" class="ltx_item" style="list-style-type:none;"><span class="ltx_tag ltx_tag_item"><math id="A8.I3.i8.m1" class="ltx_Math" alttext="\triangleright" display="inline" intent=":literal"><semantics><mo>⊳</mo><annotation encoding="application/x-tex">\triangleright</annotation></semantics></math></span> 
<span id="A8.I3.i8.p1" class="ltx_para ltx_noindent">
<span id="A8.I3.i8.p1.1" class="ltx_p"><span id="A8.I3.i8.p1.1.1" class="ltx_text ltx_font_bold" style="--ltx-fg-color:#000000;">Explanation Bias</span><span id="A8.I3.i8.p1.1.2" class="ltx_text" style="--ltx-fg-color:#000000;">: Refers to the tendency of large language models (LLMs) to prefer answers that include explanations, even if the explanations do not add significant value or correctness to the solution. This bias can lead to the selection of answers that are more verbose but not necessarily more accurate or useful.</span></span>
</span></span>
<span id="A8.I3.i9" class="ltx_item" style="list-style-type:none;"><span class="ltx_tag ltx_tag_item"><math id="A8.I3.i9.m1" class="ltx_Math" alttext="\triangleright" display="inline" intent=":literal"><semantics><mo>⊳</mo><annotation encoding="application/x-tex">\triangleright</annotation></semantics></math></span> 
<span id="A8.I3.i9.p1" class="ltx_para ltx_noindent">
<span id="A8.I3.i9.p1.1" class="ltx_p"><span id="A8.I3.i9.p1.1.1" class="ltx_text ltx_font_bold" style="--ltx-fg-color:#000000;">Confirmation Bias</span><span id="A8.I3.i9.p1.1.2" class="ltx_text" style="--ltx-fg-color:#000000;">: The tendency to search for, interpret, favor, and recall information in a way that confirms one’s preexisting beliefs or hypotheses, while giving disproportionately less consideration to alternative possibilities.</span></span>
</span></span>
<span id="A8.I3.i10" class="ltx_item" style="list-style-type:none;"><span class="ltx_tag ltx_tag_item"><math id="A8.I3.i10.m1" class="ltx_Math" alttext="\triangleright" display="inline" intent=":literal"><semantics><mo>⊳</mo><annotation encoding="application/x-tex">\triangleright</annotation></semantics></math></span> 
<span id="A8.I3.i10.p1" class="ltx_para ltx_noindent">
<span id="A8.I3.i10.p1.1" class="ltx_p"><span id="A8.I3.i10.p1.1.1" class="ltx_text ltx_font_bold" style="--ltx-fg-color:#000000;">Actionable Information Bias</span><span id="A8.I3.i10.p1.1.2" class="ltx_text" style="--ltx-fg-color:#000000;">: Refers to the tendency of large language models (LLMs) to prefer answers that provide actionable information or detailed steps, even if the context or user intent suggests that such information might be risky or inappropriate. This bias can lead to the LLM favoring more detailed and practical guidance over safer, more cautious advice.</span></span>
</span></span>
<span id="A8.I3.i11" class="ltx_item" style="list-style-type:none;"><span class="ltx_tag ltx_tag_item"><math id="A8.I3.i11.m1" class="ltx_Math" alttext="\triangleright" display="inline" intent=":literal"><semantics><mo>⊳</mo><annotation encoding="application/x-tex">\triangleright</annotation></semantics></math></span> 
<span id="A8.I3.i11.p1" class="ltx_para ltx_noindent">
<span id="A8.I3.i11.p1.1" class="ltx_p"><span id="A8.I3.i11.p1.1.1" class="ltx_text ltx_font_bold" style="--ltx-fg-color:#000000;">Formatting Bias</span><span id="A8.I3.i11.p1.1.2" class="ltx_text" style="--ltx-fg-color:#000000;">: Refers to the tendency of large language models (LLMs) to prefer text that is formatted in a way that aligns with their expectations or conventions, even if the content is functionally identical. This bias can lead to the selection of an answer based on its presentation rather than its correctness or efficiency.</span></span>
</span></span>
<span id="A8.I3.i12" class="ltx_item" style="list-style-type:none;"><span class="ltx_tag ltx_tag_item"><math id="A8.I3.i12.m1" class="ltx_Math" alttext="\triangleright" display="inline" intent=":literal"><semantics><mo>⊳</mo><annotation encoding="application/x-tex">\triangleright</annotation></semantics></math></span> 
<span id="A8.I3.i12.p1" class="ltx_para ltx_noindent">
<span id="A8.I3.i12.p1.1" class="ltx_p"><span id="A8.I3.i12.p1.1.1" class="ltx_text ltx_font_bold" style="--ltx-fg-color:#000000;">Educational Bias</span><span id="A8.I3.i12.p1.1.2" class="ltx_text" style="--ltx-fg-color:#000000;">: Refers to the tendency of large language models (LLMs) to prefer answers that are more educational and detailed, even if the core functionality and correctness of the answers are equivalent. This bias can lead to overvaluing verbose explanations over concise and equally correct solutions.</span></span>
</span></span>
<span id="A8.I3.i13" class="ltx_item" style="list-style-type:none;"><span class="ltx_tag ltx_tag_item"><math id="A8.I3.i13.m1" class="ltx_Math" alttext="\triangleright" display="inline" intent=":literal"><semantics><mo>⊳</mo><annotation encoding="application/x-tex">\triangleright</annotation></semantics></math></span> 
<span id="A8.I3.i13.p1" class="ltx_para ltx_noindent">
<span id="A8.I3.i13.p1.1" class="ltx_p"><span id="A8.I3.i13.p1.1.1" class="ltx_text ltx_font_bold" style="--ltx-fg-color:#000000;">Numerical Bias</span><span id="A8.I3.i13.p1.1.2" class="ltx_text" style="--ltx-fg-color:#000000;">: Refers to the tendency of large language models (LLMs) to make errors in numerical calculations or to favor incorrect numerical results, often due to a misunderstanding or misapplication of mathematical principles.</span></span>
</span></span>
<span id="A8.I3.i14" class="ltx_item" style="list-style-type:none;"><span class="ltx_tag ltx_tag_item"><math id="A8.I3.i14.m1" class="ltx_Math" alttext="\triangleright" display="inline" intent=":literal"><semantics><mo>⊳</mo><annotation encoding="application/x-tex">\triangleright</annotation></semantics></math></span> 
<span id="A8.I3.i14.p1" class="ltx_para ltx_noindent">
<span id="A8.I3.i14.p1.1" class="ltx_p"><span id="A8.I3.i14.p1.1.1" class="ltx_text ltx_font_bold" style="--ltx-fg-color:#000000;">Novelty Bias</span><span id="A8.I3.i14.p1.1.2" class="ltx_text" style="--ltx-fg-color:#000000;">: Refers to the tendency of large language models (LLMs) to favor novel, creative, or unconventional ideas over more practical or well-established solutions, even when the latter might be more effective or appropriate for the given context.</span></span>
</span></span>
<span id="A8.I3.i15" class="ltx_item" style="list-style-type:none;"><span class="ltx_tag ltx_tag_item"><math id="A8.I3.i15.m1" class="ltx_Math" alttext="\triangleright" display="inline" intent=":literal"><semantics><mo>⊳</mo><annotation encoding="application/x-tex">\triangleright</annotation></semantics></math></span> 
<span id="A8.I3.i15.p1" class="ltx_para">
<span id="A8.I3.i15.p1.1" class="ltx_p"><span id="A8.I3.i15.p1.1.1" class="ltx_text ltx_font_bold" style="--ltx-fg-color:#000000;">Optimism Bias</span><span id="A8.I3.i15.p1.1.2" class="ltx_text" style="--ltx-fg-color:#000000;">: Refers to the tendency to overestimate the likelihood of positive outcomes and underestimate the challenges or risks involved, often leading to overly optimistic views or plans.</span></span>
</span></span>
</span>
</span></span></span></foreignobject></g></g></svg>