<span id="A7.F10.pic1.1" class="ltx_inline-block ltx_minipage ltx_align_bottom" style="width:44.07em;">
<span id="A7.F10.pic1.1.1" class="ltx_p"><span id="A7.F10.pic1.1.1.1" class="ltx_text ltx_font_typewriter" style="--ltx-fg-color:#000000;">Situation: Two experts are inspecting examples in natural language generation for a particular dataset. 
<br class="ltx_break">You will be given 2 sentences, which represent the conclusions of the two experts about the same example, i. e. what is a failure case in the example they were given.
<br class="ltx_break">Your task is to determine if the experts describe the same failure. 
<br class="ltx_break"><span id="A7.F10.pic1.1.1.1.1" class="ltx_text ltx_font_serif">
</span></span></span>
<span id="A7.F10.pic1.1.2" class="ltx_p"><span id="A7.F10.pic1.1.2.1" class="ltx_text ltx_font_typewriter" style="--ltx-fg-color:#000000;">Expert 1 conclusion: E1 
<br class="ltx_break">Expert 2 conclusion: E2
<br class="ltx_break"><span id="A7.F10.pic1.1.2.1.1" class="ltx_text ltx_font_serif">
</span></span></span>
<span id="A7.F10.pic1.1.3" class="ltx_p"><span id="A7.F10.pic1.1.3.1" class="ltx_text ltx_font_typewriter" style="--ltx-fg-color:#000000;">Do the experts describe the same failure? Output only one word ‘Yes’ or ‘No’.<span id="A7.F10.pic1.1.3.1.1" class="ltx_text ltx_font_serif">
</span></span></span>
</span></span></span></foreignobject></g></g></svg>