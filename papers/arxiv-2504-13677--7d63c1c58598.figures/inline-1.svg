<svg id="A5.p3.pic1" class="ltx_picture" height="954.72" overflow="visible" version="1.1" viewbox="0 0 653.15 954.72" width="653.15"><g style="--ltx-stroke-color:#000000;--ltx-fill-color:#000000;" fill="#000000" stroke="#000000" stroke-width="0.4pt" transform="translate(0,954.72) matrix(1 0 0 -1 0 0)"><g style="--ltx-fill-color:#000000;" fill="#000000" fill-opacity="1.0"><path style="stroke:none" d="M 0 5.91 L 0 948.81 C 0 952.07 2.64 954.72 5.91 954.72 L 647.24 954.72 C 650.51 954.72 653.15 952.07 653.15 948.81 L 653.15 5.91 C 653.15 2.64 650.51 0 647.24 0 L 5.91 0 C 2.64 0 0 2.64 0 5.91 Z" /></g><g style="--ltx-fill-color:#F2F2F2;" fill="#F2F2F2" fill-opacity="1.0"><path style="stroke:none" d="M 1.97 5.91 L 1.97 933.3 L 651.18 933.3 L 651.18 5.91 C 651.18 3.73 649.42 1.97 647.24 1.97 L 5.91 1.97 C 3.73 1.97 1.97 3.73 1.97 5.91 Z" /></g><g fill-opacity="1.0" transform="matrix(1.0 0.0 0.0 1.0 21.65 939.2)"><foreignobject style="--ltx-fo-width:44.07em;--ltx-fo-height:0.69em;--ltx-fo-depth:0em;font-size:10pt;" height="9.61" overflow="visible" transform="matrix(1 0 0 -1 0 9.61)" width="609.8"><span class="ltx_foreignobject_container"><span class="ltx_foreignobject_content">
<span id="A5.p3.pic1.1" class="ltx_inline-block ltx_minipage ltx_align_bottom" style="width:44.07em;">
<span id="A5.p3.pic1.1.1" class="ltx_p"><span id="A5.p3.pic1.1.1.1" class="ltx_text" style="--ltx-fg-color:#FFFFFF;">Annotation Guidelines</span></span>
</span></span></span></foreignobject></g><g fill-opacity="1.0" transform="matrix(1.0 0.0 0.0 1.0 21.65 16.47)"><foreignobject style="--ltx-fo-width:44.07em;--ltx-fo-height:65.41em;--ltx-fo-depth:0.19em;font-size:10pt;" height="907.72" overflow="visible" transform="matrix(1 0 0 -1 0 905.03)" width="609.8"><span class="ltx_foreignobject_container"><span class="ltx_foreignobject_content">
<div id="A5.p3.pic1.2" class="ltx_block ltx_minipage ltx_align_bottom" style="width:44.07em;">
<p id="A5.p3.pic1.2.1" class="ltx_p"><span id="A5.p3.pic1.2.1.1" class="ltx_text" style="--ltx-fg-color:#000000;">You will be provided with three pieces of text:</span></p>
<ul id="A5.I1" class="ltx_itemize">
<li id="A5.I1.i1" class="ltx_item" style="list-style-type:none;"><span class="ltx_tag ltx_tag_item">•</span> 
<div id="A5.I1.i1.p1" class="ltx_para">
<p id="A5.I1.i1.p1.1" class="ltx_p"><span id="A5.I1.i1.p1.1.1" class="ltx_text ltx_font_bold" style="--ltx-fg-color:#000000;">Question</span><span id="A5.I1.i1.p1.1.2" class="ltx_text" style="--ltx-fg-color:#000000;">: A question previously proposed to a system or user. You are not asked to answer this question; it has already been answered (see Proposed Answer).</span></p>
</div></li>
<li id="A5.I1.i2" class="ltx_item" style="list-style-type:none;"><span class="ltx_tag ltx_tag_item">•</span> 
<div id="A5.I1.i2.p1" class="ltx_para">
<p id="A5.I1.i2.p1.1" class="ltx_p"><span id="A5.I1.i2.p1.1.1" class="ltx_text ltx_font_bold" style="--ltx-fg-color:#000000;">Reference Answer</span><span id="A5.I1.i2.p1.1.2" class="ltx_text" style="--ltx-fg-color:#000000;">: The authoritative or &quot;gold standard&quot; answer provided for the Question.</span></p>
</div></li>
<li id="A5.I1.i3" class="ltx_item" style="list-style-type:none;"><span class="ltx_tag ltx_tag_item">•</span> 
<div id="A5.I1.i3.p1" class="ltx_para">
<p id="A5.I1.i3.p1.1" class="ltx_p"><span id="A5.I1.i3.p1.1.1" class="ltx_text ltx_font_bold" style="--ltx-fg-color:#000000;">Proposed Answer</span><span id="A5.I1.i3.p1.1.2" class="ltx_text" style="--ltx-fg-color:#000000;">: The response given by a user for the Question that needs to be evaluated.</span></p>
</div></li>
</ul>
<p id="A5.p3.pic1.2.2" class="ltx_p"><span id="A5.p3.pic1.2.2.1" class="ltx_text" style="--ltx-fg-color:#000000;">Your task is to determine whether the <span id="A5.p3.pic1.2.2.1.1" class="ltx_text ltx_font_bold">Proposed Answer</span> is <span id="A5.p3.pic1.2.2.1.2" class="ltx_text ltx_font_bold">equivalent</span> to the <span id="A5.p3.pic1.2.2.1.3" class="ltx_text ltx_font_bold">Reference Answer</span> in the context of the <span id="A5.p3.pic1.2.2.1.4" class="ltx_text ltx_font_bold">Question</span>.</span></p>
<section id="Ax1" class="ltx_appendix">
<h2 class="ltx_title ltx_title_appendix" style="--ltx-fg-color:#000000;">Evaluation Criteria</h2>

<div id="Ax1.p1" class="ltx_para">
<ul id="Ax1.I2" class="ltx_itemize">
<li id="Ax1.I2.i1" class="ltx_item" style="list-style-type:none;"><span class="ltx_tag ltx_tag_item">•</span> 
<div id="Ax1.I2.i1.p1" class="ltx_para">
<p id="Ax1.I2.i1.p1.1" class="ltx_p"><span id="Ax1.I2.i1.p1.1.1" class="ltx_text ltx_font_bold" style="--ltx-fg-color:#000000;">Focus on Equivalence</span><span id="Ax1.I2.i1.p1.1.2" class="ltx_text" style="--ltx-fg-color:#000000;">: Assess whether the Proposed Answer conveys the same meaning as the Reference Answer, regardless of additional details or alternative phrasings.</span></p>
</div></li>
<li id="Ax1.I2.i2" class="ltx_item" style="list-style-type:none;"><span class="ltx_tag ltx_tag_item">•</span> 
<div id="Ax1.I2.i2.p1" class="ltx_para">
<p id="Ax1.I2.i2.p1.1" class="ltx_p"><span id="Ax1.I2.i2.p1.1.1" class="ltx_text ltx_font_bold" style="--ltx-fg-color:#000000;">Ignore Personal Knowledge</span><span id="Ax1.I2.i2.p1.1.2" class="ltx_text" style="--ltx-fg-color:#000000;">: Do not rely on your own knowledge or conduct external research. Base your judgment solely on the given text.</span></p>
</div></li>
<li id="Ax1.I2.i3" class="ltx_item" style="list-style-type:none;"><span class="ltx_tag ltx_tag_item">•</span> 
<div id="Ax1.I2.i3.p1" class="ltx_para">
<p id="Ax1.I2.i3.p1.1" class="ltx_p"><span id="Ax1.I2.i3.p1.1.1" class="ltx_text ltx_font_bold" style="--ltx-fg-color:#000000;">Exact Matching is Not Required</span><span id="Ax1.I2.i3.p1.1.2" class="ltx_text" style="--ltx-fg-color:#000000;">: The Proposed Answer does not need to be identical to the Reference Answer, but it must preserve the core meaning.</span></p>
</div></li>
<li id="Ax1.I2.i4" class="ltx_item" style="list-style-type:none;"><span class="ltx_tag ltx_tag_item">•</span> 
<div id="Ax1.I2.i4.p1" class="ltx_para">
<p id="Ax1.I2.i4.p1.1" class="ltx_p"><span id="Ax1.I2.i4.p1.1.1" class="ltx_text ltx_font_bold" style="--ltx-fg-color:#000000;">Context Matters</span><span id="Ax1.I2.i4.p1.1.2" class="ltx_text" style="--ltx-fg-color:#000000;">: Ensure that the Proposed Answer is relevant to the Question and correctly aligns with the Reference Answer’s meaning.</span></p>
</div></li>
</ul>
</div>
</section>
<section id="Ax2" class="ltx_appendix">
<h2 class="ltx_title ltx_title_appendix" style="--ltx-fg-color:#000000;">Rating Scale</h2>

<div id="Ax2.p1" class="ltx_para">
<p id="Ax2.p1.1" class="ltx_p"><span id="Ax2.p1.1.1" class="ltx_text" style="--ltx-fg-color:#000000;">Choose one of the following ratings for each evaluation:</span></p>
</div>
<div id="Ax2.p2" class="ltx_para">
<ul id="Ax2.I3" class="ltx_itemize">
<li id="Ax2.I3.i1" class="ltx_item" style="list-style-type:none;"><span class="ltx_tag ltx_tag_item">•</span> 
<div id="Ax2.I3.i1.p1" class="ltx_para">
<p id="Ax2.I3.i1.p1.1" class="ltx_p"><span id="Ax2.I3.i1.p1.1.1" class="ltx_text ltx_font_bold" style="--ltx-fg-color:#000000;">Equivalent</span><span id="Ax2.I3.i1.p1.1.2" class="ltx_text" style="--ltx-fg-color:#000000;">: The Proposed Answer conveys the same meaning as the Reference Answer.</span></p>
</div></li>
<li id="Ax2.I3.i2" class="ltx_item" style="list-style-type:none;"><span class="ltx_tag ltx_tag_item">•</span> 
<div id="Ax2.I3.i2.p1" class="ltx_para">
<p id="Ax2.I3.i2.p1.1" class="ltx_p"><span id="Ax2.I3.i2.p1.1.1" class="ltx_text ltx_font_bold" style="--ltx-fg-color:#000000;">Not Equivalent</span><span id="Ax2.I3.i2.p1.1.2" class="ltx_text" style="--ltx-fg-color:#000000;">: The Proposed Answer does not convey the same meaning, either due to missing essential information, contradictions, or incorrect interpretation.</span></p>
</div></li>
</ul>
</div>
</section>
<section id="Ax3" class="ltx_appendix">
<h2 class="ltx_title ltx_title_appendix" style="--ltx-fg-color:#000000;">Additional Notes</h2>

<div id="Ax3.p1" class="ltx_para">
<ul id="Ax3.I4" class="ltx_itemize">
<li id="Ax3.I4.i1" class="ltx_item" style="list-style-type:none;"><span class="ltx_tag ltx_tag_item">•</span> 
<div id="Ax3.I4.i1.p1" class="ltx_para">
<p id="Ax3.I4.i1.p1.1" class="ltx_p"><span id="Ax3.I4.i1.p1.1.1" class="ltx_text ltx_font_bold" style="--ltx-fg-color:#000000;">More Detail vs. Different Information</span><span id="Ax3.I4.i1.p1.1.2" class="ltx_text" style="--ltx-fg-color:#000000;">: Extra information is acceptable as long as the meaning remains the same. However, if the additional details introduce contradictions, the Proposed Answer should be marked </span><span id="Ax3.I4.i1.p1.1.3" class="ltx_text ltx_font_bold" style="--ltx-fg-color:#000000;">Not Equivalent</span><span id="Ax3.I4.i1.p1.1.4" class="ltx_text" style="--ltx-fg-color:#000000;">.</span></p>
</div></li>
<li id="Ax3.I4.i2" class="ltx_item" style="list-style-type:none;"><span class="ltx_tag ltx_tag_item">•</span> 
<div id="Ax3.I4.i2.p1" class="ltx_para">
<p id="Ax3.I4.i2.p1.1" class="ltx_p"><span id="Ax3.I4.i2.p1.1.1" class="ltx_text ltx_font_bold" style="--ltx-fg-color:#000000;">Paraphrasing is Allowed</span><span id="Ax3.I4.i2.p1.1.2" class="ltx_text" style="--ltx-fg-color:#000000;">: The wording of the Proposed Answer does not need to match exactly, but the core meaning must remain intact.</span></p>
</div></li>
<li id="Ax3.I4.i3" class="ltx_item" style="list-style-type:none;"><span class="ltx_tag ltx_tag_item">•</span> 
<div id="Ax3.I4.i3.p1" class="ltx_para">
<p id="Ax3.I4.i3.p1.1" class="ltx_p"><span id="Ax3.I4.i3.p1.1.1" class="ltx_text ltx_font_bold" style="--ltx-fg-color:#000000;">Avoid Assumptions</span><span id="Ax3.I4.i3.p1.1.2" class="ltx_text" style="--ltx-fg-color:#000000;">: Do not infer additional meaning beyond what is explicitly stated.</span></p>
</div></li>
</ul>
</div>
</section>
<section id="Ax4" class="ltx_appendix">
<h2 class="ltx_title ltx_title_appendix" style="--ltx-fg-color:#000000;">Examples</h2>

<section id="Ax4.SSx1" class="ltx_subsection">
<h3 class="ltx_title ltx_title_subsection" style="--ltx-fg-color:#000000;">Example 1: Equivalent</h3>

<div id="Ax4.SSx1.p1" class="ltx_para">
<p id="Ax4.SSx1.p1.1" class="ltx_p"><span id="Ax4.SSx1.p1.1.1" class="ltx_text" style="--ltx-fg-color:#000000;">&lt;Follows one annotated equivalent example from the dataset&gt;</span></p>
</div>
</section>
<section id="Ax4.SSx2" class="ltx_subsection">
<h3 class="ltx_title ltx_title_subsection" style="--ltx-fg-color:#000000;">Example 2: Not Equivalent</h3>

<div id="Ax4.SSx2.p1" class="ltx_para">
<p id="Ax4.SSx2.p1.1" class="ltx_p"><span id="Ax4.SSx2.p1.1.1" class="ltx_text" style="--ltx-fg-color:#000000;">&lt;Follows one annotated not equivalent example from the dataset&gt;</span></p>
</div>
</section>
</section>
</div></span></span></foreignobject></g></g></svg>