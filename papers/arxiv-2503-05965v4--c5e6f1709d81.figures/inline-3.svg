<span id="A4.I4.ix1.p1" class="ltx_para">
<span id="A4.I4.ix1.p1.1" class="ltx_p"><span id="A4.I4.ix1.p1.1.1" class="ltx_text" style="--ltx-fg-color:#000000;">Very Toxic - Very hateful, aggressive, or disrespectful; very likely to make you leave a discussion</span></span>
</span></span>
<span id="A4.I4.ix2" class="ltx_item" style="list-style-type:none;"><span class="ltx_tag ltx_tag_item">B.</span> 
<span id="A4.I4.ix2.p1" class="ltx_para">
