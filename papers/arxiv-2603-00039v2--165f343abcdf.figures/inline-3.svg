<span id="A5.SS5.p4.pic1.1" class="ltx_inline-block ltx_minipage ltx_align_bottom" style="width:28.39em;">
<span id="A5.SS5.p4.pic1.1.1" class="ltx_p"><span id="A5.SS5.p4.pic1.1.1.1" class="ltx_text ltx_font_bold" style="--ltx-fg-color:#FFFFFF;">LLM Judge Scoring Template (Review-5K – Research Paper Review Quality)</span></span>
</span></span></span></foreignobject></g><g fill-opacity="1.0" transform="matrix(1.0 0.0 0.0 1.0 12.79 16.25)"><foreignobject style="--ltx-fo-width:31.1em;--ltx-fo-height:44.73em;--ltx-fo-depth:0.25em;font-size:10pt;" height="622.44" overflow="visible" transform="matrix(1 0 0 -1 0 618.98)" width="430.34"><span class="ltx_foreignobject_container"><span class="ltx_foreignobject_content">
<span id="A5.SS5.p4.pic1.2" class="ltx_inline-block ltx_minipage ltx_align_bottom" style="width:31.1em;">
<span id="A5.SS5.p4.pic1.2.1" class="ltx_p"><span id="A5.SS5.p4.pic1.2.1.1" class="ltx_text" style="--ltx-fg-color:#000000;">You are scoring the <span id="A5.SS5.p4.pic1.2.1.1.1" class="ltx_text ltx_font_bold">overall quality of a research paper submission</span>.
Use the reviewing guidelines below to assess methodological soundness, clarity, contribution, and overall merit.
Assign one of the standard conference rating levels (an integer in [1, 10]) according to this rubric:</span></span>
<span id="A5.I4" class="ltx_itemize ltx_leftmargin_flush">
<span id="A5.I4.i1" class="ltx_item" style="list-style-type:none;"><span class="ltx_tag ltx_tag_item">•</span> 
<span id="A5.I4.i1.p1" class="ltx_para">
<span id="A5.I4.i1.p1.1" class="ltx_p"><span id="A5.I4.i1.p1.1.1" class="ltx_text" style="--ltx-fg-color:#000000;">1 – </span><span id="A5.I4.i1.p1.1.2" class="ltx_text ltx_font_bold" style="--ltx-fg-color:#000000;">Strong Reject</span><span id="A5.I4.i1.p1.1.3" class="ltx_text" style="--ltx-fg-color:#000000;">: fundamental flaws; clearly unsuitable for publication.</span></span>
</span></span>
<span id="A5.I4.i2" class="ltx_item" style="list-style-type:none;"><span class="ltx_tag ltx_tag_item">•</span> 
<span id="A5.I4.i2.p1" class="ltx_para">
<span id="A5.I4.i2.p1.1" class="ltx_p"><span id="A5.I4.i2.p1.1.1" class="ltx_text" style="--ltx-fg-color:#000000;">3 – </span><span id="A5.I4.i2.p1.1.2" class="ltx_text ltx_font_bold" style="--ltx-fg-color:#000000;">Reject, not good enough</span><span id="A5.I4.i2.p1.1.3" class="ltx_text" style="--ltx-fg-color:#000000;">: major weaknesses outweigh contributions.</span></span>
</span></span>
<span id="A5.I4.i3" class="ltx_item" style="list-style-type:none;"><span class="ltx_tag ltx_tag_item">•</span> 
<span id="A5.I4.i3.p1" class="ltx_para">
<span id="A5.I4.i3.p1.1" class="ltx_p"><span id="A5.I4.i3.p1.1.1" class="ltx_text" style="--ltx-fg-color:#000000;">5 – </span><span id="A5.I4.i3.p1.1.2" class="ltx_text ltx_font_bold" style="--ltx-fg-color:#000000;">Marginally below acceptance</span><span id="A5.I4.i3.p1.1.3" class="ltx_text" style="--ltx-fg-color:#000000;">: borderline but leaning negative.</span></span>
</span></span>
<span id="A5.I4.i4" class="ltx_item" style="list-style-type:none;"><span class="ltx_tag ltx_tag_item">•</span> 
<span id="A5.I4.i4.p1" class="ltx_para">
<span id="A5.I4.i4.p1.1" class="ltx_p"><span id="A5.I4.i4.p1.1.1" class="ltx_text" style="--ltx-fg-color:#000000;">6 – </span><span id="A5.I4.i4.p1.1.2" class="ltx_text ltx_font_bold" style="--ltx-fg-color:#000000;">Marginally above acceptance</span><span id="A5.I4.i4.p1.1.3" class="ltx_text" style="--ltx-fg-color:#000000;">: borderline but leaning positive; improvements still desirable.</span></span>
</span></span>
<span id="A5.I4.i5" class="ltx_item" style="list-style-type:none;"><span class="ltx_tag ltx_tag_item">•</span> 
<span id="A5.I4.i5.p1" class="ltx_para">
<span id="A5.I4.i5.p1.1" class="ltx_p"><span id="A5.I4.i5.p1.1.1" class="ltx_text" style="--ltx-fg-color:#000000;">8 – </span><span id="A5.I4.i5.p1.1.2" class="ltx_text ltx_font_bold" style="--ltx-fg-color:#000000;">Accept, good paper</span><span id="A5.I4.i5.p1.1.3" class="ltx_text" style="--ltx-fg-color:#000000;">: solid contribution with meaningful advances and only minor issues.</span></span>
</span></span>
<span id="A5.I4.i6" class="ltx_item" style="list-style-type:none;"><span class="ltx_tag ltx_tag_item">•</span> 
<span id="A5.I4.i6.p1" class="ltx_para">
<span id="A5.I4.i6.p1.1" class="ltx_p"><span id="A5.I4.i6.p1.1.1" class="ltx_text" style="--ltx-fg-color:#000000;">10 – </span><span id="A5.I4.i6.p1.1.2" class="ltx_text ltx_font_bold" style="--ltx-fg-color:#000000;">Strong Accept</span><span id="A5.I4.i6.p1.1.3" class="ltx_text" style="--ltx-fg-color:#000000;">: outstanding paper with exceptional clarity and impact.</span></span>
</span></span>
</span>
<span id="A5.SS5.p4.pic1.2.2" class="ltx_p"><span id="A5.SS5.p4.pic1.2.2.1" class="ltx_text" style="--ltx-fg-color:#000000;">If you believe an intermediate score (2, 4, 7, 9) better reflects the work, you may use it, positioning it between the adjacent rubric descriptions above.</span></span>
<span id="A5.SS5.p4.pic1.2.3" class="ltx_p"><span id="A5.SS5.p4.pic1.2.3.1" class="ltx_text ltx_font_bold" style="--ltx-fg-color:#000000;">Reviewing guidelines:<span id="A5.SS5.p4.pic1.2.3.1.1" class="ltx_text ltx_font_medium">
guidelines</span></span></span>
<span id="A5.SS5.p4.pic1.2.4" class="ltx_p"><span id="A5.SS5.p4.pic1.2.4.1" class="ltx_text" style="--ltx-fg-color:#000000;">Respond strictly in this format:</span></span><pre id="A5.SS5.p4.pic1.2.5" class="ltx_verbatim ltx_font_typewriter" style="--ltx-fg-color:#000000;">
Feedback:::
Total rating: X
</pre>
<span id="A5.SS5.p4.pic1.2.6" class="ltx_p"><span id="A5.SS5.p4.pic1.2.6.1" class="ltx_text" style="--ltx-fg-color:#000000;">Where <span id="A5.SS5.p4.pic1.2.6.1.1" class="ltx_text ltx_font_typewriter">X</span> is an integer between 1 and 10 (inclusive). Output nothing else.</span></span>
<span id="A5.SS5.p4.pic1.2.7" class="ltx_p"><span id="A5.SS5.p4.pic1.2.7.1" class="ltx_text ltx_font_bold" style="--ltx-fg-color:#000000;">Input:<span id="A5.SS5.p4.pic1.2.7.1.1" class="ltx_text"></span></span></span><pre id="A5.SS5.p4.pic1.2.8" class="ltx_verbatim ltx_font_typewriter" style="--ltx-fg-color:#000000;">
