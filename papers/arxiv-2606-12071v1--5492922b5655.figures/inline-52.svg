<span id="A1.SS5.p4.pic1.2.1" class="ltx_p"><span id="A1.SS5.p4.pic1.2.1.1" class="ltx_text ltx_font_sansserif ltx_font_bold" style="--ltx-fg-color:#000000;">BACKGROUND PAPER</span><span id="A1.SS5.p4.pic1.2.1.2" class="ltx_text" style="--ltx-fg-color:#000000;"> 
<br class="ltx_break"><span id="A1.SS5.p4.pic1.2.1.2.1" class="ltx_text ltx_font_bold">Title:</span> Accelerating Large Language Model Decoding with Speculative Sampling 
<br class="ltx_break"><span id="A1.SS5.p4.pic1.2.1.2.2" class="ltx_text ltx_font_bold">Abstract (Summarized):</span> 
<br class="ltx_break">This paper introduces “speculative sampling,” an algorithm that accelerates transformer decoding by generating multiple tokens per call. By using a faster, smaller “draft” model to propose short continuations and a larger target model to score them in parallel via a novel modified rejection sampling scheme, the algorithm preserves the target model’s distribution. Evaluated on the 70B parameter Chinchilla model, this method achieves a 2–2.5<math id="A1.SS5.p4.pic1.m1" class="ltx_Math" alttext="\times" display="inline" intent=":literal"><semantics><mo style="--ltx-fg-color:#000000;" mathcolor="#000000">×</mo><annotation encoding="application/x-tex">\times</annotation></semantics></math> speedup without compromising sample quality or requiring modifications to the target model.</span></span>
</span></span></span></foreignobject></g><g fill-opacity="1.0" transform="matrix(1.0 0.0 0.0 1.0 21.65 550.58)"><foreignobject style="--ltx-fo-width:43.85em;--ltx-fo-height:17.35em;--ltx-fo-depth:38.79em;font-size:10pt;" height="776.83" overflow="visible" transform="matrix(1 0 0 -1 0 240.02)" width="606.76"><span class="ltx_foreignobject_container"><span class="ltx_foreignobject_content"><span id="A1.SS5.p4.pic1.3" class="ltx_inline-logical-block ltx_minipage ltx_align_bottom" style="width:43.85em;">
<span id="A1.SS5.p4.pic1.p2" class="ltx_para">
<span id="A1.SS5.p4.pic1.p2.1" class="ltx_p"><span id="A1.SS5.p4.pic1.p2.1.1" class="ltx_text ltx_font_sansserif ltx_font_bold" style="--ltx-fg-color:#000000;">AUTHOR-ANCHORED RQ</span><span id="A1.SS5.p4.pic1.p2.1.2" class="ltx_text" style="--ltx-fg-color:#000000;">  <span id="A1.SS5.p4.pic1.p2.1.2.1" class="ltx_text ltx_font_bold">Narrowness: 2</span> | <span id="A1.SS5.p4.pic1.p2.1.2.2" class="ltx_text ltx_font_bold">Rank: 0</span> 
<br class="ltx_break"><span id="A1.SS5.p4.pic1.p2.1.2.3" class="ltx_text ltx_font_typewriter" style="font-size:80%;">{’source_boundedness’: 2, ’diagnostic_framing’: 0}</span> 
<br class="ltx_break"><span id="A1.SS5.p4.pic1.p2.1.2.4" class="ltx_text ltx_font_bold">RQ:</span> <span id="A1.SS5.p4.pic1.p2.1.2.5" class="ltx_text ltx_font_italic">“How can introducing a controlled bias via a stepwise process reward model improve the reasoning accuracy of speculative decoding by retaining high-quality draft tokens that strictly unbiased methods would reject?”</span></span></span>
</span>
