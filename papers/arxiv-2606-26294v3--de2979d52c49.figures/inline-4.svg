<svg id="S3.SS2.p7.pic1" class="ltx_picture" height="114" overflow="visible" version="1.1" viewbox="0 0 477.38 114" width="477.38"><g style="--ltx-stroke-color:#000000;--ltx-fill-color:#000000;" fill="#000000" stroke="#000000" stroke-width="0.4pt" transform="translate(0,114) matrix(1 0 0 -1 0 0)"><g style="--ltx-fill-color:#ABB2BD;" fill="#ABB2BD" fill-opacity="1.0"><path style="stroke:none" d="M 0 4.98 L 0 109.02 C 0 111.77 2.23 114 4.98 114 L 472.4 114 C 475.15 114 477.38 111.77 477.38 109.02 L 477.38 4.98 C 477.38 2.23 475.15 0 472.4 0 L 4.98 0 C 2.23 0 0 2.23 0 4.98 Z" /></g><g style="--ltx-fill-color:#F8F8F9;" fill="#F8F8F9" fill-opacity="1.0"><path style="stroke:none" d="M 0.83 4.98 L 0.83 109.02 C 0.83 111.32 2.69 113.17 4.98 113.17 L 472.4 113.17 C 474.69 113.17 476.55 111.32 476.55 109.02 L 476.55 4.98 C 476.55 2.69 474.69 0.83 472.4 0.83 L 4.98 0.83 C 2.69 0.83 0.83 2.69 0.83 4.98 Z" /></g><g fill-opacity="1.0" transform="matrix(1.0 0.0 0.0 1.0 13.07 12.72)"><foreignobject style="--ltx-fo-width:35.25em;--ltx-fo-height:6.63em;--ltx-fo-depth:0.23em;font-size:10pt;" height="94.78" overflow="visible" transform="matrix(1 0 0 -1 0 91.67)" width="487.76"><span class="ltx_foreignobject_container"><span class="ltx_foreignobject_content">
<span id="S3.SS2.p7.pic1.1" class="ltx_inline-block ltx_minipage ltx_align_bottom" style="width:35.25em;">
<span id="S3.SS2.p7.pic1.1.1" class="ltx_p"><span id="S3.SS2.p7.pic1.1.1.1" class="ltx_text ltx_font_bold" style="font-size:90%;--ltx-fg-color:#000000;">Bounded Recovery.<span id="S3.SS2.p7.pic1.1.1.1.1" class="ltx_text ltx_font_medium"> Fix one evaluator slot and a budget of <math id="S3.SS2.p7.pic1.m1" class="ltx_Math" alttext="B" display="inline" intent=":literal"><semantics><mi style="--ltx-fg-color:#000000;" mathcolor="#000000">B</mi><annotation encoding="application/x-tex">B</annotation></semantics></math> evaluations. If each checkpoint reprocesses at most all prior slot-dependent records, the total is bounded by <math id="S3.SS2.p7.pic1.m2" class="ltx_Math" alttext="\rho B/(\rho-1)" display="inline" intent=":literal"><semantics><mrow><mrow><mi style="--ltx-fg-color:#000000;" mathcolor="#000000">ρ</mi><mo lspace="0em" rspace="0em">​</mo><mi style="--ltx-fg-color:#000000;" mathcolor="#000000">B</mi></mrow><mo style="--ltx-fg-color:#000000;" mathcolor="#000000">/</mo><mrow><mo style="--ltx-fg-color:#000000;" mathcolor="#000000" stretchy="false">(</mo><mrow><mi style="--ltx-fg-color:#000000;" mathcolor="#000000">ρ</mi><mo style="--ltx-fg-color:#000000;" mathcolor="#000000">−</mo><mn style="--ltx-fg-color:#000000;" mathcolor="#000000">1</mn></mrow><mo style="--ltx-fg-color:#000000;" mathcolor="#000000" stretchy="false">)</mo></mrow></mrow><annotation encoding="application/x-tex">\rho B/(\rho-1)</annotation></semantics></math> for checkpoint ratio <math id="S3.SS2.p7.pic1.m3" class="ltx_Math" alttext="\rho&gt;1" display="inline" intent=":literal"><semantics><mrow><mi style="--ltx-fg-color:#000000;" mathcolor="#000000">ρ</mi><mo style="--ltx-fg-color:#000000;" mathcolor="#000000">&gt;</mo><mn style="--ltx-fg-color:#000000;" mathcolor="#000000">1</mn></mrow><annotation encoding="application/x-tex">\rho&gt;1</annotation></semantics></math>. Reassessing all prior records after every evaluation would require <math id="S3.SS2.p7.pic1.m4" class="ltx_Math" alttext="\mathcal{O}(B^{2})" display="inline" intent=":literal"><semantics><mrow><mi style="--ltx-fg-color:#000000;" class="ltx_font_mathcaligraphic" mathcolor="#000000">𝒪</mi><mo>⁡</mo><mrow><mo style="--ltx-fg-color:#000000;" mathcolor="#000000" stretchy="false">(</mo><msup><mi style="--ltx-fg-color:#000000;" mathcolor="#000000">B</mi><mn style="--ltx-fg-color:#000000;" mathcolor="#000000">2</mn></msup><mo style="--ltx-fg-color:#000000;" mathcolor="#000000" stretchy="false">)</mo></mrow></mrow><annotation encoding="application/x-tex">\mathcal{O}(B^{2})</annotation></semantics></math> work (<a href="#Thmproposition6" title="Proposition 6 (Linear work under exponential checkpoints). ‣ F.5 Supporting Results for Controlled Utility Evolution ‣ Appendix F Theory" class="ltx_ref"><span class="ltx_text ltx_ref_tag">Props.</span> <span class="ltx_text ltx_ref_tag">6</span></a> and <a href="#Thmremark2" title="Remark 2 (Dense uniform checkpointing). ‣ F.5 Supporting Results for Controlled Utility Evolution ‣ Appendix F Theory" class="ltx_ref"><span class="ltx_text ltx_ref_tag">2</span></a>).</span></span></span>
</span></span></span></foreignobject></g></g></svg>