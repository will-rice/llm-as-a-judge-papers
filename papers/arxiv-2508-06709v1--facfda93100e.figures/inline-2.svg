<svg id="A4.p3.pic1" class="ltx_picture" height="553.94" overflow="visible" version="1.1" viewbox="0 0 650 553.94" width="650"><g style="--ltx-stroke-color:#000000;--ltx-fill-color:#000000;" fill="#000000" stroke="#000000" stroke-width="0.4pt" transform="translate(0,553.94) matrix(1 0 0 -1 0 0)"><g style="--ltx-fill-color:#404040;" fill="#404040" fill-opacity="1.0"><path style="stroke:none" d="M 0 5.91 L 0 548.03 C 0 551.29 2.64 553.94 5.91 553.94 L 644.09 553.94 C 647.36 553.94 650 551.29 650 548.03 L 650 5.91 C 650 2.64 647.36 0 644.09 0 L 5.91 0 C 2.64 0 0 2.64 0 5.91 Z" /></g><g style="--ltx-fill-color:#F9F9F9;" fill="#F9F9F9" fill-opacity="1.0"><path style="stroke:none" d="M 1.97 5.91 L 1.97 529.83 L 648.03 529.83 L 648.03 5.91 C 648.03 3.73 646.27 1.97 644.09 1.97 L 5.91 1.97 C 3.73 1.97 1.97 3.73 1.97 5.91 Z" /></g><g fill-opacity="1.0" transform="matrix(1.0 0.0 0.0 1.0 21.65 538.42)"><foreignobject style="--ltx-fo-width:43.85em;--ltx-fo-height:0.69em;--ltx-fo-depth:0.19em;font-size:10pt;" height="12.3" overflow="visible" transform="matrix(1 0 0 -1 0 9.61)" width="606.76"><span class="ltx_foreignobject_container"><span class="ltx_foreignobject_content">
<span id="A4.p3.pic1.1" class="ltx_inline-block ltx_minipage ltx_align_bottom" style="width:43.85em;">
<span id="A4.p3.pic1.1.1" class="ltx_p"><span id="A4.p3.pic1.1.1.1" class="ltx_text" style="--ltx-fg-color:#FFFFFF;">Logical Robustness Prompt</span></span>
</span></span></span></foreignobject></g><g fill-opacity="1.0" transform="matrix(1.0 0.0 0.0 1.0 21.65 80.2)"><foreignobject style="--ltx-fo-width:43.85em;--ltx-fo-height:31.64em;--ltx-fo-depth:4.8em;font-size:10pt;" height="504.24" overflow="visible" transform="matrix(1 0 0 -1 0 437.83)" width="606.76"><span class="ltx_foreignobject_container"><span class="ltx_foreignobject_content"><span id="A4.p3.pic1.2" class="ltx_inline-logical-block ltx_minipage ltx_align_bottom" style="width:43.85em;">
<span id="A4.p3.pic1.p4" class="ltx_para">
<span id="A4.p3.pic1.p4.1" class="ltx_p"><span id="A4.p3.pic1.p4.1.1" class="ltx_text" style="--ltx-fg-color:#000000;">You are given a task in some context (<span id="A4.p3.pic1.p4.1.1.1" class="ltx_text ltx_font_bold">Input</span>), and a candidate answer. Evaluate whether the arguments in the response follow logically from one another.</span></span>
<span id="A4.p3.pic1.p4.2" class="ltx_p"><span id="A4.p3.pic1.p4.2.1" class="ltx_text" style="--ltx-fg-color:#000000;">Consider the following aspects:</span></span>
<span id="A4.I1" class="ltx_itemize">
<span id="A4.I1.i1" class="ltx_item" style="list-style-type:none;"><span class="ltx_tag ltx_tag_item">•</span> 
<span id="A4.I1.i1.p1" class="ltx_para">
<span id="A4.I1.i1.p1.1" class="ltx_p"><span id="A4.I1.i1.p1.1.1" class="ltx_text" style="--ltx-fg-color:#000000;">Self-contradictions within the response</span></span>
</span></span>
<span id="A4.I1.i2" class="ltx_item" style="list-style-type:none;"><span class="ltx_tag ltx_tag_item">•</span> 
<span id="A4.I1.i2.p1" class="ltx_para">
<span id="A4.I1.i2.p1.1" class="ltx_p"><span id="A4.I1.i2.p1.1.1" class="ltx_text" style="--ltx-fg-color:#000000;">Logic gaps or errors in reasoning</span></span>
</span></span>
<span id="A4.I1.i3" class="ltx_item" style="list-style-type:none;"><span class="ltx_tag ltx_tag_item">•</span> 
<span id="A4.I1.i3.p1" class="ltx_para">
<span id="A4.I1.i3.p1.1" class="ltx_p"><span id="A4.I1.i3.p1.1.1" class="ltx_text" style="--ltx-fg-color:#000000;">Soundness of reasoning (given the premises)</span></span>
</span></span>
<span id="A4.I1.i4" class="ltx_item" style="list-style-type:none;"><span class="ltx_tag ltx_tag_item">•</span> 
<span id="A4.I1.i4.p1" class="ltx_para">
<span id="A4.I1.i4.p1.1" class="ltx_p"><span id="A4.I1.i4.p1.1.1" class="ltx_text" style="--ltx-fg-color:#000000;">Proper argumentation where required</span></span>
</span></span>
</span>
<span id="A4.p3.pic1.p4.3" class="ltx_p"><span id="A4.p3.pic1.p4.3.1" class="ltx_text" style="--ltx-fg-color:#000000;">Note that factual correctness is separate from logical cohesion - evaluate the reasoning process, not the accuracy of claims.</span></span>
</span>
<span id="A4.p3.pic1.p1" class="ltx_para ltx_noindent">
<span id="A4.p3.pic1.p1.1" class="ltx_p"><span id="A4.p3.pic1.p1.1.1" class="ltx_text ltx_font_bold" style="--ltx-fg-color:#000000;">Task:</span><span id="A4.p3.pic1.p1.1.2" class="ltx_text" style="--ltx-fg-color:#000000;"> {prompt}</span>
<br class="ltx_break"><span id="A4.p3.pic1.p1.1.3" class="ltx_text ltx_font_bold" style="--ltx-fg-color:#000000;">Candidate Response:</span><span id="A4.p3.pic1.p1.1.4" class="ltx_text" style="--ltx-fg-color:#000000;"> {prediction}</span></span>
</span>
<span id="A4.p3.pic1.p2" class="ltx_para ltx_noindent">
<span id="A4.p3.pic1.p2.1" class="ltx_p"><span id="A4.p3.pic1.p2.1.1" class="ltx_text ltx_font_bold" style="--ltx-fg-color:#000000;">Instruction:</span><span id="A4.p3.pic1.p2.1.2" class="ltx_text" style="--ltx-fg-color:#000000;"> Evaluate the logical cohesion of the response.</span></span>
</span>
<span id="A4.p3.pic1.p5" class="ltx_para">
<span id="A4.p3.pic1.p5.1" class="ltx_p"><span id="A4.p3.pic1.p5.1.1" class="ltx_text" style="--ltx-fg-color:#000000;">First explain your reasoning, then provide your final answer. Use the following format:</span></span>
<span id="A4.p3.pic1.p5.2" class="ltx_quote">
<span id="A4.p3.pic1.p5.2.1" class="ltx_p"><span id="A4.p3.pic1.p5.2.1.1" class="ltx_text" style="--ltx-fg-color:#000000;">Explanation: [Explanation], Answer: [Answer]</span></span>
</span>
</span>
<span id="A4.p3.pic1.p3" class="ltx_para ltx_noindent">
<span id="A4.p3.pic1.p3.1" class="ltx_p"><span id="A4.p3.pic1.p3.1.1" class="ltx_text" style="--ltx-fg-color:#000000;">where </span><span id="A4.p3.pic1.p3.1.2" class="ltx_text ltx_font_typewriter" style="--ltx-fg-color:#000000;">[Answer]</span><span id="A4.p3.pic1.p3.1.3" class="ltx_text" style="--ltx-fg-color:#000000;"> is one of:</span></span>
<span id="A4.p3.pic1.p3.2" class="ltx_quote">
<span id="A4.p3.pic1.p3.2.1" class="ltx_p"><span id="A4.p3.pic1.p3.2.1.1" class="ltx_text ltx_font_typewriter" style="--ltx-fg-color:#000000;">Not at all
<br class="ltx_break">Not generally
<br class="ltx_break">Neutral/Mixed
<br class="ltx_break">Generally yes
<br class="ltx_break">Yes</span></span>
</span>
</span></span></span></span></foreignobject></g></g></svg>