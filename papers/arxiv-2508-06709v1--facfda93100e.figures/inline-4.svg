<svg id="A4.p5.pic1" class="ltx_picture" height="809.69" overflow="visible" version="1.1" viewbox="0 0 650 809.69" width="650"><g style="--ltx-stroke-color:#000000;--ltx-fill-color:#000000;" fill="#000000" stroke="#000000" stroke-width="0.4pt" transform="translate(0,809.69) matrix(1 0 0 -1 0 0)"><g style="--ltx-fill-color:#404040;" fill="#404040" fill-opacity="1.0"><path style="stroke:none" d="M 0 5.91 L 0 803.79 C 0 807.05 2.64 809.69 5.91 809.69 L 644.09 809.69 C 647.36 809.69 650 807.05 650 803.79 L 650 5.91 C 650 2.64 647.36 0 644.09 0 L 5.91 0 C 2.64 0 0 2.64 0 5.91 Z" /></g><g style="--ltx-fill-color:#F9F9F9;" fill="#F9F9F9" fill-opacity="1.0"><path style="stroke:none" d="M 1.97 5.91 L 1.97 785.58 L 648.03 785.58 L 648.03 5.91 C 648.03 3.73 646.27 1.97 644.09 1.97 L 5.91 1.97 C 3.73 1.97 1.97 3.73 1.97 5.91 Z" /></g><g fill-opacity="1.0" transform="matrix(1.0 0.0 0.0 1.0 21.65 794.18)"><foreignobject style="--ltx-fo-width:43.85em;--ltx-fo-height:0.69em;--ltx-fo-depth:0.19em;font-size:10pt;" height="12.3" overflow="visible" transform="matrix(1 0 0 -1 0 9.61)" width="606.76"><span class="ltx_foreignobject_container"><span class="ltx_foreignobject_content">
<span id="A4.p5.pic1.1" class="ltx_inline-block ltx_minipage ltx_align_bottom" style="width:43.85em;">
<span id="A4.p5.pic1.1.1" class="ltx_p"><span id="A4.p5.pic1.1.1.1" class="ltx_text" style="--ltx-fg-color:#FFFFFF;">Helpfulness Prompt</span></span>
</span></span></span></foreignobject></g><g fill-opacity="1.0" transform="matrix(1.0 0.0 0.0 1.0 21.65 116.48)"><foreignobject style="--ltx-fo-width:43.85em;--ltx-fo-height:47.5em;--ltx-fo-depth:7.42em;font-size:10pt;" height="760" overflow="visible" transform="matrix(1 0 0 -1 0 657.3)" width="606.76"><span class="ltx_foreignobject_container"><span class="ltx_foreignobject_content"><span id="A4.p5.pic1.2" class="ltx_inline-logical-block ltx_minipage ltx_align_bottom" style="width:43.85em;">
<span id="A4.p5.pic1.p4" class="ltx_para">
<span id="A4.p5.pic1.p4.1" class="ltx_p"><span id="A4.p5.pic1.p4.1.1" class="ltx_text" style="--ltx-fg-color:#000000;">You are given a task in some context (<span id="A4.p5.pic1.p4.1.1.1" class="ltx_text ltx_font_bold">Input</span>), and a candidate answer. Evaluate how helpful the completion is for the user’s request.</span></span>
<span id="A4.p5.pic1.p4.2" class="ltx_p"><span id="A4.p5.pic1.p4.2.1" class="ltx_text" style="--ltx-fg-color:#000000;">A response is considered <span id="A4.p5.pic1.p4.2.1.1" class="ltx_text ltx_font_italic">helpful</span> when it satisfies both explicit and implicit expectations in the user’s request. Consider factors such as:</span></span>
<span id="A4.I2" class="ltx_itemize">
<span id="A4.I2.i1" class="ltx_item" style="list-style-type:none;"><span class="ltx_tag ltx_tag_item">•</span> 
<span id="A4.I2.i1.p1" class="ltx_para">
<span id="A4.I2.i1.p1.1" class="ltx_p"><span id="A4.I2.i1.p1.1.1" class="ltx_text" style="--ltx-fg-color:#000000;">Coherence and clarity given the context</span></span>
</span></span>
<span id="A4.I2.i2" class="ltx_item" style="list-style-type:none;"><span class="ltx_tag ltx_tag_item">•</span> 
<span id="A4.I2.i2.p1" class="ltx_para">
<span id="A4.I2.i2.p1.1" class="ltx_p"><span id="A4.I2.i2.p1.1.1" class="ltx_text" style="--ltx-fg-color:#000000;">Task completion (if applicable)</span></span>
</span></span>
<span id="A4.I2.i3" class="ltx_item" style="list-style-type:none;"><span class="ltx_tag ltx_tag_item">•</span> 
<span id="A4.I2.i3.p1" class="ltx_para">
<span id="A4.I2.i3.p1.1" class="ltx_p"><span id="A4.I2.i3.p1.1.1" class="ltx_text" style="--ltx-fg-color:#000000;">Following provided instructions</span></span>
</span></span>
<span id="A4.I2.i4" class="ltx_item" style="list-style-type:none;"><span class="ltx_tag ltx_tag_item">•</span> 
<span id="A4.I2.i4.p1" class="ltx_para">
<span id="A4.I2.i4.p1.1" class="ltx_p"><span id="A4.I2.i4.p1.1.1" class="ltx_text" style="--ltx-fg-color:#000000;">Appropriate style and format</span></span>
</span></span>
<span id="A4.I2.i5" class="ltx_item" style="list-style-type:none;"><span class="ltx_tag ltx_tag_item">•</span> 
<span id="A4.I2.i5.p1" class="ltx_para">
<span id="A4.I2.i5.p1.1" class="ltx_p"><span id="A4.I2.i5.p1.1.1" class="ltx_text" style="--ltx-fg-color:#000000;">Audience appropriateness</span></span>
</span></span>
<span id="A4.I2.i6" class="ltx_item" style="list-style-type:none;"><span class="ltx_tag ltx_tag_item">•</span> 
<span id="A4.I2.i6.p1" class="ltx_para">
<span id="A4.I2.i6.p1.1" class="ltx_p"><span id="A4.I2.i6.p1.1.1" class="ltx_text" style="--ltx-fg-color:#000000;">Specificity level</span></span>
</span></span>
<span id="A4.I2.i7" class="ltx_item" style="list-style-type:none;"><span class="ltx_tag ltx_tag_item">•</span> 
<span id="A4.I2.i7.p1" class="ltx_para">
<span id="A4.I2.i7.p1.1" class="ltx_p"><span id="A4.I2.i7.p1.1.1" class="ltx_text" style="--ltx-fg-color:#000000;">Conciseness vs. elaboration as needed</span></span>
</span></span>
<span id="A4.I2.i8" class="ltx_item" style="list-style-type:none;"><span class="ltx_tag ltx_tag_item">•</span> 
<span id="A4.I2.i8.p1" class="ltx_para">
<span id="A4.I2.i8.p1.1" class="ltx_p"><span id="A4.I2.i8.p1.1.1" class="ltx_text" style="--ltx-fg-color:#000000;">Avoiding unnecessary content</span></span>
</span></span>
<span id="A4.I2.i9" class="ltx_item" style="list-style-type:none;"><span class="ltx_tag ltx_tag_item">•</span> 
<span id="A4.I2.i9.p1" class="ltx_para">
<span id="A4.I2.i9.p1.1" class="ltx_p"><span id="A4.I2.i9.p1.1.1" class="ltx_text" style="--ltx-fg-color:#000000;">Anticipating user needs</span></span>
</span></span>
<span id="A4.I2.i10" class="ltx_item" style="list-style-type:none;"><span class="ltx_tag ltx_tag_item">•</span> 
<span id="A4.I2.i10.p1" class="ltx_para">
<span id="A4.I2.i10.p1.1" class="ltx_p"><span id="A4.I2.i10.p1.1.1" class="ltx_text" style="--ltx-fg-color:#000000;">Interest level (when appropriate)</span></span>
</span></span>
<span id="A4.I2.i11" class="ltx_item" style="list-style-type:none;"><span class="ltx_tag ltx_tag_item">•</span> 
<span id="A4.I2.i11.p1" class="ltx_para">
<span id="A4.I2.i11.p1.1" class="ltx_p"><span id="A4.I2.i11.p1.1.1" class="ltx_text" style="--ltx-fg-color:#000000;">Solution elegance (for technical problems)</span></span>
</span></span>
<span id="A4.I2.i12" class="ltx_item" style="list-style-type:none;"><span class="ltx_tag ltx_tag_item">•</span> 
<span id="A4.I2.i12.p1" class="ltx_para">
<span id="A4.I2.i12.p1.1" class="ltx_p"><span id="A4.I2.i12.p1.1.1" class="ltx_text" style="--ltx-fg-color:#000000;">Appropriate chat formatting (for conversations)</span></span>
</span></span>
</span>
</span>
<span id="A4.p5.pic1.p1" class="ltx_para ltx_noindent">
<span id="A4.p5.pic1.p1.1" class="ltx_p"><span id="A4.p5.pic1.p1.1.1" class="ltx_text ltx_font_bold" style="--ltx-fg-color:#000000;">Task:</span><span id="A4.p5.pic1.p1.1.2" class="ltx_text" style="--ltx-fg-color:#000000;"> {prompt}</span>
<br class="ltx_break"><span id="A4.p5.pic1.p1.1.3" class="ltx_text ltx_font_bold" style="--ltx-fg-color:#000000;">Candidate Response:</span><span id="A4.p5.pic1.p1.1.4" class="ltx_text" style="--ltx-fg-color:#000000;"> {prediction}</span></span>
</span>
<span id="A4.p5.pic1.p2" class="ltx_para ltx_noindent">
<span id="A4.p5.pic1.p2.1" class="ltx_p"><span id="A4.p5.pic1.p2.1.1" class="ltx_text ltx_font_bold" style="--ltx-fg-color:#000000;">Instruction:</span><span id="A4.p5.pic1.p2.1.2" class="ltx_text" style="--ltx-fg-color:#000000;"> Evaluate how helpful the response is for the given task.</span></span>
</span>
<span id="A4.p5.pic1.p5" class="ltx_para">
<span id="A4.p5.pic1.p5.1" class="ltx_p"><span id="A4.p5.pic1.p5.1.1" class="ltx_text" style="--ltx-fg-color:#000000;">First explain your reasoning, then provide your final answer. Use the following format:</span></span>
<span id="A4.p5.pic1.p5.2" class="ltx_quote">
<span id="A4.p5.pic1.p5.2.1" class="ltx_p"><span id="A4.p5.pic1.p5.2.1.1" class="ltx_text" style="--ltx-fg-color:#000000;">Explanation: [Explanation], Answer: [Answer]</span></span>
</span>
</span>
<span id="A4.p5.pic1.p3" class="ltx_para ltx_noindent">
<span id="A4.p5.pic1.p3.1" class="ltx_p"><span id="A4.p5.pic1.p3.1.1" class="ltx_text" style="--ltx-fg-color:#000000;">where </span><span id="A4.p5.pic1.p3.1.2" class="ltx_text ltx_font_typewriter" style="--ltx-fg-color:#000000;">[Answer]</span><span id="A4.p5.pic1.p3.1.3" class="ltx_text" style="--ltx-fg-color:#000000;"> is one of:</span></span>
<span id="A4.p5.pic1.p3.2" class="ltx_quote">
<span id="A4.p5.pic1.p3.2.1" class="ltx_p"><span id="A4.p5.pic1.p3.2.1.1" class="ltx_text ltx_font_typewriter" style="--ltx-fg-color:#000000;">above and beyond
<br class="ltx_break">very helpful
<br class="ltx_break">somewhat helpful
<br class="ltx_break">neither helpful nor unhelpful
<br class="ltx_break">somewhat unhelpful
<br class="ltx_break">very unhelpful
<br class="ltx_break">not helpful at all</span></span>
</span>
</span></span></span></span></foreignobject></g></g></svg>