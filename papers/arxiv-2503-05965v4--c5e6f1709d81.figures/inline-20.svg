<svg id="A4.F32.p1.pic1" class="ltx_picture" height="636.43" overflow="visible" version="1.1" viewbox="0 0 477.38 636.43" width="477.38"><g style="--ltx-stroke-color:#000000;--ltx-fill-color:#000000;" fill="#000000" stroke="#000000" stroke-width="0.4pt" transform="translate(0,636.43) matrix(1 0 0 -1 0 0)"><g style="--ltx-fill-color:#404040;" fill="#404040" fill-opacity="1.0"><path style="stroke:none" d="M 0 5.91 L 0 630.52 C 0 633.78 2.64 636.43 5.91 636.43 L 471.47 636.43 C 474.73 636.43 477.38 633.78 477.38 630.52 L 477.38 5.91 C 477.38 2.64 474.73 0 471.47 0 L 5.91 0 C 2.64 0 0 2.64 0 5.91 Z" /></g><g style="--ltx-fill-color:#F2F2F2;" fill="#F2F2F2" fill-opacity="1.0"><path style="stroke:none" d="M 1.97 5.91 L 1.97 610.78 L 475.41 610.78 L 475.41 5.91 C 475.41 3.73 473.65 1.97 471.47 1.97 L 5.91 1.97 C 3.73 1.97 1.97 3.73 1.97 5.91 Z" /></g><g fill-opacity="1.0" transform="matrix(1.0 0.0 0.0 1.0 21.65 620.14)"><foreignobject style="--ltx-fo-width:31.37em;--ltx-fo-height:0.75em;--ltx-fo-depth:0.25em;font-size:10pt;" height="13.84" overflow="visible" transform="matrix(1 0 0 -1 0 10.38)" width="434.07"><span class="ltx_foreignobject_container"><span class="ltx_foreignobject_content">
<span id="A4.F32.p1.pic1.1" class="ltx_inline-block ltx_minipage ltx_align_bottom" style="width:31.37em;">
<span id="A4.F32.p1.pic1.1.1" class="ltx_p"><span id="A4.F32.p1.pic1.1.1.1" class="ltx_text" style="--ltx-fg-color:#FFFFFF;">Response Set (RS) Rating Instructions - Topical Chat Uses Knowledge</span></span>
</span></span></span></foreignobject></g><g fill-opacity="1.0" transform="matrix(1.0 0.0 0.0 1.0 21.65 157.61)"><foreignobject style="--ltx-fo-width:31.37em;--ltx-fo-height:31.9em;--ltx-fo-depth:10.39em;font-size:10pt;" height="585.2" overflow="visible" transform="matrix(1 0 0 -1 0 441.37)" width="434.07"><span class="ltx_foreignobject_container"><span class="ltx_foreignobject_content">
<span id="A4.F32.p1.pic1.2" class="ltx_inline-block ltx_minipage ltx_align_bottom" style="width:31.37em;">
<span id="A4.F32.p1.pic1.2.1" class="ltx_p"><span id="A4.F32.p1.pic1.2.1.1" class="ltx_text" style="--ltx-fg-color:#000000;">Given a conversation and an interesting fact, your task is to rate how well the response uses the provided fact.
Please make sure you read and understand these instructions carefully.</span></span>
<span id="A4.F32.p1.pic1.2.2" class="ltx_p"><span id="A4.F32.p1.pic1.2.2.1" class="ltx_text ltx_font_bold" style="--ltx-fg-color:#000000;">Evaluation Criteria:
<br class="ltx_break"><span id="A4.F32.p1.pic1.2.2.1.1" class="ltx_text ltx_font_medium">Given the interesting fact that the response is conditioned on, how well does the response use the fact?</span></span></span>
<span id="A4.F32.p1.pic1.2.3" class="ltx_p"><span id="A4.F32.p1.pic1.2.3.1" class="ltx_text ltx_font_bold" style="--ltx-fg-color:#000000;">Evaluation Steps:<span id="A4.F32.p1.pic1.2.3.1.1" class="ltx_text"></span></span></span>
<span id="A4.I46" class="ltx_enumerate">
<span id="A4.I46.i1" class="ltx_item" style="list-style-type:none;"><span class="ltx_tag ltx_tag_item">1.</span> 
<span id="A4.I46.i1.p1" class="ltx_para">
<span id="A4.I46.i1.p1.1" class="ltx_p"><span id="A4.I46.i1.p1.1.1" class="ltx_text" style="--ltx-fg-color:#000000;">Read the conversation context, fact, and response carefully.</span></span>
</span></span>
<span id="A4.I46.i2" class="ltx_item" style="list-style-type:none;"><span class="ltx_tag ltx_tag_item">2.</span> 
<span id="A4.I46.i2.p1" class="ltx_para">
<span id="A4.I46.i2.p1.1" class="ltx_p"><span id="A4.I46.i2.p1.1.1" class="ltx_text" style="--ltx-fg-color:#000000;">Assess whether the response incorporates or references the provided fact.</span></span>
</span></span>
<span id="A4.I46.i3" class="ltx_item" style="list-style-type:none;"><span class="ltx_tag ltx_tag_item">3.</span> 
<span id="A4.I46.i3.p1" class="ltx_para">
<span id="A4.I46.i3.p1.1" class="ltx_p"><span id="A4.I46.i3.p1.1.1" class="ltx_text" style="--ltx-fg-color:#000000;">Select ALL options that reasonably apply, based on different plausible interpretations of the rating criteria.</span></span>
</span></span>
</span>
<span id="A4.F32.p1.pic1.2.4" class="ltx_p"><span id="A4.F32.p1.pic1.2.4.1" class="ltx_text" style="--ltx-fg-color:#000000;">Now provide a response to the following example:
<br class="ltx_break">Fact: “{fact}”
<br class="ltx_break">Context: “{context}”
<br class="ltx_break">Response: “{response}”</span></span>
<span id="A4.F32.p1.pic1.2.5" class="ltx_p"><span id="A4.F32.p1.pic1.2.5.1" class="ltx_text" style="--ltx-fg-color:#000000;">Select ALL options that could reasonably apply:</span></span>
<span id="A4.I47" class="ltx_itemize">
<span id="A4.I47.ix1" class="ltx_item" style="list-style-type:none;"><span class="ltx_tag ltx_tag_item">A.</span> 
<span id="A4.I47.ix1.p1" class="ltx_para">
<span id="A4.I47.ix1.p1.1" class="ltx_p"><span id="A4.I47.ix1.p1.1.1" class="ltx_text" style="--ltx-fg-color:#000000;">Uses Knowledge - The response clearly uses or references the fact</span></span>
</span></span>
<span id="A4.I47.ix2" class="ltx_item" style="list-style-type:none;"><span class="ltx_tag ltx_tag_item">B.</span> 
<span id="A4.I47.ix2.p1" class="ltx_para">
<span id="A4.I47.ix2.p1.1" class="ltx_p"><span id="A4.I47.ix2.p1.1.1" class="ltx_text" style="--ltx-fg-color:#000000;">Doesn’t Use Knowledge - The response does not mention or refer to the fact at all</span></span>
</span></span>
</span>
<span id="A4.F32.p1.pic1.2.6" class="ltx_p"><span id="A4.F32.p1.pic1.2.6.1" class="ltx_text ltx_font_bold" style="--ltx-fg-color:#000000;">RESPONSE FORMAT:<span id="A4.F32.p1.pic1.2.6.1.1" class="ltx_text"></span></span></span>
<span id="A4.I48" class="ltx_itemize">
<span id="A4.I48.i1" class="ltx_item" style="list-style-type:none;"><span class="ltx_tag ltx_tag_item">•</span> 
<span id="A4.I48.i1.p1" class="ltx_para">
<span id="A4.I48.i1.p1.1" class="ltx_p"><span id="A4.I48.i1.p1.1.1" class="ltx_text" style="--ltx-fg-color:#000000;">Provide only the sequence of letters (e.g., “AB” or “A”)</span></span>
</span></span>
<span id="A4.I48.i2" class="ltx_item" style="list-style-type:none;"><span class="ltx_tag ltx_tag_item">•</span> 
<span id="A4.I48.i2.p1" class="ltx_para">
<span id="A4.I48.i2.p1.1" class="ltx_p"><span id="A4.I48.i2.p1.1.1" class="ltx_text" style="--ltx-fg-color:#000000;">Use only letters A or B</span></span>
</span></span>
<span id="A4.I48.i3" class="ltx_item" style="list-style-type:none;"><span class="ltx_tag ltx_tag_item">•</span> 
<span id="A4.I48.i3.p1" class="ltx_para">
<span id="A4.I48.i3.p1.1" class="ltx_p"><span id="A4.I48.i3.p1.1.1" class="ltx_text" style="--ltx-fg-color:#000000;">No spaces, punctuation, or other characters</span></span>
</span></span>
<span id="A4.I48.i4" class="ltx_item" style="list-style-type:none;"><span class="ltx_tag ltx_tag_item">•</span> 
<span id="A4.I48.i4.p1" class="ltx_para">
<span id="A4.I48.i4.p1.1" class="ltx_p"><span id="A4.I48.i4.p1.1.1" class="ltx_text" style="--ltx-fg-color:#000000;">Do not provide the same letter more than once (e.g., “AA” or “BB”, or “B_” are invalid responses)</span></span>
</span></span>
<span id="A4.I48.i5" class="ltx_item" style="list-style-type:none;"><span class="ltx_tag ltx_tag_item">•</span> 
<span id="A4.I48.i5.p1" class="ltx_para">
<span id="A4.I48.i5.p1.1" class="ltx_p"><span id="A4.I48.i5.p1.1.1" class="ltx_text" style="--ltx-fg-color:#000000;">No explanations</span></span>
</span></span>
</span>
</span></span></span></foreignobject></g></g></svg>