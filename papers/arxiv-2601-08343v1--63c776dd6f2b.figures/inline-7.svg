<span id="A3.F13.pic1.1" class="ltx_inline-block ltx_minipage ltx_align_bottom" style="width:44.07em;">
<span id="A3.F13.pic1.1.1" class="ltx_p"><span id="A3.F13.pic1.1.1.1" class="ltx_text ltx_font_bold" style="--ltx-fg-color:#000000;">FinalSelectBest for MMLU<span id="A3.F13.pic1.1.1.1.1" class="ltx_text ltx_font_medium"> 
<br class="ltx_break">You are a judge that selects which agent produced the best multiple-choice answer.
<br class="ltx_break">You will be given a question and candidate answers from different agents.
<br class="ltx_break">Your job is to choose the best agent and output its id and final choice.
<br class="ltx_break">
<br class="ltx_break">Selection criteria:
<br class="ltx_break">- Prefer the agent with the most correct, reliable reasoning.
<br class="ltx_break">- If multiple agents choose the same option, prefer the one with better justification.
<br class="ltx_break">Output format requirements (MUST follow exactly):
<br class="ltx_break">1) First line: Selected agent id: &lt;id&gt; (id must be one of: allowed)
<br class="ltx_break">2) Then write a short justification (any format is ok).
<br class="ltx_break">3) Final line: &lt;choice&gt; (must be exactly one of: A, B, C, D)
<br class="ltx_break">3) Do NOT output anything else.
<br class="ltx_break">The task is: <span id="A3.F13.pic1.1.1.1.1.1" class="ltx_text ltx_font_typewriter">{user_question}
<br class="ltx_break"></span>Candidate Agent Answers:
<br class="ltx_break">Agent 1, role is MMLU Solver, output is:
<br class="ltx_break"><span id="A3.F13.pic1.1.1.1.1.2" class="ltx_text ltx_font_typewriter">{agent_1_current}
<br class="ltx_break"></span>Agent 2, role is MMLU Solver, output is:
<br class="ltx_break"><span id="A3.F13.pic1.1.1.1.1.3" class="ltx_text ltx_font_typewriter">{agent_2_current}
<br class="ltx_break"></span>Agent 3, role is MMLU Solver, output is:
<br class="ltx_break"><span id="A3.F13.pic1.1.1.1.1.4" class="ltx_text ltx_font_typewriter">{agent_3_current}
<br class="ltx_break"></span>Agent 4, role is MMLU Solver, output is:
<br class="ltx_break"><span id="A3.F13.pic1.1.1.1.1.5" class="ltx_text ltx_font_typewriter">{agent_4_current}</span></span></span></span>
</span></span></span></foreignobject></g></g></svg>