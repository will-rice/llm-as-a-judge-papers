<svg id="A4.pic1.p3.pic1" class="ltx_picture" color="#000000" height="417.58" overflow="visible" version="1.1" viewbox="0 0 612.4 417.58" width="612.4"><g style="--ltx-stroke-color:#000000;--ltx-fill-color:#000000;" fill="#000000" stroke="#000000" stroke-width="0.4pt" transform="translate(0,417.58) matrix(1 0 0 -1 0 0)"><g style="--ltx-fill-color:#B30000;" fill="#B30000" fill-opacity="1.0"><path style="stroke:none" d="M 0 7.61 L 0 409.96 C 0 414.17 3.41 417.58 7.61 417.58 L 604.79 417.58 C 608.99 417.58 612.4 414.17 612.4 409.96 L 612.4 7.61 C 612.4 3.41 608.99 0 604.79 0 L 7.61 0 C 3.41 0 0 3.41 0 7.61 Z" /></g><g style="--ltx-fill-color:#FFE6E6;" fill="#FFE6E6" fill-opacity="1.0"><path style="stroke:none" d="M 0.69 7.61 L 0.69 409.96 C 0.69 413.79 3.79 416.88 7.61 416.88 L 604.79 416.88 C 608.61 416.88 611.7 413.79 611.7 409.96 L 611.7 7.61 C 611.7 3.79 608.61 0.69 604.79 0.69 L 7.61 0.69 C 3.79 0.69 0.69 3.79 0.69 7.61 Z" /></g><g fill-opacity="1.0" transform="matrix(1.0 0.0 0.0 1.0 20.38 15.19)"><foreignobject style="--ltx-fo-width:41.31em;--ltx-fo-height:28.18em;--ltx-fo-depth:0.19em;font-size:10pt;" height="392.57" overflow="visible" transform="matrix(1 0 0 -1 0 389.88)" width="571.61"><span class="ltx_foreignobject_container"><span class="ltx_foreignobject_content"><span id="A4.pic1.p3.pic1.1" class="ltx_inline-logical-block ltx_minipage ltx_align_bottom" style="width:41.31em;">
<span id="A4.pic1.p3.pic1.p1" class="ltx_para ltx_noindent">
<span id="A4.pic1.p3.pic1.p1.1" class="ltx_p"><span id="A4.pic1.p3.pic1.p1.1.1" class="ltx_text ltx_font_bold">Formatted Response A:</span> 
<br class="ltx_break">Here’s how to solve this problem:</span>
</span>
<span id="A4.pic1.p3.pic1.p2" class="ltx_para">
<span id="A4.pic1.p3.pic1.p2.1" class="ltx_p"><span id="A4.pic1.p3.pic1.p2.1.1" class="ltx_text ltx_font_bold">Understanding the Concept
<br class="ltx_break"></span></span>
<span id="A4.pic1.p3.pic1.p2.2" class="ltx_p">This problem involves trigonometry. We can use the tangent function:</span>
<span id="A4.I5" class="ltx_itemize">
<span id="A4.I5.i1" class="ltx_item" style="list-style-type:none;"><span class="ltx_tag ltx_tag_item"><span id="A4.I5.i1.1" class="ltx_text" style="--ltx-fg-color:#000000;">•</span></span> 
<span id="A4.I5.i1.p1" class="ltx_para">
<span id="A4.I5.i1.p1.1" class="ltx_p"><span id="A4.I5.i1.p1.1.1" class="ltx_text ltx_font_bold">tan(angle)= opposite side / adjacent side</span></span>
</span></span>
</span>
<span id="A4.pic1.p3.pic1.p2.3" class="ltx_p">In this case:</span>
<span id="A4.I6" class="ltx_itemize">
<span id="A4.I6.i1" class="ltx_item" style="list-style-type:none;"><span class="ltx_tag ltx_tag_item"><span id="A4.I6.i1.1" class="ltx_text" style="--ltx-fg-color:#000000;">•</span></span> 
<span id="A4.I6.i1.p1" class="ltx_para">
<span id="A4.I6.i1.p1.1" class="ltx_p"><span id="A4.I6.i1.p1.1.1" class="ltx_text ltx_font_bold">angle</span>: <math id="A4.I6.i1.p1.m1" class="ltx_Math" alttext="22^{\circ}" display="inline" intent=":literal"><semantics><msup><mn>22</mn><mo>∘</mo></msup><annotation encoding="application/x-tex">22^{\circ}</annotation></semantics></math> (the angle the sun makes with the horizon)</span>
</span></span>
<span id="A4.I6.i2" class="ltx_item" style="list-style-type:none;"><span class="ltx_tag ltx_tag_item"><span id="A4.I6.i2.1" class="ltx_text" style="--ltx-fg-color:#000000;">•</span></span> 
<span id="A4.I6.i2.p1" class="ltx_para">
<span id="A4.I6.i2.p1.1" class="ltx_p"><span id="A4.I6.i2.p1.1.1" class="ltx_text ltx_font_bold">opposite side</span>: 60 meters (the height of the building)</span>
</span></span>
<span id="A4.I6.i3" class="ltx_item" style="list-style-type:none;"><span class="ltx_tag ltx_tag_item"><span id="A4.I6.i3.1" class="ltx_text" style="--ltx-fg-color:#000000;">•</span></span> 
<span id="A4.I6.i3.p1" class="ltx_para">
<span id="A4.I6.i3.p1.1" class="ltx_p"><span id="A4.I6.i3.p1.1.1" class="ltx_text ltx_font_bold">adjacent side</span>: the length of the shadow (what we want to find)</span>
</span></span>
</span>
<span id="A4.pic1.p3.pic1.p2.4" class="ltx_p">Calculation</span>
<span id="A4.I7" class="ltx_enumerate">
<span id="A4.I7.i1" class="ltx_item" style="list-style-type:none;"><span class="ltx_tag ltx_tag_item"><span id="A4.I7.i1.1" class="ltx_text" style="--ltx-fg-color:#000000;">1.</span></span> 
<span id="A4.I7.i1.p1" class="ltx_para">
<span id="A4.I7.i1.p1.1" class="ltx_p"><span id="A4.I7.i1.p1.1.1" class="ltx_text ltx_font_bold">Set up the equation</span>:</span>
</span>
<span id="A4.I7.i1.p2" class="ltx_para">
<span id="A4.I7.i1.p2.1" class="ltx_p"><math id="A4.I7.i1.p2.m1" class="ltx_Math" alttext="\tan\left(22^{\circ}\right)=60" display="inline" intent=":literal"><semantics><mrow><mrow><mi>tan</mi><mo>⁡</mo><mrow><mo>(</mo><msup><mn>22</mn><mo>∘</mo></msup><mo>)</mo></mrow></mrow><mo>=</mo><mn>60</mn></mrow><annotation encoding="application/x-tex">\tan\left(22^{\circ}\right)=60</annotation></semantics></math> meters / adjacent side</span>
</span></span>
<span id="A4.I7.i2" class="ltx_item" style="list-style-type:none;"><span class="ltx_tag ltx_tag_item"><span id="A4.I7.i2.1" class="ltx_text" style="--ltx-fg-color:#000000;">2.</span></span> 
<span id="A4.I7.i2.p1" class="ltx_para">
<span id="A4.I7.i2.p1.1" class="ltx_p"><span id="A4.I7.i2.p1.1.1" class="ltx_text ltx_font_bold">Solve for the adjacent side (shadow length)</span>:</span>
</span>
<span id="A4.I7.i2.p2" class="ltx_para">
<span id="A4.I7.i2.p2.1" class="ltx_p">adjacent side <math id="A4.I7.i2.p2.m1" class="ltx_Math" alttext="=60" display="inline" intent=":literal"><semantics><mrow><mphantom></mphantom><mo>=</mo><mn>60</mn></mrow><annotation encoding="application/x-tex">=60</annotation></semantics></math> meters <math id="A4.I7.i2.p2.m2" class="ltx_Math" alttext="/\tan\left(22^{\circ}\right)" display="inline" intent=":literal"><semantics><mrow><mphantom></mphantom><mo>/</mo><mrow><mi>tan</mi><mo>⁡</mo><mrow><mo>(</mo><msup><mn>22</mn><mo>∘</mo></msup><mo>)</mo></mrow></mrow></mrow><annotation encoding="application/x-tex">/\tan\left(22^{\circ}\right)</annotation></semantics></math></span>
</span></span>
<span id="A4.I7.i3" class="ltx_item" style="list-style-type:none;"><span class="ltx_tag ltx_tag_item"><span id="A4.I7.i3.1" class="ltx_text" style="--ltx-fg-color:#000000;">3.</span></span> 
<span id="A4.I7.i3.p1" class="ltx_para">
<span id="A4.I7.i3.p1.1" class="ltx_p"><span id="A4.I7.i3.p1.1.1" class="ltx_text ltx_font_bold">Calculate</span>:</span>
</span>
<span id="A4.I7.i3.p2" class="ltx_para">
<span id="A4.I7.i3.p2.1" class="ltx_p">adjacent side <math id="A4.I7.i3.p2.m1" class="ltx_Math" alttext="\approx 60" display="inline" intent=":literal"><semantics><mrow><mphantom></mphantom><mo>≈</mo><mn>60</mn></mrow><annotation encoding="application/x-tex">\approx 60</annotation></semantics></math> meters / <math id="A4.I7.i3.p2.m2" class="ltx_Math" alttext="0.404\approx 148.51" display="inline" intent=":literal"><semantics><mrow><mn>0.404</mn><mo>≈</mo><mn>148.51</mn></mrow><annotation encoding="application/x-tex">0.404\approx 148.51</annotation></semantics></math> meters</span>
</span></span>
</span>
<span id="A4.pic1.p3.pic1.p2.5" class="ltx_p">Answer</span>
<span id="A4.pic1.p3.pic1.p2.6" class="ltx_p">The shadow cast by the building is approximately 148.51 meters long.</span>
</span></span></span></span></foreignobject></g></g></svg>