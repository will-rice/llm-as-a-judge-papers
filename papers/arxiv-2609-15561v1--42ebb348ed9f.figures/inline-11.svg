</span></span></span></foreignobject></g><g fill-opacity="1.0" transform="matrix(1.0 0.0 0.0 1.0 13.35 1289.73)"><foreignobject style="--ltx-fo-width:45.05em;--ltx-fo-height:1.8em;--ltx-fo-depth:92.45em;font-size:10pt;" height="1304.08" overflow="visible" transform="matrix(1 0 0 -1 0 24.91)" width="623.37"><span class="ltx_foreignobject_container"><span class="ltx_foreignobject_content">
<span id="A4.pic1.2" class="ltx_inline-block ltx_minipage ltx_align_bottom" style="width:45.05em;">
<span id="A4.I1" class="ltx_itemize">
<span id="A4.I1.i1" class="ltx_item" style="list-style-type:none;"><span class="ltx_tag ltx_tag_item">•</span> 
<span id="A4.I1.i1.p1" class="ltx_para ltx_noindent">
<span id="A4.I1.i1.p1.1" class="ltx_p"><span id="A4.I1.i1.p1.1.1" class="ltx_text ltx_font_bold" style="--ltx-fg-color:#000000;">A0 (Reference)</span><span id="A4.I1.i1.p1.1.2" class="ltx_text" style="--ltx-fg-color:#000000;">: After </span><span id="A4.I1.i1.p1.1.3" class="ltx_text" style="--ltx-fg-color:#008080;">World War II</span><span id="A4.I1.i1.p1.1.4" class="ltx_text" style="--ltx-fg-color:#000000;">, Korea was divided into North and South Korea, marking </span><span id="A4.I1.i1.p1.1.5" class="ltx_text" style="--ltx-fg-color:#008080;">the end</span><span id="A4.I1.i1.p1.1.6" class="ltx_text" style="--ltx-fg-color:#000000;"> of the Japanese Empire’s </span><span id="A4.I1.i1.p1.1.7" class="ltx_text" style="--ltx-fg-color:#008080;">35-year occupation</span><span id="A4.I1.i1.p1.1.8" class="ltx_text" style="--ltx-fg-color:#000000;"> of Korea </span><span id="A4.I1.i1.p1.1.9" class="ltx_text" style="--ltx-fg-color:#008080;">in 1945</span><span id="A4.I1.i1.p1.1.10" class="ltx_text" style="--ltx-fg-color:#000000;">. The United States and the Soviet Union each </span><span id="A4.I1.i1.p1.1.11" class="ltx_text" style="--ltx-fg-color:#008080;">took control</span><span id="A4.I1.i1.p1.1.12" class="ltx_text" style="--ltx-fg-color:#000000;"> of separate areas of </span><span id="A4.I1.i1.p1.1.13" class="ltx_text" style="--ltx-fg-color:#008080;">the country</span><span id="A4.I1.i1.p1.1.14" class="ltx_text" style="--ltx-fg-color:#000000;">, with the dividing line at </span><span id="A4.I1.i1.p1.1.15" class="ltx_text" style="--ltx-fg-color:#008080;">the 38th parallel</span><span id="A4.I1.i1.p1.1.16" class="ltx_text" style="--ltx-fg-color:#000000;">.</span></span>
</span></span>
<span id="A4.I1.i2" class="ltx_item" style="list-style-type:none;"><span class="ltx_tag ltx_tag_item">•</span> 
<span id="A4.I1.i2.p1" class="ltx_para ltx_noindent">
<span id="A4.I1.i2.p1.1" class="ltx_p"><span id="A4.I1.i2.p1.1.1" class="ltx_text ltx_font_bold" style="--ltx-fg-color:#000000;">A1 (Low perturbation)</span><span id="A4.I1.i2.p1.1.2" class="ltx_text" style="--ltx-fg-color:#000000;">: After </span><span id="A4.I1.i2.p1.1.3" class="ltx_text" style="--ltx-fg-color:#008080;">World War II</span><span id="A4.I1.i2.p1.1.4" class="ltx_text" style="--ltx-fg-color:#000000;">, Korea was divided into North and South Korea, marking </span><span id="A4.I1.i2.p1.1.5" class="ltx_text" style="--ltx-fg-color:#008080;">the end</span><span id="A4.I1.i2.p1.1.6" class="ltx_text" style="--ltx-fg-color:#000000;"> of the Japanese Empire’s </span><span id="A4.I1.i2.p1.1.7" class="ltx_text" style="--ltx-fg-color:#FF0000;">25-year occupation</span><span id="A4.I1.i2.p1.1.8" class="ltx_text" style="--ltx-fg-color:#000000;"> of Korea </span><span id="A4.I1.i2.p1.1.9" class="ltx_text" style="--ltx-fg-color:#008080;">in 1945</span><span id="A4.I1.i2.p1.1.10" class="ltx_text" style="--ltx-fg-color:#000000;">. The United States and the Soviet Union each </span><span id="A4.I1.i2.p1.1.11" class="ltx_text" style="--ltx-fg-color:#008080;">took control</span><span id="A4.I1.i2.p1.1.12" class="ltx_text" style="--ltx-fg-color:#000000;"> of separate areas of </span><span id="A4.I1.i2.p1.1.13" class="ltx_text" style="--ltx-fg-color:#008080;">the country</span><span id="A4.I1.i2.p1.1.14" class="ltx_text" style="--ltx-fg-color:#000000;">, with the dividing line at </span><span id="A4.I1.i2.p1.1.15" class="ltx_text" style="--ltx-fg-color:#FF0000;">the 36th parallel</span><span id="A4.I1.i2.p1.1.16" class="ltx_text" style="--ltx-fg-color:#000000;">.</span></span>
</span></span>
<span id="A4.I1.i3" class="ltx_item" style="list-style-type:none;"><span class="ltx_tag ltx_tag_item">•</span> 
<span id="A4.I1.i3.p1" class="ltx_para ltx_noindent">
<span id="A4.I1.i3.p1.1" class="ltx_p"><span id="A4.I1.i3.p1.1.1" class="ltx_text ltx_font_bold" style="--ltx-fg-color:#000000;">A2 (Medium perturbation)</span><span id="A4.I1.i3.p1.1.2" class="ltx_text" style="--ltx-fg-color:#000000;">: After </span><span id="A4.I1.i3.p1.1.3" class="ltx_text" style="--ltx-fg-color:#008080;">World War II</span><span id="A4.I1.i3.p1.1.4" class="ltx_text" style="--ltx-fg-color:#000000;">, Korea was divided into North and South Korea, marking </span><span id="A4.I1.i3.p1.1.5" class="ltx_text" style="--ltx-fg-color:#FF0000;">a shifting</span><span id="A4.I1.i3.p1.1.6" class="ltx_text" style="--ltx-fg-color:#000000;"> of the Japanese Empire’s </span><span id="A4.I1.i3.p1.1.7" class="ltx_text" style="--ltx-fg-color:#FF0000;">25-year occupation</span><span id="A4.I1.i3.p1.1.8" class="ltx_text" style="--ltx-fg-color:#000000;"> of Korea </span><span id="A4.I1.i3.p1.1.9" class="ltx_text" style="--ltx-fg-color:#008080;">in 1945</span><span id="A4.I1.i3.p1.1.10" class="ltx_text" style="--ltx-fg-color:#000000;">. The United States and the Soviet Union each </span><span id="A4.I1.i3.p1.1.11" class="ltx_text" style="--ltx-fg-color:#008080;">took control</span><span id="A4.I1.i3.p1.1.12" class="ltx_text" style="--ltx-fg-color:#000000;"> of separate areas of </span><span id="A4.I1.i3.p1.1.13" class="ltx_text" style="--ltx-fg-color:#008080;">the country</span><span id="A4.I1.i3.p1.1.14" class="ltx_text" style="--ltx-fg-color:#000000;">, with the dividing line at </span><span id="A4.I1.i3.p1.1.15" class="ltx_text" style="--ltx-fg-color:#FF0000;">the 36th parallel</span><span id="A4.I1.i3.p1.1.16" class="ltx_text" style="--ltx-fg-color:#000000;">.</span></span>
</span></span>
<span id="A4.I1.i4" class="ltx_item" style="list-style-type:none;"><span class="ltx_tag ltx_tag_item">•</span> 
<span id="A4.I1.i4.p1" class="ltx_para ltx_noindent">
<span id="A4.I1.i4.p1.1" class="ltx_p"><span id="A4.I1.i4.p1.1.1" class="ltx_text ltx_font_bold" style="--ltx-fg-color:#000000;">A3 (High perturbation)</span><span id="A4.I1.i4.p1.1.2" class="ltx_text" style="--ltx-fg-color:#000000;">: After </span><span id="A4.I1.i4.p1.1.3" class="ltx_text" style="--ltx-fg-color:#008080;">World War II</span><span id="A4.I1.i4.p1.1.4" class="ltx_text" style="--ltx-fg-color:#000000;">, Korea was divided into North and South Korea, marking </span><span id="A4.I1.i4.p1.1.5" class="ltx_text" style="--ltx-fg-color:#FF0000;">a shifting</span><span id="A4.I1.i4.p1.1.6" class="ltx_text" style="--ltx-fg-color:#000000;"> of the Japanese Empire’s </span><span id="A4.I1.i4.p1.1.7" class="ltx_text" style="--ltx-fg-color:#FF0000;">25-year occupation</span><span id="A4.I1.i4.p1.1.8" class="ltx_text" style="--ltx-fg-color:#000000;"> of Korea </span><span id="A4.I1.i4.p1.1.9" class="ltx_text" style="--ltx-fg-color:#FF0000;">in 1950</span><span id="A4.I1.i4.p1.1.10" class="ltx_text" style="--ltx-fg-color:#000000;">. The United States and the Soviet Union each </span><span id="A4.I1.i4.p1.1.11" class="ltx_text" style="--ltx-fg-color:#FF0000;">took influence</span><span id="A4.I1.i4.p1.1.12" class="ltx_text" style="--ltx-fg-color:#000000;"> of separate areas of </span><span id="A4.I1.i4.p1.1.13" class="ltx_text" style="--ltx-fg-color:#008080;">the country</span><span id="A4.I1.i4.p1.1.14" class="ltx_text" style="--ltx-fg-color:#000000;">, with the dividing line at </span><span id="A4.I1.i4.p1.1.15" class="ltx_text" style="--ltx-fg-color:#FF0000;">the 36th parallel</span><span id="A4.I1.i4.p1.1.16" class="ltx_text" style="--ltx-fg-color:#000000;">.</span></span>
</span></span>
<span id="A4.I1.i5" class="ltx_item" style="list-style-type:none;"><span class="ltx_tag ltx_tag_item">•</span> 
<span id="A4.I1.i5.p1" class="ltx_para">
<span id="A4.I1.i5.p1.1" class="ltx_p"><span id="A4.I1.i5.p1.1.1" class="ltx_text ltx_font_bold" style="--ltx-fg-color:#000000;">A4 (Extreme perturbation)</span><span id="A4.I1.i5.p1.1.2" class="ltx_text" style="--ltx-fg-color:#000000;">: After </span><span id="A4.I1.i5.p1.1.3" class="ltx_text" style="--ltx-fg-color:#FF0000;">World War I</span><span id="A4.I1.i5.p1.1.4" class="ltx_text" style="--ltx-fg-color:#000000;">, Korea was divided into North and South Korea, marking </span><span id="A4.I1.i5.p1.1.5" class="ltx_text" style="--ltx-fg-color:#FF0000;">a shifting</span><span id="A4.I1.i5.p1.1.6" class="ltx_text" style="--ltx-fg-color:#000000;"> of the Japanese Empire’s </span><span id="A4.I1.i5.p1.1.7" class="ltx_text" style="--ltx-fg-color:#FF0000;">25-year occupation</span><span id="A4.I1.i5.p1.1.8" class="ltx_text" style="--ltx-fg-color:#000000;"> of Korea </span><span id="A4.I1.i5.p1.1.9" class="ltx_text" style="--ltx-fg-color:#FF0000;">in 1950</span><span id="A4.I1.i5.p1.1.10" class="ltx_text" style="--ltx-fg-color:#000000;">. The United States and the Soviet Union each </span><span id="A4.I1.i5.p1.1.11" class="ltx_text" style="--ltx-fg-color:#FF0000;">took influence</span><span id="A4.I1.i5.p1.1.12" class="ltx_text" style="--ltx-fg-color:#000000;"> of separate areas of </span><span id="A4.I1.i5.p1.1.13" class="ltx_text" style="--ltx-fg-color:#FF0000;">the region</span><span id="A4.I1.i5.p1.1.14" class="ltx_text" style="--ltx-fg-color:#000000;">, with the dividing line at </span><span id="A4.I1.i5.p1.1.15" class="ltx_text" style="--ltx-fg-color:#FF0000;">the 36th parallel</span><span id="A4.I1.i5.p1.1.16" class="ltx_text" style="--ltx-fg-color:#000000;">.</span></span>
</span></span>
