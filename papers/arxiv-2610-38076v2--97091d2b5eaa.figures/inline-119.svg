<span id="A6.SSx15.SSS0.Px1.p4.pic1.2" class="ltx_inline-block ltx_minipage ltx_align_bottom" style="width:42.56em;">
<span id="A6.SSx15.SSS0.Px1.p4.pic1.2.1" class="ltx_p ltx_align_left"><span id="A6.SSx15.SSS0.Px1.p4.pic1.2.1.1" class="ltx_text ltx_font_typewriter" style="--ltx-fg-color:#000000;">You will be given one summary written for a source document.</span></span>
<span id="A6.SSx15.SSS0.Px1.p4.pic1.2.2" class="ltx_p ltx_align_left"><span id="A6.SSx15.SSS0.Px1.p4.pic1.2.2.1" class="ltx_text ltx_font_typewriter" style="--ltx-fg-color:#000000;">Your task is to rate the summary on one metric: Relevance.</span></span>
<span id="A6.SSx15.SSS0.Px1.p4.pic1.2.3" class="ltx_p ltx_align_left"><span id="A6.SSx15.SSS0.Px1.p4.pic1.2.3.1" class="ltx_text ltx_font_typewriter" style="--ltx-fg-color:#000000;">Please make sure you read and understand these instructions carefully. Please keep</span></span>
<span id="A6.SSx15.SSS0.Px1.p4.pic1.2.4" class="ltx_p ltx_align_left"><span id="A6.SSx15.SSS0.Px1.p4.pic1.2.4.1" class="ltx_text ltx_font_typewriter" style="--ltx-fg-color:#000000;">this document open while reviewing, and refer to it as needed.</span></span>
<span id="A6.SSx15.SSS0.Px1.p4.pic1.2.5" class="ltx_p ltx_align_left"><span id="A6.SSx15.SSS0.Px1.p4.pic1.2.5.1" class="ltx_text ltx_font_typewriter" style="--ltx-fg-color:#000000;">Evaluation Criteria:</span></span>
<span id="A6.SSx15.SSS0.Px1.p4.pic1.2.6" class="ltx_p ltx_align_left"><span id="A6.SSx15.SSS0.Px1.p4.pic1.2.6.1" class="ltx_text ltx_font_typewriter" style="--ltx-fg-color:#000000;">Relevance (1-5) - selection of important content from the source. The summary</span></span>
<span id="A6.SSx15.SSS0.Px1.p4.pic1.2.7" class="ltx_p ltx_align_left"><span id="A6.SSx15.SSS0.Px1.p4.pic1.2.7.1" class="ltx_text ltx_font_typewriter" style="--ltx-fg-color:#000000;">should include only important information from the source document. Annotators were</span></span>
<span id="A6.SSx15.SSS0.Px1.p4.pic1.2.8" class="ltx_p ltx_align_left"><span id="A6.SSx15.SSS0.Px1.p4.pic1.2.8.1" class="ltx_text ltx_font_typewriter" style="--ltx-fg-color:#000000;">instructed to penalize summaries which contained redundancies and excess</span></span>
<span id="A6.SSx15.SSS0.Px1.p4.pic1.2.9" class="ltx_p ltx_align_left"><span id="A6.SSx15.SSS0.Px1.p4.pic1.2.9.1" class="ltx_text ltx_font_typewriter" style="--ltx-fg-color:#000000;">information.</span></span>
<span id="A6.SSx15.SSS0.Px1.p4.pic1.2.10" class="ltx_p ltx_align_left"><span id="A6.SSx15.SSS0.Px1.p4.pic1.2.10.1" class="ltx_text ltx_font_typewriter" style="--ltx-fg-color:#000000;">Evaluation Steps:</span></span>
<span id="A6.SSx15.SSS0.Px1.p4.pic1.2.11" class="ltx_p ltx_align_left"><span id="A6.SSx15.SSS0.Px1.p4.pic1.2.11.1" class="ltx_text ltx_font_typewriter" style="--ltx-fg-color:#000000;">1. Read the source document carefully.</span></span>
<span id="A6.SSx15.SSS0.Px1.p4.pic1.2.12" class="ltx_p ltx_align_left"><span id="A6.SSx15.SSS0.Px1.p4.pic1.2.12.1" class="ltx_text ltx_font_typewriter" style="--ltx-fg-color:#000000;">2. Read the summary and compare it to the source document.</span></span>
<span id="A6.SSx15.SSS0.Px1.p4.pic1.2.13" class="ltx_p ltx_align_left"><span id="A6.SSx15.SSS0.Px1.p4.pic1.2.13.1" class="ltx_text ltx_font_typewriter" style="--ltx-fg-color:#000000;">3. Assign a score for relevance on a scale of 1-5, where 1 is the lowest and 5 is</span></span>
<span id="A6.SSx15.SSS0.Px1.p4.pic1.2.14" class="ltx_p ltx_align_left"><span id="A6.SSx15.SSS0.Px1.p4.pic1.2.14.1" class="ltx_text ltx_font_typewriter" style="--ltx-fg-color:#000000;">the highest.</span></span>
<span id="A6.SSx15.SSS0.Px1.p4.pic1.2.15" class="ltx_p ltx_align_left"><span id="A6.SSx15.SSS0.Px1.p4.pic1.2.15.1" class="ltx_text ltx_font_typewriter" style="--ltx-fg-color:#000000;">Source Document:</span></span>
<span id="A6.SSx15.SSS0.Px1.p4.pic1.2.16" class="ltx_p ltx_align_left"><span id="A6.SSx15.SSS0.Px1.p4.pic1.2.16.1" class="ltx_text ltx_font_typewriter" style="--ltx-fg-color:#000000;">conversation</span></span>
<span id="A6.SSx15.SSS0.Px1.p4.pic1.2.17" class="ltx_p ltx_align_left"><span id="A6.SSx15.SSS0.Px1.p4.pic1.2.17.1" class="ltx_text ltx_font_typewriter" style="--ltx-fg-color:#000000;">Summary:</span></span>
<span id="A6.SSx15.SSS0.Px1.p4.pic1.2.18" class="ltx_p ltx_align_left"><span id="A6.SSx15.SSS0.Px1.p4.pic1.2.18.1" class="ltx_text ltx_font_typewriter" style="--ltx-fg-color:#000000;">prediction</span></span>
<span id="A6.SSx15.SSS0.Px1.p4.pic1.2.19" class="ltx_p ltx_align_left"><span id="A6.SSx15.SSS0.Px1.p4.pic1.2.19.1" class="ltx_text ltx_font_typewriter" style="--ltx-fg-color:#000000;">Evaluation Form (scores ONLY):</span></span>
<span id="A6.SSx15.SSS0.Px1.p4.pic1.2.20" class="ltx_p ltx_align_left"><span id="A6.SSx15.SSS0.Px1.p4.pic1.2.20.1" class="ltx_text ltx_font_typewriter" style="--ltx-fg-color:#000000;">- Relevance (1-5):</span></span>
