<svg id="S3.T1.pic1" class="ltx_picture ltx_centering" height="474.82" overflow="visible" version="1.1" viewbox="0 0 550 474.82" width="550"><g style="--ltx-stroke-color:#000000;--ltx-fill-color:#000000;" fill="#000000" stroke="#000000" stroke-width="0.4pt" transform="translate(0,474.82) matrix(1 0 0 -1 0 0)"><g style="--ltx-fill-color:#4D4D4D;" fill="#4D4D4D" fill-opacity="1.0"><path style="stroke:none" d="M 0 0 L 0 474.82 L 550 474.82 L 550 0 Z" /></g><g style="--ltx-fill-color:#F9F9F9;" fill="#F9F9F9" fill-opacity="1.0"><path style="stroke:none" d="M 1.38 1.38 L 1.38 451.88 L 548.62 451.88 L 548.62 1.38 Z" /></g><g fill-opacity="1.0" transform="matrix(1.0 0.0 0.0 1.0 21.07 459.89)"><foreignobject style="--ltx-fo-width:31.91em;--ltx-fo-height:0.69em;--ltx-fo-depth:0.19em;font-size:10pt;" height="12.3" overflow="visible" transform="matrix(1 0 0 -1 0 9.61)" width="441.54"><span class="ltx_foreignobject_container"><span class="ltx_foreignobject_content">
<span id="S3.T1.pic1.1" class="ltx_inline-block ltx_minipage ltx_align_bottom" style="width:31.91em;">
<span id="S3.T1.pic1.1.1" class="ltx_p"><span id="S3.T1.pic1.1.1.1" class="ltx_text ltx_font_bold" style="--ltx-fg-color:#FFFFFF;">Rules for CoT Trajectory Segmentation</span></span>
</span></span></span></foreignobject></g><g fill-opacity="1.0" transform="matrix(1.0 0.0 0.0 1.0 21.07 180.55)"><foreignobject style="--ltx-fo-width:36.7em;--ltx-fo-height:18.76em;--ltx-fo-depth:12.09em;font-size:10pt;" height="426.88" overflow="visible" transform="matrix(1 0 0 -1 0 259.52)" width="507.82"><span class="ltx_foreignobject_container"><span class="ltx_foreignobject_content">
<span id="S3.T1.pic1.2" class="ltx_inline-block ltx_minipage ltx_align_bottom" style="width:36.7em;">
<span id="S3.T1.pic1.2.1" class="ltx_p"><span id="S3.T1.pic1.2.1.1" class="ltx_text ltx_font_bold" style="--ltx-fg-color:#000000;">Segmentation Principles<span id="S3.T1.pic1.2.1.1.1" class="ltx_text"></span></span></span>
<span id="S3.I2" class="ltx_enumerate ltx_leftmargin_flush">
<span id="S3.I2.i1" class="ltx_item" style="list-style-type:none;"><span class="ltx_tag ltx_tag_item">1.</span> 
<span id="S3.I2.i1.p1" class="ltx_para ltx_noindent">
<span id="S3.I2.i1.p1.1" class="ltx_p"><span id="S3.I2.i1.p1.1.1" class="ltx_text" style="--ltx-fg-color:#000000;">Unified purpose: A chunk should serve a single, clear objective. For example: setting up an initial equation, executing a self-contained calculation (like integration by parts), or stating a final/intermediate conclusion. All content within the chunk must directly serve this one core goal.</span></span>
</span></span>
<span id="S3.I2.i2" class="ltx_item" style="list-style-type:none;"><span class="ltx_tag ltx_tag_item">2.</span> 
<span id="S3.I2.i2.p1" class="ltx_para ltx_noindent">
<span id="S3.I2.i2.p1.1" class="ltx_p"><span id="S3.I2.i2.p1.1.1" class="ltx_text" style="--ltx-fg-color:#000000;">Logical Cohesion: All lines within a chunk must form a continuous and uninterrupted logical flow. A new chunk should begin as soon as the focus or purpose of the reasoning shifts.</span></span>
</span></span>
<span id="S3.I2.i3" class="ltx_item" style="list-style-type:none;"><span class="ltx_tag ltx_tag_item">3.</span> 
<span id="S3.I2.i3.p1" class="ltx_para">
<span id="S3.I2.i3.p1.1" class="ltx_p"><span id="S3.I2.i3.p1.1.1" class="ltx_text" style="--ltx-fg-color:#000000;">Clear Transition: A new chunk must begin when the problem-solving process enters a new phase. This includes transitioning from ”solving for a variable” to ”verifying the answer,” or inserting an ”explanatory side-note” into the main workflow.</span></span>
</span></span>
</span>
<span id="S3.T1.pic1.2.2" class="ltx_p"><span id="S3.T1.pic1.2.2.1" class="ltx_text ltx_font_bold" style="--ltx-fg-color:#000000;">Format rules.<span id="S3.T1.pic1.2.2.1.1" class="ltx_text"></span></span></span>
<span id="S3.I3" class="ltx_enumerate ltx_leftmargin_flush">
<span id="S3.I3.i1" class="ltx_item" style="list-style-type:none;"><span class="ltx_tag ltx_tag_item">1.</span> 
<span id="S3.I3.i1.p1" class="ltx_para ltx_noindent">
<span id="S3.I3.i1.p1.1" class="ltx_p"><span id="S3.I3.i1.p1.1.1" class="ltx_text" style="--ltx-fg-color:#000000;">Use </span><span id="S3.I3.i1.p1.1.2" class="ltx_text ltx_font_typewriter" style="--ltx-fg-color:#000000;">&lt;chunk&gt;… &lt;/chunk&gt;</span><span id="S3.I3.i1.p1.1.3" class="ltx_text" style="--ltx-fg-color:#000000;"> to mark the beginning and end of each segment. The text and newlines inside the tags must not be altered.</span></span>
</span></span>
<span id="S3.I3.i2" class="ltx_item" style="list-style-type:none;"><span class="ltx_tag ltx_tag_item">2.</span> 
<span id="S3.I3.i2.p1" class="ltx_para ltx_noindent">
<span id="S3.I3.i2.p1.1" class="ltx_p"><span id="S3.I3.i2.p1.1.1" class="ltx_text" style="--ltx-fg-color:#000000;">The final output should only contain the tagged content, without any additional text, titles, or blank lines.</span></span>
</span></span>
<span id="S3.I3.i3" class="ltx_item" style="list-style-type:none;"><span class="ltx_tag ltx_tag_item">3.</span> 
<span id="S3.I3.i3.p1" class="ltx_para">
<span id="S3.I3.i3.p1.1" class="ltx_p"><span id="S3.I3.i3.p1.1.1" class="ltx_text" style="--ltx-fg-color:#000000;">You </span><span id="S3.I3.i3.p1.1.2" class="ltx_text ltx_font_bold" style="--ltx-fg-color:#000000;">must</span><span id="S3.I3.i3.p1.1.3" class="ltx_text" style="--ltx-fg-color:#000000;"> preserve all original text and newlines exactly as they appear within the tags.</span></span>
</span></span>
</span>
</span></span></span></foreignobject></g></g></svg>