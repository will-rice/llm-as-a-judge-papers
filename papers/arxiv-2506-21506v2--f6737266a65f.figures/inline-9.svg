<svg id="A8.SS1.p3.pic1" class="ltx_picture" height="959.21" overflow="visible" version="1.1" viewbox="0 0 477.38 959.21" width="477.38"><g style="--ltx-stroke-color:#000000;--ltx-fill-color:#000000;" fill="#000000" stroke="#000000" stroke-width="0.4pt" transform="translate(0,959.21) matrix(1 0 0 -1 0 0)"><g style="--ltx-fill-color:#404040;" fill="#404040" fill-opacity="1.0"><path style="stroke:none" d="M 0 5.91 L 0 953.31 C 0 956.57 2.64 959.21 5.91 959.21 L 471.47 959.21 C 474.73 959.21 477.38 956.57 477.38 953.31 L 477.38 5.91 C 477.38 2.64 474.73 0 471.47 0 L 5.91 0 C 2.64 0 0 2.64 0 5.91 Z" /></g><g style="--ltx-fill-color:#F2F2F2;" fill="#F2F2F2" fill-opacity="1.0"><path style="stroke:none" d="M 1.97 5.91 L 1.97 937.79 L 475.41 937.79 L 475.41 5.91 C 475.41 3.73 473.65 1.97 471.47 1.97 L 5.91 1.97 C 3.73 1.97 1.97 3.73 1.97 5.91 Z" /></g><g fill-opacity="1.0" transform="matrix(1.0 0.0 0.0 1.0 21.65 943.7)"><foreignobject style="--ltx-fo-width:31.37em;--ltx-fo-height:0.69em;--ltx-fo-depth:0em;font-size:10pt;" height="9.61" overflow="visible" transform="matrix(1 0 0 -1 0 9.61)" width="434.07"><span class="ltx_foreignobject_container"><span class="ltx_foreignobject_content">
<span id="A8.SS1.p3.pic1.1" class="ltx_inline-block ltx_minipage ltx_align_bottom" style="width:31.37em;">
<span id="A8.SS1.p3.pic1.1.1" class="ltx_p"><span id="A8.SS1.p3.pic1.1.1.1" class="ltx_text" style="--ltx-fg-color:#FFFFFF;">Task Validation Instruction</span></span>
</span></span></span></foreignobject></g><g fill-opacity="1.0" transform="matrix(1.0 0.0 0.0 1.0 21.65 16.2)"><foreignobject style="--ltx-fo-width:33.91em;--ltx-fo-height:65.75em;--ltx-fo-depth:0.18em;font-size:10pt;" height="912.22" overflow="visible" transform="matrix(1 0 0 -1 0 909.79)" width="469.22"><span class="ltx_foreignobject_container"><span class="ltx_foreignobject_content">
<span id="A8.SS1.p3.pic1.2" class="ltx_inline-block ltx_minipage ltx_align_bottom" style="width:33.91em;">
<span id="A8.SS1.p3.pic1.2.1" class="ltx_p"><span id="A8.SS1.p3.pic1.2.1.1" class="ltx_text" style="font-size:90%;--ltx-fg-color:#000000;">We are conducting task validation to rigorously ensure that all proposed tasks consistently meet our quality standards and are practically evaluable within our evaluation framework. During validation, please <span id="A8.SS1.p3.pic1.2.1.1.1" class="ltx_text ltx_font_bold">FULLY complete each task end-to-end</span> by yourself, paying particular attention to potential ambiguities, overlooked edge cases, and the verifiability of all required information.</span></span>
<span id="A8.SS1.p3.pic1.2.2" class="ltx_p"><span id="A8.SS1.p3.pic1.2.2.1" class="ltx_text" style="font-size:90%;--ltx-fg-color:#000000;">You should closely follow the structured checklist provided in the Task Refinement Instruction to evaluate realism, clarity, tediousness, and overall feasibility. Additionally, please specifically pay attention to the following validation aspects:</span></span>
<span id="A8.SS1.p3.pic1.2.3" class="ltx_p"><span id="A8.SS1.p3.pic1.2.3.1" class="ltx_text ltx_font_bold" style="font-size:90%;--ltx-fg-color:#000000;">Checklist Addendum for Validation<span id="A8.SS1.p3.pic1.2.3.1.1" class="ltx_text"></span></span></span>
<span id="A8.I3" class="ltx_enumerate" style="--ltx-enum-leftmargin:1.5em;">
<span id="A8.I3.i1" class="ltx_item" style="list-style-type:none;"><span class="ltx_tag ltx_tag_item">1.</span> 
<span id="A8.I3.i1.p1" class="ltx_para">
<span id="A8.I3.i1.p1.1" class="ltx_p"><span id="A8.I3.i1.p1.1.1" class="ltx_text ltx_font_bold" style="font-size:90%;--ltx-fg-color:#000000;">Full Completion and End-to-End Testing</span></span>
<span id="A8.I3.i1.I1" class="ltx_itemize" style="--ltx-enum-leftmargin:1.5em;">
<span id="A8.I3.i1.I0.i1" class="ltx_item" style="list-style-type:none;"><span class="ltx_tag ltx_tag_item">•</span> 
<span id="A8.I3.i1.I0.i1.p1" class="ltx_para">
<span id="A8.I3.i1.I0.i1.p1.1" class="ltx_p"><span id="A8.I3.i1.I0.i1.p1.1.1" class="ltx_text" style="font-size:90%;--ltx-fg-color:#000000;">Fully perform the task yourself from start to finish. Ensure all or most critical information can be practically located and verified from the URL sources.</span></span>
</span></span>
</span>
</span></span>
<span id="A8.I3.i2" class="ltx_item" style="list-style-type:none;"><span class="ltx_tag ltx_tag_item">2.</span> 
<span id="A8.I3.i2.p1" class="ltx_para">
<span id="A8.I3.i2.p1.1" class="ltx_p"><span id="A8.I3.i2.p1.1.1" class="ltx_text ltx_font_bold" style="font-size:90%;--ltx-fg-color:#000000;">Feasibility of URL-based Verification</span></span>
<span id="A8.I3.i2.I1" class="ltx_itemize" style="--ltx-enum-leftmargin:1.5em;">
<span id="A8.I3.i2.I0.i1" class="ltx_item" style="list-style-type:none;"><span class="ltx_tag ltx_tag_item">•</span> 
<span id="A8.I3.i2.I0.i1.p1" class="ltx_para">
<span id="A8.I3.i2.I0.i1.p1.1" class="ltx_p"><span id="A8.I3.i2.I0.i1.p1.1.1" class="ltx_text" style="font-size:90%;--ltx-fg-color:#000000;">Verify that each URL provided as an information source uniquely and directly supports the expected statement.</span></span>
</span></span>
<span id="A8.I3.i2.I0.i2" class="ltx_item" style="list-style-type:none;"><span class="ltx_tag ltx_tag_item">•</span> 
<span id="A8.I3.i2.I0.i2.p1" class="ltx_para">
<span id="A8.I3.i2.I0.i2.p1.1" class="ltx_p"><span id="A8.I3.i2.I0.i2.p1.1.1" class="ltx_text" style="font-size:90%;--ltx-fg-color:#000000;">Avoid scenarios that are beyond our evaluation framework capabilities, such as:</span></span>
<span id="A8.I3.i2.I0.i2.I1" class="ltx_itemize" style="--ltx-enum-leftmargin:1.5em;">
<span id="A8.I3.i2.I0.i2.I1.i1" class="ltx_item" style="list-style-type:none;"><span class="ltx_tag ltx_tag_item"><span id="A8.I3.i2.I0.i2.I1.i1.1" class="ltx_text ltx_font_bold">–</span></span> 
<span id="A8.I3.i2.I0.i2.I1.i1.p1" class="ltx_para">
<span id="A8.I3.i2.I0.i2.I1.i1.p1.1" class="ltx_p"><span id="A8.I3.i2.I0.i2.I1.i1.p1.1.1" class="ltx_text" style="font-size:90%;--ltx-fg-color:#000000;">Tasks requiring simultaneous verification from multiple distinct webpages, where the verification cannot be decomposed into independent single-page validations.</span></span>
</span></span>
<span id="A8.I3.i2.I0.i2.I1.i2" class="ltx_item" style="list-style-type:none;"><span class="ltx_tag ltx_tag_item"><span id="A8.I3.i2.I0.i2.I1.i2.1" class="ltx_text ltx_font_bold">–</span></span> 
<span id="A8.I3.i2.I0.i2.I1.i2.p1" class="ltx_para">
<span id="A8.I3.i2.I0.i2.I1.i2.p1.1" class="ltx_p"><span id="A8.I3.i2.I0.i2.I1.i2.p1.1.1" class="ltx_text" style="font-size:90%;--ltx-fg-color:#000000;">Tasks where the critical information is dynamically loaded, hidden, or collapsed on the webpage, making it inaccessible from the static HTML or initial page rendering. In other words, tasks that require additional webpage interactions beyond simple navigation (e.g., clicking one or multiple buttons, performing searches within the site, or scrolling to trigger dynamic loading).</span></span>
</span></span>
<span id="A8.I3.i2.I0.i2.I1.i3" class="ltx_item" style="list-style-type:none;"><span class="ltx_tag ltx_tag_item"><span id="A8.I3.i2.I0.i2.I1.i3.1" class="ltx_text ltx_font_bold">–</span></span> 
<span id="A8.I3.i2.I0.i2.I1.i3.p1" class="ltx_para">
<span id="A8.I3.i2.I0.i2.I1.i3.p1.1" class="ltx_p"><span id="A8.I3.i2.I0.i2.I1.i3.p1.1.1" class="ltx_text" style="font-size:90%;--ltx-fg-color:#000000;">Tasks where URLs provided are not unique or stable (e.g., search result URLs that frequently change).</span></span>
</span></span>
<span id="A8.I3.i2.I0.i2.I1.i4" class="ltx_item" style="list-style-type:none;"><span class="ltx_tag ltx_tag_item"><span id="A8.I3.i2.I0.i2.I1.i4.1" class="ltx_text ltx_font_bold">–</span></span> 
<span id="A8.I3.i2.I0.i2.I1.i4.p1" class="ltx_para">
<span id="A8.I3.i2.I0.i2.I1.i4.p1.1" class="ltx_p"><span id="A8.I3.i2.I0.i2.I1.i4.p1.1.1" class="ltx_text" style="font-size:90%;--ltx-fg-color:#000000;">Tasks requiring login credentials (verify this using your browser’s incognito mode).</span></span>
</span></span>
</span>
</span></span>
</span>
</span></span>
<span id="A8.I3.i3" class="ltx_item" style="list-style-type:none;"><span class="ltx_tag ltx_tag_item">3.</span> 
<span id="A8.I3.i3.p1" class="ltx_para">
<span id="A8.I3.i3.p1.1" class="ltx_p"><span id="A8.I3.i3.p1.1.1" class="ltx_text ltx_font_bold" style="font-size:90%;--ltx-fg-color:#000000;">Explicit Ground Truth and Evaluation Notes</span></span>
<span id="A8.I3.i3.I1" class="ltx_itemize" style="--ltx-enum-leftmargin:1.5em;">
<span id="A8.I3.i3.I0.i1" class="ltx_item" style="list-style-type:none;"><span class="ltx_tag ltx_tag_item">•</span> 
<span id="A8.I3.i3.I0.i1.p1" class="ltx_para">
<span id="A8.I3.i3.I0.i1.p1.1" class="ltx_p"><span id="A8.I3.i3.I0.i1.p1.1.1" class="ltx_text" style="font-size:90%;--ltx-fg-color:#000000;">Clearly document the related sources and information that can be helpful for understanding the task.</span></span>
</span></span>
<span id="A8.I3.i3.I0.i2" class="ltx_item" style="list-style-type:none;"><span class="ltx_tag ltx_tag_item">•</span> 
<span id="A8.I3.i3.I0.i2.p1" class="ltx_para">
<span id="A8.I3.i3.I0.i2.p1.1" class="ltx_p"><span id="A8.I3.i3.I0.i2.p1.1.1" class="ltx_text" style="font-size:90%;--ltx-fg-color:#000000;">If ground-truth information is necessary for certain criteria, note it down and carefully validate its correctness.</span></span>
</span></span>
<span id="A8.I3.i3.I0.i3" class="ltx_item" style="list-style-type:none;"><span class="ltx_tag ltx_tag_item">•</span> 
<span id="A8.I3.i3.I0.i3.p1" class="ltx_para">
<span id="A8.I3.i3.I0.i3.p1.1" class="ltx_p"><span id="A8.I3.i3.I0.i3.p1.1.1" class="ltx_text" style="font-size:90%;--ltx-fg-color:#000000;">Provide explicit notes for potentially tricky evaluation scenarios or subtleties that might be easily overlooked or incorrectly handled during judge agent development.</span></span>
</span></span>
</span>
</span></span>
</span>
<span id="A8.SS1.p3.pic1.2.4" class="ltx_p"><span id="A8.SS1.p3.pic1.2.4.1" class="ltx_text" style="font-size:90%;--ltx-fg-color:#000000;">If during validation you identify tasks that seem borderline or ambiguous with respect to our framework capabilities, promptly discuss these tasks within the team to determine their suitability or necessary adjustments.</span></span>
</span></span></span></foreignobject></g></g></svg>