<span id="A6.p1.pic1.p4" class="ltx_para">
<span id="A6.p1.pic1.p4.1" class="ltx_p"><span id="A6.p1.pic1.p4.1.1" class="ltx_text ltx_font_bold" style="--ltx-fg-color:#000000;">Document<span id="A6.p1.pic1.p4.1.1.1" class="ltx_text ltx_font_medium"> 
<br class="ltx_break">Long story short – We dated for about a year and 1/2 I moved for my job we couldn’t handle the distance and we end our relationship. Months go by, I see him Friday night and he is very polite and nice and after we started drinking he started pouring his heart out to me. The next day he calls me twice in the morning and I missed the calls, try to call him back. Doesnt answer, wait a few days, send him a long message, and it said he read it, and has still said nothing. Should I pretend like it never happen?</span></span></span>
</span>
