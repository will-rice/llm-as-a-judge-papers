<section id="A5.SS6.SSS0.Px1" class="ltx_paragraph">
<h5 class="ltx_title ltx_title_paragraph" style="--ltx-fg-color:#000000;">Task:</h5>

<span id="A5.SS6.SSS0.Px1.p1" class="ltx_para">
<span id="A5.SS6.SSS0.Px1.p1.1" class="ltx_p"><span id="A5.SS6.SSS0.Px1.p1.1.1" class="ltx_text" style="--ltx-fg-color:#000000;">Create a Python function that serves as a judge to evaluate LLM-generated responses.</span></span>
</span>
</section>
                    
<section id="A5.SS6.SSS0.Px2" class="ltx_paragraph">
<h5 class="ltx_title ltx_title_paragraph" style="--ltx-fg-color:#000000;">Requirements:</h5>

<span id="A5.SS6.SSS0.Px2.p1" class="ltx_para">
<span id="A5.I13" class="ltx_enumerate">
<span id="A5.I13.i1" class="ltx_item" style="list-style-type:none;"><span class="ltx_tag ltx_tag_item">1.</span> 
<span id="A5.I13.i1.p1" class="ltx_para">
<span id="A5.I13.i1.p1.1" class="ltx_p"><span id="A5.I13.i1.p1.1.1" class="ltx_text" style="--ltx-fg-color:#000000;">Function name: </span><span id="A5.I13.i1.p1.1.2" class="ltx_text ltx_font_typewriter" style="--ltx-fg-color:#000000;">program_judge</span></span>
</span></span>
<span id="A5.I13.i2" class="ltx_item" style="list-style-type:none;"><span class="ltx_tag ltx_tag_item">2.</span> 
<span id="A5.I13.i2.p1" class="ltx_para">
<span id="A5.I13.i2.p1.1" class="ltx_p"><span id="A5.I13.i2.p1.1.1" class="ltx_text" style="--ltx-fg-color:#000000;">Function signature: </span><span id="A5.I13.i2.p1.1.2" class="ltx_text ltx_font_typewriter" style="--ltx-fg-color:#000000;">program_judge(query: str, response: str) -&gt; dict</span></span>
</span></span>
<span id="A5.I13.i3" class="ltx_item" style="list-style-type:none;"><span class="ltx_tag ltx_tag_item">3.</span> 
<span id="A5.I13.i3.p1" class="ltx_para">
<span id="A5.I13.i3.p1.1" class="ltx_p"><span id="A5.I13.i3.p1.1.1" class="ltx_text" style="--ltx-fg-color:#000000;">Return a dictionary with the following keys:</span></span>
<span id="A5.I13.i3.I1" class="ltx_itemize">
<span id="A5.I13.i3.I1.i1" class="ltx_item" style="list-style-type:none;"><span class="ltx_tag ltx_tag_item">•</span> 
<span id="A5.I13.i3.I1.i1.p1" class="ltx_para">
<span id="A5.I13.i3.I1.i1.p1.1" class="ltx_p"><span id="A5.I13.i3.I1.i1.p1.1.1" class="ltx_text ltx_font_typewriter" style="--ltx-fg-color:#000000;">’score’</span><span id="A5.I13.i3.I1.i1.p1.1.2" class="ltx_text" style="--ltx-fg-color:#000000;"> (float, 0–10)</span></span>
</span></span>
<span id="A5.I13.i3.I1.i2" class="ltx_item" style="list-style-type:none;"><span class="ltx_tag ltx_tag_item">•</span> 
<span id="A5.I13.i3.I1.i2.p1" class="ltx_para">
<span id="A5.I13.i3.I1.i2.p1.1" class="ltx_p"><span id="A5.I13.i3.I1.i2.p1.1.1" class="ltx_text ltx_font_typewriter" style="--ltx-fg-color:#000000;">’reasoning’</span><span id="A5.I13.i3.I1.i2.p1.1.2" class="ltx_text" style="--ltx-fg-color:#000000;"> (string)</span></span>
</span></span>
<span id="A5.I13.i3.I1.i3" class="ltx_item" style="list-style-type:none;"><span class="ltx_tag ltx_tag_item">•</span> 
<span id="A5.I13.i3.I1.i3.p1" class="ltx_para">
<span id="A5.I13.i3.I1.i3.p1.1" class="ltx_p"><span id="A5.I13.i3.I1.i3.p1.1.1" class="ltx_text ltx_font_typewriter" style="--ltx-fg-color:#000000;">’criteria’</span><span id="A5.I13.i3.I1.i3.p1.1.2" class="ltx_text" style="--ltx-fg-color:#000000;"> (string)</span></span>
</span></span>
</span>
</span></span>
<span id="A5.I13.i4" class="ltx_item" style="list-style-type:none;"><span class="ltx_tag ltx_tag_item">4.</span> 
<span id="A5.I13.i4.p1" class="ltx_para">
<span id="A5.I13.i4.p1.1" class="ltx_p"><span id="A5.I13.i4.p1.1.1" class="ltx_text" style="--ltx-fg-color:#000000;">The score ranges from 0 (lowest quality) to 10 (highest quality)</span></span>
</span></span>
<span id="A5.I13.i5" class="ltx_item" style="list-style-type:none;"><span class="ltx_tag ltx_tag_item">5.</span> 
<span id="A5.I13.i5.p1" class="ltx_para">
<span id="A5.I13.i5.p1.1" class="ltx_p"><span id="A5.I13.i5.p1.1.1" class="ltx_text" style="--ltx-fg-color:#000000;">Higher scores indicate higher-quality responses</span></span>
</span></span>
<span id="A5.I13.i6" class="ltx_item" style="list-style-type:none;"><span class="ltx_tag ltx_tag_item">6.</span> 
<span id="A5.I13.i6.p1" class="ltx_para">
<span id="A5.I13.i6.p1.1" class="ltx_p"><span id="A5.I13.i6.p1.1.1" class="ltx_text" style="--ltx-fg-color:#000000;">Implement a unique judging strategy</span></span>
</span></span>
<span id="A5.I13.i7" class="ltx_item" style="list-style-type:none;"><span class="ltx_tag ltx_tag_item">7.</span> 
<span id="A5.I13.i7.p1" class="ltx_para">
<span id="A5.I13.i7.p1.1" class="ltx_p"><span id="A5.I13.i7.p1.1.1" class="ltx_text" style="--ltx-fg-color:#000000;">Include comprehensive error handling</span></span>
</span></span>
<span id="A5.I13.i8" class="ltx_item" style="list-style-type:none;"><span class="ltx_tag ltx_tag_item">8.</span> 
<span id="A5.I13.i8.p1" class="ltx_para">
<span id="A5.I13.i8.p1.1" class="ltx_p"><span id="A5.I13.i8.p1.1.1" class="ltx_text" style="--ltx-fg-color:#000000;">Add a concise docstring describing the judging logic</span></span>
</span></span>
</span>
</span>
</section>
                    
<section id="A5.SS6.SSS0.Px3" class="ltx_paragraph">
<h5 class="ltx_title ltx_title_paragraph" style="--ltx-fg-color:#000000;">Instruction:</h5>

<span id="A5.SS6.SSS0.Px3.p1" class="ltx_para">
<span id="A5.SS6.SSS0.Px3.p1.1" class="ltx_p"><span id="A5.SS6.SSS0.Px3.p1.1.1" class="ltx_text" style="--ltx-fg-color:#000000;">The judge may rely on third-party specialized models or Python libraries. Do not use Google search or web crawling. Generate a complete, unique judge function that assigns higher scores to higher-quality responses.</span></span>
</span>
</section>
