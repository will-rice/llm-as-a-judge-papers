<span id="Pt0.A1.F8.p1.pic1.1.1" class="ltx_p"><span id="Pt0.A1.F8.p1.pic1.1.1.1" class="ltx_text" style="font-size:70%;--ltx-fg-color:#000000;">Evaluation Task: Assess Helpfulness 
<br class="ltx_break"></span></span>
<span id="Pt0.A1.F8.p1.pic1.1.2" class="ltx_p"><span id="Pt0.A1.F8.p1.pic1.1.2.1" class="ltx_text" style="font-size:70%;--ltx-fg-color:#000000;">Definition: 
<br class="ltx_break">&quot;Overall helpfulness of the response to the prompt.&quot; 
<br class="ltx_break"></span></span>
<span id="Pt0.A1.F8.p1.pic1.1.3" class="ltx_p"><span id="Pt0.A1.F8.p1.pic1.1.3.1" class="ltx_text" style="font-size:70%;--ltx-fg-color:#000000;">Please evaluate the response below based on this definition. 
<br class="ltx_break"></span></span>
<span id="Pt0.A1.F8.p1.pic1.1.4" class="ltx_p"><span id="Pt0.A1.F8.p1.pic1.1.4.1" class="ltx_text" style="font-size:70%;--ltx-fg-color:#000000;">Scoring Guide: 
<br class="ltx_break">- 4 (Extremely helpful): The response perfectly and comprehensively addresses the user’s prompt. 
<br class="ltx_break">- 3 (Helpful): The response successfully addresses the prompt but could be slightly more comprehensive. 
<br class="ltx_break">- 2 (Moderately helpful): The response partially answers the prompt but has significant room for improvement. 
<br class="ltx_break">- 1 (Slightly helpful): The response makes an attempt but is largely unhelpful or misses the main point. 
<br class="ltx_break">- 0 (Not helpful): The response is completely irrelevant or fails to address the prompt. 
<br class="ltx_break"></span></span>
<span id="Pt0.A1.F8.p1.pic1.1.5" class="ltx_p"><span id="Pt0.A1.F8.p1.pic1.1.5.1" class="ltx_text" style="font-size:70%;--ltx-fg-color:#000000;">Prompt: 
