<span id="S5.SS3.p3.pic1.1" class="ltx_inline-block ltx_minipage ltx_align_bottom" style="width:33.5em;">
<span id="S5.SS3.p3.pic1.1.1" class="ltx_p"><span id="S5.SS3.p3.pic1.1.1.1" class="ltx_text ltx_font_bold" style="--ltx-fg-color:#000000;">Finding 5:<span id="S5.SS3.p3.pic1.1.1.1.1" class="ltx_text ltx_font_medium"> Procedural complexity mainly affects sample-level scoring consistency. Simpler LLM-as-a-judge metrics with few LLM invocations assign highly consistent scores to the same program across runs. In contrast, complex agentic workflows accumulate stochasticity across intermediate states, leading to larger variance in sample-level scores. However, when aggregated over the benchmark, each run achieves similar overall performance, suggesting that such instability has limited impact on dataset-level conclusions.</span></span></span>
</span></span></span></foreignobject></g></g></svg>