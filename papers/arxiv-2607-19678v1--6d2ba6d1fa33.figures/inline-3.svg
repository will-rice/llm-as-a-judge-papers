<svg id="A2.SS1.p3.pic1" class="ltx_picture" height="610.59" overflow="visible" version="1.1" viewbox="0 0 653.15 610.59" width="653.15"><g style="--ltx-stroke-color:#000000;--ltx-fill-color:#000000;" fill="#000000" stroke="#000000" stroke-width="0.4pt" transform="translate(0,610.59) matrix(1 0 0 -1 0 0)"><g style="--ltx-fill-color:#666666;" fill="#666666" fill-opacity="1.0"><path style="stroke:none" d="M 0 4.63 L 0 605.96 C 0 608.51 2.07 610.59 4.63 610.59 L 648.52 610.59 C 651.08 610.59 653.15 608.51 653.15 605.96 L 653.15 4.63 C 653.15 2.07 651.08 0 648.52 0 L 4.63 0 C 2.07 0 0 2.07 0 4.63 Z" /></g><g style="--ltx-fill-color:#F5F5F5;" fill="#F5F5F5" fill-opacity="1.0"><path style="stroke:none" d="M 0.69 4.63 L 0.69 589.03 L 652.46 589.03 L 652.46 4.63 C 652.46 2.45 650.7 0.69 648.52 0.69 L 4.63 0.69 C 2.45 0.69 0.69 2.45 0.69 4.63 Z" /></g><g fill-opacity="1.0" transform="matrix(1.0 0.0 0.0 1.0 15.7 596.35)"><foreignobject style="--ltx-fo-width:40.85em;--ltx-fo-height:0.69em;--ltx-fo-depth:0.19em;font-size:10pt;" height="12.3" overflow="visible" transform="matrix(1 0 0 -1 0 9.61)" width="565.25"><span class="ltx_foreignobject_container"><span class="ltx_foreignobject_content">
<span id="A2.SS1.p3.pic1.1" class="ltx_inline-block ltx_minipage ltx_align_bottom" style="width:40.85em;">
<span id="A2.SS1.p3.pic1.1.1" class="ltx_p"><span id="A2.SS1.p3.pic1.1.1.1" class="ltx_text ltx_font_sansserif ltx_font_bold" style="--ltx-fg-color:#FFFFFF;">Baseline Evaluator Prompt: Medical Domain</span></span>
</span></span></span></foreignobject></g><g fill-opacity="1.0" transform="matrix(1.0 0.0 0.0 1.0 15.7 15.7)"><foreignobject style="--ltx-fo-width:44.93em;--ltx-fo-height:40.35em;--ltx-fo-depth:0em;font-size:10pt;" height="558.33" overflow="visible" transform="matrix(1 0 0 -1 0 558.33)" width="621.7"><span class="ltx_foreignobject_container"><span class="ltx_foreignobject_content">
<span id="A2.SS1.p3.pic1.2" class="ltx_inline-block ltx_minipage ltx_align_bottom" style="width:44.93em;">
<span id="A2.SS1.p3.pic1.2.1" class="ltx_p"><span id="A2.SS1.p3.pic1.2.1.1" class="ltx_text" style="--ltx-fg-color:#000000;">The following is a clinical case and a diagnostic / management reasoning trace split into steps, enclosed with tags and indexed from 0:</span></span>
<span id="A2.SS1.p3.pic1.2.2" class="ltx_p"><span id="A2.SS1.p3.pic1.2.2.1" class="ltx_text ltx_font_bold" style="--ltx-fg-color:#000000;">[Clinical Case]<span id="A2.SS1.p3.pic1.2.2.1.1" class="ltx_text ltx_font_medium">
<span id="A2.SS1.p3.pic1.2.2.1.1.1" class="ltx_text ltx_font_typewriter">{problem}</span></span></span></span>
<span id="A2.SS1.p3.pic1.2.3" class="ltx_p"><span id="A2.SS1.p3.pic1.2.3.1" class="ltx_text ltx_font_bold" style="--ltx-fg-color:#000000;">[Reasoning Trace]<span id="A2.SS1.p3.pic1.2.3.1.1" class="ltx_text ltx_font_medium">
<span id="A2.SS1.p3.pic1.2.3.1.1.1" class="ltx_text ltx_font_typewriter">{steps}</span></span></span></span>
<span id="A2.SS1.p3.pic1.2.4" class="ltx_p"><span id="A2.SS1.p3.pic1.2.4.1" class="ltx_text" style="--ltx-fg-color:#000000;">Your task is to evaluate each reasoning step.</span></span>
<span id="A2.SS1.p3.pic1.2.5" class="ltx_p"><span id="A2.SS1.p3.pic1.2.5.1" class="ltx_text" style="--ltx-fg-color:#000000;">There are exactly <span id="A2.SS1.p3.pic1.2.5.1.1" class="ltx_text ltx_font_typewriter">{n_steps}</span> reasoning steps.</span></span>
<span id="A2.SS1.p3.pic1.2.6" class="ltx_p"><span id="A2.SS1.p3.pic1.2.6.1" class="ltx_text" style="--ltx-fg-color:#000000;">For each step, label it as CORRECT or INCORRECT.</span></span>
<span id="A2.SS1.p3.pic1.2.7" class="ltx_p"><span id="A2.SS1.p3.pic1.2.7.1" class="ltx_text" style="--ltx-fg-color:#000000;">A step should be labeled <span id="A2.SS1.p3.pic1.2.7.1.1" class="ltx_text ltx_font_typewriter">CORRECT</span> if it is clinically appropriate, supported by the case, and logically consistent.
<br class="ltx_break">A step should be labeled <span id="A2.SS1.p3.pic1.2.7.1.2" class="ltx_text ltx_font_typewriter">INCORRECT</span> if it is clinically inappropriate, unsupported, contradicted by the case, or logically inconsistent.</span></span>
<span id="A2.SS1.p3.pic1.2.8" class="ltx_p"><span id="A2.SS1.p3.pic1.2.8.1" class="ltx_text" style="--ltx-fg-color:#000000;">Provide brief reasoning for your labels.</span></span>
<span id="A2.SS1.p3.pic1.2.9" class="ltx_p"><span id="A2.SS1.p3.pic1.2.9.1" class="ltx_text" style="--ltx-fg-color:#000000;">Your final verdict must be a comma-separated list of exactly <span id="A2.SS1.p3.pic1.2.9.1.1" class="ltx_text ltx_font_typewriter">{n_steps}</span> labels. Each label must be either <span id="A2.SS1.p3.pic1.2.9.1.2" class="ltx_text ltx_font_typewriter">CORRECT</span> or <span id="A2.SS1.p3.pic1.2.9.1.3" class="ltx_text ltx_font_typewriter">INCORRECT</span>. The labels must correspond to the reasoning steps in order from step 0 to step <span id="A2.SS1.p3.pic1.2.9.1.4" class="ltx_text ltx_font_typewriter">{last_step_idx}</span>.</span></span>
<span id="A2.SS1.p3.pic1.2.10" class="ltx_p"><span id="A2.SS1.p3.pic1.2.10.1" class="ltx_text" style="--ltx-fg-color:#000000;">Use exactly this format:</span></span>
<span id="A2.SS1.p3.pic1.2.11" class="ltx_p"><span id="A2.SS1.p3.pic1.2.11.1" class="ltx_text ltx_font_bold" style="--ltx-fg-color:#000000;">Reasoning:<span id="A2.SS1.p3.pic1.2.11.1.1" class="ltx_text ltx_font_medium"> &lt;brief explanation&gt;
<br class="ltx_break"></span>Verdict:<span id="A2.SS1.p3.pic1.2.11.1.2" class="ltx_text ltx_font_medium"> &lt;comma-separated list of CORRECT or INCORRECT labels&gt;</span></span></span>
<span id="A2.SS1.p3.pic1.2.12" class="ltx_p"><span id="A2.SS1.p3.pic1.2.12.1" class="ltx_text" style="--ltx-fg-color:#000000;">Do not include more or fewer than <span id="A2.SS1.p3.pic1.2.12.1.1" class="ltx_text ltx_font_typewriter">{n_steps}</span> labels.</span></span>
</span></span></span></foreignobject></g></g></svg>