</span></span></span></foreignobject></g><g fill-opacity="1.0" transform="matrix(1.0 0.0 0.0 1.0 10.03 13.48)"><foreignobject style="--ltx-fo-width:38.3em;--ltx-fo-height:9.09em;--ltx-fo-depth:0.25em;font-size:10pt;" height="129.3" overflow="visible" transform="matrix(1 0 0 -1 0 125.84)" width="529.96"><span class="ltx_foreignobject_container"><span class="ltx_foreignobject_content">
<span id="S4.SS3.SSS0.Px3.p2.pic1.2" class="ltx_inline-block ltx_minipage ltx_align_bottom" style="width:38.3em;">
<span id="S4.SS3.SSS0.Px3.p2.pic1.2.1" class="ltx_p"><span id="S4.SS3.SSS0.Px3.p2.pic1.2.1.1" class="ltx_text" style="--ltx-fg-color:#000000;">The three scaffold metrics are not interchangeable; each metric supports a different summary goal. <em id="S4.SS3.SSS0.Px3.p2.pic1.2.1.1.1" class="ltx_emph ltx_font_italic">EPS leads when entity context must be preserved</em> (e.g. contracts, financial/medical text, identifier-dense screenshots). <em id="S4.SS3.SSS0.Px3.p2.pic1.2.1.1.2" class="ltx_emph ltx_font_italic">QPS leads when the summary must answer main questions</em> (e.g. triage notes, executive digests). <em id="S4.SS3.SSS0.Px3.p2.pic1.2.1.1.3" class="ltx_emph ltx_font_italic">FPS leads when a compressed abstract summary is required</em> (e.g. briefings, news-style digests).</span></span>
</span></span></span></foreignobject></g></g></svg>