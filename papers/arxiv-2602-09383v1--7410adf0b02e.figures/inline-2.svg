<span id="A7.p4.pic1.1" class="ltx_inline-block ltx_minipage ltx_align_bottom" style="width:33.83em;">
<span id="A7.p4.pic1.1.1" class="ltx_p"><span id="A7.p4.pic1.1.1.1" class="ltx_text ltx_font_bold" style="--ltx-fg-color:#FFFFFF;">The Initial Basic Bias Library of Social Biases</span></span>
</span></span></span></foreignobject></g><g fill-opacity="1.0" transform="matrix(1.0 0.0 0.0 1.0 5.91 396.99)"><foreignobject style="--ltx-fo-width:38.9em;--ltx-fo-height:1.79em;--ltx-fo-depth:27.69em;font-size:10pt;" height="408.04" overflow="visible" transform="matrix(1 0 0 -1 0 24.83)" width="538.27"><span class="ltx_foreignobject_container"><span class="ltx_foreignobject_content">
<span id="A7.p4.pic1.2" class="ltx_inline-block ltx_minipage ltx_align_bottom" style="width:38.9em;">
<span id="A7.I1" class="ltx_itemize" style="--ltx-enum-leftmargin:5mm;">
<span id="A7.I1.i1" class="ltx_item" style="list-style-type:none;"><span class="ltx_tag ltx_tag_item"><math id="A7.I1.i1.m1" class="ltx_Math" alttext="\triangleright" display="inline" intent=":literal"><semantics><mo>⊳</mo><annotation encoding="application/x-tex">\triangleright</annotation></semantics></math></span> 
<span id="A7.I1.i1.p1" class="ltx_para ltx_noindent">
<span id="A7.I1.i1.p1.1" class="ltx_p"><span id="A7.I1.i1.p1.1.1" class="ltx_text ltx_font_bold" style="--ltx-fg-color:#000000;">Gender Stereotype Bias</span><span id="A7.I1.i1.p1.1.2" class="ltx_text" style="--ltx-fg-color:#000000;">: LLM judges tend to give higher scores to responses that conform to traditional gender stereotypes, such as assuming nursing or clerical work is more suitable for women, and engineering or managerial roles are more suitable for men, even when the response quality is comparable.</span></span>
</span></span>
<span id="A7.I1.i2" class="ltx_item" style="list-style-type:none;"><span class="ltx_tag ltx_tag_item"><math id="A7.I1.i2.m1" class="ltx_Math" alttext="\triangleright" display="inline" intent=":literal"><semantics><mo>⊳</mo><annotation encoding="application/x-tex">\triangleright</annotation></semantics></math></span> 
<span id="A7.I1.i2.p1" class="ltx_para ltx_noindent">
<span id="A7.I1.i2.p1.1" class="ltx_p"><span id="A7.I1.i2.p1.1.1" class="ltx_text ltx_font_bold" style="--ltx-fg-color:#000000;">Racial Stereotype Bias</span><span id="A7.I1.i2.p1.1.2" class="ltx_text" style="--ltx-fg-color:#000000;">: LLM judges tend to give higher scores to responses that align with racial stereotypes, for example, making stereotypical assumptions about the abilities or behaviors of certain racial groups, which can affect the fairness of the evaluation.</span></span>
</span></span>
<span id="A7.I1.i3" class="ltx_item" style="list-style-type:none;"><span class="ltx_tag ltx_tag_item"><math id="A7.I1.i3.m1" class="ltx_Math" alttext="\triangleright" display="inline" intent=":literal"><semantics><mo>⊳</mo><annotation encoding="application/x-tex">\triangleright</annotation></semantics></math></span> 
<span id="A7.I1.i3.p1" class="ltx_para ltx_noindent">
<span id="A7.I1.i3.p1.1" class="ltx_p"><span id="A7.I1.i3.p1.1.1" class="ltx_text ltx_font_bold" style="--ltx-fg-color:#000000;">Pronoun Bias</span><span id="A7.I1.i3.p1.1.2" class="ltx_text" style="--ltx-fg-color:#000000;">: LLM judges tend to favor responses using specific gendered pronouns (e.g., he/she) and may give lower scores to expressions that do not conform to gender norms, thereby reinforcing societal gender biases.</span></span>
</span></span>
<span id="A7.I1.i4" class="ltx_item" style="list-style-type:none;"><span class="ltx_tag ltx_tag_item"><math id="A7.I1.i4.m1" class="ltx_Math" alttext="\triangleright" display="inline" intent=":literal"><semantics><mo>⊳</mo><annotation encoding="application/x-tex">\triangleright</annotation></semantics></math></span> 
<span id="A7.I1.i4.p1" class="ltx_para ltx_noindent">
<span id="A7.I1.i4.p1.1" class="ltx_p"><span id="A7.I1.i4.p1.1.1" class="ltx_text ltx_font_bold" style="--ltx-fg-color:#000000;">Cultural Bias</span><span id="A7.I1.i4.p1.1.2" class="ltx_text" style="--ltx-fg-color:#000000;">: LLM judges tend to favor responses that align with dominant cultural or Western values, while potentially scoring lower for responses from minority cultures, non-Western perspectives, or different social backgrounds, even if the content is reasonable.</span></span>
</span></span>
<span id="A7.I1.i5" class="ltx_item" style="list-style-type:none;"><span class="ltx_tag ltx_tag_item"><math id="A7.I1.i5.m1" class="ltx_Math" alttext="\triangleright" display="inline" intent=":literal"><semantics><mo>⊳</mo><annotation encoding="application/x-tex">\triangleright</annotation></semantics></math></span> 
<span id="A7.I1.i5.p1" class="ltx_para">
<span id="A7.I1.i5.p1.1" class="ltx_p"><span id="A7.I1.i5.p1.1.1" class="ltx_text ltx_font_bold" style="--ltx-fg-color:#000000;">Name Bias</span><span id="A7.I1.i5.p1.1.2" class="ltx_text" style="--ltx-fg-color:#000000;">: LLM judges tend to rely on names mentioned in responses to infer gender or ethnicity, which can influence scoring—for instance, responses mentioning certain ethnic or gendered names may receive higher or lower scores.</span></span>
</span></span>
</span>
</span></span></span></foreignobject></g></g></svg>