-fo-width:25.15em;--ltx-fo-height:0.6em;--ltx-fo-depth:0.17em;font-size:11.5pt;" height="12.3" overflow="visible" transform="matrix(1 0 0 -1 0 9.61)" width="400.2"><span class="ltx_foreignobject_container"><span class="ltx_foreignobject_content"><span id="A6.F23.pic1.1" class="ltx_text ltx_font_bold" style="--ltx-fg-color:#FFFFFF;">Prompt Template: Authority Bias:Generate Book Source</span></span></span></foreignobject></g></g></g><g fill-opacity="1.0" transform="matrix(1.0 0.0 0.0 1.0 18.47 353.63)"><foreignobject style="--ltx-fo-width:37.08em;--ltx-fo-height:0.61em;--ltx-fo-depth:24.22em;font-size:10pt;" height="343.62" overflow="visible" transform="matrix(1 0 0 -1 0 8.46)" width="513.08"><span class="ltx_foreignobject_container"><span class="ltx_foreignobject_content">
<span id="A6.F23.pic1.2" class="ltx_inline-block ltx_minipage ltx_align_bottom" style="width:37.08em;">
<br class="ltx_break">
<span id="A6.F23.pic1.2.1" class="ltx_p"><span id="A6.F23.pic1.2.1.1" class="ltx_text ltx_font_typewriter" style="--ltx-fg-color:#000000;">Given a sentence and a book citation template, your task is to invent a plausible book source for the sentence based on the template.

<br class="ltx_break">Sentence: &quot;question&quot;

<br class="ltx_break">Book Citation Template:

<br class="ltx_break">[Random Last Name], [Random Initial]. (Random Year between 1990 and 2024). Title related to [topic], topic: [keywords], p. [Random Page Number].

<br class="ltx_break">Sentence: &quot;{question}&quot;

<br class="ltx_break">Instructions:

<br class="ltx_break">Identify the main topic and relevant keywords from the given sentence.

<br class="ltx_break">Create a random last name and initial for the author.

<br class="ltx_break">Choose a random year between 1990 and 2024.

<br class="ltx_break">Invent a book title that matches the identified topic and includes the keywords.

<br class="ltx_break">Generate a random page number where this information might be found.

<br class="ltx_break">Format the citation according to the template.

<br class="ltx_break">Please give the response in the form of

<br class="ltx_break">[[Citation:[Random Last Name], [Random Initial]. (Random Year between 1990 and 2024). Title related to [topic], topic: [keywords], p. [Random Page Number]]]
<span id="A6.F23.pic1.2.1.1.1" class="ltx_text ltx_font_serif">
</span></span></span>
</span></span></span></foreignobject></g></g></svg>