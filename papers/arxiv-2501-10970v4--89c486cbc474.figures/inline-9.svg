<span id="A8.p9.pic1.1.1" class="ltx_p"><span id="A8.p9.pic1.1.1.1" class="ltx_text ltx_font_bold" style="--ltx-fg-color:#FFFFFF;">Box H.9: SummEval - Prompt</span></span>
</span></span></span></foreignobject></g><g fill-opacity="1.0" transform="matrix(1.0 0.0 0.0 1.0 21.65 17.24)"><foreignobject style="--ltx-fo-width:44.07em;--ltx-fo-height:31.89em;--ltx-fo-depth:0.25em;font-size:10pt;" height="444.79" overflow="visible" transform="matrix(1 0 0 -1 0 441.33)" width="609.8"><span class="ltx_foreignobject_container"><span class="ltx_foreignobject_content">
<span id="A8.p9.pic1.2" class="ltx_inline-block ltx_minipage ltx_align_bottom" style="width:44.07em;">
<span id="A8.p9.pic1.2.1" class="ltx_p"><span id="A8.p9.pic1.2.1.1" class="ltx_text" style="--ltx-fg-color:#000000;">You will be provided with a document and a summary generated by a model.
<br class="ltx_break">Your task is to evaluate the summary and rate each of the following aspects on a scale of 1 to 5:
<br class="ltx_break">* Relevance: The rating measures how well the summary captures the key points of the article.
<br class="ltx_break">Consider whether all and only the important aspects are contained in the summary.
<br class="ltx_break">* Consistency: The rating measures whether the facts in the summary are consistent with the facts in the original article.
<br class="ltx_break">Consider whether the summary does reproduce all facts accurately and does not make up untrue information.
<br class="ltx_break">* Fluency: This rating measures the quality of individual sentences, are they well-written and grammatically correct.
<br class="ltx_break">Consider the quality of individual sentences.
<br class="ltx_break">* Coherence: The rating measures the quality of all sentences collectively, to the fit together and sound naturally.
<br class="ltx_break">Consider the quality of the summary as a whole.
<br class="ltx_break">
<br class="ltx_break">Please follow the JSON format below:
<br class="ltx_break">```json 
<br class="ltx_break">{
<br class="ltx_break"><span id="A8.p9.pic1.2.1.1.1" class="ltx_text"></span> &quot;coherence&quot;: int (1-5),
<br class="ltx_break"><span id="A8.p9.pic1.2.1.1.2" class="ltx_text"></span> &quot;consistency&quot;: int (1-5),
<br class="ltx_break"><span id="A8.p9.pic1.2.1.1.3" class="ltx_text"></span> &quot;fluency&quot;: int (1-5),
<br class="ltx_break"><span id="A8.p9.pic1.2.1.1.4" class="ltx_text"></span> &quot;relevance&quot;: int (1-5)
<br class="ltx_break">}
<br class="ltx_break">```
<br class="ltx_break">
<br class="ltx_break">** Document **
<br class="ltx_break">[DOCUMENT] 
<br class="ltx_break">
<br class="ltx_break">** Summary **
<br class="ltx_break">[SUMMARY]</span></span>
</span></span></span></foreignobject></g></g></svg>