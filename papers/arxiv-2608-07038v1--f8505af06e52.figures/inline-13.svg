<span id="S4.SS4.p7.pic1.1" class="ltx_inline-block ltx_minipage ltx_align_bottom" style="width:32.47em;">
<span id="S4.SS4.p7.pic1.1.1" class="ltx_p"><span id="S4.SS4.p7.pic1.1.1.1" class="ltx_text ltx_font_bold" style="--ltx-fg-color:#000000;">Answering RQ3:<span id="S4.SS4.p7.pic1.1.1.1.1" class="ltx_text ltx_font_medium"> There is no &quot;one-size-fits-all&quot; judge configuration. Different tasks have distinct configuration preferences, and even within the same task, the performance of a fixed configuration (max 70.31% <math id="S4.SS4.p7.pic1.m1" class="ltx_Math" alttext="\tau" display="inline" intent=":literal"><semantics><mi style="--ltx-fg-color:#000000;" mathcolor="#000000">τ</mi><annotation encoding="application/x-tex">\tau</annotation></semantics></math>) is far below the 92.95% theoretical upper bound of sample-level adaptive configurations.</span></span></span>
</span></span></span></foreignobject></g></g></svg>