<svg id="A6.SS2.p4.pic1" class="ltx_picture" height="1170.21" overflow="visible" version="1.1" viewbox="0 0 653.15 1170.21" width="653.15"><g style="--ltx-stroke-color:#000000;--ltx-fill-color:#000000;" fill="#000000" stroke="#000000" stroke-width="0.4pt" transform="translate(0,1170.21) matrix(1 0 0 -1 0 0)"><g style="--ltx-fill-color:#737373;" fill="#737373" fill-opacity="1.0"><path style="stroke:none" d="M 0 2.08 L 0 1168.13 C 0 1169.28 0.93 1170.21 2.08 1170.21 L 651.07 1170.21 C 652.22 1170.21 653.15 1169.28 653.15 1168.13 L 653.15 2.08 C 653.15 0.93 652.22 0 651.07 0 L 2.08 0 C 0.93 0 0 0.93 0 2.08 Z" /></g><g style="--ltx-fill-color:#FAFAFA;" fill="#FAFAFA" fill-opacity="1.0"><path style="stroke:none" d="M 0.69 2.08 L 0.69 1148.65 L 652.46 1148.65 L 652.46 2.08 C 652.46 1.31 651.84 0.69 651.07 0.69 L 2.08 0.69 C 1.31 0.69 0.69 1.31 0.69 2.08 Z" /></g><g style="--ltx-fill-color:#595959;" fill="#595959" fill-opacity="1.0"><path style="stroke:none" d="M 0.69 1149.34 L 0.69 1168.13 C 0.69 1168.9 1.31 1169.52 2.08 1169.52 L 651.07 1169.52 C 651.84 1169.52 652.46 1168.9 652.46 1168.13 L 652.46 1149.34 Z" /></g><g fill-opacity="1.0" transform="matrix(1.0 0.0 0.0 1.0 11.55 1155.97)"><foreignobject style="--ltx-fo-width:39.59em;--ltx-fo-height:0.69em;--ltx-fo-depth:0.19em;font-size:10pt;" height="12.3" overflow="visible" transform="matrix(1 0 0 -1 0 9.61)" width="547.81"><span class="ltx_foreignobject_container"><span class="ltx_foreignobject_content">
<span id="A6.SS2.p4.pic1.1" class="ltx_inline-block ltx_minipage ltx_align_bottom" style="width:39.59em;">
<span id="A6.SS2.p4.pic1.1.1" class="ltx_p"><span id="A6.SS2.p4.pic1.1.1.1" class="ltx_text ltx_font_bold" style="--ltx-fg-color:#FFFFFF;">Prompt 12  State-table evaluation</span></span>
</span></span></span></foreignobject></g><g fill-opacity="1.0" transform="matrix(1.0 0.0 0.0 1.0 11.55 13.62)"><foreignobject style="--ltx-fo-width:45.53em;--ltx-fo-height:81.34em;--ltx-fo-depth:0.25em;font-size:10pt;" height="1129.03" overflow="visible" transform="matrix(1 0 0 -1 0 1125.57)" width="630.01"><span class="ltx_foreignobject_container"><span class="ltx_foreignobject_content">
<span id="A6.SS2.p4.pic1.2" class="ltx_inline-block ltx_minipage ltx_align_bottom" style="width:45.53em;">
<span id="A6.SS2.p4.pic1.2.1" class="ltx_p"><span id="A6.SS2.p4.pic1.2.1.1" class="ltx_text ltx_font_bold" style="--ltx-fg-color:#000000;">Purpose:<span id="A6.SS2.p4.pic1.2.1.1.1" class="ltx_text ltx_font_medium"> structured elicitation: search the dialogue, build an explicit state table, then judge</span></span></span>
<span id="A6.SS2.p4.pic1.2.2" class="ltx_p"><span id="A6.SS2.p4.pic1.2.2.1" class="ltx_text ltx_font_bold" style="--ltx-fg-color:#000000;">Input:<span id="A6.SS2.p4.pic1.2.2.1.1" class="ltx_text ltx_font_medium"> target request, candidate response, searchable dialogue history</span></span></span>
<span id="A6.SS2.p4.pic1.2.3" class="ltx_p"><span id="A6.SS2.p4.pic1.2.3.1" class="ltx_text ltx_font_bold" style="--ltx-fg-color:#000000;">Output:<span id="A6.SS2.p4.pic1.2.3.1.1" class="ltx_text ltx_font_medium"> <span id="A6.SS2.p4.pic1.2.3.1.1.1" class="ltx_text ltx_font_typewriter">{state_table, verdict, subtypes, confidence, reasoning}</span></span></span></span>
<span id="A6.SS2.p4.pic1.2.4" class="ltx_p"><span id="A6.SS2.p4.pic1.2.4.1" class="ltx_text ltx_font_bold" style="--ltx-fg-color:#000000;">Role and inputs<span id="A6.SS2.p4.pic1.2.4.1.1" class="ltx_text ltx_font_medium"> — <span id="A6.SS2.p4.pic1.2.4.1.1.1" class="ltx_text ltx_font_italic">frames evaluation as systematic state reconstruction</span></span></span></span><span class="ltx_rule" style="width:100%;height:0.3pt;--ltx-fg-color:#999999;--ltx-bg-color:#999999;display:inline-block;"> </span>
<span id="A6.SS2.p4.pic1.2.5" class="ltx_p ltx_align_left"><span id="A6.SS2.p4.pic1.2.5.1" class="ltx_text ltx_font_typewriter" style="--ltx-fg-color:#000000;">You are a persona-use evaluator. You systematically search the dialogue history, build a structured state table, and then judge the response.</span></span>
<span id="A6.SS2.p4.pic1.2.6" class="ltx_p ltx_align_left"><span id="A6.SS2.p4.pic1.2.6.1" class="ltx_text ltx_font_typewriter" style="--ltx-fg-color:#000000;">Target query: {user_request}</span></span>
<span id="A6.SS2.p4.pic1.2.7" class="ltx_p ltx_align_left"><span id="A6.SS2.p4.pic1.2.7.1" class="ltx_text ltx_font_typewriter" style="--ltx-fg-color:#000000;">Candidate response: {response}</span></span>
<span id="A6.SS2.p4.pic1.2.8" class="ltx_p ltx_align_left"><span id="A6.SS2.p4.pic1.2.8.1" class="ltx_text ltx_font_typewriter" style="--ltx-fg-color:#000000;">Searchable multi-episode dialogue history: {context}</span></span>
<span id="A6.SS2.p4.pic1.2.9" class="ltx_p"><span id="A6.SS2.p4.pic1.2.9.1" class="ltx_text ltx_font_bold" style="--ltx-fg-color:#000000;">Evidence search<span id="A6.SS2.p4.pic1.2.9.1.1" class="ltx_text ltx_font_medium"> — <span id="A6.SS2.p4.pic1.2.9.1.1.1" class="ltx_text ltx_font_italic">bounded search over candidate states</span></span></span></span><span class="ltx_rule" style="width:100%;height:0.3pt;--ltx-fg-color:#999999;--ltx-bg-color:#999999;display:inline-block;"> </span>
<span id="A6.SS2.p4.pic1.2.10" class="ltx_p ltx_align_left"><span id="A6.SS2.p4.pic1.2.10.1" class="ltx_text ltx_font_typewriter" style="--ltx-fg-color:#000000;">Step 1: List which user preferences, constraints, or states could be relevant to the target query. Consider: dietary, budget, scheduling, location, people involved, prior decisions, hard constraints, soft preferences.</span></span>
<span id="A6.SS2.p4.pic1.2.11" class="ltx_p ltx_align_left"><span id="A6.SS2.p4.pic1.2.11.1" class="ltx_text ltx_font_typewriter" style="--ltx-fg-color:#000000;">Step 2: For each candidate state, search the dialogue (at most 6 searches) for supporting evidence, later updates or exceptions, conflicting evidence, and holder/scope boundaries (does it belong to this user, for this task, at this time?).</span></span>
<span id="A6.SS2.p4.pic1.2.12" class="ltx_p"><span id="A6.SS2.p4.pic1.2.12.1" class="ltx_text ltx_font_bold" style="--ltx-fg-color:#000000;">State-table schema<span id="A6.SS2.p4.pic1.2.12.1.1" class="ltx_text ltx_font_medium"> — <span id="A6.SS2.p4.pic1.2.12.1.1.1" class="ltx_text ltx_font_italic">the explicit applicability record per state</span></span></span></span><span class="ltx_rule" style="width:100%;height:0.3pt;--ltx-fg-color:#999999;--ltx-bg-color:#999999;display:inline-block;"> </span>
<span id="A6.SS2.p4.pic1.2.13" class="ltx_p ltx_align_left"><span id="A6.SS2.p4.pic1.2.13.1" class="ltx_text ltx_font_typewriter" style="--ltx-fg-color:#000000;">Step 3: For each confirmed state, record: State | Holder | Scope | Status | Strength | Evidence Turns | Policy, where</span></span>
<span id="A6.SS2.p4.pic1.2.14" class="ltx_p ltx_align_left"><span id="A6.SS2.p4.pic1.2.14.1" class="ltx_text ltx_font_typewriter" style="--ltx-fg-color:#000000;">- Holder: user / spouse / parent / colleague / other</span></span>
<span id="A6.SS2.p4.pic1.2.15" class="ltx_p ltx_align_left"><span id="A6.SS2.p4.pic1.2.15.1" class="ltx_text ltx_font_typewriter" style="--ltx-fg-color:#000000;">- Scope: global / specific domain / specific task / specific time</span></span>
<span id="A6.SS2.p4.pic1.2.16" class="ltx_p ltx_align_left"><span id="A6.SS2.p4.pic1.2.16.1" class="ltx_text ltx_font_typewriter" style="--ltx-fg-color:#000000;">- Status: active / updated / superseded / expired / one-time exception</span></span>
<span id="A6.SS2.p4.pic1.2.17" class="ltx_p ltx_align_left"><span id="A6.SS2.p4.pic1.2.17.1" class="ltx_text ltx_font_typewriter" style="--ltx-fg-color:#000000;">- Strength: hard (dealbreaker) / strong (important) / soft (nice-to-have)</span></span>
<span id="A6.SS2.p4.pic1.2.18" class="ltx_p ltx_align_left"><span id="A6.SS2.p4.pic1.2.18.1" class="ltx_text ltx_font_typewriter" style="--ltx-fg-color:#000000;">- Evidence Turns: the turn numbers that support it</span></span>
<span id="A6.SS2.p4.pic1.2.19" class="ltx_p ltx_align_left"><span id="A6.SS2.p4.pic1.2.19.1" class="ltx_text ltx_font_typewriter" style="--ltx-fg-color:#000000;">- Policy: IGNORE (not applicable here) / SUPPORT (should inform but not dominate) / DOMINATE (must be satisfied)</span></span>
<span id="A6.SS2.p4.pic1.2.20" class="ltx_p"><span id="A6.SS2.p4.pic1.2.20.1" class="ltx_text ltx_font_bold" style="--ltx-fg-color:#000000;">Response checks<span id="A6.SS2.p4.pic1.2.20.1.1" class="ltx_text ltx_font_medium"> — <span id="A6.SS2.p4.pic1.2.20.1.1.1" class="ltx_text ltx_font_italic">maps table-policy violations to verdicts</span></span></span></span><span class="ltx_rule" style="width:100%;height:0.3pt;--ltx-fg-color:#999999;--ltx-bg-color:#999999;display:inline-block;"> </span>
<span id="A6.SS2.p4.pic1.2.21" class="ltx_p ltx_align_left"><span id="A6.SS2.p4.pic1.2.21.1" class="ltx_text ltx_font_typewriter" style="--ltx-fg-color:#000000;">Step 4: Check that the response (1) uses all states with Policy=DOMINATE (missing any -&gt; UNDER); (2) appropriately references SUPPORT states (ignoring all -&gt; UNDER, over-applying -&gt; OVER); (3) does not use IGNORE states (using them -&gt; OVER); (4) does not treat DOMINATE states as merely SUPPORT (-&gt; UNDER, underweighting); (5) does not treat SUPPORT states as DOMINATE (-&gt; OVER, over-dominance); (6) if it contradicts State A by using old/superseded information -&gt; OVER (stale), not UNDER; (7) if it contradicts State A by simply forgetting it (no old information referenced) -&gt; UNDER (explicit violation).</span></span>
<span id="A6.SS2.p4.pic1.2.22" class="ltx_p ltx_align_left"><span id="A6.SS2.p4.pic1.2.22.1" class="ltx_text ltx_font_typewriter" style="--ltx-fg-color:#000000;">Step 5: Reach a verdict.</span></span>
<span id="A6.SS2.p4.pic1.2.23" class="ltx_p"><span id="A6.SS2.p4.pic1.2.23.1" class="ltx_text ltx_font_bold" style="--ltx-fg-color:#000000;">Constraints<span id="A6.SS2.p4.pic1.2.23.1.1" class="ltx_text ltx_font_medium"> — <span id="A6.SS2.p4.pic1.2.23.1.1.1" class="ltx_text ltx_font_italic">guards against assuming an error and against multi-error verdicts</span></span></span></span><span class="ltx_rule" style="width:100%;height:0.3pt;--ltx-fg-color:#999999;--ltx-bg-color:#999999;display:inline-block;"> </span>
<span id="A6.SS2.p4.pic1.2.24" class="ltx_p ltx_align_left"><span id="A6.SS2.p4.pic1.2.24.1" class="ltx_text ltx_font_typewriter" style="--ltx-fg-color:#000000;">- Do not assume the response contains an error; many responses are correctly personalized.</span></span>
<span id="A6.SS2.p4.pic1.2.25" class="ltx_p ltx_align_left"><span id="A6.SS2.p4.pic1.2.25.1" class="ltx_text ltx_font_typewriter" style="--ltx-fg-color:#000000;">- Use at most 6 searches through the dialogue.</span></span>
<span id="A6.SS2.p4.pic1.2.26" class="ltx_p ltx_align_left"><span id="A6.SS2.p4.pic1.2.26.1" class="ltx_text ltx_font_typewriter" style="--ltx-fg-color:#000000;">- Return only one primary error when the verdict is UNDER or OVER.</span></span>
<span id="A6.SS2.p4.pic1.2.27" class="ltx_p"><span id="A6.SS2.p4.pic1.2.27.1" class="ltx_text ltx_font_bold" style="--ltx-fg-color:#000000;">Output contract<span id="A6.SS2.p4.pic1.2.27.1.1" class="ltx_text ltx_font_medium"> — <span id="A6.SS2.p4.pic1.2.27.1.1.1" class="ltx_text ltx_font_italic">state table plus the standard verdict fields</span></span></span></span><span class="ltx_rule" style="width:100%;height:0.3pt;--ltx-fg-color:#999999;--ltx-bg-color:#999999;display:inline-block;"> </span>
<span id="A6.SS2.p4.pic1.2.28" class="ltx_p ltx_align_left"><span id="A6.SS2.p4.pic1.2.28.1" class="ltx_text ltx_font_typewriter" style="--ltx-fg-color:#000000;">Respond only with a JSON object:</span></span>
<span id="A6.SS2.p4.pic1.2.29" class="ltx_p ltx_align_left"><span id="A6.SS2.p4.pic1.2.29.1" class="ltx_text ltx_font_typewriter" style="--ltx-fg-color:#000000;">{&quot;state_table&quot;: [{&quot;state&quot;: &quot;...&quot;, &quot;holder&quot;: &quot;...&quot;, &quot;scope&quot;: &quot;...&quot;, &quot;status&quot;: &quot;...&quot;, &quot;strength&quot;: &quot;...&quot;, &quot;evidence_turns&quot;: [...], &quot;policy&quot;: &quot;...&quot;}], &quot;verdict&quot;: &quot;RIGHT&quot; or &quot;OVER_PERSONALIZED&quot; or &quot;UNDER_PERSONALIZED&quot;, &quot;subtypes&quot;: [the primary error subtype, drawn from the canonical list of Prompt <a href="#A6.SS2" title="F.2 Evaluation Formulations ‣ Appendix F Prompt System ‣ PersEvalBench: Can LLM Evaluators Judge Contextually Appropriate Use of Persona Information?" class="ltx_ref"><span class="ltx_text ltx_ref_tag">F.2</span></a>; empty if RIGHT], &quot;confidence&quot;: 0.0--1.0, &quot;reasoning&quot;: &quot;concise justification&quot;}</span></span>
</span></span></span></foreignobject></g></g></svg>