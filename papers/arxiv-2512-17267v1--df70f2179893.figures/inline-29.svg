<span id="A7.p4.pic1.p1.pic1.1.1" class="ltx_p"><span id="A7.p4.pic1.p1.pic1.1.1.1" class="ltx_text ltx_font_bold">Description: <span id="A7.p4.pic1.p1.pic1.1.1.1.1" class="ltx_text ltx_font_typewriter">GRMRewardModel</span></span></span>
</span></span></span></foreignobject></g><g fill-opacity="1.0" transform="matrix(1.0 0.0 0.0 1.0 12.93 12.93)"><foreignobject style="--ltx-fo-width:35.53em;--ltx-fo-height:9.09em;--ltx-fo-depth:0em;font-size:10pt;" height="125.84" overflow="visible" transform="matrix(1 0 0 -1 0 125.84)" width="491.64"><span class="ltx_foreignobject_container"><span class="ltx_foreignobject_content">
<span id="A7.p4.pic1.p1.pic1.2" class="ltx_inline-block ltx_minipage ltx_align_bottom" style="width:35.53em;">
<span id="A7.p4.pic1.p1.pic1.2.1" class="ltx_p">The GRMRewardModel is a general-purpose reward model designed to evaluate the quality and safety of LLM-generated outputs. It achieves high generalization performance by applying a novel regularization method on hidden states during supervised fine-tuning. GRMRewardModel is fine-tuned on the decontaminated Skywork/Skywork-Reward-Preference-80K-v0.2 dataset and achieves state-of-the-art results among models of comparable size (3B), even outperforming some 8B reward models and proprietary LLM judges on RewardBench.</span>
</span></span></span></foreignobject></g></g></svg>