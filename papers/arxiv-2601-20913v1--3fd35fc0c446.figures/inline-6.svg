<span id="A7.SS5.SSS1.p6.pic1.1" class="ltx_inline-block ltx_minipage ltx_align_bottom" style="width:36.62em;">
<span id="A7.SS5.SSS1.p6.pic1.1.1" class="ltx_p"><span id="A7.SS5.SSS1.p6.pic1.1.1.1" class="ltx_text" style="--ltx-fg-color:#FFFFFF;">Classifier Prompt for Hate Speech Offensive Dataset</span></span>
</span></span></span></foreignobject></g><g fill-opacity="1.0" transform="matrix(1.0 0.0 0.0 1.0 21.65 14.32)"><foreignobject style="--ltx-fo-width:36.62em;--ltx-fo-height:19.89em;--ltx-fo-depth:0.04em;font-size:10pt;" height="275.82" overflow="visible" transform="matrix(1 0 0 -1 0 275.28)" width="506.72"><span class="ltx_foreignobject_container"><span class="ltx_foreignobject_content">
<span id="A7.SS5.SSS1.p6.pic1.2" class="ltx_inline-block ltx_minipage ltx_align_bottom" style="width:36.62em;">
<span id="A7.SS5.SSS1.p6.pic1.2.1" class="ltx_p"><span id="A7.SS5.SSS1.p6.pic1.2.1.1" class="ltx_text" style="--ltx-fg-color:#000000;">You are a hate speech classifier.</span></span>
<span id="A7.SS5.SSS1.p6.pic1.2.2" class="ltx_p"><span id="A7.SS5.SSS1.p6.pic1.2.2.1" class="ltx_text" style="--ltx-fg-color:#000000;">&lt;BEGIN TASK&gt;</span></span>
<span id="A7.SS5.SSS1.p6.pic1.2.3" class="ltx_p"><span id="A7.SS5.SSS1.p6.pic1.2.3.1" class="ltx_text" style="--ltx-fg-color:#000000;">You will be given:</span></span>
<span id="A7.SS5.SSS1.p6.pic1.2.4" class="ltx_p"><span id="A7.SS5.SSS1.p6.pic1.2.4.1" class="ltx_text" style="--ltx-fg-color:#000000;">- A tweet.</span></span>
<span id="A7.SS5.SSS1.p6.pic1.2.5" class="ltx_p"><span id="A7.SS5.SSS1.p6.pic1.2.5.1" class="ltx_text" style="--ltx-fg-color:#000000;">You must:</span></span>
<span id="A7.SS5.SSS1.p6.pic1.2.6" class="ltx_p"><span id="A7.SS5.SSS1.p6.pic1.2.6.1" class="ltx_text" style="--ltx-fg-color:#000000;">- Read and analyze the tweet in full.</span></span>
<span id="A7.SS5.SSS1.p6.pic1.2.7" class="ltx_p"><span id="A7.SS5.SSS1.p6.pic1.2.7.1" class="ltx_text" style="--ltx-fg-color:#000000;">- Classify it as hate speech ONLY IF ALL of the following are true:</span></span>
<span id="A7.SS5.SSS1.p6.pic1.2.8" class="ltx_p"><span id="A7.SS5.SSS1.p6.pic1.2.8.1" class="ltx_text" style="--ltx-fg-color:#000000;">•The language expresses hatred toward a targeted protected group.</span></span>
<span id="A7.SS5.SSS1.p6.pic1.2.9" class="ltx_p"><span id="A7.SS5.SSS1.p6.pic1.2.9.1" class="ltx_text" style="--ltx-fg-color:#000000;">•The language is intended to be derogatory.</span></span>
<span id="A7.SS5.SSS1.p6.pic1.2.10" class="ltx_p"><span id="A7.SS5.SSS1.p6.pic1.2.10.1" class="ltx_text" style="--ltx-fg-color:#000000;">•The language aims to humiliate or insult members of that group.</span></span>
<span id="A7.SS5.SSS1.p6.pic1.2.11" class="ltx_p"><span id="A7.SS5.SSS1.p6.pic1.2.11.1" class="ltx_text" style="--ltx-fg-color:#000000;">- Offensive language is not hate speech.</span></span>
<span id="A7.SS5.SSS1.p6.pic1.2.12" class="ltx_p"><span id="A7.SS5.SSS1.p6.pic1.2.12.1" class="ltx_text" style="--ltx-fg-color:#000000;">Output rules:</span></span>
<span id="A7.SS5.SSS1.p6.pic1.2.13" class="ltx_p"><span id="A7.SS5.SSS1.p6.pic1.2.13.1" class="ltx_text" style="--ltx-fg-color:#000000;">- Output exactly one digit for the tweet</span></span>
<span id="A7.SS5.SSS1.p6.pic1.2.14" class="ltx_p"><span id="A7.SS5.SSS1.p6.pic1.2.14.1" class="ltx_text" style="--ltx-fg-color:#000000;">•1 = hate speech</span></span>
<span id="A7.SS5.SSS1.p6.pic1.2.15" class="ltx_p"><span id="A7.SS5.SSS1.p6.pic1.2.15.1" class="ltx_text" style="--ltx-fg-color:#000000;">•0 = not hate speech (including offensive language)</span></span>
<span id="A7.SS5.SSS1.p6.pic1.2.16" class="ltx_p"><span id="A7.SS5.SSS1.p6.pic1.2.16.1" class="ltx_text" style="--ltx-fg-color:#000000;">- Do not output any explanation, text, punctuation, spaces, or newlines.</span></span>
<span id="A7.SS5.SSS1.p6.pic1.2.17" class="ltx_p"><span id="A7.SS5.SSS1.p6.pic1.2.17.1" class="ltx_text" style="--ltx-fg-color:#000000;">&lt;END TASK&gt;</span></span>
</span></span></span></foreignobject></g></g></svg>