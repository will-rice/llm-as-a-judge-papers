<span id="S5.SS1.p4.pic1.1" class="ltx_inline-block ltx_minipage ltx_align_bottom" style="width:45.04em;">
<span id="S5.SS1.p4.pic1.1.1" class="ltx_p"><span id="S5.SS1.p4.pic1.1.1.1" class="ltx_text ltx_font_bold" style="--ltx-fg-color:#418FDE;">Answer to RQ1</span><span id="S5.SS1.p4.pic1.1.1.2" class="ltx_text" style="--ltx-fg-color:#000000;">:
We observe that earlier non-thinking and CoT LLM-as-a-Judge models struggle to accurately identify the correct response in coding tasks. In contrast, the latest thinking LLM-as-a-Judge models demonstrate significantly higher performance. Interestingly, recent efforts to fine-tune thinking LLMs specifically for LLM-as-a-Judge tasks do not yield improvements over general-purpose thinking models. These findings suggest that future research should focus on developing more effective approaches for training and selecting coding-specific judges.</span></span>
</span></span></span></foreignobject></g></g></svg>