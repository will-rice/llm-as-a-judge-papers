<span id="A1.SS1.p3.pic1.2.1" class="ltx_p"><span id="A1.SS1.p3.pic1.2.1.1" class="ltx_text ltx_verbatim ltx_font_typewriter ltx_inline-block" style="width:459.7pt;--ltx-fg-color:#000000;"><span id="A1.SS1.p3.pic1.2.1.1.1" class="ltx_inline-logical-block ltx_parbox ltx_align_top" style="width:459.7pt;">
<span id="A1.SS1.p3.pic1.p1" class="ltx_para ltx_noindent">
<span id="A1.SS1.p3.pic1.p1.1" class="ltx_p">[점수 기준]</span>
</span></span></span></span>
<span id="A1.SS1.p3.pic1.2.2" class="ltx_p" style="width:459.7pt;"><span id="A1.SS1.p3.pic1.2.2.1" class="ltx_text ltx_verbatim ltx_font_typewriter ltx_inline-block" style="width:459.7pt;--ltx-fg-color:#000000;"><span id="A1.SS1.p3.pic1.2.2.1.1" class="ltx_inline-logical-block ltx_parbox ltx_align_top" style="width:459.7pt;">
<span id="A1.SS1.p3.pic1.p2" class="ltx_para ltx_noindent">
<span id="A1.SS1.p3.pic1.p2.1" class="ltx_p">5점: 매우 우수함. 결함이 거의 없고, essay_text에서 확인되는 구체적 강점이 뚜렷함.</span>
</span></span></span></span>
<span id="A1.SS1.p3.pic1.2.3" class="ltx_p" style="width:459.7pt;"><span id="A1.SS1.p3.pic1.2.3.1" class="ltx_text ltx_verbatim ltx_font_typewriter ltx_inline-block" style="width:459.7pt;--ltx-fg-color:#000000;"><span id="A1.SS1.p3.pic1.2.3.1.1" class="ltx_inline-logical-block ltx_parbox ltx_align_top" style="width:459.7pt;">
<span id="A1.SS1.p3.pic1.p3" class="ltx_para ltx_noindent">
<span id="A1.SS1.p3.pic1.p3.1" class="ltx_p">4점: 우수함. 경미한 약점은 있으나 기준을 전반적으로 잘 충족함.</span>
</span></span></span></span>
<span id="A1.SS1.p3.pic1.2.4" class="ltx_p" style="width:459.7pt;"><span id="A1.SS1.p3.pic1.2.4.1" class="ltx_text ltx_verbatim ltx_font_typewriter ltx_inline-block" style="width:459.7pt;--ltx-fg-color:#000000;"><span id="A1.SS1.p3.pic1.2.4.1.1" class="ltx_inline-logical-block ltx_parbox ltx_align_top" style="width:459.7pt;">
<span id="A1.SS1.p3.pic1.p4" class="ltx_para ltx_noindent">
<span id="A1.SS1.p3.pic1.p4.1" class="ltx_p">3점: 보통. 장점과 약점이 함께 있으며 기준을 부분적으로 충족함.</span>
</span></span></span></span>
<span id="A1.SS1.p3.pic1.2.5" class="ltx_p" style="width:459.7pt;"><span id="A1.SS1.p3.pic1.2.5.1" class="ltx_text ltx_verbatim ltx_font_typewriter ltx_inline-block" style="width:459.7pt;--ltx-fg-color:#000000;"><span id="A1.SS1.p3.pic1.2.5.1.1" class="ltx_inline-logical-block ltx_parbox ltx_align_top" style="width:459.7pt;">
<span id="A1.SS1.p3.pic1.p5" class="ltx_para ltx_noindent">
<span id="A1.SS1.p3.pic1.p5.1" class="ltx_p">2점: 미흡함. 주요 결함이 있어 기준 충족이 제한적임.</span>
</span></span></span></span>
<span id="A1.SS1.p3.pic1.2.6" class="ltx_p" style="width:459.7pt;"><span id="A1.SS1.p3.pic1.2.6.1" class="ltx_text ltx_verbatim ltx_font_typewriter ltx_inline-block" style="width:459.7pt;--ltx-fg-color:#000000;"><span id="A1.SS1.p3.pic1.2.6.1.1" class="ltx_inline-logical-block ltx_parbox ltx_align_top" style="width:459.7pt;">
<span id="A1.SS1.p3.pic1.p6" class="ltx_para ltx_noindent">
<span id="A1.SS1.p3.pic1.p6.1" class="ltx_p">1점: 매우 미흡함. 기준을 거의 충족하지 못하거나 심각한 결함이 있음.</span>
</span></span></span></span>
</span></span></span></foreignobject></g></g></svg>