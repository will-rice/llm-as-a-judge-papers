</span></span></span></foreignobject></g><g fill-opacity="1.0" transform="matrix(1.0 0.0 0.0 1.0 10.47 11.96)"><foreignobject style="--ltx-fo-width:43.3em;--ltx-fo-height:25.23em;--ltx-fo-depth:0.25em;font-size:10pt;" height="352.58" overflow="visible" transform="matrix(1 0 0 -1 0 349.12)" width="599.15"><span class="ltx_foreignobject_container"><span class="ltx_foreignobject_content"><span id="A1.SS4.p4.pic1.2" class="ltx_inline-logical-block ltx_minipage ltx_align_bottom" style="width:43.3em;">
<span id="A1.SS4.p4.pic1.p1" class="ltx_para ltx_noindent">
<span id="A1.SS4.p4.pic1.p1.1" class="ltx_p"><span id="A1.SS4.p4.pic1.p1.1.1" class="ltx_text ltx_font_bold" style="--ltx-fg-color:#000000;">System</span></span>
</span>
<span id="A1.SS4.p4.pic1.p4" class="ltx_para">
<span id="A1.SS4.p4.pic1.p4.1" class="ltx_p"><span id="A1.SS4.p4.pic1.p4.1.1" class="ltx_text" style="--ltx-fg-color:#000000;">You are an expert research scientist.</span></span>
<span id="A1.SS4.p4.pic1.p4.2" class="ltx_p"><span id="A1.SS4.p4.pic1.p4.2.1" class="ltx_text" style="--ltx-fg-color:#000000;">Your task is to evaluate SEVERAL candidate research questions against one
background paper.</span></span>
<span id="A1.SS4.p4.pic1.p4.3" class="ltx_p"><span id="A1.SS4.p4.pic1.p4.3.1" class="ltx_text" style="--ltx-fg-color:#000000;">Each candidate is scored INDEPENDENTLY on the two scales below. You are
shown all candidates together only so you can read them efficiently; a
candidate’s two scores must depend only on that candidate and the
background paper, never on the other candidates.</span></span>
</span>
<span id="A1.SS4.p4.pic1.p2" class="ltx_para ltx_noindent">
<span id="A1.SS4.p4.pic1.p2.1" class="ltx_p"><span id="A1.SS4.p4.pic1.p2.1.1" class="ltx_text ltx_font_italic" style="--ltx-fg-color:#000000;">The two-score definitions, the SOURCE-BOUNDEDNESS SCALE
(0–3), the DIAGNOSTIC / TEST-LIST SCALE (0–3), the important rules, and
the per-candidate field definitions are identical to the standalone
narrowness prompt above. The only change is that the final instruction
reads “For EACH candidate research question you assign one JSON object
with this schema” and the output is wrapped in a <span id="A1.SS4.p4.pic1.p2.1.1.1" class="ltx_text ltx_font_typewriter">scores</span> array.</span></span>
</span>
<span id="A1.SS4.p4.pic1.p5" class="ltx_para">
<span id="A1.SS4.p4.pic1.p5.1" class="ltx_p"><span id="A1.SS4.p4.pic1.p5.1.1" class="ltx_text" style="--ltx-fg-color:#000000;">Return exactly one JSON object:</span></span><pre id="A1.SS4.p4.pic1.p5.2" class="ltx_verbatim ltx_font_typewriter" style="--ltx-fg-color:#000000;">
{
  &quot;scores&quot;: [ one object per candidate, in the SAME order as presented,
              using the per-candidate schema above ]
}
</pre>
<span id="A1.SS4.p4.pic1.p5.3" class="ltx_p"><span id="A1.SS4.p4.pic1.p5.3.1" class="ltx_text" style="--ltx-fg-color:#000000;">The <span id="A1.SS4.p4.pic1.p5.3.1.1" class="ltx_text ltx_font_typewriter">scores</span> array length must equal the number of candidates.
Return only this JSON object and nothing else.</span></span>
</span>
<span id="A1.SS4.p4.pic1.p3" class="ltx_para ltx_noindent">
<span id="A1.SS4.p4.pic1.p3.1" class="ltx_p"><span id="A1.SS4.p4.pic1.p3.1.1" class="ltx_text ltx_font_bold" style="--ltx-fg-color:#000000;">User</span></span>
</span>
<span id="A1.SS4.p4.pic1.p6" class="ltx_para"><pre id="A1.SS4.p4.pic1.p6.1" class="ltx_verbatim ltx_font_typewriter" style="--ltx-fg-color:#000000;">BACKGROUND PAPER:
{background}

CANDIDATE RESEARCH QUESTIONS:
{candidates_block}
</pre>
</span></span></span></span></foreignobject></g></g></svg>