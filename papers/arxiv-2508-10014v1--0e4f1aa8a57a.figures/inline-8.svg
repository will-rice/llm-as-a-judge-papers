<span id="A5.SS3.SSS0.Px1.p2.pic1.1.1" class="ltx_p"><span id="A5.SS3.SSS0.Px1.p2.pic1.1.1.1" class="ltx_text" style="--ltx-fg-color:#000000;">Dialogue and Candidate Roles</span></span>
</span></span></span></foreignobject></g><g fill-opacity="1.0" transform="matrix(1.0 0.0 0.0 1.0 12.36 15.82)"><foreignobject style="--ltx-fo-width:32.71em;--ltx-fo-height:21.69em;--ltx-fo-depth:0.25em;font-size:10pt;" height="303.65" overflow="visible" transform="matrix(1 0 0 -1 0 300.19)" width="452.61"><span class="ltx_foreignobject_container"><span class="ltx_foreignobject_content">
<span id="A5.SS3.SSS0.Px1.p2.pic1.2" class="ltx_inline-block ltx_minipage ltx_align_bottom" style="width:32.71em;">
<span id="A5.SS3.SSS0.Px1.p2.pic1.2.1" class="ltx_p"><span id="A5.SS3.SSS0.Px1.p2.pic1.2.1.1" class="ltx_text ltx_font_bold" style="--ltx-fg-color:#000000;">Character1: Huckleberry Finn<span id="A5.SS3.SSS0.Px1.p2.pic1.2.1.1.1" class="ltx_text ltx_font_medium"> 
<br class="ltx_break">[Thinking: I can’t believe we’re really going to do this.] 
<br class="ltx_break">All right—I don’t care where he comes out, so he comes out; and Jim don’t, either, I reckon. But there’s one thing, anyway—Jim’s too old to be dug out with a case-knife. He won’t last.</span></span></span>
<span id="A5.SS3.SSS0.Px1.p2.pic1.2.2" class="ltx_p"><span id="A5.SS3.SSS0.Px1.p2.pic1.2.2.1" class="ltx_text ltx_font_bold" style="--ltx-fg-color:#000000;">Character2: Unknown<span id="A5.SS3.SSS0.Px1.p2.pic1.2.2.1.1" class="ltx_text ltx_font_medium"> 
<br class="ltx_break">[Thinking: We need to stick to the plan, but maybe we can compromise a little.] 
<br class="ltx_break">Well, we can’t resk being as long as we ought to, because it mayn’t take very long for Uncle Silas to hear from down there by New Orleans. He’ll hear Jim ain’t from there. Then his next move will be to advertise Jim, or something like that. So we can’t resk being as long digging him out as we ought to.</span></span></span>
<span id="A5.SS3.SSS0.Px1.p2.pic1.2.3" class="ltx_p"><span id="A5.SS3.SSS0.Px1.p2.pic1.2.3.1" class="ltx_text ltx_font_bold" style="--ltx-fg-color:#000000;">Candidate Roles:<span id="A5.SS3.SSS0.Px1.p2.pic1.2.3.1.1" class="ltx_text"></span></span></span>
<span id="A5.SS3.SSS0.Px1.p2.pic1.2.4" class="ltx_p"><span id="A5.SS3.SSS0.Px1.p2.pic1.2.4.1" class="ltx_text" style="--ltx-fg-color:#000000;">Huck Finn, Uncle Tom, Huckleberry Finn, and Tom Sawyer (Correct)</span></span>
</span></span></span></foreignobject></g></g></svg>