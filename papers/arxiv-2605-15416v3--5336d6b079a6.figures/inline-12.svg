<span id="A4.SS4.p8.pic1.p4" class="ltx_para">
<span id="A4.SS4.p8.pic1.p4.1" class="ltx_p"><span id="A4.SS4.p8.pic1.p4.1.1" class="ltx_text ltx_font_bold" style="--ltx-fg-color:#000000;">Document
<br class="ltx_break"><span id="A4.SS4.p8.pic1.p4.1.1.1" class="ltx_text ltx_font_medium">I have Asperger’s. Basically I overreact when things I planned don’t go as planned. I’ve been having trouble in my life, because I do not have a job or go to school currently. I live by myself. I have way too much free time and I’m not keeping as busy as I should. I’m in a smalltown newfoundland. It’s pretty isolated and friendships are few. Managed to make friends with a few people. The problem is, that I’m having a panic attack because my friend can never visit me for more than an hour. It’s a ’friends with benefits’ situation so I probably have strong emotions for him too. Anxiety (and other factors) prevents me from being around him and his partner. So I don’t see him as often as I know I should.</span></span></span>
</span>
<span id="A4.SS4.p8.pic1.p1" class="ltx_para ltx_noindent">
<span id="A4.SS4.p8.pic1.p1.1" class="ltx_p"><span id="A4.SS4.p8.pic1.p1.1.1" class="ltx_text"></span><span id="A4.SS4.p8.pic1.p1.1.2" class="ltx_text ltx_leader" style="--ltx-fg-color:#000000;"><span class="ltx_rule" style="width:2.0pt;height:0.5pt;position:relative; bottom:0.0pt;--ltx-bg-color:black;display:inline-block;"> </span> </span><span id="A4.SS4.p8.pic1.p1.1.3" class="ltx_text"></span></span>
</span>
<span id="A4.SS4.p8.pic1.p5" class="ltx_para">
<span id="A4.SS4.p8.pic1.p5.1" class="ltx_p"><span id="A4.SS4.p8.pic1.p5.1.1" class="ltx_text ltx_font_bold" style="--ltx-fg-color:#000000;">Summary A
<br class="ltx_break"><span id="A4.SS4.p8.pic1.p5.1.1.1" class="ltx_text ltx_font_medium">having trouble with anxiety and panic attacks preventing me from being around my friend and his partner. Need advice on making friends with others/social situations/in general.</span></span></span>
</span>
<span id="A4.SS4.p8.pic1.p2" class="ltx_para ltx_noindent">
<span id="A4.SS4.p8.pic1.p2.1" class="ltx_p"><span id="A4.SS4.p8.pic1.p2.1.1" class="ltx_text"></span><span id="A4.SS4.p8.pic1.p2.1.2" class="ltx_text ltx_leader" style="--ltx-fg-color:#000000;"><span class="ltx_rule" style="width:2.0pt;height:0.5pt;position:relative; bottom:0.0pt;--ltx-bg-color:black;display:inline-block;"> </span> </span><span id="A4.SS4.p8.pic1.p2.1.3" class="ltx_text"></span></span>
</span>
<span id="A4.SS4.p8.pic1.p6" class="ltx_para">
<span id="A4.SS4.p8.pic1.p6.1" class="ltx_p"><span id="A4.SS4.p8.pic1.p6.1.1" class="ltx_text ltx_font_bold" style="--ltx-fg-color:#000000;">Summary B
<br class="ltx_break"><span id="A4.SS4.p8.pic1.p6.1.1.1" class="ltx_text ltx_font_medium">Have Aspergers/Autism. Can’t keep social situations short and simple. Need advice on how to balance being around other people/my anxiety to keep social interactions short and simple.</span></span></span>
</span>
