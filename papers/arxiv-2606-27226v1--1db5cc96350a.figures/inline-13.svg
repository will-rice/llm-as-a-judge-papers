<span id="A1.I3.i2.p1.1" class="ltx_p"><span id="A1.I3.i2.p1.1.1" class="ltx_text" style="font-size:90%;--ltx-fg-color:#000000;">Require the evaluator to check for </span><em id="A1.I3.i2.p1.1.2" class="ltx_emph ltx_font_italic" style="font-size:90%;--ltx-fg-color:#000000;">every</em><span id="A1.I3.i2.p1.1.3" class="ltx_text" style="font-size:90%;--ltx-fg-color:#000000;"> key actor, </span><em id="A1.I3.i2.p1.1.4" class="ltx_emph ltx_font_italic" style="font-size:90%;--ltx-fg-color:#000000;">every</em><span id="A1.I3.i2.p1.1.5" class="ltx_text" style="font-size:90%;--ltx-fg-color:#000000;"> motivation, and </span><em id="A1.I3.i2.p1.1.6" class="ltx_emph ltx_font_italic" style="font-size:90%;--ltx-fg-color:#000000;">every</em><span id="A1.I3.i2.p1.1.7" class="ltx_text" style="font-size:90%;--ltx-fg-color:#000000;"> background event.</span></span>
</span></span>
<span id="A1.I3.i3" class="ltx_item" style="list-style-type:none;"><span class="ltx_tag ltx_tag_item">3.</span> 
<span id="A1.I3.i3.p1" class="ltx_para">
<span id="A1.I3.i3.p1.1" class="ltx_p"><span id="A1.I3.i3.p1.1.1" class="ltx_text" style="font-size:90%;--ltx-fg-color:#000000;">Apply quantitative penalties: </span><math id="A1.I3.i3.p1.m1" class="ltx_Math" alttext="-1" display="inline" intent=":literal"><semantics><mrow><mo style="--ltx-fg-color:#000000;" mathcolor="#000000" mathsize="0.900em">−</mo><mn style="--ltx-fg-color:#000000;" mathcolor="#000000" mathsize="0.900em">1</mn></mrow><annotation encoding="application/x-tex">-1</annotation></semantics></math><span id="A1.I3.i3.p1.1.2" class="ltx_text" style="font-size:90%;--ltx-fg-color:#000000;"> per missing key actor, </span><math id="A1.I3.i3.p1.m2" class="ltx_Math" alttext="-0.5" display="inline" intent=":literal"><semantics><mrow><mo style="--ltx-fg-color:#000000;" mathcolor="#000000" mathsize="0.900em">−</mo><mn style="--ltx-fg-color:#000000;" mathcolor="#000000" mathsize="0.900em">0.5</mn></mrow><annotation encoding="application/x-tex">-0.5</annotation></semantics></math><span id="A1.I3.i3.p1.1.3" class="ltx_text" style="font-size:90%;--ltx-fg-color:#000000;"> per missing motivation or background event.</span></span>
