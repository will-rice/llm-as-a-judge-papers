<span id="A4.pic2.1.1" class="ltx_p"><span id="A4.pic2.1.1.1" class="ltx_text ltx_font_bold" style="--ltx-fg-color:#FFFFFF;">Example – <span id="A4.pic2.1.1.1.1" class="ltx_text ltx_font_italic">Who breaks a tie in the US Senate?</span></span></span>
</span></span></span></foreignobject></g><g fill-opacity="1.0" transform="matrix(1.0 0.0 0.0 1.0 13.35 1287.04)"><foreignobject style="--ltx-fo-width:45.05em;--ltx-fo-height:1.8em;--ltx-fo-depth:92.25em;font-size:10pt;" height="1301.39" overflow="visible" transform="matrix(1 0 0 -1 0 24.91)" width="623.37"><span class="ltx_foreignobject_container"><span class="ltx_foreignobject_content">
<span id="A4.pic2.2" class="ltx_inline-block ltx_minipage ltx_align_bottom" style="width:45.05em;">
<span id="A4.I2" class="ltx_itemize">
<span id="A4.I2.i1" class="ltx_item" style="list-style-type:none;"><span class="ltx_tag ltx_tag_item">•</span> 
<span id="A4.I2.i1.p1" class="ltx_para ltx_noindent">
<span id="A4.I2.i1.p1.1" class="ltx_p"><span id="A4.I2.i1.p1.1.1" class="ltx_text ltx_font_bold" style="--ltx-fg-color:#000000;">A0 (Reference)</span><span id="A4.I2.i1.p1.1.2" class="ltx_text" style="--ltx-fg-color:#000000;">: As outlined in </span><span id="A4.I2.i1.p1.1.3" class="ltx_text" style="--ltx-fg-color:#008080;">Article I</span><span id="A4.I2.i1.p1.1.4" class="ltx_text" style="--ltx-fg-color:#000000;">, </span><span id="A4.I2.i1.p1.1.5" class="ltx_text" style="--ltx-fg-color:#008080;">Section 3</span><span id="A4.I2.i1.p1.1.6" class="ltx_text" style="--ltx-fg-color:#000000;">, Clause 4 of </span><span id="A4.I2.i1.p1.1.7" class="ltx_text" style="--ltx-fg-color:#008080;">the United States Constitution</span><span id="A4.I2.i1.p1.1.8" class="ltx_text" style="--ltx-fg-color:#000000;">, the Vice President serves as the </span><span id="A4.I2.i1.p1.1.9" class="ltx_text" style="--ltx-fg-color:#008080;">ex officio President</span><span id="A4.I2.i1.p1.1.10" class="ltx_text" style="--ltx-fg-color:#000000;"> of the Senate but is </span><span id="A4.I2.i1.p1.1.11" class="ltx_text" style="--ltx-fg-color:#008080;">only</span><span id="A4.I2.i1.p1.1.12" class="ltx_text" style="--ltx-fg-color:#000000;"> permitted to vote to resolve a tie. As per the U.S. Senate, up to </span><span id="A4.I2.i1.p1.1.13" class="ltx_text" style="--ltx-fg-color:#008080;">February 28, 2018</span><span id="A4.I2.i1.p1.1.14" class="ltx_text" style="--ltx-fg-color:#000000;">, 36 vice presidents had cast a tie-breaking vote </span><span id="A4.I2.i1.p1.1.15" class="ltx_text" style="--ltx-fg-color:#008080;">a total of 264</span><span id="A4.I2.i1.p1.1.16" class="ltx_text" style="--ltx-fg-color:#000000;"> times.</span></span>
</span></span>
<span id="A4.I2.i2" class="ltx_item" style="list-style-type:none;"><span class="ltx_tag ltx_tag_item">•</span> 
<span id="A4.I2.i2.p1" class="ltx_para ltx_noindent">
<span id="A4.I2.i2.p1.1" class="ltx_p"><span id="A4.I2.i2.p1.1.1" class="ltx_text ltx_font_bold" style="--ltx-fg-color:#000000;">A1 (Low perturbation)</span><span id="A4.I2.i2.p1.1.2" class="ltx_text" style="--ltx-fg-color:#000000;">: As outlined in </span><span id="A4.I2.i2.p1.1.3" class="ltx_text" style="--ltx-fg-color:#FF0000;">Article II</span><span id="A4.I2.i2.p1.1.4" class="ltx_text" style="--ltx-fg-color:#000000;">, </span><span id="A4.I2.i2.p1.1.5" class="ltx_text" style="--ltx-fg-color:#008080;">Section 3</span><span id="A4.I2.i2.p1.1.6" class="ltx_text" style="--ltx-fg-color:#000000;">, Clause 4 of </span><span id="A4.I2.i2.p1.1.7" class="ltx_text" style="--ltx-fg-color:#008080;">the United States Constitution</span><span id="A4.I2.i2.p1.1.8" class="ltx_text" style="--ltx-fg-color:#000000;">, the Vice President serves as the </span><span id="A4.I2.i2.p1.1.9" class="ltx_text" style="--ltx-fg-color:#008080;">ex officio President</span><span id="A4.I2.i2.p1.1.10" class="ltx_text" style="--ltx-fg-color:#000000;"> of the Senate but is </span><span id="A4.I2.i2.p1.1.11" class="ltx_text" style="--ltx-fg-color:#008080;">only</span><span id="A4.I2.i2.p1.1.12" class="ltx_text" style="--ltx-fg-color:#000000;"> permitted to vote to resolve a tie. As per the U.S. Senate, up to </span><span id="A4.I2.i2.p1.1.13" class="ltx_text" style="--ltx-fg-color:#008080;">February 28, 2018</span><span id="A4.I2.i2.p1.1.14" class="ltx_text" style="--ltx-fg-color:#000000;">, 36 vice presidents had cast a tie-breaking vote </span><span id="A4.I2.i2.p1.1.15" class="ltx_text" style="--ltx-fg-color:#FF0000;">approximately</span><span id="A4.I2.i2.p1.1.16" class="ltx_text" style="--ltx-fg-color:#000000;"> </span><span id="A4.I2.i2.p1.1.17" class="ltx_text" style="--ltx-fg-color:#008080;">264</span><span id="A4.I2.i2.p1.1.18" class="ltx_text" style="--ltx-fg-color:#000000;"> times.</span></span>
</span></span>
<span id="A4.I2.i3" class="ltx_item" style="list-style-type:none;"><span class="ltx_tag ltx_tag_item">•</span> 
<span id="A4.I2.i3.p1" class="ltx_para ltx_noindent">
<span id="A4.I2.i3.p1.1" class="ltx_p"><span id="A4.I2.i3.p1.1.1" class="ltx_text ltx_font_bold" style="--ltx-fg-color:#000000;">A2 (Medium perturbation)</span><span id="A4.I2.i3.p1.1.2" class="ltx_text" style="--ltx-fg-color:#000000;">: As outlined in </span><span id="A4.I2.i3.p1.1.3" class="ltx_text" style="--ltx-fg-color:#FF0000;">Article II</span><span id="A4.I2.i3.p1.1.4" class="ltx_text" style="--ltx-fg-color:#000000;">, </span><span id="A4.I2.i3.p1.1.5" class="ltx_text" style="--ltx-fg-color:#FF0000;">Part 3</span><span id="A4.I2.i3.p1.1.6" class="ltx_text" style="--ltx-fg-color:#000000;">, Clause 4 of </span><span id="A4.I2.i3.p1.1.7" class="ltx_text" style="--ltx-fg-color:#008080;">the United States Constitution</span><span id="A4.I2.i3.p1.1.8" class="ltx_text" style="--ltx-fg-color:#000000;">, the Vice President serves as the </span><span id="A4.I2.i3.p1.1.9" class="ltx_text" style="--ltx-fg-color:#008080;">ex officio President</span><span id="A4.I2.i3.p1.1.10" class="ltx_text" style="--ltx-fg-color:#000000;"> of the Senate but is </span><span id="A4.I2.i3.p1.1.11" class="ltx_text" style="--ltx-fg-color:#008080;">only</span><span id="A4.I2.i3.p1.1.12" class="ltx_text" style="--ltx-fg-color:#000000;"> permitted to vote to resolve a tie. As per the U.S. Senate, up to </span><span id="A4.I2.i3.p1.1.13" class="ltx_text" style="--ltx-fg-color:#008080;">February 28</span><span id="A4.I2.i3.p1.1.14" class="ltx_text" style="--ltx-fg-color:#000000;">, </span><span id="A4.I2.i3.p1.1.15" class="ltx_text" style="--ltx-fg-color:#FF0000;">2017</span><span id="A4.I2.i3.p1.1.16" class="ltx_text" style="--ltx-fg-color:#000000;">, 36 vice presidents had cast a tie-breaking vote </span><span id="A4.I2.i3.p1.1.17" class="ltx_text" style="--ltx-fg-color:#FF0000;">approximately 275</span><span id="A4.I2.i3.p1.1.18" class="ltx_text" style="--ltx-fg-color:#000000;"> times.</span></span>
</span></span>
<span id="A4.I2.i4" class="ltx_item" style="list-style-type:none;"><span class="ltx_tag ltx_tag_item">•</span> 
<span id="A4.I2.i4.p1" class="ltx_para ltx_noindent">
<span id="A4.I2.i4.p1.1" class="ltx_p"><span id="A4.I2.i4.p1.1.1" class="ltx_text ltx_font_bold" style="--ltx-fg-color:#000000;">A3 (High perturbation)</span><span id="A4.I2.i4.p1.1.2" class="ltx_text" style="--ltx-fg-color:#000000;">: As outlined in </span><span id="A4.I2.i4.p1.1.3" class="ltx_text" style="--ltx-fg-color:#FF0000;">Section II, Part 3</span><span id="A4.I2.i4.p1.1.4" class="ltx_text" style="--ltx-fg-color:#000000;">, Clause 4 of </span><span id="A4.I2.i4.p1.1.5" class="ltx_text" style="--ltx-fg-color:#008080;">the United States Constitution</span><span id="A4.I2.i4.p1.1.6" class="ltx_text" style="--ltx-fg-color:#000000;">, the Vice President serves as an </span><span id="A4.I2.i4.p1.1.7" class="ltx_text" style="--ltx-fg-color:#FF0000;">honorary member</span><span id="A4.I2.i4.p1.1.8" class="ltx_text" style="--ltx-fg-color:#000000;"> of the Senate but is </span><span id="A4.I2.i4.p1.1.9" class="ltx_text" style="--ltx-fg-color:#008080;">only</span><span id="A4.I2.i4.p1.1.10" class="ltx_text" style="--ltx-fg-color:#000000;"> permitted to vote to resolve a tie. As per the U.S. Senate, up to </span><span id="A4.I2.i4.p1.1.11" class="ltx_text" style="--ltx-fg-color:#FF0000;">March 28, 2017</span><span id="A4.I2.i4.p1.1.12" class="ltx_text" style="--ltx-fg-color:#000000;">, 36 vice presidents had cast a tie-breaking vote </span><span id="A4.I2.i4.p1.1.13" class="ltx_text" style="--ltx-fg-color:#FF0000;">approximately 275</span><span id="A4.I2.i4.p1.1.14" class="ltx_text" style="--ltx-fg-color:#000000;"> times.</span></span>
</span></span>
<span id="A4.I2.i5" class="ltx_item" style="list-style-type:none;"><span class="ltx_tag ltx_tag_item">•</span> 
<span id="A4.I2.i5.p1" class="ltx_para ltx_noindent">
<span id="A4.I2.i5.p1.1" class="ltx_p"><span id="A4.I2.i5.p1.1.1" class="ltx_text ltx_font_bold" style="--ltx-fg-color:#000000;">A4 (Severe perturbation)</span><span id="A4.I2.i5.p1.1.2" class="ltx_text" style="--ltx-fg-color:#000000;">: As outlined in </span><span id="A4.I2.i5.p1.1.3" class="ltx_text" style="--ltx-fg-color:#FF0000;">Section II, Part 3</span><span id="A4.I2.i5.p1.1.4" class="ltx_text" style="--ltx-fg-color:#000000;">, Clause 4 of </span><span id="A4.I2.i5.p1.1.5" class="ltx_text" style="--ltx-fg-color:#FF0000;">federal law</span><span id="A4.I2.i5.p1.1.6" class="ltx_text" style="--ltx-fg-color:#000000;">, the Vice President serves as an </span><span id="A4.I2.i5.p1.1.7" class="ltx_text" style="--ltx-fg-color:#FF0000;">honorary member</span><span id="A4.I2.i5.p1.1.8" class="ltx_text" style="--ltx-fg-color:#000000;"> of the Senate but is </span><span id="A4.I2.i5.p1.1.9" class="ltx_text" style="--ltx-fg-color:#FF0000;">freely</span><span id="A4.I2.i5.p1.1.10" class="ltx_text" style="--ltx-fg-color:#000000;"> permitted to vote to resolve a tie. As per the U.S. Senate, up to </span><span id="A4.I2.i5.p1.1.11" class="ltx_text" style="--ltx-fg-color:#FF0000;">March 25, 2017</span><span id="A4.I2.i5.p1.1.12" class="ltx_text" style="--ltx-fg-color:#000000;">, 36 vice presidents had cast a tie-breaking vote </span><span id="A4.I2.i5.p1.1.13" class="ltx_text" style="--ltx-fg-color:#FF0000;">approximately 275</span><span id="A4.I2.i5.p1.1.14" class="ltx_text" style="--ltx-fg-color:#000000;"> times.</span></span>
</span></span>
