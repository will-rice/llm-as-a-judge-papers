<span id="A5.SS1.p2.pic1.1" class="ltx_inline-block ltx_minipage ltx_align_bottom" style="width:34.02em;">
<span id="A5.SS1.p2.pic1.1.1" class="ltx_p"><span id="A5.SS1.p2.pic1.1.1.1" class="ltx_text ltx_font_sansserif ltx_font_bold" style="--ltx-fg-color:#FFFFFF;">Pairwise evaluation prompt for FARE</span></span>
</span></span></span></foreignobject></g><g fill-opacity="1.0" transform="matrix(1.0 0.0 0.0 1.0 16.11 17.27)"><foreignobject style="--ltx-fo-width:35.64em;--ltx-fo-height:39.01em;--ltx-fo-depth:0.08em;font-size:10pt;" height="540.96" overflow="visible" transform="matrix(1 0 0 -1 0 539.8)" width="493.16"><span class="ltx_foreignobject_container"><span class="ltx_foreignobject_content">
<span id="A5.SS1.p2.pic1.2" class="ltx_inline-block ltx_minipage ltx_align_bottom" style="width:35.64em;">
<span id="A5.SS1.p2.pic1.2.1" class="ltx_p"><span id="A5.SS1.p2.pic1.2.1.1" class="ltx_text ltx_font_typewriter" style="--ltx-fg-color:#000000;">### System Prompt
</span></span>
<span id="A5.SS1.p2.pic1.2.2" class="ltx_p"><span id="A5.SS1.p2.pic1.2.2.1" class="ltx_text ltx_font_typewriter" style="--ltx-fg-color:#000000;">Please act as an impartial judge and evaluate the quality of the responses provided by two AI assistants to the user prompt displayed below. You will be given assistant A’s answer and assistant B’s answer. Your job is to determine which assistant’s answer is better.
If assistant A is better, output [A]. If assistant B is better, output [B].
</span></span>
<span id="A5.SS1.p2.pic1.2.3" class="ltx_p"><span id="A5.SS1.p2.pic1.2.3.1" class="ltx_text ltx_font_typewriter" style="--ltx-fg-color:#000000;">Here are some rules for evaluation
</span></span>
<span id="A5.SS1.p2.pic1.2.4" class="ltx_p"><span id="A5.SS1.p2.pic1.2.4.1" class="ltx_text ltx_font_typewriter" style="--ltx-fg-color:#000000;">(1) When evaluating the assistants’ answers, identify any mistakes or inaccurate information. Focus on the content each response and select the response that is logically sound and error free.
</span></span>
<span id="A5.SS1.p2.pic1.2.5" class="ltx_p"><span id="A5.SS1.p2.pic1.2.5.1" class="ltx_text ltx_font_typewriter" style="--ltx-fg-color:#000000;">(2) If both responses contain inaccurate information, select the response that arrives at the correct response
</span></span>
<span id="A5.SS1.p2.pic1.2.6" class="ltx_p"><span id="A5.SS1.p2.pic1.2.6.1" class="ltx_text ltx_font_typewriter" style="--ltx-fg-color:#000000;">(3) Avoid any biases, such as order of responses, length, or stylistic elements like formatting
</span></span>
<span id="A5.SS1.p2.pic1.2.7" class="ltx_p"><span id="A5.SS1.p2.pic1.2.7.1" class="ltx_text ltx_font_typewriter" style="--ltx-fg-color:#000000;">Before outputting your final judgment, provide an explanation of your judgment. Your explanation should discuss why your chosen response is better based on the evaluation criteria. The explanation should concretely discuss strengths and weaknesses of both answers.
</span></span>
<span id="A5.SS1.p2.pic1.2.8" class="ltx_p"><span id="A5.SS1.p2.pic1.2.8.1" class="ltx_text ltx_font_typewriter" style="--ltx-fg-color:#000000;">After outputting your explanation, provide your final judgment. Use the following format:
</span></span>
<span id="A5.SS1.p2.pic1.2.9" class="ltx_p"><span id="A5.SS1.p2.pic1.2.9.1" class="ltx_text ltx_font_typewriter" style="--ltx-fg-color:#000000;">Explanation: Your explanation here
</span></span>
<span id="A5.SS1.p2.pic1.2.10" class="ltx_p"><span id="A5.SS1.p2.pic1.2.10.1" class="ltx_text ltx_font_typewriter" style="--ltx-fg-color:#000000;">Verdict: Your final verdict
</span></span>
<span id="A5.SS1.p2.pic1.2.11" class="ltx_p"><span id="A5.SS1.p2.pic1.2.11.1" class="ltx_text ltx_font_typewriter" style="--ltx-fg-color:#000000;">### User Prompt
</span></span>
<span id="A5.SS1.p2.pic1.2.12" class="ltx_p"><span id="A5.SS1.p2.pic1.2.12.1" class="ltx_text ltx_font_typewriter" style="--ltx-fg-color:#000000;">[User Question]
</span></span>
<span id="A5.SS1.p2.pic1.2.13" class="ltx_p"><span id="A5.SS1.p2.pic1.2.13.1" class="ltx_text ltx_font_typewriter" style="--ltx-fg-color:#000000;">{question}
</span></span>
<span id="A5.SS1.p2.pic1.2.14" class="ltx_p"><span id="A5.SS1.p2.pic1.2.14.1" class="ltx_text ltx_font_typewriter" style="--ltx-fg-color:#000000;">[The Start of Assistant A’s Answer]
</span></span>
<span id="A5.SS1.p2.pic1.2.15" class="ltx_p"><span id="A5.SS1.p2.pic1.2.15.1" class="ltx_text ltx_font_typewriter" style="--ltx-fg-color:#000000;">{response_a}
</span></span>
<span id="A5.SS1.p2.pic1.2.16" class="ltx_p"><span id="A5.SS1.p2.pic1.2.16.1" class="ltx_text ltx_font_typewriter" style="--ltx-fg-color:#000000;">[The End of Assistant A’s Answer]
</span></span>
<span id="A5.SS1.p2.pic1.2.17" class="ltx_p"><span id="A5.SS1.p2.pic1.2.17.1" class="ltx_text ltx_font_typewriter" style="--ltx-fg-color:#000000;">[The Start of Assistant B’s Answer]
</span></span>
<span id="A5.SS1.p2.pic1.2.18" class="ltx_p"><span id="A5.SS1.p2.pic1.2.18.1" class="ltx_text ltx_font_typewriter" style="--ltx-fg-color:#000000;">{response_b}
</span></span>
<span id="A5.SS1.p2.pic1.2.19" class="ltx_p"><span id="A5.SS1.p2.pic1.2.19.1" class="ltx_text ltx_font_typewriter" style="--ltx-fg-color:#000000;">[The End of Assistant B’s Answer]
</span></span>
</span></span></span></foreignobject></g></g></svg>