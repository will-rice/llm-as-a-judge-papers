<span id="A3.I9.i2.p1.1" class="ltx_p"><span id="A3.I9.i2.p1.1.1" class="ltx_text ltx_font_typewriter" style="font-size:90%;--ltx-fg-color:#000000;">**Explanation:** ‘‘{explanation_a}’’
</span></span>
</span></span>
</span>
<span id="A3.SS5.p1.pic1.2.5" class="ltx_p"><span id="A3.SS5.p1.pic1.2.5.1" class="ltx_text ltx_font_typewriter" style="font-size:90%;--ltx-fg-color:#000000;">**Error B:**
</span></span>
