</span></span></span></foreignobject></g><g fill-opacity="1.0" transform="matrix(1.0 0.0 0.0 1.0 20.79 16.03)"><foreignobject style="--ltx-fo-width:44.75em;--ltx-fo-height:65.53em;--ltx-fo-depth:0.23em;font-size:10pt;" height="909.79" overflow="visible" transform="matrix(1 0 0 -1 0 906.68)" width="619.21"><span class="ltx_foreignobject_container"><span class="ltx_foreignobject_content">
<span id="A2.F13.pic1.2" class="ltx_inline-block ltx_minipage ltx_align_bottom" style="width:44.75em;">
<span id="A2.F13.pic1.2.1" class="ltx_p"><span id="A2.F13.pic1.2.1.1" class="ltx_text ltx_font_typewriter ltx_font_bold" style="font-size:90%;--ltx-fg-color:#000000;">Role:<span id="A2.F13.pic1.2.1.1.1" class="ltx_text ltx_font_medium"> You are a Senior Medical Examiner.
</span></span></span>
<span id="A2.F13.pic1.2.2" class="ltx_p"><span id="A2.F13.pic1.2.2.1" class="ltx_text ltx_font_typewriter ltx_font_bold" style="font-size:90%;--ltx-fg-color:#000000;">Task:<span id="A2.F13.pic1.2.2.1.1" class="ltx_text ltx_font_medium"> Transform the provided </span>Physician Advice (<math id="A2.F13.pic1.m1" class="ltx_Math" alttext="L_{A}" display="inline" intent=":literal"><semantics><msub><mi style="--ltx-fg-color:#000000;" mathcolor="#000000">L</mi><mi style="--ltx-fg-color:#000000;" mathcolor="#000000">A</mi></msub><annotation encoding="application/x-tex">L_{A}</annotation></semantics></math>)<span id="A2.F13.pic1.2.2.1.2" class="ltx_text ltx_font_medium"> into a structured evaluation rubric <math id="A2.F13.pic1.m2" class="ltx_Math" alttext="R" display="inline" intent=":literal"><semantics><mi style="--ltx-fg-color:#000000;" mathcolor="#000000">R</mi><annotation encoding="application/x-tex">R</annotation></semantics></math> consisting of binary criteria. You must tailor the rubric based on the assigned </span>Theme<span id="A2.F13.pic1.2.2.1.3" class="ltx_text ltx_font_medium">.
</span></span></span>
<span id="A2.F13.pic1.2.3" class="ltx_p"><span id="A2.F13.pic1.2.3.1" class="ltx_text ltx_font_typewriter ltx_font_bold" style="font-size:90%;--ltx-fg-color:#000000;">Input:<span id="A2.F13.pic1.2.3.1.1" class="ltx_text ltx_font_medium">
</span></span></span>
<span id="A2.I14" class="ltx_itemize">
<span id="A2.I14.i1" class="ltx_item" style="list-style-type:none;"><span class="ltx_tag ltx_tag_item">•</span> 
<span id="A2.I14.i1.p1" class="ltx_para">
<span id="A2.I14.i1.p1.1" class="ltx_p"><span id="A2.I14.i1.p1.1.1" class="ltx_text ltx_font_typewriter ltx_font_bold" style="font-size:90%;--ltx-fg-color:#000000;">User Query (<math id="A2.I14.i1.p1.m1" class="ltx_Math" alttext="Q" display="inline" intent=":literal"><semantics><mi style="--ltx-fg-color:#000000;" mathcolor="#000000">Q</mi><annotation encoding="application/x-tex">Q</annotation></semantics></math>):</span><span id="A2.I14.i1.p1.1.2" class="ltx_text ltx_font_typewriter" style="font-size:90%;--ltx-fg-color:#000000;"> [Query String]
</span></span>
</span></span>
<span id="A2.I14.i2" class="ltx_item" style="list-style-type:none;"><span class="ltx_tag ltx_tag_item">•</span> 
<span id="A2.I14.i2.p1" class="ltx_para">
<span id="A2.I14.i2.p1.1" class="ltx_p"><span id="A2.I14.i2.p1.1.1" class="ltx_text ltx_font_typewriter ltx_font_bold" style="font-size:90%;--ltx-fg-color:#000000;">Physician Advice (<math id="A2.I14.i2.p1.m1" class="ltx_Math" alttext="L_{A}" display="inline" intent=":literal"><semantics><msub><mi style="--ltx-fg-color:#000000;" mathcolor="#000000">L</mi><mi style="--ltx-fg-color:#000000;" mathcolor="#000000">A</mi></msub><annotation encoding="application/x-tex">L_{A}</annotation></semantics></math>):</span><span id="A2.I14.i2.p1.1.2" class="ltx_text ltx_font_typewriter" style="font-size:90%;--ltx-fg-color:#000000;"> [Verified Doctor’s Response]
</span></span>
</span></span>
<span id="A2.I14.i3" class="ltx_item" style="list-style-type:none;"><span class="ltx_tag ltx_tag_item">•</span> 
<span id="A2.I14.i3.p1" class="ltx_para">
<span id="A2.I14.i3.p1.1" class="ltx_p"><span id="A2.I14.i3.p1.1.1" class="ltx_text ltx_font_typewriter ltx_font_bold" style="font-size:90%;--ltx-fg-color:#000000;">Assigned Theme:</span><span id="A2.I14.i3.p1.1.2" class="ltx_text ltx_font_typewriter" style="font-size:90%;--ltx-fg-color:#000000;"> [e.g., Emergency Referrals, Response Depth, etc.]
</span></span>
</span></span>
</span>
<span id="A2.F13.pic1.2.4" class="ltx_p"><span id="A2.F13.pic1.2.4.1" class="ltx_text ltx_font_typewriter ltx_font_bold" style="font-size:90%;--ltx-fg-color:#000000;">Instructions (Step-by-Step):<span id="A2.F13.pic1.2.4.1.1" class="ltx_text ltx_font_medium">
</span></span></span>
<span id="A2.I15" class="ltx_enumerate">
<span id="A2.I15.i1" class="ltx_item" style="list-style-type:none;"><span class="ltx_tag ltx_tag_item">(1)</span> 
<span id="A2.I15.i1.p1" class="ltx_para">
<span id="A2.I15.i1.p1.1" class="ltx_p"><span id="A2.I15.i1.p1.1.1" class="ltx_text ltx_font_typewriter ltx_font_bold" style="font-size:90%;--ltx-fg-color:#000000;">Step 1: Theme-Guided Fact Extraction:</span><span id="A2.I15.i1.p1.1.2" class="ltx_text ltx_font_typewriter" style="font-size:90%;--ltx-fg-color:#000000;">
Filter </span><math id="A2.I15.i1.p1.m1" class="ltx_Math" alttext="L_{A}" display="inline" intent=":literal"><semantics><msub><mi style="--ltx-fg-color:#000000;" mathcolor="#000000" mathsize="0.900em">L</mi><mi style="--ltx-fg-color:#000000;" mathcolor="#000000" mathsize="0.900em">A</mi></msub><annotation encoding="application/x-tex">L_{A}</annotation></semantics></math><span id="A2.I15.i1.p1.1.3" class="ltx_text ltx_font_typewriter" style="font-size:90%;--ltx-fg-color:#000000;"> to extract ONLY medical facts relevant to the </span><span id="A2.I15.i1.p1.1.4" class="ltx_text ltx_font_typewriter ltx_font_bold" style="font-size:90%;--ltx-fg-color:#000000;">Assigned Theme</span><span id="A2.I15.i1.p1.1.5" class="ltx_text ltx_font_typewriter" style="font-size:90%;--ltx-fg-color:#000000;">.
</span></span>
<span id="A2.I15.i1.I1" class="ltx_itemize">
<span id="A2.I15.i1.I0.i1" class="ltx_item" style="list-style-type:none;"><span class="ltx_tag ltx_tag_item">•</span> 
<span id="A2.I15.i1.I0.i1.p1" class="ltx_para">
<span id="A2.I15.i1.I0.i1.p1.1" class="ltx_p"><span id="A2.I15.i1.I0.i1.p1.1.1" class="ltx_text ltx_font_typewriter ltx_font_italic" style="font-size:90%;--ltx-fg-color:#000000;">Example:</span><span id="A2.I15.i1.I0.i1.p1.1.2" class="ltx_text ltx_font_typewriter" style="font-size:90%;--ltx-fg-color:#000000;"> If Theme is &quot;Emergency Referrals&quot;, ignore diet advice.
</span></span>
</span></span>
</span>
</span></span>
<span id="A2.I15.i2" class="ltx_item" style="list-style-type:none;"><span class="ltx_tag ltx_tag_item">(2)</span> 
<span id="A2.I15.i2.p1" class="ltx_para">
<span id="A2.I15.i2.p1.1" class="ltx_p"><span id="A2.I15.i2.p1.1.1" class="ltx_text ltx_font_typewriter ltx_font_bold" style="font-size:90%;--ltx-fg-color:#000000;">Step 2: Bipolar Criterion Formulation:</span><span id="A2.I15.i2.p1.1.2" class="ltx_text ltx_font_typewriter" style="font-size:90%;--ltx-fg-color:#000000;">
Convert facts into binary &quot;Yes/No&quot; questions (</span><math id="A2.I15.i2.p1.m1" class="ltx_Math" alttext="c_{j}" display="inline" intent=":literal"><semantics><msub><mi style="--ltx-fg-color:#000000;" mathcolor="#000000" mathsize="0.900em">c</mi><mi style="--ltx-fg-color:#000000;" mathcolor="#000000" mathsize="0.900em">j</mi></msub><annotation encoding="application/x-tex">c_{j}</annotation></semantics></math><span id="A2.I15.i2.p1.1.3" class="ltx_text ltx_font_typewriter" style="font-size:90%;--ltx-fg-color:#000000;">).
</span></span>
<span id="A2.I15.i2.I1" class="ltx_itemize">
<span id="A2.I15.i2.I0.i1" class="ltx_item" style="list-style-type:none;"><span class="ltx_tag ltx_tag_item">•</span> 
<span id="A2.I15.i2.I0.i1.p1" class="ltx_para">
<span id="A2.I15.i2.I0.i1.p1.1" class="ltx_p"><span id="A2.I15.i2.I0.i1.p1.1.1" class="ltx_text ltx_font_typewriter ltx_font_bold" style="font-size:90%;--ltx-fg-color:#000000;">Positive Criteria:</span><span id="A2.I15.i2.I0.i1.p1.1.2" class="ltx_text ltx_font_typewriter" style="font-size:90%;--ltx-fg-color:#000000;"> Check for inclusion of correct facts (e.g., &quot;Does the model mention symptom X?&quot;).
</span></span>
</span></span>
<span id="A2.I15.i2.I0.i2" class="ltx_item" style="list-style-type:none;"><span class="ltx_tag ltx_tag_item">•</span> 
<span id="A2.I15.i2.I0.i2.p1" class="ltx_para">
<span id="A2.I15.i2.I0.i2.p1.1" class="ltx_p"><span id="A2.I15.i2.I0.i2.p1.1.1" class="ltx_text ltx_font_typewriter ltx_font_bold" style="font-size:90%;--ltx-fg-color:#000000;">Negative Criteria:</span><span id="A2.I15.i2.I0.i2.p1.1.2" class="ltx_text ltx_font_typewriter" style="font-size:90%;--ltx-fg-color:#000000;"> Check for hallucinations or dangerous contradictions (e.g., &quot;Does the model incorrectly suggest drug Y?&quot;).
</span></span>
</span></span>
</span>
</span></span>
<span id="A2.I15.i3" class="ltx_item" style="list-style-type:none;"><span class="ltx_tag ltx_tag_item">(3)</span> 
<span id="A2.I15.i3.p1" class="ltx_para">
<span id="A2.I15.i3.p1.1" class="ltx_p"><span id="A2.I15.i3.p1.1.1" class="ltx_text ltx_font_typewriter ltx_font_bold" style="font-size:90%;--ltx-fg-color:#000000;">Step 3: Axis &amp; Weighting (<math id="A2.I15.i3.p1.m1" class="ltx_Math" alttext="w_{j}" display="inline" intent=":literal"><semantics><msub><mi style="--ltx-fg-color:#000000;" mathcolor="#000000">w</mi><mi style="--ltx-fg-color:#000000;" mathcolor="#000000">j</mi></msub><annotation encoding="application/x-tex">w_{j}</annotation></semantics></math>):</span><span id="A2.I15.i3.p1.1.2" class="ltx_text ltx_font_typewriter" style="font-size:90%;--ltx-fg-color:#000000;">
Assign an </span><span id="A2.I15.i3.p1.1.3" class="ltx_text ltx_font_typewriter ltx_font_bold" style="font-size:90%;--ltx-fg-color:#000000;">Axis</span><span id="A2.I15.i3.p1.1.4" class="ltx_text ltx_font_typewriter" style="font-size:90%;--ltx-fg-color:#000000;"> (Accuracy, Safety, Completeness, Context, Communication) and a </span><span id="A2.I15.i3.p1.1.5" class="ltx_text ltx_font_typewriter ltx_font_bold" style="font-size:90%;--ltx-fg-color:#000000;">Weight</span><span id="A2.I15.i3.p1.1.6" class="ltx_text ltx_font_typewriter" style="font-size:90%;--ltx-fg-color:#000000;"> (</span><math id="A2.I15.i3.p1.m2" class="ltx_Math" alttext="[-10,10]" display="inline" intent=":literal"><semantics><mrow><mo style="--ltx-fg-color:#000000;" mathcolor="#000000" maxsize="0.900em" minsize="0.900em">[</mo><mrow><mrow><mo style="--ltx-fg-color:#000000;" mathcolor="#000000" mathsize="0.900em">−</mo><mn style="--ltx-fg-color:#000000;" mathcolor="#000000" mathsize="0.900em">10</mn></mrow><mo style="--ltx-fg-color:#000000;" mathcolor="#000000" mathsize="0.900em">,</mo><mn style="--ltx-fg-color:#000000;" mathcolor="#000000" mathsize="0.900em">10</mn></mrow><mo style="--ltx-fg-color:#000000;" mathcolor="#000000" maxsize="0.900em" minsize="0.900em">]</mo></mrow><annotation encoding="application/x-tex">[-10,10]</annotation></semantics></math><span id="A2.I15.i3.p1.1.7" class="ltx_text ltx_font_typewriter" style="font-size:90%;--ltx-fg-color:#000000;">) to each criterion.
</span></span>
<span id="A2.I15.i3.I1" class="ltx_itemize">
<span id="A2.I15.i3.I0.i1" class="ltx_item" style="list-style-type:none;"><span class="ltx_tag ltx_tag_item">•</span> 
<span id="A2.I15.i3.I0.i1.p1" class="ltx_para">
<span id="A2.I15.i3.I0.i1.p1.1" class="ltx_p"><span id="A2.I15.i3.I0.i1.p1.1.1" class="ltx_text ltx_font_typewriter ltx_font_bold" style="font-size:90%;--ltx-fg-color:#000000;">+1 to +10:</span><span id="A2.I15.i3.I0.i1.p1.1.2" class="ltx_text ltx_font_typewriter" style="font-size:90%;--ltx-fg-color:#000000;"> Reward for correct info (Higher = more critical).
</span></span>
</span></span>
<span id="A2.I15.i3.I0.i2" class="ltx_item" style="list-style-type:none;"><span class="ltx_tag ltx_tag_item">•</span> 
<span id="A2.I15.i3.I0.i2.p1" class="ltx_para">
<span id="A2.I15.i3.I0.i2.p1.1" class="ltx_p"><span id="A2.I15.i3.I0.i2.p1.1.1" class="ltx_text ltx_font_typewriter ltx_font_bold" style="font-size:90%;--ltx-fg-color:#000000;">-1 to -10:</span><span id="A2.I15.i3.I0.i2.p1.1.2" class="ltx_text ltx_font_typewriter" style="font-size:90%;--ltx-fg-color:#000000;"> Penalty for misinformation/safety risks (Lower = more dangerous).
</span></span>
</span></span>
<span id="A2.I15.i3.I0.i3" class="ltx_item" style="list-style-type:none;"><span class="ltx_tag ltx_tag_item">•</span> 
<span id="A2.I15.i3.I0.i3.p1" class="ltx_para">
<span id="A2.I15.i3.I0.i3.p1.1" class="ltx_p"><span id="A2.I15.i3.I0.i3.p1.1.1" class="ltx_text ltx_font_typewriter ltx_font_italic" style="font-size:90%;--ltx-fg-color:#000000;">Criticality:</span><span id="A2.I15.i3.I0.i3.p1.1.2" class="ltx_text ltx_font_typewriter" style="font-size:90%;--ltx-fg-color:#000000;"> </span><math id="A2.I15.i3.I0.i3.p1.m1" class="ltx_Math" alttext="w=\pm 10" display="inline" intent=":literal"><semantics><mrow><mi style="--ltx-fg-color:#000000;" mathcolor="#000000" mathsize="0.900em">w</mi><mo style="--ltx-fg-color:#000000;" mathcolor="#000000" mathsize="0.900em">=</mo><mrow><mo style="--ltx-fg-color:#000000;" mathcolor="#000000" mathsize="0.900em">±</mo><mn style="--ltx-fg-color:#000000;" mathcolor="#000000" mathsize="0.900em">10</mn></mrow></mrow><annotation encoding="application/x-tex">w=\pm 10</annotation></semantics></math><span id="A2.I15.i3.I0.i3.p1.1.3" class="ltx_text ltx_font_typewriter" style="font-size:90%;--ltx-fg-color:#000000;"> is for life-threatening issues; </span><math id="A2.I15.i3.I0.i3.p1.m2" class="ltx_Math" alttext="w=\pm 1" display="inline" intent=":literal"><semantics><mrow><mi style="--ltx-fg-color:#000000;" mathcolor="#000000" mathsize="0.900em">w</mi><mo style="--ltx-fg-color:#000000;" mathcolor="#000000" mathsize="0.900em">=</mo><mrow><mo style="--ltx-fg-color:#000000;" mathcolor="#000000" mathsize="0.900em">±</mo><mn style="--ltx-fg-color:#000000;" mathcolor="#000000" mathsize="0.900em">1</mn></mrow></mrow><annotation encoding="application/x-tex">w=\pm 1</annotation></semantics></math><span id="A2.I15.i3.I0.i3.p1.1.4" class="ltx_text ltx_font_typewriter" style="font-size:90%;--ltx-fg-color:#000000;"> is for minor details.
</span></span>
</span></span>
</span>
</span></span>
</span>
<span id="A2.F13.pic1.2.5" class="ltx_p"><span id="A2.F13.pic1.2.5.1" class="ltx_text ltx_font_typewriter ltx_font_bold" style="font-size:90%;--ltx-fg-color:#000000;">Output Format (JSON):<span id="A2.F13.pic1.2.5.1.1" class="ltx_text ltx_font_medium">
</span></span></span><pre id="A2.F13.pic1.2.6" class="ltx_verbatim ltx_font_typewriter" style="font-size:90%;--ltx-fg-color:#000000;">
[
  {
    &quot;question&quot;: &quot;Does the model identify the likely cause as Norovirus?&quot;,
    &quot;axis&quot;: &quot;Accuracy&quot;,
    &quot;weight&quot;: 10
  },
  {
    &quot;question&quot;: &quot;Does the model recommend antibiotics (contraindicated)?&quot;,
    &quot;axis&quot;: &quot;Safety&quot;,
    &quot;weight&quot;: -10
  }
]
</pre>
</span></span></span></foreignobject></g></g></svg>