<svg id="A6.SS1.p3.pic1" class="ltx_picture" height="958.04" overflow="visible" version="1.1" viewbox="0 0 653.15 958.04" width="653.15"><g style="--ltx-stroke-color:#000000;--ltx-fill-color:#000000;" fill="#000000" stroke="#000000" stroke-width="0.4pt" transform="translate(0,958.04) matrix(1 0 0 -1 0 0)"><g style="--ltx-fill-color:#000000;" fill="#000000" fill-opacity="1.0"><path style="stroke:none" d="M 0 8.57 L 0 949.47 C 0 954.2 3.84 958.04 8.57 958.04 L 644.58 958.04 C 649.31 958.04 653.15 954.2 653.15 949.47 L 653.15 8.57 C 653.15 3.84 649.31 0 644.58 0 L 8.57 0 C 3.84 0 0 3.84 0 8.57 Z" /></g><g style="--ltx-fill-color:#FFFFFF;" fill="#FFFFFF" fill-opacity="1.0"><path style="stroke:none" d="M 0.69 8.57 L 0.69 936.48 L 652.46 936.48 L 652.46 8.57 C 652.46 4.22 648.93 0.69 644.58 0.69 L 8.57 0.69 C 4.22 0.69 0.69 4.22 0.69 8.57 Z" /></g><g fill-opacity="1.0" transform="matrix(1.0 0.0 0.0 1.0 12.5 943.8)"><foreignobject style="--ltx-fo-width:45.4em;--ltx-fo-height:0.69em;--ltx-fo-depth:0.19em;font-size:10pt;" height="12.3" overflow="visible" transform="matrix(1 0 0 -1 0 9.61)" width="628.21"><span class="ltx_foreignobject_container"><span class="ltx_foreignobject_content">
<span id="A6.SS1.p3.pic1.1" class="ltx_inline-block ltx_minipage ltx_align_bottom" style="width:45.4em;">
<span id="A6.SS1.p3.pic1.1.1" class="ltx_p"><span id="A6.SS1.p3.pic1.1.1.1" class="ltx_text" style="--ltx-fg-color:#FFFFFF;">Prompt for rubric decomposition.</span></span>
</span></span></span></foreignobject></g><g fill-opacity="1.0" transform="matrix(1.0 0.0 0.0 1.0 12.5 55.17)"><foreignobject style="--ltx-fo-width:45.4em;--ltx-fo-height:62.84em;--ltx-fo-depth:3.08em;font-size:10pt;" height="912.18" overflow="visible" transform="matrix(1 0 0 -1 0 869.51)" width="628.21"><span class="ltx_foreignobject_container"><span class="ltx_foreignobject_content">
<span id="A6.SS1.p3.pic1.2" class="ltx_inline-block ltx_minipage ltx_align_bottom" style="width:45.4em;">
<span id="A6.SS1.p3.pic1.2.1" class="ltx_p"><span id="A6.SS1.p3.pic1.2.1.1" class="ltx_text" style="--ltx-fg-color:#000000;">Role: You are a rubric designer for an LLM-as-judge system.</span></span>
<span id="A6.SS1.p3.pic1.2.2" class="ltx_p"><span id="A6.SS1.p3.pic1.2.2.1" class="ltx_text" style="--ltx-fg-color:#000000;">Inputs you will receive:</span></span>
<span id="A6.I15" class="ltx_itemize" style="--ltx-enum-leftmargin:1.2em;">
<span id="A6.I15.i1" class="ltx_item" style="list-style-type:none;"><span class="ltx_tag ltx_tag_item">•</span> 
<span id="A6.I15.i1.p1" class="ltx_para">
<span id="A6.I15.i1.p1.1" class="ltx_p"><span id="A6.I15.i1.p1.1.1" class="ltx_text" style="--ltx-fg-color:#000000;">Prompt: the task/question the response must answer.</span></span>
</span></span>
<span id="A6.I15.i2" class="ltx_item" style="list-style-type:none;"><span class="ltx_tag ltx_tag_item">•</span> 
<span id="A6.I15.i2.p1" class="ltx_para">
<span id="A6.I15.i2.p1.1" class="ltx_p"><span id="A6.I15.i2.p1.1.1" class="ltx_text" style="--ltx-fg-color:#000000;">Responses: a set of responses to be evaluated against rubrics.</span></span>
</span></span>
<span id="A6.I15.i3" class="ltx_item" style="list-style-type:none;"><span class="ltx_tag ltx_tag_item">•</span> 
<span id="A6.I15.i3.p1" class="ltx_para">
<span id="A6.I15.i3.p1.1" class="ltx_p"><span id="A6.I15.i3.p1.1.1" class="ltx_text" style="--ltx-fg-color:#000000;">Current rubric: criterion currently used by a judge. This rubric has already been satisfied by multiple responses, so it is too coarse and fail to distinguish response quality.</span></span>
</span></span>
<span id="A6.I15.i4" class="ltx_item" style="list-style-type:none;"><span class="ltx_tag ltx_tag_item">•</span> 
<span id="A6.I15.i4.p1" class="ltx_para">
<span id="A6.I15.i4.p1.1" class="ltx_p"><span id="A6.I15.i4.p1.1.1" class="ltx_text" style="--ltx-fg-color:#000000;">Other rubrics: Other rubrics that the new rubric must NOT overlap with.</span></span>
</span></span>
</span>
<span id="A6.SS1.p3.pic1.2.3" class="ltx_p"><span id="A6.SS1.p3.pic1.2.3.1" class="ltx_text" style="--ltx-fg-color:#000000;">Goal: Propose exactly TWO new rubrics that are more granular than the existing ones and can better differentiate candidate responses. Only write rubrics you are confident about. Only propose the best new rubrics.</span></span>
<span id="A6.SS1.p3.pic1.2.4" class="ltx_p"><span id="A6.SS1.p3.pic1.2.4.1" class="ltx_text" style="--ltx-fg-color:#000000;">What “more granular” means (requirements):</span></span>
<span id="A6.I16" class="ltx_itemize" style="--ltx-enum-leftmargin:1.2em;">
<span id="A6.I16.i1" class="ltx_item" style="list-style-type:none;"><span class="ltx_tag ltx_tag_item">•</span> 
<span id="A6.I16.i1.p1" class="ltx_para">
<span id="A6.I16.i1.p1.1" class="ltx_p"><span id="A6.I16.i1.p1.1.1" class="ltx_text" style="--ltx-fg-color:#000000;">Each new rubric must target a specific, discriminative dimension of quality that is not sufficiently captured by the existing rubrics (e.g., completeness of key sub-steps, correctness of constraints, justification quality, handling of edge cases, faithfulness to prompt format, etc.).</span></span>
</span></span>
<span id="A6.I16.i2" class="ltx_item" style="list-style-type:none;"><span class="ltx_tag ltx_tag_item">•</span> 
<span id="A6.I16.i2.p1" class="ltx_para">
<span id="A6.I16.i2.p1.1" class="ltx_p"><span id="A6.I16.i2.p1.1.1" class="ltx_text" style="--ltx-fg-color:#000000;">New rubrics should NOT miss critical information contained in the existing rubric.</span></span>
</span></span>
<span id="A6.I16.i3" class="ltx_item" style="list-style-type:none;"><span class="ltx_tag ltx_tag_item">•</span> 
<span id="A6.I16.i3.p1" class="ltx_para">
<span id="A6.I16.i3.p1.1" class="ltx_p"><span id="A6.I16.i3.p1.1.1" class="ltx_text" style="--ltx-fg-color:#000000;">Each rubric must be consistently judgeable across many responses (avoid vague wording like “good”, “nice”, “high-quality”).</span></span>
</span></span>
<span id="A6.I16.i4" class="ltx_item" style="list-style-type:none;"><span class="ltx_tag ltx_tag_item">•</span> 
<span id="A6.I16.i4.p1" class="ltx_para">
<span id="A6.I16.i4.p1.1" class="ltx_p"><span id="A6.I16.i4.p1.1.1" class="ltx_text" style="--ltx-fg-color:#000000;">Each rubric must be prompt-specific (tied to what the user asked), not generic writing advice.</span></span>
</span></span>
<span id="A6.I16.i5" class="ltx_item" style="list-style-type:none;"><span class="ltx_tag ltx_tag_item">•</span> 
<span id="A6.I16.i5.p1" class="ltx_para">
<span id="A6.I16.i5.p1.1" class="ltx_p"><span id="A6.I16.i5.p1.1.1" class="ltx_text" style="--ltx-fg-color:#000000;">Each rubric should be written as a single criterion with clear, binary pass/fail boundaries. Prefer objective checks.</span></span>
</span></span>
<span id="A6.I16.i6" class="ltx_item" style="list-style-type:none;"><span class="ltx_tag ltx_tag_item">•</span> 
<span id="A6.I16.i6.p1" class="ltx_para">
<span id="A6.I16.i6.p1.1" class="ltx_p"><span id="A6.I16.i6.p1.1.1" class="ltx_text" style="--ltx-fg-color:#000000;">New rubric MUST NOT repeat any of the responses provided.</span></span>
</span></span>
<span id="A6.I16.i7" class="ltx_item" style="list-style-type:none;"><span class="ltx_tag ltx_tag_item">•</span> 
<span id="A6.I16.i7.p1" class="ltx_para">
<span id="A6.I16.i7.p1.1" class="ltx_p"><span id="A6.I16.i7.p1.1.1" class="ltx_text" style="--ltx-fg-color:#000000;">New rubric MUST NOT answer the question directly.</span></span>
</span></span>
</span>
<span id="A6.SS1.p3.pic1.2.5" class="ltx_p"><span id="A6.SS1.p3.pic1.2.5.1" class="ltx_text" style="--ltx-fg-color:#000000;">Tips for writing good rubrics:</span></span>
<span id="A6.SS1.p3.pic1.2.6" class="ltx_p"><span id="A6.SS1.p3.pic1.2.6.1" class="ltx_text ltx_font_italic" style="--ltx-fg-color:#000000;">The same as those in the prompt for initial rubric generation. These have been omitted here for brevity.<span id="A6.SS1.p3.pic1.2.6.1.1" class="ltx_text"></span></span></span>
<span id="A6.SS1.p3.pic1.2.7" class="ltx_p"><span id="A6.SS1.p3.pic1.2.7.1" class="ltx_text" style="--ltx-fg-color:#000000;">Below are the inputs:</span></span>
<span id="A6.I17" class="ltx_itemize" style="--ltx-enum-leftmargin:1.2em;">
<span id="A6.I17.i1" class="ltx_item" style="list-style-type:none;"><span class="ltx_tag ltx_tag_item">•</span> 
<span id="A6.I17.i1.p1" class="ltx_para">
<span id="A6.I17.i1.p1.1" class="ltx_p"><span id="A6.I17.i1.p1.1.1" class="ltx_text ltx_font_typewriter" style="--ltx-fg-color:#000000;">Here is the user prompt for which we want to generate a rubric:</span><span id="A6.I17.i1.p1.1.2" class="ltx_text" style="--ltx-fg-color:#000000;">]</span>
<br class="ltx_break"><span id="A6.I17.i1.p1.1.3" class="ltx_text ltx_font_typewriter" style="--ltx-fg-color:#000000;">PROMPT: {prompt}</span></span>
</span></span>
<span id="A6.I17.i2" class="ltx_item" style="list-style-type:none;"><span class="ltx_tag ltx_tag_item">•</span> 
<span id="A6.I17.i2.p1" class="ltx_para">
<span id="A6.I17.i2.p1.1" class="ltx_p"><span id="A6.I17.i2.p1.1.1" class="ltx_text ltx_font_typewriter" style="--ltx-fg-color:#000000;">Here are a list of reference responses:
<br class="ltx_break">RESPONSES: {responses}</span></span>
</span></span>
<span id="A6.I17.i3" class="ltx_item" style="list-style-type:none;"><span class="ltx_tag ltx_tag_item">•</span> 
<span id="A6.I17.i3.p1" class="ltx_para">
<span id="A6.I17.i3.p1.1" class="ltx_p"><span id="A6.I17.i3.p1.1.1" class="ltx_text ltx_font_typewriter" style="--ltx-fg-color:#000000;">Here is existing rubric to improve:
<br class="ltx_break">RUBRIC: {rubric}</span></span>
</span></span>
<span id="A6.I17.i4" class="ltx_item" style="list-style-type:none;"><span class="ltx_tag ltx_tag_item">•</span> 
<span id="A6.I17.i4.p1" class="ltx_para">
<span id="A6.I17.i4.p1.1" class="ltx_p"><span id="A6.I17.i4.p1.1.1" class="ltx_text ltx_font_typewriter" style="--ltx-fg-color:#000000;">Here is other rubric that the new rubric should NOT overlap with:
<br class="ltx_break">OTHER RUBRIC: {other_rubric}</span></span>
</span></span>
</span>
<span id="A6.SS1.p3.pic1.2.8" class="ltx_p"><span id="A6.SS1.p3.pic1.2.8.1" class="ltx_text" style="--ltx-fg-color:#000000;">Output STRICTLY in below format. No other text is allowed:</span></span>
<span id="A6.I18" class="ltx_itemize" style="--ltx-enum-leftmargin:1.2em;">
<span id="A6.I18.i1" class="ltx_item" style="list-style-type:none;"><span class="ltx_tag ltx_tag_item">•</span> 
<span id="A6.I18.i1.p1" class="ltx_para">
<span id="A6.I18.i1.p1.1" class="ltx_p"><span id="A6.I18.i1.p1.1.1" class="ltx_text ltx_font_typewriter" style="--ltx-fg-color:#000000;">&lt;RUBRIC&gt; New rubric 1 &lt;/RUBRIC&gt;</span></span>
</span></span>
<span id="A6.I18.i2" class="ltx_item" style="list-style-type:none;"><span class="ltx_tag ltx_tag_item">•</span> 
<span id="A6.I18.i2.p1" class="ltx_para">
<span id="A6.I18.i2.p1.1" class="ltx_p"><span id="A6.I18.i2.p1.1.1" class="ltx_text ltx_font_typewriter" style="--ltx-fg-color:#000000;">&lt;RUBRIC&gt; New rubric 2 &lt;/RUBRIC&gt;</span></span>
</span></span>
</span>
</span></span></span></foreignobject></g></g></svg>