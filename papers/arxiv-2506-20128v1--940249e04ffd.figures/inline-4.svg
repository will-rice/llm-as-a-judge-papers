n class="ltx_foreignobject_content">
<span id="A2.p5.pic1.2" class="ltx_inline-block ltx_minipage ltx_align_bottom" style="width:34.12em;">
<span id="A2.p5.pic1.2.1" class="ltx_p"><span id="A2.p5.pic1.2.1.1" class="ltx_text" style="font-size:90%;--ltx-fg-color:#000000;">Evaluate the Answer Correctness of the generated response.</span></span>
<span id="A2.p5.pic1.2.2" class="ltx_p"><span id="A2.p5.pic1.2.2.1" class="ltx_text ltx_font_bold" style="font-size:90%;--ltx-fg-color:#000000;">Retrieved Context (C):<span id="A2.p5.pic1.2.2.1.1" class="ltx_text ltx_font_medium"> <span id="A2.p5.pic1.2.2.1.1.1" class="ltx_text ltx_font_typewriter">{context}</span></span></span></span>
<span id="A2.p5.pic1.2.3" class="ltx_p"><span id="A2.p5.pic1.2.3.1" class="ltx_text ltx_font_bold" style="font-size:90%;--ltx-fg-color:#000000;">Generated Response (r):<span id="A2.p5.pic1.2.3.1.1" class="ltx_text ltx_font_medium"> <span id="A2.p5.pic1.2.3.1.1.1" class="ltx_text ltx_font_typewriter">{response}</span></span></span></span>
<span id="A2.p5.pic1.2.4" class="ltx_p"><span id="A2.p5.pic1.2.4.1" class="ltx_text ltx_font_bold" style="font-size:90%;--ltx-fg-color:#000000;">Ground Truth Answer (g):<span id="A2.p5.pic1.2.4.1.1" class="ltx_text ltx_font_medium"> <span id="A2.p5.pic1.2.4.1.1.1" class="ltx_text ltx_font_typewriter">{ground_truth}</span></span></span></span>
<span id="A2.p5.pic1.2.5" class="ltx_p"><span id="A2.p5.pic1.2.5.1" class="ltx_text ltx_font_bold" style="font-size:90%;--ltx-fg-color:#000000;">Task:<span id="A2.p5.pic1.2.5.1.1" class="ltx_text ltx_font_medium"> Assess the factual accuracy of the information presented in the response compared to the ground truth answer, considering the provided context. Do not penalize differences in phrasing if the core factual meaning is preserved and accurate according to the ground truth.</span></span></span>
<span id="A2.p5.pic1.2.6" class="ltx_p"><span id="A2.p5.pic1.2.6.1" class="ltx_text ltx_font_bold" style="font-size:90%;--ltx-fg-color:#000000;">Scoring:<span id="A2.p5.pic1.2.6.1.1" class="ltx_text ltx_font_medium"> Score from 0 to 100, where 0 is completely incorrect or contains significant factual errors, and 100 represents perfect factual accuracy (semantically equivalent to the ground truth). If no response is generated, the score is 0.</span></span></span>
<span id="A2.p5.pic1.2.7" class="ltx_p"><span id="A2.p5.pic1.2.7.1" class="ltx_text ltx_font_bold" style="font-size:90%;--ltx-fg-color:#000000;">Output:<span id="A2.p5.pic1.2.7.1.1" class="ltx_text ltx_font_medium"> Only print the score and nothing else.</span></span></span>
</span></span></span></foreignobject></g></g></svg>