<svg id="A4.p7.pic1" class="ltx_picture" height="418.8" overflow="visible" version="1.1" viewbox="0 0 650 418.8" width="650"><g style="--ltx-stroke-color:#000000;--ltx-fill-color:#000000;" fill="#000000" stroke="#000000" stroke-width="0.4pt" transform="translate(0,418.8) matrix(1 0 0 -1 0 0)"><g style="--ltx-fill-color:#404040;" fill="#404040" fill-opacity="1.0"><path style="stroke:none" d="M 0 5.91 L 0 412.89 C 0 416.15 2.64 418.8 5.91 418.8 L 644.09 418.8 C 647.36 418.8 650 416.15 650 412.89 L 650 5.91 C 650 2.64 647.36 0 644.09 0 L 5.91 0 C 2.64 0 0 2.64 0 5.91 Z" /></g><g style="--ltx-fill-color:#F9F9F9;" fill="#F9F9F9" fill-opacity="1.0"><path style="stroke:none" d="M 1.97 5.91 L 1.97 394.84 L 648.03 394.84 L 648.03 5.91 C 648.03 3.73 646.27 1.97 644.09 1.97 L 5.91 1.97 C 3.73 1.97 1.97 3.73 1.97 5.91 Z" /></g><g fill-opacity="1.0" transform="matrix(1.0 0.0 0.0 1.0 21.65 403.44)"><foreignobject style="--ltx-fo-width:43.85em;--ltx-fo-height:0.68em;--ltx-fo-depth:0.19em;font-size:10pt;" height="12.15" overflow="visible" transform="matrix(1 0 0 -1 0 9.46)" width="606.76"><span class="ltx_foreignobject_container"><span class="ltx_foreignobject_content">
<span id="A4.p7.pic1.1" class="ltx_inline-block ltx_minipage ltx_align_bottom" style="width:43.85em;">
<span id="A4.p7.pic1.1.1" class="ltx_p"><span id="A4.p7.pic1.1.1.1" class="ltx_text" style="--ltx-fg-color:#FFFFFF;">Conciseness Prompt</span></span>
</span></span></span></foreignobject></g><g fill-opacity="1.0" transform="matrix(1.0 0.0 0.0 1.0 21.65 83.27)"><foreignobject style="--ltx-fo-width:43.85em;--ltx-fo-height:21.66em;--ltx-fo-depth:5.02em;font-size:10pt;" height="369.25" overflow="visible" transform="matrix(1 0 0 -1 0 299.76)" width="606.76"><span class="ltx_foreignobject_container"><span class="ltx_foreignobject_content"><span id="A4.p7.pic1.2" class="ltx_inline-logical-block ltx_minipage ltx_align_bottom" style="width:43.85em;">
<span id="A4.p7.pic1.p4" class="ltx_para">
<span id="A4.p7.pic1.p4.1" class="ltx_p"><span id="A4.p7.pic1.p4.1.1" class="ltx_text" style="--ltx-fg-color:#000000;">You are given a task in some context (<span id="A4.p7.pic1.p4.1.1.1" class="ltx_text ltx_font_bold">Input</span>), and a candidate answer. Assess how focused and relevant the response is to the given question.</span></span>
<span id="A4.p7.pic1.p4.2" class="ltx_p"><span id="A4.p7.pic1.p4.2.1" class="ltx_text" style="--ltx-fg-color:#000000;">Note that responses indicating inability to answer (e.g., &quot;I don’t know&quot;) are considered relevant if appropriate. However, irrelevant additional content should be penalized even if preceded by such statements.</span></span>
</span>
<span id="A4.p7.pic1.p1" class="ltx_para ltx_noindent">
<span id="A4.p7.pic1.p1.1" class="ltx_p"><span id="A4.p7.pic1.p1.1.1" class="ltx_text ltx_font_bold" style="--ltx-fg-color:#000000;">Task:</span><span id="A4.p7.pic1.p1.1.2" class="ltx_text" style="--ltx-fg-color:#000000;"> {prompt}</span>
<br class="ltx_break"><span id="A4.p7.pic1.p1.1.3" class="ltx_text ltx_font_bold" style="--ltx-fg-color:#000000;">Candidate Response:</span><span id="A4.p7.pic1.p1.1.4" class="ltx_text" style="--ltx-fg-color:#000000;"> {prediction}</span></span>
</span>
<span id="A4.p7.pic1.p2" class="ltx_para ltx_noindent">
<span id="A4.p7.pic1.p2.1" class="ltx_p"><span id="A4.p7.pic1.p2.1.1" class="ltx_text ltx_font_bold" style="--ltx-fg-color:#000000;">Instruction:</span><span id="A4.p7.pic1.p2.1.2" class="ltx_text" style="--ltx-fg-color:#000000;"> Evaluate how relevant and focused the response is to the task.</span></span>
</span>
<span id="A4.p7.pic1.p5" class="ltx_para">
<span id="A4.p7.pic1.p5.1" class="ltx_p"><span id="A4.p7.pic1.p5.1.1" class="ltx_text" style="--ltx-fg-color:#000000;">First explain your reasoning, then provide your final answer. Use the following format:</span></span>
<span id="A4.p7.pic1.p5.2" class="ltx_quote">
<span id="A4.p7.pic1.p5.2.1" class="ltx_p"><span id="A4.p7.pic1.p5.2.1.1" class="ltx_text" style="--ltx-fg-color:#000000;">Explanation: [Explanation], Answer: [Answer]</span></span>
</span>
</span>
<span id="A4.p7.pic1.p3" class="ltx_para ltx_noindent">
<span id="A4.p7.pic1.p3.1" class="ltx_p"><span id="A4.p7.pic1.p3.1.1" class="ltx_text" style="--ltx-fg-color:#000000;">where </span><span id="A4.p7.pic1.p3.1.2" class="ltx_text ltx_font_typewriter" style="--ltx-fg-color:#000000;">[Answer]</span><span id="A4.p7.pic1.p3.1.3" class="ltx_text" style="--ltx-fg-color:#000000;"> is one of:</span></span>
<span id="A4.p7.pic1.p3.2" class="ltx_quote">
<span id="A4.p7.pic1.p3.2.1" class="ltx_p"><span id="A4.p7.pic1.p3.2.1.1" class="ltx_text ltx_font_typewriter" style="--ltx-fg-color:#000000;">not at all
<br class="ltx_break">slightly
<br class="ltx_break">somewhat
<br class="ltx_break">mostly
<br class="ltx_break">completely</span></span>
</span>
</span></span></span></span></foreignobject></g></g></svg>