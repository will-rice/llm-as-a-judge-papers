<svg xmlns="http://www.w3.org/2000/svg" version="1.1" width="435.70" height="169.92" overflow="visible"><g transform="translate(0,169.92) scale(1,-1)"><g transform="translate(0,0)"><g transform="translate(0,170.16) scale(1,-1)"><foreignobject width="446.46" height="170.16" overflow="visible"><img src="arxiv-2606-02640v1--e460d980b0b2.figures/figure-1.webp" id="S1.F2.pic1.g1" class="ltx_graphics ltx_img_landscape" style="width:100%;height:100%;object-fit:contain" width="452" height="177" alt="Refer to caption"></foreignobject></g></g><g transform="translate(249.62,158.85)"><g transform="scale(1,-1)"><text xml:id="S1.F2.pic1.2"><inline-block backgroundcolor="#E9ECF4" class="ltx_parbox" vattach="middle" width="113.9pt" xml:id="S1.F2.pic1.2.1">
              <p xml:id="S1.F2.pic1.2.1.1"><text font="bold" fontsize="90%" xml:id="S1.F2.pic1.2.1.1.1">(a) Standard flow.<text font="medium" xml:id="S1.F2.pic1.2.1.1.1.1"> The attacker receives the victim LLM’s response directly, and the judge evaluates this response to guide refinement.</text></g></g><g transform="translate(27.23,20.42)"><g transform="scale(1,-1)"><text xml:id="S1.F2.pic1.3"><inline-block backgroundcolor="#FFE6CC" class="ltx_parbox" vattach="middle" width="158.7pt" xml:id="S1.F2.pic1.3.1">
              <p xml:id="S1.F2.pic1.3.1.1"><text font="bold" fontsize="90%" xml:id="S1.F2.pic1.3.1.1.1">(b) With D-Judge.<text font="medium" xml:id="S1.F2.pic1.3.1.1.1.1"> D-Judge rewrites the victim response <emph font="italic" xml:id="S1.F2.pic1.3.1.1.1.1.1">before</emph> it reaches the attacker/judge, so refinement is driven by a perturbed signal.</text></g></g></g></svg>