<span id="A6.F7.p1.pic1.2.1.1.1.2" class="ltx_p"><span id="A6.F7.p1.pic1.2.1.1.1.2.1" class="ltx_text" style="--ltx-fg-color:#000000;">Your task is to use these provided test cases to reason through the code’s logic and determine whether it correctly implements the described task.</span></span>
