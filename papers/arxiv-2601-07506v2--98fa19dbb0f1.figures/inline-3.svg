<tr id="A3.F8.p1.pic1.2.2" class="ltx_tr">
<td id="A3.F8.p1.pic1.2.2.1" class="ltx_td ltx_align_left ltx_align_top ltx_border_bb">
<span id="A3.F8.p1.pic1.2.2.1.1" class="ltx_inline-block ltx_align_top" style="width:287.9pt;">
<span id="A3.F8.p1.pic1.2.2.1.1.1" class="ltx_p"><span id="A3.F8.p1.pic1.2.2.1.1.1.1" class="ltx_text" style="--ltx-fg-color:#000000;">You are given a question, its original answer, and a substituted (incorrect) answer.</span></span>
<span id="A3.F8.p1.pic1.2.2.1.1.2" class="ltx_p"><span id="A3.F8.p1.pic1.2.2.1.1.2.1" class="ltx_text" style="--ltx-fg-color:#000000;">Write exactly one fluent English sentence that answers the question **as if the substituted answer is true**.</span></span>
<span id="A3.F8.p1.pic1.2.2.1.1.3" class="ltx_p"><span id="A3.F8.p1.pic1.2.2.1.1.3.1" class="ltx_text" style="--ltx-fg-color:#000000;">Strict requirements:</span></span>
<span id="A3.F8.p1.pic1.2.2.1.1.4" class="ltx_p"><span id="A3.F8.p1.pic1.2.2.1.1.4.1" class="ltx_text" style="--ltx-fg-color:#000000;">- Treat the substituted answer as ground truth; do not hedge or mention conflicts.</span></span>
<span id="A3.F8.p1.pic1.2.2.1.1.5" class="ltx_p"><span id="A3.F8.p1.pic1.2.2.1.1.5.1" class="ltx_text" style="--ltx-fg-color:#000000;">- Do NOT reply with just the substituted answer token; produce a full grammatical sentence that directly answers the question.</span></span>
<span id="A3.F8.p1.pic1.2.2.1.1.6" class="ltx_p"><span id="A3.F8.p1.pic1.2.2.1.1.6.1" class="ltx_text" style="--ltx-fg-color:#000000;">- Length: at least 12 words and at most 30 words.</span></span>
<span id="A3.F8.p1.pic1.2.2.1.1.7" class="ltx_p"><span id="A3.F8.p1.pic1.2.2.1.1.7.1" class="ltx_text" style="--ltx-fg-color:#000000;">- Return only the sentence (no labels, no quotes).</span></span>
<span id="A3.F8.p1.pic1.2.2.1.1.8" class="ltx_p"><span id="A3.F8.p1.pic1.2.2.1.1.8.1" class="ltx_text ltx_font_bold" style="--ltx-fg-color:#000000;">Question: {question}</span></span>
<span id="A3.F8.p1.pic1.2.2.1.1.9" class="ltx_p"><span id="A3.F8.p1.pic1.2.2.1.1.9.1" class="ltx_text ltx_font_bold" style="--ltx-fg-color:#000000;">Original Answer: {original_reference}</span></span>
