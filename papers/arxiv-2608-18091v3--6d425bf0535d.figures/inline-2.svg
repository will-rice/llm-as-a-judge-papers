<span id="A3.F6.pic2.2" class="ltx_inline-block ltx_minipage ltx_align_bottom" style="width:45.35em;">
<span id="A3.F6.pic2.2.1" class="ltx_p"><span id="A3.F6.pic2.2.1.1" class="ltx_text" style="--ltx-fg-color:#000000;">You will rate a selection of 20 narrative constraints (chosen from a larger pool) on four dimensions, each on a 1–7 Likert scale.</span></span>
<span id="A3.F6.pic2.2.2" class="ltx_p"><span id="A3.F6.pic2.2.2.1" class="ltx_text ltx_font_italic" style="--ltx-fg-color:#808080;">[Rubric block: four dimensions, each anchored at 1 and 7; see Table 9 in <a href="#A2" title="Appendix B Evaluation Rubric ‣ Self- and Other-Labels Induce Bidirectional Bias in LLM Judges" class="ltx_ref ltx_refmacro_autoref"><span class="ltx_text ltx_ref_tag">Appendix B</span></a>. Dimensions are presented in the randomized order recorded in the metadata above.]</span><span id="A3.F6.pic2.2.2.2" class="ltx_text"></span></span>
<span id="A3.I1" class="ltx_itemize ltx_leftmargin_flush">
<span id="A3.I1.i1" class="ltx_item" style="list-style-type:none;"><span class="ltx_tag ltx_tag_item">•</span> 
<span id="A3.I1.i1.p1" class="ltx_para">
<span id="A3.I1.i1.p1.1" class="ltx_p"><span id="A3.I1.i1.p1.1.1" class="ltx_text" style="--ltx-fg-color:#000000;">Use the full 1–7 range.</span></span>
</span></span>
<span id="A3.I1.i2" class="ltx_item" style="list-style-type:none;"><span class="ltx_tag ltx_tag_item">•</span> 
<span id="A3.I1.i2.p1" class="ltx_para">
<span id="A3.I1.i2.p1.1" class="ltx_p"><span id="A3.I1.i2.p1.1.1" class="ltx_text" style="--ltx-fg-color:#000000;">Respond in English.</span></span>
</span></span>
<span id="A3.I1.i3" class="ltx_item" style="list-style-type:none;"><span class="ltx_tag ltx_tag_item">•</span> 
<span id="A3.I1.i3.p1" class="ltx_para">
<span id="A3.I1.i3.p1.1" class="ltx_p"><span id="A3.I1.i3.p1.1.1" class="ltx_text" style="--ltx-fg-color:#000000;">For each dimension, provide a score (1–7) and 2–3 sentences explaining the reason for that score.</span></span>
</span></span>
</span>
<span id="A3.F6.pic2.2.3" class="ltx_p"><span id="A3.F6.pic2.2.3.1" class="ltx_text ltx_font_bold" style="--ltx-fg-color:#000000;">Selection:
<br class="ltx_break"></span><span id="A3.F6.pic2.2.3.2" class="ltx_text ltx_font_italic" style="--ltx-fg-color:#808080;">[20 selected constraints listed in randomized order]</span><span id="A3.F6.pic2.2.3.3" class="ltx_text"></span></span>
<span id="A3.F6.pic2.2.4" class="ltx_p"><span id="A3.F6.pic2.2.4.1" class="ltx_text" style="--ltx-fg-color:#000000;">Respond with JSON only:</span></span>
<span id="A3.F6.pic2.2.5" class="ltx_quote">
<span id="A3.F6.pic2.2.5.1" class="ltx_p"><span id="A3.F6.pic2.2.5.1.1" class="ltx_text ltx_font_typewriter" style="--ltx-fg-color:#000000;">{&quot;originality&quot;: {&quot;score&quot;: &lt;int&gt;, &quot;reasoning&quot;: &quot;&lt;2-3 sentences&gt;&quot;}, &quot;coherence&quot;: {…}, &quot;tellability&quot;: {…}, &quot;dimensionality&quot;: {…}}
</span></span>
</span>
</span></span></span></foreignobject></g></g></svg>