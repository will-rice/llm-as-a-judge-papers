<svg id="A7.p4.pic1" class="ltx_picture" height="1614.05" overflow="visible" version="1.1" viewbox="0 0 653.15 1614.05" width="653.15"><g style="--ltx-stroke-color:#000000;--ltx-fill-color:#000000;" fill="#000000" stroke="#000000" stroke-width="0.4pt" transform="translate(0,1614.05) matrix(1 0 0 -1 0 0)"><g style="--ltx-fill-color:#663300;" fill="#663300" fill-opacity="1.0"><path style="stroke:none" d="M 0 5.91 L 0 1608.15 C 0 1611.41 2.64 1614.05 5.91 1614.05 L 647.24 1614.05 C 650.51 1614.05 653.15 1611.41 653.15 1608.15 L 653.15 5.91 C 653.15 2.64 650.51 0 647.24 0 L 5.91 0 C 2.64 0 0 2.64 0 5.91 Z" /></g><g style="--ltx-fill-color:#FFF9F2;" fill="#FFF9F2" fill-opacity="1.0"><path style="stroke:none" d="M 1.97 5.91 L 1.97 1589.94 L 651.18 1589.94 L 651.18 5.91 C 651.18 3.73 649.42 1.97 647.24 1.97 L 5.91 1.97 C 3.73 1.97 1.97 3.73 1.97 5.91 Z" /></g><g fill-opacity="1.0" transform="matrix(1.0 0.0 0.0 1.0 21.65 1598.54)"><foreignobject style="--ltx-fo-width:38.32em;--ltx-fo-height:0.69em;--ltx-fo-depth:0.19em;font-size:10pt;" height="12.3" overflow="visible" transform="matrix(1 0 0 -1 0 9.61)" width="530.24"><span class="ltx_foreignobject_container"><span class="ltx_foreignobject_content">
<span id="A7.p4.pic1.1" class="ltx_inline-block ltx_minipage ltx_align_bottom" style="width:38.32em;">
<span id="A7.p4.pic1.1.1" class="ltx_p"><span id="A7.p4.pic1.1.1.1" class="ltx_text ltx_font_bold" style="--ltx-fg-color:#FFFFFF;">Example from PPE Preference Dataset</span></span>
</span></span></span></foreignobject></g><g fill-opacity="1.0" transform="matrix(1.0 0.0 0.0 1.0 21.65 1247.96)"><foreignobject style="--ltx-fo-width:44.07em;--ltx-fo-height:23.86em;--ltx-fo-depth:89.2em;font-size:10pt;" height="1564.37" overflow="visible" transform="matrix(1 0 0 -1 0 330.17)" width="609.8"><span class="ltx_foreignobject_container"><span class="ltx_foreignobject_content">
<span id="A7.p4.pic1.2" class="ltx_inline-block ltx_minipage ltx_align_bottom" style="width:44.07em;">
<span id="A7.p4.pic1.2.1" class="ltx_p"><span id="A7.p4.pic1.2.1.1" class="ltx_text" style="--ltx-fg-color:#000000;">Prompt:</span></span>
<span id="A7.p4.pic1.2.2" class="ltx_p"><span id="A7.p4.pic1.2.2.1" class="ltx_text" style="--ltx-fg-color:#000000;">Write an email for selling my website speed optimization services to e-commerce business owners. Make it at short as possible. Focus in benefits (revenue or money) that i make for them.</span></span>
<span id="A7.p4.pic1.2.3" class="ltx_p"><span id="A7.p4.pic1.2.3.1" class="ltx_text" style="--ltx-fg-color:#000000;">Initial rubrics:</span></span>
<span id="A7.I4" class="ltx_enumerate" style="--ltx-enum-leftmargin:1.2em;">
<span id="A7.I4.i1" class="ltx_item" style="list-style-type:none;"><span class="ltx_tag ltx_tag_item">1.</span> 
<span id="A7.I4.i1.p1" class="ltx_para">
<span id="A7.I4.i1.p1.1" class="ltx_p"><span id="A7.I4.i1.p1.1.1" class="ltx_text" style="--ltx-fg-color:#000000;">Mentions website speed optimization as the core service offered.</span></span>
</span></span>
<span id="A7.I4.i2" class="ltx_item" style="list-style-type:none;"><span class="ltx_tag ltx_tag_item">2.</span> 
<span id="A7.I4.i2.p1" class="ltx_para">
<span id="A7.I4.i2.p1.1" class="ltx_p"><span id="A7.I4.i2.p1.1.1" class="ltx_text" style="--ltx-fg-color:#000000;">Specifically targets e-commerce business owners as the intended audience.</span></span>
</span></span>
<span id="A7.I4.i3" class="ltx_item" style="list-style-type:none;"><span class="ltx_tag ltx_tag_item">3.</span> 
<span id="A7.I4.i3.p1" class="ltx_para">
<span id="A7.I4.i3.p1.1" class="ltx_p"><span id="A7.I4.i3.p1.1.1" class="ltx_text" style="--ltx-fg-color:#000000;">Includes at least one concrete business benefit tied to money or revenue.</span></span>
</span></span>
<span id="A7.I4.i4" class="ltx_item" style="list-style-type:none;"><span class="ltx_tag ltx_tag_item">4.</span> 
<span id="A7.I4.i4.p1" class="ltx_para">
<span id="A7.I4.i4.p1.1" class="ltx_p"><span id="A7.I4.i4.p1.1.1" class="ltx_text" style="--ltx-fg-color:#000000;">Maintains a short and concise format (no more than  100 words).</span></span>
</span></span>
<span id="A7.I4.i5" class="ltx_item" style="list-style-type:none;"><span class="ltx_tag ltx_tag_item">5.</span> 
<span id="A7.I4.i5.p1" class="ltx_para">
<span id="A7.I4.i5.p1.1" class="ltx_p"><span id="A7.I4.i5.p1.1.1" class="ltx_text" style="--ltx-fg-color:#000000;">Avoids technical jargon or implementation details unrelated to benefits.</span></span>
</span></span>
<span id="A7.I4.i6" class="ltx_item" style="list-style-type:none;"><span class="ltx_tag ltx_tag_item">6.</span> 
<span id="A7.I4.i6.p1" class="ltx_para">
<span id="A7.I4.i6.p1.1" class="ltx_p"><span id="A7.I4.i6.p1.1.1" class="ltx_text" style="--ltx-fg-color:#000000;">Includes a clear call to action (e.g., reply, book a call, request audit).</span></span>
</span></span>
<span id="A7.I4.i7" class="ltx_item" style="list-style-type:none;"><span class="ltx_tag ltx_tag_item">7.</span> 
<span id="A7.I4.i7.p1" class="ltx_para">
<span id="A7.I4.i7.p1.1" class="ltx_p"><span id="A7.I4.i7.p1.1.1" class="ltx_text" style="--ltx-fg-color:#000000;">Avoids generic claims unrelated to website performance or monetary benefit.</span></span>
</span></span>
</span>
<span id="A7.p4.pic1.2.4" class="ltx_p"><span id="A7.p4.pic1.2.4.1" class="ltx_text" style="--ltx-fg-color:#000000;">Final rubrics:</span></span>
<span id="A7.I5" class="ltx_enumerate" style="--ltx-enum-leftmargin:1.2em;">
<span id="A7.I5.i1" class="ltx_item" style="list-style-type:none;"><span class="ltx_tag ltx_tag_item">1.</span> 
<span id="A7.I5.i1.p1" class="ltx_para">
<span id="A7.I5.i1.p1.1" class="ltx_p"><span id="A7.I5.i1.p1.1.1" class="ltx_text" style="--ltx-fg-color:#000000;">Mentions that faster loading times lead to higher sales or increased revenue.</span></span>
</span></span>
<span id="A7.I5.i2" class="ltx_item" style="list-style-type:none;"><span class="ltx_tag ltx_tag_item">2.</span> 
<span id="A7.I5.i2.p1" class="ltx_para">
<span id="A7.I5.i2.p1.1" class="ltx_p"><span id="A7.I5.i2.p1.1.1" class="ltx_text" style="--ltx-fg-color:#000000;">Advises that every second of delay can reduce sales or mentions specific loss metrics.</span></span>
</span></span>
<span id="A7.I5.i3" class="ltx_item" style="list-style-type:none;"><span class="ltx_tag ltx_tag_item">3.</span> 
<span id="A7.I5.i3.p1" class="ltx_para">
<span id="A7.I5.i3.p1.1" class="ltx_p"><span id="A7.I5.i3.p1.1.1" class="ltx_text" style="--ltx-fg-color:#000000;">Offers a specific service aimed at optimizing website speed for e-commerce.</span></span>
</span></span>
<span id="A7.I5.i4" class="ltx_item" style="list-style-type:none;"><span class="ltx_tag ltx_tag_item">4.</span> 
<span id="A7.I5.i4.p1" class="ltx_para">
<span id="A7.I5.i4.p1.1" class="ltx_p"><span id="A7.I5.i4.p1.1.1" class="ltx_text" style="--ltx-fg-color:#000000;">Includes a call to action inviting the recipient for further engagement, such as a chat or a video.</span></span>
</span></span>
<span id="A7.I5.i5" class="ltx_item" style="list-style-type:none;"><span class="ltx_tag ltx_tag_item">5.</span> 
<span id="A7.I5.i5.p1" class="ltx_para">
<span id="A7.I5.i5.p1.1" class="ltx_p"><span id="A7.I5.i5.p1.1.1" class="ltx_text" style="--ltx-fg-color:#000000;">Uses an analogy or relatable scenario to illustrate the impact of website speed on sales or customer retention.</span></span>
</span></span>
<span id="A7.I5.i6" class="ltx_item" style="list-style-type:none;"><span class="ltx_tag ltx_tag_item">6.</span> 
<span id="A7.I5.i6.p1" class="ltx_para">
<span id="A7.I5.i6.p1.1" class="ltx_p"><span id="A7.I5.i6.p1.1.1" class="ltx_text" style="--ltx-fg-color:#000000;">Provides an option to receive additional information or a report, implying a no-obligation offer.</span></span>
</span></span>
<span id="A7.I5.i7" class="ltx_item" style="list-style-type:none;"><span class="ltx_tag ltx_tag_item">7.</span> 
<span id="A7.I5.i7.p1" class="ltx_para">
<span id="A7.I5.i7.p1.1" class="ltx_p"><span id="A7.I5.i7.p1.1.1" class="ltx_text" style="--ltx-fg-color:#000000;">References an impact of speed on conversion rates, either generally or with specific percentages.</span></span>
</span></span>
<span id="A7.I5.i8" class="ltx_item" style="list-style-type:none;"><span class="ltx_tag ltx_tag_item">8.</span> 
<span id="A7.I5.i8.p1" class="ltx_para">
<span id="A7.I5.i8.p1.1" class="ltx_p"><span id="A7.I5.i8.p1.1.1" class="ltx_text" style="--ltx-fg-color:#000000;">Utilizes a subject line that directly mentions website speed and its impact on sales/revenue.</span></span>
</span></span>
<span id="A7.I5.i9" class="ltx_item" style="list-style-type:none;"><span class="ltx_tag ltx_tag_item">9.</span> 
<span id="A7.I5.i9.p1" class="ltx_para">
<span id="A7.I5.i9.p1.1" class="ltx_p"><span id="A7.I5.i9.p1.1.1" class="ltx_text" style="--ltx-fg-color:#000000;">Highlights specific benefits for customer satisfaction or user experience beyond direct revenue increase, such as improved browsing experience or reduced bounce rates.</span></span>
</span></span>
<span id="A7.I5.i10" class="ltx_item" style="list-style-type:none;"><span class="ltx_tag ltx_tag_item">10.</span> 
<span id="A7.I5.i10.p1" class="ltx_para">
<span id="A7.I5.i10.p1.1" class="ltx_p"><span id="A7.I5.i10.p1.1.1" class="ltx_text" style="--ltx-fg-color:#000000;">Craft a customizable template by including placeholders for recipient’s name and company name.</span></span>
</span></span>
<span id="A7.I5.i11" class="ltx_item" style="list-style-type:none;"><span class="ltx_tag ltx_tag_item">11.</span> 
<span id="A7.I5.i11.p1" class="ltx_para">
<span id="A7.I5.i11.p1.1" class="ltx_p"><span id="A7.I5.i11.p1.1.1" class="ltx_text" style="--ltx-fg-color:#000000;">Establishes credibility by referencing a well-known company or study related to website optimization and its impact on revenue.</span></span>
</span></span>
<span id="A7.I5.i12" class="ltx_item" style="list-style-type:none;"><span class="ltx_tag ltx_tag_item">12.</span> 
<span id="A7.I5.i12.p1" class="ltx_para">
<span id="A7.I5.i12.p1.1" class="ltx_p"><span id="A7.I5.i12.p1.1.1" class="ltx_text" style="--ltx-fg-color:#000000;">Utilizes persuasive language that emotionally appeals to the business owner’s pain points, like frustration from slow checkout or fear of losing customers, to emphasize urgency and drive interest in services offered.</span></span>
</span></span>
<span id="A7.I5.i13" class="ltx_item" style="list-style-type:none;"><span class="ltx_tag ltx_tag_item">13.</span> 
<span id="A7.I5.i13.p1" class="ltx_para">
<span id="A7.I5.i13.p1.1" class="ltx_p"><span id="A7.I5.i13.p1.1.1" class="ltx_text" style="--ltx-fg-color:#000000;">Incorporates a sense of urgency or a compelling reason to act quickly within the email message.</span></span>
</span></span>
<span id="A7.I5.i14" class="ltx_item" style="list-style-type:none;"><span class="ltx_tag ltx_tag_item">14.</span> 
<span id="A7.I5.i14.p1" class="ltx_para">
<span id="A7.I5.i14.p1.1" class="ltx_p"><span id="A7.I5.i14.p1.1.1" class="ltx_text" style="--ltx-fg-color:#000000;">Emphasizes the competitive advantage gained by having a faster-loading website compared to other e-commerce businesses.</span></span>
</span></span>
<span id="A7.I5.i15" class="ltx_item" style="list-style-type:none;"><span class="ltx_tag ltx_tag_item">15.</span> 
<span id="A7.I5.i15.p1" class="ltx_para">
<span id="A7.I5.i15.p1.1" class="ltx_p"><span id="A7.I5.i15.p1.1.1" class="ltx_text" style="--ltx-fg-color:#000000;">Initiates engagement by offering a free initial assessment or audit of the recipient’s current website performance to demonstrate potential improvements.</span></span>
</span></span>
<span id="A7.I5.i16" class="ltx_item" style="list-style-type:none;"><span class="ltx_tag ltx_tag_item">16.</span> 
<span id="A7.I5.i16.p1" class="ltx_para">
<span id="A7.I5.i16.p1.1" class="ltx_p"><span id="A7.I5.i16.p1.1.1" class="ltx_text" style="--ltx-fg-color:#000000;">Explicitly quantifies potential revenue increase with specific dollar amounts, contrasting current losses due to slow website speed with projected gains post-optimization.</span></span>
</span></span>
<span id="A7.I5.i17" class="ltx_item" style="list-style-type:none;"><span class="ltx_tag ltx_tag_item">17.</span> 
<span id="A7.I5.i17.p1" class="ltx_para">
<span id="A7.I5.i17.p1.1" class="ltx_p"><span id="A7.I5.i17.p1.1.1" class="ltx_text" style="--ltx-fg-color:#000000;">Incorporates industry-specific examples or case studies to demonstrate proven results of website speed optimization in increasing e-commerce sales.</span></span>
</span></span>
<span id="A7.I5.i18" class="ltx_item" style="list-style-type:none;"><span class="ltx_tag ltx_tag_item">18.</span> 
<span id="A7.I5.i18.p1" class="ltx_para">
<span id="A7.I5.i18.p1.1" class="ltx_p"><span id="A7.I5.i18.p1.1.1" class="ltx_text" style="--ltx-fg-color:#000000;">Clearly differentiates the email by employing a visually unique format or structure that stands out, such as bullet points, bold headings, or highlighting key revenue benefits, to enhance readability and impact.</span></span>
</span></span>
<span id="A7.I5.i19" class="ltx_item" style="list-style-type:none;"><span class="ltx_tag ltx_tag_item">19.</span> 
<span id="A7.I5.i19.p1" class="ltx_para">
<span id="A7.I5.i19.p1.1" class="ltx_p"><span id="A7.I5.i19.p1.1.1" class="ltx_text" style="--ltx-fg-color:#000000;">Measure the concise and efficient use of language in the email, aiming to keep the message succinct yet informative, meeting the prompt’s requirement for brevity.</span></span>
</span></span>
<span id="A7.I5.i20" class="ltx_item" style="list-style-type:none;"><span class="ltx_tag ltx_tag_item">20.</span> 
<span id="A7.I5.i20.p1" class="ltx_para">
<span id="A7.I5.i20.p1.1" class="ltx_p"><span id="A7.I5.i20.p1.1.1" class="ltx_text" style="--ltx-fg-color:#000000;">Mentions strategies or tools used in the website speed optimization, detailing specific technologies or methodologies applied to achieve faster loading times, such as caching, image optimization, or content delivery networks.</span></span>
</span></span>
<span id="A7.I5.i21" class="ltx_item" style="list-style-type:none;"><span class="ltx_tag ltx_tag_item">21.</span> 
<span id="A7.I5.i21.p1" class="ltx_para">
<span id="A7.I5.i21.p1.1" class="ltx_p"><span id="A7.I5.i21.p1.1.1" class="ltx_text" style="--ltx-fg-color:#000000;">Specifies how increased website speed can amplify the business’s online visibility or improve SEO rankings, thus contributing indirectly to revenue growth.</span></span>
</span></span>
<span id="A7.I5.i22" class="ltx_item" style="list-style-type:none;"><span class="ltx_tag ltx_tag_item">22.</span> 
<span id="A7.I5.i22.p1" class="ltx_para">
<span id="A7.I5.i22.p1.1" class="ltx_p"><span id="A7.I5.i22.p1.1.1" class="ltx_text" style="--ltx-fg-color:#000000;">Informs the recipient that an optimized website speed can lead to improved search engine rankings, thereby attracting more organic traffic and increasing potential sales.</span></span>
</span></span>
<span id="A7.I5.i23" class="ltx_item" style="list-style-type:none;"><span class="ltx_tag ltx_tag_item">23.</span> 
<span id="A7.I5.i23.p1" class="ltx_para">
<span id="A7.I5.i23.p1.1" class="ltx_p"><span id="A7.I5.i23.p1.1.1" class="ltx_text" style="--ltx-fg-color:#000000;">Demonstrates insight into user behavior changes stemming from improved website speed, such as increased time spent on site or higher interaction rates.</span></span>
</span></span>
<span id="A7.I5.i24" class="ltx_item" style="list-style-type:none;"><span class="ltx_tag ltx_tag_item">24.</span> 
<span id="A7.I5.i24.p1" class="ltx_para">
<span id="A7.I5.i24.p1.1" class="ltx_p"><span id="A7.I5.i24.p1.1.1" class="ltx_text" style="--ltx-fg-color:#000000;">Incorporates a personalization element that leverages the recipient’s specific industry or e-commerce niche, showcasing tailored expertise in optimizing website speed for their unique business needs.</span></span>
</span></span>
<span id="A7.I5.i25" class="ltx_item" style="list-style-type:none;"><span class="ltx_tag ltx_tag_item">25.</span> 
<span id="A7.I5.i25.p1" class="ltx_para">
<span id="A7.I5.i25.p1.1" class="ltx_p"><span id="A7.I5.i25.p1.1.1" class="ltx_text" style="--ltx-fg-color:#000000;">Evaluates whether the email offers a personalized benefit or advantage uniquely tailored to the recipient’s business or e-commerce niche, emphasizing customization over generic benefits.</span></span>
</span></span>
<span id="A7.I5.i26" class="ltx_item" style="list-style-type:none;"><span class="ltx_tag ltx_tag_item">26.</span> 
<span id="A7.I5.i26.p1" class="ltx_para">
<span id="A7.I5.i26.p1.1" class="ltx_p"><span id="A7.I5.i26.p1.1.1" class="ltx_text" style="--ltx-fg-color:#000000;">Specifies how optimized website speed can enhance mobile user experiences, which is crucial for e-commerce businesses to capture a significant portion of their audience.</span></span>
</span></span>
<span id="A7.I5.i27" class="ltx_item" style="list-style-type:none;"><span class="ltx_tag ltx_tag_item">27.</span> 
<span id="A7.I5.i27.p1" class="ltx_para">
<span id="A7.I5.i27.p1.1" class="ltx_p"><span id="A7.I5.i27.p1.1.1" class="ltx_text" style="--ltx-fg-color:#000000;">Presents a scalable solution that can easily integrate into the recipient’s existing e-commerce infrastructure, emphasizing its convenience and low disruption to current operations.</span></span>
</span></span>
<span id="A7.I5.i28" class="ltx_item" style="list-style-type:none;"><span class="ltx_tag ltx_tag_item">28.</span> 
<span id="A7.I5.i28.p1" class="ltx_para">
<span id="A7.I5.i28.p1.1" class="ltx_p"><span id="A7.I5.i28.p1.1.1" class="ltx_text" style="--ltx-fg-color:#000000;">Clearly outlines the process or specific steps involved in the website speed optimization service to give the reader insight into how the transformation will be achieved.</span></span>
</span></span>
<span id="A7.I5.i29" class="ltx_item" style="list-style-type:none;"><span class="ltx_tag ltx_tag_item">29.</span> 
<span id="A7.I5.i29.p1" class="ltx_para">
<span id="A7.I5.i29.p1.1" class="ltx_p"><span id="A7.I5.i29.p1.1.1" class="ltx_text" style="--ltx-fg-color:#000000;">The email creatively uses a metaphor or storytelling that evokes a vivid image to emphasize the importance of website speed optimization, enhancing the overall persuasive impact.</span></span>
</span></span>
<span id="A7.I5.i30" class="ltx_item" style="list-style-type:none;"><span class="ltx_tag ltx_tag_item">30.</span> 
<span id="A7.I5.i30.p1" class="ltx_para">
<span id="A7.I5.i30.p1.1" class="ltx_p"><span id="A7.I5.i30.p1.1.1" class="ltx_text" style="--ltx-fg-color:#000000;">Ensures the email utilizes statistical evidence or factual data, such as industry benchmarks, to validate the benefits of speed optimization comprehensively, enhancing the persuasive power through quantifiable credibility.</span></span>
</span></span>
</span>
</span></span></span></foreignobject></g></g></svg>