<span id="A2.SS2.p1.pic1.1" class="ltx_inline-block ltx_minipage ltx_align_bottom" style="width:30.91em;">
<span id="A2.SS2.p1.pic1.1.1" class="ltx_p"><span id="A2.SS2.p1.pic1.1.1.1" class="ltx_text ltx_verbatim ltx_font_typewriter ltx_inline-block" style="width:324.5pt;--ltx-fg-color:#000000;"><span id="A2.SS2.p1.pic1.1.1.1.1" class="ltx_text ltx_inline-block" style="width:0.0pt;"> </span><span id="A2.SS2.p1.pic1.1.1.1.2" class="ltx_text ltx_inline-block" style="width:0.0pt;"> </span><span id="A2.SS2.p1.pic1.1.1.1.3" class="ltx_inline-logical-block ltx_parbox ltx_align_top" style="width:324.5pt;">
<span id="A2.SS2.p1.pic1.p1" class="ltx_para ltx_noindent">
<span id="A2.SS2.p1.pic1.p1.1" class="ltx_p">You are given a user question and a response from an AI assistant. Your task is to act as an impartial judge and evaluate how well the response fulfills the user’s instructions.</span>
</span></span></span></span>
<span id="A2.SS2.p1.pic1.1.2" class="ltx_p" style="width:324.5pt;"><span id="A2.SS2.p1.pic1.1.2.1" class="ltx_text ltx_verbatim ltx_font_typewriter ltx_inline-block" style="width:324.5pt;--ltx-fg-color:#000000;"><span id="A2.SS2.p1.pic1.1.2.1.1" class="ltx_inline-logical-block ltx_parbox ltx_pruned_first ltx_align_top" style="width:324.5pt;"></span></span></span>
<span id="A2.SS2.p1.pic1.1.3" class="ltx_p" style="width:324.5pt;"><span id="A2.SS2.p1.pic1.1.3.1" class="ltx_text ltx_verbatim ltx_font_typewriter ltx_inline-block" style="width:324.5pt;--ltx-fg-color:#000000;"><span id="A2.SS2.p1.pic1.1.3.1.1" class="ltx_text ltx_inline-block" style="width:0.0pt;"> </span><span id="A2.SS2.p1.pic1.1.3.1.2" class="ltx_text ltx_inline-block" style="width:0.0pt;"> </span><span id="A2.SS2.p1.pic1.1.3.1.3" class="ltx_inline-logical-block ltx_parbox ltx_align_top" style="width:324.5pt;">
<span id="A2.SS2.p1.pic1.p3" class="ltx_para ltx_noindent">
<span id="A2.SS2.p1.pic1.p3.1" class="ltx_p">Think carefully about how to assess the quality of the response, and enclose your reasoning within &lt;think&gt; and &lt;/think&gt; tags. Your reasoning should include your evaluation criteria, a clear understanding of what an ideal response would look like for this particular question, and a concrete example of such an ideal or reference answer if possible. Then compare the assistant’s response to your ideal or reference answer, explaining how it aligns with or deviates from your expectations. Be specific and avoid vague or overly general judgments. Remain as objective as possible.</span>
</span></span></span></span>
<span id="A2.SS2.p1.pic1.1.4" class="ltx_p" style="width:324.5pt;"><span id="A2.SS2.p1.pic1.1.4.1" class="ltx_text ltx_verbatim ltx_font_typewriter ltx_inline-block" style="width:324.5pt;--ltx-fg-color:#000000;"><span id="A2.SS2.p1.pic1.1.4.1.1" class="ltx_inline-logical-block ltx_parbox ltx_pruned_first ltx_align_top" style="width:324.5pt;"></span></span></span>
<span id="A2.SS2.p1.pic1.1.5" class="ltx_p" style="width:324.5pt;"><span id="A2.SS2.p1.pic1.1.5.1" class="ltx_text ltx_verbatim ltx_font_typewriter ltx_inline-block" style="width:324.5pt;--ltx-fg-color:#000000;"><span id="A2.SS2.p1.pic1.1.5.1.1" class="ltx_text ltx_inline-block" style="width:0.0pt;"> </span><span id="A2.SS2.p1.pic1.1.5.1.2" class="ltx_text ltx_inline-block" style="width:0.0pt;"> </span><span id="A2.SS2.p1.pic1.1.5.1.3" class="ltx_inline-logical-block ltx_parbox ltx_align_top" style="width:324.5pt;">
<span id="A2.SS2.p1.pic1.p5" class="ltx_para ltx_noindent">
<span id="A2.SS2.p1.pic1.p5.1" class="ltx_p">Finally, assign the assistant’s response a score from 0 to 10, using either an integer or a decimal with up to 0.1 precision. A higher score should indicate a higher-quality response. Enclose the score within &lt;score&gt; and &lt;/score&gt; tags.</span>
</span></span></span></span>
<span id="A2.SS2.p1.pic1.1.6" class="ltx_p" style="width:324.5pt;"><span id="A2.SS2.p1.pic1.1.6.1" class="ltx_text ltx_verbatim ltx_font_typewriter ltx_inline-block" style="width:324.5pt;--ltx-fg-color:#000000;"><span id="A2.SS2.p1.pic1.1.6.1.1" class="ltx_inline-logical-block ltx_parbox ltx_pruned_first ltx_align_top" style="width:324.5pt;"></span></span></span>
<span id="A2.SS2.p1.pic1.1.7" class="ltx_p" style="width:324.5pt;"><span id="A2.SS2.p1.pic1.1.7.1" class="ltx_text ltx_verbatim ltx_font_typewriter ltx_inline-block" style="width:324.5pt;--ltx-fg-color:#000000;"><span id="A2.SS2.p1.pic1.1.7.1.1" class="ltx_inline-logical-block ltx_parbox ltx_align_top" style="width:324.5pt;">
<span id="A2.SS2.p1.pic1.p7" class="ltx_para ltx_noindent">
<span id="A2.SS2.p1.pic1.p7.1" class="ltx_p">Format your output like this:</span>
</span></span></span></span>
<span id="A2.SS2.p1.pic1.1.8" class="ltx_p" style="width:324.5pt;"><span id="A2.SS2.p1.pic1.1.8.1" class="ltx_text ltx_verbatim ltx_font_typewriter ltx_inline-block" style="width:324.5pt;--ltx-fg-color:#000000;"><span id="A2.SS2.p1.pic1.1.8.1.1" class="ltx_inline-logical-block ltx_parbox ltx_align_top" style="width:324.5pt;">
<span id="A2.SS2.p1.pic1.p8" class="ltx_para ltx_noindent">
<span id="A2.SS2.p1.pic1.p8.1" class="ltx_p">&lt;think&gt; your_thinking_process &lt;/think&gt;</span>
</span></span></span></span>
<span id="A2.SS2.p1.pic1.1.9" class="ltx_p" style="width:324.5pt;"><span id="A2.SS2.p1.pic1.1.9.1" class="ltx_text ltx_verbatim ltx_font_typewriter ltx_inline-block" style="width:324.5pt;--ltx-fg-color:#000000;"><span id="A2.SS2.p1.pic1.1.9.1.1" class="ltx_inline-logical-block ltx_parbox ltx_align_top" style="width:324.5pt;">
<span id="A2.SS2.p1.pic1.p9" class="ltx_para ltx_noindent">
<span id="A2.SS2.p1.pic1.p9.1" class="ltx_p">&lt;score&gt; your_score &lt;/score&gt;</span>
</span></span></span></span>
