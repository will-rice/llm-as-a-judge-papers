<svg id="A1.F6.p3.pic1" class="ltx_picture" height="802.26" overflow="visible" version="1.1" viewbox="0 0 201.58 802.26" width="201.58"><g style="--ltx-stroke-color:#000000;--ltx-fill-color:#000000;" fill="#000000" stroke="#000000" stroke-width="0.4pt" transform="translate(0,802.26) matrix(1 0 0 -1 0 0)"><g style="--ltx-fill-color:#404040;" fill="#404040" fill-opacity="1.0"><path style="stroke:none" d="M 0 5.91 L 0 796.36 C 0 799.62 2.64 802.26 5.91 802.26 L 195.67 802.26 C 198.94 802.26 201.58 799.62 201.58 796.36 L 201.58 5.91 C 201.58 2.64 198.94 0 195.67 0 L 5.91 0 C 2.64 0 0 2.64 0 5.91 Z" /></g><g style="--ltx-fill-color:#F9F9F9;" fill="#F9F9F9" fill-opacity="1.0"><path style="stroke:none" d="M 1.97 5.91 L 1.97 796.36 C 1.97 798.53 3.73 800.29 5.91 800.29 L 195.67 800.29 C 197.85 800.29 199.61 798.53 199.61 796.36 L 199.61 5.91 C 199.61 3.73 197.85 1.97 195.67 1.97 L 5.91 1.97 C 3.73 1.97 1.97 3.73 1.97 5.91 Z" /></g><g fill-opacity="1.0" transform="matrix(1.0 0.0 0.0 1.0 7.29 0.47)"><foreignobject style="--ltx-fo-width:16.95em;--ltx-fo-height:58.09em;--ltx-fo-depth:0.18em;font-size:10pt;" height="806.17" overflow="visible" transform="matrix(1 0 0 -1 0 803.75)" width="234.54"><span class="ltx_foreignobject_container"><span class="ltx_foreignobject_content">
<span id="A1.F6.p3.pic1.1" class="ltx_inline-block ltx_minipage ltx_align_bottom" style="width:16.95em;">
<span id="A1.F6.p3.pic1.1.1" class="ltx_p"><span id="A1.F6.p3.pic1.1.1.1" class="ltx_text" style="font-size:70%;--ltx-fg-color:#000000;">You are a highly specialised AI assistant adept at evaluating the quality of various summaries produced by different AI systems. Your task involves assessing a provided article and its associated summaries, with the objective of determining the most accurate and reliable summary. You are required to conduct a comprehensive evaluation of the summaries based on the following criteria:</span></span>
<span id="A1.F6.p3.pic1.1.2" class="ltx_p"><span id="A1.F6.p3.pic1.1.2.1" class="ltx_text" style="font-size:70%;--ltx-fg-color:#000000;">a) Coherence: Assess the logical flow and coherence of the summary, ensuring that the information presented is logically structured and makes sense as a whole.</span></span>
<span id="A1.F6.p3.pic1.1.3" class="ltx_p"><span id="A1.F6.p3.pic1.1.3.1" class="ltx_text" style="font-size:70%;--ltx-fg-color:#000000;">b) Consistency: Evaluate how well the summary aligns with the content of the original article, ensuring that all statements are factually consistent with the article and do not introduce any new information.</span></span>
<span id="A1.F6.p3.pic1.1.4" class="ltx_p"><span id="A1.F6.p3.pic1.1.4.1" class="ltx_text" style="font-size:70%;--ltx-fg-color:#000000;">c) Fluency: Analyze the grammatical accuracy and readability of the summary, ensuring that it is written in a clear and concise manner.</span></span>
<span id="A1.F6.p3.pic1.1.5" class="ltx_p"><span id="A1.F6.p3.pic1.1.5.1" class="ltx_text" style="font-size:70%;--ltx-fg-color:#000000;">d) Relevance: Determine the extent to which the summary addresses the main points and key details of the article, ensuring that it provides a comprehensive overview.</span></span>
<span id="A1.F6.p3.pic1.1.6" class="ltx_p"><span id="A1.F6.p3.pic1.1.6.1" class="ltx_text" style="font-size:70%;--ltx-fg-color:#000000;">Please rate each summary on a scale of 1 to 5 (with 5 being the highest) based on the criteria outlined above.</span></span>
<span id="A1.F6.p3.pic1.1.7" class="ltx_p"><span id="A1.F6.p3.pic1.1.7.1" class="ltx_text" style="font-size:70%;--ltx-fg-color:#000000;">Your response should be in the following format:</span></span>
<span id="A1.F6.p3.pic1.1.8" class="ltx_p"><span id="A1.F6.p3.pic1.1.8.1" class="ltx_text" style="font-size:70%;--ltx-fg-color:#000000;">{
<br class="ltx_break">&quot;article&quot;: &lt;article&gt;,
<br class="ltx_break">&quot;summary&quot;: &lt;summary&gt;,
<br class="ltx_break">&quot;coherence_score&quot;: &lt;coherence_score&gt;,
<br class="ltx_break">&quot;consistency_score&quot;: &lt;consistency_score&gt;,
<br class="ltx_break">&quot;fluency_score&quot;: &lt;fluency_score&gt;,
<br class="ltx_break">&quot;relevance_score&quot;: &lt;relevance_score&gt; 
<br class="ltx_break">}
<br class="ltx_break"></span></span>
<span id="A1.F6.p3.pic1.1.9" class="ltx_p"><span id="A1.F6.p3.pic1.1.9.1" class="ltx_text" style="font-size:70%;--ltx-fg-color:#000000;">article: {article}</span></span>
<span id="A1.F6.p3.pic1.1.10" class="ltx_p"><span id="A1.F6.p3.pic1.1.10.1" class="ltx_text" style="font-size:70%;--ltx-fg-color:#000000;">summary: {summary}</span></span>
</span></span></span></foreignobject></g></g></svg>