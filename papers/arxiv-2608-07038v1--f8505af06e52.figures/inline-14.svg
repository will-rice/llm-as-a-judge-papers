<span id="S5.SS2.p3.pic1.1" class="ltx_inline-block ltx_minipage ltx_align_bottom" style="width:32.47em;">
<span id="S5.SS2.p3.pic1.1.1" class="ltx_p"><span id="S5.SS2.p3.pic1.1.1.1" class="ltx_text ltx_font_bold" style="--ltx-fg-color:#000000;">Answering RQ4:<span id="S5.SS2.p3.pic1.1.1.1.1" class="ltx_text ltx_font_medium"> <span id="S5.SS2.p3.pic1.1.1.1.1.1" class="ltx_text ltx_font_smallcaps">BinJudge</span> effectively bridges the gap between static and oracle configurations by adaptively selecting judge configurations for individual samples, improving Kendall’s <math id="S5.SS2.p3.pic1.m1" class="ltx_Math" alttext="\tau" display="inline" intent=":literal"><semantics><mi style="--ltx-fg-color:#000000;" mathcolor="#000000">τ</mi><annotation encoding="application/x-tex">\tau</annotation></semantics></math> by 4.5%–24.7% and reducing API costs to 0.06<math id="S5.SS2.p3.pic1.m2" class="ltx_Math" alttext="\times" display="inline" intent=":literal"><semantics><mo style="--ltx-fg-color:#000000;" mathcolor="#000000">×</mo><annotation encoding="application/x-tex">\times</annotation></semantics></math>–0.84<math id="S5.SS2.p3.pic1.m3" class="ltx_Math" alttext="\times" display="inline" intent=":literal"><semantics><mo style="--ltx-fg-color:#000000;" mathcolor="#000000">×</mo><annotation encoding="application/x-tex">\times</annotation></semantics></math> of static best configurations.</span></span></span>
