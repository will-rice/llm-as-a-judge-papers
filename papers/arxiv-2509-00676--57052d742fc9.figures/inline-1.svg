<span id="S1.p6.pic1.1.3.1.1.1" class="ltx_p"><math id="S1.p6.pic1.m2" class="ltx_Math" alttext="(ii)" display="inline" intent=":literal"><semantics><mrow><mo style="--ltx-fg-color:#000000;" mathcolor="#000000" stretchy="false">(</mo><mrow><mi style="--ltx-fg-color:#000000;" mathcolor="#000000">i</mi><mo lspace="0em" rspace="0em">​</mo><mi style="--ltx-fg-color:#000000;" mathcolor="#000000">i</mi></mrow><mo style="--ltx-fg-color:#000000;" mathcolor="#000000" stretchy="false">)</mo></mrow><annotation encoding="application/x-tex">(ii)</annotation></semantics></math><span id="S1.p6.pic1.1.3.1.1.1.1" class="ltx_text" style="--ltx-fg-color:#000000;"> This simple approach improves actor/critic capabilities simultaneously in one single model. The improved self-critic capability leads to better test-time scaling behavior.</span></span>
