<svg id="S15.SS0.SSS0.Px16.p3.pic1" class="ltx_picture" height="239.97" overflow="visible" version="1.1" viewbox="0 0 477.38 239.97" width="477.38"><g style="--ltx-stroke-color:#000000;--ltx-fill-color:#000000;" fill="#000000" stroke="#000000" stroke-width="0.4pt" transform="translate(0,239.97) matrix(1 0 0 -1 0 0)"><g style="--ltx-fill-color:#4285F4;" fill="#4285F4" fill-opacity="1.0"><path style="stroke:none" d="M 0 7.5 L 0 232.47 C 0 236.61 3.36 239.97 7.5 239.97 L 469.87 239.97 C 474.02 239.97 477.38 236.61 477.38 232.47 L 477.38 7.5 C 477.38 3.36 474.02 0 469.87 0 L 7.5 0 C 3.36 0 0 3.36 0 7.5 Z" /></g><g style="--ltx-fill-color:#F5F5F5;" fill="#F5F5F5" fill-opacity="1.0"><path style="stroke:none" d="M 1.97 7.5 L 1.97 201.59 L 475.41 201.59 L 475.41 7.5 C 475.41 4.45 472.93 1.97 469.87 1.97 L 7.5 1.97 C 4.45 1.97 1.97 4.45 1.97 7.5 Z" /></g><g fill-opacity="1.0" transform="matrix(1.0 0.0 0.0 1.0 20.48 209.02)"><foreignobject style="--ltx-fo-width:27.43em;--ltx-fo-height:1.89em;--ltx-fo-depth:0.19em;font-size:10pt;" height="28.9" overflow="visible" transform="matrix(1 0 0 -1 0 26.21)" width="379.55"><span class="ltx_foreignobject_container"><span class="ltx_foreignobject_content">
<span id="S15.SS0.SSS0.Px16.p3.pic1.1" class="ltx_inline-block ltx_minipage ltx_align_bottom" style="width:27.43em;">
<span id="S15.SS0.SSS0.Px16.p3.pic1.1.1" class="ltx_p"><span id="S15.SS0.SSS0.Px16.p3.pic1.1.1.1" class="ltx_text" style="position:relative; bottom:0.9pt;"></span><a href="https://codeforces.com/blog/entry/141047" title class="ltx_ref ltx_href ltx_font_bold" style="--ltx-fg-color:#FFFFFF;">Tutorial</a><span id="S15.SS0.SSS0.Px16.p3.pic1.1.1.2" class="ltx_text ltx_font_bold" style="--ltx-fg-color:#FFFFFF;"> — <a href="https://codeforces.com/problemset/submission/2091/312898691" title class="ltx_ref ltx_href">Human’s accepted submission</a> — <a href="https://gist.github.com/anonymous-llm-code/aa9e0ccfc60fd60b8ad12720cd2d05a2" title class="ltx_ref ltx_href"><span class="ltx_text ltx_font_typewriter">o4-mini-high</span>’s rejected submission</a></span></span>
</span></span></span></foreignobject></g><g fill-opacity="1.0" transform="matrix(1.0 0.0 0.0 1.0 20.48 15.3)"><foreignobject style="--ltx-fo-width:31.54em;--ltx-fo-height:12.69em;--ltx-fo-depth:0.19em;font-size:10pt;" height="178.35" overflow="visible" transform="matrix(1 0 0 -1 0 175.66)" width="436.42"><span class="ltx_foreignobject_container"><span class="ltx_foreignobject_content">
<span id="S15.SS0.SSS0.Px16.p3.pic1.2" class="ltx_inline-block ltx_minipage ltx_align_bottom" style="width:31.54em;">
<span id="S15.SS0.SSS0.Px16.p3.pic1.2.1" class="ltx_p"><span id="S15.SS0.SSS0.Px16.p3.pic1.2.1.1" class="ltx_text" style="--ltx-fg-color:#000000;">Let the length of the maximal bench be <math id="S15.SS0.SSS0.Px16.p3.pic1.m1" class="ltx_Math" alttext="x" display="inline" intent=":literal"><semantics><mi style="--ltx-fg-color:#000000;" mathcolor="#000000">x</mi><annotation encoding="application/x-tex">x</annotation></semantics></math>, then to maximize the number of desks in one row—we need to put as many benches of exactly <math id="S15.SS0.SSS0.Px16.p3.pic1.m2" class="ltx_Math" alttext="x" display="inline" intent=":literal"><semantics><mi style="--ltx-fg-color:#000000;" mathcolor="#000000">x</mi><annotation encoding="application/x-tex">x</annotation></semantics></math> length as possible. There should be an indent after each bench, let’s say, that the length of the block is <math id="S15.SS0.SSS0.Px16.p3.pic1.m3" class="ltx_Math" alttext="x+1" display="inline" intent=":literal"><semantics><mrow><mi style="--ltx-fg-color:#000000;" mathcolor="#000000">x</mi><mo style="--ltx-fg-color:#000000;" mathcolor="#000000">+</mo><mn style="--ltx-fg-color:#000000;" mathcolor="#000000">1</mn></mrow><annotation encoding="application/x-tex">x+1</annotation></semantics></math>. The total number of such blocks in a row will be <math id="S15.SS0.SSS0.Px16.p3.pic1.m4" class="ltx_Math" alttext="\lfloor\frac{m}{x+1}\rfloor" display="inline" intent=":literal"><semantics><mrow><mo style="--ltx-fg-color:#000000;" mathcolor="#000000" stretchy="false">⌊</mo><mfrac style="--ltx-fg-color:#000000;" mathcolor="#000000"><mi style="--ltx-fg-color:#000000;" mathcolor="#000000">m</mi><mrow><mi style="--ltx-fg-color:#000000;" mathcolor="#000000">x</mi><mo style="--ltx-fg-color:#000000;" mathcolor="#000000">+</mo><mn style="--ltx-fg-color:#000000;" mathcolor="#000000">1</mn></mrow></mfrac><mo style="--ltx-fg-color:#000000;" mathcolor="#000000" stretchy="false">⌋</mo></mrow><annotation encoding="application/x-tex">\lfloor\frac{m}{x+1}\rfloor</annotation></semantics></math>, and the last bench will have a length of <math id="S15.SS0.SSS0.Px16.p3.pic1.m5" class="ltx_Math" alttext="m\mod(x+1)" display="inline" intent=":literal"><semantics><mrow><mi style="--ltx-fg-color:#000000;" mathcolor="#000000">m</mi><mo style="--ltx-fg-color:#000000;" mathcolor="#000000">mod</mo><mrow><mo style="--ltx-fg-color:#000000;" mathcolor="#000000" stretchy="false">(</mo><mrow><mi style="--ltx-fg-color:#000000;" mathcolor="#000000">x</mi><mo style="--ltx-fg-color:#000000;" mathcolor="#000000">+</mo><mn style="--ltx-fg-color:#000000;" mathcolor="#000000">1</mn></mrow><mo style="--ltx-fg-color:#000000;" mathcolor="#000000" stretchy="false">)</mo></mrow></mrow><annotation encoding="application/x-tex">m\mod(x+1)</annotation></semantics></math>. 
<br class="ltx_break">
<br class="ltx_break">Then the number of desks in one row can reach <math id="S15.SS0.SSS0.Px16.p3.pic1.m6" class="ltx_Math" alttext="f(x)=x\cdot\lfloor\frac{m}{x+1}\rfloor+(m\mod(x+1))" display="inline" intent=":literal"><semantics><mrow><mrow><mi style="--ltx-fg-color:#000000;" mathcolor="#000000">f</mi><mo>⁡</mo><mrow><mo style="--ltx-fg-color:#000000;" mathcolor="#000000" stretchy="false">(</mo><mi style="--ltx-fg-color:#000000;" mathcolor="#000000">x</mi><mo style="--ltx-fg-color:#000000;" mathcolor="#000000" stretchy="false">)</mo></mrow></mrow><mo style="--ltx-fg-color:#000000;" mathcolor="#000000">=</mo><mrow><mrow><mi style="--ltx-fg-color:#000000;" mathcolor="#000000">x</mi><mo style="--ltx-fg-color:#000000;" lspace="0.222em" mathcolor="#000000" rspace="0.222em">⋅</mo><mrow><mo style="--ltx-fg-color:#000000;" mathcolor="#000000" stretchy="false">⌊</mo><mfrac style="--ltx-fg-color:#000000;" mathcolor="#000000"><mi style="--ltx-fg-color:#000000;" mathcolor="#000000">m</mi><mrow><mi style="--ltx-fg-color:#000000;" mathcolor="#000000">x</mi><mo style="--ltx-fg-color:#000000;" mathcolor="#000000">+</mo><mn style="--ltx-fg-color:#000000;" mathcolor="#000000">1</mn></mrow></mfrac><mo style="--ltx-fg-color:#000000;" mathcolor="#000000" stretchy="false">⌋</mo></mrow></mrow><mo style="--ltx-fg-color:#000000;" mathcolor="#000000">+</mo><mrow><mo style="--ltx-fg-color:#000000;" mathcolor="#000000" stretchy="false">(</mo><mrow><mi style="--ltx-fg-color:#000000;" mathcolor="#000000">m</mi><mo style="--ltx-fg-color:#000000;" mathcolor="#000000">mod</mo><mrow><mo style="--ltx-fg-color:#000000;" mathcolor="#000000" stretchy="false">(</mo><mrow><mi style="--ltx-fg-color:#000000;" mathcolor="#000000">x</mi><mo style="--ltx-fg-color:#000000;" mathcolor="#000000">+</mo><mn style="--ltx-fg-color:#000000;" mathcolor="#000000">1</mn></mrow><mo style="--ltx-fg-color:#000000;" mathcolor="#000000" stretchy="false">)</mo></mrow></mrow><mo style="--ltx-fg-color:#000000;" mathcolor="#000000" stretchy="false">)</mo></mrow></mrow></mrow><annotation encoding="application/x-tex">f(x)=x\cdot\lfloor\frac{m}{x+1}\rfloor+(m\mod(x+1))</annotation></semantics></math>. 
<br class="ltx_break">
<br class="ltx_break">Since the rows are independent, there should be <math id="S15.SS0.SSS0.Px16.p3.pic1.m7" class="ltx_Math" alttext="k\leq n\cdot f(x)" display="inline" intent=":literal"><semantics><mrow><mi style="--ltx-fg-color:#000000;" mathcolor="#000000">k</mi><mo style="--ltx-fg-color:#000000;" mathcolor="#000000">≤</mo><mrow><mi style="--ltx-fg-color:#000000;" mathcolor="#000000">n</mi><mo style="--ltx-fg-color:#000000;" lspace="0.222em" mathcolor="#000000" rspace="0.222em">⋅</mo><mrow><mi style="--ltx-fg-color:#000000;" mathcolor="#000000">f</mi><mo>⁡</mo><mrow><mo style="--ltx-fg-color:#000000;" mathcolor="#000000" stretchy="false">(</mo><mi style="--ltx-fg-color:#000000;" mathcolor="#000000">x</mi><mo style="--ltx-fg-color:#000000;" mathcolor="#000000" stretchy="false">)</mo></mrow></mrow></mrow></mrow><annotation encoding="application/x-tex">k\leq n\cdot f(x)</annotation></semantics></math> desks in total. We need to find the minimum <math id="S15.SS0.SSS0.Px16.p3.pic1.m8" class="ltx_Math" alttext="x" display="inline" intent=":literal"><semantics><mi style="--ltx-fg-color:#000000;" mathcolor="#000000">x</mi><annotation encoding="application/x-tex">x</annotation></semantics></math>, and since <math id="S15.SS0.SSS0.Px16.p3.pic1.m9" class="ltx_Math" alttext="f(x)" display="inline" intent=":literal"><semantics><mrow><mi style="--ltx-fg-color:#000000;" mathcolor="#000000">f</mi><mo>⁡</mo><mrow><mo style="--ltx-fg-color:#000000;" mathcolor="#000000" stretchy="false">(</mo><mi style="--ltx-fg-color:#000000;" mathcolor="#000000">x</mi><mo style="--ltx-fg-color:#000000;" mathcolor="#000000" stretchy="false">)</mo></mrow></mrow><annotation encoding="application/x-tex">f(x)</annotation></semantics></math> is monotonically non-decreasing, then the answer can be found using binary search.</span></span>
</span></span></span></foreignobject></g></g></svg>