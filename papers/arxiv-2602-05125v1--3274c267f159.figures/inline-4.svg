<svg id="A6.SS2.p2.pic1" class="ltx_picture" height="623.18" overflow="visible" version="1.1" viewbox="0 0 653.15 623.18" width="653.15"><g style="--ltx-stroke-color:#000000;--ltx-fill-color:#000000;" fill="#000000" stroke="#000000" stroke-width="0.4pt" transform="translate(0,623.18) matrix(1 0 0 -1 0 0)"><g style="--ltx-fill-color:#000000;" fill="#000000" fill-opacity="1.0"><path style="stroke:none" d="M 0 8.57 L 0 614.62 C 0 619.35 3.84 623.18 8.57 623.18 L 644.58 623.18 C 649.31 623.18 653.15 619.35 653.15 614.62 L 653.15 8.57 C 653.15 3.84 649.31 0 644.58 0 L 8.57 0 C 3.84 0 0 3.84 0 8.57 Z" /></g><g style="--ltx-fill-color:#FFFFFF;" fill="#FFFFFF" fill-opacity="1.0"><path style="stroke:none" d="M 0.69 8.57 L 0.69 601.62 L 652.46 601.62 L 652.46 8.57 C 652.46 4.22 648.93 0.69 644.58 0.69 L 8.57 0.69 C 4.22 0.69 0.69 4.22 0.69 8.57 Z" /></g><g fill-opacity="1.0" transform="matrix(1.0 0.0 0.0 1.0 12.5 608.94)"><foreignobject style="--ltx-fo-width:45.4em;--ltx-fo-height:0.69em;--ltx-fo-depth:0.19em;font-size:10pt;" height="12.3" overflow="visible" transform="matrix(1 0 0 -1 0 9.61)" width="628.21"><span class="ltx_foreignobject_container"><span class="ltx_foreignobject_content">
<span id="A6.SS2.p2.pic1.1" class="ltx_inline-block ltx_minipage ltx_align_bottom" style="width:45.4em;">
<span id="A6.SS2.p2.pic1.1.1" class="ltx_p"><span id="A6.SS2.p2.pic1.1.1.1" class="ltx_text" style="--ltx-fg-color:#FFFFFF;">Prompt for checking conflicting rubrics.</span></span>
</span></span></span></foreignobject></g><g fill-opacity="1.0" transform="matrix(1.0 0.0 0.0 1.0 12.5 27.49)"><foreignobject style="--ltx-fo-width:45.4em;--ltx-fo-height:40.64em;--ltx-fo-depth:1.08em;font-size:10pt;" height="577.32" overflow="visible" transform="matrix(1 0 0 -1 0 562.33)" width="628.21"><span class="ltx_foreignobject_container"><span class="ltx_foreignobject_content">
<span id="A6.SS2.p2.pic1.2" class="ltx_inline-block ltx_minipage ltx_align_bottom" style="width:45.4em;">
<span id="A6.SS2.p2.pic1.2.1" class="ltx_p"><span id="A6.SS2.p2.pic1.2.1.1" class="ltx_text" style="--ltx-fg-color:#000000;">You are checking whether a new rubric expresses opposite meaning
of ANY of the existing rubrics. If ANY opposition is found, output YES; otherwise output NO.</span></span>
<span id="A6.SS2.p2.pic1.2.2" class="ltx_p"><span id="A6.SS2.p2.pic1.2.2.1" class="ltx_text" style="--ltx-fg-color:#000000;">Definition of opposition:</span></span>
<span id="A6.I23" class="ltx_itemize" style="--ltx-enum-leftmargin:1.2em;">
<span id="A6.I23.i1" class="ltx_item" style="list-style-type:none;"><span class="ltx_tag ltx_tag_item">•</span> 
<span id="A6.I23.i1.p1" class="ltx_para">
<span id="A6.I23.i1.p1.1" class="ltx_p"><span id="A6.I23.i1.p1.1.1" class="ltx_text" style="--ltx-fg-color:#000000;">“Opposite” means the new rubric asserts the negation or reverse polarity of the same requirement, property, or direction as an existing rubric.</span></span>
</span></span>
<span id="A6.I23.i2" class="ltx_item" style="list-style-type:none;"><span class="ltx_tag ltx_tag_item">•</span> 
<span id="A6.I23.i2.p1" class="ltx_para">
<span id="A6.I23.i2.p1.1" class="ltx_p"><span id="A6.I23.i2.p1.1.1" class="ltx_text" style="--ltx-fg-color:#000000;">Examples:</span></span>
<span id="A6.I23.i2.I1" class="ltx_itemize" style="--ltx-enum-leftmargin:1.6em;">
<span id="A6.I23.i2.I1.i1" class="ltx_item" style="list-style-type:none;"><span class="ltx_tag ltx_tag_item"><span id="A6.I23.i2.I1.i1.1" class="ltx_text ltx_font_bold">–</span></span> 
<span id="A6.I23.i2.I1.i1.p1" class="ltx_para">
<span id="A6.I23.i2.I1.i1.p1.1" class="ltx_p"><span id="A6.I23.i2.I1.i1.p1.1.1" class="ltx_text" style="--ltx-fg-color:#000000;">require X </span><math id="A6.I23.i2.I1.i1.p1.m1" class="ltx_Math" alttext="\leftrightarrow" display="inline" intent=":literal"><semantics><mo style="--ltx-fg-color:#000000;" mathcolor="#000000" stretchy="false">↔</mo><annotation encoding="application/x-tex">\leftrightarrow</annotation></semantics></math><span id="A6.I23.i2.I1.i1.p1.1.2" class="ltx_text" style="--ltx-fg-color:#000000;"> forbid/avoid X</span></span>
</span></span>
<span id="A6.I23.i2.I1.i2" class="ltx_item" style="list-style-type:none;"><span class="ltx_tag ltx_tag_item"><span id="A6.I23.i2.I1.i2.1" class="ltx_text ltx_font_bold">–</span></span> 
<span id="A6.I23.i2.I1.i2.p1" class="ltx_para">
<span id="A6.I23.i2.I1.i2.p1.1" class="ltx_p"><span id="A6.I23.i2.I1.i2.p1.1.1" class="ltx_text" style="--ltx-fg-color:#000000;">must include X </span><math id="A6.I23.i2.I1.i2.p1.m1" class="ltx_Math" alttext="\leftrightarrow" display="inline" intent=":literal"><semantics><mo style="--ltx-fg-color:#000000;" mathcolor="#000000" stretchy="false">↔</mo><annotation encoding="application/x-tex">\leftrightarrow</annotation></semantics></math><span id="A6.I23.i2.I1.i2.p1.1.2" class="ltx_text" style="--ltx-fg-color:#000000;"> must NOT include X</span></span>
</span></span>
<span id="A6.I23.i2.I1.i3" class="ltx_item" style="list-style-type:none;"><span class="ltx_tag ltx_tag_item"><span id="A6.I23.i2.I1.i3.1" class="ltx_text ltx_font_bold">–</span></span> 
<span id="A6.I23.i2.I1.i3.p1" class="ltx_para">
<span id="A6.I23.i2.I1.i3.p1.1" class="ltx_p"><span id="A6.I23.i2.I1.i3.p1.1.1" class="ltx_text" style="--ltx-fg-color:#000000;">prefer more of X </span><math id="A6.I23.i2.I1.i3.p1.m1" class="ltx_Math" alttext="\leftrightarrow" display="inline" intent=":literal"><semantics><mo style="--ltx-fg-color:#000000;" mathcolor="#000000" stretchy="false">↔</mo><annotation encoding="application/x-tex">\leftrightarrow</annotation></semantics></math><span id="A6.I23.i2.I1.i3.p1.1.2" class="ltx_text" style="--ltx-fg-color:#000000;"> prefer less of X (same X, opposite direction)</span></span>
</span></span>
<span id="A6.I23.i2.I1.i4" class="ltx_item" style="list-style-type:none;"><span class="ltx_tag ltx_tag_item"><span id="A6.I23.i2.I1.i4.1" class="ltx_text ltx_font_bold">–</span></span> 
<span id="A6.I23.i2.I1.i4.p1" class="ltx_para">
<span id="A6.I23.i2.I1.i4.p1.1" class="ltx_p"><span id="A6.I23.i2.I1.i4.p1.1.1" class="ltx_text" style="--ltx-fg-color:#000000;">answer should be optimistic </span><math id="A6.I23.i2.I1.i4.p1.m1" class="ltx_Math" alttext="\leftrightarrow" display="inline" intent=":literal"><semantics><mo style="--ltx-fg-color:#000000;" mathcolor="#000000" stretchy="false">↔</mo><annotation encoding="application/x-tex">\leftrightarrow</annotation></semantics></math><span id="A6.I23.i2.I1.i4.p1.1.2" class="ltx_text" style="--ltx-fg-color:#000000;"> answer should be pessimistic</span></span>
</span></span>
</span>
</span></span>
<span id="A6.I23.i3" class="ltx_item" style="list-style-type:none;"><span class="ltx_tag ltx_tag_item">•</span> 
<span id="A6.I23.i3.p1" class="ltx_para">
<span id="A6.I23.i3.p1.1" class="ltx_p"><span id="A6.I23.i3.p1.1.1" class="ltx_text" style="--ltx-fg-color:#000000;">Do NOT flag different targets or contexts.</span></span>
</span></span>
<span id="A6.I23.i4" class="ltx_item" style="list-style-type:none;"><span class="ltx_tag ltx_tag_item">•</span> 
<span id="A6.I23.i4.p1" class="ltx_para">
<span id="A6.I23.i4.p1.1" class="ltx_p"><span id="A6.I23.i4.p1.1.1" class="ltx_text" style="--ltx-fg-color:#000000;">Do NOT flag orthogonal dimensions (e.g., tone vs citations or “be clear” vs “be concise”)</span></span>
</span></span>
<span id="A6.I23.i5" class="ltx_item" style="list-style-type:none;"><span class="ltx_tag ltx_tag_item">•</span> 
<span id="A6.I23.i5.p1" class="ltx_para">
<span id="A6.I23.i5.p1.1" class="ltx_p"><span id="A6.I23.i5.p1.1.1" class="ltx_text" style="--ltx-fg-color:#000000;">Do NOT flag mere differences in emphasis, strength, scope, or style.</span></span>
</span></span>
<span id="A6.I23.i6" class="ltx_item" style="list-style-type:none;"><span class="ltx_tag ltx_tag_item">•</span> 
<span id="A6.I23.i6.p1" class="ltx_para">
<span id="A6.I23.i6.p1.1" class="ltx_p"><span id="A6.I23.i6.p1.1.1" class="ltx_text" style="--ltx-fg-color:#000000;">Do NOT flag stricter/looser thresholds unless they clearly reverse direction on the same axis (e.g., “maximize brevity” vs “maximize elaboration” = opposite; “</span><math id="A6.I23.i6.p1.m1" class="ltx_Math" alttext="\leq 120" display="inline" intent=":literal"><semantics><mrow><mphantom></mphantom><mo style="--ltx-fg-color:#000000;" mathcolor="#000000">≤</mo><mn style="--ltx-fg-color:#000000;" mathcolor="#000000">120</mn></mrow><annotation encoding="application/x-tex">\leq 120</annotation></semantics></math><span id="A6.I23.i6.p1.1.2" class="ltx_text" style="--ltx-fg-color:#000000;"> words” vs “</span><math id="A6.I23.i6.p1.m2" class="ltx_Math" alttext="\leq 150" display="inline" intent=":literal"><semantics><mrow><mphantom></mphantom><mo style="--ltx-fg-color:#000000;" mathcolor="#000000">≤</mo><mn style="--ltx-fg-color:#000000;" mathcolor="#000000">150</mn></mrow><annotation encoding="application/x-tex">\leq 150</annotation></semantics></math><span id="A6.I23.i6.p1.1.3" class="ltx_text" style="--ltx-fg-color:#000000;"> words” = NOT opposite).</span></span>
</span></span>
</span>
<span id="A6.SS2.p2.pic1.2.3" class="ltx_p"><span id="A6.SS2.p2.pic1.2.3.1" class="ltx_text" style="--ltx-fg-color:#000000;">Input format:</span></span>
<span id="A6.I24" class="ltx_itemize" style="--ltx-enum-leftmargin:1.2em;">
<span id="A6.I24.i1" class="ltx_item" style="list-style-type:none;"><span class="ltx_tag ltx_tag_item">•</span> 
<span id="A6.I24.i1.p1" class="ltx_para">
<span id="A6.I24.i1.p1.1" class="ltx_p"><span id="A6.I24.i1.p1.1.1" class="ltx_text ltx_font_typewriter" style="--ltx-fg-color:#000000;">EXISTING_RUBRICS: {existing_rubrics}</span></span>
</span></span>
<span id="A6.I24.i2" class="ltx_item" style="list-style-type:none;"><span class="ltx_tag ltx_tag_item">•</span> 
<span id="A6.I24.i2.p1" class="ltx_para">
<span id="A6.I24.i2.p1.1" class="ltx_p"><span id="A6.I24.i2.p1.1.1" class="ltx_text ltx_font_typewriter" style="--ltx-fg-color:#000000;">NEW_RUBRIC: {new_rubric}</span></span>
</span></span>
</span>
<span id="A6.SS2.p2.pic1.2.4" class="ltx_p"><span id="A6.SS2.p2.pic1.2.4.1" class="ltx_text" style="--ltx-fg-color:#000000;">Output STRICTLY in below format. No other text is allowed:</span></span>
<span id="A6.I25" class="ltx_itemize" style="--ltx-enum-leftmargin:1.2em;">
<span id="A6.I25.i1" class="ltx_item" style="list-style-type:none;"><span class="ltx_tag ltx_tag_item">•</span> 
<span id="A6.I25.i1.p1" class="ltx_para">
<span id="A6.I25.i1.p1.1" class="ltx_p"><span id="A6.I25.i1.p1.1.1" class="ltx_text ltx_font_typewriter" style="--ltx-fg-color:#000000;">&lt;EVALUATION&gt; YES/NO &lt;/EVALUATION&gt;</span></span>
</span></span>
</span>
</span></span></span></foreignobject></g></g></svg>