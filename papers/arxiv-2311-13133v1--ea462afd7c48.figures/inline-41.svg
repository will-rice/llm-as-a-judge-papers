<span id="A8.SS1.p10.pic1.1" class="ltx_inline-block ltx_minipage ltx_align_bottom" style="width:36.91em;">
<span id="A8.SS1.p10.pic1.1.1" class="ltx_p"><span id="A8.SS1.p10.pic1.1.1.1" class="ltx_text ltx_font_sansserif" style="font-size:80%;--ltx-fg-color:#000000;">There are several ways you can tell if a book is widely used and well accepted by scholars. First, it should be cited in scholarly articles. Second, it should be included in university syllabi. And third, it should be reviewed in respected academic journals. If you can find any of these three things, you can be confident that the book is widely used and well accepted by scholars.</span></span>
