<span id="A3.F5.pic3.p1" class="ltx_para ltx_noindent" lang="es">
<span id="A3.F5.pic3.p1.1" class="ltx_p"><span id="A3.F5.pic3.p1.1.1" class="ltx_text" style="--ltx-fg-color:#000000;">La Policía ha detenido en Alemania a un joven de 17 años, sospechoso de haber matado a su hermana de 14 años en Mataró, Barcelona, el pasado junio. El joven ya ha sido trasladado a España y puesto a disposición de la fiscalía de menores. El crimen ocurrió cuando su madre estaba de viaje y los adolescentes se quedaron solos en su casa. La madre, al no poder contactar con ellos, pidió a unos amigos que fueran a su domicilio, donde encontraron el cadáver de la menor con heridas de arma blanca y sin rastro del hermano.</span></span>
</span></span></span></span></foreignobject></g></g></svg>