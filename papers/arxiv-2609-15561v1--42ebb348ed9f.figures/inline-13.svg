</span></span>
<span id="A4.I3.i4" class="ltx_item" style="list-style-type:none;"><span class="ltx_tag ltx_tag_item">•</span> 
<span id="A4.I3.i4.p1" class="ltx_para ltx_noindent">
<span id="A4.I3.i4.p1.1" class="ltx_p"><span id="A4.I3.i4.p1.1.1" class="ltx_text ltx_font_bold" style="--ltx-fg-color:#000000;">A3 (High perturbation)</span><span id="A4.I3.i4.p1.1.2" class="ltx_text" style="--ltx-fg-color:#000000;">: “Jeanie with the Light Brown Hair” is </span><span id="A4.I3.i4.p1.1.3" class="ltx_text" style="--ltx-fg-color:#008080;">a parlor song</span><span id="A4.I3.i4.p1.1.4" class="ltx_text" style="--ltx-fg-color:#000000;"> song created by </span><span id="A4.I3.i4.p1.1.5" class="ltx_text" style="--ltx-fg-color:#FF0000;">Henry Bishop (1810–1880)</span><span id="A4.I3.i4.p1.1.6" class="ltx_text" style="--ltx-fg-color:#000000;">, published by </span><span id="A4.I3.i4.p1.1.7" class="ltx_text" style="--ltx-fg-color:#FF0000;">Morris</span><span id="A4.I3.i4.p1.1.8" class="ltx_text" style="--ltx-fg-color:#000000;">, </span><span id="A4.I3.i4.p1.1.9" class="ltx_text" style="--ltx-fg-color:#FF0000;">Lake &amp; Co.</span><span id="A4.I3.i4.p1.1.10" class="ltx_text" style="--ltx-fg-color:#000000;"> </span><span id="A4.I3.i4.p1.1.11" class="ltx_text" style="--ltx-fg-color:#FF0000;">in Philadelphia</span><span id="A4.I3.i4.p1.1.12" class="ltx_text" style="--ltx-fg-color:#000000;"> </span><span id="A4.I3.i4.p1.1.13" class="ltx_text" style="--ltx-fg-color:#008080;">in 1854</span><span id="A4.I3.i4.p1.1.14" class="ltx_text" style="--ltx-fg-color:#000000;">. Foster composed the song thinking of an </span><span id="A4.I3.i4.p1.1.15" class="ltx_text" style="--ltx-fg-color:#FF0000;">old friend</span><span id="A4.I3.i4.p1.1.16" class="ltx_text" style="--ltx-fg-color:#000000;">, </span><span id="A4.I3.i4.p1.1.17" class="ltx_text" style="--ltx-fg-color:#FF0000;">Anna Brown</span><span id="A4.I3.i4.p1.1.18" class="ltx_text" style="--ltx-fg-color:#000000;">, and the lyrics hint at an enduring separation.</span></span>
