<svg id="A6.F9.pic1" class="ltx_picture ltx_centering" height="612.41" overflow="visible" version="1.1" viewbox="0 0 653.15 612.41" width="653.15"><g style="--ltx-stroke-color:#000000;--ltx-fill-color:#000000;" fill="#000000" stroke="#000000" stroke-width="0.4pt" transform="translate(0,612.41) matrix(1 0 0 -1 0 0)"><g style="--ltx-fill-color:#000000;" fill="#000000" fill-opacity="1.0"><path style="stroke:none" d="M 0 7.09 L 0 605.33 C 0 609.24 3.17 612.41 7.09 612.41 L 646.06 612.41 C 649.98 612.41 653.15 609.24 653.15 605.33 L 653.15 7.09 C 653.15 3.17 649.98 0 646.06 0 L 7.09 0 C 3.17 0 0 3.17 0 7.09 Z" /></g><g style="--ltx-fill-color:#FFF2E6;" fill="#FFF2E6" fill-opacity="1.0"><path style="stroke:none" d="M 3.15 7.09 L 3.15 585.94 L 650 585.94 L 650 7.09 C 650 4.91 648.24 3.15 646.06 3.15 L 7.09 3.15 C 4.91 3.15 3.15 4.91 3.15 7.09 Z" /></g><g style="--ltx-fill-color:#FFBF80;" fill="#FFBF80" fill-opacity="1.0"><path style="stroke:none" d="M 3.15 589.09 L 3.15 605.33 C 3.15 607.5 4.91 609.26 7.09 609.26 L 646.06 609.26 C 648.24 609.26 650 607.5 650 605.33 L 650 589.09 Z" /></g><g fill-opacity="1.0" transform="matrix(1.0 0.0 0.0 1.0 22.83 595.72)"><foreignobject style="--ltx-fo-width:38.17em;--ltx-fo-height:0.69em;--ltx-fo-depth:0.19em;font-size:10pt;" height="12.3" overflow="visible" transform="matrix(1 0 0 -1 0 9.61)" width="528.17"><span class="ltx_foreignobject_container"><span class="ltx_foreignobject_content">
<span id="A6.F9.pic1.1" class="ltx_inline-block ltx_minipage ltx_align_bottom" style="width:38.17em;">
<span id="A6.F9.pic1.1.1" class="ltx_p"><span id="A6.F9.pic1.1.1.1" class="ltx_text ltx_font_bold" style="--ltx-fg-color:#000000;">Filtering Prompt</span></span>
</span></span></span></foreignobject></g><g fill-opacity="1.0" transform="matrix(1.0 0.0 0.0 1.0 22.83 97.98)"><foreignobject style="--ltx-fo-width:43.9em;--ltx-fo-height:34.41em;--ltx-fo-depth:6em;font-size:10pt;" height="559.18" overflow="visible" transform="matrix(1 0 0 -1 0 476.15)" width="607.45"><span class="ltx_foreignobject_container"><span class="ltx_foreignobject_content">
<span id="A6.F9.pic1.2" class="ltx_inline-block ltx_minipage ltx_align_bottom" style="width:43.9em;">
<span id="A6.F9.pic1.2.1" class="ltx_p"><span id="A6.F9.pic1.2.1.1" class="ltx_text ltx_font_bold" style="--ltx-fg-color:#000000;">&lt;Task Overview&gt;
<br class="ltx_break"><span id="A6.F9.pic1.2.1.1.1" class="ltx_text ltx_font_typewriter ltx_font_medium">Your task is to filter out questions from a list based on the following criteria:<span id="A6.F9.pic1.2.1.1.1.1" class="ltx_text ltx_font_serif">
</span></span></span></span>
<span id="A6.F9.pic1.2.2" class="ltx_p"><span id="A6.F9.pic1.2.2.1" class="ltx_text ltx_font_bold" style="--ltx-fg-color:#000000;">1) dimension Alignment:
<br class="ltx_break"><span id="A6.F9.pic1.2.2.1.1" class="ltx_text ltx_font_typewriter ltx_font_medium">- dimension definition: {dimension def}
<br class="ltx_break">- Remove questions that deviate from the given dimension’s definition.
<br class="ltx_break">- Remove questions that are more closely related to other dimensions than the current one.<span id="A6.F9.pic1.2.2.1.1.1" class="ltx_text ltx_font_serif">
</span></span></span></span>
<span id="A6.F9.pic1.2.3" class="ltx_p"><span id="A6.F9.pic1.2.3.1" class="ltx_text ltx_font_bold" style="--ltx-fg-color:#000000;">2) Redundancy:
<br class="ltx_break"><span id="A6.F9.pic1.2.3.1.1" class="ltx_text ltx_font_typewriter ltx_font_medium">- Remove questions that:
<br class="ltx_break"> * Ask for the same or very similar information (even if phrased differently).
<br class="ltx_break"> * Convey very similar meanings without adding unique insight.<span id="A6.F9.pic1.2.3.1.1.1" class="ltx_text ltx_font_serif">
</span></span></span></span>
<span id="A6.F9.pic1.2.4" class="ltx_p"><span id="A6.F9.pic1.2.4.1" class="ltx_text ltx_font_bold" style="--ltx-fg-color:#000000;">3) Style:
<br class="ltx_break"><span id="A6.F9.pic1.2.4.1.1" class="ltx_text ltx_font_typewriter ltx_font_medium">- Remove questions that:
<br class="ltx_break"> * Use overly exaggerated wording.
<br class="ltx_break"> * Focus on excessively detailed or minor points that don’t meaningfully affect overall quality.<span id="A6.F9.pic1.2.4.1.1.1" class="ltx_text ltx_font_serif">
</span></span></span></span>
<span id="A6.F9.pic1.2.5" class="ltx_p"><span id="A6.F9.pic1.2.5.1" class="ltx_text ltx_font_bold" style="--ltx-fg-color:#000000;">4) Benchmark Context
<br class="ltx_break"><span id="A6.F9.pic1.2.5.1.1" class="ltx_text ltx_font_typewriter ltx_font_medium">- Name: Topical-Chat
<br class="ltx_break">- Purpose: Evaluation of knowledge-grounded dialogue systems
<br class="ltx_break">- Key Metrics: Naturalness, Coherence, Engagingness, Groundedness
<br class="ltx_break">- Do not modify any of the remaining questions or generate new ones.
<br class="ltx_break">- Keep questions in their original dictionary format.<span id="A6.F9.pic1.2.5.1.1.1" class="ltx_text ltx_font_serif">
</span></span></span></span>
<span id="A6.F9.pic1.2.6" class="ltx_p"><span id="A6.F9.pic1.2.6.1" class="ltx_text ltx_font_bold" style="--ltx-fg-color:#000000;">5) Sub-dimensions and Questions:
<br class="ltx_break"><span id="A6.F9.pic1.2.6.1.1" class="ltx_text ltx_font_typewriter ltx_font_medium">{format_sub_dimensions(sub_dimensions)}<span id="A6.F9.pic1.2.6.1.1.1" class="ltx_text ltx_font_serif">
</span></span></span></span>
<span id="A6.F9.pic1.2.7" class="ltx_p"><span id="A6.F9.pic1.2.7.1" class="ltx_text ltx_font_bold" style="--ltx-fg-color:#000000;">6) Output Requirements:
<br class="ltx_break"><span id="A6.F9.pic1.2.7.1.1" class="ltx_text ltx_font_typewriter ltx_font_medium">- Output format: JSON only
<br class="ltx_break">- Structure:<span id="A6.F9.pic1.2.7.1.1.1" class="ltx_text ltx_font_serif">
</span></span></span></span><pre id="A6.F9.pic1.2.8" class="ltx_verbatim ltx_font_typewriter" style="--ltx-fg-color:#000000;">
{&quot;Sub-dimension Name&quot;: [
    &quot;Filtered Question 1&quot;,
    &quot;Filtered Question 2&quot;]}
        
</pre>
<span id="A6.F9.pic1.2.9" class="ltx_p"><span id="A6.F9.pic1.2.9.1" class="ltx_text ltx_font_bold" style="--ltx-fg-color:#000000;">&lt;Important Note&gt;
<br class="ltx_break"><span id="A6.F9.pic1.2.9.1.1" class="ltx_text ltx_font_typewriter ltx_font_medium">
- Do not modify the content of remaining questions
<br class="ltx_break">- Do not generate new questions
<br class="ltx_break">- Maintain the original dictionary format
<br class="ltx_break">- Only remove questions that fail the above criteria
<br class="ltx_break">- Do not remove entire sub-dimensions or their keys unless no valid questions remain.<span id="A6.F9.pic1.2.9.1.1.1" class="ltx_text ltx_font_serif">
</span></span></span></span>
</span></span></span></foreignobject></g></g></svg>