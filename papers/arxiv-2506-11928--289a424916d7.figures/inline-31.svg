<svg id="S15.SS0.SSS0.Px13.p2.pic1" class="ltx_picture" height="578.27" overflow="visible" version="1.1" viewbox="0 0 477.38 578.27" width="477.38"><g style="--ltx-stroke-color:#000000;--ltx-fill-color:#000000;" fill="#000000" stroke="#000000" stroke-width="0.4pt" transform="translate(0,578.27) matrix(1 0 0 -1 0 0)"><g style="--ltx-fill-color:#BF0000;" fill="#BF0000" fill-opacity="1.0"><path style="stroke:none" d="M 0 5.91 L 0 572.37 C 0 575.63 2.64 578.27 5.91 578.27 L 471.47 578.27 C 474.73 578.27 477.38 575.63 477.38 572.37 L 477.38 5.91 C 477.38 2.64 474.73 0 471.47 0 L 5.91 0 C 2.64 0 0 2.64 0 5.91 Z" /></g><g style="--ltx-fill-color:#FFF2F2;" fill="#FFF2F2" fill-opacity="1.0"><path style="stroke:none" d="M 1.97 5.91 L 1.97 552.63 L 475.41 552.63 L 475.41 5.91 C 475.41 3.73 473.65 1.97 471.47 1.97 L 5.91 1.97 C 3.73 1.97 1.97 3.73 1.97 5.91 Z" /></g><g fill-opacity="1.0" transform="matrix(1.0 0.0 0.0 1.0 21.65 561.99)"><foreignobject style="--ltx-fo-width:31.37em;--ltx-fo-height:0.75em;--ltx-fo-depth:0.25em;font-size:10pt;" height="13.84" overflow="visible" transform="matrix(1 0 0 -1 0 10.38)" width="434.07"><span class="ltx_foreignobject_container"><span class="ltx_foreignobject_content">
<span id="S15.SS0.SSS0.Px13.p2.pic1.1" class="ltx_inline-block ltx_minipage ltx_align_bottom" style="width:31.37em;">
<span id="S15.SS0.SSS0.Px13.p2.pic1.1.1" class="ltx_p"><a href="https://codeforces.com/problemset/problem/2034/D" title class="ltx_ref ltx_href" style="--ltx-fg-color:#FFFFFF;">Example Implementation Problem (Rated 1600)</a></span>
</span></span></span></foreignobject></g><g fill-opacity="1.0" transform="matrix(1.0 0.0 0.0 1.0 21.65 16.47)"><foreignobject style="--ltx-fo-width:31.37em;--ltx-fo-height:37.89em;--ltx-fo-depth:0.19em;font-size:10pt;" height="527.04" overflow="visible" transform="matrix(1 0 0 -1 0 524.35)" width="434.07"><span class="ltx_foreignobject_container"><span class="ltx_foreignobject_content">
<span id="S15.SS0.SSS0.Px13.p2.pic1.2" class="ltx_inline-block ltx_minipage ltx_align_bottom" style="width:31.37em;">
<span id="S15.SS0.SSS0.Px13.p2.pic1.2.1" class="ltx_p"><span id="S15.SS0.SSS0.Px13.p2.pic1.2.1.1" class="ltx_text" style="--ltx-fg-color:#000000;">Darius the Great is constructing <math id="S15.SS0.SSS0.Px13.p2.pic1.m1" class="ltx_Math" alttext="n" display="inline" intent=":literal"><semantics><mi style="--ltx-fg-color:#000000;" mathcolor="#000000">n</mi><annotation encoding="application/x-tex">n</annotation></semantics></math> stone columns, each consisting of a base and between <math id="S15.SS0.SSS0.Px13.p2.pic1.m2" class="ltx_Math" alttext="0" display="inline" intent=":literal"><semantics><mn style="--ltx-fg-color:#000000;" mathcolor="#000000">0</mn><annotation encoding="application/x-tex">0</annotation></semantics></math>, <math id="S15.SS0.SSS0.Px13.p2.pic1.m3" class="ltx_Math" alttext="1" display="inline" intent=":literal"><semantics><mn style="--ltx-fg-color:#000000;" mathcolor="#000000">1</mn><annotation encoding="application/x-tex">1</annotation></semantics></math>, or <math id="S15.SS0.SSS0.Px13.p2.pic1.m4" class="ltx_Math" alttext="2" display="inline" intent=":literal"><semantics><mn style="--ltx-fg-color:#000000;" mathcolor="#000000">2</mn><annotation encoding="application/x-tex">2</annotation></semantics></math> inscription pieces stacked on top. In each move, Darius can choose two columns <math id="S15.SS0.SSS0.Px13.p2.pic1.m5" class="ltx_Math" alttext="u" display="inline" intent=":literal"><semantics><mi style="--ltx-fg-color:#000000;" mathcolor="#000000">u</mi><annotation encoding="application/x-tex">u</annotation></semantics></math> and <math id="S15.SS0.SSS0.Px13.p2.pic1.m6" class="ltx_Math" alttext="v" display="inline" intent=":literal"><semantics><mi style="--ltx-fg-color:#000000;" mathcolor="#000000">v</mi><annotation encoding="application/x-tex">v</annotation></semantics></math> such that the difference in the number of inscriptions between these columns is exactly <math id="S15.SS0.SSS0.Px13.p2.pic1.m7" class="ltx_Math" alttext="1" display="inline" intent=":literal"><semantics><mn style="--ltx-fg-color:#000000;" mathcolor="#000000">1</mn><annotation encoding="application/x-tex">1</annotation></semantics></math>, and transfer one inscription from the column with more inscriptions to the other one. It is guaranteed that at least one column contains exactly <math id="S15.SS0.SSS0.Px13.p2.pic1.m8" class="ltx_Math" alttext="1" display="inline" intent=":literal"><semantics><mn style="--ltx-fg-color:#000000;" mathcolor="#000000">1</mn><annotation encoding="application/x-tex">1</annotation></semantics></math> inscription. Since beauty is the main pillar of historical buildings, Darius wants the columns to have ascending heights. To avoid excessive workers’ efforts, he asks you to plan a sequence of <span id="S15.SS0.SSS0.Px13.p2.pic1.2.1.1.1" class="ltx_text ltx_font_bold">at most</span> <math id="S15.SS0.SSS0.Px13.p2.pic1.m9" class="ltx_Math" alttext="n" display="inline" intent=":literal"><semantics><mi style="--ltx-fg-color:#000000;" mathcolor="#000000">n</mi><annotation encoding="application/x-tex">n</annotation></semantics></math> moves to arrange the columns in non-decreasing order based on the number of inscriptions. Minimizing the number of moves is <span id="S15.SS0.SSS0.Px13.p2.pic1.2.1.1.2" class="ltx_text ltx_font_bold">not required</span>. 
<br class="ltx_break">
<br class="ltx_break"><span id="S15.SS0.SSS0.Px13.p2.pic1.2.1.1.3" class="ltx_text ltx_font_bold">Input</span> 
<br class="ltx_break">The first line contains an integer <math id="S15.SS0.SSS0.Px13.p2.pic1.m10" class="ltx_Math" alttext="t" display="inline" intent=":literal"><semantics><mi style="--ltx-fg-color:#000000;" mathcolor="#000000">t</mi><annotation encoding="application/x-tex">t</annotation></semantics></math>—the number of test cases. <math id="S15.SS0.SSS0.Px13.p2.pic1.m11" class="ltx_Math" alttext="(1\leq t\leq 3000)" display="inline" intent=":literal"><semantics><mrow><mo style="--ltx-fg-color:#000000;" mathcolor="#000000" stretchy="false">(</mo><mrow><mn style="--ltx-fg-color:#000000;" mathcolor="#000000">1</mn><mo style="--ltx-fg-color:#000000;" mathcolor="#000000">≤</mo><mi style="--ltx-fg-color:#000000;" mathcolor="#000000">t</mi><mo style="--ltx-fg-color:#000000;" mathcolor="#000000">≤</mo><mn style="--ltx-fg-color:#000000;" mathcolor="#000000">3000</mn></mrow><mo style="--ltx-fg-color:#000000;" mathcolor="#000000" stretchy="false">)</mo></mrow><annotation encoding="application/x-tex">(1\leq t\leq 3000)</annotation></semantics></math>. 
<br class="ltx_break">
<br class="ltx_break">The first line of each test case contains an integer <math id="S15.SS0.SSS0.Px13.p2.pic1.m12" class="ltx_Math" alttext="n" display="inline" intent=":literal"><semantics><mi style="--ltx-fg-color:#000000;" mathcolor="#000000">n</mi><annotation encoding="application/x-tex">n</annotation></semantics></math> —the number of stone columns. <math id="S15.SS0.SSS0.Px13.p2.pic1.m13" class="ltx_Math" alttext="(1\leq n\leq 2\cdot 10^{5})" display="inline" intent=":literal"><semantics><mrow><mo style="--ltx-fg-color:#000000;" mathcolor="#000000" stretchy="false">(</mo><mrow><mn style="--ltx-fg-color:#000000;" mathcolor="#000000">1</mn><mo style="--ltx-fg-color:#000000;" mathcolor="#000000">≤</mo><mi style="--ltx-fg-color:#000000;" mathcolor="#000000">n</mi><mo style="--ltx-fg-color:#000000;" mathcolor="#000000">≤</mo><mrow><mn style="--ltx-fg-color:#000000;" mathcolor="#000000">2</mn><mo style="--ltx-fg-color:#000000;" lspace="0.222em" mathcolor="#000000" rspace="0.222em">⋅</mo><msup><mn style="--ltx-fg-color:#000000;" mathcolor="#000000">10</mn><mn style="--ltx-fg-color:#000000;" mathcolor="#000000">5</mn></msup></mrow></mrow><mo style="--ltx-fg-color:#000000;" mathcolor="#000000" stretchy="false">)</mo></mrow><annotation encoding="application/x-tex">(1\leq n\leq 2\cdot 10^{5})</annotation></semantics></math>. 
<br class="ltx_break">
<br class="ltx_break">The second line contains <math id="S15.SS0.SSS0.Px13.p2.pic1.m14" class="ltx_Math" alttext="n" display="inline" intent=":literal"><semantics><mi style="--ltx-fg-color:#000000;" mathcolor="#000000">n</mi><annotation encoding="application/x-tex">n</annotation></semantics></math> integers <math id="S15.SS0.SSS0.Px13.p2.pic1.m15" class="ltx_Math" alttext="a_{1},a_{2},\dots,a_{n}" display="inline" intent=":literal"><semantics><mrow><msub><mi style="--ltx-fg-color:#000000;" mathcolor="#000000">a</mi><mn style="--ltx-fg-color:#000000;" mathcolor="#000000">1</mn></msub><mo style="--ltx-fg-color:#000000;" mathcolor="#000000">,</mo><msub><mi style="--ltx-fg-color:#000000;" mathcolor="#000000">a</mi><mn style="--ltx-fg-color:#000000;" mathcolor="#000000">2</mn></msub><mo style="--ltx-fg-color:#000000;" mathcolor="#000000">,</mo><mi style="--ltx-fg-color:#000000;" mathcolor="#000000" mathvariant="normal">…</mi><mo style="--ltx-fg-color:#000000;" mathcolor="#000000">,</mo><msub><mi style="--ltx-fg-color:#000000;" mathcolor="#000000">a</mi><mi style="--ltx-fg-color:#000000;" mathcolor="#000000">n</mi></msub></mrow><annotation encoding="application/x-tex">a_{1},a_{2},\dots,a_{n}</annotation></semantics></math>, where <math id="S15.SS0.SSS0.Px13.p2.pic1.m16" class="ltx_Math" alttext="a_{i}\in\{0,1,2\}" display="inline" intent=":literal"><semantics><mrow><msub><mi style="--ltx-fg-color:#000000;" mathcolor="#000000">a</mi><mi style="--ltx-fg-color:#000000;" mathcolor="#000000">i</mi></msub><mo style="--ltx-fg-color:#000000;" mathcolor="#000000">∈</mo><mrow><mo style="--ltx-fg-color:#000000;" mathcolor="#000000" stretchy="false">{</mo><mrow><mn style="--ltx-fg-color:#000000;" mathcolor="#000000">0</mn><mo style="--ltx-fg-color:#000000;" mathcolor="#000000">,</mo><mn style="--ltx-fg-color:#000000;" mathcolor="#000000">1</mn><mo style="--ltx-fg-color:#000000;" mathcolor="#000000">,</mo><mn style="--ltx-fg-color:#000000;" mathcolor="#000000">2</mn></mrow><mo style="--ltx-fg-color:#000000;" mathcolor="#000000" stretchy="false">}</mo></mrow></mrow><annotation encoding="application/x-tex">a_{i}\in\{0,1,2\}</annotation></semantics></math> represents the initial number of inscriptions in the <math id="S15.SS0.SSS0.Px13.p2.pic1.m17" class="ltx_Math" alttext="i" display="inline" intent=":literal"><semantics><mi style="--ltx-fg-color:#000000;" mathcolor="#000000">i</mi><annotation encoding="application/x-tex">i</annotation></semantics></math>-th column. It is guaranteed that at least one column has exactly <math id="S15.SS0.SSS0.Px13.p2.pic1.m18" class="ltx_Math" alttext="1" display="inline" intent=":literal"><semantics><mn style="--ltx-fg-color:#000000;" mathcolor="#000000">1</mn><annotation encoding="application/x-tex">1</annotation></semantics></math> inscription. 
<br class="ltx_break">
<br class="ltx_break">It is guaranteed that the sum of <math id="S15.SS0.SSS0.Px13.p2.pic1.m19" class="ltx_Math" alttext="n" display="inline" intent=":literal"><semantics><mi style="--ltx-fg-color:#000000;" mathcolor="#000000">n</mi><annotation encoding="application/x-tex">n</annotation></semantics></math> over all test cases does not exceed <math id="S15.SS0.SSS0.Px13.p2.pic1.m20" class="ltx_Math" alttext="2\cdot 10^{5}" display="inline" intent=":literal"><semantics><mrow><mn style="--ltx-fg-color:#000000;" mathcolor="#000000">2</mn><mo style="--ltx-fg-color:#000000;" lspace="0.222em" mathcolor="#000000" rspace="0.222em">⋅</mo><msup><mn style="--ltx-fg-color:#000000;" mathcolor="#000000">10</mn><mn style="--ltx-fg-color:#000000;" mathcolor="#000000">5</mn></msup></mrow><annotation encoding="application/x-tex">2\cdot 10^{5}</annotation></semantics></math>. 
<br class="ltx_break">
<br class="ltx_break"><span id="S15.SS0.SSS0.Px13.p2.pic1.2.1.1.4" class="ltx_text ltx_font_bold">Output</span> 
<br class="ltx_break">For each test case, output an integer <math id="S15.SS0.SSS0.Px13.p2.pic1.m21" class="ltx_Math" alttext="k" display="inline" intent=":literal"><semantics><mi style="--ltx-fg-color:#000000;" mathcolor="#000000">k</mi><annotation encoding="application/x-tex">k</annotation></semantics></math> —the number of moves used to sort the columns. <math id="S15.SS0.SSS0.Px13.p2.pic1.m22" class="ltx_Math" alttext="(0\leq k\leq n)" display="inline" intent=":literal"><semantics><mrow><mo style="--ltx-fg-color:#000000;" mathcolor="#000000" stretchy="false">(</mo><mrow><mn style="--ltx-fg-color:#000000;" mathcolor="#000000">0</mn><mo style="--ltx-fg-color:#000000;" mathcolor="#000000">≤</mo><mi style="--ltx-fg-color:#000000;" mathcolor="#000000">k</mi><mo style="--ltx-fg-color:#000000;" mathcolor="#000000">≤</mo><mi style="--ltx-fg-color:#000000;" mathcolor="#000000">n</mi></mrow><mo style="--ltx-fg-color:#000000;" mathcolor="#000000" stretchy="false">)</mo></mrow><annotation encoding="application/x-tex">(0\leq k\leq n)</annotation></semantics></math>. 
<br class="ltx_break">
<br class="ltx_break">Then, output <math id="S15.SS0.SSS0.Px13.p2.pic1.m23" class="ltx_Math" alttext="k" display="inline" intent=":literal"><semantics><mi style="--ltx-fg-color:#000000;" mathcolor="#000000">k</mi><annotation encoding="application/x-tex">k</annotation></semantics></math> lines, each containing two integers <math id="S15.SS0.SSS0.Px13.p2.pic1.m24" class="ltx_Math" alttext="u_{i}" display="inline" intent=":literal"><semantics><msub><mi style="--ltx-fg-color:#000000;" mathcolor="#000000">u</mi><mi style="--ltx-fg-color:#000000;" mathcolor="#000000">i</mi></msub><annotation encoding="application/x-tex">u_{i}</annotation></semantics></math> and <math id="S15.SS0.SSS0.Px13.p2.pic1.m25" class="ltx_Math" alttext="v_{i}\ (1\leq u_{i},v_{i}\leq n)" display="inline" intent=":literal"><semantics><mrow><msub><mi style="--ltx-fg-color:#000000;" mathcolor="#000000">v</mi><mi style="--ltx-fg-color:#000000;" mathcolor="#000000">i</mi></msub><mo lspace="0.500em" rspace="0em">​</mo><mrow><mo style="--ltx-fg-color:#000000;" mathcolor="#000000" stretchy="false">(</mo><mrow><mn style="--ltx-fg-color:#000000;" mathcolor="#000000">1</mn><mo style="--ltx-fg-color:#000000;" mathcolor="#000000">≤</mo><msub><mi style="--ltx-fg-color:#000000;" mathcolor="#000000">u</mi><mi style="--ltx-fg-color:#000000;" mathcolor="#000000">i</mi></msub></mrow><mo style="--ltx-fg-color:#000000;" mathcolor="#000000">,</mo><mrow><msub><mi style="--ltx-fg-color:#000000;" mathcolor="#000000">v</mi><mi style="--ltx-fg-color:#000000;" mathcolor="#000000">i</mi></msub><mo style="--ltx-fg-color:#000000;" mathcolor="#000000">≤</mo><mi style="--ltx-fg-color:#000000;" mathcolor="#000000">n</mi></mrow><mo style="--ltx-fg-color:#000000;" mathcolor="#000000" stretchy="false">)</mo></mrow></mrow><annotation encoding="application/x-tex">v_{i}\ (1\leq u_{i},v_{i}\leq n)</annotation></semantics></math>, representing the indices of the columns involved in the <math id="S15.SS0.SSS0.Px13.p2.pic1.m26" class="ltx_Math" alttext="i" display="inline" intent=":literal"><semantics><mi style="--ltx-fg-color:#000000;" mathcolor="#000000">i</mi><annotation encoding="application/x-tex">i</annotation></semantics></math>-th move. During each move, it must hold that <math id="S15.SS0.SSS0.Px13.p2.pic1.m27" class="ltx_Math" alttext="|a_{i_{i}}-a_{v_{i}}|=1" display="inline" intent=":literal"><semantics><mrow><mrow><mo style="--ltx-fg-color:#000000;" mathcolor="#000000" stretchy="false">|</mo><mrow><msub><mi style="--ltx-fg-color:#000000;" mathcolor="#000000">a</mi><msub><mi style="--ltx-fg-color:#000000;" mathcolor="#000000">i</mi><mi style="--ltx-fg-color:#000000;" mathcolor="#000000">i</mi></msub></msub><mo style="--ltx-fg-color:#000000;" mathcolor="#000000">−</mo><msub><mi style="--ltx-fg-color:#000000;" mathcolor="#000000">a</mi><msub><mi style="--ltx-fg-color:#000000;" mathcolor="#000000">v</mi><mi style="--ltx-fg-color:#000000;" mathcolor="#000000">i</mi></msub></msub></mrow><mo style="--ltx-fg-color:#000000;" mathcolor="#000000" stretchy="false">|</mo></mrow><mo style="--ltx-fg-color:#000000;" mathcolor="#000000">=</mo><mn style="--ltx-fg-color:#000000;" mathcolor="#000000">1</mn></mrow><annotation encoding="application/x-tex">|a_{i_{i}}-a_{v_{i}}|=1</annotation></semantics></math>, and one inscription is transferred from the column with more inscriptions to the other. It can be proven that a valid solution always exists under the given constraints.</span></span>
</span></span></span></foreignobject></g></g></svg>