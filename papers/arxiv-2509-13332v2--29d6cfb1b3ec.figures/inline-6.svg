<span id="A5.F8.pic1.1.1" class="ltx_p"><span id="A5.F8.pic1.1.1.1" class="ltx_text ltx_font_bold" style="--ltx-fg-color:#FFFFFF;">Rubric for MRewardBench subset: alpacaeval-hard</span></span>
</span></span></span></foreignobject></g><g fill-opacity="1.0" transform="matrix(1.0 0.0 0.0 1.0 20.79 15.99)"><foreignobject style="--ltx-fo-width:31.5em;--ltx-fo-height:17.49em;--ltx-fo-depth:0.22em;font-size:10pt;" class="ltx_minipage" height="245.15" overflow="visible" transform="matrix(1 0 0 -1 0 242.07)" width="30em"><span class="ltx_foreignobject_container"><span class="ltx_foreignobject_content"><pre id="A5.F8.pic1.2" class="ltx_verbatim ltx_font_typewriter" style="--ltx-fg-color:#000000;">Pairwise judge for instruction following (hard).
Steps:
1) Read the User Question and the answers from Assistant A and
   Assistant B.
2) Checks:
   - Multi-constraint satisfaction: meets all explicit constraints,
   formats, and edge cases.
   - Factual rigor: accurate, grounded; no hallucinations.
   - Disambiguation: sensibly resolves underspecification and states
   assumptions when needed.
   - Reasoning-aware: if steps are shown, they are sound and
   consistent.
   - Clarity: structured, readable, non-verbose.
3) Penalize: constraint violations, invented details, overconfident
   but wrong logic.
4) Decision: choose Assistant A if it better satisfies constraints and
   correctness (and handles ambiguity/clarity better when close);
   otherwise choose Assistant B.
5) Neutrality: ignore presentation order, assistant names, and length.

</pre></span></span></foreignobject></g></g></svg>