            &quot;complementary&quot;,
            &quot;works well&quot;,
            &quot;ideal for&quot;
        ],
        &quot;issue_hints&quot;: {
            &quot;ACC-DIFF&quot;: &quot;Accessory / Refill for Wrong Product&quot;,
            &quot;SENS&quot;: &quot;Sensitive / Embarrassing Content&quot;,
            &quot;CAT-DIST&quot;: &quot;Category Too Distant&quot;,
            &quot;SUBST&quot;: &quot;Too Similar / Substitute&quot;,
            &quot;WRONG-AGE-GEN&quot;: &quot;Wrong Age / Gender Targeting&quot;,
            &quot;WRONG-FORMAT&quot;: &quot;Format Mismatch&quot;,
            &quot;WRONG-SIZE-DIM&quot;: &quot;Size / Dimension Mismatch&quot;,
            &quot;OTHER&quot;: &quot;Other Issue&quot;
        },
        &quot;conflict_resolution&quot;:
            &quot;If mixed signals, choose the *stricter* judgement
             (Reject &gt; Major &gt; Minor &gt; Good) and mark
             pair as conflicted=true.&quot;
    },
    &quot;report_requirements&quot;: {
        &quot;compute_agreement&quot;: true,
        &quot;compute_issue_frequency&quot;: true,
        &quot;identify_conflicted_pairs&quot;: true,
        &quot;suggest_new_issue_codes&quot;: true
    },
    &quot;data_pairs&quot;: []
}
</pre>
