<span id="A5.F25.pic1.1.1" class="ltx_p"><span id="A5.F25.pic1.1.1.1" class="ltx_text ltx_font_bold" style="--ltx-fg-color:#FFFFFF;">Rubric for MRewardBench subset: hep-java</span></span>
</span></span></span></foreignobject></g><g fill-opacity="1.0" transform="matrix(1.0 0.0 0.0 1.0 20.79 12.92)"><foreignobject style="--ltx-fo-width:31.5em;--ltx-fo-height:15.09em;--ltx-fo-depth:0em;font-size:10pt;" class="ltx_minipage" height="208.86" overflow="visible" transform="matrix(1 0 0 -1 0 208.86)" width="30em"><span class="ltx_foreignobject_container"><span class="ltx_foreignobject_content"><pre id="A5.F25.pic1.2" class="ltx_verbatim ltx_font_typewriter" style="--ltx-fg-color:#000000;">Pairwise judge for HumanEvalPack (Java).
Steps:
1) Read the method/class spec in the User Question; read code from
   Assistant A and Assistant B.
2) Checks:
   - Functional correctness: meets the spec; would pass tests.
   - API contract: correct method/class signatures, visibility, and
   types.
   - Edge cases &amp; complexity: covers edge cases; appropriate
   time/space.
   - Readability/idioms: idiomatic Java, clarity.
3) Penalize: signature/type mismatches, improper API use/exceptions,
   failing logic.
4) Decision: choose Assistant A if it is more correct/spec-compliant
   (or simpler/clearer when both correct); otherwise choose Assistant
   B.
5) Neutrality: ignore presentation order and assistant names.

</pre></span></span></foreignobject></g></g></svg>