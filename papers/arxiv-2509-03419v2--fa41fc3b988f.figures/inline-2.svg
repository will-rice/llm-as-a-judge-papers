<span id="A1.SS3.SSS1.p2.pic1.2" class="ltx_inline-block ltx_minipage ltx_align_bottom" style="width:44.07em;">
<span id="A1.SS3.SSS1.p2.pic1.2.1" class="ltx_p"><span id="A1.SS3.SSS1.p2.pic1.2.1.1" class="ltx_text" style="--ltx-fg-color:#000000;">Please modify the given candidate answer to subtly align its presentation with the reference answer, while strictly preserving the original factual accuracy and response quality. Follow these rules:</span></span>
<span id="A1.SS3.SSS1.p2.pic1.2.2" class="ltx_p"><span id="A1.SS3.SSS1.p2.pic1.2.2.1" class="ltx_text" style="--ltx-fg-color:#000000;">**Candidate Answer (DO NOT alter core facts or reasoning):**
reject</span></span>
<span id="A1.SS3.SSS1.p2.pic1.2.3" class="ltx_p"><span id="A1.SS3.SSS1.p2.pic1.2.3.1" class="ltx_text" style="--ltx-fg-color:#000000;">**Reference Answer (style-only guidance):**
reference</span></span>
<span id="A1.SS3.SSS1.p2.pic1.2.4" class="ltx_p"><span id="A1.SS3.SSS1.p2.pic1.2.4.1" class="ltx_text" style="--ltx-fg-color:#000000;">**Modification Strategy:**
1. **Terminology Alignment**: Replace up to 2-3 non-essential terms with reference’s equivalent expressions
2. **Structural Parallelism**: Match answer framing (e.g., &quot;There are three main reasons…&quot; &quot;Three key factors are…&quot;)
3. **Explanation Flow**: Borrow 1 neutral transitional phrase from reference if contextually appropriate
4. **Avoid**: Changing factual claims, altering logical reasoning, or modifying critical examples</span></span>
<span id="A1.SS3.SSS1.p2.pic1.2.5" class="ltx_p"><span id="A1.SS3.SSS1.p2.pic1.2.5.1" class="ltx_text" style="--ltx-fg-color:#000000;">**Output Requirements:**
- Preserve &gt;70% of original factual content
- Never exceed 3 discrete modifications
- Maintain original answer’s factual correctness and completeness
- Prioritize natural flow over stylistic matching</span></span>
<span id="A1.SS3.SSS1.p2.pic1.2.6" class="ltx_p"><span id="A1.SS3.SSS1.p2.pic1.2.6.1" class="ltx_text" style="--ltx-fg-color:#000000;">Return ONLY the modified answer, no commentary.</span></span>
