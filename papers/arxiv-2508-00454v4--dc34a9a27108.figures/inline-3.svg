<svg id="A7.p2.pic1" class="ltx_picture" height="561.81" overflow="visible" version="1.1" viewbox="0 0 653.15 561.81" width="653.15"><g style="--ltx-stroke-color:#000000;--ltx-fill-color:#000000;" fill="#000000" stroke="#000000" stroke-width="0.4pt" transform="translate(0,561.81) matrix(1 0 0 -1 0 0)"><g style="--ltx-fill-color:#4D4D4D;" fill="#4D4D4D" fill-opacity="1.0"><path style="stroke:none" d="M 0 8.57 L 0 553.24 C 0 557.97 3.84 561.81 8.57 561.81 L 644.58 561.81 C 649.31 561.81 653.15 557.97 653.15 553.24 L 653.15 8.57 C 653.15 3.84 649.31 0 644.58 0 L 8.57 0 C 3.84 0 0 3.84 0 8.57 Z" /></g><g style="--ltx-fill-color:#F7F7FF;" fill="#F7F7FF" fill-opacity="1.0"><path style="stroke:none" d="M 0.69 8.57 L 0.69 534.29 L 652.46 534.29 L 652.46 8.57 C 652.46 4.22 648.93 0.69 644.58 0.69 L 8.57 0.69 C 4.22 0.69 0.69 4.22 0.69 8.57 Z" /></g><g fill-opacity="1.0" transform="matrix(1.0 0.0 0.0 1.0 11.76 544.59)"><foreignobject style="--ltx-fo-width:39.57em;--ltx-fo-height:0.69em;--ltx-fo-depth:0.19em;font-size:10pt;" height="12.3" overflow="visible" transform="matrix(1 0 0 -1 0 9.61)" width="547.54"><span class="ltx_foreignobject_container"><span class="ltx_foreignobject_content">
<span id="A7.p2.pic1.1" class="ltx_inline-block ltx_minipage ltx_align_bottom" style="width:39.57em;">
<span id="A7.p2.pic1.1.1" class="ltx_p"><span id="A7.p2.pic1.1.1.1" class="ltx_text ltx_font_bold" style="--ltx-fg-color:#FFFFFF;">Prompts for Single Rating Evaluation</span></span>
</span></span></span></foreignobject></g><g fill-opacity="1.0" transform="matrix(1.0 0.0 0.0 1.0 11.76 108.12)"><foreignobject style="--ltx-fo-width:45.5em;--ltx-fo-height:29.73em;--ltx-fo-depth:6.69em;font-size:10pt;" height="504.02" overflow="visible" transform="matrix(1 0 0 -1 0 411.39)" width="629.59"><span class="ltx_foreignobject_container"><span class="ltx_foreignobject_content">
<span id="A7.p2.pic1.2" class="ltx_inline-block ltx_minipage ltx_align_bottom" style="width:45.5em;">
<span id="A7.p2.pic1.2.1" class="ltx_p"><span id="A7.p2.pic1.2.1.1" class="ltx_text ltx_font_bold" style="--ltx-fg-color:#000000;">System Prompt<span id="A7.p2.pic1.2.1.1.1" class="ltx_text ltx_font_medium"> 
<br class="ltx_break" style="--ltx-break-space:2.0pt;">
You are an expert in evaluating the quality of dialogues. 
<br class="ltx_break">Your task is to assess the performance and quality of an AI assistant in multi-turn conversations.</span></span></span>
<span id="A7.p2.pic1.2.2" class="ltx_p"><span id="A7.p2.pic1.2.2.1" class="ltx_text ltx_font_bold" style="--ltx-fg-color:#000000;">User Prompt<span id="A7.p2.pic1.2.2.1.1" class="ltx_text ltx_font_medium"> 
<br class="ltx_break" style="--ltx-break-space:2.0pt;">
### Evaluation Guidelines ###</span></span></span>
<span id="A7.I1" class="ltx_enumerate">
<span id="A7.I1.i1" class="ltx_item" style="list-style-type:none;"><span class="ltx_tag ltx_tag_item">1.</span> 
<span id="A7.I1.i1.p1" class="ltx_para">
<span id="A7.I1.i1.p1.1" class="ltx_p"><span id="A7.I1.i1.p1.1.1" class="ltx_text" style="--ltx-fg-color:#000000;">Rate the assistant’s performance on a scale from 1 to 10, where a higher score indicates better quality.</span></span>
</span></span>
<span id="A7.I1.i2" class="ltx_item" style="list-style-type:none;"><span class="ltx_tag ltx_tag_item">2.</span> 
<span id="A7.I1.i2.p1" class="ltx_para">
<span id="A7.I1.i2.p1.1" class="ltx_p"><span id="A7.I1.i2.p1.1.1" class="ltx_text" style="--ltx-fg-color:#000000;">Consider the following dimensions when assigning the overall rating: Accuracy, Logicality, Conversationality, Relevance, Personalization, Creativity, Interactivity, Emotionality, Informativeness, Safety.</span></span>
</span></span>
<span id="A7.I1.i3" class="ltx_item" style="list-style-type:none;"><span class="ltx_tag ltx_tag_item">3.</span> 
<span id="A7.I1.i3.p1" class="ltx_para">
<span id="A7.I1.i3.p1.1" class="ltx_p"><span id="A7.I1.i3.p1.1.1" class="ltx_text" style="--ltx-fg-color:#000000;">Criteria for rating:</span></span>
<span id="A7.I1.i3.I1" class="ltx_itemize">
<span id="A7.I1.i3.I0.i1" class="ltx_item" style="list-style-type:none;"><span class="ltx_tag ltx_tag_item">•</span> 
<span id="A7.I1.i3.I0.i1.p1" class="ltx_para">
<span id="A7.I1.i3.I0.i1.p1.1" class="ltx_p"><span id="A7.I1.i3.I0.i1.p1.1.1" class="ltx_text" style="--ltx-fg-color:#000000;">1–3 points: Performance is poor, with most or all criteria not being met or significantly lacking.</span></span>
</span></span>
<span id="A7.I1.i3.I0.i2" class="ltx_item" style="list-style-type:none;"><span class="ltx_tag ltx_tag_item">•</span> 
<span id="A7.I1.i3.I0.i2.p1" class="ltx_para">
<span id="A7.I1.i3.I0.i2.p1.1" class="ltx_p"><span id="A7.I1.i3.I0.i2.p1.1.1" class="ltx_text" style="--ltx-fg-color:#000000;">4–6 points: Performance is average, with some aspects meeting the standards, but overall there are notable deficiencies.</span></span>
</span></span>
<span id="A7.I1.i3.I0.i3" class="ltx_item" style="list-style-type:none;"><span class="ltx_tag ltx_tag_item">•</span> 
<span id="A7.I1.i3.I0.i3.p1" class="ltx_para">
<span id="A7.I1.i3.I0.i3.p1.1" class="ltx_p"><span id="A7.I1.i3.I0.i3.p1.1.1" class="ltx_text" style="--ltx-fg-color:#000000;">7–9 points: Performance is good, with most aspects meeting high standards.</span></span>
</span></span>
<span id="A7.I1.i3.I0.i4" class="ltx_item" style="list-style-type:none;"><span class="ltx_tag ltx_tag_item">•</span> 
<span id="A7.I1.i3.I0.i4.p1" class="ltx_para">
<span id="A7.I1.i3.I0.i4.p1.1" class="ltx_p"><span id="A7.I1.i3.I0.i4.p1.1.1" class="ltx_text" style="--ltx-fg-color:#000000;">10 points: Performance is exceptional, with all criteria being excellently met.</span></span>
</span></span>
</span>
</span></span>
<span id="A7.I1.i4" class="ltx_item" style="list-style-type:none;"><span class="ltx_tag ltx_tag_item">4.</span> 
<span id="A7.I1.i4.p1" class="ltx_para">
<span id="A7.I1.i4.p1.1" class="ltx_p"><span id="A7.I1.i4.p1.1.1" class="ltx_text" style="--ltx-fg-color:#000000;">Avoid any potential bias. Your judgment should be as objective as possible.</span></span>
</span></span>
</span>
<span id="A7.p2.pic1.2.3" class="ltx_p"><span id="A7.p2.pic1.2.3.1" class="ltx_text" style="--ltx-fg-color:#000000;">Here is the dialogue you need to rate: 
<br class="ltx_break">{dialogue} 
<br class="ltx_break"></span></span>
<span id="A7.p2.pic1.2.4" class="ltx_p"><span id="A7.p2.pic1.2.4.1" class="ltx_text" style="--ltx-fg-color:#000000;">### Instructions for Rating ###</span></span>
<span id="A7.I2" class="ltx_enumerate">
<span id="A7.I2.i1" class="ltx_item" style="list-style-type:none;"><span class="ltx_tag ltx_tag_item">1.</span> 
<span id="A7.I2.i1.p1" class="ltx_para">
<span id="A7.I2.i1.p1.1" class="ltx_p"><span id="A7.I2.i1.p1.1.1" class="ltx_text" style="--ltx-fg-color:#000000;">Make your judgment based on the evaluation guidelines.</span></span>
</span></span>
<span id="A7.I2.i2" class="ltx_item" style="list-style-type:none;"><span class="ltx_tag ltx_tag_item">2.</span> 
<span id="A7.I2.i2.p1" class="ltx_para">
<span id="A7.I2.i2.p1.1" class="ltx_p"><span id="A7.I2.i2.p1.1.1" class="ltx_text" style="--ltx-fg-color:#000000;">Provide the final score — an integer between 1 and 10.</span></span>
</span></span>
<span id="A7.I2.i3" class="ltx_item" style="list-style-type:none;"><span class="ltx_tag ltx_tag_item">3.</span> 
<span id="A7.I2.i3.p1" class="ltx_para">
<span id="A7.I2.i3.p1.1" class="ltx_p"><span id="A7.I2.i3.p1.1.1" class="ltx_text" style="--ltx-fg-color:#000000;">Begin with the following response formats: </span>
<br class="ltx_break"><span id="A7.I2.i3.p1.1.2" class="ltx_text" style="--ltx-fg-color:#000000;">{Rating: [[X]]} </span>
<br class="ltx_break"><span id="A7.I2.i3.p1.1.3" class="ltx_text" style="--ltx-fg-color:#000000;">where X is the score you assign.</span></span>
</span></span>
</span>
</span></span></span></foreignobject></g></g></svg>