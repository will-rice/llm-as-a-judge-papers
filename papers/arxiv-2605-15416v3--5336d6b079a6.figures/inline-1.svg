<span id="S1.Thmtheorem1" class="ltx_theorem ltx_theorem_theorem">
<h6 class="ltx_title ltx_runin ltx_title_theorem" style="--ltx-fg-color:#000000;"><span class="ltx_tag ltx_tag_theorem"><span id="S1.Thmtheorem1.2" class="ltx_text ltx_font_bold">Theorem 1.1</span></span><span id="S1.Thmtheorem1.3" class="ltx_text ltx_font_bold"> </span>(Informal)<span id="S1.Thmtheorem1.4" class="ltx_text ltx_font_bold">.</span></h6>
<span id="S1.Thmtheorem1.p1" class="ltx_para">
<span id="S1.Thmtheorem1.p1.1" class="ltx_p"><span id="S1.Thmtheorem1.p1.1.1" class="ltx_text ltx_font_italic" style="--ltx-fg-color:#000000;">Given a parameterized confidence estimator and a margin <math id="S1.Thmtheorem1.p1.m1" class="ltx_Math" alttext="\gamma" display="inline" intent=":literal"><semantics><mi style="--ltx-fg-color:#000000;" mathcolor="#000000">γ</mi><annotation encoding="application/x-tex">\gamma</annotation></semantics></math>, its expected ranking loss is bounded by the empirical margin-based ranking loss and the margin-dependent complexity term, i.e.,</span></span>
<span id="S1.Ex1" class="ltx_equation ltx_eqn_table">

<span><span class="ltx_equation ltx_eqn_row ltx_align_baseline">
<span class="ltx_eqn_cell ltx_eqn_center_padleft"></span>
<span class="ltx_eqn_cell ltx_align_center"><math id="S1.Ex1.m1" class="ltx_Math" alttext="\begin{subarray}{c}\text{Expected}\\
\text{Ranking Loss}\end{subarray}\;\leq\;\begin{subarray}{c}\text{Empirical Margin-based}\\
\text{Ranking Loss}\end{subarray}\;+\;\begin{subarray}{c}\text{Margin-dependent}\\
\text{Complexity Term}\end{subarray}." display="block" intent=":literal"><semantics><mrow><mrow><mtable displaystyle="true" rowspacing="0pt"><mtr><mtd><mtext style="--ltx-fg-color:#000000;" class="ltx_mathvariant_italic" mathcolor="#000000" mathsize="0.700em">Expected</mtext></mtd></mtr><mtr><mtd><mtext style="--ltx-fg-color:#000000;" class="ltx_mathvariant_italic" mathcolor="#000000" mathsize="0.700em">Ranking Loss</mtext></mtd></mtr></mtable><mo style="--ltx-fg-color:#000000;" lspace="0.558em" mathcolor="#000000" rspace="0.558em">≤</mo><mrow><mtable displaystyle="true" rowspacing="0pt"><mtr><mtd><mtext style="--ltx-fg-color:#000000;" class="ltx_mathvariant_italic" mathcolor="#000000" mathsize="0.700em">Empirical Margin-based</mtext></mtd></mtr><mtr><mtd><mtext style="--ltx-fg-color:#000000;" class="ltx_mathvariant_italic" mathcolor="#000000" mathsize="0.700em">Ranking Loss</mtext></mtd></mtr></mtable><mo style="--ltx-fg-color:#000000;" lspace="0.502em" mathcolor="#000000" rspace="0.502em">+</mo><mtable displaystyle="true" rowspacing="0pt"><mtr><mtd><mtext style="--ltx-fg-color:#000000;" class="ltx_mathvariant_italic" mathcolor="#000000" mathsize="0.700em">Margin-dependent</mtext></mtd></mtr><mtr><mtd><mtext style="--ltx-fg-color:#000000;" class="ltx_mathvariant_italic" mathcolor="#000000" mathsize="0.700em">Complexity Term</mtext></mtd></mtr></mtable></mrow></mrow><mo style="--ltx-fg-color:#000000;" lspace="0em" mathcolor="#000000">.</mo></mrow><annotation encoding="application/x-tex">\begin{subarray}{c}\text{Expected}\\
\text{Ranking Loss}\end{subarray}\;\leq\;\begin{subarray}{c}\text{Empirical Margin-based}\\
\text{Ranking Loss}\end{subarray}\;+\;\begin{subarray}{c}\text{Margin-dependent}\\
\text{Complexity Term}\end{subarray}.</annotation></semantics></math></span>
