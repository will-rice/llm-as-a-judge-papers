<svg id="A2.SS2.SSS0.Px3.p3.pic1" class="ltx_picture" height="635.08" overflow="visible" version="1.1" viewbox="0 0 676.77 635.08" width="676.77"><g style="--ltx-stroke-color:#000000;--ltx-fill-color:#000000;" fill="#000000" stroke="#000000" stroke-width="0.4pt" transform="translate(0,635.08) matrix(1 0 0 -1 0 0)"><g style="--ltx-fill-color:#404040;" fill="#404040" fill-opacity="1.0"><path style="stroke:none" d="M 0 5.91 L 0 629.18 C 0 632.44 2.64 635.08 5.91 635.08 L 670.87 635.08 C 674.13 635.08 676.77 632.44 676.77 629.18 L 676.77 5.91 C 676.77 2.64 674.13 0 670.87 0 L 5.91 0 C 2.64 0 0 2.64 0 5.91 Z" /></g><g style="--ltx-fill-color:#F2F2F2;" fill="#F2F2F2" fill-opacity="1.0"><path style="stroke:none" d="M 1.97 5.91 L 1.97 609.43 L 674.8 609.43 L 674.8 5.91 C 674.8 3.73 673.04 1.97 670.87 1.97 L 5.91 1.97 C 3.73 1.97 1.97 3.73 1.97 5.91 Z" /></g><g fill-opacity="1.0" transform="matrix(1.0 0.0 0.0 1.0 21.65 618.8)"><foreignobject style="--ltx-fo-width:45.78em;--ltx-fo-height:0.75em;--ltx-fo-depth:0.25em;font-size:10pt;" height="13.84" overflow="visible" transform="matrix(1 0 0 -1 0 10.38)" width="633.47"><span class="ltx_foreignobject_container"><span class="ltx_foreignobject_content">
<span id="A2.SS2.SSS0.Px3.p3.pic1.1" class="ltx_inline-block ltx_minipage ltx_align_bottom" style="width:45.78em;">
<span id="A2.SS2.SSS0.Px3.p3.pic1.1.1" class="ltx_p"><span id="A2.SS2.SSS0.Px3.p3.pic1.1.1.1" class="ltx_text" style="--ltx-fg-color:#FFFFFF;">NeurIPS Review Prompt (Structured JSON Review)</span></span>
</span></span></span></foreignobject></g><g fill-opacity="1.0" transform="matrix(1.0 0.0 0.0 1.0 21.65 16.55)"><foreignobject style="--ltx-fo-width:48.45em;--ltx-fo-height:41.99em;--ltx-fo-depth:0.2em;font-size:10pt;" height="583.85" overflow="visible" transform="matrix(1 0 0 -1 0 581.08)" width="670.41"><span class="ltx_foreignobject_container"><span class="ltx_foreignobject_content">
<span id="A2.SS2.SSS0.Px3.p3.pic1.2" class="ltx_inline-block ltx_minipage ltx_align_bottom" style="width:48.45em;">
<span id="A2.SS2.SSS0.Px3.p3.pic1.2.1" class="ltx_p"><span id="A2.SS2.SSS0.Px3.p3.pic1.2.1.1" class="ltx_text ltx_font_typewriter" style="font-size:90%;--ltx-fg-color:#000000;">You are an AI researcher reviewing a paper submitted to a prestigious AI conference. Thoroughly evaluate the paper, adhering to the provided guidelines, and return a detailed assessment in the specified JSON format.
</span></span>
<span id="A2.SS2.SSS0.Px3.p3.pic1.2.2" class="ltx_p"><span id="A2.SS2.SSS0.Px3.p3.pic1.2.2.1" class="ltx_text ltx_font_typewriter" style="font-size:90%;--ltx-fg-color:#000000;">## Manuscript: [MANUSCRIPT TEXT OR CONCATENATED CHUNKS]
</span></span>
<span id="A2.SS2.SSS0.Px3.p3.pic1.2.3" class="ltx_p"><span id="A2.SS2.SSS0.Px3.p3.pic1.2.3.1" class="ltx_text ltx_font_typewriter" style="font-size:90%;--ltx-fg-color:#000000;">## Reviewer Guidelines (dimensions to cover):
</span></span>
<span id="A2.SS2.SSS0.Px3.p3.pic1.2.4" class="ltx_p"><span id="A2.SS2.SSS0.Px3.p3.pic1.2.4.1" class="ltx_text ltx_font_typewriter ltx_font_bold" style="font-size:90%;--ltx-fg-color:#000000;">Summary<span id="A2.SS2.SSS0.Px3.p3.pic1.2.4.1.1" class="ltx_text ltx_font_medium">: Briefly summarize contributions (no critique here). </span></span></span>
<span id="A2.SS2.SSS0.Px3.p3.pic1.2.5" class="ltx_p"><span id="A2.SS2.SSS0.Px3.p3.pic1.2.5.1" class="ltx_text ltx_font_typewriter ltx_font_bold" style="font-size:90%;--ltx-fg-color:#000000;">Strengths &amp; Weaknesses<span id="A2.SS2.SSS0.Px3.p3.pic1.2.5.1.1" class="ltx_text ltx_font_medium"> across: Originality, Quality, Clarity, Significance. </span></span></span>
<span id="A2.SS2.SSS0.Px3.p3.pic1.2.6" class="ltx_p"><span id="A2.SS2.SSS0.Px3.p3.pic1.2.6.1" class="ltx_text ltx_font_typewriter" style="font-size:90%;--ltx-fg-color:#000000;">Provide <span id="A2.SS2.SSS0.Px3.p3.pic1.2.6.1.1" class="ltx_text ltx_font_bold">Questions</span> for authors (useful for rebuttal). </span></span>
<span id="A2.SS2.SSS0.Px3.p3.pic1.2.7" class="ltx_p"><span id="A2.SS2.SSS0.Px3.p3.pic1.2.7.1" class="ltx_text ltx_font_typewriter" style="font-size:90%;--ltx-fg-color:#000000;">Discuss <span id="A2.SS2.SSS0.Px3.p3.pic1.2.7.1.1" class="ltx_text ltx_font_bold">Limitations</span> and potential societal impact. </span></span>
<span id="A2.SS2.SSS0.Px3.p3.pic1.2.8" class="ltx_p"><span id="A2.SS2.SSS0.Px3.p3.pic1.2.8.1" class="ltx_text ltx_font_typewriter" style="font-size:90%;--ltx-fg-color:#000000;">Flag <span id="A2.SS2.SSS0.Px3.p3.pic1.2.8.1.1" class="ltx_text ltx_font_bold">Ethical Concerns</span> if applicable (per conference policy). </span></span>
<span id="A2.SS2.SSS0.Px3.p3.pic1.2.9" class="ltx_p"><span id="A2.SS2.SSS0.Px3.p3.pic1.2.9.1" class="ltx_text ltx_font_typewriter" style="font-size:90%;--ltx-fg-color:#000000;">Assign numerical ratings: <span id="A2.SS2.SSS0.Px3.p3.pic1.2.9.1.1" class="ltx_text ltx_font_bold">Soundness</span>, <span id="A2.SS2.SSS0.Px3.p3.pic1.2.9.1.2" class="ltx_text ltx_font_bold">Presentation</span>, <span id="A2.SS2.SSS0.Px3.p3.pic1.2.9.1.3" class="ltx_text ltx_font_bold">Contribution</span> (1--4 each). </span></span>
<span id="A2.SS2.SSS0.Px3.p3.pic1.2.10" class="ltx_p"><span id="A2.SS2.SSS0.Px3.p3.pic1.2.10.1" class="ltx_text ltx_font_typewriter" style="font-size:90%;--ltx-fg-color:#000000;">Provide an <span id="A2.SS2.SSS0.Px3.p3.pic1.2.10.1.1" class="ltx_text ltx_font_bold">Overall</span> score (1--10) and <span id="A2.SS2.SSS0.Px3.p3.pic1.2.10.1.2" class="ltx_text ltx_font_bold">Confidence</span> (1--5).
</span></span>
<span id="A2.SS2.SSS0.Px3.p3.pic1.2.11" class="ltx_p"><span id="A2.SS2.SSS0.Px3.p3.pic1.2.11.1" class="ltx_text ltx_font_typewriter" style="font-size:90%;--ltx-fg-color:#000000;">## Output a valid JSON object with the following fields:

   &quot;Summary&quot;: &lt;summary for the paper&gt;,    &quot;Questions&quot;: &lt;questions for the author&gt;,    &quot;Limitations&quot;: &lt;limitations for the paper&gt;,    &quot;Soundness&quot;: &lt;1--4&gt;,    &quot;Presentation&quot;: &lt;1--4&gt;,    &quot;Contribution&quot;: &lt;1--4&gt;,    &quot;Overall&quot;: &lt;1--10&gt;,    &quot;Confidence&quot;: &lt;1--5&gt;
</span></span>
<span id="A2.SS2.SSS0.Px3.p3.pic1.2.12" class="ltx_p"><span id="A2.SS2.SSS0.Px3.p3.pic1.2.12.1" class="ltx_text ltx_font_typewriter" style="font-size:90%;--ltx-fg-color:#000000;">Formatted the abovementioned schema and produce the review JSON now.
</span></span>
</span></span></span></foreignobject></g></g></svg>