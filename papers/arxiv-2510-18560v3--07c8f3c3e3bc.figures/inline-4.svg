<span id="A2.SS2.p6.pic1.1" class="ltx_inline-block ltx_minipage ltx_align_bottom" style="width:36.62em;">
<span id="A2.SS2.p6.pic1.1.1" class="ltx_p ltx_align_center"><span id="A2.SS2.p6.pic1.1.1.1" class="ltx_text ltx_font_bold ltx_font_smallcaps" style="--ltx-fg-color:#FFFFFF;">Annotation Guidelines</span></span>
</span></span></span></foreignobject></g><g fill-opacity="1.0" transform="matrix(1.0 0.0 0.0 1.0 21.65 255.85)"><foreignobject style="--ltx-fo-width:36.62em;--ltx-fo-height:1.79em;--ltx-fo-depth:17.49em;font-size:10pt;" height="266.9" overflow="visible" transform="matrix(1 0 0 -1 0 24.83)" width="506.72"><span class="ltx_foreignobject_container"><span class="ltx_foreignobject_content">
<span id="A2.SS2.p6.pic1.2" class="ltx_inline-block ltx_minipage ltx_align_bottom" style="width:36.62em;">
<span id="A2.I2" class="ltx_enumerate ltx_leftmargin_flush">
<span id="A2.I2.i1" class="ltx_item" style="list-style-type:none;"><span class="ltx_tag ltx_tag_item">1.</span> 
<span id="A2.I2.i1.p1" class="ltx_para ltx_noindent">
<span id="A2.I2.i1.p1.1" class="ltx_p"><span id="A2.I2.i1.p1.1.1" class="ltx_text" style="--ltx-fg-color:#000000;">All judgments must be based on actual user experience, not solely on visual appearance.</span></span>
</span></span>
<span id="A2.I2.i2" class="ltx_item" style="list-style-type:none;"><span class="ltx_tag ltx_tag_item">2.</span> 
<span id="A2.I2.i2.p1" class="ltx_para ltx_noindent">
<span id="A2.I2.i2.p1.1" class="ltx_p"><span id="A2.I2.i2.p1.1.1" class="ltx_text" style="--ltx-fg-color:#000000;">In general, the completeness of functionality takes precedence over aesthetics, unless the user query explicitly requests a focus on design.</span></span>
</span></span>
<span id="A2.I2.i3" class="ltx_item" style="list-style-type:none;"><span class="ltx_tag ltx_tag_item">3.</span> 
<span id="A2.I2.i3.p1" class="ltx_para ltx_noindent">
<span id="A2.I2.i3.p1.1" class="ltx_p"><span id="A2.I2.i3.p1.1.1" class="ltx_text" style="--ltx-fg-color:#000000;">If both web pages are well-implemented, aesthetic quality should be considered as a deciding factor.</span></span>
</span></span>
<span id="A2.I2.i4" class="ltx_item" style="list-style-type:none;"><span class="ltx_tag ltx_tag_item">4.</span> 
<span id="A2.I2.i4.p1" class="ltx_para ltx_noindent">
<span id="A2.I2.i4.p1.1" class="ltx_p"><span id="A2.I2.i4.p1.1.1" class="ltx_text" style="--ltx-fg-color:#000000;">If there is any important and discernible difference in quality between the two pages, a preference should be stated rather than defaulting to a tie.</span></span>
</span></span>
<span id="A2.I2.i5" class="ltx_item" style="list-style-type:none;"><span class="ltx_tag ltx_tag_item">5.</span> 
<span id="A2.I2.i5.p1" class="ltx_para ltx_noindent">
<span id="A2.I2.i5.p1.1" class="ltx_p"><span id="A2.I2.i5.p1.1.1" class="ltx_text" style="--ltx-fg-color:#000000;">When a decision is difficult, the rubric tree should serve as the definitive guide. Refer to the fulfillment of both leaf-level and root-level criteria.</span></span>
</span></span>
<span id="A2.I2.i6" class="ltx_item" style="list-style-type:none;"><span class="ltx_tag ltx_tag_item">6.</span> 
<span id="A2.I2.i6.p1" class="ltx_para">
<span id="A2.I2.i6.p1.1" class="ltx_p"><span id="A2.I2.i6.p1.1.1" class="ltx_text" style="--ltx-fg-color:#000000;">When judging based on the rubric tree, consider functional equivalence rather than demanding literal, identical implementations.</span></span>
</span></span>
</span>
</span></span></span></foreignobject></g></g></svg>