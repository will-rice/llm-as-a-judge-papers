<svg id="A4.F13.pic1" class="ltx_picture" height="886.95" overflow="visible" version="1.1" viewbox="0 0 550 886.95" width="550"><g style="--ltx-stroke-color:#000000;--ltx-fill-color:#000000;" fill="#000000" stroke="#000000" stroke-width="0.4pt" transform="translate(0,886.95) matrix(1 0 0 -1 0 0)"><g style="--ltx-fill-color:#390013;" fill="#390013" fill-opacity="1.0"><path style="stroke:none" d="M 0 5.91 L 0 881.05 C 0 884.31 2.64 886.95 5.91 886.95 L 544.09 886.95 C 547.36 886.95 550 884.31 550 881.05 L 550 5.91 C 550 2.64 547.36 0 544.09 0 L 5.91 0 C 2.64 0 0 2.64 0 5.91 Z" /></g><g style="--ltx-fill-color:#FFFFFF;" fill="#FFFFFF" fill-opacity="1.0"><path style="stroke:none" d="M 1.97 5.91 L 1.97 862.84 L 548.03 862.84 L 548.03 5.91 C 548.03 3.73 546.27 1.97 544.09 1.97 L 5.91 1.97 C 3.73 1.97 1.97 3.73 1.97 5.91 Z" /></g><g fill-opacity="1.0" transform="matrix(1.0 0.0 0.0 1.0 21.65 871.44)"><foreignobject style="--ltx-fo-width:36.62em;--ltx-fo-height:0.69em;--ltx-fo-depth:0.19em;font-size:10pt;" height="12.3" overflow="visible" transform="matrix(1 0 0 -1 0 9.61)" width="506.72"><span class="ltx_foreignobject_container"><span class="ltx_foreignobject_content">
<span id="A4.F13.pic1.1" class="ltx_inline-block ltx_minipage ltx_align_bottom" style="width:36.62em;">
<span id="A4.F13.pic1.1.1" class="ltx_p"><span id="A4.F13.pic1.1.1.1" class="ltx_text" style="--ltx-fg-color:#FFFFFF;">WebJudge judgment instruction</span></span>
</span></span></span></foreignobject></g><g fill-opacity="1.0" transform="matrix(1.0 0.0 0.0 1.0 21.65 17.24)"><foreignobject style="--ltx-fo-width:36.62em;--ltx-fo-height:60.26em;--ltx-fo-depth:0.25em;font-size:10pt;" height="837.26" overflow="visible" transform="matrix(1 0 0 -1 0 833.8)" width="506.72"><span class="ltx_foreignobject_container"><span class="ltx_foreignobject_content">
<span id="A4.F13.pic1.2" class="ltx_inline-block ltx_minipage ltx_align_bottom" style="width:36.62em;">
<span id="A4.F13.pic1.2.1" class="ltx_p"><span id="A4.F13.pic1.2.1.1" class="ltx_text" style="--ltx-fg-color:#000000;">You are an expert in evaluating the performance of a web navigation agent. The agent is designed to help a human user navigate a website to complete a task. Given the user’s task, the agent’s action history, key points for task completion, some potentially important web pages in the agent’s trajectory and their reasons, your goal is to determine whether the agent has completed the task and achieved all requirements.</span></span>
<span id="A4.F13.pic1.2.2" class="ltx_p"><span id="A4.F13.pic1.2.2.1" class="ltx_text" style="--ltx-fg-color:#000000;">Your response must strictly follow the following evaluation criteria!</span></span>
<span id="A4.F13.pic1.2.3" class="ltx_p"><span id="A4.F13.pic1.2.3.1" class="ltx_text ltx_font_italic" style="--ltx-fg-color:#000000;">Important Evaluation Criteria:<span id="A4.F13.pic1.2.3.1.1" class="ltx_text"></span></span></span>
<span id="A4.I1" class="ltx_enumerate">
<span id="A4.I1.i1" class="ltx_item" style="list-style-type:none;"><span class="ltx_tag ltx_tag_item">1.</span> 
<span id="A4.I1.i1.p1" class="ltx_para ltx_noindent">
<span id="A4.I1.i1.p1.1" class="ltx_p"><span id="A4.I1.i1.p1.1.1" class="ltx_text" style="--ltx-fg-color:#000000;">The filtered results must be displayed correctly. If filters were not properly applied (i.e., missing selection, missing confirmation, or no visible effect in results), it should be considered a failure.</span></span>
</span></span>
<span id="A4.I1.i2" class="ltx_item" style="list-style-type:none;"><span class="ltx_tag ltx_tag_item">2.</span> 
<span id="A4.I1.i2.p1" class="ltx_para ltx_noindent">
<span id="A4.I1.i2.p1.1" class="ltx_p"><span id="A4.I1.i2.p1.1.1" class="ltx_text" style="--ltx-fg-color:#000000;">You must carefully check whether these snapshots and action history meet these key points. Ensure that specific filter conditions, such as “best,” “highest,” “cheapest,” “latest,” “most recent,” “lowest,” “closest,” “highest-rated,” “largest,” and “newest” are correctly applied using the filter function (e.g., sort function).</span></span>
</span></span>
<span id="A4.I1.i3" class="ltx_item" style="list-style-type:none;"><span class="ltx_tag ltx_tag_item">3.</span> 
<span id="A4.I1.i3.p1" class="ltx_para ltx_noindent">
<span id="A4.I1.i3.p1.1" class="ltx_p"><span id="A4.I1.i3.p1.1.1" class="ltx_text" style="--ltx-fg-color:#000000;">Certain key points or requirements should be applied by the filter. Otherwise, a search with all requirements as input will be deemed a failure since it cannot guarantee that all results meet the requirements.</span></span>
</span></span>
<span id="A4.I1.i4" class="ltx_item" style="list-style-type:none;"><span class="ltx_tag ltx_tag_item">4.</span> 
<span id="A4.I1.i4.p1" class="ltx_para ltx_noindent">
<span id="A4.I1.i4.p1.1" class="ltx_p"><span id="A4.I1.i4.p1.1.1" class="ltx_text" style="--ltx-fg-color:#000000;">If the task requires filtering by a specific range of money, years, or the number of beds and bathrooms, the applied filter must exactly match the given requirement. Any deviation results in failure. To ensure the task is successful, the applied filter must precisely match the specified range without being too broad or too narrow.</span></span>
</span></span>
<span id="A4.I1.i5" class="ltx_item" style="list-style-type:none;"><span class="ltx_tag ltx_tag_item">5.</span> 
<span id="A4.I1.i5.p1" class="ltx_para ltx_noindent">
<span id="A4.I1.i5.p1.1" class="ltx_p"><span id="A4.I1.i5.p1.1.1" class="ltx_text" style="--ltx-fg-color:#000000;">Some tasks require a submission action or a display of results to be considered successful. Repeat actions or actions that do not lead to a visible result should be considered a failure.</span></span>
</span></span>
<span id="A4.I1.i6" class="ltx_item" style="list-style-type:none;"><span class="ltx_tag ltx_tag_item">6.</span> 
<span id="A4.I1.i6.p1" class="ltx_para">
<span id="A4.I1.i6.p1.1" class="ltx_p"><span id="A4.I1.i6.p1.1.1" class="ltx_text" style="--ltx-fg-color:#000000;">If the agent loops through a sequence of actions that do not make progress toward the goal (including failing to click “Save” or “Submit,” etc.), it should be considered a failure.</span></span>
</span></span>
</span>
<span id="A4.F13.pic1.2.4" class="ltx_p"><span id="A4.F13.pic1.2.4.1" class="ltx_text" style="--ltx-fg-color:#000000;">Format your response into two lines as shown below: 
<br class="ltx_break"><span id="A4.F13.pic1.2.4.1.1" class="ltx_text ltx_font_bold">Thoughts:</span> <math id="A4.F13.pic1.m1" class="ltx_Math" alttext="&lt;" display="inline" intent=":literal"><semantics><mo style="--ltx-fg-color:#000000;" mathcolor="#000000">&lt;</mo><annotation encoding="application/x-tex">&lt;</annotation></semantics></math><span id="A4.F13.pic1.2.4.1.2" class="ltx_text ltx_font_italic">your thoughts and reasoning process should be based on double-checking each key point and the evaluation criteria<math id="A4.F13.pic1.m2" class="ltx_Math" alttext="&gt;" display="inline" intent=":literal"><semantics><mo style="--ltx-fg-color:#000000;" mathcolor="#000000">&gt;</mo><annotation encoding="application/x-tex">&gt;</annotation></semantics></math></span> 
<br class="ltx_break"><span id="A4.F13.pic1.2.4.1.3" class="ltx_text ltx_font_bold">Status:</span> “success” or “failure”</span></span>
<span id="A4.F13.pic1.2.5" class="ltx_p"><span id="A4.F13.pic1.2.5.1" class="ltx_text ltx_font_bold" style="--ltx-fg-color:#000000;">User Task:<span id="A4.F13.pic1.2.5.1.1" class="ltx_text ltx_font_medium"> <span id="A4.F13.pic1.2.5.1.1.1" class="ltx_text ltx_font_typewriter">{task}</span></span></span></span>
<span id="A4.F13.pic1.2.6" class="ltx_p"><span id="A4.F13.pic1.2.6.1" class="ltx_text ltx_font_bold" style="--ltx-fg-color:#000000;">Key Points:<span id="A4.F13.pic1.2.6.1.1" class="ltx_text ltx_font_medium"> <span id="A4.F13.pic1.2.6.1.1.1" class="ltx_text ltx_font_typewriter">{key_points}</span></span></span></span>
<span id="A4.F13.pic1.2.7" class="ltx_p"><span id="A4.F13.pic1.2.7.1" class="ltx_text ltx_font_bold" style="--ltx-fg-color:#000000;">Action History:<span id="A4.F13.pic1.2.7.1.1" class="ltx_text ltx_font_medium"> 
<br class="ltx_break"><span id="A4.F13.pic1.2.7.1.1.1" class="ltx_text ltx_font_typewriter">{actions}</span></span></span></span>
<span id="A4.F13.pic1.2.8" class="ltx_p"><span id="A4.F13.pic1.2.8.1" class="ltx_text" style="--ltx-fg-color:#000000;">The potentially important snapshots of the webpage in the agent’s trajectory and their reasons: 
<br class="ltx_break"><span id="A4.F13.pic1.2.8.1.1" class="ltx_text ltx_font_typewriter">{thoughts}</span></span></span>
</span></span></span></foreignobject></g></g></svg>