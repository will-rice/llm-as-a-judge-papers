<span id="A2.SS1.SSS0.Px2.p5.pic1.1" class="ltx_inline-block ltx_minipage ltx_align_bottom" style="width:36.62em;">
<span id="A2.SS1.SSS0.Px2.p5.pic1.1.1" class="ltx_p ltx_align_center"><span id="A2.SS1.SSS0.Px2.p5.pic1.1.1.1" class="ltx_text ltx_font_bold ltx_font_smallcaps" style="--ltx-fg-color:#FFFFFF;">Prompt for Query-based Intention Filtering</span></span>
</span></span></span></foreignobject></g><g fill-opacity="1.0" transform="matrix(1.0 0.0 0.0 1.0 21.65 17.24)"><foreignobject style="--ltx-fo-width:34.88em;--ltx-fo-height:16.29em;--ltx-fo-depth:0.25em;font-size:10pt;" height="228.93" overflow="visible" transform="matrix(1 0 0 -1 0 225.47)" width="482.64"><span class="ltx_foreignobject_container"><span class="ltx_foreignobject_content">
<span id="A2.SS1.SSS0.Px2.p5.pic1.2" class="ltx_inline-block ltx_minipage ltx_align_bottom" style="width:34.88em;">
<span id="A2.SS1.SSS0.Px2.p5.pic1.2.1" class="ltx_p"><span id="A2.SS1.SSS0.Px2.p5.pic1.2.1.1" class="ltx_text" style="--ltx-fg-color:#000000;">Analyze the user’s input to evaluate the clarity of their query regarding website design. Assign a score from 1 to 5 based on the criteria below:</span></span>
<span id="A2.SS1.SSS0.Px2.p5.pic1.2.2" class="ltx_p"><span id="A2.SS1.SSS0.Px2.p5.pic1.2.2.1" class="ltx_text" style="--ltx-fg-color:#000000;">Score 5: User provides a clear, detailed description of requirements, including specific features and design elements.</span></span>
<span id="A2.SS1.SSS0.Px2.p5.pic1.2.3" class="ltx_p"><span id="A2.SS1.SSS0.Px2.p5.pic1.2.3.1" class="ltx_text" style="--ltx-fg-color:#000000;">Score 4: User’s intention is mostly clear with some details, but lacks comprehensive specifics.</span></span>
<span id="A2.SS1.SSS0.Px2.p5.pic1.2.4" class="ltx_p"><span id="A2.SS1.SSS0.Px2.p5.pic1.2.4.1" class="ltx_text" style="--ltx-fg-color:#000000;">Score 3: User presents a general idea, but the request is vague and lacks essential information.</span></span>
<span id="A2.SS1.SSS0.Px2.p5.pic1.2.5" class="ltx_p"><span id="A2.SS1.SSS0.Px2.p5.pic1.2.5.1" class="ltx_text" style="--ltx-fg-color:#000000;">Score 2: User’s input is unclear or contains irrelevant information, making their intention difficult to discern.</span></span>
<span id="A2.SS1.SSS0.Px2.p5.pic1.2.6" class="ltx_p"><span id="A2.SS1.SSS0.Px2.p5.pic1.2.6.1" class="ltx_text" style="--ltx-fg-color:#000000;">Score 1: Input is nonsensical or purely code-related, reflecting no intention for a design request.
Output: Return a JSON object containing the reasoning for the score and an expected result, formatted as follows:</span></span><pre id="A2.SS1.SSS0.Px2.p5.pic1.2.7" class="ltx_verbatim ltx_font_typewriter" style="--ltx-fg-color:#000000;">
[{&quot;reason&quot;: &quot;A clone of WhatsApp Chat App&quot;, &quot;score&quot;: &quot;4&quot;},]
</pre>
</span></span></span></foreignobject></g></g></svg>