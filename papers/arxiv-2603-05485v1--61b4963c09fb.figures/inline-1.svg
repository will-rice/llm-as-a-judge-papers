<span id="S3.p2.pic1.1.1" class="ltx_p"><span id="S3.p2.pic1.1.1.1" class="ltx_text ltx_font_bold ltx_font_italic" style="--ltx-fg-color:#000000;">Not<span id="S3.p2.pic1.1.1.1.1" class="ltx_text ltx_font_upright"> Worst Case Analysis</span></span></span>
</span></span></span></foreignobject></g><g fill-opacity="1.0" transform="matrix(1.0 0.0 0.0 1.0 5.53 8.99)"><foreignobject style="--ltx-fo-width:46.18em;--ltx-fo-height:13.89em;--ltx-fo-depth:0.25em;font-size:10pt;" height="195.72" overflow="visible" transform="matrix(1 0 0 -1 0 192.26)" width="639"><span class="ltx_foreignobject_container"><span class="ltx_foreignobject_content">
<span id="S3.p2.pic1.2" class="ltx_inline-block ltx_minipage ltx_align_bottom" style="width:46.18em;">
<span id="S3.p2.pic1.2.1" class="ltx_p"><span id="S3.p2.pic1.2.1.1" class="ltx_text" style="--ltx-fg-color:#000000;">Under a <span id="S3.p2.pic1.2.1.1.1" class="ltx_text ltx_font_italic">worst-case</span> style analysis (as is standard with e.g. global differential privacy and many of its variants), one tries to bound the effect of <span id="S3.p2.pic1.2.1.1.2" class="ltx_text ltx_font_italic">any</span> perturbation (across <span id="S3.p2.pic1.2.1.1.3" class="ltx_text ltx_font_italic">any</span> neighboring dataset) <cite class="ltx_cite ltx_citemacro_citep">[<a href="#bib.bib31" title class="ltx_ref">14</a>, <a href="#bib.bib5" title class="ltx_ref">9</a>]</cite>. This is inherently too conservative in the setting of LLM judgements and contexts, as it tunes the mechanism to the worst possible change (which could be on the order of the full judgement scale), and forces one to consider <span id="S3.p2.pic1.2.1.1.4" class="ltx_text ltx_font_italic">any</span> two judgement contexts (that can be adversarially chosen).</span></span>
</span></span></span></foreignobject></g></g></svg>