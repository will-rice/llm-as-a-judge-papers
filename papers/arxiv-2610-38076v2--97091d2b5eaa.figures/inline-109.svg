</span></span></span></foreignobject></g><g fill-opacity="1.0" transform="matrix(1.0 0.0 0.0 1.0 15.84 16.14)"><foreignobject style="--ltx-fo-width:42.56em;--ltx-fo-height:22.21em;--ltx-fo-depth:0.22em;font-size:10pt;" height="310.41" overflow="visible" transform="matrix(1 0 0 -1 0 307.34)" width="588.91"><span class="ltx_foreignobject_container"><span class="ltx_foreignobject_content">
<span id="A6.SSx14.SSS0.Px1.p4.pic1.2" class="ltx_inline-block ltx_minipage ltx_align_bottom" style="width:42.56em;">
<span id="A6.SSx14.SSS0.Px1.p4.pic1.2.1" class="ltx_p ltx_align_left"><span id="A6.SSx14.SSS0.Px1.p4.pic1.2.1.1" class="ltx_text ltx_font_typewriter" style="--ltx-fg-color:#000000;">You will be given one summary written for a source document.</span></span>
<span id="A6.SSx14.SSS0.Px1.p4.pic1.2.2" class="ltx_p ltx_align_left"><span id="A6.SSx14.SSS0.Px1.p4.pic1.2.2.1" class="ltx_text ltx_font_typewriter" style="--ltx-fg-color:#000000;">Your task is to rate the summary on one metric: Fluency.</span></span>
<span id="A6.SSx14.SSS0.Px1.p4.pic1.2.3" class="ltx_p ltx_align_left"><span id="A6.SSx14.SSS0.Px1.p4.pic1.2.3.1" class="ltx_text ltx_font_typewriter" style="--ltx-fg-color:#000000;">Please make sure you read and understand these instructions carefully. Please keep</span></span>
<span id="A6.SSx14.SSS0.Px1.p4.pic1.2.4" class="ltx_p ltx_align_left"><span id="A6.SSx14.SSS0.Px1.p4.pic1.2.4.1" class="ltx_text ltx_font_typewriter" style="--ltx-fg-color:#000000;">this document open while reviewing, and refer to it as needed.</span></span>
<span id="A6.SSx14.SSS0.Px1.p4.pic1.2.5" class="ltx_p ltx_align_left"><span id="A6.SSx14.SSS0.Px1.p4.pic1.2.5.1" class="ltx_text ltx_font_typewriter" style="--ltx-fg-color:#000000;">Evaluation Criteria:</span></span>
<span id="A6.SSx14.SSS0.Px1.p4.pic1.2.6" class="ltx_p ltx_align_left"><span id="A6.SSx14.SSS0.Px1.p4.pic1.2.6.1" class="ltx_text ltx_font_typewriter" style="--ltx-fg-color:#000000;">Fluency (1-5) - the quality of individual sentences. The sentences should have no</span></span>
<span id="A6.SSx14.SSS0.Px1.p4.pic1.2.7" class="ltx_p ltx_align_left"><span id="A6.SSx14.SSS0.Px1.p4.pic1.2.7.1" class="ltx_text ltx_font_typewriter" style="--ltx-fg-color:#000000;">formatting problems, capitalization errors or obviously ungrammatical sentences</span></span>
<span id="A6.SSx14.SSS0.Px1.p4.pic1.2.8" class="ltx_p ltx_align_left"><span id="A6.SSx14.SSS0.Px1.p4.pic1.2.8.1" class="ltx_text ltx_font_typewriter" style="--ltx-fg-color:#000000;">(e.g., fragments, missing components) that make the text difficult to read.</span></span>
<span id="A6.SSx14.SSS0.Px1.p4.pic1.2.9" class="ltx_p ltx_align_left"><span id="A6.SSx14.SSS0.Px1.p4.pic1.2.9.1" class="ltx_text ltx_font_typewriter" style="--ltx-fg-color:#000000;">Evaluation Steps:</span></span>
<span id="A6.SSx14.SSS0.Px1.p4.pic1.2.10" class="ltx_p ltx_align_left"><span id="A6.SSx14.SSS0.Px1.p4.pic1.2.10.1" class="ltx_text ltx_font_typewriter" style="--ltx-fg-color:#000000;">1. Read the summary carefully.</span></span>
<span id="A6.SSx14.SSS0.Px1.p4.pic1.2.11" class="ltx_p ltx_align_left"><span id="A6.SSx14.SSS0.Px1.p4.pic1.2.11.1" class="ltx_text ltx_font_typewriter" style="--ltx-fg-color:#000000;">2. Evaluate the quality of the writing.</span></span>
<span id="A6.SSx14.SSS0.Px1.p4.pic1.2.12" class="ltx_p ltx_align_left"><span id="A6.SSx14.SSS0.Px1.p4.pic1.2.12.1" class="ltx_text ltx_font_typewriter" style="--ltx-fg-color:#000000;">3. Assign a score for fluency on a scale of 1-5, where 1 is the lowest and 5 is</span></span>
<span id="A6.SSx14.SSS0.Px1.p4.pic1.2.13" class="ltx_p ltx_align_left"><span id="A6.SSx14.SSS0.Px1.p4.pic1.2.13.1" class="ltx_text ltx_font_typewriter" style="--ltx-fg-color:#000000;">the highest.</span></span>
<span id="A6.SSx14.SSS0.Px1.p4.pic1.2.14" class="ltx_p ltx_align_left"><span id="A6.SSx14.SSS0.Px1.p4.pic1.2.14.1" class="ltx_text ltx_font_typewriter" style="--ltx-fg-color:#000000;">Source Document:</span></span>
<span id="A6.SSx14.SSS0.Px1.p4.pic1.2.15" class="ltx_p ltx_align_left"><span id="A6.SSx14.SSS0.Px1.p4.pic1.2.15.1" class="ltx_text ltx_font_typewriter" style="--ltx-fg-color:#000000;">conversation</span></span>
<span id="A6.SSx14.SSS0.Px1.p4.pic1.2.16" class="ltx_p ltx_align_left"><span id="A6.SSx14.SSS0.Px1.p4.pic1.2.16.1" class="ltx_text ltx_font_typewriter" style="--ltx-fg-color:#000000;">Summary:</span></span>
<span id="A6.SSx14.SSS0.Px1.p4.pic1.2.17" class="ltx_p ltx_align_left"><span id="A6.SSx14.SSS0.Px1.p4.pic1.2.17.1" class="ltx_text ltx_font_typewriter" style="--ltx-fg-color:#000000;">prediction</span></span>
<span id="A6.SSx14.SSS0.Px1.p4.pic1.2.18" class="ltx_p ltx_align_left"><span id="A6.SSx14.SSS0.Px1.p4.pic1.2.18.1" class="ltx_text ltx_font_typewriter" style="--ltx-fg-color:#000000;">Evaluation Form (scores ONLY):</span></span>
<span id="A6.SSx14.SSS0.Px1.p4.pic1.2.19" class="ltx_p ltx_align_left"><span id="A6.SSx14.SSS0.Px1.p4.pic1.2.19.1" class="ltx_text ltx_font_typewriter" style="--ltx-fg-color:#000000;">- Fluency (1-5):</span></span>
</span></span></span></foreignobject></g></g></svg>