<br class="ltx_break"><span id="S3.SS4.SSS1.p4.pic1.2.1.1.1" class="ltx_text ltx_font_medium">You are an expert summarization system. Your task is to generate an improved summary by addressing quality issues identified in the previous evaluation.</span></span></span>
