 width="293.31"><span class="ltx_foreignobject_container"><span class="ltx_foreignobject_content"><span id="A1.F4.pic1.1" class="ltx_text" style="--ltx-fg-color:#FFFFFF;">Step 2: Error Instance Rating Prompt Template</span></span></span></foreignobject></g></g></g><g fill-opacity="1.0" transform="matrix(1.0 0.0 0.0 1.0 21.65 395.68)"><foreignobject style="--ltx-fo-width:44.29em;--ltx-fo-height:0.69em;--ltx-fo-depth:27.6em;font-size:10pt;" height="391.51" overflow="visible" transform="matrix(1 0 0 -1 0 9.61)" width="612.85"><span class="ltx_foreignobject_container"><span class="ltx_foreignobject_content">
<span id="A1.F4.pic1.2" class="ltx_inline-block ltx_minipage" style="width:44.29em;">
<span id="A1.F4.pic1.2.1" class="ltx_p ltx_parbox ltx_align_top" style="width:442.9pt;"><span id="A1.F4.pic1.2.1.1" class="ltx_text" style="--ltx-fg-color:#000000;">Step 2 is to rate the severity of the potential error instances.</span>
<br class="ltx_break"><span id="A1.F4.pic1.2.1.2" class="ltx_text" style="--ltx-fg-color:#000000;">Read the following criteria carefully: *** criteria: self.criteria[criteria] ***.</span>
<br class="ltx_break"><span id="A1.F4.pic1.2.1.3" class="ltx_text" style="--ltx-fg-color:#000000;">Next, read the already collected potential error instances: *** list_of_instances ***.</span>
<br class="ltx_break"><span id="A1.F4.pic1.2.1.4" class="ltx_text" style="--ltx-fg-color:#000000;">Also, consider the original meeting transcript: * {data[’transcript’]} * and the summary: * data[’summary’] *.</span>
<br class="ltx_break">
<br class="ltx_break"><span id="A1.F4.pic1.2.1.5" class="ltx_text" style="--ltx-fg-color:#000000;">Now, for each instance, decide if it is an actual error instance or not according to the criteria.
For each instance, write down a short reasoning explaining why you decided so.
Provide a score on the severity of the error, ranging from 0 (no error) to 10 (severe error).
Also, provide a score for your certainty, ranging from 1 (totally unsure) to 10 (totally sure).
For each instance, indicate whether the error exists by setting the ’error_exists’ field to true or false.
Return the output strictly in JSON format, using double quotes around all keys and values, and return nothing else.
Here is the required format for your response: </span>
<br class="ltx_break">
<br class="ltx_break"><span id="A1.F4.pic1.2.1.6" class="ltx_text" style="--ltx-fg-color:#000000;">[ {’instance’: ’&lt;the instance&gt;’, ’reasoning’ : ’&lt;chain-of-thought reasoning if there is an error according to the criteria or not&gt;’, ’certainty’: ’&lt;score from 0 meaning totally unsure to 100 meaning totally sure&gt;’, ’error_exists’ : &lt;true or false depending on your decision&gt;}, {&lt;same for instance 2&gt;}, … {&lt;same for instance n&gt;}]</span>
<br class="ltx_break">
<br class="ltx_break"><span id="A1.F4.pic1.2.1.7" class="ltx_text" style="--ltx-fg-color:#000000;">Make sure the output is strictly valid JSON, with no preamble, extra explanations, or text outside the JSON structure.</span></span>
</span></span></span></foreignobject></g></g></svg>