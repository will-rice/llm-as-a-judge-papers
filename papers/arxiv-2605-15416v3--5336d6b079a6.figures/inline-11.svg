<span id="A4.SS4.p7.pic1.p4" class="ltx_para">
<span id="A4.SS4.p7.pic1.p4.1" class="ltx_p"><span id="A4.SS4.p7.pic1.p4.1.1" class="ltx_text ltx_font_bold" style="--ltx-fg-color:#000000;">Document
<br class="ltx_break"><span id="A4.SS4.p7.pic1.p4.1.1.1" class="ltx_text ltx_font_medium">So, we met on the ever popular OKCupid about a month ago, and have been on around 8 dates since. On our second date we ended up going home together, and having sex, but there was no awkwardness afterwards and arranged another date over coffee in the morning. On Thursday last week, we had a bit of a ẅhere is this going?c̈onversation, in which he confessed he’s never really had a relationship or dated extensively. I have dated and had relationships in the past, so understand that it’s a bit of an awkward new world for some people. I’m really into him, but he doesn’t seem available outside of face to face dating…
It’s leaving me a little confused and frustrated.</span></span></span>
</span>
<span id="A4.SS4.p7.pic1.p1" class="ltx_para ltx_noindent">
