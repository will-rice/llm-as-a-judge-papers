<span id="A1.SS2.SSS2.p3.pic1.1.1" class="ltx_p"><span id="A1.SS2.SSS2.p3.pic1.1.1.1" class="ltx_text ltx_font_bold" style="font-size:90%;--ltx-fg-color:#FFFFFF;">Extracted Lessons (Cross-Model, Consistency)</span></span>
</span></span></span></foreignobject></g><g fill-opacity="1.0" transform="matrix(1.0 0.0 0.0 1.0 21.65 218.91)"><foreignobject style="--ltx-fo-width:33.91em;--ltx-fo-height:1.63em;--ltx-fo-depth:14.83em;font-size:10pt;" height="227.69" overflow="visible" transform="matrix(1 0 0 -1 0 22.55)" width="469.22"><span class="ltx_foreignobject_container"><span class="ltx_foreignobject_content">
<span id="A1.SS2.SSS2.p3.pic1.2" class="ltx_inline-block ltx_minipage ltx_align_bottom" style="width:33.91em;">
<span id="A1.I2" class="ltx_enumerate">
<span id="A1.I2.i1" class="ltx_item" style="list-style-type:none;"><span class="ltx_tag ltx_tag_item">1.</span> 
<span id="A1.I2.i1.p1" class="ltx_para">
<span id="A1.I2.i1.p1.1" class="ltx_p"><span id="A1.I2.i1.p1.1.1" class="ltx_text ltx_font_bold" style="font-size:90%;--ltx-fg-color:#000000;">Omission <math id="A1.I2.i1.p1.m1" class="ltx_Math" alttext="\neq" display="inline" intent=":literal"><semantics><mo style="--ltx-fg-color:#000000;" mathcolor="#000000">≠</mo><annotation encoding="application/x-tex">\neq</annotation></semantics></math> inconsistency.</span><span id="A1.I2.i1.p1.1.2" class="ltx_text" style="font-size:90%;--ltx-fg-color:#000000;"> A summary that omits details from the source is not factually inconsistent; only statements </span><em id="A1.I2.i1.p1.1.3" class="ltx_emph ltx_font_italic" style="font-size:90%;--ltx-fg-color:#000000;">present in the summary</em><span id="A1.I2.i1.p1.1.4" class="ltx_text" style="font-size:90%;--ltx-fg-color:#000000;"> that are unsupported should be penalized.</span></span>
</span></span>
<span id="A1.I2.i2" class="ltx_item" style="list-style-type:none;"><span class="ltx_tag ltx_tag_item">2.</span> 
<span id="A1.I2.i2.p1" class="ltx_para">
<span id="A1.I2.i2.p1.1" class="ltx_p"><span id="A1.I2.i2.p1.1.1" class="ltx_text ltx_font_bold" style="font-size:90%;--ltx-fg-color:#000000;">Semantic equivalence via arithmetic.</span><span id="A1.I2.i2.p1.1.2" class="ltx_text" style="font-size:90%;--ltx-fg-color:#000000;"> Converting “83rd minute” to “seven minutes remaining” (in a 90-minute match) is a valid transformation, not a hallucination.</span></span>
</span></span>
<span id="A1.I2.i3" class="ltx_item" style="list-style-type:none;"><span class="ltx_tag ltx_tag_item">3.</span> 
<span id="A1.I2.i3.p1" class="ltx_para">
<span id="A1.I2.i3.p1.1" class="ltx_p"><span id="A1.I2.i3.p1.1.1" class="ltx_text ltx_font_bold" style="font-size:90%;--ltx-fg-color:#000000;">Subject–role misattribution.</span><span id="A1.I2.i3.p1.1.2" class="ltx_text" style="font-size:90%;--ltx-fg-color:#000000;"> When summaries restructure clauses, verify that entities are attached to the correct verbs (e.g., “X restarted his row with Z” misattributes if the source says “X had a row with Y and drew 0–0 with Z”).</span></span>
</span></span>
</span>
</span></span></span></foreignobject></g></g></svg>