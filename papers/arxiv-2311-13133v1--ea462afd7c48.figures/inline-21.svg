<span id="A6.I3.i1" class="ltx_item" style="list-style-type:none;"><span class="ltx_tag ltx_tag_item">•</span> 
<span id="A6.I3.i1.p1" class="ltx_para">
<span id="A6.I3.i1.p1.1" class="ltx_p"><span id="A6.I3.i1.p1.1.1" class="ltx_text ltx_font_sansserif" style="font-size:80%;--ltx-fg-color:#000000;">Small Windows &amp; Dialogues get the button on the bottom right. Note the buttons on stackexchange sites:</span></span>
</span></span>
<span id="A6.I3.i2" class="ltx_item" style="list-style-type:none;"><span class="ltx_tag ltx_tag_item">•</span> 
<span id="A6.I3.i2.p1" class="ltx_para">
<span id="A6.I3.i2.p1.1" class="ltx_p"><span id="A6.I3.i2.p1.1.1" class="ltx_text ltx_font_sansserif" style="font-size:80%;--ltx-fg-color:#000000;">Post Your Answer button at the bottom-left of the longer form</span></span>
</span></span>
<span id="A6.I3.i3" class="ltx_item" style="list-style-type:none;"><span class="ltx_tag ltx_tag_item">•</span> 
<span id="A6.I3.i3.p1" class="ltx_para">
<span id="A6.I3.i3.p1.1" class="ltx_p"><span id="A6.I3.i3.p1.1.1" class="ltx_text ltx_font_sansserif" style="font-size:80%;--ltx-fg-color:#000000;">Add Comment button to the right of a small field</span></span>
</span></span>
<span id="A6.I3.i4" class="ltx_item" style="list-style-type:none;"><span class="ltx_tag ltx_tag_item">•</span> 
<span id="A6.I3.i4.p1" class="ltx_para">
<span id="A6.I3.i4.p1.1" class="ltx_p"><span id="A6.I3.i4.p1.1.1" class="ltx_text ltx_font_sansserif" style="font-size:80%;--ltx-fg-color:#000000;">Large Windows &amp; Forms get the button on the bottom left.</span></span>
</span></span>
</span>
<span id="A6.SS3.p6.pic1.1.1" class="ltx_p"><span id="A6.SS3.p6.pic1.1.1.1" class="ltx_text ltx_font_sansserif" style="font-size:80%;--ltx-fg-color:#000000;">Furthermore, with mobile-first responsive being the new law of the land, the button placement varies even more based on context and user expectation. Sometimes, it’s in the middle, too! We’re now starting to just put buttons on the left for even small forms if they’re inline … and more forms are showing up inline through javascript.</span></span>
</span></span></span></foreignobject></g></g></svg>