<br class="ltx_break"><span id="A3.SSx7.p1.pic1.2.7.1.1" class="ltx_text ltx_font_typewriter ltx_font_medium">{REFERENCE TRANSLATION}<span id="A3.SSx7.p1.pic1.2.7.1.1.1" class="ltx_text ltx_font_serif">
