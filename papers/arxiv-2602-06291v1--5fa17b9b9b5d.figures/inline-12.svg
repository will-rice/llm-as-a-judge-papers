<svg id="A5.p6.pic1" class="ltx_picture" height="424.23" overflow="visible" version="1.1" viewbox="0 0 477.38 424.23" width="477.38"><g style="--ltx-stroke-color:#000000;--ltx-fill-color:#000000;" fill="#000000" stroke="#000000" stroke-width="0.4pt" transform="translate(0,424.23) matrix(1 0 0 -1 0 0)"><g style="--ltx-fill-color:#CCCCFF;" fill="#CCCCFF" fill-opacity="1.0"><path style="stroke:none" d="M 0 0 L 0 424.23 L 477.38 424.23 L 477.38 0 Z" /></g><g style="--ltx-fill-color:#F2F2FF;" fill="#F2F2FF" fill-opacity="1.0"><path style="stroke:none" d="M 0.83 0.83 L 0.83 400.86 L 476.55 400.86 L 476.55 0.83 Z" /></g><g fill-opacity="1.0" transform="matrix(1.0 0.0 0.0 1.0 9.49 409.09)"><foreignobject style="--ltx-fo-width:28.81em;--ltx-fo-height:0.75em;--ltx-fo-depth:0.25em;font-size:10pt;" height="13.84" overflow="visible" transform="matrix(1 0 0 -1 0 10.38)" width="398.65"><span class="ltx_foreignobject_container"><span class="ltx_foreignobject_content">
<span id="A5.p6.pic1.1" class="ltx_inline-block ltx_minipage ltx_align_bottom" style="width:28.81em;">
<span id="A5.p6.pic1.1.1" class="ltx_p"><span id="A5.p6.pic1.1.1.1" class="ltx_text ltx_font_bold" style="--ltx-fg-color:#000000;">(3) Problem Generation: RealMath(2)</span></span>
</span></span></span></foreignobject></g><g fill-opacity="1.0" transform="matrix(1.0 0.0 0.0 1.0 9.49 12.16)"><foreignobject style="--ltx-fo-width:31.55em;--ltx-fo-height:27.52em;--ltx-fo-depth:0.25em;font-size:10pt;" height="384.29" overflow="visible" transform="matrix(1 0 0 -1 0 380.83)" width="436.56"><span class="ltx_foreignobject_container"><span class="ltx_foreignobject_content">
<span id="A5.p6.pic1.2" class="ltx_inline-block ltx_minipage ltx_align_bottom" style="width:31.55em;">
<span id="A5.p6.pic1.2.1" class="ltx_p"><span id="A5.p6.pic1.2.1.1" class="ltx_text" style="--ltx-fg-color:#000000;">You will be given a math problem. I want to train a student by practicing the sub-skills needed to solve it.</span></span>
<span id="A5.p6.pic1.2.2" class="ltx_p"><span id="A5.p6.pic1.2.2.1" class="ltx_text" style="--ltx-fg-color:#000000;">Create 5 standalone practice problems (each should be meaningful on its own) such that mastering them makes the original problem straightforward.</span></span>
<span id="A5.p6.pic1.2.3" class="ltx_p"><span id="A5.p6.pic1.2.3.1" class="ltx_text ltx_font_bold" style="--ltx-fg-color:#000000;">Constraints:<span id="A5.p6.pic1.2.3.1.1" class="ltx_text"></span></span></span>
<span id="A5.I9" class="ltx_itemize ltx_leftmargin_flush">
<span id="A5.I9.i1" class="ltx_item" style="list-style-type:none;"><span class="ltx_tag ltx_tag_item">•</span> 
<span id="A5.I9.i1.p1" class="ltx_para">
<span id="A5.I9.i1.p1.1" class="ltx_p"><span id="A5.I9.i1.p1.1.1" class="ltx_text" style="--ltx-fg-color:#000000;">Do </span><span id="A5.I9.i1.p1.1.2" class="ltx_text ltx_font_bold" style="--ltx-fg-color:#000000;">NOT</span><span id="A5.I9.i1.p1.1.3" class="ltx_text" style="--ltx-fg-color:#000000;"> produce trivial “split the original into parts” questions or simple plug-in/replace-numbers variants.</span></span>
</span></span>
<span id="A5.I9.i2" class="ltx_item" style="list-style-type:none;"><span class="ltx_tag ltx_tag_item">•</span> 
<span id="A5.I9.i2.p1" class="ltx_para">
<span id="A5.I9.i2.p1.1" class="ltx_p"><span id="A5.I9.i2.p1.1.1" class="ltx_text" style="--ltx-fg-color:#000000;">Each problem must target a specific sub-skill needed for the original.</span></span>
</span></span>
<span id="A5.I9.i3" class="ltx_item" style="list-style-type:none;"><span class="ltx_tag ltx_tag_item">•</span> 
<span id="A5.I9.i3.p1" class="ltx_para">
<span id="A5.I9.i3.p1.1" class="ltx_p"><span id="A5.I9.i3.p1.1.1" class="ltx_text" style="--ltx-fg-color:#000000;">Across the 5 problems, cover all key sub-skills without heavy overlap.</span></span>
</span></span>
<span id="A5.I9.i4" class="ltx_item" style="list-style-type:none;"><span class="ltx_tag ltx_tag_item">•</span> 
<span id="A5.I9.i4.p1" class="ltx_para">
<span id="A5.I9.i4.p1.1" class="ltx_p"><span id="A5.I9.i4.p1.1.1" class="ltx_text" style="--ltx-fg-color:#000000;">Keep the difficulty as hard as possible.</span></span>
</span></span>
<span id="A5.I9.i5" class="ltx_item" style="list-style-type:none;"><span class="ltx_tag ltx_tag_item">•</span> 
<span id="A5.I9.i5.p1" class="ltx_para">
<span id="A5.I9.i5.p1.1" class="ltx_p"><span id="A5.I9.i5.p1.1.1" class="ltx_text" style="--ltx-fg-color:#000000;">Each question should have an </span><span id="A5.I9.i5.p1.1.2" class="ltx_text ltx_font_bold" style="--ltx-fg-color:#000000;">INTEGER</span><span id="A5.I9.i5.p1.1.3" class="ltx_text" style="--ltx-fg-color:#000000;"> answer bigger than 1000.</span></span>
</span></span>
</span>
<span id="A5.p6.pic1.2.4" class="ltx_p"><span id="A5.p6.pic1.2.4.1" class="ltx_text" style="--ltx-fg-color:#000000;">Return in the following format.</span></span><pre id="A5.p6.pic1.2.5" class="ltx_verbatim ltx_font_typewriter" style="--ltx-fg-color:#000000;">
&lt;description&gt;
{description of the five problems}
&lt;/description&gt;

&lt;questions&gt;
[&quot;...&quot;,&quot;...&quot;] {a Python list of the questions}
&lt;/questions&gt;
</pre>
</span></span></span></foreignobject></g></g></svg>