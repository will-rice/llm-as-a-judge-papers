<svg id="A6.F7.p1.pic1" class="ltx_picture" height="948.03" overflow="visible" version="1.1" viewbox="0 0 458.28 948.03" width="458.28"><g style="--ltx-stroke-color:#000000;--ltx-fill-color:#000000;" fill="#000000" stroke="#000000" stroke-width="0.4pt" transform="translate(0,948.03) matrix(1 0 0 -1 0 0)"><g style="--ltx-fill-color:#BFBFBF;" fill="#BFBFBF" fill-opacity="1.0"><path style="stroke:none" d="M 0 4.63 L 0 943.4 C 0 945.95 2.07 948.03 4.63 948.03 L 453.66 948.03 C 456.21 948.03 458.28 945.95 458.28 943.4 L 458.28 4.63 C 458.28 2.07 456.21 0 453.66 0 L 4.63 0 C 2.07 0 0 2.07 0 4.63 Z" /></g><g style="--ltx-fill-color:#FAFAFA;" fill="#FAFAFA" fill-opacity="1.0"><path style="stroke:none" d="M 0.69 4.63 L 0.69 926.47 L 457.59 926.47 L 457.59 4.63 C 457.59 2.45 455.83 0.69 453.66 0.69 L 4.63 0.69 C 2.45 0.69 0.69 2.45 0.69 4.63 Z" /></g><g style="--ltx-fill-color:#BFBFBF;" fill="#BFBFBF" fill-opacity="1.0"><path style="stroke:none" d="M 0.69 927.16 L 0.69 943.4 C 0.69 945.57 2.45 947.34 4.63 947.34 L 453.66 947.34 C 455.83 947.34 457.59 945.57 457.59 943.4 L 457.59 927.16 Z" /></g><g fill-opacity="1.0" transform="matrix(1.0 0.0 0.0 1.0 10.53 933.79)"><foreignobject style="--ltx-fo-width:27.48em;--ltx-fo-height:0.69em;--ltx-fo-depth:0.19em;font-size:10pt;" height="12.3" overflow="visible" transform="matrix(1 0 0 -1 0 9.61)" width="380.25"><span class="ltx_foreignobject_container"><span class="ltx_foreignobject_content">
<span id="A6.F7.p1.pic1.1" class="ltx_inline-block ltx_minipage ltx_align_bottom" style="width:27.48em;">
<span id="A6.F7.p1.pic1.1.1" class="ltx_p"><span id="A6.F7.p1.pic1.1.1.1" class="ltx_text ltx_font_bold" style="--ltx-fg-color:#FFFFFF;">Judge Prompt Template</span></span>
</span></span></span></foreignobject></g><g fill-opacity="1.0" transform="matrix(1.0 0.0 0.0 1.0 10.53 10.53)"><foreignobject style="--ltx-fo-width:30.1em;--ltx-fo-height:65.48em;--ltx-fo-depth:0em;font-size:10pt;" height="906.1" overflow="visible" transform="matrix(1 0 0 -1 0 906.1)" width="416.5"><span class="ltx_foreignobject_container"><span class="ltx_foreignobject_content">
<span id="A6.F7.p1.pic1.2" class="ltx_inline-block ltx_minipage ltx_align_bottom" style="width:30.1em;">
<span id="A6.F7.p1.pic1.2.1" class="ltx_p"><span id="A6.F7.p1.pic1.2.1.1" class="ltx_text ltx_font_typewriter ltx_font_bold" style="--ltx-fg-color:#000000;">System<span id="A6.F7.p1.pic1.2.1.1.1" class="ltx_text ltx_font_medium">
</span></span></span>
<span id="A6.F7.p1.pic1.2.2" class="ltx_p"><span id="A6.F7.p1.pic1.2.2.1" class="ltx_text ltx_font_typewriter" style="--ltx-fg-color:#000000;">You are an expert evaluator comparing two candidate responses
(A and B) to the final user turn of a conversation. Judge them
under this evaluation policy:
</span></span>
<span id="A6.F7.p1.pic1.2.3" class="ltx_p"><span id="A6.F7.p1.pic1.2.3.1" class="ltx_text ltx_font_typewriter" style="--ltx-fg-color:#000000;">{rubric}
</span></span>
<span id="A6.F7.p1.pic1.2.4" class="ltx_p"><span id="A6.F7.p1.pic1.2.4.1" class="ltx_text ltx_font_typewriter" style="--ltx-fg-color:#000000;">Write your judgment as a decision certificate in EXACTLY this format:
</span></span><pre id="A6.F7.p1.pic1.2.5" class="ltx_verbatim ltx_font_typewriter" style="--ltx-fg-color:#000000;">&lt;comparison&gt;
&lt;criterion name=&quot;CRITERION_NAME&quot;&gt;
&lt;obs side=&quot;A&quot;&gt;
A concrete, verifiable observation about Response A,
quoting or precisely describing its content.
&lt;/obs&gt;
&lt;obs side=&quot;B&quot;&gt;
Same for Response B.
&lt;/obs&gt;
&lt;result winner=&quot;WINNER&quot;&gt;
Why these observations decide this criterion. WINNER must be
&quot;A&quot;, &quot;B&quot;, or &quot;tie&quot;.
&lt;/result&gt;
&lt;/criterion&gt;
&lt;/comparison&gt;

&lt;decision&gt;
One short paragraph combining the criterion results according
to the policy importances.
&lt;/decision&gt;

&lt;answer&gt;[[FINAL_CHOICE]]&lt;/answer&gt;
</pre>
<span id="A6.F7.p1.pic1.2.6" class="ltx_p"><span id="A6.F7.p1.pic1.2.6.1" class="ltx_text ltx_font_typewriter ltx_font_bold" style="--ltx-fg-color:#000000;">Rules:<span id="A6.F7.p1.pic1.2.6.1.1" class="ltx_text ltx_font_medium">
</span></span></span>
<span id="A6.F7.p1.pic1.2.7" class="ltx_p"><span id="A6.F7.p1.pic1.2.7.1" class="ltx_text ltx_font_typewriter" style="--ltx-fg-color:#000000;">1) Use only criterion names from the policy. Include every criterion
that meaningfully differentiates the responses; you may mark a criterion
&quot;tie&quot; or omit it when it does not differentiate.
</span></span>
<span id="A6.F7.p1.pic1.2.8" class="ltx_p"><span id="A6.F7.p1.pic1.2.8.1" class="ltx_text ltx_font_typewriter" style="--ltx-fg-color:#000000;">2) Each &lt;obs&gt; must state something checkable against the
actual response (what it contains, lacks, or gets wrong). Quote short
spans verbatim when possible. Never invent content that is not in the
responses.
</span></span>
<span id="A6.F7.p1.pic1.2.9" class="ltx_p"><span id="A6.F7.p1.pic1.2.9.1" class="ltx_text ltx_font_typewriter" style="--ltx-fg-color:#000000;">3) It is fine---and encouraged---to note genuine strengths of the
response you ultimately reject.
</span></span>
<span id="A6.F7.p1.pic1.2.10" class="ltx_p"><span id="A6.F7.p1.pic1.2.10.1" class="ltx_text ltx_font_typewriter" style="--ltx-fg-color:#000000;">4) Replace WINNER and FINAL_CHOICE rather than
copying them literally. Each WINNER must be exactly
A, B, or tie. The final
&lt;answer&gt; tag must contain exactly [[A]] or
[[B]] (no tie).
</span></span>
<span id="A6.F7.p1.pic1.2.11" class="ltx_p"><span id="A6.F7.p1.pic1.2.11.1" class="ltx_text ltx_font_typewriter ltx_font_bold" style="--ltx-fg-color:#000000;">User<span id="A6.F7.p1.pic1.2.11.1.1" class="ltx_text ltx_font_medium">
</span></span></span><pre id="A6.F7.p1.pic1.2.12" class="ltx_verbatim ltx_font_typewriter" style="--ltx-fg-color:#000000;">## Conversation
{conversation}

## Response A
{response_A}

## Response B
{response_B}

Compare Response A and Response B under the evaluation policy
and output your decision certificate now.
</pre>
</span></span></span></foreignobject></g></g></svg>