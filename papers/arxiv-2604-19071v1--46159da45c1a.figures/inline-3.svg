<span id="A4.p1.pic1.2.1" class="ltx_p"><span id="A4.p1.pic1.2.1.1" class="ltx_text ltx_font_bold" style="--ltx-fg-color:#000000;">Input<span id="A4.p1.pic1.2.1.1.1" class="ltx_text ltx_font_medium">: text</span></span></span>
</span></span></span></foreignobject></g><g fill-opacity="1.0" transform="matrix(1.0 0.0 0.0 1.0 21.65 17.24)"><foreignobject style="--ltx-fo-width:44.07em;--ltx-fo-height:69.07em;--ltx-fo-depth:0.25em;font-size:10pt;" height="959.22" overflow="visible" transform="matrix(1 0 0 -1 0 955.76)" width="609.8"><span class="ltx_foreignobject_container"><span class="ltx_foreignobject_content">
<span id="A4.p1.pic1.3" class="ltx_inline-block ltx_minipage ltx_align_bottom" style="width:44.07em;">
<span id="A4.p1.pic1.3.1" class="ltx_p"><span id="A4.p1.pic1.3.1.1" class="ltx_text" style="--ltx-fg-color:#000000;">Please classify the provided text. Based on the framework below, categorize the text into one of the following genres:</span></span>
<span id="A4.I1" class="ltx_itemize">
<span id="A4.I1.i1" class="ltx_item" style="list-style-type:none;"><span class="ltx_tag ltx_tag_item">•</span> 
<span id="A4.I1.i1.p1" class="ltx_para">
<span id="A4.I1.i1.p1.1" class="ltx_p"><span id="A4.I1.i1.p1.1.1" class="ltx_text ltx_font_bold" style="--ltx-fg-color:#000000;">Creative - Fiction</span><span id="A4.I1.i1.p1.1.2" class="ltx_text" style="--ltx-fg-color:#000000;">: Fiction focuses on imaginative narratives, emphasizing character development, plot structure, and environmental depiction. It reflects social realities or human emotions, with a focus on details and conflicts driving the story forward.</span></span>
</span></span>
<span id="A4.I1.i2" class="ltx_item" style="list-style-type:none;"><span class="ltx_tag ltx_tag_item">•</span> 
<span id="A4.I1.i2.p1" class="ltx_para">
<span id="A4.I1.i2.p1.1" class="ltx_p"><span id="A4.I1.i2.p1.1.1" class="ltx_text ltx_font_bold" style="--ltx-fg-color:#000000;">Creative - Poetry</span><span id="A4.I1.i2.p1.1.2" class="ltx_text" style="--ltx-fg-color:#000000;">: Poetry is characterized by line breaks, condensed language, and symbolic imagery. It places an emphasis on rhythm and sound, as well as the intense concentration of emotion and thought.</span></span>
</span></span>
<span id="A4.I1.i3" class="ltx_item" style="list-style-type:none;"><span class="ltx_tag ltx_tag_item">•</span> 
<span id="A4.I1.i3.p1" class="ltx_para">
<span id="A4.I1.i3.p1.1" class="ltx_p"><span id="A4.I1.i3.p1.1.1" class="ltx_text ltx_font_bold" style="--ltx-fg-color:#000000;">Creative - Prose</span><span id="A4.I1.i3.p1.1.2" class="ltx_text" style="--ltx-fg-color:#000000;">: Prose encompasses descriptive and imaginative writing without the constraints of poetic structure. It often explores themes and ideas in clear, expressive language, engaging the reader in a reflective or emotional experience.</span></span>
</span></span>
<span id="A4.I1.i4" class="ltx_item" style="list-style-type:none;"><span class="ltx_tag ltx_tag_item">•</span> 
<span id="A4.I1.i4.p1" class="ltx_para">
<span id="A4.I1.i4.p1.1" class="ltx_p"><span id="A4.I1.i4.p1.1.1" class="ltx_text ltx_font_bold" style="--ltx-fg-color:#000000;">Creative - Essay</span><span id="A4.I1.i4.p1.1.2" class="ltx_text" style="--ltx-fg-color:#000000;">: A creative essay blends personal reflection and artistic style. It is often subjective, descriptive, and exploratory, focusing on an idea, experience, or insight in a unique and engaging way.</span></span>
</span></span>
<span id="A4.I1.i5" class="ltx_item" style="list-style-type:none;"><span class="ltx_tag ltx_tag_item">•</span> 
<span id="A4.I1.i5.p1" class="ltx_para">
<span id="A4.I1.i5.p1.1" class="ltx_p"><span id="A4.I1.i5.p1.1.1" class="ltx_text ltx_font_bold" style="--ltx-fg-color:#000000;">Creative - Argumentative</span><span id="A4.I1.i5.p1.1.2" class="ltx_text" style="--ltx-fg-color:#000000;">: This writing builds a compelling case centered around a perspective or opinion, supported by logical reasoning or persuasive rhetoric. It seeks to convince the audience using passionate and effective arguments.</span></span>
</span></span>
<span id="A4.I1.i6" class="ltx_item" style="list-style-type:none;"><span class="ltx_tag ltx_tag_item">•</span> 
<span id="A4.I1.i6.p1" class="ltx_para">
<span id="A4.I1.i6.p1.1" class="ltx_p"><span id="A4.I1.i6.p1.1.1" class="ltx_text ltx_font_bold" style="--ltx-fg-color:#000000;">Functional - Report</span><span id="A4.I1.i6.p1.1.2" class="ltx_text" style="--ltx-fg-color:#000000;">: A report is an objective, structured, and formal document that presents data, findings, and analysis of specific topics or activities, often following a standardized format.</span></span>
</span></span>
<span id="A4.I1.i7" class="ltx_item" style="list-style-type:none;"><span class="ltx_tag ltx_tag_item">•</span> 
<span id="A4.I1.i7.p1" class="ltx_para">
<span id="A4.I1.i7.p1.1" class="ltx_p"><span id="A4.I1.i7.p1.1.1" class="ltx_text ltx_font_bold" style="--ltx-fg-color:#000000;">Functional - Summary</span><span id="A4.I1.i7.p1.1.2" class="ltx_text" style="--ltx-fg-color:#000000;">: Summarizing involves condensing large pieces of information into brief and concise overviews, focusing only on the key points, events, or ideas introduced in the original text.</span></span>
</span></span>
<span id="A4.I1.i8" class="ltx_item" style="list-style-type:none;"><span class="ltx_tag ltx_tag_item">•</span> 
<span id="A4.I1.i8.p1" class="ltx_para">
<span id="A4.I1.i8.p1.1" class="ltx_p"><span id="A4.I1.i8.p1.1.1" class="ltx_text ltx_font_bold" style="--ltx-fg-color:#000000;">Functional - Letter</span><span id="A4.I1.i8.p1.1.2" class="ltx_text" style="--ltx-fg-color:#000000;">: A formal or informal written communication addressed to another person or entity, often following a clear structure that includes salutations, body content, and closing remarks.</span></span>
</span></span>
<span id="A4.I1.i9" class="ltx_item" style="list-style-type:none;"><span class="ltx_tag ltx_tag_item">•</span> 
<span id="A4.I1.i9.p1" class="ltx_para">
<span id="A4.I1.i9.p1.1" class="ltx_p"><span id="A4.I1.i9.p1.1.1" class="ltx_text ltx_font_bold" style="--ltx-fg-color:#000000;">Functional - Application</span><span id="A4.I1.i9.p1.1.2" class="ltx_text" style="--ltx-fg-color:#000000;">: Applications are formal documents written in a specific format, expressing a request—often for employment, educational admissions, or permissions. They are brief and structured.</span></span>
</span></span>
<span id="A4.I1.i10" class="ltx_item" style="list-style-type:none;"><span class="ltx_tag ltx_tag_item">•</span> 
<span id="A4.I1.i10.p1" class="ltx_para">
<span id="A4.I1.i10.p1.1" class="ltx_p"><span id="A4.I1.i10.p1.1.1" class="ltx_text ltx_font_bold" style="--ltx-fg-color:#000000;">Functional - Speech</span><span id="A4.I1.i10.p1.1.2" class="ltx_text" style="--ltx-fg-color:#000000;">: A speech is a prepared piece of writing meant to be spoken aloud and tailored for an audience. It is often persuasive or inspiring, structured to guide the listener through ideas or arguments.</span></span>
</span></span>
<span id="A4.I1.i11" class="ltx_item" style="list-style-type:none;"><span class="ltx_tag ltx_tag_item">•</span> 
<span id="A4.I1.i11.p1" class="ltx_para">
<span id="A4.I1.i11.p1.1" class="ltx_p"><span id="A4.I1.i11.p1.1.1" class="ltx_text ltx_font_bold" style="--ltx-fg-color:#000000;">Functional - Delivery</span><span id="A4.I1.i11.p1.1.2" class="ltx_text" style="--ltx-fg-color:#000000;">: Delivery writing encompasses real-time or impromptu remarks, such as announcements or ceremonial addresses, meant for immediate and direct communication during specific events or contexts.</span></span>
</span></span>
<span id="A4.I1.i12" class="ltx_item" style="list-style-type:none;"><span class="ltx_tag ltx_tag_item">•</span> 
<span id="A4.I1.i12.p1" class="ltx_para">
<span id="A4.I1.i12.p1.1" class="ltx_p"><span id="A4.I1.i12.p1.1.1" class="ltx_text ltx_font_bold" style="--ltx-fg-color:#000000;">Functional - Plan</span><span id="A4.I1.i12.p1.1.2" class="ltx_text" style="--ltx-fg-color:#000000;">: A plan outlines structured steps, timelines, or objectives to achieve a specific goal or outcome. It is practical and formatted to organize resources and tasks effectively.</span></span>
</span></span>
<span id="A4.I1.i13" class="ltx_item" style="list-style-type:none;"><span class="ltx_tag ltx_tag_item">•</span> 
<span id="A4.I1.i13.p1" class="ltx_para">
<span id="A4.I1.i13.p1.1" class="ltx_p"><span id="A4.I1.i13.p1.1.1" class="ltx_text ltx_font_bold" style="--ltx-fg-color:#000000;">Functional - Contract</span><span id="A4.I1.i13.p1.1.2" class="ltx_text" style="--ltx-fg-color:#000000;">: A contract is a formal, legal document outlining agreements between parties. It specifies terms, responsibilities, and obligations, often using precise and enforceable language.</span></span>
</span></span>
<span id="A4.I1.i14" class="ltx_item" style="list-style-type:none;"><span class="ltx_tag ltx_tag_item">•</span> 
<span id="A4.I1.i14.p1" class="ltx_para">
<span id="A4.I1.i14.p1.1" class="ltx_p"><span id="A4.I1.i14.p1.1.1" class="ltx_text ltx_font_bold" style="--ltx-fg-color:#000000;">Functional - Official</span><span id="A4.I1.i14.p1.1.2" class="ltx_text" style="--ltx-fg-color:#000000;">: Official writing refers to documents meant for administrative, governmental, or institutional purposes. It is often rigid in format and addresses formal matters or processes.</span></span>
</span></span>
</span>
<span id="A4.p1.pic1.3.2" class="ltx_p"><span id="A4.p1.pic1.3.2.1" class="ltx_text" style="--ltx-fg-color:#000000;">The following is the text to be classified:</span></span>
<span id="A4.p1.pic1.3.3" class="ltx_p"><span id="A4.p1.pic1.3.3.1" class="ltx_text" style="--ltx-fg-color:#000000;">{text}</span></span>
<span id="A4.p1.pic1.3.4" class="ltx_p"><span id="A4.p1.pic1.3.4.1" class="ltx_text" style="--ltx-fg-color:#000000;">Present your judgment in double-bracket enclosed form, such as [[Creative - Fiction]].</span></span>
</span></span></span></foreignobject></g></g></svg>