<br class="ltx_break">n = int(n)
<br class="ltx_break">m = int(m)
<br class="ltx_break">
<br class="ltx_break">i = m - n
<br class="ltx_break">
<br class="ltx_break">if i &lt; 0:
<br class="ltx_break">   print(0)
<br class="ltx_break">else:
<br class="ltx_break">   count = 1
<br class="ltx_break">   while i &gt; 0:
<br class="ltx_break">    i -= n-1
<br class="ltx_break">    count += 1
<br class="ltx_break">   print(count)
