<span id="A4.pic10.1" class="ltx_inline-block ltx_minipage ltx_align_bottom" style="width:46.2em;">
<span id="A4.pic10.1.1" class="ltx_p"><span id="A4.pic10.1.1.1" class="ltx_text" style="--ltx-fg-color:#FFFFFF;">Prompt D.10: Action Personalization Win Rate Prompt (<a href="#S2.SS2" title="2.2 Proposing Actions to Take ‣ 2 MySQA: Personalized Deep Research ‣ Language Models Don’t Know What You Want:Evaluating Personalization in Deep Research Needs Real Users" class="ltx_ref"><span class="ltx_text ltx_ref_tag">section</span> <span class="ltx_text ltx_ref_tag">2.2</span></a>)</span></span>
</span></span></span></foreignobject></g><g fill-opacity="1.0" transform="matrix(1.0 0.0 0.0 1.0 6.92 10.38)"><foreignobject style="--ltx-fo-width:46.2em;--ltx-fo-height:12.69em;--ltx-fo-depth:0.25em;font-size:10pt;" height="179.11" overflow="visible" transform="matrix(1 0 0 -1 0 175.66)" width="639.28"><span class="ltx_foreignobject_container"><span class="ltx_foreignobject_content">
<span id="A4.pic10.2" class="ltx_inline-block ltx_minipage ltx_align_bottom" style="width:46.2em;">
<span id="A4.pic10.2.1" class="ltx_p"><span id="A4.pic10.2.1.1" class="ltx_text" style="--ltx-fg-color:#000000;">As a Plan Validator, your task is to determine which of two plans for how to tailor a response best matches a user’s profile.
The user profile will be a series of inferences about a user derived from their research papers, organized under various categories.
The two plans will be labled as &quot;Plan A&quot; or &quot;Plan B&quot; and describe a list of suggestions an external question answering model could execute to generate a more personalized response.
Your output should denote whether plan &quot;A&quot; or &quot;B&quot; is better aligned with suggestions that the user described in the profile would prefer.
<br class="ltx_break"></span></span>
<span id="A4.pic10.2.2" class="ltx_p"><span id="A4.pic10.2.2.1" class="ltx_text" style="--ltx-fg-color:#000000;">Here is the profile:
&lt;profile&gt;
<math id="A4.pic10.m1" class="ltx_Math" alttext="\mathcal{P}" display="inline" intent=":literal"><semantics><mi style="--ltx-fg-color:#000000;" class="ltx_font_mathcaligraphic" mathcolor="#000000">𝒫</mi><annotation encoding="application/x-tex">\mathcal{P}</annotation></semantics></math>
&lt;/profile&gt;
<br class="ltx_break"></span></span>
<span id="A4.pic10.2.3" class="ltx_p"><span id="A4.pic10.2.3.1" class="ltx_text" style="--ltx-fg-color:#000000;">Here is Plan A:
&lt;plan A&gt;
<math id="A4.pic10.m2" class="ltx_Math" alttext="p_{\text{person}}" display="inline" intent=":literal"><semantics><msub><mi style="--ltx-fg-color:#000000;" mathcolor="#000000">p</mi><mtext style="--ltx-fg-color:#000000;" mathcolor="#000000">person</mtext></msub><annotation encoding="application/x-tex">p_{\text{person}}</annotation></semantics></math>
&lt;/plan A&gt;
<br class="ltx_break"></span></span>
<span id="A4.pic10.2.4" class="ltx_p"><span id="A4.pic10.2.4.1" class="ltx_text" style="--ltx-fg-color:#000000;">Here is Plan B:
&lt;plan B&gt;
<math id="A4.pic10.m3" class="ltx_Math" alttext="p_{\text{gen}}" display="inline" intent=":literal"><semantics><msub><mi style="--ltx-fg-color:#000000;" mathcolor="#000000">p</mi><mtext style="--ltx-fg-color:#000000;" mathcolor="#000000">gen</mtext></msub><annotation encoding="application/x-tex">p_{\text{gen}}</annotation></semantics></math>
&lt;/plan B&gt;
<br class="ltx_break"></span></span>
<span id="A4.pic10.2.5" class="ltx_p"><span id="A4.pic10.2.5.1" class="ltx_text" style="--ltx-fg-color:#000000;">&lt;format&gt;
Output your response as a json with only a single key &quot;output&quot; and a value of one among - (&quot;A&quot;, &quot;B&quot;).
&lt;/format&gt;</span></span>
</span></span></span></foreignobject></g></g></svg>