</span></span></span></foreignobject></g><g fill-opacity="1.0" transform="matrix(1.0 0.0 0.0 1.0 21.65 13.78)"><foreignobject style="--ltx-fo-width:31.37em;--ltx-fo-height:26.69em;--ltx-fo-depth:0em;font-size:10pt;" height="369.3" overflow="visible" transform="matrix(1 0 0 -1 0 369.3)" width="434.07"><span class="ltx_foreignobject_container"><span class="ltx_foreignobject_content">
<span id="S4.SS2.p9.pic1.2" class="ltx_inline-block ltx_minipage ltx_align_bottom" style="width:31.37em;">
<span id="S4.SS2.p9.pic1.2.1" class="ltx_p"><span id="S4.SS2.p9.pic1.2.1.1" class="ltx_text ltx_font_bold" style="--ltx-fg-color:#000000;">Text Chunk as Context:<span id="S4.SS2.p9.pic1.2.1.1.1" class="ltx_text"></span></span></span>
<span id="S4.SS2.p9.pic1.2.2" class="ltx_quote">
<span id="S4.SS2.p9.pic1.2.2.1" class="ltx_p"><span id="S4.SS2.p9.pic1.2.2.1.1" class="ltx_text" style="font-size:90%;--ltx-fg-color:#000000;">Chapter 7 </span>
<br class="ltx_break"><span id="S4.SS2.p9.pic1.2.2.1.2" class="ltx_text" style="font-size:90%;--ltx-fg-color:#000000;">7-6 TC 3-21.76 26 April 2017 </span>
<br class="ltx_break"><span id="S4.SS2.p9.pic1.2.2.1.3" class="ltx_text" style="font-size:90%;--ltx-fg-color:#000000;">7-29. R&amp;S teams move using a technique such as the cloverleaf method to move to successive OPs. (See figure 7-1.) In this method, R&amp;S teams avoid paralleling the objective site, maintain extreme stealth, do not cross the LOA, and maximize the use of available cover and concealment. </span>
<br class="ltx_break"><span id="S4.SS2.p9.pic1.2.2.1.4" class="ltx_text" style="font-size:90%;--ltx-fg-color:#000000;">7-30. During the conduct of the reconnaissance, each R&amp;S team returns to the RP when any of the following occurs: </span>
<br class="ltx_break"><span id="S4.SS2.p9.pic1.2.2.1.5" class="ltx_text" style="font-size:90%;--ltx-fg-color:#000000;"> – All their PIR is gathered. </span>
<br class="ltx_break"><span id="S4.SS2.p9.pic1.2.2.1.6" class="ltx_text" style="font-size:90%;--ltx-fg-color:#000000;"> – The LOA is reached. </span>
<br class="ltx_break"><span id="S4.SS2.p9.pic1.2.2.1.7" class="ltx_text" style="font-size:90%;--ltx-fg-color:#000000;"> – The allocated time to conduct the reconnaissance has elapsed. </span>
<br class="ltx_break"><span id="S4.SS2.p9.pic1.2.2.1.8" class="ltx_text" style="font-size:90%;--ltx-fg-color:#000000;"> – Enemy contact is made. </span>
<br class="ltx_break" style="--ltx-break-space:2.0pt;"><span id="S4.SS2.p9.pic1.2.2.1.9" class="ltx_text" style="font-size:90%;--ltx-fg-color:#000000;">
</span><span id="S4.SS2.p9.pic1.2.2.1.10" class="ltx_text ltx_font_italic" style="font-size:90%;--ltx-fg-color:#000000;">LEGEND:</span><span id="S4.SS2.p9.pic1.2.2.1.11" class="ltx_text" style="font-size:90%;--ltx-fg-color:#000000;"> ORP – objective rally point; RP – release point; S&amp;O – surveillance and observation.</span></span>
</span>
<span id="S4.SS2.p9.pic1.2.3" class="ltx_p"><span id="S4.SS2.p9.pic1.2.3.1" class="ltx_text ltx_font_bold" style="--ltx-fg-color:#000000;">Question:<span id="S4.SS2.p9.pic1.2.3.1.1" class="ltx_text ltx_font_medium"> What action must an R&amp;S team take if they make enemy contact during reconnaissance?</span></span></span>
<span id="S4.SS2.p9.pic1.2.4" class="ltx_p"><span id="S4.SS2.p9.pic1.2.4.1" class="ltx_text ltx_font_bold" style="--ltx-fg-color:#000000;">Answer:<span id="S4.SS2.p9.pic1.2.4.1.1" class="ltx_text ltx_font_medium"> If an R&amp;S team makes enemy contact during reconnaissance, they must return to the RP.</span></span></span>
</span></span></span></foreignobject></g></g></svg>