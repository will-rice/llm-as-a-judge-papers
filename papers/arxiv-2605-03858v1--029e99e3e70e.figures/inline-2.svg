<br class="ltx_break"><span id="A4.F4.pic1.1.5.1.1" class="ltx_text ltx_font_medium">A label-preserving perturbation is infeasible here because the floor-plan layout is highly constrained. Meaningful changes would risk altering the wall structure, room layout, or room labels.</span></span></span>
