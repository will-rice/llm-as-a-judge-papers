<svg id="A1.SS5.SSS1.p1.pic1" class="ltx_picture" height="509.54" overflow="visible" version="1.1" viewbox="0 0 550 509.54" width="550"><g style="--ltx-stroke-color:#000000;--ltx-fill-color:#000000;" fill="#000000" stroke="#000000" stroke-width="0.4pt" transform="translate(0,509.54) matrix(1 0 0 -1 0 0)"><g style="--ltx-fill-color:#000073;" fill="#000073" fill-opacity="1.0"><path style="stroke:none" d="M 0 3.6 L 0 505.95 C 0 507.93 1.61 509.54 3.6 509.54 L 546.4 509.54 C 548.39 509.54 550 507.93 550 505.95 L 550 3.6 C 550 1.61 548.39 0 546.4 0 L 3.6 0 C 1.61 0 0 1.61 0 3.6 Z" /></g><g style="--ltx-fill-color:#EDEDFF;" fill="#EDEDFF" fill-opacity="1.0"><path style="stroke:none" d="M 0.83 3.6 L 0.83 488.54 L 549.17 488.54 L 549.17 3.6 C 549.17 2.07 547.93 0.83 546.4 0.83 L 3.6 0.83 C 2.07 0.83 0.83 2.07 0.83 3.6 Z" /></g><g style="--ltx-fill-color:#000073;" fill="#000073" fill-opacity="1.0"><path style="stroke:none" d="M 0.83 488.54 L 0.83 505.95 C 0.83 507.48 2.07 508.71 3.6 508.71 L 546.4 508.71 C 547.93 508.71 549.17 507.48 549.17 505.95 L 549.17 488.54 Z" /></g><g fill-opacity="1.0" transform="matrix(1.0 0.0 0.0 1.0 15.84 495.17)"><foreignobject style="--ltx-fo-width:32.57em;--ltx-fo-height:0.69em;--ltx-fo-depth:0.19em;font-size:10pt;" height="12.3" overflow="visible" transform="matrix(1 0 0 -1 0 9.61)" width="450.68"><span class="ltx_foreignobject_container"><span class="ltx_foreignobject_content">
<span id="A1.SS5.SSS1.p1.pic1.1" class="ltx_inline-block ltx_minipage ltx_align_bottom" style="width:32.57em;">
<span id="A1.SS5.SSS1.p1.pic1.1.1" class="ltx_p"><span id="A1.SS5.SSS1.p1.pic1.1.1.1" class="ltx_text ltx_font_bold" style="--ltx-fg-color:#FFFFFF;">Generation Objection - Dynamic Policy Generation</span></span>
</span></span></span></foreignobject></g><g fill-opacity="1.0" transform="matrix(1.0 0.0 0.0 1.0 15.84 321.56)"><foreignobject style="--ltx-fo-width:37.46em;--ltx-fo-height:11.18em;--ltx-fo-depth:22.29em;font-size:10pt;" height="463.24" overflow="visible" transform="matrix(1 0 0 -1 0 154.75)" width="518.34"><span class="ltx_foreignobject_container"><span class="ltx_foreignobject_content">
<span id="A1.SS5.SSS1.p1.pic1.2" class="ltx_inline-block ltx_minipage ltx_align_bottom" style="width:37.46em;">
<span id="A1.SS5.SSS1.p1.pic1.2.1" class="ltx_p"><span id="A1.SS5.SSS1.p1.pic1.2.1.1" class="ltx_text" style="--ltx-fg-color:#000000;">The goal is to generate various descriptions for each label
title provided in Input Label. These labels are related to safety and compliance tagging of textual contents. These textual contents are either user inputs/queries to an AI agent, or an AI agent response
to user inputs/queries. The descriptions that are generated define a set of rules that will ultimately be used by another agent to decide whether a user input or AI agent response violates or complies with
them. Therefore, these generated descriptions must CAREFULLY take into account Moderation Type.” The objective further requires:</span></span>
<span id="A1.I1" class="ltx_itemize">
<span id="A1.I1.i1" class="ltx_item" style="list-style-type:none;"><span class="ltx_tag ltx_tag_item">•</span> 
<span id="A1.I1.i1.p1" class="ltx_para ltx_noindent">
<span id="A1.I1.i1.p1.1" class="ltx_p"><span id="A1.I1.i1.p1.1.1" class="ltx_text" style="--ltx-fg-color:#000000;">descriptions are based solely on a set of scopes the generator first identifies in </span><span id="A1.I1.i1.p1.1.2" class="ltx_ERROR undefined">\rmode</span><span id="A1.I1.i1.p1.1.3" class="ltx_text" style="--ltx-fg-color:#000000;">¡scopes¿</span></span>
</span></span>
<span id="A1.I1.i2" class="ltx_item" style="list-style-type:none;"><span class="ltx_tag ltx_tag_item">•</span> 
<span id="A1.I1.i2.p1" class="ltx_para ltx_noindent">
<span id="A1.I1.i2.p1.1" class="ltx_p"><span id="A1.I1.i2.p1.1.1" class="ltx_text" style="--ltx-fg-color:#000000;">if </span><span id="A1.I1.i2.p1.1.2" class="ltx_ERROR undefined">\rmode</span><span id="A1.I1.i2.p1.1.3" class="ltx_text" style="--ltx-fg-color:#000000;">Moderation Type is </span><span id="A1.I1.i2.p1.1.4" class="ltx_ERROR undefined">\rmode</span><span id="A1.I1.i2.p1.1.5" class="ltx_text" style="--ltx-fg-color:#000000;">input, scopes/descriptions target user-side content, and if </span><span id="A1.I1.i2.p1.1.6" class="ltx_ERROR undefined">\rmode</span><span id="A1.I1.i2.p1.1.7" class="ltx_text" style="--ltx-fg-color:#000000;">output, agent-response content</span></span>
</span></span>
<span id="A1.I1.i3" class="ltx_item" style="list-style-type:none;"><span class="ltx_tag ltx_tag_item">•</span> 
<span id="A1.I1.i3.p1" class="ltx_para ltx_noindent">
<span id="A1.I1.i3.p1.1" class="ltx_p"><span id="A1.I1.i3.p1.1.1" class="ltx_text" style="--ltx-fg-color:#000000;">different descriptions for the same label must cover </span><em id="A1.I1.i3.p1.1.2" class="ltx_emph ltx_font_italic" style="--ltx-fg-color:#000000;">different subsets</em><span id="A1.I1.i3.p1.1.3" class="ltx_text" style="--ltx-fg-color:#000000;"> of the identified scopes</span></span>
</span></span>
<span id="A1.I1.i4" class="ltx_item" style="list-style-type:none;"><span class="ltx_tag ltx_tag_item">•</span> 
<span id="A1.I1.i4.p1" class="ltx_para ltx_noindent">
<span id="A1.I1.i4.p1.1" class="ltx_p"><span id="A1.I1.i4.p1.1.1" class="ltx_text" style="--ltx-fg-color:#000000;">diversity is achieved by varying the number of scopes used, description length, and semantic/stylistic phrasing</span></span>
</span></span>
<span id="A1.I1.i5" class="ltx_item" style="list-style-type:none;"><span class="ltx_tag ltx_tag_item">•</span> 
<span id="A1.I1.i5.p1" class="ltx_para ltx_noindent">
<span id="A1.I1.i5.p1.1" class="ltx_p"><span id="A1.I1.i5.p1.1.1" class="ltx_text" style="--ltx-fg-color:#000000;">tone must be imperative, treating each description as a guideline for a downstream guardian agent</span></span>
</span></span>
<span id="A1.I1.i6" class="ltx_item" style="list-style-type:none;"><span class="ltx_tag ltx_tag_item">•</span> 
<span id="A1.I1.i6.p1" class="ltx_para">
<span id="A1.I1.i6.p1.1" class="ltx_p"><span id="A1.I1.i6.p1.1.1" class="ltx_text" style="--ltx-fg-color:#000000;">descriptions should be concise.</span></span>
</span></span>
</span>
</span></span></span></foreignobject></g></g></svg>