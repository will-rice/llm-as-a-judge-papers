<span id="A4.pic4.2" class="ltx_inline-block ltx_minipage ltx_align_bottom" style="width:45.66em;">
<span id="A4.pic4.2.1" class="ltx_p"><span id="A4.pic4.2.1.1" class="ltx_text ltx_font_bold" style="--ltx-fg-color:#000000;">concept_generation<span id="A4.pic4.2.1.1.1" class="ltx_text ltx_font_medium"> 
<br class="ltx_break" style="--ltx-break-space:2.8pt;">
<span id="A4.pic4.2.1.1.1.1" class="ltx_text ltx_font_typewriter">&quot;system_prompt&quot;: &quot;You are an expert factual faithfulness evaluator. Your goal is to identify key faithfulness concepts for checking whether summaries are factually faithful to their source documents.&quot;</span> 
<br class="ltx_break" style="--ltx-break-space:2.8pt;">
<span id="A4.pic4.2.1.1.1.2" class="ltx_text ltx_font_typewriter">&quot;task_prompt&quot;: &quot;Generate 3–5 distinct faithfulness concepts that are essential for evaluating whether a summary is factually faithful to its source document.\n\nGuidelines:\n- Concepts should cover different aspects of factual faithfulness (e.g., factual accuracy, contradiction detection, unsupported claims, misrepresentation, distorted certainty).\n- Each concept should be general enough to apply across different topics and domains.\n- Concepts should target different failure modes where summaries might not be properly supported by source documents.\n- Keep concepts concise (2–5 words each).\n\nReturn exactly this format:\n\n&lt;concepts&gt;\n&lt;concept1&gt;[Concept name]&lt;/concept1&gt;\n&lt;concept2&gt;[Concept name]&lt;/concept2&gt;\n...\n&lt;/concepts&gt;&quot;</span></span></span></span>
</span></span></span></foreignobject></g></g></svg>