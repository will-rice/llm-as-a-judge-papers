<span id="A8.F5.pic1.1" class="ltx_inline-block ltx_minipage ltx_align_bottom" style="width:39.77em;">
<span id="A8.F5.pic1.1.1" class="ltx_p"><span id="A8.F5.pic1.1.1.1" class="ltx_text ltx_font_sansserif ltx_font_bold" style="--ltx-fg-color:#FFFFFF;">Case Study 3: Tool Use (Pointwise — Base score=2, Iteration 1/2 score=4, Human=5)</span></span>
</span></span></span></foreignobject></g><g fill-opacity="1.0" transform="matrix(1.0 0.0 0.0 1.0 10.16 641.46)"><foreignobject style="--ltx-fo-width:45.73em;--ltx-fo-height:23.86em;--ltx-fo-depth:0.25em;font-size:10pt;" height="333.59" overflow="visible" transform="matrix(1 0 0 -1 0 330.13)" width="632.77"><span class="ltx_foreignobject_container"><span class="ltx_foreignobject_content">
<span id="A8.F5.pic1.2" class="ltx_inline-block ltx_minipage ltx_align_bottom" style="width:45.73em;">
<span id="A8.F5.pic1.2.1" class="ltx_p"><span id="A8.F5.pic1.2.1.1" class="ltx_text ltx_font_bold" style="--ltx-fg-color:#000000;">Prompt:<span id="A8.F5.pic1.2.1.1.1" class="ltx_text ltx_font_medium"> In this instance you will be assigned to use the following tools. 1. </span>Flight Booking<span id="A8.F5.pic1.2.1.1.2" class="ltx_text ltx_font_medium">: […specify departure city, destination city, and travel dates…] 2. </span>Hotel Reservation<span id="A8.F5.pic1.2.1.1.3" class="ltx_text ltx_font_medium">: […] 3. </span>Activity Planner<span id="A8.F5.pic1.2.1.1.4" class="ltx_text ltx_font_medium">: […] Plan a trip from New York to Tokyo, including flight, hotel, and activities for 3 days.</span></span></span>
<span id="A8.F5.pic1.2.2" class="ltx_p"><span id="A8.F5.pic1.2.2.1" class="ltx_text ltx_font_italic" style="--ltx-fg-color:#000000;">Judge scores: Human=5, Base=2, Iteration 1=4, Iteration 2=4<span id="A8.F5.pic1.2.2.1.1" class="ltx_text"></span></span></span>
<span id="A8.F5.pic1.2.3" class="ltx_p"><span id="A8.F5.pic1.2.3.1" class="ltx_text ltx_font_bold" style="--ltx-fg-color:#000000;">Response<span id="A8.F5.pic1.2.3.1.1" class="ltx_text ltx_font_medium"> (truncated): “Hi, I’m happy to help you with your question about planning a trip from New York to Tokyo. […] 1. First, let’s use the Flight Booking tool: <span id="A8.F5.pic1.2.3.1.1.1" class="ltx_text ltx_font_typewriter">&lt;flight_booking&gt; Departure City: New York | Destination City: Tokyo | Departure Date: 2023-03-20 | Return Date: 2023-03-22 &lt;/flight_booking&gt;</span> […] 2. Next, let’s use the Hotel Reservation tool: <span id="A8.F5.pic1.2.3.1.1.2" class="ltx_text ltx_font_typewriter">&lt;hotel_reservation&gt; [...] &lt;/hotel_reservation&gt;</span> […] 3. Finally, let’s use the Activity Planner tool: <span id="A8.F5.pic1.2.3.1.1.3" class="ltx_text ltx_font_typewriter">&lt;activity_planner&gt; [...] Interests: Cultural Sites, Nature, Dining &lt;/activity_planner&gt;</span> […] By using these tools, you can easily plan your trip from New York to Tokyo. Have a great trip!”</span></span></span>
</span></span></span></foreignobject></g><g fill-opacity="1.0" transform="matrix(1.0 0.0 0.0 1.0 10.16 285.44)"><foreignobject style="--ltx-fo-width:45.73em;--ltx-fo-height:23.77em;--ltx-fo-depth:19.89em;font-size:10pt;" height="604.22" overflow="visible" transform="matrix(1 0 0 -1 0 328.94)" width="632.77"><span class="ltx_foreignobject_container"><span class="ltx_foreignobject_content">
<span id="A8.F5.pic1.3" class="ltx_inline-block ltx_minipage ltx_align_bottom" style="width:45.73em;">
<span id="A8.F5.pic1.3.1" class="ltx_p"><span id="A8.F5.pic1.3.1.1" class="ltx_text ltx_font_bold" style="--ltx-fg-color:#000000;">Base rubric<span id="A8.F5.pic1.3.1.1.1" class="ltx_text ltx_font_medium"> (Qwen3 14B, training-free)</span>:<span id="A8.F5.pic1.3.1.1.2" class="ltx_text"></span></span></span>
<span id="A8.I5" class="ltx_itemize">
<span id="A8.I5.i1" class="ltx_item" style="list-style-type:none;"><span class="ltx_tag ltx_tag_item">•</span> 
<span id="A8.I5.i1.p1" class="ltx_para">
<span id="A8.I5.i1.p1.1" class="ltx_p"><span id="A8.I5.i1.p1.1.1" class="ltx_text" style="--ltx-fg-color:#000000;">The response correctly uses the specified format for the Flight Booking tool with accurate departure and destination cities and travel dates.</span></span>
</span></span>
<span id="A8.I5.i2" class="ltx_item" style="list-style-type:none;"><span class="ltx_tag ltx_tag_item">•</span> 
<span id="A8.I5.i2.p1" class="ltx_para">
<span id="A8.I5.i2.p1.1" class="ltx_p"><span id="A8.I5.i2.p1.1.1" class="ltx_text" style="--ltx-fg-color:#000000;">The response correctly uses the specified format for the Hotel Reservation tool with accurate destination city, check-in and check-out dates, and appropriate preferences.</span></span>
</span></span>
<span id="A8.I5.i3" class="ltx_item" style="list-style-type:none;"><span class="ltx_tag ltx_tag_item">•</span> 
<span id="A8.I5.i3.p1" class="ltx_para">
<span id="A8.I5.i3.p1.1" class="ltx_p"><span id="A8.I5.i3.p1.1.1" class="ltx_text" style="--ltx-fg-color:#000000;">The response correctly uses the specified format for the Activity Planner tool with accurate destination city, travel dates, and relevant interests.</span></span>
</span></span>
<span id="A8.I5.i4" class="ltx_item" style="list-style-type:none;"><span class="ltx_tag ltx_tag_item">•</span> 
<span id="A8.I5.i4.p1" class="ltx_para">
<span id="A8.I5.i4.p1.1" class="ltx_p"><span id="A8.I5.i4.p1.1.1" class="ltx_text" style="--ltx-fg-color:#000000;">The response includes all three required tools (Flight Booking, Hotel Reservation, and Activity Planner) in the correct order and without missing any required parameters.</span></span>
</span></span>
<span id="A8.I5.i5" class="ltx_item" style="list-style-type:none;"><span class="ltx_tag ltx_tag_item">•</span> 
<span id="A8.I5.i5.p1" class="ltx_para">
<span id="A8.I5.i5.p1.1" class="ltx_p"><span id="A8.I5.i5.p1.1.1" class="ltx_text" style="--ltx-fg-color:#000000;">The response does not include any extra text or deviation from the required format, strictly adhering to the tool invocation syntax.</span></span>
</span></span>
</span>
<span id="A8.F5.pic1.3.2" class="ltx_p"><span id="A8.F5.pic1.3.2.1" class="ltx_text ltx_font_bold" style="--ltx-fg-color:#000000;">Iteration 2 rubric<span id="A8.F5.pic1.3.2.1.1" class="ltx_text ltx_font_medium"> (Qwen3 14B, fine-tuned)</span>:<span id="A8.F5.pic1.3.2.1.2" class="ltx_text"></span></span></span>
<span id="A8.I6" class="ltx_itemize">
<span id="A8.I6.i1" class="ltx_item" style="list-style-type:none;"><span class="ltx_tag ltx_tag_item">•</span> 
<span id="A8.I6.i1.p1" class="ltx_para">
<span id="A8.I6.i1.p1.1" class="ltx_p"><span id="A8.I6.i1.p1.1.1" class="ltx_text ltx_font_bold" style="--ltx-fg-color:#000000;">Correct Use of Tool Formats</span><span id="A8.I6.i1.p1.1.2" class="ltx_text" style="--ltx-fg-color:#000000;">: The response must accurately use the specified XML-like format for each tool (flight_booking, hotel_reservation, activity_planner) with all required parameters filled in correctly.</span></span>
</span></span>
<span id="A8.I6.i2" class="ltx_item" style="list-style-type:none;"><span class="ltx_tag ltx_tag_item">•</span> 
<span id="A8.I6.i2.p1" class="ltx_para">
<span id="A8.I6.i2.p1.1" class="ltx_p"><span id="A8.I6.i2.p1.1.1" class="ltx_text ltx_font_bold" style="--ltx-fg-color:#000000;">Completeness of Information</span><span id="A8.I6.i2.p1.1.2" class="ltx_text" style="--ltx-fg-color:#000000;">: The response must include all necessary details for each tool, such as departure and destination cities, dates, preferences, and interests, without missing any required fields.</span></span>
</span></span>
<span id="A8.I6.i3" class="ltx_item" style="list-style-type:none;"><span class="ltx_tag ltx_tag_item">•</span> 
<span id="A8.I6.i3.p1" class="ltx_para">
<span id="A8.I6.i3.p1.1" class="ltx_p"><span id="A8.I6.i3.p1.1.1" class="ltx_text ltx_font_bold" style="--ltx-fg-color:#000000;">Logical Trip Planning</span><span id="A8.I6.i3.p1.1.2" class="ltx_text" style="--ltx-fg-color:#000000;">: The response should demonstrate a coherent and realistic trip plan, with flights, hotels, and activities that align in terms of dates and destination.</span></span>
</span></span>
<span id="A8.I6.i4" class="ltx_item" style="list-style-type:none;"><span class="ltx_tag ltx_tag_item">•</span> 
<span id="A8.I6.i4.p1" class="ltx_para">
<span id="A8.I6.i4.p1.1" class="ltx_p"><span id="A8.I6.i4.p1.1.1" class="ltx_text ltx_font_bold" style="--ltx-fg-color:#000000;">Adherence to Instructions</span><span id="A8.I6.i4.p1.1.2" class="ltx_text" style="--ltx-fg-color:#000000;">: The response must strictly follow the given instructions, including not attempting to generate fake results but only the correct tool calls.</span></span>
</span></span>
<span id="A8.I6.i5" class="ltx_item" style="list-style-type:none;"><span class="ltx_tag ltx_tag_item">•</span> 
<span id="A8.I6.i5.p1" class="ltx_para">
<span id="A8.I6.i5.p1.1" class="ltx_p"><span id="A8.I6.i5.p1.1.1" class="ltx_text ltx_font_bold" style="--ltx-fg-color:#000000;">Clarity and Structure</span><span id="A8.I6.i5.p1.1.2" class="ltx_text" style="--ltx-fg-color:#000000;">: The response should be well-organized, with each tool call clearly separated and formatted as specified, ensuring readability and proper execution by the external tools.</span></span>
</span></span>
</span>
</span></span></span></foreignobject></g></g></svg>