<span id="A1.SS2.p4.pic1.p1.pic1.1.1" class="ltx_p">You have two variables, <span id="A1.SS2.p4.pic1.p1.pic1.1.1.1" class="ltx_text ltx_font_typewriter">x</span> and <span id="A1.SS2.p4.pic1.p1.pic1.1.1.2" class="ltx_text ltx_font_typewriter">y</span>, each containing a random integer value. Your task is to write a piece of code that will exchange the values of these two variables. This means that the value initially held by <span id="A1.SS2.p4.pic1.p1.pic1.1.1.3" class="ltx_text ltx_font_typewriter">x</span> should be in <span id="A1.SS2.p4.pic1.p1.pic1.1.1.4" class="ltx_text ltx_font_typewriter">y</span> and vice versa.</span>
