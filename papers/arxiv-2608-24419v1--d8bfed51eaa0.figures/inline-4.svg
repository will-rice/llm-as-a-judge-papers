<svg id="S4.SS4.p3.pic1" class="ltx_picture" height="153.09" overflow="visible" version="1.1" viewbox="0 0 650 153.09" width="650"><g style="--ltx-stroke-color:#000000;--ltx-fill-color:#000000;" fill="#000000" stroke="#000000" stroke-width="0.4pt" transform="translate(0,153.09) matrix(1 0 0 -1 0 0)"><g style="--ltx-fill-color:#D86E68;" fill="#D86E68" fill-opacity="1.0"><path style="stroke:none" d="M 0 5.53 L 0 147.55 C 0 150.61 2.48 153.09 5.53 153.09 L 644.47 153.09 C 647.52 153.09 650 150.61 650 147.55 L 650 5.53 C 650 2.48 647.52 0 644.47 0 L 5.53 0 C 2.48 0 0 2.48 0 5.53 Z" /></g><g style="--ltx-fill-color:#FCF3F3;" fill="#FCF3F3" fill-opacity="1.0"><path style="stroke:none" d="M 1.38 5.53 L 1.38 147.55 C 1.38 149.84 3.24 151.7 5.53 151.7 L 644.47 151.7 C 646.76 151.7 648.62 149.84 648.62 147.55 L 648.62 5.53 C 648.62 3.24 646.76 1.38 644.47 1.38 L 5.53 1.38 C 3.24 1.38 1.38 3.24 1.38 5.53 Z" /></g><g fill-opacity="1.0" transform="matrix(1.0 0.0 0.0 1.0 16.39 13.62)"><foreignobject style="--ltx-fo-width:44.61em;--ltx-fo-height:9.09em;--ltx-fo-depth:0em;font-size:10pt;" height="125.84" overflow="visible" transform="matrix(1 0 0 -1 0 125.84)" width="617.28"><span class="ltx_foreignobject_container"><span class="ltx_foreignobject_content"><span id="S4.SS4.p3.pic1.1" class="ltx_inline-logical-block ltx_minipage ltx_align_bottom" style="width:44.61em;">
<span id="S4.SS4.p3.pic1.p1" class="ltx_para ltx_noindent">
<span id="S4.SS4.p3.pic1.p1.1" class="ltx_p"><math id="S4.SS4.p3.pic1.p1.m1" class="ltx_Math" alttext="\mathrm{VP}" display="inline" intent=":literal"><semantics><mi style="--ltx-fg-color:#000000;" mathcolor="#000000">VP</mi><annotation encoding="application/x-tex">\mathrm{VP}</annotation></semantics></math><span id="S4.SS4.p3.pic1.p1.1.1" class="ltx_text ltx_font_bold" style="--ltx-fg-color:#000000;"> is undefined until the mode is fixed.</span><span id="S4.SS4.p3.pic1.p1.1.2" class="ltx_text" style="--ltx-fg-color:#000000;"> A per-item predictor can exploit
only an absolute signature (</span><em id="S4.SS4.p3.pic1.p1.1.3" class="ltx_emph ltx_font_italic" style="--ltx-fg-color:#000000;">responses over this length are preferred</em><span id="S4.SS4.p3.pic1.p1.1.4" class="ltx_text" style="--ltx-fg-color:#000000;">); a paired predictor
exploits a relative one (</span><em id="S4.SS4.p3.pic1.p1.1.5" class="ltx_emph ltx_font_italic" style="--ltx-fg-color:#000000;">whichever of these two is shorter is preferred</em><span id="S4.SS4.p3.pic1.p1.1.6" class="ltx_text" style="--ltx-fg-color:#000000;">). Where a set’s
surface confound is relative, the per-item estimate understates recoverability by an amount
nothing bounds in advance: </span><span id="S4.SS4.p3.pic1.p1.1.7" class="ltx_text ltx_font_smallcaps" style="--ltx-fg-color:#000000;">MT-Bench</span><span id="S4.SS4.p3.pic1.p1.1.8" class="ltx_text" style="--ltx-fg-color:#000000;"> gives </span><math id="S4.SS4.p3.pic1.p1.m2" class="ltx_Math" alttext="\mathrm{a}_{\mathrm{imp}}=0.30" display="inline" intent=":literal"><semantics><mrow><msub><mi style="--ltx-fg-color:#000000;" mathcolor="#000000">a</mi><mi style="--ltx-fg-color:#000000;" mathcolor="#000000">imp</mi></msub><mo style="--ltx-fg-color:#000000;" mathcolor="#000000">=</mo><mn style="--ltx-fg-color:#000000;" mathcolor="#000000">0.30</mn></mrow><annotation encoding="application/x-tex">\mathrm{a}_{\mathrm{imp}}=0.30</annotation></semantics></math><span id="S4.SS4.p3.pic1.p1.1.9" class="ltx_text" style="--ltx-fg-color:#000000;"> per item and
67.4% paired. The mode reported must be the mode the instrument is used in.</span></span>
</span></span></span></span></foreignobject></g></g></svg>