<span id="A8.F13.pic1.1.2" class="ltx_p"><span id="A8.F13.pic1.1.2.1" class="ltx_text" style="--ltx-fg-color:#000000;">We would like to evaluate the <span id="A8.F13.pic1.1.2.1.1" class="ltx_text" style="--ltx-fg-color:#BF0040;">[Parent Criteria]</span> of data-to-text, a natural language sentence generated according to a structured data expression.</span></span>
