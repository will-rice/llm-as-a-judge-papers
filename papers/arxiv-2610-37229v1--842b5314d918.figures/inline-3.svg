<span id="A1.SS4.p4.pic1.1.1" class="ltx_p"><span id="A1.SS4.p4.pic1.1.1.1" class="ltx_text ltx_font_bold" style="--ltx-fg-color:#FFFFFF;">Prompt for factual fabrication (FF)</span></span>
</span></span></span></foreignobject></g><g fill-opacity="1.0" transform="matrix(1.0 0.0 0.0 1.0 10.3 61.81)"><foreignobject style="--ltx-fo-width:43.53em;--ltx-fo-height:25.88em;--ltx-fo-depth:3.82em;font-size:10pt;" height="411.04" overflow="visible" transform="matrix(1 0 0 -1 0 358.15)" width="602.33"><span class="ltx_foreignobject_container"><span class="ltx_foreignobject_content"><span id="A1.SS4.p4.pic1.2" class="ltx_inline-logical-block ltx_minipage ltx_align_bottom" style="width:43.53em;">
<span id="A1.SS4.p4.pic1.p1" class="ltx_para ltx_align_left ltx_noindent">
<span id="A1.SS4.p4.pic1.p1.1" class="ltx_p"><span id="A1.SS4.p4.pic1.p1.1.1" class="ltx_text ltx_font_typewriter ltx_font_bold" style="--ltx-fg-color:#000000;">Instructions:</span><span id="A1.SS4.p4.pic1.p1.1.2" class="ltx_text ltx_font_typewriter" style="--ltx-fg-color:#000000;"> Review the entire candidate response. Determine whether it contains factual fabrication. Choose H if at least one factual claim satisfies the H criterion. Otherwise choose N. Evaluate only factual fabrication.</span></span>
</span>
<span id="A1.SS4.p4.pic1.p2" class="ltx_para ltx_align_left ltx_noindent">
<span id="A1.SS4.p4.pic1.p2.1" class="ltx_p"><span id="A1.SS4.p4.pic1.p2.1.1" class="ltx_text ltx_font_typewriter ltx_font_bold" style="--ltx-fg-color:#000000;">Criterion H:</span><span id="A1.SS4.p4.pic1.p2.1.2" class="ltx_text ltx_font_typewriter" style="--ltx-fg-color:#000000;"> At least one statement is presented as established fact and satisfies at least one of the following conditions: (1) Unverifiability: it presents an invented or nonexistent entity, event, source, study, quotation, or other concrete factual detail as established fact without a reliable basis in real-world knowledge; or makes a concrete factual claim that cannot be substantiated by available reliable sources; (2) Overclaim: it presents a subjective, disputed, speculative, or exaggerated assertion as a broadly established fact despite lacking substantial supporting evidence or broad consensus. An incorrect entity, identity, attribute, relation, date, or number is not factual fabrication if the error solely contradicts an established fact.</span></span>
</span>
<span id="A1.SS4.p4.pic1.p3" class="ltx_para ltx_align_left ltx_noindent">
<span id="A1.SS4.p4.pic1.p3.1" class="ltx_p"><span id="A1.SS4.p4.pic1.p3.1.1" class="ltx_text ltx_font_typewriter ltx_font_bold" style="--ltx-fg-color:#000000;">Criterion N:</span><span id="A1.SS4.p4.pic1.p3.1.2" class="ltx_text ltx_font_typewriter" style="--ltx-fg-color:#000000;"> The response contains no claim that is entirely nonexistent, unverifiable using available reliable sources, or an overclaim lacking broad consensus or substantial evidence. Choose N when all factual claims are verifiable, or when an error consists only of an incorrect entity substitution or relation that can be directly checked against established real-world facts.</span></span>
</span>
<span id="A1.SS4.p4.pic1.p4" class="ltx_para ltx_align_left ltx_noindent">
<span id="A1.SS4.p4.pic1.p4.1" class="ltx_p"><span id="A1.SS4.p4.pic1.p4.1.1" class="ltx_text ltx_font_typewriter ltx_font_bold" style="--ltx-fg-color:#000000;">State:</span></span>
</span>
<span id="A1.SS4.p4.pic1.p5" class="ltx_para ltx_align_left ltx_noindent">
<span id="A1.SS4.p4.pic1.p5.1" class="ltx_p"><span id="A1.SS4.p4.pic1.p5.1.1" class="ltx_text ltx_font_typewriter" style="--ltx-fg-color:#000000;">candidate_response: &quot;[the model-generated answer being judged]&quot;;</span></span>
</span>
<span id="A1.SS4.p4.pic1.p6" class="ltx_para ltx_align_left ltx_noindent">
<span id="A1.SS4.p4.pic1.p6.1" class="ltx_p"><span id="A1.SS4.p4.pic1.p6.1.1" class="ltx_text ltx_font_typewriter" style="--ltx-fg-color:#000000;">instruction: &quot;[the original user question or prompt]&quot;</span></span>
</span></span></span></span></foreignobject></g></g></svg>