</span>
<span id="A4.SS4.p2.pic1.1.2" class="ltx_p"><span id="A4.SS4.p2.pic1.1.2.1" class="ltx_text ltx_font_bold" style="--ltx-fg-color:#000000;">Textgrad Evaluation Instruction (Feedback Instruction)</span></span>
</span></span></span></foreignobject></g><g fill-opacity="1.0" transform="matrix(1.0 0.0 0.0 1.0 10.16 12.85)"><foreignobject style="--ltx-fo-width:38.28em;--ltx-fo-height:28.35em;--ltx-fo-depth:0.19em;font-size:10pt;" height="394.97" overflow="visible" transform="matrix(1 0 0 -1 0 392.28)" width="529.69"><span class="ltx_foreignobject_container"><span class="ltx_foreignobject_content">
<span id="A4.SS4.p2.pic1.2" class="ltx_inline-block ltx_minipage ltx_align_bottom" style="width:38.28em;">
<span id="A4.SS4.p2.pic1.2.1" class="ltx_p"><span id="A4.SS4.p2.pic1.2.1.1" class="ltx_text" style="--ltx-fg-color:#000000;">You are optimizing a FULL judge prompt template for pairwise A/B comparisons.</span></span>
<span id="A4.SS4.p2.pic1.2.2" class="ltx_p"><span id="A4.SS4.p2.pic1.2.2.1" class="ltx_text" style="--ltx-fg-color:#000000;">You will receive three inputs:</span></span>
<span id="A4.SS4.p2.pic1.2.3" class="ltx_p"><span id="A4.SS4.p2.pic1.2.3.1" class="ltx_text" style="--ltx-fg-color:#000000;">1) case_block: a minibatch of cases. Each case includes INSTRUCTION, RESPONSE A, RESPONSE B, and JUDGE_RAW_OUTPUT.</span></span>
<span id="A4.SS4.p2.pic1.2.4" class="ltx_p"><span id="A4.SS4.p2.pic1.2.4.1" class="ltx_text" style="--ltx-fg-color:#000000;">2) ground_truth: one label per line (A or B) matching the case order.</span></span>
<span id="A4.SS4.p2.pic1.2.5" class="ltx_p"><span id="A4.SS4.p2.pic1.2.5.1" class="ltx_text" style="--ltx-fg-color:#000000;">3) current_prompt: the current FULL judge prompt template (with placeholders) that produced these outputs.</span></span>
<span id="A4.SS4.p2.pic1.2.6" class="ltx_p"><span id="A4.SS4.p2.pic1.2.6.1" class="ltx_text" style="--ltx-fg-color:#000000;">Goal:</span></span>
<span id="A4.SS4.p2.pic1.2.7" class="ltx_p"><span id="A4.SS4.p2.pic1.2.7.1" class="ltx_text" style="--ltx-fg-color:#000000;">Produce feedback that improves current_prompt so the judge chooses the ground_truth label more often, while preserving what already works well.</span></span>
<span id="A4.SS4.p2.pic1.2.8" class="ltx_p"><span id="A4.SS4.p2.pic1.2.8.1" class="ltx_text" style="--ltx-fg-color:#000000;">What to do:</span></span>
<span id="A4.SS4.p2.pic1.2.9" class="ltx_p"><span id="A4.SS4.p2.pic1.2.9.1" class="ltx_text" style="--ltx-fg-color:#000000;">- For each case, compare the judge’s output with the corresponding ground_truth line.</span></span>
<span id="A4.SS4.p2.pic1.2.10" class="ltx_p"><span id="A4.SS4.p2.pic1.2.10.1" class="ltx_text" style="--ltx-fg-color:#000000;">- Identify recurring failure patterns across the minibatch.</span></span>
<span id="A4.SS4.p2.pic1.2.11" class="ltx_p"><span id="A4.SS4.p2.pic1.2.11.1" class="ltx_text" style="--ltx-fg-color:#000000;">- ALSO identify prompt behaviors/rules that seem to contribute to correct decisions.</span></span>
<span id="A4.SS4.p2.pic1.2.12" class="ltx_p"><span id="A4.SS4.p2.pic1.2.12.1" class="ltx_text" style="--ltx-fg-color:#000000;">- Propose prompt-level changes that are general (not overfitting) and actionable.</span></span>
<span id="A4.SS4.p2.pic1.2.13" class="ltx_p"><span id="A4.SS4.p2.pic1.2.13.1" class="ltx_text" style="--ltx-fg-color:#000000;">Output format (STRICT):</span></span>
<span id="A4.SS4.p2.pic1.2.14" class="ltx_p"><span id="A4.SS4.p2.pic1.2.14.1" class="ltx_text" style="--ltx-fg-color:#000000;">Return 1-4 bullet points. Each bullet must be an a ‘KEEP/REINFORCE’ or ‘FIX/IMPROVE’ suggestion for current_prompt.</span></span>
<span id="A4.SS4.p2.pic1.2.15" class="ltx_p"><span id="A4.SS4.p2.pic1.2.15.1" class="ltx_text" style="--ltx-fg-color:#000000;">Requirements for the bullets:</span></span>
<span id="A4.SS4.p2.pic1.2.16" class="ltx_p"><span id="A4.SS4.p2.pic1.2.16.1" class="ltx_text" style="--ltx-fg-color:#000000;">- Do NOT rewrite the full prompt. Do NOT include long quotes from cases.</span></span>
<span id="A4.SS4.p2.pic1.2.17" class="ltx_p"><span id="A4.SS4.p2.pic1.2.17.1" class="ltx_text" style="--ltx-fg-color:#000000;">Length: less than 150 words total.</span></span>
</span></span></span></foreignobject></g></g></svg>