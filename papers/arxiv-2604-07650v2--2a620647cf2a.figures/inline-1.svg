<span id="A2.SS3.p2.pic1.2" class="ltx_inline-block ltx_minipage ltx_align_bottom" style="width:36.62em;">
<span id="A2.SS3.p2.pic1.2.1" class="ltx_p"><span id="A2.SS3.p2.pic1.2.1.1" class="ltx_text ltx_font_bold" style="--ltx-fg-color:#000000;">Evaluation Criterion<span id="A2.SS3.p2.pic1.2.1.1.1" class="ltx_text"></span></span></span>
<span id="A2.SS3.p2.pic1.2.2" class="ltx_p"><span id="A2.SS3.p2.pic1.2.2.1" class="ltx_text" style="--ltx-fg-color:#000000;">You are a fair, consistent, and rigorous evaluator of multiple LLM responses.
Your task is to evaluate the answers provided by different models to the same multiple-choice question.</span></span>
<span id="A2.SS3.p2.pic1.2.3" class="ltx_p"><span id="A2.SS3.p2.pic1.2.3.1" class="ltx_text" style="--ltx-fg-color:#000000;">For each model, you must assess:</span></span>
<span id="A2.I1" class="ltx_itemize">
<span id="A2.I1.i1" class="ltx_item" style="list-style-type:none;"><span class="ltx_tag ltx_tag_item">•</span> 
<span id="A2.I1.i1.p1" class="ltx_para ltx_noindent">
<span id="A2.I1.i1.p1.1" class="ltx_p"><span id="A2.I1.i1.p1.1.1" class="ltx_text ltx_font_bold" style="--ltx-fg-color:#000000;">Correctness</span><span id="A2.I1.i1.p1.1.2" class="ltx_text" style="--ltx-fg-color:#000000;"> (</span><span id="A2.I1.i1.p1.1.3" class="ltx_text" style="--ltx-fg-color:#0000FF;">0</span><span id="A2.I1.i1.p1.1.4" class="ltx_text" style="--ltx-fg-color:#000000;"> or </span><span id="A2.I1.i1.p1.1.5" class="ltx_text" style="--ltx-fg-color:#0000FF;">1</span><span id="A2.I1.i1.p1.1.6" class="ltx_text" style="--ltx-fg-color:#000000;">) of the </span><span id="A2.I1.i1.p1.1.7" class="ltx_text" style="--ltx-fg-color:#0000FF;">Selected Option</span></span>
</span></span>
<span id="A2.I1.i2" class="ltx_item" style="list-style-type:none;"><span class="ltx_tag ltx_tag_item">•</span> 
<span id="A2.I1.i2.p1" class="ltx_para">
<span id="A2.I1.i2.p1.1" class="ltx_p"><span id="A2.I1.i2.p1.1.1" class="ltx_text ltx_font_bold" style="--ltx-fg-color:#000000;">Reasoning Quality</span><span id="A2.I1.i2.p1.1.2" class="ltx_text" style="--ltx-fg-color:#000000;"> (</span><span id="A2.I1.i2.p1.1.3" class="ltx_text" style="--ltx-fg-color:#0000FF;">0–5</span><span id="A2.I1.i2.p1.1.4" class="ltx_text" style="--ltx-fg-color:#000000;">) of the </span><span id="A2.I1.i2.p1.1.5" class="ltx_text" style="--ltx-fg-color:#0000FF;">Reasoning Process</span></span>
</span></span>
</span>
<span id="A2.SS3.p2.pic1.2.4" class="ltx_p"><span id="A2.SS3.p2.pic1.2.4.1" class="ltx_text" style="--ltx-fg-color:#000000;">Follow the provided rubrics strictly. Your evaluation must be objective, consistent, and comparable across models.
<br class="ltx_break" style="--ltx-break-space:6.0pt;">
<span id="A2.SS3.p2.pic1.2.4.1.1" class="ltx_text ltx_font_bold">Input</span></span></span>
<span id="A2.SS3.p2.pic1.2.5" class="ltx_p"><span id="A2.SS3.p2.pic1.2.5.1" class="ltx_text" style="--ltx-fg-color:#000000;">Question: <span id="A2.SS3.p2.pic1.2.5.1.1" class="ltx_text" style="--ltx-fg-color:#0000FF;">{QA.<span id="A2.SS3.p2.pic1.2.5.1.1.1" class="ltx_text ltx_font_italic">&lt;key&gt;</span>.question}</span>
Options: <span id="A2.SS3.p2.pic1.2.5.1.2" class="ltx_text" style="--ltx-fg-color:#0000FF;">{QA.<span id="A2.SS3.p2.pic1.2.5.1.2.1" class="ltx_text ltx_font_italic">&lt;key&gt;</span>.options}
<br class="ltx_break" style="--ltx-break-space:6.0pt;"></span>
Model1 selects: <span id="A2.SS3.p2.pic1.2.5.1.3" class="ltx_text" style="--ltx-fg-color:#0000FF;">{QA.<span id="A2.SS3.p2.pic1.2.5.1.3.1" class="ltx_text ltx_font_italic">&lt;key&gt;</span>.answers.LLM1.selected_option}
<br class="ltx_break"></span>Model1 reasoning: <span id="A2.SS3.p2.pic1.2.5.1.4" class="ltx_text" style="--ltx-fg-color:#0000FF;">{QA.<span id="A2.SS3.p2.pic1.2.5.1.4.1" class="ltx_text ltx_font_italic">&lt;key&gt;</span>.answers.LLM1.reasoning}
<br class="ltx_break" style="--ltx-break-space:6.0pt;"></span>
Model2 selects: <span id="A2.SS3.p2.pic1.2.5.1.5" class="ltx_text" style="--ltx-fg-color:#0000FF;">{QA.<span id="A2.SS3.p2.pic1.2.5.1.5.1" class="ltx_text ltx_font_italic">&lt;key&gt;</span>.answers.LLM2.selected_option}
<br class="ltx_break"></span>Model2 reasoning: <span id="A2.SS3.p2.pic1.2.5.1.6" class="ltx_text" style="--ltx-fg-color:#0000FF;">{QA.<span id="A2.SS3.p2.pic1.2.5.1.6.1" class="ltx_text ltx_font_italic">&lt;key&gt;</span>.answers.LLM2.reasoning}
<br class="ltx_break" style="--ltx-break-space:6.0pt;"></span>
… (extend for all models)
<br class="ltx_break" style="--ltx-break-space:6.0pt;">
<span id="A2.SS3.p2.pic1.2.5.1.7" class="ltx_text ltx_font_bold">Evaluation Rubrics</span></span></span>
<span id="A2.SS3.p2.pic1.2.6" class="ltx_p"><span id="A2.SS3.p2.pic1.2.6.1" class="ltx_text" style="--ltx-fg-color:#000000;">Correctness rubric: <span id="A2.SS3.p2.pic1.2.6.1.1" class="ltx_text" style="--ltx-fg-color:#0000FF;">{Cross Evaluation Rubric: Correctness}
<br class="ltx_break"></span>Reasoning Quality rubric: <span id="A2.SS3.p2.pic1.2.6.1.2" class="ltx_text" style="--ltx-fg-color:#0000FF;">{Cross Evaluation Rubric: Reasoning Quality}
<br class="ltx_break" style="--ltx-break-space:6.0pt;"></span>
<span id="A2.SS3.p2.pic1.2.6.1.3" class="ltx_text ltx_font_bold">Output Format (STRICT)</span></span></span>
<span id="A2.SS3.p2.pic1.2.7" class="ltx_p"><span id="A2.SS3.p2.pic1.2.7.1" class="ltx_text" style="--ltx-fg-color:#000000;">Return a valid <span id="A2.SS3.p2.pic1.2.7.1.1" class="ltx_text ltx_font_bold">JSON object</span> with the following structure:
<span id="A2.SS3.p2.pic1.2.7.1.2" class="ltx_text"></span></span></span><pre id="A2.SS3.p2.pic1.2.8" class="ltx_verbatim ltx_font_typewriter" style="--ltx-fg-color:#0000FF;">
{
  &quot;correct_answer&quot;: &quot;&lt;final correct option&gt;&quot;,
  &quot;evaluation_summary&quot;: &quot;&lt;comparison of model performance&gt;&quot;,
  &quot;evaluation&quot;: {
    &quot;model1&quot;: {
      &quot;correctness&quot;: &lt;0 or 1&gt;,
      &quot;reasoning_quality&quot;: &lt;0-5&gt;
    },
    &quot;model2&quot;: {
      &quot;correctness&quot;: &lt;0 or 1&gt;,
      &quot;reasoning_quality&quot;: &lt;0-5&gt;
    },
    ...
  }
}


</pre>
