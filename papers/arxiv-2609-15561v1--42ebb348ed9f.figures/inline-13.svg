</span></span></span></foreignobject></g><g fill-opacity="1.0" transform="matrix(1.0 0.0 0.0 1.0 13.35 1190.11)"><foreignobject style="--ltx-fo-width:45.05em;--ltx-fo-height:1.8em;--ltx-fo-depth:85.25em;font-size:10pt;" height="1204.45" overflow="visible" transform="matrix(1 0 0 -1 0 24.91)" width="623.37"><span class="ltx_foreignobject_container"><span class="ltx_foreignobject_content">
<span id="A4.pic3.2" class="ltx_inline-block ltx_minipage ltx_align_bottom" style="width:45.05em;">
<span id="A4.I3" class="ltx_itemize">
<span id="A4.I3.i1" class="ltx_item" style="list-style-type:none;"><span class="ltx_tag ltx_tag_item">•</span> 
<span id="A4.I3.i1.p1" class="ltx_para ltx_noindent">
<span id="A4.I3.i1.p1.1" class="ltx_p"><span id="A4.I3.i1.p1.1.1" class="ltx_text ltx_font_bold" style="--ltx-fg-color:#000000;">A0 (Reference)</span><span id="A4.I3.i1.p1.1.2" class="ltx_text" style="--ltx-fg-color:#000000;">: “Jeanie with the Light Brown Hair” is </span><span id="A4.I3.i1.p1.1.3" class="ltx_text" style="--ltx-fg-color:#008080;">a parlor song</span><span id="A4.I3.i1.p1.1.4" class="ltx_text" style="--ltx-fg-color:#000000;"> created by </span><span id="A4.I3.i1.p1.1.5" class="ltx_text" style="--ltx-fg-color:#008080;">Stephen Foster (1826–1864)</span><span id="A4.I3.i1.p1.1.6" class="ltx_text" style="--ltx-fg-color:#000000;">, published by </span><span id="A4.I3.i1.p1.1.7" class="ltx_text" style="--ltx-fg-color:#008080;">Firth</span><span id="A4.I3.i1.p1.1.8" class="ltx_text" style="--ltx-fg-color:#000000;">, </span><span id="A4.I3.i1.p1.1.9" class="ltx_text" style="--ltx-fg-color:#008080;">Pond &amp; Co.</span><span id="A4.I3.i1.p1.1.10" class="ltx_text" style="--ltx-fg-color:#000000;"> </span><span id="A4.I3.i1.p1.1.11" class="ltx_text" style="--ltx-fg-color:#008080;">in New York</span><span id="A4.I3.i1.p1.1.12" class="ltx_text" style="--ltx-fg-color:#000000;"> </span><span id="A4.I3.i1.p1.1.13" class="ltx_text" style="--ltx-fg-color:#008080;">in 1854</span><span id="A4.I3.i1.p1.1.14" class="ltx_text" style="--ltx-fg-color:#000000;">. Foster composed the song thinking of his </span><span id="A4.I3.i1.p1.1.15" class="ltx_text" style="--ltx-fg-color:#008080;">estranged wife</span><span id="A4.I3.i1.p1.1.16" class="ltx_text" style="--ltx-fg-color:#000000;">, </span><span id="A4.I3.i1.p1.1.17" class="ltx_text" style="--ltx-fg-color:#008080;">Jane McDowell</span><span id="A4.I3.i1.p1.1.18" class="ltx_text" style="--ltx-fg-color:#000000;">, and the lyrics hint at an enduring separation.</span></span>
</span></span>
<span id="A4.I3.i2" class="ltx_item" style="list-style-type:none;"><span class="ltx_tag ltx_tag_item">•</span> 
