<span id="S15.SS0.SSS0.Px18.p3.pic1.2.1" class="ltx_p"><span id="S15.SS0.SSS0.Px18.p3.pic1.2.1.1" class="ltx_text" style="--ltx-fg-color:#000000;">Note that since all characters of the selected segment of the string <math id="S15.SS0.SSS0.Px18.p3.pic1.m1" class="ltx_Math" alttext="s" display="inline" intent=":literal"><semantics><mi style="--ltx-fg-color:#000000;" mathcolor="#000000">s</mi><annotation encoding="application/x-tex">s</annotation></semantics></math> are erased after applying the operation, the segments we choose cannot overlap. However, they can be nested if we first choose an inner segment and then an outer one. 
<br class="ltx_break">
<br class="ltx_break">Since all numbers in the array are positive, it is always beneficial to take the largest possible segment in the answer, that is, from the first <span id="S15.SS0.SSS0.Px18.p3.pic1.2.1.1.1" class="ltx_text ltx_font_typewriter">‘L’</span> to the last <span id="S15.SS0.SSS0.Px18.p3.pic1.2.1.1.2" class="ltx_text ltx_font_typewriter">‘R’</span>. By choosing this segment, we can only select segments within it. We will continue to choose such segments within the last selected one as long as possible. To quickly find the sums of the segments, we will calculate the prefix sums of the array <math id="S15.SS0.SSS0.Px18.p3.pic1.m2" class="ltx_Math" alttext="a." display="inline" intent=":literal"><semantics><mrow><mi style="--ltx-fg-color:#000000;" mathcolor="#000000">a</mi><mo style="--ltx-fg-color:#000000;" lspace="0em" mathcolor="#000000">.</mo></mrow><annotation encoding="application/x-tex">a.</annotation></semantics></math></span></span>
