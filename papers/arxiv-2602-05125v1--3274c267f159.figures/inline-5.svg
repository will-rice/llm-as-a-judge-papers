<svg id="A6.SS3.p1.pic1" class="ltx_picture" height="512.56" overflow="visible" version="1.1" viewbox="0 0 653.15 512.56" width="653.15"><g style="--ltx-stroke-color:#000000;--ltx-fill-color:#000000;" fill="#000000" stroke="#000000" stroke-width="0.4pt" transform="translate(0,512.56) matrix(1 0 0 -1 0 0)"><g style="--ltx-fill-color:#000000;" fill="#000000" fill-opacity="1.0"><path style="stroke:none" d="M 0 8.57 L 0 504 C 0 508.73 3.84 512.56 8.57 512.56 L 644.58 512.56 C 649.31 512.56 653.15 508.73 653.15 504 L 653.15 8.57 C 653.15 3.84 649.31 0 644.58 0 L 8.57 0 C 3.84 0 0 3.84 0 8.57 Z" /></g><g style="--ltx-fill-color:#FFFFFF;" fill="#FFFFFF" fill-opacity="1.0"><path style="stroke:none" d="M 0.69 8.57 L 0.69 491.01 L 652.46 491.01 L 652.46 8.57 C 652.46 4.22 648.93 0.69 644.58 0.69 L 8.57 0.69 C 4.22 0.69 0.69 4.22 0.69 8.57 Z" /></g><g fill-opacity="1.0" transform="matrix(1.0 0.0 0.0 1.0 12.5 498.32)"><foreignobject style="--ltx-fo-width:45.4em;--ltx-fo-height:0.69em;--ltx-fo-depth:0.19em;font-size:10pt;" height="12.3" overflow="visible" transform="matrix(1 0 0 -1 0 9.61)" width="628.21"><span class="ltx_foreignobject_container"><span class="ltx_foreignobject_content">
<span id="A6.SS3.p1.pic1.1" class="ltx_inline-block ltx_minipage ltx_align_bottom" style="width:45.4em;">
<span id="A6.SS3.p1.pic1.1.1" class="ltx_p"><span id="A6.SS3.p1.pic1.1.1.1" class="ltx_text" style="--ltx-fg-color:#FFFFFF;">Judge prompt for rubric-based response evaluation.</span></span>
</span></span></span></foreignobject></g><g fill-opacity="1.0" transform="matrix(1.0 0.0 0.0 1.0 12.5 27.49)"><foreignobject style="--ltx-fo-width:45.4em;--ltx-fo-height:32.64em;--ltx-fo-depth:1.08em;font-size:10pt;" height="466.7" overflow="visible" transform="matrix(1 0 0 -1 0 451.71)" width="628.21"><span class="ltx_foreignobject_container"><span class="ltx_foreignobject_content">
<span id="A6.SS3.p1.pic1.2" class="ltx_inline-block ltx_minipage ltx_align_bottom" style="width:45.4em;">
<span id="A6.SS3.p1.pic1.2.1" class="ltx_p"><span id="A6.SS3.p1.pic1.2.1.1" class="ltx_text" style="--ltx-fg-color:#000000;">You are a judge, evaluating whether a response satisfies the given rubric. If the response satisfies the criterion of the rubric, output YES; otherwise output NO.</span></span>
<span id="A6.SS3.p1.pic1.2.2" class="ltx_p"><span id="A6.SS3.p1.pic1.2.2.1" class="ltx_text" style="--ltx-fg-color:#000000;">Requirement:</span></span>
<span id="A6.I26" class="ltx_itemize" style="--ltx-enum-leftmargin:1.2em;">
<span id="A6.I26.i1" class="ltx_item" style="list-style-type:none;"><span class="ltx_tag ltx_tag_item">•</span> 
<span id="A6.I26.i1.p1" class="ltx_para">
<span id="A6.I26.i1.p1.1" class="ltx_p"><span id="A6.I26.i1.p1.1.1" class="ltx_text" style="--ltx-fg-color:#000000;">You must follow the rubric strictly, and only consider the criteria listed in the rubric.</span></span>
</span></span>
<span id="A6.I26.i2" class="ltx_item" style="list-style-type:none;"><span class="ltx_tag ltx_tag_item">•</span> 
<span id="A6.I26.i2.p1" class="ltx_para">
<span id="A6.I26.i2.p1.1" class="ltx_p"><span id="A6.I26.i2.p1.1.1" class="ltx_text" style="--ltx-fg-color:#000000;">You must NOT consider any other factors, such as your own opinions or external knowledge.</span></span>
</span></span>
</span>
<span id="A6.SS3.p1.pic1.2.3" class="ltx_p"><span id="A6.SS3.p1.pic1.2.3.1" class="ltx_text" style="--ltx-fg-color:#000000;">Below between <span id="A6.SS3.p1.pic1.2.3.1.1" class="ltx_text ltx_font_typewriter">&lt;RESPONSE&gt;</span> and <span id="A6.SS3.p1.pic1.2.3.1.2" class="ltx_text ltx_font_typewriter">&lt;/RESPONSE&gt;</span> is the response to evaluate on</span></span>
<span id="A6.I27" class="ltx_itemize" style="--ltx-enum-leftmargin:1.2em;">
<span id="A6.I27.i1" class="ltx_item" style="list-style-type:none;"><span class="ltx_tag ltx_tag_item">•</span> 
<span id="A6.I27.i1.p1" class="ltx_para">
<span id="A6.I27.i1.p1.1" class="ltx_p"><span id="A6.I27.i1.p1.1.1" class="ltx_text ltx_font_typewriter" style="--ltx-fg-color:#000000;">&lt;RESPONSE&gt; {response} &lt;/RESPONSE&gt;</span></span>
</span></span>
</span>
<span id="A6.SS3.p1.pic1.2.4" class="ltx_p"><span id="A6.SS3.p1.pic1.2.4.1" class="ltx_text" style="--ltx-fg-color:#000000;">Below between <span id="A6.SS3.p1.pic1.2.4.1.1" class="ltx_text ltx_font_typewriter">&lt;RUBRIC&gt;</span> and <span id="A6.SS3.p1.pic1.2.4.1.2" class="ltx_text ltx_font_typewriter">&lt;/RUBRIC&gt;</span> is the rubric to evaluate on</span></span>
<span id="A6.I28" class="ltx_itemize" style="--ltx-enum-leftmargin:1.2em;">
<span id="A6.I28.i1" class="ltx_item" style="list-style-type:none;"><span class="ltx_tag ltx_tag_item">•</span> 
<span id="A6.I28.i1.p1" class="ltx_para">
<span id="A6.I28.i1.p1.1" class="ltx_p"><span id="A6.I28.i1.p1.1.1" class="ltx_text ltx_font_typewriter" style="--ltx-fg-color:#000000;">&lt;RUBRIC&gt; {rubric} &lt;/RUBRIC&gt;</span></span>
</span></span>
</span>
<span id="A6.SS3.p1.pic1.2.5" class="ltx_p"><span id="A6.SS3.p1.pic1.2.5.1" class="ltx_text" style="--ltx-fg-color:#000000;">Output STRICTLY in below format. No other text is allowed:</span></span>
<span id="A6.I29" class="ltx_itemize" style="--ltx-enum-leftmargin:1.2em;">
<span id="A6.I29.i1" class="ltx_item" style="list-style-type:none;"><span class="ltx_tag ltx_tag_item">•</span> 
<span id="A6.I29.i1.p1" class="ltx_para">
<span id="A6.I29.i1.p1.1" class="ltx_p"><span id="A6.I29.i1.p1.1.1" class="ltx_text ltx_font_typewriter" style="--ltx-fg-color:#000000;">&lt;EVALUATION&gt; YES/NO &lt;/EVALUATION&gt;</span></span>
</span></span>
</span>
</span></span></span></foreignobject></g></g></svg>