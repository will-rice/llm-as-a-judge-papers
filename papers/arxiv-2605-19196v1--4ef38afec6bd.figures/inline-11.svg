<span id="A4.SS1.SSS1.p15.pic1.1.1" class="ltx_p"><span id="A4.SS1.SSS1.p15.pic1.1.1.1" class="ltx_text ltx_font_bold" style="font-size:90%;--ltx-fg-color:#FFFFFF;">Model Response [Excerpts]</span></span>
</span></span></span></foreignobject></g><g fill-opacity="1.0" transform="matrix(1.0 0.0 0.0 1.0 10.16 8.78)"><foreignobject style="--ltx-fo-width:35.71em;--ltx-fo-height:16.28em;--ltx-fo-depth:0em;font-size:10pt;" height="225.2" overflow="visible" transform="matrix(1 0 0 -1 0 225.2)" width="494.13"><span class="ltx_foreignobject_container"><span class="ltx_foreignobject_content">
<span id="A4.SS1.SSS1.p15.pic1.2" class="ltx_inline-block ltx_minipage ltx_align_bottom" style="width:35.71em;">
<span id="A4.SS1.SSS1.p15.pic1.2.1" class="ltx_p"><span id="A4.SS1.SSS1.p15.pic1.2.1.1" class="ltx_text ltx_font_italic" style="font-size:90%;--ltx-fg-color:#000000;">[Excerpt — Introduction]<span id="A4.SS1.SSS1.p15.pic1.2.1.1.1" class="ltx_text"></span></span></span>
<span id="A4.SS1.SSS1.p15.pic1.2.2" class="ltx_p"><span id="A4.SS1.SSS1.p15.pic1.2.2.1" class="ltx_text" style="font-size:90%;--ltx-fg-color:#000000;">This analysis examines the trajectories of representative nations—West Germany
(Europe) and Japan (Asia)—emphasizing their starting points after WWII,
resource endowments, development strategies, and the influence of external and
internal factors.</span></span>
<span id="A4.SS1.SSS1.p15.pic1.2.3" class="ltx_p"><span id="A4.SS1.SSS1.p15.pic1.2.3.1" class="ltx_text ltx_font_italic" style="font-size:90%;--ltx-fg-color:#000000;">[Excerpt — Patterns from the Americas]<span id="A4.SS1.SSS1.p15.pic1.2.3.1.1" class="ltx_text"></span></span></span>
<span id="A4.SS1.SSS1.p15.pic1.2.4" class="ltx_p"><span id="A4.SS1.SSS1.p15.pic1.2.4.1" class="ltx_text" style="font-size:90%;--ltx-fg-color:#000000;">While this analysis has focused on Germany and Japan, it is notable that postwar
economic hegemons in the Americas, particularly the United States and Canada,
shared several but not all of these characteristics: The U.S. and Canada entered
the postwar period with intact infrastructure, booming demand, and a head start
as principal victors—and so their challenge was less about reconstruction and
more about managing growth, employment, and social inclusion.</span></span>
</span></span></span></foreignobject></g></g></svg>