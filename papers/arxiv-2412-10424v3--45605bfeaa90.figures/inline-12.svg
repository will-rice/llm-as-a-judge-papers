<span id="A4.SS2.SSS2.p2.pic1.2.1" class="ltx_p"><span id="A4.SS2.SSS2.p2.pic1.2.1.1" class="ltx_text ltx_font_bold" style="--ltx-fg-color:#000000;">Task:<span id="A4.SS2.SSS2.p2.pic1.2.1.1.1" class="ltx_text ltx_font_medium"> 
<br class="ltx_break">You are a question generator for assessing the model. Below are the list of the answer history of an Evaluatee model that keeps getting the question wrong, its error type, the corresponding problem, and the solution. Your role is to generate a proper follow-up question based on the model’s error type.</span></span></span>
<span id="A4.SS2.SSS2.p2.pic1.2.2" class="ltx_p"><span id="A4.SS2.SSS2.p2.pic1.2.2.1" class="ltx_text ltx_font_bold" style="--ltx-fg-color:#000000;">Instructions:<span id="A4.SS2.SSS2.p2.pic1.2.2.1.1" class="ltx_text ltx_font_medium">
1. Model’s Error Type is <span id="A4.SS2.SSS2.p2.pic1.2.2.1.1.1" class="ltx_text ltx_font_typewriter">{error<math id="A4.SS2.SSS2.p2.pic1.m1" class="ltx_Math" alttext="\_" display="inline" intent=":literal"><semantics><mi style="--ltx-fg-color:#000000;" mathcolor="#000000" mathvariant="normal">_</mi><annotation encoding="application/x-tex">\_</annotation></semantics></math>type}</span>. Do not disclose the error type to the model. 
<br class="ltx_break">2. Based on the error type, generate appropriate feedback as described below.</span></span></span>
<span id="A4.SS2.SSS2.p2.pic1.2.3" class="ltx_p"><span id="A4.SS2.SSS2.p2.pic1.2.3.1" class="ltx_text ltx_font_bold" style="--ltx-fg-color:#000000;">Possible Error Types:
<br class="ltx_break"><span id="A4.SS2.SSS2.p2.pic1.2.3.1.1" class="ltx_text ltx_font_medium">1. </span>Concept:<span id="A4.SS2.SSS2.p2.pic1.2.3.1.2" class="ltx_text ltx_font_medium"> This error type indicates the model lacks the concept used to solve the problem. The feedback should contain a question to assess the understanding of the concept. (e.g., What is the Pythagorean theorem?) 
<br class="ltx_break">2. </span>Misinterpret:<span id="A4.SS2.SSS2.p2.pic1.2.3.1.3" class="ltx_text ltx_font_medium"> The model misunderstood or misinterpreted the question. The feedback should include a follow-up question or clarification to help the model reassess and correctly interpret the original question. This ensures the model understands the context and requirements before proceeding. 
<br class="ltx_break">3. </span>Calculation:<span id="A4.SS2.SSS2.p2.pic1.2.3.1.4" class="ltx_text ltx_font_medium"> The model made a mistake in calculation. Feedback should focus on identifying the part that requires recalculation. 
<br class="ltx_break">4. </span>N/A:<span id="A4.SS2.SSS2.p2.pic1.2.3.1.5" class="ltx_text ltx_font_medium"> None of the above. Provide a custom description.</span></span></span>
<span id="A4.SS2.SSS2.p2.pic1.2.4" class="ltx_p"><span id="A4.SS2.SSS2.p2.pic1.2.4.1" class="ltx_text ltx_font_bold" style="--ltx-fg-color:#000000;">Response Format (JSON):<span id="A4.SS2.SSS2.p2.pic1.2.4.1.1" class="ltx_text ltx_font_medium">
{Format Example}</span></span></span>
<span id="A4.SS2.SSS2.p2.pic1.2.5" class="ltx_p"><span id="A4.SS2.SSS2.p2.pic1.2.5.1" class="ltx_text ltx_font_bold" style="--ltx-fg-color:#000000;">Input Data:<span id="A4.SS2.SSS2.p2.pic1.2.5.1.1" class="ltx_text ltx_font_medium"> 
<br class="ltx_break">Question: {question} 
<br class="ltx_break">Correct Answer (DO NOT disclose): {answer} 
<br class="ltx_break">Reference Solution (DO NOT disclose): {solution} 
<br class="ltx_break">Previous Feedback: {Dialogue_History} 
<br class="ltx_break">Model’s Error Type: {error_type} 
<br class="ltx_break"></span></span></span>
