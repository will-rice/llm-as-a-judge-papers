<svg id="A2.SS2.p1.pic1" class="ltx_picture" height="308.39" overflow="visible" version="1.1" viewbox="0 0 550 308.39" width="550"><g style="--ltx-stroke-color:#000000;--ltx-fill-color:#000000;" fill="#000000" stroke="#000000" stroke-width="0.4pt" transform="translate(0,308.39) matrix(1 0 0 -1 0 0)"><g style="--ltx-fill-color:#B9B9B9;" fill="#B9B9B9" fill-opacity="1.0"><path style="stroke:none" d="M 0 8.7 L 0 299.69 C 0 304.5 3.9 308.39 8.7 308.39 L 541.3 308.39 C 546.1 308.39 550 304.5 550 299.69 L 550 8.7 C 550 3.9 546.1 0 541.3 0 L 8.7 0 C 3.9 0 0 3.9 0 8.7 Z" /></g><g style="--ltx-fill-color:#FBFBFB;" fill="#FBFBFB" fill-opacity="1.0"><path style="stroke:none" d="M 0.83 8.7 L 0.83 286.56 L 549.17 286.56 L 549.17 8.7 C 549.17 4.36 545.64 0.83 541.3 0.83 L 8.7 0.83 C 4.36 0.83 0.83 4.36 0.83 8.7 Z" /></g><g fill-opacity="1.0" transform="matrix(1.0 0.0 0.0 1.0 13.07 294.02)"><foreignobject style="--ltx-fo-width:32.92em;--ltx-fo-height:0.69em;--ltx-fo-depth:0.19em;font-size:10pt;" height="12.3" overflow="visible" transform="matrix(1 0 0 -1 0 9.61)" width="455.52"><span class="ltx_foreignobject_container"><span class="ltx_foreignobject_content">
<span id="A2.SS2.p1.pic1.1" class="ltx_inline-block ltx_minipage ltx_align_bottom" style="width:32.92em;">
<span id="A2.SS2.p1.pic1.1.1" class="ltx_p"><span id="A2.SS2.p1.pic1.1.1.1" class="ltx_text ltx_font_bold" style="--ltx-fg-color:#FFFFFF;">Prompt template &amp; Execution</span></span>
</span></span></span></foreignobject></g><g fill-opacity="1.0" transform="matrix(1.0 0.0 0.0 1.0 13.07 15.76)"><foreignobject style="--ltx-fo-width:37.86em;--ltx-fo-height:18.69em;--ltx-fo-depth:0.19em;font-size:10pt;" height="261.25" overflow="visible" transform="matrix(1 0 0 -1 0 258.56)" width="523.88"><span class="ltx_foreignobject_container"><span class="ltx_foreignobject_content">
<span id="A2.SS2.p1.pic1.2" class="ltx_inline-block ltx_minipage ltx_align_bottom" style="width:37.86em;">
<span id="A2.SS2.p1.pic1.2.1" class="ltx_p"><span id="A2.SS2.p1.pic1.2.1.1" class="ltx_text ltx_font_bold" style="--ltx-fg-color:#000000;">System prompt<span id="A2.SS2.p1.pic1.2.1.1.1" class="ltx_text ltx_font_medium"> 
<br class="ltx_break">Each request starts with dynamic dataset context, task definition, label space (or regression
target), and explicit output-format constraints. 
<br class="ltx_break"></span></span></span>
<span id="A2.SS2.p1.pic1.2.2" class="ltx_p"><span id="A2.SS2.p1.pic1.2.2.1" class="ltx_text ltx_font_bold" style="--ltx-fg-color:#000000;">User prompt<span id="A2.SS2.p1.pic1.2.2.1.1" class="ltx_text ltx_font_medium"> 
<br class="ltx_break">The user message contains few-shot examples as <math id="A2.SS2.p1.pic1.m1" class="ltx_Math" alttext="(X,y)" display="inline" intent=":literal"><semantics><mrow><mo style="--ltx-fg-color:#000000;" mathcolor="#000000" stretchy="false">(</mo><mi style="--ltx-fg-color:#000000;" mathcolor="#000000">X</mi><mo style="--ltx-fg-color:#000000;" mathcolor="#000000">,</mo><mi style="--ltx-fg-color:#000000;" mathcolor="#000000">y</mi><mo style="--ltx-fg-color:#000000;" mathcolor="#000000" stretchy="false">)</mo></mrow><annotation encoding="application/x-tex">(X,y)</annotation></semantics></math> pairs, followed by evaluation
rows as <math id="A2.SS2.p1.pic1.m2" class="ltx_Math" alttext="X" display="inline" intent=":literal"><semantics><mi style="--ltx-fg-color:#000000;" mathcolor="#000000">X</mi><annotation encoding="application/x-tex">X</annotation></semantics></math> only. For tabular settings, inputs are restricted to at most 10 numeric
features to control context length. 
<br class="ltx_break"></span></span></span>
<span id="A2.SS2.p1.pic1.2.3" class="ltx_p"><span id="A2.SS2.p1.pic1.2.3.1" class="ltx_text ltx_font_bold" style="--ltx-fg-color:#000000;">Run protocol<span id="A2.SS2.p1.pic1.2.3.1.1" class="ltx_text ltx_font_medium"> 
<br class="ltx_break">Each dataset <math id="A2.SS2.p1.pic1.m3" class="ltx_Math" alttext="\times" display="inline" intent=":literal"><semantics><mo style="--ltx-fg-color:#000000;" mathcolor="#000000">×</mo><annotation encoding="application/x-tex">\times</annotation></semantics></math> noise setting is run for five independent trials using fixed random
seeds. Text experiments apply the lexical corruption at
the requested severity; tabular experiments apply Gaussian perturbations under correlated
or uncorrelated covariance structure. 
<br class="ltx_break"></span></span></span>
<span id="A2.SS2.p1.pic1.2.4" class="ltx_p"><span id="A2.SS2.p1.pic1.2.4.1" class="ltx_text ltx_font_bold" style="--ltx-fg-color:#000000;">Output schema<span id="A2.SS2.p1.pic1.2.4.1.1" class="ltx_text ltx_font_medium"> 
<br class="ltx_break">Model outputs are schema-validated against task-specific constraints (label set for
classification, numeric parsing for regression). Invalid schema/parse outputs are retried up to 3 times; otherwise counted missing.</span></span></span>
</span></span></span></foreignobject></g></g></svg>