<span id="A5.SS1.p2.pic1.2.1" class="ltx_p"><span id="A5.SS1.p2.pic1.2.1.1" class="ltx_text ltx_verbatim ltx_font_typewriter ltx_inline-block" style="font-size:70%;width:326.3pt;--ltx-fg-color:#000000;"><span id="A5.SS1.p2.pic1.2.1.1.1" class="ltx_inline-logical-block ltx_parbox ltx_align_top" style="width:326.3pt;">
<span id="A5.SS1.p2.pic1.p1" class="ltx_para ltx_noindent">
<span id="A5.SS1.p2.pic1.p1.1" class="ltx_p">... Use a realistic selective-conference standard: accept only if the</span>
</span></span></span></span>
<span id="A5.SS1.p2.pic1.2.2" class="ltx_p" style="width:326.3pt;"><span id="A5.SS1.p2.pic1.2.2.1" class="ltx_text ltx_verbatim ltx_font_typewriter ltx_inline-block" style="font-size:70%;width:326.3pt;--ltx-fg-color:#000000;"><span id="A5.SS1.p2.pic1.2.2.1.1" class="ltx_inline-logical-block ltx_parbox ltx_align_top" style="width:326.3pt;">
<span id="A5.SS1.p2.pic1.p2" class="ltx_para ltx_noindent">
<span id="A5.SS1.p2.pic1.p2.1" class="ltx_p">paper has a clear nontrivial contribution, technically sound</span>
</span></span></span></span>
<span id="A5.SS1.p2.pic1.2.3" class="ltx_p" style="width:326.3pt;"><span id="A5.SS1.p2.pic1.2.3.1" class="ltx_text ltx_verbatim ltx_font_typewriter ltx_inline-block" style="font-size:70%;width:326.3pt;--ltx-fg-color:#000000;"><span id="A5.SS1.p2.pic1.2.3.1.1" class="ltx_inline-logical-block ltx_parbox ltx_align_top" style="width:326.3pt;">
<span id="A5.SS1.p2.pic1.p3" class="ltx_para ltx_noindent">
<span id="A5.SS1.p2.pic1.p3.1" class="ltx_p">methodology/theory or experiments, adequate positioning against prior</span>
</span></span></span></span>
<span id="A5.SS1.p2.pic1.2.4" class="ltx_p" style="width:326.3pt;"><span id="A5.SS1.p2.pic1.2.4.1" class="ltx_text ltx_verbatim ltx_font_typewriter ltx_inline-block" style="font-size:70%;width:326.3pt;--ltx-fg-color:#000000;"><span id="A5.SS1.p2.pic1.2.4.1.1" class="ltx_inline-logical-block ltx_parbox ltx_align_top" style="width:326.3pt;">
<span id="A5.SS1.p2.pic1.p4" class="ltx_para ltx_noindent">
<span id="A5.SS1.p2.pic1.p4.1" class="ltx_p">work, and claims supported by evidence; reject papers with missing</span>
</span></span></span></span>
<span id="A5.SS1.p2.pic1.2.5" class="ltx_p" style="width:326.3pt;"><span id="A5.SS1.p2.pic1.2.5.1" class="ltx_text ltx_verbatim ltx_font_typewriter ltx_inline-block" style="font-size:70%;width:326.3pt;--ltx-fg-color:#000000;"><span id="A5.SS1.p2.pic1.2.5.1.1" class="ltx_inline-logical-block ltx_parbox ltx_align_top" style="width:326.3pt;">
<span id="A5.SS1.p2.pic1.p5" class="ltx_para ltx_noindent">
<span id="A5.SS1.p2.pic1.p5.1" class="ltx_p">validation, unclear novelty, serious technical gaps, or overclaiming.</span>
</span></span></span></span>
<span id="A5.SS1.p2.pic1.2.6" class="ltx_p" style="width:326.3pt;"><span id="A5.SS1.p2.pic1.2.6.1" class="ltx_text ltx_verbatim ltx_font_typewriter ltx_inline-block" style="font-size:70%;width:326.3pt;--ltx-fg-color:#000000;"><span id="A5.SS1.p2.pic1.2.6.1.1" class="ltx_inline-logical-block ltx_parbox ltx_align_top" style="width:326.3pt;">
<span id="A5.SS1.p2.pic1.p6" class="ltx_para ltx_noindent">
<span id="A5.SS1.p2.pic1.p6.1" class="ltx_p">Do not be swayed by fluent writing alone.</span>
</span></span></span></span>
