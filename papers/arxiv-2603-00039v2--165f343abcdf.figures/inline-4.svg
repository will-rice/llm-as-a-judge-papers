<svg id="A5.SS5.p5.pic1" class="ltx_picture" height="939.64" overflow="visible" version="1.1" viewbox="0 0 477.38 939.64" width="477.38"><g style="--ltx-stroke-color:#000000;--ltx-fill-color:#000000;" fill="#000000" stroke="#000000" stroke-width="0.4pt" transform="translate(0,939.64) matrix(1 0 0 -1 0 0)"><g style="--ltx-fill-color:#B3B3B3;" fill="#B3B3B3" fill-opacity="1.0"><path style="stroke:none" d="M 0 4.49 L 0 935.15 C 0 937.63 2.01 939.64 4.49 939.64 L 472.89 939.64 C 475.37 939.64 477.38 937.63 477.38 935.15 L 477.38 4.49 C 477.38 2.01 475.37 0 472.89 0 L 4.49 0 C 2.01 0 0 2.01 0 4.49 Z" /></g><g style="--ltx-fill-color:#FFFFFF;" fill="#FFFFFF" fill-opacity="1.0"><path style="stroke:none" d="M 0.55 4.49 L 0.55 900.22 L 476.82 900.22 L 476.82 4.49 C 476.82 2.32 475.06 0.55 472.89 0.55 L 4.49 0.55 C 2.32 0.55 0.55 2.32 0.55 4.49 Z" /></g><g fill-opacity="1.0" transform="matrix(1.0 0.0 0.0 1.0 12.79 924.78)"><foreignobject style="--ltx-fo-width:28.39em;--ltx-fo-height:0.75em;--ltx-fo-depth:1.45em;font-size:10pt;" height="30.44" overflow="visible" transform="matrix(1 0 0 -1 0 10.38)" width="392.84"><span class="ltx_foreignobject_container"><span class="ltx_foreignobject_content">
<span id="A5.SS5.p5.pic1.1" class="ltx_inline-block ltx_minipage ltx_align_bottom" style="width:28.39em;">
<span id="A5.SS5.p5.pic1.1.1" class="ltx_p"><span id="A5.SS5.p5.pic1.1.1.1" class="ltx_text ltx_font_bold" style="--ltx-fg-color:#FFFFFF;">LLM Judge Scoring Template (Summarize-from-Feedback – Overall Quality)</span></span>
</span></span></span></foreignobject></g><g fill-opacity="1.0" transform="matrix(1.0 0.0 0.0 1.0 12.79 15.87)"><foreignobject style="--ltx-fo-width:31.1em;--ltx-fo-height:63.03em;--ltx-fo-depth:0.22em;font-size:10pt;" height="875.2" overflow="visible" transform="matrix(1 0 0 -1 0 872.13)" width="430.34"><span class="ltx_foreignobject_container"><span class="ltx_foreignobject_content">
<span id="A5.SS5.p5.pic1.2" class="ltx_inline-block ltx_minipage ltx_align_bottom" style="width:31.1em;">
<span id="A5.SS5.p5.pic1.2.1" class="ltx_p"><span id="A5.SS5.p5.pic1.2.1.1" class="ltx_text" style="--ltx-fg-color:#000000;">You are judging the overall <span id="A5.SS5.p5.pic1.2.1.1.1" class="ltx_text ltx_font_bold">quality and faithfulness</span> of a candidate summary generated from a longer text.
Your task is to evaluate how well the summary captures the main ideas, factual details, and intent of the original passage, balancing <span id="A5.SS5.p5.pic1.2.1.1.2" class="ltx_text ltx_font_bold">accuracy, coverage, and clarity</span>.</span></span>
<span id="A5.SS5.p5.pic1.2.2" class="ltx_p"><span id="A5.SS5.p5.pic1.2.2.1" class="ltx_text ltx_font_bold" style="--ltx-fg-color:#000000;">Scoring criteria:<span id="A5.SS5.p5.pic1.2.2.1.1" class="ltx_text"></span></span></span>
<span id="A5.I5" class="ltx_itemize ltx_leftmargin_flush">
<span id="A5.I5.i1" class="ltx_item" style="list-style-type:none;"><span class="ltx_tag ltx_tag_item">•</span> 
<span id="A5.I5.i1.p1" class="ltx_para">
<span id="A5.I5.i1.p1.1" class="ltx_p"><span id="A5.I5.i1.p1.1.1" class="ltx_text" style="--ltx-fg-color:#000000;">Prioritise </span><span id="A5.I5.i1.p1.1.2" class="ltx_text ltx_font_bold" style="--ltx-fg-color:#000000;">faithfulness</span><span id="A5.I5.i1.p1.1.3" class="ltx_text" style="--ltx-fg-color:#000000;">: summaries must not introduce false or unrelated content.</span></span>
</span></span>
<span id="A5.I5.i2" class="ltx_item" style="list-style-type:none;"><span class="ltx_tag ltx_tag_item">•</span> 
<span id="A5.I5.i2.p1" class="ltx_para">
<span id="A5.I5.i2.p1.1" class="ltx_p"><span id="A5.I5.i2.p1.1.1" class="ltx_text" style="--ltx-fg-color:#000000;">Assess </span><span id="A5.I5.i2.p1.1.2" class="ltx_text ltx_font_bold" style="--ltx-fg-color:#000000;">coverage</span><span id="A5.I5.i2.p1.1.3" class="ltx_text" style="--ltx-fg-color:#000000;">: the main points, outcomes, and reasoning from the original text should be reflected.</span></span>
</span></span>
<span id="A5.I5.i3" class="ltx_item" style="list-style-type:none;"><span class="ltx_tag ltx_tag_item">•</span> 
<span id="A5.I5.i3.p1" class="ltx_para">
<span id="A5.I5.i3.p1.1" class="ltx_p"><span id="A5.I5.i3.p1.1.1" class="ltx_text" style="--ltx-fg-color:#000000;">Evaluate </span><span id="A5.I5.i3.p1.1.2" class="ltx_text ltx_font_bold" style="--ltx-fg-color:#000000;">clarity and conciseness</span><span id="A5.I5.i3.p1.1.3" class="ltx_text" style="--ltx-fg-color:#000000;">: good summaries are readable and direct, without unnecessary details.</span></span>
</span></span>
<span id="A5.I5.i4" class="ltx_item" style="list-style-type:none;"><span class="ltx_tag ltx_tag_item">•</span> 
<span id="A5.I5.i4.p1" class="ltx_para">
<span id="A5.I5.i4.p1.1" class="ltx_p"><span id="A5.I5.i4.p1.1.1" class="ltx_text" style="--ltx-fg-color:#000000;">Do not reward stylistic flourish or length; correctness and substance matter most.</span></span>
</span></span>
</span>
<span id="A5.SS5.p5.pic1.2.3" class="ltx_p"><span id="A5.SS5.p5.pic1.2.3.1" class="ltx_text" style="--ltx-fg-color:#000000;">Assign a single integer score from 1 to 7 based on the following rubric:</span></span>
<span id="A5.I6" class="ltx_itemize ltx_leftmargin_flush">
<span id="A5.I6.i1" class="ltx_item" style="list-style-type:none;"><span class="ltx_tag ltx_tag_item">•</span> 
<span id="A5.I6.i1.p1" class="ltx_para">
<span id="A5.I6.i1.p1.1" class="ltx_p"><span id="A5.I6.i1.p1.1.1" class="ltx_text" style="--ltx-fg-color:#000000;">1 – Very poor: inaccurate or largely off-topic; major facts are wrong or missing.</span></span>
</span></span>
<span id="A5.I6.i2" class="ltx_item" style="list-style-type:none;"><span class="ltx_tag ltx_tag_item">•</span> 
<span id="A5.I6.i2.p1" class="ltx_para">
<span id="A5.I6.i2.p1.1" class="ltx_p"><span id="A5.I6.i2.p1.1.1" class="ltx_text" style="--ltx-fg-color:#000000;">2 – Poor: significant factual or coverage errors; misleading or incomplete.</span></span>
</span></span>
<span id="A5.I6.i3" class="ltx_item" style="list-style-type:none;"><span class="ltx_tag ltx_tag_item">•</span> 
<span id="A5.I6.i3.p1" class="ltx_para">
<span id="A5.I6.i3.p1.1" class="ltx_p"><span id="A5.I6.i3.p1.1.1" class="ltx_text" style="--ltx-fg-color:#000000;">3 – Fair: captures some ideas but omits key information or introduces confusion.</span></span>
</span></span>
<span id="A5.I6.i4" class="ltx_item" style="list-style-type:none;"><span class="ltx_tag ltx_tag_item">•</span> 
<span id="A5.I6.i4.p1" class="ltx_para">
<span id="A5.I6.i4.p1.1" class="ltx_p"><span id="A5.I6.i4.p1.1.1" class="ltx_text" style="--ltx-fg-color:#000000;">4 – Adequate: mostly correct but has gaps, minor hallucinations, or extraneous details.</span></span>
</span></span>
<span id="A5.I6.i5" class="ltx_item" style="list-style-type:none;"><span class="ltx_tag ltx_tag_item">•</span> 
<span id="A5.I6.i5.p1" class="ltx_para">
<span id="A5.I6.i5.p1.1" class="ltx_p"><span id="A5.I6.i5.p1.1.1" class="ltx_text" style="--ltx-fg-color:#000000;">5 – Good: covers key ideas faithfully with small omissions or slight verbosity.</span></span>
</span></span>
<span id="A5.I6.i6" class="ltx_item" style="list-style-type:none;"><span class="ltx_tag ltx_tag_item">•</span> 
<span id="A5.I6.i6.p1" class="ltx_para">
<span id="A5.I6.i6.p1.1" class="ltx_p"><span id="A5.I6.i6.p1.1.1" class="ltx_text" style="--ltx-fg-color:#000000;">6 – Very good: accurate, coherent, and clear with only minor imperfections.</span></span>
</span></span>
<span id="A5.I6.i7" class="ltx_item" style="list-style-type:none;"><span class="ltx_tag ltx_tag_item">•</span> 
<span id="A5.I6.i7.p1" class="ltx_para">
<span id="A5.I6.i7.p1.1" class="ltx_p"><span id="A5.I6.i7.p1.1.1" class="ltx_text" style="--ltx-fg-color:#000000;">7 – Excellent: fully faithful, comprehensive, and well-written.</span></span>
</span></span>
</span>
<span id="A5.SS5.p5.pic1.2.4" class="ltx_p"><span id="A5.SS5.p5.pic1.2.4.1" class="ltx_text ltx_font_bold" style="--ltx-fg-color:#000000;">Guidance:<span id="A5.SS5.p5.pic1.2.4.1.1" class="ltx_text"></span></span></span>
<span id="A5.I7" class="ltx_itemize ltx_leftmargin_flush">
<span id="A5.I7.i1" class="ltx_item" style="list-style-type:none;"><span class="ltx_tag ltx_tag_item">•</span> 
<span id="A5.I7.i1.p1" class="ltx_para">
<span id="A5.I7.i1.p1.1" class="ltx_p"><span id="A5.I7.i1.p1.1.1" class="ltx_text" style="--ltx-fg-color:#000000;">Focus on factual alignment and coverage, not stylistic preferences.</span></span>
</span></span>
<span id="A5.I7.i2" class="ltx_item" style="list-style-type:none;"><span class="ltx_tag ltx_tag_item">•</span> 
<span id="A5.I7.i2.p1" class="ltx_para">
<span id="A5.I7.i2.p1.1" class="ltx_p"><span id="A5.I7.i2.p1.1.1" class="ltx_text" style="--ltx-fg-color:#000000;">Small rephrasings or wording changes should not affect the rating.</span></span>
</span></span>
<span id="A5.I7.i3" class="ltx_item" style="list-style-type:none;"><span class="ltx_tag ltx_tag_item">•</span> 
<span id="A5.I7.i3.p1" class="ltx_para">
<span id="A5.I7.i3.p1.1" class="ltx_p"><span id="A5.I7.i3.p1.1.1" class="ltx_text" style="--ltx-fg-color:#000000;">Reserve 7 for summaries that are both faithful and complete.</span></span>
</span></span>
</span>
<span id="A5.SS5.p5.pic1.2.5" class="ltx_p"><span id="A5.SS5.p5.pic1.2.5.1" class="ltx_text" style="--ltx-fg-color:#000000;">Respond exactly in this format:</span></span><pre id="A5.SS5.p5.pic1.2.6" class="ltx_verbatim ltx_font_typewriter" style="--ltx-fg-color:#000000;">
Feedback:::
Total rating: X
</pre>
<span id="A5.SS5.p5.pic1.2.7" class="ltx_p"><span id="A5.SS5.p5.pic1.2.7.1" class="ltx_text" style="--ltx-fg-color:#000000;">Where <span id="A5.SS5.p5.pic1.2.7.1.1" class="ltx_text ltx_font_typewriter">X</span> is an integer from 1 to 7 (inclusive). Output nothing else.</span></span>
<span id="A5.SS5.p5.pic1.2.8" class="ltx_p"><span id="A5.SS5.p5.pic1.2.8.1" class="ltx_text ltx_font_bold" style="--ltx-fg-color:#000000;">Inputs:<span id="A5.SS5.p5.pic1.2.8.1.1" class="ltx_text"></span></span></span><pre id="A5.SS5.p5.pic1.2.9" class="ltx_verbatim ltx_font_typewriter" style="--ltx-fg-color:#000000;">
Original text:
{original}

Summary:
{summary}

Feedback:::
Total rating:
</pre>
</span></span></span></foreignobject></g></g></svg>