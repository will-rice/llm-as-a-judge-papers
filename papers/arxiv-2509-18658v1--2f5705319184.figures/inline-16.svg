<svg id="A1.F20.pic1" class="ltx_picture ltx_centering" height="708.2" overflow="visible" version="1.1" viewbox="0 0 653.15 708.2" width="653.15"><g style="--ltx-stroke-color:#000000;--ltx-fill-color:#000000;" fill="#000000" stroke="#000000" stroke-width="0.4pt" transform="translate(0,708.2) matrix(1 0 0 -1 0 0)"><g style="--ltx-fill-color:#000000;" fill="#000000" fill-opacity="1.0"><path style="stroke:none" d="M 0 0 L 0 708.2 L 653.15 708.2 L 653.15 0 Z" /></g><g style="--ltx-fill-color:#FFFFFF;" fill="#FFFFFF" fill-opacity="1.0"><path style="stroke:none" d="M 0.69 0.69 L 0.69 686.64 L 652.46 686.64 L 652.46 0.69 Z" /></g><g fill-opacity="1.0" transform="matrix(1.0 0.0 0.0 1.0 20.38 693.96)"><foreignobject style="--ltx-fo-width:38.49em;--ltx-fo-height:0.69em;--ltx-fo-depth:0.19em;font-size:10pt;" height="12.3" overflow="visible" transform="matrix(1 0 0 -1 0 9.61)" width="532.59"><span class="ltx_foreignobject_container"><span class="ltx_foreignobject_content">
<span id="A1.F20.pic1.1" class="ltx_inline-block ltx_minipage ltx_align_bottom" style="width:38.49em;">
<span id="A1.F20.pic1.1.1" class="ltx_p"><span id="A1.F20.pic1.1.1.1" class="ltx_text ltx_font_bold" style="--ltx-fg-color:#FFFFFF;">Chain-of-thought Prompt for GenAI-Bench: Text-to-Image Quality</span></span>
</span></span></span></foreignobject></g><g fill-opacity="1.0" transform="matrix(1.0 0.0 0.0 1.0 20.38 15.96)"><foreignobject style="--ltx-fo-width:44.26em;--ltx-fo-height:47.62em;--ltx-fo-depth:0.25em;font-size:10pt;" height="662.34" overflow="visible" transform="matrix(1 0 0 -1 0 658.88)" width="612.43"><span class="ltx_foreignobject_container"><span class="ltx_foreignobject_content">
<span id="A1.F20.pic1.2" class="ltx_inline-block ltx_minipage ltx_align_bottom" style="width:44.26em;">
<span id="A1.F20.pic1.2.1" class="ltx_p"><span id="A1.F20.pic1.2.1.1" class="ltx_text ltx_font_bold" style="--ltx-fg-color:#000000;">You will be given:<span id="A1.F20.pic1.2.1.1.1" class="ltx_text ltx_font_medium"> 
<br class="ltx_break">1) a single generated image <math id="A1.F20.pic1.m1" class="ltx_Math" alttext="I" display="inline" intent=":literal"><semantics><mi style="--ltx-fg-color:#000000;" mathcolor="#000000">I</mi><annotation encoding="application/x-tex">I</annotation></semantics></math> 
<br class="ltx_break">2) the corresponding prompt <math id="A1.F20.pic1.m2" class="ltx_Math" alttext="P" display="inline" intent=":literal"><semantics><mi style="--ltx-fg-color:#000000;" mathcolor="#000000">P</mi><annotation encoding="application/x-tex">P</annotation></semantics></math> {prompt}</span></span></span>
<span id="A1.F20.pic1.2.2" class="ltx_p"><span id="A1.F20.pic1.2.2.1" class="ltx_text ltx_font_bold" style="--ltx-fg-color:#000000;">Your task:<span id="A1.F20.pic1.2.2.1.1" class="ltx_text ltx_font_medium"> Output <span id="A1.F20.pic1.2.2.1.1.1" class="ltx_text ltx_font_typewriter">Quality Score: (1--5)</span> followed by a concise explanation.
Use the five-step chain-of-thought below </span>silently<span id="A1.F20.pic1.2.2.1.2" class="ltx_text ltx_font_medium">, then distill the insight into one short sentence.</span></span></span>
<span id="A1.F20.pic1.2.3" class="ltx_p"><span id="A1.F20.pic1.2.3.1" class="ltx_text ltx_font_bold" style="--ltx-fg-color:#000000;">Internal CoT Steps (do not output):<span id="A1.F20.pic1.2.3.1.1" class="ltx_text"></span></span></span>
<span id="A1.I14" class="ltx_enumerate">
<span id="A1.I14.i1" class="ltx_item" style="list-style-type:none;"><span class="ltx_tag ltx_tag_item">1.</span> 
<span id="A1.I14.i1.p1" class="ltx_para">
<span id="A1.I14.i1.p1.1" class="ltx_p"><span id="A1.I14.i1.p1.1.1" class="ltx_text ltx_font_bold" style="--ltx-fg-color:#000000;">Skill Inventory</span><span id="A1.I14.i1.p1.1.2" class="ltx_text" style="--ltx-fg-color:#000000;">: Scan P for the typical generation skills it implicitly tests, e.g.</span></span>
<span id="A1.I14.i1.I1" class="ltx_itemize">
<span id="A1.I14.i1.I0.i1" class="ltx_item" style="list-style-type:none;"><span class="ltx_tag ltx_tag_item">•</span> 
<span id="A1.I14.i1.I0.i1.p1" class="ltx_para">
<span id="A1.I14.i1.I0.i1.p1.1" class="ltx_p"><span id="A1.I14.i1.I0.i1.p1.1.1" class="ltx_text" style="--ltx-fg-color:#000000;">Counting (how many objects)</span></span>
</span></span>
<span id="A1.I14.i1.I0.i2" class="ltx_item" style="list-style-type:none;"><span class="ltx_tag ltx_tag_item">•</span> 
<span id="A1.I14.i1.I0.i2.p1" class="ltx_para">
<span id="A1.I14.i1.I0.i2.p1.1" class="ltx_p"><span id="A1.I14.i1.I0.i2.p1.1.1" class="ltx_text" style="--ltx-fg-color:#000000;">Spatial layout (relative positions)</span></span>
</span></span>
<span id="A1.I14.i1.I0.i3" class="ltx_item" style="list-style-type:none;"><span class="ltx_tag ltx_tag_item">•</span> 
<span id="A1.I14.i1.I0.i3.p1" class="ltx_para">
<span id="A1.I14.i1.I0.i3.p1.1" class="ltx_p"><span id="A1.I14.i1.I0.i3.p1.1.1" class="ltx_text" style="--ltx-fg-color:#000000;">Attribute binding (color, material, style)</span></span>
</span></span>
<span id="A1.I14.i1.I0.i4" class="ltx_item" style="list-style-type:none;"><span class="ltx_tag ltx_tag_item">•</span> 
<span id="A1.I14.i1.I0.i4.p1" class="ltx_para">
<span id="A1.I14.i1.I0.i4.p1.1" class="ltx_p"><span id="A1.I14.i1.I0.i4.p1.1.1" class="ltx_text" style="--ltx-fg-color:#000000;">Negation &amp; absence (what must not appear)</span></span>
</span></span>
<span id="A1.I14.i1.I0.i5" class="ltx_item" style="list-style-type:none;"><span class="ltx_tag ltx_tag_item">•</span> 
<span id="A1.I14.i1.I0.i5.p1" class="ltx_para">
<span id="A1.I14.i1.I0.i5.p1.1" class="ltx_p"><span id="A1.I14.i1.I0.i5.p1.1.1" class="ltx_text" style="--ltx-fg-color:#000000;">Action or interaction realism</span></span>
</span></span>
<span id="A1.I14.i1.I0.i6" class="ltx_item" style="list-style-type:none;"><span class="ltx_tag ltx_tag_item">•</span> 
<span id="A1.I14.i1.I0.i6.p1" class="ltx_para">
<span id="A1.I14.i1.I0.i6.p1.1" class="ltx_p"><span id="A1.I14.i1.I0.i6.p1.1.1" class="ltx_text" style="--ltx-fg-color:#000000;">Scene coherence &amp; lighting plausibility</span></span>
</span></span>
</span>
</span></span>
<span id="A1.I14.i2" class="ltx_item" style="list-style-type:none;"><span class="ltx_tag ltx_tag_item">2.</span> 
<span id="A1.I14.i2.p1" class="ltx_para">
<span id="A1.I14.i2.p1.1" class="ltx_p"><span id="A1.I14.i2.p1.1.1" class="ltx_text ltx_font_bold" style="--ltx-fg-color:#000000;">Global Coherence Check</span><span id="A1.I14.i2.p1.1.2" class="ltx_text" style="--ltx-fg-color:#000000;">: Does the entire scene feel like one unified photograph / artwork that matches the prompt’s mood and setting?</span></span>
</span></span>
<span id="A1.I14.i3" class="ltx_item" style="list-style-type:none;"><span class="ltx_tag ltx_tag_item">3.</span> 
<span id="A1.I14.i3.p1" class="ltx_para">
<span id="A1.I14.i3.p1.1" class="ltx_p"><span id="A1.I14.i3.p1.1.1" class="ltx_text ltx_font_bold" style="--ltx-fg-color:#000000;">Critical Object Pass</span><span id="A1.I14.i3.p1.1.2" class="ltx_text" style="--ltx-fg-color:#000000;">: Identify the 1–3 most semantically heavy objects or relations. Are they present, correctly shaped, and believably integrated?</span></span>
</span></span>
<span id="A1.I14.i4" class="ltx_item" style="list-style-type:none;"><span class="ltx_tag ltx_tag_item">4.</span> 
<span id="A1.I14.i4.p1" class="ltx_para">
<span id="A1.I14.i4.p1.1" class="ltx_p"><span id="A1.I14.i4.p1.1.1" class="ltx_text ltx_font_bold" style="--ltx-fg-color:#000000;">Fine-Grain Glance</span><span id="A1.I14.i4.p1.1.2" class="ltx_text" style="--ltx-fg-color:#000000;">: Spot any subtle oddities (extra limbs, miscounts, impossible lighting, texture smears). Even tiny flaws here can reveal skill gaps.</span></span>
</span></span>
<span id="A1.I14.i5" class="ltx_item" style="list-style-type:none;"><span class="ltx_tag ltx_tag_item">5.</span> 
<span id="A1.I14.i5.p1" class="ltx_para">
<span id="A1.I14.i5.p1.1" class="ltx_p"><span id="A1.I14.i5.p1.1.1" class="ltx_text ltx_font_bold" style="--ltx-fg-color:#000000;">Holistic Judgment</span><span id="A1.I14.i5.p1.1.2" class="ltx_text" style="--ltx-fg-color:#000000;">: Weigh the combined effect: if the key skills are satisfied and the image looks natural → 5; mild off-notes → 4; clear but non-fatal misses → 3; multiple visible failures → 2; fundamentally wrong → 1.</span></span>
</span></span>
</span>
<span id="A1.F20.pic1.2.4" class="ltx_p"><span id="A1.F20.pic1.2.4.1" class="ltx_text ltx_font_bold" style="--ltx-fg-color:#000000;">Output Format (public):<span id="A1.F20.pic1.2.4.1.1" class="ltx_text ltx_font_medium"> 
<br class="ltx_break">Quality Score: X 
<br class="ltx_break">Explanation: One short sentence summarizing the overall perception (<math id="A1.F20.pic1.m3" class="ltx_Math" alttext="\leq" display="inline" intent=":literal"><semantics><mo style="--ltx-fg-color:#000000;" mathcolor="#000000">≤</mo><annotation encoding="application/x-tex">\leq</annotation></semantics></math> 25 words).</span></span></span>
</span></span></span></foreignobject></g></g></svg>