<svg id="A5.p2.pic1" class="ltx_picture" height="712.26" overflow="visible" version="1.1" viewbox="0 0 477.38 712.26" width="477.38"><g style="--ltx-stroke-color:#000000;--ltx-fill-color:#000000;" fill="#000000" stroke="#000000" stroke-width="0.4pt" transform="translate(0,712.26) matrix(1 0 0 -1 0 0)"><g style="--ltx-fill-color:#4D4D4D;" fill="#4D4D4D" fill-opacity="1.0"><path style="stroke:none" d="M 0 0 L 0 712.26 L 477.38 712.26 L 477.38 0 Z" /></g><g style="--ltx-fill-color:#F9F9F9;" fill="#F9F9F9" fill-opacity="1.0"><path style="stroke:none" d="M 0.69 0.69 L 0.69 690.7 L 476.68 690.7 L 476.68 0.69 Z" /></g><g style="--ltx-fill-color:#FFFFFF;" fill="#FFFFFF" fill-opacity="1.0"><path style="stroke:none" d="M 0.69 691.39 L 0.69 711.57 L 476.68 711.57 L 476.68 691.39 Z" /></g><g fill-opacity="1.0" transform="matrix(1.0 0.0 0.0 1.0 20.38 698.02)"><foreignobject style="--ltx-fo-width:30.87em;--ltx-fo-height:0.69em;--ltx-fo-depth:0.19em;font-size:10pt;" height="12.3" overflow="visible" transform="matrix(1 0 0 -1 0 9.61)" width="427.15"><span class="ltx_foreignobject_container"><span class="ltx_foreignobject_content">
<span id="A5.p2.pic1.1" class="ltx_inline-block ltx_minipage ltx_align_bottom" style="width:30.87em;">
<span id="A5.p2.pic1.1.1" class="ltx_p"><span id="A5.p2.pic1.1.1.1" class="ltx_text ltx_font_italic" style="--ltx-fg-color:#000000;">CI Pattern Audit Prompt</span></span>
</span></span></span></foreignobject></g><g fill-opacity="1.0" transform="matrix(1.0 0.0 0.0 1.0 20.38 15.62)"><foreignobject style="--ltx-fo-width:34.12em;--ltx-fo-height:47.94em;--ltx-fo-depth:0.23em;font-size:10pt;" height="666.4" overflow="visible" transform="matrix(1 0 0 -1 0 663.28)" width="472.12"><span class="ltx_foreignobject_container"><span class="ltx_foreignobject_content">
<span id="A5.p2.pic1.2" class="ltx_inline-block ltx_minipage ltx_align_bottom" style="width:34.12em;">
<span id="A5.p2.pic1.2.1" class="ltx_p"><span id="A5.p2.pic1.2.1.1" class="ltx_text ltx_font_bold" style="--ltx-fg-color:#0000B3;">system:</span><span id="A5.p2.pic1.2.1.2" class="ltx_text"></span></span>
<span id="A5.p2.pic1.2.2" class="ltx_p"><span id="A5.p2.pic1.2.2.1" class="ltx_text" style="font-size:90%;--ltx-fg-color:#000000;">We propose the following CI patterns to determine if the recommended item is complementary to the anchor item.</span></span>
<span id="A5.p2.pic1.2.3" class="ltx_p"><span id="A5.p2.pic1.2.3.1" class="ltx_text" style="font-size:90%;--ltx-fg-color:#000000;">1. ACCESSORY OR ADD-ON 
<br class="ltx_break">– Definition: The recommended item augments or protects the anchor.
<br class="ltx_break">– Examples: A phone case or screen protector for a smartphone.
<br class="ltx_break"></span></span>
<span id="A5.p2.pic1.2.4" class="ltx_p"><span id="A5.p2.pic1.2.4.1" class="ltx_text" style="font-size:90%;--ltx-fg-color:#000000;">2. REPLENISHMENT OR CONSUMABLE 
<br class="ltx_break">– Definition: The recommended item is used up alongside, or as a necessary refill for, the anchor. 
<br class="ltx_break">– Examples: Ink cartridges for a printer.
<br class="ltx_break"></span></span>
<span id="A5.p2.pic1.2.5" class="ltx_p"><span id="A5.p2.pic1.2.5.1" class="ltx_text" style="font-size:90%;--ltx-fg-color:#000000;">3. FUNCTIONAL SYNERGY 
<br class="ltx_break">– Definition: The recommended item and anchor combine to deliver a fuller or improved functionality. 
<br class="ltx_break">– Examples: Camera lens or tripod for a DSLR camera.
<br class="ltx_break"></span></span>
<span id="A5.p2.pic1.2.6" class="ltx_p"><span id="A5.p2.pic1.2.6.1" class="ltx_text" style="font-size:90%;--ltx-fg-color:#000000;">4. AESTHETIC OR STYLE MATCH 
<br class="ltx_break">– Definition: The recommended item complements the look or style of the anchor (often fashion- or décor-related). 
<br class="ltx_break">– Examples: A matching scarf for a coat.
<br class="ltx_break"></span></span>
<span id="A5.p2.pic1.2.7" class="ltx_p"><span id="A5.p2.pic1.2.7.1" class="ltx_text" style="font-size:90%;--ltx-fg-color:#000000;">5. BUNDLED SOLUTION OR “COMPLETE THE SET” 
<br class="ltx_break">– Definition: The recommended item helps complete a set or create a bundled offer. 
<br class="ltx_break">– Examples: A bed frame to go with a matching headboard 
<br class="ltx_break"></span></span>
<span id="A5.p2.pic1.2.8" class="ltx_p"><span id="A5.p2.pic1.2.8.1" class="ltx_text" style="font-size:90%;--ltx-fg-color:#000000;">6. BRAND SYNERGY 
<br class="ltx_break">– Definition: Both the anchor and the recommended item come from the same brand or collection, ensuring consistent quality or compatibility. 
<br class="ltx_break">– Examples: Matching laptop charger or accessory from the same manufacturer 
<br class="ltx_break"></span></span>
<span id="A5.p2.pic1.2.9" class="ltx_p"><span id="A5.p2.pic1.2.9.1" class="ltx_text" style="font-size:90%;--ltx-fg-color:#000000;">7. OCCASION-/USE-CASE-BASED COMPLEMENT 
<br class="ltx_break">– Definition: Items that pair well together for a specific event, activity, or purpose. 
<br class="ltx_break">– Examples: Camping gear (tent + sleeping bag) 
<br class="ltx_break"></span></span>
<span id="A5.p2.pic1.2.10" class="ltx_p"><span id="A5.p2.pic1.2.10.1" class="ltx_text" style="font-size:90%;--ltx-fg-color:#000000;">8. Other

<br class="ltx_break"></span></span>
<span id="A5.p2.pic1.2.11" class="ltx_p"><span id="A5.p2.pic1.2.11.1" class="ltx_text ltx_font_bold" style="font-size:90%;--ltx-fg-color:#0000B3;">user:<span id="A5.p2.pic1.2.11.1.1" class="ltx_text"></span></span></span>
<span id="A5.p2.pic1.2.12" class="ltx_p"><span id="A5.p2.pic1.2.12.1" class="ltx_text" style="font-size:90%;--ltx-fg-color:#000000;">You are an eCommerece specialist. Your expertise is to evaluate if the recommended item is complementary to the anchor or not.
If complementary, determine the CI patterns for the given a pair of products. Limit the answer to 15 words.
<br class="ltx_break">The item pairs are: 
<br class="ltx_break"><span id="A5.p2.pic1.2.12.1.1" class="ltx_text ltx_font_bold">anchor item</span>: {<span id="A5.p2.pic1.2.12.1.2" class="ltx_text ltx_font_italic">anchor_title</span>}
<br class="ltx_break"><span id="A5.p2.pic1.2.12.1.3" class="ltx_text ltx_font_bold">recommended item</span>: {<span id="A5.p2.pic1.2.12.1.4" class="ltx_text ltx_font_italic">recomended_title</span>}

<br class="ltx_break"></span></span>
</span></span></span></foreignobject></g></g></svg>