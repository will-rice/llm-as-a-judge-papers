<span id="A1.F20.pic1.1.1" class="ltx_p"><span id="A1.F20.pic1.1.1.1" class="ltx_text" style="--ltx-fg-color:#000000;">Please help me generate multiple sets of multi-turn conversations based on a given conversation scenario, with the goal of testing the model’s active interaction capabilities.
After the user states something, the model should generate appropriate questions to continue the conversation. Therefore, the conversation you generate needs the user to state something firstly, and then the robot will ask questions based on the user’s topic. Note that the generated dialogue should be smooth and natural.

