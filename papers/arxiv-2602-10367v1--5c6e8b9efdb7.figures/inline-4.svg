</span></span></span></foreignobject></g><g fill-opacity="1.0" transform="matrix(1.0 0.0 0.0 1.0 20.79 16.03)"><foreignobject style="--ltx-fo-width:44.75em;--ltx-fo-height:33.63em;--ltx-fo-depth:0.23em;font-size:10pt;" height="468.46" overflow="visible" transform="matrix(1 0 0 -1 0 465.34)" width="619.21"><span class="ltx_foreignobject_container"><span class="ltx_foreignobject_content">
<span id="A2.F9.pic1.2" class="ltx_inline-block ltx_minipage ltx_align_bottom" style="width:44.75em;">
<span id="A2.F9.pic1.2.1" class="ltx_p"><span id="A2.F9.pic1.2.1.1" class="ltx_text ltx_font_typewriter ltx_font_bold" style="font-size:90%;--ltx-fg-color:#000000;">Role:<span id="A2.F9.pic1.2.1.1.1" class="ltx_text ltx_font_medium"> You are a Medical Taxonomy Expert based on Ely’s Taxonomy of Clinical Questions.
</span></span></span>
<span id="A2.F9.pic1.2.2" class="ltx_p"><span id="A2.F9.pic1.2.2.1" class="ltx_text ltx_font_typewriter ltx_font_bold" style="font-size:90%;--ltx-fg-color:#000000;">Task:<span id="A2.F9.pic1.2.2.1.1" class="ltx_text ltx_font_medium"> Evaluate the </span>Primary Query (<math id="A2.F9.pic1.m1" class="ltx_Math" alttext="Q" display="inline" intent=":literal"><semantics><mi style="--ltx-fg-color:#000000;" mathcolor="#000000">Q</mi><annotation encoding="application/x-tex">Q</annotation></semantics></math>)<span id="A2.F9.pic1.2.2.1.2" class="ltx_text ltx_font_medium"> to determine if it constitutes a clinically meaningful Chief Complaint (CC) or medical request.
</span></span></span>
<span id="A2.F9.pic1.2.3" class="ltx_p"><span id="A2.F9.pic1.2.3.1" class="ltx_text ltx_font_typewriter ltx_font_bold" style="font-size:90%;--ltx-fg-color:#000000;">Instructions:<span id="A2.F9.pic1.2.3.1.1" class="ltx_text ltx_font_medium">
</span></span></span>
<span id="A2.I6" class="ltx_itemize">
<span id="A2.I6.i1" class="ltx_item" style="list-style-type:none;"><span class="ltx_tag ltx_tag_item">•</span> 
<span id="A2.I6.i1.p1" class="ltx_para">
<span id="A2.I6.i1.p1.1" class="ltx_p"><span id="A2.I6.i1.p1.1.1" class="ltx_text ltx_font_typewriter ltx_font_bold" style="font-size:90%;--ltx-fg-color:#000000;">Analyze:</span><span id="A2.I6.i1.p1.1.2" class="ltx_text ltx_font_typewriter" style="font-size:90%;--ltx-fg-color:#000000;"> Does </span><math id="A2.I6.i1.p1.m1" class="ltx_Math" alttext="Q" display="inline" intent=":literal"><semantics><mi style="--ltx-fg-color:#000000;" mathcolor="#000000" mathsize="0.900em">Q</mi><annotation encoding="application/x-tex">Q</annotation></semantics></math><span id="A2.I6.i1.p1.1.3" class="ltx_text ltx_font_typewriter" style="font-size:90%;--ltx-fg-color:#000000;"> fall into a valid clinical category (e.g., Symptom, Diagnosis, Management, Prognosis, Therapy)?
</span></span>
</span></span>
<span id="A2.I6.i2" class="ltx_item" style="list-style-type:none;"><span class="ltx_tag ltx_tag_item">•</span> 
<span id="A2.I6.i2.p1" class="ltx_para">
<span id="A2.I6.i2.p1.1" class="ltx_p"><span id="A2.I6.i2.p1.1.1" class="ltx_text ltx_font_typewriter ltx_font_bold" style="font-size:90%;--ltx-fg-color:#000000;">Filter:</span><span id="A2.I6.i2.p1.1.2" class="ltx_text ltx_font_typewriter" style="font-size:90%;--ltx-fg-color:#000000;"> Reject queries that are:
</span></span>
<span id="A2.I6.i2.I1" class="ltx_itemize">
<span id="A2.I6.i2.I1.i1" class="ltx_item" style="list-style-type:none;"><span class="ltx_tag ltx_tag_item"><span id="A2.I6.i2.I1.i1.1" class="ltx_text ltx_font_bold">–</span></span> 
<span id="A2.I6.i2.I1.i1.p1" class="ltx_para">
<span id="A2.I6.i2.I1.i1.p1.1" class="ltx_p"><span id="A2.I6.i2.I1.i1.p1.1.1" class="ltx_text ltx_font_typewriter" style="font-size:90%;--ltx-fg-color:#000000;">Nonsense or gibberish.
</span></span>
</span></span>
<span id="A2.I6.i2.I1.i2" class="ltx_item" style="list-style-type:none;"><span class="ltx_tag ltx_tag_item"><span id="A2.I6.i2.I1.i2.1" class="ltx_text ltx_font_bold">–</span></span> 
<span id="A2.I6.i2.I1.i2.p1" class="ltx_para">
<span id="A2.I6.i2.I1.i2.p1.1" class="ltx_p"><span id="A2.I6.i2.I1.i2.p1.1.1" class="ltx_text ltx_font_typewriter" style="font-size:90%;--ltx-fg-color:#000000;">Purely social/chit-chat without medical intent.
</span></span>
</span></span>
<span id="A2.I6.i2.I1.i3" class="ltx_item" style="list-style-type:none;"><span class="ltx_tag ltx_tag_item"><span id="A2.I6.i2.I1.i3.1" class="ltx_text ltx_font_bold">–</span></span> 
<span id="A2.I6.i2.I1.i3.p1" class="ltx_para">
<span id="A2.I6.i2.I1.i3.p1.1" class="ltx_p"><span id="A2.I6.i2.I1.i3.p1.1.1" class="ltx_text ltx_font_typewriter" style="font-size:90%;--ltx-fg-color:#000000;">Asking for illegal acts (e.g., manufacturing drugs).
</span></span>
</span></span>
<span id="A2.I6.i2.I1.i4" class="ltx_item" style="list-style-type:none;"><span class="ltx_tag ltx_tag_item"><span id="A2.I6.i2.I1.i4.1" class="ltx_text ltx_font_bold">–</span></span> 
<span id="A2.I6.i2.I1.i4.p1" class="ltx_para">
<span id="A2.I6.i2.I1.i4.p1.1" class="ltx_p"><span id="A2.I6.i2.I1.i4.p1.1.1" class="ltx_text ltx_font_typewriter" style="font-size:90%;--ltx-fg-color:#000000;">Too vague to be answered (e.g., &quot;I feel bad&quot;).
</span></span>
</span></span>
</span>
</span></span>
<span id="A2.I6.i3" class="ltx_item" style="list-style-type:none;"><span class="ltx_tag ltx_tag_item">•</span> 
<span id="A2.I6.i3.p1" class="ltx_para">
<span id="A2.I6.i3.p1.1" class="ltx_p"><span id="A2.I6.i3.p1.1.1" class="ltx_text ltx_font_typewriter ltx_font_bold" style="font-size:90%;--ltx-fg-color:#000000;">Output:</span><span id="A2.I6.i3.p1.1.2" class="ltx_text ltx_font_typewriter" style="font-size:90%;--ltx-fg-color:#000000;"> Return a binary score (1 for Valid, 0 for Invalid).
</span></span>
</span></span>
</span>
<span id="A2.F9.pic1.2.4" class="ltx_p"><span id="A2.F9.pic1.2.4.1" class="ltx_text ltx_font_typewriter ltx_font_bold" style="font-size:90%;--ltx-fg-color:#000000;">Input:<span id="A2.F9.pic1.2.4.1.1" class="ltx_text ltx_font_medium"> [User Query <math id="A2.F9.pic1.m2" class="ltx_Math" alttext="Q" display="inline" intent=":literal"><semantics><mi style="--ltx-fg-color:#000000;" mathcolor="#000000">Q</mi><annotation encoding="application/x-tex">Q</annotation></semantics></math>]
</span></span></span>
<span id="A2.F9.pic1.2.5" class="ltx_p"><span id="A2.F9.pic1.2.5.1" class="ltx_text ltx_font_typewriter ltx_font_bold" style="font-size:90%;--ltx-fg-color:#000000;">Output Format (JSON):<span id="A2.F9.pic1.2.5.1.1" class="ltx_text ltx_font_medium">
</span></span></span><pre id="A2.F9.pic1.2.6" class="ltx_verbatim ltx_font_typewriter" style="font-size:90%;--ltx-fg-color:#000000;">
{
  &quot;reasoning&quot;: &quot;Brief explanation...&quot;,
  &quot;score&quot;: 1  // or 0
}
</pre>
</span></span></span></foreignobject></g></g></svg>