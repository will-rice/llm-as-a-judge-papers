<svg id="A8.SS2.p4.pic1" class="ltx_picture" height="137.02" overflow="visible" version="1.1" viewbox="0 0 477.38 137.02" width="477.38"><g style="--ltx-stroke-color:#000000;--ltx-fill-color:#000000;" fill="#000000" stroke="#000000" stroke-width="0.4pt" transform="translate(0,137.02) matrix(1 0 0 -1 0 0)"><g style="--ltx-fill-color:#FFFFFF;" fill="#FFFFFF" fill-opacity="1.0"><path style="stroke:none" d="M 0 0 L 0 137.02 L 477.38 137.02 L 477.38 0 Z" /></g><g style="--ltx-fill-color:#F2F2F2;" fill="#F2F2F2" fill-opacity="1.0"><path style="stroke:none" d="M 1.97 1.97 L 1.97 135.06 L 475.41 135.06 L 475.41 1.97 Z" /></g><g fill-opacity="1.0" transform="matrix(1.0 0.0 0.0 1.0 21.65 15.93)"><foreignobject style="--ltx-fo-width:36.91em;--ltx-fo-height:7.76em;--ltx-fo-depth:0.16em;font-size:10pt;" height="109.47" overflow="visible" transform="matrix(1 0 0 -1 0 107.31)" width="510.73"><span class="ltx_foreignobject_container"><span class="ltx_foreignobject_content">
<span id="A8.SS2.p4.pic1.1" class="ltx_inline-block ltx_minipage ltx_align_bottom" style="width:36.91em;">
<span id="A8.SS2.p4.pic1.1.1" class="ltx_p"><span id="A8.SS2.p4.pic1.1.1.1" class="ltx_text ltx_font_sansserif" style="font-size:80%;--ltx-fg-color:#000000;">Finally! I made it! The summit of Mount Everest. I’ve been training for years and years, and now it’s finally paid off. I’m on the top of the world!</span></span>
<span id="A8.SS2.p4.pic1.1.2" class="ltx_p"><span id="A8.SS2.p4.pic1.1.2.1" class="ltx_text ltx_font_sansserif" style="font-size:80%;--ltx-fg-color:#000000;">The view is absolutely incredible. I can see for miles and miles in every direction. The Himalayas stretch out before me, pristine and untouched. The air is thin, but I feel alive. I’ve never felt this way before.</span></span>
<span id="A8.SS2.p4.pic1.1.3" class="ltx_p"><span id="A8.SS2.p4.pic1.1.3.1" class="ltx_text ltx_font_sansserif" style="font-size:80%;--ltx-fg-color:#000000;">I’m at the top of the world, and there is nothing I can’t do.</span></span>
<span id="A8.SS2.p4.pic1.1.4" class="ltx_p"><span id="A8.SS2.p4.pic1.1.4.1" class="ltx_text ltx_font_sansserif" style="font-size:80%;--ltx-fg-color:#000000;">Thank you, Mount Everest, for the greatest challenge of my life.
<br class="ltx_break"></span></span>
</span></span></span></foreignobject></g></g></svg>