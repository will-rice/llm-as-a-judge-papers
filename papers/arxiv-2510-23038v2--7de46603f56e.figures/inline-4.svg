<span id="A1.F10.pic1.1.4" class="ltx_p"><span id="A1.F10.pic1.1.4.1" class="ltx_text" style="--ltx-fg-color:#000000;">Guidelines:
Please first generate a textual reasoning step before making final predictions. In the end of your response, please give a score in range 1 to 10 in the format such as <span id="A1.F10.pic1.1.4.1.1" class="ltx_text" style="--ltx-fg-color:#0000FF;">&lt;score&gt;10&lt;/score&gt;</span> to indicate the quality of the response.
