<svg id="A6.SS1.p2.pic1" class="ltx_picture" height="858.51" overflow="visible" version="1.1" viewbox="0 0 653.15 858.51" width="653.15"><g style="--ltx-stroke-color:#000000;--ltx-fill-color:#000000;" fill="#000000" stroke="#000000" stroke-width="0.4pt" transform="translate(0,858.51) matrix(1 0 0 -1 0 0)"><g style="--ltx-fill-color:#737373;" fill="#737373" fill-opacity="1.0"><path style="stroke:none" d="M 0 2.08 L 0 856.43 C 0 857.58 0.93 858.51 2.08 858.51 L 651.07 858.51 C 652.22 858.51 653.15 857.58 653.15 856.43 L 653.15 2.08 C 653.15 0.93 652.22 0 651.07 0 L 2.08 0 C 0.93 0 0 0.93 0 2.08 Z" /></g><g style="--ltx-fill-color:#FAFAFA;" fill="#FAFAFA" fill-opacity="1.0"><path style="stroke:none" d="M 0.69 2.08 L 0.69 836.95 L 652.46 836.95 L 652.46 2.08 C 652.46 1.31 651.84 0.69 651.07 0.69 L 2.08 0.69 C 1.31 0.69 0.69 1.31 0.69 2.08 Z" /></g><g style="--ltx-fill-color:#595959;" fill="#595959" fill-opacity="1.0"><path style="stroke:none" d="M 0.69 837.64 L 0.69 856.43 C 0.69 857.19 1.31 857.81 2.08 857.81 L 651.07 857.81 C 651.84 857.81 652.46 857.19 652.46 856.43 L 652.46 837.64 Z" /></g><g fill-opacity="1.0" transform="matrix(1.0 0.0 0.0 1.0 11.55 844.27)"><foreignobject style="--ltx-fo-width:39.59em;--ltx-fo-height:0.69em;--ltx-fo-depth:0.19em;font-size:10pt;" height="12.3" overflow="visible" transform="matrix(1 0 0 -1 0 9.61)" width="547.81"><span class="ltx_foreignobject_container"><span class="ltx_foreignobject_content">
<span id="A6.SS1.p2.pic1.1" class="ltx_inline-block ltx_minipage ltx_align_bottom" style="width:39.59em;">
<span id="A6.SS1.p2.pic1.1.1" class="ltx_p"><span id="A6.SS1.p2.pic1.1.1.1" class="ltx_text ltx_font_bold" style="--ltx-fg-color:#FFFFFF;">Prompt 2  Scenario planner — instantiation template</span></span>
</span></span></span></foreignobject></g><g fill-opacity="1.0" transform="matrix(1.0 0.0 0.0 1.0 11.55 13.24)"><foreignobject style="--ltx-fo-width:45.53em;--ltx-fo-height:58.85em;--ltx-fo-depth:0.22em;font-size:10pt;" height="817.32" overflow="visible" transform="matrix(1 0 0 -1 0 814.25)" width="630.01"><span class="ltx_foreignobject_container"><span class="ltx_foreignobject_content">
<span id="A6.SS1.p2.pic1.2" class="ltx_inline-block ltx_minipage ltx_align_bottom" style="width:45.53em;">
<span id="A6.SS1.p2.pic1.2.1" class="ltx_p"><span id="A6.SS1.p2.pic1.2.1.1" class="ltx_text ltx_font_bold" style="--ltx-fg-color:#000000;">Purpose:<span id="A6.SS1.p2.pic1.2.1.1.1" class="ltx_text ltx_font_medium"> binds one sampled design cell and its task grounding into the planner call</span></span></span>
<span id="A6.SS1.p2.pic1.2.2" class="ltx_p"><span id="A6.SS1.p2.pic1.2.2.1" class="ltx_text ltx_font_bold" style="--ltx-fg-color:#000000;">Input:<span id="A6.SS1.p2.pic1.2.2.1.1" class="ltx_text ltx_font_medium"> sampled (scenario relation, error subtype, state relation), targeted evidence form and distance, a Schema-Guided Dialogue (SGD) anchor chain</span></span></span>
<span id="A6.SS1.p2.pic1.2.3" class="ltx_p"><span id="A6.SS1.p2.pic1.2.3.1" class="ltx_text ltx_font_bold" style="--ltx-fg-color:#000000;">Output:<span id="A6.SS1.p2.pic1.2.3.1.1" class="ltx_text ltx_font_medium"> consumed under the system prompt of Prompt <a href="#A6.SS1" title="F.1 Generation Pipeline ‣ Appendix F Prompt System ‣ PersEvalBench: Can LLM Evaluators Judge Contextually Appropriate Use of Persona Information?" class="ltx_ref"><span class="ltx_text ltx_ref_tag">F.1</span></a></span></span></span>
<span id="A6.SS1.p2.pic1.2.4" class="ltx_p"><span id="A6.SS1.p2.pic1.2.4.1" class="ltx_text ltx_font_bold" style="--ltx-fg-color:#000000;">Required combination<span id="A6.SS1.p2.pic1.2.4.1.1" class="ltx_text ltx_font_medium"> — <span id="A6.SS1.p2.pic1.2.4.1.1.1" class="ltx_text ltx_font_italic">the design cell is fixed by sampling; the model cannot change it</span></span></span></span><span class="ltx_rule" style="width:100%;height:0.3pt;--ltx-fg-color:#999999;--ltx-bg-color:#999999;display:inline-block;"> </span>
<span id="A6.SS1.p2.pic1.2.5" class="ltx_p ltx_align_left"><span id="A6.SS1.p2.pic1.2.5.1" class="ltx_text ltx_font_typewriter" style="--ltx-fg-color:#000000;">Design a benchmark scenario with these constraints:</span></span>
<span id="A6.SS1.p2.pic1.2.6" class="ltx_p ltx_align_left"><span id="A6.SS1.p2.pic1.2.6.1" class="ltx_text ltx_font_typewriter" style="--ltx-fg-color:#000000;">- Scene type: {scenario_relation}</span></span>
<span id="A6.SS1.p2.pic1.2.7" class="ltx_p ltx_align_left"><span id="A6.SS1.p2.pic1.2.7.1" class="ltx_text ltx_font_typewriter" style="--ltx-fg-color:#000000;">- Error pattern: {error_subtype} (withhold-A: the ERROR response ignores or weakens A / apply-B: the ERROR response actively uses B)</span></span>
<span id="A6.SS1.p2.pic1.2.8" class="ltx_p ltx_align_left"><span id="A6.SS1.p2.pic1.2.8.1" class="ltx_text ltx_font_typewriter" style="--ltx-fg-color:#000000;">- Preference relation: {state_relation_description}</span></span>
<span id="A6.SS1.p2.pic1.2.9" class="ltx_p ltx_align_left"><span id="A6.SS1.p2.pic1.2.9.1" class="ltx_text ltx_font_typewriter" style="--ltx-fg-color:#000000;">- Preference expression: {explicit / implicit / accumulated}</span></span>
<span id="A6.SS1.p2.pic1.2.10" class="ltx_p ltx_align_left"><span id="A6.SS1.p2.pic1.2.10.1" class="ltx_text ltx_font_typewriter" style="--ltx-fg-color:#000000;">- Evidence distance: {near / medium / far}</span></span>
<span id="A6.SS1.p2.pic1.2.11" class="ltx_p"><span id="A6.SS1.p2.pic1.2.11.1" class="ltx_text ltx_font_bold" style="--ltx-fg-color:#000000;">Task grounding<span id="A6.SS1.p2.pic1.2.11.1.1" class="ltx_text ltx_font_medium"> — <span id="A6.SS1.p2.pic1.2.11.1.1.1" class="ltx_text ltx_font_italic">realistic task structure from Schema-Guided Dialogue anchors; grounding does not determine the label</span></span></span></span><span class="ltx_rule" style="width:100%;height:0.3pt;--ltx-fg-color:#999999;--ltx-bg-color:#999999;display:inline-block;"> </span>
<span id="A6.SS1.p2.pic1.2.12" class="ltx_p ltx_align_left"><span id="A6.SS1.p2.pic1.2.12.1" class="ltx_text ltx_font_typewriter" style="--ltx-fg-color:#000000;">SGD anchor chain (adapt domains and tasks creatively):</span></span>
<span id="A6.SS1.p2.pic1.2.13" class="ltx_p ltx_align_left"><span id="A6.SS1.p2.pic1.2.13.1" class="ltx_text ltx_font_typewriter" style="--ltx-fg-color:#000000;">Episode 1: domain &quot;{domain_1}&quot;; context &quot;{subdomain_1}&quot;; example request &quot;{surface_request_1}&quot;</span></span>
<span id="A6.SS1.p2.pic1.2.14" class="ltx_p ltx_align_left"><span id="A6.SS1.p2.pic1.2.14.1" class="ltx_text ltx_font_typewriter" style="--ltx-fg-color:#000000;">-&gt; causal link to next episode: [{link_type}] {link_description}</span></span>
<span id="A6.SS1.p2.pic1.2.15" class="ltx_p ltx_align_left"><span id="A6.SS1.p2.pic1.2.15.1" class="ltx_text ltx_font_typewriter" style="--ltx-fg-color:#000000;">Episode 2: domain &quot;{domain_2}&quot;; context &quot;{subdomain_2}&quot;; example request &quot;{surface_request_2}&quot;</span></span>
<span id="A6.SS1.p2.pic1.2.16" class="ltx_p"><span id="A6.SS1.p2.pic1.2.16.1" class="ltx_text ltx_font_bold" style="--ltx-fg-color:#000000;">Scene structure<span id="A6.SS1.p2.pic1.2.16.1.1" class="ltx_text ltx_font_medium"> — <span id="A6.SS1.p2.pic1.2.16.1.1.1" class="ltx_text ltx_font_italic">relation-specific episode plan, selected by the sampled scenario relation</span></span></span></span><span class="ltx_rule" style="width:100%;height:0.3pt;--ltx-fg-color:#999999;--ltx-bg-color:#999999;display:inline-block;"> </span>
<span id="A6.SS1.p2.pic1.2.17" class="ltx_p ltx_align_left"><span id="A6.SS1.p2.pic1.2.17.1" class="ltx_text ltx_font_typewriter" style="--ltx-fg-color:#000000;">{relation-specific episode plan; e.g., for same-episode re-entry:</span></span>
<span id="A6.SS1.p2.pic1.2.18" class="ltx_p ltx_align_left"><span id="A6.SS1.p2.pic1.2.18.1" class="ltx_text ltx_font_typewriter" style="--ltx-fg-color:#000000;">E1: the user works on a task in domain X; State A is established.</span></span>
<span id="A6.SS1.p2.pic1.2.19" class="ltx_p ltx_align_left"><span id="A6.SS1.p2.pic1.2.19.1" class="ltx_text ltx_font_typewriter" style="--ltx-fg-color:#000000;">E2: the user switches to a related task in domain Y; State B appears.</span></span>
<span id="A6.SS1.p2.pic1.2.20" class="ltx_p ltx_align_left"><span id="A6.SS1.p2.pic1.2.20.1" class="ltx_text ltx_font_typewriter" style="--ltx-fg-color:#000000;">E3: the user returns to E1’s unfinished task; the target turn is here.}</span></span>
<span id="A6.SS1.p2.pic1.2.21" class="ltx_p"><span id="A6.SS1.p2.pic1.2.21.1" class="ltx_text ltx_font_bold" style="--ltx-fg-color:#000000;">Requirements<span id="A6.SS1.p2.pic1.2.21.1.1" class="ltx_text ltx_font_medium"> — <span id="A6.SS1.p2.pic1.2.21.1.1.1" class="ltx_text ltx_font_italic">binds evidence realization, decoy plausibility, and scenario coherence</span></span></span></span><span class="ltx_rule" style="width:100%;height:0.3pt;--ltx-fg-color:#999999;--ltx-bg-color:#999999;display:inline-block;"> </span>
<span id="A6.SS1.p2.pic1.2.22" class="ltx_p ltx_align_left"><span id="A6.SS1.p2.pic1.2.22.1" class="ltx_text ltx_font_typewriter" style="--ltx-fg-color:#000000;">1. State A must be expressed in the &quot;{preference_expression}&quot; style (explicit: stated directly; implicit: inferred from a single choice, rejection, or comparison; accumulated: requires connecting two or more scattered signals).</span></span>
<span id="A6.SS1.p2.pic1.2.23" class="ltx_p ltx_align_left"><span id="A6.SS1.p2.pic1.2.23.1" class="ltx_text ltx_font_typewriter" style="--ltx-fg-color:#000000;">2. Evidence distance must be &quot;{evidence_distance}&quot; (near: A expressed 0--1 episodes before the target; medium: 2--4 episodes before; far: 5+ exchanges before, early in the conversation).</span></span>
<span id="A6.SS1.p2.pic1.2.24" class="ltx_p ltx_align_left"><span id="A6.SS1.p2.pic1.2.24.1" class="ltx_text ltx_font_typewriter" style="--ltx-fg-color:#000000;">3. The causal chain must make B look plausibly applicable to the target.</span></span>
<span id="A6.SS1.p2.pic1.2.25" class="ltx_p ltx_align_left"><span id="A6.SS1.p2.pic1.2.25.1" class="ltx_text ltx_font_typewriter" style="--ltx-fg-color:#000000;">4. Include a neutral distractor option that does not clearly favor either A or B.</span></span>
<span id="A6.SS1.p2.pic1.2.26" class="ltx_p ltx_align_left"><span id="A6.SS1.p2.pic1.2.26.1" class="ltx_text ltx_font_typewriter" style="--ltx-fg-color:#000000;">5. The total conversation should span 20--30 turns.</span></span>
<span id="A6.SS1.p2.pic1.2.27" class="ltx_p ltx_align_left"><span id="A6.SS1.p2.pic1.2.27.1" class="ltx_text ltx_font_typewriter" style="--ltx-fg-color:#000000;">Return a single JSON object with all required fields. No text outside the JSON.</span></span>
</span></span></span></foreignobject></g></g></svg>