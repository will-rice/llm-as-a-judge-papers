e="#000000" transform="matrix(1.0 0.0 0.0 1.0 23.9 183.14)"><foreignobject style="--ltx-fo-width:58.33em;--ltx-fo-height:0.69em;--ltx-fo-depth:14.4em;font-size:10pt;" height="208.75" overflow="visible" transform="matrix(1 0 0 -1 0 9.49)" width="807.12"><span class="ltx_foreignobject_container"><span class="ltx_foreignobject_content">
