<svg id="A3.SS4.p3.pic1" class="ltx_picture" height="162.4" overflow="visible" version="1.1" viewbox="0 0 653.15 162.4" width="653.15"><g style="--ltx-stroke-color:#000000;--ltx-fill-color:#000000;" fill="#000000" stroke="#000000" stroke-width="0.4pt" transform="translate(0,162.4) matrix(1 0 0 -1 0 0)"><g style="--ltx-fill-color:#000000;" fill="#000000" fill-opacity="1.0"><path style="stroke:none" d="M 0 5.91 L 0 156.49 C 0 159.75 2.64 162.4 5.91 162.4 L 647.24 162.4 C 650.51 162.4 653.15 159.75 653.15 156.49 L 653.15 5.91 C 653.15 2.64 650.51 0 647.24 0 L 5.91 0 C 2.64 0 0 2.64 0 5.91 Z" /></g><g style="--ltx-fill-color:#FFFFFF;" fill="#FFFFFF" fill-opacity="1.0"><path style="stroke:none" d="M 1.97 5.91 L 1.97 120.91 L 651.18 120.91 L 651.18 5.91 C 651.18 3.73 649.42 1.97 647.24 1.97 L 5.91 1.97 C 3.73 1.97 1.97 3.73 1.97 5.91 Z" /></g><g fill-opacity="1.0" transform="matrix(1.0 0.0 0.0 1.0 21.65 129.51)"><foreignobject style="--ltx-fo-width:44.07em;--ltx-fo-height:1.95em;--ltx-fo-depth:0.19em;font-size:10pt;" height="29.67" overflow="visible" transform="matrix(1 0 0 -1 0 26.98)" width="609.8"><span class="ltx_foreignobject_container"><span class="ltx_foreignobject_content">
<span id="A3.SS4.p3.pic1.1" class="ltx_inline-block ltx_minipage ltx_align_bottom" style="width:44.07em;">
<span id="A3.SS4.p3.pic1.1.1" class="ltx_p"><span id="A3.SS4.p3.pic1.1.1.1" class="ltx_text" style="--ltx-fg-color:#FFFFFF;">System prompt for listwise judgment (<math id="A3.SS4.p3.pic1.m1" class="ltx_Math" alttext="N=7" display="inline" intent=":literal"><semantics><mrow><mi style="--ltx-fg-color:#FFFFFF;" mathcolor="#FFFFFF">N</mi><mo style="--ltx-fg-color:#FFFFFF;" mathcolor="#FFFFFF">=</mo><mn style="--ltx-fg-color:#FFFFFF;" mathcolor="#FFFFFF">7</mn></mrow><annotation encoding="application/x-tex">N=7</annotation></semantics></math>), <span id="A3.SS4.p3.pic1.1.1.1.1" class="ltx_text" style="--ltx-fg-color:#FF00FF;">without intermediate pairwise preferences</span></span></span>
</span></span></span></foreignobject></g><g fill-opacity="1.0" transform="matrix(1.0 0.0 0.0 1.0 21.65 16.47)"><foreignobject style="--ltx-fo-width:44.07em;--ltx-fo-height:6.69em;--ltx-fo-depth:0.19em;font-size:10pt;" height="95.32" overflow="visible" transform="matrix(1 0 0 -1 0 92.63)" width="609.8"><span class="ltx_foreignobject_container"><span class="ltx_foreignobject_content">
<span id="A3.SS4.p3.pic1.2" class="ltx_inline-block ltx_minipage ltx_align_bottom" style="width:44.07em;">
<span id="A3.SS4.p3.pic1.2.1" class="ltx_p"><span id="A3.SS4.p3.pic1.2.1.1" class="ltx_text ltx_verbatim ltx_inline-block" style="width:440.7pt;--ltx-fg-color:#000000;">We are interested in ranking different large language model chat completions to a conversation. Please act as an impartial judge and evaluate the quality of the completions provided by the 7 AI assistants. Your evaluation should consider factors such as the helpfulness, relevance, accuracy, depth, creativity, level of detail, and ethicality of their responses.</span></span>
<span id="A3.SS4.p3.pic1.2.2" class="ltx_p" style="width:440.7pt;"><span id="A3.SS4.p3.pic1.2.2.1" class="ltx_text ltx_verbatim ltx_inline-block" style="width:440.7pt;"></span></span>
<span id="A3.SS4.p3.pic1.2.3" class="ltx_p" style="width:440.7pt;"><span id="A3.SS4.p3.pic1.2.3.1" class="ltx_text ltx_verbatim ltx_inline-block" style="width:440.7pt;--ltx-fg-color:#000000;">Please rank all 7 responses from best to worst (breaking ties randomly), strictly in the following format: [[_, _, _, _, _, _, _]] where ’_’ contains an assistant’s letter name.</span></span>
<span id="A3.SS4.p3.pic1.2.4" class="ltx_p" style="width:440.7pt;"><span id="A3.SS4.p3.pic1.2.4.1" class="ltx_text ltx_verbatim ltx_inline-block" style="width:440.7pt;"></span></span>
<span id="A3.SS4.p3.pic1.2.5" class="ltx_p" style="width:440.7pt;"><span id="A3.SS4.p3.pic1.2.5.1" class="ltx_text ltx_verbatim ltx_inline-block" style="width:440.7pt;--ltx-fg-color:#000000;">Avoid any position biases and ensure that the order in which the responses were presented does not influence your decision. Do not allow the length of the responses to influence your evaluation. Do not favor certain names of the assistants. Be as objective as possible.</span></span>
</span></span></span></foreignobject></g></g></svg>