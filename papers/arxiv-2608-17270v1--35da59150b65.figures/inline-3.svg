<span id="S3.SS5.p2.pic1.2" class="ltx_inline-block ltx_minipage ltx_align_bottom" style="width:38.39em;">
<span id="S3.SS5.p2.pic1.2.1" class="ltx_p"><span id="S3.SS5.p2.pic1.2.1.1" class="ltx_text" style="font-size:80%;--ltx-fg-color:#000000;">You are a scientific research assistant. Your task is to evaluate a set of hypotheses for a given research question and background, then identify the top 5 most plausible and well-supported hypotheses.
<br class="ltx_break" style="--ltx-break-space:4.0pt;">
## Background
<br class="ltx_break">[background survey]
<br class="ltx_break" style="--ltx-break-space:4.0pt;">
## Research Question
<br class="ltx_break">[research question]
<br class="ltx_break" style="--ltx-break-space:4.0pt;">
## Hypotheses
<br class="ltx_break">[indexed list of all 16 candidate hypotheses]
<br class="ltx_break" style="--ltx-break-space:4.0pt;">
## Instructions
<br class="ltx_break">- Carefully read each hypothesis.
<br class="ltx_break">- Rank all 16 hypotheses from most to least plausible given the background and research question.
<br class="ltx_break">- Return ONLY a JSON object in this exact format, with no extra text:
<br class="ltx_break" style="--ltx-break-space:4.0pt;">
{”ranking”: [rank-1 index, rank-2 index, rank-3 index, rank-4 index, rank-5 index]}
<br class="ltx_break" style="--ltx-break-space:4.0pt;">
The indices must be integers from 0 to 15. Return only the top 5.</span></span>
