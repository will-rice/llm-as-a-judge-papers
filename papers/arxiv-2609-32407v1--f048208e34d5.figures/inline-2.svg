<span id="A1.SS6.p2.pic1.2.1" class="ltx_p"><span id="A1.SS6.p2.pic1.2.1.1" class="ltx_text ltx_font_sansserif ltx_font_bold" style="--ltx-fg-color:#000000;">input</span><span id="A1.SS6.p2.pic1.2.1.2" class="ltx_text" style="--ltx-fg-color:#000000;"> frozen judge <math id="A1.SS6.p2.pic1.m1" class="ltx_Math" alttext="J" display="inline" intent=":literal"><semantics><mi style="--ltx-fg-color:#000000;" mathcolor="#000000">J</mi><annotation encoding="application/x-tex">J</annotation></semantics></math>; items <math id="A1.SS6.p2.pic1.m2" class="ltx_Math" alttext="\{(q,a_{A},a_{B})\}" display="inline" intent=":literal"><semantics><mrow><mo style="--ltx-fg-color:#000000;" mathcolor="#000000" stretchy="false">{</mo><mrow><mo style="--ltx-fg-color:#000000;" mathcolor="#000000" stretchy="false">(</mo><mi style="--ltx-fg-color:#000000;" mathcolor="#000000">q</mi><mo style="--ltx-fg-color:#000000;" mathcolor="#000000">,</mo><msub><mi style="--ltx-fg-color:#000000;" mathcolor="#000000">a</mi><mi style="--ltx-fg-color:#000000;" mathcolor="#000000">A</mi></msub><mo style="--ltx-fg-color:#000000;" mathcolor="#000000">,</mo><msub><mi style="--ltx-fg-color:#000000;" mathcolor="#000000">a</mi><mi style="--ltx-fg-color:#000000;" mathcolor="#000000">B</mi></msub><mo style="--ltx-fg-color:#000000;" mathcolor="#000000" stretchy="false">)</mo></mrow><mo style="--ltx-fg-color:#000000;" mathcolor="#000000" stretchy="false">}</mo></mrow><annotation encoding="application/x-tex">\{(q,a_{A},a_{B})\}</annotation></semantics></math>; labels <math id="A1.SS6.p2.pic1.m3" class="ltx_Math" alttext="\mathcal{L}" display="inline" intent=":literal"><semantics><mi style="--ltx-fg-color:#000000;" class="ltx_font_mathcaligraphic" mathcolor="#000000">ℒ</mi><annotation encoding="application/x-tex">\mathcal{L}</annotation></semantics></math>; threshold <math id="A1.SS6.p2.pic1.m4" class="ltx_Math" alttext="\tau" display="inline" intent=":literal"><semantics><mi style="--ltx-fg-color:#000000;" mathcolor="#000000">τ</mi><annotation encoding="application/x-tex">\tau</annotation></semantics></math> 
<br class="ltx_break"><span id="A1.SS6.p2.pic1.2.1.2.1" class="ltx_text ltx_font_sansserif ltx_font_bold">output</span> preference <math id="A1.SS6.p2.pic1.m5" class="ltx_Math" alttext="\hat{y}" display="inline" intent=":literal"><semantics><mover accent="true"><mi style="--ltx-fg-color:#000000;" mathcolor="#000000">y</mi><mo style="--ltx-fg-color:#000000;" mathcolor="#000000">^</mo></mover><annotation encoding="application/x-tex">\hat{y}</annotation></semantics></math> and confidence <math id="A1.SS6.p2.pic1.m6" class="ltx_Math" alttext="c" display="inline" intent=":literal"><semantics><mi style="--ltx-fg-color:#000000;" mathcolor="#000000">c</mi><annotation encoding="application/x-tex">c</annotation></semantics></math> per item 
<br class="ltx_break" style="--ltx-break-space:2.0pt;">
<span class="ltx_rule" style="width:382.5pt;height:0.4pt;--ltx-bg-color:black;display:inline-block;"> </span>
<br class="ltx_break" style="--ltx-break-space:2.0pt;">
<span id="A1.SS6.p2.pic1.2.1.2.2" class="ltx_text ltx_font_sansserif ltx_font_bold" style="--ltx-fg-color:#34495E;">0  trigger</span> fit a surface-only probe on <math id="A1.SS6.p2.pic1.m7" class="ltx_Math" alttext="\mathcal{L}" display="inline" intent=":literal"><semantics><mi style="--ltx-fg-color:#000000;" class="ltx_font_mathcaligraphic" mathcolor="#000000">ℒ</mi><annotation encoding="application/x-tex">\mathcal{L}</annotation></semantics></math>; <math id="A1.SS6.p2.pic1.m8" class="ltx_Math" alttext="\mathrm{cf}\!\leftarrow" display="inline" intent=":literal"><semantics><mrow><mi style="--ltx-fg-color:#000000;" mathcolor="#000000">cf</mi><mo style="--ltx-fg-color:#000000;" lspace="0.108em" mathcolor="#000000" stretchy="false">←</mo><mphantom></mphantom></mrow><annotation encoding="application/x-tex">\mathrm{cf}\!\leftarrow</annotation></semantics></math> its CV accuracy
<br class="ltx_break">    <span id="A1.SS6.p2.pic1.2.1.2.3" class="ltx_text ltx_font_sansserif ltx_font_bold" style="--ltx-fg-color:#34495E;">if</span> <math id="A1.SS6.p2.pic1.m9" class="ltx_Math" alttext="\mathrm{cf}\!&lt;\!\tau" display="inline" intent=":literal"><semantics><mrow><mi style="--ltx-fg-color:#000000;" mathcolor="#000000">cf</mi><mo style="--ltx-fg-color:#000000;" lspace="0.108em" mathcolor="#000000" rspace="0.108em">&lt;</mo><mi style="--ltx-fg-color:#000000;" mathcolor="#000000">τ</mi></mrow><annotation encoding="application/x-tex">\mathrm{cf}\!&lt;\!\tau</annotation></semantics></math> <span id="A1.SS6.p2.pic1.2.1.2.4" class="ltx_text ltx_font_sansserif ltx_font_bold" style="--ltx-fg-color:#34495E;">then</span> return the order-averaged verdict and stop
<br class="ltx_break">    <span id="A1.SS6.p2.pic1.2.1.2.5" class="ltx_text" style="--ltx-fg-color:#7A8590;">// <math id="A1.SS6.p2.pic1.m10" class="ltx_Math" alttext="\tau\!=\!0.75" display="inline" intent=":literal"><semantics><mrow><mi style="--ltx-fg-color:#7A8590;" mathcolor="#7A8590">τ</mi><mo style="--ltx-fg-color:#7A8590;" lspace="0.108em" mathcolor="#7A8590">=</mo><mn style="--ltx-fg-color:#7A8590;" mathcolor="#7A8590">0.75</mn></mrow><annotation encoding="application/x-tex">\tau\!=\!0.75</annotation></semantics></math> is a rule of thumb from our eight benchmarks; recheck it on new settings
<br class="ltx_break" style="--ltx-break-space:1.5pt;"></span>
<span id="A1.SS6.p2.pic1.2.1.2.6" class="ltx_text ltx_font_sansserif ltx_font_bold" style="--ltx-fg-color:#34495E;">1  read</span>  <span id="A1.SS6.p2.pic1.2.1.2.7" class="ltx_text ltx_font_sansserif ltx_font_bold" style="--ltx-fg-color:#34495E;">for</span> <math id="A1.SS6.p2.pic1.m11" class="ltx_Math" alttext="o\in\{AB,BA\}" display="inline" intent=":literal"><semantics><mrow><mi style="--ltx-fg-color:#000000;" mathcolor="#000000">o</mi><mo style="--ltx-fg-color:#000000;" mathcolor="#000000">∈</mo><mrow><mo style="--ltx-fg-color:#000000;" mathcolor="#000000" stretchy="false">{</mo><mrow><mrow><mi style="--ltx-fg-color:#000000;" mathcolor="#000000">A</mi><mo lspace="0em" rspace="0em">​</mo><mi style="--ltx-fg-color:#000000;" mathcolor="#000000">B</mi></mrow><mo style="--ltx-fg-color:#000000;" mathcolor="#000000">,</mo><mrow><mi style="--ltx-fg-color:#000000;" mathcolor="#000000">B</mi><mo lspace="0em" rspace="0em">​</mo><mi style="--ltx-fg-color:#000000;" mathcolor="#000000">A</mi></mrow></mrow><mo style="--ltx-fg-color:#000000;" mathcolor="#000000" stretchy="false">}</mo></mrow></mrow><annotation encoding="application/x-tex">o\in\{AB,BA\}</annotation></semantics></math>: run <math id="A1.SS6.p2.pic1.m12" class="ltx_Math" alttext="J" display="inline" intent=":literal"><semantics><mi style="--ltx-fg-color:#000000;" mathcolor="#000000">J</mi><annotation encoding="application/x-tex">J</annotation></semantics></math>; cache residual <math id="A1.SS6.p2.pic1.m13" class="ltx_Math" alttext="h_{\ell}" display="inline" intent=":literal"><semantics><msub><mi style="--ltx-fg-color:#000000;" mathcolor="#000000">h</mi><mi style="--ltx-fg-color:#000000;" mathcolor="#000000" mathvariant="normal">ℓ</mi></msub><annotation encoding="application/x-tex">h_{\ell}</annotation></semantics></math> at the
<br class="ltx_break">    decision position <math id="A1.SS6.p2.pic1.m14" class="ltx_Math" alttext="\forall\ell" display="inline" intent=":literal"><semantics><mrow><mo style="--ltx-fg-color:#000000;" mathcolor="#000000" rspace="0.167em">∀</mo><mi style="--ltx-fg-color:#000000;" mathcolor="#000000" mathvariant="normal">ℓ</mi></mrow><annotation encoding="application/x-tex">\forall\ell</annotation></semantics></math>;  <math id="A1.SS6.p2.pic1.m15" class="ltx_Math" alttext="\hat{v}_{\ell}\!\leftarrow\!\mathrm{Unembed}(\mathrm{LN}_{f}(h_{\ell}))" display="inline" intent=":literal"><semantics><mrow><msub><mover accent="true"><mi style="--ltx-fg-color:#000000;" mathcolor="#000000">v</mi><mo style="--ltx-fg-color:#000000;" mathcolor="#000000">^</mo></mover><mi style="--ltx-fg-color:#000000;" mathcolor="#000000" mathvariant="normal">ℓ</mi></msub><mo style="--ltx-fg-color:#000000;" lspace="0.108em" mathcolor="#000000" rspace="0.108em" stretchy="false">←</mo><mrow><mi style="--ltx-fg-color:#000000;" mathcolor="#000000">Unembed</mi><mo>⁡</mo><mrow><mo style="--ltx-fg-color:#000000;" mathcolor="#000000" stretchy="false">(</mo><mrow><msub><mi style="--ltx-fg-color:#000000;" mathcolor="#000000">LN</mi><mi style="--ltx-fg-color:#000000;" mathcolor="#000000">f</mi></msub><mo lspace="0em" rspace="0em">​</mo><mrow><mo style="--ltx-fg-color:#000000;" mathcolor="#000000" stretchy="false">(</mo><msub><mi style="--ltx-fg-color:#000000;" mathcolor="#000000">h</mi><mi style="--ltx-fg-color:#000000;" mathcolor="#000000" mathvariant="normal">ℓ</mi></msub><mo style="--ltx-fg-color:#000000;" mathcolor="#000000" stretchy="false">)</mo></mrow></mrow><mo style="--ltx-fg-color:#000000;" mathcolor="#000000" stretchy="false">)</mo></mrow></mrow></mrow><annotation encoding="application/x-tex">\hat{v}_{\ell}\!\leftarrow\!\mathrm{Unembed}(\mathrm{LN}_{f}(h_{\ell}))</annotation></semantics></math>
<br class="ltx_break" style="--ltx-break-space:1.5pt;">
<span id="A1.SS6.p2.pic1.2.1.2.8" class="ltx_text ltx_font_sansserif ltx_font_bold" style="--ltx-fg-color:#34495E;">2  debias</span> order-average features over <math id="A1.SS6.p2.pic1.m16" class="ltx_Math" alttext="o" display="inline" intent=":literal"><semantics><mi style="--ltx-fg-color:#000000;" mathcolor="#000000">o</mi><annotation encoding="application/x-tex">o</annotation></semantics></math>  <span id="A1.SS6.p2.pic1.2.1.2.9" class="ltx_text" style="--ltx-fg-color:#7A8590;">// cancels position bias
<br class="ltx_break" style="--ltx-break-space:1.5pt;"></span>
<span id="A1.SS6.p2.pic1.2.1.2.10" class="ltx_text ltx_font_sansserif ltx_font_bold" style="--ltx-fg-color:#34495E;">3  featurize</span> <math id="A1.SS6.p2.pic1.m17" class="ltx_Math" alttext="\phi\!\leftarrow\![\hat{v}_{\ell}]_{\ell}" display="inline" intent=":literal"><semantics><mrow><mi style="--ltx-fg-color:#000000;" mathcolor="#000000">ϕ</mi><mo style="--ltx-fg-color:#000000;" lspace="0.108em" mathcolor="#000000" rspace="0.108em" stretchy="false">←</mo><msub><mrow><mo style="--ltx-fg-color:#000000;" mathcolor="#000000" stretchy="false">[</mo><msub><mover accent="true"><mi style="--ltx-fg-color:#000000;" mathcolor="#000000">v</mi><mo style="--ltx-fg-color:#000000;" mathcolor="#000000">^</mo></mover><mi style="--ltx-fg-color:#000000;" mathcolor="#000000" mathvariant="normal">ℓ</mi></msub><mo style="--ltx-fg-color:#000000;" mathcolor="#000000" stretchy="false">]</mo></mrow><mi style="--ltx-fg-color:#000000;" mathcolor="#000000" mathvariant="normal">ℓ</mi></msub></mrow><annotation encoding="application/x-tex">\phi\!\leftarrow\![\hat{v}_{\ell}]_{\ell}</annotation></semantics></math> <em id="A1.SS6.p2.pic1.2.1.2.11" class="ltx_emph ltx_font_italic">(lens)</em>  <span id="A1.SS6.p2.pic1.2.1.2.12" class="ltx_text ltx_font_sansserif ltx_font_bold" style="--ltx-fg-color:#34495E;">or</span> <math id="A1.SS6.p2.pic1.m18" class="ltx_Math" alttext="\phi\!\leftarrow\!\mathrm{PCA}_{48}(\Delta h_{\ell})" display="inline" intent=":literal"><semantics><mrow><mi style="--ltx-fg-color:#000000;" mathcolor="#000000">ϕ</mi><mo style="--ltx-fg-color:#000000;" lspace="0.108em" mathcolor="#000000" rspace="0.108em" stretchy="false">←</mo><mrow><msub><mi style="--ltx-fg-color:#000000;" mathcolor="#000000">PCA</mi><mn style="--ltx-fg-color:#000000;" mathcolor="#000000">48</mn></msub><mo lspace="0em" rspace="0em">​</mo><mrow><mo style="--ltx-fg-color:#000000;" mathcolor="#000000" stretchy="false">(</mo><mrow><mi style="--ltx-fg-color:#000000;" mathcolor="#000000" mathvariant="normal">Δ</mi><mo lspace="0em" rspace="0em">​</mo><msub><mi style="--ltx-fg-color:#000000;" mathcolor="#000000">h</mi><mi style="--ltx-fg-color:#000000;" mathcolor="#000000" mathvariant="normal">ℓ</mi></msub></mrow><mo style="--ltx-fg-color:#000000;" mathcolor="#000000" stretchy="false">)</mo></mrow></mrow></mrow><annotation encoding="application/x-tex">\phi\!\leftarrow\!\mathrm{PCA}_{48}(\Delta h_{\ell})</annotation></semantics></math> <em id="A1.SS6.p2.pic1.2.1.2.13" class="ltx_emph ltx_font_italic">(resid.)</em>
<br class="ltx_break" style="--ltx-break-space:1.5pt;">
<span id="A1.SS6.p2.pic1.2.1.2.14" class="ltx_text ltx_font_sansserif ltx_font_bold" style="--ltx-fg-color:#34495E;">4  fit</span>    <math id="A1.SS6.p2.pic1.m19" class="ltx_Math" alttext="g\!\leftarrow\!L_{2}" display="inline" intent=":literal"><semantics><mrow><mi style="--ltx-fg-color:#000000;" mathcolor="#000000">g</mi><mo style="--ltx-fg-color:#000000;" lspace="0.108em" mathcolor="#000000" rspace="0.108em" stretchy="false">←</mo><msub><mi style="--ltx-fg-color:#000000;" mathcolor="#000000">L</mi><mn style="--ltx-fg-color:#000000;" mathcolor="#000000">2</mn></msub></mrow><annotation encoding="application/x-tex">g\!\leftarrow\!L_{2}</annotation></semantics></math>-logistic probe on <math id="A1.SS6.p2.pic1.m20" class="ltx_Math" alttext="(\phi,y),\,\mathcal{L}" display="inline" intent=":literal"><semantics><mrow><mrow><mo style="--ltx-fg-color:#000000;" mathcolor="#000000" stretchy="false">(</mo><mi style="--ltx-fg-color:#000000;" mathcolor="#000000">ϕ</mi><mo style="--ltx-fg-color:#000000;" mathcolor="#000000">,</mo><mi style="--ltx-fg-color:#000000;" mathcolor="#000000">y</mi><mo style="--ltx-fg-color:#000000;" mathcolor="#000000" stretchy="false">)</mo></mrow><mo style="--ltx-fg-color:#000000;" mathcolor="#000000" rspace="0.337em">,</mo><mi style="--ltx-fg-color:#000000;" class="ltx_font_mathcaligraphic" mathcolor="#000000">ℒ</mi></mrow><annotation encoding="application/x-tex">(\phi,y),\,\mathcal{L}</annotation></semantics></math>  <span id="A1.SS6.p2.pic1.2.1.2.15" class="ltx_text" style="--ltx-fg-color:#7A8590;">// 5-fold CV + shuffle ctrl
<br class="ltx_break" style="--ltx-break-space:1.5pt;"></span>
<span id="A1.SS6.p2.pic1.2.1.2.16" class="ltx_text ltx_font_sansserif ltx_font_bold" style="--ltx-fg-color:#34495E;">5  predict</span> <math id="A1.SS6.p2.pic1.m21" class="ltx_Math" alttext="\hat{y}\!\leftarrow\!g(\phi)" display="inline" intent=":literal"><semantics><mrow><mover accent="true"><mi style="--ltx-fg-color:#000000;" mathcolor="#000000">y</mi><mo style="--ltx-fg-color:#000000;" mathcolor="#000000">^</mo></mover><mo style="--ltx-fg-color:#000000;" lspace="0.108em" mathcolor="#000000" rspace="0.108em" stretchy="false">←</mo><mrow><mi style="--ltx-fg-color:#000000;" mathcolor="#000000">g</mi><mo>⁡</mo><mrow><mo style="--ltx-fg-color:#000000;" mathcolor="#000000" stretchy="false">(</mo><mi style="--ltx-fg-color:#000000;" mathcolor="#000000">ϕ</mi><mo style="--ltx-fg-color:#000000;" mathcolor="#000000" stretchy="false">)</mo></mrow></mrow></mrow><annotation encoding="application/x-tex">\hat{y}\!\leftarrow\!g(\phi)</annotation></semantics></math>;  <math id="A1.SS6.p2.pic1.m22" class="ltx_Math" alttext="c\!\leftarrow\!|g(\phi)-\tfrac{1}{2}|" display="inline" intent=":literal"><semantics><mrow><mi style="--ltx-fg-color:#000000;" mathcolor="#000000">c</mi><mo style="--ltx-fg-color:#000000;" lspace="0.108em" mathcolor="#000000" rspace="0.108em" stretchy="false">←</mo><mrow><mo style="--ltx-fg-color:#000000;" mathcolor="#000000" stretchy="false">|</mo><mrow><mrow><mi style="--ltx-fg-color:#000000;" mathcolor="#000000">g</mi><mo>⁡</mo><mrow><mo style="--ltx-fg-color:#000000;" mathcolor="#000000" stretchy="false">(</mo><mi style="--ltx-fg-color:#000000;" mathcolor="#000000">ϕ</mi><mo style="--ltx-fg-color:#000000;" mathcolor="#000000" stretchy="false">)</mo></mrow></mrow><mo style="--ltx-fg-color:#000000;" mathcolor="#000000">−</mo><mfrac style="--ltx-fg-color:#000000;" mathcolor="#000000"><mn style="--ltx-fg-color:#000000;" mathcolor="#000000">1</mn><mn style="--ltx-fg-color:#000000;" mathcolor="#000000">2</mn></mfrac></mrow><mo style="--ltx-fg-color:#000000;" mathcolor="#000000" stretchy="false">|</mo></mrow></mrow><annotation encoding="application/x-tex">c\!\leftarrow\!|g(\phi)-\tfrac{1}{2}|</annotation></semantics></math>
<br class="ltx_break" style="--ltx-break-space:1.5pt;">
<span id="A1.SS6.p2.pic1.2.1.2.17" class="ltx_text ltx_font_sansserif ltx_font_bold" style="--ltx-fg-color:#34495E;">6  audit</span>  <span id="A1.SS6.p2.pic1.2.1.2.18" class="ltx_text ltx_font_sansserif ltx_font_bold" style="--ltx-fg-color:#34495E;">if</span> <math id="A1.SS6.p2.pic1.m23" class="ltx_Math" alttext="c&lt;\tau" display="inline" intent=":literal"><semantics><mrow><mi style="--ltx-fg-color:#000000;" mathcolor="#000000">c</mi><mo style="--ltx-fg-color:#000000;" mathcolor="#000000">&lt;</mo><mi style="--ltx-fg-color:#000000;" mathcolor="#000000">τ</mi></mrow><annotation encoding="application/x-tex">c&lt;\tau</annotation></semantics></math> <span id="A1.SS6.p2.pic1.2.1.2.19" class="ltx_text ltx_font_sansserif ltx_font_bold" style="--ltx-fg-color:#34495E;">then</span> abstain, route-to-human
