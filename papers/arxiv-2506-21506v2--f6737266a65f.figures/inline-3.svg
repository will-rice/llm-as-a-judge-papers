<svg id="A4.SS2.p6.pic1" class="ltx_picture" height="781.21" overflow="visible" version="1.1" viewbox="0 0 477.38 781.21" width="477.38"><g style="--ltx-stroke-color:#000000;--ltx-fill-color:#000000;" fill="#000000" stroke="#000000" stroke-width="0.4pt" transform="translate(0,781.21) matrix(1 0 0 -1 0 0)"><g style="--ltx-fill-color:#003B5E;" fill="#003B5E" fill-opacity="1.0"><path style="stroke:none" d="M 0 5.91 L 0 775.3 C 0 778.57 2.64 781.21 5.91 781.21 L 471.47 781.21 C 474.73 781.21 477.38 778.57 477.38 775.3 L 477.38 5.91 C 477.38 2.64 474.73 0 471.47 0 L 5.91 0 C 2.64 0 0 2.64 0 5.91 Z" /></g><g style="--ltx-fill-color:#E6F1F8;" fill="#E6F1F8" fill-opacity="1.0"><path style="stroke:none" d="M 1.97 5.91 L 1.97 755.56 L 475.41 755.56 L 475.41 5.91 C 475.41 3.73 473.65 1.97 471.47 1.97 L 5.91 1.97 C 3.73 1.97 1.97 3.73 1.97 5.91 Z" /></g><g fill-opacity="1.0" transform="matrix(1.0 0.0 0.0 1.0 21.65 764.93)"><foreignobject style="--ltx-fo-width:31.37em;--ltx-fo-height:0.75em;--ltx-fo-depth:0.25em;font-size:10pt;" height="13.84" overflow="visible" transform="matrix(1 0 0 -1 0 10.38)" width="434.07"><span class="ltx_foreignobject_container"><span class="ltx_foreignobject_content">
<span id="A4.SS2.p6.pic1.1" class="ltx_inline-block ltx_minipage ltx_align_bottom" style="width:31.37em;">
<span id="A4.SS2.p6.pic1.1.1" class="ltx_p"><span id="A4.SS2.p6.pic1.1.1.1" class="ltx_text" style="--ltx-fg-color:#FFFFFF;">Prompt for Verifier (URL-based Verification)</span></span>
</span></span></span></foreignobject></g><g fill-opacity="1.0" transform="matrix(1.0 0.0 0.0 1.0 21.65 16.89)"><foreignobject style="--ltx-fo-width:33.91em;--ltx-fo-height:52.53em;--ltx-fo-depth:0.23em;font-size:10pt;" height="729.98" overflow="visible" transform="matrix(1 0 0 -1 0 726.87)" width="469.22"><span class="ltx_foreignobject_container"><span class="ltx_foreignobject_content">
<span id="A4.SS2.p6.pic1.2" class="ltx_inline-block ltx_minipage ltx_align_bottom" style="width:33.91em;">
<span id="A4.SS2.p6.pic1.2.1" class="ltx_p"><span id="A4.SS2.p6.pic1.2.1.1" class="ltx_text" style="font-size:90%;--ltx-fg-color:#000000;">You are responsible for verifying whether a given claim or &quot;fact&quot; is fully supported by the actual content of a specified webpage (or a PDF file from a PDF webpage). For context, we are examining the correctness of an answer to a web information-gathering task. Typically, the claim or &quot;fact&quot; is extracted directly from the answer, and the webpage provided is the URL source referenced in the answer. This verification step helps us determine whether the claim or &quot;fact&quot; in the answer is accurate or hallucinated, a common issue in LLM-based systems. You will receive both the text content and a screenshot of the webpage for examination. Your task is to provide a binary judgment (i.e., supported or not supported) along with clear and detailed reasoning for your decision.</span></span>
<span id="A4.SS2.p6.pic1.2.2" class="ltx_p"><span id="A4.SS2.p6.pic1.2.2.1" class="ltx_text ltx_font_bold" style="font-size:90%;--ltx-fg-color:#000000;">GENERAL RULES:<span id="A4.SS2.p6.pic1.2.2.1.1" class="ltx_text"></span></span></span>
<span id="A4.SS2.p6.pic1.2.3" class="ltx_p"><span id="A4.SS2.p6.pic1.2.3.1" class="ltx_text" style="font-size:90%;--ltx-fg-color:#000000;">1. The provided webpage content may be lengthy. Carefully examine the relevant sections of both the webpage text and the screenshot. Determine clearly whether the claim or &quot;fact&quot; exactly matches or is explicitly supported by the webpage content. If the information appears to be not able to find from the text, but more likely from the screenshot, please check the screenshot carefully.</span></span>
<span id="A4.SS2.p6.pic1.2.4" class="ltx_p"><span id="A4.SS2.p6.pic1.2.4.1" class="ltx_text" style="font-size:90%;--ltx-fg-color:#000000;">2. You will also receive the original task description and the complete answer as context. Understand them clearly, as they provide essential background for evaluating the claim. You may apply common-sense reasoning (e.g., fuzzy matching for names differing only in letter casing or minor spelling variations) to assist your judgment, but your final decision must primarily rely on explicit evidence from the webpage content provided.</span></span>
<span id="A4.SS2.p6.pic1.2.5" class="ltx_p"><span id="A4.SS2.p6.pic1.2.5.1" class="ltx_text" style="font-size:90%;--ltx-fg-color:#000000;">3. If the provided webpage (the URL source mentioned in the answer) is entirely irrelevant, invalid, or inaccessible, you must conclude that the claim or &quot;fact&quot; is not supported.</span></span>
<span id="A4.SS2.p6.pic1.2.6" class="ltx_p"><span id="A4.SS2.p6.pic1.2.6.1" class="ltx_text" style="font-size:90%;--ltx-fg-color:#000000;">4. Occasionally, additional instructions might be provided to aid your judgment. Carefully follow those instructions when available.</span></span>
<span id="A4.SS2.p6.pic1.2.7" class="ltx_p"><span id="A4.SS2.p6.pic1.2.7.1" class="ltx_text ltx_font_bold" style="font-size:90%;--ltx-fg-color:#000000;">Original Task Description:<span id="A4.SS2.p6.pic1.2.7.1.1" class="ltx_text"></span></span></span>
<span id="A4.SS2.p6.pic1.2.8" class="ltx_quote">
<span id="A4.SS2.p6.pic1.2.8.1" class="ltx_p"><span id="A4.SS2.p6.pic1.2.8.1.1" class="ltx_text" style="font-size:90%;--ltx-fg-color:#000000;">{task_description}</span></span>
</span>
<span id="A4.SS2.p6.pic1.2.9" class="ltx_p"><span id="A4.SS2.p6.pic1.2.9.1" class="ltx_text ltx_font_bold" style="font-size:90%;--ltx-fg-color:#000000;">Complete Answer to the Task:<span id="A4.SS2.p6.pic1.2.9.1.1" class="ltx_text"></span></span></span>
<span id="A4.SS2.p6.pic1.2.10" class="ltx_quote">
<span id="A4.SS2.p6.pic1.2.10.1" class="ltx_p"><span id="A4.SS2.p6.pic1.2.10.1.1" class="ltx_text" style="font-size:90%;--ltx-fg-color:#000000;">{answer}</span></span>
</span>
<span id="A4.SS2.p6.pic1.2.11" class="ltx_p"><span id="A4.SS2.p6.pic1.2.11.1" class="ltx_text ltx_font_bold" style="font-size:90%;--ltx-fg-color:#000000;">Claim or Fact to Verify:<span id="A4.SS2.p6.pic1.2.11.1.1" class="ltx_text"></span></span></span>
<span id="A4.SS2.p6.pic1.2.12" class="ltx_quote">
<span id="A4.SS2.p6.pic1.2.12.1" class="ltx_p"><span id="A4.SS2.p6.pic1.2.12.1.1" class="ltx_text" style="font-size:90%;--ltx-fg-color:#000000;">{claim}</span></span>
</span>
<span id="A4.SS2.p6.pic1.2.13" class="ltx_p"><span id="A4.SS2.p6.pic1.2.13.1" class="ltx_text ltx_font_bold" style="font-size:90%;--ltx-fg-color:#000000;">Additional Instructions (if any):<span id="A4.SS2.p6.pic1.2.13.1.1" class="ltx_text"></span></span></span>
<span id="A4.SS2.p6.pic1.2.14" class="ltx_quote">
<span id="A4.SS2.p6.pic1.2.14.1" class="ltx_p"><span id="A4.SS2.p6.pic1.2.14.1.1" class="ltx_text" style="font-size:90%;--ltx-fg-color:#000000;">{additional_instruction}</span></span>
</span>
<span id="A4.SS2.p6.pic1.2.15" class="ltx_p"><span id="A4.SS2.p6.pic1.2.15.1" class="ltx_text ltx_font_bold" style="font-size:90%;--ltx-fg-color:#000000;">Webpage URL:<span id="A4.SS2.p6.pic1.2.15.1.1" class="ltx_text"></span></span></span>
<span id="A4.SS2.p6.pic1.2.16" class="ltx_quote">
<span id="A4.SS2.p6.pic1.2.16.1" class="ltx_p"><span id="A4.SS2.p6.pic1.2.16.1.1" class="ltx_text" style="font-size:90%;--ltx-fg-color:#000000;">{url}</span></span>
</span>
<span id="A4.SS2.p6.pic1.2.17" class="ltx_p"><span id="A4.SS2.p6.pic1.2.17.1" class="ltx_text ltx_font_bold" style="font-size:90%;--ltx-fg-color:#000000;">Extracted Webpage Text (truncated if too long):<span id="A4.SS2.p6.pic1.2.17.1.1" class="ltx_text"></span></span></span>
<span id="A4.SS2.p6.pic1.2.18" class="ltx_quote">
<span id="A4.SS2.p6.pic1.2.18.1" class="ltx_p"><span id="A4.SS2.p6.pic1.2.18.1.1" class="ltx_text" style="font-size:90%;--ltx-fg-color:#000000;">{web_text}</span></span>
</span>
