<span id="A1.SS2.SSS1.p3.pic1.1" class="ltx_inline-block ltx_minipage ltx_align_bottom" style="width:29.46em;">
<span id="A1.SS2.SSS1.p3.pic1.1.1" class="ltx_p"><span id="A1.SS2.SSS1.p3.pic1.1.1.1" class="ltx_text ltx_font_bold" style="font-size:90%;--ltx-fg-color:#FFFFFF;">Extracted Lessons (Self-Update, Coherence)</span></span>
</span></span></span></foreignobject></g><g fill-opacity="1.0" transform="matrix(1.0 0.0 0.0 1.0 21.65 182.59)"><foreignobject style="--ltx-fo-width:33.91em;--ltx-fo-height:1.63em;--ltx-fo-depth:12.2em;font-size:10pt;" height="191.3" overflow="visible" transform="matrix(1 0 0 -1 0 22.49)" width="469.22"><span class="ltx_foreignobject_container"><span class="ltx_foreignobject_content">
<span id="A1.SS2.SSS1.p3.pic1.2" class="ltx_inline-block ltx_minipage ltx_align_bottom" style="width:33.91em;">
<span id="A1.I1" class="ltx_enumerate">
<span id="A1.I1.i1" class="ltx_item" style="list-style-type:none;"><span class="ltx_tag ltx_tag_item">1.</span> 
<span id="A1.I1.i1.p1" class="ltx_para">
<span id="A1.I1.i1.p1.1" class="ltx_p"><span id="A1.I1.i1.p1.1.1" class="ltx_text ltx_font_bold" style="font-size:90%;--ltx-fg-color:#000000;">Implicit transitions are acceptable.</span><span id="A1.I1.i1.p1.1.2" class="ltx_text" style="font-size:90%;--ltx-fg-color:#000000;"> Require logical connections but do not demand explicit cue words (“because,” “therefore”). Implicit continuity suffices if the narrative flows.</span></span>
</span></span>
<span id="A1.I1.i2" class="ltx_item" style="list-style-type:none;"><span class="ltx_tag ltx_tag_item">2.</span> 
<span id="A1.I1.i2.p1" class="ltx_para">
<span id="A1.I1.i2.p1.1" class="ltx_p"><span id="A1.I1.i2.p1.1.1" class="ltx_text ltx_font_bold" style="font-size:90%;--ltx-fg-color:#000000;">Add a central-claim relevance criterion.</span><span id="A1.I1.i2.p1.1.2" class="ltx_text" style="font-size:90%;--ltx-fg-color:#000000;"> Each sentence should advance the article’s main claim; sentences that do not contribute are non-contributory regardless of grammatical correctness.</span></span>
</span></span>
<span id="A1.I1.i3" class="ltx_item" style="list-style-type:none;"><span class="ltx_tag ltx_tag_item">3.</span> 
<span id="A1.I1.i3.p1" class="ltx_para">
<span id="A1.I1.i3.p1.1" class="ltx_p"><span id="A1.I1.i3.p1.1.1" class="ltx_text ltx_font_bold" style="font-size:90%;--ltx-fg-color:#000000;">Do not penalize omission of background details.</span><span id="A1.I1.i3.p1.1.2" class="ltx_text" style="font-size:90%;--ltx-fg-color:#000000;"> Missing context should not lower coherence as long as the core fact and conflict remain clear.</span></span>
</span></span>
</span>
</span></span></span></foreignobject></g></g></svg>