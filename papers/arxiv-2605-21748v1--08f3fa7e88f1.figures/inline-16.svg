<span id="A2.SS4.p14.pic1.2.1" class="ltx_p"><span id="A2.SS4.p14.pic1.2.1.1" class="ltx_text" style="--ltx-fg-color:#000000;">The chatbot unnecessarily refuses or hedges on questions that ARE answerable from the reference material, saying things like ‘I don’t have enough information’ or ‘I can’t determine that’ when the answer is clearly available. Non-flawed turns should answer confidently using the reference material.</span></span>
