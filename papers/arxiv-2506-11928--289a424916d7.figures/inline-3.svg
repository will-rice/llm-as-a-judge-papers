<span id="S2.I1.i3.p3.pic1.2.1" class="ltx_p"><span id="S2.I1.i3.p3.pic1.2.1.1" class="ltx_text" style="--ltx-fg-color:#000000;">On a row of <math id="S2.I1.i3.p3.pic1.m1" class="ltx_Math" alttext="n" display="inline" intent=":literal"><semantics><mi style="--ltx-fg-color:#000000;" mathcolor="#000000">n</mi><annotation encoding="application/x-tex">n</annotation></semantics></math> cells initially colored red or blue, Alice and Bob alternate moves: 
<br class="ltx_break">Alice chooses two adjacent cells containing at least one red and repaints both white; 
<br class="ltx_break">Bob then chooses two adjacent cells containing at least one blue and repaints both white. 
<br class="ltx_break">The first player unable to move loses. Determine who wins under optimal play.</span></span>
<span id="S2.I1.i3.p3.pic1.2.2" class="ltx_p"><span id="S2.I1.i3.p3.pic1.2.2.1" class="ltx_text ltx_font_bold" style="--ltx-fg-color:#000000;">Data range:<span id="S2.I1.i3.p3.pic1.2.2.1.1" class="ltx_text ltx_font_medium"> <math id="S2.I1.i3.p3.pic1.m2" class="ltx_Math" alttext="1\leq n\leq 5*10^{5}" display="inline" intent=":literal"><semantics><mrow><mn style="--ltx-fg-color:#000000;" mathcolor="#000000">1</mn><mo style="--ltx-fg-color:#000000;" mathcolor="#000000">≤</mo><mi style="--ltx-fg-color:#000000;" mathcolor="#000000">n</mi><mo style="--ltx-fg-color:#000000;" mathcolor="#000000">≤</mo><mrow><mn style="--ltx-fg-color:#000000;" mathcolor="#000000">5</mn><mo style="--ltx-fg-color:#000000;" lspace="0.222em" mathcolor="#000000" rspace="0.222em">∗</mo><msup><mn style="--ltx-fg-color:#000000;" mathcolor="#000000">10</mn><mn style="--ltx-fg-color:#000000;" mathcolor="#000000">5</mn></msup></mrow></mrow><annotation encoding="application/x-tex">1\leq n\leq 5*10^{5}</annotation></semantics></math>
