<span id="A4.SS1.p1.pic1.2.2" class="ltx_p"><span id="A4.SS1.p1.pic1.2.2.1" class="ltx_text ltx_font_bold" style="--ltx-fg-color:#000000;">[Guideline]<span id="A4.SS1.p1.pic1.2.2.1.1" class="ltx_text ltx_font_medium"> Focus on correctness (whether the information provided in the answer is accurate according to the context) and helpfulness (whether the response answers the question).
<br class="ltx_break"></span></span></span>
