<span id="S2.SS1.SSS4.p2.pic1.1" class="ltx_inline-block ltx_minipage ltx_align_bottom" style="width:19.79em;">
<span id="S2.SS1.SSS4.p2.pic1.1.1" class="ltx_p"><span id="S2.SS1.SSS4.p2.pic1.1.1.1" class="ltx_text" style="font-size:173%;--ltx-fg-color:#FFFFFF;">Reliability Concerns of In-Context Learning</span></span>
</span></span></span></foreignobject></g><g fill-opacity="1.0" transform="matrix(1.0 0.0 0.0 1.0 21.65 18.43)"><foreignobject style="--ltx-fo-width:19.79em;--ltx-fo-height:16.15em;--ltx-fo-depth:0.21em;font-size:15.85pt;" height="358.81" overflow="visible" transform="matrix(1 0 0 -1 0 354.15)" width="434.03"><span class="ltx_foreignobject_container"><span class="ltx_foreignobject_content">
<span id="S2.SS1.SSS4.p2.pic1.2" class="ltx_inline-block ltx_minipage ltx_align_bottom" style="width:19.79em;">
<span id="S2.SS1.SSS4.p2.pic1.2.1" class="ltx_p"><span id="S2.SS1.SSS4.p2.pic1.2.1.1" class="ltx_text" style="font-size:173%;--ltx-fg-color:#000000;">When leveraging in-context learning, certain issues can surface, potentially impacting the reliability of evaluations. These include the variability of LLM outputs due to minor prompt changes, which can lead to unstable results. Furthermore, score-based assessments often exhibit inconsistent inter-rater reliability, influenced by the inherent randomness of LLM generation and its sensitivity to phrasing. Similarly, evaluation formats like Yes/No or multiple-choice questions are prone to ambiguity in response interpretation. Lastly, LLM-as-a-Judge evaluations may inadvertently reflect biases, such as favoring responses based on their position or length.</span></span>
</span></span></span></foreignobject></g></g></svg>