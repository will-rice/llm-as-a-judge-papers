<span id="A3.SS4.p4.pic1.1.1" class="ltx_p ltx_align_center"><span id="A3.SS4.p4.pic1.1.1.1" class="ltx_text ltx_font_bold ltx_font_smallcaps" style="--ltx-fg-color:#FFFFFF;">Prompt for Likert scale-based comparison</span></span>
</span></span></span></foreignobject></g><g fill-opacity="1.0" transform="matrix(1.0 0.0 0.0 1.0 21.65 13.78)"><foreignobject style="--ltx-fo-width:36.62em;--ltx-fo-height:40.29em;--ltx-fo-depth:0em;font-size:10pt;" height="557.56" overflow="visible" transform="matrix(1 0 0 -1 0 557.56)" width="506.72"><span class="ltx_foreignobject_container"><span class="ltx_foreignobject_content">
<span id="A3.SS4.p4.pic1.2" class="ltx_inline-block ltx_minipage ltx_align_bottom" style="width:36.62em;">
<span id="A3.SS4.p4.pic1.2.1" class="ltx_p"><span id="A3.SS4.p4.pic1.2.1.1" class="ltx_text" style="--ltx-fg-color:#000000;">You are an expert Quality Assurance engineer specializing in web development. Your objective is to meticulously evaluate and compare two different web development solutions for the same task. You will be provided with the user’s initial query and the solutions (codes for both webpages A and B). Based on these inputs, you will assess the quality of each solution across several key dimensions. For each sub-criteria, you must provide a rating on a 5-point Likert scale, where 1 represents “Very Poor” and 5 represents “Excellent”. Avoid any position biases and ensure that the order in which the responses were presented does not influence your decision. Do not allow the length of the responses to influence your evaluation. Be as objective as possible.

<br class="ltx_break"></span></span>
<span id="A3.SS4.p4.pic1.2.2" class="ltx_p"><span id="A3.SS4.p4.pic1.2.2.1" class="ltx_text ltx_font_bold" style="--ltx-fg-color:#000000;">{DIMENSIONS OF THE LIKERT SCALE}
<br class="ltx_break"></span></span>
<span id="A3.SS4.p4.pic1.2.3" class="ltx_p"><span id="A3.SS4.p4.pic1.2.3.1" class="ltx_text" style="--ltx-fg-color:#000000;">## User Query
<br class="ltx_break">{user_query}
<br class="ltx_break"></span></span>
<span id="A3.SS4.p4.pic1.2.4" class="ltx_p"><span id="A3.SS4.p4.pic1.2.4.1" class="ltx_text" style="--ltx-fg-color:#000000;">## Code A
<br class="ltx_break"><code id="A3.SS4.p4.pic1.2.4.1.1" class="ltx_verbatim ltx_font_typewriter">```</code>tsx
<br class="ltx_break">{code_a}
<br class="ltx_break"><code id="A3.SS4.p4.pic1.2.4.1.2" class="ltx_verbatim ltx_font_typewriter">```</code>
<br class="ltx_break"></span></span>
<span id="A3.SS4.p4.pic1.2.5" class="ltx_p"><span id="A3.SS4.p4.pic1.2.5.1" class="ltx_text" style="--ltx-fg-color:#000000;">## Code B
<br class="ltx_break"><code id="A3.SS4.p4.pic1.2.5.1.1" class="ltx_verbatim ltx_font_typewriter">```</code>tsx
<br class="ltx_break">{code_b}
<code id="A3.SS4.p4.pic1.2.5.1.2" class="ltx_verbatim ltx_font_typewriter">```</code>
<br class="ltx_break"></span></span>
<span id="A3.SS4.p4.pic1.2.6" class="ltx_p"><span id="A3.SS4.p4.pic1.2.6.1" class="ltx_text" style="--ltx-fg-color:#000000;">## Output Format
<br class="ltx_break">Begin your evaluation by providing a short explanation. End your output with a json object wrapped with <code id="A3.SS4.p4.pic1.2.6.1.1" class="ltx_verbatim ltx_font_typewriter">```</code>json at the beginning and <code id="A3.SS4.p4.pic1.2.6.1.2" class="ltx_verbatim ltx_font_typewriter">```</code> at the end. Use the sub-criterion id as the key. The value for each key should be a nested json object containing the scores for each solution, with “A” and “B” as keys. Do not include any other text after the json object.</span></span>
<span id="A3.SS4.p4.pic1.2.7" class="ltx_p"><span id="A3.SS4.p4.pic1.2.7.1" class="ltx_text" style="--ltx-fg-color:#000000;">Here is an example of the output format:
