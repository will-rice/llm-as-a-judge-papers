<svg id="S16.p2.pic1" class="ltx_picture" height="469" overflow="visible" version="1.1" viewbox="0 0 477.38 469" width="477.38"><g style="--ltx-stroke-color:#000000;--ltx-fill-color:#000000;" fill="#000000" stroke="#000000" stroke-width="0.4pt" transform="translate(0,469) matrix(1 0 0 -1 0 0)"><g style="--ltx-fill-color:#BF0000;" fill="#BF0000" fill-opacity="1.0"><path style="stroke:none" d="M 0 5.91 L 0 463.1 C 0 466.36 2.64 469 5.91 469 L 471.47 469 C 474.73 469 477.38 466.36 477.38 463.1 L 477.38 5.91 C 477.38 2.64 474.73 0 471.47 0 L 5.91 0 C 2.64 0 0 2.64 0 5.91 Z" /></g><g style="--ltx-fill-color:#FFF2F2;" fill="#FFF2F2" fill-opacity="1.0"><path style="stroke:none" d="M 1.97 5.91 L 1.97 443.35 L 475.41 443.35 L 475.41 5.91 C 475.41 3.73 473.65 1.97 471.47 1.97 L 5.91 1.97 C 3.73 1.97 1.97 3.73 1.97 5.91 Z" /></g><g fill-opacity="1.0" transform="matrix(1.0 0.0 0.0 1.0 21.65 452.72)"><foreignobject style="--ltx-fo-width:31.37em;--ltx-fo-height:0.75em;--ltx-fo-depth:0.25em;font-size:10pt;" height="13.84" overflow="visible" transform="matrix(1 0 0 -1 0 10.38)" width="434.07"><span class="ltx_foreignobject_container"><span class="ltx_foreignobject_content">
<span id="S16.p2.pic1.1" class="ltx_inline-block ltx_minipage ltx_align_bottom" style="width:31.37em;">
<span id="S16.p2.pic1.1.1" class="ltx_p"><a href="https://codeforces.com/contest/2046/problem/B" title class="ltx_ref ltx_href" style="--ltx-fg-color:#FFFFFF;">Example Problem for Case Studies (Rated 1600)</a></span>
</span></span></span></foreignobject></g><g fill-opacity="1.0" transform="matrix(1.0 0.0 0.0 1.0 21.65 16.47)"><foreignobject style="--ltx-fo-width:31.37em;--ltx-fo-height:30em;--ltx-fo-depth:0.19em;font-size:10pt;" height="417.77" overflow="visible" transform="matrix(1 0 0 -1 0 415.08)" width="434.07"><span class="ltx_foreignobject_container"><span class="ltx_foreignobject_content">
<span id="S16.p2.pic1.2" class="ltx_inline-block ltx_minipage ltx_align_bottom" style="width:31.37em;">
<span id="S16.p2.pic1.2.1" class="ltx_p"><span id="S16.p2.pic1.2.1.1" class="ltx_text" style="--ltx-fg-color:#000000;">You are given an array of integers <math id="S16.p2.pic1.m1" class="ltx_Math" alttext="a" display="inline" intent=":literal"><semantics><mi style="--ltx-fg-color:#000000;" mathcolor="#000000">a</mi><annotation encoding="application/x-tex">a</annotation></semantics></math> of length <math id="S16.p2.pic1.m2" class="ltx_Math" alttext="n" display="inline" intent=":literal"><semantics><mi style="--ltx-fg-color:#000000;" mathcolor="#000000">n</mi><annotation encoding="application/x-tex">n</annotation></semantics></math>.
You may perform the following operation any number of times (possibly zero):</span></span>
<span id="S16.I1" class="ltx_itemize">
<span id="S16.I1.i1" class="ltx_item" style="list-style-type:none;"><span class="ltx_tag ltx_tag_item">•</span> 
<span id="S16.I1.i1.p1" class="ltx_para">
<span id="S16.I1.i1.p1.1" class="ltx_p"><span id="S16.I1.i1.p1.1.1" class="ltx_text" style="--ltx-fg-color:#000000;">Choose an index </span><math id="S16.I1.i1.p1.m1" class="ltx_Math" alttext="i" display="inline" intent=":literal"><semantics><mi style="--ltx-fg-color:#000000;" mathcolor="#000000">i</mi><annotation encoding="application/x-tex">i</annotation></semantics></math><span id="S16.I1.i1.p1.1.2" class="ltx_text" style="--ltx-fg-color:#000000;"> (</span><math id="S16.I1.i1.p1.m2" class="ltx_Math" alttext="1\leq i\leq n" display="inline" intent=":literal"><semantics><mrow><mn style="--ltx-fg-color:#000000;" mathcolor="#000000">1</mn><mo style="--ltx-fg-color:#000000;" mathcolor="#000000">≤</mo><mi style="--ltx-fg-color:#000000;" mathcolor="#000000">i</mi><mo style="--ltx-fg-color:#000000;" mathcolor="#000000">≤</mo><mi style="--ltx-fg-color:#000000;" mathcolor="#000000">n</mi></mrow><annotation encoding="application/x-tex">1\leq i\leq n</annotation></semantics></math><span id="S16.I1.i1.p1.1.3" class="ltx_text" style="--ltx-fg-color:#000000;">), replace </span><math id="S16.I1.i1.p1.m3" class="ltx_Math" alttext="a_{i}" display="inline" intent=":literal"><semantics><msub><mi style="--ltx-fg-color:#000000;" mathcolor="#000000">a</mi><mi style="--ltx-fg-color:#000000;" mathcolor="#000000">i</mi></msub><annotation encoding="application/x-tex">a_{i}</annotation></semantics></math><span id="S16.I1.i1.p1.1.4" class="ltx_text" style="--ltx-fg-color:#000000;"> by </span><math id="S16.I1.i1.p1.m4" class="ltx_Math" alttext="a_{i}+1" display="inline" intent=":literal"><semantics><mrow><msub><mi style="--ltx-fg-color:#000000;" mathcolor="#000000">a</mi><mi style="--ltx-fg-color:#000000;" mathcolor="#000000">i</mi></msub><mo style="--ltx-fg-color:#000000;" mathcolor="#000000">+</mo><mn style="--ltx-fg-color:#000000;" mathcolor="#000000">1</mn></mrow><annotation encoding="application/x-tex">a_{i}+1</annotation></semantics></math><span id="S16.I1.i1.p1.1.5" class="ltx_text" style="--ltx-fg-color:#000000;">, and then move this element to the back of the array (the rightmost position).</span></span>
</span></span>
</span>
<span id="S16.p2.pic1.2.2" class="ltx_p"><span id="S16.p2.pic1.2.2.1" class="ltx_text" style="--ltx-fg-color:#000000;">For example, if <math id="S16.p2.pic1.m3" class="ltx_Math" alttext="a=[\,3,\,5,\,1,\,9\,]" display="inline" intent=":literal"><semantics><mrow><mi style="--ltx-fg-color:#000000;" mathcolor="#000000">a</mi><mo style="--ltx-fg-color:#000000;" mathcolor="#000000">=</mo><mrow><mo style="--ltx-fg-color:#000000;" mathcolor="#000000" stretchy="false">[</mo><mrow><mn style="--ltx-fg-color:#000000;" mathcolor="#000000"> 3</mn><mo style="--ltx-fg-color:#000000;" mathcolor="#000000">,</mo><mn style="--ltx-fg-color:#000000;" mathcolor="#000000"> 5</mn><mo style="--ltx-fg-color:#000000;" mathcolor="#000000">,</mo><mn style="--ltx-fg-color:#000000;" mathcolor="#000000"> 1</mn><mo style="--ltx-fg-color:#000000;" mathcolor="#000000">,</mo><mn style="--ltx-fg-color:#000000;" mathcolor="#000000"> 9</mn></mrow><mo style="--ltx-fg-color:#000000;" lspace="0.170em" mathcolor="#000000" stretchy="false">]</mo></mrow></mrow><annotation encoding="application/x-tex">a=[\,3,\,5,\,1,\,9\,]</annotation></semantics></math> and you choose <math id="S16.p2.pic1.m4" class="ltx_Math" alttext="i=2" display="inline" intent=":literal"><semantics><mrow><mi style="--ltx-fg-color:#000000;" mathcolor="#000000">i</mi><mo style="--ltx-fg-color:#000000;" mathcolor="#000000">=</mo><mn style="--ltx-fg-color:#000000;" mathcolor="#000000">2</mn></mrow><annotation encoding="application/x-tex">i=2</annotation></semantics></math>, the array becomes <math id="S16.p2.pic1.m5" class="ltx_Math" alttext="[\,3,\,1,\,9,\,6\,]" display="inline" intent=":literal"><semantics><mrow><mo style="--ltx-fg-color:#000000;" mathcolor="#000000" stretchy="false">[</mo><mrow><mn style="--ltx-fg-color:#000000;" mathcolor="#000000"> 3</mn><mo style="--ltx-fg-color:#000000;" mathcolor="#000000">,</mo><mn style="--ltx-fg-color:#000000;" mathcolor="#000000"> 1</mn><mo style="--ltx-fg-color:#000000;" mathcolor="#000000">,</mo><mn style="--ltx-fg-color:#000000;" mathcolor="#000000"> 9</mn><mo style="--ltx-fg-color:#000000;" mathcolor="#000000">,</mo><mn style="--ltx-fg-color:#000000;" mathcolor="#000000"> 6</mn></mrow><mo style="--ltx-fg-color:#000000;" lspace="0.170em" mathcolor="#000000" stretchy="false">]</mo></mrow><annotation encoding="application/x-tex">[\,3,\,1,\,9,\,6\,]</annotation></semantics></math>.

<br class="ltx_break">
<br class="ltx_break">Your task is to obtain the <em id="S16.p2.pic1.2.2.1.1" class="ltx_emph ltx_font_italic">lexicographically smallest</em> array that can be produced by a sequence of such operations.

<br class="ltx_break">
<br class="ltx_break"><span id="S16.p2.pic1.2.2.1.2" class="ltx_text ltx_font_bold">Input
<br class="ltx_break"></span>Each test contains multiple test cases.
The first line contains a single integer <math id="S16.p2.pic1.m6" class="ltx_Math" alttext="t" display="inline" intent=":literal"><semantics><mi style="--ltx-fg-color:#000000;" mathcolor="#000000">t</mi><annotation encoding="application/x-tex">t</annotation></semantics></math> (<math id="S16.p2.pic1.m7" class="ltx_Math" alttext="1\leq t\leq 10^{4}" display="inline" intent=":literal"><semantics><mrow><mn style="--ltx-fg-color:#000000;" mathcolor="#000000">1</mn><mo style="--ltx-fg-color:#000000;" mathcolor="#000000">≤</mo><mi style="--ltx-fg-color:#000000;" mathcolor="#000000">t</mi><mo style="--ltx-fg-color:#000000;" mathcolor="#000000">≤</mo><msup><mn style="--ltx-fg-color:#000000;" mathcolor="#000000">10</mn><mn style="--ltx-fg-color:#000000;" mathcolor="#000000">4</mn></msup></mrow><annotation encoding="application/x-tex">1\leq t\leq 10^{4}</annotation></semantics></math>)—the number of test cases.
The descriptions of the test cases follow.

<br class="ltx_break">For each test case:</span></span>
<span id="S16.I2" class="ltx_itemize">
<span id="S16.I2.i1" class="ltx_item" style="list-style-type:none;"><span class="ltx_tag ltx_tag_item">•</span> 
<span id="S16.I2.i1.p1" class="ltx_para">
<span id="S16.I2.i1.p1.1" class="ltx_p"><span id="S16.I2.i1.p1.1.1" class="ltx_text" style="--ltx-fg-color:#000000;">The first line contains an integer </span><math id="S16.I2.i1.p1.m1" class="ltx_Math" alttext="n" display="inline" intent=":literal"><semantics><mi style="--ltx-fg-color:#000000;" mathcolor="#000000">n</mi><annotation encoding="application/x-tex">n</annotation></semantics></math><span id="S16.I2.i1.p1.1.2" class="ltx_text" style="--ltx-fg-color:#000000;"> (</span><math id="S16.I2.i1.p1.m2" class="ltx_Math" alttext="1\leq n\leq 10^{5}" display="inline" intent=":literal"><semantics><mrow><mn style="--ltx-fg-color:#000000;" mathcolor="#000000">1</mn><mo style="--ltx-fg-color:#000000;" mathcolor="#000000">≤</mo><mi style="--ltx-fg-color:#000000;" mathcolor="#000000">n</mi><mo style="--ltx-fg-color:#000000;" mathcolor="#000000">≤</mo><msup><mn style="--ltx-fg-color:#000000;" mathcolor="#000000">10</mn><mn style="--ltx-fg-color:#000000;" mathcolor="#000000">5</mn></msup></mrow><annotation encoding="application/x-tex">1\leq n\leq 10^{5}</annotation></semantics></math><span id="S16.I2.i1.p1.1.3" class="ltx_text" style="--ltx-fg-color:#000000;">)—the length of the array.</span></span>
</span></span>
<span id="S16.I2.i2" class="ltx_item" style="list-style-type:none;"><span class="ltx_tag ltx_tag_item">•</span> 
<span id="S16.I2.i2.p1" class="ltx_para">
<span id="S16.I2.i2.p1.1" class="ltx_p"><span id="S16.I2.i2.p1.1.1" class="ltx_text" style="--ltx-fg-color:#000000;">The second line contains </span><math id="S16.I2.i2.p1.m1" class="ltx_Math" alttext="n" display="inline" intent=":literal"><semantics><mi style="--ltx-fg-color:#000000;" mathcolor="#000000">n</mi><annotation encoding="application/x-tex">n</annotation></semantics></math><span id="S16.I2.i2.p1.1.2" class="ltx_text" style="--ltx-fg-color:#000000;"> integers </span><math id="S16.I2.i2.p1.m2" class="ltx_Math" alttext="a_{1},a_{2},\dots,a_{n}" display="inline" intent=":literal"><semantics><mrow><msub><mi style="--ltx-fg-color:#000000;" mathcolor="#000000">a</mi><mn style="--ltx-fg-color:#000000;" mathcolor="#000000">1</mn></msub><mo style="--ltx-fg-color:#000000;" mathcolor="#000000">,</mo><msub><mi style="--ltx-fg-color:#000000;" mathcolor="#000000">a</mi><mn style="--ltx-fg-color:#000000;" mathcolor="#000000">2</mn></msub><mo style="--ltx-fg-color:#000000;" mathcolor="#000000">,</mo><mi style="--ltx-fg-color:#000000;" mathcolor="#000000" mathvariant="normal">…</mi><mo style="--ltx-fg-color:#000000;" mathcolor="#000000">,</mo><msub><mi style="--ltx-fg-color:#000000;" mathcolor="#000000">a</mi><mi style="--ltx-fg-color:#000000;" mathcolor="#000000">n</mi></msub></mrow><annotation encoding="application/x-tex">a_{1},a_{2},\dots,a_{n}</annotation></semantics></math><span id="S16.I2.i2.p1.1.3" class="ltx_text" style="--ltx-fg-color:#000000;"> (</span><math id="S16.I2.i2.p1.m3" class="ltx_Math" alttext="1\leq a_{i}\leq 10^{9}" display="inline" intent=":literal"><semantics><mrow><mn style="--ltx-fg-color:#000000;" mathcolor="#000000">1</mn><mo style="--ltx-fg-color:#000000;" mathcolor="#000000">≤</mo><msub><mi style="--ltx-fg-color:#000000;" mathcolor="#000000">a</mi><mi style="--ltx-fg-color:#000000;" mathcolor="#000000">i</mi></msub><mo style="--ltx-fg-color:#000000;" mathcolor="#000000">≤</mo><msup><mn style="--ltx-fg-color:#000000;" mathcolor="#000000">10</mn><mn style="--ltx-fg-color:#000000;" mathcolor="#000000">9</mn></msup></mrow><annotation encoding="application/x-tex">1\leq a_{i}\leq 10^{9}</annotation></semantics></math><span id="S16.I2.i2.p1.1.4" class="ltx_text" style="--ltx-fg-color:#000000;">)—the elements of the array.</span></span>
</span></span>
</span>
<span id="S16.p2.pic1.2.3" class="ltx_p"><span id="S16.p2.pic1.2.3.1" class="ltx_text" style="--ltx-fg-color:#000000;">It is guaranteed that the sum of <math id="S16.p2.pic1.m8" class="ltx_Math" alttext="n" display="inline" intent=":literal"><semantics><mi style="--ltx-fg-color:#000000;" mathcolor="#000000">n</mi><annotation encoding="application/x-tex">n</annotation></semantics></math> over all test cases does not exceed <math id="S16.p2.pic1.m9" class="ltx_Math" alttext="10^{5}" display="inline" intent=":literal"><semantics><msup><mn style="--ltx-fg-color:#000000;" mathcolor="#000000">10</mn><mn style="--ltx-fg-color:#000000;" mathcolor="#000000">5</mn></msup><annotation encoding="application/x-tex">10^{5}</annotation></semantics></math>.

<br class="ltx_break">
<br class="ltx_break"><span id="S16.p2.pic1.2.3.1.1" class="ltx_text ltx_font_bold">Output
<br class="ltx_break"></span>For each test case, print one line containing the lexicographically smallest array achievable, with its elements separated by single spaces.</span></span>
</span></span></span></foreignobject></g></g></svg>