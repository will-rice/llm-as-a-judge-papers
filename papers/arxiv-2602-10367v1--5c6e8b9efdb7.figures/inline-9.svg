<span id="A2.I17.i3.p1.1" class="ltx_p"><span id="A2.I17.i3.p1.1.1" class="ltx_text ltx_font_typewriter ltx_font_bold" style="font-size:90%;--ltx-fg-color:#000000;">Rubric (<math id="A2.I17.i3.p1.m1" class="ltx_Math" alttext="R" display="inline" intent=":literal"><semantics><mi style="--ltx-fg-color:#000000;" mathcolor="#000000">R</mi><annotation encoding="application/x-tex">R</annotation></semantics></math>):</span><span id="A2.I17.i3.p1.1.2" class="ltx_text ltx_font_typewriter" style="font-size:90%;--ltx-fg-color:#000000;"> [JSON list from Phase 1]
