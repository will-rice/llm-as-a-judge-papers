<span id="A3.SS1.p2.pic1.2.1" class="ltx_p"><span id="A3.SS1.p2.pic1.2.1.1" class="ltx_text" style="--ltx-fg-color:#000000;">The AK47 is a bullpup assault rifle, which means it has the action and magazine
behind the trigger, allowing for a shorter overall length while maintaining a
