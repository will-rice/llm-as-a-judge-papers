<span id="A5.SS2.p2.pic1.1" class="ltx_inline-block ltx_minipage ltx_align_bottom" style="width:34.02em;">
<span id="A5.SS2.p2.pic1.1.1" class="ltx_p"><span id="A5.SS2.p2.pic1.1.1.1" class="ltx_text ltx_font_sansserif ltx_font_bold" style="--ltx-fg-color:#FFFFFF;">Example hand-written rubric for code retrieval samples</span></span>
</span></span></span></foreignobject></g><g fill-opacity="1.0" transform="matrix(1.0 0.0 0.0 1.0 16.11 16.11)"><foreignobject style="--ltx-fo-width:35.64em;--ltx-fo-height:11.5em;--ltx-fo-depth:0em;font-size:10pt;" height="159.13" overflow="visible" transform="matrix(1 0 0 -1 0 159.13)" width="493.16"><span class="ltx_foreignobject_container"><span class="ltx_foreignobject_content">
<span id="A5.SS2.p2.pic1.2" class="ltx_inline-block ltx_minipage ltx_align_bottom" style="width:35.64em;">
<span id="A5.SS2.p2.pic1.2.1" class="ltx_p"><span id="A5.SS2.p2.pic1.2.1.1" class="ltx_text ltx_font_typewriter" style="--ltx-fg-color:#000000;">Here are some rules for evaluation
</span></span>
<span id="A5.SS2.p2.pic1.2.2" class="ltx_p"><span id="A5.SS2.p2.pic1.2.2.1" class="ltx_text ltx_font_typewriter" style="--ltx-fg-color:#000000;">(1) Determine if the function provided by the assistant is a relevant candidate for editing given the user’s instruction
</span></span>
<span id="A5.SS2.p2.pic1.2.3" class="ltx_p"><span id="A5.SS2.p2.pic1.2.3.1" class="ltx_text ltx_font_typewriter" style="--ltx-fg-color:#000000;">(2) A relevant function is one means that needs to be modified in order to address the issue described in the user’s instruction
</span></span>
<span id="A5.SS2.p2.pic1.2.4" class="ltx_p"><span id="A5.SS2.p2.pic1.2.4.1" class="ltx_text ltx_font_typewriter" style="--ltx-fg-color:#000000;">(3) Modifying a relevant function does not mean is is sufficient to resolve the user’s issue. That is, it is ok if modifying the function does not completely resolve the user issue, but it should make progress towards issue resolution.
</span></span>
</span></span></span></foreignobject></g></g></svg>