<br class="ltx_break"></span>Response A:<span id="S3.F3.pic1.2.1.1.2" class="ltx_text ltx_font_medium"> Proportion: <math id="S3.F3.pic1.m1" class="ltx_Math" alttext="5/4=20/x\Rightarrow x=16" display="inline" intent=":literal"><semantics><mrow><mrow><mn style="--ltx-fg-color:#000000;" mathcolor="#000000">5</mn><mo style="--ltx-fg-color:#000000;" mathcolor="#000000">/</mo><mn style="--ltx-fg-color:#000000;" mathcolor="#000000">4</mn></mrow><mo style="--ltx-fg-color:#000000;" mathcolor="#000000">=</mo><mrow><mn style="--ltx-fg-color:#000000;" mathcolor="#000000">20</mn><mo style="--ltx-fg-color:#000000;" mathcolor="#000000">/</mo><mi style="--ltx-fg-color:#000000;" mathcolor="#000000">x</mi></mrow><mo style="--ltx-fg-color:#000000;" mathcolor="#000000" stretchy="false">⇒</mo><mi style="--ltx-fg-color:#000000;" mathcolor="#000000">x</mi><mo style="--ltx-fg-color:#000000;" mathcolor="#000000">=</mo><mn style="--ltx-fg-color:#000000;" mathcolor="#000000">16</mn></mrow><annotation encoding="application/x-tex">5/4=20/x\Rightarrow x=16</annotation></semantics></math>h.  </span>Response B:<span id="S3.F3.pic1.2.1.1.3" class="ltx_text ltx_font_medium"> Per-shirt: <math id="S3.F3.pic1.m2" class="ltx_Math" alttext="4/5=0.8" display="inline" intent=":literal"><semantics><mrow><mrow><mn style="--ltx-fg-color:#000000;" mathcolor="#000000">4</mn><mo style="--ltx-fg-color:#000000;" mathcolor="#000000">/</mo><mn style="--ltx-fg-color:#000000;" mathcolor="#000000">5</mn></mrow><mo style="--ltx-fg-color:#000000;" mathcolor="#000000">=</mo><mn style="--ltx-fg-color:#000000;" mathcolor="#000000">0.8</mn></mrow><annotation encoding="application/x-tex">4/5=0.8</annotation></semantics></math>h <math id="S3.F3.pic1.m3" class="ltx_Math" alttext="\times 20=16" display="inline" intent=":literal"><semantics><mrow><mphantom></mphantom><mo style="--ltx-fg-color:#000000;" lspace="0.222em" mathcolor="#000000" rspace="0.222em">×</mo><mrow><mn style="--ltx-fg-color:#000000;" mathcolor="#000000">20</mn><mo style="--ltx-fg-color:#000000;" mathcolor="#000000">=</mo><mn style="--ltx-fg-color:#000000;" mathcolor="#000000">16</mn></mrow></mrow><annotation encoding="application/x-tex">\times 20=16</annotation></semantics></math>h.</span></span></span>
