<span id="S2.I2.i1" class="ltx_item" style="list-style-type:none;"><span class="ltx_tag ltx_tag_item"><math id="S2.I2.i1.m1" class="ltx_Math" alttext="\triangleright" display="inline" intent=":literal"><semantics><mo>⊳</mo><annotation encoding="application/x-tex">\triangleright</annotation></semantics></math></span> 
<span id="S2.I2.i1.p1" class="ltx_para ltx_noindent">
<span id="S2.I2.i1.p1.1" class="ltx_p"><span id="S2.I2.i1.p1.1.1" class="ltx_text ltx_font_bold" style="--ltx-fg-color:#000000;">Novelty Bias</span><span id="S2.I2.i1.p1.1.2" class="ltx_text" style="--ltx-fg-color:#000000;">: Tendency to overvalue new or unusual information, perceiving it as more important or accurate than familiar information, even when novelty </span><span id="S2.I2.i1.p1.1.3" class="ltx_text ltx_markedasmath" style="--ltx-fg-color:#000000;"><math id="S2.I2.i1.p1.m1.m1" class="ltx_Math" alttext="\neq" display="inline" intent=":literal"><semantics><mo style="--ltx-fg-color:#000000;" mathcolor="#000000">≠</mo><annotation encoding="application/x-tex">\neq</annotation></semantics></math></span><span id="S2.I2.i1.p1.1.4" class="ltx_text" style="--ltx-fg-color:#000000;"> quality.</span></span>
</span></span>
<span id="S2.I2.i2" class="ltx_item" style="list-style-type:none;"><span class="ltx_tag ltx_tag_item"><math id="S2.I2.i2.m1" class="ltx_Math" alttext="\triangleright" display="inline" intent=":literal"><semantics><mo>⊳</mo><annotation encoding="application/x-tex">\triangleright</annotation></semantics></math></span> 
<span id="S2.I2.i2.p1" class="ltx_para">
<span id="S2.I2.i2.p1.1" class="ltx_p"><span id="S2.I2.i2.p1.1.1" class="ltx_text ltx_font_bold" style="--ltx-fg-color:#000000;">Exact Match Bias</span><span id="S2.I2.i2.p1.1.2" class="ltx_text" style="--ltx-fg-color:#000000;">: A model tends to prefer answers that exactly match the source text or reference, even if other answers are equally correct or better.</span></span>
</span></span>
