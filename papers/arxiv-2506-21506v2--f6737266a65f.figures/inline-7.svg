<span id="A8.SS1.p1.pic1.1" class="ltx_inline-block ltx_minipage ltx_align_bottom" style="width:31.37em;">
<span id="A8.SS1.p1.pic1.1.1" class="ltx_p"><span id="A8.SS1.p1.pic1.1.1.1" class="ltx_text" style="--ltx-fg-color:#FFFFFF;">Task Proposal Instruction</span></span>
</span></span></span></foreignobject></g><g fill-opacity="1.0" transform="matrix(1.0 0.0 0.0 1.0 21.65 389.8)"><foreignobject style="--ltx-fo-width:33.91em;--ltx-fo-height:4.38em;--ltx-fo-depth:27.18em;font-size:10pt;" height="436.56" overflow="visible" transform="matrix(1 0 0 -1 0 60.54)" width="469.22"><span class="ltx_foreignobject_container"><span class="ltx_foreignobject_content">
<span id="A8.SS1.p1.pic1.2" class="ltx_inline-block ltx_minipage ltx_align_bottom" style="width:33.91em;">
<span id="A8.SS1.p1.pic1.2.1" class="ltx_p"><span id="A8.SS1.p1.pic1.2.1.1" class="ltx_text" style="font-size:90%;--ltx-fg-color:#000000;">{Introduction to this project}</span></span>
<span id="A8.SS1.p1.pic1.2.2" class="ltx_p"><span id="A8.SS1.p1.pic1.2.2.1" class="ltx_text ltx_font_bold" style="font-size:90%;--ltx-fg-color:#000000;">Criteria for Task Proposals<span id="A8.SS1.p1.pic1.2.2.1.1" class="ltx_text"></span></span></span>
<span id="A8.I1" class="ltx_itemize" style="--ltx-enum-leftmargin:1.5em;">
<span id="A8.I1.i1" class="ltx_item" style="list-style-type:none;"><span class="ltx_tag ltx_tag_item">•</span> 
<span id="A8.I1.i1.p1" class="ltx_para">
<span id="A8.I1.i1.p1.1" class="ltx_p"><span id="A8.I1.i1.p1.1.1" class="ltx_text" style="font-size:90%;--ltx-fg-color:#000000;">Tasks should:</span></span>
<span id="A8.I1.i1.I1" class="ltx_itemize">
<span id="A8.I1.i1.I1.i1" class="ltx_item" style="list-style-type:none;"><span class="ltx_tag ltx_tag_item"><span id="A8.I1.i1.I1.i1.1" class="ltx_text ltx_font_bold">–</span></span> 
<span id="A8.I1.i1.I1.i1.p1" class="ltx_para">
<span id="A8.I1.i1.I1.i1.p1.1" class="ltx_p"><span id="A8.I1.i1.I1.i1.p1.1.1" class="ltx_text" style="font-size:90%;--ltx-fg-color:#000000;">Be information-seeking.</span></span>
</span></span>
<span id="A8.I1.i1.I1.i2" class="ltx_item" style="list-style-type:none;"><span class="ltx_tag ltx_tag_item"><span id="A8.I1.i1.I1.i2.1" class="ltx_text ltx_font_bold">–</span></span> 
<span id="A8.I1.i1.I1.i2.p1" class="ltx_para">
<span id="A8.I1.i1.I1.i2.p1.1" class="ltx_p"><span id="A8.I1.i1.I1.i2.p1.1.1" class="ltx_text" style="font-size:90%;--ltx-fg-color:#000000;">Be realistic, reflecting genuine scenarios or previously encountered problems.</span></span>
</span></span>
<span id="A8.I1.i1.I1.i3" class="ltx_item" style="list-style-type:none;"><span class="ltx_tag ltx_tag_item"><span id="A8.I1.i1.I1.i3.1" class="ltx_text ltx_font_bold">–</span></span> 
<span id="A8.I1.i1.I1.i3.p1" class="ltx_para">
<span id="A8.I1.i1.I1.i3.p1.1" class="ltx_p"><span id="A8.I1.i1.I1.i3.p1.1.1" class="ltx_text" style="font-size:90%;--ltx-fg-color:#000000;">Be tedious and sufficiently complex, requiring multiple intermediate steps and taking at least five minutes for a human to complete.</span></span>
</span></span>
<span id="A8.I1.i1.I1.i4" class="ltx_item" style="list-style-type:none;"><span class="ltx_tag ltx_tag_item"><span id="A8.I1.i1.I1.i4.1" class="ltx_text ltx_font_bold">–</span></span> 
<span id="A8.I1.i1.I1.i4.p1" class="ltx_para">
<span id="A8.I1.i1.I1.i4.p1.1" class="ltx_p"><span id="A8.I1.i1.I1.i4.p1.1.1" class="ltx_text" style="font-size:90%;--ltx-fg-color:#000000;">Be verifiable. The agent’s response must include text and reference URLs or be verifiable through established ground truth.</span></span>
</span></span>
<span id="A8.I1.i1.I1.i5" class="ltx_item" style="list-style-type:none;"><span class="ltx_tag ltx_tag_item"><span id="A8.I1.i1.I1.i5.1" class="ltx_text ltx_font_bold">–</span></span> 
<span id="A8.I1.i1.I1.i5.p1" class="ltx_para">
<span id="A8.I1.i1.I1.i5.p1.1" class="ltx_p"><span id="A8.I1.i1.I1.i5.p1.1.1" class="ltx_text" style="font-size:90%;--ltx-fg-color:#000000;">Be single-round tasks (no user clarification required); all necessary information must be clearly included in the description.</span></span>
</span></span>
</span>
</span></span>
<span id="A8.I1.i2" class="ltx_item" style="list-style-type:none;"><span class="ltx_tag ltx_tag_item">•</span> 
<span id="A8.I1.i2.p1" class="ltx_para">
<span id="A8.I1.i2.p1.1" class="ltx_p"><span id="A8.I1.i2.p1.1.1" class="ltx_text" style="font-size:90%;--ltx-fg-color:#000000;">Tasks to avoid:</span></span>
<span id="A8.I1.i2.I1" class="ltx_itemize">
<span id="A8.I1.i2.I1.i1" class="ltx_item" style="list-style-type:none;"><span class="ltx_tag ltx_tag_item"><span id="A8.I1.i2.I1.i1.1" class="ltx_text ltx_font_bold">–</span></span> 
<span id="A8.I1.i2.I1.i1.p1" class="ltx_para">
<span id="A8.I1.i2.I1.i1.p1.1" class="ltx_p"><span id="A8.I1.i2.I1.i1.p1.1.1" class="ltx_text" style="font-size:90%;--ltx-fg-color:#000000;">Tasks requiring user logins.</span></span>
</span></span>
<span id="A8.I1.i2.I1.i2" class="ltx_item" style="list-style-type:none;"><span class="ltx_tag ltx_tag_item"><span id="A8.I1.i2.I1.i2.1" class="ltx_text ltx_font_bold">–</span></span> 
<span id="A8.I1.i2.I1.i2.p1" class="ltx_para">
<span id="A8.I1.i2.I1.i2.p1.1" class="ltx_p"><span id="A8.I1.i2.I1.i2.p1.1.1" class="ltx_text" style="font-size:90%;--ltx-fg-color:#000000;">Simple or quickly resolvable tasks.</span></span>
</span></span>
<span id="A8.I1.i2.I1.i3" class="ltx_item" style="list-style-type:none;"><span class="ltx_tag ltx_tag_item"><span id="A8.I1.i2.I1.i3.1" class="ltx_text ltx_font_bold">–</span></span> 
<span id="A8.I1.i2.I1.i3.p1" class="ltx_para">
<span id="A8.I1.i2.I1.i3.p1.1" class="ltx_p"><span id="A8.I1.i2.I1.i3.p1.1.1" class="ltx_text" style="font-size:90%;--ltx-fg-color:#000000;">Tasks with global qualifiers (e.g., &quot;cheapest,&quot; &quot;best&quot;) that cannot be reliably verified.</span></span>
</span></span>
<span id="A8.I1.i2.I1.i4" class="ltx_item" style="list-style-type:none;"><span class="ltx_tag ltx_tag_item"><span id="A8.I1.i2.I1.i4.1" class="ltx_text ltx_font_bold">–</span></span> 
<span id="A8.I1.i2.I1.i4.p1" class="ltx_para">
<span id="A8.I1.i2.I1.i4.p1.1" class="ltx_p"><span id="A8.I1.i2.I1.i4.p1.1.1" class="ltx_text" style="font-size:90%;--ltx-fg-color:#000000;">Tasks containing vague or subjective elements (e.g., &quot;nice restaurant&quot;).</span></span>
</span></span>
</span>
</span></span>
</span>
</span></span></span></foreignobject></g></g></svg>