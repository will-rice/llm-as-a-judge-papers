<svg id="S5.F5.pic1" class="ltx_picture ltx_centering" height="277.54" overflow="visible" version="1.1" viewbox="0 0 653.15 277.54" width="653.15"><g style="--ltx-stroke-color:#000000;--ltx-fill-color:#000000;" fill="#000000" stroke="#000000" stroke-width="0.4pt" transform="translate(0,277.54) matrix(1 0 0 -1 0 0)"><g style="--ltx-fill-color:#8080FF;" fill="#8080FF" fill-opacity="1.0"><path style="stroke:none" d="M 0 8.57 L 0 268.98 C 0 273.71 3.84 277.54 8.57 277.54 L 644.58 277.54 C 649.31 277.54 653.15 273.71 653.15 268.98 L 653.15 8.57 C 653.15 3.84 649.31 0 644.58 0 L 8.57 0 C 3.84 0 0 3.84 0 8.57 Z" /></g><g style="--ltx-fill-color:#F2F2FF;" fill="#F2F2FF" fill-opacity="1.0"><path style="stroke:none" d="M 0.69 8.57 L 0.69 268.98 C 0.69 273.32 4.22 276.85 8.57 276.85 L 644.58 276.85 C 648.93 276.85 652.46 273.32 652.46 268.98 L 652.46 8.57 C 652.46 4.22 648.93 0.69 644.58 0.69 L 8.57 0.69 C 4.22 0.69 0.69 4.22 0.69 8.57 Z" /></g><g fill-opacity="1.0" transform="matrix(1.0 0.0 0.0 1.0 10.16 11.47)"><foreignobject style="--ltx-fo-width:45.73em;--ltx-fo-height:18.59em;--ltx-fo-depth:0.19em;font-size:10pt;" height="259.98" overflow="visible" transform="matrix(1 0 0 -1 0 257.29)" width="632.77"><span class="ltx_foreignobject_container"><span class="ltx_foreignobject_content"><span id="S5.F5.pic1.1" class="ltx_inline-logical-block ltx_minipage ltx_align_bottom" style="width:45.73em;">
<span id="S5.F5.pic1.p1" class="ltx_para ltx_noindent">
<span id="S5.F5.pic1.p1.1" class="ltx_p"><span id="S5.F5.pic1.p1.1.1" class="ltx_text" style="--ltx-fg-color:#000000;">…**Additional Tips:**</span>
<br class="ltx_break"><span id="S5.F5.pic1.p1.1.2" class="ltx_text" style="--ltx-fg-color:#000000;">- Instruct evaluators to </span><span id="S5.F5.pic1.p1.1.3" class="ltx_text" style="--ltx-fg-color:#FF0000;">systematically check for calculation or logical errors in each answer, not just the reasoning structure</span><span id="S5.F5.pic1.p1.1.4" class="ltx_text" style="--ltx-fg-color:#000000;"> </span><span id="S5.F5.pic1.p1.1.5" class="ltx_text" style="--ltx-fg-color:#0000FF;">penalize both overstatements (e.g., exaggerating color, quantity, or significance) and omissions (e.g., failing to mention a visible but relevant feature)</span><span id="S5.F5.pic1.p1.1.6" class="ltx_text" style="--ltx-fg-color:#000000;">, and to </span><span id="S5.F5.pic1.p1.1.7" class="ltx_text" style="--ltx-fg-color:#FF0000;">penalize answers with such errors even if the explanation appears logical.</span><span id="S5.F5.pic1.p1.1.8" class="ltx_text" style="--ltx-fg-color:#000000;">
</span><span id="S5.F5.pic1.p1.1.9" class="ltx_text" style="--ltx-fg-color:#0000FF;">weigh the impact of these errors on the overall evaluation</span><span id="S5.F5.pic1.p1.1.10" class="ltx_text" style="--ltx-fg-color:#000000;">.
…</span>
<br class="ltx_break"><span id="S5.F5.pic1.p1.1.11" class="ltx_text" style="--ltx-fg-color:#000000;">- Require evaluators to ensure that their final justification is </span><span id="S5.F5.pic1.p1.1.12" class="ltx_text" style="--ltx-fg-color:#FF0000;">comprehensive,</span><span id="S5.F5.pic1.p1.1.13" class="ltx_text" style="--ltx-fg-color:#000000;"> </span><span id="S5.F5.pic1.p1.1.14" class="ltx_text" style="--ltx-fg-color:#0000FF;">not only comprehensive but also balanced,</span><span id="S5.F5.pic1.p1.1.15" class="ltx_text" style="--ltx-fg-color:#000000;"> addressing </span><span id="S5.F5.pic1.p1.1.16" class="ltx_text" style="--ltx-fg-color:#0000FF;">both the strengths and weaknesses of each answer in relation to</span><span id="S5.F5.pic1.p1.1.17" class="ltx_text" style="--ltx-fg-color:#000000;"> every evaluation criterion </span><span id="S5.F5.pic1.p1.1.18" class="ltx_text" style="--ltx-fg-color:#FF0000;"> and step, and not omitting any relevant aspect of the comparison</span><span id="S5.F5.pic1.p1.1.19" class="ltx_text" style="--ltx-fg-color:#000000;">.</span></span>
</span></span></span></span></foreignobject></g></g></svg>