<svg id="S15.SS0.SSS0.Px17.p3.pic1" class="ltx_picture" height="273.95" overflow="visible" version="1.1" viewbox="0 0 477.38 273.95" width="477.38"><g style="--ltx-stroke-color:#000000;--ltx-fill-color:#000000;" fill="#000000" stroke="#000000" stroke-width="0.4pt" transform="translate(0,273.95) matrix(1 0 0 -1 0 0)"><g style="--ltx-fill-color:#4285F4;" fill="#4285F4" fill-opacity="1.0"><path style="stroke:none" d="M 0 7.5 L 0 266.44 C 0 270.59 3.36 273.95 7.5 273.95 L 469.87 273.95 C 474.02 273.95 477.38 270.59 477.38 266.44 L 477.38 7.5 C 477.38 3.36 474.02 0 469.87 0 L 7.5 0 C 3.36 0 0 3.36 0 7.5 Z" /></g><g style="--ltx-fill-color:#F5F5F5;" fill="#F5F5F5" fill-opacity="1.0"><path style="stroke:none" d="M 1.97 7.5 L 1.97 235.57 L 475.41 235.57 L 475.41 7.5 C 475.41 4.45 472.93 1.97 469.87 1.97 L 7.5 1.97 C 4.45 1.97 1.97 4.45 1.97 7.5 Z" /></g><g fill-opacity="1.0" transform="matrix(1.0 0.0 0.0 1.0 20.48 243)"><foreignobject style="--ltx-fo-width:27.43em;--ltx-fo-height:1.89em;--ltx-fo-depth:0.19em;font-size:10pt;" height="28.9" overflow="visible" transform="matrix(1 0 0 -1 0 26.21)" width="379.55"><span class="ltx_foreignobject_container"><span class="ltx_foreignobject_content">
<span id="S15.SS0.SSS0.Px17.p3.pic1.1" class="ltx_inline-block ltx_minipage ltx_align_bottom" style="width:27.43em;">
<span id="S15.SS0.SSS0.Px17.p3.pic1.1.1" class="ltx_p"><span id="S15.SS0.SSS0.Px17.p3.pic1.1.1.1" class="ltx_text" style="position:relative; bottom:0.9pt;"></span><a href="https://codeforces.com/blog/entry/131567" title class="ltx_ref ltx_href ltx_font_bold" style="--ltx-fg-color:#FFFFFF;">Tutorial</a><span id="S15.SS0.SSS0.Px17.p3.pic1.1.1.2" class="ltx_text ltx_font_bold" style="--ltx-fg-color:#FFFFFF;"> — <a href="https://codeforces.com/problemset/submission/1988/270676638" title class="ltx_ref ltx_href">Human’s accepted submission</a> — <a href="https://gist.github.com/anonymous-llm-code/c209048d84c00bc35f5e618056934a7c" title class="ltx_ref ltx_href"><span class="ltx_text ltx_font_typewriter">Gemini 2.5 Pro</span>’s rejected submission</a></span></span>
</span></span></span></foreignobject></g><g fill-opacity="1.0" transform="matrix(1.0 0.0 0.0 1.0 20.48 16.07)"><foreignobject style="--ltx-fo-width:31.54em;--ltx-fo-height:15.09em;--ltx-fo-depth:0.25em;font-size:10pt;" height="212.32" overflow="visible" transform="matrix(1 0 0 -1 0 208.86)" width="436.42"><span class="ltx_foreignobject_container"><span class="ltx_foreignobject_content">
<span id="S15.SS0.SSS0.Px17.p3.pic1.2" class="ltx_inline-block ltx_minipage ltx_align_bottom" style="width:31.54em;">
<span id="S15.SS0.SSS0.Px17.p3.pic1.2.1" class="ltx_p"><span id="S15.SS0.SSS0.Px17.p3.pic1.2.1.1" class="ltx_text" style="--ltx-fg-color:#000000;">It’s obvious that the answer only depends on the popcount of <math id="S15.SS0.SSS0.Px17.p3.pic1.m1" class="ltx_Math" alttext="n" display="inline" intent=":literal"><semantics><mi style="--ltx-fg-color:#000000;" mathcolor="#000000">n</mi><annotation encoding="application/x-tex">n</annotation></semantics></math>. Below, we assume <math id="S15.SS0.SSS0.Px17.p3.pic1.m2" class="ltx_Math" alttext="n=2^{k}-1" display="inline" intent=":literal"><semantics><mrow><mi style="--ltx-fg-color:#000000;" mathcolor="#000000">n</mi><mo style="--ltx-fg-color:#000000;" mathcolor="#000000">=</mo><mrow><msup><mn style="--ltx-fg-color:#000000;" mathcolor="#000000">2</mn><mi style="--ltx-fg-color:#000000;" mathcolor="#000000">k</mi></msup><mo style="--ltx-fg-color:#000000;" mathcolor="#000000">−</mo><mn style="--ltx-fg-color:#000000;" mathcolor="#000000">1</mn></mrow></mrow><annotation encoding="application/x-tex">n=2^{k}-1</annotation></semantics></math>. If <math id="S15.SS0.SSS0.Px17.p3.pic1.m3" class="ltx_Math" alttext="k=1" display="inline" intent=":literal"><semantics><mrow><mi style="--ltx-fg-color:#000000;" mathcolor="#000000">k</mi><mo style="--ltx-fg-color:#000000;" mathcolor="#000000">=</mo><mn style="--ltx-fg-color:#000000;" mathcolor="#000000">1</mn></mrow><annotation encoding="application/x-tex">k=1</annotation></semantics></math>, it is shown in the samples that the length is <math id="S15.SS0.SSS0.Px17.p3.pic1.m4" class="ltx_Math" alttext="1" display="inline" intent=":literal"><semantics><mn style="--ltx-fg-color:#000000;" mathcolor="#000000">1</mn><annotation encoding="application/x-tex">1</annotation></semantics></math>. 
<br class="ltx_break">
<br class="ltx_break">Otherwise, the maximum sequence length for <math id="S15.SS0.SSS0.Px17.p3.pic1.m5" class="ltx_Math" alttext="2^{k}-1" display="inline" intent=":literal"><semantics><mrow><msup><mn style="--ltx-fg-color:#000000;" mathcolor="#000000">2</mn><mi style="--ltx-fg-color:#000000;" mathcolor="#000000">k</mi></msup><mo style="--ltx-fg-color:#000000;" mathcolor="#000000">−</mo><mn style="--ltx-fg-color:#000000;" mathcolor="#000000">1</mn></mrow><annotation encoding="application/x-tex">2^{k}-1</annotation></semantics></math> is <math id="S15.SS0.SSS0.Px17.p3.pic1.m6" class="ltx_Math" alttext="k+1" display="inline" intent=":literal"><semantics><mrow><mi style="--ltx-fg-color:#000000;" mathcolor="#000000">k</mi><mo style="--ltx-fg-color:#000000;" mathcolor="#000000">+</mo><mn style="--ltx-fg-color:#000000;" mathcolor="#000000">1</mn></mrow><annotation encoding="application/x-tex">k+1</annotation></semantics></math>. This can be achieved by <math id="S15.SS0.SSS0.Px17.p3.pic1.m7" class="ltx_Math" alttext="a_{i}=n-2^{i-1}\ (1\leq i\leq k),a_{k+1}=n" display="inline" intent=":literal"><semantics><mrow><mrow><msub><mi style="--ltx-fg-color:#000000;" mathcolor="#000000">a</mi><mi style="--ltx-fg-color:#000000;" mathcolor="#000000">i</mi></msub><mo style="--ltx-fg-color:#000000;" mathcolor="#000000">=</mo><mrow><mi style="--ltx-fg-color:#000000;" mathcolor="#000000">n</mi><mo style="--ltx-fg-color:#000000;" mathcolor="#000000">−</mo><mrow><msup><mn style="--ltx-fg-color:#000000;" mathcolor="#000000">2</mn><mrow><mi style="--ltx-fg-color:#000000;" mathcolor="#000000">i</mi><mo style="--ltx-fg-color:#000000;" mathcolor="#000000">−</mo><mn style="--ltx-fg-color:#000000;" mathcolor="#000000">1</mn></mrow></msup><mo lspace="0em" rspace="0em">​</mo><mrow><mo style="--ltx-fg-color:#000000;" mathcolor="#000000" stretchy="false">(</mo><mrow><mn style="--ltx-fg-color:#000000;" mathcolor="#000000">1</mn><mo style="--ltx-fg-color:#000000;" mathcolor="#000000">≤</mo><mi style="--ltx-fg-color:#000000;" mathcolor="#000000">i</mi><mo style="--ltx-fg-color:#000000;" mathcolor="#000000">≤</mo><mi style="--ltx-fg-color:#000000;" mathcolor="#000000">k</mi></mrow><mo style="--ltx-fg-color:#000000;" mathcolor="#000000" stretchy="false">)</mo></mrow></mrow></mrow></mrow><mo style="--ltx-fg-color:#000000;" mathcolor="#000000">,</mo><mrow><msub><mi style="--ltx-fg-color:#000000;" mathcolor="#000000">a</mi><mrow><mi style="--ltx-fg-color:#000000;" mathcolor="#000000">k</mi><mo style="--ltx-fg-color:#000000;" mathcolor="#000000">+</mo><mn style="--ltx-fg-color:#000000;" mathcolor="#000000">1</mn></mrow></msub><mo style="--ltx-fg-color:#000000;" mathcolor="#000000">=</mo><mi style="--ltx-fg-color:#000000;" mathcolor="#000000">n</mi></mrow></mrow><annotation encoding="application/x-tex">a_{i}=n-2^{i-1}\ (1\leq i\leq k),a_{k+1}=n</annotation></semantics></math>. 
<br class="ltx_break">
<br class="ltx_break">Why? 
<br class="ltx_break">
<br class="ltx_break">Consider the value of <math id="S15.SS0.SSS0.Px17.p3.pic1.m8" class="ltx_Math" alttext="a_{1}" display="inline" intent=":literal"><semantics><msub><mi style="--ltx-fg-color:#000000;" mathcolor="#000000">a</mi><mn style="--ltx-fg-color:#000000;" mathcolor="#000000">1</mn></msub><annotation encoding="application/x-tex">a_{1}</annotation></semantics></math>. Note that its <math id="S15.SS0.SSS0.Px17.p3.pic1.m9" class="ltx_Math" alttext="k" display="inline" intent=":literal"><semantics><mi style="--ltx-fg-color:#000000;" mathcolor="#000000">k</mi><annotation encoding="application/x-tex">k</annotation></semantics></math>-th bit (indexed from <math id="S15.SS0.SSS0.Px17.p3.pic1.m10" class="ltx_Math" alttext="2^{0}" display="inline" intent=":literal"><semantics><msup><mn style="--ltx-fg-color:#000000;" mathcolor="#000000">2</mn><mn style="--ltx-fg-color:#000000;" mathcolor="#000000">0</mn></msup><annotation encoding="application/x-tex">2^{0}</annotation></semantics></math> to <math id="S15.SS0.SSS0.Px17.p3.pic1.m11" class="ltx_Math" alttext="2^{k-1}" display="inline" intent=":literal"><semantics><msup><mn style="--ltx-fg-color:#000000;" mathcolor="#000000">2</mn><mrow><mi style="--ltx-fg-color:#000000;" mathcolor="#000000">k</mi><mo style="--ltx-fg-color:#000000;" mathcolor="#000000">−</mo><mn style="--ltx-fg-color:#000000;" mathcolor="#000000">1</mn></mrow></msup><annotation encoding="application/x-tex">2^{k-1}</annotation></semantics></math>) should be <math id="S15.SS0.SSS0.Px17.p3.pic1.m12" class="ltx_Math" alttext="0" display="inline" intent=":literal"><semantics><mn style="--ltx-fg-color:#000000;" mathcolor="#000000">0</mn><annotation encoding="application/x-tex">0</annotation></semantics></math>, otherwise we would not make use of the largest bit. 
<br class="ltx_break">
<br class="ltx_break">Since <math id="S15.SS0.SSS0.Px17.p3.pic1.m13" class="ltx_Math" alttext="a_{1}" display="inline" intent=":literal"><semantics><msub><mi style="--ltx-fg-color:#000000;" mathcolor="#000000">a</mi><mn style="--ltx-fg-color:#000000;" mathcolor="#000000">1</mn></msub><annotation encoding="application/x-tex">a_{1}</annotation></semantics></math> and <math id="S15.SS0.SSS0.Px17.p3.pic1.m14" class="ltx_Math" alttext="a_{2}" display="inline" intent=":literal"><semantics><msub><mi style="--ltx-fg-color:#000000;" mathcolor="#000000">a</mi><mn style="--ltx-fg-color:#000000;" mathcolor="#000000">2</mn></msub><annotation encoding="application/x-tex">a_{2}</annotation></semantics></math>’s OR is <math id="S15.SS0.SSS0.Px17.p3.pic1.m15" class="ltx_Math" alttext="n" display="inline" intent=":literal"><semantics><mi style="--ltx-fg-color:#000000;" mathcolor="#000000">n</mi><annotation encoding="application/x-tex">n</annotation></semantics></math>, <math id="S15.SS0.SSS0.Px17.p3.pic1.m16" class="ltx_Math" alttext="a_{2}" display="inline" intent=":literal"><semantics><msub><mi style="--ltx-fg-color:#000000;" mathcolor="#000000">a</mi><mn style="--ltx-fg-color:#000000;" mathcolor="#000000">2</mn></msub><annotation encoding="application/x-tex">a_{2}</annotation></semantics></math>’s <math id="S15.SS0.SSS0.Px17.p3.pic1.m17" class="ltx_Math" alttext="k" display="inline" intent=":literal"><semantics><mi style="--ltx-fg-color:#000000;" mathcolor="#000000">k</mi><annotation encoding="application/x-tex">k</annotation></semantics></math>-th bit should be <math id="S15.SS0.SSS0.Px17.p3.pic1.m18" class="ltx_Math" alttext="1" display="inline" intent=":literal"><semantics><mn style="--ltx-fg-color:#000000;" mathcolor="#000000">1</mn><annotation encoding="application/x-tex">1</annotation></semantics></math>, and thus the construction of <math id="S15.SS0.SSS0.Px17.p3.pic1.m19" class="ltx_Math" alttext="a_{2}\sim a_{k+1}" display="inline" intent=":literal"><semantics><mrow><msub><mi style="--ltx-fg-color:#000000;" mathcolor="#000000">a</mi><mn style="--ltx-fg-color:#000000;" mathcolor="#000000">2</mn></msub><mo style="--ltx-fg-color:#000000;" mathcolor="#000000">∼</mo><msub><mi style="--ltx-fg-color:#000000;" mathcolor="#000000">a</mi><mrow><mi style="--ltx-fg-color:#000000;" mathcolor="#000000">k</mi><mo style="--ltx-fg-color:#000000;" mathcolor="#000000">+</mo><mn style="--ltx-fg-color:#000000;" mathcolor="#000000">1</mn></mrow></msub></mrow><annotation encoding="application/x-tex">a_{2}\sim a_{k+1}</annotation></semantics></math> boils down to the subproblem when <math id="S15.SS0.SSS0.Px17.p3.pic1.m20" class="ltx_Math" alttext="n=2^{k-1}-1" display="inline" intent=":literal"><semantics><mrow><mi style="--ltx-fg-color:#000000;" mathcolor="#000000">n</mi><mo style="--ltx-fg-color:#000000;" mathcolor="#000000">=</mo><mrow><msup><mn style="--ltx-fg-color:#000000;" mathcolor="#000000">2</mn><mrow><mi style="--ltx-fg-color:#000000;" mathcolor="#000000">k</mi><mo style="--ltx-fg-color:#000000;" mathcolor="#000000">−</mo><mn style="--ltx-fg-color:#000000;" mathcolor="#000000">1</mn></mrow></msup><mo style="--ltx-fg-color:#000000;" mathcolor="#000000">−</mo><mn style="--ltx-fg-color:#000000;" mathcolor="#000000">1</mn></mrow></mrow><annotation encoding="application/x-tex">n=2^{k-1}-1</annotation></semantics></math>. This shows that <math id="S15.SS0.SSS0.Px17.p3.pic1.m21" class="ltx_Math" alttext="f(k)\leq f(k-1)+1" display="inline" intent=":literal"><semantics><mrow><mrow><mi style="--ltx-fg-color:#000000;" mathcolor="#000000">f</mi><mo>⁡</mo><mrow><mo style="--ltx-fg-color:#000000;" mathcolor="#000000" stretchy="false">(</mo><mi style="--ltx-fg-color:#000000;" mathcolor="#000000">k</mi><mo style="--ltx-fg-color:#000000;" mathcolor="#000000" stretchy="false">)</mo></mrow></mrow><mo style="--ltx-fg-color:#000000;" mathcolor="#000000">≤</mo><mrow><mrow><mi style="--ltx-fg-color:#000000;" mathcolor="#000000">f</mi><mo>⁡</mo><mrow><mo style="--ltx-fg-color:#000000;" mathcolor="#000000" stretchy="false">(</mo><mrow><mi style="--ltx-fg-color:#000000;" mathcolor="#000000">k</mi><mo style="--ltx-fg-color:#000000;" mathcolor="#000000">−</mo><mn style="--ltx-fg-color:#000000;" mathcolor="#000000">1</mn></mrow><mo style="--ltx-fg-color:#000000;" mathcolor="#000000" stretchy="false">)</mo></mrow></mrow><mo style="--ltx-fg-color:#000000;" mathcolor="#000000">+</mo><mn style="--ltx-fg-color:#000000;" mathcolor="#000000">1</mn></mrow></mrow><annotation encoding="application/x-tex">f(k)\leq f(k-1)+1</annotation></semantics></math> where <math id="S15.SS0.SSS0.Px17.p3.pic1.m22" class="ltx_Math" alttext="k" display="inline" intent=":literal"><semantics><mi style="--ltx-fg-color:#000000;" mathcolor="#000000">k</mi><annotation encoding="application/x-tex">k</annotation></semantics></math> is the popcount of <math id="S15.SS0.SSS0.Px17.p3.pic1.m23" class="ltx_Math" alttext="n" display="inline" intent=":literal"><semantics><mi style="--ltx-fg-color:#000000;" mathcolor="#000000">n</mi><annotation encoding="application/x-tex">n</annotation></semantics></math> and <math id="S15.SS0.SSS0.Px17.p3.pic1.m24" class="ltx_Math" alttext="f(k)" display="inline" intent=":literal"><semantics><mrow><mi style="--ltx-fg-color:#000000;" mathcolor="#000000">f</mi><mo>⁡</mo><mrow><mo style="--ltx-fg-color:#000000;" mathcolor="#000000" stretchy="false">(</mo><mi style="--ltx-fg-color:#000000;" mathcolor="#000000">k</mi><mo style="--ltx-fg-color:#000000;" mathcolor="#000000" stretchy="false">)</mo></mrow></mrow><annotation encoding="application/x-tex">f(k)</annotation></semantics></math> is the maximum sequence length. We know that <math id="S15.SS0.SSS0.Px17.p3.pic1.m25" class="ltx_Math" alttext="f(2)=3" display="inline" intent=":literal"><semantics><mrow><mrow><mi style="--ltx-fg-color:#000000;" mathcolor="#000000">f</mi><mo>⁡</mo><mrow><mo style="--ltx-fg-color:#000000;" mathcolor="#000000" stretchy="false">(</mo><mn style="--ltx-fg-color:#000000;" mathcolor="#000000">2</mn><mo style="--ltx-fg-color:#000000;" mathcolor="#000000" stretchy="false">)</mo></mrow></mrow><mo style="--ltx-fg-color:#000000;" mathcolor="#000000">=</mo><mn style="--ltx-fg-color:#000000;" mathcolor="#000000">3</mn></mrow><annotation encoding="application/x-tex">f(2)=3</annotation></semantics></math>, so <math id="S15.SS0.SSS0.Px17.p3.pic1.m26" class="ltx_Math" alttext="f(k)\leq k+1" display="inline" intent=":literal"><semantics><mrow><mrow><mi style="--ltx-fg-color:#000000;" mathcolor="#000000">f</mi><mo>⁡</mo><mrow><mo style="--ltx-fg-color:#000000;" mathcolor="#000000" stretchy="false">(</mo><mi style="--ltx-fg-color:#000000;" mathcolor="#000000">k</mi><mo style="--ltx-fg-color:#000000;" mathcolor="#000000" stretchy="false">)</mo></mrow></mrow><mo style="--ltx-fg-color:#000000;" mathcolor="#000000">≤</mo><mrow><mi style="--ltx-fg-color:#000000;" mathcolor="#000000">k</mi><mo style="--ltx-fg-color:#000000;" mathcolor="#000000">+</mo><mn style="--ltx-fg-color:#000000;" mathcolor="#000000">1</mn></mrow></mrow><annotation encoding="application/x-tex">f(k)\leq k+1</annotation></semantics></math> for all <math id="S15.SS0.SSS0.Px17.p3.pic1.m27" class="ltx_Math" alttext="k\geq 2" display="inline" intent=":literal"><semantics><mrow><mi style="--ltx-fg-color:#000000;" mathcolor="#000000">k</mi><mo style="--ltx-fg-color:#000000;" mathcolor="#000000">≥</mo><mn style="--ltx-fg-color:#000000;" mathcolor="#000000">2</mn></mrow><annotation encoding="application/x-tex">k\geq 2</annotation></semantics></math>.</span></span>
</span></span></span></foreignobject></g></g></svg>