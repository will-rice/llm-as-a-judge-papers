<span id="A5.SS2.p2.pic1.1" class="ltx_inline-block ltx_minipage ltx_align_bottom" style="width:38.86em;">
<span id="A5.SS2.p2.pic1.1.1" class="ltx_p"><span id="A5.SS2.p2.pic1.1.1.1" class="ltx_text ltx_font_bold" style="--ltx-fg-color:#FFFFFF;">System prompt (shared).</span></span>
</span></span></span></foreignobject></g><g fill-opacity="1.0" transform="matrix(1.0 0.0 0.0 1.0 15.84 16.14)"><foreignobject style="--ltx-fo-width:42.56em;--ltx-fo-height:11.41em;--ltx-fo-depth:0.22em;font-size:10pt;" height="160.97" overflow="visible" transform="matrix(1 0 0 -1 0 157.9)" width="588.91"><span class="ltx_foreignobject_container"><span class="ltx_foreignobject_content">
<span id="A5.SS2.p2.pic1.2" class="ltx_inline-block ltx_minipage ltx_align_bottom" style="width:42.56em;">
<span id="A5.SS2.p2.pic1.2.1" class="ltx_p ltx_align_left"><span id="A5.SS2.p2.pic1.2.1.1" class="ltx_text ltx_font_typewriter" style="--ltx-fg-color:#000000;">You are a classifier for LLM judge agreement analysis.</span></span>
<span id="A5.SS2.p2.pic1.2.2" class="ltx_p ltx_align_left"><span id="A5.SS2.p2.pic1.2.2.1" class="ltx_text ltx_font_typewriter" style="--ltx-fg-color:#000000;">You are NOT evaluating the quality or correctness of the judge prompt text itself.</span></span>
<span id="A5.SS2.p2.pic1.2.3" class="ltx_p ltx_align_left"><span id="A5.SS2.p2.pic1.2.3.1" class="ltx_text ltx_font_typewriter" style="--ltx-fg-color:#000000;">Each item describes one of five judges. The five judges use different but semantically similar prompts to score the same model answer. Each judge produces a score.</span></span>
<span id="A5.SS2.p2.pic1.2.4" class="ltx_p ltx_align_left"><span id="A5.SS2.p2.pic1.2.4.1" class="ltx_text ltx_font_typewriter" style="--ltx-fg-color:#000000;">Your task: predict whether this judge’s score would fall in the plurality cluster — whether at least 3 out of the 5 judges assigned the same score as this judge.</span></span>
<span id="A5.SS2.p2.pic1.2.5" class="ltx_p ltx_align_left"><span id="A5.SS2.p2.pic1.2.5.1" class="ltx_text ltx_font_typewriter" style="--ltx-fg-color:#000000;">Categories:</span></span>
<span id="A5.SS2.p2.pic1.2.6" class="ltx_p ltx_align_left"><span id="A5.SS2.p2.pic1.2.6.1" class="ltx_text ltx_font_typewriter" style="--ltx-fg-color:#000000;">- 0: No — this judge’s score is NOT shared by at least 3 of the 5 judges</span></span>
<span id="A5.SS2.p2.pic1.2.7" class="ltx_p ltx_align_left"><span id="A5.SS2.p2.pic1.2.7.1" class="ltx_text ltx_font_typewriter" style="--ltx-fg-color:#000000;">- 1: Yes — this judge’s score matches at least 3 of the 5 judges (plurality agreement)</span></span>
<span id="A5.SS2.p2.pic1.2.8" class="ltx_p ltx_align_left"><span id="A5.SS2.p2.pic1.2.8.1" class="ltx_text ltx_font_typewriter" style="--ltx-fg-color:#000000;">Only output the category number, nothing else.</span></span>
</span></span></span></foreignobject></g></g></svg>