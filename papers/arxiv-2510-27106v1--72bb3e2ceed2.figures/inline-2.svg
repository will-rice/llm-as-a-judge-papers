<span id="S3.F1.pic2.2.1" class="ltx_p"><span id="S3.F1.pic2.2.1.1" class="ltx_text" style="--ltx-fg-color:#000000;">Migaloo is known for his distinctive colouring and for many years was the only documented all-white humpback whale in the world. He has been sighted off the coast of New South Wales state, including the resort town of Byron Bay. Migaloo’s journey up Australia’s east coast has attracted large numbers of whale enthusiasts. The 14m-long mammal was spotted with a companion during his venture north but now appears to be travelling solo. A Twitter account run by the White Whale Research Centre provides real-time updates of the whale’s whereabouts.</span></span>
</span></span></span></foreignobject></g></g></svg>