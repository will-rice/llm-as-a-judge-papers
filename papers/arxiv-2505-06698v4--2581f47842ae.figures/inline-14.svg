<span id="A3.F21.pic1.2.1" class="ltx_p"><span id="A3.F21.pic1.2.1.1" class="ltx_text" style="--ltx-fg-color:#000000;">You are tasked with categorizing a given query into multiple tags based on the following hierarchical classification system. 
<br class="ltx_break">
<br class="ltx_break">### Classification System: 
<br class="ltx_break">{taxonomy} 
<br class="ltx_break">
<br class="ltx_break">### Rules for Tagging: 
<br class="ltx_break">1. **Hierarchy Rule**: If a query matches both a parent node and its child nodes, include both in the tags. 
<br class="ltx_break">2. **Multiple Matches**: If a query matches multiple nodes at the same level, include all matching nodes. 
<br class="ltx_break">3. **No Match**: If a query does not match any nodes under the second-level main categories, assign the tag &quot;Other&quot; to that category. 
<br class="ltx_break">4. **Output Format**: The final output must be enclosed within ‘&lt;tags&gt;‘ and ‘&lt;/tags&gt;‘ tags, and the tags should be provided as a JSON object where the keys are the basis for classification and the values are lists of matching tags. 
<br class="ltx_break">
<br class="ltx_break">### Example: 
<br class="ltx_break">Query: &quot;How can I determine the cause of an event based on multiple contributing factors?&quot; 
<br class="ltx_break">Output: &lt;tags&gt;{{&quot;Reasoning Methods&quot;: [&quot;Multi-factor Attribution&quot;], &quot;Application Domains&quot;: [&quot;Other&quot;], &quot;Thinking Modes&quot;: [&quot;Analytical&quot;], &quot;Task Types&quot;: [&quot;Reasoning&quot;]}}&lt;/tags&gt; 
<br class="ltx_break">
<br class="ltx_break">### Now, analyze the following query: 
<br class="ltx_break">&lt;|begin_of_query|&gt; 
<br class="ltx_break">{query} 
<br class="ltx_break">&lt;|end_of_query|&gt;</span></span>
</span></span></span></foreignobject></g></g></svg>