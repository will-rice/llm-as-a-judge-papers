<svg id="A5.p4.pic1" class="ltx_picture" height="1282.02" overflow="visible" version="1.1" viewbox="0 0 477.38 1282.02" width="477.38"><g style="--ltx-stroke-color:#000000;--ltx-fill-color:#000000;" fill="#000000" stroke="#000000" stroke-width="0.4pt" transform="translate(0,1282.02) matrix(1 0 0 -1 0 0)"><g style="--ltx-fill-color:#CCCCFF;" fill="#CCCCFF" fill-opacity="1.0"><path style="stroke:none" d="M 0 0 L 0 1282.02 L 477.38 1282.02 L 477.38 0 Z" /></g><g style="--ltx-fill-color:#F2F2FF;" fill="#F2F2FF" fill-opacity="1.0"><path style="stroke:none" d="M 0.83 0.83 L 0.83 1258.65 L 476.55 1258.65 L 476.55 0.83 Z" /></g><g fill-opacity="1.0" transform="matrix(1.0 0.0 0.0 1.0 9.49 1266.88)"><foreignobject style="--ltx-fo-width:28.81em;--ltx-fo-height:0.75em;--ltx-fo-depth:0.25em;font-size:10pt;" height="13.84" overflow="visible" transform="matrix(1 0 0 -1 0 10.38)" width="398.65"><span class="ltx_foreignobject_container"><span class="ltx_foreignobject_content">
<span id="A5.p4.pic1.1" class="ltx_inline-block ltx_minipage ltx_align_bottom" style="width:28.81em;">
<span id="A5.p4.pic1.1.1" class="ltx_p"><span id="A5.p4.pic1.1.1.1" class="ltx_text ltx_font_bold" style="--ltx-fg-color:#000000;">(2-a) LLM-Judge: ProofGrader Prompt</span></span>
</span></span></span></foreignobject></g><g fill-opacity="1.0" transform="matrix(1.0 0.0 0.0 1.0 9.49 12.16)"><foreignobject style="--ltx-fo-width:33.13em;--ltx-fo-height:89.52em;--ltx-fo-depth:0.25em;font-size:10pt;" height="1242.09" overflow="visible" transform="matrix(1 0 0 -1 0 1238.63)" width="458.43"><span class="ltx_foreignobject_container"><span class="ltx_foreignobject_content">
<span id="A5.p4.pic1.2" class="ltx_inline-block ltx_minipage ltx_align_bottom" style="width:33.13em;">
<span id="A5.p4.pic1.2.1" class="ltx_p"><span id="A5.p4.pic1.2.1.1" class="ltx_text" style="--ltx-fg-color:#000000;">You are an <span id="A5.p4.pic1.2.1.1.1" class="ltx_text ltx_font_bold">expert math proof grader</span>. You are judging the correctness of an LLM-generated proof for a math problem. 
<br class="ltx_break"></span></span>
<span id="A5.p4.pic1.2.2" class="ltx_p"><span id="A5.p4.pic1.2.2.1" class="ltx_text ltx_font_bold" style="--ltx-fg-color:#000000;">Input
<br class="ltx_break"><span id="A5.p4.pic1.2.2.1.1" class="ltx_text ltx_font_medium">Your input will consist of:</span></span></span>
<span id="A5.I4" class="ltx_itemize ltx_leftmargin_flush">
<span id="A5.I4.i1" class="ltx_item" style="list-style-type:none;"><span class="ltx_tag ltx_tag_item">•</span> 
<span id="A5.I4.i1.p1" class="ltx_para">
<span id="A5.I4.i1.p1.1" class="ltx_p"><span id="A5.I4.i1.p1.1.1" class="ltx_text ltx_font_bold" style="--ltx-fg-color:#000000;">Problem Statement</span><span id="A5.I4.i1.p1.1.2" class="ltx_text" style="--ltx-fg-color:#000000;">: A mathematical problem that the proof is attempting to solve.</span></span>
</span></span>
<span id="A5.I4.i2" class="ltx_item" style="list-style-type:none;"><span class="ltx_tag ltx_tag_item">•</span> 
<span id="A5.I4.i2.p1" class="ltx_para">
<span id="A5.I4.i2.p1.1" class="ltx_p"><span id="A5.I4.i2.p1.1.1" class="ltx_text ltx_font_bold" style="--ltx-fg-color:#000000;">Proof Solution</span><span id="A5.I4.i2.p1.1.2" class="ltx_text" style="--ltx-fg-color:#000000;">: The proof that you need to evaluate. This proof may contain errors, omissions, or unclear steps. The proof was generated by another language model. </span>
<br class="ltx_break"></span>
</span></span>
</span>
<span id="A5.p4.pic1.2.3" class="ltx_p"><span id="A5.p4.pic1.2.3.1" class="ltx_text ltx_font_bold" style="--ltx-fg-color:#000000;">Task
<br class="ltx_break"><span id="A5.p4.pic1.2.3.1.1" class="ltx_text ltx_font_medium">Analyze the proof carefully.</span></span></span>
<span id="A5.I5" class="ltx_itemize ltx_leftmargin_flush">
<span id="A5.I5.i1" class="ltx_item" style="list-style-type:none;"><span class="ltx_tag ltx_tag_item">•</span> 
<span id="A5.I5.i1.p1" class="ltx_para">
<span id="A5.I5.i1.p1.1" class="ltx_p"><span id="A5.I5.i1.p1.1.1" class="ltx_text" style="--ltx-fg-color:#000000;">Identify logical errors, incorrect steps, or unclear reasoning.</span></span>
</span></span>
<span id="A5.I5.i2" class="ltx_item" style="list-style-type:none;"><span class="ltx_tag ltx_tag_item">•</span> 
<span id="A5.I5.i2.p1" class="ltx_para">
<span id="A5.I5.i2.p1.1" class="ltx_p"><span id="A5.I5.i2.p1.1.1" class="ltx_text" style="--ltx-fg-color:#000000;">Give an </span><span id="A5.I5.i2.p1.1.2" class="ltx_text ltx_font_bold" style="--ltx-fg-color:#000000;">integer</span><span id="A5.I5.i2.p1.1.3" class="ltx_text" style="--ltx-fg-color:#000000;"> score between 0 and 7 with a brief overall assessment. </span>
<br class="ltx_break"></span>
</span></span>
</span>
<span id="A5.p4.pic1.2.4" class="ltx_p"><span id="A5.p4.pic1.2.4.1" class="ltx_text ltx_font_bold" style="--ltx-fg-color:#000000;">Output Format
<br class="ltx_break"><span id="A5.p4.pic1.2.4.1.1" class="ltx_text ltx_font_medium">Respond with </span>only<span id="A5.p4.pic1.2.4.1.2" class="ltx_text ltx_font_medium"> well-formed XML using the structure below.
<br class="ltx_break">Do not include any extra text or Markdown. 
<br class="ltx_break"></span></span></span>
<span id="A5.p4.pic1.2.5" class="ltx_p"><span id="A5.p4.pic1.2.5.1" class="ltx_text ltx_font_bold" style="--ltx-fg-color:#000000;">Requirements:<span id="A5.p4.pic1.2.5.1.1" class="ltx_text"></span></span></span>
<span id="A5.I6" class="ltx_itemize ltx_leftmargin_flush">
<span id="A5.I6.i1" class="ltx_item" style="list-style-type:none;"><span class="ltx_tag ltx_tag_item">•</span> 
<span id="A5.I6.i1.p1" class="ltx_para">
<span id="A5.I6.i1.p1.1" class="ltx_p"><code id="A5.I6.i1.p1.1.1" class="ltx_verbatim ltx_font_typewriter" style="--ltx-fg-color:#000000;">&lt;score&gt;</code><span id="A5.I6.i1.p1.1.2" class="ltx_text" style="--ltx-fg-color:#000000;"> must be an integer in <code id="A5.I6.i1.p1.1.2.1" class="ltx_verbatim ltx_font_typewriter">[0, 7]</code>.</span></span>
</span></span>
<span id="A5.I6.i2" class="ltx_item" style="list-style-type:none;"><span class="ltx_tag ltx_tag_item">•</span> 
<span id="A5.I6.i2.p1" class="ltx_para">
<span id="A5.I6.i2.p1.1" class="ltx_p"><code id="A5.I6.i2.p1.1.1" class="ltx_verbatim ltx_font_typewriter" style="--ltx-fg-color:#000000;">&lt;assessment&gt;</code><span id="A5.I6.i2.p1.1.2" class="ltx_text" style="--ltx-fg-color:#000000;"> must be a <span id="A5.I6.i2.p1.1.2.1" class="ltx_text ltx_font_bold">detailed analysis</span> that explains your reasoning step-by-step and provides a clear <span id="A5.I6.i2.p1.1.2.2" class="ltx_text ltx_font_bold">rationale for the score</span>. Reference specific claims/lines if present.</span></span>
</span></span>
<span id="A5.I6.i3" class="ltx_item" style="list-style-type:none;"><span class="ltx_tag ltx_tag_item">•</span> 
<span id="A5.I6.i3.p1" class="ltx_para">
<span id="A5.I6.i3.p1.1" class="ltx_p"><code id="A5.I6.i3.p1.1.1" class="ltx_verbatim ltx_font_typewriter" style="--ltx-fg-color:#000000;">&lt;errors&gt;</code><span id="A5.I6.i3.p1.1.2" class="ltx_text" style="--ltx-fg-color:#000000;"> must be a list of specific issues (empty if score = 7). 
<br class="ltx_break"></span></span>
</span></span>
</span>
<span id="A5.p4.pic1.2.6" class="ltx_p"><span id="A5.p4.pic1.2.6.1" class="ltx_text ltx_font_bold" style="--ltx-fg-color:#000000;">Example output:<span id="A5.p4.pic1.2.6.1.1" class="ltx_text"></span></span></span><pre id="A5.p4.pic1.2.7" class="ltx_verbatim ltx_font_typewriter" style="--ltx-fg-color:#000000;">
&lt;score&gt;0&lt;/score&gt;
&lt;assessment&gt;The proof shows a good understanding of the main idea, but has
some unclear reasoning and minor mistakes...&lt;/assessment&gt;
&lt;errors&gt;
1. specific error 1,
2. specific error 2,
...
&lt;/errors&gt;
</pre>
<span id="A5.p4.pic1.2.8" class="ltx_p"><span id="A5.p4.pic1.2.8.1" class="ltx_text ltx_font_bold" style="--ltx-fg-color:#000000;">Scoring Guidelines (0–7 scale)<span id="A5.p4.pic1.2.8.1.1" class="ltx_text"></span></span></span>
<span id="A5.I7" class="ltx_itemize ltx_leftmargin_flush">
<span id="A5.I7.i1" class="ltx_item" style="list-style-type:none;"><span class="ltx_tag ltx_tag_item">•</span> 
<span id="A5.I7.i1.p1" class="ltx_para">
<span id="A5.I7.i1.p1.1" class="ltx_p"><span id="A5.I7.i1.p1.1.1" class="ltx_text ltx_font_bold" style="--ltx-fg-color:#000000;">0</span><span id="A5.I7.i1.p1.1.2" class="ltx_text" style="--ltx-fg-color:#000000;">: Completely incorrect; proof is irrelevant, nonsensical, or shows no understanding.</span></span>
</span></span>
<span id="A5.I7.i2" class="ltx_item" style="list-style-type:none;"><span class="ltx_tag ltx_tag_item">•</span> 
<span id="A5.I7.i2.p1" class="ltx_para">
<span id="A5.I7.i2.p1.1" class="ltx_p"><span id="A5.I7.i2.p1.1.1" class="ltx_text ltx_font_bold" style="--ltx-fg-color:#000000;">1–2</span><span id="A5.I7.i2.p1.1.2" class="ltx_text" style="--ltx-fg-color:#000000;">: Very poor; major logical flaws, does not solve the problem, but may contain fragments of relevant reasoning.</span></span>
</span></span>
<span id="A5.I7.i3" class="ltx_item" style="list-style-type:none;"><span class="ltx_tag ltx_tag_item">•</span> 
<span id="A5.I7.i3.p1" class="ltx_para">
<span id="A5.I7.i3.p1.1" class="ltx_p"><span id="A5.I7.i3.p1.1.1" class="ltx_text ltx_font_bold" style="--ltx-fg-color:#000000;">3–4</span><span id="A5.I7.i3.p1.1.2" class="ltx_text" style="--ltx-fg-color:#000000;">: Partial progress; captures some correct reasoning or key ideas, but has significant logical errors, missing steps, or incomplete arguments that make the proof invalid overall.</span></span>
</span></span>
<span id="A5.I7.i4" class="ltx_item" style="list-style-type:none;"><span class="ltx_tag ltx_tag_item">•</span> 
<span id="A5.I7.i4.p1" class="ltx_para">
<span id="A5.I7.i4.p1.1" class="ltx_p"><span id="A5.I7.i4.p1.1.1" class="ltx_text ltx_font_bold" style="--ltx-fg-color:#000000;">5–6</span><span id="A5.I7.i4.p1.1.2" class="ltx_text" style="--ltx-fg-color:#000000;">: Largely correct; the proof is overall valid and reaches the correct conclusion. Contains only </span><span id="A5.I7.i4.p1.1.3" class="ltx_text ltx_font_bold" style="--ltx-fg-color:#000000;">minor issues</span><span id="A5.I7.i4.p1.1.4" class="ltx_text" style="--ltx-fg-color:#000000;"> (e.g., small calculation mistakes, notation slips, or slightly unclear wording) that do not undermine correctness.</span></span>
</span></span>
<span id="A5.I7.i5" class="ltx_item" style="list-style-type:none;"><span class="ltx_tag ltx_tag_item">•</span> 
<span id="A5.I7.i5.p1" class="ltx_para">
<span id="A5.I7.i5.p1.1" class="ltx_p"><span id="A5.I7.i5.p1.1.1" class="ltx_text ltx_font_bold" style="--ltx-fg-color:#000000;">7</span><span id="A5.I7.i5.p1.1.2" class="ltx_text" style="--ltx-fg-color:#000000;">: Fully correct; the proof is complete, logically sound, and clearly presented with no substantive errors.</span></span>
</span></span>
</span><span class="ltx_rule" style="width:100%;height:1px;--ltx-fg-color:#000000;--ltx-bg-color:#000000;display:inline-block;"> </span>
<span id="A5.p4.pic1.2.9" class="ltx_p"><span id="A5.p4.pic1.2.9.1" class="ltx_text ltx_font_bold" style="--ltx-fg-color:#000000;">Problem Statement
<br class="ltx_break"><code id="A5.p4.pic1.2.9.1.1" class="ltx_verbatim ltx_font_typewriter ltx_font_medium">{original question}</code><span id="A5.p4.pic1.2.9.1.2" class="ltx_text"></span></span></span>
<span id="A5.p4.pic1.2.10" class="ltx_p"><span id="A5.p4.pic1.2.10.1" class="ltx_text ltx_font_bold" style="--ltx-fg-color:#000000;">Proof Solution
<br class="ltx_break"><code id="A5.p4.pic1.2.10.1.1" class="ltx_verbatim ltx_font_typewriter ltx_font_medium">{candidate solution}</code><span id="A5.p4.pic1.2.10.1.2" class="ltx_text"></span></span></span>
</span></span></span></foreignobject></g></g></svg>