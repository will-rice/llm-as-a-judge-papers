<span id="A4.SS4.p2.pic1.p6.1" class="ltx_p"><span id="A4.SS4.p2.pic1.p6.1.1" class="ltx_text ltx_font_bold" style="--ltx-fg-color:#000000;">Output B
<br class="ltx_break"><span id="A4.SS4.p2.pic1.p6.1.1.1" class="ltx_text ltx_font_medium">The Pizzeria offers great quality food at affordable prices. It is a quiet and cozy place with a nice staff. The pizza is delicious and the atmosphere is pleasant. Overall, this is a great place to grab a bite to eat.</span></span></span>
