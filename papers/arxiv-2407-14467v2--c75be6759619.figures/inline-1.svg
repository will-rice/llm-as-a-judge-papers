<span id="S3.F2.pic1.1" class="ltx_inline-block ltx_minipage ltx_align_bottom" style="width:41.23em;">
<span id="S3.F2.pic1.1.1" class="ltx_p"><span id="S3.F2.pic1.1.1.1" class="ltx_text ltx_font_bold" style="--ltx-fg-color:#000000;">[System]
<br class="ltx_break"><span id="S3.F2.pic1.1.1.1.1" class="ltx_text ltx_font_medium">Your task is to write a checklist of the elements a <span id="S3.F2.pic1.1.1.1.1.1" class="ltx_text" style="--ltx-fg-color:#0000FF;">relevant</span> text summary should have.
<br class="ltx_break">
<br class="ltx_break"><span id="S3.F2.pic1.1.1.1.1.2" class="ltx_text" style="--ltx-fg-color:#0000FF;">Relevance definition: selection of important content from the source. The summary should include only important information from the source document. Annotators were instructed to penalize summaries that contained redundancies and excess information.
<br class="ltx_break">
<br class="ltx_break"></span>You must follow the following rules:
<br class="ltx_break">
<br class="ltx_break">1. The checklist should contain yes/no questions.
<br class="ltx_break">2. Checklist items must be self-contained.
<br class="ltx_break">3. Focus on the main concepts and avoid including minor details.
<br class="ltx_break">4. Each item should represent a unique concept or element from the text.
<br class="ltx_break">5. Avoid repetition and overlapping of concepts in the checklist items.
<br class="ltx_break">6. The checklist should be comprehensive but not exhaustive, aiming for clarity and brevity.
<br class="ltx_break">7. Generate as many items as you think are necessary
<br class="ltx_break"></span></span></span>
<span id="S3.F2.pic1.1.2" class="ltx_p"><span id="S3.F2.pic1.1.2.1" class="ltx_text ltx_font_bold" style="--ltx-fg-color:#000000;">[User]<span id="S3.F2.pic1.1.2.1.1" class="ltx_text ltx_font_medium">

<br class="ltx_break">
<br class="ltx_break">{source text}</span></span></span>
</span></span></span></foreignobject></g></g></svg>