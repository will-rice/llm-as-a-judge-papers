<span id="A1.F6.pic1.1" class="ltx_inline-block ltx_minipage ltx_align_bottom" style="width:38.32em;">
<span id="A1.F6.pic1.1.1" class="ltx_p"><span id="A1.F6.pic1.1.1.1" class="ltx_text ltx_font_bold" style="--ltx-fg-color:#FFFFFF;">Prompt: Personalization Confusion Matrix Guided Response Generation</span></span>
</span></span></span></foreignobject></g><g fill-opacity="1.0" transform="matrix(1.0 0.0 0.0 1.0 21.65 16.47)"><foreignobject style="--ltx-fo-width:44.07em;--ltx-fo-height:34.35em;--ltx-fo-depth:0.19em;font-size:10pt;" height="478" overflow="visible" transform="matrix(1 0 0 -1 0 475.31)" width="609.8"><span class="ltx_foreignobject_container"><span class="ltx_foreignobject_content">
<span id="A1.F6.pic1.2" class="ltx_inline-block ltx_minipage ltx_align_bottom" style="width:44.07em;">
<span id="A1.F6.pic1.2.1" class="ltx_p"><span id="A1.F6.pic1.2.1.1" class="ltx_text ltx_font_bold" style="--ltx-fg-color:#000000;">System/Role:<span id="A1.F6.pic1.2.1.1.1" class="ltx_text ltx_font_medium"> You are an expert educator and creative synthesizer. Your task is to explain a specific concept (the correct answer to an exam question) by contextualizing it entirely through the lens of a topic the user is specifically interested in.</span></span></span>
<span id="A1.F6.pic1.2.2" class="ltx_p"><span id="A1.F6.pic1.2.2.1" class="ltx_text ltx_font_bold" style="--ltx-fg-color:#000000;">INPUTS:
<br class="ltx_break">1.The Exam Question:<span id="A1.F6.pic1.2.2.1.1" class="ltx_text ltx_font_medium"> <span id="A1.F6.pic1.2.2.1.1.1" class="ltx_text ltx_font_typewriter">{query_sentence}</span>

<br class="ltx_break"></span>2.Concept to Explain:<span id="A1.F6.pic1.2.2.1.2" class="ltx_text ltx_font_medium"> <span id="A1.F6.pic1.2.2.1.2.1" class="ltx_text ltx_font_typewriter">{answer_phrase}</span>

<br class="ltx_break"></span>3.User’s Perspective Topics:<span id="A1.F6.pic1.2.2.1.3" class="ltx_text ltx_font_medium"> <span id="A1.F6.pic1.2.2.1.3.1" class="ltx_text ltx_font_typewriter">{answer_direction}</span></span></span></span>
<span id="A1.F6.pic1.2.3" class="ltx_p"><span id="A1.F6.pic1.2.3.1" class="ltx_text ltx_font_bold" style="--ltx-fg-color:#000000;">OUTPUT REQUIREMENTS:<span id="A1.F6.pic1.2.3.1.1" class="ltx_text ltx_font_medium"> Please structure your response strictly using the following sections:
<br class="ltx_break"></span></span></span>
<span id="A1.F6.pic1.2.4" class="ltx_p"><span id="A1.F6.pic1.2.4.1" class="ltx_text ltx_font_bold" style="--ltx-fg-color:#000000;">Core Definition:<span id="A1.F6.pic1.2.4.1.1" class="ltx_text ltx_font_medium"> Briefly and accurately explain what <span id="A1.F6.pic1.2.4.1.1.1" class="ltx_text ltx_font_typewriter">{answer_phrase}</span> means in its original, literal context (1-2 sentences).

<br class="ltx_break"></span>The Bridge:<span id="A1.F6.pic1.2.4.1.2" class="ltx_text ltx_font_medium"> Explicitly draw a conceptual bridge connecting the core mechanics of <span id="A1.F6.pic1.2.4.1.2.1" class="ltx_text ltx_font_typewriter">{answer_phrase}</span> to the field of <span id="A1.F6.pic1.2.4.1.2.2" class="ltx_text ltx_font_typewriter">{answer_direction}</span>.

<br class="ltx_break"></span>Perspective Expansion:<span id="A1.F6.pic1.2.4.1.3" class="ltx_text ltx_font_medium"> Elaborate on the concept using analogies, frameworks, terminology, or real-world applications strictly from the perspective of <span id="A1.F6.pic1.2.4.1.3.1" class="ltx_text ltx_font_typewriter">{answer_direction}</span>.

<br class="ltx_break"></span>Tone &amp; Format:<span id="A1.F6.pic1.2.4.1.4" class="ltx_text ltx_font_medium"> Keep the tone informative, engaging, and accessible. Use clear headings for the sections above and bullet points where appropriate for readability.</span></span></span>
</span></span></span></foreignobject></g></g></svg>