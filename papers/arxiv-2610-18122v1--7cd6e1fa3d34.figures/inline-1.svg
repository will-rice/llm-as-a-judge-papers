<span id="A2.SS1.p2.pic1.2" class="ltx_inline-block ltx_minipage ltx_align_bottom" style="width:45.53em;">
<span id="A2.SS1.p2.pic1.2.1" class="ltx_p ltx_align_left"><span id="A2.SS1.p2.pic1.2.1.1" class="ltx_text ltx_font_bold" style="--ltx-fg-color:#000000;">Question:</span><span id="A2.SS1.p2.pic1.2.1.2" class="ltx_text" style="--ltx-fg-color:#2E6B4F;">{<span id="A2.SS1.p2.pic1.2.1.2.1" class="ltx_text ltx_font_italic">question</span>}</span></span>
<span id="A2.SS1.p2.pic1.2.2" class="ltx_p ltx_align_left"><span id="A2.SS1.p2.pic1.2.2.1" class="ltx_text ltx_font_bold" style="--ltx-fg-color:#000000;">Answer:</span><span id="A2.SS1.p2.pic1.2.2.2" class="ltx_text" style="--ltx-fg-color:#2E6B4F;">{<span id="A2.SS1.p2.pic1.2.2.2.1" class="ltx_text ltx_font_italic">answer</span>}</span></span>
<span id="A2.SS1.p2.pic1.2.3" class="ltx_p ltx_align_left"><span id="A2.SS1.p2.pic1.2.3.1" class="ltx_text" style="--ltx-fg-color:#000000;">Now please generate two answers based on this official answer, one with better quality and the other with worse
quality.</span></span>
<span id="A2.SS1.p2.pic1.2.4" class="ltx_p ltx_align_left"><span id="A2.SS1.p2.pic1.2.4.1" class="ltx_text" style="--ltx-fg-color:#000000;">A better quality answer needs to meet the following requirements:</span></span>
<span id="A2.SS1.p2.pic1.2.5" class="ltx_p ltx_align_left"><span id="A2.SS1.p2.pic1.2.5.1" class="ltx_text ltx_font_bold" style="--ltx-fg-color:#000000;">Factuality:<span id="A2.SS1.p2.pic1.2.5.1.1" class="ltx_text ltx_font_medium">Whether the information provided in the response is accurate, based on reliable facts and
data.</span></span></span>
<span id="A2.SS1.p2.pic1.2.6" class="ltx_p ltx_align_left"><span id="A2.SS1.p2.pic1.2.6.1" class="ltx_text ltx_font_bold" style="--ltx-fg-color:#000000;">User Satisfaction:<span id="A2.SS1.p2.pic1.2.6.1.1" class="ltx_text ltx_font_medium">Whether the response meets the user’s question and needs, and provides a comprehensive
and appropriate answer to the question.</span></span></span>
<span id="A2.SS1.p2.pic1.2.7" class="ltx_p ltx_align_left"><span id="A2.SS1.p2.pic1.2.7.1" class="ltx_text ltx_font_bold" style="--ltx-fg-color:#000000;">Logical Coherence:<span id="A2.SS1.p2.pic1.2.7.1.1" class="ltx_text ltx_font_medium">Whether the response maintains overall consistency and logical coherence between
different sections, avoiding self-contradiction.</span></span></span>
<span id="A2.SS1.p2.pic1.2.8" class="ltx_p ltx_align_left"><span id="A2.SS1.p2.pic1.2.8.1" class="ltx_text ltx_font_bold" style="--ltx-fg-color:#000000;">Clarity:<span id="A2.SS1.p2.pic1.2.8.1.1" class="ltx_text ltx_font_medium">Whether the response is clear and understandable, and whether it uses concise language and
structure so that the user can easily understand it.</span></span></span>
<span id="A2.SS1.p2.pic1.2.9" class="ltx_p ltx_align_left"><span id="A2.SS1.p2.pic1.2.9.1" class="ltx_text ltx_font_bold" style="--ltx-fg-color:#000000;">Completeness:<span id="A2.SS1.p2.pic1.2.9.1.1" class="ltx_text ltx_font_medium">Whether the response provides sufficient information and details to meet the user’s needs,
and whether it avoids omitting important aspects.</span></span></span>
<span id="A2.SS1.p2.pic1.2.10" class="ltx_p ltx_align_left"><span id="A2.SS1.p2.pic1.2.10.1" class="ltx_text" style="--ltx-fg-color:#000000;">the worse quality answers should lack User Satisfaction, Logical Coherence,Clarity, but must meet Factuality and
Completeness. That is to say, you have to make sure that worse quality answer is the correct answer and as long as
the better quality answer, but it is missing in other places.</span></span>
<span id="A2.SS1.p2.pic1.2.11" class="ltx_p ltx_align_left"><span id="A2.SS1.p2.pic1.2.11.1" class="ltx_text" style="--ltx-fg-color:#000000;">Please try to keep the format of the original answer when outputting the answer, and make the length of the two
answers as equal as possible.</span></span>
<span id="A2.SS1.p2.pic1.2.12" class="ltx_p ltx_align_left"><span id="A2.SS1.p2.pic1.2.12.1" class="ltx_text" style="--ltx-fg-color:#000000;">The output format is:</span></span>
<span id="A2.SS1.p2.pic1.2.13" class="ltx_p ltx_align_left"><span id="A2.SS1.p2.pic1.2.13.1" class="ltx_text ltx_font_typewriter" style="--ltx-fg-color:#000000;">[Answer1]:</span><span id="A2.SS1.p2.pic1.2.13.2" class="ltx_text" style="--ltx-fg-color:#2E6B4F;">{<span id="A2.SS1.p2.pic1.2.13.2.1" class="ltx_text ltx_font_italic">better quality answer</span>}
<br class="ltx_break"><span id="A2.SS1.p2.pic1.2.13.2.2" class="ltx_text ltx_font_typewriter" style="--ltx-fg-color:#000000;">|||
<br class="ltx_break">[Answer2]:</span>{<span id="A2.SS1.p2.pic1.2.13.2.3" class="ltx_text ltx_font_italic">worse quality answer</span>}</span></span>
<span id="A2.SS1.p2.pic1.2.14" class="ltx_p ltx_align_left"><span id="A2.SS1.p2.pic1.2.14.1" class="ltx_text" style="--ltx-fg-color:#000000;">Please do not explain why the second one is worse</span></span>
