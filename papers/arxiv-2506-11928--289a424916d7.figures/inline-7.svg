<svg id="S15.SS0.SSS0.Px1.p2.pic1" class="ltx_picture" height="345.81" overflow="visible" version="1.1" viewbox="0 0 477.38 345.81" width="477.38"><g style="--ltx-stroke-color:#000000;--ltx-fill-color:#000000;" fill="#000000" stroke="#000000" stroke-width="0.4pt" transform="translate(0,345.81) matrix(1 0 0 -1 0 0)"><g style="--ltx-fill-color:#BF0000;" fill="#BF0000" fill-opacity="1.0"><path style="stroke:none" d="M 0 5.91 L 0 339.91 C 0 343.17 2.64 345.81 5.91 345.81 L 471.47 345.81 C 474.73 345.81 477.38 343.17 477.38 339.91 L 477.38 5.91 C 477.38 2.64 474.73 0 471.47 0 L 5.91 0 C 2.64 0 0 2.64 0 5.91 Z" /></g><g style="--ltx-fill-color:#FFF2F2;" fill="#FFF2F2" fill-opacity="1.0"><path style="stroke:none" d="M 1.97 5.91 L 1.97 320.16 L 475.41 320.16 L 475.41 5.91 C 475.41 3.73 473.65 1.97 471.47 1.97 L 5.91 1.97 C 3.73 1.97 1.97 3.73 1.97 5.91 Z" /></g><g fill-opacity="1.0" transform="matrix(1.0 0.0 0.0 1.0 21.65 329.53)"><foreignobject style="--ltx-fo-width:31.37em;--ltx-fo-height:0.75em;--ltx-fo-depth:0.25em;font-size:10pt;" height="13.84" overflow="visible" transform="matrix(1 0 0 -1 0 10.38)" width="434.07"><span class="ltx_foreignobject_container"><span class="ltx_foreignobject_content">
<span id="S15.SS0.SSS0.Px1.p2.pic1.1" class="ltx_inline-block ltx_minipage ltx_align_bottom" style="width:31.37em;">
<span id="S15.SS0.SSS0.Px1.p2.pic1.1.1" class="ltx_p"><a href="https://codeforces.com/problemset/problem/2050/D" title class="ltx_ref ltx_href" style="--ltx-fg-color:#FFFFFF;">Example String Problem (Rated 1300)</a></span>
</span></span></span></foreignobject></g><g fill-opacity="1.0" transform="matrix(1.0 0.0 0.0 1.0 21.65 16.47)"><foreignobject style="--ltx-fo-width:31.37em;--ltx-fo-height:21.09em;--ltx-fo-depth:0.19em;font-size:10pt;" height="294.58" overflow="visible" transform="matrix(1 0 0 -1 0 291.89)" width="434.07"><span class="ltx_foreignobject_container"><span class="ltx_foreignobject_content">
<span id="S15.SS0.SSS0.Px1.p2.pic1.2" class="ltx_inline-block ltx_minipage ltx_align_bottom" style="width:31.37em;">
<span id="S15.SS0.SSS0.Px1.p2.pic1.2.1" class="ltx_p"><span id="S15.SS0.SSS0.Px1.p2.pic1.2.1.1" class="ltx_text" style="--ltx-fg-color:#000000;">You are given a string <math id="S15.SS0.SSS0.Px1.p2.pic1.m1" class="ltx_Math" alttext="s" display="inline" intent=":literal"><semantics><mi style="--ltx-fg-color:#000000;" mathcolor="#000000">s</mi><annotation encoding="application/x-tex">s</annotation></semantics></math>, consisting of digits from <math id="S15.SS0.SSS0.Px1.p2.pic1.m2" class="ltx_Math" alttext="0" display="inline" intent=":literal"><semantics><mn style="--ltx-fg-color:#000000;" mathcolor="#000000">0</mn><annotation encoding="application/x-tex">0</annotation></semantics></math> to <math id="S15.SS0.SSS0.Px1.p2.pic1.m3" class="ltx_Math" alttext="9" display="inline" intent=":literal"><semantics><mn style="--ltx-fg-color:#000000;" mathcolor="#000000">9</mn><annotation encoding="application/x-tex">9</annotation></semantics></math>. In one operation, you can pick any digit in this string, except for <math id="S15.SS0.SSS0.Px1.p2.pic1.m4" class="ltx_Math" alttext="0" display="inline" intent=":literal"><semantics><mn style="--ltx-fg-color:#000000;" mathcolor="#000000">0</mn><annotation encoding="application/x-tex">0</annotation></semantics></math> or the leftmost digit, decrease it by <math id="S15.SS0.SSS0.Px1.p2.pic1.m5" class="ltx_Math" alttext="1" display="inline" intent=":literal"><semantics><mn style="--ltx-fg-color:#000000;" mathcolor="#000000">1</mn><annotation encoding="application/x-tex">1</annotation></semantics></math>, and then swap it with the digit left to the picked. 
<br class="ltx_break">
<br class="ltx_break">For example, in one operation from the string <math id="S15.SS0.SSS0.Px1.p2.pic1.m6" class="ltx_Math" alttext="1023" display="inline" intent=":literal"><semantics><mn style="--ltx-fg-color:#000000;" mathcolor="#000000">1023</mn><annotation encoding="application/x-tex">1023</annotation></semantics></math>, you can get <math id="S15.SS0.SSS0.Px1.p2.pic1.m7" class="ltx_Math" alttext="1103" display="inline" intent=":literal"><semantics><mn style="--ltx-fg-color:#000000;" mathcolor="#000000">1103</mn><annotation encoding="application/x-tex">1103</annotation></semantics></math> or <math id="S15.SS0.SSS0.Px1.p2.pic1.m8" class="ltx_Math" alttext="1022" display="inline" intent=":literal"><semantics><mn style="--ltx-fg-color:#000000;" mathcolor="#000000">1022</mn><annotation encoding="application/x-tex">1022</annotation></semantics></math>. 
<br class="ltx_break">
<br class="ltx_break">Find the lexicographically maximum string you can obtain after any number of operations. 
<br class="ltx_break">
<br class="ltx_break"><span id="S15.SS0.SSS0.Px1.p2.pic1.2.1.1.1" class="ltx_text ltx_font_bold">Input</span> 
<br class="ltx_break">The first line of the input consists of an integer <math id="S15.SS0.SSS0.Px1.p2.pic1.m9" class="ltx_Math" alttext="t\ (1\leq t\leq 10^{4})" display="inline" intent=":literal"><semantics><mrow><mi style="--ltx-fg-color:#000000;" mathcolor="#000000">t</mi><mo lspace="0.500em">⁡</mo><mrow><mo style="--ltx-fg-color:#000000;" mathcolor="#000000" stretchy="false">(</mo><mrow><mn style="--ltx-fg-color:#000000;" mathcolor="#000000">1</mn><mo style="--ltx-fg-color:#000000;" mathcolor="#000000">≤</mo><mi style="--ltx-fg-color:#000000;" mathcolor="#000000">t</mi><mo style="--ltx-fg-color:#000000;" mathcolor="#000000">≤</mo><msup><mn style="--ltx-fg-color:#000000;" mathcolor="#000000">10</mn><mn style="--ltx-fg-color:#000000;" mathcolor="#000000">4</mn></msup></mrow><mo style="--ltx-fg-color:#000000;" mathcolor="#000000" stretchy="false">)</mo></mrow></mrow><annotation encoding="application/x-tex">t\ (1\leq t\leq 10^{4})</annotation></semantics></math> —the number of test cases. 
<br class="ltx_break">
<br class="ltx_break">Each test case consists of a single line consisting of a digital string <math id="S15.SS0.SSS0.Px1.p2.pic1.m10" class="ltx_Math" alttext="s\ (1\leq|s|\leq 2\cdot 10^{5})" display="inline" intent=":literal"><semantics><mrow><mi style="--ltx-fg-color:#000000;" mathcolor="#000000">s</mi><mo lspace="0.500em">⁡</mo><mrow><mo style="--ltx-fg-color:#000000;" mathcolor="#000000" stretchy="false">(</mo><mrow><mn style="--ltx-fg-color:#000000;" mathcolor="#000000">1</mn><mo style="--ltx-fg-color:#000000;" mathcolor="#000000">≤</mo><mrow><mo style="--ltx-fg-color:#000000;" mathcolor="#000000" stretchy="false">|</mo><mi style="--ltx-fg-color:#000000;" mathcolor="#000000">s</mi><mo style="--ltx-fg-color:#000000;" mathcolor="#000000" stretchy="false">|</mo></mrow><mo style="--ltx-fg-color:#000000;" mathcolor="#000000">≤</mo><mrow><mn style="--ltx-fg-color:#000000;" mathcolor="#000000">2</mn><mo style="--ltx-fg-color:#000000;" lspace="0.222em" mathcolor="#000000" rspace="0.222em">⋅</mo><msup><mn style="--ltx-fg-color:#000000;" mathcolor="#000000">10</mn><mn style="--ltx-fg-color:#000000;" mathcolor="#000000">5</mn></msup></mrow></mrow><mo style="--ltx-fg-color:#000000;" mathcolor="#000000" stretchy="false">)</mo></mrow></mrow><annotation encoding="application/x-tex">s\ (1\leq|s|\leq 2\cdot 10^{5})</annotation></semantics></math>, where <math id="S15.SS0.SSS0.Px1.p2.pic1.m11" class="ltx_Math" alttext="|s|" display="inline" intent=":literal"><semantics><mrow><mo style="--ltx-fg-color:#000000;" mathcolor="#000000" stretchy="false">|</mo><mi style="--ltx-fg-color:#000000;" mathcolor="#000000">s</mi><mo style="--ltx-fg-color:#000000;" mathcolor="#000000" stretchy="false">|</mo></mrow><annotation encoding="application/x-tex">|s|</annotation></semantics></math> denotes the length of <math id="S15.SS0.SSS0.Px1.p2.pic1.m12" class="ltx_Math" alttext="s" display="inline" intent=":literal"><semantics><mi style="--ltx-fg-color:#000000;" mathcolor="#000000">s</mi><annotation encoding="application/x-tex">s</annotation></semantics></math>. The string does not contain leading zeroes. 
<br class="ltx_break">
<br class="ltx_break">It is guaranteed that the sum of <math id="S15.SS0.SSS0.Px1.p2.pic1.m13" class="ltx_Math" alttext="|s|" display="inline" intent=":literal"><semantics><mrow><mo style="--ltx-fg-color:#000000;" mathcolor="#000000" stretchy="false">|</mo><mi style="--ltx-fg-color:#000000;" mathcolor="#000000">s</mi><mo style="--ltx-fg-color:#000000;" mathcolor="#000000" stretchy="false">|</mo></mrow><annotation encoding="application/x-tex">|s|</annotation></semantics></math> of all test cases doesn’t exceed <math id="S15.SS0.SSS0.Px1.p2.pic1.m14" class="ltx_Math" alttext="2\cdot 10^{5}" display="inline" intent=":literal"><semantics><mrow><mn style="--ltx-fg-color:#000000;" mathcolor="#000000">2</mn><mo style="--ltx-fg-color:#000000;" lspace="0.222em" mathcolor="#000000" rspace="0.222em">⋅</mo><msup><mn style="--ltx-fg-color:#000000;" mathcolor="#000000">10</mn><mn style="--ltx-fg-color:#000000;" mathcolor="#000000">5</mn></msup></mrow><annotation encoding="application/x-tex">2\cdot 10^{5}</annotation></semantics></math>. 
<br class="ltx_break">
<br class="ltx_break"><span id="S15.SS0.SSS0.Px1.p2.pic1.2.1.1.2" class="ltx_text ltx_font_bold">Output</span> 
<br class="ltx_break">For each test case, print the answer on a separate line.</span></span>
</span></span></span></foreignobject></g></g></svg>