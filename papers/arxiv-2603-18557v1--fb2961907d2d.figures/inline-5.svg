<span id="A4.pic3.p2" class="ltx_para ltx_noindent">
<span id="A4.pic3.p2.1" class="ltx_p"><span id="A4.pic3.p2.1.1" class="ltx_text ltx_font_typewriter" style="--ltx-fg-color:#000000;">
&quot;task_prompt&quot;: &quot;**Evidence Passages:**\n
{context}\n\n
**Answer:** {answer_segment}\n
**Verification Concept:** {concept}\n\n
**Evaluation Questions:**\n
{questions}\n\n
For each question, assign a score from **0--10** indicating how well the evidence supports the answer with respect to that question.\n\n
Base all judgments strictly on the provided evidence passages. Do not assume any external knowledge.\n\n
Return exactly this format:\n\n
&lt;evaluation&gt;\n
{questions_format_example}\n
&lt;/evaluation&gt;&quot;
