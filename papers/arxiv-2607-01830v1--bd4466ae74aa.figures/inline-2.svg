<span id="A4.F8.pic1.p9" class="ltx_para ltx_noindent">
<span id="A4.F8.pic1.p9.1" class="ltx_p">Consider ALL relevant dimensions holistically: factual correctness, completeness, depth,</span>
</span></span></span></span>
<span id="A4.F8.pic1.2.10" class="ltx_p" style="width:453.1pt;"><span id="A4.F8.pic1.2.10.1" class="ltx_text ltx_verbatim ltx_font_typewriter ltx_inline-block" style="width:453.1pt;--ltx-fg-color:#000000;"><span id="A4.F8.pic1.2.10.1.1" class="ltx_inline-logical-block ltx_parbox ltx_align_top" style="width:453.1pt;">
<span id="A4.F8.pic1.p10" class="ltx_para ltx_noindent">
<span id="A4.F8.pic1.p10.1" class="ltx_p">practical usefulness, clarity, structure, safety, edge-case awareness, calibration of</span>
</span></span></span></span>
<span id="A4.F8.pic1.2.11" class="ltx_p" style="width:453.1pt;"><span id="A4.F8.pic1.2.11.1" class="ltx_text ltx_verbatim ltx_font_typewriter ltx_inline-block" style="width:453.1pt;--ltx-fg-color:#000000;"><span id="A4.F8.pic1.2.11.1.1" class="ltx_inline-logical-block ltx_parbox ltx_align_top" style="width:453.1pt;">
<span id="A4.F8.pic1.p11" class="ltx_para ltx_noindent">
<span id="A4.F8.pic1.p11.1" class="ltx_p">confidence, tone, and absence of misleading claims. Do NOT be biased by length alone.</span>
</span></span></span></span>
<span id="A4.F8.pic1.2.12" class="ltx_p" style="width:453.1pt;"><span id="A4.F8.pic1.2.12.1" class="ltx_text ltx_verbatim ltx_font_typewriter ltx_inline-block" style="width:453.1pt;--ltx-fg-color:#000000;"><span id="A4.F8.pic1.2.12.1.1" class="ltx_inline-logical-block ltx_parbox ltx_align_top" style="width:453.1pt;">
<span id="A4.F8.pic1.p12" class="ltx_para ltx_noindent">
<span id="A4.F8.pic1.p12.1" class="ltx_p">Score each response independently of the other on the same absolute scale.</span>
</span></span></span></span>
