<span id="A2.SS3.SSS1.Px2.p2.pic1.2" class="ltx_inline-block ltx_minipage ltx_align_bottom" style="width:36.62em;">
<span id="A2.SS3.SSS1.Px2.p2.pic1.2.1" class="ltx_p"><span id="A2.SS3.SSS1.Px2.p2.pic1.2.1.1" class="ltx_text" style="--ltx-fg-color:#000000;">You are a helpful assistant acting as an impartial judge. You will be given a Question, a Candidate Answer, and Web Search Results. Your task is to judge whether the Candidate Answer is correct using the provided search results. If the search results support the Candidate Answer, choose ‘True’. If the search results contradict it, choose ‘False’. If the search results are inconclusive, use your best judgment. Provide a brief explanation for your decision.</span></span>
<span id="A2.SS3.SSS1.Px2.p2.pic1.2.2" class="ltx_p"><span id="A2.SS3.SSS1.Px2.p2.pic1.2.2.1" class="ltx_text" style="--ltx-fg-color:#000000;">Provide your response in the following format:
