<span id="A6.F7.pic1.1" class="ltx_inline-block ltx_minipage ltx_align_bottom" style="width:38.17em;">
<span id="A6.F7.pic1.1.1" class="ltx_p"><span id="A6.F7.pic1.1.1.1" class="ltx_text ltx_font_bold" style="--ltx-fg-color:#000000;">Augmentation - Question Diversification Prompt</span></span>
</span></span></span></foreignobject></g><g fill-opacity="1.0" transform="matrix(1.0 0.0 0.0 1.0 22.83 84.45)"><foreignobject style="--ltx-fo-width:43.9em;--ltx-fo-height:19.77em;--ltx-fo-depth:5.02em;font-size:10pt;" height="343.01" overflow="visible" transform="matrix(1 0 0 -1 0 273.51)" width="607.45"><span class="ltx_foreignobject_container"><span class="ltx_foreignobject_content">
<span id="A6.F7.pic1.2" class="ltx_inline-block ltx_minipage ltx_align_bottom" style="width:43.9em;">
<span id="A6.F7.pic1.2.1" class="ltx_p"><span id="A6.F7.pic1.2.1.1" class="ltx_text ltx_font_bold" style="--ltx-fg-color:#000000;">&lt;Task Overview&gt;
<br class="ltx_break"><span id="A6.F7.pic1.2.1.1.1" class="ltx_text ltx_font_typewriter ltx_font_medium">You will be provided with: 1) Information about the benchmark to be evaluated, 2) The main concept being assessed in the benchmark, and 3) Seed questions that include key components and sub-questions related to this concept.
<br class="ltx_break">Your task is to create additional sub-questions for the key components to comprehensively assess the main concept. Each sub-question must meet given conditions to ensure a high-quality question set.<span id="A6.F7.pic1.2.1.1.1.1" class="ltx_text ltx_font_serif">
</span></span></span></span>
<span id="A6.F7.pic1.2.2" class="ltx_p"><span id="A6.F7.pic1.2.2.1" class="ltx_text ltx_font_bold" style="--ltx-fg-color:#000000;">1) Benchmark Information:
<br class="ltx_break"><span id="A6.F7.pic1.2.2.1.1" class="ltx_text ltx_font_typewriter ltx_font_medium">{benchmark description}<span id="A6.F7.pic1.2.2.1.1.1" class="ltx_text ltx_font_serif">
</span></span></span></span>
<span id="A6.F7.pic1.2.3" class="ltx_p"><span id="A6.F7.pic1.2.3.1" class="ltx_text ltx_font_bold" style="--ltx-fg-color:#000000;">2) Main Concept in the Benchmark:
<br class="ltx_break"><span id="A6.F7.pic1.2.3.1.1" class="ltx_text ltx_font_typewriter ltx_font_medium">{concept}: {description}<span id="A6.F7.pic1.2.3.1.1.1" class="ltx_text ltx_font_serif">
</span></span></span></span>
<span id="A6.F7.pic1.2.4" class="ltx_p"><span id="A6.F7.pic1.2.4.1" class="ltx_text ltx_font_bold" style="--ltx-fg-color:#000000;">3) Key Components and Seed Questions:
<br class="ltx_break"><span id="A6.F7.pic1.2.4.1.1" class="ltx_text ltx_font_typewriter ltx_font_medium">{seed questions}<span id="A6.F7.pic1.2.4.1.1.1" class="ltx_text ltx_font_serif">
</span></span></span></span>
<span id="A6.F7.pic1.2.5" class="ltx_p"><span id="A6.F7.pic1.2.5.1" class="ltx_text ltx_font_bold" style="--ltx-fg-color:#000000;">&lt;Conditions for a Good Question List&gt;<span id="A6.F7.pic1.2.5.1.1" class="ltx_text ltx_font_medium">

<br class="ltx_break"><span id="A6.F7.pic1.2.5.1.1.1" class="ltx_text ltx_font_typewriter">{conditions}</span></span></span></span>
<span id="A6.F7.pic1.2.6" class="ltx_p"><span id="A6.F7.pic1.2.6.1" class="ltx_text ltx_font_bold" style="--ltx-fg-color:#000000;">&lt;Constraints&gt;
<br class="ltx_break"><span id="A6.F7.pic1.2.6.1.1" class="ltx_text ltx_font_typewriter ltx_font_medium">- Each sub-question must be answerable with a simple ‘yes’ or ‘no’.
<br class="ltx_break">- A ‘yes’ answer should indicate that the sentence improves the specified evaluation criterion (e.g., Coherence, Relevance).
<br class="ltx_break">- Each question should assess only a single dimension or concept.
<br class="ltx_break">- Each question should not ask about more than one topic or concept.<span id="A6.F7.pic1.2.6.1.1.1" class="ltx_text ltx_font_serif">
</span></span></span></span>
</span></span></span></foreignobject></g></g></svg>