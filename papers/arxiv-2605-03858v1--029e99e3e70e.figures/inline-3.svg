</span>
<span id="A4.F5.pic1.1.5" class="ltx_p"><span id="A4.F5.pic1.1.5.1" class="ltx_text ltx_font_bold" style="--ltx-fg-color:#000000;">Reason for exclusion
<br class="ltx_break"><span id="A4.F5.pic1.1.5.1.1" class="ltx_text ltx_font_medium">A label-preserving perturbation is infeasible here because the response must remain exactly <span id="A4.F5.pic1.1.5.1.1.1" class="ltx_text ltx_font_typewriter">R-rated</span>.</span></span></span>
</span></span></span></foreignobject></g></g></svg>