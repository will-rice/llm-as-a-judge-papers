<svg id="S15.SS0.SSS0.Px15.p3.pic1" class="ltx_picture" height="313.15" overflow="visible" version="1.1" viewbox="0 0 477.38 313.15" width="477.38"><g style="--ltx-stroke-color:#000000;--ltx-fill-color:#000000;" fill="#000000" stroke="#000000" stroke-width="0.4pt" transform="translate(0,313.15) matrix(1 0 0 -1 0 0)"><g style="--ltx-fill-color:#4285F4;" fill="#4285F4" fill-opacity="1.0"><path style="stroke:none" d="M 0 7.5 L 0 305.65 C 0 309.79 3.36 313.15 7.5 313.15 L 469.87 313.15 C 474.02 313.15 477.38 309.79 477.38 305.65 L 477.38 7.5 C 477.38 3.36 474.02 0 469.87 0 L 7.5 0 C 3.36 0 0 3.36 0 7.5 Z" /></g><g style="--ltx-fill-color:#F5F5F5;" fill="#F5F5F5" fill-opacity="1.0"><path style="stroke:none" d="M 1.97 7.5 L 1.97 274.78 L 475.41 274.78 L 475.41 7.5 C 475.41 4.45 472.93 1.97 469.87 1.97 L 7.5 1.97 C 4.45 1.97 1.97 4.45 1.97 7.5 Z" /></g><g fill-opacity="1.0" transform="matrix(1.0 0.0 0.0 1.0 20.48 282.2)"><foreignobject style="--ltx-fo-width:27.43em;--ltx-fo-height:1.89em;--ltx-fo-depth:0.19em;font-size:10pt;" height="28.9" overflow="visible" transform="matrix(1 0 0 -1 0 26.21)" width="379.55"><span class="ltx_foreignobject_container"><span class="ltx_foreignobject_content">
<span id="S15.SS0.SSS0.Px15.p3.pic1.1" class="ltx_inline-block ltx_minipage ltx_align_bottom" style="width:27.43em;">
<span id="S15.SS0.SSS0.Px15.p3.pic1.1.1" class="ltx_p"><span id="S15.SS0.SSS0.Px15.p3.pic1.1.1.1" class="ltx_text" style="position:relative; bottom:0.9pt;"></span><a href="https://codeforces.com/blog/entry/131567" title class="ltx_ref ltx_href ltx_font_bold" style="--ltx-fg-color:#FFFFFF;">Tutorial</a><span id="S15.SS0.SSS0.Px15.p3.pic1.1.1.2" class="ltx_text ltx_font_bold" style="--ltx-fg-color:#FFFFFF;"> — <a href="https://codeforces.com/problemset/submission/1988/270653457" title class="ltx_ref ltx_href">Human’s accepted submission</a> — <a href="https://gist.github.com/anonymous-llm-code/4e387a2e579567eb7402cce05e8c07eb" title class="ltx_ref ltx_href"><span class="ltx_text ltx_font_typewriter">Gemini 2.5 Pro</span>’s rejected submission</a></span></span>
</span></span></span></foreignobject></g><g fill-opacity="1.0" transform="matrix(1.0 0.0 0.0 1.0 20.48 16.07)"><foreignobject style="--ltx-fo-width:31.54em;--ltx-fo-height:17.93em;--ltx-fo-depth:0.25em;font-size:10pt;" height="251.53" overflow="visible" transform="matrix(1 0 0 -1 0 248.07)" width="436.42"><span class="ltx_foreignobject_container"><span class="ltx_foreignobject_content">
<span id="S15.SS0.SSS0.Px15.p3.pic1.2" class="ltx_inline-block ltx_minipage ltx_align_bottom" style="width:31.54em;">
<span id="S15.SS0.SSS0.Px15.p3.pic1.2.1" class="ltx_p"><span id="S15.SS0.SSS0.Px15.p3.pic1.2.1.1" class="ltx_text" style="--ltx-fg-color:#000000;">We list some simple conditions for a string to be transformable:</span></span>
<span id="S15.I10" class="ltx_itemize">
<span id="S15.I10.i1" class="ltx_item" style="list-style-type:none;"><span class="ltx_tag ltx_tag_item">•</span> 
<span id="S15.I10.i1.p1" class="ltx_para">
<span id="S15.I10.i1.p1.1" class="ltx_p"><span id="S15.I10.i1.p1.1.1" class="ltx_text" style="--ltx-fg-color:#000000;">If 111 exists somewhere (as a substring) in the string, the string is always transformable.</span></span>
</span></span>
<span id="S15.I10.i2" class="ltx_item" style="list-style-type:none;"><span class="ltx_tag ltx_tag_item">•</span> 
<span id="S15.I10.i2.p1" class="ltx_para">
<span id="S15.I10.i2.p1.1" class="ltx_p"><span id="S15.I10.i2.p1.1.1" class="ltx_text" style="--ltx-fg-color:#000000;">If 11 appears at least twice in the string, the string is always transformable.</span></span>
</span></span>
<span id="S15.I10.i3" class="ltx_item" style="list-style-type:none;"><span class="ltx_tag ltx_tag_item">•</span> 
<span id="S15.I10.i3.p1" class="ltx_para">
<span id="S15.I10.i3.p1.1" class="ltx_p"><span id="S15.I10.i3.p1.1.1" class="ltx_text" style="--ltx-fg-color:#000000;">If the string both begins and ends with 1, it is always transformable.</span></span>
</span></span>
<span id="S15.I10.i4" class="ltx_item" style="list-style-type:none;"><span class="ltx_tag ltx_tag_item">•</span> 
<span id="S15.I10.i4.p1" class="ltx_para">
<span id="S15.I10.i4.p1.1" class="ltx_p"><span id="S15.I10.i4.p1.1.1" class="ltx_text" style="--ltx-fg-color:#000000;">If the string begins or ends with 1 and 11 exists in the string, it is always transformable.</span></span>
</span></span>
</span>
<span id="S15.SS0.SSS0.Px15.p3.pic1.2.2" class="ltx_p"><span id="S15.SS0.SSS0.Px15.p3.pic1.2.2.1" class="ltx_text" style="--ltx-fg-color:#000000;">These can be found by simulating the operation for short strings on paper. 
<br class="ltx_break">
<br class="ltx_break">Contrarily, if a string does not meet any of the four items, it is always not transformable. This can be proved using induction (as an exercise).</span></span>
</span></span></span></foreignobject></g></g></svg>