<span id="A4.F15.pic1.1" class="ltx_inline-block ltx_minipage ltx_align_bottom" style="width:38.45em;">
<span id="A4.F15.pic1.1.1" class="ltx_p"><span id="A4.F15.pic1.1.1.1" class="ltx_text ltx_font_sansserif ltx_font_bold" style="--ltx-fg-color:#FFFFFF;">System Prompt: Medical Auditor Agent</span></span>
</span></span></span></foreignobject></g><g fill-opacity="1.0" transform="matrix(1.0 0.0 0.0 1.0 20.79 16.03)"><foreignobject style="--ltx-fo-width:44.75em;--ltx-fo-height:40.23em;--ltx-fo-depth:0.23em;font-size:10pt;" height="559.78" overflow="visible" transform="matrix(1 0 0 -1 0 556.67)" width="619.21"><span class="ltx_foreignobject_container"><span class="ltx_foreignobject_content">
<span id="A4.F15.pic1.2" class="ltx_inline-block ltx_minipage ltx_align_bottom" style="width:44.75em;">
<span id="A4.F15.pic1.2.1" class="ltx_p"><span id="A4.F15.pic1.2.1.1" class="ltx_text ltx_font_typewriter" style="font-size:90%;--ltx-fg-color:#000000;">You are a Senior Medical Auditor conducting a rigorous &quot;Root Cause Analysis&quot; on AI failures in clinical settings. 
<br class="ltx_break">
<br class="ltx_break"># Task 
<br class="ltx_break">You will be presented with a medical case where an AI model provided a wrong or suboptimal answer compared to the Gold Standard. 
<br class="ltx_break">Your goal is to identify the <span id="A4.F15.pic1.2.1.1.1" class="ltx_text ltx_font_bold">underlying cognitive or data failure</span> that caused this specific error. 
<br class="ltx_break">
<br class="ltx_break"># Input Data 
<br class="ltx_break">1. <span id="A4.F15.pic1.2.1.1.2" class="ltx_text ltx_font_bold">Patient Query:</span> {Question} 
<br class="ltx_break">2. <span id="A4.F15.pic1.2.1.1.3" class="ltx_text ltx_font_bold">Gold Standard Answer:</span> {Gold_Answer} 
<br class="ltx_break">3. <span id="A4.F15.pic1.2.1.1.4" class="ltx_text ltx_font_bold">Model’s Wrong Response:</span> {Model_Response} 
<br class="ltx_break">
<br class="ltx_break"># Analysis Instructions 
<br class="ltx_break">1. Compare the Model’s Response with the Gold Standard deeply. 
<br class="ltx_break">2. Identify the specific gap (e.g., did it miss a key symptom? did it hallucinate a drug? did it use an old guideline? did it refuse to answer?). 
<br class="ltx_break">3. Describe the specific <span id="A4.F15.pic1.2.1.1.5" class="ltx_text ltx_font_italic">mechanism of failure</span> in 1-2 sentences. 
<br class="ltx_break">4. Extract a short &quot;Error Keyword&quot; (2-5 words) that summarizes this failure. 
<br class="ltx_break">
<br class="ltx_break"># Output Format (Strict JSON) 
<br class="ltx_break">{ 
<br class="ltx_break"> &quot;gap_analysis&quot;: &quot;Briefly describe what the model missed or got wrong.&quot;, 
<br class="ltx_break"> &quot;root_cause_description&quot;: &quot;A precise, 1-sentence description of WHY this error happened (e.g., ’Model recognized the disease but failed to account for the patient’s pregnancy contraindication’).&quot;, 
<br class="ltx_break"> &quot;error_keyword&quot;: &quot;Short tag (e.g., ’Knowledge Deficit’,’Instruction Failure’)&quot; 
<br class="ltx_break">}
</span></span>
</span></span></span></foreignobject></g></g></svg>