<span id="A4.SS2.SSS1.p2.pic1.2" class="ltx_inline-block ltx_minipage ltx_align_bottom" style="width:44.07em;">
<span id="A4.SS2.SSS1.p2.pic1.2.1" class="ltx_p"><span id="A4.SS2.SSS1.p2.pic1.2.1.1" class="ltx_text" style="--ltx-fg-color:#000000;">Task: You are provided with a model’s output, a reference solution, and a correct answer. Your goal is to determine the correctness of the model’s output by comparing it with the reference solution and the correct answer. Note that the reference solution is just a guide—there could be other valid methods to solve the problem.</span></span>
<span id="A4.SS2.SSS1.p2.pic1.2.2" class="ltx_p"><span id="A4.SS2.SSS1.p2.pic1.2.2.1" class="ltx_text ltx_font_bold" style="--ltx-fg-color:#000000;">Possible Error Types:
<br class="ltx_break"><span id="A4.SS2.SSS1.p2.pic1.2.2.1.1" class="ltx_text ltx_font_medium">1. </span>Concept<span id="A4.SS2.SSS1.p2.pic1.2.2.1.2" class="ltx_text ltx_font_medium">: This error type indicates the model lacks the concept used to solve the problem. In this case, the feedback should contain a question that can check the understanding of the concept. (e.g., What is the Pythagorean theorem?) 
<br class="ltx_break">2. </span>Misinterpret<span id="A4.SS2.SSS1.p2.pic1.2.2.1.3" class="ltx_text ltx_font_medium">: The model misunderstood or misinterpreted the question. In this case, the feedback should include a follow-up question or clarification that helps the model reassess and correctly interpret the original question. This ensures the model understands the context and requirements before proceeding. 
<br class="ltx_break">3. </span>Calculation<span id="A4.SS2.SSS1.p2.pic1.2.2.1.4" class="ltx_text ltx_font_medium">: The model made a mistake in calculation. 
<br class="ltx_break">4. </span>N/A<span id="A4.SS2.SSS1.p2.pic1.2.2.1.5" class="ltx_text ltx_font_medium">: None of the above.</span></span></span>
<span id="A4.SS2.SSS1.p2.pic1.2.3" class="ltx_p"><span id="A4.SS2.SSS1.p2.pic1.2.3.1" class="ltx_text ltx_font_bold" style="--ltx-fg-color:#000000;">Response Format:<span id="A4.SS2.SSS1.p2.pic1.2.3.1.1" class="ltx_text ltx_font_medium">
{Format Example}</span></span></span>
<span id="A4.SS2.SSS1.p2.pic1.2.4" class="ltx_p"><span id="A4.SS2.SSS1.p2.pic1.2.4.1" class="ltx_text ltx_font_bold" style="--ltx-fg-color:#000000;">Input:<span id="A4.SS2.SSS1.p2.pic1.2.4.1.1" class="ltx_text ltx_font_medium"> 
