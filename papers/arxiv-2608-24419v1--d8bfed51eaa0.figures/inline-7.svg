<svg id="S7.p1.pic1" class="ltx_picture" height="372.4" overflow="visible" version="1.1" viewbox="0 0 650 372.4" width="650"><g style="--ltx-stroke-color:#000000;--ltx-fill-color:#000000;" fill="#000000" stroke="#000000" stroke-width="0.4pt" transform="translate(0,372.4) matrix(1 0 0 -1 0 0)"><g style="--ltx-fill-color:#77EE7B;" fill="#77EE7B" fill-opacity="1.0"><path style="stroke:none" d="M 0 5.53 L 0 366.87 C 0 369.92 2.48 372.4 5.53 372.4 L 644.47 372.4 C 647.52 372.4 650 369.92 650 366.87 L 650 5.53 C 650 2.48 647.52 0 644.47 0 L 5.53 0 C 2.48 0 0 2.48 0 5.53 Z" /></g><g style="--ltx-fill-color:#F5FEF5;" fill="#F5FEF5" fill-opacity="1.0"><path style="stroke:none" d="M 1.38 5.53 L 1.38 366.87 C 1.38 369.16 3.24 371.02 5.53 371.02 L 644.47 371.02 C 646.76 371.02 648.62 369.16 648.62 366.87 L 648.62 5.53 C 648.62 3.24 646.76 1.38 644.47 1.38 L 5.53 1.38 C 3.24 1.38 1.38 3.24 1.38 5.53 Z" /></g><g fill-opacity="1.0" transform="matrix(1.0 0.0 0.0 1.0 16.39 17.08)"><foreignobject style="--ltx-fo-width:44.61em;--ltx-fo-height:24.69em;--ltx-fo-depth:0.25em;font-size:10pt;" height="345.16" overflow="visible" transform="matrix(1 0 0 -1 0 341.7)" width="617.28"><span class="ltx_foreignobject_container"><span class="ltx_foreignobject_content"><span id="S7.p1.pic1.1" class="ltx_inline-logical-block ltx_minipage ltx_align_bottom" style="width:44.61em;">
<span id="S7.p1.pic1.p1" class="ltx_para ltx_noindent">
<span id="S7.p1.pic1.p1.1" class="ltx_p"><span id="S7.p1.pic1.p1.1.1" class="ltx_text ltx_font_bold" style="--ltx-fg-color:#000000;">The shortest true summary.</span><span id="S7.p1.pic1.p1.1.2" class="ltx_text" style="--ltx-fg-color:#000000;"> An evaluator is a measurement instrument, and validity
needs two properties rather than one: a verdict must hold still under an edit that preserves the
construct, </span><em id="S7.p1.pic1.p1.1.3" class="ltx_emph ltx_font_italic" style="--ltx-fg-color:#000000;">and</em><span id="S7.p1.pic1.p1.1.4" class="ltx_text" style="--ltx-fg-color:#000000;"> move under a minimal edit that changes it. The judge literature has measured
the first thoroughly and the second, to our knowledge, not at all. Measured as a profile over
7 judges and 4 domains with direction set by 3 humans at agreement 0.852, judges sit at </span><math id="S7.p1.pic1.p1.m1" class="ltx_Math" alttext="S=0.945" display="inline" intent=":literal"><semantics><mrow><mi style="--ltx-fg-color:#000000;" mathcolor="#000000">S</mi><mo style="--ltx-fg-color:#000000;" mathcolor="#000000">=</mo><mn style="--ltx-fg-color:#000000;" mathcolor="#000000">0.945</mn></mrow><annotation encoding="application/x-tex">S=0.945</annotation></semantics></math><span id="S7.p1.pic1.p1.1.5" class="ltx_text" style="--ltx-fg-color:#000000;"> against
</span><math id="S7.p1.pic1.p1.m2" class="ltx_Math" alttext="R=0.319" display="inline" intent=":literal"><semantics><mrow><mi style="--ltx-fg-color:#000000;" mathcolor="#000000">R</mi><mo style="--ltx-fg-color:#000000;" mathcolor="#000000">=</mo><mn style="--ltx-fg-color:#000000;" mathcolor="#000000">0.319</mn></mrow><annotation encoding="application/x-tex">R=0.319</annotation></semantics></math><span id="S7.p1.pic1.p1.1.6" class="ltx_text" style="--ltx-fg-color:#000000;">: </span><em id="S7.p1.pic1.p1.1.7" class="ltx_emph ltx_font_italic" style="--ltx-fg-color:#000000;">reliable, and markedly less responsive to construct change
than their reliability suggests</em><span id="S7.p1.pic1.p1.1.8" class="ltx_text" style="--ltx-fg-color:#000000;">. The failure is structured rather than random. Sensitivity differs
by +0.121 between </span><span id="S7.p1.pic1.p1.1.9" class="ltx_text ltx_font_smallcaps" style="--ltx-fg-color:#000000;">scope</span><span id="S7.p1.pic1.p1.1.10" class="ltx_text" style="--ltx-fg-color:#000000;"> and </span><span id="S7.p1.pic1.p1.1.11" class="ltx_text ltx_font_smallcaps" style="--ltx-fg-color:#000000;">strength</span><span id="S7.p1.pic1.p1.1.12" class="ltx_text" style="--ltx-fg-color:#000000;"> at matched </span><math id="S7.p1.pic1.p1.m3" class="ltx_Math" alttext="S" display="inline" intent=":literal"><semantics><mi style="--ltx-fg-color:#000000;" mathcolor="#000000">S</mi><annotation encoding="application/x-tex">S</annotation></semantics></math><span id="S7.p1.pic1.p1.1.13" class="ltx_text" style="--ltx-fg-color:#000000;">, in that direction on
every one of the 7 judges and against the only length bias we can measure, so the gap
is a lower bound; and the two axes respond with </span><em id="S7.p1.pic1.p1.1.14" class="ltx_emph ltx_font_italic" style="--ltx-fg-color:#000000;">opposite</em><span id="S7.p1.pic1.p1.1.15" class="ltx_text" style="--ltx-fg-color:#000000;"> sign to accuracy pressure, which is
why prompting a generator to be accurate can make its overgeneralisation worse
</span><cite class="ltx_cite ltx_citemacro_citep"><span id="S7.p1.pic1.p1.1.16" class="ltx_text" style="--ltx-fg-color:#000000;">[</span><a href="#bib.bib1" title class="ltx_ref">41</a><span id="S7.p1.pic1.p1.1.17" class="ltx_text" style="--ltx-fg-color:#000000;">]</span></cite><span id="S7.p1.pic1.p1.1.18" class="ltx_text" style="--ltx-fg-color:#000000;"> without anything being incoherent. The reason none of this is in
the record is that the rulers leak: across 5 public label sets, a predictor
reading only surface form, given the same paired input the judge gets, reproduces
55%–67% of their labels, including 67.4% of
</span><span id="S7.p1.pic1.p1.1.19" class="ltx_text ltx_font_smallcaps" style="--ltx-fg-color:#000000;">MT-Bench</span><span id="S7.p1.pic1.p1.1.20" class="ltx_text" style="--ltx-fg-color:#000000;">’s </span><em id="S7.p1.pic1.p1.1.21" class="ltx_emph ltx_font_italic" style="--ltx-fg-color:#000000;">human</em><span id="S7.p1.pic1.p1.1.22" class="ltx_text" style="--ltx-fg-color:#000000;"> votes. </span><em id="S7.p1.pic1.p1.1.23" class="ltx_emph ltx_font_italic" style="--ltx-fg-color:#000000;">Whether a set leaks is a property not of the set alone
but of the set and the input mode together</em><span id="S7.p1.pic1.p1.1.24" class="ltx_text" style="--ltx-fg-color:#000000;">, which is why Definition </span><a href="#Thmdefinition6" title="Definition 6 (Validation power, relative to an input mode). ‣ 4.4 The diagnostic: what a label set could ever have detected ‣ 4 Method: the interventions, the direction protocol, and the diagnostic ‣ A Judge Should Know What Changed: Construct Validity for LLM-as-a-Judge Evaluation" class="ltx_ref" style="--ltx-fg-color:#000000;"><span class="ltx_text ltx_ref_tag">6</span></a><span id="S7.p1.pic1.p1.1.25" class="ltx_text" style="--ltx-fg-color:#000000;"> carries the mode.</span></span>
</span></span></span></span></foreignobject></g></g></svg>