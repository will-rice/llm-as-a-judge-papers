<span id="A1.SS11.SSS2.p3.pic1.2" class="ltx_inline-block ltx_minipage ltx_align_bottom" style="width:44.16em;">
<span id="A1.SS11.SSS2.p3.pic1.2.1" class="ltx_p"><span id="A1.SS11.SSS2.p3.pic1.2.1.1" class="ltx_text" style="--ltx-fg-color:#000000;"># Task Description 
<br class="ltx_break"></span></span>
<span id="A1.SS11.SSS2.p3.pic1.2.2" class="ltx_p"><span id="A1.SS11.SSS2.p3.pic1.2.2.1" class="ltx_text" style="--ltx-fg-color:#000000;">{task_description} 
<br class="ltx_break"></span></span>
<span id="A1.SS11.SSS2.p3.pic1.2.3" class="ltx_p"><span id="A1.SS11.SSS2.p3.pic1.2.3.1" class="ltx_text" style="--ltx-fg-color:#000000;"># Previous Agent Trajectory (Summary)
<br class="ltx_break"></span></span>
<span id="A1.SS11.SSS2.p3.pic1.2.4" class="ltx_p"><span id="A1.SS11.SSS2.p3.pic1.2.4.1" class="ltx_text" style="--ltx-fg-color:#000000;">The following is a summary of what the previous agent did:
<br class="ltx_break"></span></span>
<span id="A1.SS11.SSS2.p3.pic1.2.5" class="ltx_p"><span id="A1.SS11.SSS2.p3.pic1.2.5.1" class="ltx_text" style="--ltx-fg-color:#000000;">{trajectory_text}
<br class="ltx_break"></span></span>
<span id="A1.SS11.SSS2.p3.pic1.2.6" class="ltx_p"><span id="A1.SS11.SSS2.p3.pic1.2.6.1" class="ltx_text" style="--ltx-fg-color:#000000;"># Your Verification Task
The previous agent claimed to have completed the task above. Your job is to verify whether the task was actually completed successfully. 
<br class="ltx_break"></span></span>
<span id="A1.SS11.SSS2.p3.pic1.2.7" class="ltx_p"><span id="A1.SS11.SSS2.p3.pic1.2.7.1" class="ltx_text" style="--ltx-fg-color:#000000;">Use the available tools to:
<br class="ltx_break">1. Check the current state of the environment
<br class="ltx_break">2. Verify that the expected outputs/changes exist
<br class="ltx_break">3. Confirm the correctness of any created or modified resources
<br class="ltx_break"></span></span>
<span id="A1.SS11.SSS2.p3.pic1.2.8" class="ltx_p"><span id="A1.SS11.SSS2.p3.pic1.2.8.1" class="ltx_text" style="--ltx-fg-color:#000000;">After your investigation, provide your final verdict:
<br class="ltx_break">- &quot;VERDICT: PASS&quot; if the task was completed successfully
<br class="ltx_break">- &quot;VERDICT: FAIL&quot; if the task was not completed or was completed incorrectly
<br class="ltx_break"></span></span>
<span id="A1.SS11.SSS2.p3.pic1.2.9" class="ltx_p"><span id="A1.SS11.SSS2.p3.pic1.2.9.1" class="ltx_text" style="--ltx-fg-color:#000000;">Be thorough and check all requirements mentioned in the task description.</span></span>
