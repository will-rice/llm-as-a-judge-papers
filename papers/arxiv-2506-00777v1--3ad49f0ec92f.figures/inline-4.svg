<span id="A1.SS1.p3.pic1.2.1" class="ltx_p"><span id="A1.SS1.p3.pic1.2.1.1" class="ltx_text" style="--ltx-fg-color:#000000;">Identify the pairs of drug-target interactions in a given passage based on the following four interaction types:

<br class="ltx_break">(i) mechanism: This type is used to identify drug-drug interactions that are described by their pharmacokinetic mechanism.

<br class="ltx_break">(ii) effect: This type is used to identify drug-drug interactions describing an effect.

<br class="ltx_break">(iii) advice: This type is used when a recommendation or advice regarding a drug-drug interaction is given.

<br class="ltx_break">(iv) int: This type is used when a drug-drug interaction appears in the text without providing any additional information. : 
<br class="ltx_break"></span></span>
