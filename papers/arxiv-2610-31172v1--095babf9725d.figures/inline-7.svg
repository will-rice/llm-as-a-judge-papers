<span id="A3.SSx7.p1.pic1.2.1" class="ltx_p"><span id="A3.SSx7.p1.pic1.2.1.1" class="ltx_text ltx_font_bold" style="--ltx-fg-color:#000000;">[System]
<br class="ltx_break"><span id="A3.SSx7.p1.pic1.2.1.1.1" class="ltx_text ltx_font_medium">You are an evaluator of machine translation quality.</span></span></span>
<span id="A3.SSx7.p1.pic1.2.2" class="ltx_p"><span id="A3.SSx7.p1.pic1.2.2.1" class="ltx_text ltx_font_bold" style="--ltx-fg-color:#000000;">Rubric
<br class="ltx_break"><span id="A3.SSx7.p1.pic1.2.2.1.1" class="ltx_text ltx_font_medium">Adequacy, Fluency, Terminology — full criteria.</span></span></span>
<span id="A3.SSx7.p1.pic1.2.3" class="ltx_p"><span id="A3.SSx7.p1.pic1.2.3.1" class="ltx_text" style="--ltx-fg-color:#000000;">Complete the evaluation in two steps:</span></span>
<span id="A3.I3" class="ltx_enumerate" style="--ltx-enum-leftmargin:1.5em;">
<span id="A3.I3.i1" class="ltx_item" style="list-style-type:none;"><span class="ltx_tag ltx_tag_item">1.</span> 
<span id="A3.I3.i1.p1" class="ltx_para">
<span id="A3.I3.i1.p1.1" class="ltx_p"><span id="A3.I3.i1.p1.1.1" class="ltx_text" style="--ltx-fg-color:#000000;">Mentally translate the Swahili output into English and
state your English understanding.</span></span>
</span></span>
<span id="A3.I3.i2" class="ltx_item" style="list-style-type:none;"><span class="ltx_tag ltx_tag_item">2.</span> 
<span id="A3.I3.i2.p1" class="ltx_para">
<span id="A3.I3.i2.p1.1" class="ltx_p"><span id="A3.I3.i2.p1.1.1" class="ltx_text" style="--ltx-fg-color:#000000;">Evaluate the output based on this English understanding,
applying all rubric criteria.</span></span>
</span></span>
</span>
<span id="A3.SSx7.p1.pic1.2.4" class="ltx_p"><span id="A3.SSx7.p1.pic1.2.4.1" class="ltx_text" style="--ltx-fg-color:#000000;">Show both steps before reporting the final score.</span></span>
<span id="A3.SSx7.p1.pic1.2.5" class="ltx_p"><span id="A3.SSx7.p1.pic1.2.5.1" class="ltx_text ltx_font_bold" style="--ltx-fg-color:#000000;">[User]
<br class="ltx_break"><span id="A3.SSx7.p1.pic1.2.5.1.1" class="ltx_text ltx_font_medium">Evaluate the quality of the following machine translation.</span></span></span>
<span id="A3.SSx7.p1.pic1.2.6" class="ltx_p"><span id="A3.SSx7.p1.pic1.2.6.1" class="ltx_text ltx_font_bold" style="--ltx-fg-color:#000000;">Source text (English)
<br class="ltx_break"><span id="A3.SSx7.p1.pic1.2.6.1.1" class="ltx_text ltx_font_typewriter ltx_font_medium">{SOURCE TEXT}<span id="A3.SSx7.p1.pic1.2.6.1.1.1" class="ltx_text ltx_font_serif">
</span></span></span></span>
