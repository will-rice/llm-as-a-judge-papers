<span id="S1.F1.pic1.3.2" class="ltx_p ltx_align_left"><span id="S1.F1.pic1.3.2.1" class="ltx_text ltx_font_bold" style="font-size:90%;">MAIN IDEA &amp; CONTRIBUTIONS
<br class="ltx_break" style="--ltx-break-space:9.3pt;"><span id="S1.F1.pic1.3.2.1.1" class="ltx_text ltx_font_medium">
DAPO is a fully open-source RL system for mathematical reasoning.
<br class="ltx_break" style="--ltx-break-space:4.6pt;"></span></span></span>
<span id="S1.I5" class="ltx_itemize ltx_align_left" style="--ltx-enum-leftmargin:1.2em;">
<span id="S1.I5.i1" class="ltx_item" style="list-style-type:none;"><span class="ltx_tag ltx_tag_item">•</span> 
<span id="S1.I5.i1.p1" class="ltx_para ltx_noindent">
<span id="S1.I5.i1.p1.1" class="ltx_p"><span id="S1.I5.i1.p1.1.1" class="ltx_text" style="font-size:90%;">Introduces four training improvements: Clip-Higher, Dynamic Sampling, Token-Level Loss, and Reward Shaping.</span></span>
</span></span>
<span id="S1.I5.i2" class="ltx_item" style="list-style-type:none;"><span class="ltx_tag ltx_tag_item">•</span> 
<span id="S1.I5.i2.p1" class="ltx_para">
<span id="S1.I5.i2.p1.1" class="ltx_p"><span id="S1.I5.i2.p1.1.1" class="ltx_text" style="font-size:90%;">Releases full training code and the DAPO-Math-17K dataset.</span></span>
</span></span>
</span>
