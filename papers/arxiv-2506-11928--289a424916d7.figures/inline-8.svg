<svg id="S15.SS0.SSS0.Px1.p3.pic1" class="ltx_picture" height="187.47" overflow="visible" version="1.1" viewbox="0 0 477.38 187.47" width="477.38"><g style="--ltx-stroke-color:#000000;--ltx-fill-color:#000000;" fill="#000000" stroke="#000000" stroke-width="0.4pt" transform="translate(0,187.47) matrix(1 0 0 -1 0 0)"><g style="--ltx-fill-color:#4285F4;" fill="#4285F4" fill-opacity="1.0"><path style="stroke:none" d="M 0 7.5 L 0 179.96 C 0 184.11 3.36 187.47 7.5 187.47 L 469.87 187.47 C 474.02 187.47 477.38 184.11 477.38 179.96 L 477.38 7.5 C 477.38 3.36 474.02 0 469.87 0 L 7.5 0 C 3.36 0 0 3.36 0 7.5 Z" /></g><g style="--ltx-fill-color:#F5F5F5;" fill="#F5F5F5" fill-opacity="1.0"><path style="stroke:none" d="M 1.97 7.5 L 1.97 149.09 L 475.41 149.09 L 475.41 7.5 C 475.41 4.45 472.93 1.97 469.87 1.97 L 7.5 1.97 C 4.45 1.97 1.97 4.45 1.97 7.5 Z" /></g><g fill-opacity="1.0" transform="matrix(1.0 0.0 0.0 1.0 20.48 156.52)"><foreignobject style="--ltx-fo-width:27.43em;--ltx-fo-height:1.89em;--ltx-fo-depth:0.19em;font-size:10pt;" height="28.9" overflow="visible" transform="matrix(1 0 0 -1 0 26.21)" width="379.55"><span class="ltx_foreignobject_container"><span class="ltx_foreignobject_content">
<span id="S15.SS0.SSS0.Px1.p3.pic1.1" class="ltx_inline-block ltx_minipage ltx_align_bottom" style="width:27.43em;">
<span id="S15.SS0.SSS0.Px1.p3.pic1.1.1" class="ltx_p"><span id="S15.SS0.SSS0.Px1.p3.pic1.1.1.1" class="ltx_text" style="position:relative; bottom:0.9pt;"></span><a href="https://codeforces.com/blog/entry/137018" title class="ltx_ref ltx_href ltx_font_bold" style="--ltx-fg-color:#FFFFFF;">Tutorial</a><span id="S15.SS0.SSS0.Px1.p3.pic1.1.1.2" class="ltx_text ltx_font_bold" style="--ltx-fg-color:#FFFFFF;"> — <a href="https://codeforces.com/problemset/submission/2050/295435472" title class="ltx_ref ltx_href">Human’s accepted submission</a> — <a href="https://gist.github.com/anonymous-llm-code/28edad062884f2a99039d51525f23ef0" title class="ltx_ref ltx_href"><span class="ltx_text ltx_font_typewriter">DeepSeek R1</span>’s rejected submission</a></span></span>
</span></span></span></foreignobject></g><g fill-opacity="1.0" transform="matrix(1.0 0.0 0.0 1.0 20.48 12.61)"><foreignobject style="--ltx-fo-width:31.54em;--ltx-fo-height:9.09em;--ltx-fo-depth:0em;font-size:10pt;" height="125.84" overflow="visible" transform="matrix(1 0 0 -1 0 125.84)" width="436.42"><span class="ltx_foreignobject_container"><span class="ltx_foreignobject_content">
<span id="S15.SS0.SSS0.Px1.p3.pic1.2" class="ltx_inline-block ltx_minipage ltx_align_bottom" style="width:31.54em;">
<span id="S15.SS0.SSS0.Px1.p3.pic1.2.1" class="ltx_p"><span id="S15.SS0.SSS0.Px1.p3.pic1.2.1.1" class="ltx_text" style="--ltx-fg-color:#000000;">Let’s look at digit <math id="S15.SS0.SSS0.Px1.p3.pic1.m1" class="ltx_Math" alttext="s_{i}" display="inline" intent=":literal"><semantics><msub><mi style="--ltx-fg-color:#000000;" mathcolor="#000000">s</mi><mi style="--ltx-fg-color:#000000;" mathcolor="#000000">i</mi></msub><annotation encoding="application/x-tex">s_{i}</annotation></semantics></math>. We can see that we can’t move it to the left more than <math id="S15.SS0.SSS0.Px1.p3.pic1.m2" class="ltx_Math" alttext="s_{i}" display="inline" intent=":literal"><semantics><msub><mi style="--ltx-fg-color:#000000;" mathcolor="#000000">s</mi><mi style="--ltx-fg-color:#000000;" mathcolor="#000000">i</mi></msub><annotation encoding="application/x-tex">s_{i}</annotation></semantics></math> times because it will be <math id="S15.SS0.SSS0.Px1.p3.pic1.m3" class="ltx_Math" alttext="0" display="inline" intent=":literal"><semantics><mn style="--ltx-fg-color:#000000;" mathcolor="#000000">0</mn><annotation encoding="application/x-tex">0</annotation></semantics></math> after. So, we can say that only digits on indices from <math id="S15.SS0.SSS0.Px1.p3.pic1.m4" class="ltx_Math" alttext="i" display="inline" intent=":literal"><semantics><mi style="--ltx-fg-color:#000000;" mathcolor="#000000">i</mi><annotation encoding="application/x-tex">i</annotation></semantics></math> to <math id="S15.SS0.SSS0.Px1.p3.pic1.m5" class="ltx_Math" alttext="i+9" display="inline" intent=":literal"><semantics><mrow><mi style="--ltx-fg-color:#000000;" mathcolor="#000000">i</mi><mo style="--ltx-fg-color:#000000;" mathcolor="#000000">+</mo><mn style="--ltx-fg-color:#000000;" mathcolor="#000000">9</mn></mrow><annotation encoding="application/x-tex">i+9</annotation></semantics></math> can stand on index <math id="S15.SS0.SSS0.Px1.p3.pic1.m6" class="ltx_Math" alttext="i" display="inline" intent=":literal"><semantics><mi style="--ltx-fg-color:#000000;" mathcolor="#000000">i</mi><annotation encoding="application/x-tex">i</annotation></semantics></math>, because the maximum digit <math id="S15.SS0.SSS0.Px1.p3.pic1.m7" class="ltx_Math" alttext="9" display="inline" intent=":literal"><semantics><mn style="--ltx-fg-color:#000000;" mathcolor="#000000">9</mn><annotation encoding="application/x-tex">9</annotation></semantics></math> can be moved to the left no more than <math id="S15.SS0.SSS0.Px1.p3.pic1.m8" class="ltx_Math" alttext="9" display="inline" intent=":literal"><semantics><mn style="--ltx-fg-color:#000000;" mathcolor="#000000">9</mn><annotation encoding="application/x-tex">9</annotation></semantics></math> times. 
<br class="ltx_break">
<br class="ltx_break">Thus, for each <math id="S15.SS0.SSS0.Px1.p3.pic1.m9" class="ltx_Math" alttext="i" display="inline" intent=":literal"><semantics><mi style="--ltx-fg-color:#000000;" mathcolor="#000000">i</mi><annotation encoding="application/x-tex">i</annotation></semantics></math> we can brute force all digits from <math id="S15.SS0.SSS0.Px1.p3.pic1.m10" class="ltx_Math" alttext="s_{i}" display="inline" intent=":literal"><semantics><msub><mi style="--ltx-fg-color:#000000;" mathcolor="#000000">s</mi><mi style="--ltx-fg-color:#000000;" mathcolor="#000000">i</mi></msub><annotation encoding="application/x-tex">s_{i}</annotation></semantics></math> to <math id="S15.SS0.SSS0.Px1.p3.pic1.m11" class="ltx_Math" alttext="s_{i+9}" display="inline" intent=":literal"><semantics><msub><mi style="--ltx-fg-color:#000000;" mathcolor="#000000">s</mi><mrow><mi style="--ltx-fg-color:#000000;" mathcolor="#000000">i</mi><mo style="--ltx-fg-color:#000000;" mathcolor="#000000">+</mo><mn style="--ltx-fg-color:#000000;" mathcolor="#000000">9</mn></mrow></msub><annotation encoding="application/x-tex">s_{i+9}</annotation></semantics></math> and pick such <math id="S15.SS0.SSS0.Px1.p3.pic1.m12" class="ltx_Math" alttext="j" display="inline" intent=":literal"><semantics><mi style="--ltx-fg-color:#000000;" mathcolor="#000000">j</mi><annotation encoding="application/x-tex">j</annotation></semantics></math> that <math id="S15.SS0.SSS0.Px1.p3.pic1.m13" class="ltx_Math" alttext="s_{j}-(j-i)" display="inline" intent=":literal"><semantics><mrow><msub><mi style="--ltx-fg-color:#000000;" mathcolor="#000000">s</mi><mi style="--ltx-fg-color:#000000;" mathcolor="#000000">j</mi></msub><mo style="--ltx-fg-color:#000000;" mathcolor="#000000">−</mo><mrow><mo style="--ltx-fg-color:#000000;" mathcolor="#000000" stretchy="false">(</mo><mrow><mi style="--ltx-fg-color:#000000;" mathcolor="#000000">j</mi><mo style="--ltx-fg-color:#000000;" mathcolor="#000000">−</mo><mi style="--ltx-fg-color:#000000;" mathcolor="#000000">i</mi></mrow><mo style="--ltx-fg-color:#000000;" mathcolor="#000000" stretchy="false">)</mo></mrow></mrow><annotation encoding="application/x-tex">s_{j}-(j-i)</annotation></semantics></math> is maximum; if we have multiple maximum options, we will minimize <math id="S15.SS0.SSS0.Px1.p3.pic1.m14" class="ltx_Math" alttext="j" display="inline" intent=":literal"><semantics><mi style="--ltx-fg-color:#000000;" mathcolor="#000000">j</mi><annotation encoding="application/x-tex">j</annotation></semantics></math>. After that, we will move <math id="S15.SS0.SSS0.Px1.p3.pic1.m15" class="ltx_Math" alttext="s_{j}" display="inline" intent=":literal"><semantics><msub><mi style="--ltx-fg-color:#000000;" mathcolor="#000000">s</mi><mi style="--ltx-fg-color:#000000;" mathcolor="#000000">j</mi></msub><annotation encoding="application/x-tex">s_{j}</annotation></semantics></math> to the left until it is on index <math id="S15.SS0.SSS0.Px1.p3.pic1.m16" class="ltx_Math" alttext="i" display="inline" intent=":literal"><semantics><mi style="--ltx-fg-color:#000000;" mathcolor="#000000">i</mi><annotation encoding="application/x-tex">i</annotation></semantics></math>.</span></span>
</span></span></span></foreignobject></g></g></svg>