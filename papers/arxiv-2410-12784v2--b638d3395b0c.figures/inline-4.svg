<svg id="A1.SS6.p3.pic1" class="ltx_picture" height="859.67" overflow="visible" version="1.1" viewbox="0 0 550 859.67" width="550"><g style="--ltx-stroke-color:#000000;--ltx-fill-color:#000000;" fill="#000000" stroke="#000000" stroke-width="0.4pt" transform="translate(0,859.67) matrix(1 0 0 -1 0 0)"><g style="--ltx-fill-color:#4D4D4D;" fill="#4D4D4D" fill-opacity="1.0"><path style="stroke:none" d="M 0 5.91 L 0 853.76 C 0 857.02 2.64 859.67 5.91 859.67 L 544.09 859.67 C 547.36 859.67 550 857.02 550 853.76 L 550 5.91 C 550 2.64 547.36 0 544.09 0 L 5.91 0 C 2.64 0 0 2.64 0 5.91 Z" /></g><g style="--ltx-fill-color:#F9F9F9;" fill="#F9F9F9" fill-opacity="1.0"><path style="stroke:none" d="M 1.97 5.91 L 1.97 835.55 L 548.03 835.55 L 548.03 5.91 C 548.03 3.73 546.27 1.97 544.09 1.97 L 5.91 1.97 C 3.73 1.97 1.97 3.73 1.97 5.91 Z" /></g><g fill-opacity="1.0" transform="matrix(1.0 0.0 0.0 1.0 21.65 844.15)"><foreignobject style="--ltx-fo-width:36.62em;--ltx-fo-height:0.69em;--ltx-fo-depth:0.19em;font-size:10pt;" height="12.3" overflow="visible" transform="matrix(1 0 0 -1 0 9.61)" width="506.72"><span class="ltx_foreignobject_container"><span class="ltx_foreignobject_content">
<span id="A1.SS6.p3.pic1.1" class="ltx_inline-block ltx_minipage ltx_align_bottom" style="width:36.62em;">
<span id="A1.SS6.p3.pic1.1.1" class="ltx_p"><span id="A1.SS6.p3.pic1.1.1.1" class="ltx_text" style="--ltx-fg-color:#FFFFFF;">Arena-Hard Prompt</span></span>
</span></span></span></foreignobject></g><g fill-opacity="1.0" transform="matrix(1.0 0.0 0.0 1.0 21.65 17.24)"><foreignobject style="--ltx-fo-width:36.62em;--ltx-fo-height:58.29em;--ltx-fo-depth:0.25em;font-size:10pt;" height="809.97" overflow="visible" transform="matrix(1 0 0 -1 0 806.51)" width="506.72"><span class="ltx_foreignobject_container"><span class="ltx_foreignobject_content">
<span id="A1.SS6.p3.pic1.2" class="ltx_inline-block ltx_minipage ltx_align_bottom" style="width:36.62em;">
<span id="A1.SS6.p3.pic1.2.1" class="ltx_p"><span id="A1.SS6.p3.pic1.2.1.1" class="ltx_text ltx_font_bold" style="--ltx-fg-color:#000000;">System Prompt:
<br class="ltx_break"><span id="A1.SS6.p3.pic1.2.1.1.1" class="ltx_text ltx_font_medium">Please act as an impartial judge and evaluate the quality of the responses provided by two AI assistants to the user prompt displayed below. You will be given assistant A’s answer and assistant B’s answer. Your job is to evaluate which assistant’s answer is better.
<br class="ltx_break"></span></span></span>
<span id="A1.SS6.p3.pic1.2.2" class="ltx_p"><span id="A1.SS6.p3.pic1.2.2.1" class="ltx_text" style="--ltx-fg-color:#000000;">Begin your evaluation by generating your own answer to the prompt. You must provide your answers before judging any answers.
<br class="ltx_break"></span></span>
<span id="A1.SS6.p3.pic1.2.3" class="ltx_p"><span id="A1.SS6.p3.pic1.2.3.1" class="ltx_text" style="--ltx-fg-color:#000000;">When evaluating the assistants’ answers, compare both assistants’ answers with your answer. You must identify and correct any mistakes or inaccurate information.
<br class="ltx_break"></span></span>
<span id="A1.SS6.p3.pic1.2.4" class="ltx_p"><span id="A1.SS6.p3.pic1.2.4.1" class="ltx_text" style="--ltx-fg-color:#000000;">Then consider if the assistant’s answers are helpful, relevant, and concise. Helpful means the answer correctly responds to the prompt or follows the instructions. Note when user prompt has any ambiguity or more than one interpretation, it is more helpful and appropriate to ask for clarifications or more information from the user than providing an answer based on assumptions. Relevant means all parts of the response closely connect or are appropriate to what is being asked. Concise means the response is clear and not verbose or excessive.
<br class="ltx_break"></span></span>
<span id="A1.SS6.p3.pic1.2.5" class="ltx_p"><span id="A1.SS6.p3.pic1.2.5.1" class="ltx_text" style="--ltx-fg-color:#000000;">Then consider the creativity and novelty of the assistant’s answers when needed. Finally, identify any missing important information in the assistants’ answers that would be beneficial to include when responding to the user prompt.
<br class="ltx_break"></span></span>
<span id="A1.SS6.p3.pic1.2.6" class="ltx_p"><span id="A1.SS6.p3.pic1.2.6.1" class="ltx_text" style="--ltx-fg-color:#000000;">After providing your explanation, you must output only one of the following choices as your final verdict with a label:
<br class="ltx_break"></span></span>
<span id="A1.SS6.p3.pic1.2.7" class="ltx_p"><span id="A1.SS6.p3.pic1.2.7.1" class="ltx_text" style="--ltx-fg-color:#000000;">1. Assistant A is significantly better: [[A<span id="A1.SS6.p3.pic1.2.7.1.1" class="ltx_text ltx_font_typewriter">&gt;&gt;</span>B]]
<br class="ltx_break">2. Assistant A is slightly better: [[A<span id="A1.SS6.p3.pic1.2.7.1.2" class="ltx_text ltx_font_typewriter">&gt;</span>B]]
<br class="ltx_break">3. Tie, relatively the same: [[A=B]]
<br class="ltx_break">4. Assistant B is slightly better: [[B<span id="A1.SS6.p3.pic1.2.7.1.3" class="ltx_text ltx_font_typewriter">&gt;</span>A]]
<br class="ltx_break">5. Assistant B is significantly better: [[B<span id="A1.SS6.p3.pic1.2.7.1.4" class="ltx_text ltx_font_typewriter">&gt;&gt;</span>A]]
<br class="ltx_break"></span></span>
<span id="A1.SS6.p3.pic1.2.8" class="ltx_p"><span id="A1.SS6.p3.pic1.2.8.1" class="ltx_text" style="--ltx-fg-color:#000000;">Example output: “My final verdict is tie: [[A=B]]”.
<br class="ltx_break"></span></span>
<span id="A1.SS6.p3.pic1.2.9" class="ltx_p"><span id="A1.SS6.p3.pic1.2.9.1" class="ltx_text ltx_font_bold" style="--ltx-fg-color:#000000;">User Prompt:
<br class="ltx_break"><span id="A1.SS6.p3.pic1.2.9.1.1" class="ltx_text ltx_font_typewriter ltx_font_medium">&lt;|<span id="A1.SS6.p3.pic1.2.9.1.1.1" class="ltx_text ltx_font_serif">User Prompt</span>|&gt;
<br class="ltx_break"><span id="A1.SS6.p3.pic1.2.9.1.1.2" class="ltx_text ltx_font_serif">{question}
<br class="ltx_break"></span></span></span></span>
<span id="A1.SS6.p3.pic1.2.10" class="ltx_p"><span id="A1.SS6.p3.pic1.2.10.1" class="ltx_text ltx_font_typewriter" style="--ltx-fg-color:#000000;">&lt;|<span id="A1.SS6.p3.pic1.2.10.1.1" class="ltx_text ltx_font_serif">The Start of Assistant A’s Answer</span>|&gt;
<br class="ltx_break"><span id="A1.SS6.p3.pic1.2.10.1.2" class="ltx_text ltx_font_serif">{response_a}
<br class="ltx_break"></span>&lt;|<span id="A1.SS6.p3.pic1.2.10.1.3" class="ltx_text ltx_font_serif">The End of Assistant A’s Answer</span>|&gt;
<br class="ltx_break"></span></span>
<span id="A1.SS6.p3.pic1.2.11" class="ltx_p"><span id="A1.SS6.p3.pic1.2.11.1" class="ltx_text ltx_font_typewriter" style="--ltx-fg-color:#000000;">&lt;|<span id="A1.SS6.p3.pic1.2.11.1.1" class="ltx_text ltx_font_serif">The Start of Assistant B’s Answer</span>|&gt;
<br class="ltx_break"><span id="A1.SS6.p3.pic1.2.11.1.2" class="ltx_text ltx_font_serif">{response_b}
<br class="ltx_break"></span>&lt;|<span id="A1.SS6.p3.pic1.2.11.1.3" class="ltx_text ltx_font_serif">The End of Assistant B’s Answer</span>|&gt;<span id="A1.SS6.p3.pic1.2.11.1.4" class="ltx_text ltx_font_serif">
</span></span></span>
</span></span></span></foreignobject></g></g></svg>