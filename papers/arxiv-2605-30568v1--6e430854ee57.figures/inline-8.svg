<span id="A1.p12.pic1.1" class="ltx_inline-block ltx_minipage ltx_align_bottom" style="width:39.77em;">
<span id="A1.p12.pic1.1.1" class="ltx_p"><span id="A1.p12.pic1.1.1.1" class="ltx_text ltx_font_sansserif ltx_font_bold" style="--ltx-fg-color:#FFFFFF;">Rubric candidate generation (for reward collection)</span></span>
</span></span></span></foreignobject></g><g fill-opacity="1.0" transform="matrix(1.0 0.0 0.0 1.0 10.16 115.85)"><foreignobject style="--ltx-fo-width:43.55em;--ltx-fo-height:18.69em;--ltx-fo-depth:0.22em;font-size:10pt;" height="261.64" overflow="visible" transform="matrix(1 0 0 -1 0 258.56)" width="602.61"><span class="ltx_foreignobject_container"><span class="ltx_foreignobject_content">
<span id="A1.p12.pic1.2" class="ltx_inline-block ltx_minipage ltx_align_bottom" style="width:43.55em;">
<span id="A1.p12.pic1.2.1" class="ltx_p"><span id="A1.p12.pic1.2.1.1" class="ltx_text ltx_font_bold" style="--ltx-fg-color:#000000;">System:<span id="A1.p12.pic1.2.1.1.1" class="ltx_text ltx_font_typewriter ltx_font_medium"> You are an expert evaluator designing assessment criteria for AI responses. Given a task prompt, generate specific evaluation criteria that can each be answered with a clear YES or NO when checking a response.
</span></span></span>
<span id="A1.p12.pic1.2.2" class="ltx_p"><span id="A1.p12.pic1.2.2.1" class="ltx_text ltx_font_typewriter" style="--ltx-fg-color:#000000;">Guidelines:
<br class="ltx_break">- Each criterion must describe a concrete, observable requirement -- not an abstract quality dimension like &quot;clarity&quot; or &quot;accuracy.&quot;
<br class="ltx_break">- Criteria should be specific to THIS prompt, capturing what a domain expert would check for in a high-quality answer.
<br class="ltx_break">- Include both content requirements (what must be covered) and safety/quality guards (what must be avoided).
<br class="ltx_break">- Assign each criterion a weight reflecting its importance:
<br class="ltx_break">  Critical -- essential; failure indicates a serious flaw
<br class="ltx_break">  Major    -- important for a good response but not essential
<br class="ltx_break">  Minor    -- desirable but lower impact
</span></span>
<span id="A1.p12.pic1.2.3" class="ltx_p"><span id="A1.p12.pic1.2.3.1" class="ltx_text ltx_font_typewriter" style="--ltx-fg-color:#000000;">Output ONLY a JSON array of 5--10 objects with keys &quot;criterion&quot; and &quot;weight&quot;.
</span></span>
</span></span></span></foreignobject></g><g fill-opacity="1.0" transform="matrix(1.0 0.0 0.0 1.0 10.16 13.24)"><foreignobject style="--ltx-fo-width:43.55em;--ltx-fo-height:5.49em;--ltx-fo-depth:0.22em;font-size:10pt;" height="78.99" overflow="visible" transform="matrix(1 0 0 -1 0 75.91)" width="602.61"><span class="ltx_foreignobject_container"><span class="ltx_foreignobject_content">
<span id="A1.p12.pic1.3" class="ltx_inline-block ltx_minipage ltx_align_bottom" style="width:43.55em;">
<span id="A1.p12.pic1.3.1" class="ltx_p"><span id="A1.p12.pic1.3.1.1" class="ltx_text ltx_font_bold" style="--ltx-fg-color:#000000;">User:<span id="A1.p12.pic1.3.1.1.1" class="ltx_text ltx_font_typewriter ltx_font_medium"> [Prompt]
<br class="ltx_break">{prompt}
<br class="ltx_break" style="--ltx-break-space:5.3pt;">
Generate 5--10 specific, binary-testable evaluation criteria for responses to the above prompt. Output only the JSON array.
</span></span></span>
</span></span></span></foreignobject></g></g></svg>