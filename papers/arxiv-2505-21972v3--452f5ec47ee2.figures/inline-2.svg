<span id="Thmtheorem2" class="ltx_theorem ltx_theorem_theorem">
<h6 class="ltx_title ltx_runin ltx_title_theorem" style="--ltx-fg-color:#000000;"><span class="ltx_tag ltx_tag_theorem"><span id="Thmtheorem2.2" class="ltx_text ltx_font_bold">Theorem 2</span></span><span id="Thmtheorem2.3" class="ltx_text ltx_font_bold">.</span></h6>
<span id="Thmtheorem2.p1" class="ltx_para">
<span id="Thmtheorem2.p1.1" class="ltx_p"><span id="Thmtheorem2.p1.1.1" class="ltx_text ltx_font_italic" style="--ltx-fg-color:#000000;">Consider the 3+-level scoring setting with all judges either satisfying Assumptions <a href="#Thmassumption1" title="Assumption 1 (Strong Constancy). ‣ 4 THEORETICAL LIMITS OF RANKING IDENTIFIABILITY ‣ LLMs Judging LLMs: A Simplex Perspective" class="ltx_ref"><span class="ltx_text ltx_ref_tag">1</span></a> and <a href="#Thmassumption3" title="Assumption 3. ‣ 4.1 2-level scoring systems ‣ 4 THEORETICAL LIMITS OF RANKING IDENTIFIABILITY ‣ LLMs Judging LLMs: A Simplex Perspective" class="ltx_ref"><span class="ltx_text ltx_ref_tag">3</span></a> or Assumptions <a href="#footnote1" title="footnote 1 ‣ Assumption 2 (Moderate Constancy). ‣ 4 THEORETICAL LIMITS OF RANKING IDENTIFIABILITY ‣ LLMs Judging LLMs: A Simplex Perspective" class="ltx_ref"><span class="ltx_text ltx_ref_tag">1</span></a> and <a href="#Thmassumption3" title="Assumption 3. ‣ 4.1 2-level scoring systems ‣ 4 THEORETICAL LIMITS OF RANKING IDENTIFIABILITY ‣ LLMs Judging LLMs: A Simplex Perspective" class="ltx_ref"><span class="ltx_text ltx_ref_tag">3</span></a>.
Given only the distribution of judge-assigned scores, there exist candidates whose prevalence and/or expected-score rankings cannot be identified.</span></span>
</span>
</span></span></span></span></foreignobject></g></g></svg>