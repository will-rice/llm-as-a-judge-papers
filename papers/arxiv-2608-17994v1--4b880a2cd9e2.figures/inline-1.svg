</span></span></span></foreignobject></g><g fill-opacity="1.0" transform="matrix(1.0 0.0 0.0 1.0 21.65 16.47)"><foreignobject style="--ltx-fo-width:36.62em;--ltx-fo-height:16.29em;--ltx-fo-depth:0.19em;font-size:10pt;" height="228.16" overflow="visible" transform="matrix(1 0 0 -1 0 225.47)" width="506.72"><span class="ltx_foreignobject_container"><span class="ltx_foreignobject_content">
<span id="A2.SS3.SSS1.Px1.p2.pic1.2" class="ltx_inline-block ltx_minipage ltx_align_bottom" style="width:36.62em;">
<span id="A2.SS3.SSS1.Px1.p2.pic1.2.1" class="ltx_p"><span id="A2.SS3.SSS1.Px1.p2.pic1.2.1.1" class="ltx_text" style="--ltx-fg-color:#000000;">You are a helpful assistant acting as an impartial judge. You will be given a Question and a Candidate Answer. Your task is to judge whether the Candidate Answer is correct using your own knowledge. If the Candidate Answer is correct, choose ‘True’, otherwise, choose ‘False’. Provide a brief explanation for your decision.</span></span>
<span id="A2.SS3.SSS1.Px1.p2.pic1.2.2" class="ltx_p"><span id="A2.SS3.SSS1.Px1.p2.pic1.2.2.1" class="ltx_text" style="--ltx-fg-color:#000000;">Provide your response in the following format:
<br class="ltx_break"><span id="A2.SS3.SSS1.Px1.p2.pic1.2.2.1.1" class="ltx_text ltx_font_typewriter">Decision: [True/False]
<br class="ltx_break">Explanation: [Your brief explanation]</span></span></span>
<span id="A2.SS3.SSS1.Px1.p2.pic1.2.3" class="ltx_p"><span id="A2.SS3.SSS1.Px1.p2.pic1.2.3.1" class="ltx_text ltx_font_italic" style="--ltx-fg-color:#000000;">Example:
<br class="ltx_break"><span id="A2.SS3.SSS1.Px1.p2.pic1.2.3.1.1" class="ltx_text ltx_font_upright">Question: What is the capital of France?
<br class="ltx_break">Candidate Answer: Paris is the capital of France.
<br class="ltx_break">Decision: True
<br class="ltx_break">Explanation: Paris is indeed the capital of France.</span></span></span>
</span></span></span></foreignobject></g></g></svg>