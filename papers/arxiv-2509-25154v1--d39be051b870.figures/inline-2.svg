<span id="A2.SS2.SSS0.Px3.p2.pic1.2.1" class="ltx_p"><span id="A2.SS2.SSS0.Px3.p2.pic1.2.1.1" class="ltx_text ltx_font_typewriter" style="font-size:90%;--ltx-fg-color:#000000;">Given a prompt and two responses, follow the rubric to make a comparative judgment.
</span></span>
<span id="A2.SS2.SSS0.Px3.p2.pic1.2.2" class="ltx_p"><span id="A2.SS2.SSS0.Px3.p2.pic1.2.2.1" class="ltx_text ltx_font_typewriter" style="font-size:90%;--ltx-fg-color:#000000;">## Rubric:
Compare <span id="A2.SS2.SSS0.Px3.p2.pic1.2.2.1.1" class="ltx_text ltx_font_bold">Response 1</span> and <span id="A2.SS2.SSS0.Px3.p2.pic1.2.2.1.2" class="ltx_text ltx_font_bold">Response 2</span> along five aspects: <span id="A2.SS2.SSS0.Px3.p2.pic1.2.2.1.3" class="ltx_text ltx_font_bold">helpfulness</span>, <span id="A2.SS2.SSS0.Px3.p2.pic1.2.2.1.4" class="ltx_text ltx_font_bold">correctness</span>, <span id="A2.SS2.SSS0.Px3.p2.pic1.2.2.1.5" class="ltx_text ltx_font_bold">coherence</span>, <span id="A2.SS2.SSS0.Px3.p2.pic1.2.2.1.6" class="ltx_text ltx_font_bold">complexity</span>, and <span id="A2.SS2.SSS0.Px3.p2.pic1.2.2.1.7" class="ltx_text ltx_font_bold">verbosity</span>. Assign a single comparative score in -3,-2,-1,0,1,2,3 using the scale:  -3: R1 <span id="A2.SS2.SSS0.Px3.p2.pic1.2.2.1.8" class="ltx_text ltx_font_italic">much better</span> than R2;   -2: R1 <span id="A2.SS2.SSS0.Px3.p2.pic1.2.2.1.9" class="ltx_text ltx_font_italic">better</span> than R2;   -1: R1 <span id="A2.SS2.SSS0.Px3.p2.pic1.2.2.1.10" class="ltx_text ltx_font_italic">slightly better</span> than R2;  <span id="A2.SS2.SSS0.Px3.p2.pic1.2.2.1.11" class="ltx_text ltx_phantom"><span style="visibility:hidden">-3:</span></span> 0: about the same;   1: R2 <span id="A2.SS2.SSS0.Px3.p2.pic1.2.2.1.12" class="ltx_text ltx_font_italic">slightly better</span> than R1;   2: R2 <span id="A2.SS2.SSS0.Px3.p2.pic1.2.2.1.13" class="ltx_text ltx_font_italic">better</span> than R1;   3: R2 <span id="A2.SS2.SSS0.Px3.p2.pic1.2.2.1.14" class="ltx_text ltx_font_italic">much better</span> than R1.
</span></span>
<span id="A2.SS2.SSS0.Px3.p2.pic1.2.3" class="ltx_p"><span id="A2.SS2.SSS0.Px3.p2.pic1.2.3.1" class="ltx_text ltx_font_typewriter" style="font-size:90%;--ltx-fg-color:#000000;">## Prompt (conversation/context): [CONTEXT AS FLATTENED TEXT]
</span></span>
