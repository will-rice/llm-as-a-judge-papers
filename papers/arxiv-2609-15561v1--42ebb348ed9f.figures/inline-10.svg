<svg id="A3.p3.pic1" class="ltx_picture" height="375.56" overflow="visible" version="1.1" viewbox="0 0 650 375.56" width="650"><g style="--ltx-stroke-color:#000000;--ltx-fill-color:#000000;" fill="#000000" stroke="#000000" stroke-width="0.4pt" transform="translate(0,375.56) matrix(1 0 0 -1 0 0)"><g style="--ltx-fill-color:#404040;" fill="#404040" fill-opacity="1.0"><path style="stroke:none" d="M 0 5.91 L 0 369.66 C 0 372.92 2.64 375.56 5.91 375.56 L 644.09 375.56 C 647.36 375.56 650 372.92 650 369.66 L 650 5.91 C 650 2.64 647.36 0 644.09 0 L 5.91 0 C 2.64 0 0 2.64 0 5.91 Z" /></g><g style="--ltx-fill-color:#E6E6FF;" fill="#E6E6FF" fill-opacity="1.0"><path style="stroke:none" d="M 1.97 5.91 L 1.97 354.14 L 648.03 354.14 L 648.03 5.91 C 648.03 3.73 646.27 1.97 644.09 1.97 L 5.91 1.97 C 3.73 1.97 1.97 3.73 1.97 5.91 Z" /></g><g fill-opacity="1.0" transform="matrix(1.0 0.0 0.0 1.0 21.65 360.05)"><foreignobject style="--ltx-fo-width:43.85em;--ltx-fo-height:0.69em;--ltx-fo-depth:0em;font-size:10pt;" height="9.61" overflow="visible" transform="matrix(1 0 0 -1 0 9.61)" width="606.76"><span class="ltx_foreignobject_container"><span class="ltx_foreignobject_content">
<span id="A3.p3.pic1.1" class="ltx_inline-block ltx_minipage ltx_align_bottom" style="width:43.85em;">
<span id="A3.p3.pic1.1.1" class="ltx_p"><span id="A3.p3.pic1.1.1.1" class="ltx_text" style="--ltx-fg-color:#FFFFFF;">Evaluation Guidelines</span></span>
</span></span></span></foreignobject></g><g fill-opacity="1.0" transform="matrix(1.0 0.0 0.0 1.0 21.65 17.24)"><foreignobject style="--ltx-fo-width:43.85em;--ltx-fo-height:23.49em;--ltx-fo-depth:0.25em;font-size:10pt;" height="328.56" overflow="visible" transform="matrix(1 0 0 -1 0 325.1)" width="606.76"><span class="ltx_foreignobject_container"><span class="ltx_foreignobject_content">
<span id="A3.p3.pic1.2" class="ltx_inline-block ltx_minipage ltx_align_bottom" style="width:43.85em;">
<span id="A3.p3.pic1.2.1" class="ltx_p"><span id="A3.p3.pic1.2.1.1" class="ltx_text" style="--ltx-fg-color:#000000;">This evaluation aims to measure how well an automated pipeline can mimic human-crafted answers across varying levels of factual correctness. In this blind test, you will compare pairs of answers — one generated by the pipeline and one authored by a human expert — for each error level (A0 to A4). 
<br class="ltx_break"></span></span>
<span id="A3.p3.pic1.2.2" class="ltx_p"><span id="A3.p3.pic1.2.2.1" class="ltx_text" style="--ltx-fg-color:#000000;">Each level is designed to reflect a different degree of correctness: 
<br class="ltx_break"></span></span>
<span id="A3.p3.pic1.2.3" class="ltx_p"><span id="A3.p3.pic1.2.3.1" class="ltx_text" style="--ltx-fg-color:#000000;">A0: As accurate and comprehensive as the ground truth. 
<br class="ltx_break">A1–A3: Gradual decline in factual accuracy and coherence. 
<br class="ltx_break">A4: Mostly incorrect, though potentially still plausible at surface level. 
<br class="ltx_break"></span></span>
<span id="A3.p3.pic1.2.4" class="ltx_p"><span id="A3.p3.pic1.2.4.1" class="ltx_text" style="--ltx-fg-color:#000000;">#Your task: 
<br class="ltx_break"></span></span>
<span id="A3.p3.pic1.2.5" class="ltx_p"><span id="A3.p3.pic1.2.5.1" class="ltx_text" style="--ltx-fg-color:#000000;">For each level (A0 to A4), select the answer (pipeline or human) that best corresponds to the intended degree of correctness. You’re not assessing which answer is “better” in isolation, but which one more appropriately reflects the target quality level. 
<br class="ltx_break"></span></span>
<span id="A3.p3.pic1.2.6" class="ltx_p"><span id="A3.p3.pic1.2.6.1" class="ltx_text" style="--ltx-fg-color:#000000;"># Consider the following: 
<br class="ltx_break"></span></span>
<span id="A3.p3.pic1.2.7" class="ltx_p"><span id="A3.p3.pic1.2.7.1" class="ltx_text" style="--ltx-fg-color:#000000;">Does the selected answer reflect the intended factual quality of the level? 
<br class="ltx_break">Is the answer too correct or too incorrect for the target level? 
<br class="ltx_break">Does one of the answers exhibit subtle errors, misleading phrasing, or hallucinations that better match the expected degradation? 
<br class="ltx_break">Does the introduced errors are too obvious? 
<br class="ltx_break"></span></span>
<span id="A3.p3.pic1.2.8" class="ltx_p"><span id="A3.p3.pic1.2.8.1" class="ltx_text" style="--ltx-fg-color:#000000;">The ultimate goal is to determine whether the pipeline can generate answers that faithfully emulate the intended quality tiers, as well (or better) than human experts.</span></span>
</span></span></span></foreignobject></g></g></svg>