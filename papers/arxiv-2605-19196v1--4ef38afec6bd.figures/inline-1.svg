</span></span></span></foreignobject></g><g fill-opacity="1.0" transform="matrix(1.0 0.0 0.0 1.0 10.16 11.89)"><foreignobject style="--ltx-fo-width:33.03em;--ltx-fo-height:14.95em;--ltx-fo-depth:0.23em;font-size:10pt;" class="ltx_minipage" height="209.98" overflow="visible" transform="matrix(1 0 0 -1 0 206.87)" width="34.95em"><span class="ltx_foreignobject_container"><span class="ltx_foreignobject_content"><pre id="A3.SS1.p1.pic1.2" class="ltx_verbatim ltx_font_typewriter" style="font-size:90%;--ltx-fg-color:#000000;">You are an expert evaluator of AI research agent traces.

Given a research query and the agent’s full reasoning trace (including
planning, search, reflection, and synthesis steps), rate the trace on the
following dimensions. Use a 1-5 scale where 1=very poor and 5=excellent.

Dimensions:
- coherence: Does the reasoning flow logically?
  Do later steps build on earlier findings?
- factual_alignment: Are claims accurate and consistent with the retrieved
  evidence?
- info_density: Does the trace contain specific facts, numbers, and concrete
  details?
- synthesis_quality: Does the final answer integrate information across sources
  with comparative analysis?

Query: {query}

Agent Trace:
{trace}

Output ONLY a JSON object with four integer scores, no other text:
{{&quot;coherence&quot;: ..., &quot;factual_alignment&quot;: ..., &quot;info_density&quot;: ...,
  &quot;synthesis_quality&quot;: ...}}
</pre></span></span></foreignobject></g></g></svg>