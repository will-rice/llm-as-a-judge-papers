<span id="A4.SS2.SSS1.p3.pic1.1" class="ltx_inline-block ltx_minipage ltx_align_bottom" style="width:44.07em;">
<span id="A4.SS2.SSS1.p3.pic1.1.1" class="ltx_p"><span id="A4.SS2.SSS1.p3.pic1.1.1.1" class="ltx_text" style="--ltx-fg-color:#FFFFFF;">MATH Feedback Generator</span></span>
</span></span></span></foreignobject></g><g fill-opacity="1.0" transform="matrix(1.0 0.0 0.0 1.0 21.65 16.47)"><foreignobject style="--ltx-fo-width:44.07em;--ltx-fo-height:33.09em;--ltx-fo-depth:0.19em;font-size:10pt;" height="460.62" overflow="visible" transform="matrix(1 0 0 -1 0 457.93)" width="609.8"><span class="ltx_foreignobject_container"><span class="ltx_foreignobject_content">
<span id="A4.SS2.SSS1.p3.pic1.2" class="ltx_inline-block ltx_minipage ltx_align_bottom" style="width:44.07em;">
<span id="A4.SS2.SSS1.p3.pic1.2.1" class="ltx_p"><span id="A4.SS2.SSS1.p3.pic1.2.1.1" class="ltx_text" style="--ltx-fg-color:#000000;">Refer to the pre-generated evaluation on the given question below and generate feedback for the model.</span></span>
<span id="A4.SS2.SSS1.p3.pic1.2.2" class="ltx_p"><span id="A4.SS2.SSS1.p3.pic1.2.2.1" class="ltx_text" style="--ltx-fg-color:#000000;">Your response must include:
1. Feedback: Provide the model with concise, constructive guidance based on the evaluation and reference solution. 
<br class="ltx_break">2. Feedback Type: Choose one of the following: 
<br class="ltx_break">- Conceptual Guidance: Focus on understanding key concepts. 
<br class="ltx_break">- Error Identification and Correction: Address specific mistakes and guide corrections. 
<br class="ltx_break">- Process and Strategy Guidance: Improve the model’s approach or strategy. 
<br class="ltx_break">- Precision and Accuracy Emphasis: Stress precision in calculations or answer format. 
<br class="ltx_break">- Encouragement and Affirmation: Motivate and reinforce correct actions.</span></span>
<span id="A4.SS2.SSS1.p3.pic1.2.3" class="ltx_p"><span id="A4.SS2.SSS1.p3.pic1.2.3.1" class="ltx_text ltx_font_bold" style="--ltx-fg-color:#000000;">Guidelines:<span id="A4.SS2.SSS1.p3.pic1.2.3.1.1" class="ltx_text ltx_font_medium">
1. Do not reveal the solution. Guide the assistant toward understanding the correct approach. 
<br class="ltx_break">2. Ensure feedback is unique, avoiding repetition. 
<br class="ltx_break">3. Provide progressively more specific hints without focusing on trivial issues. 
<br class="ltx_break">4. If the model does not seem to understand the question, explain what the question is.</span></span></span>
<span id="A4.SS2.SSS1.p3.pic1.2.4" class="ltx_p"><span id="A4.SS2.SSS1.p3.pic1.2.4.1" class="ltx_text ltx_font_bold" style="--ltx-fg-color:#000000;">Response format must be in JSON as shown below:<span id="A4.SS2.SSS1.p3.pic1.2.4.1.1" class="ltx_text ltx_font_medium">
{example}</span></span></span>
<span id="A4.SS2.SSS1.p3.pic1.2.5" class="ltx_p"><span id="A4.SS2.SSS1.p3.pic1.2.5.1" class="ltx_text ltx_font_bold" style="--ltx-fg-color:#000000;">Input:
<br class="ltx_break"><span id="A4.SS2.SSS1.p3.pic1.2.5.1.1" class="ltx_text ltx_font_medium">Question: {Question} 
<br class="ltx_break">Reference Solution (DO NOT disclose): {Solution} 
<br class="ltx_break">Correct Answer (DO NOT disclose): {answer} 
<br class="ltx_break">Pre-generated Evaluation: evaluation 
<br class="ltx_break">Previous Feedback: model history 
<br class="ltx_break">Model Output (to evaluate): model output</span></span></span>
<span id="A4.SS2.SSS1.p3.pic1.2.6" class="ltx_p"><span id="A4.SS2.SSS1.p3.pic1.2.6.1" class="ltx_text ltx_font_bold" style="--ltx-fg-color:#000000;">Output:<span id="A4.SS2.SSS1.p3.pic1.2.6.1.1" class="ltx_text"></span></span></span>
</span></span></span></foreignobject></g></g></svg>