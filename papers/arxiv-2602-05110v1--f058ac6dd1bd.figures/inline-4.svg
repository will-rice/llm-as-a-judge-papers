<span id="S3.F5.pic1.16.1" class="ltx_p"></span>
<span id="S3.F5.pic1.16.2" class="ltx_p ltx_align_left"><span id="S3.F5.pic1.16.2.1" class="ltx_text ltx_font_bold">1. Accuracy 8.8 <math id="S3.F5.pic1.m8" class="ltx_Math" alttext="\pm" display="inline" intent=":literal"><semantics><mo>±</mo><annotation encoding="application/x-tex">\pm</annotation></semantics></math> 0.29
<br class="ltx_break" style="--ltx-break-space:0.9pt;"></span>
Strong alignment with real-world MCC risk drivers across all five dimensions. Minor misses in some regulatory nuances and slight over-generalization of fraud patterns at mid-tiers.</span>
<span id="S3.F5.pic1.16.3" class="ltx_p ltx_align_left"><span id="S3.F5.pic1.16.3.1" class="ltx_text ltx_font_bold">2. Rationale Quality 8.6 <math id="S3.F5.pic1.m9" class="ltx_Math" alttext="\pm" display="inline" intent=":literal"><semantics><mo>±</mo><annotation encoding="application/x-tex">\pm</annotation></semantics></math> 0.37
<br class="ltx_break" style="--ltx-break-space:0.9pt;"></span>
Clear, structured, and logically coherent. Explanations are professional but occasionally lack the granular specificity seen in top-tier rationales.</span>
<span id="S3.F5.pic1.16.4" class="ltx_p ltx_align_left"><span id="S3.F5.pic1.16.4.1" class="ltx_text ltx_font_bold">3. Consistency 8.9 <math id="S3.F5.pic1.m10" class="ltx_Math" alttext="\pm" display="inline" intent=":literal"><semantics><mo>±</mo><annotation encoding="application/x-tex">\pm</annotation></semantics></math> 0.28
<br class="ltx_break" style="--ltx-break-space:0.9pt;"></span>
Smooth and logical progression across all five levels. Risk escalation is well-articulated with minimal internal contradictions.</span>
<span id="S3.F5.pic1.16.5" class="ltx_p ltx_align_left"><span id="S3.F5.pic1.16.5.1" class="ltx_text ltx_font_bold">4. Completeness 9.5 <math id="S3.F5.pic1.m11" class="ltx_Math" alttext="\pm" display="inline" intent=":literal"><semantics><mo>±</mo><annotation encoding="application/x-tex">\pm</annotation></semantics></math> 0.12
<br class="ltx_break" style="--ltx-break-space:0.9pt;"></span>
All five dimensions consistently addressed at every level. Coverage is comprehensive with only minor implicit elements.</span>
<span id="S3.F5.pic1.16.6" class="ltx_p ltx_align_left"><span id="S3.F5.pic1.16.6.1" class="ltx_text ltx_font_bold">5. Practical Applicability 8.7 <math id="S3.F5.pic1.m12" class="ltx_Math" alttext="\pm" display="inline" intent=":literal"><semantics><mo>±</mo><annotation encoding="application/x-tex">\pm</annotation></semantics></math> 0.33
<br class="ltx_break" style="--ltx-break-space:0.9pt;"></span>
Strong operational value for payments-risk teams. Language is actionable though could benefit from more quantitative anchors in certain areas.</span>
