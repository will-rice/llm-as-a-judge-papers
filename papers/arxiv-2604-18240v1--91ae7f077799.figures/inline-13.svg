<span id="A1.SS11.SSS3.p2.pic1.1.1" class="ltx_p"><span id="A1.SS11.SSS3.p2.pic1.1.1.1" class="ltx_text ltx_font_bold" style="--ltx-fg-color:#000000;">LLM-as-a-Judge Prompt</span></span>
</span></span></span></foreignobject></g><g fill-opacity="1.0" transform="matrix(1.0 0.0 0.0 1.0 21.07 15.89)"><foreignobject style="--ltx-fo-width:44.16em;--ltx-fo-height:21.09em;--ltx-fo-depth:0.19em;font-size:10pt;" height="294.58" overflow="visible" transform="matrix(1 0 0 -1 0 291.89)" width="611.05"><span class="ltx_foreignobject_container"><span class="ltx_foreignobject_content">
<span id="A1.SS11.SSS3.p2.pic1.2" class="ltx_inline-block ltx_minipage ltx_align_bottom" style="width:44.16em;">
<span id="A1.SS11.SSS3.p2.pic1.2.1" class="ltx_p"><span id="A1.SS11.SSS3.p2.pic1.2.1.1" class="ltx_text" style="--ltx-fg-color:#000000;"># Single Trajectory Evaluation Task
<br class="ltx_break"></span></span>
<span id="A1.SS11.SSS3.p2.pic1.2.2" class="ltx_p"><span id="A1.SS11.SSS3.p2.pic1.2.2.1" class="ltx_text" style="--ltx-fg-color:#000000;">## Instruction:
<br class="ltx_break">{instruction}
<br class="ltx_break"></span></span>
<span id="A1.SS11.SSS3.p2.pic1.2.3" class="ltx_p"><span id="A1.SS11.SSS3.p2.pic1.2.3.1" class="ltx_text" style="--ltx-fg-color:#000000;">## Trajectory:
<br class="ltx_break">{trajectory}
<br class="ltx_break"></span></span>
<span id="A1.SS11.SSS3.p2.pic1.2.4" class="ltx_p"><span id="A1.SS11.SSS3.p2.pic1.2.4.1" class="ltx_text" style="--ltx-fg-color:#000000;">## Evaluation Guidelines:
<br class="ltx_break">1. Act as a **neutral and impartial judge**.
<br class="ltx_break">2. Analyze the trajectory to determine if it successfully completes the given instruction.
<br class="ltx_break">3. Consider whether the trajectory follows logical steps and achieves the intended goal.
<br class="ltx_break">4. Look for any errors, inconsistencies, or failures in the execution.
<br class="ltx_break">5. Provide a clear explanation of your reasoning.</span></span>
<span id="A1.SS11.SSS3.p2.pic1.2.5" class="ltx_p"><span id="A1.SS11.SSS3.p2.pic1.2.5.1" class="ltx_text" style="--ltx-fg-color:#000000;">## Expected Output:
<br class="ltx_break">- First, provide your detailed analysis of the trajectory, explaining why it succeeds or fails.
<br class="ltx_break">- Then, output your final verdict in this exact format:
<br class="ltx_break">- If the trajectory **successfully completes** the instruction, output: `[[TRUE]]`
<br class="ltx_break">- If the trajectory **fails to complete** the instruction, output: `[[FALSE]]`
<br class="ltx_break">- You must output your final verdict in your final message, using exactly one of the above formats and nothing else after it.</span></span>
</span></span></span></foreignobject></g></g></svg>