<span id="A4.F16.pic1.1" class="ltx_inline-block ltx_minipage ltx_align_bottom" style="width:39.4em;">
<span id="A4.F16.pic1.1.1" class="ltx_p"><span id="A4.F16.pic1.1.1.1" class="ltx_text ltx_font_bold" style="--ltx-fg-color:#FFFFFF;">Single-Voiced Rubric Generation with Sampling Response Prompt.</span></span>
</span></span></span></foreignobject></g><g fill-opacity="1.0" transform="matrix(1.0 0.0 0.0 1.0 13.07 15.84)"><foreignobject style="--ltx-fo-width:43.15em;--ltx-fo-height:37.9em;--ltx-fo-depth:0.2em;font-size:10pt;" height="527.2" overflow="visible" transform="matrix(1 0 0 -1 0 524.43)" width="597.07"><span class="ltx_foreignobject_container"><span class="ltx_foreignobject_content">
<span id="A4.F16.pic1.2" class="ltx_inline-block ltx_minipage ltx_align_bottom" style="width:43.15em;">
<span id="A4.F16.pic1.2.1" class="ltx_p"><span id="A4.F16.pic1.2.1.1" class="ltx_text ltx_verbatim ltx_font_typewriter ltx_inline-block" style="width:453.1pt;--ltx-fg-color:#000000;"><span id="A4.F16.pic1.2.1.1.1" class="ltx_text ltx_inline-block" style="width:0.0pt;"> </span><span id="A4.F16.pic1.2.1.1.2" class="ltx_text ltx_inline-block" style="width:0.0pt;"> </span><span id="A4.F16.pic1.2.1.1.3" class="ltx_text ltx_inline-block" style="width:21.0pt;"> </span><span id="A4.F16.pic1.2.1.1.4" class="ltx_inline-logical-block ltx_parbox ltx_align_top" style="width:432.1pt;">
<span id="A4.F16.pic1.p1" class="ltx_para ltx_noindent">
<span id="A4.F16.pic1.p1.1" class="ltx_p">&quot;&quot;&quot;You are an expert evaluator. Given a user query and a sample response, your task is to design a concrete set of binary (yes/no) evaluation criteria (a &quot;rubric&quot;) that can be used to judge whether ANY candidate response to this query is good.</span>
</span></span></span></span>
<span id="A4.F16.pic1.2.2" class="ltx_p" style="width:453.1pt;"><span id="A4.F16.pic1.2.2.1" class="ltx_text ltx_verbatim ltx_font_typewriter ltx_inline-block" style="width:453.1pt;--ltx-fg-color:#000000;"><span id="A4.F16.pic1.2.2.1.1" class="ltx_inline-logical-block ltx_parbox ltx_pruned_first ltx_align_top" style="width:453.1pt;"></span></span></span>
<span id="A4.F16.pic1.2.3" class="ltx_p" style="width:453.1pt;"><span id="A4.F16.pic1.2.3.1" class="ltx_text ltx_verbatim ltx_font_typewriter ltx_inline-block" style="width:453.1pt;--ltx-fg-color:#000000;"><span id="A4.F16.pic1.2.3.1.1" class="ltx_text ltx_inline-block" style="width:0.0pt;"> </span><span id="A4.F16.pic1.2.3.1.2" class="ltx_text ltx_inline-block" style="width:0.0pt;"> </span><span id="A4.F16.pic1.2.3.1.3" class="ltx_text ltx_inline-block" style="width:21.0pt;"> </span><span id="A4.F16.pic1.2.3.1.4" class="ltx_inline-logical-block ltx_parbox ltx_align_top" style="width:432.1pt;">
<span id="A4.F16.pic1.p3" class="ltx_para ltx_noindent">
<span id="A4.F16.pic1.p3.1" class="ltx_p">The sample response is provided for reference to help you understand what kind of content could reasonably be expected. However, the rubric you design must be generic enough to apply to ANY response to this query, not just the sample.</span>
</span></span></span></span>
<span id="A4.F16.pic1.2.4" class="ltx_p" style="width:453.1pt;"><span id="A4.F16.pic1.2.4.1" class="ltx_text ltx_verbatim ltx_font_typewriter ltx_inline-block" style="width:453.1pt;--ltx-fg-color:#000000;"><span id="A4.F16.pic1.2.4.1.1" class="ltx_inline-logical-block ltx_parbox ltx_pruned_first ltx_align_top" style="width:453.1pt;"></span></span></span>
<span id="A4.F16.pic1.2.5" class="ltx_p" style="width:453.1pt;"><span id="A4.F16.pic1.2.5.1" class="ltx_text ltx_verbatim ltx_font_typewriter ltx_inline-block" style="width:453.1pt;--ltx-fg-color:#000000;"><span id="A4.F16.pic1.2.5.1.1" class="ltx_inline-logical-block ltx_parbox ltx_align_top" style="width:453.1pt;">
<span id="A4.F16.pic1.p5" class="ltx_para ltx_noindent">
<span id="A4.F16.pic1.p5.1" class="ltx_p">**Rules:**</span>
</span></span></span></span>
<span id="A4.F16.pic1.2.6" class="ltx_p" style="width:453.1pt;"><span id="A4.F16.pic1.2.6.1" class="ltx_text ltx_verbatim ltx_font_typewriter ltx_inline-block" style="width:453.1pt;--ltx-fg-color:#000000;"><span id="A4.F16.pic1.2.6.1.1" class="ltx_inline-logical-block ltx_parbox ltx_align_top" style="width:453.1pt;">
<span id="A4.F16.pic1.p6" class="ltx_para ltx_noindent">
<span id="A4.F16.pic1.p6.1" class="ltx_p">- Each criterion must start with &quot;Does the response...&quot;</span>
</span></span></span></span>
<span id="A4.F16.pic1.2.7" class="ltx_p" style="width:453.1pt;"><span id="A4.F16.pic1.2.7.1" class="ltx_text ltx_verbatim ltx_font_typewriter ltx_inline-block" style="width:453.1pt;--ltx-fg-color:#000000;"><span id="A4.F16.pic1.2.7.1.1" class="ltx_inline-logical-block ltx_parbox ltx_align_top" style="width:453.1pt;">
<span id="A4.F16.pic1.p7" class="ltx_para ltx_noindent">
<span id="A4.F16.pic1.p7.1" class="ltx_p">- Each criterion must test exactly ONE thing</span>
</span></span></span></span>
<span id="A4.F16.pic1.2.8" class="ltx_p" style="width:453.1pt;"><span id="A4.F16.pic1.2.8.1" class="ltx_text ltx_verbatim ltx_font_typewriter ltx_inline-block" style="width:453.1pt;--ltx-fg-color:#000000;"><span id="A4.F16.pic1.2.8.1.1" class="ltx_inline-logical-block ltx_parbox ltx_align_top" style="width:453.1pt;">
<span id="A4.F16.pic1.p8" class="ltx_para ltx_noindent">
<span id="A4.F16.pic1.p8.1" class="ltx_p">- Each criterion must have an unambiguous yes/no answer</span>
</span></span></span></span>
<span id="A4.F16.pic1.2.9" class="ltx_p" style="width:453.1pt;"><span id="A4.F16.pic1.2.9.1" class="ltx_text ltx_verbatim ltx_font_typewriter ltx_inline-block" style="width:453.1pt;--ltx-fg-color:#000000;"><span id="A4.F16.pic1.2.9.1.1" class="ltx_inline-logical-block ltx_parbox ltx_align_top" style="width:453.1pt;">
<span id="A4.F16.pic1.p9" class="ltx_para ltx_noindent">
<span id="A4.F16.pic1.p9.1" class="ltx_p">- NO generic, vague, compound, or trivially true criteria</span>
</span></span></span></span>
<span id="A4.F16.pic1.2.10" class="ltx_p" style="width:453.1pt;"><span id="A4.F16.pic1.2.10.1" class="ltx_text ltx_verbatim ltx_font_typewriter ltx_inline-block" style="width:453.1pt;--ltx-fg-color:#000000;"><span id="A4.F16.pic1.2.10.1.1" class="ltx_inline-logical-block ltx_parbox ltx_align_top" style="width:453.1pt;">
<span id="A4.F16.pic1.p10" class="ltx_para ltx_noindent">
<span id="A4.F16.pic1.p10.1" class="ltx_p">- The criteria should help distinguish a high-quality response from a low-quality one</span>
</span></span></span></span>
<span id="A4.F16.pic1.2.11" class="ltx_p" style="width:453.1pt;"><span id="A4.F16.pic1.2.11.1" class="ltx_text ltx_verbatim ltx_font_typewriter ltx_inline-block" style="width:453.1pt;--ltx-fg-color:#000000;"><span id="A4.F16.pic1.2.11.1.1" class="ltx_inline-logical-block ltx_parbox ltx_align_top" style="width:453.1pt;">
<span id="A4.F16.pic1.p11" class="ltx_para ltx_noindent">
<span id="A4.F16.pic1.p11.1" class="ltx_p">- Target: No more than 10 criteria</span>
</span></span></span></span>
<span id="A4.F16.pic1.2.12" class="ltx_p" style="width:453.1pt;"><span id="A4.F16.pic1.2.12.1" class="ltx_text ltx_verbatim ltx_font_typewriter ltx_inline-block" style="width:453.1pt;--ltx-fg-color:#000000;"><span id="A4.F16.pic1.2.12.1.1" class="ltx_inline-logical-block ltx_parbox ltx_pruned_first ltx_align_top" style="width:453.1pt;"></span></span></span>
<span id="A4.F16.pic1.2.13" class="ltx_p" style="width:453.1pt;"><span id="A4.F16.pic1.2.13.1" class="ltx_text ltx_verbatim ltx_font_typewriter ltx_inline-block" style="width:453.1pt;--ltx-fg-color:#000000;"><span id="A4.F16.pic1.2.13.1.1" class="ltx_inline-logical-block ltx_parbox ltx_align_top" style="width:453.1pt;">
<span id="A4.F16.pic1.p13" class="ltx_para ltx_noindent">
<span id="A4.F16.pic1.p13.1" class="ltx_p">**Weight Assignment:**</span>
</span></span></span></span>
<span id="A4.F16.pic1.2.14" class="ltx_p" style="width:453.1pt;"><span id="A4.F16.pic1.2.14.1" class="ltx_text ltx_verbatim ltx_font_typewriter ltx_inline-block" style="width:453.1pt;--ltx-fg-color:#000000;"><span id="A4.F16.pic1.2.14.1.1" class="ltx_inline-logical-block ltx_parbox ltx_align_top" style="width:453.1pt;">
<span id="A4.F16.pic1.p14" class="ltx_para ltx_noindent">
<span id="A4.F16.pic1.p14.1" class="ltx_p">- **3**: Core requirement; failure = response is useless or wrong</span>
</span></span></span></span>
<span id="A4.F16.pic1.2.15" class="ltx_p" style="width:453.1pt;"><span id="A4.F16.pic1.2.15.1" class="ltx_text ltx_verbatim ltx_font_typewriter ltx_inline-block" style="width:453.1pt;--ltx-fg-color:#000000;"><span id="A4.F16.pic1.2.15.1.1" class="ltx_inline-logical-block ltx_parbox ltx_align_top" style="width:453.1pt;">
<span id="A4.F16.pic1.p15" class="ltx_para ltx_noindent">
<span id="A4.F16.pic1.p15.1" class="ltx_p">- **2**: Significant quality aspect with clear impact</span>
</span></span></span></span>
<span id="A4.F16.pic1.2.16" class="ltx_p" style="width:453.1pt;"><span id="A4.F16.pic1.2.16.1" class="ltx_text ltx_verbatim ltx_font_typewriter ltx_inline-block" style="width:453.1pt;--ltx-fg-color:#000000;"><span id="A4.F16.pic1.2.16.1.1" class="ltx_inline-logical-block ltx_parbox ltx_align_top" style="width:453.1pt;">
<span id="A4.F16.pic1.p16" class="ltx_para ltx_noindent">
<span id="A4.F16.pic1.p16.1" class="ltx_p">- **1**: Nice-to-have improvement or polish item</span>
</span></span></span></span>
<span id="A4.F16.pic1.2.17" class="ltx_p" style="width:453.1pt;"><span id="A4.F16.pic1.2.17.1" class="ltx_text ltx_verbatim ltx_font_typewriter ltx_inline-block" style="width:453.1pt;--ltx-fg-color:#000000;"><span id="A4.F16.pic1.2.17.1.1" class="ltx_inline-logical-block ltx_parbox ltx_pruned_first ltx_align_top" style="width:453.1pt;"></span></span></span>
<span id="A4.F16.pic1.2.18" class="ltx_p" style="width:453.1pt;"><span id="A4.F16.pic1.2.18.1" class="ltx_text ltx_verbatim ltx_font_typewriter ltx_inline-block" style="width:453.1pt;--ltx-fg-color:#000000;"><span id="A4.F16.pic1.2.18.1.1" class="ltx_inline-logical-block ltx_parbox ltx_align_top" style="width:453.1pt;">
<span id="A4.F16.pic1.p18" class="ltx_para ltx_noindent">
<span id="A4.F16.pic1.p18.1" class="ltx_p">---</span>
</span></span></span></span>
<span id="A4.F16.pic1.2.19" class="ltx_p" style="width:453.1pt;"><span id="A4.F16.pic1.2.19.1" class="ltx_text ltx_verbatim ltx_font_typewriter ltx_inline-block" style="width:453.1pt;--ltx-fg-color:#000000;"><span id="A4.F16.pic1.2.19.1.1" class="ltx_inline-logical-block ltx_parbox ltx_align_top" style="width:453.1pt;">
<span id="A4.F16.pic1.p19" class="ltx_para ltx_noindent">
<span id="A4.F16.pic1.p19.1" class="ltx_p">**USER QUERY:**</span>
</span></span></span></span>
<span id="A4.F16.pic1.2.20" class="ltx_p" style="width:453.1pt;"><span id="A4.F16.pic1.2.20.1" class="ltx_text ltx_verbatim ltx_font_typewriter ltx_inline-block" style="width:453.1pt;--ltx-fg-color:#000000;"><span id="A4.F16.pic1.2.20.1.1" class="ltx_inline-logical-block ltx_parbox ltx_align_top" style="width:453.1pt;">
<span id="A4.F16.pic1.p20" class="ltx_para ltx_noindent">
<span id="A4.F16.pic1.p20.1" class="ltx_p">{query}</span>
</span></span></span></span>
<span id="A4.F16.pic1.2.21" class="ltx_p" style="width:453.1pt;"><span id="A4.F16.pic1.2.21.1" class="ltx_text ltx_verbatim ltx_font_typewriter ltx_inline-block" style="width:453.1pt;--ltx-fg-color:#000000;"><span id="A4.F16.pic1.2.21.1.1" class="ltx_inline-logical-block ltx_parbox ltx_pruned_first ltx_align_top" style="width:453.1pt;"></span></span></span>
<span id="A4.F16.pic1.2.22" class="ltx_p" style="width:453.1pt;"><span id="A4.F16.pic1.2.22.1" class="ltx_text ltx_verbatim ltx_font_typewriter ltx_inline-block" style="width:453.1pt;--ltx-fg-color:#000000;"><span id="A4.F16.pic1.2.22.1.1" class="ltx_inline-logical-block ltx_parbox ltx_align_top" style="width:453.1pt;">
<span id="A4.F16.pic1.p22" class="ltx_para ltx_noindent">
<span id="A4.F16.pic1.p22.1" class="ltx_p">**SAMPLE RESPONSE (for reference only):**</span>
</span></span></span></span>
<span id="A4.F16.pic1.2.23" class="ltx_p" style="width:453.1pt;"><span id="A4.F16.pic1.2.23.1" class="ltx_text ltx_verbatim ltx_font_typewriter ltx_inline-block" style="width:453.1pt;--ltx-fg-color:#000000;"><span id="A4.F16.pic1.2.23.1.1" class="ltx_inline-logical-block ltx_parbox ltx_align_top" style="width:453.1pt;">
<span id="A4.F16.pic1.p23" class="ltx_para ltx_noindent">
<span id="A4.F16.pic1.p23.1" class="ltx_p">{response}</span>
</span></span></span></span>
<span id="A4.F16.pic1.2.24" class="ltx_p" style="width:453.1pt;"><span id="A4.F16.pic1.2.24.1" class="ltx_text ltx_verbatim ltx_font_typewriter ltx_inline-block" style="width:453.1pt;--ltx-fg-color:#000000;"><span id="A4.F16.pic1.2.24.1.1" class="ltx_inline-logical-block ltx_parbox ltx_pruned_first ltx_align_top" style="width:453.1pt;"></span></span></span>
<span id="A4.F16.pic1.2.25" class="ltx_p" style="width:453.1pt;"><span id="A4.F16.pic1.2.25.1" class="ltx_text ltx_verbatim ltx_font_typewriter ltx_inline-block" style="width:453.1pt;--ltx-fg-color:#000000;"><span id="A4.F16.pic1.2.25.1.1" class="ltx_inline-logical-block ltx_parbox ltx_align_top" style="width:453.1pt;">
<span id="A4.F16.pic1.p25" class="ltx_para ltx_noindent">
<span id="A4.F16.pic1.p25.1" class="ltx_p">---</span>
</span></span></span></span>
<span id="A4.F16.pic1.2.26" class="ltx_p" style="width:453.1pt;"><span id="A4.F16.pic1.2.26.1" class="ltx_text ltx_verbatim ltx_font_typewriter ltx_inline-block" style="width:453.1pt;--ltx-fg-color:#000000;"><span id="A4.F16.pic1.2.26.1.1" class="ltx_inline-logical-block ltx_parbox ltx_align_top" style="width:453.1pt;">
<span id="A4.F16.pic1.p26" class="ltx_para ltx_noindent">
<span id="A4.F16.pic1.p26.1" class="ltx_p">**OUTPUT:** Return ONLY a valid JSON array. No explanatory text before or after.</span>
</span></span></span></span>
<span id="A4.F16.pic1.2.27" class="ltx_p" style="width:453.1pt;"><span id="A4.F16.pic1.2.27.1" class="ltx_text ltx_verbatim ltx_font_typewriter ltx_inline-block" style="width:453.1pt;--ltx-fg-color:#000000;"><span id="A4.F16.pic1.2.27.1.1" class="ltx_inline-logical-block ltx_parbox ltx_align_top" style="width:453.1pt;">
<span id="A4.F16.pic1.p27" class="ltx_para ltx_noindent">
<span id="A4.F16.pic1.p27.1" class="ltx_p">Each element: {{&quot;criterion&quot;: &quot;Does the response ...?&quot;, &quot;weight&quot;: 1-3}}.</span>
</span></span></span></span>
<span id="A4.F16.pic1.2.28" class="ltx_p" style="width:453.1pt;"><span id="A4.F16.pic1.2.28.1" class="ltx_text ltx_verbatim ltx_font_typewriter ltx_inline-block" style="width:453.1pt;--ltx-fg-color:#000000;"><span id="A4.F16.pic1.2.28.1.1" class="ltx_inline-logical-block ltx_parbox ltx_pruned_first ltx_align_top" style="width:453.1pt;"></span></span></span>
