<svg id="S15.SS0.SSS0.Px7.p2.pic1" class="ltx_picture" height="479.42" overflow="visible" version="1.1" viewbox="0 0 477.38 479.42" width="477.38"><g style="--ltx-stroke-color:#000000;--ltx-fill-color:#000000;" fill="#000000" stroke="#000000" stroke-width="0.4pt" transform="translate(0,479.42) matrix(1 0 0 -1 0 0)"><g style="--ltx-fill-color:#BF0000;" fill="#BF0000" fill-opacity="1.0"><path style="stroke:none" d="M 0 5.91 L 0 473.51 C 0 476.77 2.64 479.42 5.91 479.42 L 471.47 479.42 C 474.73 479.42 477.38 476.77 477.38 473.51 L 477.38 5.91 C 477.38 2.64 474.73 0 471.47 0 L 5.91 0 C 2.64 0 0 2.64 0 5.91 Z" /></g><g style="--ltx-fill-color:#FFF2F2;" fill="#FFF2F2" fill-opacity="1.0"><path style="stroke:none" d="M 1.97 5.91 L 1.97 453.77 L 475.41 453.77 L 475.41 5.91 C 475.41 3.73 473.65 1.97 471.47 1.97 L 5.91 1.97 C 3.73 1.97 1.97 3.73 1.97 5.91 Z" /></g><g fill-opacity="1.0" transform="matrix(1.0 0.0 0.0 1.0 21.65 463.13)"><foreignobject style="--ltx-fo-width:31.37em;--ltx-fo-height:0.75em;--ltx-fo-depth:0.25em;font-size:10pt;" height="13.84" overflow="visible" transform="matrix(1 0 0 -1 0 10.38)" width="434.07"><span class="ltx_foreignobject_container"><span class="ltx_foreignobject_content">
<span id="S15.SS0.SSS0.Px7.p2.pic1.1" class="ltx_inline-block ltx_minipage ltx_align_bottom" style="width:31.37em;">
<span id="S15.SS0.SSS0.Px7.p2.pic1.1.1" class="ltx_p"><a href="https://codeforces.com/problemset/problem/2042/D" title class="ltx_ref ltx_href" style="--ltx-fg-color:#FFFFFF;">Example Data Structures Problem (Rated 1900)</a></span>
</span></span></span></foreignobject></g><g fill-opacity="1.0" transform="matrix(1.0 0.0 0.0 1.0 21.65 17.24)"><foreignobject style="--ltx-fo-width:31.37em;--ltx-fo-height:30.69em;--ltx-fo-depth:0.25em;font-size:10pt;" height="428.18" overflow="visible" transform="matrix(1 0 0 -1 0 424.72)" width="434.07"><span class="ltx_foreignobject_container"><span class="ltx_foreignobject_content">
<span id="S15.SS0.SSS0.Px7.p2.pic1.2" class="ltx_inline-block ltx_minipage ltx_align_bottom" style="width:31.37em;">
<span id="S15.SS0.SSS0.Px7.p2.pic1.2.1" class="ltx_p"><span id="S15.SS0.SSS0.Px7.p2.pic1.2.1.1" class="ltx_text" style="--ltx-fg-color:#000000;">Suppose you are working in some audio streaming service. The service has <math id="S15.SS0.SSS0.Px7.p2.pic1.m1" class="ltx_Math" alttext="n" display="inline" intent=":literal"><semantics><mi style="--ltx-fg-color:#000000;" mathcolor="#000000">n</mi><annotation encoding="application/x-tex">n</annotation></semantics></math> active users and <math id="S15.SS0.SSS0.Px7.p2.pic1.m2" class="ltx_Math" alttext="10^{9}" display="inline" intent=":literal"><semantics><msup><mn style="--ltx-fg-color:#000000;" mathcolor="#000000">10</mn><mn style="--ltx-fg-color:#000000;" mathcolor="#000000">9</mn></msup><annotation encoding="application/x-tex">10^{9}</annotation></semantics></math> tracks users can listen to. Users can like tracks and, based on likes, the service should recommend them new tracks. Tracks are numbered from <math id="S15.SS0.SSS0.Px7.p2.pic1.m3" class="ltx_Math" alttext="1" display="inline" intent=":literal"><semantics><mn style="--ltx-fg-color:#000000;" mathcolor="#000000">1</mn><annotation encoding="application/x-tex">1</annotation></semantics></math> to <math id="S15.SS0.SSS0.Px7.p2.pic1.m4" class="ltx_Math" alttext="10^{9}" display="inline" intent=":literal"><semantics><msup><mn style="--ltx-fg-color:#000000;" mathcolor="#000000">10</mn><mn style="--ltx-fg-color:#000000;" mathcolor="#000000">9</mn></msup><annotation encoding="application/x-tex">10^{9}</annotation></semantics></math>. It turned out that tracks the <math id="S15.SS0.SSS0.Px7.p2.pic1.m5" class="ltx_Math" alttext="i" display="inline" intent=":literal"><semantics><mi style="--ltx-fg-color:#000000;" mathcolor="#000000">i</mi><annotation encoding="application/x-tex">i</annotation></semantics></math>-th user likes form a segment <math id="S15.SS0.SSS0.Px7.p2.pic1.m6" class="ltx_Math" alttext="[l_{i},r_{i}]" display="inline" intent=":literal"><semantics><mrow><mo style="--ltx-fg-color:#000000;" mathcolor="#000000" stretchy="false">[</mo><msub><mi style="--ltx-fg-color:#000000;" mathcolor="#000000">l</mi><mi style="--ltx-fg-color:#000000;" mathcolor="#000000">i</mi></msub><mo style="--ltx-fg-color:#000000;" mathcolor="#000000">,</mo><msub><mi style="--ltx-fg-color:#000000;" mathcolor="#000000">r</mi><mi style="--ltx-fg-color:#000000;" mathcolor="#000000">i</mi></msub><mo style="--ltx-fg-color:#000000;" mathcolor="#000000" stretchy="false">]</mo></mrow><annotation encoding="application/x-tex">[l_{i},r_{i}]</annotation></semantics></math>.

<br class="ltx_break">
<br class="ltx_break">Let’s say that the user <math id="S15.SS0.SSS0.Px7.p2.pic1.m7" class="ltx_Math" alttext="j" display="inline" intent=":literal"><semantics><mi style="--ltx-fg-color:#000000;" mathcolor="#000000">j</mi><annotation encoding="application/x-tex">j</annotation></semantics></math> is a <span id="S15.SS0.SSS0.Px7.p2.pic1.2.1.1.1" class="ltx_text ltx_font_italic">predictor</span> for user <math id="S15.SS0.SSS0.Px7.p2.pic1.m8" class="ltx_Math" alttext="i\ (j\neq i)" display="inline" intent=":literal"><semantics><mrow><mi style="--ltx-fg-color:#000000;" mathcolor="#000000">i</mi><mo lspace="0.500em">⁡</mo><mrow><mo style="--ltx-fg-color:#000000;" mathcolor="#000000" stretchy="false">(</mo><mrow><mi style="--ltx-fg-color:#000000;" mathcolor="#000000">j</mi><mo style="--ltx-fg-color:#000000;" mathcolor="#000000">≠</mo><mi style="--ltx-fg-color:#000000;" mathcolor="#000000">i</mi></mrow><mo style="--ltx-fg-color:#000000;" mathcolor="#000000" stretchy="false">)</mo></mrow></mrow><annotation encoding="application/x-tex">i\ (j\neq i)</annotation></semantics></math> if user <math id="S15.SS0.SSS0.Px7.p2.pic1.m9" class="ltx_Math" alttext="j" display="inline" intent=":literal"><semantics><mi style="--ltx-fg-color:#000000;" mathcolor="#000000">j</mi><annotation encoding="application/x-tex">j</annotation></semantics></math> likes all tracks the <math id="S15.SS0.SSS0.Px7.p2.pic1.m10" class="ltx_Math" alttext="i" display="inline" intent=":literal"><semantics><mi style="--ltx-fg-color:#000000;" mathcolor="#000000">i</mi><annotation encoding="application/x-tex">i</annotation></semantics></math>-th user likes (and, possibly, some other tracks too). Also, let’s say that a track is <span id="S15.SS0.SSS0.Px7.p2.pic1.2.1.1.2" class="ltx_text ltx_font_italic">strongly recommended</span> for user <math id="S15.SS0.SSS0.Px7.p2.pic1.m11" class="ltx_Math" alttext="i" display="inline" intent=":literal"><semantics><mi style="--ltx-fg-color:#000000;" mathcolor="#000000">i</mi><annotation encoding="application/x-tex">i</annotation></semantics></math> if the track is not liked by the <math id="S15.SS0.SSS0.Px7.p2.pic1.m12" class="ltx_Math" alttext="i" display="inline" intent=":literal"><semantics><mi style="--ltx-fg-color:#000000;" mathcolor="#000000">i</mi><annotation encoding="application/x-tex">i</annotation></semantics></math>-th user yet, but it is liked by <span id="S15.SS0.SSS0.Px7.p2.pic1.2.1.1.3" class="ltx_text ltx_font_bold">every</span> predictor for the <math id="S15.SS0.SSS0.Px7.p2.pic1.m13" class="ltx_Math" alttext="i" display="inline" intent=":literal"><semantics><mi style="--ltx-fg-color:#000000;" mathcolor="#000000">i</mi><annotation encoding="application/x-tex">i</annotation></semantics></math>-th user.

<br class="ltx_break">
<br class="ltx_break">Calculate the number of strongly recommended tracks for each user <math id="S15.SS0.SSS0.Px7.p2.pic1.m14" class="ltx_Math" alttext="i" display="inline" intent=":literal"><semantics><mi style="--ltx-fg-color:#000000;" mathcolor="#000000">i</mi><annotation encoding="application/x-tex">i</annotation></semantics></math>. If user doesn’t have any predictors, then print <math id="S15.SS0.SSS0.Px7.p2.pic1.m15" class="ltx_Math" alttext="0" display="inline" intent=":literal"><semantics><mn style="--ltx-fg-color:#000000;" mathcolor="#000000">0</mn><annotation encoding="application/x-tex">0</annotation></semantics></math> for that user.

<br class="ltx_break">
<br class="ltx_break"><span id="S15.SS0.SSS0.Px7.p2.pic1.2.1.1.4" class="ltx_text ltx_font_bold">Input</span> 
<br class="ltx_break">The first line contains one integer <math id="S15.SS0.SSS0.Px7.p2.pic1.m16" class="ltx_Math" alttext="t\ (1\leq t\leq 10^{4})" display="inline" intent=":literal"><semantics><mrow><mi style="--ltx-fg-color:#000000;" mathcolor="#000000">t</mi><mo lspace="0.500em">⁡</mo><mrow><mo style="--ltx-fg-color:#000000;" mathcolor="#000000" stretchy="false">(</mo><mrow><mn style="--ltx-fg-color:#000000;" mathcolor="#000000">1</mn><mo style="--ltx-fg-color:#000000;" mathcolor="#000000">≤</mo><mi style="--ltx-fg-color:#000000;" mathcolor="#000000">t</mi><mo style="--ltx-fg-color:#000000;" mathcolor="#000000">≤</mo><msup><mn style="--ltx-fg-color:#000000;" mathcolor="#000000">10</mn><mn style="--ltx-fg-color:#000000;" mathcolor="#000000">4</mn></msup></mrow><mo style="--ltx-fg-color:#000000;" mathcolor="#000000" stretchy="false">)</mo></mrow></mrow><annotation encoding="application/x-tex">t\ (1\leq t\leq 10^{4})</annotation></semantics></math>—the number of test cases. Next, <math id="S15.SS0.SSS0.Px7.p2.pic1.m17" class="ltx_Math" alttext="t" display="inline" intent=":literal"><semantics><mi style="--ltx-fg-color:#000000;" mathcolor="#000000">t</mi><annotation encoding="application/x-tex">t</annotation></semantics></math> cases follow.

<br class="ltx_break">
<br class="ltx_break">The first line of each test case contains one integer <math id="S15.SS0.SSS0.Px7.p2.pic1.m18" class="ltx_Math" alttext="n\ (1\leq n\leq 2\cdot 10^{5})" display="inline" intent=":literal"><semantics><mrow><mi style="--ltx-fg-color:#000000;" mathcolor="#000000">n</mi><mo lspace="0.500em">⁡</mo><mrow><mo style="--ltx-fg-color:#000000;" mathcolor="#000000" stretchy="false">(</mo><mrow><mn style="--ltx-fg-color:#000000;" mathcolor="#000000">1</mn><mo style="--ltx-fg-color:#000000;" mathcolor="#000000">≤</mo><mi style="--ltx-fg-color:#000000;" mathcolor="#000000">n</mi><mo style="--ltx-fg-color:#000000;" mathcolor="#000000">≤</mo><mrow><mn style="--ltx-fg-color:#000000;" mathcolor="#000000">2</mn><mo style="--ltx-fg-color:#000000;" lspace="0.222em" mathcolor="#000000" rspace="0.222em">⋅</mo><msup><mn style="--ltx-fg-color:#000000;" mathcolor="#000000">10</mn><mn style="--ltx-fg-color:#000000;" mathcolor="#000000">5</mn></msup></mrow></mrow><mo style="--ltx-fg-color:#000000;" mathcolor="#000000" stretchy="false">)</mo></mrow></mrow><annotation encoding="application/x-tex">n\ (1\leq n\leq 2\cdot 10^{5})</annotation></semantics></math>—the number of users.

<br class="ltx_break">
<br class="ltx_break">The next <math id="S15.SS0.SSS0.Px7.p2.pic1.m19" class="ltx_Math" alttext="n" display="inline" intent=":literal"><semantics><mi style="--ltx-fg-color:#000000;" mathcolor="#000000">n</mi><annotation encoding="application/x-tex">n</annotation></semantics></math> lines contain two integers <math id="S15.SS0.SSS0.Px7.p2.pic1.m20" class="ltx_Math" alttext="l_{i}" display="inline" intent=":literal"><semantics><msub><mi style="--ltx-fg-color:#000000;" mathcolor="#000000">l</mi><mi style="--ltx-fg-color:#000000;" mathcolor="#000000">i</mi></msub><annotation encoding="application/x-tex">l_{i}</annotation></semantics></math> and <math id="S15.SS0.SSS0.Px7.p2.pic1.m21" class="ltx_Math" alttext="r_{i}" display="inline" intent=":literal"><semantics><msub><mi style="--ltx-fg-color:#000000;" mathcolor="#000000">r</mi><mi style="--ltx-fg-color:#000000;" mathcolor="#000000">i</mi></msub><annotation encoding="application/x-tex">r_{i}</annotation></semantics></math> per line <math id="S15.SS0.SSS0.Px7.p2.pic1.m22" class="ltx_Math" alttext="(1\leq l_{i}\leq r_{i}\leq 10^{9})" display="inline" intent=":literal"><semantics><mrow><mo style="--ltx-fg-color:#000000;" mathcolor="#000000" stretchy="false">(</mo><mrow><mn style="--ltx-fg-color:#000000;" mathcolor="#000000">1</mn><mo style="--ltx-fg-color:#000000;" mathcolor="#000000">≤</mo><msub><mi style="--ltx-fg-color:#000000;" mathcolor="#000000">l</mi><mi style="--ltx-fg-color:#000000;" mathcolor="#000000">i</mi></msub><mo style="--ltx-fg-color:#000000;" mathcolor="#000000">≤</mo><msub><mi style="--ltx-fg-color:#000000;" mathcolor="#000000">r</mi><mi style="--ltx-fg-color:#000000;" mathcolor="#000000">i</mi></msub><mo style="--ltx-fg-color:#000000;" mathcolor="#000000">≤</mo><msup><mn style="--ltx-fg-color:#000000;" mathcolor="#000000">10</mn><mn style="--ltx-fg-color:#000000;" mathcolor="#000000">9</mn></msup></mrow><mo style="--ltx-fg-color:#000000;" mathcolor="#000000" stretchy="false">)</mo></mrow><annotation encoding="application/x-tex">(1\leq l_{i}\leq r_{i}\leq 10^{9})</annotation></semantics></math>—the segment of tracks the <math id="S15.SS0.SSS0.Px7.p2.pic1.m23" class="ltx_Math" alttext="i" display="inline" intent=":literal"><semantics><mi style="--ltx-fg-color:#000000;" mathcolor="#000000">i</mi><annotation encoding="application/x-tex">i</annotation></semantics></math>-th user likes.

<br class="ltx_break">
<br class="ltx_break"><span id="S15.SS0.SSS0.Px7.p2.pic1.2.1.1.5" class="ltx_text ltx_font_bold">Output</span> 
<br class="ltx_break">For each test case, print <math id="S15.SS0.SSS0.Px7.p2.pic1.m24" class="ltx_Math" alttext="n" display="inline" intent=":literal"><semantics><mi style="--ltx-fg-color:#000000;" mathcolor="#000000">n</mi><annotation encoding="application/x-tex">n</annotation></semantics></math> integers, where the <math id="S15.SS0.SSS0.Px7.p2.pic1.m25" class="ltx_Math" alttext="i" display="inline" intent=":literal"><semantics><mi style="--ltx-fg-color:#000000;" mathcolor="#000000">i</mi><annotation encoding="application/x-tex">i</annotation></semantics></math>-th integer is the number of strongly recommended tracks for the <math id="S15.SS0.SSS0.Px7.p2.pic1.m26" class="ltx_Math" alttext="i" display="inline" intent=":literal"><semantics><mi style="--ltx-fg-color:#000000;" mathcolor="#000000">i</mi><annotation encoding="application/x-tex">i</annotation></semantics></math>-th user (or <math id="S15.SS0.SSS0.Px7.p2.pic1.m27" class="ltx_Math" alttext="0" display="inline" intent=":literal"><semantics><mn style="--ltx-fg-color:#000000;" mathcolor="#000000">0</mn><annotation encoding="application/x-tex">0</annotation></semantics></math>, if that user doesn’t have any predictors).</span></span>
</span></span></span></foreignobject></g></g></svg>