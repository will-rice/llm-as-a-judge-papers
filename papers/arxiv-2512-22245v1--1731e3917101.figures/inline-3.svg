<svg id="A1.SS11.p3.pic1" class="ltx_picture" height="660.53" overflow="visible" version="1.1" viewbox="0 0 653.15 660.53" width="653.15"><g style="--ltx-stroke-color:#000000;--ltx-fill-color:#000000;" fill="#000000" stroke="#000000" stroke-width="0.4pt" transform="translate(0,660.53) matrix(1 0 0 -1 0 0)"><g style="--ltx-fill-color:#595959;" fill="#595959" fill-opacity="1.0"><path style="stroke:none" d="M 0 5.91 L 0 654.62 C 0 657.88 2.64 660.53 5.91 660.53 L 647.24 660.53 C 650.51 660.53 653.15 657.88 653.15 654.62 L 653.15 5.91 C 653.15 2.64 650.51 0 647.24 0 L 5.91 0 C 2.64 0 0 2.64 0 5.91 Z" /></g><g style="--ltx-fill-color:#F9F9F9;" fill="#F9F9F9" fill-opacity="1.0"><path style="stroke:none" d="M 1.97 5.91 L 1.97 636.42 L 651.18 636.42 L 651.18 5.91 C 651.18 3.73 649.42 1.97 647.24 1.97 L 5.91 1.97 C 3.73 1.97 1.97 3.73 1.97 5.91 Z" /></g><g fill-opacity="1.0" transform="matrix(1.0 0.0 0.0 1.0 21.65 645.01)"><foreignobject style="--ltx-fo-width:44.07em;--ltx-fo-height:0.69em;--ltx-fo-depth:0.19em;font-size:10pt;" height="12.3" overflow="visible" transform="matrix(1 0 0 -1 0 9.61)" width="609.8"><span class="ltx_foreignobject_container"><span class="ltx_foreignobject_content">
<span id="A1.SS11.p3.pic1.1" class="ltx_inline-block ltx_minipage ltx_align_bottom" style="width:44.07em;">
<span id="A1.SS11.p3.pic1.1.1" class="ltx_p"><span id="A1.SS11.p3.pic1.1.1.1" class="ltx_text" style="--ltx-fg-color:#FFFFFF;">Pairwise Judge with Likert Score – LM Arena Hard Prompt</span></span>
</span></span></span></foreignobject></g><g fill-opacity="1.0" transform="matrix(1.0 0.0 0.0 1.0 21.65 17.24)"><foreignobject style="--ltx-fo-width:44.07em;--ltx-fo-height:43.89em;--ltx-fo-depth:0.25em;font-size:10pt;" height="610.83" overflow="visible" transform="matrix(1 0 0 -1 0 607.37)" width="609.8"><span class="ltx_foreignobject_container"><span class="ltx_foreignobject_content">
<span id="A1.SS11.p3.pic1.2" class="ltx_inline-block ltx_minipage ltx_align_bottom" style="width:44.07em;">
<span id="A1.SS11.p3.pic1.2.1" class="ltx_p"><span id="A1.SS11.p3.pic1.2.1.1" class="ltx_text" style="--ltx-fg-color:#000000;">Please act as an impartial judge and evaluate the quality of the responses provided by two AI assistants to the user prompt displayed below. You will be given Assistant A’s answer and Assistant B’s answer. Your job is to evaluate which assistant’s answer is better.</span></span>
<span id="A1.SS11.p3.pic1.2.2" class="ltx_p"><span id="A1.SS11.p3.pic1.2.2.1" class="ltx_text" style="--ltx-fg-color:#000000;">Begin your evaluation by generating your own answer to the prompt. You must provide your answers before judging any answers.</span></span>
<span id="A1.SS11.p3.pic1.2.3" class="ltx_p"><span id="A1.SS11.p3.pic1.2.3.1" class="ltx_text" style="--ltx-fg-color:#000000;">When evaluating the assistants’ answers, compare both assistants’ answers with your answer. You must identify and correct any mistakes or inaccurate information.</span></span>
<span id="A1.SS11.p3.pic1.2.4" class="ltx_p"><span id="A1.SS11.p3.pic1.2.4.1" class="ltx_text" style="--ltx-fg-color:#000000;">Then consider if the assistants’ answers are helpful, relevant, and concise. Helpful means the answer correctly responds to the prompt or follows the instructions. Note that when a user prompt has any ambiguity or more than one interpretation, it is more helpful and appropriate to ask for clarifications or more information from the user than providing an answer based on assumptions. Relevant means all parts of the response closely connect or are appropriate to what is being asked. Concise means the response is clear and not verbose or excessive.</span></span>
<span id="A1.SS11.p3.pic1.2.5" class="ltx_p"><span id="A1.SS11.p3.pic1.2.5.1" class="ltx_text" style="--ltx-fg-color:#000000;">Then consider the creativity and novelty of the assistants’ answers when needed. Finally, identify any missing important information in the assistants’ answers that would be beneficial to include when responding to the user prompt.</span></span>
<span id="A1.SS11.p3.pic1.2.6" class="ltx_p"><span id="A1.SS11.p3.pic1.2.6.1" class="ltx_text" style="--ltx-fg-color:#000000;">Verbalize any uncertainty in your thought process when you’re unsure of your conclusion.</span></span>
<span id="A1.SS11.p3.pic1.2.7" class="ltx_p"><span id="A1.SS11.p3.pic1.2.7.1" class="ltx_text" style="--ltx-fg-color:#000000;">If your verdict is not based on absolute certainty, be sure to articulate that hesitation in your analysis.</span></span>
<span id="A1.SS11.p3.pic1.2.8" class="ltx_p"><span id="A1.SS11.p3.pic1.2.8.1" class="ltx_text" style="--ltx-fg-color:#000000;">After providing your explanation, you must output only one of the following choices as your final verdict with a label:</span></span>
<span id="A1.SS11.p3.pic1.2.9" class="ltx_p"><span id="A1.SS11.p3.pic1.2.9.1" class="ltx_text" style="--ltx-fg-color:#000000;">1. Assistant A is significantly better: [[A&gt;&gt;B]] 
<br class="ltx_break">2. Assistant A is slightly better: [[A&gt;B]] 
<br class="ltx_break">3. Tie, relatively the same: [[A=B]] 
<br class="ltx_break">4. Assistant B is slightly better: [[B&gt;A]] 
<br class="ltx_break">5. Assistant B is significantly better: [[B&gt;&gt;A]]</span></span>
<span id="A1.SS11.p3.pic1.2.10" class="ltx_p"><span id="A1.SS11.p3.pic1.2.10.1" class="ltx_text" style="--ltx-fg-color:#000000;">Example output: “My final verdict is tie: [[A=B]].”</span></span>
<span id="A1.SS11.p3.pic1.2.11" class="ltx_p"><span id="A1.SS11.p3.pic1.2.11.1" class="ltx_text" style="--ltx-fg-color:#000000;">[User Question]</span></span>
<span id="A1.SS11.p3.pic1.2.12" class="ltx_p"><span id="A1.SS11.p3.pic1.2.12.1" class="ltx_text" style="--ltx-fg-color:#000000;">{input}</span></span>
<span id="A1.SS11.p3.pic1.2.13" class="ltx_p"><span id="A1.SS11.p3.pic1.2.13.1" class="ltx_text" style="--ltx-fg-color:#000000;">[The Start of Assistant A’s Answer]</span></span>
<span id="A1.SS11.p3.pic1.2.14" class="ltx_p"><span id="A1.SS11.p3.pic1.2.14.1" class="ltx_text" style="--ltx-fg-color:#000000;">{response_1}</span></span>
<span id="A1.SS11.p3.pic1.2.15" class="ltx_p"><span id="A1.SS11.p3.pic1.2.15.1" class="ltx_text" style="--ltx-fg-color:#000000;">[The End of Assistant A’s Answer]</span></span>
<span id="A1.SS11.p3.pic1.2.16" class="ltx_p"><span id="A1.SS11.p3.pic1.2.16.1" class="ltx_text" style="--ltx-fg-color:#000000;">[The Start of Assistant B’s Answer]</span></span>
<span id="A1.SS11.p3.pic1.2.17" class="ltx_p"><span id="A1.SS11.p3.pic1.2.17.1" class="ltx_text" style="--ltx-fg-color:#000000;">{response_2}</span></span>
<span id="A1.SS11.p3.pic1.2.18" class="ltx_p"><span id="A1.SS11.p3.pic1.2.18.1" class="ltx_text" style="--ltx-fg-color:#000000;">[The End of Assistant B’s Answer]</span></span>
</span></span></span></foreignobject></g></g></svg>