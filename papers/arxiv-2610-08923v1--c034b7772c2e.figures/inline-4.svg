<span id="A1.SS5.SSS1.p6.pic1.2" class="ltx_inline-block ltx_minipage ltx_align_bottom" style="width:37.46em;">
<span id="A1.SS5.SSS1.p6.pic1.2.1" class="ltx_p"><span id="A1.SS5.SSS1.p6.pic1.2.1.1" class="ltx_text ltx_font_bold" style="--ltx-fg-color:#000000;">Scope Relevance:<span id="A1.SS5.SSS1.p6.pic1.2.1.1.1" class="ltx_text ltx_font_medium"> Carefully consider Input Label, Identified Scopes, and Generated Description,
and ascertain if Generated Description adequately reflects and covers the list of scopes in Identified
Scopes.
<br class="ltx_break" style="--ltx-break-space:4.0pt;">
</span>Description Tone:<span id="A1.SS5.SSS1.p6.pic1.2.1.1.2" class="ltx_text ltx_font_medium"> Determine if the tone of Generated Description is imperative, and it can be
used as a guideline to determine whether a text input is in compliance or violation of Input Label
according to Generated Description.
<br class="ltx_break" style="--ltx-break-space:4.0pt;">
</span>Moderation Type:<span id="A1.SS5.SSS1.p6.pic1.2.1.1.3" class="ltx_text ltx_font_medium"> Determine if Generated Description fully respects Moderation Type. Concretely,
if Moderation Type is <span id="A1.SS5.SSS1.p6.pic1.2.1.1.3.1" class="ltx_text ltx_font_typewriter">input</span>, Generated Description must only target user inputs/queries to an AI
assistant for policy violations, not AI agent responses to user inputs, and vice versa if Moderation Type
is <span id="A1.SS5.SSS1.p6.pic1.2.1.1.3.2" class="ltx_text ltx_font_typewriter">output</span>.</span></span></span>
</span></span></span></foreignobject></g></g></svg>