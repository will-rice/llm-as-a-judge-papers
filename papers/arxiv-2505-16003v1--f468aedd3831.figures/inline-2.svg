<span id="A1.SS2.p1.pic1.2" class="ltx_inline-block ltx_minipage ltx_align_bottom" style="width:44.07em;">
<span id="A1.SS2.p1.pic1.2.1" class="ltx_p"><span id="A1.SS2.p1.pic1.2.1.1" class="ltx_text" style="--ltx-fg-color:#000000;">Imagine you are my personal assistant, generate a short briefing for me at the start of my day. In the briefing, summarize what I completed in the previous day and then give me a preview of the key activities for today. In this briefing, consider my goals for this week and tell me if my focused tasks and rituals are aligned with those goals. Carefully evaluate the associations between the tasks and goals and describe the tasks based on how related you think they are. Note that it is possible that a task is not directly associated with any goals. Reference the specific tasks mentioned in the context and generate this briefing in a single, naturally flowing narrative. Avoid simply listing out tasks one by one. Use a motivating and encouraging tone.</span></span>
</span></span></span></foreignobject></g></g></svg>