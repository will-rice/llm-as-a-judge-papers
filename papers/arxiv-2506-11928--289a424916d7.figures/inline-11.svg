<svg id="S15.SS0.SSS0.Px3.p2.pic1" class="ltx_picture" height="243.5" overflow="visible" version="1.1" viewbox="0 0 477.38 243.5" width="477.38"><g style="--ltx-stroke-color:#000000;--ltx-fill-color:#000000;" fill="#000000" stroke="#000000" stroke-width="0.4pt" transform="translate(0,243.5) matrix(1 0 0 -1 0 0)"><g style="--ltx-fill-color:#BF0000;" fill="#BF0000" fill-opacity="1.0"><path style="stroke:none" d="M 0 5.91 L 0 237.59 C 0 240.85 2.64 243.5 5.91 243.5 L 471.47 243.5 C 474.73 243.5 477.38 240.85 477.38 237.59 L 477.38 5.91 C 477.38 2.64 474.73 0 471.47 0 L 5.91 0 C 2.64 0 0 2.64 0 5.91 Z" /></g><g style="--ltx-fill-color:#FFF2F2;" fill="#FFF2F2" fill-opacity="1.0"><path style="stroke:none" d="M 1.97 5.91 L 1.97 217.85 L 475.41 217.85 L 475.41 5.91 C 475.41 3.73 473.65 1.97 471.47 1.97 L 5.91 1.97 C 3.73 1.97 1.97 3.73 1.97 5.91 Z" /></g><g fill-opacity="1.0" transform="matrix(1.0 0.0 0.0 1.0 21.65 227.21)"><foreignobject style="--ltx-fo-width:31.37em;--ltx-fo-height:0.75em;--ltx-fo-depth:0.25em;font-size:10pt;" height="13.84" overflow="visible" transform="matrix(1 0 0 -1 0 10.38)" width="434.07"><span class="ltx_foreignobject_container"><span class="ltx_foreignobject_content">
<span id="S15.SS0.SSS0.Px3.p2.pic1.1" class="ltx_inline-block ltx_minipage ltx_align_bottom" style="width:31.37em;">
<span id="S15.SS0.SSS0.Px3.p2.pic1.1.1" class="ltx_p"><a href="https://codeforces.com/problemset/problem/2043/B" title class="ltx_ref ltx_href" style="--ltx-fg-color:#FFFFFF;">Example Number Theory Problem (Rated 1100)</a></span>
</span></span></span></foreignobject></g><g fill-opacity="1.0" transform="matrix(1.0 0.0 0.0 1.0 21.65 13.78)"><foreignobject style="--ltx-fo-width:31.37em;--ltx-fo-height:13.89em;--ltx-fo-depth:0em;font-size:10pt;" height="192.26" overflow="visible" transform="matrix(1 0 0 -1 0 192.26)" width="434.07"><span class="ltx_foreignobject_container"><span class="ltx_foreignobject_content">
<span id="S15.SS0.SSS0.Px3.p2.pic1.2" class="ltx_inline-block ltx_minipage ltx_align_bottom" style="width:31.37em;">
<span id="S15.SS0.SSS0.Px3.p2.pic1.2.1" class="ltx_p"><span id="S15.SS0.SSS0.Px3.p2.pic1.2.1.1" class="ltx_text" style="--ltx-fg-color:#000000;">Artem wrote the digit <math id="S15.SS0.SSS0.Px3.p2.pic1.m1" class="ltx_Math" alttext="d" display="inline" intent=":literal"><semantics><mi style="--ltx-fg-color:#000000;" mathcolor="#000000">d</mi><annotation encoding="application/x-tex">d</annotation></semantics></math> on the board exactly <math id="S15.SS0.SSS0.Px3.p2.pic1.m2" class="ltx_Math" alttext="n!" display="inline" intent=":literal"><semantics><mrow><mi style="--ltx-fg-color:#000000;" mathcolor="#000000">n</mi><mo style="--ltx-fg-color:#000000;" mathcolor="#000000">!</mo></mrow><annotation encoding="application/x-tex">n!</annotation></semantics></math> times in a row. So, he got the number <math id="S15.SS0.SSS0.Px3.p2.pic1.m3" class="ltx_Math" alttext="dddddd\dots ddd" display="inline" intent=":literal"><semantics><mrow><mi style="--ltx-fg-color:#000000;" mathcolor="#000000">d</mi><mo lspace="0em" rspace="0em">​</mo><mi style="--ltx-fg-color:#000000;" mathcolor="#000000">d</mi><mo lspace="0em" rspace="0em">​</mo><mi style="--ltx-fg-color:#000000;" mathcolor="#000000">d</mi><mo lspace="0em" rspace="0em">​</mo><mi style="--ltx-fg-color:#000000;" mathcolor="#000000">d</mi><mo lspace="0em" rspace="0em">​</mo><mi style="--ltx-fg-color:#000000;" mathcolor="#000000">d</mi><mo lspace="0em" rspace="0em">​</mo><mi style="--ltx-fg-color:#000000;" mathcolor="#000000">d</mi><mo lspace="0em" rspace="0em">​</mo><mi style="--ltx-fg-color:#000000;" mathcolor="#000000" mathvariant="normal">…</mi><mo lspace="0em" rspace="0em">​</mo><mi style="--ltx-fg-color:#000000;" mathcolor="#000000">d</mi><mo lspace="0em" rspace="0em">​</mo><mi style="--ltx-fg-color:#000000;" mathcolor="#000000">d</mi><mo lspace="0em" rspace="0em">​</mo><mi style="--ltx-fg-color:#000000;" mathcolor="#000000">d</mi></mrow><annotation encoding="application/x-tex">dddddd\dots ddd</annotation></semantics></math> (exactly <math id="S15.SS0.SSS0.Px3.p2.pic1.m4" class="ltx_Math" alttext="n!" display="inline" intent=":literal"><semantics><mrow><mi style="--ltx-fg-color:#000000;" mathcolor="#000000">n</mi><mo style="--ltx-fg-color:#000000;" mathcolor="#000000">!</mo></mrow><annotation encoding="application/x-tex">n!</annotation></semantics></math> digits).

<br class="ltx_break">
<br class="ltx_break">Now he is curious about which odd digits from <math id="S15.SS0.SSS0.Px3.p2.pic1.m5" class="ltx_Math" alttext="1" display="inline" intent=":literal"><semantics><mn style="--ltx-fg-color:#000000;" mathcolor="#000000">1</mn><annotation encoding="application/x-tex">1</annotation></semantics></math> to <math id="S15.SS0.SSS0.Px3.p2.pic1.m6" class="ltx_Math" alttext="9" display="inline" intent=":literal"><semantics><mn style="--ltx-fg-color:#000000;" mathcolor="#000000">9</mn><annotation encoding="application/x-tex">9</annotation></semantics></math> divide the number written on the board.

<br class="ltx_break">
<br class="ltx_break"><span id="S15.SS0.SSS0.Px3.p2.pic1.2.1.1.1" class="ltx_text ltx_font_bold">Input</span> 
<br class="ltx_break">The first line contains a single integer <math id="S15.SS0.SSS0.Px3.p2.pic1.m7" class="ltx_Math" alttext="t\ (1\leq t\leq 100)" display="inline" intent=":literal"><semantics><mrow><mi style="--ltx-fg-color:#000000;" mathcolor="#000000">t</mi><mo lspace="0.500em">⁡</mo><mrow><mo style="--ltx-fg-color:#000000;" mathcolor="#000000" stretchy="false">(</mo><mrow><mn style="--ltx-fg-color:#000000;" mathcolor="#000000">1</mn><mo style="--ltx-fg-color:#000000;" mathcolor="#000000">≤</mo><mi style="--ltx-fg-color:#000000;" mathcolor="#000000">t</mi><mo style="--ltx-fg-color:#000000;" mathcolor="#000000">≤</mo><mn style="--ltx-fg-color:#000000;" mathcolor="#000000">100</mn></mrow><mo style="--ltx-fg-color:#000000;" mathcolor="#000000" stretchy="false">)</mo></mrow></mrow><annotation encoding="application/x-tex">t\ (1\leq t\leq 100)</annotation></semantics></math>—the number of test cases. The next <math id="S15.SS0.SSS0.Px3.p2.pic1.m8" class="ltx_Math" alttext="t" display="inline" intent=":literal"><semantics><mi style="--ltx-fg-color:#000000;" mathcolor="#000000">t</mi><annotation encoding="application/x-tex">t</annotation></semantics></math> test cases follow.

<br class="ltx_break">
<br class="ltx_break">Each test case consists of a single line containing two integers <math id="S15.SS0.SSS0.Px3.p2.pic1.m9" class="ltx_Math" alttext="n" display="inline" intent=":literal"><semantics><mi style="--ltx-fg-color:#000000;" mathcolor="#000000">n</mi><annotation encoding="application/x-tex">n</annotation></semantics></math> and <math id="S15.SS0.SSS0.Px3.p2.pic1.m10" class="ltx_math_unparsed" alttext="d\ (2\leq n\leq 10^{9},1\leq d\leq 9)" display="inline" intent=":literal"><semantics><mrow><mi style="--ltx-fg-color:#000000;" mathcolor="#000000">d</mi><mrow><mo style="--ltx-fg-color:#000000;" lspace="0.500em" mathcolor="#000000" stretchy="false">(</mo><mn style="--ltx-fg-color:#000000;" mathcolor="#000000">2</mn><mo style="--ltx-fg-color:#000000;" mathcolor="#000000">≤</mo><mi style="--ltx-fg-color:#000000;" mathcolor="#000000">n</mi><mo style="--ltx-fg-color:#000000;" mathcolor="#000000">≤</mo><msup><mn style="--ltx-fg-color:#000000;" mathcolor="#000000">10</mn><mn style="--ltx-fg-color:#000000;" mathcolor="#000000">9</mn></msup><mo style="--ltx-fg-color:#000000;" mathcolor="#000000">,</mo><mn style="--ltx-fg-color:#000000;" mathcolor="#000000">1</mn><mo style="--ltx-fg-color:#000000;" mathcolor="#000000">≤</mo><mi style="--ltx-fg-color:#000000;" mathcolor="#000000">d</mi><mo style="--ltx-fg-color:#000000;" mathcolor="#000000">≤</mo><mn style="--ltx-fg-color:#000000;" mathcolor="#000000">9</mn><mo style="--ltx-fg-color:#000000;" mathcolor="#000000" stretchy="false">)</mo></mrow></mrow><annotation encoding="application/x-tex">d\ (2\leq n\leq 10^{9},1\leq d\leq 9)</annotation></semantics></math>.

<br class="ltx_break">
<br class="ltx_break"><span id="S15.SS0.SSS0.Px3.p2.pic1.2.1.1.2" class="ltx_text ltx_font_bold">Output</span> 
<br class="ltx_break">For each test case, output the odd digits in ascending order that divide the number written on the board.</span></span>
</span></span></span></foreignobject></g></g></svg>