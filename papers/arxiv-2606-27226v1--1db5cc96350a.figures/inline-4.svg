<span id="A1.F5.pic3.p3" class="ltx_para">
<span id="A1.F5.pic3.p3.1" class="ltx_p"><span id="A1.F5.pic3.p3.1.1" class="ltx_text ltx_font_bold" style="font-size:90%;--ltx-fg-color:#000000;">Decomposed reasoning:<span id="A1.F5.pic3.p3.1.1.1" class="ltx_text ltx_font_medium"> 
</span><span id="A1.F5.pic3.p3.1.1.2" class="ltx_text" style="--ltx-fg-color:#C62828;">N</span><span id="A1.F5.pic3.p3.1.1.3" class="ltx_text ltx_font_medium"> Q1 (sentence fragment: “as government’s top military official”)  
</span><span id="A1.F5.pic3.p3.1.1.4" class="ltx_text" style="--ltx-fg-color:#2E7D32;">Y</span><span id="A1.F5.pic3.p3.1.1.5" class="ltx_text ltx_font_medium"> Q2 (no spelling errors)  
</span><span id="A1.F5.pic3.p3.1.1.6" class="ltx_text" style="--ltx-fg-color:#C62828;">N</span><span id="A1.F5.pic3.p3.1.1.7" class="ltx_text ltx_font_medium"> Q3 (punctuation: backtick quotes, missing caps)  
</span><span id="A1.F5.pic3.p3.1.1.8" class="ltx_text" style="--ltx-fg-color:#C62828;">N</span><span id="A1.F5.pic3.p3.1.1.9" class="ltx_text ltx_font_medium"> Q4 (imprecise: “1970” vs “late 1970s”)  
</span><span id="A1.F5.pic3.p3.1.1.10" class="ltx_text" style="--ltx-fg-color:#C62828;">N</span><span id="A1.F5.pic3.p3.1.1.11" class="ltx_text ltx_font_medium"> Q5 (run-on fragment in sentence 2)  
</span><span id="A1.F5.pic3.p3.1.1.12" class="ltx_text" style="--ltx-fg-color:#C62828;">N</span><span id="A1.F5.pic3.p3.1.1.13" class="ltx_text ltx_font_medium"> Q6 (unnatural jumps between topics)  
</span><span id="A1.F5.pic3.p3.1.1.14" class="ltx_text" style="--ltx-fg-color:#C62828;">N</span><span id="A1.F5.pic3.p3.1.1.15" class="ltx_text ltx_font_medium"> Q7 (requires re-reading)  
</span><span id="A1.F5.pic3.p3.1.1.16" class="ltx_text" style="--ltx-fg-color:#2E7D32;">Y</span><span id="A1.F5.pic3.p3.1.1.17" class="ltx_text ltx_font_medium"> Q8 (main points still comprehensible)</span></span></span>
<span id="A1.F5.pic3.p3.2" class="ltx_p"><span id="A1.F5.pic3.p3.2.1" class="ltx_text ltx_font_bold" style="font-size:90%;--ltx-fg-color:#000000;">Insight:<span id="A1.F5.pic3.p3.2.1.1" class="ltx_text ltx_font_medium">
Human annotators rate this 2/3 (not the worst) because the text is partially readable despite errors.
BinEval captures this nuance: Q2 (</span><span id="A1.F5.pic3.p3.2.1.2" class="ltx_text" style="--ltx-fg-color:#2E7D32;">Y</span><span id="A1.F5.pic3.p3.2.1.3" class="ltx_text ltx_font_medium">, no spelling errors) and Q8 (</span><span id="A1.F5.pic3.p3.2.1.4" class="ltx_text" style="--ltx-fg-color:#2E7D32;">Y</span><span id="A1.F5.pic3.p3.2.1.5" class="ltx_text ltx_font_medium">, comprehensible gist) prevent a floor score. Score: <math id="A1.F5.pic3.m1" class="ltx_Math" alttext="2/8\to 1.50" display="inline" intent=":literal"><semantics><mrow><mrow><mn style="--ltx-fg-color:#000000;" mathcolor="#000000">2</mn><mo style="--ltx-fg-color:#000000;" mathcolor="#000000">/</mo><mn style="--ltx-fg-color:#000000;" mathcolor="#000000">8</mn></mrow><mo style="--ltx-fg-color:#000000;" mathcolor="#000000" stretchy="false">→</mo><mn style="--ltx-fg-color:#000000;" mathcolor="#000000">1.50</mn></mrow><annotation encoding="application/x-tex">2/8\to 1.50</annotation></semantics></math>, between 1 and 2.
G-Eval and UniEval assign the minimum because any fluency issue triggers a blanket negative judgment.</span></span></span>
</span></span></span></span></foreignobject></g></g></svg>