<span id="A4.F7.pic4.1.2" class="ltx_p"><span id="A4.F7.pic4.1.2.1" class="ltx_text" style="--ltx-fg-color:#000000;">The expense in this period of $7,875 is not the same as the payment of $3,000, so we need to accrue an additional expense of $4,875.</span></span>
