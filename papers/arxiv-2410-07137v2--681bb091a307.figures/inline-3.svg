<span id="A2.F8.pic1.2" class="ltx_inline-block ltx_minipage ltx_align_bottom" style="width:36.89em;">
<span id="A2.F8.pic1.2.1" class="ltx_p ltx_parbox ltx_align_middle" style="width:368.9pt;"><span id="A2.F8.pic1.2.1.1" class="ltx_text ltx_font_bold" style="--ltx-fg-color:#000000;">System Message:</span><span id="A2.F8.pic1.2.1.2" class="ltx_text" style="--ltx-fg-color:#000000;"> </span><pre id="A2.F8.pic1.2.1.3" class="ltx_verbatim ltx_font_typewriter" style="--ltx-fg-color:#000000;">
You are a highly efficient assistant, who evaluates and selects the best large language model (LLMs) based on the quality of their responses to a given instruction. This process will be used to create a leaderboard reflecting the most accurate and human-preferred answers.</pre></span>
<span id="A2.F8.pic1.2.2" class="ltx_p ltx_parbox ltx_align_middle" style="width:368.9pt;"><span id="A2.F8.pic1.2.2.1" class="ltx_text ltx_font_bold" style="--ltx-fg-color:#000000;">User Message:</span><span id="A2.F8.pic1.2.2.2" class="ltx_text" style="--ltx-fg-color:#000000;"> </span><pre id="A2.F8.pic1.2.2.3" class="ltx_verbatim ltx_font_typewriter" style="--ltx-fg-color:#000000;">
I require a leaderboard for various large language models. I’ll provide you with prompts given to these models and their corresponding outputs. Your task is to assess these responses, and select the model that produces the best output from a human perspective.
## Instruction
{
 &quot;instruction&quot;: &quot;&quot;&quot;<span id="A2.F8.pic1.2.2.3.1" class="ltx_text" style="--ltx-fg-color:#FF8000;">{instruction}</span>&quot;&quot;&quot;,
}
## Model Outputs
Here are the unordered outputs from the models. Each output is associated with a specific model, identified by a unique model identifier.
{
 {
  &quot;model_identifier&quot;: &quot;m&quot;,
  &quot;output&quot;: &quot;&quot;&quot;<span id="A2.F8.pic1.2.2.3.2" class="ltx_text" style="--ltx-fg-color:#FF8000;">{output_1}</span>&quot;&quot;&quot;
 },
 {
  &quot;model_identifier&quot;: &quot;M&quot;,
  &quot;output&quot;: &quot;&quot;&quot;<span id="A2.F8.pic1.2.2.3.3" class="ltx_text" style="--ltx-fg-color:#FF8000;">{output_2}</span>&quot;&quot;&quot;
 }
}
## Task
Evaluate the models based on the quality and relevance of their outputs, and select the model that generated the best output. Answer by providing the model identifier of the best model. We will use your output as the name of the best model, so make sure your output only contains one of the following model identifiers and nothing else (no quotes, no spaces, no new lines, ...): m or M.
## Best Model Identifier</pre></span>
