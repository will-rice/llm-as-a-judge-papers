<svg id="A8.SS0.SSS0.Px2.p3.pic1" class="ltx_picture" height="188.98" overflow="visible" version="1.1" viewbox="0 0 650 188.98" width="650"><g style="--ltx-stroke-color:#000000;--ltx-fill-color:#000000;" fill="#000000" stroke="#000000" stroke-width="0.4pt" transform="translate(0,188.98) matrix(1 0 0 -1 0 0)"><g style="--ltx-fill-color:#D86E68;" fill="#D86E68" fill-opacity="1.0"><path style="stroke:none" d="M 0 5.53 L 0 183.45 C 0 186.51 2.48 188.98 5.53 188.98 L 644.47 188.98 C 647.52 188.98 650 186.51 650 183.45 L 650 5.53 C 650 2.48 647.52 0 644.47 0 L 5.53 0 C 2.48 0 0 2.48 0 5.53 Z" /></g><g style="--ltx-fill-color:#FCF3F3;" fill="#FCF3F3" fill-opacity="1.0"><path style="stroke:none" d="M 1.38 5.53 L 1.38 183.45 C 1.38 185.74 3.24 187.6 5.53 187.6 L 644.47 187.6 C 646.76 187.6 648.62 185.74 648.62 183.45 L 648.62 5.53 C 648.62 3.24 646.76 1.38 644.47 1.38 L 5.53 1.38 C 3.24 1.38 1.38 3.24 1.38 5.53 Z" /></g><g fill-opacity="1.0" transform="matrix(1.0 0.0 0.0 1.0 16.39 16.31)"><foreignobject style="--ltx-fo-width:44.61em;--ltx-fo-height:11.49em;--ltx-fo-depth:0.19em;font-size:10pt;" height="161.74" overflow="visible" transform="matrix(1 0 0 -1 0 159.05)" width="617.28"><span class="ltx_foreignobject_container"><span class="ltx_foreignobject_content"><span id="A8.SS0.SSS0.Px2.p3.pic1.1" class="ltx_inline-logical-block ltx_minipage ltx_align_bottom" style="width:44.61em;">
<span id="A8.SS0.SSS0.Px2.p3.pic1.p1" class="ltx_para ltx_noindent">
<span id="A8.SS0.SSS0.Px2.p3.pic1.p1.1" class="ltx_p"><span id="A8.SS0.SSS0.Px2.p3.pic1.p1.1.1" class="ltx_text ltx_font_bold" style="--ltx-fg-color:#000000;">This is not <math id="A8.SS0.SSS0.Px2.p3.pic1.p1.m1" class="ltx_Math" alttext="R" display="inline" intent=":literal"><semantics><mi style="--ltx-fg-color:#000000;" mathcolor="#000000">R</mi><annotation encoding="application/x-tex">R</annotation></semantics></math>.</span><span id="A8.SS0.SSS0.Px2.p3.pic1.p1.1.2" class="ltx_text" style="--ltx-fg-color:#000000;"> The verifier is not a judge, the task is not the judge’s
task, and no human assigned direction to these pairs, so there is no ground truth here: only a
model’s agreement with our construction. It is reported as an independent instrument, built for
another purpose, showing the predicted asymmetry at no additional cost.</span></span>
</span>
<span id="A8.SS0.SSS0.Px2.p3.pic1.p2" class="ltx_para">
<span id="A8.SS0.SSS0.Px2.p3.pic1.p2.1" class="ltx_p"><span id="A8.SS0.SSS0.Px2.p3.pic1.p2.1.1" class="ltx_text" style="--ltx-fg-color:#000000;">The verifier’s own insensitivity is why direction is a human decision. An earlier build gated the
construct arm on the verifier agreeing that an edit widened the claim, and that gate rejected 12
of 12 verified strength edits, each with a note conceding the change and denying it mattered. Such
a gate keeps only the strength edits a model can already see, so every judge would then be scored
on a set pre-filtered for detectability. The verifier’s opinion is recorded rather than enforced.</span></span>
</span></span></span></span></foreignobject></g></g></svg>