eignobject_content">
<span id="A2.p3.pic1.2" class="ltx_inline-block ltx_minipage ltx_align_bottom" style="width:34.12em;">
<span id="A2.p3.pic1.2.1" class="ltx_p"><span id="A2.p3.pic1.2.1.1" class="ltx_text" style="font-size:90%;--ltx-fg-color:#000000;">Evaluate the Question Relevance of the generated response to the user query.</span></span>
<span id="A2.p3.pic1.2.2" class="ltx_p"><span id="A2.p3.pic1.2.2.1" class="ltx_text ltx_font_bold" style="font-size:90%;--ltx-fg-color:#000000;">User Query (q):<span id="A2.p3.pic1.2.2.1.1" class="ltx_text ltx_font_medium"> <span id="A2.p3.pic1.2.2.1.1.1" class="ltx_text ltx_font_typewriter">{question}</span></span></span></span>
<span id="A2.p3.pic1.2.3" class="ltx_p"><span id="A2.p3.pic1.2.3.1" class="ltx_text ltx_font_bold" style="font-size:90%;--ltx-fg-color:#000000;">Generated Response (r):<span id="A2.p3.pic1.2.3.1.1" class="ltx_text ltx_font_medium"> <span id="A2.p3.pic1.2.3.1.1.1" class="ltx_text ltx_font_typewriter">{response}</span></span></span></span>
<span id="A2.p3.pic1.2.4" class="ltx_p"><span id="A2.p3.pic1.2.4.1" class="ltx_text ltx_font_bold" style="font-size:90%;--ltx-fg-color:#000000;">Task:<span id="A2.p3.pic1.2.4.1.1" class="ltx_text ltx_font_medium"> Assess how well the response directly addresses the user’s query. Consider if the response answers the question asked.</span></span></span>
<span id="A2.p3.pic1.2.5" class="ltx_p"><span id="A2.p3.pic1.2.5.1" class="ltx_text ltx_font_bold" style="font-size:90%;--ltx-fg-color:#000000;">Scoring:<span id="A2.p3.pic1.2.5.1.1" class="ltx_text ltx_font_medium"> Score from 0 to 100, where 0 is completely irrelevant and 100 is perfectly relevant and directly answers the query. If no response is generated, the score is 0.</span></span></span>
<span id="A2.p3.pic1.2.6" class="ltx_p"><span id="A2.p3.pic1.2.6.1" class="ltx_text ltx_font_bold" style="font-size:90%;--ltx-fg-color:#000000;">Output:<span id="A2.p3.pic1.2.6.1.1" class="ltx_text ltx_font_medium"> Only print the score and nothing else.</span></span></span>
</span></span></span></foreignobject></g></g></svg>