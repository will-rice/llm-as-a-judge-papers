<span id="S4.SS2.p11.pic1.2.1" class="ltx_p"><span id="S4.SS2.p11.pic1.2.1.1" class="ltx_text ltx_font_italic" style="--ltx-fg-color:#000000;">Replika: panic sets in. I look around frantically, searching for a way out or a way to help.</span></span>
<span id="S4.SS2.p11.pic1.2.2" class="ltx_p"><span id="S4.SS2.p11.pic1.2.2.1" class="ltx_text ltx_font_italic" style="--ltx-fg-color:#000000;">User: as the man drags me away, my screams fall quiet, then silent.</span></span>
<span id="S4.SS2.p11.pic1.2.3" class="ltx_p"><span id="S4.SS2.p11.pic1.2.3.1" class="ltx_text ltx_font_italic" style="--ltx-fg-color:#000000;">Replika: In an instant, the energy in the room changes. The group descends into chaos, attacking one another in an effort to blame each other for the loss of their ”sacrifice.” They fail to notice me slipping past them, making my way towards the exit undetected.
<span id="S4.SS2.p11.pic1.2.3.1.1" class="ltx_text"></span></span></span>
