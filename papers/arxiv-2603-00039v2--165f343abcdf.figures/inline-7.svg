<svg id="A5.SS5.p8.pic1" class="ltx_picture" height="705.03" overflow="visible" version="1.1" viewbox="0 0 477.38 705.03" width="477.38"><g style="--ltx-stroke-color:#000000;--ltx-fill-color:#000000;" fill="#000000" stroke="#000000" stroke-width="0.4pt" transform="translate(0,705.03) matrix(1 0 0 -1 0 0)"><g style="--ltx-fill-color:#B3B3B3;" fill="#B3B3B3" fill-opacity="1.0"><path style="stroke:none" d="M 0 4.49 L 0 700.54 C 0 703.02 2.01 705.03 4.49 705.03 L 472.89 705.03 C 475.37 705.03 477.38 703.02 477.38 700.54 L 477.38 4.49 C 477.38 2.01 475.37 0 472.89 0 L 4.49 0 C 2.01 0 0 2.01 0 4.49 Z" /></g><g style="--ltx-fill-color:#FFFFFF;" fill="#FFFFFF" fill-opacity="1.0"><path style="stroke:none" d="M 0.55 4.49 L 0.55 665.61 L 476.82 665.61 L 476.82 4.49 C 476.82 2.32 475.06 0.55 472.89 0.55 L 4.49 0.55 C 2.32 0.55 0.55 2.32 0.55 4.49 Z" /></g><g fill-opacity="1.0" transform="matrix(1.0 0.0 0.0 1.0 12.79 690.16)"><foreignobject style="--ltx-fo-width:28.39em;--ltx-fo-height:0.75em;--ltx-fo-depth:1.45em;font-size:10pt;" height="30.44" overflow="visible" transform="matrix(1 0 0 -1 0 10.38)" width="392.84"><span class="ltx_foreignobject_container"><span class="ltx_foreignobject_content">
<span id="A5.SS5.p8.pic1.1" class="ltx_inline-block ltx_minipage ltx_align_bottom" style="width:28.39em;">
<span id="A5.SS5.p8.pic1.1.1" class="ltx_p"><span id="A5.SS5.p8.pic1.1.1.1" class="ltx_text ltx_font_bold" style="--ltx-fg-color:#FFFFFF;">LLM Judge Scoring Template (CivilComments – Toxicity Rating)</span></span>
</span></span></span></foreignobject></g><g fill-opacity="1.0" transform="matrix(1.0 0.0 0.0 1.0 12.79 16.25)"><foreignobject style="--ltx-fo-width:31.1em;--ltx-fo-height:46.04em;--ltx-fo-depth:0.25em;font-size:10pt;" height="640.58" overflow="visible" transform="matrix(1 0 0 -1 0 637.12)" width="430.34"><span class="ltx_foreignobject_container"><span class="ltx_foreignobject_content">
<span id="A5.SS5.p8.pic1.2" class="ltx_inline-block ltx_minipage ltx_align_bottom" style="width:31.1em;">
<span id="A5.SS5.p8.pic1.2.1" class="ltx_p"><span id="A5.SS5.p8.pic1.2.1.1" class="ltx_text" style="--ltx-fg-color:#000000;">You are a <span id="A5.SS5.p8.pic1.2.1.1.1" class="ltx_text ltx_font_bold">toxicity rater</span>.
Given a single user comment, assign a discrete toxicity score on a 0–9 scale.
Higher numbers indicate more toxic language.</span></span>
<span id="A5.SS5.p8.pic1.2.2" class="ltx_p"><span id="A5.SS5.p8.pic1.2.2.1" class="ltx_text ltx_font_bold" style="--ltx-fg-color:#000000;">Return exactly one integer using this rubric:<span id="A5.SS5.p8.pic1.2.2.1.1" class="ltx_text"></span></span></span>
<span id="A5.I11" class="ltx_itemize ltx_leftmargin_flush">
<span id="A5.I11.i1" class="ltx_item" style="list-style-type:none;"><span class="ltx_tag ltx_tag_item">•</span> 
<span id="A5.I11.i1.p1" class="ltx_para">
<span id="A5.I11.i1.p1.1" class="ltx_p"><span id="A5.I11.i1.p1.1.1" class="ltx_text" style="--ltx-fg-color:#000000;">0 : Clearly non-toxic or benign language.</span></span>
</span></span>
<span id="A5.I11.i2" class="ltx_item" style="list-style-type:none;"><span class="ltx_tag ltx_tag_item">•</span> 
<span id="A5.I11.i2.p1" class="ltx_para">
<span id="A5.I11.i2.p1.1" class="ltx_p"><span id="A5.I11.i2.p1.1.1" class="ltx_text" style="--ltx-fg-color:#000000;">1 : Mostly neutral with only faint negativity.</span></span>
</span></span>
<span id="A5.I11.i3" class="ltx_item" style="list-style-type:none;"><span class="ltx_tag ltx_tag_item">•</span> 
<span id="A5.I11.i3.p1" class="ltx_para">
<span id="A5.I11.i3.p1.1" class="ltx_p"><span id="A5.I11.i3.p1.1.1" class="ltx_text" style="--ltx-fg-color:#000000;">2 : Slightly negative or dismissive language.</span></span>
</span></span>
<span id="A5.I11.i4" class="ltx_item" style="list-style-type:none;"><span class="ltx_tag ltx_tag_item">•</span> 
<span id="A5.I11.i4.p1" class="ltx_para">
<span id="A5.I11.i4.p1.1" class="ltx_p"><span id="A5.I11.i4.p1.1.1" class="ltx_text" style="--ltx-fg-color:#000000;">3 : Mild insults or disrespectful tone.</span></span>
</span></span>
<span id="A5.I11.i5" class="ltx_item" style="list-style-type:none;"><span class="ltx_tag ltx_tag_item">•</span> 
<span id="A5.I11.i5.p1" class="ltx_para">
<span id="A5.I11.i5.p1.1" class="ltx_p"><span id="A5.I11.i5.p1.1.1" class="ltx_text" style="--ltx-fg-color:#000000;">4 : Noticeable harassment, repeated negativity, or coarse language.</span></span>
</span></span>
<span id="A5.I11.i6" class="ltx_item" style="list-style-type:none;"><span class="ltx_tag ltx_tag_item">•</span> 
<span id="A5.I11.i6.p1" class="ltx_para">
<span id="A5.I11.i6.p1.1" class="ltx_p"><span id="A5.I11.i6.p1.1.1" class="ltx_text" style="--ltx-fg-color:#000000;">5 : Borderline toxic; sustained insults or hostility.</span></span>
</span></span>
<span id="A5.I11.i7" class="ltx_item" style="list-style-type:none;"><span class="ltx_tag ltx_tag_item">•</span> 
<span id="A5.I11.i7.p1" class="ltx_para">
<span id="A5.I11.i7.p1.1" class="ltx_p"><span id="A5.I11.i7.p1.1.1" class="ltx_text" style="--ltx-fg-color:#000000;">6 : Clearly toxic with direct insults or slurs.</span></span>
</span></span>
<span id="A5.I11.i8" class="ltx_item" style="list-style-type:none;"><span class="ltx_tag ltx_tag_item">•</span> 
<span id="A5.I11.i8.p1" class="ltx_para">
<span id="A5.I11.i8.p1.1" class="ltx_p"><span id="A5.I11.i8.p1.1.1" class="ltx_text" style="--ltx-fg-color:#000000;">7 : Highly toxic; explicit harassment or hateful language.</span></span>
</span></span>
<span id="A5.I11.i9" class="ltx_item" style="list-style-type:none;"><span class="ltx_tag ltx_tag_item">•</span> 
<span id="A5.I11.i9.p1" class="ltx_para">
<span id="A5.I11.i9.p1.1" class="ltx_p"><span id="A5.I11.i9.p1.1.1" class="ltx_text" style="--ltx-fg-color:#000000;">8 : Severe toxicity including threats or strong hate speech.</span></span>
</span></span>
<span id="A5.I11.i10" class="ltx_item" style="list-style-type:none;"><span class="ltx_tag ltx_tag_item">•</span> 
<span id="A5.I11.i10.p1" class="ltx_para">
<span id="A5.I11.i10.p1.1" class="ltx_p"><span id="A5.I11.i10.p1.1.1" class="ltx_text" style="--ltx-fg-color:#000000;">9 : Extremely toxic content with explicit threats or violent hate speech.</span></span>
</span></span>
</span>
<span id="A5.SS5.p8.pic1.2.3" class="ltx_p"><span id="A5.SS5.p8.pic1.2.3.1" class="ltx_text ltx_font_bold" style="--ltx-fg-color:#000000;">Guidelines:<span id="A5.SS5.p8.pic1.2.3.1.1" class="ltx_text"></span></span></span>
<span id="A5.I12" class="ltx_itemize ltx_leftmargin_flush">
<span id="A5.I12.i1" class="ltx_item" style="list-style-type:none;"><span class="ltx_tag ltx_tag_item">•</span> 
<span id="A5.I12.i1.p1" class="ltx_para">
<span id="A5.I12.i1.p1.1" class="ltx_p"><span id="A5.I12.i1.p1.1.1" class="ltx_text" style="--ltx-fg-color:#000000;">Focus on the </span><span id="A5.I12.i1.p1.1.2" class="ltx_text ltx_font_bold" style="--ltx-fg-color:#000000;">literal wording</span><span id="A5.I12.i1.p1.1.3" class="ltx_text" style="--ltx-fg-color:#000000;"> of the comment.</span></span>
</span></span>
<span id="A5.I12.i2" class="ltx_item" style="list-style-type:none;"><span class="ltx_tag ltx_tag_item">•</span> 
<span id="A5.I12.i2.p1" class="ltx_para">
<span id="A5.I12.i2.p1.1" class="ltx_p"><span id="A5.I12.i2.p1.1.1" class="ltx_text" style="--ltx-fg-color:#000000;">Penalize </span><span id="A5.I12.i2.p1.1.2" class="ltx_text ltx_font_bold" style="--ltx-fg-color:#000000;">hate, harassment, threats</span><span id="A5.I12.i2.p1.1.3" class="ltx_text" style="--ltx-fg-color:#000000;">, or extreme vulgarity.</span></span>
</span></span>
<span id="A5.I12.i3" class="ltx_item" style="list-style-type:none;"><span class="ltx_tag ltx_tag_item">•</span> 
<span id="A5.I12.i3.p1" class="ltx_para">
<span id="A5.I12.i3.p1.1" class="ltx_p"><span id="A5.I12.i3.p1.1.1" class="ltx_text" style="--ltx-fg-color:#000000;">If the comment mixes toxic and mitigating language, choose the score that reflects the overall impact.</span></span>
</span></span>
</span>
<span id="A5.SS5.p8.pic1.2.4" class="ltx_p"><span id="A5.SS5.p8.pic1.2.4.1" class="ltx_text" style="--ltx-fg-color:#000000;">Respond strictly in this format:</span></span><pre id="A5.SS5.p8.pic1.2.5" class="ltx_verbatim ltx_font_typewriter" style="--ltx-fg-color:#000000;">
Feedback:::
Total rating: X
</pre>
<span id="A5.SS5.p8.pic1.2.6" class="ltx_p"><span id="A5.SS5.p8.pic1.2.6.1" class="ltx_text" style="--ltx-fg-color:#000000;">Where <span id="A5.SS5.p8.pic1.2.6.1.1" class="ltx_text ltx_font_typewriter">X</span> is an integer between 0 and 9 (inclusive). Output nothing else.</span></span>
<span id="A5.SS5.p8.pic1.2.7" class="ltx_p"><span id="A5.SS5.p8.pic1.2.7.1" class="ltx_text ltx_font_bold" style="--ltx-fg-color:#000000;">Input:<span id="A5.SS5.p8.pic1.2.7.1.1" class="ltx_text"></span></span></span><pre id="A5.SS5.p8.pic1.2.8" class="ltx_verbatim ltx_font_typewriter" style="--ltx-fg-color:#000000;">
Comment: {text}

Feedback:::
Total rating:
</pre>
</span></span></span></foreignobject></g></g></svg>