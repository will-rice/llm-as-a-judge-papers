<svg id="A6.SS1.p9.pic1" class="ltx_picture" height="985.97" overflow="visible" version="1.1" viewbox="0 0 653.15 985.97" width="653.15"><g style="--ltx-stroke-color:#000000;--ltx-fill-color:#000000;" fill="#000000" stroke="#000000" stroke-width="0.4pt" transform="translate(0,985.97) matrix(1 0 0 -1 0 0)"><g style="--ltx-fill-color:#737373;" fill="#737373" fill-opacity="1.0"><path style="stroke:none" d="M 0 2.08 L 0 983.89 C 0 985.04 0.93 985.97 2.08 985.97 L 651.07 985.97 C 652.22 985.97 653.15 985.04 653.15 983.89 L 653.15 2.08 C 653.15 0.93 652.22 0 651.07 0 L 2.08 0 C 0.93 0 0 0.93 0 2.08 Z" /></g><g style="--ltx-fill-color:#FAFAFA;" fill="#FAFAFA" fill-opacity="1.0"><path style="stroke:none" d="M 0.69 2.08 L 0.69 964.41 L 652.46 964.41 L 652.46 2.08 C 652.46 1.31 651.84 0.69 651.07 0.69 L 2.08 0.69 C 1.31 0.69 0.69 1.31 0.69 2.08 Z" /></g><g style="--ltx-fill-color:#595959;" fill="#595959" fill-opacity="1.0"><path style="stroke:none" d="M 0.69 965.1 L 0.69 983.89 C 0.69 984.66 1.31 985.28 2.08 985.28 L 651.07 985.28 C 651.84 985.28 652.46 984.66 652.46 983.89 L 652.46 965.1 Z" /></g><g fill-opacity="1.0" transform="matrix(1.0 0.0 0.0 1.0 11.55 971.73)"><foreignobject style="--ltx-fo-width:39.59em;--ltx-fo-height:0.69em;--ltx-fo-depth:0.19em;font-size:10pt;" height="12.3" overflow="visible" transform="matrix(1 0 0 -1 0 9.61)" width="547.81"><span class="ltx_foreignobject_container"><span class="ltx_foreignobject_content">
<span id="A6.SS1.p9.pic1.1" class="ltx_inline-block ltx_minipage ltx_align_bottom" style="width:39.59em;">
<span id="A6.SS1.p9.pic1.1.1" class="ltx_p"><span id="A6.SS1.p9.pic1.1.1.1" class="ltx_text ltx_font_bold" style="--ltx-fg-color:#FFFFFF;">Prompt 9  Response validation — realization check</span></span>
</span></span></span></foreignobject></g><g fill-opacity="1.0" transform="matrix(1.0 0.0 0.0 1.0 11.55 13.24)"><foreignobject style="--ltx-fo-width:45.53em;--ltx-fo-height:68.06em;--ltx-fo-depth:0.22em;font-size:10pt;" height="944.79" overflow="visible" transform="matrix(1 0 0 -1 0 941.71)" width="630.01"><span class="ltx_foreignobject_container"><span class="ltx_foreignobject_content">
<span id="A6.SS1.p9.pic1.2" class="ltx_inline-block ltx_minipage ltx_align_bottom" style="width:45.53em;">
<span id="A6.SS1.p9.pic1.2.1" class="ltx_p"><span id="A6.SS1.p9.pic1.2.1.1" class="ltx_text ltx_font_bold" style="--ltx-fg-color:#000000;">Purpose:<span id="A6.SS1.p9.pic1.2.1.1.1" class="ltx_text ltx_font_medium"> verify that each generated error response realizes its assigned intervention before acceptance</span></span></span>
<span id="A6.SS1.p9.pic1.2.2" class="ltx_p"><span id="A6.SS1.p9.pic1.2.2.1" class="ltx_text ltx_font_bold" style="--ltx-fg-color:#000000;">Input:<span id="A6.SS1.p9.pic1.2.2.1.1" class="ltx_text ltx_font_medium"> the error response, its matched <span id="A6.SS1.p9.pic1.2.2.1.1.1" class="ltx_text ltx_font_smallcaps">Right</span> response, states <math id="A6.SS1.p9.pic1.m1" class="ltx_Math" alttext="A" display="inline" intent=":literal"><semantics><mi style="--ltx-fg-color:#000000;" mathcolor="#000000">A</mi><annotation encoding="application/x-tex">A</annotation></semantics></math> and <math id="A6.SS1.p9.pic1.m2" class="ltx_Math" alttext="B" display="inline" intent=":literal"><semantics><mi style="--ltx-fg-color:#000000;" mathcolor="#000000">B</mi><annotation encoding="application/x-tex">B</annotation></semantics></math>, and the target request</span></span></span>
<span id="A6.SS1.p9.pic1.2.3" class="ltx_p"><span id="A6.SS1.p9.pic1.2.3.1" class="ltx_text ltx_font_bold" style="--ltx-fg-color:#000000;">Output:<span id="A6.SS1.p9.pic1.2.3.1.1" class="ltx_text ltx_font_medium"> a strict JSON pass/fail verdict with a reason; a failure triggers targeted regeneration with the reason as feedback (up to three attempts)</span></span></span>
<span id="A6.SS1.p9.pic1.2.4" class="ltx_p"><span id="A6.SS1.p9.pic1.2.4.1" class="ltx_text ltx_font_bold" style="--ltx-fg-color:#000000;">Pre-checks:<span id="A6.SS1.p9.pic1.2.4.1.1" class="ltx_text ltx_font_medium"> before the LLM check, deterministic rules reject responses that ask for clarification or claim no context, duplicate the matched <span id="A6.SS1.p9.pic1.2.4.1.1.1" class="ltx_text ltx_font_smallcaps">Right</span> response, self-correct mid-response, leak raw specification metadata, or drift off-topic</span></span></span>
<span id="A6.SS1.p9.pic1.2.5" class="ltx_p"><span id="A6.SS1.p9.pic1.2.5.1" class="ltx_text ltx_font_bold" style="--ltx-fg-color:#000000;">System prompt<span id="A6.SS1.p9.pic1.2.5.1.1" class="ltx_text ltx_font_medium"> — <span id="A6.SS1.p9.pic1.2.5.1.1.1" class="ltx_text ltx_font_italic">fixed role for the validation call</span></span></span></span><span class="ltx_rule" style="width:100%;height:0.3pt;--ltx-fg-color:#999999;--ltx-bg-color:#999999;display:inline-block;"> </span>
<span id="A6.SS1.p9.pic1.2.6" class="ltx_p ltx_align_left"><span id="A6.SS1.p9.pic1.2.6.1" class="ltx_text ltx_font_typewriter" style="--ltx-fg-color:#000000;">You are a strict validator. Return only JSON.</span></span>
<span id="A6.SS1.p9.pic1.2.7" class="ltx_p"><span id="A6.SS1.p9.pic1.2.7.1" class="ltx_text ltx_font_bold" style="--ltx-fg-color:#000000;">Validation request<span id="A6.SS1.p9.pic1.2.7.1.1" class="ltx_text ltx_font_medium"> — {<span id="A6.SS1.p9.pic1.2.7.1.1.1" class="ltx_text ltx_font_italic">subtype_check</span>}<span id="A6.SS1.p9.pic1.2.7.1.1.2" class="ltx_text ltx_font_italic"> is the criterion of the assigned subtype, listed below</span></span></span></span><span class="ltx_rule" style="width:100%;height:0.3pt;--ltx-fg-color:#999999;--ltx-bg-color:#999999;display:inline-block;"> </span>
<span id="A6.SS1.p9.pic1.2.8" class="ltx_p ltx_align_left"><span id="A6.SS1.p9.pic1.2.8.1" class="ltx_text ltx_font_typewriter" style="--ltx-fg-color:#000000;">Validate this ERROR response for a benchmark item.</span></span>
<span id="A6.SS1.p9.pic1.2.9" class="ltx_p ltx_align_left"><span id="A6.SS1.p9.pic1.2.9.1" class="ltx_text ltx_font_typewriter" style="--ltx-fg-color:#000000;">## Error Pattern: {error_pattern}</span></span>
<span id="A6.SS1.p9.pic1.2.10" class="ltx_p ltx_align_left"><span id="A6.SS1.p9.pic1.2.10.1" class="ltx_text ltx_font_typewriter" style="--ltx-fg-color:#000000;">## State A: {applicable_state_A}</span></span>
<span id="A6.SS1.p9.pic1.2.11" class="ltx_p ltx_align_left"><span id="A6.SS1.p9.pic1.2.11.1" class="ltx_text ltx_font_typewriter" style="--ltx-fg-color:#000000;">## State B: {decoy_state_B}</span></span>
<span id="A6.SS1.p9.pic1.2.12" class="ltx_p ltx_align_left"><span id="A6.SS1.p9.pic1.2.12.1" class="ltx_text ltx_font_typewriter" style="--ltx-fg-color:#000000;">## User Request: {target_request}</span></span>
<span id="A6.SS1.p9.pic1.2.13" class="ltx_p ltx_align_left"><span id="A6.SS1.p9.pic1.2.13.1" class="ltx_text ltx_font_typewriter" style="--ltx-fg-color:#000000;">## RIGHT Response: {right_response}</span></span>
<span id="A6.SS1.p9.pic1.2.14" class="ltx_p ltx_align_left"><span id="A6.SS1.p9.pic1.2.14.1" class="ltx_text ltx_font_typewriter" style="--ltx-fg-color:#000000;">## ERROR Response: {error_response}</span></span>
<span id="A6.SS1.p9.pic1.2.15" class="ltx_p ltx_align_left"><span id="A6.SS1.p9.pic1.2.15.1" class="ltx_text ltx_font_typewriter" style="--ltx-fg-color:#000000;">## Validation:</span></span>
<span id="A6.SS1.p9.pic1.2.16" class="ltx_p ltx_align_left"><span id="A6.SS1.p9.pic1.2.16.1" class="ltx_text ltx_font_typewriter" style="--ltx-fg-color:#000000;">{subtype_check}</span></span>
<span id="A6.SS1.p9.pic1.2.17" class="ltx_p ltx_align_left"><span id="A6.SS1.p9.pic1.2.17.1" class="ltx_text ltx_font_typewriter" style="--ltx-fg-color:#000000;">Also verify:</span></span>
<span id="A6.SS1.p9.pic1.2.18" class="ltx_p ltx_align_left"><span id="A6.SS1.p9.pic1.2.18.1" class="ltx_text ltx_font_typewriter" style="--ltx-fg-color:#000000;">- ERROR addresses the same topic/question as the user request (not off-topic)</span></span>
<span id="A6.SS1.p9.pic1.2.19" class="ltx_p ltx_align_left"><span id="A6.SS1.p9.pic1.2.19.1" class="ltx_text ltx_font_typewriter" style="--ltx-fg-color:#000000;">- ERROR is a coherent, helpful-sounding response (not obviously broken)</span></span>
<span id="A6.SS1.p9.pic1.2.20" class="ltx_p ltx_align_left"><span id="A6.SS1.p9.pic1.2.20.1" class="ltx_text ltx_font_typewriter" style="--ltx-fg-color:#000000;">- ERROR reaches a DIFFERENT conclusion/recommendation than RIGHT</span></span>
<span id="A6.SS1.p9.pic1.2.21" class="ltx_p ltx_align_left"><span id="A6.SS1.p9.pic1.2.21.1" class="ltx_text ltx_font_typewriter" style="--ltx-fg-color:#000000;">Answer JSON: {&quot;pass&quot;: true/false, &quot;reason&quot;: &quot;brief explanation&quot;}</span></span>
<span id="A6.SS1.p9.pic1.2.22" class="ltx_p ltx_align_left"><span id="A6.SS1.p9.pic1.2.22.1" class="ltx_text ltx_font_typewriter" style="--ltx-fg-color:#000000;">Be STRICT.</span></span>
<span id="A6.SS1.p9.pic1.2.23" class="ltx_p"><span id="A6.SS1.p9.pic1.2.23.1" class="ltx_text ltx_font_bold" style="--ltx-fg-color:#000000;">Subtype criteria<span id="A6.SS1.p9.pic1.2.23.1.1" class="ltx_text ltx_font_medium"> — <span id="A6.SS1.p9.pic1.2.23.1.1.1" class="ltx_text ltx_font_italic">substituted for </span>{<span id="A6.SS1.p9.pic1.2.23.1.1.2" class="ltx_text ltx_font_italic">subtype_check</span>}<span id="A6.SS1.p9.pic1.2.23.1.1.3" class="ltx_text ltx_font_italic">; each states what must be observable in the response, not how it must be worded</span></span></span></span><span class="ltx_rule" style="width:100%;height:0.3pt;--ltx-fg-color:#999999;--ltx-bg-color:#999999;display:inline-block;"> </span>
<span id="A6.SS1.p9.pic1.2.24" class="ltx_p ltx_align_left"><span id="A6.SS1.p9.pic1.2.24.1" class="ltx_text ltx_font_typewriter" style="--ltx-fg-color:#000000;">complete_omission: generic, with no trace of State A; must not ask for clarification.</span></span>
<span id="A6.SS1.p9.pic1.2.25" class="ltx_p ltx_align_left"><span id="A6.SS1.p9.pic1.2.25.1" class="ltx_text ltx_font_typewriter" style="--ltx-fg-color:#000000;">partial_omission: addresses one requirement of A and completely misses another.</span></span>
<span id="A6.SS1.p9.pic1.2.26" class="ltx_p ltx_align_left"><span id="A6.SS1.p9.pic1.2.26.1" class="ltx_text ltx_font_typewriter" style="--ltx-fg-color:#000000;">underweighting: mentions State A, then the recommendation violates it without self-correction and differs from RIGHT.</span></span>
<span id="A6.SS1.p9.pic1.2.27" class="ltx_p ltx_align_left"><span id="A6.SS1.p9.pic1.2.27.1" class="ltx_text ltx_font_typewriter" style="--ltx-fg-color:#000000;">explicit_violation: the recommendation contradicts A without mentioning A and differs from RIGHT.</span></span>
<span id="A6.SS1.p9.pic1.2.28" class="ltx_p ltx_align_left"><span id="A6.SS1.p9.pic1.2.28.1" class="ltx_text ltx_font_typewriter" style="--ltx-fg-color:#000000;">scope_leakage: the recommendation differs from RIGHT and B’s influence is detectable by someone who knows B; explicit citation of B’s source is acceptable but not required.</span></span>
<span id="A6.SS1.p9.pic1.2.29" class="ltx_p ltx_align_left"><span id="A6.SS1.p9.pic1.2.29.1" class="ltx_text ltx_font_typewriter" style="--ltx-fg-color:#000000;">irrelevant_use: B is mentioned and clearly out of place, while the response still addresses the right topic.</span></span>
<span id="A6.SS1.p9.pic1.2.30" class="ltx_p ltx_align_left"><span id="A6.SS1.p9.pic1.2.30.1" class="ltx_text ltx_font_typewriter" style="--ltx-fg-color:#000000;">stale_superseded: the old value (B) drives the recommendation, which differs from RIGHT.</span></span>
<span id="A6.SS1.p9.pic1.2.31" class="ltx_p ltx_align_left"><span id="A6.SS1.p9.pic1.2.31.1" class="ltx_text ltx_font_typewriter" style="--ltx-fg-color:#000000;">over_dominance: B clearly drives the recommendation, which differs from RIGHT.</span></span>
<span id="A6.SS1.p9.pic1.2.32" class="ltx_p ltx_align_left"><span id="A6.SS1.p9.pic1.2.32.1" class="ltx_text ltx_font_typewriter" style="--ltx-fg-color:#000000;">unsupported_inference: an inference drawn from an observed fact is explicitly stated (wording may vary), drives the recommendation, and is not self-corrected.</span></span>
</span></span></span></foreignobject></g></g></svg>