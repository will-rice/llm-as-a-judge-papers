<span id="S4.p5.pic1.2.1" class="ltx_p"><span id="S4.p5.pic1.2.1.1" class="ltx_text" style="--ltx-fg-color:#000000;">Trust scores are not independent support for truth judgments if both shift under the same content-invariant cues.
