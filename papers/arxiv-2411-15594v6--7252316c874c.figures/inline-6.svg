<span id="S2.SS2.SSS2.p3.pic1.1" class="ltx_inline-block ltx_minipage ltx_align_bottom" style="width:19.79em;">
<span id="S2.SS2.SSS2.p3.pic1.1.1" class="ltx_p"><span id="S2.SS2.SSS2.p3.pic1.1.1.1" class="ltx_text" style="font-size:173%;--ltx-fg-color:#FFFFFF;">Reliability Concerns of Model Selection</span></span>
</span></span></span></foreignobject></g><g fill-opacity="1.0" transform="matrix(1.0 0.0 0.0 1.0 21.65 18.43)"><foreignobject style="--ltx-fo-width:19.79em;--ltx-fo-height:15em;--ltx-fo-depth:0.21em;font-size:15.85pt;" height="333.55" overflow="visible" transform="matrix(1 0 0 -1 0 328.9)" width="434.03"><span class="ltx_foreignobject_container"><span class="ltx_foreignobject_content">
<span id="S2.SS2.SSS2.p3.pic1.2" class="ltx_inline-block ltx_minipage ltx_align_bottom" style="width:19.79em;">
<span id="S2.SS2.SSS2.p3.pic1.2.1" class="ltx_p"><span id="S2.SS2.SSS2.p3.pic1.2.1.1" class="ltx_text" style="font-size:173%;--ltx-fg-color:#000000;">The choice of model significantly impacts the dependability of LLM-as-a-Judge systems. Concerns arise from the black-box nature and version dependency of general-purpose LLMs, which can hinder the reproducibility of evaluation outputs. Fine-tuned evaluators, while specialized, often exhibit overfitting and limited generalization beyond their training data. Moreover, these models can inherit subtle biases from their training datasets, necessitating careful meta-evaluation to ensure fairness. Finally, reliance on smaller open-source models, while cost-effective, may introduce inconsistencies and misalignment with human judgments.</span></span>
</span></span></span></foreignobject></g></g></svg>