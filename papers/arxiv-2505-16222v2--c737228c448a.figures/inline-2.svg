<span id="A6.F6.p1.pic1.2.1.1.1" class="ltx_inline-block ltx_align_top" style="width:287.9pt;">
<span id="A6.F6.p1.pic1.2.1.1.1.1" class="ltx_p"><span id="A6.F6.p1.pic1.2.1.1.1.1.1" class="ltx_text" style="--ltx-fg-color:#000000;">You will be given a task description. Your job is to generate test cases to evaluate a piece of code implementing the described task.</span></span>
</span></td></tr>
<tr id="A6.F6.p1.pic1.2.2" class="ltx_tr">
