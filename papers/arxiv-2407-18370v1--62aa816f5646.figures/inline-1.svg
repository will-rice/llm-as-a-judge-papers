<br class="ltx_break"></span></span>
<span id="A5.SS1.p1.pic1.2.2" class="ltx_p"><span id="A5.SS1.p1.pic1.2.2.1" class="ltx_text" style="--ltx-fg-color:#000000;">Given a document and two summaries of the document, an annotator chose which summary is preferred. Given examples of the annotator’s decision, predict the annotator’s verdict on the given example. If Summary A is preferred to Summary B, the annotator chose “[[A]]”. If Summary B is preferred to Summary A, the annotator chose “[[B]]”.
