<span id="A1.F5.pic1.p3" class="ltx_para">
<span id="A1.F5.pic1.p3.1" class="ltx_p"><span id="A1.F5.pic1.p3.1.1" class="ltx_text ltx_font_bold" style="font-size:90%;--ltx-fg-color:#000000;">Decomposed reasoning:<span id="A1.F5.pic1.p3.1.1.1" class="ltx_text ltx_font_medium"> 
</span><span id="A1.F5.pic1.p3.1.1.2" class="ltx_text" style="--ltx-fg-color:#2E7D32;">Y</span><span id="A1.F5.pic1.p3.1.1.3" class="ltx_text ltx_font_medium"> Q1 (structured)  
</span><span id="A1.F5.pic1.p3.1.1.4" class="ltx_text" style="--ltx-fg-color:#2E7D32;">Y</span><span id="A1.F5.pic1.p3.1.1.5" class="ltx_text ltx_font_medium"> Q2 (logical order)  
</span><span id="A1.F5.pic1.p3.1.1.6" class="ltx_text" style="--ltx-fg-color:#2E7D32;">Y</span><span id="A1.F5.pic1.p3.1.1.7" class="ltx_text ltx_font_medium"> Q3 (transitions)  
</span><span id="A1.F5.pic1.p3.1.1.8" class="ltx_text" style="--ltx-fg-color:#2E7D32;">Y</span><span id="A1.F5.pic1.p3.1.1.9" class="ltx_text ltx_font_medium"> Q4 (no repetition)  
</span><span id="A1.F5.pic1.p3.1.1.10" class="ltx_text" style="--ltx-fg-color:#2E7D32;">Y</span><span id="A1.F5.pic1.p3.1.1.11" class="ltx_text ltx_font_medium"> Q5 (unified focus)  
</span><span id="A1.F5.pic1.p3.1.1.12" class="ltx_text" style="--ltx-fg-color:#2E7D32;">Y</span><span id="A1.F5.pic1.p3.1.1.13" class="ltx_text ltx_font_medium"> Q6 (main topic)  
</span><span id="A1.F5.pic1.p3.1.1.14" class="ltx_text" style="--ltx-fg-color:#C62828;">N</span><span id="A1.F5.pic1.p3.1.1.15" class="ltx_text ltx_font_medium"> Q7 (misses some details)  
</span><span id="A1.F5.pic1.p3.1.1.16" class="ltx_text" style="--ltx-fg-color:#2E7D32;">Y</span><span id="A1.F5.pic1.p3.1.1.17" class="ltx_text ltx_font_medium"> Q8 (no contradictions)</span></span></span>
<span id="A1.F5.pic1.p3.2" class="ltx_p"><span id="A1.F5.pic1.p3.2.1" class="ltx_text ltx_font_bold" style="font-size:90%;--ltx-fg-color:#000000;">Insight:<span id="A1.F5.pic1.p3.2.1.1" class="ltx_text ltx_font_medium">
A single sentence <em id="A1.F5.pic1.p3.2.1.1.1" class="ltx_emph ltx_font_italic">trivially</em> satisfies ordering, non-contradiction, and focus criteria.
The one </span><span id="A1.F5.pic1.p3.2.1.2" class="ltx_text" style="--ltx-fg-color:#C62828;">N</span><span id="A1.F5.pic1.p3.2.1.3" class="ltx_text ltx_font_medium"> (incomplete coverage) yields a proportional penalty: <math id="A1.F5.pic1.m1" class="ltx_Math" alttext="7/8\to 4.56" display="inline" intent=":literal"><semantics><mrow><mrow><mn style="--ltx-fg-color:#000000;" mathcolor="#000000">7</mn><mo style="--ltx-fg-color:#000000;" mathcolor="#000000">/</mo><mn style="--ltx-fg-color:#000000;" mathcolor="#000000">8</mn></mrow><mo style="--ltx-fg-color:#000000;" mathcolor="#000000" stretchy="false">→</mo><mn style="--ltx-fg-color:#000000;" mathcolor="#000000">4.56</mn></mrow><annotation encoding="application/x-tex">7/8\to 4.56</annotation></semantics></math>, closely matching the human score.
Holistic methods conflate <em id="A1.F5.pic1.p3.2.1.3.1" class="ltx_emph ltx_font_italic">completeness</em> with <em id="A1.F5.pic1.p3.2.1.3.2" class="ltx_emph ltx_font_italic">coherence</em>, assigning the minimum score.</span></span></span>
