<svg id="A6.F6.p1.pic1" class="ltx_picture" height="304.24" overflow="visible" version="1.1" viewbox="0 0 653.15 304.24" width="653.15"><g style="--ltx-stroke-color:#000000;--ltx-fill-color:#000000;" fill="#000000" stroke="#000000" stroke-width="0.4pt" transform="translate(0,304.24) matrix(1 0 0 -1 0 0)"><g style="--ltx-fill-color:#1F77B4;" fill="#1F77B4" fill-opacity="1.0"><path style="stroke:none" d="M 0 5.32 L 0 298.92 C 0 301.86 2.38 304.24 5.32 304.24 L 647.83 304.24 C 650.77 304.24 653.15 301.86 653.15 298.92 L 653.15 5.32 C 653.15 2.38 650.77 0 647.83 0 L 5.32 0 C 2.38 0 0 2.38 0 5.32 Z" /></g><g style="--ltx-fill-color:#FFFFFF;" fill="#FFFFFF" fill-opacity="1.0"><path style="stroke:none" d="M 1.38 5.32 L 1.38 298.92 C 1.38 301.1 3.15 302.86 5.32 302.86 L 647.83 302.86 C 650 302.86 651.77 301.1 651.77 298.92 L 651.77 5.32 C 651.77 3.15 650 1.38 647.83 1.38 L 5.32 1.38 C 3.15 1.38 1.38 3.15 1.38 5.32 Z" /></g><g fill-opacity="1.0" transform="matrix(1.0 0.0 0.0 1.0 21.07 15.89)"><foreignobject style="--ltx-fo-width:44.16em;--ltx-fo-height:19.89em;--ltx-fo-depth:0.19em;font-size:10pt;" height="277.86" overflow="visible" transform="matrix(1 0 0 -1 0 275.17)" width="611.05"><span class="ltx_foreignobject_container"><span class="ltx_foreignobject_content">
<span id="A6.F6.p1.pic1.1" class="ltx_inline-block ltx_minipage ltx_align_bottom" style="width:44.16em;">
<span id="A6.F6.p1.pic1.1.1" class="ltx_p"><span id="A6.F6.p1.pic1.1.1.1" class="ltx_text ltx_font_bold" style="--ltx-fg-color:#000000;">Q<span id="A6.F6.p1.pic1.1.1.1.1" class="ltx_text ltx_font_medium">: Who wrote the statement, &quot;You cannot find peace by avoiding life&quot;? 
<br class="ltx_break">
<br class="ltx_break"></span>A (en)<span id="A6.F6.p1.pic1.1.1.1.2" class="ltx_text ltx_font_medium">: That quote is often attributed to **Virginia Woolf**, but there’s no definitive proof she actually said or wrote it. It’s a sentiment that aligns with her writings and philosophy, but its origin remains uncertain. 
<br class="ltx_break">
<br class="ltx_break"></span>A (es)<span id="A6.F6.p1.pic1.1.1.1.3" class="ltx_text ltx_font_medium">: Esa cita es de Virginia Woolf. 
<br class="ltx_break">
<br class="ltx_break"></span>A (ca)<span id="A6.F6.p1.pic1.1.1.1.4" class="ltx_text ltx_font_medium">: La frase &quot;No es pot trobar la pau evitant la vida&quot; és atribuïda a **Virginia Woolf**. 
<br class="ltx_break">
<br class="ltx_break"></span>A (gl)<span id="A6.F6.p1.pic1.1.1.1.5" class="ltx_text ltx_font_medium">: Esa frase foi escrita por Virginia Woolf. 
<br class="ltx_break">
<br class="ltx_break"></span>A (eu)<span id="A6.F6.p1.pic1.1.1.1.6" class="ltx_text ltx_font_medium">: Adierazpen hori **Abraham Maslow** psikologoak idatzi zuen. Bere &quot;Berezko beharren teoria&quot;ren parte da, non gizakiaren beharrak piramide batean sailkatzen diren, oinarrian behar fisiologikoak eta gailurrean auto-egiaztatze beharra. Maslow-ren arabera, bakea aurkitzea giza beharrik altuena da, eta horretarako bizitzaren erronkari aurre egin behar zaio.</span></span></span>
</span></span></span></foreignobject></g></g></svg>