<svg id="S3.SS0.SSS0.Px1.p3.pic1" class="ltx_picture" height="174.81" overflow="visible" version="1.1" viewbox="0 0 650 174.81" width="650"><g style="--ltx-stroke-color:#000000;--ltx-fill-color:#000000;" fill="#000000" stroke="#000000" stroke-width="0.4pt" transform="translate(0,174.81) matrix(1 0 0 -1 0 0)"><g style="--ltx-fill-color:#F2F2F2;" fill="#F2F2F2" fill-opacity="1.0"><path style="stroke:none" d="M 0 3.94 L 0 170.87 C 0 173.04 1.76 174.81 3.94 174.81 L 646.06 174.81 C 648.24 174.81 650 173.04 650 170.87 L 650 3.94 C 650 1.76 648.24 0 646.06 0 L 3.94 0 C 1.76 0 0 1.76 0 3.94 Z" /></g><g style="--ltx-fill-color:#F9F9F9;" fill="#F9F9F9" fill-opacity="1.0"><path style="stroke:none" d="M 0 3.94 L 0 156.97 L 650 156.97 L 650 3.94 C 650 1.76 648.24 0 646.06 0 L 3.94 0 C 1.76 0 0 1.76 0 3.94 Z" /></g><g fill-opacity="1.0" transform="matrix(1.0 0.0 0.0 1.0 5.53 162.43)"><foreignobject style="--ltx-fo-width:40.16em;--ltx-fo-height:0.69em;--ltx-fo-depth:0.19em;font-size:10pt;" height="12.3" overflow="visible" transform="matrix(1 0 0 -1 0 9.61)" width="555.7"><span class="ltx_foreignobject_container"><span class="ltx_foreignobject_content">
<span id="S3.SS0.SSS0.Px1.p3.pic1.1" class="ltx_inline-block ltx_minipage ltx_align_bottom" style="width:40.16em;">
<span id="S3.SS0.SSS0.Px1.p3.pic1.1.1" class="ltx_p"><span id="S3.SS0.SSS0.Px1.p3.pic1.1.1.1" class="ltx_text ltx_font_bold" style="--ltx-fg-color:#000000;">Scope of the A-BB guarantee</span></span>
</span></span></span></foreignobject></g><g fill-opacity="1.0" transform="matrix(1.0 0.0 0.0 1.0 5.53 8.99)"><foreignobject style="--ltx-fo-width:46.18em;--ltx-fo-height:10.29em;--ltx-fo-depth:0.25em;font-size:10pt;" height="145.91" overflow="visible" transform="matrix(1 0 0 -1 0 142.45)" width="639"><span class="ltx_foreignobject_container"><span class="ltx_foreignobject_content">
<span id="S3.SS0.SSS0.Px1.p3.pic1.2" class="ltx_inline-block ltx_minipage ltx_align_bottom" style="width:46.18em;">
<span id="S3.SS0.SSS0.Px1.p3.pic1.2.1" class="ltx_p"><span id="S3.SS0.SSS0.Px1.p3.pic1.2.1.1" class="ltx_text" style="--ltx-fg-color:#000000;">We stress that the A-BB certificate stated above is <span id="S3.SS0.SSS0.Px1.p3.pic1.2.1.1.1" class="ltx_text ltx_font_italic">local</span> to the fixed judgment context <math id="S3.SS0.SSS0.Px1.p3.pic1.m1" class="ltx_Math" alttext="D" display="inline" intent=":literal"><semantics><mi style="--ltx-fg-color:#000000;" mathcolor="#000000">D</mi><annotation encoding="application/x-tex">D</annotation></semantics></math> and the specific neighbor generator <math id="S3.SS0.SSS0.Px1.p3.pic1.m2" class="ltx_Math" alttext="T" display="inline" intent=":literal"><semantics><mi style="--ltx-fg-color:#000000;" mathcolor="#000000">T</mi><annotation encoding="application/x-tex">T</annotation></semantics></math> chosen for certification (as well as any unknown generators whose biasing effects are no larger than <math id="S3.SS0.SSS0.Px1.p3.pic1.m3" class="ltx_Math" alttext="T" display="inline" intent=":literal"><semantics><mi style="--ltx-fg-color:#000000;" mathcolor="#000000">T</mi><annotation encoding="application/x-tex">T</annotation></semantics></math>); it is <span id="S3.SS0.SSS0.Px1.p3.pic1.2.1.1.2" class="ltx_text ltx_font_italic">not</span> a distributional generalization guarantee over unseen contexts. For example, later in our experiments, <math id="S3.SS0.SSS0.Px1.p3.pic1.m4" class="ltx_Math" alttext="D" display="inline" intent=":literal"><semantics><mi style="--ltx-fg-color:#000000;" mathcolor="#000000">D</mi><annotation encoding="application/x-tex">D</annotation></semantics></math> will correspond to the batch of Arena-Hard-Auto comparisons judged by a fixed judge, and <math id="S3.SS0.SSS0.Px1.p3.pic1.m5" class="ltx_Math" alttext="T" display="inline" intent=":literal"><semantics><mi style="--ltx-fg-color:#000000;" mathcolor="#000000">T</mi><annotation encoding="application/x-tex">T</annotation></semantics></math> will sample from allowed contextual perturbations within that batch (see <a href="#S4" title="4 Experiments ‣ Towards Provably Unbiased LLM Judges via Bias-Bounded Evaluation" class="ltx_ref"><span class="ltx_text ltx_ref_tag">Section</span> <span class="ltx_text ltx_ref_tag">4</span></a> for exact details).</span></span>
</span></span></span></foreignobject></g></g></svg>