<br class="ltx_break">Metric 3 | score: [1] 
<br class="ltx_break">… 
<br class="ltx_break">
<br class="ltx_break">Final Weighted Score: [[200]] 
<br class="ltx_break">&lt;The End of Evaluation Result&gt; 
