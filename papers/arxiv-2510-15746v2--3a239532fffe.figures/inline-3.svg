<span id="A8.p3.pic1.1.1" class="ltx_p"><span id="A8.p3.pic1.1.1.1" class="ltx_text ltx_font_bold" style="--ltx-fg-color:#FFFFFF;">Comprehensive Evaluation of LLM Capabilities Problem Generation Named GenOverall</span></span>
</span></span></span></foreignobject></g><g fill-opacity="1.0" transform="matrix(1.0 0.0 0.0 1.0 13.78 107.79)"><foreignobject style="--ltx-fo-width:32.51em;--ltx-fo-height:8.68em;--ltx-fo-depth:6.79em;font-size:10pt;" height="214.17" overflow="visible" transform="matrix(1 0 0 -1 0 120.15)" width="449.85"><span class="ltx_foreignobject_container"><span class="ltx_foreignobject_content"><span id="A8.p3.pic1.2" class="ltx_inline-logical-block ltx_minipage ltx_align_bottom" style="width:32.51em;">
<span id="A8.p3.pic1.p2" class="ltx_para">
<span id="A8.p3.pic1.p2.1" class="ltx_p"><span id="A8.p3.pic1.p2.1.1" class="ltx_text" style="--ltx-fg-color:#000000;">Please generate <span id="A8.p3.pic1.p2.1.1.1" class="ltx_text ltx_font_bold">50 evaluation questions</span> designed to comprehensively assess the capabilities of large language models (LLMs). The questions should span a wide range of skills and reasoning dimensions.</span></span>
</span>
<span id="A8.p3.pic1.p1" class="ltx_para ltx_noindent">
<span id="A8.p3.pic1.p1.1" class="ltx_p"><span id="A8.p3.pic1.p1.1.1" class="ltx_text ltx_font_bold" style="--ltx-fg-color:#000000;">Requirements:</span></span>
</span>
<span id="A8.p3.pic1.p3" class="ltx_para">
<span id="A8.I5" class="ltx_enumerate">
<span id="A8.I5.i1" class="ltx_item" style="list-style-type:none;"><span class="ltx_tag ltx_tag_item">1.</span> 
<span id="A8.I5.i1.p1" class="ltx_para">
<span id="A8.I5.i1.p1.1" class="ltx_p"><span id="A8.I5.i1.p1.1.1" class="ltx_text" style="--ltx-fg-color:#000000;">Output format should be a JSON array in the following structure:</span></span>
</span>
<span id="A8.I5.i1.p2" class="ltx_para"><pre id="A8.I5.i1.p2.1" class="ltx_verbatim ltx_font_typewriter" style="--ltx-fg-color:#000000;">[
      {&quot;id&quot;: id, &quot;question&quot;: question}
    ]
    
</pre>
</span></span>
<span id="A8.I5.i2" class="ltx_item" style="list-style-type:none;"><span class="ltx_tag ltx_tag_item">2.</span> 
<span id="A8.I5.i2.p1" class="ltx_para">
<span id="A8.I5.i2.p1.1" class="ltx_p"><span id="A8.I5.i2.p1.1.1" class="ltx_text" style="--ltx-fg-color:#000000;">All questions should be written in </span><span id="A8.I5.i2.p1.1.2" class="ltx_text ltx_font_bold" style="--ltx-fg-color:#000000;">English</span><span id="A8.I5.i2.p1.1.3" class="ltx_text" style="--ltx-fg-color:#000000;">, using clear, precise, and instruction-oriented language.</span></span>
</span></span>
</span>
</span></span></span></span></foreignobject></g></g></svg>