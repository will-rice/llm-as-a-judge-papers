<svg id="S1.p4.pic1" class="ltx_picture" height="429.49" overflow="visible" version="1.1" viewbox="0 0 477.38 429.49" width="477.38"><g style="--ltx-stroke-color:#000000;--ltx-fill-color:#000000;" fill="#000000" stroke="#000000" stroke-width="0.4pt" transform="translate(0,429.49) matrix(1 0 0 -1 0 0)"><g style="--ltx-fill-color:#E1D4B3;" fill="#E1D4B3" fill-opacity="1.0"><path style="stroke:none" d="M 0 4.98 L 0 424.51 C 0 427.26 2.23 429.49 4.98 429.49 L 472.4 429.49 C 475.15 429.49 477.38 427.26 477.38 424.51 L 477.38 4.98 C 477.38 2.23 475.15 0 472.4 0 L 4.98 0 C 2.23 0 0 2.23 0 4.98 Z" /></g><g style="--ltx-fill-color:#FBF9F4;" fill="#FBF9F4" fill-opacity="1.0"><path style="stroke:none" d="M 0.83 4.98 L 0.83 424.51 C 0.83 426.8 2.69 428.66 4.98 428.66 L 472.4 428.66 C 474.69 428.66 476.55 426.8 476.55 424.51 L 476.55 4.98 C 476.55 2.69 474.69 0.83 472.4 0.83 L 4.98 0.83 C 2.69 0.83 0.83 2.69 0.83 4.98 Z" /></g><g fill-opacity="1.0" transform="matrix(1.0 0.0 0.0 1.0 11.69 388.74)"><foreignobject style="--ltx-fo-width:35.47em;--ltx-fo-height:2.35em;--ltx-fo-depth:27.5em;font-size:10pt;" height="413.04" overflow="visible" transform="matrix(1 0 0 -1 0 32.52)" width="490.8"><span class="ltx_foreignobject_container"><span class="ltx_foreignobject_content">
<span id="S1.p4.pic1.1" class="ltx_inline-block ltx_minipage ltx_align_bottom" style="width:35.47em;">
<span id="S1.p4.pic1.1.1" class="ltx_p"><span id="S1.p4.pic1.1.1.1" class="ltx_text ltx_font_bold" style="font-size:90%;--ltx-fg-color:#000000;">Contributions:<span id="S1.p4.pic1.1.1.1.1" class="ltx_text"></span></span></span>
<span id="S1.I1" class="ltx_enumerate ltx_leftmargin_flush">
<span id="S1.I1.i1" class="ltx_item" style="list-style-type:none;"><span class="ltx_tag ltx_tag_item">1.</span> 
<span id="S1.I1.i1.p1" class="ltx_para">
<span id="S1.I1.i1.p1.1" class="ltx_p"><span id="S1.I1.i1.p1.1.1" class="ltx_text ltx_font_bold" style="font-size:90%;--ltx-fg-color:#000000;">Recursive Self-Improvement under Non-Stationary Utilities.</span><span id="S1.I1.i1.p1.1.2" class="ltx_text" style="font-size:90%;--ltx-fg-color:#000000;">
The </span><span id="S1.I1.i1.p1.1.3" class="ltx_text ltx_font_typewriter" style="font-size:90%;--ltx-fg-color:#000000;">RQGM</span><span id="S1.I1.i1.p1.1.4" class="ltx_text" style="font-size:90%;--ltx-fg-color:#000000;"> extends self-improving agents beyond fixed evaluation by allowing the utility to change over the course of search (</span><a href="#S3" title="3 RQGM: Co-Evolving Agents and Their Evaluators" class="ltx_ref" style="font-size:90%;--ltx-fg-color:#000000;"><span class="ltx_text ltx_ref_tag">Sec.</span> <span class="ltx_text ltx_ref_tag">3</span></a><span id="S1.I1.i1.p1.1.5" class="ltx_text" style="font-size:90%;--ltx-fg-color:#000000;">). This supports both </span><em id="S1.I1.i1.p1.1.6" class="ltx_emph ltx_font_italic" style="font-size:90%;--ltx-fg-color:#000000;">learned evaluators</em><span id="S1.I1.i1.p1.1.7" class="ltx_text" style="font-size:90%;--ltx-fg-color:#000000;"> that act as agents-as-judges for downstream tasks and more general time-varying utilities, such as curricula over task and dataset partitions during search.</span></span>
</span></span>
<span id="S1.I1.i2" class="ltx_item" style="list-style-type:none;"><span class="ltx_tag ltx_tag_item">2.</span> 
<span id="S1.I1.i2.p1" class="ltx_para">
<span id="S1.I1.i2.p1.1" class="ltx_p"><span id="S1.I1.i2.p1.1.1" class="ltx_text ltx_font_bold" style="font-size:90%;--ltx-fg-color:#000000;">Controlled Utility Evolution.</span><span id="S1.I1.i2.p1.1.2" class="ltx_text" style="font-size:90%;--ltx-fg-color:#000000;"> Building on the above, this framework extends self-improvement to learned evaluators while anchoring progress to a ground-truth benchmark. However, benchmark-based supervision alone may impose a ceiling on evaluator quality. To move beyond this limit, we introduce additional selective pressure through adversarial objectives that regularize the search process, encouraging evaluators to continue improving beyond the level directly supported by the ground-truth signal.</span></span>
</span></span>
<span id="S1.I1.i3" class="ltx_item" style="list-style-type:none;"><span class="ltx_tag ltx_tag_item">3.</span> 
<span id="S1.I1.i3.p1" class="ltx_para">
<span id="S1.I1.i3.p1.1" class="ltx_p"><span id="S1.I1.i3.p1.1.1" class="ltx_text ltx_font_bold" style="font-size:90%;--ltx-fg-color:#000000;">Practical Benefits of Co-Evolved Learned Evaluators and Search Interventions.</span><span id="S1.I1.i3.p1.1.2" class="ltx_text" style="font-size:90%;--ltx-fg-color:#000000;">
Co-evolved learned evaluators improve both performance and search efficiency, yielding stronger coders than fixed-evaluator search, enabling search where direct benchmark feedback is unavailable, and supporting adversarial refinement of evaluators to correct failure modes such as over-leniency.</span></span>
</span></span>
</span>
</span></span></span></foreignobject></g></g></svg>