</span></span></span></foreignobject></g><g fill-opacity="1.0" transform="matrix(1.0 0.0 0.0 1.0 21.07 15.89)"><foreignobject style="--ltx-fo-width:44.16em;--ltx-fo-height:17.48em;--ltx-fo-depth:0.19em;font-size:10pt;" height="244.61" overflow="visible" transform="matrix(1 0 0 -1 0 241.92)" width="611.05"><span class="ltx_foreignobject_container"><span class="ltx_foreignobject_content">
<span id="S3.SS2.p1.pic1.2" class="ltx_inline-block ltx_minipage ltx_align_bottom" style="width:44.16em;">
<span id="S3.SS2.p1.pic1.2.1" class="ltx_p"><span id="S3.SS2.p1.pic1.2.1.1" class="ltx_text" style="--ltx-fg-color:#000000;">I want you to act as a Response Rewriter.
<br class="ltx_break">Your goal is to enhance the quality of the response given by an AI assistant to the #Given Prompt# through rewriting.
<br class="ltx_break">But the rewritten response must be reasonable and must be understood by humans.
<br class="ltx_break">Your rewriting cannot omit the non-text parts such as the emoji in #Given Prompt# and #Given Response#. 
<br class="ltx_break">If you think the response is already great enough, you can keep it unchanged.
<br class="ltx_break">You should try your best not to change the length of the response.
<br class="ltx_break">#Given Response# and #Rewritten Response# are not allowed to appear in #Rewritten Response#.
<br class="ltx_break">#Given Prompt#:
<br class="ltx_break">{<span id="S3.SS2.p1.pic1.2.1.1.1" class="ltx_text ltx_font_bold">prompt</span>}
<br class="ltx_break">#Given Response#:
<br class="ltx_break">{<span id="S3.SS2.p1.pic1.2.1.1.2" class="ltx_text ltx_font_bold">response</span>}
<br class="ltx_break">#Rewritten Response#:</span></span>
</span></span></span></foreignobject></g></g></svg>