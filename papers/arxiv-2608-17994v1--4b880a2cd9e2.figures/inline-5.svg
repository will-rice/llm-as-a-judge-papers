<span id="A2.SS4.p2.pic1.1" class="ltx_inline-block ltx_minipage ltx_align_bottom" style="width:31.84em;">
<span id="A2.SS4.p2.pic1.1.1" class="ltx_p"><span id="A2.SS4.p2.pic1.1.1.1" class="ltx_text ltx_font_bold" style="--ltx-fg-color:#FFFFFF;">LLM Evaluator (Admission Function)</span></span>
</span></span></span></foreignobject></g><g fill-opacity="1.0" transform="matrix(1.0 0.0 0.0 1.0 21.65 16.47)"><foreignobject style="--ltx-fo-width:36.62em;--ltx-fo-height:18.09em;--ltx-fo-depth:0.19em;font-size:10pt;" height="253.07" overflow="visible" transform="matrix(1 0 0 -1 0 250.38)" width="506.72"><span class="ltx_foreignobject_container"><span class="ltx_foreignobject_content">
<span id="A2.SS4.p2.pic1.2" class="ltx_inline-block ltx_minipage ltx_align_bottom" style="width:36.62em;">
<span id="A2.SS4.p2.pic1.2.1" class="ltx_p"><span id="A2.SS4.p2.pic1.2.1.1" class="ltx_text" style="--ltx-fg-color:#000000;">You are a helpful assistant acting as an impartial evaluator. Given a question, a candidate answer, and reference answers, determine if the candidate answer is correct.</span></span>
<span id="A2.SS4.p2.pic1.2.2" class="ltx_p"><span id="A2.SS4.p2.pic1.2.2.1" class="ltx_text" style="--ltx-fg-color:#000000;">The candidate answer is correct if it conveys the same meaning as ANY of the reference answers, even if the candidate answer is longer, contains additional explanation, uses synonyms, abbreviations, or alternate names. Focus on whether the final answer or conclusion matches a reference, not on surface form.</span></span>
<span id="A2.SS4.p2.pic1.2.3" class="ltx_p"><span id="A2.SS4.p2.pic1.2.3.1" class="ltx_text" style="--ltx-fg-color:#000000;">Question: <span id="A2.SS4.p2.pic1.2.3.1.1" class="ltx_text ltx_font_typewriter">{question}</span></span></span>
<span id="A2.SS4.p2.pic1.2.4" class="ltx_p"><span id="A2.SS4.p2.pic1.2.4.1" class="ltx_text" style="--ltx-fg-color:#000000;">Candidate Answer: <span id="A2.SS4.p2.pic1.2.4.1.1" class="ltx_text ltx_font_typewriter">{candidate_answer}</span></span></span>
<span id="A2.SS4.p2.pic1.2.5" class="ltx_p"><span id="A2.SS4.p2.pic1.2.5.1" class="ltx_text" style="--ltx-fg-color:#000000;">Reference Answers: <span id="A2.SS4.p2.pic1.2.5.1.1" class="ltx_text ltx_font_typewriter">{references}</span></span></span>
<span id="A2.SS4.p2.pic1.2.6" class="ltx_p"><span id="A2.SS4.p2.pic1.2.6.1" class="ltx_text" style="--ltx-fg-color:#000000;">Is the candidate answer correct? Respond with ONLY “True” or “False”.</span></span>
</span></span></span></foreignobject></g></g></svg>