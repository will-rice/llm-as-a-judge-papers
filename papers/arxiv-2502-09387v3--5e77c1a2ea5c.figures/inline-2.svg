<span id="A2.F4.p1.pic1.1.1" class="ltx_p"><span id="A2.F4.p1.pic1.1.1.1" class="ltx_text" style="--ltx-fg-color:#000000;">You are tasked with translating specific fields of a JSON object from English to {LANG}. Here is the JSON object you will be working with:</span></span>
<span id="A2.F4.p1.pic1.1.2" class="ltx_p"><span id="A2.F4.p1.pic1.1.2.1" class="ltx_text" style="--ltx-fg-color:#000000;">&lt;json_object&gt;</span></span>
<span id="A2.F4.p1.pic1.1.3" class="ltx_p"><span id="A2.F4.p1.pic1.1.3.1" class="ltx_text" style="--ltx-fg-color:#000000;">{JSON_OBJECT}</span></span>
<span id="A2.F4.p1.pic1.1.4" class="ltx_p"><span id="A2.F4.p1.pic1.1.4.1" class="ltx_text" style="--ltx-fg-color:#000000;">&lt;/json_object&gt;</span></span>
<span id="A2.F4.p1.pic1.1.5" class="ltx_p"><span id="A2.F4.p1.pic1.1.5.1" class="ltx_text" style="--ltx-fg-color:#000000;">Your task is to translate the following fields into LANG:</span></span>
<span id="A2.F4.p1.pic1.1.6" class="ltx_p"><span id="A2.F4.p1.pic1.1.6.1" class="ltx_text" style="--ltx-fg-color:#000000;">- question</span></span>
<span id="A2.F4.p1.pic1.1.7" class="ltx_p"><span id="A2.F4.p1.pic1.1.7.1" class="ltx_text" style="--ltx-fg-color:#000000;">- best_answer</span></span>
<span id="A2.F4.p1.pic1.1.8" class="ltx_p"><span id="A2.F4.p1.pic1.1.8.1" class="ltx_text" style="--ltx-fg-color:#000000;">- correct_answers</span></span>
<span id="A2.F4.p1.pic1.1.9" class="ltx_p"><span id="A2.F4.p1.pic1.1.9.1" class="ltx_text" style="--ltx-fg-color:#000000;">- incorrect_answers</span></span>
<span id="A2.F4.p1.pic1.1.10" class="ltx_p"><span id="A2.F4.p1.pic1.1.10.1" class="ltx_text" style="--ltx-fg-color:#000000;">Important guidelines:</span></span>
<span id="A2.F4.p1.pic1.1.11" class="ltx_p"><span id="A2.F4.p1.pic1.1.11.1" class="ltx_text" style="--ltx-fg-color:#000000;">1. Maintain the original structure of the JSON object.</span></span>
<span id="A2.F4.p1.pic1.1.12" class="ltx_p"><span id="A2.F4.p1.pic1.1.12.1" class="ltx_text" style="--ltx-fg-color:#000000;">2. Only translate the content of the specified fields.</span></span>
<span id="A2.F4.p1.pic1.1.13" class="ltx_p"><span id="A2.F4.p1.pic1.1.13.1" class="ltx_text" style="--ltx-fg-color:#000000;">3. Do not translate proper nouns.</span></span>
<span id="A2.F4.p1.pic1.1.14" class="ltx_p"><span id="A2.F4.p1.pic1.1.14.1" class="ltx_text" style="--ltx-fg-color:#000000;">4. If a field contains an array, translate each element of the array. Make sure to translate every sentence and do not add any new sentence.</span></span>
<span id="A2.F4.p1.pic1.1.15" class="ltx_p"><span id="A2.F4.p1.pic1.1.15.1" class="ltx_text" style="--ltx-fg-color:#000000;">5. Check that the resulting arrays have the same number of elements as the original arrays.</span></span>
<span id="A2.F4.p1.pic1.1.16" class="ltx_p"><span id="A2.F4.p1.pic1.1.16.1" class="ltx_text" style="--ltx-fg-color:#000000;">6. Preserve any formatting or special characters present in the original text.</span></span>
<span id="A2.F4.p1.pic1.1.17" class="ltx_p"><span id="A2.F4.p1.pic1.1.17.1" class="ltx_text" style="--ltx-fg-color:#000000;">If you encounter any content that should not be translated or you’re unsure about, leave it in its original form.</span></span>
<span id="A2.F4.p1.pic1.1.18" class="ltx_p"><span id="A2.F4.p1.pic1.1.18.1" class="ltx_text" style="--ltx-fg-color:#000000;">Provide the entire translated JSON object as your output. Do not include any comments or explanations outside of the JSON object.</span></span>
