<span id="A5.T6.pic1.2" class="ltx_inline-block ltx_minipage ltx_align_bottom" style="width:44.2em;">
<span id="A5.T6.pic1.2.1" class="ltx_p"><span id="A5.T6.pic1.2.1.1" class="ltx_text" style="--ltx-fg-color:#000000;"># Instructions</span></span>
<span id="A5.T6.pic1.2.2" class="ltx_p"><span id="A5.T6.pic1.2.2.1" class="ltx_text" style="--ltx-fg-color:#000000;">Your task is to define a rubric evaluating the **completeness** of an answer to a medical question. We define **completeness** as:</span></span>
<span id="A5.T6.pic1.2.3" class="ltx_p"><span id="A5.T6.pic1.2.3.1" class="ltx_text" style="--ltx-fg-color:#000000;">whether a response includes all important information needed to be safe and helpful to the user. Even if accurate, a response that is incomplete (e.g., omitting key steps or red flags) can still result in low-quality advice or harm.</span></span>
<span id="A5.T6.pic1.2.4" class="ltx_p"><span id="A5.T6.pic1.2.4.1" class="ltx_text" style="--ltx-fg-color:#000000;">You will be provided a medical question from a user. Write criteria that the assistant’s next message will need to include for the message to be **complete**.</span></span>
<span id="A5.T6.pic1.2.5" class="ltx_p"><span id="A5.T6.pic1.2.5.1" class="ltx_text" style="--ltx-fg-color:#000000;">Return your answer in JSONLines format. Do not include any other text in the response.</span></span><pre id="A5.T6.pic1.2.6" class="ltx_verbatim" style="--ltx-fg-color:#000000;">“‘json
[
    {
        &quot;criteria&quot;: &quot;&quot;
    },
    {
        &quot;criteria&quot;: &quot;&quot;
    }
]
“‘
</pre>
<span id="A5.T6.pic1.2.7" class="ltx_p"><span id="A5.T6.pic1.2.7.1" class="ltx_text" style="--ltx-fg-color:#000000;"># Examples</span></span>
<span id="A5.T6.pic1.2.8" class="ltx_p"><span id="A5.T6.pic1.2.8.1" class="ltx_text" style="--ltx-fg-color:#000000;">{examples }</span></span>
<span id="A5.T6.pic1.2.9" class="ltx_p"><span id="A5.T6.pic1.2.9.1" class="ltx_text" style="--ltx-fg-color:#000000;"># Your Task</span></span>
<span id="A5.T6.pic1.2.10" class="ltx_p"><span id="A5.T6.pic1.2.10.1" class="ltx_text" style="--ltx-fg-color:#000000;">## Question</span></span>
<span id="A5.T6.pic1.2.11" class="ltx_p"><span id="A5.T6.pic1.2.11.1" class="ltx_text" style="--ltx-fg-color:#000000;">{question }</span></span>
