<svg id="S15.SS0.SSS0.Px16.p2.pic1" class="ltx_picture" height="445.44" overflow="visible" version="1.1" viewbox="0 0 477.38 445.44" width="477.38"><g style="--ltx-stroke-color:#000000;--ltx-fill-color:#000000;" fill="#000000" stroke="#000000" stroke-width="0.4pt" transform="translate(0,445.44) matrix(1 0 0 -1 0 0)"><g style="--ltx-fill-color:#BF0000;" fill="#BF0000" fill-opacity="1.0"><path style="stroke:none" d="M 0 5.91 L 0 439.53 C 0 442.8 2.64 445.44 5.91 445.44 L 471.47 445.44 C 474.73 445.44 477.38 442.8 477.38 439.53 L 477.38 5.91 C 477.38 2.64 474.73 0 471.47 0 L 5.91 0 C 2.64 0 0 2.64 0 5.91 Z" /></g><g style="--ltx-fill-color:#FFF2F2;" fill="#FFF2F2" fill-opacity="1.0"><path style="stroke:none" d="M 1.97 5.91 L 1.97 419.79 L 475.41 419.79 L 475.41 5.91 C 475.41 3.73 473.65 1.97 471.47 1.97 L 5.91 1.97 C 3.73 1.97 1.97 3.73 1.97 5.91 Z" /></g><g fill-opacity="1.0" transform="matrix(1.0 0.0 0.0 1.0 21.65 429.16)"><foreignobject style="--ltx-fo-width:31.37em;--ltx-fo-height:0.75em;--ltx-fo-depth:0.25em;font-size:10pt;" height="13.84" overflow="visible" transform="matrix(1 0 0 -1 0 10.38)" width="434.07"><span class="ltx_foreignobject_container"><span class="ltx_foreignobject_content">
<span id="S15.SS0.SSS0.Px16.p2.pic1.1" class="ltx_inline-block ltx_minipage ltx_align_bottom" style="width:31.37em;">
<span id="S15.SS0.SSS0.Px16.p2.pic1.1.1" class="ltx_p"><a href="https://codeforces.com/problemset/problem/2091/D" title class="ltx_ref ltx_href" style="--ltx-fg-color:#FFFFFF;">Example Binary Search Problem (Rated 1200)</a></span>
</span></span></span></foreignobject></g><g fill-opacity="1.0" transform="matrix(1.0 0.0 0.0 1.0 21.65 16.47)"><foreignobject style="--ltx-fo-width:31.37em;--ltx-fo-height:28.29em;--ltx-fo-depth:0.19em;font-size:10pt;" height="394.21" overflow="visible" transform="matrix(1 0 0 -1 0 391.51)" width="434.07"><span class="ltx_foreignobject_container"><span class="ltx_foreignobject_content">
<span id="S15.SS0.SSS0.Px16.p2.pic1.2" class="ltx_inline-block ltx_minipage ltx_align_bottom" style="width:31.37em;">
<span id="S15.SS0.SSS0.Px16.p2.pic1.2.1" class="ltx_p"><span id="S15.SS0.SSS0.Px16.p2.pic1.2.1.1" class="ltx_text" style="--ltx-fg-color:#000000;">For the final of the first Olympiad by IT Campus ”NEIMARK”, a rectangular venue was prepared. You may assume that the venue is divided into <math id="S15.SS0.SSS0.Px16.p2.pic1.m1" class="ltx_Math" alttext="n" display="inline" intent=":literal"><semantics><mi style="--ltx-fg-color:#000000;" mathcolor="#000000">n</mi><annotation encoding="application/x-tex">n</annotation></semantics></math> rows, each containing <math id="S15.SS0.SSS0.Px16.p2.pic1.m2" class="ltx_Math" alttext="m" display="inline" intent=":literal"><semantics><mi style="--ltx-fg-color:#000000;" mathcolor="#000000">m</mi><annotation encoding="application/x-tex">m</annotation></semantics></math> spots for partcipants’ desks. A total of <math id="S15.SS0.SSS0.Px16.p2.pic1.m3" class="ltx_Math" alttext="k" display="inline" intent=":literal"><semantics><mi style="--ltx-fg-color:#000000;" mathcolor="#000000">k</mi><annotation encoding="application/x-tex">k</annotation></semantics></math> participants have registered for the final, and each participant will sit at an individual desk. Now, the organizing committee must choose the locations for the desks in the venue. 
<br class="ltx_break">
<br class="ltx_break">Each desk occupies one of the <math id="S15.SS0.SSS0.Px16.p2.pic1.m4" class="ltx_Math" alttext="m" display="inline" intent=":literal"><semantics><mi style="--ltx-fg-color:#000000;" mathcolor="#000000">m</mi><annotation encoding="application/x-tex">m</annotation></semantics></math> spots in a row. Moreover, if several desks occupy consecutive spots in the same row, we call such a group of desks a <span id="S15.SS0.SSS0.Px16.p2.pic1.2.1.1.1" class="ltx_text ltx_font_italic">bench</span>, and the number of desks in the group is the bench’s length. 
<br class="ltx_break">
<br class="ltx_break">The organizing committee wants to choose the locations so that the length of the longest bench is as small as possible. 
<br class="ltx_break">
<br class="ltx_break">Given the integers <math id="S15.SS0.SSS0.Px16.p2.pic1.m5" class="ltx_Math" alttext="n,m" display="inline" intent=":literal"><semantics><mrow><mi style="--ltx-fg-color:#000000;" mathcolor="#000000">n</mi><mo style="--ltx-fg-color:#000000;" mathcolor="#000000">,</mo><mi style="--ltx-fg-color:#000000;" mathcolor="#000000">m</mi></mrow><annotation encoding="application/x-tex">n,m</annotation></semantics></math>, and <math id="S15.SS0.SSS0.Px16.p2.pic1.m6" class="ltx_Math" alttext="k," display="inline" intent=":literal"><semantics><mrow><mi style="--ltx-fg-color:#000000;" mathcolor="#000000">k</mi><mo style="--ltx-fg-color:#000000;" mathcolor="#000000">,</mo></mrow><annotation encoding="application/x-tex">k,</annotation></semantics></math> determine the minimum possible length of the longest bench. 
<br class="ltx_break">
<br class="ltx_break"><span id="S15.SS0.SSS0.Px16.p2.pic1.2.1.1.2" class="ltx_text ltx_font_bold">Input</span> 
<br class="ltx_break">Each test contains multiple test cases. The first line contains the number of test cases <math id="S15.SS0.SSS0.Px16.p2.pic1.m7" class="ltx_Math" alttext="t\ (1\leq t\leq 10^{4})" display="inline" intent=":literal"><semantics><mrow><mi style="--ltx-fg-color:#000000;" mathcolor="#000000">t</mi><mo lspace="0.500em">⁡</mo><mrow><mo style="--ltx-fg-color:#000000;" mathcolor="#000000" stretchy="false">(</mo><mrow><mn style="--ltx-fg-color:#000000;" mathcolor="#000000">1</mn><mo style="--ltx-fg-color:#000000;" mathcolor="#000000">≤</mo><mi style="--ltx-fg-color:#000000;" mathcolor="#000000">t</mi><mo style="--ltx-fg-color:#000000;" mathcolor="#000000">≤</mo><msup><mn style="--ltx-fg-color:#000000;" mathcolor="#000000">10</mn><mn style="--ltx-fg-color:#000000;" mathcolor="#000000">4</mn></msup></mrow><mo style="--ltx-fg-color:#000000;" mathcolor="#000000" stretchy="false">)</mo></mrow></mrow><annotation encoding="application/x-tex">t\ (1\leq t\leq 10^{4})</annotation></semantics></math>. The description of the test cases follows. 
<br class="ltx_break">
<br class="ltx_break">A single line of each test case contains three positive integers —<math id="S15.SS0.SSS0.Px16.p2.pic1.m8" class="ltx_Math" alttext="n,m,k\ (1\leq n,m,k\leq 10^{9},k\leq n\cdot m)" display="inline" intent=":literal"><semantics><mrow><mi style="--ltx-fg-color:#000000;" mathcolor="#000000">n</mi><mo style="--ltx-fg-color:#000000;" mathcolor="#000000">,</mo><mi style="--ltx-fg-color:#000000;" mathcolor="#000000">m</mi><mo style="--ltx-fg-color:#000000;" mathcolor="#000000">,</mo><mrow><mi style="--ltx-fg-color:#000000;" mathcolor="#000000">k</mi><mo lspace="0.500em">⁡</mo><mrow><mo style="--ltx-fg-color:#000000;" mathcolor="#000000" stretchy="false">(</mo><mrow><mn style="--ltx-fg-color:#000000;" mathcolor="#000000">1</mn><mo style="--ltx-fg-color:#000000;" mathcolor="#000000">≤</mo><mi style="--ltx-fg-color:#000000;" mathcolor="#000000">n</mi></mrow><mo style="--ltx-fg-color:#000000;" mathcolor="#000000">,</mo><mi style="--ltx-fg-color:#000000;" mathcolor="#000000">m</mi><mo style="--ltx-fg-color:#000000;" mathcolor="#000000">,</mo><mrow><mi style="--ltx-fg-color:#000000;" mathcolor="#000000">k</mi><mo style="--ltx-fg-color:#000000;" mathcolor="#000000">≤</mo><msup><mn style="--ltx-fg-color:#000000;" mathcolor="#000000">10</mn><mn style="--ltx-fg-color:#000000;" mathcolor="#000000">9</mn></msup></mrow><mo style="--ltx-fg-color:#000000;" mathcolor="#000000">,</mo><mrow><mi style="--ltx-fg-color:#000000;" mathcolor="#000000">k</mi><mo style="--ltx-fg-color:#000000;" mathcolor="#000000">≤</mo><mrow><mi style="--ltx-fg-color:#000000;" mathcolor="#000000">n</mi><mo style="--ltx-fg-color:#000000;" lspace="0.222em" mathcolor="#000000" rspace="0.222em">⋅</mo><mi style="--ltx-fg-color:#000000;" mathcolor="#000000">m</mi></mrow></mrow><mo style="--ltx-fg-color:#000000;" mathcolor="#000000" stretchy="false">)</mo></mrow></mrow></mrow><annotation encoding="application/x-tex">n,m,k\ (1\leq n,m,k\leq 10^{9},k\leq n\cdot m)</annotation></semantics></math>. 
<br class="ltx_break">
<br class="ltx_break"><span id="S15.SS0.SSS0.Px16.p2.pic1.2.1.1.3" class="ltx_text ltx_font_bold">Output</span> 
<br class="ltx_break">For each test case, output a single number —the minimum possible length of the longest bench.</span></span>
</span></span></span></foreignobject></g></g></svg>