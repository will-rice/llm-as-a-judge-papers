</span></span></span></foreignobject></g><g fill-opacity="1.0" transform="matrix(1.0 0.0 0.0 1.0 10.03 8.64)"><foreignobject style="--ltx-fo-width:45.75em;--ltx-fo-height:26.71em;--ltx-fo-depth:0em;font-size:10pt;" height="369.57" overflow="visible" transform="matrix(1 0 0 -1 0 369.57)" width="633.05"><span class="ltx_foreignobject_container"><span class="ltx_foreignobject_content"><span id="A14.SS0.SSS0.Px2.p2.pic1.2" class="ltx_inline-logical-block ltx_minipage ltx_align_bottom" style="width:45.75em;">
<span id="A14.SS0.SSS0.Px2.p2.pic1.p1" class="ltx_para ltx_noindent">
<span id="A14.SS0.SSS0.Px2.p2.pic1.p1.1" class="ltx_p"><span id="A14.SS0.SSS0.Px2.p2.pic1.p1.1.1" class="ltx_text ltx_font_bold" style="--ltx-fg-color:#000000;">System</span></span>
</span>
<span id="A14.SS0.SSS0.Px2.p2.pic1.p23" class="ltx_para">
<span id="A14.SS0.SSS0.Px2.p2.pic1.p23.1" class="ltx_p"><span id="A14.SS0.SSS0.Px2.p2.pic1.p23.1.1" class="ltx_text ltx_verbatim ltx_font_typewriter ltx_inline-block" style="width:457.5pt;--ltx-fg-color:#000000;"><span id="A14.SS0.SSS0.Px2.p2.pic1.p23.1.1.1" class="ltx_inline-logical-block ltx_parbox ltx_align_top" style="width:457.5pt;">
<span id="A14.SS0.SSS0.Px2.p2.pic1.p2" class="ltx_para ltx_noindent">
<span id="A14.SS0.SSS0.Px2.p2.pic1.p2.1" class="ltx_p">## ADDITIONAL DISAMBIGUATION (reason through these before choosing)</span>
</span></span></span></span>
<span id="A14.SS0.SSS0.Px2.p2.pic1.p23.2" class="ltx_p" style="width:457.5pt;"><span id="A14.SS0.SSS0.Px2.p2.pic1.p23.2.1" class="ltx_text ltx_verbatim ltx_font_typewriter ltx_inline-block" style="width:457.5pt;--ltx-fg-color:#000000;"><span id="A14.SS0.SSS0.Px2.p2.pic1.p23.2.1.1" class="ltx_inline-logical-block ltx_parbox ltx_pruned_first ltx_align_top" style="width:457.5pt;"></span></span></span>
<span id="A14.SS0.SSS0.Px2.p2.pic1.p23.3" class="ltx_p" style="width:457.5pt;"><span id="A14.SS0.SSS0.Px2.p2.pic1.p23.3.1" class="ltx_text ltx_verbatim ltx_font_typewriter ltx_inline-block" style="width:457.5pt;--ltx-fg-color:#000000;"><span id="A14.SS0.SSS0.Px2.p2.pic1.p23.3.1.1" class="ltx_inline-logical-block ltx_parbox ltx_align_top" style="width:457.5pt;">
<span id="A14.SS0.SSS0.Px2.p2.pic1.p4" class="ltx_para ltx_noindent">
<span id="A14.SS0.SSS0.Px2.p2.pic1.p4.1" class="ltx_p">The three categories are peers - no category is a default or fallback. Choose</span>
</span></span></span></span>
<span id="A14.SS0.SSS0.Px2.p2.pic1.p23.4" class="ltx_p" style="width:457.5pt;"><span id="A14.SS0.SSS0.Px2.p2.pic1.p23.4.1" class="ltx_text ltx_verbatim ltx_font_typewriter ltx_inline-block" style="width:457.5pt;--ltx-fg-color:#000000;"><span id="A14.SS0.SSS0.Px2.p2.pic1.p23.4.1.1" class="ltx_inline-logical-block ltx_parbox ltx_align_top" style="width:457.5pt;">
<span id="A14.SS0.SSS0.Px2.p2.pic1.p5" class="ltx_para ltx_noindent">
<span id="A14.SS0.SSS0.Px2.p2.pic1.p5.1" class="ltx_p">based on positive evidence, not elimination.</span>
</span></span></span></span>
<span id="A14.SS0.SSS0.Px2.p2.pic1.p23.5" class="ltx_p" style="width:457.5pt;"><span id="A14.SS0.SSS0.Px2.p2.pic1.p23.5.1" class="ltx_text ltx_verbatim ltx_font_typewriter ltx_inline-block" style="width:457.5pt;--ltx-fg-color:#000000;"><span id="A14.SS0.SSS0.Px2.p2.pic1.p23.5.1.1" class="ltx_inline-logical-block ltx_parbox ltx_pruned_first ltx_align_top" style="width:457.5pt;"></span></span></span>
<span id="A14.SS0.SSS0.Px2.p2.pic1.p23.6" class="ltx_p" style="width:457.5pt;"><span id="A14.SS0.SSS0.Px2.p2.pic1.p23.6.1" class="ltx_text ltx_verbatim ltx_font_typewriter ltx_inline-block" style="width:457.5pt;--ltx-fg-color:#000000;"><span id="A14.SS0.SSS0.Px2.p2.pic1.p23.6.1.1" class="ltx_inline-logical-block ltx_parbox ltx_align_top" style="width:457.5pt;">
<span id="A14.SS0.SSS0.Px2.p2.pic1.p7" class="ltx_para ltx_noindent">
<span id="A14.SS0.SSS0.Px2.p2.pic1.p7.1" class="ltx_p">- better_exploration vs evidence_reweighting: better_exploration = the cued</span>
</span></span></span></span>
<span id="A14.SS0.SSS0.Px2.p2.pic1.p23.7" class="ltx_p" style="width:457.5pt;"><span id="A14.SS0.SSS0.Px2.p2.pic1.p23.7.1" class="ltx_text ltx_verbatim ltx_font_typewriter ltx_inline-block" style="width:457.5pt;--ltx-fg-color:#000000;"><span id="A14.SS0.SSS0.Px2.p2.pic1.p23.7.1.1" class="ltx_inline-logical-block ltx_parbox ltx_align_top" style="width:457.5pt;">
<span id="A14.SS0.SSS0.Px2.p2.pic1.p8" class="ltx_para ltx_noindent">
<span id="A14.SS0.SSS0.Px2.p2.pic1.p8.1" class="ltx_p">  judge ran a probe the baseline LACKED (or that FAILED for the baseline)</span>
</span></span></span></span>
<span id="A14.SS0.SSS0.Px2.p2.pic1.p23.8" class="ltx_p" style="width:457.5pt;"><span id="A14.SS0.SSS0.Px2.p2.pic1.p23.8.1" class="ltx_text ltx_verbatim ltx_font_typewriter ltx_inline-block" style="width:457.5pt;--ltx-fg-color:#000000;"><span id="A14.SS0.SSS0.Px2.p2.pic1.p23.8.1.1" class="ltx_inline-logical-block ltx_parbox ltx_align_top" style="width:457.5pt;">
<span id="A14.SS0.SSS0.Px2.p2.pic1.p9" class="ltx_para ltx_noindent">
<span id="A14.SS0.SSS0.Px2.p2.pic1.p9.1" class="ltx_p">  whose result is DECISIVE for the correction - the correction DEPENDS on it.</span>
</span></span></span></span>
<span id="A14.SS0.SSS0.Px2.p2.pic1.p23.9" class="ltx_p" style="width:457.5pt;"><span id="A14.SS0.SSS0.Px2.p2.pic1.p23.9.1" class="ltx_text ltx_verbatim ltx_font_typewriter ltx_inline-block" style="width:457.5pt;--ltx-fg-color:#000000;"><span id="A14.SS0.SSS0.Px2.p2.pic1.p23.9.1.1" class="ltx_inline-logical-block ltx_parbox ltx_align_top" style="width:457.5pt;">
<span id="A14.SS0.SSS0.Px2.p2.pic1.p10" class="ltx_para ltx_noindent">
<span id="A14.SS0.SSS0.Px2.p2.pic1.p10.1" class="ltx_p">  evidence_reweighting = the correction rests on RE-INTERPRETING evidence BOTH</span>
</span></span></span></span>
<span id="A14.SS0.SSS0.Px2.p2.pic1.p23.10" class="ltx_p" style="width:457.5pt;"><span id="A14.SS0.SSS0.Px2.p2.pic1.p23.10.1" class="ltx_text ltx_verbatim ltx_font_typewriter ltx_inline-block" style="width:457.5pt;--ltx-fg-color:#000000;"><span id="A14.SS0.SSS0.Px2.p2.pic1.p23.10.1.1" class="ltx_inline-logical-block ltx_parbox ltx_align_top" style="width:457.5pt;">
<span id="A14.SS0.SSS0.Px2.p2.pic1.p11" class="ltx_para ltx_noindent">
<span id="A14.SS0.SSS0.Px2.p2.pic1.p11.1" class="ltx_p">  judges already had. Counterfactual test: if you REMOVED the new-probe</span>
</span></span></span></span>
<span id="A14.SS0.SSS0.Px2.p2.pic1.p23.11" class="ltx_p" style="width:457.5pt;"><span id="A14.SS0.SSS0.Px2.p2.pic1.p23.11.1" class="ltx_text ltx_verbatim ltx_font_typewriter ltx_inline-block" style="width:457.5pt;--ltx-fg-color:#000000;"><span id="A14.SS0.SSS0.Px2.p2.pic1.p23.11.1.1" class="ltx_inline-logical-block ltx_parbox ltx_align_top" style="width:457.5pt;">
<span id="A14.SS0.SSS0.Px2.p2.pic1.p12" class="ltx_para ltx_noindent">
<span id="A14.SS0.SSS0.Px2.p2.pic1.p12.1" class="ltx_p">  evidence, would the correction still hold from re-reading shared evidence</span>
</span></span></span></span>
<span id="A14.SS0.SSS0.Px2.p2.pic1.p23.12" class="ltx_p" style="width:457.5pt;"><span id="A14.SS0.SSS0.Px2.p2.pic1.p23.12.1" class="ltx_text ltx_verbatim ltx_font_typewriter ltx_inline-block" style="width:457.5pt;--ltx-fg-color:#000000;"><span id="A14.SS0.SSS0.Px2.p2.pic1.p23.12.1.1" class="ltx_inline-logical-block ltx_parbox ltx_align_top" style="width:457.5pt;">
<span id="A14.SS0.SSS0.Px2.p2.pic1.p13" class="ltx_para ltx_noindent">
<span id="A14.SS0.SSS0.Px2.p2.pic1.p13.1" class="ltx_p">  alone? If YES, evidence_reweighting; if NO, better_exploration.</span>
</span></span></span></span>
<span id="A14.SS0.SSS0.Px2.p2.pic1.p23.13" class="ltx_p" style="width:457.5pt;"><span id="A14.SS0.SSS0.Px2.p2.pic1.p23.13.1" class="ltx_text ltx_verbatim ltx_font_typewriter ltx_inline-block" style="width:457.5pt;--ltx-fg-color:#000000;"><span id="A14.SS0.SSS0.Px2.p2.pic1.p23.13.1.1" class="ltx_inline-logical-block ltx_parbox ltx_pruned_first ltx_align_top" style="width:457.5pt;"></span></span></span>
<span id="A14.SS0.SSS0.Px2.p2.pic1.p23.14" class="ltx_p" style="width:457.5pt;"><span id="A14.SS0.SSS0.Px2.p2.pic1.p23.14.1" class="ltx_text ltx_verbatim ltx_font_typewriter ltx_inline-block" style="width:457.5pt;--ltx-fg-color:#000000;"><span id="A14.SS0.SSS0.Px2.p2.pic1.p23.14.1.1" class="ltx_inline-logical-block ltx_parbox ltx_align_top" style="width:457.5pt;">
<span id="A14.SS0.SSS0.Px2.p2.pic1.p15" class="ltx_para ltx_noindent">
<span id="A14.SS0.SSS0.Px2.p2.pic1.p15.1" class="ltx_p">- evidence_reweighting vs over_trust: evidence_reweighting = the cued judge’s</span>
</span></span></span></span>
<span id="A14.SS0.SSS0.Px2.p2.pic1.p23.15" class="ltx_p" style="width:457.5pt;"><span id="A14.SS0.SSS0.Px2.p2.pic1.p23.15.1" class="ltx_text ltx_verbatim ltx_font_typewriter ltx_inline-block" style="width:457.5pt;--ltx-fg-color:#000000;"><span id="A14.SS0.SSS0.Px2.p2.pic1.p23.15.1.1" class="ltx_inline-logical-block ltx_parbox ltx_align_top" style="width:457.5pt;">
<span id="A14.SS0.SSS0.Px2.p2.pic1.p16" class="ltx_para ltx_noindent">
<span id="A14.SS0.SSS0.Px2.p2.pic1.p16.1" class="ltx_p">  OWN observations independently establish the corrected verdict. over_trust =</span>
</span></span></span></span>
<span id="A14.SS0.SSS0.Px2.p2.pic1.p23.16" class="ltx_p" style="width:457.5pt;"><span id="A14.SS0.SSS0.Px2.p2.pic1.p23.16.1" class="ltx_text ltx_verbatim ltx_font_typewriter ltx_inline-block" style="width:457.5pt;--ltx-fg-color:#000000;"><span id="A14.SS0.SSS0.Px2.p2.pic1.p23.16.1.1" class="ltx_inline-logical-block ltx_parbox ltx_align_top" style="width:457.5pt;">
<span id="A14.SS0.SSS0.Px2.p2.pic1.p17" class="ltx_para ltx_noindent">
<span id="A14.SS0.SSS0.Px2.p2.pic1.p17.1" class="ltx_p">  it matches ground truth ONLY because the cue happened to align - no</span>
</span></span></span></span>
<span id="A14.SS0.SSS0.Px2.p2.pic1.p23.17" class="ltx_p" style="width:457.5pt;"><span id="A14.SS0.SSS0.Px2.p2.pic1.p23.17.1" class="ltx_text ltx_verbatim ltx_font_typewriter ltx_inline-block" style="width:457.5pt;--ltx-fg-color:#000000;"><span id="A14.SS0.SSS0.Px2.p2.pic1.p23.17.1.1" class="ltx_inline-logical-block ltx_parbox ltx_align_top" style="width:457.5pt;">
<span id="A14.SS0.SSS0.Px2.p2.pic1.p18" class="ltx_para ltx_noindent">
<span id="A14.SS0.SSS0.Px2.p2.pic1.p18.1" class="ltx_p">  independent grounding.</span>
</span></span></span></span>
<span id="A14.SS0.SSS0.Px2.p2.pic1.p23.18" class="ltx_p" style="width:457.5pt;"><span id="A14.SS0.SSS0.Px2.p2.pic1.p23.18.1" class="ltx_text ltx_verbatim ltx_font_typewriter ltx_inline-block" style="width:457.5pt;--ltx-fg-color:#000000;"><span id="A14.SS0.SSS0.Px2.p2.pic1.p23.18.1.1" class="ltx_inline-logical-block ltx_parbox ltx_pruned_first ltx_align_top" style="width:457.5pt;"></span></span></span>
<span id="A14.SS0.SSS0.Px2.p2.pic1.p23.19" class="ltx_p" style="width:457.5pt;"><span id="A14.SS0.SSS0.Px2.p2.pic1.p23.19.1" class="ltx_text ltx_verbatim ltx_font_typewriter ltx_inline-block" style="width:457.5pt;--ltx-fg-color:#000000;"><span id="A14.SS0.SSS0.Px2.p2.pic1.p23.19.1.1" class="ltx_inline-logical-block ltx_parbox ltx_align_top" style="width:457.5pt;">
<span id="A14.SS0.SSS0.Px2.p2.pic1.p20" class="ltx_para ltx_noindent">
<span id="A14.SS0.SSS0.Px2.p2.pic1.p20.1" class="ltx_p">- better_exploration vs over_trust: did the new probe INDEPENDENTLY GROUND the</span>
</span></span></span></span>
<span id="A14.SS0.SSS0.Px2.p2.pic1.p23.20" class="ltx_p" style="width:457.5pt;"><span id="A14.SS0.SSS0.Px2.p2.pic1.p23.20.1" class="ltx_text ltx_verbatim ltx_font_typewriter ltx_inline-block" style="width:457.5pt;--ltx-fg-color:#000000;"><span id="A14.SS0.SSS0.Px2.p2.pic1.p23.20.1.1" class="ltx_inline-logical-block ltx_parbox ltx_align_top" style="width:457.5pt;">
<span id="A14.SS0.SSS0.Px2.p2.pic1.p21" class="ltx_para ltx_noindent">
<span id="A14.SS0.SSS0.Px2.p2.pic1.p21.1" class="ltx_p">  correction (better_exploration), or add no independent grounding so the</span>
</span></span></span></span>
<span id="A14.SS0.SSS0.Px2.p2.pic1.p23.21" class="ltx_p" style="width:457.5pt;"><span id="A14.SS0.SSS0.Px2.p2.pic1.p23.21.1" class="ltx_text ltx_verbatim ltx_font_typewriter ltx_inline-block" style="width:457.5pt;--ltx-fg-color:#000000;"><span id="A14.SS0.SSS0.Px2.p2.pic1.p23.21.1.1" class="ltx_inline-logical-block ltx_parbox ltx_align_top" style="width:457.5pt;">
<span id="A14.SS0.SSS0.Px2.p2.pic1.p22" class="ltx_para ltx_noindent">
<span id="A14.SS0.SSS0.Px2.p2.pic1.p22.1" class="ltx_p">  verdict matches only via the aligned cue (over_trust)?</span>
</span></span></span></span>
</span></span></span></span></foreignobject></g></g></g></svg>