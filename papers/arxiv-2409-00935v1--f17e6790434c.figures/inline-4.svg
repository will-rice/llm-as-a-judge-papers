<span id="A0.I1.i9.p10.1" class="ltx_p"><span id="A0.I1.i9.p10.1.1" class="ltx_text" style="--ltx-fg-color:#000000;">But I get an ‘UnicodeEncodeError: ‘ascii’ codec can’t encode character
u‘8̆1cd’ in position 0: ordinal not in range(128)’ error. The string is
always a single character.</span></span>
</span></span>
<span id="A0.I1.i10" class="ltx_item" style="list-style-type:none;"><span class="ltx_tag ltx_tag_item">10.</span> 
<span id="A0.I1.i10.p1" class="ltx_para">
<span id="A0.I1.i10.p1.1" class="ltx_p"><span id="A0.I1.i10.p1.1.1" class="ltx_text ltx_font_bold" style="--ltx-fg-color:#000000;">(Math-StackExchange)</span><span id="A0.I1.i10.p1.1.2" class="ltx_text" style="--ltx-fg-color:#000000;">  Please give me some advice on references of complex geometry Recently I am reading complex geometry and preparing for my complex geometry exam. Our lectures book is so disorder and brief that I have to consult Wikipedia and math-overflow. I need some materials of complex geometry such as almost complex manifolds, Kähler manifolds, complex and holomorphic vector bundles, Hodge theory, Chern classes and sheaf theory. So can you recommend some complex geometry lectures or books to me?</span></span>
</span>
