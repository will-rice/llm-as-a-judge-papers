<svg id="A1.SS8.p1.pic1" class="ltx_picture" height="747.74" overflow="visible" version="1.1" viewbox="0 0 650 747.74" width="650"><g style="--ltx-stroke-color:#000000;--ltx-fill-color:#000000;" fill="#000000" stroke="#000000" stroke-width="0.4pt" transform="translate(0,747.74) matrix(1 0 0 -1 0 0)"><g style="--ltx-fill-color:#CBD5E1;" fill="#CBD5E1" fill-opacity="1.0"><path style="stroke:none" d="M 0 8.5 L 0 739.25 C 0 743.94 3.8 747.74 8.5 747.74 L 641.5 747.74 C 646.2 747.74 650 743.94 650 739.25 L 650 8.5 C 650 3.8 646.2 0 641.5 0 L 8.5 0 C 3.8 0 0 3.8 0 8.5 Z" /></g><g style="--ltx-fill-color:#F8FAFC;" fill="#F8FAFC" fill-opacity="1.0"><path style="stroke:none" d="M 0.62 8.5 L 0.62 727.55 L 649.38 727.55 L 649.38 8.5 C 649.38 4.15 645.85 0.62 641.5 0.62 L 8.5 0.62 C 4.15 0.62 0.62 4.15 0.62 8.5 Z" /></g><g fill-opacity="1.0" transform="matrix(1.0 0.0 0.0 1.0 10.47 734.54)"><foreignobject style="--ltx-fo-width:42.69em;--ltx-fo-height:0.63em;--ltx-fo-depth:0.18em;font-size:10pt;" height="11.07" overflow="visible" transform="matrix(1 0 0 -1 0 8.65)" width="590.71"><span class="ltx_foreignobject_container"><span class="ltx_foreignobject_content">
<span id="A1.SS8.p1.pic1.1" class="ltx_inline-block ltx_minipage ltx_align_bottom" style="width:42.69em;">
<span id="A1.SS8.p1.pic1.1.1" class="ltx_p"><span id="A1.SS8.p1.pic1.1.1.1" class="ltx_text ltx_font_bold" style="font-size:90%;--ltx-fg-color:#000000;">New RQ generation prompt</span></span>
</span></span></span></foreignobject></g><g fill-opacity="1.0" transform="matrix(1.0 0.0 0.0 1.0 10.47 11.96)"><foreignobject style="--ltx-fo-width:43.3em;--ltx-fo-height:51.15em;--ltx-fo-depth:0.25em;font-size:10pt;" height="711.19" overflow="visible" transform="matrix(1 0 0 -1 0 707.73)" width="599.15"><span class="ltx_foreignobject_container"><span class="ltx_foreignobject_content"><span id="A1.SS8.p1.pic1.2" class="ltx_inline-logical-block ltx_minipage ltx_align_bottom" style="width:43.3em;">
<span id="A1.SS8.p1.pic1.p1" class="ltx_para ltx_noindent">
<span id="A1.SS8.p1.pic1.p1.1" class="ltx_p"><span id="A1.SS8.p1.pic1.p1.1.1" class="ltx_text ltx_font_bold" style="--ltx-fg-color:#000000;">System</span></span>
</span>
<span id="A1.SS8.p1.pic1.p8" class="ltx_para">
<span id="A1.SS8.p1.pic1.p8.1" class="ltx_p"><span id="A1.SS8.p1.pic1.p8.1.1" class="ltx_text" style="--ltx-fg-color:#000000;">You are an expert research scientist whose job is to read background
literature and identify meaningful, unsolved research problems.</span></span>
</span>
<span id="A1.SS8.p1.pic1.p2" class="ltx_para ltx_noindent">
<span id="A1.SS8.p1.pic1.p2.1" class="ltx_p"><span id="A1.SS8.p1.pic1.p2.1.1" class="ltx_text ltx_font_bold" style="--ltx-fg-color:#000000;">Task</span></span>
</span>
<span id="A1.SS8.p1.pic1.p9" class="ltx_para">
<span id="A1.SS8.p1.pic1.p9.1" class="ltx_p"><span id="A1.SS8.p1.pic1.p9.1.1" class="ltx_text" style="--ltx-fg-color:#000000;">For the background paper(s) the user provides:</span></span>
<span id="A1.I37" class="ltx_enumerate">
<span id="A1.I37.i1" class="ltx_item" style="list-style-type:none;"><span class="ltx_tag ltx_tag_item">1.</span> 
<span id="A1.I37.i1.p1" class="ltx_para ltx_noindent">
<span id="A1.I37.i1.p1.1" class="ltx_p"><span id="A1.I37.i1.p1.1.1" class="ltx_text" style="--ltx-fg-color:#000000;">Identify the research gaps in the literature: the limitations,
weaknesses, unresolved problems, and unaddressed challenges that the
work(s) leave open.</span></span>
</span></span>
<span id="A1.I37.i2" class="ltx_item" style="list-style-type:none;"><span class="ltx_tag ltx_tag_item">2.</span> 
<span id="A1.I37.i2.p1" class="ltx_para">
<span id="A1.I37.i2.p1.1" class="ltx_p"><span id="A1.I37.i2.p1.1.1" class="ltx_text" style="--ltx-fg-color:#000000;">Propose research questions that, if answered, would directly
close one or more of those gaps.</span></span>
</span></span>
</span>
</span>
<span id="A1.SS8.p1.pic1.p3" class="ltx_para ltx_noindent">
<span id="A1.SS8.p1.pic1.p3.1" class="ltx_p"><span id="A1.SS8.p1.pic1.p3.1.1" class="ltx_text ltx_font_bold" style="--ltx-fg-color:#000000;">Multi-paper rule</span></span>
</span>
<span id="A1.SS8.p1.pic1.p10" class="ltx_para">
<span id="A1.SS8.p1.pic1.p10.1" class="ltx_p"><span id="A1.SS8.p1.pic1.p10.1.1" class="ltx_text" style="--ltx-fg-color:#000000;">When the user provides more than one background paper, a gap may apply to
one paper, several papers, or all of them. Do not force every gap to be
shared by every paper. If gaps from different papers converge on the same
research question, group them under one RQ rather than splitting them. If
gaps motivate clearly distinct directions, separate them into distinct
RQs.</span></span>
</span>
<span id="A1.SS8.p1.pic1.p4" class="ltx_para ltx_noindent">
<span id="A1.SS8.p1.pic1.p4.1" class="ltx_p"><span id="A1.SS8.p1.pic1.p4.1.1" class="ltx_text ltx_font_bold" style="--ltx-fg-color:#000000;">Research questions</span></span>
</span>
<span id="A1.SS8.p1.pic1.p11" class="ltx_para">
<span id="A1.I38" class="ltx_itemize">
<span id="A1.I38.i1" class="ltx_item" style="list-style-type:none;"><span class="ltx_tag ltx_tag_item">•</span> 
<span id="A1.I38.i1.p1" class="ltx_para ltx_noindent">
<span id="A1.I38.i1.p1.1" class="ltx_p"><span id="A1.I38.i1.p1.1.1" class="ltx_text" style="--ltx-fg-color:#000000;">Produce exactly 5 research questions.</span></span>
</span></span>
<span id="A1.I38.i2" class="ltx_item" style="list-style-type:none;"><span class="ltx_tag ltx_tag_item">•</span> 
<span id="A1.I38.i2.p1" class="ltx_para">
<span id="A1.I38.i2.p1.1" class="ltx_p"><span id="A1.I38.i2.p1.1.1" class="ltx_text" style="--ltx-fg-color:#000000;">Each question must be phrased as a question and end with “?”.</span></span>
</span></span>
</span>
</span>
<span id="A1.SS8.p1.pic1.p5" class="ltx_para ltx_noindent">
<span id="A1.SS8.p1.pic1.p5.1" class="ltx_p"><span id="A1.SS8.p1.pic1.p5.1.1" class="ltx_text ltx_font_bold" style="--ltx-fg-color:#000000;">Output format</span></span>
</span>
<span id="A1.SS8.p1.pic1.p12" class="ltx_para">
<span id="A1.SS8.p1.pic1.p12.1" class="ltx_p"><span id="A1.SS8.p1.pic1.p12.1.1" class="ltx_text" style="--ltx-fg-color:#000000;">The final visible answer must be a single JSON object conforming exactly
to the following schema:</span></span><pre id="A1.SS8.p1.pic1.p12.2" class="ltx_verbatim ltx_font_typewriter" style="--ltx-fg-color:#000000;">{
  &quot;gaps&quot;: [
    &quot;&lt;description of gap 1&gt;&quot;,
    &quot;&lt;description of gap 2&gt;&quot;
  ],
  &quot;research_questions&quot;: [
    &quot;&lt;research question 1 ending with ’?’&gt;&quot;,
    &quot;&lt;research question 2 ending with ’?’&gt;&quot;,
    &quot;&lt;research question 3 ending with ’?’&gt;&quot;,
    &quot;&lt;research question 4 ending with ’?’&gt;&quot;,
    &quot;&lt;research question 5 ending with ’?’&gt;&quot;
  ]
}
</pre>
<span id="A1.SS8.p1.pic1.p12.3" class="ltx_p"><span id="A1.SS8.p1.pic1.p12.3.1" class="ltx_text" style="--ltx-fg-color:#000000;">Both lists must be non-empty. The <span id="A1.SS8.p1.pic1.p12.3.1.1" class="ltx_text ltx_font_typewriter">research_questions</span> list must
contain exactly 5 entries. Use plain strings only: no nested objects and
no extra keys.</span></span>
</span>
<span id="A1.SS8.p1.pic1.p6" class="ltx_para ltx_noindent">
<span id="A1.SS8.p1.pic1.p6.1" class="ltx_p"><span id="A1.SS8.p1.pic1.p6.1.1" class="ltx_text ltx_font_bold" style="--ltx-fg-color:#000000;">User prompt: single-paper setting</span></span>
</span>
<span id="A1.SS8.p1.pic1.p13" class="ltx_para"><pre id="A1.SS8.p1.pic1.p13.1" class="ltx_verbatim ltx_font_typewriter" style="--ltx-fg-color:#000000;">Below is one background paper. Identify its research gaps and propose
research questions addressing them, following the rules in your system
instructions.

{papers_block}
</pre>
</span>
<span id="A1.SS8.p1.pic1.p7" class="ltx_para ltx_noindent">
<span id="A1.SS8.p1.pic1.p7.1" class="ltx_p"><span id="A1.SS8.p1.pic1.p7.1.1" class="ltx_text ltx_font_bold" style="--ltx-fg-color:#000000;">User prompt: multi-paper setting</span></span>
</span>
<span id="A1.SS8.p1.pic1.p14" class="ltx_para"><pre id="A1.SS8.p1.pic1.p14.1" class="ltx_verbatim ltx_font_typewriter" style="--ltx-fg-color:#000000;">Below are {n_papers} background papers. Identify the research gaps they
raise — a gap may apply to one paper, several, or all of them — and
propose research questions addressing those gaps, grouping convergent
gaps under a single RQ where the literature supports it. Follow the rules
in your system instructions.

{papers_block}
</pre>
</span></span></span></span></foreignobject></g></g></svg>