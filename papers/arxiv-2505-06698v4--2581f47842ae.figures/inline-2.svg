<span id="A2.F8.pic1.2.1" class="ltx_p"><span id="A2.F8.pic1.2.1.1" class="ltx_text" style="--ltx-fg-color:#000000;">Please act as an impartial judge and evaluate the quality of the response provided by an AI assistant to the user question displayed below. Your evaluation should consider the evaluation system displayed below. Begin your evaluation by providing an explanation for each metric, assessing the response objectively. Score each metric on a scale of 1 to 3, where 1 represents complete failure to meet the criterion and 3 represents perfection. The weights of the metrics must sum to 100, and the final weighted score should be calculated on a scale up to 300, reflecting the weighted sum of the individual scores. After evaluation, you must summarize the results within &lt;The Start of Evaluation Result&gt; and &lt;The End of Evaluation Result&gt;. Below is an example output: 
<br class="ltx_break">&lt;The Start of Evaluation Result&gt; 
