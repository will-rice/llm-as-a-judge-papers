<span id="A8.F12.pic1.p1.pic1.1" class="ltx_inline-block ltx_minipage ltx_align_bottom" style="width:44.97em;">
<span id="A8.F12.pic1.p1.pic1.1.1" class="ltx_p ltx_align_center"><span id="A8.F12.pic1.p1.pic1.1.1.1" class="ltx_text ltx_font_bold" style="font-size:90%;--ltx-fg-color:#0078FF;">Evaluator <math id="A8.F12.pic1.p1.pic1.m1" class="ltx_Math" alttext="231a" display="inline" intent=":literal"><semantics><mrow><mn style="--ltx-fg-color:#0078FF;" mathcolor="#0078FF">231</mn><mo lspace="0em" rspace="0em">​</mo><mi style="--ltx-fg-color:#0078FF;" mathcolor="#0078FF">a</mi></mrow><annotation encoding="application/x-tex">231a</annotation></semantics></math></span></span>
<span id="A8.F12.pic1.p1.pic1.1.2" class="ltx_p"><span id="A8.F12.pic1.p1.pic1.1.2.1" class="ltx_text ltx_font_typewriter" style="font-size:90%;">EXECUTED SUCCESSFULLY: Yes [ ] / No [ ]</span></span>
<span id="A8.F12.pic1.p1.pic1.1.3" class="ltx_p"><span id="A8.F12.pic1.p1.pic1.1.3.1" class="ltx_text" style="font-size:90%;">1. Must be checked based on the overall completeness of the task, based on looking at the code, the artifacts, and the trajectory.</span></span>
<span id="A8.F12.pic1.p1.pic1.1.4" class="ltx_p"><span id="A8.F12.pic1.p1.pic1.1.4.1" class="ltx_text" style="font-size:90%;">2. The training has finished, the model snapshot and the metrics breakdown have been saved, and at least one artifact of required analytics has been produced - mark as successful. If some analytic artifacts are missing but not all, mark as successful.</span></span>
<span id="A8.F12.pic1.p1.pic1.1.5" class="ltx_p"><span id="A8.F12.pic1.p1.pic1.1.5.1" class="ltx_text" style="font-size:90%;">3. No need to run the code.</span></span>
<span id="A8.F12.pic1.p1.pic1.1.6" class="ltx_p"><span id="A8.F12.pic1.p1.pic1.1.6.1" class="ltx_text" style="font-size:90%;">4. If training was finished but on fake data, mark as successful.</span></span>
<span id="A8.F12.pic1.p1.pic1.1.7" class="ltx_p"><span id="A8.F12.pic1.p1.pic1.1.7.1" class="ltx_text ltx_font_typewriter" style="font-size:90%;">Requirements:
<br class="ltx_break"></span><span id="A8.F12.pic1.p1.pic1.1.7.2" class="ltx_text" style="font-size:90%;">Marking a requirement as satisfied must be made for this specific requirement disregarding the dependency list.
If a file (code, image, snapshot) is there but is empty or without any meaningful content - mark as No.</span></span>
<span id="A8.F12.pic1.p1.pic1.1.8" class="ltx_p"><span id="A8.F12.pic1.p1.pic1.1.8.1" class="ltx_text" style="font-size:90%;">1. Code:</span></span>
<span id="A8.F12.pic1.p1.pic1.1.9" class="ltx_p"><span id="A8.F12.pic1.p1.pic1.1.9.1" class="ltx_text" style="font-size:90%;">The functionality must be in a file with the requested path.</span></span>
<span id="A8.F12.pic1.p1.pic1.1.10" class="ltx_p"><span id="A8.F12.pic1.p1.pic1.1.10.1" class="ltx_text" style="font-size:90%;">The real data is replaced by simple synthetic - not satisfied.</span></span>
<span id="A8.F12.pic1.p1.pic1.1.11" class="ltx_p"><span id="A8.F12.pic1.p1.pic1.1.11.1" class="ltx_text" style="font-size:90%;">2. Visualization/Reports:</span></span>
<span id="A8.F12.pic1.p1.pic1.1.12" class="ltx_p"><span id="A8.F12.pic1.p1.pic1.1.12.1" class="ltx_text" style="font-size:90%;">The contents must be there and make sense even if not perfect from the ML/DS point of view.</span></span>
<span id="A8.F12.pic1.p1.pic1.1.13" class="ltx_p"><span id="A8.F12.pic1.p1.pic1.1.13.1" class="ltx_text" style="font-size:90%;">3. Snapshots:</span></span>
<span id="A8.F12.pic1.p1.pic1.1.14" class="ltx_p"><span id="A8.F12.pic1.p1.pic1.1.14.1" class="ltx_text" style="font-size:90%;">If a binary snapshot is not empty, mark as Yes.</span></span>
</span></span></span></foreignobject></g></g></svg>