“{user_prompt}”</span></span>
<span id="A5.F8.p1.pic1.2.5" class="ltx_p"><span id="A5.F8.p1.pic1.2.5.1" class="ltx_text" style="--ltx-fg-color:#000000;">AI ASSISTANT RESPONSE:
“{model_response}”</span></span>
<span id="A5.F8.p1.pic1.2.6" class="ltx_p"><span id="A5.F8.p1.pic1.2.6.1" class="ltx_text" style="--ltx-fg-color:#000000;">Your answer should be in the format: {rating} {justification}</span></span>
<span id="A5.F8.p1.pic1.2.7" class="ltx_p"><span id="A5.F8.p1.pic1.2.7.1" class="ltx_text" style="--ltx-fg-color:#000000;">If you feel you cannot provide a fair rating or do not have the time to do so, you may abstain.
