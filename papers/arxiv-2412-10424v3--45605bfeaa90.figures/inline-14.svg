<br class="ltx_break">You are given three inputs:
1. </span>Question:<span id="A4.SS2.SSS2.p4.pic1.2.1.1.2" class="ltx_text ltx_font_medium"> The original question that was asked. 
<br class="ltx_break">2. </span>Reference Answer:<span id="A4.SS2.SSS2.p4.pic1.2.1.1.3" class="ltx_text ltx_font_medium"> A list of atomic facts with labels indicating whether each fact is supported or unsupported by a model’s output. 
<br class="ltx_break">3. </span>Model’s Output:<span id="A4.SS2.SSS2.p4.pic1.2.1.1.4" class="ltx_text ltx_font_medium"> The model’s output and the corresponding correctness for the given question.</span></span></span>
<span id="A4.SS2.SSS2.p4.pic1.2.2" class="ltx_p"><span id="A4.SS2.SSS2.p4.pic1.2.2.1" class="ltx_text ltx_font_bold" style="--ltx-fg-color:#000000;">Instruction:<span id="A4.SS2.SSS2.p4.pic1.2.2.1.1" class="ltx_text ltx_font_medium"> 
<br class="ltx_break">1. Your task is to generate follow-up questions based on the atomic facts from the Reference Answer that were labeled as unsupported by the model’s output. 
<br class="ltx_break">2. The follow-up questions should be designed to test whether the model understands the unsupported facts. 
<br class="ltx_break">3. Never include any facts from the reference solution to the question. Instead, ask questions to verify knowledge. 
<br class="ltx_break">4. The questions should indirectly reference the concepts in a way that allows us to assess the model’s understanding. 
<br class="ltx_break">5. Your follow-up questions should not simply ask the fact directly but should guide the model to demonstrate whether it knows the fact.</span></span></span>
