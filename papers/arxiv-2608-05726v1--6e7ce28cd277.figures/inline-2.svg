<svg id="Pt0.A1.F8.p2.pic1" class="ltx_picture" height="397.33" overflow="visible" version="1.1" viewbox="0 0 229.14 397.33" width="229.14"><g style="--ltx-stroke-color:#000000;--ltx-fill-color:#000000;" fill="#000000" stroke="#000000" stroke-width="0.4pt" transform="translate(0,397.33) matrix(1 0 0 -1 0 0)"><g style="--ltx-fill-color:#000000;" fill="#000000" fill-opacity="1.0"><path style="stroke:none" d="M 0 0 L 0 397.33 L 229.14 397.33 L 229.14 0 Z" /></g><g style="--ltx-fill-color:#FFFFFF;" fill="#FFFFFF" fill-opacity="1.0"><path style="stroke:none" d="M 0.42 0.42 L 0.42 396.92 L 228.72 396.92 L 228.72 0.42 Z" /></g><g fill-opacity="1.0" transform="matrix(1.0 0.0 0.0 1.0 6.32 4.35)"><foreignobject style="--ltx-fo-width:19.63em;--ltx-fo-height:28.09em;--ltx-fo-depth:0em;font-size:10pt;" height="388.63" overflow="visible" transform="matrix(1 0 0 -1 0 388.63)" width="271.62"><span class="ltx_foreignobject_container"><span class="ltx_foreignobject_content">
<span id="Pt0.A1.F8.p2.pic1.1" class="ltx_inline-block ltx_minipage ltx_align_bottom" style="width:19.63em;">
<span id="Pt0.A1.F8.p2.pic1.1.1" class="ltx_p"><span id="Pt0.A1.F8.p2.pic1.1.1.1" class="ltx_text" style="font-size:70%;--ltx-fg-color:#000000;">You will be given one summary written for a news article.
<br class="ltx_break"></span></span>
<span id="Pt0.A1.F8.p2.pic1.1.2" class="ltx_p"><span id="Pt0.A1.F8.p2.pic1.1.2.1" class="ltx_text" style="font-size:70%;--ltx-fg-color:#000000;">Your task is to rate the summary on one metric.
<br class="ltx_break"></span></span>
<span id="Pt0.A1.F8.p2.pic1.1.3" class="ltx_p"><span id="Pt0.A1.F8.p2.pic1.1.3.1" class="ltx_text" style="font-size:70%;--ltx-fg-color:#000000;">Please make sure you read and understand these instructions carefully. Please keep this document open while reviewing, and refer to it as needed.
<br class="ltx_break"></span></span>
<span id="Pt0.A1.F8.p2.pic1.1.4" class="ltx_p"><span id="Pt0.A1.F8.p2.pic1.1.4.1" class="ltx_text" style="font-size:70%;--ltx-fg-color:#000000;">Evaluation Criteria:
<br class="ltx_break"></span></span>
<span id="Pt0.A1.F8.p2.pic1.1.5" class="ltx_p"><span id="Pt0.A1.F8.p2.pic1.1.5.1" class="ltx_text" style="font-size:70%;--ltx-fg-color:#000000;">Coherence (1-5) - the collective quality of all sentences. We align this dimension with the DUC quality question of structure and coherence whereby &quot;the summary should be well-structured and well-organized. The summary should not just be a heap of related information, but should build from sentence to a coherent body of information about a topic.&quot;
<br class="ltx_break"></span></span>
<span id="Pt0.A1.F8.p2.pic1.1.6" class="ltx_p"><span id="Pt0.A1.F8.p2.pic1.1.6.1" class="ltx_text" style="font-size:70%;--ltx-fg-color:#000000;">Source Text:
<br class="ltx_break">{{Source}}
<br class="ltx_break"></span></span>
<span id="Pt0.A1.F8.p2.pic1.1.7" class="ltx_p"><span id="Pt0.A1.F8.p2.pic1.1.7.1" class="ltx_text" style="font-size:70%;--ltx-fg-color:#000000;">Summary:
<br class="ltx_break">{{Summary}}
<br class="ltx_break"></span></span>
<span id="Pt0.A1.F8.p2.pic1.1.8" class="ltx_p"><span id="Pt0.A1.F8.p2.pic1.1.8.1" class="ltx_text" style="font-size:70%;--ltx-fg-color:#000000;">Evaluation Form (scores ONLY):
<br class="ltx_break"></span></span>
