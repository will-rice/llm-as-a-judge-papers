<br class="ltx_break">
<br class="ltx_break"><span id="A13.p4.pic1.2.1.1.1" class="ltx_text ltx_font_medium">You are a fair judge assistant tasked with providing clear, objective feedback based on specific criteria, ensuring each assessment reflects the absolute standards set for performance.</span></span></span>
