<span id="A3.F4.pic2.p1" class="ltx_para ltx_noindent" lang="eu">
<span id="A3.F4.pic2.p1.1" class="ltx_p"><span id="A3.F4.pic2.p1.1.1" class="ltx_text" style="--ltx-fg-color:#000000;">Testu honetan, garrantzitsuena da herritarren erantzuna eta errespetua eskatzea. Horregatik, laburtutako testuan, hurrengo frasiak eraginkorrak izan daitezke:</span></span>
</span>
<span id="A3.F4.pic2.p2" class="ltx_para">
<span id="A3.F4.pic2.p2.1" class="ltx_p"><span id="A3.F4.pic2.p2.1.1" class="ltx_text" style="--ltx-fg-color:#000000;" lang="eu">“Erasorik ez, erantzunik gabe” lelopea herritarren eragile eta konprometituta dagoena erakusten du. Herriko jai honetan, emakumeen eta pertsonen segurtasuna babesteko, herritar guztiak erantzun bat eman behar dute.</span></span>
<span id="A3.F4.pic2.p2.2" class="ltx_p"><span id="A3.F4.pic2.p2.2.1" class="ltx_text" style="--ltx-fg-color:#000000;" lang="eu">Udalak ere, adierazpen baliagarriak egin ditu, ulertu ez duten eta erasoak egiten dituzten pertsonak ez dira ongi etorriak. Horrela, herriko segurtasun eta askatasun boterea eraginkorra sustatzen du.</span></span>
<span id="A3.F4.pic2.p2.3" class="ltx_p"><span id="A3.F4.pic2.p2.3.1" class="ltx_text" style="--ltx-fg-color:#000000;" lang="eu">Bertan behera utzi zituen ekitaldi guztiak, udalak erantzukizuna erakusten du, eta herriko jai honetan segurtasun eta askatasun inguruko normak betetzen dituela adierazi nahi du.</span></span>
<span id="A3.F4.pic2.p2.4" class="ltx_p"><span id="A3.F4.pic2.p2.4.1" class="ltx_text" style="--ltx-fg-color:#000000;" lang="eu">Horregatik, garrantzitsuena da herritarren erantzuna eta errespetua eskatzea, eta udalak ere, erantzukizuna hartzen duen adierazpen baliagarriak egin du.</span></span>
</span></span></span></span></foreignobject></g></g></svg>