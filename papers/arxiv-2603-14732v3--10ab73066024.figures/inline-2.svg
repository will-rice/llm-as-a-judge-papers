<span id="S5.F15.pic1.2.1" class="ltx_p"><span id="S5.F15.pic1.2.1.1" class="ltx_text ltx_font_bold" style="font-size:90%;--ltx-fg-color:#000000;">Q1.<span id="S5.F15.pic1.2.1.1.1" class="ltx_text ltx_font_medium"> Determine the total force on the bottom of a swimming pool (<math id="S5.F15.pic1.m1" class="ltx_Math" alttext="28.0\times 8.5\;\mathrm{m}" display="inline" intent=":literal"><semantics><mrow><mrow><mn style="--ltx-fg-color:#000000;" mathcolor="#000000">28.0</mn><mo style="--ltx-fg-color:#000000;" lspace="0.222em" mathcolor="#000000" rspace="0.222em">×</mo><mn style="--ltx-fg-color:#000000;" mathcolor="#000000">8.5</mn></mrow><mo lspace="0.280em" rspace="0em">​</mo><mi style="--ltx-fg-color:#000000;" mathcolor="#000000" mathvariant="normal">m</mi></mrow><annotation encoding="application/x-tex">28.0\times 8.5\;\mathrm{m}</annotation></semantics></math>, depth <math id="S5.F15.pic1.m2" class="ltx_Math" alttext="1.8\;\mathrm{m}" display="inline" intent=":literal"><semantics><mrow><mn style="--ltx-fg-color:#000000;" mathcolor="#000000">1.8</mn><mo lspace="0.280em" rspace="0em">​</mo><mi style="--ltx-fg-color:#000000;" mathcolor="#000000" mathvariant="normal">m</mi></mrow><annotation encoding="application/x-tex">1.8\;\mathrm{m}</annotation></semantics></math>).
<br class="ltx_break"><span id="S5.F15.pic1.2.1.1.1.1" class="ltx_text ltx_font_italic">Solution:</span> <math id="S5.F15.pic1.m3" class="ltx_Math" alttext="2.8\times 10^{7}\;\mathrm{N}" display="inline" intent=":literal"><semantics><mrow><mrow><mn style="--ltx-fg-color:#000000;" mathcolor="#000000">2.8</mn><mo style="--ltx-fg-color:#000000;" lspace="0.222em" mathcolor="#000000" rspace="0.222em">×</mo><msup><mn style="--ltx-fg-color:#000000;" mathcolor="#000000">10</mn><mn style="--ltx-fg-color:#000000;" mathcolor="#000000">7</mn></msup></mrow><mo lspace="0em" rspace="0em">​</mo><mi style="--ltx-fg-color:#000000;" mathcolor="#000000" mathvariant="normal">N</mi></mrow><annotation encoding="application/x-tex">2.8\times 10^{7}\;\mathrm{N}</annotation></semantics></math> (1 mark)
<br class="ltx_break" style="--ltx-break-space:4.0pt;">
</span>Q2.<span id="S5.F15.pic1.2.1.1.2" class="ltx_text ltx_font_medium"> A man consumes 3000 kcal of food in one day. If he loses half this energy by evaporating water, calculate the mass of water evaporated.
<br class="ltx_break"><span id="S5.F15.pic1.2.1.1.2.1" class="ltx_text ltx_font_italic">Solution:</span> 2.59 kg (1 mark)
<span id="S5.F15.pic1.2.1.1.2.2" class="ltx_text"></span></span></span></span>
