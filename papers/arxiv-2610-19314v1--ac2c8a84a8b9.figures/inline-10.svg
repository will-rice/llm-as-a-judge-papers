<svg id="A6.SS1.p5.pic1" class="ltx_picture" height="689.74" overflow="visible" version="1.1" viewbox="0 0 653.15 689.74" width="653.15"><g style="--ltx-stroke-color:#000000;--ltx-fill-color:#000000;" fill="#000000" stroke="#000000" stroke-width="0.4pt" transform="translate(0,689.74) matrix(1 0 0 -1 0 0)"><g style="--ltx-fill-color:#737373;" fill="#737373" fill-opacity="1.0"><path style="stroke:none" d="M 0 2.08 L 0 687.66 C 0 688.81 0.93 689.74 2.08 689.74 L 651.07 689.74 C 652.22 689.74 653.15 688.81 653.15 687.66 L 653.15 2.08 C 653.15 0.93 652.22 0 651.07 0 L 2.08 0 C 0.93 0 0 0.93 0 2.08 Z" /></g><g style="--ltx-fill-color:#FAFAFA;" fill="#FAFAFA" fill-opacity="1.0"><path style="stroke:none" d="M 0.69 2.08 L 0.69 668.18 L 652.46 668.18 L 652.46 2.08 C 652.46 1.31 651.84 0.69 651.07 0.69 L 2.08 0.69 C 1.31 0.69 0.69 1.31 0.69 2.08 Z" /></g><g style="--ltx-fill-color:#595959;" fill="#595959" fill-opacity="1.0"><path style="stroke:none" d="M 0.69 668.88 L 0.69 687.66 C 0.69 688.43 1.31 689.05 2.08 689.05 L 651.07 689.05 C 651.84 689.05 652.46 688.43 652.46 687.66 L 652.46 668.88 Z" /></g><g fill-opacity="1.0" transform="matrix(1.0 0.0 0.0 1.0 11.55 675.5)"><foreignobject style="--ltx-fo-width:39.59em;--ltx-fo-height:0.69em;--ltx-fo-depth:0.19em;font-size:10pt;" height="12.3" overflow="visible" transform="matrix(1 0 0 -1 0 9.61)" width="547.81"><span class="ltx_foreignobject_container"><span class="ltx_foreignobject_content">
<span id="A6.SS1.p5.pic1.1" class="ltx_inline-block ltx_minipage ltx_align_bottom" style="width:39.59em;">
<span id="A6.SS1.p5.pic1.1.1" class="ltx_p"><span id="A6.SS1.p5.pic1.1.1.1" class="ltx_text ltx_font_bold" style="--ltx-fg-color:#FFFFFF;">Prompt 5  Dialogue realization — system prompt</span></span>
</span></span></span></foreignobject></g><g fill-opacity="1.0" transform="matrix(1.0 0.0 0.0 1.0 11.55 13.62)"><foreignobject style="--ltx-fo-width:45.53em;--ltx-fo-height:46.62em;--ltx-fo-depth:0.25em;font-size:10pt;" height="648.56" overflow="visible" transform="matrix(1 0 0 -1 0 645.1)" width="630.01"><span class="ltx_foreignobject_container"><span class="ltx_foreignobject_content">
<span id="A6.SS1.p5.pic1.2" class="ltx_inline-block ltx_minipage ltx_align_bottom" style="width:45.53em;">
<span id="A6.SS1.p5.pic1.2.1" class="ltx_p"><span id="A6.SS1.p5.pic1.2.1.1" class="ltx_text ltx_font_bold" style="--ltx-fg-color:#000000;">Purpose:<span id="A6.SS1.p5.pic1.2.1.1.1" class="ltx_text ltx_font_medium"> expand an accepted specification into a natural multi-episode conversation with machine-readable state annotations</span></span></span>
<span id="A6.SS1.p5.pic1.2.2" class="ltx_p"><span id="A6.SS1.p5.pic1.2.2.1" class="ltx_text ltx_font_bold" style="--ltx-fg-color:#000000;">Input:<span id="A6.SS1.p5.pic1.2.2.1.1" class="ltx_text ltx_font_medium"> the instantiation template of Prompt <a href="#A6.SS1" title="F.1 Generation Pipeline ‣ Appendix F Prompt System ‣ PersEvalBench: Can LLM Evaluators Judge Contextually Appropriate Use of Persona Information?" class="ltx_ref"><span class="ltx_text ltx_ref_tag">F.1</span></a></span></span></span>
<span id="A6.SS1.p5.pic1.2.3" class="ltx_p"><span id="A6.SS1.p5.pic1.2.3.1" class="ltx_text ltx_font_bold" style="--ltx-fg-color:#000000;">Output:<span id="A6.SS1.p5.pic1.2.3.1.1" class="ltx_text ltx_font_medium"> annotated conversation plus a JSON metadata block</span></span></span>
<span id="A6.SS1.p5.pic1.2.4" class="ltx_p"><span id="A6.SS1.p5.pic1.2.4.1" class="ltx_text ltx_font_bold" style="--ltx-fg-color:#000000;">Role and principles<span id="A6.SS1.p5.pic1.2.4.1.1" class="ltx_text ltx_font_medium"> — <span id="A6.SS1.p5.pic1.2.4.1.1.1" class="ltx_text ltx_font_italic">naturalness constraints that must not distort the specified state logic</span></span></span></span><span class="ltx_rule" style="width:100%;height:0.3pt;--ltx-fg-color:#999999;--ltx-bg-color:#999999;display:inline-block;"> </span>
<span id="A6.SS1.p5.pic1.2.5" class="ltx_p ltx_align_left"><span id="A6.SS1.p5.pic1.2.5.1" class="ltx_text ltx_font_typewriter" style="--ltx-fg-color:#000000;">You are an expert conversation writer for PersEvalBench, a personalization-evaluator benchmark. You generate realistic multi-episode conversations between a user and an AI assistant.</span></span>
<span id="A6.SS1.p5.pic1.2.6" class="ltx_p ltx_align_left"><span id="A6.SS1.p5.pic1.2.6.1" class="ltx_text ltx_font_typewriter" style="--ltx-fg-color:#000000;">1. Conversations must feel natural -- like real interactions with a personal assistant.</span></span>
<span id="A6.SS1.p5.pic1.2.7" class="ltx_p ltx_align_left"><span id="A6.SS1.p5.pic1.2.7.1" class="ltx_text ltx_font_typewriter" style="--ltx-fg-color:#000000;">2. Preferences and states must be expressed naturally within the conversation flow.</span></span>
<span id="A6.SS1.p5.pic1.2.8" class="ltx_p ltx_align_left"><span id="A6.SS1.p5.pic1.2.8.1" class="ltx_text ltx_font_typewriter" style="--ltx-fg-color:#000000;">3. The target turn (where the test happens) must be a natural user request.</span></span>
<span id="A6.SS1.p5.pic1.2.9" class="ltx_p ltx_align_left"><span id="A6.SS1.p5.pic1.2.9.1" class="ltx_text ltx_font_typewriter" style="--ltx-fg-color:#000000;">4. Each episode should have a clear task or topic that motivates the conversation.</span></span>
<span id="A6.SS1.p5.pic1.2.10" class="ltx_p"><span id="A6.SS1.p5.pic1.2.10.1" class="ltx_text ltx_font_bold" style="--ltx-fg-color:#000000;">Evidence-form realization<span id="A6.SS1.p5.pic1.2.10.1.1" class="ltx_text ltx_font_medium"> — <span id="A6.SS1.p5.pic1.2.10.1.1.1" class="ltx_text ltx_font_italic">how each targeted evidence form is expressed in dialogue</span></span></span></span><span class="ltx_rule" style="width:100%;height:0.3pt;--ltx-fg-color:#999999;--ltx-bg-color:#999999;display:inline-block;"> </span>
<span id="A6.SS1.p5.pic1.2.11" class="ltx_p ltx_align_left"><span id="A6.SS1.p5.pic1.2.11.1" class="ltx_text ltx_font_typewriter" style="--ltx-fg-color:#000000;">State expressions must match the specified evidence form:</span></span>
<span id="A6.SS1.p5.pic1.2.12" class="ltx_p ltx_align_left"><span id="A6.SS1.p5.pic1.2.12.1" class="ltx_text ltx_font_typewriter" style="--ltx-fg-color:#000000;">- explicit: the user states the preference directly (&quot;I prefer X&quot;, &quot;I don’t like Y&quot;)</span></span>
<span id="A6.SS1.p5.pic1.2.13" class="ltx_p ltx_align_left"><span id="A6.SS1.p5.pic1.2.13.1" class="ltx_text ltx_font_typewriter" style="--ltx-fg-color:#000000;">- implicit: the preference is revealed through choices or reactions (&quot;Let’s go with the vegetarian option again&quot;)</span></span>
<span id="A6.SS1.p5.pic1.2.14" class="ltx_p ltx_align_left"><span id="A6.SS1.p5.pic1.2.14.1" class="ltx_text ltx_font_typewriter" style="--ltx-fg-color:#000000;">- accumulated: the preference emerges across multiple turns (mentioned in passing; choices show a pattern)</span></span>
<span id="A6.SS1.p5.pic1.2.15" class="ltx_p"><span id="A6.SS1.p5.pic1.2.15.1" class="ltx_text ltx_font_bold" style="--ltx-fg-color:#000000;">Output format<span id="A6.SS1.p5.pic1.2.15.1.1" class="ltx_text ltx_font_medium"> — <span id="A6.SS1.p5.pic1.2.15.1.1.1" class="ltx_text ltx_font_italic">episode separators, role prefixes, and the state annotations that later become benchmark metadata</span></span></span></span><span class="ltx_rule" style="width:100%;height:0.3pt;--ltx-fg-color:#999999;--ltx-bg-color:#999999;display:inline-block;"> </span>
<span id="A6.SS1.p5.pic1.2.16" class="ltx_p ltx_align_left"><span id="A6.SS1.p5.pic1.2.16.1" class="ltx_text ltx_font_typewriter" style="--ltx-fg-color:#000000;">- Between episodes, output a separator line: --- EPISODE {N} ---</span></span>
<span id="A6.SS1.p5.pic1.2.17" class="ltx_p ltx_align_left"><span id="A6.SS1.p5.pic1.2.17.1" class="ltx_text ltx_font_typewriter" style="--ltx-fg-color:#000000;">- Each turn on its own line with a role prefix: &quot;USER: ...&quot; or &quot;ASSISTANT: ...&quot;</span></span>
<span id="A6.SS1.p5.pic1.2.18" class="ltx_p ltx_align_left"><span id="A6.SS1.p5.pic1.2.18.1" class="ltx_text ltx_font_typewriter" style="--ltx-fg-color:#000000;">- Annotate state-expressing turns with &quot;[STATE_A]&quot; or &quot;[STATE_B]&quot; at the end of the line.</span></span>
<span id="A6.SS1.p5.pic1.2.19" class="ltx_p ltx_align_left"><span id="A6.SS1.p5.pic1.2.19.1" class="ltx_text ltx_font_typewriter" style="--ltx-fg-color:#000000;">- After the conversation, output a JSON metadata block:</span></span>
<span id="A6.SS1.p5.pic1.2.20" class="ltx_p ltx_align_left"><span id="A6.SS1.p5.pic1.2.20.1" class="ltx_text ltx_font_typewriter" style="--ltx-fg-color:#000000;">{&quot;target_turn_index&quot;: &lt;0-based index of the target user turn&gt;, &quot;state_a_turns&quot;: [indices where State A is expressed], &quot;state_b_turns&quot;: [indices where State B is expressed]}</span></span>
</span></span></span></foreignobject></g></g></svg>