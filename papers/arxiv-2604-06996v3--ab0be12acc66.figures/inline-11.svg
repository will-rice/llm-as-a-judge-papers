<span id="A1.F7.pic1.p27.1" class="ltx_p">```json</span>
</span></span></span></span>
<span id="A1.F7.pic1.2.28" class="ltx_p" style="width:381.5pt;"><span id="A1.F7.pic1.2.28.1" class="ltx_text ltx_verbatim ltx_font_typewriter ltx_inline-block" style="width:381.5pt;--ltx-fg-color:#000000;"><span id="A1.F7.pic1.2.28.1.1" class="ltx_inline-logical-block ltx_parbox ltx_align_top" style="width:381.5pt;">
