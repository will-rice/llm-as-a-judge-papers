</span></span></span></foreignobject></g><g fill-opacity="1.0" transform="matrix(1.0 0.0 0.0 1.0 21.65 17.24)"><foreignobject style="--ltx-fo-width:36.62em;--ltx-fo-height:25.89em;--ltx-fo-depth:0.25em;font-size:10pt;" height="361.76" overflow="visible" transform="matrix(1 0 0 -1 0 358.31)" width="506.72"><span class="ltx_foreignobject_container"><span class="ltx_foreignobject_content">
<span id="A5.F11.pic1.2" class="ltx_inline-block ltx_minipage ltx_align_bottom" style="width:36.62em;">
<span id="A5.F11.pic1.2.1" class="ltx_p"><span id="A5.F11.pic1.2.1.1" class="ltx_text" style="--ltx-fg-color:#000000;"># Response Evaluation
<br class="ltx_break">
<br class="ltx_break">## Input
<br class="ltx_break">User Question:
<br class="ltx_break">&quot;&quot;&quot;<span id="A5.F11.pic1.2.1.1.1" class="ltx_text ltx_font_typewriter">{user_question}</span>&quot;&quot;&quot;
<br class="ltx_break">Response:
<br class="ltx_break">&quot;&quot;&quot;<span id="A5.F11.pic1.2.1.1.2" class="ltx_text ltx_font_typewriter">{response}</span>&quot;&quot;&quot;
<br class="ltx_break">
<br class="ltx_break">## Instructions
<br class="ltx_break">Evaluate the response based on the following criteria:
<br class="ltx_break">1. Correctness: Provide a score between 0 and 10, with 10 indicating the response is completely accurate and correct.
<br class="ltx_break">2. <span id="A5.F11.pic1.2.1.1.3" class="ltx_text ltx_font_typewriter">{metric_type}</span>: Provide a score between 0 and 10, with 10 indicating the response is highly <span id="A5.F11.pic1.2.1.1.4" class="ltx_text ltx_font_typewriter">{metric_description}</span>.
<br class="ltx_break">
<br class="ltx_break">## Output Format
<br class="ltx_break">Only return the JSON object below. Do not include any other text or explanation.:
<br class="ltx_break">{{
<br class="ltx_break">&quot;correctness_score&quot;: int, # Value between 0 and 10 indicating correctness
<br class="ltx_break">&quot;<span id="A5.F11.pic1.2.1.1.5" class="ltx_text ltx_font_typewriter">{metric_name}</span>_score&quot;: int # Value between 0 and 10 indicating <span id="A5.F11.pic1.2.1.1.6" class="ltx_text ltx_font_typewriter">{metric_type}
<br class="ltx_break"></span>}}</span></span>
</span></span></span></foreignobject></g></g></svg>