<span id="A1.SS5.SSS1.p4.pic1.1" class="ltx_inline-block ltx_minipage ltx_align_bottom" style="width:32.57em;">
<span id="A1.SS5.SSS1.p4.pic1.1.1" class="ltx_p"><span id="A1.SS5.SSS1.p4.pic1.1.1.1" class="ltx_text ltx_font_bold" style="--ltx-fg-color:#FFFFFF;">Evaluator Instruction - Dynamic Policy Generation</span></span>
</span></span></span></foreignobject></g><g fill-opacity="1.0" transform="matrix(1.0 0.0 0.0 1.0 15.84 15.76)"><foreignobject style="--ltx-fo-width:37.46em;--ltx-fo-height:98.77em;--ltx-fo-depth:0.19em;font-size:10pt;" height="1369.42" overflow="visible" transform="matrix(1 0 0 -1 0 1366.73)" width="518.34"><span class="ltx_foreignobject_container"><span class="ltx_foreignobject_content">
<span id="A1.SS5.SSS1.p4.pic1.2" class="ltx_inline-block ltx_minipage ltx_align_bottom" style="width:37.46em;">
<span id="A1.SS5.SSS1.p4.pic1.2.1" class="ltx_p"><span id="A1.SS5.SSS1.p4.pic1.2.1.1" class="ltx_text" style="--ltx-fg-color:#000000;">You are an evaluation assistant. Your task is to VERY CAREFULLY evaluate the label description in
Generated Description produced by a generation assistant against the provided Optimization Constraints.
Carefully follow the instructions below:
<br class="ltx_break" style="--ltx-break-space:4.0pt;">
1. Go through each constraint in Optimization Constraints one by one.
<br class="ltx_break">2. For each constraint, first provide a fairly detailed step-by-step and logical reasoning for the extent
to which you think the Generated Description produced by the generation assistant for Input Label
satisfies the constraint in thinking mode.
<br class="ltx_break">3. For each constraint, use this reasoning to provide an informed score indicating how confident you are
that the Generated Description satisfies the constraint. This score should be an integer between 1 and 5,
with larger values indicating higher constraint satisfaction.
<br class="ltx_break" style="--ltx-break-space:8.0pt;">
For each constraint, follow these instructions EXACTLY as provided:
<br class="ltx_break">1. Output the title of the constraint exactly as it is provided in Optimization Constraints following
<span id="A1.SS5.SSS1.p4.pic1.2.1.1.1" class="ltx_text ltx_font_typewriter">**Constraint:**</span> on a new line, for example, <span id="A1.SS5.SSS1.p4.pic1.2.1.1.2" class="ltx_text ltx_font_typewriter">**Constraint:** &lt;Optimization Constraint&gt;</span>.
<br class="ltx_break">2. For each constraint, output the following sections:
<br class="ltx_break">  — <span id="A1.SS5.SSS1.p4.pic1.2.1.1.3" class="ltx_text ltx_font_typewriter">&lt;think&gt;</span>: This tag wraps the internal reasoning and includes:
<br class="ltx_break">   — <span id="A1.SS5.SSS1.p4.pic1.2.1.1.4" class="ltx_text ltx_font_typewriter">&lt;planning&gt;</span>: A high-level thought process (reflect on the instruction, brainstorm
multiple approaches if applicable, consider blockers or alternatives, avoid providing the ultimate
verdict).
<br class="ltx_break">   — <span id="A1.SS5.SSS1.p4.pic1.2.1.1.5" class="ltx_text ltx_font_typewriter">&lt;steps&gt;</span>: A concrete attempt to solve the task with logical steps (applies
careful reasoning or domain knowledge, follows through on plan, may include decisions, rule applications,
etc.).
<br class="ltx_break">  — <span id="A1.SS5.SSS1.p4.pic1.2.1.1.6" class="ltx_text ltx_font_typewriter">&lt;answer&gt;</span>: This is the final output, composed of:
<br class="ltx_break">   — <span id="A1.SS5.SSS1.p4.pic1.2.1.1.7" class="ltx_text ltx_font_typewriter">&lt;score&gt;</span>: The success score for the constraint based on the instruction and the
reasoning in <span id="A1.SS5.SSS1.p4.pic1.2.1.1.8" class="ltx_text ltx_font_typewriter">&lt;think&gt;</span>.
<br class="ltx_break">   — <span id="A1.SS5.SSS1.p4.pic1.2.1.1.9" class="ltx_text ltx_font_typewriter">&lt;failure&gt;</span>: (Conditional) If and only if the success score in <span id="A1.SS5.SSS1.p4.pic1.2.1.1.10" class="ltx_text ltx_font_typewriter">&lt;score&gt;</span> is
below Success Threshold, then provide an explanation on why the constraint failed for the Generated
Description based on the reasoning in <span id="A1.SS5.SSS1.p4.pic1.2.1.1.11" class="ltx_text ltx_font_typewriter">&lt;think&gt;</span>.
<br class="ltx_break">   — <span id="A1.SS5.SSS1.p4.pic1.2.1.1.12" class="ltx_text ltx_font_typewriter">&lt;instruction&gt;</span>: (Conditional) If and only if the success score in <span id="A1.SS5.SSS1.p4.pic1.2.1.1.13" class="ltx_text ltx_font_typewriter">&lt;score&gt;</span>
is below the Success Threshold, then provide the regeneration instruction.
<br class="ltx_break" style="--ltx-break-space:4.0pt;">
The output format for each constraint looks like the following. Assuming there are two constraints:</span></span>
<span id="A1.SS5.SSS1.p4.pic1.2.2" class="ltx_quote">
<span id="A1.SS5.SSS1.p4.pic1.2.2.1" class="ltx_p"><span id="A1.SS5.SSS1.p4.pic1.2.2.1.1" class="ltx_text ltx_font_typewriter" style="--ltx-fg-color:#000000;">**Constraint:** &lt;Optimization Constraint 1&gt;
<br class="ltx_break">&lt;think&gt;
<br class="ltx_break">  &lt;planning&gt;&lt;/planning&gt;
<br class="ltx_break">  &lt;steps&gt;&lt;/steps&gt;
<br class="ltx_break">&lt;/think&gt;
<br class="ltx_break">&lt;answer&gt;
<br class="ltx_break">  &lt;score&gt;&lt;/score&gt;
<br class="ltx_break">  &lt;failure&gt;&lt;/failure&gt;
<br class="ltx_break">  &lt;instruction&gt;&lt;/instruction&gt;
<br class="ltx_break">&lt;/answer&gt;
<br class="ltx_break" style="--ltx-break-space:4.0pt;">
**Constraint:** &lt;Optimization Constraint 2&gt;
<br class="ltx_break">&lt;think&gt;
<br class="ltx_break">  &lt;planning&gt;&lt;/planning&gt;
<br class="ltx_break">  &lt;steps&gt;&lt;/steps&gt;
<br class="ltx_break">&lt;/think&gt;
<br class="ltx_break">&lt;answer&gt;
<br class="ltx_break">  &lt;score&gt;&lt;/score&gt;
<br class="ltx_break">  &lt;failure&gt;&lt;/failure&gt;
<br class="ltx_break">  &lt;instruction&gt;&lt;/instruction&gt;
<br class="ltx_break">&lt;/answer&gt;
</span></span>
</span>
<span id="A1.SS5.SSS1.p4.pic1.2.3" class="ltx_p"><span id="A1.SS5.SSS1.p4.pic1.2.3.1" class="ltx_text" style="--ltx-fg-color:#000000;">Repeat this format for each constraint. All tags must be present exactly once for each optimization
constraint if not marked Conditional; Conditional tags appear only if the score is below Success
Threshold; all tags must be syntactically valid (no typos, unclosed tags, or mixed nesting).
<br class="ltx_break" style="--ltx-break-space:4.0pt;"></span></span>
<span id="A1.SS5.SSS1.p4.pic1.2.4" class="ltx_p"><span id="A1.SS5.SSS1.p4.pic1.2.4.1" class="ltx_text ltx_font_bold" style="--ltx-fg-color:#000000;">Optimization Constraints:
<br class="ltx_break" style="--ltx-break-space:4.0pt;"><span id="A1.SS5.SSS1.p4.pic1.2.4.1.1" class="ltx_text ltx_font_medium">
</span>Success Threshold:
<br class="ltx_break" style="--ltx-break-space:4.0pt;"><span id="A1.SS5.SSS1.p4.pic1.2.4.1.2" class="ltx_text ltx_font_medium">
</span>Moderation Type:
<br class="ltx_break" style="--ltx-break-space:4.0pt;"><span id="A1.SS5.SSS1.p4.pic1.2.4.1.3" class="ltx_text ltx_font_medium">
</span>Input Label:
<br class="ltx_break" style="--ltx-break-space:4.0pt;"><span id="A1.SS5.SSS1.p4.pic1.2.4.1.4" class="ltx_text ltx_font_medium">
</span>Identified Scopes:
<br class="ltx_break" style="--ltx-break-space:4.0pt;"><span id="A1.SS5.SSS1.p4.pic1.2.4.1.5" class="ltx_text ltx_font_medium">
</span>Generated Description:
<br class="ltx_break"></span></span>
</span></span></span></foreignobject></g></g></svg>