<span id="A2.F10.pic1.2" class="ltx_inline-block ltx_minipage ltx_align_bottom" style="width:44.75em;">
<span id="A2.F10.pic1.2.1" class="ltx_p"><span id="A2.F10.pic1.2.1.1" class="ltx_text ltx_font_typewriter ltx_font_bold" style="font-size:90%;--ltx-fg-color:#000000;">Role:<span id="A2.F10.pic1.2.1.1.1" class="ltx_text ltx_font_medium"> You are a Clinical Auditor.
</span></span></span>
<span id="A2.F10.pic1.2.2" class="ltx_p"><span id="A2.F10.pic1.2.2.1" class="ltx_text ltx_font_typewriter ltx_font_bold" style="font-size:90%;--ltx-fg-color:#000000;">Task:<span id="A2.F10.pic1.2.2.1.1" class="ltx_text ltx_font_medium"> Calculate the </span>Narrative Sufficiency Score (<math id="A2.F10.pic1.m1" class="ltx_Math" alttext="S_{inf}" display="inline" intent=":literal"><semantics><msub><mi style="--ltx-fg-color:#000000;" mathcolor="#000000">S</mi><mrow><mi style="--ltx-fg-color:#000000;" mathcolor="#000000">i</mi><mo lspace="0em" rspace="0em">​</mo><mi style="--ltx-fg-color:#000000;" mathcolor="#000000">n</mi><mo lspace="0em" rspace="0em">​</mo><mi style="--ltx-fg-color:#000000;" mathcolor="#000000">f</mi></mrow></msub><annotation encoding="application/x-tex">S_{inf}</annotation></semantics></math>)<span id="A2.F10.pic1.2.2.1.2" class="ltx_text ltx_font_medium">. You must determine if the Patient Narrative (<math id="A2.F10.pic1.m2" class="ltx_Math" alttext="L_{N}" display="inline" intent=":literal"><semantics><msub><mi style="--ltx-fg-color:#000000;" mathcolor="#000000">L</mi><mi style="--ltx-fg-color:#000000;" mathcolor="#000000">N</mi></msub><annotation encoding="application/x-tex">L_{N}</annotation></semantics></math>) provides enough context to safely answer the Query (<math id="A2.F10.pic1.m3" class="ltx_Math" alttext="Q" display="inline" intent=":literal"><semantics><mi style="--ltx-fg-color:#000000;" mathcolor="#000000">Q</mi><annotation encoding="application/x-tex">Q</annotation></semantics></math>).
</span></span></span>
<span id="A2.F10.pic1.2.3" class="ltx_p"><span id="A2.F10.pic1.2.3.1" class="ltx_text ltx_font_typewriter ltx_font_bold" style="font-size:90%;--ltx-fg-color:#000000;">Instructions:<span id="A2.F10.pic1.2.3.1.1" class="ltx_text ltx_font_medium">
</span></span></span>
<span id="A2.I7" class="ltx_enumerate">
<span id="A2.I7.i1" class="ltx_item" style="list-style-type:none;"><span class="ltx_tag ltx_tag_item">(1)</span> 
<span id="A2.I7.i1.p1" class="ltx_para">
<span id="A2.I7.i1.p1.1" class="ltx_p"><span id="A2.I7.i1.p1.1.1" class="ltx_text ltx_font_typewriter ltx_font_bold" style="font-size:90%;--ltx-fg-color:#000000;">Step 1 (Derive Requirements):</span><span id="A2.I7.i1.p1.1.2" class="ltx_text ltx_font_typewriter" style="font-size:90%;--ltx-fg-color:#000000;"> List the atomic clinical facts (</span><math id="A2.I7.i1.p1.m1" class="ltx_Math" alttext="S_{req}" display="inline" intent=":literal"><semantics><msub><mi style="--ltx-fg-color:#000000;" mathcolor="#000000" mathsize="0.900em">S</mi><mrow><mi style="--ltx-fg-color:#000000;" mathcolor="#000000" mathsize="0.900em">r</mi><mo lspace="0em" rspace="0em">​</mo><mi style="--ltx-fg-color:#000000;" mathcolor="#000000" mathsize="0.900em">e</mi><mo lspace="0em" rspace="0em">​</mo><mi style="--ltx-fg-color:#000000;" mathcolor="#000000" mathsize="0.900em">q</mi></mrow></msub><annotation encoding="application/x-tex">S_{req}</annotation></semantics></math><span id="A2.I7.i1.p1.1.3" class="ltx_text ltx_font_typewriter" style="font-size:90%;--ltx-fg-color:#000000;">) absolutely necessary to answer </span><math id="A2.I7.i1.p1.m2" class="ltx_Math" alttext="Q" display="inline" intent=":literal"><semantics><mi style="--ltx-fg-color:#000000;" mathcolor="#000000" mathsize="0.900em">Q</mi><annotation encoding="application/x-tex">Q</annotation></semantics></math><span id="A2.I7.i1.p1.1.4" class="ltx_text ltx_font_typewriter" style="font-size:90%;--ltx-fg-color:#000000;"> (e.g., for &quot;Headache&quot;, you need: Onset, Severity, Frequency, Triggers).
</span></span>
</span></span>
<span id="A2.I7.i2" class="ltx_item" style="list-style-type:none;"><span class="ltx_tag ltx_tag_item">(2)</span> 
<span id="A2.I7.i2.p1" class="ltx_para">
<span id="A2.I7.i2.p1.1" class="ltx_p"><span id="A2.I7.i2.p1.1.1" class="ltx_text ltx_font_typewriter ltx_font_bold" style="font-size:90%;--ltx-fg-color:#000000;">Step 2 (Verify):</span><span id="A2.I7.i2.p1.1.2" class="ltx_text ltx_font_typewriter" style="font-size:90%;--ltx-fg-color:#000000;"> Check </span><math id="A2.I7.i2.p1.m1" class="ltx_Math" alttext="L_{N}" display="inline" intent=":literal"><semantics><msub><mi style="--ltx-fg-color:#000000;" mathcolor="#000000" mathsize="0.900em">L</mi><mi style="--ltx-fg-color:#000000;" mathcolor="#000000" mathsize="0.900em">N</mi></msub><annotation encoding="application/x-tex">L_{N}</annotation></semantics></math><span id="A2.I7.i2.p1.1.3" class="ltx_text ltx_font_typewriter" style="font-size:90%;--ltx-fg-color:#000000;">. For each item in </span><math id="A2.I7.i2.p1.m2" class="ltx_Math" alttext="S_{req}" display="inline" intent=":literal"><semantics><msub><mi style="--ltx-fg-color:#000000;" mathcolor="#000000" mathsize="0.900em">S</mi><mrow><mi style="--ltx-fg-color:#000000;" mathcolor="#000000" mathsize="0.900em">r</mi><mo lspace="0em" rspace="0em">​</mo><mi style="--ltx-fg-color:#000000;" mathcolor="#000000" mathsize="0.900em">e</mi><mo lspace="0em" rspace="0em">​</mo><mi style="--ltx-fg-color:#000000;" mathcolor="#000000" mathsize="0.900em">q</mi></mrow></msub><annotation encoding="application/x-tex">S_{req}</annotation></semantics></math><span id="A2.I7.i2.p1.1.4" class="ltx_text ltx_font_typewriter" style="font-size:90%;--ltx-fg-color:#000000;">, determine if it is present/entailed in the narrative.
</span></span>
</span></span>
<span id="A2.I7.i3" class="ltx_item" style="list-style-type:none;"><span class="ltx_tag ltx_tag_item">(3)</span> 
<span id="A2.I7.i3.p1" class="ltx_para">
<span id="A2.I7.i3.p1.1" class="ltx_p"><span id="A2.I7.i3.p1.1.1" class="ltx_text ltx_font_typewriter ltx_font_bold" style="font-size:90%;--ltx-fg-color:#000000;">Step 3 (Score):</span><span id="A2.I7.i3.p1.1.2" class="ltx_text ltx_font_typewriter" style="font-size:90%;--ltx-fg-color:#000000;"> Calculate the ratio of present items to required items.
</span></span>
</span></span>
</span>
<span id="A2.F10.pic1.2.4" class="ltx_p"><span id="A2.F10.pic1.2.4.1" class="ltx_text ltx_font_typewriter ltx_font_bold" style="font-size:90%;--ltx-fg-color:#000000;">Input:<span id="A2.F10.pic1.2.4.1.1" class="ltx_text ltx_font_medium">
</span></span></span>
<span id="A2.I8" class="ltx_itemize">
<span id="A2.I8.i1" class="ltx_item" style="list-style-type:none;"><span class="ltx_tag ltx_tag_item">•</span> 
<span id="A2.I8.i1.p1" class="ltx_para">
<span id="A2.I8.i1.p1.1" class="ltx_p"><span id="A2.I8.i1.p1.1.1" class="ltx_text ltx_font_typewriter ltx_font_bold" style="font-size:90%;--ltx-fg-color:#000000;">Query (<math id="A2.I8.i1.p1.m1" class="ltx_Math" alttext="Q" display="inline" intent=":literal"><semantics><mi style="--ltx-fg-color:#000000;" mathcolor="#000000">Q</mi><annotation encoding="application/x-tex">Q</annotation></semantics></math>):</span><span id="A2.I8.i1.p1.1.2" class="ltx_text ltx_font_typewriter" style="font-size:90%;--ltx-fg-color:#000000;"> ...
</span></span>
</span></span>
<span id="A2.I8.i2" class="ltx_item" style="list-style-type:none;"><span class="ltx_tag ltx_tag_item">•</span> 
<span id="A2.I8.i2.p1" class="ltx_para">
<span id="A2.I8.i2.p1.1" class="ltx_p"><span id="A2.I8.i2.p1.1.1" class="ltx_text ltx_font_typewriter ltx_font_bold" style="font-size:90%;--ltx-fg-color:#000000;">Narrative (<math id="A2.I8.i2.p1.m1" class="ltx_Math" alttext="L_{N}" display="inline" intent=":literal"><semantics><msub><mi style="--ltx-fg-color:#000000;" mathcolor="#000000">L</mi><mi style="--ltx-fg-color:#000000;" mathcolor="#000000">N</mi></msub><annotation encoding="application/x-tex">L_{N}</annotation></semantics></math>):</span><span id="A2.I8.i2.p1.1.2" class="ltx_text ltx_font_typewriter" style="font-size:90%;--ltx-fg-color:#000000;"> ...
</span></span>
</span></span>
</span>
<span id="A2.F10.pic1.2.5" class="ltx_p"><span id="A2.F10.pic1.2.5.1" class="ltx_text ltx_font_typewriter ltx_font_bold" style="font-size:90%;--ltx-fg-color:#000000;">Output Format (JSON):<span id="A2.F10.pic1.2.5.1.1" class="ltx_text ltx_font_medium">
</span></span></span><pre id="A2.F10.pic1.2.6" class="ltx_verbatim ltx_font_typewriter" style="font-size:90%;--ltx-fg-color:#000000;">
{
  &quot;required_items&quot;: [&quot;item1&quot;, &quot;item2&quot;, &quot;item3&quot;, ...],
  &quot;present_items&quot;: [&quot;item1&quot;, &quot;item3&quot;],
  &quot;score&quot;: 0.66  // float between 0.0 and 1.0
}
</pre>
</span></span></span></foreignobject></g></g></svg>