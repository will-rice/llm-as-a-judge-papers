<span id="A10.F7.pic1.p2.pic1.1" class="ltx_inline-block ltx_minipage ltx_align_bottom" style="width:41.73em;">
<span id="A10.F7.pic1.p2.pic1.1.1" class="ltx_p">Estimate the dynamic viscosity (<math id="A10.F7.pic1.p2.pic1.m1" class="ltx_Math" alttext="\mu" display="inline" intent=":literal"><semantics><mi>μ</mi><annotation encoding="application/x-tex">\mu</annotation></semantics></math>) of Sulfur Hexafluoride (SF<sub id="A10.F7.pic1.p2.pic1.1.1.1" class="ltx_sub"><span id="A10.F7.pic1.p2.pic1.1.1.1.1" class="ltx_text ltx_font_italic">6</span></sub>) gas at a temperature of 430
K.</span>
<span id="A10.F7.pic1.p2.pic1.1.2" class="ltx_p">Use the Chapman-Enskog equation for low-density gases:</span>
<span id="A10.F7.pic1.p2.pic1.1.3" class="ltx_p"><math id="A10.F7.pic1.p2.pic1.m3" class="ltx_Math" alttext="\mu" display="inline" intent=":literal"><semantics><mi>μ</mi><annotation encoding="application/x-tex">\mu</annotation></semantics></math> = (2.6693e-6 * sqrt(M*T)) / (<math id="A10.F7.pic1.p2.pic1.m4" class="ltx_Math" alttext="\sigma" display="inline" intent=":literal"><semantics><mi>σ</mi><annotation encoding="application/x-tex">\sigma</annotation></semantics></math><span id="A10.F7.pic1.p2.pic1.1.3.1" class="ltx_text" style="--ltx-fg-color:#000000;">ˆ</span>2 * <math id="A10.F7.pic1.p2.pic1.m5" class="ltx_Math" alttext="\Omega" display="inline" intent=":literal"><semantics><mi mathvariant="normal">Ω</mi><annotation encoding="application/x-tex">\Omega</annotation></semantics></math>_<math id="A10.F7.pic1.p2.pic1.m6" class="ltx_Math" alttext="\mu" display="inline" intent=":literal"><semantics><mi>μ</mi><annotation encoding="application/x-tex">\mu</annotation></semantics></math>)</span>
<span id="A10.F7.pic1.p2.pic1.1.4" class="ltx_p">You are given the following parameters for Sulfur Hexafluoride (SF<sub id="A10.F7.pic1.p2.pic1.1.4.1" class="ltx_sub"><span id="A10.F7.pic1.p2.pic1.1.4.1.1" class="ltx_text ltx_font_italic">6</span></sub>):</span>
<span id="A10.F7.pic1.p2.pic1.1.5" class="ltx_p">– Molar Mass (M) = 146.06 g/mol</span>
<span id="A10.F7.pic1.p2.pic1.1.6" class="ltx_p">– Lennard-Jones diameter (<math id="A10.F7.pic1.p2.pic1.m8" class="ltx_Math" alttext="\sigma" display="inline" intent=":literal"><semantics><mi>σ</mi><annotation encoding="application/x-tex">\sigma</annotation></semantics></math>) = 5.128 Å</span>
<span id="A10.F7.pic1.p2.pic1.1.7" class="ltx_p">– Collision Integral (<math id="A10.F7.pic1.p2.pic1.m9" class="ltx_Math" alttext="\Omega" display="inline" intent=":literal"><semantics><mi mathvariant="normal">Ω</mi><annotation encoding="application/x-tex">\Omega</annotation></semantics></math>_<math id="A10.F7.pic1.p2.pic1.m10" class="ltx_Math" alttext="\mu" display="inline" intent=":literal"><semantics><mi>μ</mi><annotation encoding="application/x-tex">\mu</annotation></semantics></math>) = 1.1895</span>
<span id="A10.F7.pic1.p2.pic1.1.8" class="ltx_p">Provide your answer in units of Pascal-seconds (Pa<math id="A10.F7.pic1.p2.pic1.m11" class="ltx_Math" alttext="\cdot" display="inline" intent=":literal"><semantics><mo>⋅</mo><annotation encoding="application/x-tex">\cdot</annotation></semantics></math>s).</span>
</span></span></span></foreignobject></g></g></svg>