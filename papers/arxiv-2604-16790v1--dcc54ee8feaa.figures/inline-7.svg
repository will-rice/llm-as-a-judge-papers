<span id="S4.SS1.SSS3.p5.pic1.p1" class="ltx_para ltx_noindent">
<span id="S4.SS1.SSS3.p5.pic1.p1.1" class="ltx_p"><span id="S4.SS1.SSS3.p5.pic1.p1.1.1" class="ltx_text ltx_font_bold" style="--ltx-fg-color:#000000;">Key findings (GPT): </span><span id="S4.SS1.SSS3.p5.pic1.p1.1.2" class="ltx_text" style="--ltx-fg-color:#000000;">
GPT shows a </span><span id="S4.SS1.SSS3.p5.pic1.p1.1.3" class="ltx_text ltx_font_bold" style="--ltx-fg-color:#000000;">strong no-bias baseline</span><span id="S4.SS1.SSS3.p5.pic1.p1.1.4" class="ltx_text" style="--ltx-fg-color:#000000;"> across tasks, with </span><span id="S4.SS1.SSS3.p5.pic1.p1.1.5" class="ltx_text ltx_font_bold" style="--ltx-fg-color:#000000;">Easy</span><span id="S4.SS1.SSS3.p5.pic1.p1.1.6" class="ltx_text" style="--ltx-fg-color:#000000;"> nearly saturated while </span><span id="S4.SS1.SSS3.p5.pic1.p1.1.7" class="ltx_text ltx_font_bold" style="--ltx-fg-color:#000000;">Hard</span><span id="S4.SS1.SSS3.p5.pic1.p1.1.8" class="ltx_text" style="--ltx-fg-color:#000000;"> remains substantially lower.
Biases that inject explicit reasoning structure yield the highest measured accuracies on CodeGen and CodeRepair, and most noticeably lift performance on </span><span id="S4.SS1.SSS3.p5.pic1.p1.1.9" class="ltx_text ltx_font_bold" style="--ltx-fg-color:#000000;">Hard</span><span id="S4.SS1.SSS3.p5.pic1.p1.1.10" class="ltx_text" style="--ltx-fg-color:#000000;"> subsets.
In contrast, TestGen is the most fragile: several biases produce large drops in Overall accuracy, with </span><span id="S4.SS1.SSS3.p5.pic1.p1.1.11" class="ltx_text ltx_font_bold" style="--ltx-fg-color:#000000;">verbosity</span><span id="S4.SS1.SSS3.p5.pic1.p1.1.12" class="ltx_text" style="--ltx-fg-color:#000000;"> showing the sharpest decline.</span></span>
</span></span></span></span></foreignobject></g></g></svg>