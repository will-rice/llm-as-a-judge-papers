<span id="A5.F13.pic1.1" class="ltx_inline-block ltx_minipage ltx_align_bottom" style="width:27.39em;">
<span id="A5.F13.pic1.1.1" class="ltx_p"><span id="A5.F13.pic1.1.1.1" class="ltx_text ltx_font_bold" style="--ltx-fg-color:#FFFFFF;">Rubric for MRewardBench subset: llmbar-natural</span></span>
</span></span></span></foreignobject></g><g fill-opacity="1.0" transform="matrix(1.0 0.0 0.0 1.0 20.79 15.99)"><foreignobject style="--ltx-fo-width:31.5em;--ltx-fo-height:15.09em;--ltx-fo-depth:0.22em;font-size:10pt;" class="ltx_minipage" height="211.94" overflow="visible" transform="matrix(1 0 0 -1 0 208.86)" width="30em"><span class="ltx_foreignobject_container"><span class="ltx_foreignobject_content"><pre id="A5.F13.pic1.2" class="ltx_verbatim ltx_font_typewriter" style="--ltx-fg-color:#000000;">Pairwise judge for naturalistic instructions.
Steps:
1) Read the User Question and the answers from Assistant A and
   Assistant B.
2) Checks:
   - Instruction faithfulness: exactly follows the requested task.
   - Factual correctness: objective accuracy.
   - Constraint coverage: formats, examples, edge cases.
   - Clarity: readable and to the point.
   - Reasoning-aware: steps, if present, are consistent and correct.
3) Penalize: off-task eloquence, unnecessary flourish, inaccuracies.
4) Decision: choose Assistant A if it better fulfills the User
   Question accurately and completely; otherwise choose Assistant B.
5) Neutrality: ignore presentation order, assistant names, and length.

</pre></span></span></foreignobject></g></g></svg>