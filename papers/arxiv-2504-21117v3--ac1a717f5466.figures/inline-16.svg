<svg id="A1.F7.p2.pic1" class="ltx_picture" height="850.89" overflow="visible" version="1.1" viewbox="0 0 201.58 850.89" width="201.58"><g style="--ltx-stroke-color:#000000;--ltx-fill-color:#000000;" fill="#000000" stroke="#000000" stroke-width="0.4pt" transform="translate(0,850.89) matrix(1 0 0 -1 0 0)"><g style="--ltx-fill-color:#404040;" fill="#404040" fill-opacity="1.0"><path style="stroke:none" d="M 0 5.91 L 0 844.98 C 0 848.24 2.64 850.89 5.91 850.89 L 195.67 850.89 C 198.94 850.89 201.58 848.24 201.58 844.98 L 201.58 5.91 C 201.58 2.64 198.94 0 195.67 0 L 5.91 0 C 2.64 0 0 2.64 0 5.91 Z" /></g><g style="--ltx-fill-color:#F9F9F9;" fill="#F9F9F9" fill-opacity="1.0"><path style="stroke:none" d="M 1.97 5.91 L 1.97 844.98 C 1.97 847.15 3.73 848.92 5.91 848.92 L 195.67 848.92 C 197.85 848.92 199.61 847.15 199.61 844.98 L 199.61 5.91 C 199.61 3.73 197.85 1.97 195.67 1.97 L 5.91 1.97 C 3.73 1.97 1.97 3.73 1.97 5.91 Z" /></g><g fill-opacity="1.0" transform="matrix(1.0 0.0 0.0 1.0 7.29 -76.05)"><foreignobject style="--ltx-fo-width:16.95em;--ltx-fo-height:72.49em;--ltx-fo-depth:0em;font-size:10pt;" height="1003" overflow="visible" transform="matrix(1 0 0 -1 0 1003)" width="234.54"><span class="ltx_foreignobject_container"><span class="ltx_foreignobject_content">
<span id="A1.F7.p2.pic1.1" class="ltx_inline-block ltx_minipage ltx_align_bottom" style="width:16.95em;">
<span id="A1.F7.p2.pic1.1.1" class="ltx_p"><span id="A1.F7.p2.pic1.1.1.1" class="ltx_text" style="font-size:70%;--ltx-fg-color:#000000;">You will be given one conversation history and the corresponding facts.</span></span>
<span id="A1.F7.p2.pic1.1.2" class="ltx_p"><span id="A1.F7.p2.pic1.1.2.1" class="ltx_text" style="font-size:70%;--ltx-fg-color:#000000;">Your task is to rate the conversation history and the corresponding facts on one metric.</span></span>
<span id="A1.F7.p2.pic1.1.3" class="ltx_p"><span id="A1.F7.p2.pic1.1.3.1" class="ltx_text" style="font-size:70%;--ltx-fg-color:#000000;">Please make sure you read and understand these instructions carefully.</span></span>
<span id="A1.F7.p2.pic1.1.4" class="ltx_p"><span id="A1.F7.p2.pic1.1.4.1" class="ltx_text" style="font-size:70%;--ltx-fg-color:#000000;">Evaluation Criteria:</span></span>
<span id="A1.F7.p2.pic1.1.5" class="ltx_p"><span id="A1.F7.p2.pic1.1.5.1" class="ltx_text" style="font-size:70%;--ltx-fg-color:#000000;">Naturalness (1-5) - In order to thoroughly evaluate a model’s response according to the conversation history and the corresponding facts, you are required to rate the naturalness of the model’s response on a scale of 1 to 5, where 1 indicates very unnatural and 5 indicates very natural.</span></span>
<span id="A1.F7.p2.pic1.1.6" class="ltx_p"><span id="A1.F7.p2.pic1.1.6.1" class="ltx_text" style="font-size:70%;--ltx-fg-color:#000000;">Coherence (1-5) - the collective quality of all sentences. We align this dimension with the DUC quality question of structure and coherence whereby &quot;the conversation should be well-structured and well-organised. The conversation should not just be a heap of related information, but should build from sentence to a coherent body of information about a topic.&quot;</span></span>
<span id="A1.F7.p2.pic1.1.7" class="ltx_p"><span id="A1.F7.p2.pic1.1.7.1" class="ltx_text" style="font-size:70%;--ltx-fg-color:#000000;">Engagingness (1-5) - engagingness is defined as how effectively the response captures and maintains the interest of the listener or conversational partner</span></span>
<span id="A1.F7.p2.pic1.1.8" class="ltx_p"><span id="A1.F7.p2.pic1.1.8.1" class="ltx_text" style="font-size:70%;--ltx-fg-color:#000000;">Groundedness (1-5) - groundedness measures the level of factual consistency and relevance in a conversation, ensuring that responses are accurate, contextually appropriate, and supported by reliable sources.</span></span>
<span id="A1.F7.p2.pic1.1.9" class="ltx_p"><span id="A1.F7.p2.pic1.1.9.1" class="ltx_text" style="font-size:70%;--ltx-fg-color:#000000;">Evaluation Steps:</span></span>
<span id="A1.F7.p2.pic1.1.10" class="ltx_p"><span id="A1.F7.p2.pic1.1.10.1" class="ltx_text" style="font-size:70%;--ltx-fg-color:#000000;">1. Read the conversation history and the corresponding facts carefully and identify the main topic and key points.
<br class="ltx_break">2. Read the conversation history and the corresponding facts. Check if the conversation covers the main topic and key points of the corresponding facts, and if it presents them in a clear and logical order.
<br class="ltx_break">3. Assign scores on a scale of 1 to 5, where 1 is the lowest and 5 is the highest based on the Evaluation Criteria.</span></span>
<span id="A1.F7.p2.pic1.1.11" class="ltx_p"><span id="A1.F7.p2.pic1.1.11.1" class="ltx_text" style="font-size:70%;--ltx-fg-color:#000000;">Example:</span></span>
<span id="A1.F7.p2.pic1.1.12" class="ltx_p"><span id="A1.F7.p2.pic1.1.12.1" class="ltx_text" style="font-size:70%;--ltx-fg-color:#000000;">Conversation:</span></span>
<span id="A1.F7.p2.pic1.1.13" class="ltx_p"><span id="A1.F7.p2.pic1.1.13.1" class="ltx_text" style="font-size:70%;--ltx-fg-color:#000000;">{conversation}</span></span>
<span id="A1.F7.p2.pic1.1.14" class="ltx_p"><span id="A1.F7.p2.pic1.1.14.1" class="ltx_text" style="font-size:70%;--ltx-fg-color:#000000;">Corresponding Facts:</span></span>
<span id="A1.F7.p2.pic1.1.15" class="ltx_p"><span id="A1.F7.p2.pic1.1.15.1" class="ltx_text" style="font-size:70%;--ltx-fg-color:#000000;">{fact}</span></span>
<span id="A1.F7.p2.pic1.1.16" class="ltx_p"><span id="A1.F7.p2.pic1.1.16.1" class="ltx_text" style="font-size:70%;--ltx-fg-color:#000000;">Evaluation Form (scores ONLY):</span></span>
<span id="A1.F7.p2.pic1.1.17" class="ltx_p"><span id="A1.F7.p2.pic1.1.17.1" class="ltx_text" style="font-size:70%;--ltx-fg-color:#000000;">- Naturalness:
<br class="ltx_break">- Coherence:
<br class="ltx_break">- Engagingness:
<br class="ltx_break">- Groundedness:
<br class="ltx_break"></span></span>
</span></span></span></foreignobject></g></g></svg>