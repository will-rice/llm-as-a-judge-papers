<span id="Sx2.SSx2.p4.pic1.2.2" class="ltx_p"><span id="Sx2.SSx2.p4.pic1.2.2.1" class="ltx_text ltx_font_typewriter" style="--ltx-fg-color:#000000;">Return a single score between 0 and 1:
