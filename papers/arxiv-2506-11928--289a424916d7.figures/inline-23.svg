<svg id="S15.SS0.SSS0.Px9.p2.pic1" class="ltx_picture" height="594.57" overflow="visible" version="1.1" viewbox="0 0 477.38 594.57" width="477.38"><g style="--ltx-stroke-color:#000000;--ltx-fill-color:#000000;" fill="#000000" stroke="#000000" stroke-width="0.4pt" transform="translate(0,594.57) matrix(1 0 0 -1 0 0)"><g style="--ltx-fill-color:#BF0000;" fill="#BF0000" fill-opacity="1.0"><path style="stroke:none" d="M 0 5.91 L 0 588.67 C 0 591.93 2.64 594.57 5.91 594.57 L 471.47 594.57 C 474.73 594.57 477.38 591.93 477.38 588.67 L 477.38 5.91 C 477.38 2.64 474.73 0 471.47 0 L 5.91 0 C 2.64 0 0 2.64 0 5.91 Z" /></g><g style="--ltx-fill-color:#FFF2F2;" fill="#FFF2F2" fill-opacity="1.0"><path style="stroke:none" d="M 1.97 5.91 L 1.97 568.92 L 475.41 568.92 L 475.41 5.91 C 475.41 3.73 473.65 1.97 471.47 1.97 L 5.91 1.97 C 3.73 1.97 1.97 3.73 1.97 5.91 Z" /></g><g fill-opacity="1.0" transform="matrix(1.0 0.0 0.0 1.0 21.65 578.29)"><foreignobject style="--ltx-fo-width:31.37em;--ltx-fo-height:0.75em;--ltx-fo-depth:0.25em;font-size:10pt;" height="13.84" overflow="visible" transform="matrix(1 0 0 -1 0 10.38)" width="434.07"><span class="ltx_foreignobject_container"><span class="ltx_foreignobject_content">
<span id="S15.SS0.SSS0.Px9.p2.pic1.1" class="ltx_inline-block ltx_minipage ltx_align_bottom" style="width:31.37em;">
<span id="S15.SS0.SSS0.Px9.p2.pic1.1.1" class="ltx_p"><a href="https://codeforces.com/problemset/problem/1994/C" title class="ltx_ref ltx_href" style="--ltx-fg-color:#FFFFFF;">Example Dynamic Programming Problem (Rated 1600)</a></span>
</span></span></span></foreignobject></g><g fill-opacity="1.0" transform="matrix(1.0 0.0 0.0 1.0 21.65 16.47)"><foreignobject style="--ltx-fo-width:31.37em;--ltx-fo-height:39.07em;--ltx-fo-depth:0.19em;font-size:10pt;" height="543.34" overflow="visible" transform="matrix(1 0 0 -1 0 540.65)" width="434.07"><span class="ltx_foreignobject_container"><span class="ltx_foreignobject_content">
<span id="S15.SS0.SSS0.Px9.p2.pic1.2" class="ltx_inline-block ltx_minipage ltx_align_bottom" style="width:31.37em;">
<span id="S15.SS0.SSS0.Px9.p2.pic1.2.1" class="ltx_p"><span id="S15.SS0.SSS0.Px9.p2.pic1.2.1.1" class="ltx_text" style="--ltx-fg-color:#000000;">Yaroslav is playing a computer game, and at one of the levels, he encountered <math id="S15.SS0.SSS0.Px9.p2.pic1.m1" class="ltx_Math" alttext="n" display="inline" intent=":literal"><semantics><mi style="--ltx-fg-color:#000000;" mathcolor="#000000">n</mi><annotation encoding="application/x-tex">n</annotation></semantics></math> mushrooms arranged in a row. Each mushroom has its own level of toxicity; the <math id="S15.SS0.SSS0.Px9.p2.pic1.m2" class="ltx_Math" alttext="i" display="inline" intent=":literal"><semantics><mi style="--ltx-fg-color:#000000;" mathcolor="#000000">i</mi><annotation encoding="application/x-tex">i</annotation></semantics></math>-th mushroom from the beginning has a toxicity level of <math id="S15.SS0.SSS0.Px9.p2.pic1.m3" class="ltx_Math" alttext="a_{i}" display="inline" intent=":literal"><semantics><msub><mi style="--ltx-fg-color:#000000;" mathcolor="#000000">a</mi><mi style="--ltx-fg-color:#000000;" mathcolor="#000000">i</mi></msub><annotation encoding="application/x-tex">a_{i}</annotation></semantics></math>. Yaroslav can choose two integers <math id="S15.SS0.SSS0.Px9.p2.pic1.m4" class="ltx_Math" alttext="1\leq l\leq r\leq n" display="inline" intent=":literal"><semantics><mrow><mn style="--ltx-fg-color:#000000;" mathcolor="#000000">1</mn><mo style="--ltx-fg-color:#000000;" mathcolor="#000000">≤</mo><mi style="--ltx-fg-color:#000000;" mathcolor="#000000">l</mi><mo style="--ltx-fg-color:#000000;" mathcolor="#000000">≤</mo><mi style="--ltx-fg-color:#000000;" mathcolor="#000000">r</mi><mo style="--ltx-fg-color:#000000;" mathcolor="#000000">≤</mo><mi style="--ltx-fg-color:#000000;" mathcolor="#000000">n</mi></mrow><annotation encoding="application/x-tex">1\leq l\leq r\leq n</annotation></semantics></math>, and then his character will take turns from left to right to eat mushrooms from this subsegment one by one, i.e., the mushrooms with numbers <math id="S15.SS0.SSS0.Px9.p2.pic1.m5" class="ltx_Math" alttext="l,l+1,l+2,\dots,r" display="inline" intent=":literal"><semantics><mrow><mi style="--ltx-fg-color:#000000;" mathcolor="#000000">l</mi><mo style="--ltx-fg-color:#000000;" mathcolor="#000000">,</mo><mrow><mi style="--ltx-fg-color:#000000;" mathcolor="#000000">l</mi><mo style="--ltx-fg-color:#000000;" mathcolor="#000000">+</mo><mn style="--ltx-fg-color:#000000;" mathcolor="#000000">1</mn></mrow><mo style="--ltx-fg-color:#000000;" mathcolor="#000000">,</mo><mrow><mi style="--ltx-fg-color:#000000;" mathcolor="#000000">l</mi><mo style="--ltx-fg-color:#000000;" mathcolor="#000000">+</mo><mn style="--ltx-fg-color:#000000;" mathcolor="#000000">2</mn></mrow><mo style="--ltx-fg-color:#000000;" mathcolor="#000000">,</mo><mi style="--ltx-fg-color:#000000;" mathcolor="#000000" mathvariant="normal">…</mi><mo style="--ltx-fg-color:#000000;" mathcolor="#000000">,</mo><mi style="--ltx-fg-color:#000000;" mathcolor="#000000">r</mi></mrow><annotation encoding="application/x-tex">l,l+1,l+2,\dots,r</annotation></semantics></math>. 
<br class="ltx_break">
<br class="ltx_break">The character has a toxicity level <math id="S15.SS0.SSS0.Px9.p2.pic1.m6" class="ltx_Math" alttext="g" display="inline" intent=":literal"><semantics><mi style="--ltx-fg-color:#000000;" mathcolor="#000000">g</mi><annotation encoding="application/x-tex">g</annotation></semantics></math>, initially equal to <math id="S15.SS0.SSS0.Px9.p2.pic1.m7" class="ltx_Math" alttext="0" display="inline" intent=":literal"><semantics><mn style="--ltx-fg-color:#000000;" mathcolor="#000000">0</mn><annotation encoding="application/x-tex">0</annotation></semantics></math>. The computer game is defined by the number <math id="S15.SS0.SSS0.Px9.p2.pic1.m8" class="ltx_Math" alttext="x" display="inline" intent=":literal"><semantics><mi style="--ltx-fg-color:#000000;" mathcolor="#000000">x</mi><annotation encoding="application/x-tex">x</annotation></semantics></math>—the maximum toxicity level at any given time. When eating a mushroom with toxicity level <math id="S15.SS0.SSS0.Px9.p2.pic1.m9" class="ltx_Math" alttext="k" display="inline" intent=":literal"><semantics><mi style="--ltx-fg-color:#000000;" mathcolor="#000000">k</mi><annotation encoding="application/x-tex">k</annotation></semantics></math>, the following happens:</span></span>
<span id="S15.I6" class="ltx_itemize">
<span id="S15.I6.i1" class="ltx_item" style="list-style-type:none;"><span class="ltx_tag ltx_tag_item">•</span> 
<span id="S15.I6.i1.p1" class="ltx_para">
<span id="S15.I6.i1.p1.1" class="ltx_p"><span id="S15.I6.i1.p1.1.1" class="ltx_text" style="--ltx-fg-color:#000000;">The toxicity level of the character is increased by </span><math id="S15.I6.i1.p1.m1" class="ltx_Math" alttext="k" display="inline" intent=":literal"><semantics><mi style="--ltx-fg-color:#000000;" mathcolor="#000000">k</mi><annotation encoding="application/x-tex">k</annotation></semantics></math><span id="S15.I6.i1.p1.1.2" class="ltx_text" style="--ltx-fg-color:#000000;">.</span></span>
</span></span>
<span id="S15.I6.i2" class="ltx_item" style="list-style-type:none;"><span class="ltx_tag ltx_tag_item">•</span> 
<span id="S15.I6.i2.p1" class="ltx_para">
<span id="S15.I6.i2.p1.1" class="ltx_p"><span id="S15.I6.i2.p1.1.1" class="ltx_text" style="--ltx-fg-color:#000000;">If </span><math id="S15.I6.i2.p1.m1" class="ltx_Math" alttext="g\leq x" display="inline" intent=":literal"><semantics><mrow><mi style="--ltx-fg-color:#000000;" mathcolor="#000000">g</mi><mo style="--ltx-fg-color:#000000;" mathcolor="#000000">≤</mo><mi style="--ltx-fg-color:#000000;" mathcolor="#000000">x</mi></mrow><annotation encoding="application/x-tex">g\leq x</annotation></semantics></math><span id="S15.I6.i2.p1.1.2" class="ltx_text" style="--ltx-fg-color:#000000;">, the process continues; otherwise, </span><math id="S15.I6.i2.p1.m2" class="ltx_Math" alttext="g" display="inline" intent=":literal"><semantics><mi style="--ltx-fg-color:#000000;" mathcolor="#000000">g</mi><annotation encoding="application/x-tex">g</annotation></semantics></math><span id="S15.I6.i2.p1.1.3" class="ltx_text" style="--ltx-fg-color:#000000;"> becomes zero and the process continues.</span></span>
</span></span>
</span>
<span id="S15.SS0.SSS0.Px9.p2.pic1.2.2" class="ltx_p"><span id="S15.SS0.SSS0.Px9.p2.pic1.2.2.1" class="ltx_text" style="--ltx-fg-color:#000000;">Yaroslav became interested in how many ways there are to choose the values of <math id="S15.SS0.SSS0.Px9.p2.pic1.m10" class="ltx_Math" alttext="l" display="inline" intent=":literal"><semantics><mi style="--ltx-fg-color:#000000;" mathcolor="#000000">l</mi><annotation encoding="application/x-tex">l</annotation></semantics></math> and <math id="S15.SS0.SSS0.Px9.p2.pic1.m11" class="ltx_Math" alttext="r" display="inline" intent=":literal"><semantics><mi style="--ltx-fg-color:#000000;" mathcolor="#000000">r</mi><annotation encoding="application/x-tex">r</annotation></semantics></math> such that the final value of <math id="S15.SS0.SSS0.Px9.p2.pic1.m12" class="ltx_Math" alttext="g" display="inline" intent=":literal"><semantics><mi style="--ltx-fg-color:#000000;" mathcolor="#000000">g</mi><annotation encoding="application/x-tex">g</annotation></semantics></math> is not zero. Help Yaroslav find this number! 
<br class="ltx_break">
<br class="ltx_break"><span id="S15.SS0.SSS0.Px9.p2.pic1.2.2.1.1" class="ltx_text ltx_font_bold">Input</span> 
<br class="ltx_break">Each test consists of multiple test cases. The first line contains an integer <math id="S15.SS0.SSS0.Px9.p2.pic1.m13" class="ltx_Math" alttext="t\ (1\leq t\leq 10^{4})" display="inline" intent=":literal"><semantics><mrow><mi style="--ltx-fg-color:#000000;" mathcolor="#000000">t</mi><mo lspace="0.500em">⁡</mo><mrow><mo style="--ltx-fg-color:#000000;" mathcolor="#000000" stretchy="false">(</mo><mrow><mn style="--ltx-fg-color:#000000;" mathcolor="#000000">1</mn><mo style="--ltx-fg-color:#000000;" mathcolor="#000000">≤</mo><mi style="--ltx-fg-color:#000000;" mathcolor="#000000">t</mi><mo style="--ltx-fg-color:#000000;" mathcolor="#000000">≤</mo><msup><mn style="--ltx-fg-color:#000000;" mathcolor="#000000">10</mn><mn style="--ltx-fg-color:#000000;" mathcolor="#000000">4</mn></msup></mrow><mo style="--ltx-fg-color:#000000;" mathcolor="#000000" stretchy="false">)</mo></mrow></mrow><annotation encoding="application/x-tex">t\ (1\leq t\leq 10^{4})</annotation></semantics></math>—the number of test cases. Then follows the description of the test cases. 
<br class="ltx_break">
<br class="ltx_break">The first line of each test case contains two integers <math id="S15.SS0.SSS0.Px9.p2.pic1.m14" class="ltx_math_unparsed" alttext="n,x\ (1\leq n\leq 2\cdot 10^{5},1\leq x\leq 10^{9})" display="inline" intent=":literal"><semantics><mrow><mi style="--ltx-fg-color:#000000;" mathcolor="#000000">n</mi><mo style="--ltx-fg-color:#000000;" mathcolor="#000000">,</mo><mi style="--ltx-fg-color:#000000;" mathcolor="#000000">x</mi><mrow><mo style="--ltx-fg-color:#000000;" lspace="0.500em" mathcolor="#000000" stretchy="false">(</mo><mn style="--ltx-fg-color:#000000;" mathcolor="#000000">1</mn><mo style="--ltx-fg-color:#000000;" mathcolor="#000000">≤</mo><mi style="--ltx-fg-color:#000000;" mathcolor="#000000">n</mi><mo style="--ltx-fg-color:#000000;" mathcolor="#000000">≤</mo><mn style="--ltx-fg-color:#000000;" mathcolor="#000000">2</mn><mo style="--ltx-fg-color:#000000;" lspace="0.222em" mathcolor="#000000" rspace="0.222em">⋅</mo><msup><mn style="--ltx-fg-color:#000000;" mathcolor="#000000">10</mn><mn style="--ltx-fg-color:#000000;" mathcolor="#000000">5</mn></msup><mo style="--ltx-fg-color:#000000;" mathcolor="#000000">,</mo><mn style="--ltx-fg-color:#000000;" mathcolor="#000000">1</mn><mo style="--ltx-fg-color:#000000;" mathcolor="#000000">≤</mo><mi style="--ltx-fg-color:#000000;" mathcolor="#000000">x</mi><mo style="--ltx-fg-color:#000000;" mathcolor="#000000">≤</mo><msup><mn style="--ltx-fg-color:#000000;" mathcolor="#000000">10</mn><mn style="--ltx-fg-color:#000000;" mathcolor="#000000">9</mn></msup><mo style="--ltx-fg-color:#000000;" mathcolor="#000000" stretchy="false">)</mo></mrow></mrow><annotation encoding="application/x-tex">n,x\ (1\leq n\leq 2\cdot 10^{5},1\leq x\leq 10^{9})</annotation></semantics></math>—the number of mushrooms and the maximum toxicity level. 
<br class="ltx_break">
<br class="ltx_break">The second line of each test case contains <math id="S15.SS0.SSS0.Px9.p2.pic1.m15" class="ltx_Math" alttext="n" display="inline" intent=":literal"><semantics><mi style="--ltx-fg-color:#000000;" mathcolor="#000000">n</mi><annotation encoding="application/x-tex">n</annotation></semantics></math> numbers <math id="S15.SS0.SSS0.Px9.p2.pic1.m16" class="ltx_Math" alttext="a_{1},a_{2},\dots a_{n}\ (1\leq a_{i}\leq 10^{9})" display="inline" intent=":literal"><semantics><mrow><msub><mi style="--ltx-fg-color:#000000;" mathcolor="#000000">a</mi><mn style="--ltx-fg-color:#000000;" mathcolor="#000000">1</mn></msub><mo style="--ltx-fg-color:#000000;" mathcolor="#000000">,</mo><msub><mi style="--ltx-fg-color:#000000;" mathcolor="#000000">a</mi><mn style="--ltx-fg-color:#000000;" mathcolor="#000000">2</mn></msub><mo style="--ltx-fg-color:#000000;" mathcolor="#000000">,</mo><mrow><mi style="--ltx-fg-color:#000000;" mathcolor="#000000" mathvariant="normal">…</mi><mo lspace="0em" rspace="0em">​</mo><msub><mi style="--ltx-fg-color:#000000;" mathcolor="#000000">a</mi><mi style="--ltx-fg-color:#000000;" mathcolor="#000000">n</mi></msub><mo lspace="0em" rspace="0em">​</mo><mrow><mo style="--ltx-fg-color:#000000;" mathcolor="#000000" stretchy="false">(</mo><mrow><mn style="--ltx-fg-color:#000000;" mathcolor="#000000">1</mn><mo style="--ltx-fg-color:#000000;" mathcolor="#000000">≤</mo><msub><mi style="--ltx-fg-color:#000000;" mathcolor="#000000">a</mi><mi style="--ltx-fg-color:#000000;" mathcolor="#000000">i</mi></msub><mo style="--ltx-fg-color:#000000;" mathcolor="#000000">≤</mo><msup><mn style="--ltx-fg-color:#000000;" mathcolor="#000000">10</mn><mn style="--ltx-fg-color:#000000;" mathcolor="#000000">9</mn></msup></mrow><mo style="--ltx-fg-color:#000000;" mathcolor="#000000" stretchy="false">)</mo></mrow></mrow></mrow><annotation encoding="application/x-tex">a_{1},a_{2},\dots a_{n}\ (1\leq a_{i}\leq 10^{9})</annotation></semantics></math>. 
<br class="ltx_break">
<br class="ltx_break">It is guaranteed that the sum of <math id="S15.SS0.SSS0.Px9.p2.pic1.m17" class="ltx_Math" alttext="n" display="inline" intent=":literal"><semantics><mi style="--ltx-fg-color:#000000;" mathcolor="#000000">n</mi><annotation encoding="application/x-tex">n</annotation></semantics></math> over all test cases does not exceed <math id="S15.SS0.SSS0.Px9.p2.pic1.m18" class="ltx_Math" alttext="2\cdot 10^{5}" display="inline" intent=":literal"><semantics><mrow><mn style="--ltx-fg-color:#000000;" mathcolor="#000000">2</mn><mo style="--ltx-fg-color:#000000;" lspace="0.222em" mathcolor="#000000" rspace="0.222em">⋅</mo><msup><mn style="--ltx-fg-color:#000000;" mathcolor="#000000">10</mn><mn style="--ltx-fg-color:#000000;" mathcolor="#000000">5</mn></msup></mrow><annotation encoding="application/x-tex">2\cdot 10^{5}</annotation></semantics></math>. 
<br class="ltx_break">
<br class="ltx_break"><span id="S15.SS0.SSS0.Px9.p2.pic1.2.2.1.2" class="ltx_text ltx_font_bold">Output</span> 
<br class="ltx_break">For each test case, output a single number—the number of subsegments such that the final value of <math id="S15.SS0.SSS0.Px9.p2.pic1.m19" class="ltx_Math" alttext="g" display="inline" intent=":literal"><semantics><mi style="--ltx-fg-color:#000000;" mathcolor="#000000">g</mi><annotation encoding="application/x-tex">g</annotation></semantics></math> will not be zero.</span></span>
</span></span></span></foreignobject></g></g></svg>