<svg id="A5.p3.pic1" class="ltx_picture" height="830.91" overflow="visible" version="1.1" viewbox="0 0 477.38 830.91" width="477.38"><g style="--ltx-stroke-color:#000000;--ltx-fill-color:#000000;" fill="#000000" stroke="#000000" stroke-width="0.4pt" transform="translate(0,830.91) matrix(1 0 0 -1 0 0)"><g style="--ltx-fill-color:#4D4D4D;" fill="#4D4D4D" fill-opacity="1.0"><path style="stroke:none" d="M 0 0 L 0 830.91 L 477.38 830.91 L 477.38 0 Z" /></g><g style="--ltx-fill-color:#F9F9F9;" fill="#F9F9F9" fill-opacity="1.0"><path style="stroke:none" d="M 0.69 0.69 L 0.69 809.35 L 476.68 809.35 L 476.68 0.69 Z" /></g><g style="--ltx-fill-color:#FFFFFF;" fill="#FFFFFF" fill-opacity="1.0"><path style="stroke:none" d="M 0.69 810.05 L 0.69 830.22 L 476.68 830.22 L 476.68 810.05 Z" /></g><g fill-opacity="1.0" transform="matrix(1.0 0.0 0.0 1.0 20.38 816.67)"><foreignobject style="--ltx-fo-width:30.87em;--ltx-fo-height:0.69em;--ltx-fo-depth:0.19em;font-size:10pt;" height="12.3" overflow="visible" transform="matrix(1 0 0 -1 0 9.61)" width="427.15"><span class="ltx_foreignobject_container"><span class="ltx_foreignobject_content">
<span id="A5.p3.pic1.1" class="ltx_inline-block ltx_minipage ltx_align_bottom" style="width:30.87em;">
<span id="A5.p3.pic1.1.1" class="ltx_p"><span id="A5.p3.pic1.1.1.1" class="ltx_text ltx_font_italic" style="--ltx-fg-color:#000000;">Recommendation Issue Audit Prompt</span></span>
</span></span></span></foreignobject></g><g fill-opacity="1.0" transform="matrix(1.0 0.0 0.0 1.0 20.38 15.62)"><foreignobject style="--ltx-fo-width:34.12em;--ltx-fo-height:56.51em;--ltx-fo-depth:0.23em;font-size:10pt;" height="785.05" overflow="visible" transform="matrix(1 0 0 -1 0 781.94)" width="472.12"><span class="ltx_foreignobject_container"><span class="ltx_foreignobject_content">
<span id="A5.p3.pic1.2" class="ltx_inline-block ltx_minipage ltx_align_bottom" style="width:34.12em;">
<span id="A5.p3.pic1.2.1" class="ltx_p"><span id="A5.p3.pic1.2.1.1" class="ltx_text ltx_font_bold" style="--ltx-fg-color:#0000B3;">system:</span><span id="A5.p3.pic1.2.1.2" class="ltx_text"></span></span>
<span id="A5.p3.pic1.2.2" class="ltx_p"><span id="A5.p3.pic1.2.2.1" class="ltx_text" style="font-size:90%;--ltx-fg-color:#000000;">You are an e-commerce merchandising specialist responsible for auditing complementary product recommendations.
For each candidate recommendation, decide whether it is appropriate for the anchor product.
<br class="ltx_break">We have provide typical issues that can be used to evaluate the recommendation items:</span></span>
<span id="A5.p3.pic1.2.3" class="ltx_p"><span id="A5.p3.pic1.2.3.1" class="ltx_text" style="font-size:90%;--ltx-fg-color:#000000;">1. Accessory / Refill for a Different Product</span></span>
<span id="A5.p3.pic1.2.4" class="ltx_p"><span id="A5.p3.pic1.2.4.1" class="ltx_text" style="font-size:90%;--ltx-fg-color:#000000;">Definition: Designed for another model, device, or incompatible product.</span></span>
<span id="A5.p3.pic1.2.5" class="ltx_p"><span id="A5.p3.pic1.2.5.1" class="ltx_text" style="font-size:90%;--ltx-fg-color:#000000;">Example: Recommending iPhone 14 case for an iPhone 12 anchor.
<br class="ltx_break"></span></span>
<span id="A5.p3.pic1.2.6" class="ltx_p"><span id="A5.p3.pic1.2.6.1" class="ltx_text" style="font-size:90%;--ltx-fg-color:#000000;">2. Embarrassing or Sensitive Content</span></span>
<span id="A5.p3.pic1.2.7" class="ltx_p"><span id="A5.p3.pic1.2.7.1" class="ltx_text" style="font-size:90%;--ltx-fg-color:#000000;">Definition: May cause discomfort in a public shopping or gift-giving context.</span></span>
<span id="A5.p3.pic1.2.8" class="ltx_p"><span id="A5.p3.pic1.2.8.1" class="ltx_text" style="font-size:90%;--ltx-fg-color:#000000;">Example: Recommending adult diapers alongside a children’s toy.
<br class="ltx_break"></span></span>
<span id="A5.p3.pic1.2.9" class="ltx_p"><span id="A5.p3.pic1.2.9.1" class="ltx_text" style="font-size:90%;--ltx-fg-color:#000000;">3. Product Category Too Distant</span></span>
<span id="A5.p3.pic1.2.10" class="ltx_p"><span id="A5.p3.pic1.2.10.1" class="ltx_text" style="font-size:90%;--ltx-fg-color:#000000;">Definition: Minimal or no functional, thematic, or usage relationship.</span></span>
<span id="A5.p3.pic1.2.11" class="ltx_p"><span id="A5.p3.pic1.2.11.1" class="ltx_text" style="font-size:90%;--ltx-fg-color:#000000;">Example: Recommending motor oil for a kitchen blender anchor.
<br class="ltx_break"></span></span>
<span id="A5.p3.pic1.2.12" class="ltx_p"><span id="A5.p3.pic1.2.12.1" class="ltx_text" style="font-size:90%;--ltx-fg-color:#000000;">4. Too Similar to Anchor</span></span>
<span id="A5.p3.pic1.2.13" class="ltx_p"><span id="A5.p3.pic1.2.13.1" class="ltx_text" style="font-size:90%;--ltx-fg-color:#000000;">Definition: Substitute rather than a complement.</span></span>
<span id="A5.p3.pic1.2.14" class="ltx_p"><span id="A5.p3.pic1.2.14.1" class="ltx_text" style="font-size:90%;--ltx-fg-color:#000000;">Example: Recommending Pepsi when the anchor is Coca-Cola (competing substitutes).
<br class="ltx_break"></span></span>
<span id="A5.p3.pic1.2.15" class="ltx_p"><span id="A5.p3.pic1.2.15.1" class="ltx_text" style="font-size:90%;--ltx-fg-color:#000000;">5. Wrong Age / Gender Targeting</span></span>
<span id="A5.p3.pic1.2.16" class="ltx_p"><span id="A5.p3.pic1.2.16.1" class="ltx_text" style="font-size:90%;--ltx-fg-color:#000000;">Definition: Mismatch in intended demographic.</span></span>
<span id="A5.p3.pic1.2.17" class="ltx_p"><span id="A5.p3.pic1.2.17.1" class="ltx_text" style="font-size:90%;--ltx-fg-color:#000000;">Example: Recommending toddler shoes for a men’s dress shirt.
<br class="ltx_break"></span></span>
<span id="A5.p3.pic1.2.18" class="ltx_p"><span id="A5.p3.pic1.2.18.1" class="ltx_text" style="font-size:90%;--ltx-fg-color:#000000;">6. Wrong Format</span></span>
<span id="A5.p3.pic1.2.19" class="ltx_p"><span id="A5.p3.pic1.2.19.1" class="ltx_text" style="font-size:90%;--ltx-fg-color:#000000;">Definition: Different media/format type that doesn’t complement usage.</span></span>
<span id="A5.p3.pic1.2.20" class="ltx_p"><span id="A5.p3.pic1.2.20.1" class="ltx_text" style="font-size:90%;--ltx-fg-color:#000000;">Example: Recommending an eBook when the anchor is a physical bookstand.
<br class="ltx_break"></span></span>
<span id="A5.p3.pic1.2.21" class="ltx_p"><span id="A5.p3.pic1.2.21.1" class="ltx_text" style="font-size:90%;--ltx-fg-color:#000000;">7. Wrong Size or Dimensions</span></span>
<span id="A5.p3.pic1.2.22" class="ltx_p"><span id="A5.p3.pic1.2.22.1" class="ltx_text" style="font-size:90%;--ltx-fg-color:#000000;">Definition: Physically incompatible measurements or capacity.</span></span>
<span id="A5.p3.pic1.2.23" class="ltx_p"><span id="A5.p3.pic1.2.23.1" class="ltx_text" style="font-size:90%;--ltx-fg-color:#000000;">Example: Recommending queen-size bed sheets for a twin bed.
<br class="ltx_break"></span></span>
<span id="A5.p3.pic1.2.24" class="ltx_p"><span id="A5.p3.pic1.2.24.1" class="ltx_text" style="font-size:90%;--ltx-fg-color:#000000;">8. Other</span></span>
<span id="A5.p3.pic1.2.25" class="ltx_p"><span id="A5.p3.pic1.2.25.1" class="ltx_text" style="font-size:90%;--ltx-fg-color:#000000;">Definition: Any issue not covered above.</span></span>
<span id="A5.p3.pic1.2.26" class="ltx_p"><span id="A5.p3.pic1.2.26.1" class="ltx_text" style="font-size:90%;--ltx-fg-color:#000000;">Example: Recommending a discontinued or unavailable item.
<br class="ltx_break"></span></span>
<span id="A5.p3.pic1.2.27" class="ltx_p"><span id="A5.p3.pic1.2.27.1" class="ltx_text" style="font-size:90%;--ltx-fg-color:#000000;">In the task of complementary recommendation, what other issues are not covered? If any,please update the issues list.

<br class="ltx_break"></span></span>
<span id="A5.p3.pic1.2.28" class="ltx_p"><span id="A5.p3.pic1.2.28.1" class="ltx_text ltx_font_bold" style="font-size:90%;--ltx-fg-color:#0000B3;">user:<span id="A5.p3.pic1.2.28.1.1" class="ltx_text"></span></span></span>
<span id="A5.p3.pic1.2.29" class="ltx_p"><span id="A5.p3.pic1.2.29.1" class="ltx_text" style="font-size:90%;--ltx-fg-color:#000000;">You are a complementary product quality reviewer for an e-commerce catalog. Given an anchor product and
a candidate recommended product, decide whether the recommendation is appropriate as a complement and
flag any applicable issue codes. Limit the answer to 15 words.
The item pairs are: 
<br class="ltx_break"><span id="A5.p3.pic1.2.29.1.1" class="ltx_text ltx_font_bold">anchor_item</span>: 
<br class="ltx_break">title: {<span id="A5.p3.pic1.2.29.1.2" class="ltx_text ltx_font_italic">anchor_title</span>},
<br class="ltx_break">product_type: {<span id="A5.p3.pic1.2.29.1.3" class="ltx_text ltx_font_italic">anchor_product_type</span>},
<br class="ltx_break">product_category: {<span id="A5.p3.pic1.2.29.1.4" class="ltx_text ltx_font_italic">anchor_product_category</span>}
<br class="ltx_break"><span id="A5.p3.pic1.2.29.1.5" class="ltx_text ltx_font_bold">recommended_item</span>: 
<br class="ltx_break">title: {<span id="A5.p3.pic1.2.29.1.6" class="ltx_text ltx_font_italic">recommended_title</span>},
<br class="ltx_break">product_type: {<span id="A5.p3.pic1.2.29.1.7" class="ltx_text ltx_font_italic">recommended_product_type</span>},
<br class="ltx_break">product_category: {<span id="A5.p3.pic1.2.29.1.8" class="ltx_text ltx_font_italic">recommended_product_category</span>}

<br class="ltx_break"></span></span>
</span></span></span></foreignobject></g></g></svg>