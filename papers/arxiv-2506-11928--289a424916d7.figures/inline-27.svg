<svg id="S15.SS0.SSS0.Px11.p2.pic1" class="ltx_picture" height="362.42" overflow="visible" version="1.1" viewbox="0 0 477.38 362.42" width="477.38"><g style="--ltx-stroke-color:#000000;--ltx-fill-color:#000000;" fill="#000000" stroke="#000000" stroke-width="0.4pt" transform="translate(0,362.42) matrix(1 0 0 -1 0 0)"><g style="--ltx-fill-color:#BF0000;" fill="#BF0000" fill-opacity="1.0"><path style="stroke:none" d="M 0 5.91 L 0 356.51 C 0 359.77 2.64 362.42 5.91 362.42 L 471.47 362.42 C 474.73 362.42 477.38 359.77 477.38 356.51 L 477.38 5.91 C 477.38 2.64 474.73 0 471.47 0 L 5.91 0 C 2.64 0 0 2.64 0 5.91 Z" /></g><g style="--ltx-fill-color:#FFF2F2;" fill="#FFF2F2" fill-opacity="1.0"><path style="stroke:none" d="M 1.97 5.91 L 1.97 336.77 L 475.41 336.77 L 475.41 5.91 C 475.41 3.73 473.65 1.97 471.47 1.97 L 5.91 1.97 C 3.73 1.97 1.97 3.73 1.97 5.91 Z" /></g><g fill-opacity="1.0" transform="matrix(1.0 0.0 0.0 1.0 21.65 346.13)"><foreignobject style="--ltx-fo-width:31.37em;--ltx-fo-height:0.75em;--ltx-fo-depth:0.25em;font-size:10pt;" height="13.84" overflow="visible" transform="matrix(1 0 0 -1 0 10.38)" width="434.07"><span class="ltx_foreignobject_container"><span class="ltx_foreignobject_content">
<span id="S15.SS0.SSS0.Px11.p2.pic1.1" class="ltx_inline-block ltx_minipage ltx_align_bottom" style="width:31.37em;">
<span id="S15.SS0.SSS0.Px11.p2.pic1.1.1" class="ltx_p"><a href="https://codeforces.com/problemset/problem/2050/G" title class="ltx_ref ltx_href" style="--ltx-fg-color:#FFFFFF;">Example Tree Problem (Rated 1900)</a></span>
</span></span></span></foreignobject></g><g fill-opacity="1.0" transform="matrix(1.0 0.0 0.0 1.0 21.65 16.47)"><foreignobject style="--ltx-fo-width:31.37em;--ltx-fo-height:22.29em;--ltx-fo-depth:0.19em;font-size:10pt;" height="311.18" overflow="visible" transform="matrix(1 0 0 -1 0 308.49)" width="434.07"><span class="ltx_foreignobject_container"><span class="ltx_foreignobject_content">
<span id="S15.SS0.SSS0.Px11.p2.pic1.2" class="ltx_inline-block ltx_minipage ltx_align_bottom" style="width:31.37em;">
<span id="S15.SS0.SSS0.Px11.p2.pic1.2.1" class="ltx_p"><span id="S15.SS0.SSS0.Px11.p2.pic1.2.1.1" class="ltx_text" style="--ltx-fg-color:#000000;">Given a tree with <math id="S15.SS0.SSS0.Px11.p2.pic1.m1" class="ltx_Math" alttext="n" display="inline" intent=":literal"><semantics><mi style="--ltx-fg-color:#000000;" mathcolor="#000000">n</mi><annotation encoding="application/x-tex">n</annotation></semantics></math> vertices. You can choose two vertices <math id="S15.SS0.SSS0.Px11.p2.pic1.m2" class="ltx_Math" alttext="a" display="inline" intent=":literal"><semantics><mi style="--ltx-fg-color:#000000;" mathcolor="#000000">a</mi><annotation encoding="application/x-tex">a</annotation></semantics></math> and <math id="S15.SS0.SSS0.Px11.p2.pic1.m3" class="ltx_Math" alttext="b" display="inline" intent=":literal"><semantics><mi style="--ltx-fg-color:#000000;" mathcolor="#000000">b</mi><annotation encoding="application/x-tex">b</annotation></semantics></math> once and remove all vertices on the path from <math id="S15.SS0.SSS0.Px11.p2.pic1.m4" class="ltx_Math" alttext="a" display="inline" intent=":literal"><semantics><mi style="--ltx-fg-color:#000000;" mathcolor="#000000">a</mi><annotation encoding="application/x-tex">a</annotation></semantics></math> to <math id="S15.SS0.SSS0.Px11.p2.pic1.m5" class="ltx_Math" alttext="b" display="inline" intent=":literal"><semantics><mi style="--ltx-fg-color:#000000;" mathcolor="#000000">b</mi><annotation encoding="application/x-tex">b</annotation></semantics></math>, including the vertices themselves. If you choose <math id="S15.SS0.SSS0.Px11.p2.pic1.m6" class="ltx_Math" alttext="a=b" display="inline" intent=":literal"><semantics><mrow><mi style="--ltx-fg-color:#000000;" mathcolor="#000000">a</mi><mo style="--ltx-fg-color:#000000;" mathcolor="#000000">=</mo><mi style="--ltx-fg-color:#000000;" mathcolor="#000000">b</mi></mrow><annotation encoding="application/x-tex">a=b</annotation></semantics></math>, only one vertex will be removed. 
<br class="ltx_break">
<br class="ltx_break">Your task is to find the maximum number of connected components that can be formed after removing the path from the tree. 
<br class="ltx_break">
<br class="ltx_break"><span id="S15.SS0.SSS0.Px11.p2.pic1.2.1.1.1" class="ltx_text ltx_font_bold">Input</span> 
<br class="ltx_break">The first line of the input contains one integer <math id="S15.SS0.SSS0.Px11.p2.pic1.m7" class="ltx_Math" alttext="t\ (1\leq t\leq 10^{4})" display="inline" intent=":literal"><semantics><mrow><mi style="--ltx-fg-color:#000000;" mathcolor="#000000">t</mi><mo lspace="0.500em">⁡</mo><mrow><mo style="--ltx-fg-color:#000000;" mathcolor="#000000" stretchy="false">(</mo><mrow><mn style="--ltx-fg-color:#000000;" mathcolor="#000000">1</mn><mo style="--ltx-fg-color:#000000;" mathcolor="#000000">≤</mo><mi style="--ltx-fg-color:#000000;" mathcolor="#000000">t</mi><mo style="--ltx-fg-color:#000000;" mathcolor="#000000">≤</mo><msup><mn style="--ltx-fg-color:#000000;" mathcolor="#000000">10</mn><mn style="--ltx-fg-color:#000000;" mathcolor="#000000">4</mn></msup></mrow><mo style="--ltx-fg-color:#000000;" mathcolor="#000000" stretchy="false">)</mo></mrow></mrow><annotation encoding="application/x-tex">t\ (1\leq t\leq 10^{4})</annotation></semantics></math> —the number of test cases. 
<br class="ltx_break">
<br class="ltx_break">The first line of each test case contains one integer <math id="S15.SS0.SSS0.Px11.p2.pic1.m8" class="ltx_Math" alttext="n\ (2\leq n\leq 2\cdot 10^{5})" display="inline" intent=":literal"><semantics><mrow><mi style="--ltx-fg-color:#000000;" mathcolor="#000000">n</mi><mo lspace="0.500em">⁡</mo><mrow><mo style="--ltx-fg-color:#000000;" mathcolor="#000000" stretchy="false">(</mo><mrow><mn style="--ltx-fg-color:#000000;" mathcolor="#000000">2</mn><mo style="--ltx-fg-color:#000000;" mathcolor="#000000">≤</mo><mi style="--ltx-fg-color:#000000;" mathcolor="#000000">n</mi><mo style="--ltx-fg-color:#000000;" mathcolor="#000000">≤</mo><mrow><mn style="--ltx-fg-color:#000000;" mathcolor="#000000">2</mn><mo style="--ltx-fg-color:#000000;" lspace="0.222em" mathcolor="#000000" rspace="0.222em">⋅</mo><msup><mn style="--ltx-fg-color:#000000;" mathcolor="#000000">10</mn><mn style="--ltx-fg-color:#000000;" mathcolor="#000000">5</mn></msup></mrow></mrow><mo style="--ltx-fg-color:#000000;" mathcolor="#000000" stretchy="false">)</mo></mrow></mrow><annotation encoding="application/x-tex">n\ (2\leq n\leq 2\cdot 10^{5})</annotation></semantics></math> —the size of the tree. 
<br class="ltx_break">
<br class="ltx_break">The next <math id="S15.SS0.SSS0.Px11.p2.pic1.m9" class="ltx_Math" alttext="n-1" display="inline" intent=":literal"><semantics><mrow><mi style="--ltx-fg-color:#000000;" mathcolor="#000000">n</mi><mo style="--ltx-fg-color:#000000;" mathcolor="#000000">−</mo><mn style="--ltx-fg-color:#000000;" mathcolor="#000000">1</mn></mrow><annotation encoding="application/x-tex">n-1</annotation></semantics></math> lines contain two integers <math id="S15.SS0.SSS0.Px11.p2.pic1.m10" class="ltx_Math" alttext="u" display="inline" intent=":literal"><semantics><mi style="--ltx-fg-color:#000000;" mathcolor="#000000">u</mi><annotation encoding="application/x-tex">u</annotation></semantics></math> and <math id="S15.SS0.SSS0.Px11.p2.pic1.m11" class="ltx_Math" alttext="v\ (1\leq u,v\leq n,u\neq v" display="inline" intent=":literal"><semantics><mrow><mi style="--ltx-fg-color:#000000;" mathcolor="#000000">v</mi><mo lspace="0.500em">⁡</mo><mrow><mo style="--ltx-fg-color:#000000;" mathcolor="#000000" stretchy="false">(</mo><mrow><mrow><mn style="--ltx-fg-color:#000000;" mathcolor="#000000">1</mn><mo style="--ltx-fg-color:#000000;" mathcolor="#000000">≤</mo><mi style="--ltx-fg-color:#000000;" mathcolor="#000000">u</mi></mrow><mo style="--ltx-fg-color:#000000;" mathcolor="#000000">,</mo><mrow><mi style="--ltx-fg-color:#000000;" mathcolor="#000000">v</mi><mo style="--ltx-fg-color:#000000;" mathcolor="#000000">≤</mo><mi style="--ltx-fg-color:#000000;" mathcolor="#000000">n</mi></mrow><mo style="--ltx-fg-color:#000000;" mathcolor="#000000">,</mo><mrow><mi style="--ltx-fg-color:#000000;" mathcolor="#000000">u</mi><mo style="--ltx-fg-color:#000000;" mathcolor="#000000">≠</mo><mi style="--ltx-fg-color:#000000;" mathcolor="#000000">v</mi></mrow></mrow><mo style="--ltx-fg-color:#000000;" fence="true" lspace="0em" mathcolor="#000000">CLOSE</mo></mrow></mrow><annotation encoding="application/x-tex">v\ (1\leq u,v\leq n,u\neq v</annotation></semantics></math> —the vertices connected by an edge. It is guaranteed that the edges form a tree. 
<br class="ltx_break">
<br class="ltx_break">It is guaranteed that the sum of <math id="S15.SS0.SSS0.Px11.p2.pic1.m12" class="ltx_Math" alttext="n" display="inline" intent=":literal"><semantics><mi style="--ltx-fg-color:#000000;" mathcolor="#000000">n</mi><annotation encoding="application/x-tex">n</annotation></semantics></math> across all test cases does not exceed <math id="S15.SS0.SSS0.Px11.p2.pic1.m13" class="ltx_Math" alttext="2\cdot 10^{5}" display="inline" intent=":literal"><semantics><mrow><mn style="--ltx-fg-color:#000000;" mathcolor="#000000">2</mn><mo style="--ltx-fg-color:#000000;" lspace="0.222em" mathcolor="#000000" rspace="0.222em">⋅</mo><msup><mn style="--ltx-fg-color:#000000;" mathcolor="#000000">10</mn><mn style="--ltx-fg-color:#000000;" mathcolor="#000000">5</mn></msup></mrow><annotation encoding="application/x-tex">2\cdot 10^{5}</annotation></semantics></math>. 
<br class="ltx_break">
<br class="ltx_break"><span id="S15.SS0.SSS0.Px11.p2.pic1.2.1.1.2" class="ltx_text ltx_font_bold">Output</span> 
<br class="ltx_break">For each test case, output one integer —the maximum number of connected components that can be achieved using the described operation.</span></span>
</span></span></span></foreignobject></g></g></svg>