<svg id="A1.p2.pic1" class="ltx_picture" height="999.33" overflow="visible" version="1.1" viewbox="0 0 653.15 999.33" width="653.15"><g style="--ltx-stroke-color:#000000;--ltx-fill-color:#000000;" fill="#000000" stroke="#000000" stroke-width="0.4pt" transform="translate(0,999.33) matrix(1 0 0 -1 0 0)"><g style="--ltx-fill-color:#CCCCCC;" fill="#CCCCCC" fill-opacity="1.0"><path style="stroke:none" d="M 0 3.32 L 0 996 C 0 997.84 1.49 999.33 3.32 999.33 L 649.83 999.33 C 651.66 999.33 653.15 997.84 653.15 996 L 653.15 3.32 C 653.15 1.49 651.66 0 649.83 0 L 3.32 0 C 1.49 0 0 1.49 0 3.32 Z" /></g><g style="--ltx-fill-color:#F9F9F9;" fill="#F9F9F9" fill-opacity="1.0"><path style="stroke:none" d="M 0.55 3.32 L 0.55 996 C 0.55 997.53 1.79 998.77 3.32 998.77 L 649.83 998.77 C 651.36 998.77 652.6 997.53 652.6 996 L 652.6 3.32 C 652.6 1.79 651.36 0.55 649.83 0.55 L 3.32 0.55 C 1.79 0.55 0.55 1.79 0.55 3.32 Z" /></g><g fill-opacity="1.0" transform="matrix(1.0 0.0 0.0 1.0 12.79 12.79)"><foreignobject style="--ltx-fo-width:43.19em;--ltx-fo-height:70.37em;--ltx-fo-depth:0em;font-size:10pt;" height="973.75" overflow="visible" transform="matrix(1 0 0 -1 0 973.75)" width="597.63"><span class="ltx_foreignobject_container"><span class="ltx_foreignobject_content">
<span id="A1.p2.pic1.1" class="ltx_inline-block ltx_minipage ltx_align_bottom" style="width:43.19em;">
<span id="A1.p2.pic1.1.1" class="ltx_p"><span id="A1.p2.pic1.1.1.1" class="ltx_text ltx_font_typewriter" style="--ltx-fg-color:#000000;">You are an expert academic and senior curriculum designer at a top-tier engineering university (like MIT or Caltech). You have decades of experience structuring undergraduate programs for ABET accreditation. 
<br class="ltx_break"></span></span>
<span id="A1.p2.pic1.1.2" class="ltx_p"><span id="A1.p2.pic1.1.2.1" class="ltx_text ltx_font_typewriter" style="--ltx-fg-color:#000000;">Your task is to identify and rank the most fundamental, cornerstone
domains for the five primary branches of engineering. The goal is to identify the non-overlapping, core subject areas that are prerequisites for almost all other advanced topics. 
<br class="ltx_break"></span></span>
<span id="A1.p2.pic1.1.3" class="ltx_p"><span id="A1.p2.pic1.1.3.1" class="ltx_text ltx_font_typewriter" style="--ltx-fg-color:#000000;">For example, for Chemical Engineering, &quot;Reaction Kinetics&quot; would be a fundamental domain, while a niche topic like &quot;Polymer Rheology&quot; would be a sub-specialization, not a cornerstone. 
<br class="ltx_break"></span></span>
<span id="A1.p2.pic1.1.4" class="ltx_p"><span id="A1.p2.pic1.1.4.1" class="ltx_text ltx_font_typewriter" style="--ltx-fg-color:#000000;">Please provide a ranked list of the top 5-7 most fundamental domains for each of the following five branches: 
<br class="ltx_break">1. Chemical Engineering 
<br class="ltx_break">2. Electrical Engineering 
<br class="ltx_break">3. Mechanical Engineering 
<br class="ltx_break">4. Civil Engineering 
<br class="ltx_break">5. Industrial Engineering 
<br class="ltx_break"></span></span>
<span id="A1.p2.pic1.1.5" class="ltx_p"><span id="A1.p2.pic1.1.5.1" class="ltx_text ltx_font_typewriter" style="--ltx-fg-color:#000000;">Return your answer <span id="A1.p2.pic1.1.5.1.1" class="ltx_text ltx_font_bold">only</span> in a strict JSON format as given below.
</span></span>
<span id="A1.p2.pic1.1.6" class="ltx_p"><span id="A1.p2.pic1.1.6.1" class="ltx_text ltx_font_typewriter" style="--ltx-fg-color:#000000;">{
</span></span>
<span id="A1.p2.pic1.1.7" class="ltx_p"><span id="A1.p2.pic1.1.7.1" class="ltx_text ltx_font_typewriter" style="--ltx-fg-color:#000000;"> &quot;chemical_engineering&quot;: [
<br class="ltx_break">   &quot;Rank 1 Domain&quot;,
<br class="ltx_break">   &quot;Rank 2 Domain&quot;,
<br class="ltx_break">   &quot;Rank 3 Domain&quot;,
<br class="ltx_break">   &quot;Rank 4 Domain&quot;,
<br class="ltx_break">   &quot;Rank 5 Domain&quot;
<br class="ltx_break"> ],
<br class="ltx_break"></span></span>
