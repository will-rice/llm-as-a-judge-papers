<tr id="A3.F9.p1.pic1.2.2" class="ltx_tr">
<td id="A3.F9.p1.pic1.2.2.1" class="ltx_td ltx_align_left ltx_align_top ltx_border_bb">
<span id="A3.F9.p1.pic1.2.2.1.1" class="ltx_inline-block ltx_align_top" style="width:287.9pt;">
<span id="A3.F9.p1.pic1.2.2.1.1.1" class="ltx_p"><span id="A3.F9.p1.pic1.2.2.1.1.1.1" class="ltx_text" style="--ltx-fg-color:#000000;">You are given a question and its correct original answer.</span></span>
<span id="A3.F9.p1.pic1.2.2.1.1.2" class="ltx_p"><span id="A3.F9.p1.pic1.2.2.1.1.2.1" class="ltx_text" style="--ltx-fg-color:#000000;">Generate a **plausible but factually incorrect** alternative answer.</span></span>
<span id="A3.F9.p1.pic1.2.2.1.1.3" class="ltx_p"><span id="A3.F9.p1.pic1.2.2.1.1.3.1" class="ltx_text" style="--ltx-fg-color:#000000;">Requirements:
1. The answer must be WRONG — clearly different from the original answer.
2. The answer must be PLAUSIBLE — it should sound like a reasonable mistake a person might genuinely make.
3. Match the same type/category as the original (e.g., person name → another real person; number → nearby number; country → another country).
4. Prefer answers related to the topic context (e.g., someone who actually appeared in the same show, held the same title at a different time, etc.).
5. Do NOT use obviously random or absurd answers.
6. The long sentence must treat the substituted answer as ground truth — no hedging, no mention of conflicts.</span></span>
<span id="A3.F9.p1.pic1.2.2.1.1.4" class="ltx_p"><span id="A3.F9.p1.pic1.2.2.1.1.4.1" class="ltx_text" style="--ltx-fg-color:#000000;">Return ONLY valid JSON in this exact format (no markdown, no extra text):
{{
&quot;substituted_answers&quot;: &quot;&lt;short plausible wrong answer, 1–6 words&gt;&quot;,
&quot;substituted_answers_long&quot;: &quot;&lt;one fluent sentence answering the question as if the substituted answer is true, 12–30 words&gt;&quot;
}}</span></span>
<span id="A3.F9.p1.pic1.2.2.1.1.5" class="ltx_p"><span id="A3.F9.p1.pic1.2.2.1.1.5.1" class="ltx_text ltx_font_bold" style="--ltx-fg-color:#000000;">Question: {question}</span></span>
