<svg id="S3.SS1.SSS1.p2.pic1" class="ltx_picture" height="578.47" overflow="visible" version="1.1" viewbox="0 0 477.38 578.47" width="477.38"><g style="--ltx-stroke-color:#000000;--ltx-fill-color:#000000;" fill="#000000" stroke="#000000" stroke-width="0.4pt" transform="translate(0,578.47) matrix(1 0 0 -1 0 0)"><g style="--ltx-fill-color:#000000;" fill="#000000" fill-opacity="1.0"><path style="stroke:none" d="M 0 5.91 L 0 572.56 C 0 575.82 2.64 578.47 5.91 578.47 L 471.47 578.47 C 474.73 578.47 477.38 575.82 477.38 572.56 L 477.38 5.91 C 477.38 2.64 474.73 0 471.47 0 L 5.91 0 C 2.64 0 0 2.64 0 5.91 Z" /></g><g style="--ltx-fill-color:#F9F9F9;" fill="#F9F9F9" fill-opacity="1.0"><path style="stroke:none" d="M 1.97 5.91 L 1.97 554.36 L 475.41 554.36 L 475.41 5.91 C 475.41 3.73 473.65 1.97 471.47 1.97 L 5.91 1.97 C 3.73 1.97 1.97 3.73 1.97 5.91 Z" /></g><g fill-opacity="1.0" transform="matrix(1.0 0.0 0.0 1.0 21.65 562.95)"><foreignobject style="--ltx-fo-width:31.37em;--ltx-fo-height:0.69em;--ltx-fo-depth:0.19em;font-size:10pt;" height="12.3" overflow="visible" transform="matrix(1 0 0 -1 0 9.61)" width="434.07"><span class="ltx_foreignobject_container"><span class="ltx_foreignobject_content">
<span id="S3.SS1.SSS1.p2.pic1.1" class="ltx_inline-block ltx_minipage ltx_align_bottom" style="width:31.37em;">
<span id="S3.SS1.SSS1.p2.pic1.1.1" class="ltx_p"><span id="S3.SS1.SSS1.p2.pic1.1.1.1" class="ltx_text" style="--ltx-fg-color:#FFFFFF;">Ads Keyword Suggestion for Evaluation</span></span>
</span></span></span></foreignobject></g><g fill-opacity="1.0" transform="matrix(1.0 0.0 0.0 1.0 21.65 534.86)"><foreignobject style="--ltx-fo-width:36.91em;--ltx-fo-height:0.56em;--ltx-fo-depth:37.66em;font-size:10pt;" height="528.77" overflow="visible" transform="matrix(1 0 0 -1 0 7.69)" width="510.73"><span class="ltx_foreignobject_container"><span class="ltx_foreignobject_content">
<span id="S3.SS1.SSS1.p2.pic1.2" class="ltx_inline-block ltx_minipage ltx_align_bottom" style="width:36.91em;">
<span id="S3.SS1.SSS1.p2.pic1.2.1" class="ltx_p"><span id="S3.SS1.SSS1.p2.pic1.2.1.1" class="ltx_text" style="font-size:80%;--ltx-fg-color:#000000;">Sellers participating in the Promoted Listings ads program can bid on search query keywords and phrases where they want their items to appear. Help us to evaluate the performance of an automated tool that suggests keyword phrases for which a seller might want their ad to appear. How relevant are the suggested keywords to the item?</span></span>
<span id="S3.SS1.SSS1.p2.pic1.2.2" class="ltx_p"><span id="S3.SS1.SSS1.p2.pic1.2.2.1" class="ltx_text ltx_font_bold" style="font-size:80%;--ltx-fg-color:#000000;">Question: How relevant are the suggested keywords to the seed item?<span id="S3.SS1.SSS1.p2.pic1.2.2.1.1" class="ltx_text"></span></span></span>
<span id="S3.I1" class="ltx_itemize ltx_leftmargin_flush">
<span id="S3.I1.i1" class="ltx_item" style="list-style-type:none;"><span class="ltx_tag ltx_tag_item">•</span> 
<span id="S3.I1.i1.p1" class="ltx_para">
<span id="S3.I1.i1.p1.1" class="ltx_p"><span id="S3.I1.i1.p1.1.1" class="ltx_text ltx_font_bold" style="font-size:80%;--ltx-fg-color:#000000;">Excellent</span><span id="S3.I1.i1.p1.1.2" class="ltx_text" style="font-size:80%;--ltx-fg-color:#000000;"> – the suggested keywords are highly relevant and match the seed item in all core attributes.</span></span>
</span></span>
<span id="S3.I1.i2" class="ltx_item" style="list-style-type:none;"><span class="ltx_tag ltx_tag_item">•</span> 
<span id="S3.I1.i2.p1" class="ltx_para">
<span id="S3.I1.i2.p1.1" class="ltx_p"><span id="S3.I1.i2.p1.1.1" class="ltx_text ltx_font_bold" style="font-size:80%;--ltx-fg-color:#000000;">Good</span><span id="S3.I1.i2.p1.1.2" class="ltx_text" style="font-size:80%;--ltx-fg-color:#000000;"> – the suggested keywords are somewhat relevant and provide an OK or good enough match to the item. Some of the secondary attributes might not match, but important traits like model, size, or product type are respected.</span></span>
<span id="S3.I1.i2.I1" class="ltx_itemize">
<span id="S3.I1.i2.I1.i1" class="ltx_item" style="list-style-type:none;"><span class="ltx_tag ltx_tag_item"><span id="S3.I1.i2.I1.i1.1" class="ltx_text ltx_font_bold">–</span></span> 
<span id="S3.I1.i2.I1.i1.p1" class="ltx_para">
<span id="S3.I1.i2.I1.i1.p1.1" class="ltx_p"><span id="S3.I1.i2.I1.i1.p1.1.1" class="ltx_text" style="font-size:80%;--ltx-fg-color:#000000;">Note, for the purposes of ad placement, keywords containing a competing brand and similar model can qualify as Good.</span></span>
</span></span>
<span id="S3.I1.i2.I1.i2" class="ltx_item" style="list-style-type:none;"><span class="ltx_tag ltx_tag_item"><span id="S3.I1.i2.I1.i2.1" class="ltx_text ltx_font_bold">–</span></span> 
<span id="S3.I1.i2.I1.i2.p1" class="ltx_para">
<span id="S3.I1.i2.I1.i2.p1.1" class="ltx_p"><span id="S3.I1.i2.I1.i2.p1.1.1" class="ltx_text" style="font-size:80%;--ltx-fg-color:#000000;">Example: seed item is a Samsung Galaxy phone, suggested KWs are “google pixel pro.” Both </span><span id="S3.I1.i2.I1.i2.p1.1.2" class="ltx_text ltx_font_bold" style="font-size:80%;--ltx-fg-color:#000000;">phones</span><span id="S3.I1.i2.I1.i2.p1.1.3" class="ltx_text" style="font-size:80%;--ltx-fg-color:#000000;"> run on Android and are flagship models so have enough similarity to qualify as Good.</span></span>
</span></span>
</span>
</span></span>
<span id="S3.I1.i3" class="ltx_item" style="list-style-type:none;"><span class="ltx_tag ltx_tag_item">•</span> 
<span id="S3.I1.i3.p1" class="ltx_para">
<span id="S3.I1.i3.p1.1" class="ltx_p"><span id="S3.I1.i3.p1.1.1" class="ltx_text ltx_font_bold" style="font-size:80%;--ltx-fg-color:#000000;">Fair</span><span id="S3.I1.i3.p1.1.2" class="ltx_text" style="font-size:80%;--ltx-fg-color:#000000;"> – the suggested keywords are only slightly relevant and miss the target in an important way. Core traits like product type or size might not match, but you can understand the connection between the seed item and suggested keywords.</span></span>
</span></span>
<span id="S3.I1.i4" class="ltx_item" style="list-style-type:none;"><span class="ltx_tag ltx_tag_item">•</span> 
<span id="S3.I1.i4.p1" class="ltx_para">
<span id="S3.I1.i4.p1.1" class="ltx_p"><span id="S3.I1.i4.p1.1.1" class="ltx_text ltx_font_bold" style="font-size:80%;--ltx-fg-color:#000000;">Bad</span><span id="S3.I1.i4.p1.1.2" class="ltx_text" style="font-size:80%;--ltx-fg-color:#000000;"> – the suggested keywords are not at all relevant and do not match the seed item on most, if not all, significant traits.</span></span>
</span></span>
</span>
</span></span></span></foreignobject></g></g></svg>