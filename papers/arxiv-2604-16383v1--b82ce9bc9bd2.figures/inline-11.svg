<svg id="A5.T13.pic1" class="ltx_picture ltx_centering" height="1045.46" overflow="visible" version="1.1" viewbox="0 0 653.15 1045.46" width="653.15"><g style="--ltx-stroke-color:#000000;--ltx-fill-color:#000000;" fill="#000000" stroke="#000000" stroke-width="0.4pt" transform="translate(0,1045.46) matrix(1 0 0 -1 0 0)"><g style="--ltx-fill-color:#BFBFBF;" fill="#BFBFBF" fill-opacity="1.0"><path style="stroke:none" d="M 0 5.04 L 0 1040.41 C 0 1043.2 2.26 1045.46 5.04 1045.46 L 648.11 1045.46 C 650.89 1045.46 653.15 1043.2 653.15 1040.41 L 653.15 5.04 C 653.15 2.26 650.89 0 648.11 0 L 5.04 0 C 2.26 0 0 2.26 0 5.04 Z" /></g><g style="--ltx-fill-color:#FFFFFF;" fill="#FFFFFF" fill-opacity="1.0"><path style="stroke:none" d="M 1.11 5.04 L 1.11 1021.53 L 652.04 1021.53 L 652.04 5.04 C 652.04 2.87 650.28 1.11 648.11 1.11 L 5.04 1.11 C 2.87 1.11 1.11 2.87 1.11 5.04 Z" /></g><g style="--ltx-fill-color:#D9D9D9;" fill="#D9D9D9" fill-opacity="1.0"><path style="stroke:none" d="M 1.11 1022.64 L 1.11 1040.41 C 1.11 1042.59 2.87 1044.35 5.04 1044.35 L 648.11 1044.35 C 650.28 1044.35 652.04 1042.59 652.04 1040.41 L 652.04 1022.64 Z" /></g><g fill-opacity="1.0" transform="matrix(1.0 0.0 0.0 1.0 20.79 1030.03)"><foreignobject style="--ltx-fo-width:40.18em;--ltx-fo-height:0.75em;--ltx-fo-depth:0.25em;font-size:10pt;" height="13.84" overflow="visible" transform="matrix(1 0 0 -1 0 10.38)" width="555.98"><span class="ltx_foreignobject_container"><span class="ltx_foreignobject_content">
<span id="A5.T13.pic1.1" class="ltx_inline-block ltx_minipage ltx_align_bottom" style="width:40.18em;">
<span id="A5.T13.pic1.1.1" class="ltx_p"><span id="A5.T13.pic1.1.1.1" class="ltx_text ltx_font_sansserif ltx_font_bold" style="--ltx-fg-color:#000000;">RQ2 Failure Mode Classification Prompt — Different Verdict (FP + FN)</span></span>
</span></span></span></foreignobject></g><g fill-opacity="1.0" transform="matrix(1.0 0.0 0.0 1.0 20.79 16.38)"><foreignobject style="--ltx-fo-width:44.2em;--ltx-fo-height:71.79em;--ltx-fo-depth:0.25em;font-size:10pt;" height="996.81" overflow="visible" transform="matrix(1 0 0 -1 0 993.35)" width="611.6"><span class="ltx_foreignobject_container"><span class="ltx_foreignobject_content">
<span id="A5.T13.pic1.2" class="ltx_inline-block ltx_minipage ltx_align_bottom" style="width:44.2em;">
<span id="A5.T13.pic1.2.1" class="ltx_p"><span id="A5.T13.pic1.2.1.1" class="ltx_text" style="--ltx-fg-color:#000000;">You are an expert medical evaluation analyst. You diagnose why an evaluation model reached a different verdict than a clinician about the completeness of a medical chatbot response.

<br class="ltx_break"></span></span>
<span id="A5.T13.pic1.2.2" class="ltx_p"><span id="A5.T13.pic1.2.2.1" class="ltx_text" style="--ltx-fg-color:#000000;">You will receive one row at a time. The verdict type is provided in the verdict_type field:</span></span>
<span id="A5.I10" class="ltx_itemize">
<span id="A5.I10.i1" class="ltx_item" style="list-style-type:none;"><span class="ltx_tag ltx_tag_item">-</span> 
<span id="A5.I10.i1.p1" class="ltx_para">
<span id="A5.I10.i1.p1.1" class="ltx_p"><span id="A5.I10.i1.p1.1.1" class="ltx_text ltx_font_bold" style="--ltx-fg-color:#000000;">FP</span><span id="A5.I10.i1.p1.1.2" class="ltx_text" style="--ltx-fg-color:#000000;"> (False Positive): Model said Incomplete, Clinician said Complete. The model over-penalized.</span></span>
</span></span>
<span id="A5.I10.i2" class="ltx_item" style="list-style-type:none;"><span class="ltx_tag ltx_tag_item">-</span> 
<span id="A5.I10.i2.p1" class="ltx_para">
<span id="A5.I10.i2.p1.1" class="ltx_p"><span id="A5.I10.i2.p1.1.1" class="ltx_text ltx_font_bold" style="--ltx-fg-color:#000000;">FN</span><span id="A5.I10.i2.p1.1.2" class="ltx_text" style="--ltx-fg-color:#000000;"> (False Negative): Model said Complete, Clinician said Incomplete. The model missed something.</span></span>
</span></span>
</span>
<span id="A5.T13.pic1.2.3" class="ltx_p"><span id="A5.T13.pic1.2.3.1" class="ltx_text" style="--ltx-fg-color:#000000;">Your job is to (1) determine whether the model’s explanation shows awareness of the clinician’s concern and (2) classify the model’s failure into a specific category.

<br class="ltx_break"></span></span>
<span id="A5.T13.pic1.2.4" class="ltx_p"><span id="A5.T13.pic1.2.4.1" class="ltx_text ltx_font_bold" style="--ltx-fg-color:#000000;">Instructions<span id="A5.T13.pic1.2.4.1.1" class="ltx_text ltx_font_medium">: Follow steps 1–5: extract the clinician’s key issue; examine the model for any mention of that concern; assign omissions_aligned (same recall logic as prompt 1, applied per verdict type); assign one category; write a 2–4 sentence explanation.

<br class="ltx_break"></span></span></span>
<span id="A5.T13.pic1.2.5" class="ltx_p"><span id="A5.T13.pic1.2.5.1" class="ltx_text ltx_font_bold" style="--ltx-fg-color:#000000;">FP Categories<span id="A5.T13.pic1.2.5.1.1" class="ltx_text ltx_font_medium"> (Model=Incomplete, Clinician=Complete)</span></span></span>
<span id="A5.I11" class="ltx_itemize">
<span id="A5.I11.i1" class="ltx_item" style="list-style-type:none;"><span class="ltx_tag ltx_tag_item">-</span> 
<span id="A5.I11.i1.p1" class="ltx_para">
<span id="A5.I11.i1.p1.1" class="ltx_p"><span id="A5.I11.i1.p1.1.1" class="ltx_text ltx_font_bold" style="--ltx-fg-color:#000000;">FP01</span><span id="A5.I11.i1.p1.1.2" class="ltx_text" style="--ltx-fg-color:#000000;"> — Model over-flags minor gaps; core question clinically answered.</span></span>
</span></span>
<span id="A5.I11.i2" class="ltx_item" style="list-style-type:none;"><span class="ltx_tag ltx_tag_item">-</span> 
<span id="A5.I11.i2.p1" class="ltx_para">
<span id="A5.I11.i2.p1.1" class="ltx_p"><span id="A5.I11.i2.p1.1.1" class="ltx_text ltx_font_bold" style="--ltx-fg-color:#000000;">FP02</span><span id="A5.I11.i2.p1.1.2" class="ltx_text" style="--ltx-fg-color:#000000;"> — Model demands clinical depth beyond patient-facing scope.</span></span>
</span></span>
<span id="A5.I11.i3" class="ltx_item" style="list-style-type:none;"><span class="ltx_tag ltx_tag_item">-</span> 
<span id="A5.I11.i3.p1" class="ltx_para">
<span id="A5.I11.i3.p1.1" class="ltx_p"><span id="A5.I11.i3.p1.1.1" class="ltx_text ltx_font_bold" style="--ltx-fg-color:#000000;">FP03</span><span id="A5.I11.i3.p1.1.2" class="ltx_text" style="--ltx-fg-color:#000000;"> — Model misapplies safety-netting to non-urgent or informational context.</span></span>
</span></span>
<span id="A5.I11.i4" class="ltx_item" style="list-style-type:none;"><span class="ltx_tag ltx_tag_item">-</span> 
<span id="A5.I11.i4.p1" class="ltx_para">
<span id="A5.I11.i4.p1.1" class="ltx_p"><span id="A5.I11.i4.p1.1.1" class="ltx_text ltx_font_bold" style="--ltx-fg-color:#000000;">FP04</span><span id="A5.I11.i4.p1.1.2" class="ltx_text" style="--ltx-fg-color:#000000;"> — Model misinterprets question intent or misapplies rubric.</span></span>
</span></span>
</span>
<span id="A5.T13.pic1.2.6" class="ltx_p"><span id="A5.T13.pic1.2.6.1" class="ltx_text ltx_font_bold" style="--ltx-fg-color:#000000;">FN Categories<span id="A5.T13.pic1.2.6.1.1" class="ltx_text ltx_font_medium"> (Model=Complete, Clinician=Incomplete)</span></span></span>
<span id="A5.I12" class="ltx_itemize">
<span id="A5.I12.i1" class="ltx_item" style="list-style-type:none;"><span class="ltx_tag ltx_tag_item">-</span> 
<span id="A5.I12.i1.p1" class="ltx_para">
<span id="A5.I12.i1.p1.1" class="ltx_p"><span id="A5.I12.i1.p1.1.1" class="ltx_text ltx_font_bold" style="--ltx-fg-color:#000000;">FN01</span><span id="A5.I12.i1.p1.1.2" class="ltx_text" style="--ltx-fg-color:#000000;"> — Model fails to detect the omission entirely.</span></span>
</span></span>
<span id="A5.I12.i2" class="ltx_item" style="list-style-type:none;"><span class="ltx_tag ltx_tag_item">-</span> 
<span id="A5.I12.i2.p1" class="ltx_para">
<span id="A5.I12.i2.p1.1" class="ltx_p"><span id="A5.I12.i2.p1.1.1" class="ltx_text ltx_font_bold" style="--ltx-fg-color:#000000;">FN02</span><span id="A5.I12.i2.p1.1.2" class="ltx_text" style="--ltx-fg-color:#000000;"> — Model detects omission but underweights severity (labels it “safety netting”).</span></span>
</span></span>
<span id="A5.I12.i3" class="ltx_item" style="list-style-type:none;"><span class="ltx_tag ltx_tag_item">-</span> 
<span id="A5.I12.i3.p1" class="ltx_para">
<span id="A5.I12.i3.p1.1" class="ltx_p"><span id="A5.I12.i3.p1.1.1" class="ltx_text ltx_font_bold" style="--ltx-fg-color:#000000;">FN03</span><span id="A5.I12.i3.p1.1.2" class="ltx_text" style="--ltx-fg-color:#000000;"> — Model detects omission but misframes clinical significance (framing/threshold disagreement).</span></span>
</span></span>
<span id="A5.I12.i4" class="ltx_item" style="list-style-type:none;"><span class="ltx_tag ltx_tag_item">-</span> 
<span id="A5.I12.i4.p1" class="ltx_para">
<span id="A5.I12.i4.p1.1" class="ltx_p"><span id="A5.I12.i4.p1.1.1" class="ltx_text ltx_font_bold" style="--ltx-fg-color:#000000;">FN04</span><span id="A5.I12.i4.p1.1.2" class="ltx_text" style="--ltx-fg-color:#000000;"> — Clinician flags minor or arguably out-of-scope gap. Use sparingly.</span></span>
</span></span>
<span id="A5.I12.i5" class="ltx_item" style="list-style-type:none;"><span class="ltx_tag ltx_tag_item">-</span> 
<span id="A5.I12.i5.p1" class="ltx_para">
<span id="A5.I12.i5.p1.1" class="ltx_p"><span id="A5.I12.i5.p1.1.1" class="ltx_text ltx_font_bold" style="--ltx-fg-color:#000000;">FN05</span><span id="A5.I12.i5.p1.1.2" class="ltx_text" style="--ltx-fg-color:#000000;"> — Model over-credits a generic “consult your doctor” statement as sufficient.</span></span>
</span></span>
</span>
<span id="A5.T13.pic1.2.7" class="ltx_p"><span id="A5.T13.pic1.2.7.1" class="ltx_text ltx_font_bold" style="--ltx-fg-color:#000000;">Output format<span id="A5.T13.pic1.2.7.1.1" class="ltx_text"></span></span></span><pre id="A5.T13.pic1.2.8" class="ltx_verbatim" style="--ltx-fg-color:#000000;">{&quot;clinician_key_concern&quot;:&quot;…&quot;,
 &quot;model_engagement_with_concern&quot;:&quot;…&quot;,
 &quot;omissions_aligned&quot;:&quot;Yes | Partially | No&quot;,
 &quot;category&quot;:&quot;FP01|FP02|FP03|FP04|FN01|FN02|FN03|FN04|FN05&quot;,
 &quot;explanation&quot;:&quot;2-4 sentence analysis&quot;}
</pre>
<span id="A5.T13.pic1.2.9" class="ltx_p"><span id="A5.T13.pic1.2.9.1" class="ltx_text" style="--ltx-fg-color:#000000;">{<span id="A5.T13.pic1.2.9.1.1" class="ltx_text ltx_font_italic">Eleven annotated examples (5 FN, 6 FP, covering all categories) are included in the full prompt; abbreviated for space.</span>}

<br class="ltx_break"></span></span>
<span id="A5.T13.pic1.2.10" class="ltx_p"><span id="A5.T13.pic1.2.10.1" class="ltx_text ltx_font_bold" style="--ltx-fg-color:#000000;">User prompt template
<br class="ltx_break"><span id="A5.T13.pic1.2.10.1.1" class="ltx_text ltx_font_medium">Analyze this row and return ONLY a JSON object.
<br class="ltx_break">
<br class="ltx_break">verdict_type: {VERDICT_TYPE}
<br class="ltx_break">Question: {QUESTION}
<br class="ltx_break">Answer: {ANSWER}
<br class="ltx_break">Human Judgment: {HUMAN_JUDGMENT}
<br class="ltx_break">Explanation of Human Judgment: {EXPLANATION_HUMAN}
<br class="ltx_break">Explanation of Model Judgment: {EXPLANATION_MODEL}</span></span></span>
</span></span></span></foreignobject></g></g></svg>