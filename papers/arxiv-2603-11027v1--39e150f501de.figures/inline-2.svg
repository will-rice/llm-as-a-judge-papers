<span id="S1.F1.pic1.p2.pic1.1" class="ltx_inline-block ltx_minipage ltx_align_bottom" style="width:37.21em;">
<span id="S1.F1.pic1.p2.pic1.1.1" class="ltx_p"><span id="S1.F1.pic1.p2.pic1.1.1.1" class="ltx_text ltx_font_bold" style="--ltx-fg-color:#008000;">MERG Evaluation: Deconstructing the Consensus (<math id="S1.F1.pic1.p2.pic1.m1" class="ltx_Math" alttext="\Delta_{K}=-0.45" display="inline" intent=":literal"><semantics><mrow><msub><mi style="--ltx-fg-color:#008000;" mathcolor="#008000" mathvariant="normal">Δ</mi><mi style="--ltx-fg-color:#008000;" mathcolor="#008000">K</mi></msub><mo style="--ltx-fg-color:#008000;" mathcolor="#008000">=</mo><mrow><mo style="--ltx-fg-color:#008000;" mathcolor="#008000">−</mo><mn style="--ltx-fg-color:#008000;" mathcolor="#008000">0.45</mn></mrow></mrow><annotation encoding="application/x-tex">\Delta_{K}=-0.45</annotation></semantics></math>)</span></span>
<span id="S1.F1.pic1.p2.pic1.1.2" class="ltx_p"><span id="S1.F1.pic1.p2.pic1.1.2.1" class="ltx_text ltx_font_bold">Stage 1: Knowledge Activation</span> <math id="S1.F1.pic1.p2.pic1.m2" class="ltx_Math" alttext="\rightarrow" display="inline" intent=":literal"><semantics><mo stretchy="false">→</mo><annotation encoding="application/x-tex">\rightarrow</annotation></semantics></math> <span id="S1.F1.pic1.p2.pic1.1.2.2" class="ltx_text ltx_font_italic">Evaluators retrieve the “Double Reduction” policy (2021), which banned for-profit K-12 tutoring in China.</span></span>
<span id="S1.F1.pic1.p2.pic1.1.3" class="ltx_p"><span id="S1.F1.pic1.p2.pic1.1.3.1" class="ltx_text ltx_font_bold">Claude 4.5 Opus (Score: 6.5)</span>: <span id="S1.F1.pic1.p2.pic1.1.3.2" class="ltx_text ltx_font_italic">“Despite the professional formatting, the core business model faces severe regulatory risks under China’s ‘Double Reduction’ policy. The financial projections contain internal contradictions (ARPU calculations do not match claimed totals) and the strategy omits critical compliance pathways.”</span></span>
<span id="S1.F1.pic1.p2.pic1.1.4" class="ltx_p"><span id="S1.F1.pic1.p2.pic1.1.4.1" class="ltx_text ltx_font_bold">Gemini 2.5 Pro (Score: 9.9)</span>: <span id="S1.F1.pic1.p2.pic1.1.4.2" class="ltx_text ltx_font_italic">“Demonstrates a masterful understanding of the core task. Turns policy constraints into a competitive advantage. Scores perfectly on strategic viability and persuasive rhetorical techniques.”</span></span>
</span></span></span></foreignobject></g></g></svg>