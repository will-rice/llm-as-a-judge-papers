<span id="A1.SS3.pic2.2.14" class="ltx_p"><span id="A1.SS3.pic2.2.14.1" class="ltx_text ltx_font_italic" style="--ltx-fg-color:#000000;">This progression uses the I, II, iii, and iv chords, while also incorporating the V chord to add some tension and resolution within the progression. The use of F#dim7 helps to highlight the Lydian characteristic of the raised fourth degree.</span></span>
<span id="A1.SS3.pic2.2.15" class="ltx_p"><span id="A1.SS3.pic2.2.15.1" class="ltx_text ltx_font_italic" style="--ltx-fg-color:#000000;">**Evaluation of the Responses:**</span></span>
