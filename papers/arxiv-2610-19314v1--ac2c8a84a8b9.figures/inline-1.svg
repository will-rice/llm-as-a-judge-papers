<svg id="A5.p2.pic1" class="ltx_picture" height="795.91" overflow="visible" version="1.1" viewbox="0 0 653.15 795.91" width="653.15"><g style="--ltx-stroke-color:#000000;--ltx-fill-color:#000000;" fill="#000000" stroke="#000000" stroke-width="0.4pt" transform="translate(0,795.91) matrix(1 0 0 -1 0 0)"><g style="--ltx-fill-color:#66668C;" fill="#66668C" fill-opacity="1.0"><path style="stroke:none" d="M 0 2.08 L 0 793.83 C 0 794.98 0.93 795.91 2.08 795.91 L 651.07 795.91 C 652.22 795.91 653.15 794.98 653.15 793.83 L 653.15 2.08 C 653.15 0.93 652.22 0 651.07 0 L 2.08 0 C 0.93 0 0 0.93 0 2.08 Z" /></g><g style="--ltx-fill-color:#FAFAFF;" fill="#FAFAFF" fill-opacity="1.0"><path style="stroke:none" d="M 0.69 2.08 L 0.69 772.81 L 652.46 772.81 L 652.46 2.08 C 652.46 1.31 651.84 0.69 651.07 0.69 L 2.08 0.69 C 1.31 0.69 0.69 1.31 0.69 2.08 Z" /></g><g style="--ltx-fill-color:#333366;" fill="#333366" fill-opacity="1.0"><path style="stroke:none" d="M 0.69 773.51 L 0.69 793.83 C 0.69 794.6 1.31 795.22 2.08 795.22 L 651.07 795.22 C 651.84 795.22 652.46 794.6 652.46 793.83 L 652.46 773.51 Z" /></g><g fill-opacity="1.0" transform="matrix(1.0 0.0 0.0 1.0 11.55 780.9)"><foreignobject style="--ltx-fo-width:39.59em;--ltx-fo-height:0.75em;--ltx-fo-depth:0.25em;font-size:10pt;" height="13.84" overflow="visible" transform="matrix(1 0 0 -1 0 10.38)" width="547.81"><span class="ltx_foreignobject_container"><span class="ltx_foreignobject_content">
<span id="A5.p2.pic1.1" class="ltx_inline-block ltx_minipage ltx_align_bottom" style="width:39.59em;">
<span id="A5.p2.pic1.1.1" class="ltx_p"><span id="A5.p2.pic1.1.1.1" class="ltx_text ltx_font_bold" style="--ltx-fg-color:#FFFFFF;">Example 1  Re-entry <math id="A5.p2.pic1.m1" class="ltx_Math" alttext="\times" display="inline" intent=":literal"><semantics><mo style="--ltx-fg-color:#FFFFFF;" mathcolor="#FFFFFF">×</mo><annotation encoding="application/x-tex">\times</annotation></semantics></math> stale/superseded use</span></span>
</span></span></span></foreignobject></g><g fill-opacity="1.0" transform="matrix(1.0 0.0 0.0 1.0 11.55 79.27)"><foreignobject style="--ltx-fo-width:45.53em;--ltx-fo-height:49.44em;--ltx-fo-depth:4.99em;font-size:10pt;" height="753.19" overflow="visible" transform="matrix(1 0 0 -1 0 684.08)" width="630.01"><span class="ltx_foreignobject_container"><span class="ltx_foreignobject_content">
<span id="A5.p2.pic1.2" class="ltx_inline-block ltx_minipage ltx_align_bottom" style="width:45.53em;">
<span id="A5.p2.pic1.2.1" class="ltx_p"><span id="A5.p2.pic1.2.1.1" class="ltx_text ltx_font_bold" style="--ltx-fg-color:#000000;">Relation:<span id="A5.p2.pic1.2.1.1.1" class="ltx_text ltx_font_medium"> the user leaves a school search, handles an unrelated task, and later returns to the school decision</span></span></span>
<span id="A5.p2.pic1.2.2" class="ltx_p"><span id="A5.p2.pic1.2.2.1" class="ltx_text ltx_font_bold" style="--ltx-fg-color:#000000;">State A (applicable):<span id="A5.p2.pic1.2.2.1.1" class="ltx_text ltx_font_medium"> updated availability: work schedule now predictable; hybrid programs acceptable</span></span></span>
<span id="A5.p2.pic1.2.3" class="ltx_p"><span id="A5.p2.pic1.2.3.1" class="ltx_text ltx_font_bold" style="--ltx-fg-color:#000000;">State B (superseded):<span id="A5.p2.pic1.2.3.1.1" class="ltx_text ltx_font_medium"> the original online-only constraint, stated emphatically before the update</span></span></span>
<span id="A5.p2.pic1.2.4" class="ltx_p"><span id="A5.p2.pic1.2.4.1" class="ltx_text ltx_font_bold" style="--ltx-fg-color:#000000;">Dialogue (abridged)<span id="A5.p2.pic1.2.4.1.1" class="ltx_text ltx_font_medium"> — <span id="A5.p2.pic1.2.4.1.1.1" class="ltx_text ltx_font_italic">the superseded value is stated more forcefully than its replacement</span></span></span></span><span class="ltx_rule" style="width:100%;height:0.3pt;--ltx-fg-color:#999999;--ltx-bg-color:#999999;display:inline-block;"> </span>
<span id="A5.p2.pic1.2.5" class="ltx_p"><span id="A5.p2.pic1.2.5.1" class="ltx_text ltx_font_bold" style="--ltx-fg-color:#000000;">U<span id="A5.p2.pic1.2.5.1.1" class="ltx_text ltx_font_medium"> <span id="A5.p2.pic1.2.5.1.1.1" class="ltx_text" style="--ltx-fg-color:#737373;">[B]</span>: It has to be fully online, that’s non-negotiable for me. I can’t relocate, and my job has really unpredictable hours — I can’t commit to being physically somewhere at a set time every week. Online only.</span></span></span>
<span id="A5.p2.pic1.2.6" class="ltx_p"><span id="A5.p2.pic1.2.6.1" class="ltx_text ltx_font_italic" style="--ltx-fg-color:#737373;">[ … an intervening episode on an unrelated planning task …]</span></span>
<span id="A5.p2.pic1.2.7" class="ltx_p"><span id="A5.p2.pic1.2.7.1" class="ltx_text ltx_font_bold" style="--ltx-fg-color:#000000;">U<span id="A5.p2.pic1.2.7.1.1" class="ltx_text ltx_font_medium"> <span id="A5.p2.pic1.2.7.1.1.1" class="ltx_text" style="--ltx-fg-color:#737373;">[A]</span>: So my store just moved me to a consistent evening shift, which means my hours are actually predictable now. I’m free most mornings and early afternoons pretty reliably.</span></span></span>
<span id="A5.p2.pic1.2.8" class="ltx_p"><span id="A5.p2.pic1.2.8.1" class="ltx_text ltx_font_bold" style="--ltx-fg-color:#000000;">A<span id="A5.p2.pic1.2.8.1.1" class="ltx_text ltx_font_medium"> <span id="A5.p2.pic1.2.8.1.1.1" class="ltx_text" style="--ltx-fg-color:#737373;">[A]</span>: So to make sure I’ve got this right: you’re no longer restricted to 100% online — you’re open to hybrid programs?</span></span></span>
<span id="A5.p2.pic1.2.9" class="ltx_p"><span id="A5.p2.pic1.2.9.1" class="ltx_text ltx_font_bold" style="--ltx-fg-color:#000000;">U<span id="A5.p2.pic1.2.9.1.1" class="ltx_text ltx_font_medium"> <span id="A5.p2.pic1.2.9.1.1.1" class="ltx_text" style="--ltx-fg-color:#737373;">[A]</span>: Exactly — hybrid is fine now, especially if it means a stronger program or better networking. I want to come back to the college decision later.</span></span></span>
<span id="A5.p2.pic1.2.10" class="ltx_p"><span id="A5.p2.pic1.2.10.1" class="ltx_text ltx_font_bold" style="--ltx-fg-color:#000000;">U<span id="A5.p2.pic1.2.10.1.1" class="ltx_text ltx_font_medium"> [target]: So given all of that — what programs would you actually recommend for me at this point? I want strong job placement, reasonable cost, and something that fits my schedule.</span></span></span>
<span id="A5.p2.pic1.2.11" class="ltx_p"><span id="A5.p2.pic1.2.11.1" class="ltx_text ltx_font_bold" style="--ltx-fg-color:#000000;">Matched responses (excerpts)<span id="A5.p2.pic1.2.11.1.1" class="ltx_text ltx_font_medium"> — <span id="A5.p2.pic1.2.11.1.1.1" class="ltx_text ltx_font_italic">both are fluent and well-structured; only the state they apply differs</span></span></span></span><span class="ltx_rule" style="width:100%;height:0.3pt;--ltx-fg-color:#999999;--ltx-bg-color:#999999;display:inline-block;"> </span>
<span id="A5.p2.pic1.2.12" class="ltx_p"><span id="A5.p2.pic1.2.12.1" class="ltx_text ltx_font_bold ltx_font_smallcaps" style="--ltx-fg-color:#000000;">Right</span><span id="A5.p2.pic1.2.12.2" class="ltx_text" style="--ltx-fg-color:#000000;">: “With your schedule stabilized and hybrid on the table, your options have genuinely expanded. The local university is worth putting at the top of the list …”</span></span>
<span id="A5.p2.pic1.2.13" class="ltx_p"><span id="A5.p2.pic1.2.13.1" class="ltx_text ltx_font_bold" style="--ltx-fg-color:#000000;">Error<span id="A5.p2.pic1.2.13.1.1" class="ltx_text ltx_font_medium">: “Since you’ve been clear that the program must be fully online (given your unpredictable work schedule), I’ve filtered everything through that requirement first …”</span></span></span>
<span id="A5.p2.pic1.2.14" class="ltx_p"><span id="A5.p2.pic1.2.14.1" class="ltx_text ltx_font_bold" style="--ltx-fg-color:#000000;">Why it is hard<span id="A5.p2.pic1.2.14.1.1" class="ltx_text ltx_font_medium"> — <span id="A5.p2.pic1.2.14.1.1.1" class="ltx_text ltx_font_italic">the superseded constraint was stated with maximal emphasis (“non-negotiable”), while its replacement was agreed to conversationally; an evaluator anchoring on emphasis rather than recency accepts the error response.</span></span></span></span>
</span></span></span></foreignobject></g></g></svg>