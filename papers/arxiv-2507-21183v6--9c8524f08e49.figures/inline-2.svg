<svg id="S2.F1.pic2" class="ltx_picture ltx_figure_panel" height="144.91" overflow="visible" version="1.1" viewbox="0 0 477.38 144.91" width="477.38"><g style="--ltx-stroke-color:#000000;--ltx-fill-color:#000000;" fill="#000000" stroke="#000000" stroke-width="0.4pt" transform="translate(0,144.91) matrix(1 0 0 -1 0 0)"><g style="--ltx-fill-color:#8CBA8C;" fill="#8CBA8C" fill-opacity="1.0"><path style="stroke:none" d="M 0 5.91 L 0 139 C 0 142.26 2.64 144.91 5.91 144.91 L 471.47 144.91 C 474.73 144.91 477.38 142.26 477.38 139 L 477.38 5.91 C 477.38 2.64 474.73 0 471.47 0 L 5.91 0 C 2.64 0 0 2.64 0 5.91 Z" /></g><g style="--ltx-fill-color:#F2FFF2;" fill="#F2FFF2" fill-opacity="1.0"><path style="stroke:none" d="M 1.97 5.91 L 1.97 104.31 L 475.41 104.31 L 475.41 5.91 C 475.41 3.73 473.65 1.97 471.47 1.97 L 5.91 1.97 C 3.73 1.97 1.97 3.73 1.97 5.91 Z" /></g><g fill-opacity="1.0" transform="matrix(1.0 0.0 0.0 1.0 21.65 112.9)"><foreignobject style="--ltx-fo-width:31.37em;--ltx-fo-height:1.89em;--ltx-fo-depth:0.19em;font-size:10pt;" height="28.79" overflow="visible" transform="matrix(1 0 0 -1 0 26.1)" width="434.07"><span class="ltx_foreignobject_container"><span class="ltx_foreignobject_content">
<span id="S2.F1.pic2.1" class="ltx_inline-block ltx_minipage ltx_align_bottom" style="width:31.37em;">
<span id="S2.F1.pic2.1.1" class="ltx_p"><span id="S2.F1.pic2.1.1.1" class="ltx_text ltx_font_bold" style="--ltx-fg-color:#FFFFFF;">Response <math id="S2.F1.pic2.m1" class="ltx_Math" alttext="\mathbf{y}_{w}" display="inline" intent=":literal"><semantics><msub><mi style="--ltx-fg-color:#FFFFFF;" mathcolor="#FFFFFF">𝐲</mi><mi style="--ltx-fg-color:#FFFFFF;" mathcolor="#FFFFFF">w</mi></msub><annotation encoding="application/x-tex">\mathbf{y}_{w}</annotation></semantics></math>, <math id="S2.F1.pic2.m2" class="ltx_Math" alttext="r=0.95" display="inline" intent=":literal"><semantics><mrow><mi style="--ltx-fg-color:#FFFFFF;" mathcolor="#FFFFFF">r</mi><mo style="--ltx-fg-color:#FFFFFF;" mathcolor="#FFFFFF">=</mo><mn style="--ltx-fg-color:#FFFFFF;" mathcolor="#FFFFFF">0.95</mn></mrow><annotation encoding="application/x-tex">r=0.95</annotation></semantics></math></span></span>
</span></span></span></foreignobject></g><g fill-opacity="1.0" transform="matrix(1.0 0.0 0.0 1.0 21.65 16.47)"><foreignobject style="--ltx-fo-width:31.37em;--ltx-fo-height:5.49em;--ltx-fo-depth:0.19em;font-size:10pt;" height="78.72" overflow="visible" transform="matrix(1 0 0 -1 0 76.03)" width="434.07"><span class="ltx_foreignobject_container"><span class="ltx_foreignobject_content">
<span id="S2.F1.pic2.2" class="ltx_inline-block ltx_minipage ltx_align_bottom" style="width:31.37em;">
<span id="S2.F1.pic2.2.1" class="ltx_p"><span id="S2.F1.pic2.2.1.1" class="ltx_text" style="--ltx-fg-color:#000000;">To find out how many minutes it will take to print 200 pages, we need to divide the total number of pages by the number of pages the printer can print per minute.
So we divide 200 by 17: <math id="S2.F1.pic2.m3" class="ltx_Math" alttext="\frac{200}{17}\approx 11.76" display="inline" intent=":literal"><semantics><mrow><mfrac style="--ltx-fg-color:#000000;" mathcolor="#000000"><mn style="--ltx-fg-color:#000000;" mathcolor="#000000">200</mn><mn style="--ltx-fg-color:#000000;" mathcolor="#000000">17</mn></mfrac><mo style="--ltx-fg-color:#000000;" mathcolor="#000000">≈</mo><mn style="--ltx-fg-color:#000000;" mathcolor="#000000">11.76</mn></mrow><annotation encoding="application/x-tex">\frac{200}{17}\approx 11.76</annotation></semantics></math>.
But since we want the nearest whole number, we need to round it up. That means it will take <math id="S2.F1.pic2.m4" class="ltx_Math" alttext="\boxed{12}" display="inline" intent=":literal"><semantics><menclose notation="box"><mn style="--ltx-fg-color:#000000;" mathcolor="#000000">12</mn></menclose><annotation encoding="application/x-tex">\boxed{12}</annotation></semantics></math> minutes to print 200 pages. The answer is: <math id="S2.F1.pic2.m5" class="ltx_Math" alttext="\boxed{12}" display="inline" intent=":literal"><semantics><menclose notation="box"><mn style="--ltx-fg-color:#000000;" mathcolor="#000000">12</mn></menclose><annotation encoding="application/x-tex">\boxed{12}</annotation></semantics></math></span></span>
</span></span></span></foreignobject></g></g></svg>