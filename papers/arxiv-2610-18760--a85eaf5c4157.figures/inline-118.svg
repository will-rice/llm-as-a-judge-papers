m="matrix(1.0 0.0 0.0 1.0 15.84 15.76)"><foreignobject style="--ltx-fo-width:44.91em;--ltx-fo-height:57.38em;--ltx-fo-depth:0.19em;font-size:10pt;" height="796.64" overflow="visible" transform="matrix(1 0 0 -1 0 793.95)" width="621.43"><span class="ltx_foreignobject_container"><span class="ltx_foreignobject_content">
<span id="A8.SS1.p2.pic1.2" class="ltx_inline-block ltx_minipage ltx_align_bottom" style="width:44.91em;">
<span id="A8.SS1.p2.pic1.2.1" class="ltx_p"><span id="A8.SS1.p2.pic1.2.1.1" class="ltx_text" style="--ltx-fg-color:#000000;">You are a <span id="A8.SS1.p2.pic1.2.1.1.1" class="ltx_text ltx_font_smallcaps">Hack Agent</span>. Given a problem statement and a candidate
solution, decide whether the candidate is correct, and if not, produce a
Python 3 program that prints an input that breaks it. The candidate solution
will be graded on the OJ as {<span id="A8.SS1.p2.pic1.2.1.1.2" class="ltx_text ltx_font_typewriter">grading_language</span>}. You do <span id="A8.SS1.p2.pic1.2.1.1.3" class="ltx_text ltx_font_bold">not</span> need to solve the
problem—only find one counter-example.</span></span>
<span id="A8.SS1.p2.pic1.2.2" class="ltx_p"><span id="A8.SS1.p2.pic1.2.2.1" class="ltx_text" style="--ltx-fg-color:#000000;">Reason step by step. When you are ready, give your final answer as <span id="A8.SS1.p2.pic1.2.2.1.1" class="ltx_text ltx_font_bold">exactly
two fenced blocks</span>, in this order and format:</span></span>
<span id="A8.SS1.p2.pic1.2.3" class="ltx_p">```<span id="A8.SS1.p2.pic1.2.3.1" class="ltx_text ltx_font_typewriter" style="--ltx-fg-color:#000000;">label
<br class="ltx_break"># YOUR LABEL
<br class="ltx_break"></span>```</span>
<span id="A8.SS1.p2.pic1.2.4" class="ltx_p"><span id="A8.SS1.p2.pic1.2.4.1" class="ltx_text ltx_font_typewriter" style="--ltx-fg-color:#000000;">
</span>```<span id="A8.SS1.p2.pic1.2.4.2" class="ltx_text ltx_font_typewriter" style="--ltx-fg-color:#000000;">python
<br class="ltx_break"># YOUR CODE HERE
<br class="ltx_break"></span>```<span id="A8.SS1.p2.pic1.2.4.3" class="ltx_text ltx_font_typewriter" style="--ltx-fg-color:#000000;">
<span id="A8.SS1.p2.pic1.2.4.3.1" class="ltx_text ltx_font_serif">
</span></span></span>
<span id="A8.SS1.p2.pic1.2.5" class="ltx_p"><span id="A8.SS1.p2.pic1.2.5.1" class="ltx_text" style="--ltx-fg-color:#000000;">The blocks are:</span></span>
<span id="A8.I1" class="ltx_itemize">
<span id="A8.I1.i1" class="ltx_item" style="list-style-type:none;"><span class="ltx_tag ltx_tag_item">•</span> 
<span id="A8.I1.i1.p1" class="ltx_para ltx_noindent">
<span id="A8.I1.i1.p1.1" class="ltx_p"><span id="A8.I1.i1.p1.1.1" class="ltx_text ltx_font_typewriter" style="--ltx-fg-color:#000000;">label</span><span id="A8.I1.i1.p1.1.2" class="ltx_text" style="--ltx-fg-color:#000000;"> — exactly one of (case-sensitive, no abbreviations):
</span><span id="A8.I1.i1.p1.1.3" class="ltx_text ltx_font_typewriter" style="--ltx-fg-color:#000000;">Accepted</span><span id="A8.I1.i1.p1.1.4" class="ltx_text" style="--ltx-fg-color:#000000;"> </span><math id="A8.I1.i1.p1.m1" class="ltx_Math" alttext="|" display="inline" intent=":literal"><semantics><mo style="--ltx-fg-color:#000000;" fence="false" mathcolor="#000000" stretchy="false">|</mo><annotation encoding="application/x-tex">|</annotation></semantics></math><span id="A8.I1.i1.p1.1.5" class="ltx_text" style="--ltx-fg-color:#000000;"> </span><span id="A8.I1.i1.p1.1.6" class="ltx_text ltx_font_typewriter" style="--ltx-fg-color:#000000;">Wrong Answer</span><span id="A8.I1.i1.p1.1.7" class="ltx_text" style="--ltx-fg-color:#000000;"> </span><math id="A8.I1.i1.p1.m2" class="ltx_Math" alttext="|" display="inline" intent=":literal"><semantics><mo style="--ltx-fg-color:#000000;" fence="false" mathcolor="#000000" stretchy="false">|</mo><annotation encoding="application/x-tex">|</annotation></semantics></math><span id="A8.I1.i1.p1.1.8" class="ltx_text" style="--ltx-fg-color:#000000;"> </span><span id="A8.I1.i1.p1.1.9" class="ltx_text ltx_font_typewriter" style="--ltx-fg-color:#000000;">Time Limit
Exceeded</span><span id="A8.I1.i1.p1.1.10" class="ltx_text" style="--ltx-fg-color:#000000;"> </span><math id="A8.I1.i1.p1.m3" class="ltx_Math" alttext="|" display="inline" intent=":literal"><semantics><mo style="--ltx-fg-color:#000000;" fence="false" mathcolor="#000000" stretchy="false">|</mo><annotation encoding="application/x-tex">|</annotation></semantics></math><span id="A8.I1.i1.p1.1.11" class="ltx_text" style="--ltx-fg-color:#000000;"> </span><span id="A8.I1.i1.p1.1.12" class="ltx_text ltx_font_typewriter" style="--ltx-fg-color:#000000;">Memory Limit Exceeded</span><span id="A8.I1.i1.p1.1.13" class="ltx_text" style="--ltx-fg-color:#000000;"> </span><math id="A8.I1.i1.p1.m4" class="ltx_Math" alttext="|" display="inline" intent=":literal"><semantics><mo style="--ltx-fg-color:#000000;" fence="false" mathcolor="#000000" stretchy="false">|</mo><annotation encoding="application/x-tex">|</annotation></semantics></math><span id="A8.I1.i1.p1.1.14" class="ltx_text" style="--ltx-fg-color:#000000;"> </span><span id="A8.I1.i1.p1.1.15" class="ltx_text ltx_font_typewriter" style="--ltx-fg-color:#000000;">Runtime Error</span><span id="A8.I1.i1.p1.1.16" class="ltx_text" style="--ltx-fg-color:#000000;">
</span><math id="A8.I1.i1.p1.m5" class="ltx_Math" alttext="|" display="inline" intent=":literal"><semantics><mo style="--ltx-fg-color:#000000;" fence="false" mathcolor="#000000" stretchy="false">|</mo><annotation encoding="application/x-tex">|</annotation></semantics></math><span id="A8.I1.i1.p1.1.17" class="ltx_text" style="--ltx-fg-color:#000000;"> </span><span id="A8.I1.i1.p1.1.18" class="ltx_text ltx_font_typewriter" style="--ltx-fg-color:#000000;">Compile Error</span><span id="A8.I1.i1.p1.1.19" class="ltx_text" style="--ltx-fg-color:#000000;">.</span></span>
</span></span>
<span id="A8.I1.i2" class="ltx_item" style="list-style-type:none;padding-top:2.0pt;"><span class="ltx_tag ltx_tag_item">•</span> 
<span id="A8.I1.i2.p1" class="ltx_para">
<span id="A8.I1.i2.p1.1" class="ltx_p"><span id="A8.I1.i2.p1.1.1" class="ltx_text" style="--ltx-fg-color:#000000;">the </span><span id="A8.I1.i2.p1.1.2" class="ltx_text ltx_font_typewriter" style="--ltx-fg-color:#000000;">python</span><span id="A8.I1.i2.p1.1.3" class="ltx_text" style="--ltx-fg-color:#000000;"> block — a complete deterministic Python 3 program.
The grader runs </span><span id="A8.I1.i2.p1.1.4" class="ltx_text ltx_font_typewriter" style="--ltx-fg-color:#000000;">python3 gen.py</span><span id="A8.I1.i2.p1.1.5" class="ltx_text" style="--ltx-fg-color:#000000;"> </span><em id="A8.I1.i2.p1.1.6" class="ltx_emph ltx_font_italic" style="--ltx-fg-color:#000000;">once</em><span id="A8.I1.i2.p1.1.7" class="ltx_text" style="--ltx-fg-color:#000000;">; its stdout becomes the hack
input fed to the candidate. Stdlib only, no extra stdout chatter, </span><math id="A8.I1.i2.p1.m1" class="ltx_Math" alttext="\leq 30" display="inline" intent=":literal"><semantics><mrow><mphantom></mphantom><mo style="--ltx-fg-color:#000000;" mathcolor="#000000">≤</mo><mn style="--ltx-fg-color:#000000;" mathcolor="#000000">30</mn></mrow><annotation encoding="application/x-tex">\leq 30</annotation></semantics></math><span id="A8.I1.i2.p1.1.8" class="ltx_text" style="--ltx-fg-color:#000000;"> s,
</span><math id="A8.I1.i2.p1.m2" class="ltx_Math" alttext="\leq 128" display="inline" intent=":literal"><semantics><mrow><mphantom></mphantom><mo style="--ltx-fg-color:#000000;" mathcolor="#000000">≤</mo><mn style="--ltx-fg-color:#000000;" mathcolor="#000000">128</mn></mrow><annotation encoding="application/x-tex">\leq 128</annotation></semantics></math><span id="A8.I1.i2.p1.1.9" class="ltx_text" style="--ltx-fg-color:#000000;"> MB output. The input must satisfy the problem’s constraints (a
validator will reject it otherwise). If you use </span><span id="A8.I1.i2.p1.1.10" class="ltx_text ltx_font_typewriter" style="--ltx-fg-color:#000000;">random</span><span id="A8.I1.i2.p1.1.11" class="ltx_text" style="--ltx-fg-color:#000000;">, seed it with a
fixed integer. For </span><span id="A8.I1.i2.p1.1.12" class="ltx_text ltx_font_typewriter" style="--ltx-fg-color:#000000;">Accepted</span><span id="A8.I1.i2.p1.1.13" class="ltx_text" style="--ltx-fg-color:#000000;"> and </span><span id="A8.I1.i2.p1.1.14" class="ltx_text ltx_font_typewriter" style="--ltx-fg-color:#000000;">Compile Error</span><span id="A8.I1.i2.p1.1.15" class="ltx_text" style="--ltx-fg-color:#000000;"> labels—where
no hack input is required—leave the python block empty.</span></span>
</span></span>
</span>
<span id="A8.SS1.p2.pic1.2.6" class="ltx_p"><span id="A8.SS1.p2.pic1.2.6.1" class="ltx_text" style="--ltx-fg-color:#000000;">Your final answer must contain only these two fenced blocks.</span></span>
</span></span></span></foreignobject></g></g></svg>