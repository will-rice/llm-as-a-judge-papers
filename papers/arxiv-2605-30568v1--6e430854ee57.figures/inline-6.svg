</span></span></span></foreignobject></g><g fill-opacity="1.0" transform="matrix(1.0 0.0 0.0 1.0 10.16 198.87)"><foreignobject style="--ltx-fo-width:43.55em;--ltx-fo-height:9.09em;--ltx-fo-depth:0.22em;font-size:10pt;" height="128.8" overflow="visible" transform="matrix(1 0 0 -1 0 125.73)" width="602.61"><span class="ltx_foreignobject_container"><span class="ltx_foreignobject_content">
<span id="A1.p9.pic1.2" class="ltx_inline-block ltx_minipage ltx_align_bottom" style="width:43.55em;">
<span id="A1.p9.pic1.2.1" class="ltx_p"><span id="A1.p9.pic1.2.1.1" class="ltx_text ltx_font_bold" style="--ltx-fg-color:#000000;">System:<span id="A1.p9.pic1.2.1.1.1" class="ltx_text ltx_font_typewriter ltx_font_medium"> You are a helpful assistant that evaluates the quality of AI responses. You will be given an instruction, an evaluation rubric tailored to that instruction, and two responses (Response A and Response B). Use the rubric criteria to compare the responses and decide which one is better.
</span></span></span>
<span id="A1.p9.pic1.2.2" class="ltx_p"><span id="A1.p9.pic1.2.2.1" class="ltx_text ltx_font_typewriter" style="--ltx-fg-color:#000000;">You must output ONLY a single JSON object with two keys:
<br class="ltx_break">- &quot;winner&quot;: either &quot;A&quot; or &quot;B&quot; (the letter of the better response)
<br class="ltx_break">- &quot;reason&quot;: a brief one-sentence explanation referencing the rubric criteria
</span></span>
</span></span></span></foreignobject></g><g fill-opacity="1.0" transform="matrix(1.0 0.0 0.0 1.0 10.16 13.24)"><foreignobject style="--ltx-fo-width:43.55em;--ltx-fo-height:11.49em;--ltx-fo-depth:0.22em;font-size:10pt;" height="162.01" overflow="visible" transform="matrix(1 0 0 -1 0 158.94)" width="602.61"><span class="ltx_foreignobject_container"><span class="ltx_foreignobject_content">
<span id="A1.p9.pic1.3" class="ltx_inline-block ltx_minipage ltx_align_bottom" style="width:43.55em;">
<span id="A1.p9.pic1.3.1" class="ltx_p"><span id="A1.p9.pic1.3.1.1" class="ltx_text ltx_font_bold" style="--ltx-fg-color:#000000;">User:<span id="A1.p9.pic1.3.1.1.1" class="ltx_text ltx_font_typewriter ltx_font_medium"> [Instruction]
<br class="ltx_break">{instruction}
<br class="ltx_break" style="--ltx-break-space:5.3pt;">
[Evaluation Rubric]
<br class="ltx_break">{rubric}
<br class="ltx_break" style="--ltx-break-space:5.3pt;">
[Response A]
<br class="ltx_break">{response_a}
<br class="ltx_break" style="--ltx-break-space:5.3pt;">
[Response B]
<br class="ltx_break">{response_b}
<br class="ltx_break" style="--ltx-break-space:5.3pt;">
Based on the rubric, which response is better? Output only the JSON object.
