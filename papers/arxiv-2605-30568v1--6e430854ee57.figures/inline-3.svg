<span id="A1.p5.pic1.1.1" class="ltx_p"><span id="A1.p5.pic1.1.1.1" class="ltx_text ltx_font_sansserif ltx_font_bold" style="--ltx-fg-color:#FFFFFF;">Instance-specific rubric generation (pairwise)</span></span>
</span></span></span></foreignobject></g><g fill-opacity="1.0" transform="matrix(1.0 0.0 0.0 1.0 10.16 99.24)"><foreignobject style="--ltx-fo-width:43.55em;--ltx-fo-height:9.09em;--ltx-fo-depth:0.22em;font-size:10pt;" height="128.8" overflow="visible" transform="matrix(1 0 0 -1 0 125.73)" width="602.61"><span class="ltx_foreignobject_container"><span class="ltx_foreignobject_content">
<span id="A1.p5.pic1.2" class="ltx_inline-block ltx_minipage ltx_align_bottom" style="width:43.55em;">
<span id="A1.p5.pic1.2.1" class="ltx_p"><span id="A1.p5.pic1.2.1.1" class="ltx_text ltx_font_bold" style="--ltx-fg-color:#000000;">System:<span id="A1.p5.pic1.2.1.1.1" class="ltx_text ltx_font_typewriter ltx_font_medium"> You are an expert evaluator designing assessment criteria. Given a task instruction, create a concise evaluation rubric with 3--5 specific criteria for judging the quality of responses to this instruction.
</span></span></span>
<span id="A1.p5.pic1.2.2" class="ltx_p"><span id="A1.p5.pic1.2.2.1" class="ltx_text ltx_font_typewriter" style="--ltx-fg-color:#000000;">Focus on what makes a response good or bad FOR THIS SPECIFIC TASK. Consider the task type (factual Q&amp;A, creative writing, coding, reasoning, summarization, etc.) and what a high-quality answer requires.
</span></span>
<span id="A1.p5.pic1.2.3" class="ltx_p"><span id="A1.p5.pic1.2.3.1" class="ltx_text ltx_font_typewriter" style="--ltx-fg-color:#000000;">Output ONLY a numbered list of criteria. Each criterion should be one clear sentence.
</span></span>
</span></span></span></foreignobject></g><g fill-opacity="1.0" transform="matrix(1.0 0.0 0.0 1.0 10.16 13.24)"><foreignobject style="--ltx-fo-width:43.55em;--ltx-fo-height:4.29em;--ltx-fo-depth:0.22em;font-size:10pt;" height="62.38" overflow="visible" transform="matrix(1 0 0 -1 0 59.31)" width="602.61"><span class="ltx_foreignobject_container"><span class="ltx_foreignobject_content">
<span id="A1.p5.pic1.3" class="ltx_inline-block ltx_minipage ltx_align_bottom" style="width:43.55em;">
<span id="A1.p5.pic1.3.1" class="ltx_p"><span id="A1.p5.pic1.3.1.1" class="ltx_text ltx_font_bold" style="--ltx-fg-color:#000000;">User:<span id="A1.p5.pic1.3.1.1.1" class="ltx_text ltx_font_typewriter ltx_font_medium"> [Instruction]
<br class="ltx_break">{instruction}
<br class="ltx_break" style="--ltx-break-space:5.3pt;">
Write the evaluation rubric for judging responses to the above instruction.
</span></span></span>
