<span id="A6.F14.pic1.2" class="ltx_inline-block ltx_minipage ltx_align_bottom" style="width:37.08em;">
<span id="A6.F14.pic1.2.1" class="ltx_p"><span id="A6.F14.pic1.2.1.1" class="ltx_text ltx_font_typewriter" style="--ltx-fg-color:#000000;">[System]
Please act as an impartial judge and evaluate the quality of the responses provided by two
AI assistants to the user question displayed below. You should choose the assistant that
follows the user’s instructions and answers the user’s question better. Your evaluation
should consider factors such as the helpfulness, relevance, accuracy, depth, creativity,
and level of detail of their responses. Begin your evaluation by comparing the two
responses and provide a short explanation. Avoid any position biases and ensure that
the order in which the responses were presented does not influence your decision. Do not allow
the length of the responses to influence your evaluation. Do not favor certain names of
the assistants. Be as objective as possible. After providing your explanation, output your
final verdict by strictly following this format: &quot;[[A]]&quot; if assistant A is better, &quot;[[B]]&quot;
if assistant B is better,&quot;[[C]]&quot; if assistant C is better.

<br class="ltx_break">[User Question]

<br class="ltx_break">{question}

<br class="ltx_break">[The Start of Assistant A’s Answer]

<br class="ltx_break">{answer_a}

<br class="ltx_break">[The End of Assistant A’s Answer]

<br class="ltx_break">[The Start of Assistant B’s Answer]

<br class="ltx_break">{answer_b}

<br class="ltx_break">[The End of Assistant B’s Answer]

<br class="ltx_break">[The Start of Assistant C’s Answer]

<br class="ltx_break">{answer_c}

<br class="ltx_break">[The End of Assistant C’s Answer]
