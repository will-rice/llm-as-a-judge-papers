<svg id="A4.F8.pic2" class="ltx_picture ltx_centering ltx_figure_panel" height="223.79" overflow="visible" version="1.1" viewbox="0 0 550 223.79" width="550"><g style="--ltx-stroke-color:#000000;--ltx-fill-color:#000000;" fill="#000000" stroke="#000000" stroke-width="0.4pt" transform="translate(0,223.79) matrix(1 0 0 -1 0 0)"><g style="--ltx-fill-color:#004000;" fill="#004000" fill-opacity="1.0"><path style="stroke:none" d="M 0 0 L 0 223.79 L 550 223.79 L 550 0 Z" /></g><g style="--ltx-fill-color:#FAFFFA;" fill="#FAFFFA" fill-opacity="1.0"><path style="stroke:none" d="M 1.97 1.97 L 1.97 221.82 L 548.03 221.82 L 548.03 1.97 Z" /></g><g fill-opacity="1.0" transform="matrix(1.0 0.0 0.0 1.0 6.12 8.81)"><foreignobject style="--ltx-fo-width:38.86em;--ltx-fo-height:15.09em;--ltx-fo-depth:0.19em;font-size:10pt;" height="211.55" overflow="visible" transform="matrix(1 0 0 -1 0 208.86)" width="537.71"><span class="ltx_foreignobject_container"><span class="ltx_foreignobject_content">
<span id="A4.F8.pic2.1" class="ltx_inline-block ltx_minipage ltx_align_bottom" style="width:38.86em;">
<span id="A4.F8.pic2.1.1" class="ltx_p"><span id="A4.F8.pic2.1.1.1" class="ltx_text ltx_font_bold" style="--ltx-fg-color:#000000;">Gold Response:<span id="A4.F8.pic2.1.1.1.1" class="ltx_text ltx_font_medium">
1.) The total loan amount is $407 million.</span></span></span>
<span id="A4.F8.pic2.1.2" class="ltx_p"><span id="A4.F8.pic2.1.2.1" class="ltx_text" style="--ltx-fg-color:#000000;">2.) The as-is appraised value of the underlying collateral is $550,744,248.99.</span></span>
<span id="A4.F8.pic2.1.3" class="ltx_p"><span id="A4.F8.pic2.1.3.1" class="ltx_text" style="--ltx-fg-color:#000000;">3.) The required RR interest (credit risk retention) is 5.00% of the total loan amount, or 20,350,000.</span></span>
<span id="A4.F8.pic2.1.4" class="ltx_p"><span id="A4.F8.pic2.1.4.1" class="ltx_text" style="--ltx-fg-color:#000000;">The RR interest represents the portion of the loan that the sponsor retains in order to share the risk. This amount is subtracted from the appraised value since it’s not part of the bondholder allocation.</span></span>
<span id="A4.Ex2" class="ltx_equation ltx_eqn_table">

<span><span class="ltx_equation ltx_eqn_row ltx_align_baseline">
<span class="ltx_eqn_cell ltx_eqn_center_padleft"></span>
<span class="ltx_eqn_cell ltx_align_center"><math id="A4.Ex2.m1" class="ltx_Math" alttext="\$550,744,248-\$20,350,000=\$530,394,248.99" display="block" intent=":literal"><semantics><mrow><mrow><mrow><mo style="--ltx-fg-color:#000000;" mathcolor="#000000" rspace="0.167em">$</mo><mn style="--ltx-fg-color:#000000;" mathcolor="#000000">550,744,248</mn></mrow><mo style="--ltx-fg-color:#000000;" mathcolor="#000000">−</mo><mrow><mo style="--ltx-fg-color:#000000;" lspace="0em" mathcolor="#000000" rspace="0.167em">$</mo><mn style="--ltx-fg-color:#000000;" mathcolor="#000000">20,350,000</mn></mrow></mrow><mo style="--ltx-fg-color:#000000;" mathcolor="#000000" rspace="0.1389em">=</mo><mrow><mo style="--ltx-fg-color:#000000;" lspace="0.1389em" mathcolor="#000000" rspace="0.167em">$</mo><mn style="--ltx-fg-color:#000000;" mathcolor="#000000">530,394,248.99</mn></mrow></mrow><annotation encoding="application/x-tex">\$550,744,248-\$20,350,000=\$530,394,248.99</annotation></semantics></math></span>
<span class="ltx_eqn_cell ltx_eqn_center_padright"></span></span></span>
</span>
<span id="A4.F8.pic2.1.5" class="ltx_p"><span id="A4.F8.pic2.1.5.1" class="ltx_text" style="--ltx-fg-color:#000000;">Next, divide the Class A balance by $530,394,248.99:</span></span>
<span id="A4.Ex3" class="ltx_equation ltx_eqn_table">

<span><span class="ltx_equation ltx_eqn_row ltx_align_baseline">
<span class="ltx_eqn_cell ltx_eqn_center_padleft"></span>
<span class="ltx_eqn_cell ltx_align_center"><math id="A4.Ex3.m1" class="ltx_Math" alttext="\$183,160,000/\$530,394,248.99=0.3453" display="block" intent=":literal"><semantics><mrow><mrow><mrow><mo style="--ltx-fg-color:#000000;" mathcolor="#000000" rspace="0.167em">$</mo><mn style="--ltx-fg-color:#000000;" mathcolor="#000000">183,160,000</mn></mrow><mo style="--ltx-fg-color:#000000;" mathcolor="#000000">/</mo><mrow><mo style="--ltx-fg-color:#000000;" lspace="0em" mathcolor="#000000" rspace="0.167em">$</mo><mn style="--ltx-fg-color:#000000;" mathcolor="#000000">530,394,248.99</mn></mrow></mrow><mo style="--ltx-fg-color:#000000;" mathcolor="#000000">=</mo><mn style="--ltx-fg-color:#000000;" mathcolor="#000000">0.3453</mn></mrow><annotation encoding="application/x-tex">\$183,160,000/\$530,394,248.99=0.3453</annotation></semantics></math></span>
