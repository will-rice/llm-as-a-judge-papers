<span id="A2.SS1.SSS3.Px2.p2.pic1.2" class="ltx_inline-block ltx_minipage ltx_align_bottom" style="width:34.58em;">
<span id="A2.SS1.SSS3.Px2.p2.pic1.2.1" class="ltx_p"><span id="A2.SS1.SSS3.Px2.p2.pic1.2.1.1" class="ltx_text" style="font-size:90%;--ltx-fg-color:#000000;">For example, the task is to place a heated mug on a table. Initially, the mug has not been heated and is not on the table. Heating the mug and placing it on the table are two task requirements, and they have a dependency: to finish the task, you need to first heat the mug, then place the heated mug on the table.</span></span>
</span></span></span></foreignobject></g></g></svg>