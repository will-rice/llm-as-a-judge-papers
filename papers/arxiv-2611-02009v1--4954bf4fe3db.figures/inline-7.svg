<span id="A3.SS2.SSS1.p1.pic1.2" class="ltx_inline-block ltx_minipage ltx_align_bottom" style="width:43.55em;">
<span id="A3.SS2.SSS1.p1.pic1.2.1" class="ltx_p"><span id="A3.SS2.SSS1.p1.pic1.2.1.1" class="ltx_text ltx_font_typewriter" style="--ltx-fg-color:#000000;">You are an expert in social media translation. Please translate the
following content into English. Follow these requirements:
</span></span>
<span id="A3.SS2.SSS1.p1.pic1.2.2" class="ltx_p"><span id="A3.SS2.SSS1.p1.pic1.2.2.1" class="ltx_text ltx_font_typewriter" style="--ltx-fg-color:#000000;">1. Placeholders in the form ‘‘#placeholder-x#’’ must not be
