<svg id="S2.F1.pic3" class="ltx_picture ltx_figure_panel" height="128.3" overflow="visible" version="1.1" viewbox="0 0 477.38 128.3" width="477.38"><g style="--ltx-stroke-color:#000000;--ltx-fill-color:#000000;" fill="#000000" stroke="#000000" stroke-width="0.4pt" transform="translate(0,128.3) matrix(1 0 0 -1 0 0)"><g style="--ltx-fill-color:#BA8C8C;" fill="#BA8C8C" fill-opacity="1.0"><path style="stroke:none" d="M 0 5.91 L 0 122.4 C 0 125.66 2.64 128.3 5.91 128.3 L 471.47 128.3 C 474.73 128.3 477.38 125.66 477.38 122.4 L 477.38 5.91 C 477.38 2.64 474.73 0 471.47 0 L 5.91 0 C 2.64 0 0 2.64 0 5.91 Z" /></g><g style="--ltx-fill-color:#FFF2F2;" fill="#FFF2F2" fill-opacity="1.0"><path style="stroke:none" d="M 1.97 5.91 L 1.97 87.7 L 475.41 87.7 L 475.41 5.91 C 475.41 3.73 473.65 1.97 471.47 1.97 L 5.91 1.97 C 3.73 1.97 1.97 3.73 1.97 5.91 Z" /></g><g fill-opacity="1.0" transform="matrix(1.0 0.0 0.0 1.0 21.65 96.3)"><foreignobject style="--ltx-fo-width:31.37em;--ltx-fo-height:1.89em;--ltx-fo-depth:0.19em;font-size:10pt;" height="28.79" overflow="visible" transform="matrix(1 0 0 -1 0 26.1)" width="434.07"><span class="ltx_foreignobject_container"><span class="ltx_foreignobject_content">
<span id="S2.F1.pic3.1" class="ltx_inline-block ltx_minipage ltx_align_bottom" style="width:31.37em;">
<span id="S2.F1.pic3.1.1" class="ltx_p"><span id="S2.F1.pic3.1.1.1" class="ltx_text ltx_font_bold" style="--ltx-fg-color:#FFFFFF;">Response <math id="S2.F1.pic3.m1" class="ltx_Math" alttext="\mathbf{y}_{l}" display="inline" intent=":literal"><semantics><msub><mi style="--ltx-fg-color:#FFFFFF;" mathcolor="#FFFFFF">𝐲</mi><mi style="--ltx-fg-color:#FFFFFF;" mathcolor="#FFFFFF">l</mi></msub><annotation encoding="application/x-tex">\mathbf{y}_{l}</annotation></semantics></math>, <math id="S2.F1.pic3.m2" class="ltx_Math" alttext="r=0.91" display="inline" intent=":literal"><semantics><mrow><mi style="--ltx-fg-color:#FFFFFF;" mathcolor="#FFFFFF">r</mi><mo style="--ltx-fg-color:#FFFFFF;" mathcolor="#FFFFFF">=</mo><mn style="--ltx-fg-color:#FFFFFF;" mathcolor="#FFFFFF">0.91</mn></mrow><annotation encoding="application/x-tex">r=0.91</annotation></semantics></math></span></span>
</span></span></span></foreignobject></g><g fill-opacity="1.0" transform="matrix(1.0 0.0 0.0 1.0 21.65 16.47)"><foreignobject style="--ltx-fo-width:31.37em;--ltx-fo-height:4.29em;--ltx-fo-depth:0.19em;font-size:10pt;" height="62.11" overflow="visible" transform="matrix(1 0 0 -1 0 59.42)" width="434.07"><span class="ltx_foreignobject_container"><span class="ltx_foreignobject_content">
<span id="S2.F1.pic3.2" class="ltx_inline-block ltx_minipage ltx_align_bottom" style="width:31.37em;">
<span id="S2.F1.pic3.2.1" class="ltx_p"><span id="S2.F1.pic3.2.1.1" class="ltx_text" style="--ltx-fg-color:#000000;">To find out how many minutes it will take to print 200 pages at a rate of 17 pages per minute, divide: <math id="S2.F1.pic3.m3" class="ltx_Math" alttext="\frac{200}{17}\approx 11.76" display="inline" intent=":literal"><semantics><mrow><mfrac style="--ltx-fg-color:#000000;" mathcolor="#000000"><mn style="--ltx-fg-color:#000000;" mathcolor="#000000">200</mn><mn style="--ltx-fg-color:#000000;" mathcolor="#000000">17</mn></mfrac><mo style="--ltx-fg-color:#000000;" mathcolor="#000000">≈</mo><mn style="--ltx-fg-color:#000000;" mathcolor="#000000">11.76</mn></mrow><annotation encoding="application/x-tex">\frac{200}{17}\approx 11.76</annotation></semantics></math>.
Rounding 11.76 to the nearest whole number gives: <math id="S2.F1.pic3.m4" class="ltx_Math" alttext="12" display="inline" intent=":literal"><semantics><mn style="--ltx-fg-color:#000000;" mathcolor="#000000">12</mn><annotation encoding="application/x-tex">12</annotation></semantics></math>.
So it will take <math id="S2.F1.pic3.m5" class="ltx_Math" alttext="\boxed{12}" display="inline" intent=":literal"><semantics><menclose notation="box"><mn style="--ltx-fg-color:#000000;" mathcolor="#000000">12</mn></menclose><annotation encoding="application/x-tex">\boxed{12}</annotation></semantics></math> minutes to print 200 pages. The answer is: <math id="S2.F1.pic3.m6" class="ltx_Math" alttext="\boxed{12}" display="inline" intent=":literal"><semantics><menclose notation="box"><mn style="--ltx-fg-color:#000000;" mathcolor="#000000">12</mn></menclose><annotation encoding="application/x-tex">\boxed{12}</annotation></semantics></math></span></span>
</span></span></span></foreignobject></g></g></svg>