</span></span></span></foreignobject></g><g fill-opacity="1.0" transform="matrix(1.0 0.0 0.0 1.0 8.57 11.26)"><foreignobject style="--ltx-fo-width:45.97em;--ltx-fo-height:5.49em;--ltx-fo-depth:0.19em;font-size:10pt;" height="78.72" overflow="visible" transform="matrix(1 0 0 -1 0 76.03)" width="636.1"><span class="ltx_foreignobject_container"><span class="ltx_foreignobject_content">
<span id="A1.SS1.p5.pic1.2" class="ltx_inline-block ltx_minipage ltx_align_bottom" style="width:45.97em;">
<span id="A1.SS1.p5.pic1.2.1" class="ltx_p"><span id="A1.SS1.p5.pic1.2.1.1" class="ltx_text" style="--ltx-fg-color:#000000;">coherence: The summary is well-structured and well-organized. Does it present a clear, logical flow of information?
consistency: The summary contains only information consistent with the source document. Does it avoid introducing facts not present in the article?
fluency: The summary has no grammatical errors and is easy to read. Is it fluent and idiomatic English?
relevance: The summary focuses on the most important information from the source. Does it cover the key points and avoid trivial details?</span></span>
</span></span></span></foreignobject></g></g></svg>