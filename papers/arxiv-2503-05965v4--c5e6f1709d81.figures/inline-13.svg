<svg id="A4.F28.p2.pic1" class="ltx_picture" height="521.16" overflow="visible" version="1.1" viewbox="0 0 477.38 521.16" width="477.38"><g style="--ltx-stroke-color:#000000;--ltx-fill-color:#000000;" fill="#000000" stroke="#000000" stroke-width="0.4pt" transform="translate(0,521.16) matrix(1 0 0 -1 0 0)"><g style="--ltx-fill-color:#404040;" fill="#404040" fill-opacity="1.0"><path style="stroke:none" d="M 0 5.91 L 0 515.25 C 0 518.51 2.64 521.16 5.91 521.16 L 471.47 521.16 C 474.73 521.16 477.38 518.51 477.38 515.25 L 477.38 5.91 C 477.38 2.64 474.73 0 471.47 0 L 5.91 0 C 2.64 0 0 2.64 0 5.91 Z" /></g><g style="--ltx-fill-color:#F2F2F2;" fill="#F2F2F2" fill-opacity="1.0"><path style="stroke:none" d="M 1.97 5.91 L 1.97 495.51 L 475.41 495.51 L 475.41 5.91 C 475.41 3.73 473.65 1.97 471.47 1.97 L 5.91 1.97 C 3.73 1.97 1.97 3.73 1.97 5.91 Z" /></g><g fill-opacity="1.0" transform="matrix(1.0 0.0 0.0 1.0 21.65 504.88)"><foreignobject style="--ltx-fo-width:31.37em;--ltx-fo-height:0.75em;--ltx-fo-depth:0.25em;font-size:10pt;" height="13.84" overflow="visible" transform="matrix(1 0 0 -1 0 10.38)" width="434.07"><span class="ltx_foreignobject_container"><span class="ltx_foreignobject_content">
<span id="A4.F28.p2.pic1.1" class="ltx_inline-block ltx_minipage ltx_align_bottom" style="width:31.37em;">
<span id="A4.F28.p2.pic1.1.1" class="ltx_p"><span id="A4.F28.p2.pic1.1.1.1" class="ltx_text" style="--ltx-fg-color:#FFFFFF;">Forced Choice (FC) Rating Instructions - SummEval Coherence</span></span>
</span></span></span></foreignobject></g><g fill-opacity="1.0" transform="matrix(1.0 0.0 0.0 1.0 21.65 17.24)"><foreignobject style="--ltx-fo-width:31.37em;--ltx-fo-height:33.71em;--ltx-fo-depth:0.25em;font-size:10pt;" height="469.93" overflow="visible" transform="matrix(1 0 0 -1 0 466.47)" width="434.07"><span class="ltx_foreignobject_container"><span class="ltx_foreignobject_content">
<span id="A4.F28.p2.pic1.2" class="ltx_inline-block ltx_minipage ltx_align_bottom" style="width:31.37em;">
<span id="A4.F28.p2.pic1.2.1" class="ltx_p"><span id="A4.F28.p2.pic1.2.1.1" class="ltx_text" style="--ltx-fg-color:#000000;">You will be given one summary written for a news article.
Your task is to rate the summary on one metric.
Please make sure you read and understand these instructions carefully.</span></span>
<span id="A4.F28.p2.pic1.2.2" class="ltx_p"><span id="A4.F28.p2.pic1.2.2.1" class="ltx_text ltx_font_bold" style="--ltx-fg-color:#000000;">Evaluation Criteria:
<br class="ltx_break"><span id="A4.F28.p2.pic1.2.2.1.1" class="ltx_text ltx_font_medium">Coherence - the collective quality of all sentences.
We align this dimension with the DUC quality question of structure and coherence whereby
the summary should be well-structured and well-organized. The summary should not just be
a heap of related information, but should build from sentence to a coherent
body of information about a topic.</span></span></span>
<span id="A4.F28.p2.pic1.2.3" class="ltx_p"><span id="A4.F28.p2.pic1.2.3.1" class="ltx_text ltx_font_bold" style="--ltx-fg-color:#000000;">Evaluation Steps:<span id="A4.F28.p2.pic1.2.3.1.1" class="ltx_text"></span></span></span>
<span id="A4.I28" class="ltx_enumerate">
<span id="A4.I28.i1" class="ltx_item" style="list-style-type:none;"><span class="ltx_tag ltx_tag_item">1.</span> 
<span id="A4.I28.i1.p1" class="ltx_para">
<span id="A4.I28.i1.p1.1" class="ltx_p"><span id="A4.I28.i1.p1.1.1" class="ltx_text" style="--ltx-fg-color:#000000;">Read the news article carefully and identify the main topic and key points.</span></span>
</span></span>
<span id="A4.I28.i2" class="ltx_item" style="list-style-type:none;"><span class="ltx_tag ltx_tag_item">2.</span> 
<span id="A4.I28.i2.p1" class="ltx_para">
<span id="A4.I28.i2.p1.1" class="ltx_p"><span id="A4.I28.i2.p1.1.1" class="ltx_text" style="--ltx-fg-color:#000000;">Read the summary and compare it to the news article. Check if the summary covers the main topic and key points of the news article, and if it presents them in a clear and logical order.</span></span>
</span></span>
<span id="A4.I28.i3" class="ltx_item" style="list-style-type:none;"><span class="ltx_tag ltx_tag_item">3.</span> 
<span id="A4.I28.i3.p1" class="ltx_para">
<span id="A4.I28.i3.p1.1" class="ltx_p"><span id="A4.I28.i3.p1.1.1" class="ltx_text" style="--ltx-fg-color:#000000;">Select ONE option that best applies.</span></span>
</span></span>
</span>
<span id="A4.F28.p2.pic1.2.4" class="ltx_p"><span id="A4.F28.p2.pic1.2.4.1" class="ltx_text" style="--ltx-fg-color:#000000;">Now provide a response to the following example:
<br class="ltx_break">Article: “{article}”
<br class="ltx_break">Summary: “{summary}”</span></span>
<span id="A4.F28.p2.pic1.2.5" class="ltx_p"><span id="A4.F28.p2.pic1.2.5.1" class="ltx_text" style="--ltx-fg-color:#000000;">Select ONE option that best applies:</span></span>
<span id="A4.I29" class="ltx_itemize">
<span id="A4.I29.ix1" class="ltx_item" style="list-style-type:none;"><span class="ltx_tag ltx_tag_item">A.</span> 
<span id="A4.I29.ix1.p1" class="ltx_para">
<span id="A4.I29.ix1.p1.1" class="ltx_p"><span id="A4.I29.ix1.p1.1.1" class="ltx_text" style="--ltx-fg-color:#000000;">Coherent</span></span>
</span></span>
<span id="A4.I29.ix2" class="ltx_item" style="list-style-type:none;"><span class="ltx_tag ltx_tag_item">B.</span> 
<span id="A4.I29.ix2.p1" class="ltx_para">
<span id="A4.I29.ix2.p1.1" class="ltx_p"><span id="A4.I29.ix2.p1.1.1" class="ltx_text" style="--ltx-fg-color:#000000;">Incoherent</span></span>
</span></span>
</span>
<span id="A4.F28.p2.pic1.2.6" class="ltx_p"><span id="A4.F28.p2.pic1.2.6.1" class="ltx_text ltx_font_bold" style="--ltx-fg-color:#000000;">RESPONSE FORMAT: [omitted for brevity]<span id="A4.F28.p2.pic1.2.6.1.1" class="ltx_text"></span></span></span>
</span></span></span></foreignobject></g></g></svg>