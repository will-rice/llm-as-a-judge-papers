<span id="A5.F27.pic1.1.1" class="ltx_p"><span id="A5.F27.pic1.1.1.1" class="ltx_text ltx_font_bold" style="--ltx-fg-color:#FFFFFF;">Rubric for MRewardBench subset: hep-cpp</span></span>
</span></span></span></foreignobject></g><g fill-opacity="1.0" transform="matrix(1.0 0.0 0.0 1.0 20.79 15.99)"><foreignobject style="--ltx-fo-width:31.5em;--ltx-fo-height:15.09em;--ltx-fo-depth:0.22em;font-size:10pt;" class="ltx_minipage" height="211.94" overflow="visible" transform="matrix(1 0 0 -1 0 208.86)" width="30em"><span class="ltx_foreignobject_container"><span class="ltx_foreignobject_content"><pre id="A5.F27.pic1.2" class="ltx_verbatim ltx_font_typewriter" style="--ltx-fg-color:#000000;">Pairwise judge for HumanEvalPack (C++).
Steps:
1) Read the function spec in the User Question; read code from
   Assistant A and Assistant B.
2) Checks:
   - Functional correctness: logic meets the spec; would pass tests.
   - API contract: correct signature, headers, and namespaces.
   - Edge cases &amp; complexity: covers edge cases; appropriate
   complexity.
   - Safety/idioms: avoids undefined behavior; uses modern C++ safely.
3) Penalize: UB, memory/signedness issues, wrong headers/namespaces,
   failing logic.
4) Decision: choose Assistant A if it is safer, correct, and spec-
   compliant (or clearer/modern when both correct); otherwise choose
   Assistant B.
5) Neutrality: ignore presentation order and assistant names.

</pre></span></span></foreignobject></g></g></svg>