<span id="A5.SS4.SSS0.Px1.p2.pic1.2.1" class="ltx_p"><span id="A5.SS4.SSS0.Px1.p2.pic1.2.1.1" class="ltx_text ltx_font_bold" style="--ltx-fg-color:#000000;">Character1: Kevan Lannister<span id="A5.SS4.SSS0.Px1.p2.pic1.2.1.1.1" class="ltx_text ltx_font_medium"> 
<br class="ltx_break">[Thinking: I need to distance Tywin from Ned Stark’s fate.] 
<br class="ltx_break">Your father had no part in that.</span></span></span>
<span id="A5.SS4.SSS0.Px1.p2.pic1.2.2" class="ltx_p"><span id="A5.SS4.SSS0.Px1.p2.pic1.2.2.1" class="ltx_text ltx_font_bold" style="--ltx-fg-color:#000000;">Character2: Unknown<span id="A5.SS4.SSS0.Px1.p2.pic1.2.2.1.1" class="ltx_text ltx_font_medium"> 
<br class="ltx_break">[Thinking: I can’t believe they think I’m this naive.] 
<br class="ltx_break">Castle Black teems with murderers, thieves and rapists, but I don’t recall meeting many regicides while I was there. You expect me to believe that if I admit to being a kinslayer and kingslayer, my father will simply nod, forgive me, and pack me off to the Wall with some warm woolen smallclothes. (hoots rudely)</span></span></span>
<span id="A5.SS4.SSS0.Px1.p2.pic1.2.3" class="ltx_p"><span id="A5.SS4.SSS0.Px1.p2.pic1.2.3.1" class="ltx_text ltx_font_bold" style="--ltx-fg-color:#000000;">Candidate Roles:<span id="A5.SS4.SSS0.Px1.p2.pic1.2.3.1.1" class="ltx_text"></span></span></span>
<span id="A5.SS4.SSS0.Px1.p2.pic1.2.4" class="ltx_p"><span id="A5.SS4.SSS0.Px1.p2.pic1.2.4.1" class="ltx_text" style="--ltx-fg-color:#000000;">Tywin Lannister (Correct), Jaime Lannister, Tyrion Lannister, and Lord Tywin Lannister</span></span>
</span></span></span></foreignobject></g></g></svg>