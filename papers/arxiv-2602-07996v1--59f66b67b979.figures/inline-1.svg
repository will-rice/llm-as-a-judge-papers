<span id="A1.F1.pic1.2.1" class="ltx_p"><span id="A1.F1.pic1.2.1.1" class="ltx_text" style="--ltx-fg-color:#000000;">Objective:

<br class="ltx_break">You are an expert evaluator tasked with judging the quality of answers to a question.

<br class="ltx_break"></span></span>
<span id="A1.F1.pic1.2.2" class="ltx_p"><span id="A1.F1.pic1.2.2.1" class="ltx_text" style="--ltx-fg-color:#000000;">Instructions:

<br class="ltx_break">- Read the question and the two responses carefully.

<br class="ltx_break">- Judge which response is better overall, considering correctness and clarity.

<br class="ltx_break">- Provide your output strictly as a JSON object with the following fields:

<br class="ltx_break">– &quot;selected response&quot;: 1 or 2 (the better response)

<br class="ltx_break">– &quot;reason&quot;: a brief explanation of why this response is better

<br class="ltx_break">- Output only valid JSON, no extra commentary.

<br class="ltx_break"></span></span>
<span id="A1.F1.pic1.2.3" class="ltx_p"><span id="A1.F1.pic1.2.3.1" class="ltx_text" style="--ltx-fg-color:#000000;">Question:

