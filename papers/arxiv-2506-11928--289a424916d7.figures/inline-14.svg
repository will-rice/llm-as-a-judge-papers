<svg id="S15.SS0.SSS0.Px4.p3.pic1" class="ltx_picture" height="273.95" overflow="visible" version="1.1" viewbox="0 0 477.38 273.95" width="477.38"><g style="--ltx-stroke-color:#000000;--ltx-fill-color:#000000;" fill="#000000" stroke="#000000" stroke-width="0.4pt" transform="translate(0,273.95) matrix(1 0 0 -1 0 0)"><g style="--ltx-fill-color:#4285F4;" fill="#4285F4" fill-opacity="1.0"><path style="stroke:none" d="M 0 7.5 L 0 266.44 C 0 270.59 3.36 273.95 7.5 273.95 L 469.87 273.95 C 474.02 273.95 477.38 270.59 477.38 266.44 L 477.38 7.5 C 477.38 3.36 474.02 0 469.87 0 L 7.5 0 C 3.36 0 0 3.36 0 7.5 Z" /></g><g style="--ltx-fill-color:#F5F5F5;" fill="#F5F5F5" fill-opacity="1.0"><path style="stroke:none" d="M 1.97 7.5 L 1.97 235.57 L 475.41 235.57 L 475.41 7.5 C 475.41 4.45 472.93 1.97 469.87 1.97 L 7.5 1.97 C 4.45 1.97 1.97 4.45 1.97 7.5 Z" /></g><g fill-opacity="1.0" transform="matrix(1.0 0.0 0.0 1.0 20.48 243)"><foreignobject style="--ltx-fo-width:27.43em;--ltx-fo-height:1.89em;--ltx-fo-depth:0.19em;font-size:10pt;" height="28.9" overflow="visible" transform="matrix(1 0 0 -1 0 26.21)" width="379.55"><span class="ltx_foreignobject_container"><span class="ltx_foreignobject_content">
<span id="S15.SS0.SSS0.Px4.p3.pic1.1" class="ltx_inline-block ltx_minipage ltx_align_bottom" style="width:27.43em;">
<span id="S15.SS0.SSS0.Px4.p3.pic1.1.1" class="ltx_p"><span id="S15.SS0.SSS0.Px4.p3.pic1.1.1.1" class="ltx_text" style="position:relative; bottom:0.9pt;"></span><a href="https://codeforces.com/blog/entry/132373" title class="ltx_ref ltx_href ltx_font_bold" style="--ltx-fg-color:#FFFFFF;">Tutorial</a><span id="S15.SS0.SSS0.Px4.p3.pic1.1.1.2" class="ltx_text ltx_font_bold" style="--ltx-fg-color:#FFFFFF;"> — <a href="https://codeforces.com/problemset/submission/1999/274808130" title class="ltx_ref ltx_href">Human’s accepted submission</a> — <a href="https://gist.github.com/anonymous-llm-code/463d443ddadd2198c61491b3eb6d58d3" title class="ltx_ref ltx_href"><span class="ltx_text ltx_font_typewriter">Claude 3.5 Sonnet</span>’s rejected submission</a></span></span>
</span></span></span></foreignobject></g><g fill-opacity="1.0" transform="matrix(1.0 0.0 0.0 1.0 20.48 16.07)"><foreignobject style="--ltx-fo-width:31.54em;--ltx-fo-height:15.09em;--ltx-fo-depth:0.25em;font-size:10pt;" height="212.32" overflow="visible" transform="matrix(1 0 0 -1 0 208.86)" width="436.42"><span class="ltx_foreignobject_container"><span class="ltx_foreignobject_content">
<span id="S15.SS0.SSS0.Px4.p3.pic1.2" class="ltx_inline-block ltx_minipage ltx_align_bottom" style="width:31.54em;">
<span id="S15.SS0.SSS0.Px4.p3.pic1.2.1" class="ltx_p"><span id="S15.SS0.SSS0.Px4.p3.pic1.2.1.1" class="ltx_text" style="--ltx-fg-color:#000000;">Say the array has <math id="S15.SS0.SSS0.Px4.p3.pic1.m1" class="ltx_Math" alttext="x" display="inline" intent=":literal"><semantics><mi style="--ltx-fg-color:#000000;" mathcolor="#000000">x</mi><annotation encoding="application/x-tex">x</annotation></semantics></math> ones and <math id="S15.SS0.SSS0.Px4.p3.pic1.m2" class="ltx_Math" alttext="y" display="inline" intent=":literal"><semantics><mi style="--ltx-fg-color:#000000;" mathcolor="#000000">y</mi><annotation encoding="application/x-tex">y</annotation></semantics></math> zeroes.

<br class="ltx_break">
<br class="ltx_break">If the median of a subsequence of length <math id="S15.SS0.SSS0.Px4.p3.pic1.m3" class="ltx_Math" alttext="k" display="inline" intent=":literal"><semantics><mi style="--ltx-fg-color:#000000;" mathcolor="#000000">k</mi><annotation encoding="application/x-tex">k</annotation></semantics></math> is <math id="S15.SS0.SSS0.Px4.p3.pic1.m4" class="ltx_Math" alttext="1" display="inline" intent=":literal"><semantics><mn style="--ltx-fg-color:#000000;" mathcolor="#000000">1</mn><annotation encoding="application/x-tex">1</annotation></semantics></math>, then there are at least <math id="S15.SS0.SSS0.Px4.p3.pic1.m5" class="ltx_Math" alttext="\left\lfloor\frac{k}{2}\right\rfloor+1" display="inline" intent=":literal"><semantics><mrow><mrow><mo style="--ltx-fg-color:#000000;" mathcolor="#000000">⌊</mo><mfrac style="--ltx-fg-color:#000000;" mathcolor="#000000"><mi style="--ltx-fg-color:#000000;" mathcolor="#000000">k</mi><mn style="--ltx-fg-color:#000000;" mathcolor="#000000">2</mn></mfrac><mo style="--ltx-fg-color:#000000;" mathcolor="#000000">⌋</mo></mrow><mo style="--ltx-fg-color:#000000;" mathcolor="#000000">+</mo><mn style="--ltx-fg-color:#000000;" mathcolor="#000000">1</mn></mrow><annotation encoding="application/x-tex">\left\lfloor\frac{k}{2}\right\rfloor+1</annotation></semantics></math> ones in the array.

<br class="ltx_break">
<br class="ltx_break">Let’s iterate over the number of ones in the subsequence from <math id="S15.SS0.SSS0.Px4.p3.pic1.m6" class="ltx_Math" alttext="\left\lfloor\frac{k}{2}\right\rfloor+1" display="inline" intent=":literal"><semantics><mrow><mrow><mo style="--ltx-fg-color:#000000;" mathcolor="#000000">⌊</mo><mfrac style="--ltx-fg-color:#000000;" mathcolor="#000000"><mi style="--ltx-fg-color:#000000;" mathcolor="#000000">k</mi><mn style="--ltx-fg-color:#000000;" mathcolor="#000000">2</mn></mfrac><mo style="--ltx-fg-color:#000000;" mathcolor="#000000">⌋</mo></mrow><mo style="--ltx-fg-color:#000000;" mathcolor="#000000">+</mo><mn style="--ltx-fg-color:#000000;" mathcolor="#000000">1</mn></mrow><annotation encoding="application/x-tex">\left\lfloor\frac{k}{2}\right\rfloor+1</annotation></semantics></math> to <math id="S15.SS0.SSS0.Px4.p3.pic1.m7" class="ltx_Math" alttext="x" display="inline" intent=":literal"><semantics><mi style="--ltx-fg-color:#000000;" mathcolor="#000000">x</mi><annotation encoding="application/x-tex">x</annotation></semantics></math>. Suppose there are <math id="S15.SS0.SSS0.Px4.p3.pic1.m8" class="ltx_Math" alttext="i" display="inline" intent=":literal"><semantics><mi style="--ltx-fg-color:#000000;" mathcolor="#000000">i</mi><annotation encoding="application/x-tex">i</annotation></semantics></math> ones. Then there are <math id="S15.SS0.SSS0.Px4.p3.pic1.m9" class="ltx_Math" alttext="k-i" display="inline" intent=":literal"><semantics><mrow><mi style="--ltx-fg-color:#000000;" mathcolor="#000000">k</mi><mo style="--ltx-fg-color:#000000;" mathcolor="#000000">−</mo><mi style="--ltx-fg-color:#000000;" mathcolor="#000000">i</mi></mrow><annotation encoding="application/x-tex">k-i</annotation></semantics></math> zeroes.
The number of ways to choose <math id="S15.SS0.SSS0.Px4.p3.pic1.m10" class="ltx_Math" alttext="i" display="inline" intent=":literal"><semantics><mi style="--ltx-fg-color:#000000;" mathcolor="#000000">i</mi><annotation encoding="application/x-tex">i</annotation></semantics></math> ones from <math id="S15.SS0.SSS0.Px4.p3.pic1.m11" class="ltx_Math" alttext="x" display="inline" intent=":literal"><semantics><mi style="--ltx-fg-color:#000000;" mathcolor="#000000">x</mi><annotation encoding="application/x-tex">x</annotation></semantics></math> is <math id="S15.SS0.SSS0.Px4.p3.pic1.m12" class="ltx_Math" alttext="\binom{x}{i}" display="inline" intent=":literal"><semantics><mrow><mo style="--ltx-fg-color:#000000;" mathcolor="#000000">(</mo><mfrac style="--ltx-fg-color:#000000;" linethickness="0pt" mathcolor="#000000"><mi style="--ltx-fg-color:#000000;" mathcolor="#000000">x</mi><mi style="--ltx-fg-color:#000000;" mathcolor="#000000">i</mi></mfrac><mo style="--ltx-fg-color:#000000;" mathcolor="#000000">)</mo></mrow><annotation encoding="application/x-tex">\binom{x}{i}</annotation></semantics></math>, that is, <math id="S15.SS0.SSS0.Px4.p3.pic1.m13" class="ltx_Math" alttext="x" display="inline" intent=":literal"><semantics><mi style="--ltx-fg-color:#000000;" mathcolor="#000000">x</mi><annotation encoding="application/x-tex">x</annotation></semantics></math> choose <math id="S15.SS0.SSS0.Px4.p3.pic1.m14" class="ltx_Math" alttext="i" display="inline" intent=":literal"><semantics><mi style="--ltx-fg-color:#000000;" mathcolor="#000000">i</mi><annotation encoding="application/x-tex">i</annotation></semantics></math> (this is the so-called binomial coefficient).
Similarly, the number of ways to choose <math id="S15.SS0.SSS0.Px4.p3.pic1.m15" class="ltx_Math" alttext="k-i" display="inline" intent=":literal"><semantics><mrow><mi style="--ltx-fg-color:#000000;" mathcolor="#000000">k</mi><mo style="--ltx-fg-color:#000000;" mathcolor="#000000">−</mo><mi style="--ltx-fg-color:#000000;" mathcolor="#000000">i</mi></mrow><annotation encoding="application/x-tex">k-i</annotation></semantics></math> zeroes from <math id="S15.SS0.SSS0.Px4.p3.pic1.m16" class="ltx_Math" alttext="y" display="inline" intent=":literal"><semantics><mi style="--ltx-fg-color:#000000;" mathcolor="#000000">y</mi><annotation encoding="application/x-tex">y</annotation></semantics></math> of them is <math id="S15.SS0.SSS0.Px4.p3.pic1.m17" class="ltx_Math" alttext="\binom{y}{k-i}" display="inline" intent=":literal"><semantics><mrow><mo style="--ltx-fg-color:#000000;" mathcolor="#000000">(</mo><mfrac style="--ltx-fg-color:#000000;" linethickness="0pt" mathcolor="#000000"><mi style="--ltx-fg-color:#000000;" mathcolor="#000000">y</mi><mrow><mi style="--ltx-fg-color:#000000;" mathcolor="#000000">k</mi><mo style="--ltx-fg-color:#000000;" mathcolor="#000000">−</mo><mi style="--ltx-fg-color:#000000;" mathcolor="#000000">i</mi></mrow></mfrac><mo style="--ltx-fg-color:#000000;" mathcolor="#000000">)</mo></mrow><annotation encoding="application/x-tex">\binom{y}{k-i}</annotation></semantics></math>.

<br class="ltx_break">
<br class="ltx_break">Therefore the answer is the sum of <math id="S15.SS0.SSS0.Px4.p3.pic1.m18" class="ltx_Math" alttext="\binom{x}{i}\binom{y}{k-i}" display="inline" intent=":literal"><semantics><mrow><mrow><mo style="--ltx-fg-color:#000000;" mathcolor="#000000">(</mo><mfrac style="--ltx-fg-color:#000000;" linethickness="0pt" mathcolor="#000000"><mi style="--ltx-fg-color:#000000;" mathcolor="#000000">x</mi><mi style="--ltx-fg-color:#000000;" mathcolor="#000000">i</mi></mfrac><mo style="--ltx-fg-color:#000000;" mathcolor="#000000">)</mo></mrow><mo lspace="0em" rspace="0em">​</mo><mrow><mo style="--ltx-fg-color:#000000;" mathcolor="#000000">(</mo><mfrac style="--ltx-fg-color:#000000;" linethickness="0pt" mathcolor="#000000"><mi style="--ltx-fg-color:#000000;" mathcolor="#000000">y</mi><mrow><mi style="--ltx-fg-color:#000000;" mathcolor="#000000">k</mi><mo style="--ltx-fg-color:#000000;" mathcolor="#000000">−</mo><mi style="--ltx-fg-color:#000000;" mathcolor="#000000">i</mi></mrow></mfrac><mo style="--ltx-fg-color:#000000;" mathcolor="#000000">)</mo></mrow></mrow><annotation encoding="application/x-tex">\binom{x}{i}\binom{y}{k-i}</annotation></semantics></math> over all <math id="S15.SS0.SSS0.Px4.p3.pic1.m19" class="ltx_Math" alttext="i" display="inline" intent=":literal"><semantics><mi style="--ltx-fg-color:#000000;" mathcolor="#000000">i</mi><annotation encoding="application/x-tex">i</annotation></semantics></math> from <math id="S15.SS0.SSS0.Px4.p3.pic1.m20" class="ltx_Math" alttext="\left\lfloor\frac{k}{2}\right\rfloor+1" display="inline" intent=":literal"><semantics><mrow><mrow><mo style="--ltx-fg-color:#000000;" mathcolor="#000000">⌊</mo><mfrac style="--ltx-fg-color:#000000;" mathcolor="#000000"><mi style="--ltx-fg-color:#000000;" mathcolor="#000000">k</mi><mn style="--ltx-fg-color:#000000;" mathcolor="#000000">2</mn></mfrac><mo style="--ltx-fg-color:#000000;" mathcolor="#000000">⌋</mo></mrow><mo style="--ltx-fg-color:#000000;" mathcolor="#000000">+</mo><mn style="--ltx-fg-color:#000000;" mathcolor="#000000">1</mn></mrow><annotation encoding="application/x-tex">\left\lfloor\frac{k}{2}\right\rfloor+1</annotation></semantics></math> to <math id="S15.SS0.SSS0.Px4.p3.pic1.m21" class="ltx_Math" alttext="x" display="inline" intent=":literal"><semantics><mi style="--ltx-fg-color:#000000;" mathcolor="#000000">x</mi><annotation encoding="application/x-tex">x</annotation></semantics></math>.
You can compute binomial coefficients in many ways, for example precomputing all factorials and then using the formula <math id="S15.SS0.SSS0.Px4.p3.pic1.m22" class="ltx_Math" alttext="\binom{n}{k}=\frac{n!}{(n-k)!k!}" display="inline" intent=":literal"><semantics><mrow><mrow><mo style="--ltx-fg-color:#000000;" mathcolor="#000000">(</mo><mfrac style="--ltx-fg-color:#000000;" linethickness="0pt" mathcolor="#000000"><mi style="--ltx-fg-color:#000000;" mathcolor="#000000">n</mi><mi style="--ltx-fg-color:#000000;" mathcolor="#000000">k</mi></mfrac><mo style="--ltx-fg-color:#000000;" mathcolor="#000000">)</mo></mrow><mo style="--ltx-fg-color:#000000;" mathcolor="#000000">=</mo><mfrac style="--ltx-fg-color:#000000;" mathcolor="#000000"><mrow><mi style="--ltx-fg-color:#000000;" mathcolor="#000000">n</mi><mo style="--ltx-fg-color:#000000;" mathcolor="#000000">!</mo></mrow><mrow><mrow><mrow><mrow><mo style="--ltx-fg-color:#000000;" mathcolor="#000000" stretchy="false">(</mo><mrow><mi style="--ltx-fg-color:#000000;" mathcolor="#000000">n</mi><mo style="--ltx-fg-color:#000000;" mathcolor="#000000">−</mo><mi style="--ltx-fg-color:#000000;" mathcolor="#000000">k</mi></mrow><mo style="--ltx-fg-color:#000000;" mathcolor="#000000" stretchy="false">)</mo></mrow><mo style="--ltx-fg-color:#000000;" mathcolor="#000000">!</mo></mrow><mo lspace="0em" rspace="0em">​</mo><mi style="--ltx-fg-color:#000000;" mathcolor="#000000">k</mi></mrow><mo style="--ltx-fg-color:#000000;" mathcolor="#000000">!</mo></mrow></mfrac></mrow><annotation encoding="application/x-tex">\binom{n}{k}=\frac{n!}{(n-k)!k!}</annotation></semantics></math>. Depending on your implementation, it can take <math id="S15.SS0.SSS0.Px4.p3.pic1.m23" class="ltx_Math" alttext="\mathcal{O}(n\log\text{MOD})" display="inline" intent=":literal"><semantics><mrow><mi style="--ltx-fg-color:#000000;" class="ltx_font_mathcaligraphic" mathcolor="#000000">𝒪</mi><mo>⁡</mo><mrow><mo style="--ltx-fg-color:#000000;" mathcolor="#000000" stretchy="false">(</mo><mrow><mi style="--ltx-fg-color:#000000;" mathcolor="#000000">n</mi><mo lspace="0.167em" rspace="0em">​</mo><mrow><mi style="--ltx-fg-color:#000000;" mathcolor="#000000">log</mi><mo lspace="0.167em">⁡</mo><mtext style="--ltx-fg-color:#000000;" mathcolor="#000000">MOD</mtext></mrow></mrow><mo style="--ltx-fg-color:#000000;" mathcolor="#000000" stretchy="false">)</mo></mrow></mrow><annotation encoding="application/x-tex">\mathcal{O}(n\log\text{MOD})</annotation></semantics></math> or <math id="S15.SS0.SSS0.Px4.p3.pic1.m24" class="ltx_Math" alttext="\mathcal{O}(n+\log\text{MOD})" display="inline" intent=":literal"><semantics><mrow><mi style="--ltx-fg-color:#000000;" class="ltx_font_mathcaligraphic" mathcolor="#000000">𝒪</mi><mo>⁡</mo><mrow><mo style="--ltx-fg-color:#000000;" mathcolor="#000000" stretchy="false">(</mo><mrow><mi style="--ltx-fg-color:#000000;" mathcolor="#000000">n</mi><mo style="--ltx-fg-color:#000000;" mathcolor="#000000">+</mo><mrow><mi style="--ltx-fg-color:#000000;" mathcolor="#000000">log</mi><mo lspace="0.167em">⁡</mo><mtext style="--ltx-fg-color:#000000;" mathcolor="#000000">MOD</mtext></mrow></mrow><mo style="--ltx-fg-color:#000000;" mathcolor="#000000" stretchy="false">)</mo></mrow></mrow><annotation encoding="application/x-tex">\mathcal{O}(n+\log\text{MOD})</annotation></semantics></math> time.</span></span>
</span></span></span></foreignobject></g></g></svg>