<span id="A2.SS3.SSS0.Px1.p2.pic1.p1.1" class="ltx_p">Extract PICO elements from this biomedical text. Identify Population (P), Intervention (I), Comparison (C), and Outcome (O) components mentioned in the study. Output should be a JSON object with keys &quot;P&quot;, &quot;I&quot;, &quot;C&quot;, and &quot;O&quot;, where values are arrays of strings. Each string should be a verbatim copy of the relevant text from the original document. Keep each string as short as possible, containing only the topic words. Avoid including all connectors and other words that are not part of the topic. Numbers should be separated from the following words they refer to.</span>
