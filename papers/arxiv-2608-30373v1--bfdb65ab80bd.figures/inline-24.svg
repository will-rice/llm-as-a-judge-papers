<span id="A1.SS4.p6.pic1.p1.1" class="ltx_p">[Role]</span>
</span></span></span></span>
<span id="A1.SS4.p6.pic1.2.2" class="ltx_p" style="width:459.7pt;"><span id="A1.SS4.p6.pic1.2.2.1" class="ltx_text ltx_verbatim ltx_font_typewriter ltx_inline-block" style="width:459.7pt;--ltx-fg-color:#000000;"><span id="A1.SS4.p6.pic1.2.2.1.1" class="ltx_text ltx_inline-block" style="width:0.0pt;"> </span><span id="A1.SS4.p6.pic1.2.2.1.2" class="ltx_inline-logical-block ltx_parbox ltx_align_top" style="width:459.7pt;">
<span id="A1.SS4.p6.pic1.p2" class="ltx_para ltx_noindent">
<span id="A1.SS4.p6.pic1.p2.1" class="ltx_p">You are the lenient evaluator revisiting your scores after seeing the strict evaluator’s assessment.</span>
</span></span></span></span>
<span id="A1.SS4.p6.pic1.2.3" class="ltx_p" style="width:459.7pt;"><span id="A1.SS4.p6.pic1.2.3.1" class="ltx_text ltx_verbatim ltx_font_typewriter ltx_inline-block" style="width:459.7pt;--ltx-fg-color:#000000;"><span id="A1.SS4.p6.pic1.2.3.1.1" class="ltx_inline-logical-block ltx_parbox ltx_pruned_first ltx_align_top" style="width:459.7pt;"></span></span></span>
