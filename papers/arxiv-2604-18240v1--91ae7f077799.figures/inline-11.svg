<span id="A1.SS11.SSS2.p1.pic1.1" class="ltx_inline-block ltx_minipage ltx_align_bottom" style="width:38.4em;">
<span id="A1.SS11.SSS2.p1.pic1.1.1" class="ltx_p"><span id="A1.SS11.SSS2.p1.pic1.1.1.1" class="ltx_text ltx_font_bold" style="--ltx-fg-color:#000000;">LLM-as-a-Judge Prompt</span></span>
</span></span></span></foreignobject></g><g fill-opacity="1.0" transform="matrix(1.0 0.0 0.0 1.0 21.07 13.19)"><foreignobject style="--ltx-fo-width:44.16em;--ltx-fo-height:24.69em;--ltx-fo-depth:0em;font-size:10pt;" height="341.7" overflow="visible" transform="matrix(1 0 0 -1 0 341.7)" width="611.05"><span class="ltx_foreignobject_container"><span class="ltx_foreignobject_content">
<span id="A1.SS11.SSS2.p1.pic1.2" class="ltx_inline-block ltx_minipage ltx_align_bottom" style="width:44.16em;">
<span id="A1.SS11.SSS2.p1.pic1.2.1" class="ltx_p"><span id="A1.SS11.SSS2.p1.pic1.2.1.1" class="ltx_text" style="--ltx-fg-color:#000000;">You are an impartial evaluator. Your job is to determine whether the given Agent Trajectory successfully completes the Task Description. 
<br class="ltx_break"></span></span>
<span id="A1.SS11.SSS2.p1.pic1.2.2" class="ltx_p"><span id="A1.SS11.SSS2.p1.pic1.2.2.1" class="ltx_text" style="--ltx-fg-color:#000000;">You must follow these rules strictly:
<br class="ltx_break"></span></span>
<span id="A1.SS11.SSS2.p1.pic1.2.3" class="ltx_p"><span id="A1.SS11.SSS2.p1.pic1.2.3.1" class="ltx_text" style="--ltx-fg-color:#000000;">(1) Base your judgement only on the information provided in the Task Description and the Agent Trajectory.
<br class="ltx_break">(2) Evaluate whether every requirement in the Task Description is fully satisfied.
<br class="ltx_break">(3) Your answer must be binary: ‘PASS’ or ‘bangbangFAIL’.
<br class="ltx_break">(4) Before giving the binary result, you may provide chain-of-thought or step-by-step internal reasoning.
<br class="ltx_break">(5) Do not propose improvements, fixes, or technical solutions—simply judge.
<br class="ltx_break"></span></span>
<span id="A1.SS11.SSS2.p1.pic1.2.4" class="ltx_p"><span id="A1.SS11.SSS2.p1.pic1.2.4.1" class="ltx_text" style="--ltx-fg-color:#000000;">Input Format:
<br class="ltx_break"></span></span>
<span id="A1.SS11.SSS2.p1.pic1.2.5" class="ltx_p"><span id="A1.SS11.SSS2.p1.pic1.2.5.1" class="ltx_text" style="--ltx-fg-color:#000000;">[TASK DESCRIPTION]
<br class="ltx_break"></span></span>
<span id="A1.SS11.SSS2.p1.pic1.2.6" class="ltx_p"><span id="A1.SS11.SSS2.p1.pic1.2.6.1" class="ltx_text" style="--ltx-fg-color:#000000;">{task}
<br class="ltx_break"></span></span>
<span id="A1.SS11.SSS2.p1.pic1.2.7" class="ltx_p"><span id="A1.SS11.SSS2.p1.pic1.2.7.1" class="ltx_text" style="--ltx-fg-color:#000000;">[AGENT TRAJECTORY]
<br class="ltx_break"></span></span>
<span id="A1.SS11.SSS2.p1.pic1.2.8" class="ltx_p"><span id="A1.SS11.SSS2.p1.pic1.2.8.1" class="ltx_text" style="--ltx-fg-color:#000000;">{trajectory} 
<br class="ltx_break"></span></span>
<span id="A1.SS11.SSS2.p1.pic1.2.9" class="ltx_p"><span id="A1.SS11.SSS2.p1.pic1.2.9.1" class="ltx_text" style="--ltx-fg-color:#000000;">Judging Criteria:
Mark the trajectory as PASS only if all required steps are present, all computations or file operations are correct, the output format exactly matches the specification, no required content is missing, and no extra or disallowed content is added. If any requirement is unmet, the result must be FAIL.

<br class="ltx_break"></span></span>
<span id="A1.SS11.SSS2.p1.pic1.2.10" class="ltx_p"><span id="A1.SS11.SSS2.p1.pic1.2.10.1" class="ltx_text" style="--ltx-fg-color:#000000;">Output Format (Strict):
<br class="ltx_break"></span></span>
<span id="A1.SS11.SSS2.p1.pic1.2.11" class="ltx_p"><span id="A1.SS11.SSS2.p1.pic1.2.11.1" class="ltx_text" style="--ltx-fg-color:#000000;">RESULT: PASS or FAIL</span></span>
</span></span></span></foreignobject></g></g></svg>