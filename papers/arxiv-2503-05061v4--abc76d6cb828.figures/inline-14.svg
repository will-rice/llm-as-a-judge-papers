<span id="A4.F8.pic4.1.2" class="ltx_p"><span id="A4.F8.pic4.1.2.1" class="ltx_text" style="--ltx-fg-color:#000000;">Since the RR class is no longer a factor, the Appraisal value is $550,750,000. Therefore, the Class A LTV is simply the Class A balance divided by the Appraisal value, or</span></span>
